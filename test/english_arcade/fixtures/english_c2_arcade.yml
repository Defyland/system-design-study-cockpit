version: 1
product:
  key: english_c2_arcade
  calibration: c2
  path_days: 30
  guarantee: false
  items_per_target: 12
  note: Scores describe practice evidence, not a CEFR certification.

feedback_template: &feedback
  register: Use a direct, interview-appropriate claim before the detail.
  hedging: Bound uncertain claims with would, might, or subject to the constraint.
  precision: Name the invariant, boundary, or trade-off that makes the answer testable.
  grammar: Keep tense, agreement, and clause ownership consistent under pressure.
  pragmatics: Answer the question first, then invite the next constraint or follow-up.

presentation:
  learner_fields: [prompt, context, distractors, feedback, rephrase, extension]
  reveal_fields: [answer, evidence]
  forbidden_learner_fields: [answer, correct_option, hidden_answer, solution]

state_machine:
  states: [idle, active_recall, feynman, black_box, feedback, scheduled, reattempt, mastered]
  transitions:
    - [idle, active_recall]
    - [active_recall, feynman]
    - [feynman, feedback]
    - [feedback, scheduled]
    - [feedback, black_box]
    - [black_box, scheduled]
    - [scheduled, reattempt]
    - [reattempt, feynman]
    - [reattempt, mastered]
  terminal_states: [mastered]
  forbidden_transitions:
    - [idle, mastered]
    - [active_recall, mastered]
    - [feedback, mastered]

targets:
  - key: dsa
    label: DSA and algorithms
    modes: [short_drill, timed_simulation]
    timed_minutes: 45
    source:
      repository: english-arcade
      path: packs/dsa.yml
      attribution: English C2 Arcade original interview pack.
    corpus_links:
      - repository: system-design-estudos
        path: areas/01-metodo-e-entrevistas/examples/interview-walkthrough-marketplace-search.md
    items:
      - { id: dsa-01, prompt: What invariant would you state before coding a sliding-window solution?, context: The interviewer wants a linear scan and asks how you will know the window remains valid., answer: Every retained window satisfies the constraint, distractors: [I would sort first because sorting is usually safer., I would optimize after writing whichever loop feels shortest.], feedback: *feedback, rephrase: Rephrase the claim with one explicit bound., extension: Add the condition that forces the left edge to move., source_ref: pack }
      - { id: dsa-02, prompt: How would you compare a hash lookup with a balanced search tree?, context: A teammate proposes a hash table while the interviewer emphasizes ordered iteration., answer: Hashing favors expected lookup while a tree preserves order, distractors: [Hashing is always constant time in every workload., Trees remove the need to discuss memory.], feedback: *feedback, rephrase: Rephrase with an expected-versus-worst-case hedge., extension: State one reason collisions or rotations matter., source_ref: pack }
      - { id: dsa-03, prompt: What should a recursive graph traversal record to avoid repeated work?, context: The graph contains cycles and two paths can reach the same vertex., answer: Record discovery state so each vertex is expanded once, distractors: [Restart the traversal whenever a cycle appears., Visit every edge twice to be conservative.], feedback: *feedback, rephrase: Make the explanation concise enough for a follow-up., extension: Distinguish visited from currently exploring., source_ref: pack }
      - { id: dsa-04, prompt: How do you explain the complexity of a heap-based top-k routine?, context: You keep only k candidates while scanning n values., answer: The scan is linear and each retained update costs logarithmic k, distractors: [The complexity is constant because the heap stays small., The routine is quadratic because every value is compared with every other.], feedback: *feedback, rephrase: State the bound using n and k., extension: Explain when a full sort is simpler., source_ref: pack }
      - { id: dsa-05, prompt: What makes a dynamic-programming state sufficient?, context: Two prefixes reach the same remainder with different histories., answer: The state preserves every fact needed for the optimal suffix, distractors: [Keep the entire call stack so no information is lost., Use the most recent value because older values cannot matter.], feedback: *feedback, rephrase: Add a sentence about overlapping subproblems., extension: Give a counterexample to an underspecified state., source_ref: pack }
      - { id: dsa-06, prompt: When would you choose two pointers over a binary search?, context: The input is sorted and the predicate depends on a pair at opposite ends., answer: Two pointers exploit monotonic movement across the sorted pair, distractors: [Binary search is required whenever an input is sorted., Two pointers are only for linked lists.], feedback: *feedback, rephrase: Hedge the choice around the predicate shape., extension: State what breaks the monotonicity., source_ref: pack }
      - { id: dsa-07, prompt: How would you handle a Ruby enumerable that materializes too much data?, context: A production job maps millions of rows before filtering them., answer: Stream the relation and filter before materializing results, distractors: [Call to_a early so Ruby can optimize the whole collection., Add threads without measuring allocation pressure.], feedback: *feedback, rephrase: Mention the memory consequence explicitly., extension: Add the database-side alternative., source_ref: pack }
      - { id: dsa-08, prompt: What would you test at the boundary of a parser for nested tokens?, context: The parser accepts empty input, malformed nesting, and a valid deep example., answer: Test empty, malformed, and valid boundary shapes separately, distractors: [Test one happy path because parser branches are obvious., Generate random strings and ignore reproducible cases.], feedback: *feedback, rephrase: Use a three-part test strategy., extension: Name the failure signal an interviewer can inspect., source_ref: pack }
      - { id: dsa-09, prompt: How would you preserve a shortest-path invariant when edge weights change?, context: A cached route becomes stale after one edge receives a new nonnegative cost., answer: Recompute affected distances under the new edge costs, distractors: [Keep the old path because one edge cannot matter globally., Replace every weight with one to simplify the proof.], feedback: *feedback, rephrase: State the nonnegative-weight assumption., extension: Explain when a priority queue is sufficient., source_ref: pack }
      - { id: dsa-10, prompt: What boundary case distinguishes a stable sort from an arbitrary sort?, context: Equal keys carry an earlier timestamp that downstream code still needs., answer: A stable sort preserves relative order among equal keys, distractors: [A stable sort always uses less memory., Equal keys are reordered to improve cache locality.], feedback: *feedback, rephrase: Give a minimal counterexample., extension: Explain why the timestamp belongs in the test., source_ref: pack }
      - { id: dsa-11, prompt: How would you avoid integer overflow in a midpoint calculation?, context: Two indices can approach the maximum representable value in a large search space., answer: Compute the midpoint from the lower index plus half the distance, distractors: [Add both indices and divide because overflow is theoretical., Cast to a string before doing arithmetic.], feedback: *feedback, rephrase: Name the arithmetic invariant., extension: Add the language-specific type check., source_ref: pack }
      - { id: dsa-12, prompt: What makes a randomized test useful rather than merely noisy?, context: A seeded generator exercises many input shapes and must reproduce a failure., answer: Seeded cases explore variation while preserving a replayable failure, distractors: [Use a new random seed every run and discard failures., Random tests replace assertions with probability.], feedback: *feedback, rephrase: Add the shrink or replay step., extension: Explain what remains covered by examples., source_ref: pack }

  - key: ruby
    label: Ruby
    modes: [short_drill]
    source:
      repository: english-arcade
      path: packs/ruby.yml
      attribution: English C2 Arcade original interview pack.
    items:
      - { id: ruby-01, prompt: How would you explain Ruby's object model without oversimplifying classes?, context: The interviewer asks whether a class is itself an object., answer: Classes are objects that describe how instances behave, distractors: [Classes are outside the object model and cannot receive messages., Every object must have exactly one primitive type.], feedback: *feedback, rephrase: Add one precise example without changing the claim., extension: Contrast a class method with an instance method., source_ref: pack }
      - { id: ruby-02, prompt: When is a block preferable to returning an intermediate collection?, context: A caller needs one pass over records and should control resource cleanup., answer: A block can scope iteration and cleanup to one traversal, distractors: [Blocks always run in parallel so they are faster., A block makes every allocation disappear.], feedback: *feedback, rephrase: Explain the lifecycle benefit., extension: Mention Enumerator when the caller needs laziness., source_ref: pack }
      - { id: ruby-03, prompt: What is the performance risk of chaining eager enumerable calls?, context: The code maps, selects, and maps again over a large input., answer: Each eager stage can allocate another collection, distractors: [Chaining always fuses into one loop in Ruby., Eager calls use no memory because values are references.], feedback: *feedback, rephrase: Replace the risk with a measurable observation., extension: Offer a lazy alternative., source_ref: pack }
      - { id: ruby-04, prompt: How would you make a Ruby error boundary communicate intent?, context: A client error is recoverable but a programming invariant must surface., answer: Rescue the narrow recoverable error and re-raise unexpected failures, distractors: [Rescue StandardError everywhere and return nil., Rescue Exception so the process never exits.], feedback: *feedback, rephrase: Add a sentence about observability., extension: Name the context that belongs in structured logs., source_ref: pack }
      - { id: ruby-05, prompt: What does immutability buy a value object in a concurrent service?, context: Several threads share a currency amount and should not observe partial updates., answer: Immutable values can be shared without coordination around mutation, distractors: [Immutability guarantees the network call is idempotent., Immutable objects cannot be garbage-collected.], feedback: *feedback, rephrase: Qualify the claim with the remaining shared state., extension: Explain how to replace a value safely., source_ref: pack }
      - { id: ruby-06, prompt: How would you decide between a module mixin and composition?, context: Two classes share behavior but their future responsibilities are diverging., answer: Composition keeps the dependency explicit when behavior is not intrinsic, distractors: [Mixins are always more testable than objects., Composition means duplicating every method.], feedback: *feedback, rephrase: Tie the choice to change boundaries., extension: Give one seam for a focused test., source_ref: pack }
      - { id: ruby-07, prompt: What evidence would justify replacing a Ruby loop with native SQL?, context: A report spends most of its time filtering rows that the database can index., answer: A measured query plan can justify pushing selective work to the database, distractors: [SQL is always faster because the database is written in C., Move all business rules into SQL before profiling.], feedback: *feedback, rephrase: State the evidence before the recommendation., extension: Mention correctness checks for nulls and time zones., source_ref: pack }
      - { id: ruby-08, prompt: How do you keep an API's keyword arguments compatible across releases?, context: Existing callers pass named options while a new optional behavior is added., answer: Add optional keywords with an explicit default and preserve old calls, distractors: [Rename every keyword to force callers to upgrade., Accept a hash and silently ignore unknown keys.], feedback: *feedback, rephrase: Add a migration-safe warning., extension: Explain how tests prove old callers still work., source_ref: pack }
      - { id: ruby-09, prompt: How would you distinguish a nil result from a missing key in Ruby?, context: A configuration hash may intentionally store nil and must still report presence., answer: Check key presence separately from the value returned, distractors: [Use fetch with no default for every optional value., Treat nil as proof that the key was absent.], feedback: *feedback, rephrase: Add the failure behavior for a required key., extension: Mention a safe default only when it is semantic., source_ref: pack }
      - { id: ruby-10, prompt: What makes a Ruby comparison method safe for sorting?, context: Values can be incomparable and the collection must not silently reorder them., answer: Return a consistent ordering or reject incomparable values explicitly, distractors: [Return true for every pair so sorting can continue., Convert values to strings and call it deterministic.], feedback: *feedback, rephrase: Name the comparator contract., extension: Add one property-based check., source_ref: pack }
      - { id: ruby-11, prompt: How would you prevent a mutable default from leaking between calls?, context: A method accumulates options and a caller observes state from an earlier invocation., answer: Allocate per-call state instead of sharing a mutable default, distractors: [Freeze the hash and mutate it through another reference., Store the default in a constant so it is reused.], feedback: *feedback, rephrase: Describe the ownership boundary., extension: Mention duplication versus construction., source_ref: pack }
      - { id: ruby-12, prompt: What should a Ruby benchmark control before comparing implementations?, context: A microbenchmark gives opposite rankings on a cold process and a warm process., answer: Control input, warm-up, allocations, and repeatability before comparing, distractors: [Run each implementation once and trust wall time., Benchmark different inputs because variety is fairer.], feedback: *feedback, rephrase: Add the noise source you would report., extension: Explain how a production trace complements it., source_ref: pack }

  - key: rails
    label: Ruby on Rails
    modes: [short_drill]
    source:
      repository: english-arcade
      path: packs/rails.yml
      attribution: English C2 Arcade original interview pack.
    items:
      - { id: rails-01, prompt: Walk through a Rails request from routing to a rendered response., context: The interviewer wants the useful boundaries rather than a framework recital., answer: Routing selects the controller action, which loads data and renders a view, distractors: [The browser executes the controller before the request reaches Rails., The model renders HTML and the controller only stores it.], feedback: *feedback, rephrase: Add one middleware or policy boundary., extension: Explain where authorization should be checked., source_ref: pack }
      - { id: rails-02, prompt: How would you remove an N+1 query from a collection page?, context: Logs show one query for posts followed by one author query per row., answer: Load the association needed by the view and verify the query count, distractors: [Cache every author forever without checking invalidation., Add a larger database and leave the access pattern unchanged.], feedback: *feedback, rephrase: State the proof you would collect., extension: Mention a counterexample involving conditional associations., source_ref: pack }
      - { id: rails-03, prompt: When does a database transaction belong around a service operation?, context: An order and its inventory reservation must not commit separately., answer: Use a transaction around the atomic state transition, distractors: [Wrap every HTTP request in one giant transaction., A transaction retries network calls safely by default.], feedback: *feedback, rephrase: Add the failure behavior after rollback., extension: Separate external side effects from the transaction., source_ref: pack }
      - { id: rails-04, prompt: How would you make a job safe to retry?, context: The queue may deliver a notification job twice after a timeout., answer: Give the operation an idempotency key and make the side effect repeat-safe, distractors: [Disable retries so duplicates cannot happen., Sleep before sending and assume the timeout was harmless.], feedback: *feedback, rephrase: Name the durable uniqueness boundary., extension: Explain how to reconcile a partial provider response., source_ref: pack }
      - { id: rails-05, prompt: What should a Rails cache key include for tenant-scoped data?, context: Two tenants request the same logical page with different permissions., answer: Include tenant and version inputs that affect the representation, distractors: [Use only the controller name so entries are shared., Include a user password to make the key unique.], feedback: *feedback, rephrase: Add the invalidation consequence., extension: Explain what happens after a permission change., source_ref: pack }
      - { id: rails-06, prompt: How do you defend a Rails form from cross-site request forgery?, context: A state-changing browser request accepts a session cookie., answer: Require a valid CSRF token and keep cookie policy aligned, distractors: [Escape the HTML and ignore request origin., Treat a POST as safe because browsers cannot replay it.], feedback: *feedback, rephrase: Separate CSRF from authentication., extension: State the API-client exception you would document., source_ref: pack }
      - { id: rails-07, prompt: What belongs in Rails observability for a slow endpoint?, context: A p95 regression appears only for one tenant and one query shape., answer: Correlate request, query, tenant-safe dimensions, and timing, distractors: [Log every payload including credentials for perfect detail., Record only total uptime because latency is a client concern.], feedback: *feedback, rephrase: Remove one unsafe logging detail., extension: Name a metric that distinguishes queue delay from SQL time., source_ref: pack }
      - { id: rails-08, prompt: How would you evolve a Rails schema without blocking old code?, context: A column rename must roll out across web and worker processes., answer: Add the new shape, dual-read or dual-write, backfill, then remove the old path, distractors: [Rename the column in one deploy and restart everything., Stop writes until every client upgrades together.], feedback: *feedback, rephrase: Make the rollout sequence explicit., extension: Add the rollback decision point., source_ref: pack }
      - { id: rails-09, prompt: How would you constrain a Rails query that accepts a user sort field?, context: The UI sends a sort choice and the value must not become raw SQL., answer: Map allowed sort keys to trusted column expressions, distractors: [Interpolate the parameter after escaping quotes., Accept any column name because the database rejects invalid SQL.], feedback: *feedback, rephrase: Add the invalid-key response., extension: Explain how a test proves the allowlist., source_ref: pack }
      - { id: rails-10, prompt: What should a Rails service return when a downstream write is ambiguous?, context: The provider times out after the database committed a local intent., answer: Persist an indeterminate state and reconcile by correlation key, distractors: [Mark failure immediately and let a retry create a second write., Treat a timeout as success without checking the provider.], feedback: *feedback, rephrase: State what the user can safely retry., extension: Name the operator signal., source_ref: pack }
      - { id: rails-11, prompt: How would you keep a migration reversible after a backfill starts?, context: A new nullable column is populated in batches while old workers still run., answer: Keep compatibility reads and record a bounded backfill checkpoint, distractors: [Drop the old column as soon as the first batch succeeds., Run an unbounded migration in the web request.], feedback: *feedback, rephrase: Add the stop and resume rule., extension: Explain the deploy that removes compatibility., source_ref: pack }
      - { id: rails-12, prompt: What belongs in a Rails authorization test for a multi-tenant record?, context: A valid user can access one tenant but must not infer another tenant's identifier., answer: Assert both permitted access and denied cross-tenant lookup, distractors: [Test only the happy path because scopes are shared., Return not found for every error and skip the policy test.], feedback: *feedback, rephrase: Include the enumeration-risk check., extension: Add an audit event without sensitive payloads., source_ref: pack }

  - key: react
    label: React
    modes: [short_drill]
    source:
      repository: english-arcade
      path: packs/react.yml
      attribution: English C2 Arcade original interview pack.
    items:
      - { id: react-01, prompt: What makes a React key stable for a list item?, context: Items can be inserted at the front and reordered after a fetch., answer: Use an identity that belongs to the item across renders, distractors: [Use the current array index because it is always unique., Generate a random key on every render to force freshness.], feedback: *feedback, rephrase: Explain the state-preservation consequence., extension: Name the case where an index can be acceptable., source_ref: pack }
      - { id: react-02, prompt: When should an effect synchronize with an external system?, context: A component derives a filtered label from props without network or DOM work., answer: Effects are for synchronization, not ordinary render-time derivation, distractors: [Put every calculation in an effect to avoid rendering., Use an effect because all state must be asynchronous.], feedback: *feedback, rephrase: Replace the rule with a concrete example., extension: Name the dependency that must be honest., source_ref: pack }
      - { id: react-03, prompt: How would you avoid a stale closure in an event handler?, context: A delayed callback reads a value that can change before the timer fires., answer: Use a functional update or a ref when the latest value is required, distractors: [Disable exhaustive-deps so the closure stops changing., Copy the value into a module global.], feedback: *feedback, rephrase: State which choice preserves event ordering., extension: Add the cleanup for the timer., source_ref: pack }
      - { id: react-04, prompt: What belongs in a data-fetching loading state?, context: A request can be superseded, fail, or return after the user changes filters., answer: Track request identity and expose loading, error, empty, and data states, distractors: [Show a spinner forever until the newest response arrives., Render the oldest response because it is already cached.], feedback: *feedback, rephrase: Add the stale-response guard., extension: Explain cancellation versus ignoring a late result., source_ref: pack }
      - { id: react-05, prompt: How would you make a custom control usable by keyboard users?, context: A visual div currently behaves like a button only after a pointer click., answer: Use a native button or reproduce its focus and keyboard semantics, distractors: [Add a cursor pointer and call it accessible., Hide focus outlines so the design stays clean.], feedback: *feedback, rephrase: Name the activation keys and focus signal., extension: Add the screen-reader name., source_ref: pack }
      - { id: react-06, prompt: What evidence supports memoizing a React subtree?, context: A profiling trace shows an expensive child rerendering for unrelated parent state., answer: Profiled render cost and stable inputs justify a targeted memo boundary, distractors: [Memoize every component before measuring anything., Memoization guarantees faster network requests.], feedback: *feedback, rephrase: State the invalidation cost., extension: Explain how unstable props defeat the boundary., source_ref: pack }
      - { id: react-07, prompt: How would you preserve optimistic UI correctness after a failed mutation?, context: Two edits overlap and the server rejects the second one., answer: Keep a reversible local change and reconcile against the authoritative response, distractors: [Assume the optimistic state is authoritative forever., Reload the page after every click and ignore ordering.], feedback: *feedback, rephrase: Mention the version or request identity., extension: Add the user-facing recovery copy., source_ref: pack }
      - { id: react-08, prompt: What is the accessibility risk of a focus trap in a modal?, context: The modal closes asynchronously and focus can disappear from the document., answer: Restore focus to the invoking control when the modal lifecycle ends, distractors: [Move focus to the browser chrome so it cannot be lost., Remove all focus management because users can click away.], feedback: *feedback, rephrase: Explain the escape path., extension: Name the aria relationship the dialog needs., source_ref: pack }
      - { id: react-09, prompt: How would you prevent a controlled input from losing text during a transition?, context: A filter update suspends while the user is still typing in the same field., answer: Keep input state immediate and transition only the expensive result, distractors: [Put the input value in the transition so keystrokes can wait., Remount the field on each filter to reset stale state.], feedback: *feedback, rephrase: Name the user-perceived latency boundary., extension: Explain how to test rapid typing., source_ref: pack }
      - { id: react-10, prompt: What does a React error boundary protect and what does it not?, context: A child render throws but a failed network request returns a rejected promise., answer: It catches render-time subtree errors, not arbitrary async failures, distractors: [It catches every promise rejection anywhere in the app., It replaces server monitoring because the UI has a fallback.], feedback: *feedback, rephrase: Add the async error path., extension: State how the fallback preserves recovery., source_ref: pack }
      - { id: react-11, prompt: How would you keep derived state from drifting from its source props?, context: A component copies a label into state and the parent later changes the label., answer: Derive the label during render unless it is an intentional draft, distractors: [Copy every prop into state so the component owns it., Synchronize with an effect after every render.], feedback: *feedback, rephrase: Distinguish draft state from a projection., extension: Add the reset event for a draft., source_ref: pack }
      - { id: react-12, prompt: What should a React test assert for a retry button after a failed fetch?, context: The first request fails and the second succeeds without a full page reload., answer: Assert the error affordance, retry action, and recovered content, distractors: [Assert an internal hook call because markup can change., Reload the browser and assume the request happened.], feedback: *feedback, rephrase: Include the accessible name., extension: Explain how to avoid timing sleeps., source_ref: pack }

  - key: golang
    label: Golang
    modes: [short_drill]
    source:
      repository: english-arcade
      path: packs/golang.yml
      attribution: English C2 Arcade original interview pack.
    items:
      - { id: golang-01, prompt: What does an interface value communicate at a service boundary?, context: A handler accepts a small behavior and should remain testable without a concrete client., answer: It depends on required behavior rather than a concrete implementation, distractors: [It guarantees the remote service is available., It stores every method exposed by the concrete type.], feedback: *feedback, rephrase: Tie the interface size to the consumer., extension: Name the compile-time check you would add., source_ref: pack }
      - { id: golang-02, prompt: How should a goroutine know when to stop waiting?, context: A request is cancelled while a worker is blocked on a downstream call., answer: Propagate context cancellation and select on its done signal, distractors: [Let the goroutine run because garbage collection will stop it., Poll a global boolean without synchronization.], feedback: *feedback, rephrase: Add the ownership rule for cancellation., extension: Explain what the caller observes on timeout., source_ref: pack }
      - { id: golang-03, prompt: When is a channel the wrong synchronization primitive?, context: A shared counter has a tiny critical section and no message ownership., answer: A mutex can be clearer when protecting shared state directly, distractors: [Channels are always faster than locks., A mutex cannot protect more than one field.], feedback: *feedback, rephrase: State the readability trade-off., extension: Name the race detector check., source_ref: pack }
      - { id: golang-04, prompt: How would you wrap an error without hiding its cause?, context: A repository error must retain its sentinel identity and add operation context., answer: Wrap with context so callers can inspect the underlying cause, distractors: [Convert every error to a new string and compare text., Return nil because the log already has the detail.], feedback: *feedback, rephrase: Include the operation name without leaking data., extension: Explain errors.Is or errors.As use., source_ref: pack }
      - { id: golang-05, prompt: What does a useful Go profile tell you before an optimization?, context: CPU and allocation profiles disagree about the endpoint's bottleneck., answer: A profile identifies measured cost so the optimization targets the bottleneck, distractors: [A profile proves the same fix works for every workload., Optimize the hottest-looking line without a baseline.], feedback: *feedback, rephrase: Add the workload and sample window., extension: Name a regression guard after the change., source_ref: pack }
      - { id: golang-06, prompt: How should a Go service define a boundary between transport and domain?, context: HTTP details are leaking into a rule that will also run from a queue consumer., answer: Keep transport translation at the edge and pass domain values inward, distractors: [Pass HTTP requests through every domain function., Put all business rules in middleware to share them.], feedback: *feedback, rephrase: Explain the testing payoff., extension: Name the error mapping at the edge., source_ref: pack }
      - { id: golang-07, prompt: What is the back-pressure signal in a bounded worker pool?, context: Producers can enqueue faster than workers can finish a downstream operation., answer: A full queue or rejected submission must slow or shed producers, distractors: [Create an unbounded queue so pressure is invisible., Add workers forever until memory is exhausted.], feedback: *feedback, rephrase: Add the overload policy., extension: Distinguish retryable work from dropped work., source_ref: pack }
      - { id: golang-08, prompt: How would you make a Go shutdown sequence deterministic?, context: The process receives a signal while requests and background flushes remain active., answer: Stop admission, cancel work, wait for owned goroutines, then close resources, distractors: [Call os.Exit immediately and trust the kernel to flush data., Sleep for a fixed second regardless of workload.], feedback: *feedback, rephrase: Put the steps in order., extension: State the timeout and forced-stop behavior., source_ref: pack }
      - { id: golang-09, prompt: How would you bound memory for a Go response stream?, context: A client reads slowly while the service receives a large result set., answer: Apply bounded buffering and propagate slow-consumer cancellation, distractors: [Buffer the full response because memory is cheaper than back-pressure., Drop arbitrary chunks without telling the client.], feedback: *feedback, rephrase: Name the owner of cancellation., extension: Add the metric for blocked writers., source_ref: pack }
      - { id: golang-10, prompt: What makes a Go map safe to share across concurrent requests?, context: One goroutine writes configuration while handlers read it after startup., answer: Publish immutable configuration or guard every mutation with synchronization, distractors: [Concurrent map reads and writes are safe if keys differ., Copy a pointer and assume it freezes the map.], feedback: *feedback, rephrase: State the publication moment., extension: Explain how race tests prove the boundary., source_ref: pack }
      - { id: golang-11, prompt: How would you test a Go timeout without making the suite slow?, context: A dependency must honor context cancellation and return a typed error quickly., answer: Inject a controllable dependency and advance a bounded test clock, distractors: [Sleep for the production timeout in every test., Mock time globally and ignore cancellation order.], feedback: *feedback, rephrase: Add the assertion on context cause., extension: Explain the real integration test separately., source_ref: pack }
      - { id: golang-12, prompt: What is the safest default for an unknown Go enum value?, context: A newer producer sends a status the older consumer does not understand., answer: Preserve the unknown value and fail closed at the decision boundary, distractors: [Map every unknown status to success for compatibility., Panic in the decoder before recording the payload.], feedback: *feedback, rephrase: Name the observability field., extension: Explain forward-compatible storage., source_ref: pack }

  - key: elixir
    label: Elixir
    modes: [short_drill]
    source:
      repository: english-arcade
      path: packs/elixir.yml
      attribution: English C2 Arcade original interview pack.
    items:
      - { id: elixir-01, prompt: What does a process boundary buy an Elixir service?, context: One tenant's slow work should not corrupt another tenant's state., answer: Isolated processes localize state and make failure supervision explicit, distractors: [Processes share mutable heaps so they remove serialization., A process boundary guarantees a request cannot fail.], feedback: *feedback, rephrase: Add the supervision qualifier., extension: Explain what message ownership means., source_ref: pack }
      - { id: elixir-02, prompt: How would you choose a supervisor strategy for independent workers?, context: One worker may fail while siblings can continue with their own state., answer: A one-for-one strategy restarts only the failed child, distractors: [Restart every child after any exception to be safest., Never restart a child because crashes are expected.], feedback: *feedback, rephrase: State the shared-state exception., extension: Add a restart intensity limit., source_ref: pack }
      - { id: elixir-03, prompt: Why does immutability change how you reason about an Elixir update?, context: A reducer receives a state value and returns the next state to its caller., answer: Each transition returns a new value without hidden mutation, distractors: [Immutable data is modified in place by the VM., Immutability eliminates the need to validate messages.], feedback: *feedback, rephrase: Connect the rule to replayable tests., extension: Mention structural sharing at a high level., source_ref: pack }
      - { id: elixir-04, prompt: How can a GenStage-style pipeline express back-pressure?, context: Consumers request only the demand they can process from producers., answer: Demand flows from consumers so production matches downstream capacity, distractors: [Producers emit forever and consumers drop excess messages., Back-pressure means retrying every failed message immediately.], feedback: *feedback, rephrase: Add the overload behavior., extension: Name the observation needed for queue age., source_ref: pack }
      - { id: elixir-05, prompt: What should a Phoenix channel do when a client disconnects?, context: A presence process still holds a lease for the disconnected socket., answer: Handle termination to release owned state and emit a safe event, distractors: [Keep the lease until the next deployment., Broadcast private payloads so peers can clean it up.], feedback: *feedback, rephrase: Mention idempotent cleanup., extension: Explain what happens during a network partition., source_ref: pack }
      - { id: elixir-06, prompt: How would you isolate a flaky external integration in OTP?, context: A provider occasionally times out and should not take down core request handling., answer: Put the integration behind a supervised boundary with bounded retries, distractors: [Call the provider from every process and rescue locally., Retry forever so no request is ever lost.], feedback: *feedback, rephrase: State the timeout and fallback., extension: Name the circuit signal for operators., source_ref: pack }
      - { id: elixir-07, prompt: What is the difference between a mailbox problem and a CPU problem?, context: Latency rises while one process accumulates messages and reductions remain normal., answer: Mailbox growth points to demand or handling imbalance rather than compute alone, distractors: [A mailbox is just CPU usage with a different label., Add schedulers before checking message arrival and handling time.], feedback: *feedback, rephrase: Name the two measurements you would compare., extension: Give one bounded mitigation., source_ref: pack }
      - { id: elixir-08, prompt: How would you explain supervision to a non-Elixir interviewer?, context: They ask why a process crash need not become a service outage., answer: Supervisors restart owned children according to a declared policy, distractors: [The VM prevents all process failures automatically., Supervisors hide crashes so operators never see them.], feedback: *feedback, rephrase: Keep the metaphor tied to a policy., extension: Explain when escalation is correct., source_ref: pack }
      - { id: elixir-09, prompt: How would you prevent duplicate work after a GenServer timeout?, context: The caller retries while the original process may still be finishing the request., answer: Use a correlation key and make the state transition idempotent, distractors: [Kill the process after every timeout and retry blindly., Assume a timeout means the message was never handled.], feedback: *feedback, rephrase: Add the ambiguous-result path., extension: Explain where the dedupe state lives., source_ref: pack }
      - { id: elixir-10, prompt: What should a mailbox-aware queue monitor expose?, context: Backlog rises gradually and operators need to distinguish overload from a stuck consumer., answer: Expose queue age, length, processing time, and consumer health, distractors: [Report only process count because queues are internal., Sample one message and infer every queue's age.], feedback: *feedback, rephrase: Name a bounded alert threshold., extension: Explain how to avoid leaking message data., source_ref: pack }
      - { id: elixir-11, prompt: How can pattern matching make an API failure explicit?, context: A result can be an accepted value, a validation error, or a provider outage., answer: Match each tagged outcome and handle the unmatched case deliberately, distractors: [Return a bare tuple and let callers guess its shape., Match only the happy tuple and let crashes decide.], feedback: *feedback, rephrase: Add the fallback branch., extension: Explain how the type-like shape aids review., source_ref: pack }
      - { id: elixir-12, prompt: What belongs in a release check for an OTP supervision tree?, context: A new child has a restart policy that may cascade during startup., answer: Verify child order, restart intensity, shutdown, and isolation behavior, distractors: [Check only that the application starts once., Increase restart intensity until the cascade is hidden.], feedback: *feedback, rephrase: Turn the check into an observable scenario., extension: Name the safe rollback signal., source_ref: pack }

  - key: salesforce
    label: Salesforce
    modes: [short_drill]
    source:
      repository: english-arcade
      path: packs/salesforce.yml
      attribution: English C2 Arcade original interview pack.
    items:
      - { id: salesforce-01, prompt: How do governor limits change an Apex bulkification design?, context: A trigger receives one record in a demo but hundreds in production., answer: Process records in collections and bound queries and DML, distractors: [Keep the demo loop because Salesforce scales it transparently., Add one query inside each record loop for clarity.], feedback: *feedback, rephrase: Name the limit you would measure., extension: Explain partial failure handling., source_ref: pack }
      - { id: salesforce-02, prompt: When would you choose Flow over Apex for an automation?, context: The rule is declarative and admins must own small policy changes., answer: Prefer Flow when the rule fits supported declarative behavior and ownership, distractors: [Always choose Apex because code is more professional., Use Flow for any rule that needs an external transaction.], feedback: *feedback, rephrase: Add the maintenance trade-off., extension: Name the boundary that forces Apex., source_ref: pack }
      - { id: salesforce-03, prompt: How would you protect an integration from duplicate platform events?, context: The subscriber may receive a replay after a worker restart., answer: Persist an idempotency key and make the event handler repeat-safe, distractors: [Assume replay never happens after an acknowledgement., Delete the event before the side effect is committed.], feedback: *feedback, rephrase: State the durable key source., extension: Explain reconciliation for an ambiguous response., source_ref: pack }
      - { id: salesforce-04, prompt: What is the security distinction between sharing and field visibility?, context: A user can see a record but should not read one sensitive field., answer: Record sharing and field-level access govern different visibility boundaries, distractors: [Sharing rules hide every field on a record equally., Field visibility controls which users can query the database server.], feedback: *feedback, rephrase: Add one least-privilege check., extension: Explain system mode risk., source_ref: pack }
      - { id: salesforce-05, prompt: How would you frame a stakeholder trade-off when a standard object is insufficient?, context: A custom object improves fit but raises reporting and migration cost., answer: Compare workflow fit, reporting, ownership, and long-term migration cost, distractors: [Choose custom objects whenever the name is unique., Use the standard object even when its invariants are wrong.], feedback: *feedback, rephrase: Give the recommendation with a condition., extension: Name a reversible pilot., source_ref: pack }
      - { id: salesforce-06, prompt: What should an Apex test prove beyond code coverage?, context: A trigger passes a coverage threshold but fails for mixed insert and update batches., answer: Assert business outcomes across bulk, permission, and failure paths, distractors: [Coverage percentage proves the trigger is correct., Test only one record because bulk behavior is identical.], feedback: *feedback, rephrase: Add one negative path., extension: State how test data stays isolated., source_ref: pack }
      - { id: salesforce-07, prompt: How would you handle a long-running callout from a transaction?, context: The external system may exceed the synchronous request budget., answer: Enqueue asynchronous work and persist a correlation state, distractors: [Increase the synchronous timeout until the request finishes., Retry inside the same transaction without a limit.], feedback: *feedback, rephrase: Mention user-visible pending state., extension: Explain replay and reconciliation., source_ref: pack }
      - { id: salesforce-08, prompt: What evidence would justify a Salesforce integration pattern change?, context: Support reports timeouts but the event log lacks tenant and operation dimensions., answer: Add safe correlation metrics before choosing a new integration pattern, distractors: [Replace the pattern because one anecdote is enough., Log every payload including secrets to get certainty.], feedback: *feedback, rephrase: State the privacy-preserving evidence., extension: Name the rollback trigger., source_ref: pack }
      - { id: salesforce-09, prompt: How would you bulkify a relationship query in Apex?, context: Each parent record needs child totals and the batch can contain hundreds of parents., answer: Query children once and group them by parent in memory, distractors: [Query children inside each parent loop for simpler code., Query the entire org and filter only in Apex.], feedback: *feedback, rephrase: State the governor-limit risk., extension: Explain missing-child behavior., source_ref: pack }
      - { id: salesforce-10, prompt: What should an integration retry record contain in Salesforce?, context: A platform event may be replayed after a subscriber timeout., answer: Store a correlation key, attempt state, next due time, and safe error class, distractors: [Store the full credentialed payload for easier debugging., Store only a boolean so operators infer the timeline.], feedback: *feedback, rephrase: Remove one sensitive field., extension: Name the reconciliation job input., source_ref: pack }
      - { id: salesforce-11, prompt: How would you explain a Flow recursion guard to a stakeholder?, context: Updating a record fires automation that can update the same record again., answer: Track the transition condition so one logical change cannot loop forever, distractors: [Disable all automation after the first update., Rely on the platform to deduplicate every update.], feedback: *feedback, rephrase: Use an outcome rather than an implementation term., extension: Add the audit trail requirement., source_ref: pack }
      - { id: salesforce-12, prompt: What is the least risky way to roll out a new Salesforce permission set?, context: A new role needs one object action while existing users must remain unchanged., answer: Add a narrow permission set and verify least-privilege access first, distractors: [Grant the broad profile and remove access after incidents., Copy an administrator profile because it is known to work.], feedback: *feedback, rephrase: State the rollback action., extension: Name the negative-access test., source_ref: pack }

  - key: system_design
    label: System design
    modes: [short_drill, timed_simulation]
    timed_minutes: 45
    source:
      repository: english-arcade
      path: packs/system_design.yml
      attribution: English C2 Arcade pack linked to the system-design-estudos corpus.
    corpus_links:
      - repository: system-design-estudos
        path: areas/01-metodo-e-entrevistas/examples/interview-walkthrough-marketplace-search.md
      - repository: system-design-estudos
        path: real-world-cases/01-platforms-and-apps/openai-postgresql-at-chatgpt-scale/README.md
    items:
      - { id: system_design-01, prompt: What requirements must be clarified before designing a feed?, context: The prompt says high scale but does not specify freshness, ordering, or visibility., answer: Clarify actors, freshness, ordering, visibility, and failure tolerance, distractors: [Choose Kafka first because feeds are always streaming., Start with database shards before asking who reads the feed.], feedback: *feedback, rephrase: Order the clarifying questions by risk., extension: Add one measurable success signal., source_ref: corpus }
      - { id: system_design-02, prompt: How would you estimate read and write volume for a notification service?, context: Product gives daily active users but no fan-out or retry assumptions., answer: Convert users to actions, fan-out, payloads, and peak factors, distractors: [Use daily active users as requests per second directly., Estimate from storage size and skip traffic shape.], feedback: *feedback, rephrase: Add one explicit peak assumption., extension: Explain how the estimate changes capacity., source_ref: corpus }
      - { id: system_design-03, prompt: Where should the source of truth live for an order state transition?, context: A cache, queue, and payment provider can each report a different status., answer: Keep an authoritative state transition in durable storage and reconcile edges, distractors: [Trust whichever response arrives last., Make the cache authoritative because it is fastest.], feedback: *feedback, rephrase: Distinguish command from observation., extension: Add the idempotency boundary., source_ref: corpus }
      - { id: system_design-04, prompt: How would you handle a hot partition in a multi-tenant service?, context: One tenant receives most traffic and overloads a nominally balanced shard., answer: Isolate the hot key with bounded routing and tenant-aware capacity, distractors: [Add random sharding so reads can never find the record., Move every tenant to one larger database.], feedback: *feedback, rephrase: Add the cost of rebalancing., extension: Name the metric that detects a hot key., source_ref: corpus }
      - { id: system_design-05, prompt: What failure mode does a retry storm create around a dependency?, context: Clients, workers, and a gateway all retry the same timed-out call., answer: Coordinated retries amplify load and can turn latency into an outage, distractors: [Retries always improve availability without side effects., A timeout means the dependency definitely did no work.], feedback: *feedback, rephrase: Add jitter or a budget to the mitigation., extension: Explain how to preserve user intent once., source_ref: corpus }
      - { id: system_design-06, prompt: How do you choose between a queue and a synchronous call?, context: The user needs an immediate acknowledgement but the downstream task can finish later., answer: Keep the acknowledgement synchronous and move durable work behind a queue, distractors: [Make every operation asynchronous so no request can fail., Use a queue only when the database is unavailable.], feedback: *feedback, rephrase: Separate latency from completion semantics., extension: Add the outbox or delivery guarantee., source_ref: corpus }
      - { id: system_design-07, prompt: What trade-off does read-after-write consistency impose?, context: A user creates a record and immediately refreshes a replica-backed page., answer: Stronger visibility may cost latency or routing flexibility after a write, distractors: [Eventual consistency means data is never correct., Route every read to the primary regardless of load.], feedback: *feedback, rephrase: State the user promise precisely., extension: Offer a session-level routing option., source_ref: corpus }
      - { id: system_design-08, prompt: How would you map a service boundary onto a Rails application safely?, context: Existing controllers, jobs, and models share a transaction while a new service is proposed., answer: Preserve a narrow domain contract and migrate one observable seam at a time, distractors: [Rewrite the monolith before measuring the boundary., Split by table names and assume ownership follows automatically.], feedback: *feedback, rephrase: Add a rollback checkpoint., extension: Name the first end-to-end metric., source_ref: corpus }
      - { id: system_design-09, prompt: What should a capacity plan say about a cache stampede?, context: A popular key expires while thousands of requests arrive at once., answer: Bound regeneration with locking, jitter, or stale serving policy, distractors: [Let every request rebuild the value because replicas add safety., Disable caching permanently after one stampede.], feedback: *feedback, rephrase: Choose one policy and state its cost., extension: Add the metric that reveals contention., source_ref: corpus }
      - { id: system_design-10, prompt: How would you design a safe schema backfill at scale?, context: A large table needs a derived column while writes continue and replicas lag., answer: Backfill in bounded batches with throttling, checkpoints, and replay-safe writes, distractors: [Run one unbounded transaction so the result is atomic., Stop all writes until replicas catch up.], feedback: *feedback, rephrase: Name the rollback boundary., extension: Explain how lag changes the throttle., source_ref: corpus }
      - { id: system_design-11, prompt: What is the user-visible contract for an eventually consistent read?, context: A write is accepted but a secondary view may lag for seconds., answer: State the freshness window and expose pending or stale status honestly, distractors: [Call the view real-time because most reads catch up quickly., Hide stale data so users cannot ask questions.], feedback: *feedback, rephrase: Add the recovery expectation., extension: Name a read-your-writes option., source_ref: corpus }
      - { id: system_design-12, prompt: How would you close a design interview with an explicit risk plan?, context: The architecture has one unproven dependency and a known peak-load assumption., answer: Summarize assumptions, risks, measurements, and the next reversible test, distractors: [End with a component list because details imply confidence., Promise the design handles every unknown workload.], feedback: *feedback, rephrase: Use a four-part closing structure., extension: State what would change your recommendation., source_ref: corpus }

learning_loop:
  stages: [active_recall, feynman, black_box, leitner, reattempt]
  active_recall:
    closed_book: true
    answer_reveal_after_attempt: true
  feynman:
    required_after_attempt: true
    prompt: Explain the answer in plain language and name one assumption.
  black_box:
    required_after_error: true
    prompt: Record the mistaken model, the missing signal, and the corrected rule.
  leitner:
    intervals_days: { 1: 1, 2: 2, 3: 4, 4: 7, 5: 14 }
    wrong_answer_box: 1
    correct_answer_advances_one_box: true
  reattempt:
    required_after_feedback: true
    preserves_target: true
  mastery:
    score_at_least: 8
    attempts: 2
    separation_days: 7
    separation_qualifier: where_feasible

persistence:
  session_fields: [target_key, mode, started_at, finished_at, item_ids]
  attempt_fields: [target_key, item_id, attempt_number, response_text, score, confidence, created_at]
  reflection_fields: [feynman_text, black_box_text, created_at]
  schedule_fields: [leitner_box, due_on, last_result, updated_at]
  target_preference_field: target_key
  reload_must_restore: [target_key, attempt_history, leitner_box, due_on]

adaptation:
  target_preference_persists: true
  launcher_uses_saved_target: true
  next_item_uses_saved_target: true
  weak_skill_signal: [missed_attempts, low_confidence, black_box_tags]
  adaptation_must_not_change_target_silently: true

accessibility:
  semantic_controls: true
  visible_focus: true
  keyboard_submit: Enter
  keyboard_reveal: Space
  no_pointer_only_action: true
  responsive_viewports: [[390, 844], [768, 1024], [1440, 1000]]
  minimum_touch_target_css_px: 44

health:
  live_path: /up
  content_path: /health/content
  arcade_path: /english-arcade
  expected_content_fields: [status, study_documents, content_bootstrapped, latest_sync_status]
