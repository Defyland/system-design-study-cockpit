      new_evidence: a Active Record test exposes a boundary case that the Active Record
        examples did not cover
      best_answer: I would keep the facts that remain supported about Active Record,
        treat a Active Record test exposes a boundary case that the Active Record
        examples did not cover as new evidence rather than a result, and state the
