  extension:
    prompt: 'Five more minutes on Stakeholder negotiation: which boundary, alternative,
      and update trigger would you explain for Stakeholder negotiation?'
    goal: Move from the short Stakeholder negotiation answer to a deep, evidence-led
      defence without inventing an outcome.
  critical_thinking:
    problem_frame: 'Frame Stakeholder negotiation before proposing a solution: state
      the actor, required outcome, constraint, and unknown that could invalidate the
      first recommendation.'
    claim_map:
      fact: The prompt explicitly tests Stakeholder negotiation within a Rails context;
        treat that named boundary as the verified starting fact.
      inference: The reasonable inference is that the answer must defend Stakeholder
        negotiation, but that does not prove one implementation wins under every workload
        or audience.
      assumption: An unstated assumption is that the Stakeholder negotiation constraint
        is the dominant one; label it and ask whether the interviewer confirms it.
      unknown: 'Still unknown for Stakeholder negotiation: the scale, failure tolerance,
        ownership boundary, and evidence threshold that would change the decision.'
    comparison:
      applicable: true
      alternatives:
      - option: a measured Rails boundary change for Stakeholder negotiation
        benefit: It keeps the Stakeholder negotiation reasoning close to the stated
          Rails constraint and makes the evidence boundary visible.
        cost_or_risk: It can be too narrow if the Stakeholder negotiation workload
          or requirement changes beyond the prompt.
        valid_when: Use it when the stated Stakeholder negotiation contract and its
          invariant are the facts that matter most.
      - option: a broader cache or framework-level workaround for Stakeholder negotiation
        benefit: It can make the Stakeholder negotiation boundary more explicit when
          the first option's hidden assumption is not guaranteed.
        cost_or_risk: It adds implementation or communication cost and may solve a
          problem the Stakeholder negotiation evidence has not established.
        valid_when: Use it when a measured constraint, requirement, or failure mode
          makes the first option unsafe.
      decision_rule: Choose the first Stakeholder negotiation option when its stated
        contract holds; choose the alternative only when evidence shows that the relevant
        Rails constraint makes the first assumption unsafe.
    failure_probe:
      kind: failure_mode
      prompt: 'Stakeholder negotiation: when the Stakeholder negotiation constraint
        tightens during rollout, what breaks first in Stakeholder negotiation, and
        how do you observe it?'
    evidence_check:
      basis: Check the Stakeholder negotiation claim against system-design-estudos/areas/12-engineering-practice/cards/progressive-delivery-and-feature-flags.md
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: This Rails exercise can test reasoning about Stakeholder negotiation,
        but it cannot prove an unmeasured production outcome, personal ownership,
        or universal rule.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: Certainty is medium because the prompt bounds the Stakeholder negotiation
        question but does not reveal every workload, stakeholder priority, or outcome.
      update_trigger: For case "Product wants this shipped Friday and you", update
        Stakeholder negotiation when Stakeholder negotiation evidence—a Stakeholder
        negotiation trace or Stakeholder negotiation test—contradicts the Stakeholder
        negotiation constraint in case "Product wants this shipped Friday and you";
        ask a stakeholder about Stakeholder negotiation before revising.
    rubric:
      facts_correct: Names the verified Stakeholder negotiation facts without smuggling
        in a result, scale, or capability that the prompt does not establish.
      assumptions_explicit: Labels the Stakeholder negotiation premise that is still
        assumed and asks the smallest clarifying question that matters.
      alternatives_considered: Compares two credible Stakeholder negotiation options,
        or explains the hard constraint that makes comparison a false equivalence.
      tradeoff_quality: Connects the Stakeholder negotiation choice to a benefit,
        a cost or risk, and the condition under which another choice wins.
      follow_up_adaptation: Responds to the evidence challenge about Stakeholder negotiation
        by changing the claim or evidence boundary rather than repeating the base
        answer.
      certainty_calibration: Uses medium certainty deliberately and names the evidence
        that would update the Stakeholder negotiation recommendation.
