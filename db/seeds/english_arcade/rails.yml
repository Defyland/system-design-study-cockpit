- id: rails-07-observability
  version: 1.4.0
  target: rails
  topic: Observability
  difficulty: 2
  interview_stage: deep_dive
  prompt: A customer says checkout is broken but your dashboards are green. What now?
  context: An incident-flavoured question. The interviewer wants to hear whether you
    can reason about the gap between aggregate metrics and one user's experience.
  follow_up:
    prompt: Which customer-facing signal would you add when aggregate dashboards are
      green, and how would you correlate it to one request?
    goal: Answer the evidence challenge about Observability while keeping the evidence
      boundary explicit.
    challenge_kind: evidence
    best_answer: >-
      I would add a checkout completion or failure signal with a support-safe request ID, then
      correlate it with the server trace. I would segment by the affected tenant, client, or
      app version instead of relying on the global average. I would verify that the event is
      actually emitted on the failing path and redact sensitive fields, because missing
      telemetry can make a broken checkout look healthy.
    distractors:
    - text: I would cite my experience with Observability as enough proof and move
        on without naming an observation.
      why_wrong: Experience can guide a hypothesis, but it does not replace evidence
        tied to this context.
    - text: I would collect every possible metric about Observability before making
        even a provisional recommendation.
      why_wrong: A focused decision can start with one discriminating observation
        rather than an unbounded data request.
  compression:
    prompt: Frame the observability response as user symptom, traceable signal, and
      the next diagnostic action.
    goal: Compress the Observability answer into its decision, premise, trade-off,
      and verification step.
  best_answer: Green dashboards usually mean the aggregate is fine, so I would look
    for the population my metrics hide. I would trace that specific request by correlation
    ID, then check whether errors are concentrated in one tenant, one region or one
    client version rather than spread across the average.
  distractors:
  - text: I would ask the customer for more details about exactly what they were doing,
      and try to reproduce the problem myself in a staging environment to see whether
      it happens there too.
    trap: pragmatics
    why_wrong: Reasonable but slow, and it ignores the production evidence already
      available through tracing.
  - text: If the dashboards are green then the system is working correctly, so it
      is most likely a client-side problem or a misunderstanding on the customer's
      side about how the feature works.
    trap: content
    why_wrong: Trusts aggregates over a user report, which is how long-tail failures
      stay invisible for weeks.
  - text: The dashboards green are meaning that the aggregate is fine, then I would
      search the population that my metrics are hiding, like one tenant or one version
      of client.
    trap: grammar
    why_wrong: Adjective order, progressive aspect on a stative verb and "one version
      of client" all mark non-native production.
  feedback:
    register: Curious rather than defensive. Never imply the customer is mistaken.
    hedging: '"Usually means" is well calibrated for an inference about metrics.'
    precision: Name the dimensions you would slice by; that is the whole answer.
    grammar: '"Green dashboards mean", "one client version", "hidden by the average".'
    pragmatics: Starting from the trace shows you use evidence before hypotheses.
  rephrase:
    prompt: Answer again assuming you have no distributed tracing available.
    goal: Force reasoning without the convenient tool.
  language_focus:
  - precision
  - grammar
  - register
  feynman:
    concept: Aggregate metrics hiding a concentrated failure population.
    explain_to: A manager who trusts a green dashboard.
    constraint: Explain using average rainfall across a country.
    self_check: Did you name at least two dimensions to slice by?
    reasoning_check: Can you identify the hidden premise behind Observability, give
      a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You dismissed the report or went straight to reproduction.
    expected: Trace the request, then slice by tenant, region and version.
    actual: Deferring to the dashboard, or a slow staging investigation.
    root_cause: Treating monitoring as a verdict rather than as a sampled summary.
    repair: Ask "what population would this metric hide?" during every incident.
    reasoning_error: If your Observability answer failed, classify the mistake as
      a fact, assumption, comparison, failure, or certainty error before proposing
      the smallest repair.
  recall:
    active_recall_cue: Which dimensions most often hide a failure inside a green average?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Observability without presenting
      an assumption as a fact?
    black_box_probe: When the Observability answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: rails-07-observability-delayed-7
      prompt: >-
        An aggregate checkout dashboard is green, but one tenant reports failures. Which signal would you add and how would you verify it?
      changed_constraint: >-
        aggregate metrics are hiding a tenant or client-specific failure
      new_evidence: >-
        a correlated request trace shows failures concentrated in one tenant and client version
      best_answer: >-
        I would add correlation IDs and tenant/client dimensions with a trace for the failing request, verify redaction and emission on that path, and compare the slice with the aggregate before changing the alert.
      distractors:
      - text: I would preserve every part of the original Observability answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Observability explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/09-backend-principles/cards/logging-monitoring-observability.md
    note: Observability practices for backend services.
  - repo: original
    path: english-arcade/rails/observability
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: 'Walk through Observability under a changed requirement: which Observability
      claim survives, which option wins, and why would Observability need new evidence?'
    goal: Move from the short Observability answer to a deep, evidence-led defence
      without inventing an outcome.
  critical_thinking:
    problem_frame: >-
      An aggregate dashboard can hide a customer-specific failure; I must connect one affected request to tenant, region, client version, and a redacted trace.
    claim_map:
      fact: >-
        The customer reports checkout failure while aggregate dashboards remain green.
      inference: >-
        The failure may be concentrated in a population omitted by aggregate dimensions rather than absent from the system.
      assumption: >-
        I am assuming a correlation ID and safe dimensions exist or can be added at the request boundary.
      unknown: >-
        The affected tenant, client version, region, trace coverage, and sensitive fields are unknown.
    comparison:
      applicable: true
      alternatives:
      - option: structured events carrying request, job, tenant, and correlation identifiers
        benefit: I can connect a user-visible failure to the job and downstream call without parsing prose logs.
        cost_or_risk: I must control cardinality and redact sensitive fields; inconsistent event names reduce queryability.
        valid_when: Use it when tracing a request across asynchronous or service boundaries is part of diagnosis.
      - option: sampled logs plus aggregate latency and error metrics
        benefit: It costs less and gives a useful fleet-level signal for a simple synchronous endpoint.
        cost_or_risk: Sampling may omit the failing trace, and aggregates cannot reconstruct one request's path.
        valid_when: Use it when the failure can be localized from low-cardinality metrics and logs.
      decision_rule: I add correlation-rich events when cross-boundary diagnosis is required; I keep sampled logs and metrics for a bounded synchronous path with proven coverage.
    failure_probe:
      kind: counterexample
      prompt: >-
        What request-level signal would distinguish a tenant-specific failure from an aggregate metric blind spot?
    evidence_check:
      basis: Check the Observability claim against system-design-estudos/areas/09-backend-principles/cards/logging-monitoring-observability.md
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: This Rails exercise can test reasoning about Observability, but
        it cannot prove an unmeasured production outcome, personal ownership, or universal
        rule.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        I am confident that the green aggregate is insufficient; the useful dimensions and alert threshold need evidence from the affected request.
      update_trigger: >-
        Update when a correlated trace, redaction check, or slice metric shows a different population or a broader failure.
    rubric:
      facts_correct: Names the verified Observability facts without smuggling in a
        result, scale, or capability that the prompt does not establish.
      assumptions_explicit: Labels the Observability premise that is still assumed
        and asks the smallest clarifying question that matters.
      alternatives_considered: Compares two credible Observability options, or explains
        the hard constraint that makes comparison a false equivalence.
      tradeoff_quality: Connects the Observability choice to a benefit, a cost or
        risk, and the condition under which another choice wins.
      follow_up_adaptation: Responds to the evidence challenge about Observability
        by changing the claim or evidence boundary rather than repeating the base
        answer.
      certainty_calibration: Uses medium certainty deliberately and names the evidence
        that would update the Observability recommendation.
- id: rails-08-migration-safety
  version: 1.4.0
  target: rails
  topic: Migrations
  difficulty: 3
  interview_stage: architecture_review
  prompt: How would you rename a column on a large table without downtime?
  context: The table has tens of millions of rows and the application is deployed
    continuously. The interviewer wants the multi-step dance, expressed as an ordered
    plan.
  follow_up:
    prompt: Which expand-and-contract steps would let old and new application versions
      coexist while the table is being migrated?
    goal: Answer the alternative challenge about Migrations while keeping the evidence
      boundary explicit.
    challenge_kind: alternative
    best_answer: >-
      I would add the new column, dual-write it, backfill in batches, switch reads after parity
      checks, and remove the old column in a later deploy. I would verify old and new application
      versions during the overlap and test rollback before enforcing a new constraint.
    distractors:
    - text: I would defend the first Migrations option because offering an alternative
        might make the decision look uncertain.
      why_wrong: A comparison makes the decision rule visible; it does not weaken
        a well-calibrated recommendation.
    - text: I would list every conceivable Migrations design without saying which
        requirement should decide between them.
      why_wrong: An option list without a decision rule avoids the trade-off the follow-up
        is testing.
  compression:
    prompt: State the no-downtime migration sequence as additive change, backfill
      or dual write, cutover, and cleanup.
    goal: Compress the Migrations answer into its decision, premise, trade-off, and
      verification step.
  best_answer: I would not rename in place. Add the new column, write to both, backfill
    in batches, switch reads once the data matches, and drop the old column in a later
    deploy. Old and new code run together during a rollout.
  distractors:
  - text: I would use a rename_column migration but run it during a low-traffic window,
      such as overnight, so that the impact on users would be minimal even if it locks
      briefly.
    trap: content
    why_wrong: Still breaks running code that references the old name, and lock duration
      is not the main risk.
  - text: I would add the new column and copy the data across, then update the application
      to use the new one and remove the old column once everything is working correctly.
    trap: precision
    why_wrong: Right shape but omits dual writes and batching, which is where large-table
      migrations actually fail.
  - text: I would add the column new, write in the two during some time, make the
      backfill for batches, and after change the reads when the data is equal.
    trap: grammar
    why_wrong: Adjective order, "write in the two" and "for batches" break the plan's
      readability despite correct steps.
  feedback:
    register: Procedural and confident. Ordered plans are exactly what this question
      rewards.
    hedging: None; each step is a known technique.
    precision: Dual writes and batched backfill are the load-bearing details.
    grammar: '"The new column", "write to both", "backfill in batches".'
    pragmatics: Explaining why the steps exist, mixed-version deploys, proves you
      have done it.
  rephrase:
    prompt: Compress the plan into a checklist a teammate could execute.
    goal: Convert narrative into an executable sequence.
  language_focus:
  - precision
  - grammar
  - pragmatics
  feynman:
    concept: Expand-migrate-contract under continuous deployment.
    explain_to: A developer who has only migrated small tables.
    constraint: Explain using replacing a bridge while traffic flows.
    self_check: Is every step safe if the deploy stops halfway?
    reasoning_check: Can you identify the hidden premise behind Migrations, give a
      counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You renamed in place, or skipped dual writes and batching.
    expected: Add, dual write, batched backfill, switch reads, drop later.
    actual: A maintenance-window rename, or a three-step simplification.
    root_cause: Not accounting for old and new code running at the same time.
    repair: Check each migration step against a half-finished rollout.
    reasoning_error: If your Migrations answer failed, classify the mistake as a fact,
      assumption, comparison, failure, or certainty error before proposing the smallest
      repair.
  recall:
    active_recall_cue: Why must the old column survive the deploy that stops using
      it?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Migrations without presenting
      an assumption as a fact?
    black_box_probe: When the Migrations answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: rails-08-migration-safety-delayed-8
      prompt: >-
        During an expand-and-contract migration, an old worker writes only the legacy column and leaves the new column null. What step prevents the final constraint from failing?
      changed_constraint: >-
        old and new writers must coexist without creating null new values
      new_evidence: >-
        backfill inspection finds rows written by the old worker without the new value
      best_answer: >-
        I would keep the new column nullable, deploy dual-write or a compatibility default, backfill and observe missing values, then enforce the constraint only after old-writer coverage is gone.
      distractors:
      - text: I would preserve every part of the original Migrations answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Migrations explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/11-operational-playbooks/playbooks/database-migration-and-backfill.md
    note: Migration and backfill playbook.
  - repo: original
    path: english-arcade/rails/migration-safety
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: Connect Migrations, connect the Migrations implementation choice to its
      failure mode, measurement, and condition for choosing the alternative.
    goal: Move from the short Migrations answer to a deep, evidence-led defence without
      inventing an outcome.
  critical_thinking:
    problem_frame: >-
      A continuously deployed app must span old and new schema shapes across a large table; I must order expand, dual-write, backfill, read cutover, and contract steps.
    claim_map:
      fact: >-
        A large table and old/new application versions coexist during deployment.
      inference: >-
        Expand-and-contract limits compatibility risk, while a one-step rename can break running readers or writers.
      assumption: >-
        I am assuming the new representation can coexist long enough to backfill and verify parity.
      unknown: >-
        Write volume, lock behavior, rollback path, and old-worker lifetime are unknown.
    comparison:
      applicable: true
      alternatives:
      - option: an expand-and-contract migration with dual compatibility
        benefit: I can deploy old and new application versions while backfilling and validating before removal.
        cost_or_risk: It requires multiple deploys, dual-read or dual-write decisions, and cleanup tracking.
        valid_when: Use it when the table is large or rolling deploys leave old workers running.
      - option: one blocking schema change during a maintenance window
        benefit: It is simpler and can finish quickly on a small table with no concurrent writers.
        cost_or_risk: Locks or rewrite time can block traffic and make rollback harder.
        valid_when: Use it only when lock duration, table size, and downtime are measured and accepted.
      decision_rule: I use expand-and-contract when compatibility or lock risk matters; I choose a single change only when the measured maintenance window is safe.
    failure_probe:
      kind: edge_case
      prompt: >-
        Which old writer or rollback path would fail if the new column became mandatory before compatibility ended?
    evidence_check:
      basis: Check the Migrations claim against system-design-estudos/areas/11-operational-playbooks/playbooks/database-migration-and-backfill.md
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: This Rails exercise can test reasoning about Migrations, but it
        cannot prove an unmeasured production outcome, personal ownership, or universal
        rule.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        I am confident in the migration sequence, but its batch size and cutover timing require lock, lag, and parity evidence.
      update_trigger: >-
        Update when a backfill, lock, or old-version test shows the overlap cannot satisfy the stated availability contract.
    rubric:
      facts_correct: Names the verified Migrations facts without smuggling in a result,
        scale, or capability that the prompt does not establish.
      assumptions_explicit: Labels the Migrations premise that is still assumed and
        asks the smallest clarifying question that matters.
      alternatives_considered: Compares two credible Migrations options, or explains
        the hard constraint that makes comparison a false equivalence.
      tradeoff_quality: Connects the Migrations choice to a benefit, a cost or risk,
        and the condition under which another choice wins.
      follow_up_adaptation: Responds to the alternative challenge about Migrations
        by changing the claim or evidence boundary rather than repeating the base
        answer.
      certainty_calibration: Uses medium certainty deliberately and names the evidence
        that would update the Migrations recommendation.
- id: rails-09-active-record-scopes
  version: 1.4.0
  target: rails
  topic: Active Record
  difficulty: 1
  interview_stage: technical_screen
  prompt: What is the difference between a scope and a class method here?
  context: A warm-up on Active Record idiom. The interviewer is checking whether you
    know the chainability guarantee rather than treating them as interchangeable styles.
  follow_up:
    prompt: What difference in composability, argument handling, or evaluation would
      make a scope preferable in this case?
    goal: Answer the failure challenge about Active Record while keeping the evidence
      boundary explicit.
    challenge_kind: failure
    best_answer: >-
      I would use a scope when callers need composable relations and nil-safe filtering. I would
      use a class method only when its arguments and return type are explicit; a method that returns
      nil breaks a chain. I would test nil, chained conditions, and generated SQL before choosing
      the abstraction.
    distractors:
    - text: I would describe the Active Record failure as impossible because the happy
        path already passed its test.
      why_wrong: Passing a happy path does not test the boundary, failure mode, or
        recovery being challenged.
    - text: I would add retries to Active Record immediately and assume the system
        would become reliable.
      why_wrong: Retries can amplify load or duplicate effects; the failure and containment
        policy must be specified first.
  compression:
    prompt: Compare the scope and class method by composability, relation behavior,
      and the caller's expectation.
    goal: Compress the Active Record answer into its decision, premise, trade-off,
      and verification step.
  best_answer: >-
    I would prefer a scope when the filter must remain chainable: a scope returns a
    relation even when its condition is nil. I would use a class method only with an
    explicit relation fallback, because returning nil would break the caller's chain.
  distractors:
  - text: They are basically the same thing under the hood, and it is mostly a matter
      of style and team preference which one you choose to use in any given situation.
    trap: content
    why_wrong: Ignores the nil-safety guarantee, which is the practical difference
      that causes real breakage.
  - text: Scopes are defined with the scope keyword and class methods are defined
      with def self, so the syntax is different but they achieve broadly similar outcomes
      in practice.
    trap: precision
    why_wrong: Describes syntax rather than behaviour, which answers a different question
      than the one asked.
  - text: A scope is returning always a relation, even when the condition is nil,
      then it continues chainable, but a class method can return nil and break the
      chain.
    trap: grammar
    why_wrong: Adverb placement and progressive aspect are both off for stating a
      general rule.
  feedback:
    register: Short and precise; warm-ups reward economy.
    hedging: None needed; the chainability guarantee is not a matter of opinion.
    precision: Chainability under a nil condition is the whole answer.
    grammar: '"A scope always returns", "stays chainable"; adverb before the verb.'
    pragmatics: Mentioning the fallback shows you know how to make class methods safe
      too.
  rephrase:
    prompt: Answer again by describing the bug a broken chain produces.
    goal: Anchor an idiom question in an observable failure.
  language_focus:
  - precision
  - grammar
  - pragmatics
  feynman:
    concept: Relation-returning guarantee and chainability.
    explain_to: A developer whose filter chain returned nil in production.
    constraint: Explain using a conveyor belt that must never be empty.
    self_check: Did you say what happens when the condition is nil?
    reasoning_check: Can you identify the hidden premise behind Active Record, give
      a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You described syntax or called them interchangeable.
    expected: Scopes always return a relation, so chains survive nil.
    actual: A style comparison, or a syntax description.
    root_cause: Idiom differences learned by convention rather than by failure.
    repair: Tie each idiom to the runtime error its absence produces.
    reasoning_error: If your Active Record answer failed, classify the mistake as
      a fact, assumption, comparison, failure, or certainty error before proposing
      the smallest repair.
  recall:
    active_recall_cue: What does a scope guarantee that a class method does not?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Active Record without presenting
      an assumption as a fact?
    black_box_probe: When the Active Record answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: rails-09-active-record-scopes-delayed-9
      prompt: >-
        A class method returns nil for a nil filter and breaks a chained relation, while the scope preserves the relation. What would you keep and test?
      changed_constraint: >-
        the caller requires a composable relation even when an optional filter is absent
      new_evidence: >-
        a chained query fails only when the filter argument is nil
      best_answer: >-
        I would use a nil-safe scope or an explicit relation fallback, then test nil, chained conditions, and generated SQL so the return contract is visible to callers.
      distractors:
      - text: I would preserve every part of the original Active Record answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Active Record explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: interview/story-bank/03-ruby-rails-senior-question-bank.md
    note: Senior Rails question bank on Active Record idiom.
  - repo: original
    path: english-arcade/rails/active-record-scopes
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: 'Active record: inspect Active Record evidence next; which edge case for
      Active Record would alter the trade-off?'
    goal: Move from the short Active Record answer to a deep, evidence-led defence
      without inventing an outcome.
  critical_thinking:
    problem_frame: >-
      A filter must remain a composable Active Record relation when an optional condition is absent; I must distinguish scope return behavior from class-method conventions.
    claim_map:
      fact: >-
        Scopes are intended to return relations and can be chained.
      inference: >-
        A class method can match the behavior when it always returns a relation, but nil breaks downstream composition.
      assumption: >-
        I am assuming callers chain additional filters and pass nil for an optional argument.
      unknown: >-
        Nil behavior, generated SQL, argument validation, and caller chaining are unknown.
    comparison:
      applicable: true
      alternatives:
      - option: a relation-returning scope with a defined empty or nil-input behavior
        benefit: I keep chaining, composition, and SQL inspection predictable for callers.
        cost_or_risk: I must document whether an absent filter means no filter or no rows, especially for authorization.
        valid_when: Use it when callers need to compose the query and the boundary can state that behavior precisely.
      - option: a class method that branches and returns a relation or an application result
        benefit: It can express a workflow with validation or a deliberately non-query outcome.
        cost_or_risk: Mixed return types break chaining and make callers handle hidden branches.
        valid_when: Use it when the operation is more than a composable relation and its result type is explicit.
      decision_rule: I keep a scope relation-only for composable filtering; I use a class method when validation or a non-query result is part of the contract.
    failure_probe:
      kind: failure_mode
      prompt: >-
        What nil and chained-query case would expose a class method that returns nil instead of a relation?
    evidence_check:
      basis: Check the Active Record claim against system-design-estudos/interview/story-bank/03-ruby-rails-senior-question-bank.md
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: This Rails exercise can test reasoning about Active Record, but
        it cannot prove an unmeasured production outcome, personal ownership, or universal
        rule.
      checked_on: '2026-08-25'
    certainty:
      level: high
      rationale: >-
        I am confident about the chainability criterion; the implementation choice depends on the actual argument and SQL contract.
      update_trigger: >-
        Update when a nil test, relation inspection, or caller path shows the chosen method violates composability.
    rubric:
      facts_correct: Names the verified Active Record facts without smuggling in a
        result, scale, or capability that the prompt does not establish.
      assumptions_explicit: Labels the Active Record premise that is still assumed
        and asks the smallest clarifying question that matters.
      alternatives_considered: Compares two credible Active Record options, or explains
        the hard constraint that makes comparison a false equivalence.
      tradeoff_quality: Connects the Active Record choice to a benefit, a cost or
        risk, and the condition under which another choice wins.
      follow_up_adaptation: Responds to the failure challenge about Active Record
        by changing the claim or evidence boundary rather than repeating the base
        answer.
      certainty_calibration: Uses high certainty deliberately and names the evidence
        that would update the Active Record recommendation.
- id: rails-10-incident-narrative
  version: 1.4.0
  target: rails
  topic: Incident response
  difficulty: 3
  interview_stage: behavioural_probe
  prompt: Walk me through an outage you were involved in.
  context: A behavioural probe in a senior loop. The interviewer is listening for
    impact first, then containment, then the durable fix, told without blaming anyone.
  follow_up:
    prompt: What did you know first, which customer impact did you contain, and what
      follow-up change prevented a repeat?
    goal: Answer the new_evidence challenge about Incident response while keeping
      the evidence boundary explicit.
    challenge_kind: new_evidence
    best_answer: >-
      I would state the first signal and affected customers, roll back or contain the failing
      change, and verify recovery from the error rate and a representative request. I would then
      separate incident-time facts from the later query-plan hypothesis and add a regression check
      only after logs and plan evidence support the cause.
    distractors:
    - text: I would keep the Incident response recommendation unchanged because changing
        position would look inconsistent.
      why_wrong: A defensible answer updates when relevant evidence changes an assumption
        or trade-off.
    - text: I would discard every earlier Incident response claim as soon as one new
        observation appeared.
      why_wrong: New evidence may narrow one claim while leaving other verified facts
        intact.
  compression:
    prompt: 'Tell the incident in four beats: signal, impact, mitigation, and durable
      corrective action.'
    goal: Compress the Incident response answer into its decision, premise, trade-off,
      and verification step.
  best_answer: I would say that checkout failed for about a fifth of users after a
    deploy. I rolled back first, confirmed recovery from the error rate, traced the
    cause to a query that lost its index after a column change, and added a query-plan
    check to the pipeline.
  distractors:
  - text: Someone on the team deployed a change without testing it properly and it
      broke checkout, so we had to roll it back and afterwards we talked about being
      more careful with deploys.
    trap: register
    why_wrong: Blames an individual and ends in an intention rather than a mechanism,
      which reads as a weak post-mortem culture.
  - text: We had an incident where the site was down for a while, it was quite stressful,
      and we fixed it as quickly as we could and then things went back to normal afterwards.
    trap: precision
    why_wrong: No impact figure, no containment step and no durable fix, so nothing
      is assessable.
  - text: The checkout was failing for a fifth of the users after one deploy, so first
      we stopped the bleeding with a rollback and after we confirmed the recovery
      for the rate of errors.
    trap: grammar
    why_wrong: '"After we confirmed" as a connector and "for the rate of errors" weaken
      an otherwise well-structured story.'
  feedback:
    register: Blameless throughout. Describe systems and decisions, never people.
    hedging: Hedge only the estimate ("about a fifth"), never the sequence.
    precision: Impact, containment, cause, durable fix. Missing any one weakens it.
    grammar: '"Then we confirmed", "from the error rate", "after a deploy".'
    pragmatics: Ending with the pipeline check proves the lesson became a mechanism.
  rephrase:
    prompt: Tell it again in four sentences, one per stage.
    goal: Enforce the impact-containment-cause-fix skeleton.
  language_focus:
  - register
  - precision
  - grammar
  pt_help: '"Depois" como conector e "then", nao "after". "After" precisa de complemento.'
  feynman:
    concept: Blameless incident narrative with a durable fix.
    explain_to: A candidate who tells outage stories as drama.
    constraint: No adjectives about how stressful it was.
    self_check: Does your story end in a mechanism rather than an intention?
    reasoning_check: Can you identify the hidden premise behind Incident response,
      give a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You blamed a person, or told it without numbers.
    expected: Impact, containment, cause, durable fix, blameless throughout.
    actual: A drama retelling, or an intention to be more careful.
    root_cause: Incident stories rehearsed emotionally rather than structurally.
    repair: Practise the four-stage skeleton with one real number in stage one.
    reasoning_error: If your Incident response answer failed, classify the mistake
      as a fact, assumption, comparison, failure, or certainty error before proposing
      the smallest repair.
  recall:
    active_recall_cue: What are the four stages of a strong incident narrative?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Incident response without
      presenting an assumption as a fact?
    black_box_probe: When the Incident response answer failed, did you locate the
      reasoning error before changing the implementation?
    delayed_variant:
      id: rails-10-incident-narrative-delayed-10
      prompt: >-
        A rollback restores the error rate, but the planned query-plan check shows no index loss. How would you revise the incident account?
      changed_constraint: >-
        the rollback is evidence of containment but not proof of the suspected root cause
      new_evidence: >-
        the query-plan check contradicts the initial index-loss hypothesis
      best_answer: >-
        I would keep the observed impact and rollback, retract the unverified cause, and collect deploy diff, trace, and query-plan evidence before adding a durable corrective check.
      distractors:
      - text: I would preserve every part of the original Incident response answer
          because changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Incident response explanation with a new
          design without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/11-operational-playbooks/playbooks/incident-severity-and-triage.md
    note: Incident severity and triage structure.
  - repo: original
    path: english-arcade/rails/incident-narrative
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: 'Deep dive on Incident response: compare Incident response options with
      one measurement; which failure around Incident response would make Incident
      response switch?'
    goal: Move from the short Incident response answer to a deep, evidence-led defence
      without inventing an outcome.
  critical_thinking:
    problem_frame: >-
      An outage account must separate initial signal, customer impact, containment, verified recovery, and later causal evidence; I must not turn a plausible query cause into a fact.
    claim_map:
      fact: >-
        The interview asks for what was known first, impact contained, and follow-up prevention.
      inference: >-
        A rollback can establish containment while logs and query plans are needed to establish root cause.
      assumption: >-
        I am assuming the error-rate recovery and the later index hypothesis refer to the same deploy and path.
      unknown: >-
        Initial signal, affected population, rollback timing, query plan, and durable regression check are unknown.
    comparison:
      applicable: true
      alternatives:
      - option: a timestamped incident timeline tied to observations and decisions
        benefit: I can separate fact from inference, show when containment changed, and identify what evidence is still missing.
        cost_or_risk: It takes disciplined log and deploy correlation and may expose uncertainty that stakeholders find uncomfortable.
        valid_when: Use it when the team needs a shared reconstruction and follow-up actions.
      - option: a concise prescriptive summary focused on the fix
        benefit: It is faster for a small, already understood incident with no disputed sequence.
        cost_or_risk: It can hide the trigger, delay, and evidence boundary, making recurrence harder to prevent.
        valid_when: Use it only after the timeline is established and the audience needs a short decision record.
      decision_rule: I build the evidence timeline first; I compress it only after the trigger, containment, and verification are supported.
    failure_probe:
      kind: counterexample
      prompt: >-
        Which artifact would falsify the suspected query cause while leaving the rollback and customer impact factual?
    evidence_check:
      basis: Check the Incident response claim against system-design-estudos/areas/11-operational-playbooks/playbooks/incident-severity-and-triage.md
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: This Rails exercise can test reasoning about Incident response,
        but it cannot prove an unmeasured production outcome, personal ownership,
        or universal rule.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        I am confident in the incident sequence as a reasoning structure, but the cause remains low certainty until artifacts connect it to the failure.
      update_trigger: >-
        Update when deploy diff, trace, query plan, or recovery data changes the causal account; preserve observed impact separately.
    rubric:
      facts_correct: Names the verified Incident response facts without smuggling
        in a result, scale, or capability that the prompt does not establish.
      assumptions_explicit: Labels the Incident response premise that is still assumed
        and asks the smallest clarifying question that matters.
      alternatives_considered: Compares two credible Incident response options, or
        explains the hard constraint that makes comparison a false equivalence.
      tradeoff_quality: Connects the Incident response choice to a benefit, a cost
        or risk, and the condition under which another choice wins.
      follow_up_adaptation: Responds to the new_evidence challenge about Incident
        response by changing the claim or evidence boundary rather than repeating
        the base answer.
      certainty_calibration: Uses medium certainty deliberately and names the evidence
        that would update the Incident response recommendation.
- id: rails-11-api-versioning
  version: 1.4.0
  target: rails
  topic: API design
  difficulty: 2
  interview_stage: architecture_review
  prompt: A client depends on a field you want to remove. How do you proceed?
  context: A public API with external consumers you cannot deploy. The interviewer
    is testing whether you treat the response shape as a contract rather than as implementation
    detail.
  follow_up:
    prompt: How would you communicate the deprecation window and discover clients
      that still depend on the field?
    goal: Answer the assumption challenge about API design while keeping the evidence
      boundary explicit.
    challenge_kind: assumption
    best_answer: >-
      I would publish a deprecation date and migration path, measure field usage by client and
      version, and contact the remaining consumers. I would remove the field only after usage and
      contract tests show that no supported client depends on it; otherwise I would keep the field
      through a versioned transition.
    distractors:
    - text: I would repeat my original API design answer with more confidence because
        the interviewer probably assumes the usual case.
      why_wrong: It hides the premise instead of checking whether the usual case is
        actually part of this problem.
    - text: I would stop proposing anything about API design until every surrounding
        requirement had been documented in full.
      why_wrong: It treats uncertainty as a reason for paralysis and offers no bounded
        next step.
  compression:
    prompt: Summarize the API evolution as compatibility evidence, a migration path,
      and a removal condition.
    goal: Compress the API design answer into its decision, premise, trade-off, and
      verification step.
  best_answer: The response shape is a contract, so I cannot remove it unilaterally.
    I would mark it deprecated in the docs, measure who still requests it, contact
    those consumers with a timeline, and only remove it in a new version once usage
    has actually reached zero.
  distractors:
  - text: I would remove the field and announce it in the changelog, since it is deprecated
      anyway and consumers should be keeping up with the release notes we publish.
    trap: pragmatics
    why_wrong: Shifts responsibility onto consumers and breaks integrations you were
      told exist.
  - text: I would keep the field forever and just stop populating it, returning null,
      so nothing breaks structurally even though the data is no longer there for anyone.
    trap: content
    why_wrong: Silently changing semantics is worse than removal because failures
      become invisible and downstream.
  - text: The shape of the response is a contract, then I cannot remove it alone.
      I would mark like deprecated in the docs and measure who continues asking for
      this field.
    trap: grammar
    why_wrong: '"Mark like deprecated" and "remove it alone" misuse idiom; "mark as
      deprecated" and "unilaterally" are required.'
  feedback:
    register: Responsible and consumer-aware, which is the seniority signal here.
    hedging: None on the contract principle; hedge only the timeline.
    precision: Measuring actual usage is what separates a plan from a hope.
    grammar: '"Mark as deprecated", "remove it unilaterally", "in a new version".'
    pragmatics: Naming the zero-usage condition gives the interviewer a concrete gate.
  rephrase:
    prompt: Draft the same decision as a two-sentence note to the affected client.
    goal: Practise external-facing register.
  language_focus:
  - pragmatics
  - grammar
  - precision
  feynman:
    concept: Response shape as a consumer contract.
    explain_to: A developer who owns only internal services.
    constraint: Explain using a printed catalogue already mailed out.
    self_check: Did you name the measurable condition for removal?
    reasoning_check: Can you identify the hidden premise behind API design, give a
      counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You removed it, or hollowed it out silently.
    expected: Deprecate, measure usage, notify, remove in a new version.
    actual: A changelog announcement, or returning null indefinitely.
    root_cause: Treating the API surface as implementation rather than as a contract.
    repair: Ask who you cannot deploy for before changing any response shape.
    reasoning_error: If your API design answer failed, classify the mistake as a fact,
      assumption, comparison, failure, or certainty error before proposing the smallest
      repair.
  recall:
    active_recall_cue: What condition must hold before you delete a public field?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind API design without presenting
      an assumption as a fact?
    black_box_probe: When the API design answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: rails-11-api-versioning-delayed-11
      prompt: >-
        Usage logs still show external clients requesting a field marked for removal. What changes in your deprecation decision?
      changed_constraint: >-
        supported clients still depend on the response field
      new_evidence: >-
        field usage remains nonzero across named client versions
      best_answer: >-
        I would keep the field through a documented compatibility window, contact the remaining consumers, and remove it only after usage and contract tests reach the agreed zero-use condition.
      distractors:
      - text: I would preserve every part of the original API design answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire API design explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/12-engineering-practice/cards/api-versioning-deprecation-and-contract-tests.md
    note: API versioning, deprecation and contract tests.
  - repo: original
    path: english-arcade/rails/api-versioning
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: 'Defend API design after a counterexample: which API design assumption
      changes, and what evidence keeps the revised API design choice honest?'
    goal: Move from the short API design answer to a deep, evidence-led defence without
      inventing an outcome.
  critical_thinking:
    problem_frame: >-
      An external client contract constrains removal of a response field; I must pair deprecation communication with usage evidence and a versioned migration path.
    claim_map:
      fact: >-
        Consumers outside the team depend on the response shape.
      inference: >-
        A field can be removed only after supported usage falls to the agreed threshold and a compatible version exists.
      assumption: >-
        I am assuming usage telemetry identifies client and version without exposing sensitive payloads.
      unknown: >-
        Remaining consumers, deprecation window, client upgrade path, and zero-use threshold are unknown.
    comparison:
      applicable: false
      rejected_alternative: >-
        Treating URL, header, and media-type versioning as interchangeable style choices would be a false equivalence: each changes client discovery, routing, and deprecation behavior.
      hard_constraint: >-
        The hard constraint is preserving existing client behavior while making the compatibility window and removal signal observable.
      decision_rule: >-
        Inventory clients and their upgrade path first; choose the version marker and sunset policy that those clients can actually adopt, then verify old and new contracts in parallel.
    failure_probe:
      kind: edge_case
      prompt: >-
        Which usage or contract-test result would let me retire the field without breaking a supported client?
    evidence_check:
      basis: Check the API design claim against system-design-estudos/areas/12-engineering-practice/cards/api-versioning-deprecation-and-contract-tests.md
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: This Rails exercise can test reasoning about API design, but it
        cannot prove an unmeasured production outcome, personal ownership, or universal
        rule.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        I am confident that unilateral removal is unsafe; the date and version boundary require consumer and usage evidence.
      update_trigger: >-
        Update when usage, client contact, or contract tests show a remaining dependency or a safe removal window.
    rubric:
      facts_correct: Names the verified API design facts without smuggling in a result,
        scale, or capability that the prompt does not establish.
      assumptions_explicit: Labels the API design premise that is still assumed and
        asks the smallest clarifying question that matters.
      alternatives_considered: Compares two credible API design options, or explains
        the hard constraint that makes comparison a false equivalence.
      tradeoff_quality: Connects the API design choice to a benefit, a cost or risk,
        and the condition under which another choice wins.
      follow_up_adaptation: Responds to the assumption challenge about API design
        by changing the claim or evidence boundary rather than repeating the base
        answer.
      certainty_calibration: Uses medium certainty deliberately and names the evidence
        that would update the API design recommendation.
- id: rails-12-pushing-back-on-scope
  version: 1.4.0
  target: rails
  topic: Stakeholder negotiation
  difficulty: 3
  interview_stage: behavioural_probe
  prompt: Product wants this shipped Friday and you think it is unsafe. What do you
    say to them?
  context: A negotiation probe. The interviewer wants to hear whether you can decline
    a deadline without becoming an obstacle, in language a non-engineer would accept.
  follow_up:
    prompt: Which safety constraint would you put in the Friday plan, and how would
      you offer a smaller reversible slice to product?
    goal: Answer the evidence challenge about Stakeholder negotiation while keeping
      the evidence boundary explicit.
    challenge_kind: evidence
    best_answer: >-
      I would put the untested production-volume migration behind a feature flag for internal
      users, define a rollback condition, and state which test would authorize a wider slice. That
      gives product a reversible Friday milestone while preserving the evidence needed before public
      exposure.
    distractors:
    - text: I would cite my experience with Stakeholder negotiation as enough proof
        and move on without naming an observation.
      why_wrong: Experience can guide a hypothesis, but it does not replace evidence
        tied to this context.
    - text: I would collect every possible metric about Stakeholder negotiation before
        making even a provisional recommendation.
      why_wrong: A focused decision can start with one discriminating observation
        rather than an unbounded data request.
  compression:
    prompt: Phrase the pushback as shared goal, concrete risk, and a reversible delivery
      option.
    goal: Compress the Stakeholder negotiation answer into its decision, premise,
      trade-off, and verification step.
  best_answer: 'I would name the specific risk rather than resisting the date. Something
    like: we can ship Friday if we put it behind a flag for internal users only, because
    the migration has not been tested at production volume yet. That gives them the
    date and me the safety.'
  distractors:
  - text: I would explain that it is not possible to ship safely by Friday and that
      we need more time to do it properly, because rushing it would create technical
      debt we would regret.
    trap: pragmatics
    why_wrong: Refuses without offering a path, which is how engineers acquire a reputation
      for blocking delivery.
  - text: I would ship it on Friday as requested, since product owns the prioritisation
      decision, and then raise my concerns in writing so there is a record if something
      goes wrong afterwards.
    trap: register
    why_wrong: Compliance plus a paper trail is defensive, and it protects you rather
      than the customer.
  - text: I would say the risk specific instead of resisting the date, like we can
      ship in Friday behind a flag for internal users, because the migration was not
      tested in production volume.
    trap: grammar
    why_wrong: Adjective order, "ship in Friday" and "tested in production volume"
      are all preposition and order errors.
  feedback:
    register: Collaborative, never obstructive. Offer the conditional yes.
    hedging: Hedge nothing about the risk; hedge the mitigation if it is unproven.
    precision: Name the untested thing. "It is risky" is not negotiable, "the migration
      is untested at volume" is.
    grammar: '"The specific risk", "ship on Friday", "at production volume".'
    pragmatics: Giving them the date while changing the exposure is the senior move.
  rephrase:
    prompt: Say the same thing in a message to a product manager, in two sentences.
    goal: Practise written negotiation register.
  language_focus:
  - pragmatics
  - register
  - grammar
  pt_help: 'Adjetivo vem antes do substantivo em ingles: "the specific risk", nunca
    "the risk specific".'
  feynman:
    concept: Conditional yes as a negotiation tool.
    explain_to: An engineer who says no to protect quality.
    constraint: Explain without using the words "technical debt".
    self_check: Did your answer preserve the date and reduce the exposure?
    reasoning_check: Can you identify the hidden premise behind Stakeholder negotiation,
      give a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You refused outright, or complied and documented dissent.
    expected: A conditional yes with the specific untested risk named.
    actual: A blocked deadline, or defensive compliance.
    root_cause: Framing safety and delivery as opposites rather than as scope levers.
    repair: Practise the form "we can ship X if we do Y, because Z is unverified".
    reasoning_error: If your Stakeholder negotiation answer failed, classify the mistake
      as a fact, assumption, comparison, failure, or certainty error before proposing
      the smallest repair.
  recall:
    active_recall_cue: What shape turns a refusal into a negotiation?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Stakeholder negotiation without
      presenting an assumption as a fact?
    black_box_probe: When the Stakeholder negotiation answer failed, did you locate
      the reasoning error before changing the implementation?
    delayed_variant:
      id: rails-12-pushing-back-on-scope-delayed-12
      prompt: >-
        A staging backfill fails at production-like volume two days before Friday. What reversible slice and evidence would you offer?
      changed_constraint: >-
        production-volume migration safety is still unverified
      new_evidence: >-
        the staging backfill exceeds the error or latency limit at representative volume
      best_answer: >-
        I would keep Friday behind an internal feature flag, define a rollback threshold, and offer a smaller slice only after a bounded backfill test supplies the evidence for wider exposure.
      distractors:
      - text: I would preserve every part of the original Stakeholder negotiation
          answer because changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Stakeholder negotiation explanation with
          a new design without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/12-engineering-practice/cards/progressive-delivery-and-feature-flags.md
    note: Progressive delivery and feature flags as scope levers.
  - repo: original
    path: english-arcade/rails/pushing-back-on-scope
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: 'Five more minutes on Stakeholder negotiation: which boundary, alternative,
      and update trigger would you explain for Stakeholder negotiation?'
    goal: Move from the short Stakeholder negotiation answer to a deep, evidence-led
      defence without inventing an outcome.
  critical_thinking:
    problem_frame: >-
      A Friday request conflicts with an untested production-volume risk; I must turn the concern into a reversible slice, a rollback condition, and evidence for expansion.
    claim_map:
      fact: >-
        Product wants a date while the engineer believes the release is unsafe.
      inference: >-
        A feature flag or internal cohort can preserve delivery progress while constraining exposure.
      assumption: >-
        I am assuming product can accept a smaller audience and an explicit rollback condition.
      unknown: >-
        Production volume, user impact, rollback speed, and acceptance threshold are unknown.
    comparison:
      applicable: true
      alternatives:
      - option: a narrow slice with an explicit acceptance metric and follow-up boundary
        benefit: I can deliver a reviewable result while measuring whether the proposed change solves the real problem.
        cost_or_risk: Some requested edge cases remain deferred and need a visible follow-up owner.
        valid_when: Use it when the deadline is fixed and the smallest safe outcome is clear.
      - option: accept the full scope before defining the success measure
        benefit: It may satisfy every request in one delivery if capacity and requirements are stable.
        cost_or_risk: Unknown work expands the risk of partial delivery and makes trade-offs invisible.
        valid_when: Use it only when dependencies, acceptance criteria, and capacity are already confirmed.
      decision_rule: I propose the smallest safe slice with a measurable acceptance check; I accept the full scope only when evidence shows it can be delivered without hiding risk.
    failure_probe:
