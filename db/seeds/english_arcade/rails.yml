- id: rails-04-strong-parameters
  version: 1.4.0
  target: rails
  topic: Security
  difficulty: 2
  interview_stage: technical_screen
  prompt: What is strong parameters actually protecting you from?
  context: A security-flavoured screen. The interviewer wants the specific attack
    named, because candidates often describe the mechanism without knowing what it
    prevents.
  follow_up:
    prompt: Which parameter should be rejected or permitted differently, and how would
      you test that a role cannot write an internal field?
    goal: Answer the failure challenge about Security while keeping the evidence boundary
      explicit.
    challenge_kind: failure
    best_answer: >-
      Mass assignment. If the failure in the follow-up appears, I would name the user
      or system consequence, contain it with a bounded mitigation, and verify recovery with a
      focused test or metric.
    distractors:
    - text: I would describe the Security failure as impossible because the happy
        path already passed its test.
      why_wrong: Passing a happy path does not test the boundary, failure mode, or
        recovery being challenged.
    - text: I would add retries to Security immediately and assume the system would
        become reliable.
      why_wrong: Retries can amplify load or duplicate effects; the failure and containment
        policy must be specified first.
  compression:
    prompt: Describe strong parameters as an input boundary, an allowed-field decision,
      and a negative authorization test.
    goal: Compress the Security answer into its decision, premise, trade-off, and
      verification step.
  best_answer: Mass assignment. Without it, a request could set any attribute the
    model exposes, so someone could submit an admin flag alongside their profile fields
    and escalate their own privileges. Permitting an explicit list means unexpected
    keys are ignored rather than trusted.
  distractors:
  - text: It protects against invalid data being saved to the database by making sure
      that only the correct parameters are permitted through to the model layer during
      an update.
    trap: precision
    why_wrong: Describes filtering as validation and never names privilege escalation,
      which is the actual threat.
  - text: It protects against SQL injection, because the parameters are sanitised
      before they reach the database and cannot be used to inject arbitrary queries
      into the application.
    trap: content
    why_wrong: Wrong vulnerability entirely; injection is handled by parameter binding
      in Active Record.
  - text: It protects of the mass assignment, because without this a request could
      to set any attribute that the model is exposing, like a flag of admin.
    trap: grammar
    why_wrong: '"Protects of", "could to set" and "a flag of admin" are three distinct
      transfer errors in one sentence.'
  feedback:
    register: Direct. Security answers should name the attack in the first two words.
    hedging: None. Naming the vulnerability is a factual claim.
    precision: Give the concrete escalation example; abstractions are unconvincing
      here.
    grammar: '"Protects against", "could set", "an admin flag".'
    pragmatics: Explaining the ignore-versus-trust behaviour pre-empts the follow-up
      about unexpected keys.
  rephrase:
    prompt: Explain the same risk in a sentence a non-technical stakeholder would
      act on.
    goal: Translate a security mechanism into business risk.
  language_focus:
  - precision
  - grammar
  - register
  pt_help: '"Proteger de" em ingles e "protect against". Preposicao fixa.'
  feynman:
    concept: Mass assignment and privilege escalation.
    explain_to: A stakeholder deciding whether to fund a security fix.
    constraint: Explain using a form with hidden extra fields.
    self_check: Did you name what an attacker gains, not just what is blocked?
    reasoning_check: Can you identify the hidden premise behind Security, give a counterexample,
      and explain how the evidence changes your conclusion?
  black_box:
    symptom: You described filtering, or named the wrong vulnerability.
    expected: Mass assignment, with a privilege-escalation example.
    actual: Validation language, or an SQL injection claim.
    root_cause: Security features learned as configuration rather than as threat responses.
    repair: For each protection you use, be able to name the attack it stops.
    reasoning_error: If your Security answer failed, classify the mistake as a fact,
      assumption, comparison, failure, or certainty error before proposing the smallest
      repair.
  recall:
    active_recall_cue: What can an attacker achieve without strong parameters?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Security without presenting
      an assumption as a fact?
    black_box_probe: When the Security answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: rails-04-strong-parameters-delayed-4
      prompt: 'Security gets a new constraint: new Security evidence contradicts the
        Security assumption that made the first option attractive. After a Security
        test exposes a boundary case that the Security examples did not cover, which
        Security assumption is no longer safe?'
      changed_constraint: new Security evidence contradicts the Security assumption
        that made the first option attractive
      new_evidence: a Security test exposes a boundary case that the Security examples
        did not cover
      best_answer: I would keep the facts that remain supported about Security, treat
        a Security test exposes a boundary case that the Security examples did not
        cover as new evidence rather than a result, and state the updated decision
        rule under new Security evidence contradicts the Security assumption that
        made the first option attractive. I would then name one focused check before
        treating the revised answer as settled.
      distractors:
      - text: I would preserve every part of the original Security answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Security explanation with a new design without
          identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
