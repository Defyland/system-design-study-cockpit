---
contract_version: 1.4.0
target:
  key: rails
  label: Ruby on Rails
  blurb: Explain the request lifecycle, query design and background work the way a
    senior Rails engineer does, with the failure mode named.
  focus_areas:
  - request lifecycle and boundaries
  - Active Record and query design
  - background jobs and idempotency
  - caching and invalidation
  - security and observability
  simulation:
    minutes: 45
    structure:
    - label: Lifecycle and boundaries warm-up
      minutes: 8
    - label: Query and data-access deep dive
      minutes: 15
    - label: Jobs, retries and idempotency
      minutes: 12
    - label: Security, caching and observability
      minutes: 10
  critical_thinking:
    learner_prompts:
      evidence_ledger: For Rails, record whether each claim about the Rails request
        boundary, persistence, jobs, security, and observability is a verified fact,
        an inference, an assumption, or an unknown before you defend it.
      problem_frame: Frame every Rails answer with the actor, requirement, constraint,
        success condition, and unanswered question that could change the decision.
      comparison: When Rails offers a real choice, compare two options by benefit,
        cost or risk, valid-when condition, and an explicit decision rule.
      failure_probe: Ask which counterexample, edge case, or failure mode could break
        the Rails recommendation, then state the smallest test or containment step.
      certainty_review: 'Calibrate certainty in Rails: name the evidence, separate
        correlation from causality, and say what new observation would make you revise
        the answer.'
    rubric:
      facts_correct: Names the verified the Rails request boundary, persistence, jobs,
        security, and observability facts without smuggling in a result or capability
        that the prompt does not establish.
      assumptions_explicit: Labels the Rails premise that is still assumed and asks
        the smallest clarifying question that matters.
      alternatives_considered: Considers a credible alternative for Rails, or explains
        the hard constraint that makes comparison a false equivalence.
      tradeoff_quality: Connects the Rails choice to a benefit, a cost or risk, and
        the condition under which another choice wins.
      follow_up_adaptation: Responds to an adversarial Rails follow-up by changing
        the claim or evidence boundary rather than repeating a memorised answer.
      certainty_calibration: Uses high, medium, or low certainty deliberately and
        names the evidence that would update the Rails recommendation.
cards:
- id: rails-card-n-plus-one
  front: How do you describe an N+1 without sounding rehearsed?
  back: 'Name the query count, the fix, and the check: "one query per row, fixed with
    includes, verified by asserting query count in a test".'
  box: 1
  source:
    repo: system-design-estudos
    path: areas/01-metodo-e-entrevistas/backend-interview-foundations/chapters/05-ruby-on-rails-interview-surface-area.md
    note: Rails interview surface area covering query problems.
  critical_thinking:
    cue: How do you describe an N+1 without sounding rehearsed? Before answering,
      separate the stated fact from your assumption and name one condition that could
      change it.
    check: For this Rails card, can you compare two options, name one failure mode,
      and state what evidence would update the recommendation?
- id: rails-card-idempotency
  front: What makes a job safe to retry?
  back: A stable idempotency key plus a uniqueness constraint at the database level,
    so a duplicate delivery collides instead of double-charging.
  box: 2
  source:
    repo: system-design-estudos
    path: chapters/chapter-03-idempotent-writes-under-ambiguous-failure.md
    note: Idempotent writes under ambiguous failure.
  critical_thinking:
    cue: What makes a job safe to retry? Before answering, separate the stated fact
      from your assumption and name one condition that could change it.
    check: For this Rails card, can you compare two options, name one failure mode,
      and state what evidence would update the recommendation?
- id: rails-card-cache-invalidation
  front: How do you talk about cache invalidation credibly?
  back: Prefer key-based expiry over manual deletion, and say what staleness the product
    can tolerate before choosing a TTL.
  box: 2
  source:
    repo: system-design-estudos
    path: areas/11-operational-playbooks/playbooks/cache-hot-key-and-origin-protection.md
    note: Cache and origin protection playbook.
  critical_thinking:
    cue: How do you talk about cache invalidation credibly? Before answering, separate
      the stated fact from your assumption and name one condition that could change
      it.
    check: For this Rails card, can you compare two options, name one failure mode,
      and state what evidence would update the recommendation?
items:
- id: rails-01-n-plus-one
  version: 1.4.0
  target: rails
  topic: Query design
  difficulty: 1
  interview_stage: technical_screen
  prompt: This index page is slow. What is the first thing you would look at?
  context: A listing page renders 50 records, each showing its author name. Response
    time grew as data grew. The interviewer wants a diagnosis, not a list of generic
    performance advice.
  follow_up:
    prompt: How would you prove the extra queries are the bottleneck, and which association
      or projection would you change first?
    goal: Answer the assumption challenge about Query design while keeping the evidence
      boundary explicit.
    challenge_kind: assumption
    best_answer: >-
      I would check the query log for an N+1 first, because the symptom scales
      with row count. I would label the follow-up premise as an assumption, ask the
      smallest question that could disprove it, and protect the edge case before committing to
      the recommendation.
    distractors:
    - text: I would repeat my original Query design answer with more confidence because
        the interviewer probably assumes the usual case.
      why_wrong: It hides the premise instead of checking whether the usual case is
        actually part of this problem.
    - text: I would stop proposing anything about Query design until every surrounding
        requirement had been documented in full.
      why_wrong: It treats uncertainty as a reason for paralysis and offers no bounded
        next step.
  compression:
    prompt: Reduce the diagnosis to query evidence, the smallest eager-loading or
      projection change, and the regression check.
    goal: Compress the Query design answer into its decision, premise, trade-off,
      and verification step.
  best_answer: I would check the query log for an N+1 first, because the symptom scales
    with row count. If each row triggers its own author lookup, the fix is preloading
    the association, and I would lock it in with a test that asserts the query count
    rather than trusting it stays fixed.
  distractors:
  - text: I would add caching to the page so that the expensive rendering only happens
      once, and then most requests would be served from the cache and would be much
      faster for users.
    trap: content
    why_wrong: Caches the symptom and leaves the N+1 in place, so the first request
      and every invalidation stay slow.
  - text: I would look at the database and see if there are any missing indexes, then
      I would probably add some indexes on the columns that are being used in the
      queries on that page.
    trap: precision
    why_wrong: Plausible but unfocused. The scaling-with-rows symptom points at query
      count, not at index selectivity.
  - text: I would verify the log of queries for to find an N+1, because this symptom
      is growing together with the number of rows that the page is showing to the
      user.
    trap: grammar
    why_wrong: '"For to find" and "is growing together with" are calques that make
      correct reasoning sound unsure.'
  feedback:
    register: Diagnostic and specific. Name the hypothesis before the fix.
    hedging: Hedge the hypothesis ("I would check first"), never the method.
    precision: 'Tie the symptom to the cause: cost scaling with row count means query
      count.'
    grammar: '"In order to find" or simply "to find"; "scales with the number of rows".'
    pragmatics: Mentioning the regression test answers the unasked question about
      durability.
  rephrase:
    prompt: Explain the same diagnosis to a product manager asking why the page got
      slow.
    goal: Keep the mechanism intact while dropping the jargon.
  language_focus:
  - precision
  - grammar
  - pragmatics
  pt_help: '"Para encontrar" e "to find". "For to" nao existe em ingles.'
  feynman:
    concept: N+1 queries and preloading.
    explain_to: A product manager who only sees the page being slow.
    constraint: Explain using a waiter making one trip per dish.
    self_check: Did you connect the symptom to why it grows with data?
    reasoning_check: Can you identify the hidden premise behind Query design, give
      a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You proposed caching or indexes before naming query count.
    expected: N+1 hypothesis, preload fix, query-count regression test.
    actual: A generic performance remedy applied without diagnosis.
    root_cause: Performance answers recalled as a menu of fixes rather than as a diagnosis.
    repair: Always state which symptom points at which cause before any fix.
    reasoning_error: If your Query design answer failed, classify the mistake as a
      fact, assumption, comparison, failure, or certainty error before proposing the
      smallest repair.
  recall:
    active_recall_cue: Which symptom distinguishes an N+1 from a missing index?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Query design without presenting
      an assumption as a fact?
    black_box_probe: When the Query design answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: rails-01-n-plus-one-delayed-1
      prompt: 'Query design: the later Query design review says a trace of Query design
        isolates a different Query design bottleneck than the one you named. Under
        the Query design workload for Query design no longer fits the original resource
        bound, which part of Query design survives and which Query design claim changes?'
      changed_constraint: the Query design workload for Query design no longer fits
        the original resource bound
      new_evidence: a trace of Query design isolates a different Query design bottleneck
        than the one you named
      best_answer: I would keep the facts that remain supported about Query design,
        treat a trace of Query design isolates a different Query design bottleneck
        than the one you named as new evidence rather than a result, and state the
        updated decision rule under the Query design workload for Query design no
        longer fits the original resource bound. I would then name one focused check
        before treating the revised answer as settled.
      distractors:
      - text: I would preserve every part of the original Query design answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Query design explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/01-metodo-e-entrevistas/backend-interview-foundations/chapters/05-ruby-on-rails-interview-surface-area.md
    note: Rails query problems expected in senior screens.
  - repo: original
    path: english-arcade/rails/n-plus-one
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: 'Query design: inspect Query design evidence next; which edge case for
      Query design would alter the trade-off?'
    goal: Move from the short Query design answer to a deep, evidence-led defence
      without inventing an outcome.
  critical_thinking:
    problem_frame: 'Frame Query design before proposing a solution: state the actor,
      required outcome, constraint, and unknown that could invalidate the first recommendation.'
    claim_map:
      fact: The prompt explicitly tests Query design within a Rails context; treat
        that named boundary as the verified starting fact.
      inference: The reasonable inference is that the answer must defend Query design,
        but that does not prove one implementation wins under every workload or audience.
      assumption: An unstated assumption is that the Query design constraint is the
        dominant one; label it and ask whether the interviewer confirms it.
      unknown: 'Still unknown for Query design: the scale, failure tolerance, ownership
        boundary, and evidence threshold that would change the decision.'
    comparison:
      applicable: false
      rejected_alternative: A tool-first A-versus-B debate about Query design would
        be a false equivalence because the prompt does not establish that both choices
        satisfy the same contract.
      hard_constraint: The hard Query design constraint is the required guarantee
        stated by the interviewer; no missing measurement licenses a stronger comparison.
      decision_rule: Do not manufacture a trade-off for Query design; first clarify
        the constraint or collect the evidence that would make two options genuinely
        comparable.
    failure_probe:
      kind: counterexample
      prompt: 'Query design: what minimum input for Query design would break the Query
        design recommendation, and how would you revise the Query design claim?'
    evidence_check:
      basis: Check the Query design claim against system-design-estudos/areas/01-metodo-e-entrevistas/backend-interview-foundations/chapters/05-ruby-on-rails-interview-surface-area.md
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: This Rails exercise can test reasoning about Query design, but it
        cannot prove an unmeasured production outcome, personal ownership, or universal
        rule.
      checked_on: '2026-08-25'
    certainty:
      level: high
      rationale: Certainty is high because the prompt bounds the Query design question
        but does not reveal every workload, stakeholder priority, or outcome.
      update_trigger: For case "This index page is slow. What is", update Query design
        when Query design evidence—a Query design trace or Query design test—contradicts
        the Query design constraint in case "This index page is slow. What is"; ask
        a stakeholder about Query design before revising.
    rubric:
      facts_correct: Names the verified Query design facts without smuggling in a
        result, scale, or capability that the prompt does not establish.
      assumptions_explicit: Labels the Query design premise that is still assumed
        and asks the smallest clarifying question that matters.
      alternatives_considered: Compares two credible Query design options, or explains
        the hard constraint that makes comparison a false equivalence.
      tradeoff_quality: Connects the Query design choice to a benefit, a cost or risk,
        and the condition under which another choice wins.
      follow_up_adaptation: Responds to the assumption challenge about Query design
        by changing the claim or evidence boundary rather than repeating the base
        answer.
      certainty_calibration: Uses high certainty deliberately and names the evidence
        that would update the Query design recommendation.
- id: rails-02-transaction-boundaries
  version: 1.4.0
  target: rails
  topic: Transactions
  difficulty: 3
  interview_stage: deep_dive
  prompt: Why should you avoid enqueueing a job inside a transaction?
  context: A payment flow writes a record and enqueues a confirmation email in the
    same transaction. The interviewer is checking whether you understand the race
    rather than merely repeating the rule.
  follow_up:
    prompt: Which database state must be committed before the worker can safely observe
      the record, and how would you handle a rollback?
    goal: Answer the evidence challenge about Transactions while keeping the evidence
      boundary explicit.
    challenge_kind: evidence
    best_answer: >-
      Because the worker can pick the job up before the transaction commits, and then
      it queries a row that does not exist yet. I would treat the follow-up
      observation as evidence, not as proof of impact; I would inspect the smallest relevant
      trace or test and state what remains uncertain before changing the decision.
    distractors:
    - text: I would cite my experience with Transactions as enough proof and move
        on without naming an observation.
      why_wrong: Experience can guide a hypothesis, but it does not replace evidence
        tied to this context.
    - text: I would collect every possible metric about Transactions before making
        even a provisional recommendation.
      why_wrong: A focused decision can start with one discriminating observation
        rather than an unbounded data request.
  compression:
    prompt: Explain the transaction boundary as commit point, enqueue timing, and
      the duplicate or rollback behavior.
    goal: Compress the Transactions answer into its decision, premise, trade-off,
      and verification step.
  best_answer: Because the worker can pick the job up before the transaction commits,
    and then it queries a row that does not exist yet. I would enqueue after commit,
    using an after_commit callback or an outbox row written inside the same transaction
    and dispatched separately.
  distractors:
  - text: Because transactions should be kept as short as possible, and enqueueing
      a job inside one holds the database connection for longer than necessary while
      the queue write happens.
    trap: content
    why_wrong: Names a real but secondary concern; the actual failure is the worker
      racing the commit and finding nothing.
  - text: Because it can cause problems with consistency if the transaction rolls
      back later on, which could leave the system in a state that is not entirely
      correct.
    trap: precision
    why_wrong: Gestures at inconsistency without naming the race, so it does not demonstrate
      the mechanism.
  - text: Because the worker can catch the job before the transaction do the commit,
      and after it makes a query for a row that is not existing yet in the database.
    trap: grammar
    why_wrong: '"Do the commit", "makes a query for" and "is not existing" all break
      idiom and verb aspect.'
  feedback:
    register: Precise and unhurried; this is a mechanism question.
    hedging: None needed. The race is deterministic enough to state plainly.
    precision: Say "before the transaction commits" and "the row does not exist yet".
    grammar: '"Before the transaction commits", "queries a row", "does not exist yet".'
    pragmatics: Offering both after_commit and the outbox shows you know the scaling
      path.
  rephrase:
    prompt: Explain the same race to a developer who has never seen it happen.
    goal: Make an invisible timing bug concrete.
  language_focus:
  - precision
  - grammar
  - hedging
  feynman:
    concept: Commit-visibility race between writer and worker.
    explain_to: A developer who thinks the queue is instant.
    constraint: Explain using a letter posted before the address is written.
    self_check: Did you say what the worker sees when it wins the race?
    reasoning_check: Can you identify the hidden premise behind Transactions, give
      a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You cited transaction length or vague inconsistency.
    expected: Worker reads before commit; fix with after_commit or outbox.
    actual: A secondary concern, or unnamed "consistency problems".
    root_cause: The rule learned as a convention without ever seeing the failure.
    repair: Practise describing the interleaving in two clauses.
    reasoning_error: If your Transactions answer failed, classify the mistake as a
      fact, assumption, comparison, failure, or certainty error before proposing the
      smallest repair.
  recall:
    active_recall_cue: What does the worker find if it dequeues before the commit
      lands?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Transactions without presenting
      an assumption as a fact?
    black_box_probe: When the Transactions answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: rails-02-transaction-boundaries-delayed-2
      prompt: 'Review note for Transactions: a code inspection of Transactions confirms
        the Transactions mechanism but not its impact. Given a stakeholder asks for
        a stronger Transactions guarantee than the first Transactions answer promised,
        what would you now defend, retract, and verify about Transactions?'
      changed_constraint: a stakeholder asks for a stronger Transactions guarantee
        than the first Transactions answer promised
      new_evidence: a code inspection of Transactions confirms the Transactions mechanism
        but not its impact
      best_answer: I would keep the facts that remain supported about Transactions,
        treat a code inspection of Transactions confirms the Transactions mechanism
        but not its impact as new evidence rather than a result, and state the updated
        decision rule under a stakeholder asks for a stronger Transactions guarantee
        than the first Transactions answer promised. I would then name one focused
        check before treating the revised answer as settled.
      distractors:
      - text: I would preserve every part of the original Transactions answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Transactions explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: chapters/chapter-03-idempotent-writes-under-ambiguous-failure.md
    note: Write-path ordering and ambiguous failure.
  - repo: original
    path: english-arcade/rails/transaction-boundaries
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: 'Deep dive on Transactions: compare Transactions options with one measurement;
      which failure around Transactions would make Transactions switch?'
    goal: Move from the short Transactions answer to a deep, evidence-led defence
      without inventing an outcome.
  critical_thinking:
    problem_frame: 'Frame Transactions before proposing a solution: state the actor,
      required outcome, constraint, and unknown that could invalidate the first recommendation.'
    claim_map:
      fact: The prompt explicitly tests Transactions within a Rails context; treat
        that named boundary as the verified starting fact.
      inference: The reasonable inference is that the answer must defend Transactions,
        but that does not prove one implementation wins under every workload or audience.
      assumption: An unstated assumption is that the Transactions constraint is the
        dominant one; label it and ask whether the interviewer confirms it.
      unknown: 'Still unknown for Transactions: the scale, failure tolerance, ownership
        boundary, and evidence threshold that would change the decision.'
    comparison:
      applicable: true
      alternatives:
      - option: a measured Rails boundary change for Transactions
        benefit: It keeps the Transactions reasoning close to the stated Rails constraint
          and makes the evidence boundary visible.
        cost_or_risk: It can be too narrow if the Transactions workload or requirement
          changes beyond the prompt.
        valid_when: Use it when the stated Transactions contract and its invariant
          are the facts that matter most.
      - option: a broader cache or framework-level workaround for Transactions
        benefit: It can make the Transactions boundary more explicit when the first
          option's hidden assumption is not guaranteed.
        cost_or_risk: It adds implementation or communication cost and may solve a
          problem the Transactions evidence has not established.
        valid_when: Use it when a measured constraint, requirement, or failure mode
          makes the first option unsafe.
      decision_rule: Choose the first Transactions option when its stated contract
        holds; choose the alternative only when evidence shows that the relevant Rails
        constraint makes the first assumption unsafe.
    failure_probe:
      kind: edge_case
      prompt: 'Transactions: what Transactions limit should you probe before trusting
        the answer, and how would Transactions behave there?'
    evidence_check:
      basis: Check the Transactions claim against system-design-estudos/chapters/chapter-03-idempotent-writes-under-ambiguous-failure.md
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: This Rails exercise can test reasoning about Transactions, but it
        cannot prove an unmeasured production outcome, personal ownership, or universal
        rule.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: Certainty is medium because the prompt bounds the Transactions question
        but does not reveal every workload, stakeholder priority, or outcome.
      update_trigger: For case "Why should you avoid enqueueing a job", update Transactions
        when Transactions evidence—a Transactions trace or Transactions test—contradicts
        the Transactions constraint in case "Why should you avoid enqueueing a job";
        ask a stakeholder about Transactions before revising.
    rubric:
      facts_correct: Names the verified Transactions facts without smuggling in a
        result, scale, or capability that the prompt does not establish.
      assumptions_explicit: Labels the Transactions premise that is still assumed
        and asks the smallest clarifying question that matters.
      alternatives_considered: Compares two credible Transactions options, or explains
        the hard constraint that makes comparison a false equivalence.
      tradeoff_quality: Connects the Transactions choice to a benefit, a cost or risk,
        and the condition under which another choice wins.
      follow_up_adaptation: Responds to the evidence challenge about Transactions
        by changing the claim or evidence boundary rather than repeating the base
        answer.
      certainty_calibration: Uses medium certainty deliberately and names the evidence
        that would update the Transactions recommendation.
- id: rails-03-idempotent-jobs
  version: 1.4.0
  target: rails
  topic: Background jobs
  difficulty: 3
  interview_stage: architecture_review
  prompt: Your job runs twice for the same payment. How do you make that safe?
  context: At-least-once delivery means duplicates are normal, not exceptional. The
    interviewer wants to hear a database-level guarantee rather than an application-level
    check.
  follow_up:
    prompt: What idempotency key and durable state would let a retry distinguish the
      same payment from a changed request?
    goal: Answer the alternative challenge about Background jobs while keeping the
      evidence boundary explicit.
    challenge_kind: alternative
    best_answer: >-
      I would derive an idempotency key from the payment, store it with a unique
      index, and let the second insert fail on the constraint. I would compare that
      choice with the credible alternative against the requirement in the follow-up, cost, and failure
      risk, then switch only if evidence makes the alternative safer.
    distractors:
    - text: I would defend the first Background jobs option because offering an alternative
        might make the decision look uncertain.
      why_wrong: A comparison makes the decision rule visible; it does not weaken
        a well-calibrated recommendation.
    - text: I would list every conceivable Background jobs design without saying which
        requirement should decide between them.
      why_wrong: An option list without a decision rule avoids the trade-off the follow-up
        is testing.
  compression:
    prompt: Summarize the job design with the replay key, atomic state transition,
      and safe external-effect policy.
    goal: Compress the Background jobs answer into its decision, premise, trade-off,
      and verification step.
  best_answer: I would derive an idempotency key from the payment, store it with a
    unique index, and let the second insert fail on the constraint. Checking in Ruby
    first is a race; the constraint holds under concurrency.
  distractors:
  - text: At the start of the job I would check whether the payment has already been
      processed, and if it has I would return early without doing the work a second
      time.
    trap: content
    why_wrong: A read-then-write check is exactly the race the question targets; two
      workers can both read "not processed".
  - text: I would configure the queue so that jobs are only delivered once, which
      removes the duplicate problem at the source rather than handling it inside the
      job itself.
    trap: content
    why_wrong: Exactly-once delivery is not something a queue can generally promise;
      the design must tolerate duplicates.
  - text: I would make an idempotency key of the payment and save it with a unique
      index, then the second insert will broke in the constraint instead of processing
      again.
    trap: grammar
    why_wrong: '"Make a key of", "will broke" and "break in the constraint" are form
      and idiom errors on otherwise correct reasoning.'
  feedback:
    register: Firm and architectural. Guarantees belong in the database.
    hedging: No hedging; the constraint either exists or it does not.
    precision: Contrast the race explicitly with the constraint that removes it.
    grammar: '"Derive a key from", "the insert will fail on the constraint".'
    pragmatics: Pre-empting the naive check shows you have hit this in production.
  rephrase:
    prompt: Give the same answer while explaining why at-least-once delivery is normal.
    goal: Connect the fix to the delivery guarantee that forces it.
  language_focus:
  - precision
  - grammar
  - register
  feynman:
    concept: Idempotency keys enforced by a unique constraint.
    explain_to: A developer who trusts an if-statement to prevent duplicates.
    constraint: Explain using two people booking the same seat.
    self_check: Did you explain why the Ruby-side check is insufficient?
    reasoning_check: Can you identify the hidden premise behind Background jobs, give
      a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You proposed a read-then-write check or exactly-once delivery.
    expected: Idempotency key plus a database uniqueness constraint.
    actual: An application-level guard, or reliance on the queue.
    root_cause: Concurrency reasoned about sequentially, so the interleaving is invisible.
    repair: For any duplicate-prevention answer, ask where two workers could interleave.
    reasoning_error: If your Background jobs answer failed, classify the mistake as
      a fact, assumption, comparison, failure, or certainty error before proposing
      the smallest repair.
  recall:
    active_recall_cue: Why is a uniqueness constraint safer than an existence check?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Background jobs without presenting
      an assumption as a fact?
    black_box_probe: When the Background jobs answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
