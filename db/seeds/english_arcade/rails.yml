---
contract_version: 1.4.0
target:
  key: rails
  label: Ruby on Rails
  blurb: Explain the request lifecycle, query design and background work the way a
    senior Rails engineer does, with the failure mode named.
  focus_areas:
  - request lifecycle and boundaries
  - Active Record and query design
  - background jobs and idempotency
  - caching and invalidation
  - security and observability
  simulation:
    minutes: 45
    structure:
    - label: Lifecycle and boundaries warm-up
      minutes: 8
    - label: Query and data-access deep dive
      minutes: 15
    - label: Jobs, retries and idempotency
      minutes: 12
    - label: Security, caching and observability
      minutes: 10
  critical_thinking:
    learner_prompts:
      evidence_ledger: For Rails, record whether each claim about the Rails request
        boundary, persistence, jobs, security, and observability is a verified fact,
        an inference, an assumption, or an unknown before you defend it.
      problem_frame: Frame every Rails answer with the actor, requirement, constraint,
        success condition, and unanswered question that could change the decision.
      comparison: When Rails offers a real choice, compare two options by benefit,
        cost or risk, valid-when condition, and an explicit decision rule.
      failure_probe: Ask which counterexample, edge case, or failure mode could break
        the Rails recommendation, then state the smallest test or containment step.
      certainty_review: 'Calibrate certainty in Rails: name the evidence, separate
        correlation from causality, and say what new observation would make you revise
        the answer.'
    rubric:
      facts_correct: Names the verified the Rails request boundary, persistence, jobs,
        security, and observability facts without smuggling in a result or capability
        that the prompt does not establish.
      assumptions_explicit: Labels the Rails premise that is still assumed and asks
        the smallest clarifying question that matters.
      alternatives_considered: Considers a credible alternative for Rails, or explains
        the hard constraint that makes comparison a false equivalence.
      tradeoff_quality: Connects the Rails choice to a benefit, a cost or risk, and
        the condition under which another choice wins.
      follow_up_adaptation: Responds to an adversarial Rails follow-up by changing
        the claim or evidence boundary rather than repeating a memorised answer.
      certainty_calibration: Uses high, medium, or low certainty deliberately and
        names the evidence that would update the Rails recommendation.
cards:
- id: rails-card-n-plus-one
  front: How do you describe an N+1 without sounding rehearsed?
  back: 'I would name the query count, the fix, and the check: "one query per row, fixed with
    includes, verified by asserting query count in a test".'
  box: 1
  source:
    repo: system-design-estudos
    path: areas/01-metodo-e-entrevistas/backend-interview-foundations/chapters/05-ruby-on-rails-interview-surface-area.md
    note: Rails interview surface area covering query problems.
  critical_thinking:
    cue: How do you describe an N+1 without sounding rehearsed? Before answering,
      separate the stated fact from your assumption and name one condition that could
      change it.
    check: For this Rails card, can you compare two options, name one failure mode,
      and state what evidence would update the recommendation?
- id: rails-card-idempotency
  front: What makes a job safe to retry?
  back: I would use a stable local idempotency key and an atomic result record, then
    pass a provider idempotency key or reconcile status before retrying. A local
    uniqueness constraint contains the application race; it cannot alone prevent an
    external double charge.
  box: 2
  source:
    repo: system-design-estudos
    path: chapters/chapter-03-idempotent-writes-under-ambiguous-failure.md
    note: Idempotent writes under ambiguous failure.
  critical_thinking:
    cue: What makes a job safe to retry? Before answering, separate the stated fact
      from your assumption and name one condition that could change it.
    check: For this Rails card, can you compare two options, name one failure mode,
      and state what evidence would update the recommendation?
- id: rails-card-cache-invalidation
  front: How do you talk about cache invalidation credibly?
  back: I would prefer key-based expiry over manual deletion, and I would state the
    staleness the product can tolerate before choosing a TTL.
  box: 2
  source:
    repo: system-design-estudos
    path: areas/11-operational-playbooks/playbooks/cache-hot-key-and-origin-protection.md
    note: Cache and origin protection playbook.
  critical_thinking:
    cue: How do you talk about cache invalidation credibly? Before answering, separate
      the stated fact from your assumption and name one condition that could change
      it.
    check: For this Rails card, can you compare two options, name one failure mode,
      and state what evidence would update the recommendation?
items:
- id: rails-01-n-plus-one
  version: 1.4.0
  target: rails
  topic: Query design
  difficulty: 1
  interview_stage: technical_screen
  prompt: This index page is slow. What is the first thing you would look at?
  context: A listing page renders 50 records, each showing its author name. Response
    time grew as data grew. The interviewer wants a diagnosis, not a list of generic
    performance advice.
  follow_up:
    prompt: How would you prove the extra queries are the bottleneck, and which association
      or projection would you change first?
    goal: Answer the assumption challenge about Query design while keeping the evidence
      boundary explicit.
    challenge_kind: assumption
    best_answer: >-
      I would check the query log for an N+1 first, because the symptom scales
      with row count. I would compare the query count before and after preloading, confirm that
      author lookup is the repeated query, and add a query-count regression test. If the trace
      instead points to serialization, I would project only the needed author fields; I would not
      change the query until the trace and plan identify the bottleneck.
    distractors:
    - text: I would repeat my original Query design answer with more confidence because
        the interviewer probably assumes the usual case.
      why_wrong: It hides the premise instead of checking whether the usual case is
        actually part of this problem.
    - text: I would stop proposing anything about Query design until every surrounding
        requirement had been documented in full.
      why_wrong: It treats uncertainty as a reason for paralysis and offers no bounded
        next step.
  compression:
    prompt: Reduce the diagnosis to query evidence, the smallest eager-loading or
      projection change, and the regression check.
    goal: Compress the Query design answer into its decision, premise, trade-off,
      and verification step.
  best_answer: I would check the query log for an N+1 first, because the symptom scales
    with row count. If each row triggers its own author lookup, the fix is preloading
    the association, and I would lock it in with a test that asserts the query count
    rather than trusting it stays fixed.
  distractors:
  - text: I would add caching to the page so that the expensive rendering only happens
      once, and then most requests would be served from the cache and would be much
      faster for users.
    trap: content
    why_wrong: Caches the symptom and leaves the N+1 in place, so the first request
      and every invalidation stay slow.
  - text: I would look at the database and see if there are any missing indexes, then
      I would probably add some indexes on the columns that are being used in the
      queries on that page.
    trap: precision
    why_wrong: Plausible but unfocused. The scaling-with-rows symptom points at query
      count, not at index selectivity.
  - text: I would verify the log of queries for to find an N+1, because this symptom
      is growing together with the number of rows that the page is showing to the
      user.
    trap: grammar
    why_wrong: '"For to find" and "is growing together with" are calques that make
      correct reasoning sound unsure.'
  feedback:
    register: Diagnostic and specific. Name the hypothesis before the fix.
    hedging: Hedge the hypothesis ("I would check first"), never the method.
    precision: 'Tie the symptom to the cause: cost scaling with row count means query
      count.'
    grammar: '"In order to find" or simply "to find"; "scales with the number of rows".'
    pragmatics: Mentioning the regression test answers the unasked question about
      durability.
  rephrase:
    prompt: Explain the same diagnosis to a product manager asking why the page got
      slow.
    goal: Keep the mechanism intact while dropping the jargon.
  language_focus:
  - precision
  - grammar
  - pragmatics
  pt_help: '"Para encontrar" e "to find". "For to" nao existe em ingles.'
  feynman:
    concept: N+1 queries and preloading.
    explain_to: A product manager who only sees the page being slow.
    constraint: Explain using a waiter making one trip per dish.
    self_check: Did you connect the symptom to why it grows with data?
    reasoning_check: Can you identify the hidden premise behind Query design, give
      a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You proposed caching or indexes before naming query count.
    expected: N+1 hypothesis, preload fix, query-count regression test.
    actual: A generic performance remedy applied without diagnosis.
    root_cause: Performance answers recalled as a menu of fixes rather than as a diagnosis.
    repair: Always state which symptom points at which cause before any fix.
    reasoning_error: If your Query design answer failed, classify the mistake as a
      fact, assumption, comparison, failure, or certainty error before proposing the
      smallest repair.
  recall:
    active_recall_cue: Which symptom distinguishes an N+1 from a missing index?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Query design without presenting
      an assumption as a fact?
    black_box_probe: When the Query design answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: rails-01-n-plus-one-delayed-1
      prompt: >-
        A trace now shows author serialization dominates this page while the query count stays bounded. What claim survives, and what would you measure before changing the fix?
      changed_constraint: >-
        the serializer, rather than association lookup, dominates measured time
      new_evidence: >-
        a request trace attributes most time to author serialization and shows no query-count growth
      best_answer: >-
        I would keep query-count measurement as a guard, narrow the preload change to the association only if the trace still needs it, and measure serializer projection and request timing before calling a cache or index the fix.
      distractors:
      - text: I would preserve every part of the original Query design answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Query design explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/01-metodo-e-entrevistas/backend-interview-foundations/chapters/05-ruby-on-rails-interview-surface-area.md
    note: Rails query problems expected in senior screens.
  - repo: original
    path: english-arcade/rails/n-plus-one
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: 'Query design: inspect Query design evidence next; which edge case for
      Query design would alter the trade-off?'
    goal: Move from the short Query design answer to a deep, evidence-led defence
      without inventing an outcome.
  critical_thinking:
    problem_frame: >-
      The page has a row-count-scaled latency symptom and an author association; I must distinguish query multiplicity from serialization or plan cost before choosing a fix.
    claim_map:
      fact: >-
        The prompt establishes a listing with repeated author display and worsening response time.
      inference: >-
        An N+1 is plausible because work scales with rows, but the trace must show repeated author queries before preload is the right fix.
      assumption: >-
        I am assuming association lookup, rather than serialization or a database plan, dominates the measured time.
      unknown: >-
        The query count, row width, serializer cost, and representative trace are still unknown.
    comparison:
      applicable: false
      rejected_alternative: >-
        Treating preload, serializer work, and an index as interchangeable fixes would be a false equivalence: each addresses a different measured cost.
      hard_constraint: >-
        The hard constraint is to keep the listing contract while identifying whether repeated queries, row width, or database planning dominates.
      decision_rule: >-
        Capture query count and a representative trace first; choose preload only when repeated association queries explain the latency, and choose projection or a plan change when those measurements point elsewhere.
    failure_probe:
      kind: counterexample
      prompt: >-
        What observation would show that the first request is slow because of serialization or a plan rather than N+1 queries?
    evidence_check:
      basis: Check the Query design claim against system-design-estudos/areas/01-metodo-e-entrevistas/backend-interview-foundations/chapters/05-ruby-on-rails-interview-surface-area.md
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: This Rails exercise can test reasoning about Query design, but it
        cannot prove an unmeasured production outcome, personal ownership, or universal
        rule.
      checked_on: '2026-08-25'
    certainty:
      level: high
      rationale: >-
        I keep high confidence in measuring query count, but the remedy remains provisional until the trace identifies the dominant cost.
      update_trigger: >-
        Update when a query trace, query-count test, or serializer profile contradicts repeated author lookup; keep the regression check even if the fix changes.
    rubric:
      facts_correct: Names the verified Query design facts without smuggling in a
        result, scale, or capability that the prompt does not establish.
      assumptions_explicit: Labels the Query design premise that is still assumed
        and asks the smallest clarifying question that matters.
      alternatives_considered: Compares two credible Query design options, or explains
        the hard constraint that makes comparison a false equivalence.
      tradeoff_quality: Connects the Query design choice to a benefit, a cost or risk,
        and the condition under which another choice wins.
      follow_up_adaptation: Responds to the assumption challenge about Query design
        by changing the claim or evidence boundary rather than repeating the base
        answer.
      certainty_calibration: Uses high certainty deliberately and names the evidence
        that would update the Query design recommendation.
- id: rails-02-transaction-boundaries
  version: 1.4.0
  target: rails
  topic: Transactions
  difficulty: 3
  interview_stage: deep_dive
  prompt: Why should you avoid enqueueing a job inside a transaction?
  context: A payment flow writes a record and enqueues a confirmation email in the
    same transaction. The interviewer is checking whether you understand the race
    rather than merely repeating the rule.
  follow_up:
    prompt: Which database state must be committed before the worker can safely observe
      the record, and how would you handle a rollback?
    goal: Answer the evidence challenge about Transactions while keeping the evidence
      boundary explicit.
    challenge_kind: evidence
    best_answer: >-
      Because the worker can pick the job up before the transaction commits, and then
      it queries a row that does not exist yet. I would wait for commit before dispatching. An
      after_commit callback means a rollback emits no email; an outbox keeps the delivery intent in
      the same transaction and lets a worker retry it later. I would test rollback, a worker racing
      the commit, and duplicate delivery before choosing the simpler callback.
    distractors:
    - text: I would cite my experience with Transactions as enough proof and move
        on without naming an observation.
      why_wrong: Experience can guide a hypothesis, but it does not replace evidence
        tied to this context.
    - text: I would collect every possible metric about Transactions before making
        even a provisional recommendation.
      why_wrong: A focused decision can start with one discriminating observation
        rather than an unbounded data request.
  compression:
    prompt: Explain the transaction boundary as commit point, enqueue timing, and
      the duplicate or rollback behavior.
    goal: Compress the Transactions answer into its decision, premise, trade-off,
      and verification step.
  best_answer: Because the worker can pick the job up before the transaction commits,
    and then it queries a row that does not exist yet. I would enqueue after commit,
    using an after_commit callback or an outbox row written inside the same transaction
    and dispatched separately.
  distractors:
  - text: Because transactions should be kept as short as possible, and enqueueing
      a job inside one holds the database connection for longer than necessary while
      the queue write happens.
    trap: content
    why_wrong: Names a real but secondary concern; the actual failure is the worker
      racing the commit and finding nothing.
  - text: Because it can cause problems with consistency if the transaction rolls
      back later on, which could leave the system in a state that is not entirely
      correct.
    trap: precision
    why_wrong: Gestures at inconsistency without naming the race, so it does not demonstrate
      the mechanism.
  - text: Because the worker can catch the job before the transaction do the commit,
      and after it makes a query for a row that is not existing yet in the database.
    trap: grammar
    why_wrong: '"Do the commit", "makes a query for" and "is not existing" all break
      idiom and verb aspect.'
  feedback:
    register: Precise and unhurried; this is a mechanism question.
    hedging: None needed. The race is deterministic enough to state plainly.
    precision: Say "before the transaction commits" and "the row does not exist yet".
    grammar: '"Before the transaction commits", "queries a row", "does not exist yet".'
    pragmatics: Offering both after_commit and the outbox shows you know the scaling
      path.
  rephrase:
    prompt: Explain the same race to a developer who has never seen it happen.
    goal: Make an invisible timing bug concrete.
  language_focus:
  - precision
  - grammar
  - hedging
  feynman:
    concept: Commit-visibility race between writer and worker.
    explain_to: A developer who thinks the queue is instant.
    constraint: Explain using a letter posted before the address is written.
    self_check: Did you say what the worker sees when it wins the race?
    reasoning_check: Can you identify the hidden premise behind Transactions, give
      a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You cited transaction length or vague inconsistency.
    expected: Worker reads before commit; fix with after_commit or outbox.
    actual: A secondary concern, or unnamed "consistency problems".
    root_cause: The rule learned as a convention without ever seeing the failure.
    repair: Practise describing the interleaving in two clauses.
    reasoning_error: If your Transactions answer failed, classify the mistake as a
      fact, assumption, comparison, failure, or certainty error before proposing the
      smallest repair.
  recall:
    active_recall_cue: What does the worker find if it dequeues before the commit
      lands?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Transactions without presenting
      an assumption as a fact?
    black_box_probe: When the Transactions answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: rails-02-transaction-boundaries-delayed-2
      prompt: >-
        A worker ran before commit in a staging replay, while an outbox row was present after rollback. Which delivery boundary would you defend and what would you test?
      changed_constraint: >-
        the worker must observe only committed state and rollback must not publish an email
      new_evidence: >-
        the replay shows a worker can see a job before the row commits, while rollback removes the outbox row
      best_answer: >-
        I would dispatch after commit or from a transactional outbox, test worker-before-commit and rollback, and verify duplicate delivery handling before treating the callback as sufficient.
      distractors:
      - text: I would preserve every part of the original Transactions answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Transactions explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: chapters/chapter-03-idempotent-writes-under-ambiguous-failure.md
    note: Write-path ordering and ambiguous failure.
  - repo: original
    path: english-arcade/rails/transaction-boundaries
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: 'Deep dive on Transactions: compare Transactions options with one measurement;
      which failure around Transactions would make Transactions switch?'
    goal: Move from the short Transactions answer to a deep, evidence-led defence
      without inventing an outcome.
  critical_thinking:
    problem_frame: >-
      A payment record and confirmation side effect cross a commit boundary; I must decide when a worker may observe durable state and how rollback affects delivery.
    claim_map:
      fact: >-
        A worker can run before the transaction commits if enqueue happens inside it.
      inference: >-
        An after_commit callback is simple, while an outbox preserves delivery intent transactionally and supports retries.
      assumption: >-
        I am assuming the email can tolerate asynchronous delivery and does not need to be sent before commit.
      unknown: >-
        The worker race window, rollback behavior, duplicate policy, and delivery freshness target are unknown.
    comparison:
      applicable: true
      alternatives:
      - option: a transactional outbox row written with the domain change
        benefit: I get durable intent and can lease, retry, and audit publication after commit without exposing a pre-commit job.
        cost_or_risk: I must operate an outbox relay and reconcile duplicates; it adds storage and recovery work.
        valid_when: Use it when delivery, auditability, or recovery matters beyond the local transaction.
      - option: an after_commit enqueue of an idempotent job
        benefit: It is smaller when the queue is the only durable hand-off and the job can safely reload committed state.
        cost_or_risk: A queue outage delays dispatch, and the callback gives less durable visibility into what still needs delivery.
        valid_when: Use it when the post-commit queue is reliable and no separate delivery audit is required.
      decision_rule: I choose the outbox when durable intent or reconciliation is a requirement; I keep after_commit when the simpler queue hand-off meets the measured contract.
    failure_probe:
      kind: edge_case
      prompt: >-
        What happens if the worker starts before commit or the transaction rolls back after enqueue?
    evidence_check:
      basis: Check the Transactions claim against system-design-estudos/chapters/chapter-03-idempotent-writes-under-ambiguous-failure.md
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: This Rails exercise can test reasoning about Transactions, but it
        cannot prove an unmeasured production outcome, personal ownership, or universal
        rule.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        I am highly certain about the pre-commit visibility race; the choice between callback and outbox depends on retry and audit requirements.
      update_trigger: >-
        Update when a race test, rollback test, or delivery contract requires durable intent beyond after_commit.
    rubric:
      facts_correct: Names the verified Transactions facts without smuggling in a
        result, scale, or capability that the prompt does not establish.
      assumptions_explicit: Labels the Transactions premise that is still assumed
        and asks the smallest clarifying question that matters.
      alternatives_considered: Compares two credible Transactions options, or explains
        the hard constraint that makes comparison a false equivalence.
      tradeoff_quality: Connects the Transactions choice to a benefit, a cost or risk,
        and the condition under which another choice wins.
      follow_up_adaptation: Responds to the evidence challenge about Transactions
        by changing the claim or evidence boundary rather than repeating the base
        answer.
      certainty_calibration: Uses medium certainty deliberately and names the evidence
        that would update the Transactions recommendation.
- id: rails-03-idempotent-jobs
  version: 1.4.0
  target: rails
  topic: Background jobs
  difficulty: 3
  interview_stage: architecture_review
  prompt: Your job runs twice for the same payment. How do you make that safe?
  context: At-least-once delivery means duplicates are normal, not exceptional. The
    interviewer wants to hear a database-level guarantee rather than an application-level
    check.
  follow_up:
    prompt: What idempotency key and durable state would let a retry distinguish the
      same payment from a changed request?
    goal: Answer the alternative challenge about Background jobs while keeping the
      evidence boundary explicit.
    challenge_kind: alternative
    best_answer: >-
      I would derive an idempotency key from the payment, store it with a unique
      index, and let the second insert fail on the constraint. I would use payment ID plus request
      semantics as the idempotency identity, persist status and result atomically, and return a
      conflict when the same key carries changed input. I would compare a database uniqueness
      constraint with a provider idempotency key, then verify an ambiguous external effect before
      replaying a response.
    distractors:
    - text: I would defend the first Background jobs option because offering an alternative
        might make the decision look uncertain.
      why_wrong: A comparison makes the decision rule visible; it does not weaken
        a well-calibrated recommendation.
    - text: I would list every conceivable Background jobs design without saying which
        requirement should decide between them.
      why_wrong: An option list without a decision rule avoids the trade-off the follow-up
        is testing.
  compression:
    prompt: Summarize the job design with the replay key, atomic state transition,
      and safe external-effect policy.
    goal: Compress the Background jobs answer into its decision, premise, trade-off,
      and verification step.
  best_answer: I would derive an idempotency key from the payment, store it with a
    unique index, and let the second insert fail on the constraint. Checking in Ruby
    first is a race; the constraint holds under concurrency.
  distractors:
  - text: At the start of the job I would check whether the payment has already been
      processed, and if it has I would return early without doing the work a second
      time.
    trap: content
    why_wrong: A read-then-write check is exactly the race the question targets; two
      workers can both read "not processed".
  - text: I would configure the queue so that jobs are only delivered once, which
      removes the duplicate problem at the source rather than handling it inside the
      job itself.
    trap: content
    why_wrong: Exactly-once delivery is not something a queue can generally promise;
      the design must tolerate duplicates.
  - text: I would make an idempotency key of the payment and save it with a unique
      index, then the second insert will broke in the constraint instead of processing
      again.
    trap: grammar
    why_wrong: '"Make a key of", "will broke" and "break in the constraint" are form
      and idiom errors on otherwise correct reasoning.'
  feedback:
    register: Firm and architectural. Guarantees belong in the database.
    hedging: No hedging; the constraint either exists or it does not.
    precision: Contrast the race explicitly with the constraint that removes it.
    grammar: '"Derive a key from", "the insert will fail on the constraint".'
    pragmatics: Pre-empting the naive check shows you have hit this in production.
  rephrase:
    prompt: Give the same answer while explaining why at-least-once delivery is normal.
    goal: Connect the fix to the delivery guarantee that forces it.
  language_focus:
  - precision
  - grammar
  - register
  feynman:
    concept: Idempotency keys enforced by a unique constraint.
    explain_to: A developer who trusts an if-statement to prevent duplicates.
    constraint: Explain using two people booking the same seat.
    self_check: Did you explain why the Ruby-side check is insufficient?
    reasoning_check: Can you identify the hidden premise behind Background jobs, give
      a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You proposed a read-then-write check or exactly-once delivery.
    expected: Idempotency key plus a database uniqueness constraint.
    actual: An application-level guard, or reliance on the queue.
    root_cause: Concurrency reasoned about sequentially, so the interleaving is invisible.
    repair: For any duplicate-prevention answer, ask where two workers could interleave.
    reasoning_error: If your Background jobs answer failed, classify the mistake as
      a fact, assumption, comparison, failure, or certainty error before proposing
      the smallest repair.
  recall:
    active_recall_cue: Why is a uniqueness constraint safer than an existence check?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Background jobs without presenting
      an assumption as a fact?
    black_box_probe: When the Background jobs answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: rails-03-idempotent-jobs-delayed-3
      prompt: >-
        A payment provider times out after possibly charging the customer, and its status endpoint is temporarily unavailable. How should the retry rule change?
      changed_constraint: >-
        the external payment effect is unknown after a timeout
      new_evidence: >-
        the provider cannot confirm status during the retry window
      best_answer: >-
        I would leave the payment pending, retry only with a provider idempotency key or a later status lookup, and route an unresolved result to reconciliation rather than create a second charge.
      distractors:
      - text: I would preserve every part of the original Background jobs answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Background jobs explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: decision-contrasts/05-idempotency-key-vs-unique-index.md
    note: Idempotency key versus unique index contrast.
  - repo: original
    path: english-arcade/rails/idempotent-jobs
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: 'Defend Background jobs after a counterexample: which Background jobs
      assumption changes, and what evidence keeps the revised Background jobs choice
      honest?'
    goal: Move from the short Background jobs answer to a deep, evidence-led defence
      without inventing an outcome.
  critical_thinking:
    problem_frame: >-
      At-least-once payment work can repeat while an external charge may be non-idempotent; I must bind retries to semantic identity and durable state.
    claim_map:
      fact: >-
        The job may run twice for one payment and the database can enforce uniqueness.
      inference: >-
        A unique database key removes the application read-then-write race, but it cannot by itself reconcile an external provider effect.
      assumption: >-
        I am assuming payment identity and request semantics are stable enough to derive one replay key.
      unknown: >-
        Provider idempotency support, response storage, changed-input behavior, and timeout reconciliation are unknown.
    comparison:
      applicable: true
      alternatives:
      - option: a durable idempotency record keyed by the command and provider request
        benefit: I can return the stored result, reject a changed payload, and reconcile an uncertain external effect.
        cost_or_risk: I must define key scope, retention, provider behavior, and cleanup; a local unique index alone cannot prevent an external duplicate.
        valid_when: Use it when retries can cross processes or trigger a charge, email, or other non-transactional effect.
      - option: a retry-only job with no durable command record
        benefit: It is quick for a purely local, naturally repeatable update.
        cost_or_risk: A timeout after an external effect leaves the retry unable to distinguish success from absence.
        valid_when: Use it only when the operation is demonstrably idempotent inside the same durable boundary.
      decision_rule: I require the durable record and provider idempotency or reconciliation for external effects; I accept retry-only execution only after proving repeatability.
    failure_probe:
      kind: failure_mode
      prompt: >-
        What if the provider accepted the first charge before the worker crashed and the second request carries a changed amount?
    evidence_check:
      basis: Check the Background jobs claim against system-design-estudos/decision-contrasts/05-idempotency-key-vs-unique-index.md
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: This Rails exercise can test reasoning about Background jobs, but
        it cannot prove an unmeasured production outcome, personal ownership, or universal
        rule.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        I am confident that an application pre-check is racy; confidence in exactly-once external effect requires provider and reconciliation evidence.
      update_trigger: >-
        Update when a duplicate-key test, provider contract, or timeout trace changes which layer owns replay and reconciliation.
    rubric:
      facts_correct: Names the verified Background jobs facts without smuggling in
        a result, scale, or capability that the prompt does not establish.
      assumptions_explicit: Labels the Background jobs premise that is still assumed
        and asks the smallest clarifying question that matters.
      alternatives_considered: Compares two credible Background jobs options, or explains
        the hard constraint that makes comparison a false equivalence.
      tradeoff_quality: Connects the Background jobs choice to a benefit, a cost or
        risk, and the condition under which another choice wins.
      follow_up_adaptation: Responds to the alternative challenge about Background
        jobs by changing the claim or evidence boundary rather than repeating the
        base answer.
      certainty_calibration: Uses medium certainty deliberately and names the evidence
        that would update the Background jobs recommendation.
- id: rails-04-strong-parameters
  version: 1.4.0
  target: rails
  topic: Security
  difficulty: 2
  interview_stage: technical_screen
  prompt: What is strong parameters actually protecting you from?
  context: A security-flavoured screen. The interviewer wants the specific attack
    named, because candidates often describe the mechanism without knowing what it
    prevents.
  follow_up:
    prompt: Which parameter should be rejected or permitted differently, and how would
      you test that a role cannot write an internal field?
    goal: Answer the failure challenge about Security while keeping the evidence boundary
      explicit.
    challenge_kind: failure
    best_answer: >-
      I would reject admin or role fields unless the caller is authorized to set them, and assert
      that a lower-privileged request leaves those fields unchanged. I would cover both create and
      update paths because input filtering is not authorization, then verify the policy and
      controller tests together.
    distractors:
    - text: I would describe the Security failure as impossible because the happy
        path already passed its test.
      why_wrong: Passing a happy path does not test the boundary, failure mode, or
        recovery being challenged.
    - text: I would add retries to Security immediately and assume the system would
        become reliable.
      why_wrong: Retries can amplify load or duplicate effects; the failure and containment
        policy must be specified first.
  compression:
    prompt: Describe strong parameters as an input boundary, an allowed-field decision,
      and a negative authorization test.
    goal: Compress the Security answer into its decision, premise, trade-off, and
      verification step.
  best_answer: I would call this mass assignment. Without strong parameters, a request
    could set any attribute the model exposes, so someone could submit an admin flag
    alongside profile fields and escalate privileges. I would permit an explicit list
    and test that unexpected keys are ignored rather than trusted.
  distractors:
  - text: It protects against invalid data being saved to the database by making sure
      that only the correct parameters are permitted through to the model layer during
      an update.
    trap: precision
    why_wrong: Describes filtering as validation and never names privilege escalation,
      which is the actual threat.
  - text: It protects against SQL injection, because the parameters are sanitised
      before they reach the database and cannot be used to inject arbitrary queries
      into the application.
    trap: content
    why_wrong: Wrong vulnerability entirely; injection is handled by parameter binding
      in Active Record.
  - text: It protects of the mass assignment, because without this a request could
      to set any attribute that the model is exposing, like a flag of admin.
    trap: grammar
    why_wrong: '"Protects of", "could to set" and "a flag of admin" are three distinct
      transfer errors in one sentence.'
  feedback:
    register: Direct. Security answers should name the attack in the first two words.
    hedging: None. Naming the vulnerability is a factual claim.
    precision: Give the concrete escalation example; abstractions are unconvincing
      here.
    grammar: '"Protects against", "could set", "an admin flag".'
    pragmatics: Explaining the ignore-versus-trust behaviour pre-empts the follow-up
      about unexpected keys.
  rephrase:
    prompt: Explain the same risk in a sentence a non-technical stakeholder would
      act on.
    goal: Translate a security mechanism into business risk.
  language_focus:
  - precision
  - grammar
  - register
  pt_help: '"Proteger de" em ingles e "protect against". Preposicao fixa.'
  feynman:
    concept: Mass assignment and privilege escalation.
    explain_to: A stakeholder deciding whether to fund a security fix.
    constraint: Explain using a form with hidden extra fields.
    self_check: Did you name what an attacker gains, not just what is blocked?
    reasoning_check: Can you identify the hidden premise behind Security, give a counterexample,
      and explain how the evidence changes your conclusion?
  black_box:
    symptom: You described filtering, or named the wrong vulnerability.
    expected: Mass assignment, with a privilege-escalation example.
    actual: Validation language, or an SQL injection claim.
    root_cause: Security features learned as configuration rather than as threat responses.
    repair: For each protection you use, be able to name the attack it stops.
    reasoning_error: If your Security answer failed, classify the mistake as a fact,
      assumption, comparison, failure, or certainty error before proposing the smallest
      repair.
  recall:
    active_recall_cue: What can an attacker achieve without strong parameters?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Security without presenting
      an assumption as a fact?
    black_box_probe: When the Security answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: rails-04-strong-parameters-delayed-4
      prompt: >-
        A nested update permits a role field that a viewer can change. Which boundary failed and how would you verify the repair?
      changed_constraint: >-
        field filtering is allowing a privileged mutation that authorization should deny
      new_evidence: >-
        a negative request test changes the role under a viewer credential
      best_answer: >-
        I would remove the role field from the permitted viewer path, enforce authorization separately, and test create and update requests so the model remains unchanged for a viewer.
      distractors:
      - text: I would preserve every part of the original Security answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Security explanation with a new design without
          identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/09-backend-principles/cards/backend-security.md
    note: Backend security fundamentals including mass assignment.
  - repo: original
    path: english-arcade/rails/strong-parameters
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: 'Five more minutes on Security: which boundary, alternative, and update
      trigger would you explain for Security?'
    goal: Move from the short Security answer to a deep, evidence-led defence without
      inventing an outcome.
  critical_thinking:
    problem_frame: >-
      An input boundary controls which model attributes a request may assign, while authorization controls who may change privileged fields; I must keep those responsibilities distinct.
    claim_map:
      fact: >-
        Strong parameters address mass assignment by requiring an explicit permitted field list.
      inference: >-
        Rejecting a role field prevents accidental assignment, but it does not replace an authorization policy.
      assumption: >-
        I am assuming the attacker can submit a role or admin attribute through the request path.
      unknown: >-
        The permitted keys, caller role, update path, and policy enforcement point are unknown.
    comparison:
      applicable: true
      alternatives:
      - option: explicit strong-parameter permits at the controller boundary
        benefit: I make the accepted input fields visible and reject unexpected mass assignment before the model changes.
        cost_or_risk: New fields require an intentional permit change, and nested input needs explicit maintenance.
        valid_when: Use it for request payloads whose writable fields are part of the endpoint contract.
      - option: broad parameter acceptance followed by model or policy checks
        benefit: It reduces controller edits during a fast prototype.
        cost_or_risk: It widens the mutation surface and makes a missing authorization or field check harder to see.
        valid_when: Use it only with a narrowly bounded internal payload and a separate, tested allowlist.
      decision_rule: I keep the explicit permit list at the request boundary; I choose the broader path only when an equivalent allowlist is enforced and tested elsewhere.
    failure_probe:
      kind: counterexample
      prompt: >-
        Which negative request should prove that a viewer cannot mutate a role field even when the key is present?
    evidence_check:
      basis: Check the Security claim against system-design-estudos/areas/09-backend-principles/cards/backend-security.md
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: This Rails exercise can test reasoning about Security, but it cannot
        prove an unmeasured production outcome, personal ownership, or universal rule.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        I am highly certain about naming mass assignment, but the complete security claim depends on all create, update, export, and job paths.
      update_trigger: >-
        Update when a negative authorization test or an alternate entry point shows a privileged field remains writable.
    rubric:
      facts_correct: Names the verified Security facts without smuggling in a result,
        scale, or capability that the prompt does not establish.
      assumptions_explicit: Labels the Security premise that is still assumed and
        asks the smallest clarifying question that matters.
      alternatives_considered: Compares two credible Security options, or explains
        the hard constraint that makes comparison a false equivalence.
      tradeoff_quality: Connects the Security choice to a benefit, a cost or risk,
        and the condition under which another choice wins.
      follow_up_adaptation: Responds to the failure challenge about Security by changing
        the claim or evidence boundary rather than repeating the base answer.
      certainty_calibration: Uses medium certainty deliberately and names the evidence
        that would update the Security recommendation.
- id: rails-05-caching-strategy
  version: 1.4.0
  target: rails
  topic: Caching
  difficulty: 2
  interview_stage: architecture_review
  prompt: Where would you put a cache in this read path, and how would you expire
    it?
  context: A dashboard aggregates data from several tables and is read far more often
    than it is written. The interviewer wants a specific placement and an invalidation
    story, not a general endorsement of caching.
  follow_up:
    prompt: What invalidates this cache, and how would you keep stale data from becoming
      a correctness or privacy problem?
    goal: Answer the new_evidence challenge about Caching while keeping the evidence
      boundary explicit.
    challenge_kind: new_evidence
    best_answer: >-
      I would cache the aggregate at the fragment level, keyed on the most recent
      updated_at across the inputs, so a write naturally produces a new key. I would
      invalidate with a versioned key that includes tenant identity and the relevant write version.
      I would test a write racing a read and cross-tenant key separation before choosing a TTL; a
      short TTL alone does not fix incorrect invalidation.
    distractors:
    - text: I would keep the Caching recommendation unchanged because changing position
        would look inconsistent.
      why_wrong: A defensible answer updates when relevant evidence changes an assumption
        or trade-off.
    - text: I would discard every earlier Caching claim as soon as one new observation
        appeared.
      why_wrong: New evidence may narrow one claim while leaving other verified facts
        intact.
  compression:
    prompt: 'Give the caching answer in three clauses: location, key or scope, and
      invalidation evidence.'
    goal: Compress the Caching answer into its decision, premise, trade-off, and verification
      step.
  best_answer: I would cache the aggregate at the fragment level, keyed on the most
    recent updated_at across the inputs, so a write naturally produces a new key.
    That avoids manual expiry entirely, and I would confirm with the product side
    how stale the numbers may be before choosing any TTL.
  distractors:
  - text: I would cache the query results in Redis with a reasonable TTL, maybe five
      minutes, and then clear the cache manually whenever any of the underlying records
      are updated by the application.
    trap: precision
    why_wrong: Combines a TTL with manual expiry, which is the fragile pattern key-based
      invalidation exists to replace.
  - text: Caching this would be premature. I would first make sure the queries themselves
      are properly optimised, and only introduce a cache if that turned out not to
      be enough.
    trap: pragmatics
    why_wrong: Reasonable instinct but refuses the question asked, which was where
      and how, not whether.
  - text: I would make the cache of the aggregate in the level of fragment, with the
      key based in the updated_at more recent, then a write is generating a new key
      automatically.
    trap: grammar
    why_wrong: '"Make the cache of", "in the level of" and "based in" are all preposition
      and idiom errors.'
  feedback:
    register: Concrete and product-aware. Mentioning tolerance for staleness raises
      the level.
    hedging: Hedge the TTL until you know the product tolerance; do not hedge the
      strategy.
    precision: Key-based expiry is the specific technique; name it rather than describing
      it.
    grammar: '"Cache at the fragment level", "keyed on", "based on".'
    pragmatics: Asking the product question inside the answer shows collaboration
      without stalling.
  rephrase:
    prompt: Answer again for a case where the data must never be stale.
    goal: Force the strategy to adapt to a harder constraint.
  language_focus:
  - precision
  - grammar
  - pragmatics
  feynman:
    concept: Key-based cache expiry versus manual invalidation.
    explain_to: A developer who deletes cache keys by hand.
    constraint: Explain using dated newspaper editions.
    self_check: Did you make writes produce new keys rather than delete old ones?
    reasoning_check: Can you identify the hidden premise behind Caching, give a counterexample,
      and explain how the evidence changes your conclusion?
  black_box:
    symptom: You mixed TTL with manual clearing, or refused to place a cache.
    expected: Fragment cache keyed on latest updated_at, plus staleness tolerance.
    actual: Manual invalidation, or a deflection to query tuning.
    root_cause: Cache invalidation treated as cleanup instead of as key design.
    repair: Ask what changes the key before asking what deletes the entry.
    reasoning_error: If your Caching answer failed, classify the mistake as a fact,
      assumption, comparison, failure, or certainty error before proposing the smallest
      repair.
  recall:
    active_recall_cue: What makes key-based expiry safer than manual deletion?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Caching without presenting
      an assumption as a fact?
    black_box_probe: When the Caching answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: rails-05-caching-strategy-delayed-5
      prompt: >-
        A cache-key review finds two tenants sharing an aggregate key and seeing stale dashboard data. What must change before keeping the cache?
      changed_constraint: >-
        tenant identity and write version must participate in the cache identity
      new_evidence: >-
        a key collision returns one tenant's aggregate to another and a concurrent write leaves stale data
      best_answer: >-
        I would include tenant and a versioned write token in the key, invalidate on the relevant write, and test tenant separation and read/write races before selecting a TTL.
      distractors:
      - text: I would preserve every part of the original Caching answer because changing
          it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Caching explanation with a new design without
          identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/11-operational-playbooks/playbooks/cache-hot-key-and-origin-protection.md
    note: Cache placement and origin protection playbook.
  - repo: original
    path: english-arcade/rails/caching-strategy
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: 'Revisit Caching beyond the happy path: what is factual about Caching,
      what is provisional, and which Caching test could change it?'
    goal: Move from the short Caching answer to a deep, evidence-led defence without
      inventing an outcome.
  critical_thinking:
    problem_frame: >-
      A read-heavy dashboard aggregates tenant data; I must choose a cache boundary whose identity and invalidation preserve privacy and the allowed staleness.
    claim_map:
      fact: >-
        The aggregate is read more often than written and the product must define tolerated staleness.
      inference: >-
        A versioned key can make writes produce new cache identities, but only if every relevant input and tenant participates.
      assumption: >-
        I am assuming the aggregate inputs expose a reliable version or updated-at signal.
      unknown: >-
        Tenant isolation, concurrent read/write behavior, freshness target, and aggregate cost are unknown.
    comparison:
      applicable: true
      alternatives:
      - option: a versioned cache key with explicit invalidation on the authoritative write
        benefit: I keep stale data bounded by the version or write event and can explain which change invalidates the value.
        cost_or_risk: Every write path must update the version or publish invalidation, and multi-tenant key scope must be correct.
        valid_when: Use it when freshness matters and the authoritative write boundary is known.
      - option: a short TTL cache with no write-time invalidation
        benefit: It is simpler when bounded staleness is acceptable and writes are spread across many paths.
        cost_or_risk: Readers can see stale values for the full TTL, and a hot write can leave contradictory views.
        valid_when: Use it when the product explicitly permits that staleness window and metrics cover hit rate and age.
      decision_rule: I choose explicit invalidation when freshness is a contract; I choose TTL when the allowed staleness window is measured and documented.
    failure_probe:
      kind: edge_case
      prompt: >-
        What write or tenant-boundary test would demonstrate that a cached aggregate is stale or belongs to the wrong caller?
    evidence_check:
      basis: Check the Caching claim against system-design-estudos/areas/11-operational-playbooks/playbooks/cache-hot-key-and-origin-protection.md
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: This Rails exercise can test reasoning about Caching, but it cannot
        prove an unmeasured production outcome, personal ownership, or universal rule.
      checked_on: '2026-08-25'
    certainty:
      level: high
      rationale: >-
        I am confident that cache correctness needs identity and freshness evidence; the best placement and TTL remain workload questions.
      update_trigger: >-
        Update when a key-collision test, freshness trace, or product staleness target contradicts versioned invalidation.
    rubric:
      facts_correct: Names the verified Caching facts without smuggling in a result,
        scale, or capability that the prompt does not establish.
      assumptions_explicit: Labels the Caching premise that is still assumed and asks
        the smallest clarifying question that matters.
      alternatives_considered: Compares two credible Caching options, or explains
        the hard constraint that makes comparison a false equivalence.
      tradeoff_quality: Connects the Caching choice to a benefit, a cost or risk,
        and the condition under which another choice wins.
      follow_up_adaptation: Responds to the new_evidence challenge about Caching by
        changing the claim or evidence boundary rather than repeating the base answer.
      certainty_calibration: Uses high certainty deliberately and names the evidence
        that would update the Caching recommendation.
- id: rails-06-service-objects
  version: 1.4.0
  target: rails
  topic: Request lifecycle and service boundaries
  difficulty: 2
  interview_stage: architecture_review
  prompt: Walk me through a Rails request, then explain where a cross-record service
    belongs.
  context: The codebase has fat models and a sprawling services directory. The interviewer
    wants the Rack/router/controller/model-or-service/response ownership chain, not
    a preference for one layer.
  follow_up:
    prompt: Where would you put authorization, validation, and cross-record coordination
      in this request, and why?
    goal: Answer the assumption challenge about Request lifecycle and service boundaries
      while keeping the evidence boundary explicit.
    challenge_kind: assumption
    best_answer: >-
      I would authenticate and validate at the request boundary, keep record-owned invariants in the
      model, and coordinate multiple records or gateways in a service transaction. The controller
      maps that service result to an HTTP response. I would verify authorization on every entry
      point and avoid creating a service merely because one class is large.
    distractors:
    - text: I would repeat my original Request lifecycle and service boundaries answer
        with more confidence because the interviewer probably assumes the usual case.
      why_wrong: It hides the premise instead of checking whether the usual case is
        actually part of this problem.
    - text: I would stop proposing anything about Request lifecycle and service boundaries
        until every surrounding requirement had been documented in full.
      why_wrong: It treats uncertainty as a reason for paralysis and offers no bounded
        next step.
  compression:
    prompt: Walk through the Rails boundary as request entry, domain coordination,
      persistence, and observable outcome.
    goal: Compress the Request lifecycle and service boundaries answer into its decision,
      premise, trade-off, and verification step.
  best_answer: I would trace the request from Rack to the router, controller, model or
    service, and response. I would authenticate and validate at the boundary, keep
    record-owned invariants in the model, and put cross-record or gateway orchestration
    in a service whose result the controller turns into the HTTP response.
  distractors:
  - text: I put business logic in service objects and keep models thin, because fat
      models become hard to maintain and service objects are easier to test in isolation
      from the rest. The controller can call whichever service it needs, while models
      should mostly expose persistence and associations so the request path stays
      straightforward.
    trap: precision
    why_wrong: A blanket policy rather than a boundary, and it produces anaemic models
      with logic scattered across services.
  - text: It depends on the size of the method really. If it starts getting too long
      or complicated then I would extract it into a service object to keep things
      readable.
    trap: content
    why_wrong: Length is not a design criterion; it moves code without changing ownership.
  - text: I maintain in the model the behaviour that belongs of one record, and I
      move for a service the orchestration between several records or systems externals.
    trap: grammar
    why_wrong: '"Belongs of", "move for" and post-posed "systems externals" break
      idiom and adjective order.'
  feedback:
    register: Narrate the request in execution order before defending the service
      boundary.
    hedging: Use “would” for a proposed use case, not for the Rack and routing facts.
    precision: Name router, controller, record invariant, gateway orchestration, and
      HTTP response separately.
    grammar: Use “the router selects”, “the controller validates”, and “the service
      returns”.
    pragmatics: Show that a service is accountable to the controller’s use case, not
      a dumping ground.
  rephrase:
    prompt: Rephrase signup that persists a user, calls an email gateway, and returns
      a created response.
    goal: Preserve ownership at each boundary without turning the controller into
      the workflow.
  language_focus:
  - precision
  - grammar
  - register
  feynman:
    concept: How a Rails request hands work from Rack through a controller to a model
      or cross-record service.
    explain_to: A developer deciding where a signup workflow belongs.
    constraint: Include one record invariant and one external gateway.
    self_check: Can they say who turns the result into an HTTP response?
    reasoning_check: Can you identify the hidden premise behind Request lifecycle
      and service boundaries, give a counterexample, and explain how the evidence
      changes your conclusion?
  black_box:
    symptom: A controller validates, persists, emails, and renders from one untestable
      action.
    expected: Record invariants stay on the model; a service coordinates user and
      gateway, then returns a result.
    actual: Layer preference replaces a request-lifecycle explanation.
    root_cause: Service extraction was treated as style rather than ownership across
      boundaries.
    repair: Trace Rack, router, controller, model or service, and response before
      moving code.
    reasoning_error: If your Request lifecycle and service boundaries answer failed,
      classify the mistake as a fact, assumption, comparison, failure, or certainty
      error before proposing the smallest repair.
  recall:
    active_recall_cue: Which request step owns validation, record invariants, gateway
      orchestration, and the HTTP response?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Request lifecycle and service
      boundaries without presenting an assumption as a fact?
    black_box_probe: When the Request lifecycle and service boundaries answer failed,
      did you locate the reasoning error before changing the implementation?
    delayed_variant:
      id: rails-06-service-objects-delayed-6
      prompt: >-
        A background job calls the service directly and bypasses the controller authorization check. Where should the boundary move?
      changed_constraint: >-
        authorization must hold for every service entry point, including jobs
      new_evidence: >-
        a job can invoke the service without the controller policy
      best_answer: >-
        I would put authorization at the service boundary or an explicit policy used by every caller, keep record invariants in the model, and test both controller and job entry points.
      distractors:
      - text: I would preserve every part of the original Request lifecycle and service
          boundaries answer because changing it after review would be inconsistent.
