    certainty:
      level: medium
      rationale: Certainty is medium because the prompt bounds the Cross-team communication
        question but does not reveal every workload, stakeholder priority, or outcome.
      update_trigger: For case "Tell me how you would justify choosing", update Cross-team
        communication when Cross-team communication evidence—a Cross-team communication
