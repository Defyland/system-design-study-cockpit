      which failure around Goroutines would make Goroutines switch?'
    goal: Move from the short Goroutines answer to a deep, evidence-led defence without
      inventing an outcome.
  critical_thinking:
    problem_frame: 'Frame Goroutines before proposing a solution: state the actor,
      required outcome, constraint, and unknown that could invalidate the first recommendation.'
    claim_map:
      fact: The prompt explicitly tests Goroutines within a Go context; treat that
        named boundary as the verified starting fact.
      inference: The reasonable inference is that the answer must defend Goroutines,
        but that does not prove one implementation wins under every workload or audience.
      assumption: An unstated assumption is that the Goroutines constraint is the
        dominant one; label it and ask whether the interviewer confirms it.
      unknown: 'Still unknown for Goroutines: the scale, failure tolerance, ownership
        boundary, and evidence threshold that would change the decision.'
    comparison:
      applicable: true
      alternatives:
      - option: a minimal Go interface or cancellation boundary for Goroutines
        benefit: It keeps the Goroutines reasoning close to the stated Go constraint
          and makes the evidence boundary visible.
        cost_or_risk: It can be too narrow if the Goroutines workload or requirement
