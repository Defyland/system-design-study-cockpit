---
contract_version: "1.1.0"
target:
  key: golang
  label: Golang
  blurb: >-
    Explain interfaces, goroutines and context the way a Go engineer does:
    plainly, with ownership and cancellation made explicit.
  focus_areas:
    - interfaces and composition
    - goroutines and channels
    - context and cancellation
    - errors and wrapping
    - profiling and service boundaries
  simulation:
    minutes: 45
    structure:
      - label: Interfaces and API shape warm-up
        minutes: 8
      - label: Concurrency and ownership deep dive
        minutes: 15
      - label: Errors, context and failure paths
        minutes: 12
      - label: Profiling and service boundaries
        minutes: 10
cards:
  - id: golang-card-interface-consumer
    front: Where do Go interfaces belong?
    back: >-
      In the consumer package, kept small. The producer returns a concrete type;
      the caller declares only the method it needs.
    box: 1
    source:
      repo: system-design-estudos
      path: areas/09-backend-principles/cards/application-boundaries-and-service-layer.md
      note: Boundary and dependency-direction principles.
  - id: golang-card-goroutine-ownership
    front: What must you say when you start a goroutine?
    back: >-
      Who stops it and how. An unowned goroutine is a leak waiting for
      production traffic.
    box: 2
    source:
      repo: system-design-estudos
      path: areas/09-backend-principles/cards/graceful-shutdown.md
      note: Lifecycle and shutdown discipline.
  - id: golang-card-error-wrapping
    front: How do you talk about error wrapping precisely?
    back: >-
      Wrap with context at each boundary, compare with errors.Is or errors.As,
      and never match on message strings.
    box: 1
    source:
      repo: system-design-estudos
      path: areas/09-backend-principles/cards/error-handling-fault-tolerance.md
      note: Error handling and fault tolerance practices.
items:
  - id: golang-01-interface-placement
    version: "1.0.0"
    target: golang
    topic: Interfaces
    difficulty: 2
    interview_stage: technical_screen
    prompt: >-
      Where would you define the interface for this dependency?
    context: >-
      A service needs a storage dependency. The interviewer wants to know
      whether you follow Go's consumer-side convention or bring habits from
      other languages.
    best_answer: >-
      In the consumer package, and as small as I can make it. The storage
      package returns a concrete type, and my service declares the one or two
      methods it actually uses, which keeps the dependency pointing inwards and
      makes the test double trivial.
    distractors:
      - text: >-
          In the storage package alongside the implementation, so that everyone
          who needs it can import the same interface definition and there is a
          single canonical contract for the dependency.
        trap: content
        why_wrong: >-
          That is the Java convention. In Go it forces consumers to depend on a
          package they do not need and grows the interface over time.
      - text: >-
          Wherever it makes the most sense for the project structure, since
          different teams organise this differently and consistency within the
          codebase matters more than the specific choice.
        trap: pragmatics
        why_wrong: >-
          Avoids the question. There is a well-established Go convention here
          and the interviewer is checking whether you know it.
      - text: >-
          In the package of the consumer and the more small possible, because
          then the service declares only the methods that it is using really.
        trap: grammar
        why_wrong: >-
          "The package of the consumer" and "the more small possible" invert
          English possessive and superlative forms.
    feedback:
      register: >-
        Idiomatic and specific; name the convention as a convention.
      hedging: >-
        None needed; this is settled Go practice.
      precision: >-
        Say why it matters: dependency direction and trivial test doubles.
      grammar: >-
        "The consumer package", "as small as possible".
      pragmatics: >-
        Mentioning testing pre-empts the natural follow-up.
    rephrase:
      prompt: >-
        Explain the same convention to a Java developer joining the team.
      goal: Practise contrasting conventions without dismissing either.
    language_focus: [precision, grammar, pragmatics]
    pt_help: >-
      Ingles usa substantivo composto: "the consumer package", nao "the package
      of the consumer".
    feynman:
      concept: Consumer-side interfaces and dependency direction.
      explain_to: A developer coming from Java or C#.
      constraint: Explain using a job description written by the employer.
      self_check: >-
        Did you say which package owns the concrete type?
    black_box:
      symptom: You placed the interface with the implementation.
      expected: Consumer package, minimal method set, concrete return.
      actual: Producer-side definition, or deferral to team style.
      root_cause: >-
        Carrying interface habits from languages with nominal typing.
      repair: >-
        Ask who consumes the behaviour before deciding who declares it.
    recall:
      active_recall_cue: >-
        Which package should declare an interface in Go, and why?
      leitner_start_box: 1
      mastery_threshold: 8
    sources:
      - repo: system-design-estudos
        path: areas/09-backend-principles/cards/application-boundaries-and-service-layer.md
        note: Boundaries and dependency direction.
      - repo: original
        path: english-arcade/golang/interface-placement
        note: Original interview phrasing authored for this pack.
  - id: golang-02-goroutine-leak
    version: "1.0.0"
    target: golang
    topic: Goroutines
    difficulty: 3
    interview_stage: deep_dive
    prompt: >-
      What happens to this goroutine if nobody reads from the channel?
    context: >-
      The code starts a goroutine that sends a result on an unbuffered channel,
      but the caller returns early on timeout. The interviewer is probing
      whether you can see the leak.
    best_answer: >-
      It blocks on the send forever, so the goroutine never exits and whatever
      it holds stays alive. I would either give the channel a buffer of one so
      the send always completes, or select on the context so the goroutine gives
      up when the caller does.
    distractors:
      - text: >-
          The goroutine will be garbage collected once nothing references the
          channel any more, so it gets cleaned up automatically without leaking
          any memory in the process.
        trap: content
        why_wrong: >-
          Blocked goroutines are never collected; that is precisely why leaks
          accumulate under load.
      - text: >-
          It would probably just wait there, which is not ideal, so it would be
          better to handle that case somehow to avoid any potential issues later
          on in production.
        trap: precision
        why_wrong: >-
          Identifies the symptom vaguely and proposes nothing concrete, so it
          demonstrates no working knowledge.
      - text: >-
          It stays blocked in the send for always, then the goroutine never
          exits and everything that it is holding continues alive in the memory
          of the process.
        trap: grammar
        why_wrong: >-
          "For always", "continues alive" and "the memory of the process" are
          all literal translations.
    feedback:
      register: >-
        Precise and unhurried; leaks are a mechanism question.
      hedging: >-
        None; the blocking behaviour is deterministic.
      precision: >-
        Give both fixes, since they suit different situations.
      grammar: >-
        "Blocks forever", "stays alive", "process memory".
      pragmatics: >-
        Connecting the leak to what it retains shows production experience.
    rephrase:
      prompt: >-
        Explain how you would detect this leak in a running service.
      goal: Move from cause to observation.
    language_focus: [precision, grammar, hedging]
    feynman:
      concept: Blocked sends and goroutine lifetime.
      explain_to: A developer who assumes the runtime cleans everything up.
      constraint: Explain using someone holding a door for a person who left.
      self_check: >-
        Did you name both the buffer and the context fix?
    black_box:
      symptom: You assumed collection, or described the problem vaguely.
      expected: Permanent block, retained memory, buffer or context fix.
      actual: A garbage-collection claim, or an unspecific concern.
      root_cause: >-
        Goroutines modelled as tasks rather than as blocked OS-level waiters.
      repair: >-
        For every channel send, ask who guarantees a receive.
    recall:
      active_recall_cue: >-
        Why is a blocked goroutine never garbage collected?
      leitner_start_box: 1
      mastery_threshold: 8
    sources:
      - repo: system-design-estudos
        path: areas/09-backend-principles/cards/concurrency-parallelism.md
        note: Concurrency primitives and failure modes.
      - repo: original
        path: english-arcade/golang/goroutine-leak
        note: Original interview phrasing authored for this pack.
  - id: golang-03-context-propagation
    version: "1.0.0"
    target: golang
    topic: Context
    difficulty: 2
    interview_stage: architecture_review
    prompt: >-
      Why pass context as the first argument everywhere?
    context: >-
      A design review. The interviewer wants to know whether you understand
      context as a cancellation and deadline carrier rather than as a
      convention you follow without thinking.
    best_answer: >-
      Because cancellation has to travel the whole call chain. If the client
      hangs up, every downstream call should stop rather than finish work nobody
      will read. It also carries the deadline, so a slow dependency cannot
      outlive the request that started it.
    distractors:
      - text: >-
          Because it is the standard Go convention and most libraries expect it,
          so following it keeps the code consistent with the rest of the
          ecosystem and with what other developers expect.
        trap: precision
        why_wrong: >-
          Convention is the consequence, not the reason. It says nothing about
          cancellation or deadlines.
      - text: >-
          Because it lets you pass request-scoped values like the trace ID and
          the authenticated user down through the layers without changing every
          function signature.
        trap: content
        why_wrong: >-
          Values are the least important and most abused part of context;
          leading with them signals the wrong mental model.
      - text: >-
          Because the cancellation needs to travel for all the chain of calls,
          then if the client hangs up every call downstream should to stop the
          work.
        trap: grammar
        why_wrong: >-
          "Travel for", "chain of calls" and "should to stop" are preposition,
          compound-noun and modal errors.
    feedback:
      register: >-
        Purposeful. Explain the mechanism, then the convention follows.
      hedging: >-
        None needed; cancellation semantics are well defined.
      precision: >-
        Cancellation and deadlines are the answer; values are a footnote.
      grammar: >-
        "The whole call chain", "should stop"; modals take a bare infinitive.
      pragmatics: >-
        The hang-up example makes an abstract mechanism immediately concrete.
    rephrase:
      prompt: >-
        Explain what breaks in a service that ignores the context it receives.
      goal: Test understanding through the failure case.
    language_focus: [precision, grammar, pragmatics]
    pt_help: >-
      Modais em ingles nao levam "to": "should stop", nunca "should to stop".
    feynman:
      concept: Context as a cancellation and deadline carrier.
      explain_to: A developer who treats context as a bag of values.
      constraint: Explain using a restaurant order that gets cancelled.
      self_check: >-
        Did you lead with cancellation rather than with values?
    black_box:
      symptom: You justified it by convention or led with values.
      expected: Cancellation and deadline propagation across the call chain.
      actual: An appeal to consistency, or a focus on request-scoped values.
      root_cause: >-
        Context adopted as a signature requirement rather than as a control
        mechanism.
      repair: >-
        Explain context by describing what happens when the client disconnects.
    recall:
      active_recall_cue: >-
        What two things does context carry that matter most?
      leitner_start_box: 1
      mastery_threshold: 8
    sources:
      - repo: system-design-estudos
        path: areas/09-backend-principles/cards/graceful-shutdown.md
        note: Cancellation and shutdown propagation.
      - repo: original
        path: english-arcade/golang/context-propagation
        note: Original interview phrasing authored for this pack.
  - id: golang-04-error-wrapping
    version: "1.0.0"
    target: golang
    topic: Errors
    difficulty: 2
    interview_stage: technical_screen
    prompt: >-
      How do you decide what to add when you wrap an error?
    context: >-
      The codebase has errors wrapped at every level, and the logs are now
      repetitive. The interviewer wants a rule for what each layer should
      contribute.
    best_answer: >-
      Each layer adds what only it knows, so the repository adds the query or
      the identifier and the handler adds the operation. If a layer has nothing
      new to say, it should return the error unchanged rather than restating the
      one below it.
    distractors:
      - text: >-
          I wrap at every level with a message describing what the function was
          doing, which builds up a complete trail of the call path in the final
          error message.
        trap: content
        why_wrong: >-
          Produces exactly the repetitive logs described in the prompt; a stack
          trace already covers the call path.
      - text: >-
          I try to add useful context that will help with debugging later,
          without making the messages too long or repeating what is already
          there in the underlying error.
        trap: precision
        why_wrong: >-
          Restates the goal without giving a rule anyone could apply
          consistently.
      - text: >-
          Each layer adds what only it knows, then the repository puts the query
          or the identifier and the handler puts the operation that was being
          realised in that moment.
        trap: grammar
        why_wrong: >-
          "Puts" for "adds", and "being realised in that moment" is a false
          friend for "being performed".
    feedback:
      register: >-
        Rule-based and concise.
      hedging: >-
        None; give the rule directly.
      precision: >-
        "What only it knows" is the operative test.
      grammar: >-
        "Adds the identifier", "the operation being performed"; avoid the false
        friend "realise".
      pragmatics: >-
        The return-unchanged clause answers the repetition problem explicitly.
    rephrase:
      prompt: >-
        Apply your rule to a failed HTTP call inside a payment handler.
      goal: Test the rule on a concrete stack.
    language_focus: [precision, grammar, register]
    pt_help: >-
      "Realizar" tecnico e "perform" ou "carry out". "Realise" significa
      "perceber".
    feynman:
      concept: Layered error context without duplication.
      explain_to: A developer whose logs repeat the same message five times.
      constraint: Explain using a parcel passed between depots.
      self_check: >-
        Does your rule ever say "add nothing"?
    black_box:
      symptom: You wrapped everywhere, or described the goal instead of a rule.
      expected: Add only layer-specific knowledge; otherwise pass through.
      actual: A full call-path trail, or an unactionable aspiration.
      root_cause: >-
        Wrapping treated as ceremony rather than as information gain.
      repair: >-
        Before wrapping, ask what this layer knows that the caller does not.
    recall:
      active_recall_cue: >-
        When should a layer return an error unchanged?
      leitner_start_box: 1
      mastery_threshold: 8
    sources:
      - repo: system-design-estudos
        path: areas/09-backend-principles/cards/error-handling-fault-tolerance.md
        note: Error handling and context practices.
      - repo: original
        path: english-arcade/golang/error-wrapping
        note: Original interview phrasing authored for this pack.
  - id: golang-05-channel-vs-mutex
    version: "1.0.0"
    target: golang
    topic: Concurrency design
    difficulty: 3
    interview_stage: deep_dive
    prompt: >-
      Would you use a channel or a mutex for this shared counter?
    context: >-
      Several goroutines increment a counter that is read occasionally. The
      interviewer wants to see whether you can resist the idea that channels are
      always the Go answer.
    best_answer: >-
      A mutex, or an atomic counter. Channels transfer ownership of data between
      goroutines, and nothing is handed over here; it is shared state with a
      short critical section. A channel adds a serialising goroutine for nothing.
    distractors:
      - text: >-
          A channel, because the Go proverb says to share memory by
          communicating rather than communicating by sharing memory, so channels
          are the idiomatic choice for shared state.
        trap: content
        why_wrong: >-
          Misapplies the proverb. It is about ownership transfer, not about
          banning mutexes for simple shared counters.
      - text: >-
          Either would work here honestly, so I would go with whichever fits the
          existing style of the codebase better and keeps things consistent for
          the rest of the team.
        trap: pragmatics
        why_wrong: >-
          Declines the design judgement the question exists to assess.
      - text: >-
          A mutex, because the channels serve for transfer the property of the
          data between goroutines and here nothing is being passed, is only
          state shared.
        trap: grammar
        why_wrong: >-
          "Serve for transfer", "property" as a false friend for ownership, and
          the dropped subject all break the sentence.
    feedback:
      register: >-
        Confident enough to contradict a proverb, which is the point of the
        question.
      hedging: >-
        None; the criterion is clear.
      precision: >-
        Ownership transfer versus shared state is the distinction to name.
      grammar: >-
        "Transfer ownership", "it is only shared state"; keep the subject.
      pragmatics: >-
        Explaining why the channel is worse pre-empts the pushback.
    rephrase:
      prompt: >-
        Describe a case in the same service where a channel would be right.
      goal: Prove the criterion works in both directions.
    language_focus: [precision, grammar, register]
    pt_help: >-
      "Propriedade" no sentido de posse e "ownership". "Property" e atributo.
    feynman:
      concept: Channels for ownership transfer, mutexes for shared state.
      explain_to: A developer who quotes the Go proverb reflexively.
      constraint: Explain using passing a baton versus sharing a whiteboard.
      self_check: >-
        Did you say what is being handed over, or not handed over?
    black_box:
      symptom: You chose a channel by proverb, or refused to choose.
      expected: Mutex or atomic; channels are for ownership transfer.
      actual: Idiom-driven choice, or deference to codebase style.
      root_cause: >-
        Proverbs internalised as rules without their original scope.
      repair: >-
        Ask whether anything changes owner before reaching for a channel.
    recall:
      active_recall_cue: >-
        What question distinguishes a channel case from a mutex case?
      leitner_start_box: 1
      mastery_threshold: 8
    sources:
      - repo: system-design-estudos
        path: areas/09-backend-principles/cards/concurrency-parallelism.md
        note: Concurrency primitives and their intended use.
      - repo: original
        path: english-arcade/golang/channel-vs-mutex
        note: Original interview phrasing authored for this pack.
  - id: golang-06-profiling
    version: "1.0.0"
    target: golang
    topic: Profiling
    difficulty: 2
    interview_stage: deep_dive
    prompt: >-
      The service uses more CPU than expected. Where do you start?
    context: >-
      A production performance question. The interviewer wants to hear a
      specific tool and a specific reading strategy, not a general commitment to
      measuring.
    best_answer: >-
      I would take a CPU profile from the running process over a representative
      window and read it as a flame graph, cumulative time before self time.
      That usually points at an unexpected path, often serialisation.
    distractors:
      - text: >-
          I would profile the application to find out where the time is being
          spent, and then optimise whatever turns out to be the hottest part of
          the code that shows up.
        trap: precision
        why_wrong: >-
          Correct instinct, no method. It names no tool, window or reading
          strategy.
      - text: >-
          I would add timing metrics around the main operations and compare them
          over time, then look more closely at whichever one has grown the most
          recently in production.
        trap: content
        why_wrong: >-
          Instrumentation is slower and coarser than a profile for a CPU
          question, and it presumes you already know where to measure.
      - text: >-
          I would take one profile of CPU of the process in execution during a
          window representative and read it like a flame graph, seeing first the
          time cumulative.
        trap: grammar
        why_wrong: >-
          Stacked "of" possessives and post-posed adjectives break the sentence
          throughout.
    feedback:
      register: >-
        Practical and tool-specific.
      hedging: >-
        Hedge the finding ("usually points at"), not the method.
      precision: >-
        Cumulative before self time is the detail that shows real experience.
      grammar: >-
        "A CPU profile", "a representative window", "cumulative time".
      pragmatics: >-
        Predicting the likely culprit invites a useful follow-up.
    rephrase:
      prompt: >-
        Explain what you would do if the profile looked completely flat.
      goal: Test the method when the obvious signal is absent.
    language_focus: [precision, grammar, hedging]
    feynman:
      concept: Reading a CPU profile by cumulative time.
      explain_to: A developer who optimises the first slow function they see.
      constraint: Explain using a receipt for a long shopping trip.
      self_check: >-
        Did you say which number you read first, and why?
    black_box:
      symptom: You committed to profiling without naming how you would read it.
      expected: CPU profile over a representative window, cumulative first.
      actual: Generic measurement, or metric instrumentation instead.
      root_cause: >-
        Profiling known as a step rather than as an interpretation skill.
      repair: >-
        Practise describing what you look at first in a flame graph.
    recall:
      active_recall_cue: >-
        Do you read cumulative or self time first, and why?
      leitner_start_box: 1
      mastery_threshold: 8
    sources:
      - repo: system-design-estudos
        path: areas/09-backend-principles/cards/scaling-performance.md
        note: Performance investigation discipline.
      - repo: original
        path: english-arcade/golang/profiling
        note: Original interview phrasing authored for this pack.
  - id: golang-07-struct-embedding
    version: "1.0.0"
    target: golang
    topic: Composition
    difficulty: 2
    interview_stage: technical_screen
    prompt: >-
      Is embedding here the same as inheritance?
    context: >-
      The candidate has embedded a struct and the interviewer is checking
      whether the mental model is composition or inherited hierarchy, which
      changes how the code will evolve.
    best_answer: >-
      No. Embedding promotes the methods, so the outer type gets them, but there
      is no dynamic dispatch back to the outer type. If the embedded method
      calls another method, it calls its own, not an override, which is the
      behaviour that surprises people from an inheritance background.
    distractors:
      - text: >-
          It is effectively the same thing in practice, since the outer type
          gains all the methods of the embedded type and can override them by
          defining its own version with the same name.
        trap: content
        why_wrong: >-
          Shadowing is not overriding; the embedded method still calls its own
          methods, which is the entire difference.
      - text: >-
          Not exactly, they are different mechanisms, but the practical effect
          is quite similar in most everyday situations you would encounter in a
          normal codebase.
        trap: precision
        why_wrong: >-
          Hedged non-answer that never names the dispatch difference.
      - text: >-
          No, the embedding promotes the methods, then the type external
          receives them, but does not exist dispatch dynamic back for the type
          external.
        trap: grammar
        why_wrong: >-
          Post-posed adjectives and the dropped expletive subject make the
          correct point unreadable.
    feedback:
      register: >-
        Clear correction without condescension.
      hedging: >-
        None; the semantics are unambiguous.
      precision: >-
        Name the absence of dynamic dispatch; that is the whole answer.
      grammar: >-
        "The outer type", "there is no dynamic dispatch".
      pragmatics: >-
        Naming who gets surprised makes the point memorable.
    rephrase:
      prompt: >-
        Give an example where expecting an override would cause a real bug.
      goal: Convert a semantic distinction into a failure case.
    language_focus: [precision, grammar, register]
    feynman:
      concept: Method promotion without dynamic dispatch.
      explain_to: A developer fluent in class inheritance.
      constraint: Explain using a contractor who always calls their own team.
      self_check: >-
        Did you say which method the embedded one calls?
    black_box:
      symptom: You equated embedding with inheritance, or hedged.
      expected: Promotion without dispatch back to the outer type.
      actual: An override claim, or a vague "similar in practice".
      root_cause: >-
        Mapping Go onto a class-based model instead of learning composition.
      repair: >-
        Write the surprising case once and keep it as your reference example.
    recall:
      active_recall_cue: >-
        Which method does an embedded method call, its own or the override?
      leitner_start_box: 1
      mastery_threshold: 8
    sources:
      - repo: system-design-estudos
        path: areas/09-backend-principles/cards/application-boundaries-and-service-layer.md
        note: Composition and boundary design.
      - repo: original
        path: english-arcade/golang/struct-embedding
        note: Original interview phrasing authored for this pack.
  - id: golang-08-graceful-shutdown
    version: "1.0.0"
    target: golang
    topic: Lifecycle
    difficulty: 3
    interview_stage: architecture_review
    prompt: >-
      What does a correct shutdown look like for this HTTP service?
    context: >-
      The service is deployed on a platform that sends a termination signal
      before killing the process. The interviewer wants the ordered sequence,
      including what must not be dropped.
    best_answer: >-
      Stop accepting new connections, let in-flight requests finish within a
      deadline shorter than the platform's kill timeout, then close dependencies
      in reverse order. Waiting indefinitely just turns it into a hard kill.
    distractors:
      - text: >-
          I would listen for the signal and then close the server and the
          database connections cleanly so that nothing is left open when the
          process finally exits.
        trap: precision
        why_wrong: >-
          Misses the in-flight request window and the deadline, which is where
          shutdown correctness actually lives.
      - text: >-
          I would drain the connections and wait for all the ongoing work to
          complete before shutting down, so that no request is ever interrupted
          in the middle.
        trap: content
        why_wrong: >-
          Unbounded waiting is defeated by the platform's kill timeout, so it
          produces the abrupt termination it was meant to avoid.
      - text: >-
          Stop to accept new connections, let the requests in flight finish
          inside a deadline more short than the timeout of the platform, and
          after close the dependencies.
        trap: grammar
        why_wrong: >-
          "Stop to accept" reverses meaning, and "more short" plus "timeout of
          the platform" break comparative and compound forms.
    feedback:
      register: >-
        Operational and ordered.
      hedging: >-
        None; each step is deterministic.
      precision: >-
        The deadline relationship to the platform timeout is the key detail.
      grammar: >-
        "Stop accepting" for ceasing an action; "shorter than the platform
        timeout".
      pragmatics: >-
        Explaining why unbounded waiting fails answers the obvious objection.
    rephrase:
      prompt: >-
        Describe what a user experiences if the deadline is set too long.
      goal: Tie an operational detail to user impact.
    language_focus: [precision, grammar, pragmatics]
    pt_help: >-
      "Stop doing" e parar de fazer; "stop to do" e parar para fazer. Sentidos
      opostos.
    feynman:
      concept: Bounded drain within a platform kill timeout.
      explain_to: A developer whose deploys drop requests.
      constraint: Explain using a shop closing its doors but serving those
        inside.
      self_check: >-
        Is your deadline shorter than the platform's?
    black_box:
      symptom: You closed connections immediately, or waited without a bound.
      expected: Stop accepting, bounded drain, reverse-order dependency close.
      actual: A clean-close description, or unbounded draining.
      root_cause: >-
        Shutdown treated as cleanup rather than as a timed negotiation.
      repair: >-
        Always state the deadline and what it must be shorter than.
    recall:
      active_recall_cue: >-
        What must the drain deadline be shorter than?
      leitner_start_box: 1
      mastery_threshold: 8
    sources:
      - repo: system-design-estudos
        path: areas/09-backend-principles/cards/graceful-shutdown.md
        note: Graceful shutdown sequencing.
      - repo: original
        path: english-arcade/golang/graceful-shutdown
        note: Original interview phrasing authored for this pack.
  - id: golang-09-nil-interface
    version: "1.0.0"
    target: golang
    topic: Nil semantics
    difficulty: 3
    interview_stage: live_coding
    prompt: >-
      This nil check is not firing. Any idea why?
    context: >-
      A function returns a nil pointer stored in an error interface, and the
      caller's comparison against nil is false. It is the classic Go gotcha, and
      the interviewer wants a clean explanation.
    best_answer: >-
      Because the interface is not nil even though the value inside it is. An
      interface holds a type and a value, and here the type is set, so the
      comparison fails. The fix is to return a literal nil rather than a typed
      nil pointer.
    distractors:
      - text: >-
          It looks like the variable is being shadowed somewhere, so the nil
          check is comparing a different variable than the one that was actually
          assigned earlier in the function.
        trap: content
        why_wrong: >-
          Plausible-sounding but wrong diagnosis; it sends the debugging effort
          in an unrelated direction.
      - text: >-
          Nil comparisons with interfaces can behave unexpectedly in Go, it is a
          known subtlety of the language, so I would restructure the code to
          avoid relying on that comparison.
        trap: precision
        why_wrong: >-
          Names the area but not the mechanism, and avoiding the comparison does
          not explain anything.
      - text: >-
          Because the interface is not nil even that the value inside is. One
          interface has one type and one value, and here the type is filled,
          then the comparison fails.
        trap: grammar
        why_wrong: >-
          "Even that" for "even though" and article misuse throughout obscure a
          correct diagnosis.
    feedback:
      register: >-
        Explanatory; this is a teaching moment, not a gotcha to win.
      hedging: >-
        None; the semantics are exact.
      precision: >-
        The type-and-value pair is the mechanism; say it explicitly.
      grammar: >-
        "Even though", "the type is set", "a typed nil pointer".
      pragmatics: >-
        Giving the fix alongside the cause keeps it actionable.
    rephrase:
      prompt: >-
        Explain the same rule to someone who has never hit this bug.
      goal: Teach the mechanism before they need it.
    language_focus: [precision, grammar, register]
    pt_help: >-
      "Mesmo que" e "even though" ou "even if", nunca "even that".
    feynman:
      concept: Interface identity as a type and value pair.
      explain_to: A developer who thinks nil is a single value.
      constraint: Explain using an envelope that is empty but addressed.
      self_check: >-
        Did you explain why the type being set matters?
    black_box:
      symptom: You guessed shadowing, or called it a known subtlety.
      expected: Interface holds type and value; typed nil is not nil.
      actual: An unrelated diagnosis, or vague acknowledgement.
      root_cause: >-
        Nil understood as one value rather than as a pair comparison.
      repair: >-
        Say "type and value" out loud whenever an interface comparison
        surprises you.
    recall:
      active_recall_cue: >-
        What two components make an interface value non-nil?
      leitner_start_box: 1
      mastery_threshold: 8
    sources:
      - repo: system-design-estudos
        path: areas/09-backend-principles/cards/error-handling-fault-tolerance.md
        note: Error value semantics and failure handling.
      - repo: original
        path: english-arcade/golang/nil-interface
        note: Original interview phrasing authored for this pack.
  - id: golang-10-service-boundaries
    version: "1.0.0"
    target: golang
    topic: Service boundaries
    difficulty: 3
    interview_stage: architecture_review
    prompt: >-
      Would you split this into a separate service?
    context: >-
      A module inside a Go monolith has grown large and one team wants to
      extract it. The interviewer is checking whether you separate organisational
      pressure from technical need.
    best_answer: >-
      Not because it is large. I would split it for a different scaling profile,
      release cadence, or a hard failure boundary. If two teams keep colliding,
      I would fix the module boundary first and see if the pressure goes.
    distractors:
      - text: >-
          Yes, splitting large modules into services makes them easier to
          maintain and lets teams deploy independently without coordinating
          releases with everyone else in the organisation.
        trap: content
        why_wrong: >-
          Treats size as the criterion and takes on network failure, latency and
          data consistency costs for an organisational problem.
      - text: >-
          No, monoliths are generally simpler to operate and premature
          extraction usually causes more problems than it solves, so I would
          keep everything together.
        trap: precision
        why_wrong: >-
          The right instinct as an absolute, which is just the opposite bias
          with no criteria attached.
      - text: >-
          Not for be large. I would split if it needs a profile of scaling
          different, a cadence of release different, or a boundary of failure
          hard.
        trap: grammar
        why_wrong: >-
          "For be large" and three post-posed adjective phrases make the
          criteria unreadable.
    feedback:
      register: >-
        Senior and organisationally aware without being political.
      hedging: >-
        None; give criteria rather than caveats.
      precision: >-
        Three named criteria beat any general position.
      grammar: >-
        "Not because it is large", "a different scaling profile".
      pragmatics: >-
        Addressing the likely real driver shows you read the situation, not just
        the question.
    rephrase:
      prompt: >-
        Answer again when the real driver is an on-call boundary.
      goal: Test the criteria against a case they should accept.
    language_focus: [precision, grammar, register]
    feynman:
      concept: Extraction criteria versus organisational pressure.
      explain_to: A team lead who wants their own deploy pipeline.
      constraint: Explain using two shops sharing one till.
      self_check: >-
        Did you name a criterion that would make you say yes?
    black_box:
      symptom: You split on size, or refused on principle.
      expected: Scaling profile, release cadence or failure boundary.
      actual: A size-based yes, or a monolith-by-default no.
      root_cause: >-
        Architecture positions held as preferences instead of as criteria.
      repair: >-
        Keep three extraction criteria ready and test the case against them.
    recall:
      active_recall_cue: >-
        Which three criteria justify extracting a service?
      leitner_start_box: 1
      mastery_threshold: 8
    sources:
      - repo: system-design-estudos
        path: decision-contrasts/02-pod-isolation-vs-microservices.md
        note: Isolation versus microservice extraction contrast.
      - repo: original
        path: english-arcade/golang/service-boundaries
        note: Original interview phrasing authored for this pack.
  - id: golang-11-table-tests
    version: "1.0.0"
    target: golang
    topic: Testing
    difficulty: 1
    interview_stage: technical_screen
    prompt: >-
      Why do Go developers write table-driven tests so often?
    context: >-
      A warm-up with a follow-up hiding inside it. The interviewer wants the
      reason and, ideally, an awareness of when the pattern stops helping.
    best_answer: >-
      Because the cases become data, so adding one is a line rather than a
      function, and the failure output names which case broke. They stop helping
      when the cases need different setup, at which point the table grows
      conditionals and separate tests are clearer.
    distractors:
      - text: >-
          Because it reduces duplication in the test code and keeps everything
          for a given function together in one place, which makes the tests
          easier to read and maintain.
        trap: precision
        why_wrong: >-
          True but generic, and it misses both the named-case output and the
          limits of the pattern.
      - text: >-
          Because it is the idiomatic way to write tests in Go and the standard
          library uses that style throughout, so it is what other Go developers
          expect to see.
        trap: content
        why_wrong: >-
          Appeals to authority instead of explaining what the pattern buys.
      - text: >-
          Because the cases turn data, then to add one is a line instead of a
          function, and the output of failure says which case has broken.
        trap: grammar
        why_wrong: >-
          "Turn data", "to add one is" and "output of failure" break idiom and
          compound-noun order.
    feedback:
      register: >-
        Brief, with a limitation volunteered.
      hedging: >-
        None needed; the trade-off is concrete enough to state plainly.
      precision: >-
        Named subtests in the failure output are the underrated half.
      grammar: >-
        "Become data", "adding one is a line", "failure output".
      pragmatics: >-
        Volunteering when the pattern breaks down raises your assessed level.
    rephrase:
      prompt: >-
        Describe a test you would deliberately not write as a table.
      goal: Prove the limitation is understood, not recited.
    language_focus: [precision, grammar, pragmatics]
    feynman:
      concept: Cases as data, with named failure output.
      explain_to: A developer who copies test functions and edits values.
      constraint: Explain using a spreadsheet of expected results.
      self_check: >-
        Did you say when you would stop using the pattern?
    black_box:
      symptom: You gave duplication reduction or idiom as the reason.
      expected: Cases as data, named failures, plus the setup-divergence limit.
      actual: A generic maintainability claim, or an appeal to convention.
      root_cause: >-
        Patterns adopted from surrounding code without examining their payoff.
      repair: >-
        For each pattern you use daily, name one situation where it hurts.
    recall:
      active_recall_cue: >-
        When does a table-driven test stop being the right shape?
      leitner_start_box: 1
      mastery_threshold: 8
    sources:
      - repo: system-design-estudos
        path: areas/09-backend-principles/cards/testing-code-quality.md
        note: Testing practices and quality signals.
      - repo: original
        path: english-arcade/golang/table-tests
        note: Original interview phrasing authored for this pack.
  - id: golang-12-explaining-to-non-go-team
    version: "1.0.0"
    target: golang
    topic: Cross-team communication
    difficulty: 2
    interview_stage: behavioural_probe
    prompt: >-
      Tell me how you would justify choosing Go to a team that does not use it.
    context: >-
      A stakeholder conversation. The interviewer wants persuasion grounded in
      the problem rather than advocacy, since the wrong tone here creates
      resistance regardless of the technical merit.
    best_answer: >-
      I would start from their constraint rather than from the language. If the
      pain is memory footprint per instance and predictable latency under
      concurrency, Go addresses both directly. If their pain is delivery speed
      on a small team, I would probably not propose a rewrite at all.
    distractors:
      - text: >-
          I would explain that Go is faster, compiles to a single binary and
          handles concurrency much better, which makes it a strong choice for
          backend services compared to most alternatives.
        trap: register
        why_wrong: >-
          Language advocacy without their constraint, which reliably produces
          defensiveness rather than agreement.
      - text: >-
          I would probably not push for it, since the team already knows their
          stack well and introducing a new language creates a learning curve
          that might not be worth it.
        trap: pragmatics
        why_wrong: >-
          Abandons the question rather than answering how you would make the
          case when it is warranted.
      - text: >-
          I would begin for their constraint instead of for the language. If the
          pain is the footprint of memory for instance and the latency under
          concurrency, Go attends the two directly.
        trap: grammar
        why_wrong: >-
          "Begin for", "footprint of memory", "for instance" and "attends" are
          four distinct transfer errors.
    feedback:
      register: >-
        Consultative, not evangelical. Their problem leads.
      hedging: >-
        Hedge the recommendation, never their constraint.
      precision: >-
        Name the two properties that map to their pain.
      grammar: >-
        "Start from", "memory footprint per instance", "addresses both".
      pragmatics: >-
        Saying when you would not propose it is what makes the proposal
        credible.
    rephrase:
      prompt: >-
        Make the same case in two sentences to a sceptical engineering manager.
      goal: Compress persuasion without losing the constraint framing.
    language_focus: [register, grammar, pragmatics]
    pt_help: >-
      "Atender" no sentido de resolver e "address" ou "meet", nao "attend".
    feynman:
      concept: Constraint-led technology advocacy.
      explain_to: An engineer who leads with language features.
      constraint: Do not name a single language feature.
      self_check: >-
        Did you say when you would not recommend it?
    black_box:
      symptom: You advocated features, or declined to make a case.
      expected: Their constraint first, then the two properties that match it.
      actual: Feature listing, or avoidance of the proposal.
      root_cause: >-
        Enthusiasm substituting for the listener's decision criteria.
      repair: >-
        Open every technology proposal with the constraint it addresses.
    recall:
      active_recall_cue: >-
        What should the first sentence of a technology proposal contain?
      leitner_start_box: 1
      mastery_threshold: 8
    sources:
      - repo: system-design-estudos
        path: areas/12-engineering-practice/cards/architecture-decision-records.md
        note: Decision records and constraint-led justification.
      - repo: original
        path: english-arcade/golang/explaining-to-non-go-team
        note: Original interview phrasing authored for this pack.
