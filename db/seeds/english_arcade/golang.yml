- id: golang-07-struct-embedding
  version: 1.4.0
  target: golang
  topic: Composition
  difficulty: 2
  interview_stage: technical_screen
  prompt: Is embedding here the same as inheritance?
  context: The candidate has embedded a struct and the interviewer is checking whether
    the mental model is composition or inherited hierarchy, which changes how the
    code will evolve.
  follow_up:
    prompt: Which promoted method or name collision could surprise a caller, and when
      would an explicit field be clearer?
    goal: Answer the alternative challenge about Composition while keeping the evidence
      boundary explicit.
    challenge_kind: alternative
    best_answer: >-
      I would inspect promoted methods and name collisions on the embedded type. If callers need
      distinct behavior or explicit ownership, I would use a named field and test method dispatch
      instead of assuming inheritance.
    distractors:
    - text: I would defend the first Composition option because offering an alternative
        might make the decision look uncertain.
      why_wrong: A comparison makes the decision rule visible; it does not weaken
        a well-calibrated recommendation.
    - text: I would list every conceivable Composition design without saying which
        requirement should decide between them.
      why_wrong: An option list without a decision rule avoids the trade-off the follow-up
        is testing.
  compression:
    prompt: Explain embedding as method promotion and composition, then name one boundary
      where explicit delegation wins.
    goal: Compress the Composition answer into its decision, premise, trade-off, and
      verification step.
  best_answer: No. I read embedding as promoting the methods to the outer type without
    dynamic dispatch back to that outer type. If the embedded method calls another
    method, it calls its own, not an override; that is the behaviour that surprises me
    when I bring an inheritance expectation to Go.
  distractors:
  - text: It is effectively the same thing in practice, since the outer type gains
      all the methods of the embedded type and can override them by defining its own
      version with the same name.
    trap: content
    why_wrong: Shadowing is not overriding; the embedded method still calls its own
      methods, which is the entire difference.
  - text: Not exactly, they are different mechanisms, but the practical effect is
      quite similar in most everyday situations you would encounter in a normal codebase.
    trap: precision
    why_wrong: Hedged non-answer that never names the dispatch difference.
  - text: No, the embedding promotes the methods, then the type external receives
      them, but does not exist dispatch dynamic back for the type external.
    trap: grammar
    why_wrong: Post-posed adjectives and the dropped expletive subject make the correct
      point unreadable.
  feedback:
    register: Clear correction without condescension.
    hedging: None; the semantics are unambiguous.
    precision: Name the absence of dynamic dispatch; that is the whole answer.
    grammar: '"The outer type", "there is no dynamic dispatch".'
    pragmatics: Naming who gets surprised makes the point memorable.
  rephrase:
    prompt: Give an example where expecting an override would cause a real bug.
    goal: Convert a semantic distinction into a failure case.
  language_focus:
  - precision
  - grammar
  - register
  feynman:
    concept: Method promotion without dynamic dispatch.
    explain_to: A developer fluent in class inheritance.
    constraint: Explain using a contractor who always calls their own team.
    self_check: Did you say which method the embedded one calls?
    reasoning_check: Can you identify the hidden premise behind Composition, give
      a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You equated embedding with inheritance, or hedged.
    expected: Promotion without dispatch back to the outer type.
    actual: An override claim, or a vague "similar in practice".
    root_cause: Mapping Go onto a class-based model instead of learning composition.
    repair: Write the surprising case once and keep it as your reference example.
    reasoning_error: If your Composition answer failed, classify the mistake as a
      fact, assumption, comparison, failure, or certainty error before proposing the
      smallest repair.
  recall:
    active_recall_cue: Which method does an embedded method call, its own or the override?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Composition without presenting
      an assumption as a fact?
    black_box_probe: When the Composition answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: golang-07-struct-embedding-delayed-7
      prompt: >-
        Embedding promotes a method whose name collides with an outer method and callers expect override dispatch. What boundary changes?
      changed_constraint: >-
        the caller needs explicit ownership when promotion would hide dispatch semantics
      new_evidence: >-
        a method invoked through the embedded value bypasses the outer method
      best_answer: >-
        I would use a named field when distinct behavior is required, test method dispatch explicitly, and avoid describing embedding as inheritance.
      distractors:
      - text: I would preserve every part of the original Composition answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Composition explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
