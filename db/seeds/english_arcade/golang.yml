    grammar: '"The outer type", "there is no dynamic dispatch".'
    pragmatics: Naming who gets surprised makes the point memorable.
  rephrase:
    prompt: Give an example where expecting an override would cause a real bug.
    goal: Convert a semantic distinction into a failure case.
