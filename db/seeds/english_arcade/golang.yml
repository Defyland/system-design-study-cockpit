        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: This Go exercise can test reasoning about Cross-team communication,
        but it cannot prove an unmeasured production outcome, personal ownership,
        or universal rule.
