---
contract_version: 1.4.0
target:
  key: golang
  label: Golang
  blurb: 'Explain interfaces, goroutines and context the way a Go engineer does: plainly,
    with ownership and cancellation made explicit.'
  focus_areas:
  - interfaces and composition
  - goroutines and channels
  - context and cancellation
  - errors and wrapping
  - profiling and service boundaries
  simulation:
    minutes: 45
    structure:
    - label: Interfaces and API shape warm-up
      minutes: 8
    - label: Concurrency and ownership deep dive
      minutes: 15
    - label: Errors, context and failure paths
      minutes: 12
    - label: Profiling and service boundaries
      minutes: 10
  critical_thinking:
    learner_prompts:
      evidence_ledger: For Go, record whether each claim about interfaces, goroutines,
        context cancellation, errors, and service boundaries is a verified fact, an
        inference, an assumption, or an unknown before you defend it.
      problem_frame: Frame every Go answer with the actor, requirement, constraint,
        success condition, and unanswered question that could change the decision.
      comparison: When Go offers a real choice, compare two options by benefit, cost
        or risk, valid-when condition, and an explicit decision rule.
      failure_probe: Ask which counterexample, edge case, or failure mode could break
        the Go recommendation, then state the smallest test or containment step.
      certainty_review: 'Calibrate certainty in Go: name the evidence, separate correlation
        from causality, and say what new observation would make you revise the answer.'
    rubric:
      facts_correct: Names the verified interfaces, goroutines, context cancellation,
        errors, and service boundaries facts without smuggling in a result or capability
        that the prompt does not establish.
      assumptions_explicit: Labels the Go premise that is still assumed and asks the
        smallest clarifying question that matters.
      alternatives_considered: Considers a credible alternative for Go, or explains
        the hard constraint that makes comparison a false equivalence.
      tradeoff_quality: Connects the Go choice to a benefit, a cost or risk, and the
        condition under which another choice wins.
      follow_up_adaptation: Responds to an adversarial Go follow-up by changing the
        claim or evidence boundary rather than repeating a memorised answer.
      certainty_calibration: Uses high, medium, or low certainty deliberately and
        names the evidence that would update the Go recommendation.
cards:
- id: golang-card-interface-consumer
  front: Where do Go interfaces belong?
  back: I define a small interface in the consumer package. The producer returns a
    concrete type, and I declare only the method my caller needs.
  box: 1
  source:
    repo: system-design-estudos
    path: areas/09-backend-principles/cards/application-boundaries-and-service-layer.md
    note: Boundary and dependency-direction principles.
  critical_thinking:
    cue: Where do Go interfaces belong? Before answering, separate the stated fact
      from your assumption and name one condition that could change it.
    check: For this Go card, can you compare two options, name one failure mode, and
      state what evidence would update the recommendation?
- id: golang-card-goroutine-ownership
  front: What must you say when you start a goroutine?
  back: I name who stops the goroutine and how. If I cannot identify its owner and
    cancellation path, it is a leak waiting for production traffic.
  box: 2
  source:
    repo: system-design-estudos
    path: areas/09-backend-principles/cards/graceful-shutdown.md
    note: Lifecycle and shutdown discipline.
  critical_thinking:
    cue: What must you say when you start a goroutine? Before answering, separate
      the stated fact from your assumption and name one condition that could change
      it.
    check: For this Go card, can you compare two options, name one failure mode, and
      state what evidence would update the recommendation?
- id: golang-card-error-wrapping
  front: How do you talk about error wrapping precisely?
  back: I wrap with context at each boundary, compare with errors.Is or errors.As, and
    never match on message strings.
  box: 1
  source:
    repo: system-design-estudos
    path: areas/09-backend-principles/cards/error-handling-fault-tolerance.md
    note: Error handling and fault tolerance practices.
  critical_thinking:
    cue: How do you talk about error wrapping precisely? Before answering, separate
      the stated fact from your assumption and name one condition that could change
      it.
    check: For this Go card, can you compare two options, name one failure mode, and
      state what evidence would update the recommendation?
items:
- id: golang-01-interface-placement
  version: 1.4.0
  target: golang
  topic: Interfaces
  difficulty: 2
  interview_stage: technical_screen
  prompt: Where would you define the interface for this dependency?
  context: A service needs a storage dependency. The interviewer wants to know whether
    you follow Go's consumer-side convention or bring habits from other languages.
  follow_up:
    prompt: Which package consumes the behavior, and what smallest interface would
      let that package test its dependency without mirroring the concrete type?
    goal: Answer the evidence challenge about Interfaces while keeping the evidence
      boundary explicit.
    challenge_kind: evidence
    best_answer: >-
      I would define the interface beside the consumer, keep only the methods it calls, and use a
      fake that tests behavior rather than mirroring the producer. I would inspect package ownership
      and avoid an interface merely for style.
    distractors:
    - text: I would cite my experience with Interfaces as enough proof and move on
        without naming an observation.
      why_wrong: Experience can guide a hypothesis, but it does not replace evidence
        tied to this context.
    - text: I would collect every possible metric about Interfaces before making even
        a provisional recommendation.
      why_wrong: A focused decision can start with one discriminating observation
        rather than an unbounded data request.
  compression:
    prompt: Explain interface placement as consumer need, minimal method set, and
      a fake that tests behavior.
    goal: Compress the Interfaces answer into its decision, premise, trade-off, and
      verification step.
  best_answer: In the consumer package, and as small as I can make it. The storage
    package returns a concrete type, and my service declares the one or two methods
    it actually uses, which keeps the dependency pointing inwards and makes the test
    double trivial.
  distractors:
  - text: In the storage package alongside the implementation, so that everyone who
      needs it can import the same interface definition and there is a single canonical
      contract for the dependency.
    trap: content
    why_wrong: That is the Java convention. In Go it forces consumers to depend on
      a package they do not need and grows the interface over time.
  - text: Wherever it makes the most sense for the project structure, since different
      teams organise this differently and consistency within the codebase matters
      more than the specific choice.
    trap: pragmatics
    why_wrong: Avoids the question. There is a well-established Go convention here
      and the interviewer is checking whether you know it.
  - text: In the package of the consumer and the more small possible, because then
      the service declares only the methods that it is using really.
    trap: grammar
    why_wrong: '"The package of the consumer" and "the more small possible" invert
      English possessive and superlative forms.'
  feedback:
    register: Idiomatic and specific; name the convention as a convention.
    hedging: None needed; this is settled Go practice.
    precision: 'Say why it matters: dependency direction and trivial test doubles.'
    grammar: '"The consumer package", "as small as possible".'
    pragmatics: Mentioning testing pre-empts the natural follow-up.
  rephrase:
    prompt: Explain the same convention to a Java developer joining the team.
    goal: Practise contrasting conventions without dismissing either.
  language_focus:
  - precision
  - grammar
  - pragmatics
  pt_help: 'Ingles usa substantivo composto: "the consumer package", nao "the package
    of the consumer".'
  feynman:
    concept: Consumer-side interfaces and dependency direction.
    explain_to: A developer coming from Java or C#.
    constraint: Explain using a job description written by the employer.
    self_check: Did you say which package owns the concrete type?
    reasoning_check: Can you identify the hidden premise behind Interfaces, give a
      counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You placed the interface with the implementation.
    expected: Consumer package, minimal method set, concrete return.
    actual: Producer-side definition, or deferral to team style.
    root_cause: Carrying interface habits from languages with nominal typing.
    repair: Ask who consumes the behaviour before deciding who declares it.
    reasoning_error: If your Interfaces answer failed, classify the mistake as a fact,
      assumption, comparison, failure, or certainty error before proposing the smallest
      repair.
  recall:
    active_recall_cue: Which package should declare an interface in Go, and why?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Interfaces without presenting
      an assumption as a fact?
    black_box_probe: When the Interfaces answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: golang-01-interface-placement-delayed-1
      prompt: >-
        A fake mirrors twelve producer methods, but the consumer calls only two. What interface boundary would you keep?
      changed_constraint: >-
        the consumer needs a small behavior contract rather than a producer-shaped interface
      new_evidence: >-
        the fake exposes unused methods and a consumer test uses only two calls
      best_answer: >-
        I would define the interface beside the consumer with the two methods it calls, keep the producer concrete, and test behavior through a focused fake.
      distractors:
      - text: I would preserve every part of the original Interfaces answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Interfaces explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/09-backend-principles/cards/application-boundaries-and-service-layer.md
    note: Boundaries and dependency direction.
  - repo: original
    path: english-arcade/golang/interface-placement
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: 'Interfaces: inspect Interfaces evidence next; which edge case for Interfaces
      would alter the trade-off?'
    goal: Move from the short Interfaces answer to a deep, evidence-led defence without
      inventing an outcome.
  critical_thinking:
    problem_frame: >-
      A consumer needs a small dependency behavior while a producer exposes a larger concrete API; I must place the interface where the behavior is consumed.
    claim_map:
      fact: >-
        Go interfaces are satisfied implicitly and need only the methods the consumer uses.
      inference: >-
        A consumer-owned interface limits coupling and keeps the fake focused.
      assumption: >-
        I am assuming the consumer owns the behavior contract and does not need producer-specific methods.
      unknown: >-
        Package ownership, method set, fake behavior, and future substitutability are unknown.
    comparison:
      applicable: false
      rejected_alternative: >-
        Treating a consumer-owned minimal interface and a producer-owned full interface as interchangeable styles would be a false equivalence: they create different dependency and test boundaries.
      hard_constraint: >-
        The hard constraint is to keep the consumer dependent on the behavior it uses while returning the producer's concrete value.
      decision_rule: >-
        Inspect the call sites first; place the smallest interface with the consumer and keep it concrete only when no substitution boundary is needed.
    failure_probe:
      kind: counterexample
      prompt: >-
        What unused producer method or consumer assertion would show the interface is too broad or misplaced?
    evidence_check:
      basis: Check the Interfaces claim against system-design-estudos/areas/09-backend-principles/cards/application-boundaries-and-service-layer.md
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: This Go exercise can test reasoning about Interfaces, but it cannot
        prove an unmeasured production outcome, personal ownership, or universal rule.
      checked_on: '2026-08-25'
    certainty:
      level: high
      rationale: >-
        I am confident in consumer-owned minimal interfaces; the exact method set requires call-site evidence.
      update_trigger: >-
        Update when a new caller, package dependency, or behavior test changes the interface owner.
    rubric:
      facts_correct: Names the verified Interfaces facts without smuggling in a result,
        scale, or capability that the prompt does not establish.
      assumptions_explicit: Labels the Interfaces premise that is still assumed and
        asks the smallest clarifying question that matters.
      alternatives_considered: Compares two credible Interfaces options, or explains
        the hard constraint that makes comparison a false equivalence.
      tradeoff_quality: Connects the Interfaces choice to a benefit, a cost or risk,
        and the condition under which another choice wins.
      follow_up_adaptation: Responds to the evidence challenge about Interfaces by
        changing the claim or evidence boundary rather than repeating the base answer.
      certainty_calibration: Uses high certainty deliberately and names the evidence
        that would update the Interfaces recommendation.
- id: golang-02-goroutine-leak
  version: 1.4.0
  target: golang
  topic: Goroutines
  difficulty: 3
  interview_stage: deep_dive
  prompt: What happens to this goroutine if nobody reads from the channel?
  context: The code starts a goroutine that sends a result on an unbuffered channel,
    but the caller returns early on timeout. The interviewer is probing whether you
    can see the leak.
  follow_up:
    prompt: What cancellation or channel-ownership rule stops this goroutine from
      waiting forever, and how would you prove it in a test?
    goal: Answer the alternative challenge about Goroutines while keeping the evidence
      boundary explicit.
    challenge_kind: alternative
    best_answer: >-
      It blocks on the send forever, so the goroutine never exits and whatever it holds stays alive.
      I would give the goroutine a context or channel owner, test cancellation and a blocked send,
      and check the goroutine count after the test. A buffer is appropriate only when its bound and
      backpressure behavior are explicit.
    distractors:
    - text: I would defend the first Goroutines option because offering an alternative
        might make the decision look uncertain.
      why_wrong: A comparison makes the decision rule visible; it does not weaken
        a well-calibrated recommendation.
    - text: I would list every conceivable Goroutines design without saying which
        requirement should decide between them.
      why_wrong: An option list without a decision rule avoids the trade-off the follow-up
        is testing.
  compression:
    prompt: Summarize the leak prevention as owner, shutdown signal, and evidence
      that every goroutine can exit.
    goal: Compress the Goroutines answer into its decision, premise, trade-off, and
      verification step.
  best_answer: It blocks on the send forever, so the goroutine never exits and whatever
    it holds stays alive. I would either give the channel a buffer of one so the send
    always completes, or select on the context so the goroutine gives up when the
    caller does.
  distractors:
  - text: The goroutine will be garbage collected once nothing references the channel
      any more, so it gets cleaned up automatically without leaking any memory in
      the process.
    trap: content
    why_wrong: Blocked goroutines are never collected; that is precisely why leaks
      accumulate under load.
  - text: It would probably just wait there, which is not ideal, so it would be better
      to handle that case somehow to avoid any potential issues later on in production.
    trap: precision
    why_wrong: Identifies the symptom vaguely and proposes nothing concrete, so it
      demonstrates no working knowledge.
  - text: It stays blocked in the send for always, then the goroutine never exits
      and everything that it is holding continues alive in the memory of the process.
    trap: grammar
    why_wrong: '"For always", "continues alive" and "the memory of the process" are
      all literal translations.'
  feedback:
    register: Precise and unhurried; leaks are a mechanism question.
    hedging: None; the blocking behaviour is deterministic.
    precision: Give both fixes, since they suit different situations.
    grammar: '"Blocks forever", "stays alive", "process memory".'
    pragmatics: Connecting the leak to what it retains shows production experience.
  rephrase:
    prompt: Explain how you would detect this leak in a running service.
    goal: Move from cause to observation.
  language_focus:
  - precision
  - grammar
  - hedging
  feynman:
    concept: Blocked sends and goroutine lifetime.
    explain_to: A developer who assumes the runtime cleans everything up.
    constraint: Explain using someone holding a door for a person who left.
    self_check: Did you name both the buffer and the context fix?
    reasoning_check: Can you identify the hidden premise behind Goroutines, give a
      counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You assumed collection, or described the problem vaguely.
    expected: Permanent block, retained memory, buffer or context fix.
    actual: A garbage-collection claim, or an unspecific concern.
    root_cause: Goroutines modelled as tasks rather than as blocked OS-level waiters.
    repair: For every channel send, ask who guarantees a receive.
    reasoning_error: If your Goroutines answer failed, classify the mistake as a fact,
      assumption, comparison, failure, or certainty error before proposing the smallest
      repair.
  recall:
    active_recall_cue: Why is a blocked goroutine never garbage collected?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Goroutines without presenting
      an assumption as a fact?
    black_box_probe: When the Goroutines answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: golang-02-goroutine-leak-delayed-2
      prompt: >-
        A blocked send remains after request cancellation and the goroutine count rises. What ownership rule is missing?
      changed_constraint: >-
        the goroutine needs cancellation or a bounded owner for its channel send
      new_evidence: >-
        a canceled request leaves the sender blocked and a leak test observes a rising goroutine count
      best_answer: >-
        I would pass a context or define channel ownership, select on cancellation, and test blocked-send cleanup and goroutine count rather than add an unbounded buffer.
      distractors:
      - text: I would preserve every part of the original Goroutines answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Goroutines explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/09-backend-principles/cards/concurrency-parallelism.md
    note: Concurrency primitives and failure modes.
  - repo: original
    path: english-arcade/golang/goroutine-leak
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: 'Deep dive on Goroutines: compare Goroutines options with one measurement;
      which failure around Goroutines would make Goroutines switch?'
    goal: Move from the short Goroutines answer to a deep, evidence-led defence without
      inventing an outcome.
  critical_thinking:
    problem_frame: >-
      A sender can block forever when no receiver remains; I must define channel ownership, cancellation, and a bounded buffer policy.
    claim_map:
      fact: >-
        A blocked channel send prevents the goroutine from exiting.
      inference: >-
        Context cancellation or an owned channel can bound the wait; a buffer only changes the first send boundary.
      assumption: >-
        I am assuming the caller can cancel and that dropping a result is an explicit policy.
      unknown: >-
        Channel owner, buffer bound, cancellation timing, and retained resources are unknown.
    comparison:
      applicable: true
      alternatives:
      - option: pass cancellation to the sender and let it select on the context
        benefit: I can prove the goroutine exits when the caller times out and keep backpressure visible.
        cost_or_risk: Every producer must honor cancellation, and the result path needs a clear owner.
        valid_when: Use it when the caller may stop waiting before the result is ready.
      - option: use a bounded buffer sized to the producer contract
        benefit: I let one known result complete without a receiver and keep the send simple.
        cost_or_risk: A buffer does not solve an unbounded producer or downstream work, and an unjustified size hides pressure.
        valid_when: Use it only when the result count and ownership make the buffer bound explicit.
      decision_rule: I prefer cancellation for a request-scoped producer; I use a buffer only when its bound proves the goroutine can finish without masking overload.
    failure_probe:
      kind: edge_case
      prompt: >-
        What cancellation and blocked-send test would prove the goroutine exits rather than leak?
    evidence_check:
      basis: Check the Goroutines claim against system-design-estudos/areas/09-backend-principles/cards/concurrency-parallelism.md
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: This Go exercise can test reasoning about Goroutines, but it cannot
        prove an unmeasured production outcome, personal ownership, or universal rule.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        I am confident in the leak mechanism; the safe cancellation or drop policy depends on ownership and result semantics.
      update_trigger: >-
        Update when leak tests or result-delivery requirements change whether cancellation, buffering, or ownership should win.
    rubric:
      facts_correct: Names the verified Goroutines facts without smuggling in a result,
        scale, or capability that the prompt does not establish.
      assumptions_explicit: Labels the Goroutines premise that is still assumed and
        asks the smallest clarifying question that matters.
      alternatives_considered: Compares two credible Goroutines options, or explains
        the hard constraint that makes comparison a false equivalence.
      tradeoff_quality: Connects the Goroutines choice to a benefit, a cost or risk,
        and the condition under which another choice wins.
      follow_up_adaptation: Responds to the alternative challenge about Goroutines
        by changing the claim or evidence boundary rather than repeating the base
        answer.
      certainty_calibration: Uses medium certainty deliberately and names the evidence
        that would update the Goroutines recommendation.
- id: golang-03-context-propagation
  version: 1.4.0
  target: golang
  topic: Context
  difficulty: 2
  interview_stage: architecture_review
  prompt: Why pass context as the first argument everywhere?
  context: A design review. The interviewer wants to know whether you understand context
    as a cancellation and deadline carrier rather than as a convention you follow
    without thinking.
  follow_up:
    prompt: Which deadline or cancellation should reach the downstream call, and what
      should the function do when the context is already done?
    goal: Answer the failure challenge about Context while keeping the evidence boundary
      explicit.
    challenge_kind: failure
    best_answer: >-
      I would pass the request context to the downstream call, return promptly when ctx.Done fires,
      and verify the deadline and cancellation path with a fake dependency. I would not create a
      child context that outlives the request without a stated reason.
    distractors:
    - text: I would describe the Context failure as impossible because the happy path
        already passed its test.
      why_wrong: Passing a happy path does not test the boundary, failure mode, or
        recovery being challenged.
    - text: I would add retries to Context immediately and assume the system would
        become reliable.
      why_wrong: Retries can amplify load or duplicate effects; the failure and containment
        policy must be specified first.
  compression:
    prompt: State context propagation as boundary, cancellation behavior, and the
      error the caller can act on.
    goal: Compress the Context answer into its decision, premise, trade-off, and verification
      step.
  best_answer: I propagate cancellation through the whole call chain because a client
    hang-up should stop downstream work nobody will read. I also carry the deadline,
    so a slow dependency cannot outlive the request that started it.
  distractors:
  - text: Because it is the standard Go convention and most libraries expect it, so
      following it keeps the code consistent with the rest of the ecosystem and with
      what other developers expect.
    trap: precision
    why_wrong: Convention is the consequence, not the reason. It says nothing about
      cancellation or deadlines.
  - text: Because it lets you pass request-scoped values like the trace ID and the
      authenticated user down through the layers without changing every function signature.
    trap: content
    why_wrong: Values are the least important and most abused part of context; leading
      with them signals the wrong mental model.
  - text: Because the cancellation needs to travel for all the chain of calls, then
      if the client hangs up every call downstream should to stop the work.
    trap: grammar
    why_wrong: '"Travel for", "chain of calls" and "should to stop" are preposition,
      compound-noun and modal errors.'
  feedback:
    register: Purposeful. Explain the mechanism, then the convention follows.
    hedging: None needed; cancellation semantics are well defined.
    precision: Cancellation and deadlines are the answer; values are a footnote.
    grammar: '"The whole call chain", "should stop"; modals take a bare infinitive.'
    pragmatics: The hang-up example makes an abstract mechanism immediately concrete.
  rephrase:
    prompt: Explain what breaks in a service that ignores the context it receives.
    goal: Test understanding through the failure case.
  language_focus:
  - precision
  - grammar
  - pragmatics
  pt_help: 'Modais em ingles nao levam "to": "should stop", nunca "should to stop".'
  feynman:
    concept: Context as a cancellation and deadline carrier.
    explain_to: A developer who treats context as a bag of values.
    constraint: Explain using a restaurant order that gets cancelled.
    self_check: Did you lead with cancellation rather than with values?
    reasoning_check: Can you identify the hidden premise behind Context, give a counterexample,
      and explain how the evidence changes your conclusion?
  black_box:
    symptom: You justified it by convention or led with values.
    expected: Cancellation and deadline propagation across the call chain.
    actual: An appeal to consistency, or a focus on request-scoped values.
    root_cause: Context adopted as a signature requirement rather than as a control
      mechanism.
    repair: Explain context by describing what happens when the client disconnects.
    reasoning_error: If your Context answer failed, classify the mistake as a fact,
      assumption, comparison, failure, or certainty error before proposing the smallest
      repair.
  recall:
    active_recall_cue: What two things does context carry that matter most?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Context without presenting
      an assumption as a fact?
    black_box_probe: When the Context answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: golang-03-context-propagation-delayed-3
      prompt: >-
        A downstream client ignores cancellation after the caller disconnects. Which boundary must change?
      changed_constraint: >-
        the request context must reach the downstream operation and stop work after cancellation
      new_evidence: >-
        a canceled request leaves the fake downstream call running past its deadline
      best_answer: >-
        I would pass the request context to the downstream call, return on ctx.Done, and test deadline and cancellation propagation with a fake dependency.
      distractors:
      - text: I would preserve every part of the original Context answer because changing
          it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Context explanation with a new design without
          identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/09-backend-principles/cards/graceful-shutdown.md
    note: Cancellation and shutdown propagation.
  - repo: original
    path: english-arcade/golang/context-propagation
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: 'Defend Context after a counterexample: which Context assumption changes,
      and what evidence keeps the revised Context choice honest?'
    goal: Move from the short Context answer to a deep, evidence-led defence without
      inventing an outcome.
  critical_thinking:
    problem_frame: >-
      A request deadline and cancellation must cross every downstream boundary; I must ensure no dependency outlives the caller without an explicit reason.
    claim_map:
      fact: >-
        Context carries cancellation and deadlines through a Go call chain.
      inference: >-
        Passing the request context lets downstream work stop when the client disconnects or deadline expires.
      assumption: >-
        I am assuming the downstream client honors the context and no detached work is required.
      unknown: >-
        Cancellation timing, dependency behavior, and any intentional background work are unknown.
    comparison:
      applicable: true
      alternatives:
      - option: pass context through every request-scoped call and honor its deadline
        benefit: I propagate cancellation and time budget to the actual dependency boundary.
        cost_or_risk: Every API must accept and forward the context correctly, or the chain still leaks work.
        valid_when: Use it for inbound request, RPC, database, and downstream calls.
      - option: pass a custom cancellation flag or timeout configuration beside the request
        benefit: It may fit a legacy API that cannot accept context yet.
        cost_or_risk: Different flags and timers drift, and libraries cannot observe one standard deadline or cancellation signal.
        valid_when: Use it only at an adapter boundary while migrating to context-aware APIs.
      decision_rule: I use context for request lifetime and cancellation; I keep a custom mechanism only as a bounded compatibility adapter with a migration test.
    failure_probe:
      kind: failure_mode
      prompt: >-
        What canceled-request test would show the downstream call continues past the deadline?
    evidence_check:
      basis: Check the Context claim against system-design-estudos/areas/09-backend-principles/cards/graceful-shutdown.md
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
