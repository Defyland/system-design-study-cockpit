- id: golang-10-service-boundaries
  version: 1.4.0
  target: golang
  topic: Service boundaries
  difficulty: 3
  interview_stage: architecture_review
  prompt: Would you split this into a separate service?
  context: A module inside a Go monolith has grown large and one team wants to extract
    it. The interviewer is checking whether you separate organisational pressure from
    technical need.
  follow_up:
    prompt: Which ownership or latency boundary justifies a service split, and what
      operational cost would the split introduce?
    goal: Answer the assumption challenge about Service boundaries while keeping the
      evidence boundary explicit.
    challenge_kind: assumption
    best_answer: >-
      I would split for a different ownership, scaling, deployment, or failure boundary, not merely
      because a module is large. I would measure coupling, latency, and operational cost first; if a
      module boundary resolves team collisions, I would keep one process.
    distractors:
    - text: I would repeat my original Service boundaries answer with more confidence
        because the interviewer probably assumes the usual case.
      why_wrong: It hides the premise instead of checking whether the usual case is
        actually part of this problem.
    - text: I would stop proposing anything about Service boundaries until every surrounding
        requirement had been documented in full.
      why_wrong: It treats uncertainty as a reason for paralysis and offers no bounded
        next step.
  compression:
    prompt: Defend the boundary using coupling, independent scaling, and the deployment
      or observability cost.
    goal: Compress the Service boundaries answer into its decision, premise, trade-off,
      and verification step.
  best_answer: Not because it is large. I would split it for a different scaling profile,
    release cadence, or a hard failure boundary. If two teams keep colliding, I would
    fix the module boundary first and see if the pressure goes.
  distractors:
  - text: Yes, splitting large modules into services makes them easier to maintain
      and lets teams deploy independently without coordinating releases with everyone
      else in the organisation.
    trap: content
    why_wrong: Treats size as the criterion and takes on network failure, latency
      and data consistency costs for an organisational problem.
  - text: No, monoliths are generally simpler to operate and premature extraction
      usually causes more problems than it solves, so I would keep everything together.
    trap: precision
    why_wrong: The right instinct as an absolute, which is just the opposite bias
      with no criteria attached.
  - text: Not for be large. I would split if it needs a profile of scaling different,
      a cadence of release different, or a boundary of failure hard.
    trap: grammar
    why_wrong: '"For be large" and three post-posed adjective phrases make the criteria
      unreadable.'
  feedback:
    register: Senior and organisationally aware without being political.
    hedging: None; give criteria rather than caveats.
    precision: Three named criteria beat any general position.
    grammar: '"Not because it is large", "a different scaling profile".'
    pragmatics: Addressing the likely real driver shows you read the situation, not
      just the question.
  rephrase:
    prompt: Answer again when the real driver is an on-call boundary.
    goal: Test the criteria against a case they should accept.
  language_focus:
  - precision
  - grammar
  - register
  feynman:
    concept: Extraction criteria versus organisational pressure.
    explain_to: A team lead who wants their own deploy pipeline.
    constraint: Explain using two shops sharing one till.
    self_check: Did you name a criterion that would make you say yes?
    reasoning_check: Can you identify the hidden premise behind Service boundaries,
      give a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You split on size, or refused on principle.
    expected: Scaling profile, release cadence or failure boundary.
    actual: A size-based yes, or a monolith-by-default no.
    root_cause: Architecture positions held as preferences instead of as criteria.
    repair: Keep three extraction criteria ready and test the case against them.
    reasoning_error: If your Service boundaries answer failed, classify the mistake
      as a fact, assumption, comparison, failure, or certainty error before proposing
      the smallest repair.
  recall:
    active_recall_cue: Which three criteria justify extracting a service?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Service boundaries without
      presenting an assumption as a fact?
    black_box_probe: When the Service boundaries answer failed, did you locate the
      reasoning error before changing the implementation?
    delayed_variant:
      id: golang-10-service-boundaries-delayed-10
      prompt: >-
        A module is large but has one release cadence and no independent failure or scaling profile. What would you measure before splitting it?
      changed_constraint: >-
        a service split needs an ownership, deployment, scaling, or failure boundary
      new_evidence: >-
        coupling and deployment metrics show no independent operational boundary
      best_answer: >-
        I would keep one process, measure ownership, latency, release cadence, and failure isolation, and split only when a concrete boundary outweighs distributed-system cost.
      distractors:
      - text: I would preserve every part of the original Service boundaries answer
          because changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Service boundaries explanation with a new
          design without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: decision-contrasts/02-pod-isolation-vs-microservices.md
    note: Isolation versus microservice extraction contrast.
  - repo: original
    path: english-arcade/golang/service-boundaries
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: 'Deep dive on Service boundaries: compare Service boundaries options with
      one measurement; which failure around Service boundaries would make Service
      boundaries switch?'
    goal: Move from the short Service boundaries answer to a deep, evidence-led defence
      without inventing an outcome.
  critical_thinking:
    problem_frame: >-
      A large module needs a concrete ownership, scaling, deployment, or failure boundary before becoming a service.
    claim_map:
      fact: >-
        Module size alone does not establish a service boundary.
      inference: >-
        A separate service can isolate release or failure behavior but adds network, deployment, and operational cost.
      assumption: >-
        I am assuming one process can still meet latency, ownership, and release needs.
      unknown: >-
        Team ownership, traffic profile, failure isolation, deployment cadence, and operational capacity are unknown.
    comparison:
      applicable: true
      alternatives:
      - option: keep the boundary in one deployable service with a clear module or package seam
        benefit: I retain local transactions and debugging while reducing coupling inside the codebase.
        cost_or_risk: Teams and scaling remain coupled when the workload or failure domain truly differs.
        valid_when: Use it when the data, release cadence, and failure boundary are shared.
      - option: split a separately deployable service around an independent workload or failure boundary
        benefit: I can scale, release, or contain that boundary independently.
        cost_or_risk: I add network failure, data ownership, deployment, and observability costs.
        valid_when: Use it only when measured scaling, cadence, or isolation pressure justifies those costs.
      decision_rule: I fix the module boundary first; I split the service only when evidence shows a distinct scaling, release, or failure requirement.
    failure_probe:
      kind: counterexample
      prompt: >-
        What measured boundary would show a process split solves a problem a module split cannot?
    evidence_check:
      basis: Check the Service boundaries claim against system-design-estudos/decision-contrasts/02-pod-isolation-vs-microservices.md
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: This Go exercise can test reasoning about Service boundaries, but
        it cannot prove an unmeasured production outcome, personal ownership, or universal
        rule.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        I am confident in measuring before splitting; the architecture depends on ownership and operational evidence.
      update_trigger: >-
        Update when coupling, release, latency, or failure metrics establish an independent service boundary.
    rubric:
      facts_correct: Names the verified Service boundaries facts without smuggling
        in a result, scale, or capability that the prompt does not establish.
      assumptions_explicit: Labels the Service boundaries premise that is still assumed
        and asks the smallest clarifying question that matters.
      alternatives_considered: Compares two credible Service boundaries options, or
        explains the hard constraint that makes comparison a false equivalence.
      tradeoff_quality: Connects the Service boundaries choice to a benefit, a cost
        or risk, and the condition under which another choice wins.
      follow_up_adaptation: Responds to the assumption challenge about Service boundaries
        by changing the claim or evidence boundary rather than repeating the base
        answer.
      certainty_calibration: Uses medium certainty deliberately and names the evidence
        that would update the Service boundaries recommendation.
- id: golang-11-table-tests
  version: 1.4.0
  target: golang
  topic: Testing
  difficulty: 1
  interview_stage: technical_screen
  prompt: Why do Go developers write table-driven tests so often?
  context: A warm-up with a follow-up hiding inside it. The interviewer wants the
    reason and, ideally, an awareness of when the pattern stops helping.
  follow_up:
    prompt: Which input cases belong in the table, and how would the test name make
      a failure useful to a maintainer?
    goal: Answer the evidence challenge about Testing while keeping the evidence boundary
      explicit.
    challenge_kind: evidence
    best_answer: >-
      I would table cases that share setup and assertions, name each case with input and expected
      behavior, and split tests when setup or lifecycle differs. I would run the failing case alone
      to verify that its name gives a maintainer useful diagnosis.
    distractors:
    - text: I would cite my experience with Testing as enough proof and move on without
        naming an observation.
      why_wrong: Experience can guide a hypothesis, but it does not replace evidence
        tied to this context.
    - text: I would collect every possible metric about Testing before making even
        a provisional recommendation.
      why_wrong: A focused decision can start with one discriminating observation
        rather than an unbounded data request.
  compression:
    prompt: Describe table-driven tests as explicit cases, shared execution, and failure
      output that explains the contract.
    goal: Compress the Testing answer into its decision, premise, trade-off, and verification
      step.
  best_answer: I make the cases data, so adding one is a line rather than a function,
    and the failure output names which case broke. I stop using a table when cases need
    different setup; once conditionals grow, separate tests are clearer.
  distractors:
  - text: Because it reduces duplication in the test code and keeps everything for
      a given function together in one place, which makes the tests easier to read
      and maintain.
    trap: precision
    why_wrong: True but generic, and it misses both the named-case output and the
      limits of the pattern.
  - text: Because it is the idiomatic way to write tests in Go and the standard library
      uses that style throughout, so it is what other Go developers expect to see.
    trap: content
    why_wrong: Appeals to authority instead of explaining what the pattern buys.
  - text: Because the cases turn data, then to add one is a line instead of a function,
      and the output of failure says which case has broken.
    trap: grammar
    why_wrong: '"Turn data", "to add one is" and "output of failure" break idiom and
      compound-noun order.'
  feedback:
    register: Brief, with a limitation volunteered.
    hedging: None needed; the trade-off is concrete enough to state plainly.
    precision: Named subtests in the failure output are the underrated half.
    grammar: '"Become data", "adding one is a line", "failure output".'
    pragmatics: Volunteering when the pattern breaks down raises your assessed level.
  rephrase:
    prompt: Describe a test you would deliberately not write as a table.
    goal: Prove the limitation is understood, not recited.
  language_focus:
  - precision
  - grammar
  - pragmatics
  feynman:
    concept: Cases as data, with named failure output.
    explain_to: A developer who copies test functions and edits values.
    constraint: Explain using a spreadsheet of expected results.
    self_check: Did you say when you would stop using the pattern?
    reasoning_check: Can you identify the hidden premise behind Testing, give a counterexample,
      and explain how the evidence changes your conclusion?
  black_box:
    symptom: You gave duplication reduction or idiom as the reason.
    expected: Cases as data, named failures, plus the setup-divergence limit.
    actual: A generic maintainability claim, or an appeal to convention.
    root_cause: Patterns adopted from surrounding code without examining their payoff.
    repair: For each pattern you use daily, name one situation where it hurts.
    reasoning_error: If your Testing answer failed, classify the mistake as a fact,
      assumption, comparison, failure, or certainty error before proposing the smallest
      repair.
  recall:
    active_recall_cue: When does a table-driven test stop being the right shape?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Testing without presenting
      an assumption as a fact?
    black_box_probe: When the Testing answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: golang-11-table-tests-delayed-11
      prompt: >-
        Two cases need different setup and their table now branches on many flags. How should the test shape change?
      changed_constraint: >-
        table cases are useful only while setup and assertions share a clear contract
      new_evidence: >-
        the table's conditional setup hides which lifecycle failed
      best_answer: >-
        I would split tests with different setup or lifecycle, keep shared cases table-driven, and preserve names that identify input and expected behavior.
      distractors:
      - text: I would preserve every part of the original Testing answer because changing
          it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Testing explanation with a new design without
          identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/09-backend-principles/cards/testing-code-quality.md
    note: Testing practices and quality signals.
  - repo: original
    path: english-arcade/golang/table-tests
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: 'Defend Testing after a counterexample: which Testing assumption changes,
      and what evidence keeps the revised Testing choice honest?'
    goal: Move from the short Testing answer to a deep, evidence-led defence without
      inventing an outcome.
  critical_thinking:
    problem_frame: >-
      Table-driven tests help when cases share setup and assertions; I must split cases whose lifecycle or fixture needs differ.
    claim_map:
      fact: >-
        Case data can make additions and failure names concise.
      inference: >-
        A table becomes harmful when conditionals obscure distinct setup or lifecycle behavior.
      assumption: >-
        I am assuming the cases share the same observable contract.
      unknown: >-
        Fixture divergence, failure readability, and lifecycle differences are unknown.
    comparison:
      applicable: false
      rejected_alternative: >-
        Treating table-driven and separate tests as a universal style choice would be a false equivalence: the setup and contract shape determine whether shared execution stays readable.
      hard_constraint: >-
        The hard constraint is named case coverage with failure output that explains the contract without hiding meaningful setup differences.
      decision_rule: >-
        Use a table while cases share setup and execution; split cases when their fixtures or assertions diverge enough that conditionals obscure the failure.
    failure_probe:
      kind: edge_case
      prompt: >-
        Which setup or lifecycle difference would make a table harder to diagnose than separate tests?
    evidence_check:
      basis: Check the Testing claim against system-design-estudos/areas/09-backend-principles/cards/testing-code-quality.md
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: This Go exercise can test reasoning about Testing, but it cannot
        prove an unmeasured production outcome, personal ownership, or universal rule.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        I am confident in the shared-contract criterion; the test shape should follow fixture and failure evidence.
      update_trigger: >-
        Update when a new case adds branching, hides cleanup, or weakens failure diagnostics.
    rubric:
      facts_correct: Names the verified Testing facts without smuggling in a result,
        scale, or capability that the prompt does not establish.
      assumptions_explicit: Labels the Testing premise that is still assumed and asks
        the smallest clarifying question that matters.
      alternatives_considered: Compares two credible Testing options, or explains
        the hard constraint that makes comparison a false equivalence.
      tradeoff_quality: Connects the Testing choice to a benefit, a cost or risk,
        and the condition under which another choice wins.
      follow_up_adaptation: Responds to the evidence challenge about Testing by changing
        the claim or evidence boundary rather than repeating the base answer.
      certainty_calibration: Uses medium certainty deliberately and names the evidence
        that would update the Testing recommendation.
- id: golang-12-explaining-to-non-go-team
  version: 1.4.0
  target: golang
  topic: Cross-team communication
  difficulty: 2
  interview_stage: behavioural_probe
  prompt: Tell me how you would justify choosing Go to a team that does not use it.
  context: A stakeholder conversation. The interviewer wants persuasion grounded in
    the problem rather than advocacy, since the wrong tone here creates resistance
    regardless of the technical merit.
  follow_up:
    prompt: Which Go-specific evidence would you present to a skeptical team, and
      what workload would make another language the better choice?
    goal: Answer the alternative challenge about Cross-team communication while keeping
      the evidence boundary explicit.
    challenge_kind: alternative
    best_answer: >-
      I would present workload and team constraints, evidence on footprint, latency, and tooling,
      and the adoption cost. I would choose another language when its ecosystem or delivery speed
      fits the constraint better, and I would not advocate a rewrite without that evidence.
    distractors:
    - text: I would defend the first Cross-team communication option because offering
        an alternative might make the decision look uncertain.
      why_wrong: A comparison makes the decision rule visible; it does not weaken
        a well-calibrated recommendation.
    - text: I would list every conceivable Cross-team communication design without
        saying which requirement should decide between them.
      why_wrong: An option list without a decision rule avoids the trade-off the follow-up
        is testing.
  compression:
    prompt: 'Make the technology case in three clauses: workload fit, operational
      trade-off, and a condition for choosing differently.'
    goal: Compress the Cross-team communication answer into its decision, premise,
      trade-off, and verification step.
  best_answer: I would start from their constraint rather than from the language.
    If the pain is memory footprint per instance and predictable latency under concurrency,
    Go addresses both directly. If their pain is delivery speed on a small team, I
    would probably not propose a rewrite at all.
  distractors:
  - text: I would explain that Go is faster, compiles to a single binary and handles
      concurrency much better, which makes it a strong choice for backend services
      compared to most alternatives.
    trap: register
    why_wrong: Language advocacy without their constraint, which reliably produces
      defensiveness rather than agreement.
  - text: I would probably not push for it, since the team already knows their stack
      well and introducing a new language creates a learning curve that might not
      be worth it.
    trap: pragmatics
    why_wrong: Abandons the question rather than answering how you would make the
      case when it is warranted.
  - text: I would begin for their constraint instead of for the language. If the pain
      is the footprint of memory for instance and the latency under concurrency, Go
      attends the two directly.
    trap: grammar
    why_wrong: '"Begin for", "footprint of memory", "for instance" and "attends" are
      four distinct transfer errors.'
  feedback:
    register: Consultative, not evangelical. Their problem leads.
    hedging: Hedge the recommendation, never their constraint.
    precision: Name the two properties that map to their pain.
    grammar: '"Start from", "memory footprint per instance", "addresses both".'
    pragmatics: Saying when you would not propose it is what makes the proposal credible.
  rephrase:
    prompt: Make the same case in two sentences to a sceptical engineering manager.
    goal: Compress persuasion without losing the constraint framing.
  language_focus:
  - register
  - grammar
  - pragmatics
  pt_help: '"Atender" no sentido de resolver e "address" ou "meet", nao "attend".'
  feynman:
    concept: Constraint-led technology advocacy.
    explain_to: An engineer who leads with language features.
    constraint: Do not name a single language feature.
    self_check: Did you say when you would not recommend it?
    reasoning_check: Can you identify the hidden premise behind Cross-team communication,
      give a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You advocated features, or declined to make a case.
    expected: Their constraint first, then the two properties that match it.
    actual: Feature listing, or avoidance of the proposal.
    root_cause: Enthusiasm substituting for the listener's decision criteria.
    repair: Open every technology proposal with the constraint it addresses.
    reasoning_error: If your Cross-team communication answer failed, classify the
      mistake as a fact, assumption, comparison, failure, or certainty error before
      proposing the smallest repair.
  recall:
    active_recall_cue: What should the first sentence of a technology proposal contain?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Cross-team communication
      without presenting an assumption as a fact?
    black_box_probe: When the Cross-team communication answer failed, did you locate
      the reasoning error before changing the implementation?
    delayed_variant:
      id: golang-12-explaining-to-non-go-team-delayed-12
      prompt: >-
        A team values delivery speed over footprint and has no concurrency bottleneck. What would change your Go recommendation?
      changed_constraint: >-
        language choice must follow the team's workload and delivery constraint
      new_evidence: >-
        a benchmark and team assessment show no footprint or latency problem but high rewrite cost
      best_answer: >-
        I would keep the existing language when delivery speed dominates, present Go only with measured workload evidence, and avoid a rewrite whose adoption cost exceeds the benefit.
      distractors:
      - text: I would preserve every part of the original Cross-team communication
          answer because changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Cross-team communication explanation with
          a new design without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/12-engineering-practice/cards/architecture-decision-records.md
    note: Decision records and constraint-led justification.
  - repo: original
    path: english-arcade/golang/explaining-to-non-go-team
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: 'Five more minutes on Cross-team communication: which boundary, alternative,
      and update trigger would you explain for Cross-team communication?'
    goal: Move from the short Cross-team communication answer to a deep, evidence-led
      defence without inventing an outcome.
  critical_thinking:
    problem_frame: >-
      A language recommendation must answer the team's workload and delivery constraint, not praise Go in isolation.
    claim_map:
      fact: >-
        Memory footprint, concurrency, latency, and delivery speed are separate selection criteria.
      inference: >-
        Go may fit a constrained concurrent service, while a rewrite may lose when adoption cost dominates.
      assumption: >-
        I am assuming the team has a measurable pain that Go can address.
      unknown: >-
        Workload, latency, footprint, team skill, migration cost, and ecosystem needs are unknown.
    comparison:
      applicable: true
      alternatives:
      - option: choose Go when the measured workload needs bounded concurrency and low per-process overhead
        benefit: I connect the language choice to the team's operational constraint rather than to familiarity.
        cost_or_risk: The team must learn Go's tooling, error and interface conventions, and hiring or maintenance implications.
        valid_when: Use it when profiling and delivery requirements support the operational fit.
      - option: keep the existing language and improve the bottleneck or workflow
        benefit: I avoid rewrite risk and preserve team fluency when the constraint is not language-specific.
        cost_or_risk: A real runtime or deployment limit may remain if the current stack cannot meet it.
        valid_when: Use it when the measured pain is product design, profiling, or delivery rather than Go's runtime envelope.
      decision_rule: I recommend Go only when its measured strengths answer the stated constraint; otherwise I improve or retain the existing stack.
    failure_probe:
      kind: failure_mode
      prompt: >-
        What benchmark or delivery constraint would make another language the better choice?
    evidence_check:
      basis: Check the Cross-team communication claim against system-design-estudos/areas/12-engineering-practice/cards/architecture-decision-records.md
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: This Go exercise can test reasoning about Cross-team communication,
        but it cannot prove an unmeasured production outcome, personal ownership,
        or universal rule.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        I am confident in starting from the team's constraint; the recommendation needs workload and adoption evidence.
      update_trigger: >-
        Update when benchmark, staffing, or delivery evidence changes the cost-benefit comparison.
    rubric:
      facts_correct: Names the verified Cross-team communication facts without smuggling
        in a result, scale, or capability that the prompt does not establish.
      assumptions_explicit: Labels the Cross-team communication premise that is still
        assumed and asks the smallest clarifying question that matters.
      alternatives_considered: Compares two credible Cross-team communication options,
        or explains the hard constraint that makes comparison a false equivalence.
      tradeoff_quality: Connects the Cross-team communication choice to a benefit,
        a cost or risk, and the condition under which another choice wins.
      follow_up_adaptation: Responds to the alternative challenge about Cross-team
        communication by changing the claim or evidence boundary rather than repeating
        the base answer.
      certainty_calibration: Uses medium certainty deliberately and names the evidence
        that would update the Cross-team communication recommendation.
