    prompt: Explain embedding as method promotion and composition, then name one boundary
      where explicit delegation wins.
    goal: Compress the Composition answer into its decision, premise, trade-off, and
      verification step.
  best_answer: No. Embedding promotes the methods, so the outer type gets them, but
    there is no dynamic dispatch back to the outer type. If the embedded method calls
    another method, it calls its own, not an override, which is the behaviour that
    surprises people from an inheritance background.
