  - precision
  - grammar
  - register
  feynman:
    concept: Method promotion without dynamic dispatch.
    explain_to: A developer fluent in class inheritance.
    constraint: Explain using a contractor who always calls their own team.
    self_check: Did you say which method the embedded one calls?
