        in a result, scale, or capability that the prompt does not establish.
      assumptions_explicit: Labels the Cross-team communication premise that is still
        assumed and asks the smallest clarifying question that matters.
      alternatives_considered: Compares two credible Cross-team communication options,
        or explains the hard constraint that makes comparison a false equivalence.
      tradeoff_quality: Connects the Cross-team communication choice to a benefit,
        a cost or risk, and the condition under which another choice wins.
      follow_up_adaptation: Responds to the alternative challenge about Cross-team
        communication by changing the claim or evidence boundary rather than repeating
