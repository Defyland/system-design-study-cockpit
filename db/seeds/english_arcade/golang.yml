  critical_thinking:
    problem_frame: 'Frame Cross-team communication before proposing a solution: state
      the actor, required outcome, constraint, and unknown that could invalidate the
      first recommendation.'
    claim_map:
      fact: The prompt explicitly tests Cross-team communication within a Go context;
        treat that named boundary as the verified starting fact.
      inference: The reasonable inference is that the answer must defend Cross-team
        communication, but that does not prove one implementation wins under every
        workload or audience.
      assumption: An unstated assumption is that the Cross-team communication constraint
        is the dominant one; label it and ask whether the interviewer confirms it.
      unknown: 'Still unknown for Cross-team communication: the scale, failure tolerance,
        ownership boundary, and evidence threshold that would change the decision.'
    comparison:
      applicable: true
      alternatives:
      - option: a minimal Go interface or cancellation boundary for Cross-team communication
        benefit: It keeps the Cross-team communication reasoning close to the stated
          Go constraint and makes the evidence boundary visible.
        cost_or_risk: It can be too narrow if the Cross-team communication workload
          or requirement changes beyond the prompt.
        valid_when: Use it when the stated Cross-team communication contract and its
          invariant are the facts that matter most.
      - option: a concrete type or shared coordination mechanism for Cross-team communication
        benefit: It can make the Cross-team communication boundary more explicit when
          the first option's hidden assumption is not guaranteed.
        cost_or_risk: It adds implementation or communication cost and may solve a
          problem the Cross-team communication evidence has not established.
        valid_when: Use it when a measured constraint, requirement, or failure mode
          makes the first option unsafe.
      decision_rule: Choose the first Cross-team communication option when its stated
        contract holds; choose the alternative only when evidence shows that the relevant
        Go constraint makes the first assumption unsafe.
