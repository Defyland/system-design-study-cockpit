      alternatives:
      - option: wrap with operation context while preserving identity for errors.Is or errors.As
        benefit: I give operators the failing operation and let callers branch on the underlying cause.
        cost_or_risk: Repeated wrappers become noisy if each layer adds no new information.
        valid_when: Use it when a layer knows a useful operation, identifier, or boundary.
