    note: Graceful shutdown sequencing.
  - repo: original
    path: english-arcade/golang/graceful-shutdown
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: Connect Lifecycle, connect the Lifecycle implementation choice to its
      failure mode, measurement, and condition for choosing the alternative.
    goal: Move from the short Lifecycle answer to a deep, evidence-led defence without
      inventing an outcome.
  critical_thinking:
    problem_frame: >-
      Shutdown must stop new accepts, drain in-flight requests within a deadline, and close dependencies in a safe order.
    claim_map:
      fact: >-
        The platform supplies a finite kill deadline and in-flight work may still use dependencies.
      inference: >-
        Closing dependencies before handlers finish can turn graceful shutdown into request failure.
      assumption: >-
        I am assuming handlers honor context and the grace period is shorter than the platform kill timeout.
      unknown: >-
        Grace duration, handler cancellation, dependency order, and repeated-shutdown behavior are unknown.
    comparison:
      applicable: true
      alternatives:
      - option: stop admission, drain in-flight work under a deadline, then close dependencies
        benefit: I preserve completed work while giving the process a bounded exit path.
        cost_or_risk: I need cancellation and timeout telemetry, and slow handlers may still be forced out.
        valid_when: Use it when the service contract permits a short drain window.
      - option: close listeners and dependencies immediately on signal
        benefit: I exit quickly and avoid waiting on stuck work.
        cost_or_risk: In-flight requests fail abruptly and partial side effects need recovery.
        valid_when: Use it only when interruption is acceptable or the platform deadline is extremely short.
      decision_rule: I drain within the platform's deadline by default; I choose immediate close only when the request contract and recovery path accept dropped work.
    failure_probe:
      kind: edge_case
      prompt: >-
        Which shutdown trace would show a handler uses a closed dependency or outlives the kill deadline?
    evidence_check:
      basis: Check the Lifecycle claim against system-design-estudos/areas/09-backend-principles/cards/graceful-shutdown.md
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: This Go exercise can test reasoning about Lifecycle, but it cannot
        prove an unmeasured production outcome, personal ownership, or universal rule.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        I am confident in the ordering principle; the grace period and cleanup sequence require deployment and test evidence.
      update_trigger: >-
        Update when shutdown tests, dependency ownership, or platform deadlines change the drain policy.
    rubric:
      facts_correct: Names the verified Lifecycle facts without smuggling in a result,
        scale, or capability that the prompt does not establish.
      assumptions_explicit: Labels the Lifecycle premise that is still assumed and
