- id: golang-05-channel-vs-mutex
  version: 1.4.0
  target: golang
  topic: Concurrency design
  difficulty: 3
  interview_stage: deep_dive
  prompt: Would you use a channel or a mutex for this shared counter?
  context: Several goroutines increment a counter that is read occasionally. The interviewer
    wants to see whether you can resist the idea that channels are always the Go answer.
  follow_up:
    prompt: Who owns the counter's state, what contention do you expect, and which
      choice keeps the invariant visible?
    goal: Answer the assumption challenge about Concurrency design while keeping the
      evidence boundary explicit.
    challenge_kind: assumption
    best_answer: >-
      I would keep a mutex or atomic counter when state is shared and the critical section is short;
      I would choose a channel when one goroutine owns the state or work is transferred. I would
      make ownership explicit before benchmarking contention.
    distractors:
    - text: I would repeat my original Concurrency design answer with more confidence
        because the interviewer probably assumes the usual case.
      why_wrong: It hides the premise instead of checking whether the usual case is
        actually part of this problem.
    - text: I would stop proposing anything about Concurrency design until every surrounding
        requirement had been documented in full.
      why_wrong: It treats uncertainty as a reason for paralysis and offers no bounded
        next step.
  compression:
    prompt: Compare channel and mutex by ownership, contention, and the synchronization
      proof you can maintain.
    goal: Compress the Concurrency design answer into its decision, premise, trade-off,
      and verification step.
  best_answer: I would use a mutex, or an atomic counter. Channels transfer ownership
    of data between goroutines, and I am not handing data over here; I am protecting
    shared state with a short critical section. A channel adds a serialising goroutine
    for no benefit.
  distractors:
  - text: A channel, because the Go proverb says to share memory by communicating
      rather than communicating by sharing memory, so channels are the idiomatic choice
      for shared state.
    trap: content
    why_wrong: Misapplies the proverb. It is about ownership transfer, not about banning
      mutexes for simple shared counters.
  - text: Either would work here honestly, so I would go with whichever fits the existing
      style of the codebase better and keeps things consistent for the rest of the
      team.
    trap: pragmatics
    why_wrong: Declines the design judgement the question exists to assess.
  - text: A mutex, because the channels serve for transfer the property of the data
      between goroutines and here nothing is being passed, is only state shared.
    trap: grammar
    why_wrong: '"Serve for transfer", "property" as a false friend for ownership,
      and the dropped subject all break the sentence.'
  feedback:
    register: Confident enough to contradict a proverb, which is the point of the
      question.
    hedging: None; the criterion is clear.
    precision: Ownership transfer versus shared state is the distinction to name.
    grammar: '"Transfer ownership", "it is only shared state"; keep the subject.'
    pragmatics: Explaining why the channel is worse pre-empts the pushback.
  rephrase:
    prompt: Describe a case in the same service where a channel would be right.
    goal: Prove the criterion works in both directions.
  language_focus:
  - precision
  - grammar
  - register
  pt_help: '"Propriedade" no sentido de posse e "ownership". "Property" e atributo.'
  feynman:
    concept: Channels for ownership transfer, mutexes for shared state.
    explain_to: A developer who quotes the Go proverb reflexively.
    constraint: Explain using passing a baton versus sharing a whiteboard.
    self_check: Did you say what is being handed over, or not handed over?
    reasoning_check: Can you identify the hidden premise behind Concurrency design,
      give a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You chose a channel by proverb, or refused to choose.
    expected: Mutex or atomic; channels are for ownership transfer.
    actual: Idiom-driven choice, or deference to codebase style.
    root_cause: Proverbs internalised as rules without their original scope.
    repair: Ask whether anything changes owner before reaching for a channel.
    reasoning_error: If your Concurrency design answer failed, classify the mistake
      as a fact, assumption, comparison, failure, or certainty error before proposing
      the smallest repair.
  recall:
    active_recall_cue: What question distinguishes a channel case from a mutex case?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Concurrency design without
      presenting an assumption as a fact?
    black_box_probe: When the Concurrency design answer failed, did you locate the
      reasoning error before changing the implementation?
    delayed_variant:
      id: golang-05-channel-vs-mutex-delayed-5
      prompt: >-
        Contention profiling shows a shared counter is protected by a serializing channel with no owner. What would you change?
      changed_constraint: >-
        shared short-lived state needs an explicit ownership or locking model
      new_evidence: >-
        the channel adds a goroutine and queue wait without transferring ownership
      best_answer: >-
        I would use a mutex or atomic counter for shared short critical state, or give one goroutine ownership if work is truly transferred, then benchmark the chosen model.
      distractors:
      - text: I would preserve every part of the original Concurrency design answer
          because changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Concurrency design explanation with a new
          design without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/09-backend-principles/cards/concurrency-parallelism.md
    note: Concurrency primitives and their intended use.
  - repo: original
    path: english-arcade/golang/channel-vs-mutex
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: 'Revisit Concurrency design beyond the happy path: what is factual about
      Concurrency design, what is provisional, and which Concurrency design test could
      change it?'
    goal: Move from the short Concurrency design answer to a deep, evidence-led defence
      without inventing an outcome.
  critical_thinking:
    problem_frame: >-
      A shared counter has a short invariant-preserving update; I must distinguish shared state from work transfer before choosing a mutex, atomic, or channel.
    claim_map:
      fact: >-
        The counter is shared state unless one goroutine explicitly owns it.
      inference: >-
        A mutex or atomic usually keeps a short shared update visible, while a channel adds an owner and queue semantics.
      assumption: >-
        I am assuming no work handoff or ordering requirement justifies a dedicated owner goroutine.
      unknown: >-
        Ownership, contention, invariant width, and latency target are unknown.
    comparison:
      applicable: true
      alternatives:
      - option: a mutex or atomic operation around the shared counter
        benefit: I keep the critical section local and make the data ownership obvious.
        cost_or_risk: I must maintain lock discipline and avoid holding it across blocking work.
        valid_when: Use it when goroutines share state rather than transfer ownership.
      - option: a channel with one owner goroutine serializing counter updates
        benefit: I can make ownership explicit when updates already arrive as messages.
        cost_or_risk: It adds a goroutine, queueing, shutdown, and backpressure behavior for a scalar counter.
        valid_when: Use it when the counter is part of an existing event loop, not merely to avoid a mutex.
      decision_rule: I use a mutex or atomic for shared scalar state; I choose a channel only when message ownership already defines the surrounding design.
    failure_probe:
      kind: edge_case
      prompt: >-
        What ownership or contention observation would make a channel cheaper or clearer than a mutex?
    evidence_check:
      basis: Check the Concurrency design claim against system-design-estudos/areas/09-backend-principles/cards/concurrency-parallelism.md
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: This Go exercise can test reasoning about Concurrency design, but
        it cannot prove an unmeasured production outcome, personal ownership, or universal
        rule.
      checked_on: '2026-08-25'
    certainty:
      level: high
      rationale: >-
        I am confident in making ownership explicit; performance choice requires contention evidence after correctness is clear.
      update_trigger: >-
        Update when ownership, critical-section width, or contention profiling changes the coordination model.
    rubric:
      facts_correct: Names the verified Concurrency design facts without smuggling
        in a result, scale, or capability that the prompt does not establish.
      assumptions_explicit: Labels the Concurrency design premise that is still assumed
        and asks the smallest clarifying question that matters.
      alternatives_considered: Compares two credible Concurrency design options, or
        explains the hard constraint that makes comparison a false equivalence.
      tradeoff_quality: Connects the Concurrency design choice to a benefit, a cost
        or risk, and the condition under which another choice wins.
      follow_up_adaptation: Responds to the assumption challenge about Concurrency
        design by changing the claim or evidence boundary rather than repeating the
        base answer.
      certainty_calibration: Uses high certainty deliberately and names the evidence
        that would update the Concurrency design recommendation.
- id: golang-06-profiling
  version: 1.4.0
  target: golang
  topic: Profiling
  difficulty: 2
  interview_stage: deep_dive
  prompt: The service uses more CPU than expected. Where do you start?
  context: A production performance question. The interviewer wants to hear a specific
    tool and a specific reading strategy, not a general commitment to measuring.
  follow_up:
    prompt: Which profile would distinguish CPU work from lock or allocation pressure,
      and what change would you benchmark after finding the hotspot?
    goal: Answer the evidence challenge about Profiling while keeping the evidence
      boundary explicit.
    challenge_kind: evidence
    best_answer: >-
      I would take a CPU profile from the running process over a representative window
      and read it as a flame graph, cumulative time before self time. I would
      use mutex or block profiles for waiting and allocation profiles for heap pressure, then
      benchmark one change against representative traffic and check tail latency.
    distractors:
    - text: I would cite my experience with Profiling as enough proof and move on
        without naming an observation.
      why_wrong: Experience can guide a hypothesis, but it does not replace evidence
        tied to this context.
    - text: I would collect every possible metric about Profiling before making even
        a provisional recommendation.
      why_wrong: A focused decision can start with one discriminating observation
        rather than an unbounded data request.
  compression:
    prompt: Describe profiling as hypothesis, captured evidence, focused change, and
      before-and-after comparison.
    goal: Compress the Profiling answer into its decision, premise, trade-off, and
      verification step.
  best_answer: I would take a CPU profile from the running process over a representative
    window and read it as a flame graph, cumulative time before self time. That usually
    points at an unexpected path, often serialisation.
  distractors:
  - text: I would profile the application to find out where the time is being spent,
      and then optimise whatever turns out to be the hottest part of the code that
      shows up.
    trap: precision
    why_wrong: Correct instinct, no method. It names no tool, window or reading strategy.
  - text: I would add timing metrics around the main operations and compare them over
      time, then look more closely at whichever one has grown the most recently in
      production.
    trap: content
    why_wrong: Instrumentation is slower and coarser than a profile for a CPU question,
      and it presumes you already know where to measure.
  - text: I would take one profile of CPU of the process in execution during a window
      representative and read it like a flame graph, seeing first the time cumulative.
    trap: grammar
    why_wrong: Stacked "of" possessives and post-posed adjectives break the sentence
      throughout.
  feedback:
    register: Practical and tool-specific.
    hedging: Hedge the finding ("usually points at"), not the method.
    precision: Cumulative before self time is the detail that shows real experience.
    grammar: '"A CPU profile", "a representative window", "cumulative time".'
    pragmatics: Predicting the likely culprit invites a useful follow-up.
  rephrase:
    prompt: Explain what you would do if the profile looked completely flat.
    goal: Test the method when the obvious signal is absent.
  language_focus:
  - precision
  - grammar
  - hedging
  feynman:
    concept: Reading a CPU profile by cumulative time.
    explain_to: A developer who optimises the first slow function they see.
    constraint: Explain using a receipt for a long shopping trip.
    self_check: Did you say which number you read first, and why?
    reasoning_check: Can you identify the hidden premise behind Profiling, give a
      counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You committed to profiling without naming how you would read it.
    expected: CPU profile over a representative window, cumulative first.
    actual: Generic measurement, or metric instrumentation instead.
    root_cause: Profiling known as a step rather than as an interpretation skill.
    repair: Practise describing what you look at first in a flame graph.
    reasoning_error: If your Profiling answer failed, classify the mistake as a fact,
      assumption, comparison, failure, or certainty error before proposing the smallest
      repair.
  recall:
    active_recall_cue: Do you read cumulative or self time first, and why?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Profiling without presenting
      an assumption as a fact?
    black_box_probe: When the Profiling answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: golang-06-profiling-delayed-6
      prompt: >-
        CPU is low but mutex wait and allocations spike during the same request window. Which profiles guide the next change?
      changed_constraint: >-
        the hotspot may be blocking or allocation pressure rather than on-CPU work
      new_evidence: >-
        mutex/block and heap profiles rise while the CPU profile does not
      best_answer: >-
        I would use CPU, mutex/block, and allocation profiles to separate the causes, change one hotspot, and benchmark representative traffic including tail latency.
      distractors:
      - text: I would preserve every part of the original Profiling answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Profiling explanation with a new design without
