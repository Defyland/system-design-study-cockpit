  critical_thinking:
    problem_frame: >-
      A caller needs stable classification while each layer adds operation context; I must preserve sentinel/type identity and avoid string-based contracts.
    claim_map:
      fact: >-
        errors.Is and errors.As can classify wrapped errors when identity is preserved.
      inference: >-
        Each boundary should add only context it owns and return an unchanged error when it adds nothing.
      assumption: >-
        I am assuming the caller has a meaningful sentinel or type to classify.
      unknown: >-
        Caller classification, wrap depth, log policy, and stable error ownership are unknown.
    comparison:
