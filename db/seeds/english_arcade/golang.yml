- id: golang-09-nil-interface
  version: 1.4.0
  target: golang
  topic: Nil semantics
  difficulty: 3
  interview_stage: live_coding
  prompt: This nil check is not firing. Any idea why?
  context: A function returns a nil pointer stored in an error interface, and the
    caller's comparison against nil is false. It is the classic Go gotcha, and the
    interviewer wants a clean explanation.
  follow_up:
    prompt: What dynamic type is held by this interface, and which construction or
      comparison would make a typed nil visible?
    goal: Answer the new_evidence challenge about Nil semantics while keeping the
      evidence boundary explicit.
    challenge_kind: new_evidence
    best_answer: >-
      Because the interface is not nil even though the value inside it is. I
      would keep the claims that remain supported, identify exactly which premise the new observation
      changes, and run a focused check before revising the decision.
    distractors:
    - text: I would keep the Nil semantics recommendation unchanged because changing
        position would look inconsistent.
      why_wrong: A defensible answer updates when relevant evidence changes an assumption
        or trade-off.
    - text: I would discard every earlier Nil semantics claim as soon as one new observation
        appeared.
      why_wrong: New evidence may narrow one claim while leaving other verified facts
        intact.
  compression:
    prompt: Explain nil interfaces with dynamic type, dynamic value, and a tiny test
      that distinguishes them.
    goal: Compress the Nil semantics answer into its decision, premise, trade-off,
      and verification step.
  best_answer: Because the interface is not nil even though the value inside it is.
    An interface holds a type and a value, and here the type is set, so the comparison
    fails. The fix is to return a literal nil rather than a typed nil pointer.
  distractors:
  - text: It looks like the variable is being shadowed somewhere, so the nil check
      is comparing a different variable than the one that was actually assigned earlier
      in the function.
    trap: content
    why_wrong: Plausible-sounding but wrong diagnosis; it sends the debugging effort
      in an unrelated direction.
  - text: Nil comparisons with interfaces can behave unexpectedly in Go, it is a known
      subtlety of the language, so I would restructure the code to avoid relying on
      that comparison.
    trap: precision
    why_wrong: Names the area but not the mechanism, and avoiding the comparison does
      not explain anything.
  - text: Because the interface is not nil even that the value inside is. One interface
      has one type and one value, and here the type is filled, then the comparison
      fails.
    trap: grammar
    why_wrong: '"Even that" for "even though" and article misuse throughout obscure
      a correct diagnosis.'
  feedback:
    register: Explanatory; this is a teaching moment, not a gotcha to win.
    hedging: None; the semantics are exact.
    precision: The type-and-value pair is the mechanism; say it explicitly.
    grammar: '"Even though", "the type is set", "a typed nil pointer".'
    pragmatics: Giving the fix alongside the cause keeps it actionable.
  rephrase:
    prompt: Explain the same rule to someone who has never hit this bug.
    goal: Teach the mechanism before they need it.
  language_focus:
  - precision
  - grammar
  - register
  pt_help: '"Mesmo que" e "even though" ou "even if", nunca "even that".'
  feynman:
    concept: Interface identity as a type and value pair.
    explain_to: A developer who thinks nil is a single value.
    constraint: Explain using an envelope that is empty but addressed.
    self_check: Did you explain why the type being set matters?
    reasoning_check: Can you identify the hidden premise behind Nil semantics, give
      a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You guessed shadowing, or called it a known subtlety.
    expected: Interface holds type and value; typed nil is not nil.
    actual: An unrelated diagnosis, or vague acknowledgement.
    root_cause: Nil understood as one value rather than as a pair comparison.
    repair: Say "type and value" out loud whenever an interface comparison surprises
      you.
    reasoning_error: If your Nil semantics answer failed, classify the mistake as
      a fact, assumption, comparison, failure, or certainty error before proposing
      the smallest repair.
  recall:
    active_recall_cue: What two components make an interface value non-nil?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Nil semantics without presenting
      an assumption as a fact?
    black_box_probe: When the Nil semantics answer failed, did you locate the reasoning
      error before changing the implementation?
