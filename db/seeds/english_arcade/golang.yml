- id: golang-08-graceful-shutdown
  version: 1.4.0
  target: golang
  topic: Lifecycle
  difficulty: 3
  interview_stage: architecture_review
  prompt: What does a correct shutdown look like for this HTTP service?
  context: The service is deployed on a platform that sends a termination signal before
    killing the process. The interviewer wants the ordered sequence, including what
    must not be dropped.
  follow_up:
    prompt: Which in-flight requests get a grace period, and what closes first when
      the deadline expires?
    goal: Answer the failure challenge about Lifecycle while keeping the evidence
      boundary explicit.
    challenge_kind: failure
    best_answer: >-
      Stop accepting new connections, let in-flight requests finish within a deadline shorter than the
      platform's kill timeout, then close dependencies in reverse order. If the failure in the
      follow-up appears, I would name the user or system consequence, contain it with a
      bounded mitigation, and verify recovery with a focused test or metric.
    distractors:
    - text: I would describe the Lifecycle failure as impossible because the happy
        path already passed its test.
      why_wrong: Passing a happy path does not test the boundary, failure mode, or
        recovery being challenged.
    - text: I would add retries to Lifecycle immediately and assume the system would
        become reliable.
      why_wrong: Retries can amplify load or duplicate effects; the failure and containment
        policy must be specified first.
  compression:
    prompt: State graceful shutdown as stop accepting work, drain with a deadline,
      and force-close safely.
    goal: Compress the Lifecycle answer into its decision, premise, trade-off, and
      verification step.
  best_answer: Stop accepting new connections, let in-flight requests finish within
    a deadline shorter than the platform's kill timeout, then close dependencies in
    reverse order. Waiting indefinitely just turns it into a hard kill.
  distractors:
  - text: I would listen for the signal and then close the server and the database
      connections cleanly so that nothing is left open when the process finally exits.
    trap: precision
    why_wrong: Misses the in-flight request window and the deadline, which is where
      shutdown correctness actually lives.
  - text: I would drain the connections and wait for all the ongoing work to complete
      before shutting down, so that no request is ever interrupted in the middle.
    trap: content
    why_wrong: Unbounded waiting is defeated by the platform's kill timeout, so it
      produces the abrupt termination it was meant to avoid.
  - text: Stop to accept new connections, let the requests in flight finish inside
      a deadline more short than the timeout of the platform, and after close the
      dependencies.
    trap: grammar
    why_wrong: '"Stop to accept" reverses meaning, and "more short" plus "timeout
      of the platform" break comparative and compound forms.'
  feedback:
    register: Operational and ordered.
    hedging: None; each step is deterministic.
    precision: The deadline relationship to the platform timeout is the key detail.
    grammar: '"Stop accepting" for ceasing an action; "shorter than the platform timeout".'
    pragmatics: Explaining why unbounded waiting fails answers the obvious objection.
  rephrase:
    prompt: Describe what a user experiences if the deadline is set too long.
    goal: Tie an operational detail to user impact.
  language_focus:
  - precision
  - grammar
  - pragmatics
  pt_help: '"Stop doing" e parar de fazer; "stop to do" e parar para fazer. Sentidos
    opostos.'
  feynman:
    concept: Bounded drain within a platform kill timeout.
    explain_to: A developer whose deploys drop requests.
    constraint: Explain using a shop closing its doors but serving those inside.
    self_check: Is your deadline shorter than the platform's?
    reasoning_check: Can you identify the hidden premise behind Lifecycle, give a
      counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You closed connections immediately, or waited without a bound.
    expected: Stop accepting, bounded drain, reverse-order dependency close.
    actual: A clean-close description, or unbounded draining.
    root_cause: Shutdown treated as cleanup rather than as a timed negotiation.
    repair: Always state the deadline and what it must be shorter than.
    reasoning_error: If your Lifecycle answer failed, classify the mistake as a fact,
      assumption, comparison, failure, or certainty error before proposing the smallest
      repair.
  recall:
    active_recall_cue: What must the drain deadline be shorter than?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Lifecycle without presenting
      an assumption as a fact?
    black_box_probe: When the Lifecycle answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
