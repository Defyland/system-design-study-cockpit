    why_wrong: Hedged non-answer that never names the dispatch difference.
  - text: No, the embedding promotes the methods, then the type external receives
      them, but does not exist dispatch dynamic back for the type external.
    trap: grammar
    why_wrong: Post-posed adjectives and the dropped expletive subject make the correct
      point unreadable.
  feedback:
    register: Clear correction without condescension.
    hedging: None; the semantics are unambiguous.
