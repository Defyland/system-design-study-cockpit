- id: golang-09-nil-interface
  version: 1.4.0
  target: golang
  topic: Nil semantics
  difficulty: 3
  interview_stage: live_coding
  prompt: This nil check is not firing. Any idea why?
  context: A function returns a nil pointer stored in an error interface, and the
    caller's comparison against nil is false. It is the classic Go gotcha, and the
    interviewer wants a clean explanation.
  follow_up:
    prompt: What dynamic type is held by this interface, and which construction or
      comparison would make a typed nil visible?
    goal: Answer the new_evidence challenge about Nil semantics while keeping the
      evidence boundary explicit.
    challenge_kind: new_evidence
    best_answer: >-
      I would inspect the interface's dynamic type and value, return a literal nil when no error
      exists, and test a typed nil pointer. I would avoid reflection unless the boundary truly needs
      it.
    distractors:
    - text: I would keep the Nil semantics recommendation unchanged because changing
        position would look inconsistent.
      why_wrong: A defensible answer updates when relevant evidence changes an assumption
        or trade-off.
