  critical_thinking:
    problem_frame: >-
      Embedding promotes methods but does not provide subclass override dispatch; I must check collisions and choose explicit fields when ownership matters.
    claim_map:
      fact: >-
        An embedded method can be promoted to the outer type.
      inference: >-
        Calls through the embedded receiver do not dynamically dispatch back to an outer method as inheritance would.
      assumption: >-
        I am assuming callers rely on promotion rather than a distinct collaborator contract.
