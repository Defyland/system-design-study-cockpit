- id: golang-07-struct-embedding
  version: 1.4.0
  target: golang
  topic: Composition
  difficulty: 2
  interview_stage: technical_screen
  prompt: Is embedding here the same as inheritance?
  context: The candidate has embedded a struct and the interviewer is checking whether
    the mental model is composition or inherited hierarchy, which changes how the
    code will evolve.
  follow_up:
    prompt: Which promoted method or name collision could surprise a caller, and when
      would an explicit field be clearer?
    goal: Answer the alternative challenge about Composition while keeping the evidence
      boundary explicit.
    challenge_kind: alternative
    best_answer: >-
      No. I would compare that choice with the credible alternative against the requirement in
      the follow-up, cost, and failure risk, then switch only if evidence makes the alternative
      safer.
    distractors:
    - text: I would defend the first Composition option because offering an alternative
        might make the decision look uncertain.
      why_wrong: A comparison makes the decision rule visible; it does not weaken
        a well-calibrated recommendation.
