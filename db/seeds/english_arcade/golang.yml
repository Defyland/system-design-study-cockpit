---
contract_version: 1.4.0
target:
  key: golang
  label: Golang
  blurb: 'Explain interfaces, goroutines and context the way a Go engineer does: plainly,
    with ownership and cancellation made explicit.'
  focus_areas:
  - interfaces and composition
  - goroutines and channels
  - context and cancellation
  - errors and wrapping
  - profiling and service boundaries
  simulation:
    minutes: 45
    structure:
    - label: Interfaces and API shape warm-up
      minutes: 8
    - label: Concurrency and ownership deep dive
      minutes: 15
    - label: Errors, context and failure paths
      minutes: 12
    - label: Profiling and service boundaries
      minutes: 10
  critical_thinking:
    learner_prompts:
      evidence_ledger: For Go, record whether each claim about interfaces, goroutines,
        context cancellation, errors, and service boundaries is a verified fact, an
        inference, an assumption, or an unknown before you defend it.
      problem_frame: Frame every Go answer with the actor, requirement, constraint,
        success condition, and unanswered question that could change the decision.
      comparison: When Go offers a real choice, compare two options by benefit, cost
        or risk, valid-when condition, and an explicit decision rule.
      failure_probe: Ask which counterexample, edge case, or failure mode could break
        the Go recommendation, then state the smallest test or containment step.
      certainty_review: 'Calibrate certainty in Go: name the evidence, separate correlation
        from causality, and say what new observation would make you revise the answer.'
    rubric:
      facts_correct: Names the verified interfaces, goroutines, context cancellation,
        errors, and service boundaries facts without smuggling in a result or capability
        that the prompt does not establish.
      assumptions_explicit: Labels the Go premise that is still assumed and asks the
        smallest clarifying question that matters.
      alternatives_considered: Considers a credible alternative for Go, or explains
        the hard constraint that makes comparison a false equivalence.
      tradeoff_quality: Connects the Go choice to a benefit, a cost or risk, and the
        condition under which another choice wins.
      follow_up_adaptation: Responds to an adversarial Go follow-up by changing the
        claim or evidence boundary rather than repeating a memorised answer.
      certainty_calibration: Uses high, medium, or low certainty deliberately and
        names the evidence that would update the Go recommendation.
cards:
- id: golang-card-interface-consumer
  front: Where do Go interfaces belong?
  back: In the consumer package, kept small. The producer returns a concrete type;
    the caller declares only the method it needs.
  box: 1
  source:
    repo: system-design-estudos
    path: areas/09-backend-principles/cards/application-boundaries-and-service-layer.md
    note: Boundary and dependency-direction principles.
  critical_thinking:
    cue: Where do Go interfaces belong? Before answering, separate the stated fact
      from your assumption and name one condition that could change it.
    check: For this Go card, can you compare two options, name one failure mode, and
      state what evidence would update the recommendation?
- id: golang-card-goroutine-ownership
  front: What must you say when you start a goroutine?
  back: Who stops it and how. An unowned goroutine is a leak waiting for production
    traffic.
  box: 2
  source:
    repo: system-design-estudos
    path: areas/09-backend-principles/cards/graceful-shutdown.md
    note: Lifecycle and shutdown discipline.
  critical_thinking:
    cue: What must you say when you start a goroutine? Before answering, separate
      the stated fact from your assumption and name one condition that could change
      it.
    check: For this Go card, can you compare two options, name one failure mode, and
      state what evidence would update the recommendation?
- id: golang-card-error-wrapping
  front: How do you talk about error wrapping precisely?
  back: Wrap with context at each boundary, compare with errors.Is or errors.As, and
    never match on message strings.
  box: 1
  source:
    repo: system-design-estudos
    path: areas/09-backend-principles/cards/error-handling-fault-tolerance.md
    note: Error handling and fault tolerance practices.
  critical_thinking:
    cue: How do you talk about error wrapping precisely? Before answering, separate
      the stated fact from your assumption and name one condition that could change
      it.
    check: For this Go card, can you compare two options, name one failure mode, and
      state what evidence would update the recommendation?
items:
- id: golang-01-interface-placement
  version: 1.4.0
  target: golang
  topic: Interfaces
  difficulty: 2
  interview_stage: technical_screen
  prompt: Where would you define the interface for this dependency?
  context: A service needs a storage dependency. The interviewer wants to know whether
    you follow Go's consumer-side convention or bring habits from other languages.
  follow_up:
    prompt: Which package consumes the behavior, and what smallest interface would
      let that package test its dependency without mirroring the concrete type?
    goal: Answer the evidence challenge about Interfaces while keeping the evidence
      boundary explicit.
    challenge_kind: evidence
    best_answer: >-
      In the consumer package, and as small as I can make it. I would
      treat the follow-up observation as evidence, not as proof of impact; I would inspect
      the smallest relevant trace or test and state what remains uncertain before changing the
      decision.
    distractors:
    - text: I would cite my experience with Interfaces as enough proof and move on
        without naming an observation.
      why_wrong: Experience can guide a hypothesis, but it does not replace evidence
        tied to this context.
    - text: I would collect every possible metric about Interfaces before making even
        a provisional recommendation.
      why_wrong: A focused decision can start with one discriminating observation
        rather than an unbounded data request.
  compression:
    prompt: Explain interface placement as consumer need, minimal method set, and
      a fake that tests behavior.
    goal: Compress the Interfaces answer into its decision, premise, trade-off, and
      verification step.
  best_answer: In the consumer package, and as small as I can make it. The storage
    package returns a concrete type, and my service declares the one or two methods
    it actually uses, which keeps the dependency pointing inwards and makes the test
    double trivial.
  distractors:
  - text: In the storage package alongside the implementation, so that everyone who
      needs it can import the same interface definition and there is a single canonical
      contract for the dependency.
    trap: content
    why_wrong: That is the Java convention. In Go it forces consumers to depend on
      a package they do not need and grows the interface over time.
  - text: Wherever it makes the most sense for the project structure, since different
      teams organise this differently and consistency within the codebase matters
      more than the specific choice.
    trap: pragmatics
    why_wrong: Avoids the question. There is a well-established Go convention here
      and the interviewer is checking whether you know it.
  - text: In the package of the consumer and the more small possible, because then
      the service declares only the methods that it is using really.
    trap: grammar
    why_wrong: '"The package of the consumer" and "the more small possible" invert
      English possessive and superlative forms.'
  feedback:
    register: Idiomatic and specific; name the convention as a convention.
    hedging: None needed; this is settled Go practice.
    precision: 'Say why it matters: dependency direction and trivial test doubles.'
    grammar: '"The consumer package", "as small as possible".'
    pragmatics: Mentioning testing pre-empts the natural follow-up.
  rephrase:
    prompt: Explain the same convention to a Java developer joining the team.
    goal: Practise contrasting conventions without dismissing either.
  language_focus:
  - precision
  - grammar
  - pragmatics
  pt_help: 'Ingles usa substantivo composto: "the consumer package", nao "the package
    of the consumer".'
  feynman:
    concept: Consumer-side interfaces and dependency direction.
    explain_to: A developer coming from Java or C#.
    constraint: Explain using a job description written by the employer.
    self_check: Did you say which package owns the concrete type?
    reasoning_check: Can you identify the hidden premise behind Interfaces, give a
      counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You placed the interface with the implementation.
    expected: Consumer package, minimal method set, concrete return.
    actual: Producer-side definition, or deferral to team style.
    root_cause: Carrying interface habits from languages with nominal typing.
    repair: Ask who consumes the behaviour before deciding who declares it.
    reasoning_error: If your Interfaces answer failed, classify the mistake as a fact,
      assumption, comparison, failure, or certainty error before proposing the smallest
      repair.
  recall:
    active_recall_cue: Which package should declare an interface in Go, and why?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Interfaces without presenting
      an assumption as a fact?
    black_box_probe: When the Interfaces answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: golang-01-interface-placement-delayed-1
      prompt: 'Interfaces: the later Interfaces review says a Interfaces test exposes
        a boundary case that the Interfaces examples did not cover. Under the Interfaces
        workload for Interfaces no longer fits the original resource bound, which
        part of Interfaces survives and which Interfaces claim changes?'
      changed_constraint: the Interfaces workload for Interfaces no longer fits the
        original resource bound
      new_evidence: a Interfaces test exposes a boundary case that the Interfaces
        examples did not cover
      best_answer: I would keep the facts that remain supported about Interfaces,
        treat a Interfaces test exposes a boundary case that the Interfaces examples
        did not cover as new evidence rather than a result, and state the updated
        decision rule under the Interfaces workload for Interfaces no longer fits
        the original resource bound. I would then name one focused check before treating
        the revised answer as settled.
      distractors:
      - text: I would preserve every part of the original Interfaces answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Interfaces explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/09-backend-principles/cards/application-boundaries-and-service-layer.md
    note: Boundaries and dependency direction.
  - repo: original
    path: english-arcade/golang/interface-placement
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: 'Interfaces: inspect Interfaces evidence next; which edge case for Interfaces
      would alter the trade-off?'
    goal: Move from the short Interfaces answer to a deep, evidence-led defence without
      inventing an outcome.
  critical_thinking:
    problem_frame: 'Frame Interfaces before proposing a solution: state the actor,
      required outcome, constraint, and unknown that could invalidate the first recommendation.'
    claim_map:
      fact: The prompt explicitly tests Interfaces within a Go context; treat that
        named boundary as the verified starting fact.
      inference: The reasonable inference is that the answer must defend Interfaces,
        but that does not prove one implementation wins under every workload or audience.
      assumption: An unstated assumption is that the Interfaces constraint is the
        dominant one; label it and ask whether the interviewer confirms it.
      unknown: 'Still unknown for Interfaces: the scale, failure tolerance, ownership
        boundary, and evidence threshold that would change the decision.'
    comparison:
      applicable: false
      rejected_alternative: A tool-first A-versus-B debate about Interfaces would
        be a false equivalence because the prompt does not establish that both choices
        satisfy the same contract.
      hard_constraint: The hard Interfaces constraint is the required guarantee stated
        by the interviewer; no missing measurement licenses a stronger comparison.
      decision_rule: Do not manufacture a trade-off for Interfaces; first clarify
        the constraint or collect the evidence that would make two options genuinely
        comparable.
    failure_probe:
      kind: counterexample
      prompt: 'Interfaces: what minimum input for Interfaces would break the Interfaces
        recommendation, and how would you revise the Interfaces claim?'
    evidence_check:
      basis: Check the Interfaces claim against system-design-estudos/areas/09-backend-principles/cards/application-boundaries-and-service-layer.md
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: This Go exercise can test reasoning about Interfaces, but it cannot
        prove an unmeasured production outcome, personal ownership, or universal rule.
      checked_on: '2026-08-25'
    certainty:
      level: high
      rationale: Certainty is high because the prompt bounds the Interfaces question
        but does not reveal every workload, stakeholder priority, or outcome.
      update_trigger: For case "Where would you define the interface for", update
        Interfaces when Interfaces evidence—a Interfaces trace or Interfaces test—contradicts
        the Interfaces constraint in case "Where would you define the interface for";
        ask a stakeholder about Interfaces before revising.
    rubric:
      facts_correct: Names the verified Interfaces facts without smuggling in a result,
        scale, or capability that the prompt does not establish.
      assumptions_explicit: Labels the Interfaces premise that is still assumed and
        asks the smallest clarifying question that matters.
      alternatives_considered: Compares two credible Interfaces options, or explains
        the hard constraint that makes comparison a false equivalence.
      tradeoff_quality: Connects the Interfaces choice to a benefit, a cost or risk,
        and the condition under which another choice wins.
      follow_up_adaptation: Responds to the evidence challenge about Interfaces by
        changing the claim or evidence boundary rather than repeating the base answer.
      certainty_calibration: Uses high certainty deliberately and names the evidence
        that would update the Interfaces recommendation.
- id: golang-02-goroutine-leak
  version: 1.4.0
  target: golang
  topic: Goroutines
  difficulty: 3
  interview_stage: deep_dive
  prompt: What happens to this goroutine if nobody reads from the channel?
  context: The code starts a goroutine that sends a result on an unbuffered channel,
    but the caller returns early on timeout. The interviewer is probing whether you
    can see the leak.
  follow_up:
    prompt: What cancellation or channel-ownership rule stops this goroutine from
      waiting forever, and how would you prove it in a test?
    goal: Answer the alternative challenge about Goroutines while keeping the evidence
      boundary explicit.
    challenge_kind: alternative
    best_answer: >-
      It blocks on the send forever, so the goroutine never exits and whatever it
      holds stays alive. I would compare that choice with the credible alternative against the
      requirement in the follow-up, cost, and failure risk, then switch only if evidence makes
      the alternative safer.
    distractors:
    - text: I would defend the first Goroutines option because offering an alternative
        might make the decision look uncertain.
      why_wrong: A comparison makes the decision rule visible; it does not weaken
        a well-calibrated recommendation.
    - text: I would list every conceivable Goroutines design without saying which
        requirement should decide between them.
      why_wrong: An option list without a decision rule avoids the trade-off the follow-up
        is testing.
  compression:
    prompt: Summarize the leak prevention as owner, shutdown signal, and evidence
      that every goroutine can exit.
    goal: Compress the Goroutines answer into its decision, premise, trade-off, and
      verification step.
  best_answer: It blocks on the send forever, so the goroutine never exits and whatever
    it holds stays alive. I would either give the channel a buffer of one so the send
    always completes, or select on the context so the goroutine gives up when the
    caller does.
  distractors:
  - text: The goroutine will be garbage collected once nothing references the channel
      any more, so it gets cleaned up automatically without leaking any memory in
      the process.
    trap: content
    why_wrong: Blocked goroutines are never collected; that is precisely why leaks
      accumulate under load.
  - text: It would probably just wait there, which is not ideal, so it would be better
      to handle that case somehow to avoid any potential issues later on in production.
    trap: precision
    why_wrong: Identifies the symptom vaguely and proposes nothing concrete, so it
      demonstrates no working knowledge.
  - text: It stays blocked in the send for always, then the goroutine never exits
      and everything that it is holding continues alive in the memory of the process.
    trap: grammar
    why_wrong: '"For always", "continues alive" and "the memory of the process" are
      all literal translations.'
  feedback:
    register: Precise and unhurried; leaks are a mechanism question.
    hedging: None; the blocking behaviour is deterministic.
    precision: Give both fixes, since they suit different situations.
    grammar: '"Blocks forever", "stays alive", "process memory".'
    pragmatics: Connecting the leak to what it retains shows production experience.
  rephrase:
    prompt: Explain how you would detect this leak in a running service.
    goal: Move from cause to observation.
  language_focus:
  - precision
  - grammar
  - hedging
  feynman:
    concept: Blocked sends and goroutine lifetime.
    explain_to: A developer who assumes the runtime cleans everything up.
    constraint: Explain using someone holding a door for a person who left.
    self_check: Did you name both the buffer and the context fix?
    reasoning_check: Can you identify the hidden premise behind Goroutines, give a
      counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You assumed collection, or described the problem vaguely.
    expected: Permanent block, retained memory, buffer or context fix.
    actual: A garbage-collection claim, or an unspecific concern.
    root_cause: Goroutines modelled as tasks rather than as blocked OS-level waiters.
    repair: For every channel send, ask who guarantees a receive.
    reasoning_error: If your Goroutines answer failed, classify the mistake as a fact,
      assumption, comparison, failure, or certainty error before proposing the smallest
      repair.
  recall:
    active_recall_cue: Why is a blocked goroutine never garbage collected?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Goroutines without presenting
      an assumption as a fact?
    black_box_probe: When the Goroutines answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: golang-02-goroutine-leak-delayed-2
      prompt: 'Review note for Goroutines: a stakeholder clarifies a Goroutines requirement
        that changes the Goroutines success condition. Given a stakeholder asks for
        a stronger Goroutines guarantee than the first Goroutines answer promised,
        what would you now defend, retract, and verify about Goroutines?'
      changed_constraint: a stakeholder asks for a stronger Goroutines guarantee than
        the first Goroutines answer promised
      new_evidence: a stakeholder clarifies a Goroutines requirement that changes
        the Goroutines success condition
      best_answer: I would keep the facts that remain supported about Goroutines,
        treat a stakeholder clarifies a Goroutines requirement that changes the Goroutines
        success condition as new evidence rather than a result, and state the updated
        decision rule under a stakeholder asks for a stronger Goroutines guarantee
        than the first Goroutines answer promised. I would then name one focused check
        before treating the revised answer as settled.
      distractors:
      - text: I would preserve every part of the original Goroutines answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Goroutines explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/09-backend-principles/cards/concurrency-parallelism.md
    note: Concurrency primitives and failure modes.
  - repo: original
    path: english-arcade/golang/goroutine-leak
    note: Original interview phrasing authored for this pack.
  extension:
