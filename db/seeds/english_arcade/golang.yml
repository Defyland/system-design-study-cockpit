- id: golang-04-error-wrapping
  version: 1.4.0
  target: golang
  topic: Errors
  difficulty: 2
  interview_stage: technical_screen
  prompt: How do you decide what to add when you wrap an error?
  context: The codebase has errors wrapped at every level, and the logs are now repetitive.
    The interviewer wants a rule for what each layer should contribute.
  follow_up:
    prompt: Which caller needs to classify this failure, and what stable sentinel
      or type would you preserve while adding operation context?
    goal: Answer the new_evidence challenge about Errors while keeping the evidence
      boundary explicit.
    challenge_kind: new_evidence
    best_answer: >-
      I would preserve a stable sentinel or type for the caller and add operation context once per
      boundary. I would test errors.Is and errors.As, and ensure logs do not depend on message text;
      a layer with no new context should return the original error.
    distractors:
    - text: I would keep the Errors recommendation unchanged because changing position
        would look inconsistent.
      why_wrong: A defensible answer updates when relevant evidence changes an assumption
        or trade-off.
    - text: I would discard every earlier Errors claim as soon as one new observation
        appeared.
      why_wrong: New evidence may narrow one claim while leaving other verified facts
        intact.
  compression:
    prompt: Rephrase error wrapping as context for humans, identity for callers, and
      one matching test.
    goal: Compress the Errors answer into its decision, premise, trade-off, and verification
      step.
  best_answer: >-
    I have each layer add only what it knows: the repository adds the query or identifier
    and the handler adds the operation. If I have nothing new to say at a layer, I return
    the error unchanged rather than restating the one below it.
  distractors:
  - text: I wrap at every level with a message describing what the function was doing,
      which builds up a complete trail of the call path in the final error message.
    trap: content
    why_wrong: Produces exactly the repetitive logs described in the prompt; a stack
      trace already covers the call path.
  - text: I try to add useful context that will help with debugging later, without
      making the messages too long or repeating what is already there in the underlying
      error.
    trap: precision
    why_wrong: Restates the goal without giving a rule anyone could apply consistently.
  - text: Each layer adds what only it knows, then the repository puts the query or
      the identifier and the handler puts the operation that was being realised in
      that moment.
    trap: grammar
    why_wrong: '"Puts" for "adds", and "being realised in that moment" is a false
      friend for "being performed".'
  feedback:
    register: Rule-based and concise.
    hedging: None; give the rule directly.
    precision: '"What only it knows" is the operative test.'
    grammar: '"Adds the identifier", "the operation being performed"; avoid the false
      friend "realise".'
    pragmatics: The return-unchanged clause answers the repetition problem explicitly.
  rephrase:
    prompt: Apply your rule to a failed HTTP call inside a payment handler.
    goal: Test the rule on a concrete stack.
  language_focus:
  - precision
  - grammar
  - register
  pt_help: '"Realizar" tecnico e "perform" ou "carry out". "Realise" significa "perceber".'
  feynman:
    concept: Layered error context without duplication.
    explain_to: A developer whose logs repeat the same message five times.
    constraint: Explain using a parcel passed between depots.
    self_check: Does your rule ever say "add nothing"?
    reasoning_check: Can you identify the hidden premise behind Errors, give a counterexample,
      and explain how the evidence changes your conclusion?
  black_box:
    symptom: You wrapped everywhere, or described the goal instead of a rule.
    expected: Add only layer-specific knowledge; otherwise pass through.
    actual: A full call-path trail, or an unactionable aspiration.
    root_cause: Wrapping treated as ceremony rather than as information gain.
    repair: Before wrapping, ask what this layer knows that the caller does not.
    reasoning_error: If your Errors answer failed, classify the mistake as a fact,
      assumption, comparison, failure, or certainty error before proposing the smallest
      repair.
  recall:
    active_recall_cue: When should a layer return an error unchanged?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Errors without presenting
      an assumption as a fact?
    black_box_probe: When the Errors answer failed, did you locate the reasoning error
      before changing the implementation?
    delayed_variant:
      id: golang-04-error-wrapping-delayed-4
      prompt: >-
        A handler compares error strings and misses a wrapped sentinel. What error contract would you preserve?
      changed_constraint: >-
        callers need stable errors.Is or errors.As classification while layers add context
      new_evidence: >-
        the wrapped error no longer matches a string comparison but errors.Is identifies the sentinel
      best_answer: >-
        I would preserve the sentinel or type, add operation context once per boundary, and test errors.Is/As so behavior does not depend on message text.
      distractors:
      - text: I would preserve every part of the original Errors answer because changing
          it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Errors explanation with a new design without
          identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
