- id: react-12-scope-negotiation
  version: 1.4.0
  target: react
  topic: Estimation
  difficulty: 2
  interview_stage: behavioural_probe
  prompt: How long would this component take you to build?
  context: A deceptively simple question. The interviewer is assessing whether you
    can estimate in English without either padding vaguely or committing to a number
    you cannot defend.
  follow_up:
    prompt: What assumptions make that estimate reliable, and what smaller milestone
      could you offer if the requirements remain uncertain?
    goal: Answer the evidence challenge about Estimation while keeping the evidence
      boundary explicit.
    challenge_kind: evidence
    best_answer: >-
      A day for the happy path, and probably another for the states that are
      not in the design yet, empty, loading and error. I would treat the follow-up
      observation as evidence, not as proof of impact; I would inspect the smallest relevant
      trace or test and state what remains uncertain before changing the decision.
    distractors:
    - text: I would cite my experience with Estimation as enough proof and move on
        without naming an observation.
      why_wrong: Experience can guide a hypothesis, but it does not replace evidence
        tied to this context.
    - text: I would collect every possible metric about Estimation before making even
        a provisional recommendation.
      why_wrong: A focused decision can start with one discriminating observation
        rather than an unbounded data request.
  compression:
    prompt: Compress the estimate into scope, assumptions, risks, and a next checkpoint
      rather than one unsupported number.
    goal: Compress the Estimation answer into its decision, premise, trade-off, and
      verification step.
  best_answer: A day for the happy path, and probably another for the states that
    are not in the design yet, empty, loading and error. If those are already specified,
    it is closer to a day and a half. Which of those do you already have?
  distractors:
  - text: It is quite hard to say without knowing more about the requirements, since
      it really depends on a lot of factors like the design and the data and the edge
      cases involved.
    trap: hedging
    why_wrong: Refuses to estimate at all, which reads as inability rather than as
      rigour.
  - text: About two days. That should be enough time to build it properly and handle
      everything that might come up during the implementation of the component.
    trap: precision
    why_wrong: A number with no breakdown cannot be negotiated, defended or revised
      when scope changes.
  - text: One day for the happy path and probably more one for the states that are
      not yet in the design, like empty, loading and of error.
    trap: grammar
    why_wrong: '"More one" inverts "another one" and "of error" adds a Portuguese
      preposition.'
  feedback:
    register: Confident and collaborative; end by returning a question.
    hedging: Hedge the unknown scope, not the estimate itself.
    precision: Break the number into parts so it can be negotiated.
    grammar: '"Another day", "empty, loading and error states".'
    pragmatics: Closing with a question converts an estimate into a scoping conversation.
  rephrase:
    prompt: Give the same estimate to someone who wants a single number.
    goal: Hold the breakdown while satisfying the request.
  language_focus:
  - hedging
  - grammar
  - pragmatics
  feynman:
    concept: Estimation as decomposition plus assumptions.
    explain_to: A manager who wants one number for a roadmap.
    constraint: Explain using a builder quoting for a room.
    self_check: Could someone negotiate scope from your answer?
    reasoning_check: Can you identify the hidden premise behind Estimation, give a
      counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You refused to estimate, or gave a bare number.
    expected: A split estimate with the unknown named, ending in a question.
    actual: A bare "it depends", or an undefended figure.
    root_cause: Treating estimates as commitments rather than as conditional models.
    repair: 'Always estimate in two parts: known work and unspecified states.'
    reasoning_error: If your Estimation answer failed, classify the mistake as a fact,
      assumption, comparison, failure, or certainty error before proposing the smallest
      repair.
  recall:
    active_recall_cue: What makes an estimate negotiable rather than binding?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Estimation without presenting
      an assumption as a fact?
    black_box_probe: When the Estimation answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: react-12-scope-negotiation-delayed-12
      prompt: 'Estimation gets a new constraint: a stakeholder asks for a stronger
        Estimation guarantee than the first Estimation answer promised. After a code
        inspection of Estimation confirms the Estimation mechanism but not its impact,
        which Estimation assumption is no longer safe?'
      changed_constraint: a stakeholder asks for a stronger Estimation guarantee than
        the first Estimation answer promised
      new_evidence: a code inspection of Estimation confirms the Estimation mechanism
        but not its impact
      best_answer: I would keep the facts that remain supported about Estimation,
        treat a code inspection of Estimation confirms the Estimation mechanism but
        not its impact as new evidence rather than a result, and state the updated
        decision rule under a stakeholder asks for a stronger Estimation guarantee
        than the first Estimation answer promised. I would then name one focused check
        before treating the revised answer as settled.
      distractors:
      - text: I would preserve every part of the original Estimation answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Estimation explanation with a new design
