---
contract_version: 1.4.0
target:
  key: react
  label: React
  blurb: Talk about rendering, state and effects the way a senior front-end engineer
    does, with the user-visible consequence named.
  focus_areas:
  - rendering and reconciliation
  - state ownership and lifting
  - effects and data fetching
  - accessibility
  - performance and measurement
  simulation:
    minutes: 45
    structure:
    - label: Component and state design warm-up
      minutes: 8
    - label: Effects and data fetching deep dive
      minutes: 15
    - label: Accessibility and semantics
      minutes: 10
    - label: Performance measurement and trade-offs
      minutes: 12
  critical_thinking:
    learner_prompts:
      evidence_ledger: For React, record whether each claim about rendering, state
        ownership, effects, accessibility, and measurable performance is a verified
        fact, an inference, an assumption, or an unknown before you defend it.
      problem_frame: Frame every React answer with the actor, requirement, constraint,
        success condition, and unanswered question that could change the decision.
      comparison: When React offers a real choice, compare two options by benefit,
        cost or risk, valid-when condition, and an explicit decision rule.
      failure_probe: Ask which counterexample, edge case, or failure mode could break
        the React recommendation, then state the smallest test or containment step.
      certainty_review: 'Calibrate certainty in React: name the evidence, separate
        correlation from causality, and say what new observation would make you revise
        the answer.'
    rubric:
      facts_correct: Names the verified rendering, state ownership, effects, accessibility,
        and measurable performance facts without smuggling in a result or capability
        that the prompt does not establish.
      assumptions_explicit: Labels the React premise that is still assumed and asks
        the smallest clarifying question that matters.
      alternatives_considered: Considers a credible alternative for React, or explains
        the hard constraint that makes comparison a false equivalence.
      tradeoff_quality: Connects the React choice to a benefit, a cost or risk, and
        the condition under which another choice wins.
      follow_up_adaptation: Responds to an adversarial React follow-up by changing
        the claim or evidence boundary rather than repeating a memorised answer.
      certainty_calibration: Uses high, medium, or low certainty deliberately and
        names the evidence that would update the React recommendation.
cards:
- id: react-card-effect-purpose
  front: When is useEffect the right tool?
  back: I use useEffect only when I need to synchronise with something outside
    React. I derive values during render and handle event responses in event handlers.
  box: 1
  source:
    repo: original
    path: english-arcade/react/effect-purpose
    note: Authored for this pack; the corpus has no React effects reference.
  critical_thinking:
    cue: Is this work deriving a value during render or synchronising with an external
      system? Name the assumption that could make an effect unnecessary.
    check: Can I choose render-time derivation or an effect, name the stale-state or
      cleanup failure, and state the trace that would change my choice?
- id: react-card-accessibility
  front: How do you justify a semantic element over a div?
  back: >-
    I prefer a native button when the control is a button: I get focus, keyboard
    activation, and the button role without rebuilding them on a div.
  box: 1
  source:
    repo: original
    path: english-arcade/react/accessibility-justification
    note: Authored for this pack; no accessibility card exists in the corpus.
  critical_thinking:
    cue: Is the control an action, navigation, or widget trigger? Name the keyboard,
      focus, name, and state behavior that my element choice must preserve.
    check: Can I compare a native element with a custom div, name the user-visible
      failure, and state the keyboard or screen-reader test that would update the choice?
- id: react-card-measure-first
  front: How should you open a React performance answer?
  back: I start with a measurement, not the fix. I profile what re-renders and why,
    then decide whether memoisation is relevant.
  box: 2
  source:
    repo: system-design-estudos
    path: areas/09-backend-principles/cards/scaling-performance.md
    note: Measure-before-change discipline applied to the client.
  critical_thinking:
    cue: What work is actually expensive, and which prop identity or measurement is
      still unknown? Treat the profile as evidence rather than as a memo slogan.
    check: Can I compare profiling with memoisation, name the unstable-prop failure,
      and state the trace that would justify or reject the optimisation?
items:
- id: react-01-state-ownership
  version: 1.4.0
  target: react
  topic: State ownership
  difficulty: 2
  interview_stage: technical_screen
  prompt: Two sibling components need the same value. How do you handle that?
  context: A common design question early in a front-end screen. The interviewer is
    checking whether you reach for the simplest correct answer before reaching for
    a library.
  follow_up:
    prompt: Where should the value live if both siblings update it, and how would
      you avoid turning an unrelated parent into a state container?
    goal: Answer the assumption challenge about State ownership while keeping the
      evidence boundary explicit.
    challenge_kind: assumption
    best_answer: >-
      I would lift the state to their closest common parent and pass it down,
      since that is the smallest change that keeps one source of truth. If both
      siblings update it, I would keep the update path in that parent and ask
      whether the value crosses an independent subtree before considering context.
    distractors:
    - text: I would repeat my original State ownership answer with more confidence
        because the interviewer probably assumes the usual case.
      why_wrong: It hides the premise instead of checking whether the usual case is
        actually part of this problem.
    - text: I would stop proposing anything about State ownership until every surrounding
        requirement had been documented in full.
      why_wrong: It treats uncertainty as a reason for paralysis and offers no bounded
        next step.
  compression:
    prompt: Explain state ownership with source of truth, update path, and the smallest
      component boundary.
    goal: Compress the State ownership answer into its decision, premise, trade-off,
      and verification step.
  best_answer: I would lift the state to their closest common parent and pass it down,
    since that is the smallest change that keeps one source of truth. I would only
    reach for context or a store if the value had to cross many levels or be shared
    far outside this subtree.
  distractors:
  - text: I would put it in a global store so that both components can access it directly,
      which avoids passing props through the parent and keeps the components independent
      of each other.
    trap: content
    why_wrong: Reaches for global state to solve a local problem, which trades a two-line
      change for application-wide coupling.
  - text: There are several options here, you could lift the state up, or use context,
      or a state management library, and each of them has different trade-offs depending
      on the situation.
    trap: precision
    why_wrong: Lists options without choosing, so it demonstrates awareness but no
      judgement.
  - text: I would lift the state for the parent more close and pass it for below,
      because this is the change more small that maintains one only source of truth.
    trap: grammar
    why_wrong: Comparative forms and adjective order are wrong throughout; English
      uses "closest" and "smallest".
  feedback:
    register: Direct and proportionate. Simple problems deserve simple answers.
    hedging: None needed; state the default and the escalation condition.
    precision: Say "closest common parent" and name what would change your mind.
    grammar: 'Use synthetic comparatives: "closest", "smallest", not "more close".'
    pragmatics: Naming the escalation condition pre-empts the "what if it grows" follow-up.
  rephrase:
    prompt: Answer again for a value needed by twenty components across the app.
    goal: Test whether the escalation rule is real or decorative.
  language_focus:
  - precision
  - grammar
  - register
  pt_help: 'Comparativos curtos em ingles usam -er/-est: "closer", "smallest". Nao
    use "more close".'
  feynman:
    concept: Lifting state to the closest common ancestor.
    explain_to: A developer who installs a store for every shared value.
    constraint: Explain using two people sharing one calendar.
    self_check: Did you name the condition that justifies global state?
    reasoning_check: Can you identify the hidden premise behind State ownership, give
      a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You reached for a store, or listed options without deciding.
    expected: Lift to the closest common parent; escalate only on distance.
    actual: Global state by default, or an unresolved menu of options.
    root_cause: Defaulting to the most powerful tool instead of the smallest sufficient
      one.
    repair: Answer with the default first, then the condition that overrides it.
    reasoning_error: If your State ownership answer failed, classify the mistake as
      a fact, assumption, comparison, failure, or certainty error before proposing
      the smallest repair.
  recall:
    active_recall_cue: What justifies moving shared state out of a common parent?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind State ownership without presenting
      an assumption as a fact?
    black_box_probe: When the State ownership answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: react-01-state-ownership-delayed-1
      prompt: A third screen now needs the selected account from an unrelated subtree.
        A trace shows four intermediate components only pass that value through. Which
        part of your state-ownership recommendation survives, and what changes?
      changed_constraint: the selected account must cross an unrelated subtree without
        creating a second source of truth
      new_evidence: a trace shows four intermediate components pass selectedAccount
        without reading or updating it
      best_answer: >-
        I would keep one source of truth and place its owner where it can serve both siblings
        and the third screen. Context could expose that same value across the unrelated
        subtree without passing it through four intermediate components. I would test an
        update from each consumer and verify that all three show the same selected account
        before considering a separate store.
      distractors:
      - text: I would preserve every part of the original State ownership answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire State ownership explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: interview/story-bank/02-react-react-native-story-bank.md
    note: React story bank covering component and state discussions.
  - repo: original
    path: english-arcade/react/state-ownership
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: >-
      If a settings screen reads and updates selectedAccount through four pass-through
      components, what trace would justify context and when would a store add value?
    goal: Defend the state boundary with a concrete scale condition, a cost, and a
      check for duplicated or unclear ownership.
  critical_thinking:
    problem_frame: >-
      I would first name the two sibling consumers, the shared update path, and the smallest
      common owner; the unknown is whether a distant branch makes that owner awkward.
    claim_map:
      fact: >-
        The prompt gives me two sibling components that need and update one value; it does not
        give me a distant consumer, a store, or a measured prop-drilling problem.
      inference: >-
        I infer that the closest common parent is a reasonable first owner because it can keep
        the siblings on one source of truth; I would revisit that if the value crosses unrelated
        branches.
      assumption: >-
        I am assuming the common parent already owns the relevant interaction and will not
        become a dumping ground; I would ask whether another subtree must read or edit the
        value.
      unknown: >-
        I still need the number of levels and consumers, update frequency, and ownership of
        writes before judging context or a store.
    comparison:
      applicable: true
      alternatives:
      - option: lift the value to the closest common parent
        benefit: I keep one source of truth and make both sibling update paths explicit.
        cost_or_risk: Prop plumbing grows when the value crosses unrelated branches,
          and the parent may own state it does not otherwise understand.
        valid_when: Use it for a value shared by nearby siblings or one subtree.
      - option: use context or an external store for wider ownership
        benefit: I avoid passing a value through components that neither read nor update
          it when several distant branches genuinely share it.
        cost_or_risk: I add a broader subscription and ownership surface, which can hide
          dependencies or create a second source of truth.
        valid_when: Use it only when distance or cross-branch ownership justifies the
          wider boundary and the owner remains clear.
      decision_rule: Lift first for nearby siblings; choose context or a store only when
        measured prop distance or cross-branch ownership makes the local boundary costly.
    failure_probe:
      kind: counterexample
      prompt: If the selected account must be edited by two siblings and read by a
        distant settings subtree, what evidence would make the parent boundary too
        costly, and how would you revise ownership?
    evidence_check:
      basis: Check the State ownership claim against system-design-estudos/interview/story-bank/02-react-react-native-story-bank.md
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: This React exercise can test reasoning about State ownership, but
        it cannot prove an unmeasured production outcome, personal ownership, or universal
        rule.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        I am confident that nearby siblings can share a lifted owner, but the boundary should
        change if a trace shows unrelated branches carrying the value or independent owners
        needing it.
      update_trigger: >-
        I would revise this recommendation after observing four pass-through levels, a distant
        settings consumer, or duplicated write ownership; I would verify that a wider boundary
        removes that cost without creating competing sources of truth.
    rubric:
      facts_correct: >-
        States that two nearby siblings can share one lifted owner and keeps any distant-branch
        condition separate from the facts supplied by the prompt.
      assumptions_explicit: >-
        Names the unverified distance and write ownership, then asks whether another subtree
        reads or edits the value.
      alternatives_considered: >-
        Compares a common parent with context or a store in terms of consumer distance,
        subscriptions, and ownership clarity.
      tradeoff_quality: >-
        Connects the local owner to one source of truth and names prop plumbing or broader
        subscriptions as the relevant costs.
      follow_up_adaptation: >-
        When a distant settings subtree appears, changes the boundary recommendation and asks
        for evidence instead of repeating the local default.
      certainty_calibration: >-
        Uses medium confidence for the local default and names the trace or ownership evidence
        that would justify a broader boundary.
- id: react-02-effect-misuse
  version: 1.4.0
  target: react
  topic: Effects
  difficulty: 3
  interview_stage: deep_dive
  prompt: Why would you avoid computing this filtered list inside useEffect?
  context: The candidate's code stores a filtered array in state and recomputes it
    in an effect when the source changes. The interviewer wants the reasoning about
    renders, not just the alternative.
  follow_up:
    prompt: What would make an effect legitimate here, and where should the filtering
      computation run so render remains deterministic?
    goal: Answer the evidence challenge about Effects while keeping the evidence boundary
      explicit.
    challenge_kind: evidence
    best_answer: >-
      Because it is derived data, not synchronisation. I would compute the filtered
      list during render, and I would use an effect only if the work synchronised with
      something outside React. I would verify that a source update cannot leave the
      list and its source out of step for one render.
    distractors:
    - text: I would cite my experience with Effects as enough proof and move on without
        naming an observation.
      why_wrong: Experience can guide a hypothesis, but it does not replace evidence
        tied to this context.
    - text: I would collect every possible metric about Effects before making even
        a provisional recommendation.
      why_wrong: A focused decision can start with one discriminating observation
        rather than an unbounded data request.
  compression:
    prompt: Contrast render-time derivation with an effect in two sentences, including
      the stale-state failure you avoid.
    goal: Compress the Effects answer into its decision, premise, trade-off, and verification
      step.
  best_answer: Because it is derived data, not synchronisation. Doing it in an effect
    means an extra render every time the source changes, and it creates a window where
    the list and its source disagree. I would compute it during render instead.
  distractors:
  - text: Because useEffect runs after the render, so it would be slightly slower
      than doing the calculation directly, and performance matters in a list that
      could become large.
    trap: precision
    why_wrong: Frames it as micro-performance and misses the correctness problem,
      which is the inconsistent intermediate state.
  - text: I would keep it in the effect but add the source array to the dependency
      list, so that it recomputes correctly whenever the source changes and stays
      in sync properly.
    trap: content
    why_wrong: Fixes the trigger but keeps the redundant state and the extra render
      that caused the problem.
  - text: Because this is data derived, not synchronisation, so making it in an effect
      provokes one render more each time that the source is changing.
    trap: grammar
    why_wrong: Adjective order, "making it in an effect" and "one render more" are
      all calques that obscure a correct point.
  feedback:
    register: Explanatory rather than corrective; you are teaching the distinction.
    hedging: None; derived versus synchronised is a clean dichotomy.
    precision: The inconsistent window is the strongest argument, stronger than the
      extra render.
    grammar: '"Derived data", "doing it in an effect", "one extra render".'
    pragmatics: Offering the alternative in the same breath keeps it constructive.
  rephrase:
    prompt: Explain the same point to someone who insists the effect version works
      fine.
    goal: Practise persuasion when the bug is not yet visible.
  language_focus:
  - precision
  - grammar
  - register
  feynman:
    concept: Derived state versus external synchronisation.
    explain_to: A developer who uses effects for every update.
    constraint: Explain using a total printed on a receipt.
    self_check: Did you name the moment when the two values disagree?
    reasoning_check: Can you identify the hidden premise behind Effects, give a counterexample,
      and explain how the evidence changes your conclusion?
  black_box:
    symptom: You argued performance, or fixed only the dependency array.
    expected: Derived data belongs in render; effects are for external sync.
    actual: A micro-optimisation claim, or a patched dependency list.
    root_cause: Effects understood as a lifecycle hook rather than as a synchronisation
      boundary.
    repair: Ask "is anything outside React involved?" before writing an effect.
    reasoning_error: If your Effects answer failed, classify the mistake as a fact,
      assumption, comparison, failure, or certainty error before proposing the smallest
      repair.
  recall:
    active_recall_cue: What is the only job an effect should be doing?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Effects without presenting
      an assumption as a fact?
    black_box_probe: When the Effects answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: react-02-effect-misuse-delayed-2
      prompt: A new requirement adds a websocket subscription, while a render trace
        shows the filtered list lags its source by one render. Which part of your
        effects recommendation survives, and what changes?
      changed_constraint: the screen must subscribe to a websocket while keeping its
        filtered list deterministic on every render
      new_evidence: a render trace shows effect-written filtered state is one render
        behind the source list after the query changes
      best_answer: >-
        I would keep filtering in render so the list uses the current source immediately. I
        would put the websocket subscription in an effect and return cleanup that disconnects
        the old subscription. I would test a source change and a subscription change
        separately: the first must not display a stale list, and the second must not leave
        duplicate listeners.
      distractors:
      - text: I would preserve every part of the original Effects answer because changing
          it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Effects explanation with a new design without
          identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: original
    path: english-arcade/react/effect-misuse
    note: Authored for this pack; corpus has no React effects reference.
  extension:
    prompt: >-
      If filtering costs 18ms but websocket cleanup is separate, which timing would I profile
      and which teardown or reconnect test would I run?
    goal: Distinguish render-time derivation from external synchronisation and name
      the failure check that would change the implementation.
  critical_thinking:
    problem_frame: >-
      I would separate the pure filtered-list calculation from the websocket boundary; the
      question is whether render must stay current and whether any external subscription needs
      cleanup.
    claim_map:
      fact: >-
        The described code stores the filtered array in state and recomputes it in an effect;
        the context also gives a one-render lag and a separate websocket requirement.
      inference: >-
        I infer that render-time derivation keeps the source and filtered list aligned, while an
        effect belongs to the websocket boundary.
      assumption: >-
        I am assuming filtering is a pure calculation rather than an external write; I would ask
        whether the list calculation or subscription has a measured cost.
      unknown: >-
        I still need the list size, calculation profile, websocket cleanup and reconnect
        behavior, and whether requests can race.
    comparison:
      applicable: true
      alternatives:
      - option: derive the filtered list during render
        benefit: It keeps the list and source in step without an extra state-setting
          render or a stale intermediate value.
        cost_or_risk: Repeated filtering can matter if the list or calculation is large,
          so I would measure before adding memoisation.
        valid_when: Use it when filtering is a pure calculation over current props or
          state and does not synchronise with an external system.
      - option: synchronise an external subscription in an effect
        benefit: It gives a websocket, request, or non-React widget an explicit setup
          and cleanup boundary.
        cost_or_risk: It introduces cleanup and race handling, and it is the wrong tool
          for values that can be derived during render.
        valid_when: Use it only when work must stay in sync with something outside React.
      decision_rule: Derive the filtered list during render; choose an effect only for
        the external subscription or other non-React synchronisation, with cleanup and
        a race test.
    failure_probe:
      kind: edge_case
      prompt: If filtering becomes expensive and the screen also owns a websocket
        subscription, which work stays in render and which work needs effect cleanup?
    evidence_check:
      basis: Check the Effects claim against original/english-arcade/react/effect-misuse
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: This React exercise can test reasoning about Effects, but it cannot
        prove an unmeasured production outcome, personal ownership, or universal rule.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        I am confident that a filtered value can stay derived during render, but calculation
        cost and the websocket lifecycle determine whether memoisation or effect cleanup is
        needed.
      update_trigger: >-
        I would update the recommendation if a profile shows filtering dominates render time or
        a subscription test exposes duplicate listeners; I would keep the two measurements
        separate.
    rubric:
      facts_correct: >-
        Identifies the stored filtered state, the one-render lag, and the websocket as separate
        facts rather than treating every effect as one kind of work.
      assumptions_explicit: >-
        States that filtering is pure and asks whether it has measured cost or whether an
        external system must be synchronised.
      alternatives_considered: >-
        Compares render-time derivation with an effect-managed subscription and explains why the
        latter needs cleanup and race handling.
      tradeoff_quality: >-
        Links current render consistency to the cost of recalculation and links the websocket to
        listener cleanup instead of inventing a performance result.
      follow_up_adaptation: >-
        Keeps filtering in render when the websocket is added, then adds only the subscription
        lifecycle and its duplicate-listener test.
      certainty_calibration: >-
        Uses medium confidence and names a render profile plus a subscription cleanup test as
        the evidence that could change the recommendation.
- id: react-03-key-prop
  version: 1.4.0
  target: react
  topic: Reconciliation
  difficulty: 2
  interview_stage: technical_screen
  prompt: What actually goes wrong when you use the array index as a key?
  context: Almost every candidate knows the rule. The interviewer is filtering for
    the ones who can describe the observable bug rather than reciting the warning.
  follow_up:
    prompt: Which user-visible bug can an index key cause after insertion or reordering,
      and how would a stable identity fix it?
    goal: Answer the alternative challenge about Reconciliation while keeping the
      evidence boundary explicit.
    challenge_kind: alternative
    best_answer: >-
      I would explain that an index key follows a position, so an inserted or
      reordered row can inherit the previous row's state. I would use a stable ID
      from the data and reproduce an insertion with a checked row to verify that state
      stays attached to the item rather than to the slot.
    distractors:
    - text: I would defend the first Reconciliation option because offering an alternative
        might make the decision look uncertain.
      why_wrong: A comparison makes the decision rule visible; it does not weaken
        a well-calibrated recommendation.
    - text: I would list every conceivable Reconciliation design without saying which
        requirement should decide between them.
      why_wrong: An option list without a decision rule avoids the trade-off the follow-up
        is testing.
  compression:
    prompt: Describe reconciliation as identity matching, the index-key failure, and
      the stable key rule.
    goal: Compress the Reconciliation answer into its decision, premise, trade-off,
      and verification step.
  best_answer: >-
    I think of a key as the item's identity. If I use an index and the list reorders,
    the index still points at a position, so component state can attach to the wrong
    row. I would expect a checked checkbox to follow the slot instead of the item.
  distractors:
  - text: It causes performance problems because React cannot efficiently determine
      which items have changed, so it ends up re-rendering more of the list than it
      actually needs to.
    trap: content
    why_wrong: Performance is secondary and often negligible; the real failure is
      misplaced state, which is a correctness bug.
  - text: It is considered bad practice and React will show a warning in the console
      about it, so you should always use a stable unique identifier from your data
      instead of the index.
    trap: precision
    why_wrong: Cites the rule and the warning without explaining any mechanism, which
      is exactly what this question filters for.
  - text: React is matching the elements for the key, so if the list reorders the
      index continues pointing for the position instead of the identity of the item.
    trap: grammar
    why_wrong: '"Matching for", "pointing for" and the progressive aspect all break
      a statement of general behaviour.'
  feedback:
    register: Concrete. Name the symptom a user would report.
    hedging: None needed; the reconciliation behaviour is deterministic.
    precision: State attaching to the wrong row is the detail that proves understanding.
    grammar: '"Matches by key", "points at position"; simple present for behaviour.'
    pragmatics: A user-visible example is more persuasive than the rule itself.
  rephrase:
    prompt: Describe the bug as a QA ticket, without mentioning React internals.
    goal: Translate a framework concept into observable behaviour.
  language_focus:
  - precision
  - grammar
  - pragmatics
  feynman:
    concept: Keys as identity during reconciliation.
    explain_to: A tester who reported a checkbox behaving strangely.
    constraint: Explain using numbered seats versus named tickets.
    self_check: Did you describe something a user could see?
    reasoning_check: Can you identify the hidden premise behind Reconciliation, give
      a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You cited performance or the console warning.
    expected: State attaches to position, so it follows the wrong item.
    actual: A re-render claim, or an appeal to best practice.
    root_cause: The rule memorised from lint output rather than from a reproduction.
    repair: Reproduce it once with a checkbox list; the memory becomes permanent.
    reasoning_error: If your Reconciliation answer failed, classify the mistake as
      a fact, assumption, comparison, failure, or certainty error before proposing
      the smallest repair.
  recall:
    active_recall_cue: What visible symptom does an index key produce on reorder?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Reconciliation without presenting
      an assumption as a fact?
    black_box_probe: When the Reconciliation answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: react-03-key-prop-delayed-3
      prompt: Stable IDs come from the server, but an offline draft row has no ID.
        Inserting that draft above a checked row moves the checked state to the draft
        when index keys are used. What changes in your key decision?
      changed_constraint: rows may be inserted offline before the server assigns an ID
      new_evidence: a reproduction moves checkbox state to the inserted draft when
        the list uses index keys
      best_answer: >-
        I would preserve item identity by generating a client ID for the draft and
        retaining it through synchronisation. I would reproduce insertion, deletion,
        and reordering with that ID; a rendering-cost comparison would be a separate
        measurement and would not justify using an index as the key.
      distractors:
      - text: I would preserve every part of the original Reconciliation answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Reconciliation explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: original
    path: english-arcade/react/key-prop
    note: Authored for this pack; corpus has no reconciliation reference.
  extension:
    prompt: >-
      How would I generate a temporary draft ID and test checked state after inserting,
      deleting, and reconciling with a server ID?
    goal: Connect key choice to an observable state bug and a repeatable reproduction
      instead of treating the rule as a lint preference.
  critical_thinking:
    problem_frame: >-
      I would anchor each row's local state to item identity, then test insertion above an
      edited row; the unknown is whether list order can change and whether drafts have stable
      IDs.
    claim_map:
      fact: >-
        The prompt asks about index keys and supplies insertion or reordering as the observable
        change; the delayed case adds an offline draft above a checked row.
      inference: >-
        I infer that stable item identity should keep the checked state with its row, provided a
        draft ID survives synchronisation.
      assumption: >-
        I am assuming rows can receive a temporary unique ID before the server ID exists; I
        would ask whether the list is ever truly static.
      unknown: >-
        I still need the ID merge rules, row-local state, and the actual insertion, deletion,
        and reordering behavior.
    comparison:
      applicable: true
      alternatives:
      - option: use a stable server ID or client-generated draft ID
        benefit: It keeps component state attached to the item through insertion,
          deletion, reordering, and later synchronisation.
        cost_or_risk: I need to create and preserve a client ID for an offline draft,
          then reconcile it with the server ID without changing identity mid-edit.
        valid_when: Use it whenever rows can change order or carry local state.
      - option: use the array index as the key
        benefit: It is easy when a list is truly static and never inserts, deletes,
          or reorders rows.
        cost_or_risk: A positional key can move checkbox or input state to another item
          as soon as the list changes.
        valid_when: Use it only when the static-list constraint is explicit and tested.
      decision_rule: Keep item identity stable whenever the list changes; accept an
        index only for a demonstrably static list with no item-level state.
    failure_probe:
      kind: failure_mode
      prompt: If an offline draft is inserted above a checked row, which state should
        stay with the item, and what key reproduction would prove it?
    evidence_check:
      basis: Check the Reconciliation claim against original/english-arcade/react/key-prop
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: This React exercise can test reasoning about Reconciliation, but
        it cannot prove an unmeasured production outcome, personal ownership, or universal
        rule.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        I am confident that a positional key can move local state to another row after
        insertion, but the identity design must account for offline drafts and server
        reconciliation.
      update_trigger: >-
        I would revise the key choice only if a reproduction proves the list is static or if
        draft identity cannot survive synchronisation; I would test insertion, deletion, and
        reordering with the same item identity.
    rubric:
      facts_correct: >-
        Names the positional-key failure after insertion or reordering and includes the offline
        draft scenario without claiming an unmeasured production symptom.
      assumptions_explicit: >-
        States the temporary-ID assumption and asks whether rows can change order or remain
        static.
      alternatives_considered: >-
        Compares stable server or client IDs with an index key, including the strict static-list
        condition required by the latter.
      tradeoff_quality: >-
        Connects stable identity to preserving row state and names temporary-ID reconciliation
        as its implementation cost.
      follow_up_adaptation: >-
        Changes the key plan when an offline draft is inserted above a checked row and specifies
        the reproduction that would prove the state stayed with the item.
      certainty_calibration: >-
        Uses medium confidence for changing lists and names static-list evidence or failed ID
        reconciliation as the update signal.
- id: react-04-data-fetching
  version: 1.4.0
  target: react
  topic: Data fetching
  difficulty: 3
  interview_stage: architecture_review
  prompt: How do you handle a request that resolves after the user has navigated away?
  context: A race-condition question. The interviewer wants to know whether you think
    about out-of-order responses, which is where most hand-rolled fetching breaks.
  follow_up:
    prompt: How would you cancel or ignore a stale response, and what state transition
      should happen when the component unmounts?
    goal: Answer the failure challenge about Data fetching while keeping the evidence
      boundary explicit.
    challenge_kind: failure
    best_answer: >-
      I would abort the supported request or mark its response as obsolete during cleanup. On
      unmount, I would stop this request from writing component state; I would update loading,
      success, or error only for the still-active request. I would test responses arriving in
      reverse order and a response arriving after unmount, because an ignore flag prevents
      stale state writes without cancelling the server's work.
    distractors:
    - text: I would describe the Data fetching failure as impossible because the happy
        path already passed its test.
      why_wrong: Passing a happy path does not test the boundary, failure mode, or
        recovery being challenged.
    - text: I would add retries to Data fetching immediately and assume the system
        would become reliable.
      why_wrong: Retries can amplify load or duplicate effects; the failure and containment
        policy must be specified first.
  compression:
    prompt: Give the data-fetching answer as ownership, stale-response protection,
      and loading or error state.
    goal: Compress the Data fetching answer into its decision, premise, trade-off,
      and verification step.
  best_answer: I would make the effect cancel its own work on cleanup, either with
    an abort signal or an ignore flag, so a late response cannot write into a component
    that has moved on. Otherwise two overlapping requests can land out of order and
    the older one wins.
  distractors:
  - text: I would check whether the component is still mounted before calling setState,
      which avoids the warning about updating state on an unmounted component.
    trap: content
    why_wrong: Targets a console warning rather than the ordering bug, and the mounted
      check does not fix stale data on a still-mounted component.
  - text: I would use a data fetching library, since they handle all of this automatically
      including caching, deduplication and cancellation, so there is no need to solve
      it manually.
    trap: pragmatics
    why_wrong: A defensible production choice, but it dodges the mechanism the interviewer
      is probing.
  - text: I would make the effect cancel the own work in the cleanup, with a signal
      of abort, then a response late cannot write in a component that already changed.
    trap: grammar
    why_wrong: '"The own work", "signal of abort" and "response late" all invert English
      possessive and adjective order.'
  feedback:
    register: Technical and specific; this is a mechanism question.
    hedging: None; cancellation on cleanup is the standard answer.
    precision: Out-of-order arrival is the real risk, not the unmount warning.
    grammar: '"Its own work", "an abort signal", "a late response".'
    pragmatics: You may mention a library, but only after showing the mechanism.
  rephrase:
    prompt: Explain the same race to a backend engineer using request timing.
    goal: Practise cross-discipline explanation.
  language_focus:
  - precision
  - grammar
  - pragmatics
  pt_help: 'Ingles poe o adjetivo antes: "a late response", "an abort signal". Nao
    traduza a ordem do portugues.'
  feynman:
    concept: Out-of-order responses and effect cleanup.
    explain_to: A developer who only checks whether the component is mounted.
    constraint: Explain using two letters posted on different days.
    self_check: Did you explain why the older response can win?
    reasoning_check: Can you identify the hidden premise behind Data fetching, give
      a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You solved the unmount warning, or deferred to a library.
    expected: Cleanup cancels work so late responses cannot write.
    actual: A mounted check, or an immediate library recommendation.
    root_cause: Async bugs modelled as lifecycle errors rather than as ordering problems.
    repair: For every fetch, ask what happens if the previous one returns second.
    reasoning_error: If your Data fetching answer failed, classify the mistake as
      a fact, assumption, comparison, failure, or certainty error before proposing
      the smallest repair.
  recall:
    active_recall_cue: Why is an is-mounted check insufficient for overlapping requests?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Data fetching without presenting
      an assumption as a fact?
    black_box_probe: When the Data fetching answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: react-04-data-fetching-delayed-4
      prompt: The client aborts a request when the user navigates away, but an
        integration test shows the server still writes a charge after the abort.
        Which part of your stale-response recommendation changes?
      changed_constraint: the request can trigger a non-idempotent server effect that
        continues after the client aborts
      new_evidence: an integration test shows a charge is written after the browser
        aborts the request
      best_answer: >-
        I would keep the stale-response guard, but the recorded charge proves that browser
        abort is not server-side cancellation. I would use a stable idempotency key for
        retries and check the existing payment status before trying again after an uncertain
        result. I would test navigation, timeout, and a repeated request separately, verifying
        both the visible client state and the provider's charge record.
      distractors:
      - text: I would preserve every part of the original Data fetching answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Data fetching explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: original
    path: english-arcade/react/data-fetching-race
    note: Authored for this pack; corpus has no client data-fetching card.
  extension:
    prompt: >-
      If a provider can charge after browser abort, which client guarantee remains and which
      idempotency or status check gates a retry?
    goal: Explain client cleanup, server effects, and the focused race test that would
      update the recommendation.
  critical_thinking:
    problem_frame: >-
      I would protect the active screen from late responses while distinguishing browser
      cancellation from a server-side write; the unknown is whether the operation can be
      retried safely.
    claim_map:
      fact: >-
        The scenario includes navigation during a request and out-of-order responses; the
        delayed case adds a server charge that may continue after browser abort.
      inference: >-
        I infer that cleanup or request identity can protect current client state, but neither
        one proves that the server stopped a write.
      assumption: >-
        I am assuming the client can identify the active request and that the server exposes
        enough idempotency or status to make a retry safe.
      unknown: >-
        I still need the server cancellation contract, retry identity, provider replay behavior,
        and whether the operation is read-only or mutating.
    comparison:
      applicable: true
      alternatives:
      - option: abort the request and ignore stale results during cleanup
        benefit: It releases client work and prevents an older response from updating
          the current screen after navigation or a new request.
        cost_or_risk: Aborting the browser request may not undo a server-side write,
          so it cannot replace idempotency for a non-idempotent operation.
        valid_when: Use it for client-owned fetch work while treating the server effect
          as a separate contract.
      - option: guard results with a request identity and make the server operation idempotent
        benefit: It protects state when cancellation is incomplete and makes a repeated
          request safe to process.
        cost_or_risk: It requires durable request identity and server-side design work,
          and it does not remove the need for client loading and error state.
        valid_when: Use it when the request can continue after abort or may be retried.
      decision_rule: Keep cleanup-based stale-result protection, and add request identity
        plus server idempotency whenever the operation can outlive the browser request.
    failure_probe:
      kind: counterexample
      prompt: If aborting a request does not stop a server-side write, which client
        guarantee survives and what idempotency check would you add?
    evidence_check:
      basis: Check the Data fetching claim against original/english-arcade/react/data-fetching-race
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: This React exercise can test reasoning about Data fetching, but
        it cannot prove an unmeasured production outcome, personal ownership, or universal
        rule.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        I am confident that stale client results need protection, but the server write and retry
        policy decide whether abort alone is a safe guarantee.
      update_trigger: >-
        I would add an idempotency key and status check after an integration test shows a charge
        continues after abort; I would separately verify late-response handling and
        duplicate-write behavior.
    rubric:
      facts_correct: >-
        Separates navigation and out-of-order response facts from the delayed server-side charge
        instead of claiming that browser abort cancels the operation.
      assumptions_explicit: >-
        Names the active-request and retry-safety assumptions and asks whether the server
        exposes cancellation, idempotency, or status.
      alternatives_considered: >-
        Compares cleanup with stale-result guards against server idempotency and request
        identity, preserving both when a mutation can outlive the browser.
      tradeoff_quality: >-
        Connects client cleanup to screen correctness and idempotency to duplicate-write risk,
        with the server contract as the condition.
      follow_up_adaptation: >-
        When abort does not stop the server write, keeps stale-result protection but adds
        idempotency and a status check before retrying.
      certainty_calibration: >-
        Uses medium confidence and names an integration trace plus a duplicate-write test as
        evidence that would change the client-only recommendation.
- id: react-05-accessibility
  version: 1.4.0
  target: react
  topic: Accessibility
  difficulty: 2
  interview_stage: technical_screen
  prompt: Why does it matter whether this clickable element is a div or a button?
  context: The candidate has built a clickable card with an onClick on a div. The
    interviewer wants to know whether accessibility is part of how you think or an
    afterthought.
  follow_up:
    prompt: Which keyboard and screen-reader behavior would disappear with a div,
      and what semantic control would you use instead?
    goal: Answer the new_evidence challenge about Accessibility while keeping the
      evidence boundary explicit.
    challenge_kind: new_evidence
    best_answer: >-
      I would keep a native button for a button action because it supplies focus,
      keyboard activation, and the button role. I would test keyboard activation
      and screen-reader output on the real control; I would use a link instead if
      the action actually navigates.
    distractors:
    - text: I would keep the Accessibility recommendation unchanged because changing
        position would look inconsistent.
      why_wrong: A defensible answer updates when relevant evidence changes an assumption
        or trade-off.
    - text: I would discard every earlier Accessibility claim as soon as one new observation
        appeared.
      why_wrong: New evidence may narrow one claim while leaving other verified facts
        intact.
  compression:
    prompt: Rephrase the accessibility decision as semantic element, interaction behavior,
      and an automated or manual check.
    goal: Compress the Accessibility answer into its decision, premise, trade-off,
      and verification step.
  best_answer: A button gets keyboard activation, focus order and the right role for
    free, whereas a div gets none of them. To make the div equivalent I would have
    to add a role, a tabindex and key handlers, and at that point I have reimplemented
    a button badly.
  distractors:
  - text: It is better for accessibility to use a button, since screen readers understand
      semantic elements better and it is generally recommended to use the correct
      HTML element for the job.
    trap: precision
    why_wrong: States the conclusion without naming a single behaviour that is lost,
      so it reads as received wisdom.
  - text: It does not really matter as long as you add an onClick handler, because
      the click behaviour is identical and you can always add an aria-label if a screen
      reader needs one.
    trap: content
    why_wrong: 'Factually wrong: a div is not focusable and does not respond to Enter
      or Space, so keyboard users cannot activate it at all.'
  - text: A button receives the activation for keyboard, the order of focus and the
      correct role for free, but a div does not receive nothing of this automatically.
    trap: grammar
    why_wrong: '"Order of focus" inverts the compound noun and "does not receive nothing"
      is a double negative.'
  feedback:
    register: Matter-of-fact rather than moralising; list the mechanics.
    hedging: None; these are concrete platform behaviours.
    precision: 'Name the three things you get free: focus, keyboard activation, role.'
    grammar: '"Keyboard activation", "focus order", and one negative per clause.'
    pragmatics: The reimplementation point wins the argument without lecturing.
  rephrase:
    prompt: Make the same case to a designer who prefers the div for styling reasons.
    goal: Practise advocacy across disciplines.
  language_focus:
  - precision
  - grammar
  - register
  pt_help: 'Dupla negativa nao existe em ingles padrao: "does not get any of this",
    nunca "does not get nothing".'
  feynman:
    concept: Semantic elements and free platform behaviour.
    explain_to: A designer who cares about visual consistency.
    constraint: Do not use the word "accessibility" at all.
    self_check: Did you name what a keyboard-only user cannot do?
    reasoning_check: Can you identify the hidden premise behind Accessibility, give
      a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You appealed to best practice, or claimed it does not matter.
    expected: Focus, keyboard activation and role, lost with a div.
    actual: Received wisdom, or a false equivalence with aria-label.
    root_cause: Accessibility learned as a checklist rather than as platform behaviour.
    repair: Try activating your own component with the keyboard only, once.
    reasoning_error: If your Accessibility answer failed, classify the mistake as
      a fact, assumption, comparison, failure, or certainty error before proposing
      the smallest repair.
  recall:
    active_recall_cue: Which three behaviours does a native button provide for free?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Accessibility without presenting
      an assumption as a fact?
    black_box_probe: When the Accessibility answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: react-05-accessibility-delayed-5
      prompt: The control opens a menu rather than navigating, and an accessibility
        test shows that the current div cannot receive focus or keyboard activation.
        What remains factual, and what would you change?
      changed_constraint: the menu trigger must support keyboard and screen-reader
        interaction while preserving its accessible name and expanded state
      new_evidence: a keyboard and screen-reader test shows the div cannot focus or
        activate and exposes no useful control role
      best_answer: >-
        I would replace the div with a named native button because this action opens a menu. I
        would expose its expanded state and menu relationship, move focus into the menu when
        it opens, and return focus to the trigger when it closes. I would test Enter and Space
        to open it, menu keyboard navigation, Escape, and the screen reader's announcement of
        the state.
      distractors:
      - text: I would preserve every part of the original Accessibility answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Accessibility explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: original
    path: english-arcade/react/accessibility-semantics
    note: Authored for this pack; corpus has no accessibility reference.
  extension:
    prompt: >-
      For a menu trigger, which name, expanded state, focus, and Escape behavior would I test
      before choosing a native button or custom widget?
    goal: Tie the semantic choice to observable interaction behavior, a user need,
      and a concrete accessibility check.
  critical_thinking:
    problem_frame: >-
      I would name the user action, its keyboard and focus contract, and the failure a
      noninteractive div creates; the unknown is whether the control opens a menu or performs
      a simple action.
    claim_map:
      fact: >-
        The prompt describes a clickable div with onClick; the delayed case adds a menu trigger
        that must work from keyboard and assistive technology.
      inference: >-
        I infer that a native button supplies the default action semantics, while a menu trigger
        also needs an expanded state, relationship, and focus behavior.
      assumption: >-
        I am assuming this control initiates an action or opens a menu rather than serving as a
        purely visual container; I would ask for its accessible name and state contract.
      unknown: >-
        I still need the menu focus order, Escape and outside-click behavior, screen-reader
        announcement, and supported browser or assistive-technology set.
    comparison:
      applicable: true
      alternatives:
      - option: use the native button or link that matches the action
        benefit: I get the platform's focus, keyboard behavior, and semantic role
          without rebuilding them.
        cost_or_risk: The native element may need styling or an explicit accessible
          name and state, which I must test in the real interaction.
        valid_when: Use a button for an action and a link for navigation.
      - option: make a div behave like a control with ARIA and key handlers
        benefit: It can preserve an existing visual wrapper when a valid native element
          cannot express the interaction.
        cost_or_risk: I must recreate focus, keyboard activation, role, name, and state;
          omissions leave keyboard or screen-reader users without the control.
        valid_when: Use it only when a semantic element cannot represent the actual
          widget and accessibility behavior is explicitly tested.
      decision_rule: Start with the native control that matches the action; keep a
        custom div only when a real widget requirement justifies it and tests cover
        focus, keyboard, name, and state.
    failure_probe:
      kind: edge_case
      prompt: If the control opens a menu rather than navigating, which keyboard,
        name, and expanded-state test would overturn a div-based implementation?
    evidence_check:
      basis: Check the Accessibility claim against original/english-arcade/react/accessibility-semantics
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: This React exercise can test reasoning about Accessibility, but
        it cannot prove an unmeasured production outcome, personal ownership, or universal
        rule.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        I am confident that a clickable div leaves keyboard and semantic behavior unspecified,
        but the correct focus pattern depends on whether the control opens a menu and what
        interaction contract it has.
      update_trigger: >-
        I would revise the implementation after keyboard and screen-reader tests reveal a
        missing name, state, or focus return; I would preserve the native button default unless
        the interaction contract requires a tested custom widget.
    rubric:
      facts_correct: >-
        Identifies the noninteractive div and the added menu-trigger requirement, then
        distinguishes the supplied behavior from the accessibility checks still needed.
      assumptions_explicit: >-
        States whether the control is an action or menu trigger and asks for its name, state,
        and focus contract.
      alternatives_considered: >-
        Compares a native button with a custom widget only when the menu behavior requires it,
        including the semantic and keyboard costs.
      tradeoff_quality: >-
        Connects native semantics to reliable keyboard behavior and names custom focus
        management as the cost of a richer menu interaction.
      follow_up_adaptation: >-
        For the menu scenario, adds expanded state, focus movement, and Escape or return
        behavior instead of stopping at replacing the div.
      certainty_calibration: >-
        Uses medium confidence for the native-button default and names keyboard, screen-reader,
        and focus tests as the evidence that could change it.
- id: react-06-memoisation
  version: 1.4.0
  target: react
  topic: Performance
  difficulty: 3
  interview_stage: deep_dive
  prompt: Would wrapping this component in memo help?
  context: The component re-renders often, but its props include an inline object
    created by the parent. The interviewer wants to see whether you understand why
    memo would silently do nothing here.
  follow_up:
    prompt: What evidence would show this component is expensive enough for memoisation,
      and which prop identity would still defeat it?
    goal: Answer the assumption challenge about Performance while keeping the evidence
      boundary explicit.
    challenge_kind: assumption
    best_answer: >-
      I would profile the component and confirm that its render work is expensive
      enough to matter. Because the parent creates a new object each render, I would
      either pass stable primitives or stabilise that object; I would keep memo only
      if the profile showed a useful skip.
    distractors:
    - text: I would repeat my original Performance answer with more confidence because
        the interviewer probably assumes the usual case.
      why_wrong: It hides the premise instead of checking whether the usual case is
        actually part of this problem.
    - text: I would stop proposing anything about Performance until every surrounding
        requirement had been documented in full.
      why_wrong: It treats uncertainty as a reason for paralysis and offers no bounded
        next step.
  compression:
    prompt: State the performance decision with a measured cost, a stable-prop condition,
      and the alternative if it is premature.
    goal: Compress the Performance answer into its decision, premise, trade-off, and
      verification step.
  best_answer: 'Not as written: the parent creates a new object every render, so the
    shallow comparison always fails. I would stabilise that prop or pass primitives,
    and profile before adding memo at all.'
  distractors:
  - text: Yes, memo prevents unnecessary re-renders when the props have not changed,
      so it would stop this component from re-rendering every time the parent updates.
    trap: content
    why_wrong: Misses that the props do change by reference every render, so memo
      adds cost and changes nothing.
  - text: It might help, it is hard to say without seeing more of the code and understanding
      how often the component actually re-renders in practice and what it is doing.
    trap: hedging
    why_wrong: The decisive detail, the inline object, is visible in the prompt, so
      the hedge signals you did not spot it.
  - text: Not like it is written, because the parent is creating a new object in each
      render, then the comparison shallow is failing always and the memo does not
      serve for nothing.
    trap: grammar
    why_wrong: Adjective order, adverb placement and "does not serve for nothing"
      are all transfer errors.
  feedback:
    register: Analytical. Point at the specific line that decides the answer.
    hedging: Do not hedge when the deciding evidence is in front of you.
    precision: Reference equality is the mechanism; name it explicitly.
    grammar: '"The shallow comparison always fails", "as written".'
    pragmatics: Adding the profile-first caveat shows discipline without deflecting.
  rephrase:
    prompt: Give the same answer assuming the prop were already stable.
    goal: Force the reasoning to adapt rather than repeat.
  language_focus:
  - precision
  - hedging
  - grammar
  feynman:
    concept: Reference equality in shallow prop comparison.
    explain_to: A developer who memoises everything by default.
    constraint: Explain using two identical letters in different envelopes.
    self_check: Did you identify what makes the comparison fail?
    reasoning_check: Can you identify the hidden premise behind Performance, give
      a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You said yes, or hedged despite visible evidence.
    expected: New object each render defeats shallow comparison.
    actual: A generic memo endorsement, or an unnecessary hedge.
    root_cause: Memoisation treated as a switch rather than as a comparison with preconditions.
    repair: Before memoising, check every prop for a fresh reference.
    reasoning_error: If your Performance answer failed, classify the mistake as a
      fact, assumption, comparison, failure, or certainty error before proposing the
      smallest repair.
  recall:
    active_recall_cue: What kind of prop silently defeats memo?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Performance without presenting
      an assumption as a fact?
    black_box_probe: When the Performance answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: react-06-memoisation-delayed-6
      prompt: A React DevTools profile shows the child render takes 0.3 ms, while
        data preparation takes 18 ms and the parent still passes a fresh object.
        Which part of the memo recommendation would you narrow?
      changed_constraint: memo must produce a measurable skip without hiding that data
        preparation dominates the update
      new_evidence: the profile attributes 18 ms to data preparation and 0.3 ms to
        the child render, while the object prop changes identity every render
      best_answer: >-
        I would investigate the 18 ms data preparation first because it dominates the 0.3 ms
        child render. I would inspect repeated calculations or an unnecessary data
        transformation and measure a focused change. Stabilising the prop is still required
        for memo to skip this child, but I would not add memo unless the resulting render
        saving justified its comparison and maintenance cost.
      distractors:
      - text: I would preserve every part of the original Performance answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Performance explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/09-backend-principles/cards/scaling-performance.md
    note: Measure-first performance discipline applied to the client.
  - repo: original
    path: english-arcade/react/memoisation
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: >-
      If the child costs 0.3ms and preparation costs 18ms, what prop or data-preparation trace
      would make memoisation worthwhile?
    goal: Make the memo decision conditional on render cost and prop stability rather
      than on a performance slogan.
  critical_thinking:
    problem_frame: >-
      I would separate the measured preparation cost from child render cost and inspect prop
      identity; the unknown is whether stable props can make memoisation help this screen.
    claim_map:
      fact: >-
        The scenario supplies a fresh inline object on each parent render; the delayed profile
        measures 18ms of data preparation and a 0.3ms child render.
      inference: >-
        I infer that the fresh object defeats shallow memoisation, while the larger preparation
        cost may deserve attention before optimising the child.
      assumption: >-
        I am assuming the profile represents the user-visible path and that the child receives
        no other changing prop; I would ask how often the parent renders.
      unknown: >-
        I still need parent update frequency, prop identity for every input, preparation
        ownership, and a target latency or interaction budget.
    comparison:
      applicable: true
      alternatives:
      - option: profile first and leave the component un-memoised
        benefit: I avoid memo overhead and keep the implementation simple when the
          render is cheap or another path dominates the trace.
        cost_or_risk: I may keep avoidable render work if a stable-prop child is both
          expensive and frequently re-rendered.
        valid_when: Use it when the profile does not show a meaningful child-render
          cost or the props are unstable.
      - option: stabilise props and memoise the expensive child
        benefit: I can skip repeated child work when the comparator sees unchanged props.
        cost_or_risk: I add comparison and prop-stability complexity, and it can mask
          the real bottleneck if the child is cheap.
        valid_when: Use it when profiling shows expensive child work and stable props
          make a skip measurable.
      decision_rule: Measure first; keep memo only when stable props and a useful skip
        are visible in the trace.
    failure_probe:
      kind: failure_mode
      prompt: If a profile shows the child render is cheap but data preparation is
        expensive, which memo claim would you retract and what would you measure next?
    evidence_check:
      basis: Check the Performance claim against system-design-estudos/areas/09-backend-principles/cards/scaling-performance.md
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: This React exercise can test reasoning about Performance, but it
        cannot prove an unmeasured production outcome, personal ownership, or universal
        rule.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        I am confident that a fresh object prevents a shallow memo boundary from skipping the
        child, but the profile does not yet prove that memoising the 0.3ms render is the
        highest-value change.
      update_trigger: >-
        I would change the optimisation after a profile ties repeated child renders to the
        interaction budget and a stable-prop test shows a meaningful skip; otherwise I would
        investigate the 18ms preparation first.
    rubric:
      facts_correct: >-
        Reports the fresh object and the separate 18ms preparation and 0.3ms child costs without
        turning them into a universal memoisation rule.
      assumptions_explicit: >-
        Names the profile-representativeness and changing-prop assumptions and asks how often
        the parent renders.
      alternatives_considered: >-
        Compares stabilising props, improving data preparation, and memoising the child
        according to the measured bottleneck.
      tradeoff_quality: >-
        Connects memoisation to skipped child work and names dependency complexity and an
        unchanged preparation cost as risks.
      follow_up_adaptation: >-
        When the profile gives a cheap child and expensive preparation, moves the recommendation
        toward the measured preparation path instead of claiming memo is automatically useful.
      certainty_calibration: >-
        Uses medium confidence and names a parent-render profile plus a stable-prop replay as
        evidence that would justify the optimisation.
- id: react-07-controlled-inputs
  version: 1.4.0
  target: react
  topic: Forms
  difficulty: 1
  interview_stage: technical_screen
  prompt: Would you make this input controlled or uncontrolled?
  context: A single search field inside a large form. The interviewer wants a decision
    with a reason, since both answers can be correct depending on what the component
    needs.
  follow_up:
    prompt: Which validation or focus behavior makes controlled state worth the extra
      renders here, and when would you keep the DOM as the source?
    goal: Answer the evidence challenge about Forms while keeping the evidence boundary
      explicit.
    challenge_kind: evidence
    best_answer: >-
      I would keep the input controlled because suggestions need each keystroke.
      I would keep the DOM as the source of truth when validation and value reads
      happen only on submit; I would check focus, validation timing, and render cost
      before choosing.
    distractors:
    - text: I would cite my experience with Forms as enough proof and move on without
        naming an observation.
      why_wrong: Experience can guide a hypothesis, but it does not replace evidence
        tied to this context.
    - text: I would collect every possible metric about Forms before making even a
        provisional recommendation.
      why_wrong: A focused decision can start with one discriminating observation
        rather than an unbounded data request.
  compression:
    prompt: Compare controlled and uncontrolled inputs by source of truth, validation
      timing, and integration cost.
    goal: Compress the Forms answer into its decision, premise, trade-off, and verification
      step.
  best_answer: Controlled, because I need to react to each keystroke for the suggestions.
    If I only needed the value on submit I would leave it uncontrolled and read it
    from the form, which avoids re-rendering the whole form on every character.
  distractors:
  - text: Controlled, because that is the standard React approach and it keeps the
      component state as the single source of truth for the value of the input at
      all times.
    trap: precision
    why_wrong: Correct choice, wrong reasoning. Convention is not a requirement, and
      the answer never mentions what the component needs.
  - text: Uncontrolled, because controlled inputs cause a re-render on every keystroke
      which is bad for performance, especially in a form with many fields like this
      one.
    trap: content
    why_wrong: Optimises away the behaviour the feature requires; suggestions cannot
      work without per-keystroke value.
  - text: Controlled, because I need to react in each keystroke for the suggestions,
      but if I needed the value only in the submit I would let it uncontrolled and
      read of the form.
    trap: grammar
    why_wrong: '"React in", "in the submit", "let it uncontrolled" and "read of" are
      four preposition errors.'
  feedback:
    register: Decisive with a requirement-based reason.
    hedging: None; the requirement decides it.
    precision: Tie the choice to the feature, not to convention.
    grammar: '"React to each keystroke", "on submit", "leave it uncontrolled".'
    pragmatics: Giving the counterfactual shows you know both patterns.
  rephrase:
    prompt: Answer again for a field that only matters when the form is submitted.
    goal: Practise applying the rule in the opposite direction.
  language_focus:
  - precision
  - grammar
  - pragmatics
  feynman:
    concept: Controlled versus uncontrolled inputs by requirement.
    explain_to: A developer who always picks controlled.
    constraint: Explain using a form filled in pencil versus read aloud.
    self_check: Did the feature requirement decide your answer?
    reasoning_check: Can you identify the hidden premise behind Forms, give a counterexample,
      and explain how the evidence changes your conclusion?
  black_box:
    symptom: You justified by convention or by performance alone.
    expected: Per-keystroke need decides controlled; submit-only decides uncontrolled.
    actual: An appeal to convention, or a performance-driven wrong choice.
    root_cause: Pattern choice driven by habit rather than by what the component must
      do.
    repair: Ask what the component needs to know, and when.
    reasoning_error: If your Forms answer failed, classify the mistake as a fact,
      assumption, comparison, failure, or certainty error before proposing the smallest
      repair.
  recall:
    active_recall_cue: What requirement forces a controlled input?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Forms without presenting
      an assumption as a fact?
    black_box_probe: When the Forms answer failed, did you locate the reasoning error
      before changing the implementation?
    delayed_variant:
      id: react-07-controlled-inputs-delayed-7
      prompt: The search field must validate on every keystroke, but the form now has
        two hundred fields. A profile shows the whole form rerenders on each keypress.
        Which alternative deserves consideration?
      changed_constraint: suggestions and validation need each keystroke while typing
        must remain responsive in a two-hundred-field form
      new_evidence: a profile shows the entire form rerenders for every search-field
        keystroke
      best_answer: >-
        I would keep the search field controlled because its suggestions and validation need
        each keystroke. I would move that state close to the search field so typing does not
        update all two hundred fields. Other fields could remain uncontrolled if they need
        only submit-time reads. I would profile typing again and verify that validation and
        keyboard focus still work.
      distractors:
      - text: I would preserve every part of the original Forms answer because changing
          it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Forms explanation with a new design without
          identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: interview/story-bank/02-react-react-native-story-bank.md
    note: React story bank covering component-level decisions.
  - repo: original
    path: english-arcade/react/controlled-inputs
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: >-
      With 200 fields and per-key suggestions, which state boundary, focus check, and
      validation metric would decide local control versus broader form state?
    goal: Defend the source-of-truth decision with user behavior, render cost, and
      a condition for switching.
  critical_thinking:
    problem_frame: >-
      I would identify which input needs per-keystroke feedback, which state must be
      submitted, and how 200 fields affect latency; the unknown is validation and focus
      timing.
    claim_map:
      fact: >-
        The prompt requires suggestions on each keystroke; the delayed profile reports 200
        fields rerendering on every keypress.
      inference: >-
        I infer that the search input needs a controlled local boundary, while unrelated form
        fields do not automatically need to rerender with it.
      assumption: >-
        I am assuming suggestions and validation must reflect each keystroke; I would ask
        whether submit-time fields need the same immediate source of truth.
      unknown: >-
        I still need the validation schedule, focus and composition behavior, form-library
        boundary, and measured input latency.
    comparison:
      applicable: true
      alternatives:
      - option: keep the input controlled and isolate its rerenders
        benefit: I can validate, suggest, and coordinate focus on every keystroke
          while limiting the work to the field or its immediate boundary.
        cost_or_risk: I pay for state updates and must profile the form so a controlled
          field does not rerender hundreds of unrelated inputs.
        valid_when: Use it when behavior depends on each keystroke, as with suggestions
          or immediate validation.
      - option: keep the DOM as the source of truth and read on submit
        benefit: It reduces state updates when the form only needs values at submission.
        cost_or_risk: I cannot drive per-keystroke suggestions or validation from React
          state without adding another synchronization path.
        valid_when: Use it when submit-time reads, native validation, and focus behavior
          are sufficient.
      decision_rule: Choose controlled state for per-keystroke behavior, then isolate
        its render boundary; choose uncontrolled input when submit-time reads are the
        actual requirement.
    failure_probe:
      kind: counterexample
      prompt: If suggestions need every keystroke but two hundred fields rerender each
        time, which boundary would you change and how would you test focus and validation?
    evidence_check:
      basis: Check the Forms claim against system-design-estudos/interview/story-bank/02-react-react-native-story-bank.md
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: This React exercise can test reasoning about Forms, but it cannot
        prove an unmeasured production outcome, personal ownership, or universal rule.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        I am confident that per-keystroke suggestions need current input state, but the
        200-field profile leaves the right form boundary and validation timing open.
      update_trigger: >-
        I would move state or defer work after an input-latency trace shows the local boundary
        is insufficient; I would verify IME, focus, validation, and submit behavior separately.
    rubric:
      facts_correct: >-
        Names the per-keystroke suggestion requirement and the 200-field rerender observation
        without assuming every field needs controlled state.
      assumptions_explicit: >-
        States the immediate-feedback assumption and asks which fields require current state
        before submit.
      alternatives_considered: >-
        Compares a locally controlled search boundary with broader controlled or uncontrolled
        form state using validation, focus, and latency requirements.
      tradeoff_quality: >-
        Connects local control to responsive suggestions and names duplicated state or form
        integration cost as the alternative risk.
      follow_up_adaptation: >-
        When the profile shows 200 fields rerendering, isolates the search state and changes the
        rendering boundary instead of abandoning controlled behavior.
      certainty_calibration: >-
        Uses medium confidence and names input-latency, focus, composition, and submit tests as
        evidence that would change the boundary.
- id: react-08-error-boundaries
  version: 1.4.0
  target: react
  topic: Error handling
  difficulty: 2
  interview_stage: architecture_review
  prompt: Where would you put error boundaries in this application?
  context: A dashboard composed of independent widgets. The interviewer wants a placement
    strategy tied to what the user should still be able to do when one part fails.
  follow_up:
    prompt: Which failures should this boundary contain, and how would you keep a
      broken child from hiding a recoverable route state?
    goal: Answer the alternative challenge about Error handling while keeping the
      evidence boundary explicit.
    challenge_kind: alternative
    best_answer: >-
      I would place a boundary around each independently recoverable widget and give
      it a retry or empty state. I would keep a root boundary as a last-resort
      fallback, then test that one broken widget leaves the other dashboard actions
      usable.
    distractors:
    - text: I would defend the first Error handling option because offering an alternative
        might make the decision look uncertain.
      why_wrong: A comparison makes the decision rule visible; it does not weaken
        a well-calibrated recommendation.
    - text: I would list every conceivable Error handling design without saying which
        requirement should decide between them.
      why_wrong: An option list without a decision rule avoids the trade-off the follow-up
        is testing.
  compression:
    prompt: Explain error-boundary placement as failure scope, fallback behavior,
      and a test that exercises the boundary.
    goal: Compress the Error handling answer into its decision, premise, trade-off,
      and verification step.
  best_answer: Around each widget rather than at the root, so one failing chart does
    not blank the whole dashboard. I would keep a root boundary as a last resort,
    but the useful granularity is wherever a failure should stay local to that region.
  distractors:
  - text: At the top level of the application, so that any error anywhere is caught
      in one place and the user sees a consistent error screen rather than a broken
      page.
    trap: content
    why_wrong: 'Maximises blast radius: one widget failure takes down every other
      widget the user could still have used.'
  - text: I would add them wherever errors are likely to happen, particularly around
      components that do data fetching or handle external input from third parties.
    trap: precision
    why_wrong: '"Where errors are likely" is unknowable in advance; placement should
      follow containment, not prediction.'
  - text: Around each widget instead of in the root, then one graphic that fails does
      not turn blank all the dashboard for the user that is using it.
    trap: grammar
    why_wrong: '"In the root", "turn blank all the dashboard" and the trailing relative
      clause are all non-idiomatic.'
  feedback:
    register: Design-level and user-focused.
    hedging: None; containment is a clear principle.
    precision: Blast radius is the criterion; say it in user terms.
    grammar: '"At the root", "blank the whole dashboard", "stay local".'
    pragmatics: Keeping a root boundary as a fallback shows completeness.
  rephrase:
    prompt: Explain your placement rule in terms of what the user can still do.
    goal: Convert an architectural rule into user outcomes.
  language_focus:
  - precision
  - grammar
  - pragmatics
  feynman:
    concept: Error boundary granularity and blast radius.
    explain_to: A product owner deciding what degraded mode looks like.
    constraint: Explain using circuit breakers in a house.
    self_check: Can you say what still works when one widget fails?
    reasoning_check: Can you identify the hidden premise behind Error handling, give
      a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You placed one boundary at the root, or guessed at risk.
    expected: Per-region boundaries sized by containment, root as fallback.
    actual: A single global handler, or prediction-based placement.
    root_cause: Error handling framed as catching rather than as limiting damage.
    repair: Ask what should survive the failure before deciding where to catch it.
    reasoning_error: If your Error handling answer failed, classify the mistake as
      a fact, assumption, comparison, failure, or certainty error before proposing
      the smallest repair.
  recall:
    active_recall_cue: What decides the granularity of an error boundary?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Error handling without presenting
      an assumption as a fact?
    black_box_probe: When the Error handling answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: react-08-error-boundaries-delayed-8
      prompt: A chart can fail locally, but an expired auth token now needs a shared
        redirect. A test shows the local widget boundary hides that route-level error.
        How would you revise the placement rule?
      changed_constraint: chart failures should stay local while token expiry needs
        shared recovery state and a route-level redirect
      new_evidence: a local boundary masks the auth failure and prevents the route
        recovery path from running
      best_answer: >-
        I would retain a local boundary for a chart's render failure and handle expired
        authentication in the shared route or session layer so it can redirect. I would not
        let a widget's generic fallback consume that authentication outcome. I would test
        chart failure and token expiry separately; asynchronous request failures also need
        explicit handling because a render error boundary does not catch every rejected
        request.
      distractors:
      - text: I would preserve every part of the original Error handling answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Error handling explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/09-backend-principles/cards/error-handling-fault-tolerance.md
    note: Fault tolerance and blast radius principles.
  - repo: original
    path: english-arcade/react/error-boundaries
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: >-
      If a chart throws during render and token expiry arrives from an async request, which
      boundary handles each and what sibling or recovery test proves it?
    goal: Connect error-boundary placement to recovery scope, user capability, and a
      failure test.
  critical_thinking:
    problem_frame: >-
      I would map a local widget failure separately from an expired-session redirect; the
      unknown is where each error is surfaced and what the user can still do.
    claim_map:
      fact: >-
        The dashboard has independent widgets; the scenario distinguishes a chart render failure
        from an expired-auth redirect, and the delayed case warns that a local boundary can mask
        auth.
      inference: >-
        I infer that a chart boundary can preserve the rest of the dashboard, while session
        failures need a shared route or session recovery path.
      assumption: >-
        I am assuming auth failure reaches the route or session layer before a generic widget
        fallback; I would ask how async request errors are surfaced.
      unknown: >-
        I still need the error transport, recovery action, sibling behavior, and whether the
        failure happens during render or asynchronously.
    comparison:
      applicable: true
      alternatives:
      - option: place a boundary around each independently recoverable widget
        benefit: A broken chart can show a retry or empty state while sibling dashboard
          actions remain usable.
        cost_or_risk: A local fallback cannot coordinate recovery that needs shared auth,
          route, or session state.
        valid_when: Use it when the widget owns an isolated failure and recovery path.
      - option: place a wider route or root boundary for shared recovery
        benefit: It can redirect or restore shared state when a route-level failure
          affects several widgets.
        cost_or_risk: It increases the blast radius and can blank healthy widgets if I
          use it for every failure.
        valid_when: Use it when recovery must coordinate the route or a shared session.
      decision_rule: Keep widget failures local and widen the boundary only when the
        failure or recovery state is shared; test both the broken widget and a sibling
        action.
    failure_probe:
      kind: edge_case
      prompt: If token expiry needs a shared redirect while a chart can fail locally,
        which boundary should contain each failure and what recovery test proves it?
    evidence_check:
      basis: Check the Error handling claim against system-design-estudos/areas/09-backend-principles/cards/error-handling-fault-tolerance.md
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: This React exercise can test reasoning about Error handling, but
        it cannot prove an unmeasured production outcome, personal ownership, or universal
        rule.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        I am confident that local and shared failures need different recovery scopes, but the
        async error path and authentication ownership determine where the boundary can act.
      update_trigger: >-
        I would move the boundary after a failure trace shows an auth error being swallowed
        locally or an async rejection bypassing it; I would test chart recovery and session
        recovery as separate paths.
    rubric:
      facts_correct: >-
        Distinguishes an independent chart render failure from expired authentication and keeps
        async error handling as an open implementation fact.
      assumptions_explicit: >-
        States where auth is expected to surface and asks whether the failure occurs during
        render or in an async request.
      alternatives_considered: >-
        Compares a widget-local fallback with a route or session boundary according to recovery
        scope and sibling availability.
      tradeoff_quality: >-
        Connects local isolation to continued dashboard use and names a swallowed auth redirect
        or inconsistent recovery as the wider-boundary risk.
      follow_up_adaptation: >-
        When the local boundary masks auth, preserves the chart fallback but routes session
        recovery through the shared auth owner.
      certainty_calibration: >-
        Uses medium confidence and names an error trace plus chart and session recovery tests as
        evidence that would change placement.
- id: react-09-list-virtualisation
  version: 1.4.0
  target: react
  topic: Rendering large lists
  difficulty: 3
  interview_stage: deep_dive
  prompt: The table slows down at ten thousand rows. What would you do?
  context: A performance question with an obvious answer and a less obvious cost.
    The interviewer wants both the technique and what it breaks.
  follow_up:
    prompt: What would you measure before virtualising, and how would keyboard focus
      behave when rows enter and leave the viewport?
    goal: Answer the failure challenge about Rendering large lists while keeping the
      evidence boundary explicit.
    challenge_kind: failure
    best_answer: >-
      I would measure render and interaction cost before virtualising, then check
      focus as rows mount and unmount. I would preserve a non-virtualised or paginated
      path when printing, browser find, or full text selection is a requirement.
    distractors:
    - text: I would describe the Rendering large lists failure as impossible because
        the happy path already passed its test.
      why_wrong: Passing a happy path does not test the boundary, failure mode, or
        recovery being challenged.
    - text: I would add retries to Rendering large lists immediately and assume the
        system would become reliable.
      why_wrong: Retries can amplify load or duplicate effects; the failure and containment
        policy must be specified first.
  compression:
    prompt: Summarize large-list performance as measurement, rendering strategy, and
      preserved interaction semantics.
    goal: Compress the Rendering large lists answer into its decision, premise, trade-off,
      and verification step.
  best_answer: I would virtualise so only the visible rows are in the DOM. The cost
    is that browser find, text selection across the whole table and print all stop
    working normally, so I would confirm with the product side that none of those
    matter before committing to it.
  distractors:
  - text: I would virtualise the list so that only the rows currently visible in the
      viewport are rendered, which keeps the DOM small and the scrolling smooth even
      with very large datasets.
    trap: precision
    why_wrong: Correct technique with no mention of what it costs, which is the half
      the question was actually probing.
  - text: I would add pagination instead, since ten thousand rows is not something
      a user can meaningfully scan anyway and smaller pages are easier to render quickly.
    trap: pragmatics
    why_wrong: A legitimate product suggestion, but it changes the requirement rather
      than answering the engineering question.
  - text: I would virtualise for only the rows visible stay in the DOM, but the cost
      is that the search of the browser and the selection of text stop of working
      normally.
    trap: grammar
    why_wrong: '"For only... stay", "the search of the browser" and "stop of working"
      are three structural errors.'
  feedback:
    register: Balanced. Naming the cost is what makes the recommendation credible.
    hedging: None on the technique; verify the constraints with the product side.
    precision: Browser find and print are the costs candidates almost never mention.
    grammar: '"Only the visible rows", "browser find", "stop working".'
    pragmatics: Checking product tolerance before committing is the senior move.
  rephrase:
    prompt: Answer again for a table users are required to print.
    goal: Test whether the trade-off is understood or recited.
  language_focus:
  - precision
  - grammar
  - pragmatics
  feynman:
    concept: Virtualisation and what leaves the DOM with it.
    explain_to: A user who relies on browser find in the table.
    constraint: Explain using a window onto a long scroll of paper.
    self_check: Did you name a capability the user loses?
    reasoning_check: Can you identify the hidden premise behind Rendering large lists,
      give a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You gave the technique without its cost.
    expected: Virtualise, plus loss of find, selection and print.
    actual: A clean recommendation with no trade-off, or a scope change.
    root_cause: Techniques learned as solutions rather than as exchanges.
    repair: For every optimisation, name what stops working.
    reasoning_error: If your Rendering large lists answer failed, classify the mistake
      as a fact, assumption, comparison, failure, or certainty error before proposing
      the smallest repair.
  recall:
    active_recall_cue: What browser capabilities does virtualisation break?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Rendering large lists without
      presenting an assumption as a fact?
    black_box_probe: When the Rendering large lists answer failed, did you locate
      the reasoning error before changing the implementation?
    delayed_variant:
      id: react-09-list-virtualisation-delayed-9
      prompt: Virtualisation improves scroll time, but keyboard focus is lost when
        the focused row unmounts and print output omits off-screen rows. Which part of
        your list-performance recommendation survives?
      changed_constraint: users must keyboard-navigate and print the full table while
        the list still needs a measured rendering improvement
      new_evidence: a keyboard test loses focus on row unmount and print output omits
        rows outside the viewport
      best_answer: >-
        I would keep the measured scrolling improvement as evidence, but treat lost focus and
        incomplete printing as unmet requirements. I would preserve the focused row or manage
        focus as rows unmount, and provide a print view containing the full data. If that
        interaction cost is too high, I would use pagination with a separate complete print or
        export path, then test both keyboard navigation and output completeness.
      distractors:
      - text: I would preserve every part of the original Rendering large lists answer
          because changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Rendering large lists explanation with a
          new design without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: original
    path: english-arcade/react/list-virtualisation
    note: Authored for this pack; corpus has no client rendering card.
  extension:
    prompt: >-
      If virtualisation fixes scroll but omits off-screen print rows, which focus or print
      requirement would make pagination safer?
    goal: Defend the performance benefit alongside focus, find, selection, print, and
      a product condition.
  critical_thinking:
    problem_frame: >-
      I would weigh the measured cost of 10,000 mounted rows against focus, find, selection,
      and printing; the unknown is which interactions are contractual.
    claim_map:
      fact: >-
        The table contains 10,000 rows; the delayed evidence says virtualisation improves
        mounted work but loses keyboard focus and omits rows from print output.
      inference: >-
        I infer that virtualisation is justified only if its measured speed gain survives the
        required interaction checks or the product provides a separate full-content path.
      assumption: >-
        I am assuming the render cost comes from mounted rows and that focus and print are real
        user requirements; I would ask whether export can replace browser printing.
      unknown: >-
        I still need the row-height and focus model, browser-find and selection requirements,
        print or export contract, and measured latency target.
    comparison:
      applicable: true
      alternatives:
      - option: virtualise the visible rows
        benefit: I reduce DOM and render work for a table whose measured cost comes
          from keeping thousands of rows mounted.
        cost_or_risk: Focus, browser find, full selection, and printing can break when
          off-screen rows are not mounted.
        valid_when: Use it when the measured render cost matters and the product can
          preserve or replace those interactions.
      - option: paginate or keep the full table mounted
        benefit: I preserve keyboard focus, find, selection, and print semantics with
          a simpler rendering model.
        cost_or_risk: I may retain too much render work or add page navigation that
          changes how users inspect the dataset.
        valid_when: Use it when those interactions are required or virtualisation fails
          their tests.
      decision_rule: Measure the render and interaction costs first; virtualise only
        when the speed gain survives focus and print tests, otherwise paginate or keep
        the required rows available.
    failure_probe:
      kind: failure_mode
      prompt: If virtualisation loses keyboard focus and omits rows from print output,
        which interaction requirement would make pagination the safer choice?
    evidence_check:
      basis: Check the Rendering large lists claim against original/english-arcade/react/list-virtualisation
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: This React exercise can test reasoning about Rendering large lists,
        but it cannot prove an unmeasured production outcome, personal ownership,
        or universal rule.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        I am confident that many mounted rows can create measurable render work, but the table
        should be virtualised only after its focus, find, selection, and print contract is
        explicit.
      update_trigger: >-
        I would choose pagination or a full-content print path after an interaction test fails;
        I would compare the measured scroll gain with the cost of preserving those behaviors.
    rubric:
      facts_correct: >-
        Names the 10,000-row scale and the delayed focus and print failures without claiming
        that virtualisation always wins.
      assumptions_explicit: >-
        States the mounted-row cost and interaction requirements that still need confirmation,
        including whether export can replace print.
      alternatives_considered: >-
        Compares virtualisation, pagination, and a full-content export or print path against
        both render cost and interaction fidelity.
      tradeoff_quality: >-
        Connects virtualisation to mounted-work reduction and names focus, find, selection, and
        print preservation as concrete costs.
      follow_up_adaptation: >-
        When focus and print fail, changes the recommendation toward pagination or a separate
        full-content path and names the required interaction test.
      certainty_calibration: >-
        Uses medium confidence and names profiling plus focus, find, selection, and print tests
        as evidence that would update the choice.
- id: react-10-code-review-tone
  version: 1.4.0
  target: react
  topic: Component architecture and behaviour-focused testing
  difficulty: 2
  interview_stage: behavioural_probe
  prompt: Describe how you would raise a design concern on a colleague's pull request
    when one component owns state, fetching, and rendering.
  context: A collaboration probe. The interviewer wants to hear whether your written
    English can carry a disagreement without friction while checking that the component
    boundary is testable through user-observable behaviour.
  follow_up:
    prompt: How would you separate the architectural concern from personal style,
      and what behavior-focused test would support the review comment?
    goal: Answer the new_evidence challenge about Component architecture and behaviour-focused
      testing while keeping the evidence boundary explicit.
    challenge_kind: new_evidence
    best_answer: >-
      I would describe the coupling I observed, ask which behavior the component owns,
      and propose a loading, success, and failure test. I would separate that behavior
      contract from my preference about component size and let the colleague choose an
      incremental extraction.
    distractors:
    - text: I would keep the Component architecture and behaviour-focused testing
        recommendation unchanged because changing position would look inconsistent.
      why_wrong: A defensible answer updates when relevant evidence changes an assumption
        or trade-off.
    - text: I would discard every earlier Component architecture and behaviour-focused
        testing claim as soon as one new observation appeared.
      why_wrong: New evidence may narrow one claim while leaving other verified facts
        intact.
  compression:
    prompt: 'Give the review comment in three parts: observed coupling, user or test
      impact, and an incremental suggestion.'
    goal: Compress the Component architecture and behaviour-focused testing answer
      into its decision, premise, trade-off, and verification step.
  best_answer: 'I would ask about the boundary before prescribing a refactor: what
    user behaviour belongs here, and what can be passed in or extracted? I would suggest
    a focused test for visible loading, success, and failure states, because that
    protects the contract while internal composition can change.'
  distractors:
  - text: I would point out clearly what is wrong with the approach and suggest the
      correct alternative, since being direct saves everyone time and avoids ambiguity
      in the review. I would describe the state, fetching, and rendering code as too
      large, then recommend splitting it before adding any tests for the new structure.
    trap: register
    why_wrong: Directness without a question presumes you have the full context, which
      is often false in review.
  - text: I would probably not say anything if it is a minor thing, since it is not
      worth creating friction over small details and the code works well enough as
      it is.
    trap: pragmatics
    why_wrong: Avoidance is the opposite failure and lets known problems ship silently.
  - text: I would ask about the constraint before to propose something, like what
      happens if the parent makes re-render here, instead of saying that this is wrong.
    trap: grammar
    why_wrong: '"Before to propose" and "makes re-render" are infinitive and light-verb
      errors common in Portuguese speakers.'
  feedback:
    register: Keep the review collaborative while discussing a component boundary
      in observable terms.
    hedging: Ask “could this boundary own…” before prescribing extraction.
    precision: Name loading, success, and failure behaviour instead of the hook or
      internal state shape.
    grammar: Use “what belongs here?” and “what can be passed in or extracted?”
    pragmatics: A behaviour-focused test lets the colleague change composition without
      losing the contract.
  rephrase:
    prompt: Write a comment that asks about the boundary and proposes a loading/success/failure
      test after a colleague has pushed back.
    goal: Escalate with a user contract rather than an implementation preference.
  language_focus:
  - register
  - grammar
  - pragmatics
  pt_help: 'Depois de "before" use gerundio: "before proposing". "Before to" nao existe.'
  feynman:
    concept: Using a review question to discover a component boundary and protect
      behaviour with tests.
    explain_to: An engineer splitting a stateful fetch component.
    constraint: Include one visible state and avoid naming a preferred hook.
    self_check: Would the test still pass after internal composition changes?
    reasoning_check: Can you identify the hidden premise behind Component architecture
      and behaviour-focused testing, give a counterexample, and explain how the evidence
      changes your conclusion?
  black_box:
    symptom: A review demands a refactor without saying what users must still observe.
    expected: A question identifies the boundary and a test covers loading, success,
      and failure.
    actual: The comment debates component size or stays silent to avoid friction.
    root_cause: Architecture is discussed as taste instead of a behaviour contract.
    repair: Ask what behaviour belongs here, then propose the smallest visible-state
      test.
    reasoning_error: If your Component architecture and behaviour-focused testing
      answer failed, classify the mistake as a fact, assumption, comparison, failure,
      or certainty error before proposing the smallest repair.
  recall:
    active_recall_cue: Which user-visible states should a boundary review protect
      while internals remain free to change?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Component architecture and
      behaviour-focused testing without presenting an assumption as a fact?
    black_box_probe: When the Component architecture and behaviour-focused testing
      answer failed, did you locate the reasoning error before changing the implementation?
    delayed_variant:
      id: react-10-code-review-tone-delayed-10
      prompt: A proposed extraction would serve a second caller with a different
        loading and failure state, while the existing behavior test covers only the
        original caller. What would you defend and verify before extracting?
      changed_constraint: two callers must keep distinct loading and failure behavior
        while sharing the underlying component capability
      new_evidence: a second caller needs a different fallback and the current test
        does not exercise that caller
      best_answer: >-
        I would retain the original caller's behavior test and add coverage for the second
        caller's different loading and failure states before extracting. I would share only
        the behavior they actually have in common and keep caller-specific state handling
        explicit. If the extraction needs unrelated flags for each caller, I would reconsider
        its boundary rather than force reuse.
      distractors:
      - text: I would preserve every part of the original Component architecture and
          behaviour-focused testing answer because changing it after review would
          be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Component architecture and behaviour-focused
          testing explanation with a new design without identifying what the evidence
          actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/09-backend-principles/cards/testing-code-quality.md
    note: Code quality collaboration practices.
  - repo: original
    path: english-arcade/react/code-review-tone
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: >-
      If a second caller has a different loading and failure UI, which shared behavior can I
      extract and what two-caller test must pass?
    goal: Make the review specific, collaborative, and verifiable without dictating an
      internal component shape.
  critical_thinking:
    problem_frame: >-
      I would review observable loading, success, and failure behavior across callers; the
      unknown is whether the second caller shares a contract or only resembles the first.
    claim_map:
      fact: >-
        One component currently owns state, fetch, and render; the delayed scenario gives a
        second caller with different loading and failure behavior.
      inference: >-
        I infer that the useful review target is a behavior contract and its tests, not a
        preferred component shape.
      assumption: >-
        I am assuming both callers share enough capability to discuss an extraction; I would ask
        which states and recovery actions must remain caller-specific.
      unknown: >-
        I still need the exact loading, success, and failure differences, ownership of the
        fetch, and the user-visible behavior each caller promises.
    comparison:
      applicable: true
      alternatives:
      - option: extract a capability behind a behavior contract and focused test
        benefit: I can reduce coupling while preserving loading, success, and failure
          behavior for each caller.
        cost_or_risk: I add an interface and must verify that the extraction does not
          hide caller-specific states or duplicate behavior.
        valid_when: Use it when two callers share a clear capability and the contract
          can be tested through user-visible states.
      - option: keep the component boundary and improve its internal separation
        benefit: I avoid an abstraction whose shared contract is still unclear and can
          make the existing states explicit first.
        cost_or_risk: A large owner may keep coupling and make future changes harder if
          the same capability continues to spread.
        valid_when: Use it when there is one caller or the proposed extraction is still
          driven by style rather than behavior.
      decision_rule: Tie the review to caller-visible behavior and tests; extract when
        the shared capability is clear, otherwise clarify the boundary before prescribing
        a structural refactor.
    failure_probe:
      kind: counterexample
      prompt: If a second caller needs a different loading and failure state, which
        behavior contract would disprove the proposed extraction, and what test would
        you request?
    evidence_check:
      basis: Check the Component architecture and behaviour-focused testing claim
        against system-design-estudos/areas/09-backend-principles/cards/testing-code-quality.md
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: This React exercise can test reasoning about Component architecture
        and behaviour-focused testing, but it cannot prove an unmeasured production
        outcome, personal ownership, or universal rule.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        I am confident that a review should distinguish behavior from style, but the second
        caller’s state contract determines whether extraction reduces coupling or hides
        differences.
      update_trigger: >-
        I would narrow or abandon the extraction after a caller-specific test shows incompatible
        loading or failure behavior; I would preserve the shared capability only behind an
        explicit contract.
    rubric:
      facts_correct: >-
        States who owns state, fetch, and render and includes the second caller’s different
        loading or failure behavior without inventing a defect.
      assumptions_explicit: >-
        Names the shared-capability assumption and asks which states or recovery actions must
        remain caller-specific.
      alternatives_considered: >-
        Compares a behavior-contract extraction with clarifying the existing component boundary
        when the callers do not yet share enough behavior.
      tradeoff_quality: >-
        Connects extraction to reduced coupling and names hidden caller-specific states and
        interface cost as risks.
      follow_up_adaptation: >-
        When the second caller differs, changes the extraction claim or contract and requests a
        two-caller behavior test instead of repeating a style preference.
      certainty_calibration: >-
        Uses medium confidence and names caller-specific loading and failure tests as evidence
        that would update the review.
- id: react-11-hydration
  version: 1.4.0
  target: react
  topic: Server rendering
  difficulty: 3
  interview_stage: deep_dive
  prompt: What causes a hydration mismatch, in your experience?
  context: A server-rendering question. The interviewer wants a concrete reproducible
    cause, since the generic answer is easy to recite and tells them nothing.
  follow_up:
    prompt: Which value differs between server and client, and how would you make
      the initial render deterministic without hiding a real data bug?
    goal: Answer the assumption challenge about Server rendering while keeping the
      evidence boundary explicit.
    challenge_kind: assumption
    best_answer: >-
      I would identify the differing value, make the first render use the same
      serialised input on both sides, and move browser-only work behind a client
      boundary or effect. I would verify the server markup and client inputs match
      before hiding a real data mismatch.
    distractors:
    - text: I would repeat my original Server rendering answer with more confidence
        because the interviewer probably assumes the usual case.
      why_wrong: It hides the premise instead of checking whether the usual case is
        actually part of this problem.
    - text: I would stop proposing anything about Server rendering until every surrounding
        requirement had been documented in full.
      why_wrong: It treats uncertainty as a reason for paralysis and offers no bounded
        next step.
  compression:
    prompt: Describe hydration debugging as mismatch evidence, deterministic input,
      and the boundary for client-only work.
    goal: Compress the Server rendering answer into its decision, premise, trade-off,
      and verification step.
  best_answer: >-
    I would look first for a value that differs between server and client at render
    time, such as a date formatted in local time. I would make the initial input
    deterministic or defer client-only work, then verify the mismatch with the server
    HTML and client render rather than claim a personal production example.
  distractors:
  - text: It happens when the HTML rendered on the server does not match what React
      renders on the client, so React has to discard the server markup and re-render
      everything.
    trap: precision
    why_wrong: Defines the term rather than naming a cause, which is what the question
      asked for.
  - text: It is usually caused by using browser APIs like window or localStorage during
      the initial render, since those are not available on the server and cause errors.
    trap: content
    why_wrong: Those typically throw rather than mismatch; conflating the two shows
      the answer is theoretical.
  - text: Normally is something that differs between the server and the client in
      the moment of render, like the dates formatted in local time because the timezones
      are differents.
    trap: grammar
    why_wrong: Missing subject, "in the moment of" and the pluralised adjective "differents"
      are all transfer errors.
  feedback:
    register: Experiential. "The one I hit most" is worth more than a definition.
    hedging: '"Usually" is appropriate for a class of causes.'
    precision: The timezone example is specific enough to be verified.
    grammar: 'Always include the subject: "it is usually"; adjectives never pluralise.'
    pragmatics: Answering "in your experience" with an actual experience matters.
  rephrase:
    prompt: Give a second cause you have seen, in one sentence.
    goal: Prove the first answer was not the only one you had.
  language_focus:
  - precision
  - grammar
  - register
  pt_help: 'Adjetivos em ingles nao tem plural: "different", nunca "differents".'
  feynman:
    concept: Server and client render divergence.
    explain_to: A developer new to server rendering.
    constraint: Explain using two people drawing from the same description.
    self_check: Did you name a cause you could reproduce?
    reasoning_check: Can you identify the hidden premise behind Server rendering,
      give a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You defined the term or named an error that is not a mismatch.
    expected: A concrete divergence such as locale-dependent formatting.
    actual: A restatement of the definition, or a browser-API error.
    root_cause: Answering from documentation rather than from debugging experience.
    repair: Keep one real reproduction per concept you claim experience with.
    reasoning_error: If your Server rendering answer failed, classify the mistake
      as a fact, assumption, comparison, failure, or certainty error before proposing
      the smallest repair.
  recall:
    active_recall_cue: Which everyday formatting choice reliably causes mismatches?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Server rendering without
      presenting an assumption as a fact?
    black_box_probe: When the Server rendering answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: react-11-hydration-delayed-11
      prompt: The server formats a date with en-US, while the browser uses the user's
        locale; passing the request locale through serialized data removes the mismatch.
        How would you update the hydration decision rule?
      changed_constraint: the first render must use a request-derived locale so server
        markup and client input agree
      new_evidence: a reproduction shows different locale formatting in server HTML
        and the first client render, and the serialized locale removes it
      best_answer: >-
        I would pass the request locale through the serialized data and use it for both the
        server render and the browser's first render. The reproduction already shows that this
        removes the mismatch. I would test more than one locale with the same date input and
        formatting options, preserving the deterministic first-render rule without hiding a
        remaining mismatch or claiming an unrelated performance improvement.
      distractors:
      - text: I would preserve every part of the original Server rendering answer
          because changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Server rendering explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: original
    path: english-arcade/react/hydration-mismatch
    note: Authored for this pack; corpus has no server-rendering card.
  extension:
    prompt: >-
      For a locale mismatch, which serialised input and server/client snapshot would
      distinguish a data mismatch from a browser-only branch?
    goal: Explain hydration as an input-consistency problem with a reproducible check
      and a safe client-only boundary.
  critical_thinking:
    problem_frame: >-
      I would find the value that differs in the server and first client render and make that
      input deterministic; the unknown is whether the mismatch is data formatting or a
      browser-only branch.
    claim_map:
      fact: >-
        The scenario gives an en-US server locale and a user browser locale for the same date;
        the delayed evidence says serialising the request locale removes the mismatch.
      inference: >-
        I infer that hydration requires compatible first-render inputs, so I should serialise a
        shared locale or defer a genuinely browser-only value rather than claim a performance
        fix.
      assumption: >-
        I am assuming the date is rendered in the initial tree and that the request locale is
        available and trustworthy; I would ask about timezone and fallback behavior.
      unknown: >-
        I still need the timezone, locale fallback, other browser-only branches, and evidence
        that the mismatch reproduces on both server and client snapshots.
    comparison:
      applicable: false
      rejected_alternative: The hydration prompt asks me to identify a mismatch cause;
        it does not establish that deterministic serialization and client-only deferral
        satisfy the same initial-render contract.
      hard_constraint: The first server and client render must receive compatible inputs;
        the missing cause determines whether I serialize a value or defer a branch.
      decision_rule: Diagnose the differing input first; choose deterministic data for
        shared content and defer only a branch that truly depends on the browser.
    failure_probe:
      kind: edge_case
      prompt: If the server and browser format the same date with different locales,
        what input would you serialize and what server/client evidence would you compare?
    evidence_check:
      basis: Check the Server rendering claim against original/english-arcade/react/hydration-mismatch
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: This React exercise can test reasoning about Server rendering, but
        it cannot prove an unmeasured production outcome, personal ownership, or universal
        rule.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        I am confident that different first-render date inputs can cause a hydration mismatch,
        but the correct repair depends on whether the cause is locale data or a browser-only
        branch.
      update_trigger: >-
        I would change the repair after a server/client snapshot or locale test identifies
        another differing input; I would keep the first render deterministic and defer only the
        branch proven to need the browser.
    rubric:
      facts_correct: >-
        Names the server and browser locale difference and the serialised-locale observation
        without claiming an unrelated performance improvement.
      assumptions_explicit: >-
        States that the date is part of the first render and asks for timezone, locale fallback,
        and browser-only branches.
      alternatives_considered: >-
        Compares serialising a deterministic shared input with deferring a truly browser-only
        branch, based on the mismatch evidence.
      tradeoff_quality: >-
        Connects deterministic first-render data to hydration correctness and names delayed
        content or fallback complexity as the cost of a client-only branch.
      follow_up_adaptation: >-
        When the locale mismatch is reproduced, serialises the request locale and tests both
        server and client snapshots instead of broadening the claim.
      certainty_calibration: >-
        Uses medium confidence and names locale, timezone, and server/client snapshot tests as
        evidence that would update the repair.
- id: react-12-scope-negotiation
  version: 1.4.0
  target: react
  topic: Estimation
  difficulty: 2
  interview_stage: behavioural_probe
  prompt: How long would this component take you to build?
  context: A deceptively simple question. The interviewer is assessing whether you
    can estimate in English without either padding vaguely or committing to a number
    you cannot defend.
  follow_up:
    prompt: What assumptions make that estimate reliable, and what smaller milestone
      could you offer if the requirements remain uncertain?
    goal: Answer the evidence challenge about Estimation while keeping the evidence
      boundary explicit.
    challenge_kind: evidence
    best_answer: >-
      I would state the assumptions behind the estimate: design completeness, data
      shape, validation, and integration boundaries. If those remain uncertain, I
      would offer a small checkpoint that proves the riskiest state before committing
      to the full date.
    distractors:
    - text: I would cite my experience with Estimation as enough proof and move on
        without naming an observation.
      why_wrong: Experience can guide a hypothesis, but it does not replace evidence
        tied to this context.
    - text: I would collect every possible metric about Estimation before making even
        a provisional recommendation.
      why_wrong: A focused decision can start with one discriminating observation
        rather than an unbounded data request.
  compression:
    prompt: Compress the estimate into scope, assumptions, risks, and a next checkpoint
      rather than one unsupported number.
    goal: Compress the Estimation answer into its decision, premise, trade-off, and
      verification step.
  best_answer: >-
    I would estimate a day for the happy path and probably another day for states
    missing from the design, such as empty, loading, and error. If those states are
    already specified, I would call it closer to a day and a half. I would ask which
    states and integration constraints are already defined.
  distractors:
  - text: It is quite hard to say without knowing more about the requirements, since
      it really depends on a lot of factors like the design and the data and the edge
      cases involved.
    trap: hedging
    why_wrong: Refuses to estimate at all, which reads as inability rather than as
      rigour.
  - text: About two days. That should be enough time to build it properly and handle
      everything that might come up during the implementation of the component.
    trap: precision
    why_wrong: A number with no breakdown cannot be negotiated, defended or revised
      when scope changes.
  - text: One day for the happy path and probably more one for the states that are
      not yet in the design, like empty, loading and of error.
    trap: grammar
    why_wrong: '"More one" inverts "another one" and "of error" adds a Portuguese
      preposition.'
  feedback:
    register: Confident and collaborative; end by returning a question.
    hedging: Hedge the unknown scope, not the estimate itself.
    precision: Break the number into parts so it can be negotiated.
    grammar: '"Another day", "empty, loading and error states".'
    pragmatics: Closing with a question converts an estimate into a scoping conversation.
  rephrase:
    prompt: Give the same estimate to someone who wants a single number.
    goal: Hold the breakdown while satisfying the request.
  language_focus:
  - hedging
  - grammar
  - pragmatics
  feynman:
    concept: Estimation as decomposition plus assumptions.
    explain_to: A manager who wants one number for a roadmap.
    constraint: Explain using a builder quoting for a room.
    self_check: Could someone negotiate scope from your answer?
    reasoning_check: Can you identify the hidden premise behind Estimation, give a
      counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You refused to estimate, or gave a bare number.
    expected: A split estimate with the unknown named, ending in a question.
    actual: A bare "it depends", or an undefended figure.
    root_cause: Treating estimates as commitments rather than as conditional models.
    repair: 'Always estimate in two parts: known work and unspecified states.'
    reasoning_error: If your Estimation answer failed, classify the mistake as a fact,
      assumption, comparison, failure, or certainty error before proposing the smallest
      repair.
  recall:
    active_recall_cue: What makes an estimate negotiable rather than binding?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Estimation without presenting
      an assumption as a fact?
    black_box_probe: When the Estimation answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: react-12-scope-negotiation-delayed-12
      prompt: The design now includes empty, loading, and error states, while a code
        inspection finds authentication and analytics integration absent from the
        design. Which part of your estimate is no longer safe?
      changed_constraint: the estimate must include three UI states and unknown auth
        and analytics integration work
      new_evidence: the existing component has auth and analytics integration points
        that the design does not specify
      best_answer: >-
        I would retain the now-specified UI states but withdraw the earlier time estimate
        until I understand authentication and analytics integration. I would identify the
        existing contracts, verify one authenticated request and one required analytics event,
        then update the range and dependencies. If those integrations cannot fit the deadline,
        I would agree on a smaller deliverable rather than silently omit them.
      distractors:
      - text: I would preserve every part of the original Estimation answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Estimation explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/12-engineering-practice/cards/capacity-planning-and-headroom.md
    note: Estimation and headroom reasoning.
  - repo: original
    path: english-arcade/react/scope-negotiation
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: >-
      If auth and analytics contracts are unspecified, which smallest authenticated or
      telemetry checkpoint moves the estimate before I commit to a date?
    goal: Turn a time estimate into a conditional plan with explicit assumptions, risk,
      and a next measurement.
  critical_thinking:
    problem_frame: >-
      I would decompose the estimate into states and integration boundaries before giving a
      date; the unknown is whether auth and analytics are required for the requested
      milestone.
    claim_map:
      fact: >-
        The estimate covers a component with stated work but omits auth and analytics
        integration; the delayed case asks for a checkpoint before committing to one number.
      inference: >-
        I infer that a conditional range with a discovery checkpoint is safer than a fixed date
        while those boundaries and states remain unspecified.
      assumption: >-
        I am assuming auth and analytics are part of the requested definition of done; I would
        ask which existing interfaces and acceptance checks already exist.
      unknown: >-
        I still need the auth and analytics contracts, API or instrumentation ownership, missing
        loading or failure states, and acceptance criteria for the milestone.
    comparison:
      applicable: true
      alternatives:
      - option: give a conditional range with a small discovery checkpoint
        benefit: I make scope and uncertainty visible while producing evidence about
          the riskiest integration before committing to a date.
        cost_or_risk: The range may be less convenient for planning, and the checkpoint
          costs time before the full implementation begins.
        valid_when: Use it when states, data shape, or integration boundaries remain
          unspecified.
      - option: give a single fixed date from the stated happy path
        benefit: It is easy to communicate when scope, states, and integrations are
          already defined and stable.
        cost_or_risk: It hides missing work and can turn an assumption into a false
          commitment when the design is incomplete.
        valid_when: Use it only after the relevant states and integration constraints
          have been checked.
      decision_rule: Start with a decomposed range and checkpoint when uncertainty is
        material; offer a fixed date only when the scope and boundary evidence support it.
    failure_probe:
      kind: failure_mode
      prompt: If auth and analytics integration are absent from the design, which part
        of the estimate becomes unsafe, and what checkpoint would reduce that uncertainty?
    evidence_check:
      basis: Check the Estimation claim against system-design-estudos/areas/12-engineering-practice/cards/capacity-planning-and-headroom.md
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: This React exercise can test reasoning about Estimation, but it
        cannot prove an unmeasured production outcome, personal ownership, or universal
        rule.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        I am confident that missing integrations make a single estimate fragile, but the
        milestone can become estimable once the required states and boundary checks are
        explicit.
      update_trigger: >-
        I would narrow the range after an auth or analytics checkpoint resolves its contract and
        after missing-state tests are listed; I would revise the date when that evidence changes
        the remaining work.
    rubric:
      facts_correct: >-
        Names the stated component work and the absent auth and analytics boundaries without
        pretending that the omitted integrations have known scope.
      assumptions_explicit: >-
        States whether those integrations are part of done and asks which interfaces, states,
        and acceptance checks already exist.
      alternatives_considered: >-
        Compares a conditional range with a discovery checkpoint against a fixed date that is
        supported only after scope and integration evidence are available.
      tradeoff_quality: >-
        Connects the range to visible uncertainty and names planning convenience and checkpoint
        cost as the fixed-date or discovery tradeoffs.
      follow_up_adaptation: >-
        When auth and analytics are absent, changes the estimate into a checkpointed range
        instead of repeating a happy-path number.
      certainty_calibration: >-
        Uses medium confidence and names integration contracts, missing-state tests, and
        acceptance criteria as evidence that would update the date.