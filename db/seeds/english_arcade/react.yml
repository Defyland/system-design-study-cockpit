      the smallest repair.
  recall:
    active_recall_cue: What browser capabilities does virtualisation break?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Rendering large lists without
      presenting an assumption as a fact?
    black_box_probe: When the Rendering large lists answer failed, did you locate
      the reasoning error before changing the implementation?
    delayed_variant:
      id: react-09-list-virtualisation-delayed-9
      prompt: 'Rendering large lists: the later Rendering large lists review says
        a Rendering large lists test exposes a boundary case that the Rendering large
        lists examples did not cover. Under new Rendering large lists evidence contradicts
