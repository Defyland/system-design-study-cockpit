- id: react-08-error-boundaries
  version: 1.4.0
  target: react
  topic: Error handling
  difficulty: 2
  interview_stage: architecture_review
  prompt: Where would you put error boundaries in this application?
  context: A dashboard composed of independent widgets. The interviewer wants a placement
    strategy tied to what the user should still be able to do when one part fails.
  follow_up:
    prompt: Which failures should this boundary contain, and how would you keep a
      broken child from hiding a recoverable route state?
    goal: Answer the alternative challenge about Error handling while keeping the
      evidence boundary explicit.
    challenge_kind: alternative
    best_answer: >-
      Around each widget rather than at the root, so one failing chart does not
      blank the whole dashboard. I would compare that choice with the credible alternative against
      the requirement in the follow-up, cost, and failure risk, then switch only if evidence
      makes the alternative safer.
    distractors:
    - text: I would defend the first Error handling option because offering an alternative
        might make the decision look uncertain.
      why_wrong: A comparison makes the decision rule visible; it does not weaken
        a well-calibrated recommendation.
    - text: I would list every conceivable Error handling design without saying which
        requirement should decide between them.
      why_wrong: An option list without a decision rule avoids the trade-off the follow-up
        is testing.
  compression:
    prompt: Explain error-boundary placement as failure scope, fallback behavior,
      and a test that exercises the boundary.
    goal: Compress the Error handling answer into its decision, premise, trade-off,
      and verification step.
  best_answer: Around each widget rather than at the root, so one failing chart does
    not blank the whole dashboard. I would keep a root boundary as a last resort,
    but the useful granularity is wherever a failure should stay local to that region.
  distractors:
  - text: At the top level of the application, so that any error anywhere is caught
      in one place and the user sees a consistent error screen rather than a broken
      page.
    trap: content
    why_wrong: 'Maximises blast radius: one widget failure takes down every other
      widget the user could still have used.'
  - text: I would add them wherever errors are likely to happen, particularly around
      components that do data fetching or handle external input from third parties.
    trap: precision
    why_wrong: '"Where errors are likely" is unknowable in advance; placement should
      follow containment, not prediction.'
  - text: Around each widget instead of in the root, then one graphic that fails does
      not turn blank all the dashboard for the user that is using it.
    trap: grammar
    why_wrong: '"In the root", "turn blank all the dashboard" and the trailing relative
      clause are all non-idiomatic.'
  feedback:
    register: Design-level and user-focused.
    hedging: None; containment is a clear principle.
    precision: Blast radius is the criterion; say it in user terms.
    grammar: '"At the root", "blank the whole dashboard", "stay local".'
    pragmatics: Keeping a root boundary as a fallback shows completeness.
  rephrase:
    prompt: Explain your placement rule in terms of what the user can still do.
    goal: Convert an architectural rule into user outcomes.
  language_focus:
  - precision
  - grammar
  - pragmatics
  feynman:
    concept: Error boundary granularity and blast radius.
    explain_to: A product owner deciding what degraded mode looks like.
    constraint: Explain using circuit breakers in a house.
    self_check: Can you say what still works when one widget fails?
    reasoning_check: Can you identify the hidden premise behind Error handling, give
      a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You placed one boundary at the root, or guessed at risk.
    expected: Per-region boundaries sized by containment, root as fallback.
    actual: A single global handler, or prediction-based placement.
    root_cause: Error handling framed as catching rather than as limiting damage.
    repair: Ask what should survive the failure before deciding where to catch it.
    reasoning_error: If your Error handling answer failed, classify the mistake as
