- id: react-07-controlled-inputs
  version: 1.4.0
  target: react
  topic: Forms
  difficulty: 1
  interview_stage: technical_screen
  prompt: Would you make this input controlled or uncontrolled?
  context: A single search field inside a large form. The interviewer wants a decision
    with a reason, since both answers can be correct depending on what the component
    needs.
  follow_up:
    prompt: Which validation or focus behavior makes controlled state worth the extra
      renders here, and when would you keep the DOM as the source?
    goal: Answer the evidence challenge about Forms while keeping the evidence boundary
      explicit.
    challenge_kind: evidence
    best_answer: >-
      Controlled, because I need to react to each keystroke for the suggestions. I would
      treat the follow-up observation as evidence, not as proof of impact; I would inspect
      the smallest relevant trace or test and state what remains uncertain before changing the
      decision.
    distractors:
    - text: I would cite my experience with Forms as enough proof and move on without
        naming an observation.
      why_wrong: Experience can guide a hypothesis, but it does not replace evidence
        tied to this context.
    - text: I would collect every possible metric about Forms before making even a
        provisional recommendation.
      why_wrong: A focused decision can start with one discriminating observation
        rather than an unbounded data request.
  compression:
    prompt: Compare controlled and uncontrolled inputs by source of truth, validation
      timing, and integration cost.
    goal: Compress the Forms answer into its decision, premise, trade-off, and verification
      step.
  best_answer: Controlled, because I need to react to each keystroke for the suggestions.
    If I only needed the value on submit I would leave it uncontrolled and read it
    from the form, which avoids re-rendering the whole form on every character.
  distractors:
  - text: Controlled, because that is the standard React approach and it keeps the
      component state as the single source of truth for the value of the input at
      all times.
    trap: precision
    why_wrong: Correct choice, wrong reasoning. Convention is not a requirement, and
      the answer never mentions what the component needs.
  - text: Uncontrolled, because controlled inputs cause a re-render on every keystroke
      which is bad for performance, especially in a form with many fields like this
      one.
    trap: content
    why_wrong: Optimises away the behaviour the feature requires; suggestions cannot
      work without per-keystroke value.
  - text: Controlled, because I need to react in each keystroke for the suggestions,
      but if I needed the value only in the submit I would let it uncontrolled and
      read of the form.
    trap: grammar
    why_wrong: '"React in", "in the submit", "let it uncontrolled" and "read of" are
      four preposition errors.'
  feedback:
    register: Decisive with a requirement-based reason.
    hedging: None; the requirement decides it.
    precision: Tie the choice to the feature, not to convention.
    grammar: '"React to each keystroke", "on submit", "leave it uncontrolled".'
    pragmatics: Giving the counterfactual shows you know both patterns.
  rephrase:
    prompt: Answer again for a field that only matters when the form is submitted.
    goal: Practise applying the rule in the opposite direction.
  language_focus:
  - precision
  - grammar
  - pragmatics
  feynman:
    concept: Controlled versus uncontrolled inputs by requirement.
    explain_to: A developer who always picks controlled.
    constraint: Explain using a form filled in pencil versus read aloud.
