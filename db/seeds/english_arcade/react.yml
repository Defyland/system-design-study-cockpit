- id: react-09-list-virtualisation
  version: 1.4.0
  target: react
  topic: Rendering large lists
  difficulty: 3
  interview_stage: deep_dive
  prompt: The table slows down at ten thousand rows. What would you do?
  context: A performance question with an obvious answer and a less obvious cost.
    The interviewer wants both the technique and what it breaks.
  follow_up:
    prompt: What would you measure before virtualising, and how would keyboard focus
      behave when rows enter and leave the viewport?
    goal: Answer the failure challenge about Rendering large lists while keeping the
      evidence boundary explicit.
    challenge_kind: failure
    best_answer: >-
      I would virtualise so only the visible rows are in the DOM. If the
      failure in the follow-up appears, I would name the user or system consequence, contain
      it with a bounded mitigation, and verify recovery with a focused test or metric.
    distractors:
    - text: I would describe the Rendering large lists failure as impossible because
        the happy path already passed its test.
      why_wrong: Passing a happy path does not test the boundary, failure mode, or
        recovery being challenged.
    - text: I would add retries to Rendering large lists immediately and assume the
        system would become reliable.
      why_wrong: Retries can amplify load or duplicate effects; the failure and containment
        policy must be specified first.
  compression:
    prompt: Summarize large-list performance as measurement, rendering strategy, and
      preserved interaction semantics.
    goal: Compress the Rendering large lists answer into its decision, premise, trade-off,
      and verification step.
  best_answer: I would virtualise so only the visible rows are in the DOM. The cost
    is that browser find, text selection across the whole table and print all stop
    working normally, so I would confirm with the product side that none of those
    matter before committing to it.
  distractors:
  - text: I would virtualise the list so that only the rows currently visible in the
      viewport are rendered, which keeps the DOM small and the scrolling smooth even
      with very large datasets.
    trap: precision
    why_wrong: Correct technique with no mention of what it costs, which is the half
      the question was actually probing.
  - text: I would add pagination instead, since ten thousand rows is not something
      a user can meaningfully scan anyway and smaller pages are easier to render quickly.
    trap: pragmatics
    why_wrong: A legitimate product suggestion, but it changes the requirement rather
      than answering the engineering question.
  - text: I would virtualise for only the rows visible stay in the DOM, but the cost
      is that the search of the browser and the selection of text stop of working
