- id: system_design-11-scope-control
  version: 1.4.0
  target: system_design
  topic: Managing the round
  difficulty: 2
  interview_stage: architecture_review
  template: sd-delivery
  prompt: We have fifteen minutes left and we have not covered storage. How do you
    want to use the time?
  context: A time-management moment disguised as a question. The interviewer is handing
    you control of the remaining agenda to see what you prioritise.
  follow_up:
    prompt: Would you cut scope, time-box storage, or state the risk explicitly, and
      what decision do you need from the interviewer now?
    goal: Answer the failure challenge about Managing the round while keeping the
      evidence boundary explicit.
    challenge_kind: failure
    best_answer: >-
      I would spend ten minutes on the data model and access patterns, where most
      risk sits, then keep five for failure modes. If the failure in the follow-up
      appears, I would name the user or system consequence, contain it with a bounded
      mitigation, and verify recovery with a focused test or metric.
    distractors:
    - text: I would describe the Managing the round failure as impossible because
        the happy path already passed its test.
      why_wrong: Passing a happy path does not test the boundary, failure mode, or
        recovery being challenged.
    - text: I would add retries to Managing the round immediately and assume the system
        would become reliable.
      why_wrong: Retries can amplify load or duplicate effects; the failure and containment
        policy must be specified first.
  compression:
    prompt: Close the remaining design time with covered decisions, open risk, and
      one concrete next question.
    goal: Compress the Managing the round answer into its decision, premise, trade-off,
      and verification step.
  best_answer: 'I would spend ten minutes on the data model and access patterns, where
    most risk sits, then keep five for failure modes. I would leave ranking undiscussed
    before storage hand-waved: storage decisions are harder to reverse.'
  distractors:
  - text: Let us cover storage then, I can walk through the schema and the database
      choice and then we can see how much time is left for the other topics afterwards.
    trap: precision
    why_wrong: Accepts the topic without allocating the time or saying what gets dropped,
      so the round can still overrun.
  - text: Whatever you think would be most valuable to cover, I am happy to go into
      whichever area you feel is most relevant for the role we are discussing today.
    trap: pragmatics
    why_wrong: Returns a decision that was deliberately given to you, forfeiting the
      prioritisation signal.
  - text: I would pass ten minutes in the data model and the patterns of access, because
      is there that stays the biggest risk, and keep five for the modes of failure.
    trap: grammar
    why_wrong: '"Pass ten minutes", missing subject and two inverted compound nouns
      break an otherwise sound plan.'
  feedback:
    register: Decisive and calm. Owning the agenda reads as senior.
    hedging: None; allocate the minutes explicitly.
    precision: Reversibility is the criterion that justifies the priority.
    grammar: '"Spend ten minutes on", "access patterns", "failure modes".'
    pragmatics: Saying what you sacrifice makes the prioritisation credible.
  rephrase:
    prompt: Give the same plan if only five minutes remained.
    goal: Force a harder prioritisation with the same reasoning.
  language_focus:
  - precision
  - grammar
  - pragmatics
  pt_help: '"Passar tempo" e "spend time". "Pass time" significa outra coisa.'
  feynman:
    concept: Prioritising by reversibility under time pressure.
    explain_to: A candidate who tries to cover everything.
    constraint: Explain using packing for a trip with one bag.
    self_check: Did you name what you are choosing not to cover?
    reasoning_check: Can you identify the hidden premise behind Managing the round,
      give a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You accepted the topic without a plan, or deferred the choice.
    expected: Explicit minute allocation justified by reversibility.
    actual: An open-ended walkthrough, or handing the decision back.
    root_cause: Treating the interviewer as the owner of an agenda they just delegated.
    repair: When given the agenda, allocate time and name the sacrifice.
    reasoning_error: If your Managing the round answer failed, classify the mistake
      as a fact, assumption, comparison, failure, or certainty error before proposing
      the smallest repair.
  recall:
    active_recall_cue: Which property makes a design decision worth prioritising?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Managing the round without
