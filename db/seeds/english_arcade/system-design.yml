- id: system_design-12-ten-x-version
  version: 1.4.0
  target: system_design
  topic: Scaling narrative
  difficulty: 3
  interview_stage: architecture_review
  template: sd-delivery
  prompt: What would you change if this had ten times the traffic?
  context: The closing question of most design rounds. The interviewer wants a staged
    evolution rather than a redesign, since redesigning signals the first version
    was not thought through.
  follow_up:
    prompt: Which ten-times assumption changes the architecture rather than merely
      adding more instances, and how would you stage that change?
    goal: Answer the new_evidence challenge about Scaling narrative while keeping
      the evidence boundary explicit.
    challenge_kind: new_evidence
    best_answer: >-
      Not the shape, mostly the boundaries. I would keep the claims that remain supported,
      identify exactly which premise the new observation changes, and run a focused check before
      revising the decision.
    distractors:
    - text: I would keep the Scaling narrative recommendation unchanged because changing
        position would look inconsistent.
      why_wrong: A defensible answer updates when relevant evidence changes an assumption
        or trade-off.
    - text: I would discard every earlier Scaling narrative claim as soon as one new
        observation appeared.
      why_wrong: New evidence may narrow one claim while leaving other verified facts
        intact.
  compression:
    prompt: Tell the scaling story as changed constraint, architectural response,
      migration step, and validation signal.
    goal: Compress the Scaling narrative answer into its decision, premise, trade-off,
      and verification step.
  best_answer: Not the shape, mostly the boundaries. I would partition the write path
    by tenant so no single primary carries everything, move fanout from the request
    to a consumer group, and add regional read capacity. The data model stays, which
    is deliberate, because that is the expensive thing to change.
  distractors:
  - text: I would need to redesign several parts of the system to handle that scale,
      probably moving to a distributed database and splitting the application into
      separate services.
    trap: content
    why_wrong: A redesign at ten times implies the first design had no headroom, which
      undermines everything you presented.
  - text: I would add more servers and scale the database vertically, and introduce
      caching in more places to reduce the load on the backend components of the system.
    trap: precision
    why_wrong: Adds resources without addressing the single-primary write ceiling,
      which is what actually binds.
  - text: Not the shape, principally the boundaries. I would partition the path of
      write for tenant so that no primary carries everything, and pass the fanout
      of the request for a group of consumers.
    trap: grammar
    why_wrong: '"Principally", "path of write", "for tenant" and "group of consumers"
      are four transfer errors in two sentences.'
  feedback:
    register: Confident continuity. Evolution, not reinvention.
    hedging: '"Mostly" appropriately signals that some things do change.'
    precision: Saying what stays, and why, is as strong as what changes.
    grammar: '"Partition by tenant", "the write path", "a consumer group".'
    pragmatics: Defending the unchanged data model shows deliberate design.
  rephrase:
    prompt: Name the one thing you would have designed differently from the start.
    goal: Practise self-critique without undermining the design.
  language_focus:
  - precision
  - grammar
  - hedging
  feynman:
    concept: Staged evolution versus redesign under load growth.
    explain_to: A candidate who rebuilds the design at every follow-up.
    constraint: Explain using widening a road rather than rebuilding a city.
    self_check: Did you say what deliberately stays the same?
    reasoning_check: Can you identify the hidden premise behind Scaling narrative,
      give a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You redesigned, or only added resources.
    expected: Partitioned writes, async fanout, regional reads, model intact.
    actual: A microservices migration, or vertical scaling.
    root_cause: Not designing the first version with a stated evolution path.
    repair: Design every system with the next boundary already identified.
    reasoning_error: If your Scaling narrative answer failed, classify the mistake
      as a fact, assumption, comparison, failure, or certainty error before proposing
      the smallest repair.
  recall:
    active_recall_cue: What should stay the same when traffic grows tenfold?
