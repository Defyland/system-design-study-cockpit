      the first failure signal, and the observation that would update Failure modes.
    goal: Move from the short Failure modes answer to a deep, evidence-led defence
      without inventing an outcome.
  critical_thinking:
    problem_frame: 'Frame Failure modes before proposing a solution: state the actor,
      required outcome, constraint, and unknown that could invalidate the first recommendation.'
    claim_map:
      fact: The prompt explicitly tests Failure modes within a system design context;
        treat that named boundary as the verified starting fact.
      inference: The reasonable inference is that the answer must defend Failure modes,
        but that does not prove one implementation wins under every workload or audience.
      assumption: An unstated assumption is that the Failure modes constraint is the
        dominant one; label it and ask whether the interviewer confirms it.
      unknown: 'Still unknown for Failure modes: the scale, failure tolerance, ownership
        boundary, and evidence threshold that would change the decision.'
    comparison:
      applicable: false
