- id: system_design-05-read-path-caching
  version: 1.4.0
  target: system_design
  topic: Read path
  difficulty: 2
  interview_stage: architecture_review
  template: sd-delivery
  prompt: Your cache node just died at peak traffic. What happens next?
  context: A failure question about a component candidates usually present as pure
    benefit. The interviewer wants to know whether you have thought about the moment
    it disappears.
  follow_up:
    prompt: If the cache disappears, which requests can hit durable storage, and what
      protection keeps the database from becoming the next outage?
    goal: Answer the alternative challenge about Read path while keeping the evidence
      boundary explicit.
    challenge_kind: alternative
    best_answer: >-
      If the cache disappears, every request hits the database at once: a thundering herd
      it was never sized for. I would compare that choice with the credible alternative
      against the requirement in the follow-up, cost, and failure risk, then switch only if
      evidence makes the alternative safer.
    distractors:
    - text: I would defend the first Read path option because offering an alternative
        might make the decision look uncertain.
      why_wrong: A comparison makes the decision rule visible; it does not weaken
        a well-calibrated recommendation.
    - text: I would list every conceivable Read path design without saying which requirement
        should decide between them.
      why_wrong: An option list without a decision rule avoids the trade-off the follow-up
        is testing.
  compression:
    prompt: Summarize cache failure handling as fallback, load shedding, and the consistency
      trade-off you accept.
    goal: Compress the Read path answer into its decision, premise, trade-off, and
      verification step.
  best_answer: 'If the cache disappears, every request hits the database at once:
    a thundering herd it was never sized for. I would use request coalescing so one
    lookup per key reaches the origin, and keep headroom for the rest.'
  distractors:
  - text: The requests would fall back to the database, which would be slower but
      the system would keep working, and then the cache would warm up again once it
      comes back online.
    trap: content
    why_wrong: Assumes graceful degradation. If the database were sized for full traffic
      the cache would not have been necessary.
  - text: We would see increased latency and load on the database, so it would be
      important to have monitoring in place to detect that situation quickly and respond
      to it.
    trap: precision
    why_wrong: Observes the symptom and proposes alerting rather than a design that
      survives the event.
  - text: All the requests that were being served of the cache go to the database
      at the same time, that is a herd thundering for which the database was never
      dimensioned.
    trap: grammar
    why_wrong: '"Served of", post-posed "herd thundering" and "dimensioned" as a false
      friend all break the sentence.'
  feedback:
    register: Sober about failure. Caches are load-bearing, so say so.
    hedging: None; the herd behaviour is predictable.
    precision: Coalescing and headroom are concrete; "monitoring" is not a mitigation.
    grammar: '"Served from the cache", "a thundering herd", "sized for".'
    pragmatics: Naming the mitigation converts an observation into a design.
  rephrase:
    prompt: Explain what you would set the origin concurrency limit to, and why.
    goal: Push the mitigation to a concrete parameter.
  language_focus:
  - precision
  - grammar
  - pragmatics
  pt_help: '"Dimensionar" e "size" ou "capacity plan". "Dimension" nao se usa assim.'
  feynman:
    concept: Thundering herd on cache loss and request coalescing.
    explain_to: A developer who added a cache purely for speed.
    constraint: Explain using a motorway losing a lane at rush hour.
    self_check: Did you say why the database cannot simply absorb it?
    reasoning_check: Can you identify the hidden premise behind Read path, give a
      counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You assumed graceful fallback, or proposed monitoring.
    expected: Thundering herd, coalescing, deliberate origin headroom.
    actual: A degradation assumption, or an alerting plan.
    root_cause: Caches modelled as optimisations rather than as capacity dependencies.
    repair: For every cache, state what breaks the moment it is empty.
    reasoning_error: If your Read path answer failed, classify the mistake as a fact,
      assumption, comparison, failure, or certainty error before proposing the smallest
      repair.
  recall:
    active_recall_cue: What protects the origin when a cache disappears?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Read path without presenting
      an assumption as a fact?
    black_box_probe: When the Read path answer failed, did you locate the reasoning
