---
contract_version: 1.4.0
target:
  key: system_design
  label: System Design
  blurb: 'Drive the conversation: requirements, volume, source of truth, failure,
    trade-offs. The language of judgement is what gets assessed.'
  focus_areas:
  - requirements and scoping
  - volume estimation
  - write and read paths
  - source of truth and consistency
  - failure, trade-offs and Rails mapping
  simulation:
    minutes: 45
    structure:
    - label: Requirements and constraints
      minutes: 8
    - label: Volume estimation and capacity
      minutes: 7
    - label: High-level design and data model
      minutes: 15
    - label: Failure modes and bottlenecks
      minutes: 10
    - label: Trade-offs and the 10x version
      minutes: 5
  critical_thinking:
    learner_prompts:
      evidence_ledger: For system design, record whether each claim about requirements,
        scale estimates, source of truth, failure modes, and trade-offs is a verified
        fact, an inference, an assumption, or an unknown before you defend it.
      problem_frame: Frame every system design answer with the actor, requirement,
        constraint, success condition, and unanswered question that could change the
        decision.
      comparison: When system design offers a real choice, compare two options by
        benefit, cost or risk, valid-when condition, and an explicit decision rule.
      failure_probe: Ask which counterexample, edge case, or failure mode could break
        the system design recommendation, then state the smallest test or containment
        step.
      certainty_review: 'Calibrate certainty in system design: name the evidence,
        separate correlation from causality, and say what new observation would make
        you revise the answer.'
    rubric:
      facts_correct: Names the verified requirements, scale estimates, source of truth,
        failure modes, and trade-offs facts without smuggling in a result or capability
        that the prompt does not establish.
      assumptions_explicit: Labels the system design premise that is still assumed
        and asks the smallest clarifying question that matters.
      alternatives_considered: Considers a credible alternative for system design,
        or explains the hard constraint that makes comparison a false equivalence.
      tradeoff_quality: Connects the system design choice to a benefit, a cost or
        risk, and the condition under which another choice wins.
      follow_up_adaptation: Responds to an adversarial system design follow-up by
        changing the claim or evidence boundary rather than repeating a memorised
        answer.
      certainty_calibration: Uses high, medium, or low certainty deliberately and
        names the evidence that would update the system design recommendation.
templates:
- id: sd-delivery
  label: System design delivery framework
  applies_to: architecture_review
  steps:
  - Ask what the main product action is and what must stay fast.
  - Establish what cannot duplicate, be lost, or leak.
  - Estimate peak volume out loud before choosing components.
  - State the request or event path and name the source of truth.
  - Identify likely bottlenecks and the measurements needed to test them.
  - Give the version now and the version at ten times the load.
  source:
    repo: system-design-estudos
    path: areas/01-metodo-e-entrevistas/snippets/system-design-interview-checklist.md
    note: Delivery order adapted from the checklist with explicit measurement before a bottleneck claim.
- id: sd-incident
  label: Senior production answer template
  applies_to: deep_dive
  steps:
  - State the impact on the critical path.
  - Say what you would protect first.
  - Name the first metrics or dashboards you would read.
  - Give the smallest safe mitigation.
  - State the rollback condition.
  - Say what you would not touch mid-incident.
  - Name the follow-up investigation after stabilising.
  source:
    repo: system-design-estudos
    path: areas/01-metodo-e-entrevistas/snippets/senior-production-answer-template.md
    note: Impact-first incident structure used verbatim as the answer spine.
cards:
- id: system_design-card-requirements-first
  front: What are the first two questions in any system design round?
  back: >-
    I start with the main product action and the things that must not duplicate, disappear, or
    leak. I choose components only after those invariants and abuse cases are explicit.
  box: 1
  source:
    repo: system-design-estudos
    path: areas/01-metodo-e-entrevistas/snippets/system-design-interview-checklist.md
    note: Opening questions from the interview checklist.
  critical_thinking:
    cue: >-
      What must you establish before naming components? State the product action, the
      non-duplication or loss invariant, and the abuse case that could change the design.
    check: >-
      Can you compare two first-release scopes, name a failure caused by an unstated requirement,
      and say which product evidence would change your architecture?
- id: system_design-card-source-of-truth
  front: Why name the source of truth early?
  back: >-
    I name the source of truth first because consistency, caching, and recovery all depend on
    it. If I cannot say which record wins, later answers will contradict one another.
  box: 2
  source:
    repo: system-design-estudos
    path: chapters/chapter-03-idempotent-writes-under-ambiguous-failure.md
    note: Write-path reasoning anchored on the authoritative store.
  critical_thinking:
    cue: >-
      Why name a source of truth before cache or consistency details? Identify the authoritative
      write, the derived view, and the reconciliation evidence.
    check: >-
      Can you compare a database with a derived cache or index, name the stale-read failure, and
      state which write or repair event would update your choice?
- id: system_design-card-ten-x
  front: How do you close a system design answer?
  back: >-
    I compare the current workload with the version at ten times the load, then name the limit
    that forces an architectural change. More instances do not remove every shared bottleneck.
  box: 2
  source:
    repo: system-design-estudos
    path: areas/01-metodo-e-entrevistas/snippets/system-design-interview-checklist.md
    note: Now-versus-10x framing from the checklist.
  critical_thinking:
    cue: >-
      What should a ten-times answer contain? Separate the measured boundary that scales from the
      shared limit that would force a new design.
    check: >-
      Can you compare replication with partitioning or asynchronous work, name the first
      saturation metric, and state what load evidence would force evolution?
items:
- id: system_design-01-requirements-first
  version: 1.4.0
  target: system_design
  topic: Requirements
  difficulty: 1
  interview_stage: architecture_review
  template: sd-delivery
  prompt: Design a URL shortener for us. Where do you want to start?
  context: The classic opener. The interviewer is watching whether you scope before
    you architect, including abuse and authorization requirements, because candidates
    who start naming components usually design the wrong system.
  follow_up:
    prompt: Which URL-shortener requirements are mandatory for the first release,
      and which attractive features would you defer?
    goal: Answer the failure challenge about Requirements while keeping the evidence
      boundary explicit.
    challenge_kind: failure
    best_answer: >-
      I would keep the first release to the redirect action, ownership and authorization,
      uniqueness, abuse controls, and an auditable disable path. I would defer analytics or custom
      features until the product owner confirms they change the launch invariant, because each
      adds storage and failure modes.
    distractors:
    - text: I would describe the Requirements failure as impossible because the happy
        path already passed its test.
      why_wrong: Passing a happy path does not test the boundary, failure mode, or
        recovery being challenged.
    - text: I would add retries to Requirements immediately and assume the system
        would become reliable.
      why_wrong: Retries can amplify load or duplicate effects; the failure and containment
        policy must be specified first.
  compression:
    prompt: Open the design with scope, success criteria, and one explicit non-goal
      before naming components.
    goal: Compress the Requirements answer into its decision, premise, trade-off,
      and verification step.
  best_answer: Before components, I would clarify the dominant action and whether
    custom aliases require a strong uniqueness guarantee. I would also ask who may
    create, edit, or disable a link and what abuse we must resist, such as malicious
    destinations or bulk creation, because that determines authorization, rate limits,
    and the moderation path.
  distractors:
  - text: I would start with the API design, so a POST endpoint to create a short
      link and a GET that redirects, and then work out the database schema and the
      caching layer from there. Authentication, rate limits, and abuse controls can
      be added later because a small URL shortener does not need to delay the core
      redirect path for those details.
    trap: pragmatics
    why_wrong: Starts building before scoping, so the design is committed before the
      read-write ratio is even known.
  - text: I would use a key-value store for the mappings with a cache in front, and
      generate the short codes with a hash or a counter depending on the requirements
      we settle on.
    trap: content
    why_wrong: Names the components first and defers requirements to the end, which
      inverts the entire exercise.
  - text: Before the components, two questions. Which is the main action that we are
      optimising, to create links or to resolve them, because normally the path of
      read is much more heavy.
    trap: grammar
    why_wrong: '"Which is" for "what is", "path of read" and "more heavy" are three
      distinct transfer errors.'
  feedback:
    register: 'Collaborative and controlled: use requirements to set the agenda before
      proposing components.'
    hedging: Use "I would clarify" for the next design step, while asking authorization
      and abuse questions directly.
    precision: Ask which actors need authorization, which abuse patterns matter, and
      where rate limits must apply; each answer changes the design.
    grammar: '"Who is authorized to disable a link?", "the read path", and "much heavier".'
    pragmatics: Explain that authorization, abuse handling, and rate limits determine
      the operational path, so the questions do not sound like stalling.
  rephrase:
    prompt: Ask a product owner who may disable links, what abuse must be blocked,
      and where rate limits belong before you sketch the service.
    goal: Prove the questions were reasoned, not memorised.
  language_focus:
  - pragmatics
  - precision
  - grammar
  pt_help: '"Qual e" em pergunta aberta e "what is", nao "which is". "Which" implica
    opcoes fechadas.'
  feynman:
    concept: Scoping before architecture.
    explain_to: A candidate who starts by drawing boxes.
    constraint: Explain using an architect meeting a client, including who is authorized
      and how the building handles abuse.
    self_check: Would each answer change authorization, abuse controls, or rate limits?
    reasoning_check: Can you identify the hidden premise behind Requirements, give
      a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You named components or endpoints before scoping.
    expected: Questions about the dominant action, authorization, abuse, and rate
      limits, with the design consequence stated.
    actual: An API sketch, or a component list with deferred requirements.
    root_cause: Anxiety about silence pushing you to produce something visible fast.
    repair: Open every design round with the main action, the authorization boundary,
      and the abuse limit.
    reasoning_error: If your Requirements answer failed, classify the mistake as a
      fact, assumption, comparison, failure, or certainty error before proposing the
      smallest repair.
  recall:
    active_recall_cue: Which questions establish authorization, abuse controls, and
      rate limits before the URL-shortener architecture?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Requirements without presenting
      an assumption as a fact?
    black_box_probe: When the Requirements answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: system_design-01-requirements-first-delayed-1
      prompt: >-
        The owner now requires custom aliases with strong uniqueness and asks for bulk creation with
        abuse controls. Which first-release requirement survives, and which component claim must you
        defer?
      changed_constraint: >-
        custom alias uniqueness and bulk creation must be authorized, rate-limited, and auditable
      new_evidence: >-
        the product owner makes strong alias uniqueness and bulk abuse control launch requirements
      best_answer: >-
        I would keep redirect correctness, ownership, and the ability to disable a link. I
        would now make custom-alias uniqueness and bounded, authorized bulk creation explicit
        first-release requirements. I would test competing alias requests and bulk rate limits
        before selecting capacity or queueing components. Analytics can remain separate unless
        the owner also requires it.
      distractors:
      - text: I would preserve every part of the original Requirements answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Requirements explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/01-metodo-e-entrevistas/snippets/system-design-interview-checklist.md
    note: Before-architecture questions from the checklist.
  - repo: system-design-estudos
    path: real-world-cases/05-product-scenarios/bitly-url-shortener/README.md
    note: URL shortener case referenced for scoping, not copied.
  extension:
    prompt: >-
      If link creation is cheap but malicious redirects cause harm, which authorization, rate-limit,
      and disable controls would I prioritize?
    goal: >-
      Move from the short Requirements answer to a deep, evidence-led defence without inventing
      an outcome.
  critical_thinking:
    problem_frame: >-
      I need to define the URL-shortener release contract before choosing storage or distribution:
      redirect behavior, link ownership, alias rules, and abuse handling.
    claim_map:
      fact: >-
        The interviewer requests a URL-shortening service without traffic figures or a complete
        release specification.
      inference: Creation, redirection, and disabling links may need different access and availability
        rules.
      assumption: >-
        I am assuming analytics can wait; I need the product owner to confirm the launch requirements.
      unknown: >-
        Alias rules, retention, permitted destinations, traffic shape, and acceptable redirect latency
        are not yet specified.
    comparison:
      applicable: false
      rejected_alternative: Selecting a distributed cache and multiple databases before agreeing
        on link behavior.
      hard_constraint: >-
        The first release must implement the agreed ownership and abuse policy; attractive infrastructure
        cannot substitute for that contract.
      decision_rule: >-
        I would settle the redirect, ownership, uniqueness, and abuse requirements first, then choose
        components against the resulting workload.
    failure_probe:
      kind: edge_case
      prompt: >-
        If two users request the same custom alias and one later loses access, which create, redirect,
        and disable behaviors must remain correct?
    evidence_check:
      basis: >-
        Check the Requirements claim against system-design-estudos/areas/01-metodo-e-entrevistas/snippets/system-design-interview-checklist.md
        and the exact interview context; record whether each part is fact, inference, or hypothesis.
      source_kind: authored_scenario
      limitation: >-
        This system design exercise can test reasoning about Requirements, but it cannot prove an
        unmeasured production outcome, personal ownership, or universal rule.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        The missing product requirements justify asking questions; they do not establish a particular
        storage topology.
      update_trigger: >-
        A mandatory alias policy, bulk-creation requirement, or measured redirect load would change
        the release boundary and component needs.
    rubric:
      facts_correct: Separates the requested URL-shortener behavior from features the candidate
        introduced.
      assumptions_explicit: Asks whether analytics, custom aliases, and link expiry are release
        requirements.
      alternatives_considered: Rejects premature component selection until ownership and redirect
        rules are known.
      tradeoff_quality: Explains how an added feature increases write, storage, or moderation responsibilities.
      follow_up_adaptation: Adds alias conflicts and bulk abuse controls when those requirements
        become mandatory.
      certainty_calibration: >-
        Keeps medium certainty about the design until the release contract and workload are supplied.

- id: system_design-02-volume-estimation
  version: 1.4.0
  target: system_design
  topic: Estimation
  difficulty: 2
  interview_stage: architecture_review
  template: sd-delivery
  prompt: Roughly what kind of load are we talking about here?
  context: You have been given a hundred million daily active users. The interviewer
    wants arithmetic out loud, with assumptions stated, and no false precision.
  follow_up:
    prompt: Which traffic, payload, and retention assumptions drive your estimate,
      and how would you validate them with the product owner?
    goal: Answer the new_evidence challenge about Estimation while keeping the evidence
      boundary explicit.
    challenge_kind: new_evidence
    best_answer: >-
      I would ask for active users, actions per user, payload size, retention, and peak-to-average
      ratio, then show the arithmetic and label the peak multiplier as an assumption. I would
      validate it against product analytics and revise capacity from observed traffic rather than
      treating sixty thousand per second as a fact.
    distractors:
    - text: I would keep the Estimation recommendation unchanged because changing
        position would look inconsistent.
      why_wrong: A defensible answer updates when relevant evidence changes an assumption
        or trade-off.
    - text: I would discard every earlier Estimation claim as soon as one new observation
        appeared.
      why_wrong: New evidence may narrow one claim while leaving other verified facts
        intact.
  compression:
    prompt: Give the estimate as assumptions, arithmetic, peak factor, and the uncertainty
      you would measure first.
    goal: Compress the Estimation answer into its decision, premise, trade-off, and
      verification step.
  best_answer: Let me work it through. A hundred million users doing roughly ten actions
    a day is a billion events, which is about twelve thousand per second averaged.
    Traffic is never flat, so I would design for perhaps five times that at peak and
    treat sixty thousand per second as the number.
  distractors:
  - text: It would be a very high load, in the order of millions of requests, so we
      would definitely need horizontal scaling and a distributed architecture to handle
      that kind of traffic properly.
    trap: precision
    why_wrong: Skips the arithmetic entirely, so the architecture that follows rests
      on no number at all.
  - text: Assuming an average of 11.57 requests per second per thousand users and
      a peak factor of 4.7, we would be looking at approximately 54,300 requests per
      second at the busiest hour.
    trap: register
    why_wrong: False precision from invented constants; estimation should be visibly
      rounded and challengeable.
  - text: Let me make the calculation. A hundred million of users doing ten actions
      per day gives a billion of events, that is around twelve thousand for second
      in the average.
    trap: grammar
    why_wrong: '"A hundred million of users", "a billion of events" and "for second"
      add Portuguese prepositions English does not use.'
  feedback:
    register: Think aloud. Estimation is a performance of reasoning, not a result.
    hedging: Hedge the multiplier ("perhaps five times"), never the arithmetic.
    precision: Round numbers signal honest estimation; decimals signal invention.
    grammar: '"A hundred million users", "a billion events", "per second".'
    pragmatics: Announcing the peak assumption invites the interviewer to correct
      it.
  rephrase:
    prompt: Redo the estimate assuming the product is read-heavy at fifty to one.
    goal: Practise adjusting an estimate rather than restarting it.
  language_focus:
  - precision
  - grammar
  - register
  pt_help: '"Um milhao de usuarios" vira "a million users", sem "of". So use "of"
    com "millions of users".'
  feynman:
    concept: Order-of-magnitude estimation with a peak factor.
    explain_to: A candidate who freezes at mental arithmetic.
    constraint: Use only round numbers and one multiplication at a time.
    self_check: Did you state the peak assumption separately from the average?
    reasoning_check: Can you identify the hidden premise behind Estimation, give a
      counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You gave an adjective, or invented decimal precision.
    expected: Stated assumptions, rounded arithmetic, explicit peak factor.
    actual: A vague "very high load", or fabricated constants.
    root_cause: Mental arithmetic in a second language feeling riskier than vagueness.
    repair: Rehearse the users-times-actions-divided-by-86400 chain until automatic.
    reasoning_error: If your Estimation answer failed, classify the mistake as a fact,
      assumption, comparison, failure, or certainty error before proposing the smallest
      repair.
  recall:
    active_recall_cue: What do you multiply the average rate by, and why?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Estimation without presenting
      an assumption as a fact?
    black_box_probe: When the Estimation answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: system_design-02-volume-estimation-delayed-2
      prompt: >-
        Analytics show the peak-to-average ratio is twelve rather than five, while retention is
        shorter than assumed. Which capacity claim changes and what would you recompute?
      changed_constraint: >-
        capacity must cover the observed peak multiplier and the revised payload and retention
        profile
      new_evidence: >-
        product analytics measure a twelve-times peak and a shorter retention window than the
        initial estimate
      best_answer: >-
        I would replace the assumed fivefold peak with the measured twelvefold ratio. With the
        same billion daily events, that is roughly 140,000 events per second at peak rather
        than 60,000. Shorter retention reduces retained event storage, not that peak arrival
        rate. I would recompute bytes from event size and retention, then verify throughput
        and bandwidth with a representative burst.
      distractors:
      - text: I would preserve every part of the original Estimation answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Estimation explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/01-metodo-e-entrevistas/backend-interview-foundations/chapters/03-system-design-delivery-framework.md
    note: Delivery framework including estimation discipline.
  - repo: system-design-estudos
    path: areas/12-engineering-practice/cards/capacity-planning-and-headroom.md
    note: Capacity planning and headroom reasoning.
  extension:
    prompt: >-
      How would I explain why shorter retention reduces stored bytes without reducing the measured
      peak request rate?
    goal: >-
      Move from the short Estimation answer to a deep, evidence-led defence without inventing an
      outcome.
  critical_thinking:
    problem_frame: >-
      I need an order-of-magnitude capacity estimate from daily users, activity, payloads, retention,
      and burstiness, with units and assumptions visible.
    claim_map:
      fact: >-
        The scenario supplies one hundred million daily active users; it does not supply their event
        frequency.
      inference: >-
        Daily events divided by seconds per day estimate an average, which cannot by itself describe
        burst capacity.
      assumption: >-
        I am assuming ten actions per user and a fivefold peak until product analytics provides
        better figures.
      unknown: >-
        Event size, read/write mix, regional concentration, retention, and observed peak duration
        remain unknown.
    comparison:
      applicable: true
      alternatives:
      - option: Provision from observed peaks with explicit headroom
        benefit: Matches the known workload and makes the capacity margin reviewable.
        cost_or_risk: Historical observations may miss a launch spike or a change in usage.
        valid_when: Representative peak data and an agreed overload response are available.
      - option: Use a conservative provisional peak multiplier
        benefit: Supports an early estimate before reliable traffic measurements exist.
        cost_or_risk: The multiplier may overprovision or underestimate correlated bursts.
        valid_when: I label the multiplier and plan to replace it with measured demand.
      decision_rule: >-
        I would show average and peak separately, use measured bursts when available, and label
        any provisional multiplier instead of presenting it as observed demand.
    failure_probe:
      kind: edge_case
      prompt: >-
        If the same daily volume arrives in a short regional burst, which throughput, bandwidth,
        and queue estimates become unsafe?
    evidence_check:
      basis: >-
        Check the Estimation claim against system-design-estudos/areas/01-metodo-e-entrevistas/backend-interview-foundations/chapters/03-system-design-delivery-framework.md
        and the exact interview context; record whether each part is fact, inference, or hypothesis.
      source_kind: authored_scenario
      limitation: >-
        This system design exercise can test reasoning about Estimation, but it cannot prove an
        unmeasured production outcome, personal ownership, or universal rule.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        The unit arithmetic is checkable, while event frequency and burst assumptions still control
        the capacity conclusion.
      update_trigger: >-
        Measured twelvefold peaks or shorter retention require separate recomputation of throughput
        and stored bytes.
    rubric:
      facts_correct: Shows users times actions and converts daily totals into events per second.
      assumptions_explicit: Labels event frequency and peak multiplier rather than treating them
        as supplied facts.
      alternatives_considered: Distinguishes measured peak provisioning from a provisional sizing
        assumption.
      tradeoff_quality: Connects headroom to overload risk and cost instead of arbitrary precision.
      follow_up_adaptation: Recomputes the peak from twelvefold demand and storage from the new
        retention period.
      certainty_calibration: >-
        Uses medium certainty for capacity until traffic shape and payload measurements are available.

- id: system_design-03-source-of-truth
  version: 1.4.0
  target: system_design
  topic: Source of truth
  difficulty: 3
  interview_stage: architecture_review
  template: sd-delivery
  prompt: You have the same data in three places now. Which one is authoritative?
  context: Your design has a database, a cache and a search index holding overlapping
    data. The interviewer wants to know whether you can say which one wins when they
    disagree.
  follow_up:
    prompt: Which write or reconciliation event is authoritative, and how would readers
      detect a stale replica or cache?
    goal: Answer the assumption challenge about Source of truth while keeping the
      evidence boundary explicit.
    challenge_kind: assumption
    best_answer: >-
      I would make the committed database write authoritative, let caches and indexes carry
      versions or timestamps, and expose stale reads through a version check or metric. I would
      reconcile derived views from the database and test a replica lag or cache miss before
      claiming freshness.
    distractors:
    - text: I would repeat my original Source of truth answer with more confidence
        because the interviewer probably assumes the usual case.
      why_wrong: It hides the premise instead of checking whether the usual case is
        actually part of this problem.
    - text: I would stop proposing anything about Source of truth until every surrounding
        requirement had been documented in full.
      why_wrong: It treats uncertainty as a reason for paralysis and offers no bounded
        next step.
  compression:
    prompt: State the source of truth, the replication path, and the signal that tells
      clients data is stale.
    goal: Compress the Source of truth answer into its decision, premise, trade-off,
      and verification step.
  best_answer: The database. The cache and the index are derived views that can be
    rebuilt from it, so if they disagree the database wins and I rebuild them. That
    also tells me the index can lag, but a write must not be acknowledged until the
    database has it.
  distractors:
  - text: They should all be kept in sync so that they hold consistent data, and I
      would make sure updates propagate to all three whenever anything changes in
      the system.
    trap: content
    why_wrong: Wishes away the problem. Distributed components diverge, and the design
      must define who wins when they do.
  - text: The database is the main store and the others are for performance, so it
      would be the one to trust if there were any discrepancies between them at any
      point.
    trap: precision
    why_wrong: Right answer, but "for performance" misses that derived views define
      the recovery and acknowledgement rules.
  - text: The database. The cache and the index are views derived that can be reconstructed
      from it, then if they disagree the database wins and I reconstruct the others.
    trap: grammar
    why_wrong: '"Views derived" inverts the adjective and "reconstruct" is a heavier
      false friend than the natural "rebuild".'
  feedback:
    register: Definitive. This is a question that must be answered, not balanced.
    hedging: None; ambiguity here is a design flaw.
    precision: Derived and rebuildable is the concept; it drives lag and acknowledgement.
    grammar: '"Derived views", "rebuilt from it", "acknowledged".'
    pragmatics: Deriving the acknowledgement rule from the answer shows systems thinking.
  rephrase:
    prompt: State the rule for when a write may be acknowledged, in one sentence.
    goal: Turn a principle into an implementable contract.
  language_focus:
  - precision
  - grammar
  - pragmatics
  feynman:
    concept: Authoritative store versus derived views.
    explain_to: A developer who treats the cache as a second database.
    constraint: Explain using an original document and photocopies.
    self_check: Did you say what may lag and what may not?
    reasoning_check: Can you identify the hidden premise behind Source of truth, give
      a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You promised consistency, or named the database without the rule.
    expected: Database authoritative; cache and index derived and rebuildable.
    actual: A sync aspiration, or a performance-only justification.
    root_cause: Treating divergence as a bug rather than as a normal condition to
      design for.
    repair: For every store in a design, say whether it is truth or a view.
    reasoning_error: If your Source of truth answer failed, classify the mistake as
      a fact, assumption, comparison, failure, or certainty error before proposing
      the smallest repair.
  recall:
    active_recall_cue: What may lag behind the source of truth, and what may not?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Source of truth without presenting
      an assumption as a fact?
    black_box_probe: When the Source of truth answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: system_design-03-source-of-truth-delayed-3
      prompt: >-
        A code inspection confirms the database write path, but replica lag makes a cache-backed
        balance stale during checkout. Which source-of-truth claim survives?
      changed_constraint: >-
        checkout must read an authoritative balance or reject a stale version before charging
      new_evidence: >-
        a trace shows replica lag lets a cache-backed balance reach checkout after the database
        write
      best_answer: >-
        I would keep the database as the write authority, but I would retract any claim that every
        derived read is safe for checkout. I would route the balance check to an authoritative
        version, reject stale reads, and measure lag and reconciliation before widening cache use.
      distractors:
      - text: I would preserve every part of the original Source of truth answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Source of truth explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: chapters/chapter-09-search-indexing-and-permission-aware-retrieval.md
    note: Search index as a derived view of authoritative data.
  - repo: system-design-estudos
    path: decision-contrasts/04-search-index-vs-relational-querying.md
    note: Index versus relational querying contrast.
  extension:
    prompt: >-
      How would I verify a projection rebuild without allowing it to overwrite a newer committed
      business value?
    goal: >-
      Move from the short Source of truth answer to a deep, evidence-led defence without inventing
      an outcome.
  critical_thinking:
    problem_frame: >-
      I need an explicit authority and freshness contract when database rows, cache entries, and
      search documents disagree.
    claim_map:
      fact: The proposed design stores overlapping information in a database, cache, and search
        index.
      inference: Rebuildable copies need a defined upstream authority and a way to identify stale
        versions.
      assumption: I am assuming the database owns accepted mutations and the other stores are projections.
      unknown: >-
        The acknowledgement durability requirement and permissible staleness for each read are unspecified.
    comparison:
      applicable: false
      rejected_alternative: Letting whichever copy responds fastest overwrite the other two during
        a disagreement.
      hard_constraint: >-
        A derived projection cannot redefine an accepted business value merely because its response
        is faster.
      decision_rule: >-
        I would declare the committed record authoritative, rebuild projections from it, and require
        an appropriate authoritative read for decisions that cannot tolerate lag.
    failure_probe:
      kind: counterexample
      prompt: >-
        If search has a newer-looking timestamp but lacks the latest committed revision, what establishes
        the correct value for checkout?
    evidence_check:
      basis: >-
        Check the Source of truth claim against system-design-estudos/chapters/chapter-09-search-indexing-and-permission-aware-retrieval.md
        and the exact interview context; record whether each part is fact, inference, or hypothesis.
      source_kind: authored_scenario
      limitation: >-
        This system design exercise can test reasoning about Source of truth, but it cannot prove
        an unmeasured production outcome, personal ownership, or universal rule.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        A single write authority follows from this proposed design; the safest read path still depends
        on the business freshness requirement.
      update_trigger: >-
        A stale checkout value or an explicitly different write authority would change the read
        routing and reconciliation contract.
    rubric:
      facts_correct: Names which store accepts business changes and which stores hold projections.
      assumptions_explicit: States the assumed write authority and asks about acknowledgement durability.
      alternatives_considered: Rejects fastest-response-wins reconciliation because response time
        is not authority.
      tradeoff_quality: Explains the latency benefit of derived reads alongside their freshness
        cost.
      follow_up_adaptation: >-
        Keeps checkout decisions off a stale projection while preserving the declared write authority.
      certainty_calibration: Uses medium certainty about routing until each read's permissible lag
        is established.

- id: system_design-04-write-path
  version: 1.4.0
  target: system_design
  topic: Write path
  difficulty: 3
  interview_stage: architecture_review
  template: sd-delivery
  prompt: Walk me through what happens when a payment request arrives twice.
  context: Networks retry and clients double-submit, so duplicate requests are normal.
    The interviewer wants the write path described with the duplicate-safety mechanism
    built in.
  follow_up:
    prompt: What idempotency key and state transition prevent a retry from creating
      a second external charge, and where is that decision stored?
    goal: Answer the evidence challenge about Write path while keeping the evidence
      boundary explicit.
    challenge_kind: evidence
    best_answer: >-
      I would store the idempotency key, request fingerprint, status, and response with the
      payment state in the database transaction. A retry with the same fingerprint replays that
      record; a different fingerprint conflicts. I would keep the external charge idempotent or
      reconcile its unknown outcome before allowing another charge.
    distractors:
    - text: I would cite my experience with Write path as enough proof and move on
        without naming an observation.
      why_wrong: Experience can guide a hypothesis, but it does not replace evidence
        tied to this context.
    - text: I would collect every possible metric about Write path before making even
        a provisional recommendation.
      why_wrong: A focused decision can start with one discriminating observation
        rather than an unbounded data request.
  compression:
    prompt: Walk the duplicate payment path through key lookup, durable state, external
      call, and reconciliation.
    goal: Compress the Write path answer into its decision, premise, trade-off, and
      verification step.
  best_answer: >-
    I would require POST /payments to carry an idempotency key and atomically store a request
    fingerprint with a local payment intent. Reusing the key with different input is a
    contract error. I would send a stable key to the provider and persist its outcome before
    replaying a completed result. A 201 can represent the created payment resource with a
    pending status; I would never present that local commit as proof that the external charge
    completed.
  distractors:
  - text: The service checks whether a payment already exists for that order, and
      if it does it returns the existing one rather than creating a duplicate charge
      for the customer. It can return 200 for the existing payment, and authentication,
      rate limiting, and body comparison can be added later once the core duplicate
      check is working reliably.
    trap: content
    why_wrong: A read-then-write check is a race; two concurrent requests can both
      find nothing and both charge.
  - text: We would need idempotency to handle that properly, so the system should
      be designed so that repeating the same request does not have any additional
      effect beyond the first one.
    trap: precision
    why_wrong: Defines idempotency instead of describing the mechanism that implements
      it.
  - text: The client sends one key of idempotency with the request. The first inserts
      a row with this key inside of the transaction, and the second collides in the
      unique index.
    trap: grammar
    why_wrong: '"Key of idempotency", "inside of" and "collides in" are compound-noun
      and preposition errors.'
  feedback:
    register: Sequential and concrete; walk through POST /payments rather than defining
      a property.
    hedging: Use "I would reject" only for the mismatch policy; state the replay path
      plainly.
    precision: Name the idempotency key, the transaction, the first 201 response,
      the stored status and body, and the different-input rejection.
    grammar: '"POST /payments with an idempotency key", "inside the transaction",
      and "replay the original status and body".'
    pragmatics: State that a duplicate receives the original status and body, while
      the same key with different input is a contract error.
  rephrase:
    prompt: In two sentences, describe the first POST /payments response and the replay
      or rejection that a retry receives.
    goal: State the 201/status/body contract and the different-input boundary, not
      just the database mechanism.
  language_focus:
  - precision
  - grammar
  - pragmatics
  feynman:
    concept: Idempotency keys enforced within the write transaction.
    explain_to: A developer whose retry logic double-charged a customer.
    constraint: Explain using a cloakroom ticket, including why the same ticket replays
      the original status and body.
    self_check: Did you include POST /payments, the first 201, and rejection when
      the ticket carries different input?
    reasoning_check: Can you identify the hidden premise behind Write path, give a
      counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You used an existence check, or defined the property.
    expected: POST /payments records the key in the transaction, returns 201, and
      replays the original status and body; different input is rejected.
    actual: A read-then-write guard, or a definition of idempotency.
    root_cause: Reasoning about duplicates sequentially instead of concurrently.
    repair: Trace the first request, a matching replay, and a same-key different-input
      request through the write path.
    reasoning_error: If your Write path answer failed, classify the mistake as a fact,
      assumption, comparison, failure, or certainty error before proposing the smallest
      repair.
  recall:
    active_recall_cue: For POST /payments, what must be stored to replay the 201 status
      and body, and what happens when the key has different input?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Write path without presenting
      an assumption as a fact?
    black_box_probe: When the Write path answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: system_design-04-write-path-delayed-4
      prompt: >-
        A provider timeout leaves the charge outcome unknown, and a retry arrives with the same key
        but a different request body. Which idempotency claim is no longer safe?
      changed_constraint: >-
        the payment API must distinguish an unknown external outcome from a changed request and
        prevent a second charge
      new_evidence: >-
        the provider timed out after accepting or possibly accepting the charge and the retry
        fingerprint differs
      best_answer: >-
        I would keep same-fingerprint replay, but I would retract any automatic retry or assumption
        that a timeout means no charge occurred. I would reject the changed fingerprint, reconcile
        the provider outcome by idempotency key, and store an explicit unknown state before allowing
        a new business action.
      distractors:
      - text: I would preserve every part of the original Write path answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Write path explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: chapters/chapter-03-idempotent-writes-under-ambiguous-failure.md
    note: Idempotent write path under ambiguous failure.
  - repo: system-design-estudos
    path: real-world-cases/03-async-workflows-and-payments/stripe-idempotent-payments/README.md
    note: Payment idempotency case referenced by path, not copied.
  extension:
    prompt: >-
      How would I test a crash after provider acceptance but before the local result is saved, while
      preserving the same payment intent?
    goal: >-
      Move from the short Write path answer to a deep, evidence-led defence without inventing an
      outcome.
  critical_thinking:
    problem_frame: >-
      I need duplicate payment requests to refer to one business operation while separating database
      atomicity from the provider's external effect.
    claim_map:
      fact: >-
        Clients may retry or double-submit, so more than one HTTP request can represent the same
        payment intent.
      inference: >-
        A provider timeout can leave the charge outcome unresolved even when no successful response
        reaches the caller.
      assumption: >-
        I am assuming a stable operation key and a provider lookup or deduplication contract are
        available.
      unknown: >-
        Provider key retention, replayable error behavior, and recovery after a crash still need
        definition.
    comparison:
      applicable: true
      alternatives:
      - option: Persist intent, then execute through a recoverable worker
        benefit: Keeps the local acceptance boundary short and makes pending work visible.
        cost_or_risk: Adds queue ownership, status polling, and a reconciliation path for uncertain
          effects.
        valid_when: The product can represent a pending payment and durable dispatch is available.
      - option: Call the provider within the request's bounded lifetime
        benefit: Can return a completed provider outcome directly when it arrives promptly.
        cost_or_risk: Timeouts still require a durable intent, stable provider key, and later reconciliation.
        valid_when: Latency permits the call and the API explicitly represents unresolved outcomes.
      decision_rule: >-
        I would preserve request identity and reject changed input in either design; I would choose
        synchronous or asynchronous execution from latency and pending-state requirements.
    failure_probe:
      kind: failure_mode
      prompt: >-
        If the provider accepts a charge and the process crashes before recording the result, what
        stops a retry from submitting a new charge?
    evidence_check:
      basis: >-
        Check the Write path claim against system-design-estudos/chapters/chapter-03-idempotent-writes-under-ambiguous-failure.md
        and the exact interview context; record whether each part is fact, inference, or hypothesis.
      source_kind: authored_scenario
      limitation: >-
        This system design exercise can test reasoning about Write path, but it cannot prove an
        unmeasured production outcome, personal ownership, or universal rule.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        Duplicate safety needs both local replay control and the provider contract; a local transaction
        alone cannot prove the external result.
      update_trigger: >-
        A provider without stable replay keys, an expired key, or a changed request fingerprint
        changes the permitted recovery action.
    rubric:
      facts_correct: Separates a durable local intent from the external payment effect and its observed
        result.
      assumptions_explicit: States assumptions about provider idempotency, retention, and status
        lookup.
      alternatives_considered: >-
        Compares synchronous completion with recoverable asynchronous work without dropping replay
        safety.
      tradeoff_quality: Explains pending-state complexity versus request latency and timeout exposure.
      follow_up_adaptation: >-
        Rejects changed input and reconciles an ambiguous charge instead of treating timeout as
        failure.
      certainty_calibration: Uses medium certainty until provider replay and crash-recovery behavior
        are demonstrated.

- id: system_design-05-read-path-caching
  version: 1.4.0
  target: system_design
  topic: Read path
  difficulty: 2
  interview_stage: architecture_review
  template: sd-delivery
  prompt: Your cache node just died at peak traffic. What happens next?
  context: A failure question about a component candidates usually present as pure
    benefit. The interviewer wants to know whether you have thought about the moment
    it disappears.
  follow_up:
    prompt: If the cache disappears, which requests can hit durable storage, and what
      protection keeps the database from becoming the next outage?
    goal: Answer the alternative challenge about Read path while keeping the evidence
      boundary explicit.
    challenge_kind: alternative
    best_answer: >-
      I would admit only bounded origin work after a cache loss, coalesce identical misses, and
      shed or rate-limit lower-priority requests. I would protect the database with a concurrency
      limit and watch origin latency, connection use, and error rate before restoring broad cache
      fills.
    distractors:
    - text: I would defend the first Read path option because offering an alternative
        might make the decision look uncertain.
      why_wrong: A comparison makes the decision rule visible; it does not weaken
        a well-calibrated recommendation.
    - text: I would list every conceivable Read path design without saying which requirement
        should decide between them.
      why_wrong: An option list without a decision rule avoids the trade-off the follow-up
        is testing.
  compression:
    prompt: Summarize cache failure handling as fallback, load shedding, and the consistency
      trade-off you accept.
    goal: Compress the Read path answer into its decision, premise, trade-off, and
      verification step.
  best_answer: >-
    If cache misses or failures fall straight through to the database, peak demand can
    overwhelm the origin. I would coalesce identical lookups, bound total origin concurrency,
    and define which excess requests can wait, receive a stale value, or fail explicitly.
    Coalescing one key does not protect me from many distinct misses, and stale serving only
    works if a suitable copy is still available.
  distractors:
  - text: The requests would fall back to the database, which would be slower but
      the system would keep working, and then the cache would warm up again once it
      comes back online.
    trap: content
    why_wrong: Assumes graceful degradation. If the database were sized for full traffic
      the cache would not have been necessary.
  - text: We would see increased latency and load on the database, so it would be
      important to have monitoring in place to detect that situation quickly and respond
      to it.
    trap: precision
    why_wrong: Observes the symptom and proposes alerting rather than a design that
      survives the event.
  - text: All the requests that were being served of the cache go to the database
      at the same time, that is a herd thundering for which the database was never
      dimensioned.
    trap: grammar
    why_wrong: '"Served of", post-posed "herd thundering" and "dimensioned" as a false
      friend all break the sentence.'
  feedback:
    register: Sober about failure. Caches are load-bearing, so say so.
    hedging: None; the herd behaviour is predictable.
    precision: Coalescing and headroom are concrete; "monitoring" is not a mitigation.
    grammar: '"Served from the cache", "a thundering herd", "sized for".'
    pragmatics: Naming the mitigation converts an observation into a design.
  rephrase:
    prompt: Explain what you would set the origin concurrency limit to, and why.
    goal: Push the mitigation to a concrete parameter.
  language_focus:
  - precision
  - grammar
  - pragmatics
  pt_help: '"Dimensionar" e "size" ou "capacity plan". "Dimension" nao se usa assim.'
  feynman:
    concept: Thundering herd on cache loss and request coalescing.
    explain_to: A developer who added a cache purely for speed.
    constraint: Explain using a motorway losing a lane at rush hour.
    self_check: Did you say why the database cannot simply absorb it?
    reasoning_check: Can you identify the hidden premise behind Read path, give a
      counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You assumed graceful fallback, or proposed monitoring.
    expected: Thundering herd, coalescing, deliberate origin headroom.
    actual: A degradation assumption, or an alerting plan.
    root_cause: Caches modelled as optimisations rather than as capacity dependencies.
    repair: For every cache, state what breaks the moment it is empty.
    reasoning_error: If your Read path answer failed, classify the mistake as a fact,
      assumption, comparison, failure, or certainty error before proposing the smallest
      repair.
  recall:
    active_recall_cue: What protects the origin when a cache disappears?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Read path without presenting
      an assumption as a fact?
    black_box_probe: When the Read path answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: system_design-05-read-path-caching-delayed-5
      prompt: >-
        A cache-loss test shows request coalescing still overloads the database because many
        distinct keys miss at once. Which read-path protection is incomplete?
      changed_constraint: >-
        origin work must remain bounded across both identical and distinct cache misses
      new_evidence: >-
        a cache outage produces a broad miss storm whose keys do not coalesce
      best_answer: >-
        I would keep coalescing identical keys, but I would retract it as a complete cache-loss
        protection. I would add an origin concurrency budget, admission or stale serving for
        distinct misses, and verify database latency and connection saturation under a broad miss
        storm.
      distractors:
      - text: I would preserve every part of the original Read path answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Read path explanation with a new design without
          identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/11-operational-playbooks/playbooks/cache-hot-key-and-origin-protection.md
    note: Hot key and origin protection playbook.
  - repo: system-design-estudos
    path: decision-contrasts/01-read-replica-vs-cache-aside.md
    note: Replica versus cache-aside contrast.
  extension:
    prompt: >-
      If no stale copy survives the cache outage, which requests would I prioritize, reject, or
      delay to protect the origin?
    goal: >-
      Move from the short Read path answer to a deep, evidence-led defence without inventing an
      outcome.
  critical_thinking:
    problem_frame: >-
      I need to keep durable storage within its capacity when a cache failure exposes peak read
      demand.
    claim_map:
      fact: >-
        The cache has failed during a peak-traffic interval; the origin's spare capacity is not
        specified.
      inference: >-
        Coalescing repeated requests for one key does not bound simultaneous misses for different
        keys.
      assumption: >-
        I am assuming some reads may be delayed, rejected, or served stale under an explicit product
        policy.
      unknown: The origin concurrency budget, key diversity, and permitted stale-read window are
        unknown.
    comparison:
      applicable: true
      alternatives:
      - option: Bound origin concurrency and reject excess misses
        benefit: Protects database resources even when every miss uses a different key.
        cost_or_risk: Some requests receive an explicit failure or retry instruction during overload.
        valid_when: Freshness is required and demand can exceed the database's safe concurrency.
      - option: Serve bounded stale values for eligible reads
        benefit: Reduces origin demand while preserving a degraded read experience.
        cost_or_risk: Requires a retained stale copy and a clear limit on acceptable outdated data.
        valid_when: The product permits staleness and an accessible stale value actually exists.
      decision_rule: >-
        I would always bound origin work, then serve stale data only for eligible reads with an
        available copy; otherwise I would reject or delay excess demand.
    failure_probe:
      kind: failure_mode
      prompt: >-
        If every incoming request misses a different key and the cache node is unavailable, which
        mechanism actually caps database work?
    evidence_check:
      basis: >-
        Check the Read path claim against system-design-estudos/areas/11-operational-playbooks/playbooks/cache-hot-key-and-origin-protection.md
        and the exact interview context; record whether each part is fact, inference, or hypothesis.
      source_kind: authored_scenario
      limitation: >-
        This system design exercise can test reasoning about Read path, but it cannot prove an unmeasured
        production outcome, personal ownership, or universal rule.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        The overload mechanism is plausible, but safe concurrency and stale-serving eligibility
        require workload and product evidence.
      update_trigger: >-
        A broad-miss test that saturates connections requires a lower admission budget or a different
        degraded response.
    rubric:
      facts_correct: Distinguishes identical-key coalescing from a global limit on origin requests.
      assumptions_explicit: Checks whether stale values remain accessible and whether the product
        permits their use.
      alternatives_considered: Compares explicit rejection with eligible stale serving under the
        same capacity limit.
      tradeoff_quality: Connects availability and freshness costs to protection of the durable database.
      follow_up_adaptation: Adds admission control when distinct misses defeat coalescing alone.
      certainty_calibration: >-
        Uses medium certainty and validates the budget with origin latency and connection saturation.

- id: system_design-06-failure-modes
  version: 1.4.0
  target: system_design
  topic: Failure modes
  difficulty: 3
  interview_stage: deep_dive
  template: sd-incident
  prompt: The payment provider is timing out in production. What do you do first?
  context: A live incident scenario. The interviewer wants the impact-first structure,
    because the ordering of your response reveals whether you have handled a real
    outage.
  follow_up:
    prompt: Which customer impact and safety signal would you establish before changing
      retries, and how would you reconcile unknown provider outcomes?
    goal: Answer the failure challenge about Failure modes while keeping the evidence
      boundary explicit.
    challenge_kind: failure
    best_answer: >-
      I would correlate checkout failures and pending payment age with provider errors, queue
      depth, and duplicate-charge signals. I would use the original provider idempotency key
      or a status query to reconcile uncertain outcomes. Before changing retries, I would
      confirm the budget and whether pending orders are allowed, then test that a later
      successful response cannot trigger a second capture.
    distractors:
    - text: I would describe the Failure modes failure as impossible because the happy
        path already passed its test.
      why_wrong: Passing a happy path does not test the boundary, failure mode, or
        recovery being challenged.
    - text: I would add retries to Failure modes immediately and assume the system
        would become reliable.
      why_wrong: Retries can amplify load or duplicate effects; the failure and containment
        policy must be specified first.
  compression:
    prompt: Frame the timeout response as containment, evidence, retry policy, and
      reconciliation of uncertain state.
    goal: Compress the Failure modes answer into its decision, premise, trade-off,
      and verification step.
  best_answer: >-
    I would establish the customer impact and which payment outcomes remain unknown, then stop
    retries that amplify the provider failure. If the product permits it, I would preserve an
    order intent as explicitly pending; otherwise I would refuse new attempts clearly. I would
    never mark an order paid or resubmit an uncertain charge merely because a request timed
    out.
  distractors:
  - text: I would investigate the root cause of the timeouts by looking at the logs
      and traces to understand exactly why the provider is failing to respond within
      the expected time.
    trap: pragmatics
    why_wrong: Diagnosis before containment. During an incident, stopping the bleeding
      precedes understanding it.
  - text: I would increase the timeout and add more retries so that the requests have
      a better chance of succeeding while the provider is having problems on their
      side.
    trap: content
    why_wrong: Amplifies load on a struggling dependency, which is the textbook way
      to turn degradation into a full outage.
  - text: 'First the impact: the checkout is the path critical, then I protect the
      capacity of accept orders even if the capture stays delayed for some time.'
    trap: grammar
    why_wrong: '"Path critical", "the capacity of accept" and the dangling clause
      all break the response under pressure.'
  feedback:
    register: Calm and ordered. Incident language is sequenced, never exploratory.
    hedging: None; state what you protect first.
    precision: Naming retry amplification shows you know how outages escalate.
    grammar: '"The critical path", "the ability to accept orders", "already failing".'
    pragmatics: Impact, protection, signal, mitigation is the expected order.
  rephrase:
    prompt: Give the same answer as a message in an incident channel.
    goal: Practise written incident register under time pressure.
  language_focus:
  - pragmatics
  - grammar
  - precision
  pt_help: 'Adjetivo antes do substantivo: "the critical path", nunca "the path critical".'
  feynman:
    concept: Containment before diagnosis during an incident.
    explain_to: An engineer whose instinct is to read logs first.
    constraint: Explain using a burst pipe in a house.
    self_check: Did you protect something before investigating anything?
    reasoning_check: Can you identify the hidden premise behind Failure modes, give
      a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You investigated first, or increased retries.
    expected: Impact, protection, first signals, stop amplifying retries.
    actual: Root-cause analysis, or retry escalation.
    root_cause: Incident response practised as debugging rather than as triage.
    repair: Rehearse the seven-step incident template until the order is automatic.
    reasoning_error: If your Failure modes answer failed, classify the mistake as
      a fact, assumption, comparison, failure, or certainty error before proposing
      the smallest repair.
  recall:
    active_recall_cue: What comes before diagnosis in an incident?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Failure modes without presenting
      an assumption as a fact?
    black_box_probe: When the Failure modes answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: system_design-06-failure-modes-delayed-6
      prompt: >-
        Provider errors are ambiguous and the queue now exceeds its retry budget while checkout
        acceptance remains critical. Which failure-mode conclusion would you narrow?
      changed_constraint: >-
        checkout must remain available without unbounded retries or duplicate capture during
        ambiguous provider outcomes
      new_evidence: >-
        provider responses are ambiguous and retry queue depth exceeds the defined budget
      best_answer: >-
        I would stop the exhausted retry loop and park uncertain outcomes for reconciliation
        using their original operation identities. I would keep order acceptance only as an
        explicitly pending state under the agreed product policy, and show that status to the
        customer. I would verify duplicate-capture protection and queue-drain capacity before
        resuming bounded retries.
      distractors:
      - text: I would preserve every part of the original Failure modes answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Failure modes explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/01-metodo-e-entrevistas/snippets/senior-production-answer-template.md
    note: Senior production answer template used as the response spine.
  - repo: system-design-estudos
    path: chapters/chapter-05-durable-workflows-retries-and-compensation.md
    note: Retry and compensation behaviour under failure.
  extension:
    prompt: >-
      What would I tell a customer whose payment is unresolved, and which evidence lets me safely
      change that status?
    goal: >-
      Move from the short Failure modes answer to a deep, evidence-led defence without inventing
      an outcome.
  critical_thinking:
    problem_frame: >-
      I need to contain payment-provider timeouts without duplicating charges or misrepresenting
      an unconfirmed order as paid.
    claim_map:
      fact: >-
        The provider is timing out during live checkout; successful and failed charge outcomes may
        be indistinguishable to the caller.
      inference: >-
        Unbounded retries can increase dependency load while multiplying unresolved payment attempts.
      assumption: >-
        I am assuming the product may accept an order intent in a clearly pending state; that policy
        needs confirmation.
      unknown: >-
        Affected customers, provider status, duplicate risk, retry budget, and pending-order policy
        are not yet established.
    comparison:
      applicable: true
      alternatives:
      - option: Accept an explicitly pending order intent
        benefit: Preserves a recoverable customer intent while payment confirmation is delayed.
        cost_or_risk: Needs inventory policy, clear customer messaging, expiry, and reconciliation
          ownership.
        valid_when: The business permits unpaid pending orders and can avoid fulfilling them as
          paid.
      - option: Temporarily refuse new payment attempts
        benefit: Limits new uncertainty when safe pending-state handling is unavailable.
        cost_or_risk: Customers cannot complete checkout during the affected interval.
        valid_when: Payment confirmation is mandatory before acceptance or recovery capacity is
          exhausted.
      decision_rule: >-
        I would establish impact and payment safety first, then preserve a pending intent only under
        an agreed policy; otherwise I would fail explicitly and protect recovery capacity.
    failure_probe:
      kind: failure_mode
      prompt: >-
        If a customer retries after a timeout while the original charge later succeeds, which state
        and key prevent duplicate capture?
    evidence_check:
      basis: >-
        Check the Failure modes claim against system-design-estudos/areas/01-metodo-e-entrevistas/snippets/senior-production-answer-template.md
        and the exact interview context; record whether each part is fact, inference, or hypothesis.
      source_kind: authored_scenario
      limitation: >-
        This system design exercise can test reasoning about Failure modes, but it cannot prove
        an unmeasured production outcome, personal ownership, or universal rule.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        Timeouts establish uncertainty, not a failed charge; the acceptable degraded checkout behavior
        is a product decision.
      update_trigger: >-
        Confirmed duplicate charges, an exhausted queue budget, or a prohibition on unpaid orders
        changes the containment choice.
    rubric:
      facts_correct: Reports customer impact and distinguishes confirmed, failed, and unresolved
        payments.
      assumptions_explicit: >-
        Confirms whether pending orders are allowed instead of promising order acceptance universally.
      alternatives_considered: Compares pending acceptance with explicit refusal under the same
        payment-safety constraints.
      tradeoff_quality: Explains conversion loss versus inventory, messaging, and reconciliation
        responsibilities.
      follow_up_adaptation: Caps retry amplification and parks uncertain outcomes when the queue
        budget is exhausted.
      certainty_calibration: >-
        Uses medium certainty until provider status and customer-impact signals establish the next
        action.

- id: system_design-07-tradeoff-defence
  version: 1.4.0
  target: system_design
  topic: Trade-offs
  difficulty: 3
  interview_stage: architecture_review
  template: sd-delivery
  prompt: Why not just use a simpler solution here?
  context: You proposed an event backbone. The interviewer is testing whether you
    can defend complexity honestly, including admitting when the simpler option would
    in fact be right.
  follow_up:
    prompt: What measurable benefit does this complexity buy, and under which traffic
      or failure assumption would you choose the simpler design?
    goal: Answer the new_evidence challenge about Trade-offs while keeping the evidence
      boundary explicit.
    challenge_kind: new_evidence
    best_answer: >-
      I would compare the backbone cost with the number of consumers, delivery guarantees, replay
      needs, and current traffic. I would choose the simpler point-to-point design while those
      constraints stay small, then move when measured integration count or failure isolation makes
      the operational cost of simplicity larger.
    distractors:
    - text: I would keep the Trade-offs recommendation unchanged because changing
        position would look inconsistent.
      why_wrong: A defensible answer updates when relevant evidence changes an assumption
        or trade-off.
    - text: I would discard every earlier Trade-offs claim as soon as one new observation
        appeared.
      why_wrong: New evidence may narrow one claim while leaving other verified facts
        intact.
  compression:
    prompt: Defend the trade-off with benefit, cost, trigger condition, and the experiment
      that could change your mind.
    goal: Compress the Trade-offs answer into its decision, premise, trade-off, and
      verification step.
  best_answer: >-
    I would ship the simpler design while it meets the current delivery and recovery contract.
    I would justify an event backbone through a concrete need such as independent consumer
    recovery or retained replay, then weigh that against broker operations, duplicate
    handling, and schema coordination. More consumers can increase integration cost, but I
    would not use a fixed consumer count as the decision rule.
  distractors:
  - text: Because the simpler solution would not scale as the system grows, and it
      is better to build the right architecture from the start rather than have to
      migrate everything later on.
    trap: content
    why_wrong: Speculative future-proofing, which is how teams pay complexity costs
      for load that never arrives.
  - text: You are right, we could probably use something simpler for now, it would
      likely be sufficient for the requirements we have discussed so far in this conversation.
    trap: hedging
    why_wrong: Abandons the proposal at the first challenge without naming when it
      would become correct.
  - text: For the volume of today the option simpler would be sufficient and I would
      probably ship it, but I would pass to the backbone when we have more than two
      consumers of the same events.
    trap: grammar
    why_wrong: '"Volume of today", "option simpler" and "pass to" invert English modifier
      order and idiom.'
  feedback:
    register: Honest and secure. Conceding correctly is a seniority signal.
    hedging: None; give the threshold instead of softening the position.
    precision: '"More than two consumers" is a testable trigger, unlike "as it grows".'
    grammar: '"Today''s volume", "the simpler option", "move to the backbone".'
    pragmatics: Agreeing while keeping the condition keeps authority intact.
  rephrase:
    prompt: State the threshold as something a team could put in a ticket.
    goal: Convert judgement into an operational trigger.
  language_focus:
  - precision
  - grammar
  - hedging
  feynman:
    concept: Complexity justified by a measurable threshold.
    explain_to: An architect who designs for hypothetical scale.
    constraint: Explain using when a family needs a second car.
    self_check: Is your threshold observable without guessing?
    reasoning_check: Can you identify the hidden premise behind Trade-offs, give a
      counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You defended by future scale, or capitulated entirely.
    expected: Concede for now, with a measurable trigger to escalate.
    actual: Future-proofing, or immediate retreat.
    root_cause: Treating a challenge as either an attack or a verdict.
    repair: Answer complexity challenges with a number, not a prediction.
    reasoning_error: If your Trade-offs answer failed, classify the mistake as a fact,
      assumption, comparison, failure, or certainty error before proposing the smallest
      repair.
  recall:
    active_recall_cue: What makes a complexity threshold credible?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Trade-offs without presenting
      an assumption as a fact?
    black_box_probe: When the Trade-offs answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: system_design-07-tradeoff-defence-delayed-7
      prompt: >-
        A second consumer and replay requirement appear, but measured traffic remains small. Which
        simplicity claim survives and what cost now justifies a backbone?
      changed_constraint: >-
        the design must support independent consumers and replay without multiplying point-to-point
        recovery work
      new_evidence: >-
        the system now has multiple consumers and replay needs even though current traffic is modest
      best_answer: >-
        I would keep traffic volume as a reason to avoid unnecessary scale, but I would retract it
        as the only decision rule. Independent consumers and replay now justify measuring a backbone
        for ownership and recovery cost, and I would compare that operational benefit with the new
        infrastructure burden.
      distractors:
      - text: I would preserve every part of the original Trade-offs answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Trade-offs explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: decision-contrasts/06-queue-vs-event-backbone.md
    note: Queue versus event backbone decision contrast.
  - repo: system-design-estudos
    path: chapters/chapter-04-event-backbone-partitions-and-consumer-scale.md
    note: Consumer scale reasoning behind the threshold.
  extension:
    prompt: >-
      If traffic stays low but replay becomes mandatory, how would I compare durable direct dispatch
      with a broker?
    goal: >-
      Move from the short Trade-offs answer to a deep, evidence-led defence without inventing an
      outcome.
  critical_thinking:
    problem_frame: >-
      I need to justify an event backbone by delivery, replay, ownership, or recovery needs rather
      than its name or a fixed consumer-count threshold.
    claim_map:
      fact: >-
        The candidate proposed an event backbone and the interviewer asks whether a simpler design
        would suffice.
      inference: >-
        Additional consumers can increase integration coordination, but their count alone does not
        establish broker value.
      assumption: >-
        I am assuming current demand can fit the simpler design until delivery or recovery requirements
        show otherwise.
      unknown: >-
        Replay retention, independent failure handling, ordering needs, and operational ownership
        are unspecified.
    comparison:
      applicable: true
      alternatives:
      - option: Keep direct integration with explicit retry ownership
        benefit: Has fewer running components and can be easier for a small team to operate.
        cost_or_risk: Producer and consumer recovery may remain coupled as independent integrations
          grow.
        valid_when: The delivery contract is simple and measured coordination cost remains manageable.
      - option: Introduce a durable event backbone with owned consumers
        benefit: Supports independent consumption and replay under an explicit event contract.
        cost_or_risk: >-
          Adds broker operations, lag monitoring, schema evolution, and duplicate-handling responsibilities.
        valid_when: Replay or independent recovery repays those costs and someone owns the infrastructure.
      decision_rule: >-
        I would use the simpler path while it meets delivery and recovery needs, then introduce
        a backbone only when a concrete requirement justifies its operational burden.
    failure_probe:
      kind: counterexample
      prompt: >-
        With only two consumers but a mandatory replay window, what can the direct design recover
        and at what maintenance cost?
    evidence_check:
      basis: >-
        Check the Trade-offs claim against system-design-estudos/decision-contrasts/06-queue-vs-event-backbone.md
        and the exact interview context; record whether each part is fact, inference, or hypothesis.
      source_kind: authored_scenario
      limitation: >-
        This system design exercise can test reasoning about Trade-offs, but it cannot prove an
        unmeasured production outcome, personal ownership, or universal rule.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        Current simplicity is a provisional fit; replay and recovery requirements matter more than
        an arbitrary number of consumers.
      update_trigger: >-
        A mandatory replay window, independent outage recovery, or measured integration-maintenance
        cost can justify a different boundary even at low traffic.
    rubric:
      facts_correct: Names the delivery or recovery requirement that the proposed backbone serves.
      assumptions_explicit: Asks about replay, ordering, retention, and infrastructure ownership.
      alternatives_considered: Compares direct integration with a durable backbone without a fixed
        consumer-count rule.
      tradeoff_quality: Balances independent recovery against broker operations and event-contract
        maintenance.
      follow_up_adaptation: Reconsiders a low-volume direct design when replay becomes mandatory.
      certainty_calibration: Uses medium certainty until the operational requirement and ownership
        are explicit.

- id: system_design-08-rails-mapping
  version: 1.4.0
  target: system_design
  topic: Rails mapping
  difficulty: 2
  interview_stage: architecture_review
  template: sd-delivery
  prompt: How would this design actually look in the stack you know best?
  context: An invitation to ground the architecture in something concrete. The interviewer
    wants to check that your design is buildable, not just diagrammable.
  follow_up:
    prompt: Which Rails boundary would own the API contract, persistence transaction,
      and asynchronous work without making the controller a coordinator?
    goal: Answer the assumption challenge about Rails mapping while keeping the evidence
      boundary explicit.
    challenge_kind: assumption
    best_answer: >-
      I would keep request validation and response shaping in the controller, the payment
      transaction in a service or model boundary, and provider work in a job. I would make the
      unique idempotency index and retry policy explicit so the controller does not coordinate
      asynchronous state.
    distractors:
    - text: I would repeat my original Rails mapping answer with more confidence because
        the interviewer probably assumes the usual case.
      why_wrong: It hides the premise instead of checking whether the usual case is
        actually part of this problem.
    - text: I would stop proposing anything about Rails mapping until every surrounding
        requirement had been documented in full.
      why_wrong: It treats uncertainty as a reason for paralysis and offers no bounded
        next step.
  compression:
    prompt: 'Map the design to Rails in four beats: request, domain boundary, durable
      data, and job or event.'
    goal: Compress the Rails mapping answer into its decision, premise, trade-off,
      and verification step.
  best_answer: As a Rails application it is a controller that validates and enqueues,
    a job that talks to the provider, and Postgres as the source of truth with the
    idempotency key as a unique index. The parts I would watch are connection pool
    limits and job retry behaviour.
  distractors:
  - text: I would build it with microservices so that each part can scale independently,
      with a message broker between them and separate databases for each service in
      the system.
    trap: content
    why_wrong: Answers with an architectural style rather than mapping the design
      onto a stack, and adds distribution nobody asked for.
  - text: It would map reasonably well onto a standard web framework with a database
      and a background job system handling the asynchronous parts of the workflow.
    trap: precision
    why_wrong: Generic to the point of saying nothing; no component, constraint or
      risk is named.
  - text: Like a Rails application it is one controller that validates and puts in
      queue, one job that talks with the provider, and Postgres like source of truth
      with the key in a unique index.
    trap: grammar
    why_wrong: '"Like" for "as", "puts in queue" and "talks with" are three idiom
      errors that reduce fluency.'
  feedback:
    register: Concrete and buildable. Name real components.
    hedging: None; you were asked about your own stack.
    precision: Naming pool limits and retry behaviour shows operational awareness.
    grammar: '"As a Rails application", "enqueues", "talks to the provider".'
    pragmatics: Volunteering what you would watch pre-empts the risk question.
  rephrase:
    prompt: Name the first thing that would break at ten times the load.
    goal: Connect the mapping to the scaling story.
  language_focus:
  - precision
  - grammar
  - pragmatics
  pt_help: '"Como" no sentido de funcao e "as", nao "like": "as a Rails application".'
  feynman:
    concept: Mapping an abstract design onto a concrete stack.
    explain_to: A candidate who designs only in boxes and arrows.
    constraint: Name no technology you have not used.
    self_check: Did you name a limit specific to your stack?
    reasoning_check: Can you identify the hidden premise behind Rails mapping, give
      a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You proposed microservices, or stayed generic.
    expected: Concrete components plus stack-specific constraints.
    actual: An architectural style, or a framework-agnostic sketch.
    root_cause: Designing at a level of abstraction that avoids commitment.
    repair: Ground every design in components you have personally operated.
    reasoning_error: If your Rails mapping answer failed, classify the mistake as
      a fact, assumption, comparison, failure, or certainty error before proposing
      the smallest repair.
  recall:
    active_recall_cue: Which two Rails-specific limits matter in this design?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Rails mapping without presenting
      an assumption as a fact?
    black_box_probe: When the Rails mapping answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: system_design-08-rails-mapping-delayed-8
      prompt: >-
        A code inspection confirms the Rails controller and job boundaries, but provider retries
        show duplicate effects and the connection pool saturates. Which mapping assumption is no
        longer safe?
      changed_constraint: >-
        the Rails path must preserve idempotency under retry and stay within a measured
        connection-pool budget
      new_evidence: >-
        retry traces show duplicate provider effects and pool metrics show saturation at the job
        concurrency
      best_answer: >-
        I would keep the controller, durable payment state, and job responsibilities separate,
        but the duplicate effects show that a local unique index is not sufficient. I would
        verify a stable provider idempotency key and reconcile uncertain outcomes before
        retrying. I would also limit worker concurrency to the measured database pool budget
        and test duplicate delivery, crash recovery, and pool exhaustion separately.
      distractors:
      - text: I would preserve every part of the original Rails mapping answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Rails mapping explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/01-metodo-e-entrevistas/snippets/system-design-interview-checklist.md
    note: Rails-first reading section of the checklist.
  - repo: system-design-estudos
    path: real-world-cases/01-platforms-and-apps/github-rails-and-mysql-at-scale/README.md
    note: Rails at scale case referenced by path, not copied.
  extension:
    prompt: >-
      Which crash test would distinguish a durable payment intent from a reliably dispatched provider
      operation in this Rails design?
    goal: >-
      Move from the short Rails mapping answer to a deep, evidence-led defence without inventing
      an outcome.
  critical_thinking:
    problem_frame: >-
      I need to map the API, durable state, dispatch, and provider effect into Rails boundaries
      without mistaking framework structure for payment safety.
    claim_map:
      fact: The interviewer asks for an implementable Rails version of the proposed payment design.
      inference: >-
        A controller, job, and database can separate responsibilities while still leaving a commit-to-enqueue
        or provider-retry gap.
      assumption: I am assuming a database-backed payment intent and an explicitly recoverable dispatch
        path.
      unknown: >-
        Queue storage, transaction coupling, worker concurrency, pool capacity, and provider retry
        guarantees remain unspecified.
    comparison:
      applicable: true
      alternatives:
      - option: Commit intent and dispatch metadata in one database boundary
        benefit: Makes accepted work discoverable after a crash and supports recovery of undispatched
          intent.
        cost_or_risk: Requires a worker or relay plus monitoring for delayed dispatch and duplicate
          delivery.
        valid_when: The transaction can persist the payment intent and its dispatch record atomically.
      - option: Enqueue after commit with a reconciliation mechanism
        benefit: Keeps the request transaction separate from later queue interaction.
        cost_or_risk: A failure between commit and enqueue still needs detection and recovery.
        valid_when: The queue is separate and missing dispatch can be reliably found and repaired.
      decision_rule: >-
        I would keep HTTP shaping, durable state, and provider work explicit; I would select dispatch
        from the actual queue transaction model and prove crash recovery.
    failure_probe:
      kind: failure_mode
      prompt: >-
        If the process exits after saving payment intent but before enqueue succeeds, how does the
        Rails system find the undispatched operation?
    evidence_check:
      basis: >-
        Check the Rails mapping claim against system-design-estudos/areas/01-metodo-e-entrevistas/snippets/system-design-interview-checklist.md
        and the exact interview context; record whether each part is fact, inference, or hypothesis.
      source_kind: authored_scenario
      limitation: >-
        This system design exercise can test reasoning about Rails mapping, but it cannot prove
        an unmeasured production outcome, personal ownership, or universal rule.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        The responsibility split is useful, but duplicate safety and durability depend on the concrete
        database, queue, and provider contracts.
      update_trigger: >-
        An enqueue gap, duplicate provider effect, or exhausted connection pool requires a change
        to recovery or concurrency rather than a new controller abstraction.
    rubric:
      facts_correct: >-
        Distinguishes HTTP response handling, durable payment state, dispatch, and external execution.
      assumptions_explicit: Asks whether queue writes share the transaction and whether provider
        retries are idempotent.
      alternatives_considered: Compares atomic dispatch records with after-commit enqueue plus reconciliation.
      tradeoff_quality: Explains recovery ownership and pool pressure alongside short request transactions.
      follow_up_adaptation: >-
        Adds provider replay protection and bounds workers when duplicate effects and pool saturation
        appear.
      certainty_calibration: >-
        Uses medium certainty until crash, duplicate-delivery, and pool-exhaustion behavior are
        tested.

- id: system_design-09-consistency-choice
  version: 1.4.0
  target: system_design
  topic: Consistency
  difficulty: 3
  interview_stage: deep_dive
  template: sd-delivery
  prompt: Can this part of the system tolerate eventual consistency?
  context: A feed shows content counts alongside a balance display. The interviewer
    wants you to separate the two rather than answer for the system as a whole.
  follow_up:
    prompt: Which user-visible invariant must hold during lag, and where could eventual
      consistency make the product misleading?
    goal: Answer the evidence challenge about Consistency while keeping the evidence
      boundary explicit.
    challenge_kind: evidence
    best_answer: >-
      I would protect the no-overspending invariant at the debit or reservation boundary,
      including concurrent requests. For displays, I would agree on a permitted lag and avoid
      presenting an old value as freshly confirmed. I would test both concurrent debits and
      delayed projections because they expose different correctness failures.
    distractors:
    - text: I would cite my experience with Consistency as enough proof and move on
        without naming an observation.
      why_wrong: Experience can guide a hypothesis, but it does not replace evidence
        tied to this context.
    - text: I would collect every possible metric about Consistency before making
        even a provisional recommendation.
      why_wrong: A focused decision can start with one discriminating observation
        rather than an unbounded data request.
  compression:
    prompt: Explain the consistency choice with invariant, stale window, and a mitigation
      the user can understand.
    goal: Compress the Consistency answer into its decision, premise, trade-off, and
      verification step.
  best_answer: >-
    I would separate display freshness from the spending decision. A view count may tolerate a
    stated delay, and even a balance display may be labeled with its freshness if the product
    allows it. A debit must enforce available funds atomically at the authoritative boundary;
    a fresh read alone cannot prevent two concurrent requests from overspending. I would agree
    on each field's freshness promise before choosing its read path.
  distractors:
  - text: Yes, eventual consistency is fine for most user-facing features since the
      delay is usually small enough that users will not notice it in practice.
    trap: content
    why_wrong: Applies one answer to the whole system, which is exactly the mistake
      the question is designed to catch.
  - text: I would prefer strong consistency wherever possible, since it makes the
      system easier to reason about and avoids a whole class of bugs caused by stale
      reads.
    trap: pragmatics
    why_wrong: A blanket preference that pays coordination cost across the entire
      system for the sake of a few fields.
  - text: Depends of which part, and this is the useful answer. A count of views can
      delay some seconds and nobody is harmed, but a balance cannot because the user
      can overdraw.
    trap: grammar
    why_wrong: '"Depends of", "count of views" and "can delay some seconds" are preposition
      and compound-noun errors.'
  feedback:
    register: Discriminating. Refusing a single global answer is the point.
    hedging: '"It depends" is correct here only because you immediately resolve it.'
    precision: Tie each choice to a concrete harm, such as overdrawing.
    grammar: '"It depends on", "a view count", "can lag by a few seconds".'
    pragmatics: Splitting the question is itself the demonstration of seniority.
  rephrase:
    prompt: Name a third field in the same product and place it on the spectrum.
    goal: Prove the criterion generalises.
  language_focus:
  - precision
  - grammar
  - pragmatics
  pt_help: '"Depender de" e "depend on", sempre. Erro muito frequente e caro.'
  feynman:
    concept: Per-field consistency requirements driven by harm.
    explain_to: A developer who sets one consistency level per system.
    constraint: Explain using a bank balance and a like counter.
    self_check: Did you name the harm that forces the strong guarantee?
    reasoning_check: Can you identify the hidden premise behind Consistency, give
      a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You answered globally, in either direction.
    expected: Per-field decision, justified by the harm of staleness.
    actual: A blanket yes, or a blanket preference for strong consistency.
    root_cause: Consistency treated as a system setting rather than a per-datum requirement.
    repair: Ask what a user could do wrongly with a stale value.
    reasoning_error: If your Consistency answer failed, classify the mistake as a
      fact, assumption, comparison, failure, or certainty error before proposing the
      smallest repair.
  recall:
    active_recall_cue: What decides whether a field can be eventually consistent?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Consistency without presenting
      an assumption as a fact?
    black_box_probe: When the Consistency answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: system_design-09-consistency-choice-delayed-9
      prompt: >-
        A product owner now requires a view count to update within one second, while balance reads
        still cannot tolerate stale data. Which consistency claim changes?
      changed_constraint: >-
        the design must meet a one-second view freshness target while preserving strong balance
        invariants
      new_evidence: >-
        the owner adds a measured freshness target for views without relaxing the balance
        requirement
      best_answer: >-
        I would enforce the new one-second propagation bound for view counts and keep balance
        reads on the authoritative path required by this scenario. I would measure end-to-end
        propagation and define what the interface does when it exceeds that bound. Financial
        mutations still need their atomic funds check; faster display updates do not replace
        it.
      distractors:
      - text: I would preserve every part of the original Consistency answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Consistency explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/06-foundations-distribuidas/topics/consistency-models.md
    note: Consistency models and their guarantees.
  - repo: system-design-estudos
    path: areas/06-foundations-distribuidas/topics/cap-theorem.md
    note: CAP trade-offs behind the per-field decision.
  extension:
    prompt: >-
      How would I demonstrate that fresh balance reads alone do not prevent a race between two debit
      requests?
    goal: >-
      Move from the short Consistency answer to a deep, evidence-led defence without inventing an
      outcome.
  critical_thinking:
    problem_frame: >-
      I need separate consistency contracts for a displayed count, a displayed balance, and a financial
      mutation that must enforce the available-funds invariant.
    claim_map:
      fact: >-
        The screen combines content counts and a balance, but the prompt does not define every freshness
        or spending rule.
      inference: >-
        Display freshness and mutation safety are different concerns; two unchecked debits may race
        despite both callers reading recent values.
      assumption: >-
        I am assuming the money operation must reject spending beyond available funds and view counts
        may tolerate a bounded delay.
      unknown: >-
        The display's freshness promise, atomic debit mechanism, and acceptable count propagation
        delay remain unknown.
    comparison:
      applicable: true
      alternatives:
      - option: Use an authoritative atomic boundary for spending decisions
        benefit: Protects the funds invariant while competing mutations are evaluated.
        cost_or_risk: Can reduce availability or increase latency when the authoritative boundary
          is unavailable.
        valid_when: The operation must prevent overspending despite concurrent requests.
      - option: Use a bounded-staleness projection for eligible display fields
        benefit: Improves read scalability when delayed display data is acceptable.
        cost_or_risk: Needs freshness labeling and cannot authorize spending from an unchecked stale
          value.
        valid_when: The product explicitly permits the displayed field to lag within a stated bound.
      decision_rule: >-
        I would enforce financial mutations atomically at their authority and choose each display's
        freshness separately; I would not treat all fields or all money reads as one contract.
    failure_probe:
      kind: counterexample
      prompt: >-
        If two requests each read the same available balance before either writes, what prevents
        their combined debit from exceeding it?
    evidence_check:
      basis: >-
        Check the Consistency claim against system-design-estudos/areas/06-foundations-distribuidas/topics/consistency-models.md
        and the exact interview context; record whether each part is fact, inference, or hypothesis.
      source_kind: authored_scenario
      limitation: >-
        This system design exercise can test reasoning about Consistency, but it cannot prove an
        unmeasured production outcome, personal ownership, or universal rule.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        The funds invariant is clear only after the business rule is stated; the appropriate display
        freshness remains conditional.
      update_trigger: >-
        A one-second count freshness requirement or a demonstrated concurrent-debit race changes
        the relevant projection or mutation contract.
    rubric:
      facts_correct: Distinguishes stale display data from authorization and concurrent mutation
        correctness.
      assumptions_explicit: States the assumed funds rule and asks for freshness limits per displayed
        field.
      alternatives_considered: >-
        Compares authoritative mutation with eligible projected display without treating them as
        interchangeable.
      tradeoff_quality: Explains freshness, availability, and latency costs at the relevant operation
        boundary.
      follow_up_adaptation: Measures count propagation against one second while preserving the financial
        invariant.
      certainty_calibration: Uses medium certainty until mutation isolation and display freshness
        requirements are known.

- id: system_design-10-bottleneck-naming
  version: 1.4.0
  target: system_design
  topic: Bottlenecks
  difficulty: 2
  interview_stage: architecture_review
  template: sd-delivery
  prompt: Where does this design break first as traffic grows?
  context: Your design is on the whiteboard and working. The interviewer wants to
    see whether you can attack your own architecture before they do.
  follow_up:
    prompt: Which resource or dependency saturates first, and what metric would warn
      you before users see the bottleneck?
    goal: Answer the alternative challenge about Bottlenecks while keeping the evidence
      boundary explicit.
    challenge_kind: alternative
    best_answer: >-
      I would measure primary write saturation, replica lag, cache hit rate, fanout queue depth,
      and work per post. That evidence tells me whether the database or fanout saturates first; I
      would scale or partition the measured resource instead of defending the most familiar
      bottleneck.
    distractors:
    - text: I would defend the first Bottlenecks option because offering an alternative
        might make the decision look uncertain.
      why_wrong: A comparison makes the decision rule visible; it does not weaken
        a well-calibrated recommendation.
    - text: I would list every conceivable Bottlenecks design without saying which
        requirement should decide between them.
      why_wrong: An option list without a decision rule avoids the trade-off the follow-up
        is testing.
  compression:
    prompt: Name the first bottleneck, its observable signal, and one capacity change
      with its trade-off.
    goal: Compress the Bottlenecks answer into its decision, premise, trade-off, and
      verification step.
  best_answer: >-
    I would inspect the database write path first. Reads can scale with replicas and cache, but
    every write still lands on one primary, so that is the first hard ceiling to measure. I
    would then check the fanout job, whose work grows with followers per post rather than posts,
    and validate both claims with saturation metrics.
  distractors:
  - text: It would depend on the traffic patterns and how the load is distributed,
      so I would want to monitor the system and see where the bottlenecks appear in
      practice.
    trap: pragmatics
    why_wrong: Defers a design question to observation, when the primary write ceiling
      is predictable from the architecture itself.
  - text: The application servers would be the first constraint, but since they are
      stateless we can scale them horizontally without much difficulty as traffic
      increases.
    trap: content
    why_wrong: Names the component that is easiest to scale, which means the real
      ceiling has not been identified.
  - text: The path of write of the database, probably. The reads scale with replicas
      and cache, but all the writes continue arriving in one only primary, that is
      the first ceiling hard.
    trap: grammar
    why_wrong: Stacked "of" possessives, "one only primary" and "ceiling hard" break
      the sentence throughout.
  feedback:
    register: Self-critical without being apologetic about the design.
    hedging: '"Most likely" is appropriate; the ordering is a judgement.'
    precision: 'Say why fanout scales badly: work per post grows with followers.'
    grammar: '"The database write path", "a single primary", "a hard ceiling".'
    pragmatics: Naming two bottlenecks in order shows you have thought past the first.
  rephrase:
    prompt: Say what you would change first once you hit that ceiling.
    goal: Extend diagnosis into an evolution plan.
  language_focus:
  - precision
  - grammar
  - pragmatics
  feynman:
    concept: Identifying the least scalable component in a design.
    explain_to: A candidate who presents designs as finished.
    constraint: Explain using the narrowest point of a funnel.
    self_check: Did you name the component that cannot simply be duplicated?
    reasoning_check: Can you identify the hidden premise behind Bottlenecks, give
      a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You deferred to monitoring, or named a stateless tier.
    expected: The single-primary write path, then fanout amplification.
    actual: An observation plan, or the easiest component to scale.
    root_cause: Not distinguishing components that duplicate from components that
      coordinate.
    repair: Ask which component cannot be horizontally duplicated.
    reasoning_error: If your Bottlenecks answer failed, classify the mistake as a
      fact, assumption, comparison, failure, or certainty error before proposing the
      smallest repair.
  recall:
    active_recall_cue: Which part of a standard design usually has the first hard
      ceiling?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Bottlenecks without presenting
      an assumption as a fact?
    black_box_probe: When the Bottlenecks answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: system_design-10-bottleneck-naming-delayed-10
      prompt: >-
        Metrics show fanout queue depth saturates before primary writes, and posts with many
        followers dominate work. Which bottleneck claim changes?
      changed_constraint: >-
        the design must isolate follower fanout work before it delays ordinary writes or reads
      new_evidence: >-
        queue metrics show fanout saturation and work scales with followers per post before primary
        write saturation
      best_answer: >-
        I would keep the primary write path as a possible later ceiling, but I would retract it as
        the first bottleneck for this workload. I would isolate and batch fanout, measure queue age
        and work per follower, and then revisit primary capacity with the updated traffic.
      distractors:
      - text: I would preserve every part of the original Bottlenecks answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Bottlenecks explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: chapters/chapter-14-feed-ranking-and-fanout-trade-offs.md
    note: Fanout cost and consumer scale trade-offs.
  - repo: system-design-estudos
    path: decision-contrasts/11-fanout-on-write-vs-fanout-on-read.md
    note: Fanout-on-write versus fanout-on-read contrast.
  extension:
    prompt: >-
      After improving fanout, which measurements would tell me whether primary writes have become
      the next bottleneck?
    goal: >-
      Move from the short Bottlenecks answer to a deep, evidence-led defence without inventing an
      outcome.
  critical_thinking:
    problem_frame: >-
      I need to identify the first saturated resource from workload evidence rather than defend
      the bottleneck I named on the whiteboard.
    claim_map:
      fact: >-
        The design has a primary write path and fanout work whose demand depends on followers per
        post.
      inference: A few high-fanout posts may create more queued work than the average posting rate
        suggests.
      assumption: >-
        I am assuming the proposed topology sends accepted writes to one primary and processes fanout
        asynchronously.
      unknown: >-
        Write utilization, queue age, follower distribution, service times, and user latency budgets
        are not supplied.
    comparison:
      applicable: true
      alternatives:
      - option: Increase or partition the measured write capacity
        benefit: Addresses a saturated primary when writes are the limiting resource.
        cost_or_risk: Adds migration and coordination costs and may leave fanout latency unchanged.
        valid_when: Write utilization and latency establish the primary as the current bottleneck.
      - option: Bound and isolate high-fanout processing
        benefit: Targets queue age and noisy posts when follower work dominates.
        cost_or_risk: Requires fairness, batching, and explicit delivery-latency expectations.
        valid_when: Fanout queue evidence reaches its limit before database writes do.
      decision_rule: >-
        I would compare saturation and queue age under the same workload, then change the limiting
        path and check whether the bottleneck moved.
    failure_probe:
      kind: edge_case
      prompt: >-
        If posting rate stays flat but a few accounts gain many followers, which queue or resource
        can fail without a rise in average writes?
    evidence_check:
      basis: >-
        Check the Bottlenecks claim against system-design-estudos/chapters/chapter-14-feed-ranking-and-fanout-trade-offs.md
        and the exact interview context; record whether each part is fact, inference, or hypothesis.
      source_kind: authored_scenario
      limitation: >-
        This system design exercise can test reasoning about Bottlenecks, but it cannot prove an
        unmeasured production outcome, personal ownership, or universal rule.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        The proposed topology suggests candidates for saturation, but measurements are required
        to rank them.
      update_trigger: >-
        Fanout queue age rising while primary writes retain headroom overturns the primary-first
        diagnosis.
    rubric:
      facts_correct: Connects fanout demand to followers per post rather than post count alone.
      assumptions_explicit: States the topology and workload distribution assumed by the bottleneck
        claim.
      alternatives_considered: Compares write capacity and fanout isolation using their observed
        saturation signals.
      tradeoff_quality: Explains migration or fairness costs instead of adding capacity everywhere.
      follow_up_adaptation: Prioritizes fanout when its queue saturates ahead of the primary.
      certainty_calibration: Uses medium certainty until representative load identifies the first
        limiting resource.

- id: system_design-11-scope-control
  version: 1.4.0
  target: system_design
  topic: Managing the round
  difficulty: 2
  interview_stage: architecture_review
  template: sd-delivery
  prompt: We have fifteen minutes left and we have not covered storage. How do you
    want to use the time?
  context: A time-management moment disguised as a question. The interviewer is handing
    you control of the remaining agenda to see what you prioritise.
  follow_up:
    prompt: Would you cut scope, time-box storage, or state the risk explicitly, and
      what decision do you need from the interviewer now?
    goal: Answer the failure challenge about Managing the round while keeping the
      evidence boundary explicit.
    challenge_kind: failure
    best_answer: >-
      I would time-box the data model and access paths, state the failure risks I cannot cover,
      and ask the interviewer which decision matters next. I would cut ranking or secondary
      features before hand-waving storage, because an explicit unmade decision is safer than an
      invented guarantee.
    distractors:
    - text: I would describe the Managing the round failure as impossible because
        the happy path already passed its test.
      why_wrong: Passing a happy path does not test the boundary, failure mode, or
        recovery being challenged.
    - text: I would add retries to Managing the round immediately and assume the system
        would become reliable.
      why_wrong: Retries can amplify load or duplicate effects; the failure and containment
        policy must be specified first.
  compression:
    prompt: Close the remaining design time with covered decisions, open risk, and
      one concrete next question.
    goal: Compress the Managing the round answer into its decision, premise, trade-off,
      and verification step.
  best_answer: 'I would spend ten minutes on the data model and access patterns, where
    most risk sits, then keep five for failure modes. I would leave ranking undiscussed
    rather than hand-wave storage, because storage decisions are harder to reverse.'
  distractors:
  - text: Let us cover storage then, I can walk through the schema and the database
      choice and then we can see how much time is left for the other topics afterwards.
    trap: precision
    why_wrong: Accepts the topic without allocating the time or saying what gets dropped,
      so the round can still overrun.
  - text: Whatever you think would be most valuable to cover, I am happy to go into
      whichever area you feel is most relevant for the role we are discussing today.
    trap: pragmatics
    why_wrong: Returns a decision that was deliberately given to you, forfeiting the
      prioritisation signal.
  - text: I would pass ten minutes in the data model and the patterns of access, because
      is there that stays the biggest risk, and keep five for the modes of failure.
    trap: grammar
    why_wrong: '"Pass ten minutes", missing subject and two inverted compound nouns
      break an otherwise sound plan.'
  feedback:
    register: Decisive and calm. Owning the agenda reads as senior.
    hedging: None; allocate the minutes explicitly.
    precision: Reversibility is the criterion that justifies the priority.
    grammar: '"Spend ten minutes on", "access patterns", "failure modes".'
    pragmatics: Saying what you sacrifice makes the prioritisation credible.
  rephrase:
    prompt: Give the same plan if only five minutes remained.
    goal: Force a harder prioritisation with the same reasoning.
  language_focus:
  - precision
  - grammar
  - pragmatics
  pt_help: '"Passar tempo" e "spend time". "Pass time" significa outra coisa.'
  feynman:
    concept: Prioritising by reversibility under time pressure.
    explain_to: A candidate who tries to cover everything.
    constraint: Explain using packing for a trip with one bag.
    self_check: Did you name what you are choosing not to cover?
    reasoning_check: Can you identify the hidden premise behind Managing the round,
      give a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You accepted the topic without a plan, or deferred the choice.
    expected: Explicit minute allocation justified by reversibility.
    actual: An open-ended walkthrough, or handing the decision back.
    root_cause: Treating the interviewer as the owner of an agenda they just delegated.
    repair: When given the agenda, allocate time and name the sacrifice.
    reasoning_error: If your Managing the round answer failed, classify the mistake
      as a fact, assumption, comparison, failure, or certainty error before proposing
      the smallest repair.
  recall:
    active_recall_cue: Which property makes a design decision worth prioritising?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Managing the round without
      presenting an assumption as a fact?
    black_box_probe: When the Managing the round answer failed, did you locate the
      reasoning error before changing the implementation?
    delayed_variant:
      id: system_design-11-scope-control-delayed-11
      prompt: >-
        The interviewer requires a storage decision in five minutes and says ranking can wait. Which
        scope plan changes and what risk do you state?
      changed_constraint: >-
        the round must produce a reversible storage decision and an explicit failure risk within the
        remaining time
      new_evidence: >-
        the interviewer prioritizes storage and removes ranking from the required answer
      best_answer: >-
        I would keep the habit of protecting high-risk decisions, but I would change the time
        allocation to make the storage trade-off explicit now. I would state the chosen model,
        access pattern, migration risk, and one unverified failure mode, then leave ranking out as
        requested.
      distractors:
      - text: I would preserve every part of the original Managing the round answer
          because changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Managing the round explanation with a new
          design without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/01-metodo-e-entrevistas/backend-interview-foundations/chapters/03-system-design-delivery-framework.md
    note: Delivery framework and round management.
  - repo: system-design-estudos
    path: areas/01-metodo-e-entrevistas/examples/interview-walkthrough-marketplace-search.md
    note: Worked walkthrough showing time allocation in practice.
  extension:
    prompt: >-
      What is the shortest storage explanation I could give that still exposes an invariant, access
      pattern, and unresolved failure risk?
    goal: >-
      Move from the short Managing the round answer to a deep, evidence-led defence without inventing
      an outcome.
  critical_thinking:
    problem_frame: >-
      I need to use the remaining interview time to make the storage decision assessable while naming
      what remains unresolved.
    claim_map:
      fact: Fifteen minutes remain and storage has not yet been discussed.
      inference: >-
        Missing access patterns or invariants can invalidate a storage choice more directly than
        omitted ranking detail.
      assumption: >-
        I am assuming storage carries the largest unresolved risk; I should check the interviewer's
        priority.
      unknown: >-
        The required storage decision, existing guarantees, and time needed for failure discussion
        are unclear.
    comparison:
      applicable: true
      alternatives:
      - option: Time-box the data model and its highest-risk access path
        benefit: Makes the central storage decision concrete within the remaining discussion.
        cost_or_risk: Leaves some secondary features or detailed failure analysis for an explicit
          follow-up.
        valid_when: Storage correctness is the main unresolved design risk the interviewer wants
          addressed.
      - option: Let the interviewer select one unresolved decision
        benefit: Aligns the limited time with the assessment's actual priority.
        cost_or_risk: Requires a concise menu of risks and may leave a different important topic
          unexplored.
        valid_when: The interviewer has not confirmed which remaining decision matters most.
      decision_rule: >-
        I would propose a short storage agenda, confirm its priority, and state omitted risks rather
        than filling gaps with an unsupported guarantee.
    failure_probe:
      kind: edge_case
      prompt: >-
        If the interviewer cuts storage discussion to five minutes, which invariant and access path
        must still be explicit before I name the store?
    evidence_check:
      basis: >-
        Check the Managing the round claim against system-design-estudos/areas/01-metodo-e-entrevistas/backend-interview-foundations/chapters/03-system-design-delivery-framework.md
        and the exact interview context; record whether each part is fact, inference, or hypothesis.
      source_kind: authored_scenario
      limitation: >-
        This system design exercise can test reasoning about Managing the round, but it cannot prove
        an unmeasured production outcome, personal ownership, or universal rule.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        A time box is observable, but the best allocation depends on the unresolved risk and the
        interviewer's priority.
      update_trigger: >-
        An explicit request for a storage choice in five minutes changes the agenda and forces secondary
        features out of scope.
    rubric:
      facts_correct: Acknowledges the remaining minutes and identifies the unresolved storage decision.
      assumptions_explicit: Checks whether storage is the interviewer's highest-priority risk.
      alternatives_considered: Compares a proposed storage time box with explicit priority selection.
      tradeoff_quality: Names what will remain unexamined when time is spent on the storage boundary.
      follow_up_adaptation: Uses the five-minute constraint to state model, access path, and unverified
        failure risk.
      certainty_calibration: Keeps medium certainty about unexamined design details instead of inventing
        completeness.

- id: system_design-12-ten-x-version
  version: 1.4.0
  target: system_design
  topic: Scaling narrative
  difficulty: 3
  interview_stage: architecture_review
  template: sd-delivery
  prompt: What would you change if this had ten times the traffic?
  context: >-
    The closing question asks for an evolution justified by the larger workload, including any
    data-model or partition change that the evidence requires.
  follow_up:
    prompt: Which ten-times assumption changes the architecture rather than merely
      adding more instances, and how would you stage that change?
    goal: Answer the new_evidence challenge about Scaling narrative while keeping
      the evidence boundary explicit.
    challenge_kind: new_evidence
    best_answer: >-
      I would identify which ten-times assumption breaks first: tenant write concentration, fanout
      work, or regional reads. I would stage the change by measuring that boundary, partitioning
      or queueing only the saturated path, and preserving the data model until evidence shows it
      is the limit.
    distractors:
    - text: I would keep the Scaling narrative recommendation unchanged because changing
        position would look inconsistent.
      why_wrong: A defensible answer updates when relevant evidence changes an assumption
        or trade-off.
    - text: I would discard every earlier Scaling narrative claim as soon as one new
        observation appeared.
      why_wrong: New evidence may narrow one claim while leaving other verified facts
        intact.
  compression:
    prompt: Tell the scaling story as changed constraint, architectural response,
      migration step, and validation signal.
    goal: Compress the Scaling narrative answer into its decision, premise, trade-off,
      and verification step.
  best_answer: >-
    I would first test the tenfold workload and identify whether writes, fanout, or regional
    reads reach their limit. I would scale or partition only the constrained path, choosing a
    key that preserves the relevant business invariants. Tenant partitioning can isolate
    competing tenants, but it does not divide one oversized tenant by itself. I would retain
    the data model while it still fits and stage any necessary migration with a rollback path.
  distractors:
  - text: I would need to redesign several parts of the system to handle that scale,
      probably moving to a distributed database and splitting the application into
      separate services.
    trap: content
    why_wrong: A redesign at ten times implies the first design had no headroom, which
      undermines everything you presented.
  - text: I would add more servers and scale the database vertically, and introduce
      caching in more places to reduce the load on the backend components of the system.
    trap: precision
    why_wrong: Adds resources without addressing the single-primary write ceiling,
      which is what actually binds.
  - text: Not the shape, principally the boundaries. I would partition the path of
      write for tenant so that no primary carries everything, and pass the fanout
      of the request for a group of consumers.
    trap: grammar
    why_wrong: '"Principally", "path of write", "for tenant" and "group of consumers"
      are four transfer errors in two sentences.'
  feedback:
    register: Confident continuity. Evolution, not reinvention.
    hedging: '"Mostly" appropriately signals that some things do change.'
    precision: Saying what stays, and why, is as strong as what changes.
    grammar: '"Partition by tenant", "the write path", "a consumer group".'
    pragmatics: Defending the unchanged data model shows deliberate design.
  rephrase:
    prompt: Name the one thing you would have designed differently from the start.
    goal: Practise self-critique without undermining the design.
  language_focus:
  - precision
  - grammar
  - hedging
  feynman:
    concept: Staged evolution versus redesign under load growth.
    explain_to: A candidate who rebuilds the design at every follow-up.
    constraint: Explain using widening a road rather than rebuilding a city.
    self_check: Did you say what deliberately stays the same?
    reasoning_check: Can you identify the hidden premise behind Scaling narrative,
      give a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You redesigned, or only added resources.
    expected: Partitioned writes, async fanout, regional reads, model intact.
    actual: A microservices migration, or vertical scaling.
    root_cause: Not designing the first version with a stated evolution path.
    repair: Design every system with the next boundary already identified.
    reasoning_error: If your Scaling narrative answer failed, classify the mistake
      as a fact, assumption, comparison, failure, or certainty error before proposing
      the smallest repair.
  recall:
    active_recall_cue: What should stay the same when traffic grows tenfold?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Scaling narrative without
      presenting an assumption as a fact?
    black_box_probe: When the Scaling narrative answer failed, did you locate the
      reasoning error before changing the implementation?
    delayed_variant:
      id: system_design-12-ten-x-version-delayed-12
      prompt: >-
        At ten times load, tenant concentration saturates one primary and fanout queue age grows,
        while regional reads remain healthy. Which scaling assumption is no longer safe?
      changed_constraint: >-
        the ten-times plan must address tenant-hot writes and fanout backlog before adding read
        capacity
      new_evidence: >-
        load testing shows tenant concentration and fanout queue age growing while regional reads
        remain within budget
      best_answer: >-
        I would prioritize write concentration and fanout queue age because regional reads
        still have headroom. I would isolate competing tenants and check whether the hottest
        tenant needs subdivision using an invariant-safe key; routing that whole tenant to
        another primary does not increase its single-primary capacity. I would bound fanout
        consumers and verify queue age and write latency before adding regional reads.
      distractors:
      - text: I would preserve every part of the original Scaling narrative answer
          because changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Scaling narrative explanation with a new
          design without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: chapters/chapter-02-pod-isolation-and-tenant-routing.md
    note: Tenant partitioning and pod isolation as a scaling boundary.
  - repo: system-design-estudos
    path: areas/01-metodo-e-entrevistas/snippets/system-design-interview-checklist.md
    note: Now-versus-10x closing framing from the checklist.
  extension:
    prompt: >-
      Which invariant could make a proposed hot-tenant partition key unsafe, even if it improves
      throughput?
    goal: >-
      Move from the short Scaling narrative answer to a deep, evidence-led defence without inventing
      an outcome.
  critical_thinking:
    problem_frame: >-
      I need a staged tenfold-capacity plan that follows measured tenant skew, fanout demand, and
      regional reads while preserving required data invariants.
    claim_map:
      fact: >-
        The interviewer proposes ten times the traffic without specifying whether the workload mix
        or tenant distribution also changes.
      inference: Adding read replicas cannot repair a saturated write path or a growing fanout queue.
      assumption: >-
        I am assuming the existing data model remains adequate until a measured invariant or access
        pattern requires revision.
      unknown: >-
        The hot-tenant distribution, per-tenant write volume, partition key, and cross-partition
        operations are unknown.
    comparison:
      applicable: true
      alternatives:
      - option: Scale the current boundary within its measured capacity
        benefit: Avoids an early partition migration and retains the existing consistency model.
        cost_or_risk: Has finite headroom and may not address concentrated tenant demand.
        valid_when: Representative load shows the current boundary can meet the revised service
          target.
      - option: Partition the saturated write domain and bound fanout work
        benefit: Can isolate competing tenants and distribute eligible work beyond one resource.
        cost_or_risk: >-
          Adds migration, routing, and cross-partition correctness costs; one hot tenant may need
          finer subdivision.
        valid_when: Measured saturation persists and a partition key preserves the required business
          invariants.
      decision_rule: >-
        I would measure the changed load, exhaust appropriate local capacity, and partition only
        the limiting domain with a safe key and a reversible migration plan.
    failure_probe:
      kind: counterexample
      prompt: >-
        If a single tenant alone exceeds one primary's capacity, why would partitioning only by
        tenant fail to solve that tenant's write pressure?
    evidence_check:
      basis: >-
        Check the Scaling narrative claim against system-design-estudos/chapters/chapter-02-pod-isolation-and-tenant-routing.md
        and the exact interview context; record whether each part is fact, inference, or hypothesis.
      source_kind: authored_scenario
      limitation: >-
        This system design exercise can test reasoning about Scaling narrative, but it cannot prove
        an unmeasured production outcome, personal ownership, or universal rule.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        Tenfold traffic defines a load target, not a predetermined topology; skew and invariants
        determine the safe scaling boundary.
      update_trigger: >-
        A dominant tenant and rising fanout age with healthy regional reads require write and fanout
        work before more read replicas.
    rubric:
      facts_correct: Separates write concentration, fanout work, and regional read demand.
      assumptions_explicit: Asks whether tenfold traffic changes tenant skew, payloads, or access
        patterns.
      alternatives_considered: Compares local capacity expansion with partitioning only the saturated
        domain.
      tradeoff_quality: Explains partition-key, migration, and cross-partition correctness costs.
      follow_up_adaptation: >-
        Treats hot-tenant subdivision and bounded fanout as conditional responses to the measured
        failure.
      certainty_calibration: Uses medium certainty until a load test validates the chosen scaling
        boundary.
