- id: system_design-08-rails-mapping
  version: 1.4.0
  target: system_design
  topic: Rails mapping
  difficulty: 2
  interview_stage: architecture_review
  template: sd-delivery
  prompt: How would this design actually look in the stack you know best?
  context: An invitation to ground the architecture in something concrete. The interviewer
    wants to check that your design is buildable, not just diagrammable.
  follow_up:
    prompt: Which Rails boundary would own the API contract, persistence transaction,
      and asynchronous work without making the controller a coordinator?
    goal: Answer the assumption challenge about Rails mapping while keeping the evidence
      boundary explicit.
    challenge_kind: assumption
    best_answer: >-
      As a Rails application it is a controller that validates and enqueues, a job
      that talks to the provider, and Postgres as the source of truth with the
      idempotency key as a unique index. I would label the follow-up premise as an
      assumption, ask the smallest question that could disprove it, and protect the edge case
      before committing to the recommendation.
    distractors:
    - text: I would repeat my original Rails mapping answer with more confidence because
        the interviewer probably assumes the usual case.
      why_wrong: It hides the premise instead of checking whether the usual case is
        actually part of this problem.
    - text: I would stop proposing anything about Rails mapping until every surrounding
        requirement had been documented in full.
      why_wrong: It treats uncertainty as a reason for paralysis and offers no bounded
        next step.
  compression:
    prompt: 'Map the design to Rails in four beats: request, domain boundary, durable
      data, and job or event.'
    goal: Compress the Rails mapping answer into its decision, premise, trade-off,
      and verification step.
  best_answer: As a Rails application it is a controller that validates and enqueues,
    a job that talks to the provider, and Postgres as the source of truth with the
    idempotency key as a unique index. The parts I would watch are connection pool
    limits and job retry behaviour.
