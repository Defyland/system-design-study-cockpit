- id: databases-09-pagination
  version: 1.4.0
  target: databases
  topic: pagination
  difficulty: 3
  interview_stage: deep_dive
  prompt: A support inbox must paginate newest tickets while new tickets keep arriving.
    What would you use?
  context: Users need stable navigation more than an exact total count.
  best_answer: I would use keyset pagination with a deterministic created-at plus
    ID cursor, and document that newly inserted tickets can appear on a later refresh
    rather than shifting prior pages. I would test cursor boundaries and expose the
    ordering contract.
  distractors:
  - text: I would use OFFSET because page numbers are familiar and the table already
      has an index. New tickets can simply move older rows to the next page.
    trap: content
    why_wrong: It ignores the pagination constraint and would make the proposed change
      unsafe or untestable.
  - text: I would return every ticket to the browser and let it paginate in memory.
      Support users need exact page counts, so moving the work to the client is worth
      it.
    trap: precision
    why_wrong: It substitutes an absolute rule for the workload, failure mode, and
      verification step this scenario requires.
  feedback:
    register: Name the navigation contract before comparing cursor styles.
    hedging: Qualify the lack of an exact total as a product choice, not a hidden
      limitation.
    precision: Specify the created-at plus ID ordering and cursor-boundary tests.
    grammar: Use ‘rather than’ to contrast stable pages with newly inserted rows.
    pragmatics: Tell the support user what a refresh may show.
  rephrase:
    prompt: Rephrase this pagination decision for an engineering manager who needs
      risk, cost, and next action.
    goal: Preserve the concrete boundary and the signal that validates it.
  follow_up:
    prompt: A ticket’s priority changes after the first page is loaded. What ordering
      rule would you expose so the cursor remains understandable?
    goal: Answer the alternative challenge about pagination while keeping the evidence
      boundary explicit.
    challenge_kind: alternative
    best_answer: >-
      I would use keyset pagination with a deterministic created-at plus ID cursor, and document
      that newly inserted tickets can appear on a later refresh rather than shifting prior pages. If
      priority changes, I would keep the cursor order immutable for that query or restart from a
      new snapshot; I would test duplicate and skipped boundaries under inserts and updates.
    distractors:
    - text: I would defend the first pagination option because offering an alternative
        might make the decision look uncertain.
      why_wrong: A comparison makes the decision rule visible; it does not weaken
        a well-calibrated recommendation.
    - text: I would list every conceivable pagination design without saying which
        requirement should decide between them.
      why_wrong: An option list without a decision rule avoids the trade-off the follow-up
        is testing.
  compression:
    prompt: Preserve the deterministic keyset cursor, stable navigation goal, refresh
      behaviour for new tickets, and boundary tests in two sentences.
    goal: Compress the pagination answer into its decision, premise, trade-off, and
      verification step.
  language_focus:
  - precision
  - hedging
  - pragmatics
  feynman:
    concept: How a cursor based on created time and ID keeps a moving inbox navigable.
    explain_to: a support-tool engineer
    constraint: Explain why new tickets do not reshuffle pages already seen.
    self_check: Can they state what a refresh, rather than a next-page click, may
      reveal?
    reasoning_check: Can you identify the hidden premise behind pagination, give a
      counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: A support agent sees tickets duplicated or skipped while new tickets
      arrive.
    expected: Paging resumes from a deterministic last seen created-at and ID pair.
    actual: OFFSET shifts after inserts and changes the meaning of page two.
    root_cause: The interface exposes page numbers without a stable ordering boundary.
    repair: Adopt a keyset cursor, test equal-timestamp edges, and document refresh
      semantics.
    reasoning_error: If your pagination answer failed, classify the mistake as a fact,
      assumption, comparison, failure, or certainty error before proposing the smallest
      repair.
  recall:
    active_recall_cue: For pagination, what must remain true, what is the trade-off,
      and what evidence changes the decision?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind pagination without presenting
      an assumption as a fact?
    black_box_probe: When the pagination answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: databases-09-pagination-delayed-9
      prompt: >-
        A ticket priority changes after page one, but users need a stable cursor. Which ordering contract would you expose?
      changed_constraint: >-
        cursor order must remain deterministic even when mutable priority changes
      new_evidence: >-
        a priority update would otherwise move a ticket across an already-issued cursor
      best_answer: >-
        I would keep the cursor on immutable created-at and ID ordering or restart from a new snapshot, and test duplicate and skipped boundaries under inserts and updates.
      distractors:
      - text: I would preserve every part of the original pagination answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire pagination explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
