    - text: I would discard every earlier backup recovery claim as soon as one new
        observation appeared.
      why_wrong: New evidence may narrow one claim while leaving other verified facts
        intact.
  compression:
    prompt: Preserve the isolated restore drill, measured recovered point and duration,
      RPO/RTO comparison, and operational-debt follow-up in two sentences.
    goal: Compress the backup recovery answer into its decision, premise, trade-off,
