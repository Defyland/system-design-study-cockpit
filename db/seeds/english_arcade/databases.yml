- id: databases-09-pagination
  version: 1.4.0
  target: databases
  topic: pagination
  difficulty: 3
  interview_stage: deep_dive
  prompt: A support inbox must paginate newest tickets while new tickets keep arriving.
    What would you use?
  context: Users need stable navigation more than an exact total count.
  best_answer: I would use keyset pagination with a deterministic created-at plus
    ID cursor, and document that newly inserted tickets can appear on a later refresh
    rather than shifting prior pages. I would test cursor boundaries and expose the
    ordering contract.
  distractors:
  - text: I would use OFFSET because page numbers are familiar and the table already
      has an index. New tickets can simply move older rows to the next page.
    trap: content
    why_wrong: It ignores the pagination constraint and would make the proposed change
      unsafe or untestable.
  - text: I would return every ticket to the browser and let it paginate in memory.
      Support users need exact page counts, so moving the work to the client is worth
      it.
    trap: precision
    why_wrong: It substitutes an absolute rule for the workload, failure mode, and
      verification step this scenario requires.
  feedback:
    register: Name the navigation contract before comparing cursor styles.
    hedging: Qualify the lack of an exact total as a product choice, not a hidden
      limitation.
    precision: Specify the created-at plus ID ordering and cursor-boundary tests.
    grammar: Use ‘rather than’ to contrast stable pages with newly inserted rows.
    pragmatics: Tell the support user what a refresh may show.
  rephrase:
    prompt: Rephrase this pagination decision for an engineering manager who needs
      risk, cost, and next action.
    goal: Preserve the concrete boundary and the signal that validates it.
  follow_up:
    prompt: A ticket’s priority changes after the first page is loaded. What ordering
      rule would you expose so the cursor remains understandable?
    goal: Answer the alternative challenge about pagination while keeping the evidence
      boundary explicit.
    challenge_kind: alternative
    best_answer: >-
      I would use keyset pagination with a deterministic created-at plus ID cursor, and document
      that newly inserted tickets can appear on a later refresh rather than shifting prior
