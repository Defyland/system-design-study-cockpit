    claim_map:
      fact: >-
        Keyset pagination can use a deterministic created-at and ID tuple.
      inference: >-
        A mutable priority sort can move records across an existing cursor and create duplicates or skips.
      assumption: >-
        I am assuming the product can accept refresh-based visibility instead of shifting an already loaded page.
