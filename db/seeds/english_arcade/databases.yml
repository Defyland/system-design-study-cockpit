- id: databases-03-explain-query-plans
  version: 1.4.0
  target: databases
  topic: explain query plans
  difficulty: 3
  interview_stage: deep_dive
  prompt: Walk me through how you would investigate a query that became slow after
    a launch.
  context: The dashboard shows p95 latency rising only for one tenant. The interviewer
    wants a hypothesis-led investigation, not a list of SQL keywords.
  best_answer: I would compare estimated and actual rows at each expensive node, then
    check whether tenant skew or stale statistics explain the mismatch. I would test
    one change on a representative plan and watch buffers and p95 before changing
    production.
  distractors:
  - text: I would read the total estimated cost, find the largest table, and add an
      index there. A high cost is direct evidence that the planner found the slowest
      part.
    trap: content
    why_wrong: It ignores the explain query plans constraint and would make the proposed
      change unsafe or untestable.
  - text: I would remove every sequential scan. On a large tenant table, a scan means
      the database is ignoring an index that should be used.
    trap: precision
    why_wrong: It substitutes an absolute rule for the workload, failure mode, and
      verification step this scenario requires.
  feedback:
    register: Narrate the investigation as observation, hypothesis, then bounded experiment.
    hedging: Say ‘may indicate’ for a row-estimate mismatch until tenant distribution
      is checked.
    precision: Refer to estimated versus actual rows and buffers, not merely a ‘bad
      plan.’
    grammar: Use parallel verbs—compare, check, test—to make the procedure easy to
      follow.
    pragmatics: Explain why the one affected tenant is diagnostically useful.
  rephrase:
    prompt: Rephrase this explain query plans decision for an engineering manager
      who needs risk, cost, and next action.
    goal: Preserve the concrete boundary and the signal that validates it.
  follow_up:
    prompt: The estimates are accurate, but execution is reading cold pages. What
      hypothesis would you test before changing the SQL?
    goal: Answer the evidence challenge about explain query plans while keeping the
      evidence boundary explicit.
    challenge_kind: evidence
    best_answer: >-
      I would compare estimated and actual rows at each expensive node, then check whether
      tenant skew or stale statistics explain the mismatch. I would treat the follow-up observation
      as evidence, not as proof of impact; I would inspect the smallest relevant trace
      or test and state what remains uncertain before changing the decision.
    distractors:
    - text: I would cite my experience with explain query plans as enough proof and
        move on without naming an observation.
      why_wrong: Experience can guide a hypothesis, but it does not replace evidence
        tied to this context.
    - text: I would collect every possible metric about explain query plans before
        making even a provisional recommendation.
      why_wrong: A focused decision can start with one discriminating observation
        rather than an unbounded data request.
  compression:
    prompt: Preserve the estimate-versus-actual comparison, tenant-skew hypothesis,
      one experiment, and the buffer/p95 evidence.
    goal: Compress the explain query plans answer into its decision, premise, trade-off,
      and verification step.
  language_focus:
  - precision
  - hedging
  - pragmatics
  feynman:
    concept: Why row-count errors can send a query planner toward the wrong join or
      scan.
    explain_to: an on-call engineer seeing a tenant-specific slowdown
    constraint: Use one expensive node and explain what its estimated and actual rows
      reveal.
    self_check: Can they separate a measurement from a proposed fix?
    reasoning_check: Can you identify the hidden premise behind explain query plans,
      give a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: One tenant’s dashboard p95 rose after launch while other tenants remain
      normal.
    expected: A reproducible diagnosis tied to a row estimate, I/O pattern, or tenant
      skew.
    actual: The team adds an index after reading only the plan’s total cost.
    root_cause: A planner estimate was treated as a ranking of bugs, not compared
      with execution evidence.
    repair: Run the representative plan with actuals, isolate the mismatch, and validate
      one reversible change.
    reasoning_error: If your explain query plans answer failed, classify the mistake
      as a fact, assumption, comparison, failure, or certainty error before proposing
      the smallest repair.
  recall:
    active_recall_cue: For explain query plans, what must remain true, what is the
      trade-off, and what evidence changes the decision?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind explain query plans without
      presenting an assumption as a fact?
    black_box_probe: When the explain query plans answer failed, did you locate the
      reasoning error before changing the implementation?
    delayed_variant:
      id: databases-03-explain-query-plans-delayed-3
      prompt: New evidence about explain query plans says a stakeholder clarifies
        a explain query plans requirement that changes the explain query plans success
        condition; with the explain query plans dependency is slower for explain query
        plans and the failure is ambiguous rather than explicit, how do you update
        the explain query plans decision rule?
      changed_constraint: the explain query plans dependency is slower for explain
        query plans and the failure is ambiguous rather than explicit
      new_evidence: a stakeholder clarifies a explain query plans requirement that
        changes the explain query plans success condition
