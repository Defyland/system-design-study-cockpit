  difficulty: 1
  interview_stage: deep_dive
  prompt: Traffic is growing and a team proposes sharding by user ID. What would you
    challenge?
  context: The system includes organization reports and a few global administrative
    searches.
  best_answer: I would ask whether ownership, growth, and failure isolation actually
    follow user ID, then make cross-shard queries explicit rather than accidental.
    I would start with the least invasive scaling boundary and set a metric that triggers
    a shard split.
  distractors:
  - text: I would shard immediately because user IDs are evenly distributed. Organization
      reports and global searches can be solved after the traffic is divided, perhaps
      by querying each shard in parallel from the reporting service.
    trap: precision
    why_wrong: It ignores the sharding boundaries constraint and would make the proposed
      change unsafe or untestable.
  - text: I would copy every table to every shard so global searches stay simple.
      The storage cost is acceptable compared with cross-shard query complexity.
    trap: pragmatics
    why_wrong: It substitutes an absolute rule for the workload, failure mode, and
      verification step this scenario requires.
  feedback:
    register: Challenge sharding with an ownership question before proposing a topology.
    hedging: Use ‘if ownership follows user ID’ rather than accepting even distribution
      as enough.
    precision: Name cross-shard reports, global search, split trigger, and failure
      isolation.
    grammar: Keep the evaluation criteria in a parallel list.
    pragmatics: Avoid treating administrative paths as someone else’s future problem.
  rephrase:
    prompt: Rephrase this sharding boundaries decision for an engineering manager
      who needs risk, cost, and next action.
    goal: Preserve the concrete boundary and the signal that validates it.
  follow_up:
    prompt: An organization-level report becomes the busiest endpoint. What does that
      reveal about sharding by user ID, and what would you measure next?
    goal: Answer the failure challenge about sharding boundaries while keeping the
      evidence boundary explicit.
    challenge_kind: failure
    best_answer: >-
      I would ask whether ownership, growth, and failure isolation actually follow user ID, then
      make cross-shard queries explicit rather than accidental. An organization-level report would
      make user-ID sharding fan out, so I would measure fan-out, hotspot distribution, consistency
      needs, and tenant ownership before choosing another key or read model.
    distractors:
    - text: I would describe the sharding boundaries failure as impossible because
        the happy path already passed its test.
      why_wrong: Passing a happy path does not test the boundary, failure mode, or
        recovery being challenged.
    - text: I would add retries to sharding boundaries immediately and assume the
        system would become reliable.
      why_wrong: Retries can amplify load or duplicate effects; the failure and containment
        policy must be specified first.
  compression:
    prompt: Preserve ownership and failure-isolation tests, explicit cross-shard work,
      the least-invasive boundary, and split trigger in two sentences.
    goal: Compress the sharding boundaries answer into its decision, premise, trade-off,
      and verification step.
  language_focus:
  - precision
  - hedging
  - pragmatics
  feynman:
    concept: Why an even hash key is insufficient when ownership and reports cross
      that key.
    explain_to: a team considering its first shard split
    constraint: Use a user-owned request and an organization report as contrasting
      paths.
    self_check: Can they identify the metric that would justify the extra operational
      boundary?
    reasoning_check: Can you identify the hidden premise behind sharding boundaries,
      give a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: User traffic fits one shard key, but organization reports fan out across
      every shard.
    expected: The data boundary matches ownership, growth, and failure isolation with
      explicit global paths.
    actual: Global searches become accidental scatter-gather queries after the split.
    root_cause: Even ID distribution was mistaken for a complete sharding strategy.
    repair: Map cross-boundary queries, choose the smallest viable scaling step, and
      define a split threshold.
    reasoning_error: If your sharding boundaries answer failed, classify the mistake
      as a fact, assumption, comparison, failure, or certainty error before proposing
      the smallest repair.
  recall:
    active_recall_cue: For sharding boundaries, what must remain true, what is the
      trade-off, and what evidence changes the decision?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind sharding boundaries without
      presenting an assumption as a fact?
    black_box_probe: When the sharding boundaries answer failed, did you locate the
      reasoning error before changing the implementation?
    delayed_variant:
      id: databases-10-sharding-boundaries-delayed-10
      prompt: >-
        An organization report becomes the busiest endpoint while data is sharded by user ID. What does that reveal?
      changed_constraint: >-
        report ownership and access do not follow the proposed user-ID shard key
      new_evidence: >-
        the report fans out across many shards and concentrates organization-level traffic
      best_answer: >-
        I would measure fan-out, hotspot distribution, consistency needs, and tenant ownership before choosing another key or a read model; I would not split shards from traffic growth alone.
      distractors:
      - text: I would preserve every part of the original sharding boundaries answer
          because changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire sharding boundaries explanation with a new
          design without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/06-foundations-distribuidas/topics/consistency-models.md
    note: Relevant local operational or database decision source.
  - repo: original
    path: english-arcade/databases/sharding-boundaries
    note: Original interviewer scenario and language coaching.
  extension:
    prompt: 'Deep dive on sharding boundaries: compare sharding boundaries options
      with one measurement; which failure around sharding boundaries would make sharding
      boundaries switch?'
    goal: Move from the short sharding boundaries answer to a deep, evidence-led defence
      without inventing an outcome.
  critical_thinking:
    problem_frame: >-
      A proposed user-ID shard key must serve ownership, growth, failure isolation, and organization-level reports without accidental fan-out.
    claim_map:
      fact: >-
        Sharding changes the cost and consistency of cross-shard queries.
      inference: >-
        An organization report can reveal that user ID does not follow the dominant access or ownership boundary.
      assumption: >-
        I am assuming user ownership and traffic distribution align with the proposed key.
      unknown: >-
        Tenant ownership, hotspot distribution, fan-out, consistency, and split trigger are unknown.
    comparison:
      applicable: true
      alternatives:
      - option: a tenant directory plus a shard key that keeps normal commands local
        benefit: I can route reads and writes by tenant and make ownership and movement auditable.
        cost_or_risk: Cross-tenant queries, rebalancing, and directory failure require explicit workflows.
        valid_when: Use it when tenant volume or isolation requires more than one database and the access pattern is tenant-shaped.
      - option: one database with indexed tenant isolation
        benefit: I keep joins, transactions, migrations, and reporting operationally simple.
        cost_or_risk: A noisy tenant can consume shared capacity, and the single database remains a growth boundary.
        valid_when: Use it while measured size, throughput, and isolation requirements fit the single-store envelope.
      decision_rule: I keep one store until measured limits or isolation requirements justify a shard directory; I shard only with a migration and cross-shard plan.
    failure_probe:
      kind: counterexample
      prompt: >-
        What measured report fan-out or hotspot result would make user-ID sharding the wrong boundary?
    evidence_check:
      basis: Check the sharding boundaries claim against system-design-estudos/areas/06-foundations-distribuidas/topics/consistency-models.md
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: This database design exercise can test reasoning about sharding
        boundaries, but it cannot prove an unmeasured production outcome, personal
        ownership, or universal rule.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        I am confident in challenging the shard key with workload and ownership evidence; topology choice remains provisional.
      update_trigger: >-
        Update when report traces, hotspot metrics, or failure isolation requirements change the ownership boundary.
    rubric:
      facts_correct: Names the verified sharding boundaries facts without smuggling
        in a result, scale, or capability that the prompt does not establish.
      assumptions_explicit: Labels the sharding boundaries premise that is still assumed
        and asks the smallest clarifying question that matters.
      alternatives_considered: Compares two credible sharding boundaries options,
        or explains the hard constraint that makes comparison a false equivalence.
      tradeoff_quality: Connects the sharding boundaries choice to a benefit, a cost
        or risk, and the condition under which another choice wins.
      follow_up_adaptation: Responds to the failure challenge about sharding boundaries
        by changing the claim or evidence boundary rather than repeating the base
        answer.
      certainty_calibration: Uses medium certainty deliberately and names the evidence
        that would update the sharding boundaries recommendation.
- id: databases-11-backup-recovery
  version: 1.4.0
  target: databases
  topic: backup recovery
  difficulty: 2
  interview_stage: deep_dive
  prompt: Backups are green every night. What evidence would convince you recovery
    is real?
  context: The service has an RPO of fifteen minutes and an RTO of two hours.
  best_answer: I would schedule restoration drills into an isolated environment, measure
    the recovered point and elapsed time, and report failures as operational debt.
    A backup job alone does not prove credentials, tooling, or data integrity will
    work under pressure.
  distractors:
  - text: I would trust the storage-provider dashboard because a successful upload
      is equivalent to a restore. If a backup is present, recovery should work when
      needed.
    trap: content
    why_wrong: It ignores the backup recovery constraint and would make the proposed
      change unsafe or untestable.
  - text: I would run one restore after a major incident because routine drills are
      disruptive. The team can validate the process during real pressure.
    trap: precision
    why_wrong: It substitutes an absolute rule for the workload, failure mode, and
      verification step this scenario requires.
  feedback:
    register: 'Use the language of proof: a restore drill demonstrates recovery.'
    hedging: Do not hedge the drill requirement; qualify only the chosen frequency.
    precision: State recovered point, elapsed time, RPO, RTO, and isolated environment.
    grammar: Keep RPO and RTO in distinct clauses to avoid conflating them.
    pragmatics: Report failed drills as owned operational debt, not an infrastructure
      inconvenience.
  rephrase:
    prompt: Rephrase this backup recovery decision for an engineering manager who
      needs risk, cost, and next action.
    goal: Preserve the concrete boundary and the signal that validates it.
  follow_up:
    prompt: A drill restores the data within two hours but only to an hour before
      the failure. How would you report that result against the objectives?
    goal: Answer the new_evidence challenge about backup recovery while keeping the
      evidence boundary explicit.
    challenge_kind: new_evidence
    best_answer: >-
      I would schedule restoration drills into an isolated environment, measure the recovered point and
      elapsed time, and report failures as operational debt. A two-hour restore with an RPO of one
      hour misses an objective that requires a more recent point, so I would record the gap and add
      WAL/PITR or a tighter schedule only after confirming and retesting the target.
    distractors:
    - text: I would keep the backup recovery recommendation unchanged because changing
        position would look inconsistent.
      why_wrong: A defensible answer updates when relevant evidence changes an assumption
        or trade-off.
    - text: I would discard every earlier backup recovery claim as soon as one new
        observation appeared.
      why_wrong: New evidence may narrow one claim while leaving other verified facts
        intact.
  compression:
    prompt: Preserve the isolated restore drill, measured recovered point and duration,
      RPO/RTO comparison, and operational-debt follow-up in two sentences.
    goal: Compress the backup recovery answer into its decision, premise, trade-off,
      and verification step.
  language_focus:
  - precision
  - hedging
  - pragmatics
  feynman:
    concept: Why a backup file is only an input to recovery, not proof that recovery
      meets an objective.
    explain_to: the incident commander responsible for continuity
    constraint: Use the fifteen-minute data-loss limit and two-hour restoration limit.
    self_check: Can they distinguish the recovered point from elapsed restore time?
    reasoning_check: Can you identify the hidden premise behind backup recovery, give
      a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: Nightly backups report success, yet nobody has restored the service recently.
    expected: A drill restores valid data to isolation within the RPO and RTO targets.
    actual: The team knows the upload completed but not whether credentials, tooling,
      or data integrity work.
    root_cause: Backup delivery is being measured instead of end-to-end recovery.
    repair: Schedule restore drills, record point and duration, and assign remediation
      for missed objectives.
    reasoning_error: If your backup recovery answer failed, classify the mistake as
      a fact, assumption, comparison, failure, or certainty error before proposing
      the smallest repair.
  recall:
    active_recall_cue: For backup recovery, what must remain true, what is the trade-off,
      and what evidence changes the decision?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind backup recovery without presenting
      an assumption as a fact?
    black_box_probe: When the backup recovery answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: databases-11-backup-recovery-delayed-11
      prompt: >-
        A drill restores within two hours but only to one hour before failure, while the objective requires a fifteen-minute RPO. How do you report it?
      changed_constraint: >-
        the measured recovery point misses the stated RPO even though elapsed restore meets RTO
      new_evidence: >-
        the drill records a one-hour data gap against a fifteen-minute target
      best_answer: >-
        I would report the RPO failure separately from the two-hour RTO result, then evaluate WAL/PITR or a tighter backup schedule and rerun the drill before claiming recovery readiness.
      distractors:
      - text: I would preserve every part of the original backup recovery answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire backup recovery explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/11-operational-playbooks/playbooks/incident-severity-and-triage.md
    note: Relevant local operational or database decision source.
  - repo: original
    path: english-arcade/databases/backup-recovery
    note: Original interviewer scenario and language coaching.
  extension:
    prompt: 'Defend backup recovery after a counterexample: which backup recovery
      assumption changes, and what evidence keeps the revised backup recovery choice
      honest?'
    goal: Move from the short backup recovery answer to a deep, evidence-led defence
      without inventing an outcome.
  critical_thinking:
    problem_frame: >-
      Green backup jobs are only a request to store data; I must test restored point and elapsed time against explicit RPO and RTO objectives.
    claim_map:
      fact: >-
        A restore drill can measure both recovered point and elapsed restore time.
      inference: >-
        Meeting RTO while missing RPO is still a failed recovery objective.
      assumption: >-
        I am assuming the stated RPO and RTO reflect the product's actual loss and downtime tolerance.
      unknown: >-
        Restore tooling, credentials, integrity, RPO target, and RTO target are unknown.
    comparison:
      applicable: false
      rejected_alternative: >-
        Treating a green backup job and a successful restore drill as equivalent evidence would be a false equivalence: only the drill demonstrates recovery under the stated RPO and RTO.
      hard_constraint: >-
        The hard constraint is a tested recovered point and elapsed restore time, including credentials, tooling, and integrity checks.
      decision_rule: >-
        Schedule an isolated restore and measure recovered data and time; keep the backup job as supporting evidence, not as proof that recovery works.
    failure_probe:
      kind: edge_case
      prompt: >-
        What drill result would show the recovered point is too old even though restore elapsed time passes?
    evidence_check:
      basis: Check the backup recovery claim against system-design-estudos/areas/11-operational-playbooks/playbooks/incident-severity-and-triage.md
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: This database design exercise can test reasoning about backup recovery,
        but it cannot prove an unmeasured production outcome, personal ownership,
        or universal rule.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        I am confident that drills are the proof boundary; recovery architecture and frequency require objective and drill evidence.
      update_trigger: >-
        Update when a drill, integrity check, or objective revision changes the required backup and restore path.
    rubric:
      facts_correct: Names the verified backup recovery facts without smuggling in
        a result, scale, or capability that the prompt does not establish.
      assumptions_explicit: Labels the backup recovery premise that is still assumed
        and asks the smallest clarifying question that matters.
      alternatives_considered: Compares two credible backup recovery options, or explains
        the hard constraint that makes comparison a false equivalence.
      tradeoff_quality: Connects the backup recovery choice to a benefit, a cost or
        risk, and the condition under which another choice wins.
      follow_up_adaptation: Responds to the new_evidence challenge about backup recovery
        by changing the claim or evidence boundary rather than repeating the base
        answer.
      certainty_calibration: Uses medium certainty deliberately and names the evidence
        that would update the backup recovery recommendation.
- id: databases-12-datastore-tradeoffs
  version: 1.4.0
  target: databases
  topic: datastore tradeoffs
  difficulty: 3
  interview_stage: deep_dive
  prompt: A team wants Redis, PostgreSQL, and a search engine for a new feature. How
    would you narrow the choice?
  context: The feature stores durable customer preferences and serves occasional filtered
    search.
  best_answer: I would start with durability, query shape, consistency, and recovery
    needs, then choose PostgreSQL unless measured search requirements justify another
    system. I would name the migration trigger so the design stays reversible rather
    than adopting three stores by default.
  distractors:
  - text: I would adopt all three now because polyglot persistence is more future-proof.
      Each system can serve a narrow concern before the feature has real traffic,
      and the team can build the synchronization paths while the feature is still
      small.
    trap: precision
    why_wrong: It ignores the datastore tradeoffs constraint and would make the proposed
      change unsafe or untestable.
  - text: I would choose the fastest benchmark without checking persistence or failure
      semantics. Search speed is visible to users, while recovery can be solved later.
    trap: pragmatics
    why_wrong: It substitutes an absolute rule for the workload, failure mode, and
      verification step this scenario requires.
  feedback:
    register: Lead with the minimum durable system, then justify any extra store.
    hedging: Use ‘unless measured requirements justify it’ for the search-engine addition.
    precision: Name durability, query shape, consistency, recovery, and the migration
      trigger.
    grammar: Use a compact ‘because’ sentence to link requirements to the first choice.
    pragmatics: Frame reversibility as a delivery advantage rather than indecision.
  rephrase:
    prompt: Rephrase this datastore tradeoffs decision for an engineering manager
      who needs risk, cost, and next action.
    goal: Preserve the concrete boundary and the signal that validates it.
  follow_up:
    prompt: What measured search behaviour would justify a dedicated search engine
      instead of extending the first PostgreSQL design?
    goal: Answer the assumption challenge about datastore tradeoffs while keeping
      the evidence boundary explicit.
    challenge_kind: assumption
    best_answer: >-
      I would start with durability, query shape, consistency, and recovery needs, then choose PostgreSQL
      unless measured search requirements justify another system. I would compare representative
      search latency, recall, indexing cost, recovery, and rollback before adding a search engine;
      a migration trigger keeps the first design reversible.
    distractors:
    - text: I would repeat my original datastore tradeoffs answer with more confidence
        because the interviewer probably assumes the usual case.
      why_wrong: It hides the premise instead of checking whether the usual case is
        actually part of this problem.
    - text: I would stop proposing anything about datastore tradeoffs until every
        surrounding requirement had been documented in full.
      why_wrong: It treats uncertainty as a reason for paralysis and offers no bounded
        next step.
  compression:
    prompt: Preserve the durable-preferences baseline, query and consistency criteria,
      measured search trigger, and reversible migration point in two sentences.
    goal: Compress the datastore tradeoffs answer into its decision, premise, trade-off,
      and verification step.
  language_focus:
  - precision
  - hedging
  - pragmatics
  feynman:
    concept: How durable preferences and occasional filtering can begin with one store
      without foreclosing later search.
    explain_to: a product team choosing its first persistence design
    constraint: Contrast a required recovery property with a measured query requirement.
    self_check: Can they name the observation that would justify a second datastore?
    reasoning_check: Can you identify the hidden premise behind datastore tradeoffs,
      give a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: A new preferences feature proposes Redis, PostgreSQL, and search before
      usage is known.
    expected: Durable customer state has one clear source of truth and search complexity
      is justified by evidence.
    actual: Three stores create replication, recovery, and consistency work for an
      occasional filter.
    root_cause: Technology options were selected before durability and query requirements
      were ranked.
    repair: Start with PostgreSQL, instrument the filter workload, and define the
      threshold for extracting search.
    reasoning_error: If your datastore tradeoffs answer failed, classify the mistake
      as a fact, assumption, comparison, failure, or certainty error before proposing
      the smallest repair.
  recall:
    active_recall_cue: For datastore tradeoffs, what must remain true, what is the
      trade-off, and what evidence changes the decision?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind datastore tradeoffs without
      presenting an assumption as a fact?
    black_box_probe: When the datastore tradeoffs answer failed, did you locate the
      reasoning error before changing the implementation?
    delayed_variant:
      id: databases-12-datastore-tradeoffs-delayed-12
      prompt: >-
        A representative search benchmark shows PostgreSQL misses the p95 and recall target, while a search engine meets them at measured indexing cost. What changes?
      changed_constraint: >-
        the dedicated search system is justified only by measured search behavior and an owned recovery path
      new_evidence: >-
        matched queries show the PostgreSQL design misses p95 or recall while the search engine meets the agreed target
      best_answer: >-
        I would keep PostgreSQL for the transactional boundary, add the search engine only with measured p95, recall, indexing, recovery, and rollback evidence, and document the migration trigger.
      distractors:
      - text: I would preserve every part of the original datastore tradeoffs answer
          because changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire datastore tradeoffs explanation with a new
          design without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/09-backend-principles/cards/postgres-databases.md
    note: Relevant local operational or database decision source.
  - repo: original
    path: english-arcade/databases/datastore-tradeoffs
    note: Original interviewer scenario and language coaching.
  extension:
    prompt: 'Five more minutes on datastore tradeoffs: which boundary, alternative,
      and update trigger would you explain for datastore tradeoffs?'
    goal: Move from the short datastore tradeoffs answer to a deep, evidence-led defence
      without inventing an outcome.
  critical_thinking:
    problem_frame: >-
      A feature has durability, query shape, consistency, and recovery requirements; I must add a search system only when matched search evidence outweighs extra operational boundaries.
    claim_map:
      fact: >-
        PostgreSQL can remain the first transactional store when its measured query contract fits.
      inference: >-
        A search engine may win on measured p95 or recall but introduces indexing, recovery, and rollback obligations.
      assumption: >-
        I am assuming the initial feature does not yet have a measured search requirement that PostgreSQL misses.
      unknown: >-
        Query distribution, p95, recall, index freshness, recovery, and migration cost are unknown.
    comparison:
      applicable: true
      alternatives:
      - option: a relational store with constraints and transactions as the source of truth
        benefit: I can enforce cross-row invariants and query the operational state with one transaction boundary.
        cost_or_risk: Schema changes, hot indexes, and horizontal scale need deliberate capacity and migration work.
        valid_when: Use it when correctness and relational queries dominate the access pattern.
      - option: a key-value or document store optimized around a known aggregate access path
        benefit: I can scale that access pattern and shape records around low-latency reads.
        cost_or_risk: Cross-aggregate invariants and ad hoc queries move into application workflows or another store.
        valid_when: Use it when the aggregate boundary and consistency trade-off are explicit and measured.
      decision_rule: I choose the store that can enforce the required invariant at the required boundary; I do not trade away constraints for a scale claim the workload has not established.
    failure_probe:
      kind: failure_mode
      prompt: >-
        Which matched search benchmark would justify adding a separate search engine rather than tuning PostgreSQL?
    evidence_check:
      basis: Check the datastore tradeoffs claim against system-design-estudos/areas/09-backend-principles/cards/postgres-databases.md
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: This database design exercise can test reasoning about datastore
        tradeoffs, but it cannot prove an unmeasured production outcome, personal
        ownership, or universal rule.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        I am confident in starting with the smallest durable boundary; the datastore decision depends on measured search and recovery evidence.
      update_trigger: >-
        Update when representative latency, recall, freshness, or recovery tests cross the agreed trigger.
    rubric:
      facts_correct: Names the verified datastore tradeoffs facts without smuggling
        in a result, scale, or capability that the prompt does not establish.
      assumptions_explicit: Labels the datastore tradeoffs premise that is still assumed
        and asks the smallest clarifying question that matters.
      alternatives_considered: Compares two credible datastore tradeoffs options,
        or explains the hard constraint that makes comparison a false equivalence.
      tradeoff_quality: Connects the datastore tradeoffs choice to a benefit, a cost
        or risk, and the condition under which another choice wins.
      follow_up_adaptation: Responds to the assumption challenge about datastore tradeoffs
        by changing the claim or evidence boundary rather than repeating the base
        answer.
      certainty_calibration: Uses medium certainty deliberately and names the evidence
        that would update the datastore tradeoffs recommendation.
