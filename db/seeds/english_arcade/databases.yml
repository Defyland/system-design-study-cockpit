- id: databases-07-partitioning-pruning
  version: 1.4.0
  target: databases
  topic: partitioning pruning
  difficulty: 1
  interview_stage: deep_dive
  prompt: An events table is growing by billions of rows each year. When would partitioning
    be justified?
  context: Most investigations filter by event date, but one export scans a customer
    across several years.
  best_answer: I would partition by a boundary present in the dominant access path,
    such as time, and verify pruning with real plans. I would also price retention,
    rebalancing, and the cross-partition export before treating partitioning as a
    free performance fix.
  distractors:
  - text: I would partition by a random hash immediately because more tables always
      mean faster queries, regardless of the filter in the investigation query. The
      database will distribute the work evenly across the new tables.
    trap: content
    why_wrong: It ignores the partitioning pruning constraint and would make the proposed
      change unsafe or untestable.
  - text: I would create a partition for every customer so customer exports are isolated.
      The date filter can be handled inside each partition.
    trap: precision
    why_wrong: It substitutes an absolute rule for the workload, failure mode, and
      verification step this scenario requires.
  feedback:
    register: Present partitioning as an operational trade-off, not a universal scaling
      badge.
    hedging: Use ‘if date remains the dominant predicate’ before selecting a time
      boundary.
    precision: Distinguish pruning, retention, rebalancing, and cross-partition export
      cost.
    grammar: Keep the justification in a cause-and-effect sentence.
    pragmatics: Mention the awkward long-lived customer export without dismissing
      it.
  rephrase:
    prompt: Rephrase this partitioning pruning decision for an engineering manager
      who needs risk, cost, and next action.
