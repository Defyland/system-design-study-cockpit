      the evidence boundary explicit.
    challenge_kind: assumption
    best_answer: >-
      I would partition by a boundary present in the dominant access path, such as
      time, and verify pruning with real plans. If the export becomes daily, I would measure
      cross-partition scans, retention, and customer-key locality before revising the partition
      key or adding a read path; partitioning is not a free fix for every access pattern.
    distractors:
    - text: I would repeat my original partitioning pruning answer with more confidence
        because the interviewer probably assumes the usual case.
      why_wrong: It hides the premise instead of checking whether the usual case is
        actually part of this problem.
    - text: I would stop proposing anything about partitioning pruning until every
        surrounding requirement had been documented in full.
      why_wrong: It treats uncertainty as a reason for paralysis and offers no bounded
        next step.
  compression:
    prompt: Preserve the dominant date predicate, plan-based pruning check, retention/rebalancing
