- id: databases-08-zero-downtime-migrations
  version: 1.4.0
  target: databases
  topic: zero downtime migrations
  difficulty: 2
  interview_stage: deep_dive
  prompt: How would you add a non-null column to a busy table without an outage?
  context: The deployment must stay compatible with two application versions during
    a rolling release.
  best_answer: I would expand first with a nullable or default-safe shape, deploy
    readers and writers that tolerate both forms, then backfill in observable batches.
    Only after verification would I enforce the final constraint and remove compatibility
    code.
  distractors:
  - text: I would add the non-null column with its default in one migration and wait
      for the lock to finish. The rolling deploy can resume once the schema is complete.
    trap: precision
    why_wrong: It ignores the zero downtime migrations constraint and would make the
      proposed change unsafe or untestable.
  - text: I would stop writes, alter the table, and restart the application after
      the schema change. A short maintenance window is safer than carrying compatibility
      code.
    trap: pragmatics
    why_wrong: It substitutes an absolute rule for the workload, failure mode, and
      verification step this scenario requires.
  feedback:
    register: Walk through compatibility as a deployment sequence, not a single DDL
      command.
    hedging: Use ‘only after verification’ for the final constraint, not for the expand
      step.
    precision: Name nullable shape, tolerant versions, batched backfill, and contract
      separately.
    grammar: Use temporal markers—first, then, only after—to prevent ambiguity.
    pragmatics: Show that both old and new application versions remain valid during
      rollout.
  rephrase:
    prompt: Rephrase this zero downtime migrations decision for an engineering manager
      who needs risk, cost, and next action.
    goal: Preserve the concrete boundary and the signal that validates it.
  follow_up:
    prompt: During the backfill, an old worker writes rows without the new value.
      Which compatibility step prevents the final constraint from failing?
    goal: Answer the evidence challenge about zero downtime migrations while keeping
      the evidence boundary explicit.
    challenge_kind: evidence
    best_answer: >-
      I would expand first with a nullable or default-safe shape, deploy readers and writers
      that tolerate both forms, then backfill in observable batches. I would keep old workers safe
      by making the new value optional during the overlap, observe failed backfill rows, and enforce
      the final constraint only after old-writer coverage is proven.
    distractors:
    - text: I would cite my experience with zero downtime migrations as enough proof
        and move on without naming an observation.
      why_wrong: Experience can guide a hypothesis, but it does not replace evidence
        tied to this context.
    - text: I would collect every possible metric about zero downtime migrations before
        making even a provisional recommendation.
      why_wrong: A focused decision can start with one discriminating observation
        rather than an unbounded data request.
  compression:
    prompt: Preserve expand compatibility, dual-version readers/writers, observable
      batches, final constraint, and compatibility cleanup in two sentences.
    goal: Compress the zero downtime migrations answer into its decision, premise,
      trade-off, and verification step.
  language_focus:
  - precision
  - hedging
  - pragmatics
  feynman:
    concept: Why a schema change must coexist with old and new application versions
      during a rolling deploy.
    explain_to: an engineer preparing a busy-table migration
    constraint: Explain expand, tolerant writes, observable backfill, and final contract
      in order.
    self_check: Can they identify the point at which a non-null rule becomes safe?
    reasoning_check: Can you identify the hidden premise behind zero downtime migrations,
      give a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: A busy-table migration blocks writes while some old workers are still
      running.
    expected: Both deployed versions can read and write valid rows throughout the
      change.
    actual: A one-step non-null alteration holds a disruptive lock and old code cannot
      supply the value.
    root_cause: Schema enforcement was introduced before compatibility and data backfill
      existed.
    repair: Expand safely, release tolerant code, backfill in monitored batches, then
      contract after verification.
    reasoning_error: If your zero downtime migrations answer failed, classify the
      mistake as a fact, assumption, comparison, failure, or certainty error before
      proposing the smallest repair.
  recall:
    active_recall_cue: For zero downtime migrations, what must remain true, what is
      the trade-off, and what evidence changes the decision?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind zero downtime migrations
      without presenting an assumption as a fact?
    black_box_probe: When the zero downtime migrations answer failed, did you locate
      the reasoning error before changing the implementation?
    delayed_variant:
      id: databases-08-zero-downtime-migrations-delayed-8
      prompt: >-
        During backfill, an old worker writes rows without the new value. Which compatibility step protects the final constraint?
      changed_constraint: >-
        the new column must remain optional until old writers are upgraded
      new_evidence: >-
        backfill monitoring finds null new values created by the old worker
      best_answer: >-
        I would keep the column nullable, deploy tolerant readers and dual-writing writers, backfill in batches, and enforce NOT NULL only after old-writer coverage and failed rows are resolved.
      distractors:
      - text: I would preserve every part of the original zero downtime migrations
          answer because changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire zero downtime migrations explanation with
          a new design without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/11-operational-playbooks/playbooks/database-migration-and-backfill.md
    note: Relevant local operational or database decision source.
  - repo: original
    path: english-arcade/databases/zero-downtime-migrations
    note: Original interviewer scenario and language coaching.
  extension:
    prompt: Connect zero downtime migrations, connect the zero downtime migrations
      implementation choice to its failure mode, measurement, and condition for choosing
      the alternative.
    goal: Move from the short zero downtime migrations answer to a deep, evidence-led
      defence without inventing an outcome.
  critical_thinking:
    problem_frame: >-
      A busy table must accept old and new writers during a non-null-column rollout; I must preserve compatibility until backfill and validation finish.
    claim_map:
      fact: >-
        Old workers may write rows without the new value during deployment overlap.
      inference: >-
        Nullable or default-safe expansion plus tolerant readers and writers prevents the final constraint from racing old code.
      assumption: >-
        I am assuming the old worker can be upgraded or isolated before the constraint is enforced.
      unknown: >-
        Writer lifetime, failed-row repair, lock behavior, and validation duration are unknown.
    comparison:
      applicable: true
      alternatives:
      - option: an expand-and-contract migration with old and new workers compatible
        benefit: I can add, backfill, validate, switch reads or writes, and remove the old shape across separate deploys.
        cost_or_risk: I must support dual compatibility and track backfill, verification, and cleanup state.
        valid_when: Use it when rolling deploys or a large table make a blocking rewrite unsafe.
      - option: a single schema rewrite during a controlled maintenance window
        benefit: It is easier to implement and reason about for a small table with no overlapping workers.
        cost_or_risk: Lock or rewrite time can exceed the window and leave rollback or partial deployment difficult.
        valid_when: Use it only when table size, lock duration, and downtime are measured and explicitly accepted.
      decision_rule: I use expand-and-contract when compatibility or lock risk matters; I choose one change only when the measured window proves it safe.
    failure_probe:
      kind: edge_case
      prompt: >-
        Which old-writer observation would make enforcing NOT NULL now unsafe?
    evidence_check:
      basis: Check the zero downtime migrations claim against system-design-estudos/areas/11-operational-playbooks/playbooks/database-migration-and-backfill.md
        and the exact interview context; record whether each part is fact, inference,
