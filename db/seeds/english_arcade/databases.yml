- id: databases-11-backup-recovery
  version: 1.4.0
  target: databases
  topic: backup recovery
  difficulty: 2
  interview_stage: deep_dive
  prompt: Backups are green every night. What evidence would convince you recovery
    is real?
  context: The service has an RPO of fifteen minutes and an RTO of two hours.
  best_answer: I would schedule restoration drills into an isolated environment, measure
    the recovered point and elapsed time, and report failures as operational debt.
    A backup job alone does not prove credentials, tooling, or data integrity will
    work under pressure.
  distractors:
  - text: I would trust the storage-provider dashboard because a successful upload
      is equivalent to a restore. If a backup is present, recovery should work when
      needed.
