      verification step this scenario requires.
  feedback:
    register: 'Use the language of proof: a restore drill demonstrates recovery.'
    hedging: Do not hedge the drill requirement; qualify only the chosen frequency.
    precision: State recovered point, elapsed time, RPO, RTO, and isolated environment.
    grammar: Keep RPO and RTO in distinct clauses to avoid conflating them.
    pragmatics: Report failed drills as owned operational debt, not an infrastructure
      inconvenience.
