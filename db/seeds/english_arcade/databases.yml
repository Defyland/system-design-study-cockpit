---
contract_version: 1.4.0
target:
  key: databases
  label: Databases
  blurb: Interview practice for data integrity, query behaviour, and operational recovery.
  focus_areas:
  - modeling and constraints
  - query plans and indexes
  - transactions and locks
  - replication and recovery
  simulation:
    minutes: 45
    structure:
    - label: scope
      minutes: 5
    - label: workload
      minutes: 10
    - label: decision
      minutes: 15
    - label: failure
      minutes: 10
    - label: compression
      minutes: 5
  critical_thinking:
    learner_prompts:
      evidence_ledger: For database design, record whether each claim about schema
        constraints, query plans, isolation, replication, and migration safety is
        a verified fact, an inference, an assumption, or an unknown before you defend
        it.
      problem_frame: Frame every database design answer with the actor, requirement,
        constraint, success condition, and unanswered question that could change the
        decision.
      comparison: When database design offers a real choice, compare two options by
        benefit, cost or risk, valid-when condition, and an explicit decision rule.
      failure_probe: Ask which counterexample, edge case, or failure mode could break
        the database design recommendation, then state the smallest test or containment
        step.
      certainty_review: 'Calibrate certainty in database design: name the evidence,
        separate correlation from causality, and say what new observation would make
        you revise the answer.'
    rubric:
      facts_correct: Names the verified schema constraints, query plans, isolation,
        replication, and migration safety facts without smuggling in a result or capability
        that the prompt does not establish.
      assumptions_explicit: Labels the database design premise that is still assumed
        and asks the smallest clarifying question that matters.
      alternatives_considered: Considers a credible alternative for database design,
        or explains the hard constraint that makes comparison a false equivalence.
      tradeoff_quality: Connects the database design choice to a benefit, a cost or
        risk, and the condition under which another choice wins.
      follow_up_adaptation: Responds to an adversarial database design follow-up by
        changing the claim or evidence boundary rather than repeating a memorised
        answer.
      certainty_calibration: Uses high, medium, or low certainty deliberately and
        names the evidence that would update the database design recommendation.
cards:
- id: databases-card-invariant
  front: What starts a credible database answer?
  back: State the invariant and access path before naming an index, store, or topology.
  box: 1
  source:
    repo: system-design-estudos
    path: areas/12-engineering-practice/cards/data-contracts-and-schema-evolution.md
    note: Data-contract discipline.
  critical_thinking:
    cue: What starts a credible database answer? Before answering, separate the stated
      fact from your assumption and name one condition that could change it.
    check: For this database design card, can you compare two options, name one failure
      mode, and state what evidence would update the recommendation?
- id: databases-card-plan
  front: What makes an EXPLAIN answer useful?
  back: Compare estimated and actual rows, isolate one costly node, and test one bounded
    hypothesis.
  box: 1
  source:
    repo: system-design-estudos
    path: areas/09-backend-principles/cards/postgres-databases.md
    note: PostgreSQL operational reasoning.
  critical_thinking:
    cue: What makes an EXPLAIN answer useful? Before answering, separate the stated
      fact from your assumption and name one condition that could change it.
    check: For this database design card, can you compare two options, name one failure
      mode, and state what evidence would update the recommendation?
- id: databases-card-recovery
  front: What proves recovery?
  back: A measured restore drill against stated RPO and RTO, not merely a successful
    backup upload.
  box: 2
  source:
    repo: system-design-estudos
    path: areas/11-operational-playbooks/playbooks/incident-severity-and-triage.md
    note: Operational evidence.
  critical_thinking:
    cue: What proves recovery? Before answering, separate the stated fact from your
      assumption and name one condition that could change it.
    check: For this database design card, can you compare two options, name one failure
      mode, and state what evidence would update the recommendation?
items:
- id: databases-01-modeling-constraints
  version: 1.4.0
  target: databases
  topic: modeling constraints
  difficulty: 1
  interview_stage: deep_dive
  prompt: A customer can redeem a promotion only once. Where would you enforce that
    rule?
  context: Checkout is being retried by browsers and a background worker. The interviewer
    is testing whether you distinguish a friendly validation message from the final
    integrity boundary.
  best_answer: I would put a unique constraint on the redemption identity in the database,
    because concurrent application checks can both pass. The service can pre-check
    to give a useful message, but it must handle the constraint violation idempotently
    and measure rejected duplicates.
  distractors:
  - text: I would check for an existing redemption before creating the charge, then
      return it if one is present. Authentication identifies the customer, so the
      application-level check should prevent the duplicate.
    trap: content
    why_wrong: It ignores the modeling constraints constraint and would make the proposed
      change unsafe or untestable.
  - text: I would mark the promotion as used on the customer record after payment
      succeeds. That keeps the model small and avoids a separate redemption record
      for every promotion.
    trap: precision
    why_wrong: It substitutes an absolute rule for the workload, failure mode, and
      verification step this scenario requires.
  feedback:
    register: Say ‘I would enforce this in the database’ before describing service
      behaviour.
    hedging: Qualify only the user-facing pre-check; the integrity boundary is not
      optional.
    precision: Name the unique redemption identity instead of vaguely saying ‘prevent
      duplicates.’
    grammar: Use ‘because’ to link the concurrent race to its consequence.
    pragmatics: Acknowledge the friendly validation path before returning to the authoritative
      rule.
  rephrase:
    prompt: Rephrase this modeling constraints decision for an engineering manager
      who needs risk, cost, and next action.
    goal: Preserve the concrete boundary and the signal that validates it.
  follow_up:
    prompt: How would you define the unique redemption key if a promotion can be redeemed
      once per household rather than once per account?
    goal: Answer the new_evidence challenge about modeling constraints while keeping
      the evidence boundary explicit.
    challenge_kind: new_evidence
    best_answer: >-
      I would put a unique constraint on the redemption identity in the database, because
      concurrent application checks can both pass. I would keep the claims that remain supported,
      identify exactly which premise the new observation changes, and run a focused check before
      revising the decision.
    distractors:
    - text: I would keep the modeling constraints recommendation unchanged because
        changing position would look inconsistent.
      why_wrong: A defensible answer updates when relevant evidence changes an assumption
        or trade-off.
    - text: I would discard every earlier modeling constraints claim as soon as one
        new observation appeared.
      why_wrong: New evidence may narrow one claim while leaving other verified facts
        intact.
  compression:
    prompt: In two sentences, preserve the unique constraint, idempotent violation
      path, and duplicate-rejection metric.
    goal: Compress the modeling constraints answer into its decision, premise, trade-off,
      and verification step.
  language_focus:
  - precision
  - hedging
  - pragmatics
  feynman:
    concept: Why a database constraint settles a race that a preliminary application
      check cannot.
    explain_to: a new engineer implementing redemption retries
    constraint: Use two simultaneous checkouts and distinguish a courtesy message
      from the final gate.
    self_check: Could they explain why one failed insert is a normal idempotent outcome?
    reasoning_check: Can you identify the hidden premise behind modeling constraints,
      give a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: Two retrying checkout paths occasionally issue a promotion twice.
    expected: Exactly one persisted redemption for each promotion and customer identity.
    actual: Both requests pass the read-before-write check before either writes.
    root_cause: The invariant exists only in application code, outside the concurrent
      write boundary.
    repair: Add the unique key, map its violation to the existing redemption, and
      count collisions.
    reasoning_error: If your modeling constraints answer failed, classify the mistake
      as a fact, assumption, comparison, failure, or certainty error before proposing
      the smallest repair.
  recall:
    active_recall_cue: For modeling constraints, what must remain true, what is the
      trade-off, and what evidence changes the decision?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind modeling constraints without
      presenting an assumption as a fact?
    black_box_probe: When the modeling constraints answer failed, did you locate the
      reasoning error before changing the implementation?
    delayed_variant:
      id: databases-01-modeling-constraints-delayed-1
      prompt: 'Modeling constraints: the later modeling constraints review says a
        measured modeling constraints comparison shows the alternative has a different
        modeling constraints cost profile. Under the modeling constraints workload
        for modeling constraints no longer fits the original resource bound, which
        part of modeling constraints survives and which modeling constraints claim
        changes?'
      changed_constraint: the modeling constraints workload for modeling constraints
        no longer fits the original resource bound
      new_evidence: a measured modeling constraints comparison shows the alternative
        has a different modeling constraints cost profile
      best_answer: I would keep the facts that remain supported about modeling constraints,
        treat a measured modeling constraints comparison shows the alternative has
        a different modeling constraints cost profile as new evidence rather than
        a result, and state the updated decision rule under the modeling constraints
        workload for modeling constraints no longer fits the original resource bound.
        I would then name one focused check before treating the revised answer as
        settled.
      distractors:
      - text: I would preserve every part of the original modeling constraints answer
          because changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire modeling constraints explanation with a new
          design without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/12-engineering-practice/cards/data-contracts-and-schema-evolution.md
    note: Relevant local operational or database decision source.
  - repo: original
    path: english-arcade/databases/modeling-constraints
    note: Original interviewer scenario and language coaching.
  extension:
    prompt: 'Modeling constraints: inspect modeling constraints evidence next; which
      edge case for modeling constraints would alter the trade-off?'
    goal: Move from the short modeling constraints answer to a deep, evidence-led
      defence without inventing an outcome.
  critical_thinking:
    problem_frame: 'Frame modeling constraints before proposing a solution: state
      the actor, required outcome, constraint, and unknown that could invalidate the
      first recommendation.'
    claim_map:
      fact: The prompt explicitly tests modeling constraints within a database design
        context; treat that named boundary as the verified starting fact.
      inference: The reasonable inference is that the answer must defend modeling
        constraints, but that does not prove one implementation wins under every workload
        or audience.
      assumption: An unstated assumption is that the modeling constraints constraint
        is the dominant one; label it and ask whether the interviewer confirms it.
      unknown: 'Still unknown for modeling constraints: the scale, failure tolerance,
        ownership boundary, and evidence threshold that would change the decision.'
    comparison:
      applicable: false
      rejected_alternative: A tool-first A-versus-B debate about modeling constraints
        would be a false equivalence because the prompt does not establish that both
        choices satisfy the same contract.
      hard_constraint: The hard modeling constraints constraint is the required guarantee
        stated by the interviewer; no missing measurement licenses a stronger comparison.
      decision_rule: Do not manufacture a trade-off for modeling constraints; first
        clarify the constraint or collect the evidence that would make two options
        genuinely comparable.
    failure_probe:
      kind: counterexample
      prompt: 'Modeling constraints: what minimum input for modeling constraints would
        break the modeling constraints recommendation, and how would you revise the
        modeling constraints claim?'
    evidence_check:
      basis: Check the modeling constraints claim against system-design-estudos/areas/12-engineering-practice/cards/data-contracts-and-schema-evolution.md
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: This database design exercise can test reasoning about modeling
        constraints, but it cannot prove an unmeasured production outcome, personal
        ownership, or universal rule.
      checked_on: '2026-08-25'
    certainty:
      level: high
      rationale: Certainty is high because the prompt bounds the modeling constraints
        question but does not reveal every workload, stakeholder priority, or outcome.
      update_trigger: For case "A customer can redeem a promotion only", update modeling
        constraints when modeling constraints evidence—a modeling constraints trace
        or modeling constraints test—contradicts the modeling constraints constraint
        in case "A customer can redeem a promotion only"; ask a stakeholder about
        modeling constraints before revising.
    rubric:
      facts_correct: Names the verified modeling constraints facts without smuggling
        in a result, scale, or capability that the prompt does not establish.
      assumptions_explicit: Labels the modeling constraints premise that is still
        assumed and asks the smallest clarifying question that matters.
      alternatives_considered: Compares two credible modeling constraints options,
        or explains the hard constraint that makes comparison a false equivalence.
      tradeoff_quality: Connects the modeling constraints choice to a benefit, a cost
        or risk, and the condition under which another choice wins.
      follow_up_adaptation: Responds to the new_evidence challenge about modeling
        constraints by changing the claim or evidence boundary rather than repeating
        the base answer.
      certainty_calibration: Uses high certainty deliberately and names the evidence
        that would update the modeling constraints recommendation.
- id: databases-02-indexes-workload
  version: 1.4.0
  target: databases
  topic: indexes workload
  difficulty: 2
  interview_stage: deep_dive
  prompt: An orders screen filters by account and status, then sorts by newest first.
    How would you choose the index?
  context: The table has tens of millions of rows and writes are steady. You may ask
    one question before recommending a change.
  best_answer: I would confirm the actual predicates, ordering, and selectivity, then
    test a composite index aligned with account, status, and created-at. I would compare
    the plan and write overhead before keeping it, because a broad index can make
    the screen faster while slowing ingestion.
  distractors:
  - text: I would add separate indexes on account_id, status, and created_at. The
      planner can combine them, and each will also help a future screen using just
      one filter, so the write overhead should remain manageable.
    trap: precision
    why_wrong: It ignores the indexes workload constraint and would make the proposed
      change unsafe or untestable.
  - text: I would index created_at descending because users care about newest orders.
      Once sorting is cheap, the account and status filters should be cheap enough
      too.
    trap: pragmatics
    why_wrong: It substitutes an absolute rule for the workload, failure mode, and
      verification step this scenario requires.
  feedback:
    register: Present an evidence-led index recommendation, not a promise that an
      index will help.
    hedging: Use ‘if the common predicate is…’ before committing to column order.
    precision: Separate equality filters, ordering, selectivity, and write cost.
    grammar: Keep the proposed column sequence in one clear noun phrase.
    pragmatics: Spend the permitted question on the most selective real workload detail.
  rephrase:
    prompt: Rephrase this indexes workload decision for an engineering manager who
      needs risk, cost, and next action.
    goal: Preserve the concrete boundary and the signal that validates it.
  follow_up:
    prompt: If one large account has millions of open orders, how would you validate
      that the proposed column order still works?
    goal: Answer the assumption challenge about indexes workload while keeping the
      evidence boundary explicit.
    challenge_kind: assumption
    best_answer: >-
      I would confirm the actual predicates, ordering, and selectivity, then test a composite index
      aligned with account, status, and created-at. I would label the follow-up premise as an
      assumption, ask the smallest question that could disprove it, and protect the edge case
      before committing to the recommendation.
    distractors:
    - text: I would repeat my original indexes workload answer with more confidence
        because the interviewer probably assumes the usual case.
      why_wrong: It hides the premise instead of checking whether the usual case is
        actually part of this problem.
    - text: I would stop proposing anything about indexes workload until every surrounding
        requirement had been documented in full.
      why_wrong: It treats uncertainty as a reason for paralysis and offers no bounded
        next step.
  compression:
    prompt: Preserve the predicate-and-sort shape, composite-index hypothesis, plan
      comparison, and ingestion trade-off in two sentences.
    goal: Compress the indexes workload answer into its decision, premise, trade-off,
      and verification step.
  language_focus:
  - precision
  - hedging
  - pragmatics
  feynman:
    concept: How a composite index follows an orders screen’s access path.
    explain_to: a colleague reviewing a migration
    constraint: Contrast the read benefit with the extra work on each insert or update.
    self_check: Can they say what plan evidence would make them remove the index?
    reasoning_check: Can you identify the hidden premise behind indexes workload,
      give a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: The inbox query scans and sorts a large account’s orders at peak time.
    expected: A plan that narrows by the real filters and emits rows in the requested
      order.
    actual: Three independent indexes leave a costly bitmap merge and final sort.
    root_cause: The index design followed column names instead of the combined query
      shape.
    repair: Capture production predicates, test the composite candidate, and compare
      read latency with write amplification.
    reasoning_error: If your indexes workload answer failed, classify the mistake
      as a fact, assumption, comparison, failure, or certainty error before proposing
      the smallest repair.
  recall:
    active_recall_cue: For indexes workload, what must remain true, what is the trade-off,
      and what evidence changes the decision?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind indexes workload without
      presenting an assumption as a fact?
    black_box_probe: When the indexes workload answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: databases-02-indexes-workload-delayed-2
      prompt: 'Review note for indexes workload: a indexes workload test exposes a
        boundary case that the indexes workload examples did not cover. Given a stakeholder
        asks for a stronger indexes workload guarantee than the first indexes workload
        answer promised, what would you now defend, retract, and verify about indexes
        workload?'
      changed_constraint: a stakeholder asks for a stronger indexes workload guarantee
        than the first indexes workload answer promised
      new_evidence: a indexes workload test exposes a boundary case that the indexes
        workload examples did not cover
      best_answer: I would keep the facts that remain supported about indexes workload,
        treat a indexes workload test exposes a boundary case that the indexes workload
        examples did not cover as new evidence rather than a result, and state the
        updated decision rule under a stakeholder asks for a stronger indexes workload
        guarantee than the first indexes workload answer promised. I would then name
        one focused check before treating the revised answer as settled.
      distractors:
      - text: I would preserve every part of the original indexes workload answer
          because changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire indexes workload explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/09-backend-principles/cards/postgres-databases.md
    note: Relevant local operational or database decision source.
  - repo: original
    path: english-arcade/databases/indexes-workload
    note: Original interviewer scenario and language coaching.
  extension:
    prompt: 'Deep dive on indexes workload: compare indexes workload options with
      one measurement; which failure around indexes workload would make indexes workload
      switch?'
    goal: Move from the short indexes workload answer to a deep, evidence-led defence
      without inventing an outcome.
  critical_thinking:
    problem_frame: 'Frame indexes workload before proposing a solution: state the
      actor, required outcome, constraint, and unknown that could invalidate the first
      recommendation.'
    claim_map:
      fact: The prompt explicitly tests indexes workload within a database design
        context; treat that named boundary as the verified starting fact.
      inference: The reasonable inference is that the answer must defend indexes workload,
        but that does not prove one implementation wins under every workload or audience.
      assumption: An unstated assumption is that the indexes workload constraint is
        the dominant one; label it and ask whether the interviewer confirms it.
      unknown: 'Still unknown for indexes workload: the scale, failure tolerance,
        ownership boundary, and evidence threshold that would change the decision.'
    comparison:
      applicable: true
      alternatives:
      - option: a constraint or plan backed by database evidence for indexes workload
        benefit: It keeps the indexes workload reasoning close to the stated database
          design constraint and makes the evidence boundary visible.
        cost_or_risk: It can be too narrow if the indexes workload workload or requirement
          changes beyond the prompt.
        valid_when: Use it when the stated indexes workload contract and its invariant
          are the facts that matter most.
      - option: application-side coordination or a different datastore for indexes
          workload
        benefit: It can make the indexes workload boundary more explicit when the
          first option's hidden assumption is not guaranteed.
        cost_or_risk: It adds implementation or communication cost and may solve a
          problem the indexes workload evidence has not established.
        valid_when: Use it when a measured constraint, requirement, or failure mode
          makes the first option unsafe.
      decision_rule: Choose the first indexes workload option when its stated contract
        holds; choose the alternative only when evidence shows that the relevant database
        design constraint makes the first assumption unsafe.
    failure_probe:
      kind: edge_case
      prompt: 'Indexes workload: what indexes workload limit should you probe before
        trusting the answer, and how would indexes workload behave there?'
    evidence_check:
      basis: Check the indexes workload claim against system-design-estudos/areas/09-backend-principles/cards/postgres-databases.md
        and the exact interview context; record whether each part is fact, inference,
