      source_kind: authored_scenario
      limitation: This database design exercise can test reasoning about zero downtime
        migrations, but it cannot prove an unmeasured production outcome, personal
        ownership, or universal rule.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        I am confident in expand/backfill/contract ordering; batch size and cutover need migration telemetry.
      update_trigger: >-
        Update when backfill, old-writer coverage, or lock evidence changes the enforcement window.
    rubric:
      facts_correct: Names the verified zero downtime migrations facts without smuggling
        in a result, scale, or capability that the prompt does not establish.
      assumptions_explicit: Labels the zero downtime migrations premise that is still
