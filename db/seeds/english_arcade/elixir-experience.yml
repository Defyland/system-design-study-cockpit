- id: elixir_experience-08-reconpulse-webhook-failure-circuit-risk
  version: 1.4.0
  target: elixir_experience
  topic: ReconPulse webhook failure and circuit-state risk
  difficulty: 3
  interview_stage: deep_dive
  prompt: How would you describe ReconPulse webhook retries and circuit state without
    overstating coordination across concurrent failures?
  context: The interviewer is probing auditable delivery transitions, endpoint state,
    Oban retry timing, duplicate delivery, and a concurrency risk inferred from the
    code rather than a measured result.
  best_answer: ReconPulse queues a Delivery and Oban job for each eligible endpoint
    in one transaction. Dispatch rejects disabled or open endpoints; a 2xx marks delivery
    and resets endpoint state, while failure records retry or dead-letter status,
    next_retry_at, and endpoint failure state through another Multi. Historical tests
    specify those paths. However, the endpoint was loaded before HTTP and failure_count
    plus one is not an explicit locked or atomic increment, so concurrent failures
    create an inferred risk of stale circuit decisions, not measured distributed breaker
    coordination or exactly-once delivery.
  distractors:
  - text: I would treat each failed HTTP response as a global circuit update because
      the delivery transaction writes durable shared endpoint state. Loading the endpoint
      before the outbound request cannot matter after a Multi commits. next_retry_at
      controls Oban scheduling automatically, and any repeated delivery is harmless
      because a cryptographic signature makes every receiver action idempotent.
    trap: precision
    why_wrong: It treats a stale loaded value as coordinated state, assumes scheduling
      linkage, and confuses signing with receiver-side idempotency.
  - text: I would leave disabled and open endpoints in the retry queue until the HTTP
      client recovers. A successful delivery should reset only that delivery, while
      endpoint failures remain unrelated. Circuit opening proves no concurrent attempt
      can pass, so half-open recovery, duplicate sends, metrics, and endpoint reloads
      need no separate design.
    trap: hedging
    why_wrong: It contradicts discard and reset behavior, and it promotes an inferred
      race boundary into an unsupported global breaker guarantee.
  sources:
  - repo: backend-challenges
    path: reconpulse-elixir-finops-control-tower/README.md
    note: ReconPulse study scope for webhook delivery records, retries, and circuit
      behavior.
  - repo: backend-challenges
    path: reconpulse-elixir-finops-control-tower/lib/recon_pulse/webhooks.ex
    note: Delivery queue transaction, dispatch decisions, retry state, and endpoint
      update implementation.
  - repo: backend-challenges
    path: reconpulse-elixir-finops-control-tower/test/recon_pulse/webhooks_test.exs
    note: Historical retry, terminal circuit, and disabled-endpoint specifications.
  - repo: original
    path: english-arcade/elixir_experience/8
    note: Authored interview-language coaching.
