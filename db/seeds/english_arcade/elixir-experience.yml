- id: elixir_experience-12-rinha-elixir-genserver-serialization-risk
  version: 1.4.0
  target: elixir_experience
  topic: Rinha Elixir single-GenServer serialization risk
  difficulty: 3
  interview_stage: architecture_review
  prompt: How would you redesign Rinha Elixir read concurrency without creating uncontrolled
    reference copies or garbage-collection pressure?
  context: The interviewer is probing synchronous GenServer.call scoring, structural
    serialization, memory ownership, admission, and measured options rather than an
    asserted bottleneck.
  best_answer: >-
    I would treat the ReferenceIndex GenServer as a structural concurrency risk: GenServer.call
    runs Scoring.score synchronously across state.references before replying, so one callback
    loop serializes scoring requests within each API instance. Supervision can restart it but
    adds no read concurrency, and challenge topology may load full references per instance. I
    would measure mailbox, p99, CPU, and RSS, then compare versioned immutable ETS or
    persistent_term snapshots, bounded workers, and admission with warm-swap failure ownership.
  distractors:
  - text: I would solve serialization by starting unbounded Tasks that independently
      duplicate the ReferenceIndex state. The supervisor will absorb memory and garbage
      collection automatically, so mailbox congestion, admission, and ownership become
      irrelevant. Every instance can retain several full indexes, and a process restart
      guarantees an atomic warm swap without measuring CPU, RSS, p99, or queueing
      behavior.
    trap: precision
    why_wrong: It creates uncontrolled copies and scheduler pressure while treating
      supervision as capacity, admission, and atomic-swap machinery.
  - text: I would keep one GenServer forever because immutable data means requests
      are concurrent inside its callback. Adding a second API instance fixes all contention
      without another reference copy. Readiness already measures mailbox delay, and
      a failed replacement can be ignored because the old scoring state remains available
      automatically.
    trap: hedging
    why_wrong: A callback loop still serializes calls, extra instances may replicate
      resources, and neither mailbox behavior nor replacement availability is established.
  sources:
  - repo: backend-challenges
    path: rinha-de-backend-2026-elixir/README.md
    note: Public challenge topology and per-instance full-reference memory boundary.
  - repo: backend-challenges
    path: rinha-de-backend-2026-elixir/lib/rinha_backend_2026/reference_index.ex
    note: GenServer.call and synchronous handle_call scoring boundary.
  - repo: backend-challenges
    path: rinha-de-backend-2026-elixir/lib/rinha_backend_2026/scoring.ex
    note: Exact scorer operating over state references before reply.
  - repo: original
    path: english-arcade/elixir_experience/12
    note: Authored interview-language coaching.
  provenance:
    evidence_class: public_challenge
    project: Rinha de Backend 2026 Elixir
    repository: backend-challenges
    files:
    - path: rinha-de-backend-2026-elixir/README.md
      commit: 2023435681dc99ae08d2a4034ab5feb4226d7480
      claim: The committed README describes challenge-shaped API instances and warns
        that two full in-memory indexes stress the memory budget.
    - path: rinha-de-backend-2026-elixir/lib/rinha_backend_2026/reference_index.ex
      commit: 2023435681dc99ae08d2a4034ab5feb4226d7480
      claim: The committed ReferenceIndex routes score calls through GenServer.call
        and invokes Scoring.score synchronously inside handle_call before reply.
    - path: rinha-de-backend-2026-elixir/lib/rinha_backend_2026/scoring.ex
      commit: 2023435681dc99ae08d2a4034ab5feb4226d7480
      claim: The committed Scoring module performs exact scoring over the reference
        collection supplied by ReferenceIndex state.
    verified_claims:
    - One ReferenceIndex callback loop synchronously executes exact scoring before
      replying, which structurally serializes score calls per API instance.
    - Serialization is a code-derived concurrency risk, not measured p99 or a demonstrated
      bottleneck; supervision restarts a process without adding read concurrency.
    confirmation_required:
    - Establish authorship, challenge submission status, current test execution, mailbox
      depth, p99, CPU, RSS, full-reference instance copies, ETS or persistent_term
      behavior, worker bounds, admission policy, warm-swap atomicity, and failure
      ownership.
    safe_interview_version: This public challenge study identifies synchronous single-GenServer
      scoring as a structural concurrency risk and compares measured snapshot, worker,
      and admission options without claiming a benchmarked bottleneck.
    confidentiality:
      level: high
      note: Do not disclose challenge payloads, reference vectors, index contents,
        mailbox traces, process dumps, CPU or RSS profiles, admission settings, or
        unpublished benchmark data.
  feedback:
    register: Call this a structural serialization risk, not a measured p99 bottleneck.
    hedging: State the GenServer callback fact confidently, then qualify mailbox,
      CPU, RSS, and latency as measurements still needed.
    precision: Name GenServer.call, synchronous handle_call, state.references, one
      callback loop, per-instance copies, versioned snapshots, workers, and admission.
    grammar: Use “supervision restarts; it does not parallelize reads” as a compact
      contrast.
    pragmatics: Present snapshot, bounded-worker, and ownership choices as options
      to measure rather than a universal replacement.
  rephrase:
    prompt: Explain to an OTP engineer why immutable references do not make synchronous
      work inside one GenServer callback concurrent.
    goal: Preserve the callback-loop boundary without declaring a measured outage.
  follow_up:
    prompt: Which mailbox, p99, CPU, and RSS measurements would compare a versioned
      ETS or persistent_term snapshot, bounded workers or Task.Supervisor, and admission
      control? How would warm swap and failure ownership stay atomic?
    goal: Evaluate read-concurrency designs without unmanaged copies.
    challenge_kind: failure
    best_answer: >-
      I would measure mailbox depth, p99, CPU, and RSS under the official workload, then compare a
      versioned ETS or persistent_term snapshot with bounded workers and admission. I would make
      warm swap publish one complete generation, define who owns a failed generation, and verify
      that readers never observe a partial index.
    distractors:
    - text: I would describe the Rinha Elixir single-GenServer serialization risk
        failure as impossible because the happy path already passed its test.
      why_wrong: Passing a happy path does not test the boundary, failure mode, or
        recovery being challenged.
    - text: I would add retries to Rinha Elixir single-GenServer serialization risk
        immediately and assume the system would become reliable.
      why_wrong: Retries can amplify load or duplicate effects; the failure and containment
        policy must be specified first.
  compression:
    prompt: Give four clauses for call serialization, supervision limit, memory-copy
      risk, and measured redesign options.
    goal: Keep structural inference distinct from benchmark evidence.
  language_focus:
  - precision
  - pragmatics
  - hedging
  feynman:
    concept: A single mailbox is a turnstile; one long exact score keeps later callers
      waiting even when the reference data itself is immutable.
    explain_to: A teammate who proposes more calls to the same ReferenceIndex process
      for higher read throughput.
    constraint: Include synchronous scoring, per-instance references, one snapshot
      or worker option, admission, and an RSS measurement.
    self_check: Did you avoid calling the risk a measured bottleneck or assuming snapshots
      are free?
    reasoning_check: Can you identify the hidden premise behind Rinha Elixir single-GenServer
      serialization risk, give a counterexample, and explain how the evidence changes
      your conclusion?
  black_box:
    symptom: Several score calls arrive while ReferenceIndex is computing one full
      exact scan.
    expected: Queueing is measured, data ownership is bounded, admission controls
      overload, and replacement has a warm-swap failure policy.
    actual: All callers wait behind one callback, or a quick fix creates repeated
      large copies and garbage-collection pressure.
    root_cause: Supervised process recovery was confused with parallel serving and
      memory ownership.
    repair: Measure first, choose versioned immutable storage or bounded execution
      deliberately, limit admission, and define atomic replacement plus failure ownership.
    reasoning_error: If your Rinha Elixir single-GenServer serialization risk answer
      failed, classify the mistake as a fact, assumption, comparison, failure, or
      certainty error before proposing the smallest repair.
  recall:
    active_recall_cue: Which call and callback create serialization, and what does
      supervision fail to add?
    feynman_prompt: Why can two API instances improve CPU while also multiplying full-reference
      memory?
    black_box_probe: Did you name mailbox, p99, CPU, RSS, snapshots, bounded workers,
      admission, warm swap, and failure ownership?
    leitner_start_box: 1
    mastery_threshold: 8
    delayed_variant:
      id: elixir_experience-12-rinha-elixir-genserver-serialization-risk-delayed-12
      prompt: >-
        Mailbox and p99 measurements show one GenServer serializes scoring beyond the target, while
        a versioned snapshot has a different memory profile. Which risk is evidenced and what
        warm-swap check is required?
      changed_constraint: >-
        scoring must meet p99 and memory budgets while each reader sees one complete index
        generation
      new_evidence: >-
        measurements show serialized scoring pressure and a snapshot alternative with a different
        RSS profile
      best_answer: >-
        I would upgrade the GenServer serialization from structural risk to a measured bottleneck,
        but I would keep supervision separate from read concurrency. I would compare snapshots and
        bounded workers under the same load, then verify that warm swap publishes one complete
        generation and that a failed generation leaves the previous one readable.
      distractors:
      - text: I would preserve every part of the original Rinha Elixir single-GenServer
          serialization risk answer because changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Rinha Elixir single-GenServer serialization
          risk explanation with a new design without identifying what the evidence
          actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  extension:
    prompt: Define experiments for mailbox depth, p99, CPU, RSS, snapshot copy behavior,
      bounded worker saturation, admission rejection, warm-swap visibility, and replacement
      failure.
    goal: Select a concurrency design from measured throughput, memory, and recovery
      behavior.
  critical_thinking:
    problem_frame: 'I frame read concurrency as a measured interaction between the ReferenceIndex
      callback loop, reference memory, and generation visibility: identify the serialization
      point, target p99/RSS, and failure ownership before choosing a replacement.'
    comparison:
      applicable: true
      alternatives:
      - option: Publish versioned ETS or persistent_term snapshots and warm-swap complete
          generations.
        benefit: Readers can avoid one synchronous callback loop and observe one immutable
          generation if publication is atomic.
        cost_or_risk: Snapshot build or replacement can duplicate memory and pressure
          garbage collection; failed generations need explicit ownership.
        valid_when: Use it when measured read contention dominates and the RSS envelope
          supports generation overlap.
      - option: Keep state ownership but add bounded workers and admission control.
        benefit: It can raise concurrency without allowing unbounded task or reference
          copies and can make overload rejection explicit.
        cost_or_risk: Workers still need safe read snapshots, queue limits, and failure
          handling; admission can reduce availability under load.
        valid_when: Use it when bounded parallelism meets the p99 target without the memory
          cost of full snapshot replacement.
      decision_rule: Measure the current callback bottleneck first; choose snapshots when
        generation overlap fits memory and atomic visibility matters, or bounded workers
        when controlled parallelism meets p99 without unmanaged copies.
    rubric:
      facts_correct: Names synchronous GenServer.call, the per-instance callback loop,
        state.references, and the fact that supervision adds recovery rather than readers.
      assumptions_explicit: States assumptions about complete generations, bounded admission,
        RSS, and stale-reader tolerance.
      alternatives_considered: Compares immutable snapshots with bounded workers/admission
        and gives a measurement-based decision rule.
      tradeoff_quality: Connects p99, mailbox, CPU, RSS, copy/GC cost, overload rejection,
        and warm-swap ownership to the choice.
      follow_up_adaptation: Adapts when the current bottleneck is measured or when a replacement
        generation fails or exceeds memory.
      certainty_calibration: Keeps structural risk separate from a measured production
        bottleneck and names the tests that would update the recommendation.
    claim_map:
      fact: The described path uses synchronous GenServer.call for Scoring.score over
        state.references, so callbacks serialize scoring within each API instance; supervision
        restarts the process but does not add readers.
      inference: Versioned snapshots or bounded workers could improve concurrency, but
        copying full references, garbage collection, admission, and warm-swap ownership
        can create new limits.
      assumption: I am assuming readers can use one complete immutable generation and
        that the target workload permits bounded admission rather than unbounded task
        creation.
      unknown: Mailbox depth, p99, CPU, RSS, copy behavior, instance count, replacement
        failure, and the acceptable stale-generation window are unknown.
    failure_probe:
      kind: failure_mode
      prompt: Drive the official workload until mailbox and p99 rise, then publish a replacement
