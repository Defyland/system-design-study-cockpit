  critical_thinking:
    problem_frame: 'I frame reconciliation as a conditional state repair: find a bounded
      candidate, lock the platform Job, reread Oban, and decide whether a transition is
      still valid before writing an attempt or event.'
    comparison:
      applicable: true
      alternatives:
      - option: Lock and reread the Job and Oban row before a conditional repair.
        benefit: It makes the decision use current local state and gives concurrent reconcilers
          a clear no-op path.
        cost_or_risk: It holds a row lock during repair work and can contend with normal
          transitions if the transaction grows.
        valid_when: Use it when local correctness and a bounded repair transaction matter
          more than maximum reconciliation parallelism.
      - option: Use a short conditional update with unique attempt/event identities and
          retry conflicts.
        benefit: It can reduce lock duration and make duplicate repairs visible through
          conflict handling.
        cost_or_risk: It needs careful reread and retry logic, and a conflict can be harder
          to explain than an explicit locked no-op.
        valid_when: Use it when contention is measured and the team can operate a well-defined
          optimistic retry policy.
      decision_rule: Choose the locked reread when stale repairs are the dominant risk;
        choose the shorter optimistic path only when contention measurements justify its
        added conflict and retry complexity.
    rubric:
      facts_correct: Names the bounded candidate, FOR UPDATE lock, Oban reread, conditional
        state check, and attempt/event identity.
      assumptions_explicit: States the no-op and uniqueness assumptions instead of treating
        the initial scan as current truth.
      alternatives_considered: Compares locked repair with a shorter conditional-update
        strategy and explains when contention makes the alternative worthwhile.
      tradeoff_quality: Connects stale reads, lock duration, duplicate observability,
        and retry complexity to the repair choice.
      follow_up_adaptation: Responds differently to a missing row, changed state, duplicate
        event, and failed transaction.
      certainty_calibration: Keeps confidence on local repair semantics separate from
        unverified scheduler and throughput claims.
    claim_map:
      fact: The described routine selects ordered candidates, takes a database row lock
        before rereading Oban, revalidates state, and writes repair records inside a transaction.
      inference: The lock and reread can turn a stale scan into a local no-op and stable
        attempt/event identities can make repeated repair observable, but they do not
        prove scheduler cadence or an external exactly-once effect.
      assumption: I am assuming a missing Oban row or changed state is a defined no-op
        and that attempt and event identities have a uniqueness or conflict policy.
      unknown: The duplicate-event policy, batch fairness, scheduler frequency, and behavior
        when the Oban row disappears during repair are not established.
    failure_probe:
      kind: failure_mode
      prompt: Two reconcilers see one candidate, the Oban row is deleted before the locked
        reread, one transaction fails, and an event write is retried. Which cases should
        be :noop, which identity should conflict, and what telemetry separates concurrency
