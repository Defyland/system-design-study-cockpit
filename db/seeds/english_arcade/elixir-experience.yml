- id: elixir_experience-11-rinha-elixir-exact-knn-scaling-baseline
  version: 1.4.0
  target: elixir_experience
  topic: Rinha Elixir exact k-NN scaling baseline
  difficulty: 3
  interview_stage: architecture_review
  prompt: How would you defend this exact Rinha Elixir k-NN baseline and decide the
    next optimization?
  context: The interviewer is probing true exact-search complexity, correctness value,
    full-dataset evidence gaps, and the trade-offs between a heap and approximate
    indexing.
  best_answer: Rinha's 14-dimensional scorer maps every reference to a squared distance,
    sorts all N candidates, takes five, and counts labels. That costs O(N*d + N log
    N) per query, O(N) candidate and sort space, plus O(N*d) stored references per
    instance. I would defend it as a correctness oracle and reviewable baseline, not
    a scaling claim. First I would benchmark the official three million records; a
    size-five heap removes full sorting but not scanning, then ANN or quantization
    trades recall, memory, build, and update complexity.
  distractors:
  - text: I would optimize by replacing the full sort with a size-five heap, then
      claim exact scoring is effectively constant time because k is fixed. Reference
      memory also disappears once candidates are bounded. There is no reason to benchmark
      the official dataset or discuss ANN recall, quantization, build cost, updates,
      or two-instance memory.
    trap: precision
    why_wrong: A bounded heap removes the full sort but retains the all-reference
      scan and stored reference memory.
  - text: I would introduce an ANN library immediately and call any returned five
      labels correct. Approximation has no cost beyond implementation, so recall,
      index build time, update behavior, quantization error, and memory do not need
      a baseline. The reviewable exact path can be deleted before the official corpus
      is exercised.
    trap: hedging
    why_wrong: It removes the correctness oracle before measuring the intended workload
      and ignores the new approximation trade-offs.
