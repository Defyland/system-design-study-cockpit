- id: elixir_experience-12-rinha-elixir-genserver-serialization-risk
  version: 1.4.0
  target: elixir_experience
  topic: Rinha Elixir single-GenServer serialization risk
  difficulty: 3
  interview_stage: architecture_review
  prompt: How would you redesign Rinha Elixir read concurrency without creating uncontrolled
    reference copies or garbage-collection pressure?
  context: The interviewer is probing synchronous GenServer.call scoring, structural
    serialization, memory ownership, admission, and measured options rather than an
    asserted bottleneck.
  best_answer: ReferenceIndex exposes scoring through GenServer.call, and its handle_call
    runs Scoring.score synchronously across state.references before replying. One
    callback loop therefore serializes scoring requests within each API instance;
    that is a structural concurrency risk, not a measured p99 bottleneck. Supervision
    can restart the process but adds no read concurrency, while challenge topology
    may load full references per instance. I would measure mailbox, p99, CPU, and
    RSS, then compare versioned immutable ETS or persistent_term snapshots, bounded
    workers, and admission with warm-swap failure ownership.
  distractors:
  - text: I would solve serialization by starting unbounded Tasks that independently
      duplicate the ReferenceIndex state. The supervisor will absorb memory and garbage
      collection automatically, so mailbox congestion, admission, and ownership become
      irrelevant. Every instance can retain several full indexes, and a process restart
      guarantees an atomic warm swap without measuring CPU, RSS, p99, or queueing
      behavior.
    trap: precision
    why_wrong: It creates uncontrolled copies and scheduler pressure while treating
      supervision as capacity, admission, and atomic-swap machinery.
  - text: I would keep one GenServer forever because immutable data means requests
      are concurrent inside its callback. Adding a second API instance fixes all contention
      without another reference copy. Readiness already measures mailbox delay, and
      a failed replacement can be ignored because the old scoring state remains available
      automatically.
    trap: hedging
    why_wrong: A callback loop still serializes calls, extra instances may replicate
      resources, and neither mailbox behavior nor replacement availability is established.
  sources:
  - repo: backend-challenges
    path: rinha-de-backend-2026-elixir/README.md
    note: Public challenge topology and per-instance full-reference memory boundary.
  - repo: backend-challenges
    path: rinha-de-backend-2026-elixir/lib/rinha_backend_2026/reference_index.ex
    note: GenServer.call and synchronous handle_call scoring boundary.
  - repo: backend-challenges
    path: rinha-de-backend-2026-elixir/lib/rinha_backend_2026/scoring.ex
    note: Exact scorer operating over state references before reply.
  - repo: original
    path: english-arcade/elixir_experience/12
    note: Authored interview-language coaching.
  provenance:
    evidence_class: public_challenge
