- id: elixir_experience-09-reconpulse-broker-and-ssrf-boundaries
  version: 1.4.0
  target: elixir_experience
  topic: ReconPulse broker ingestion and SSRF boundaries
  difficulty: 3
  interview_stage: architecture_review
  prompt: What would you require before calling this ReconPulse ingestion broker-backed
    and its webhook egress SSRF-safe?
  context: The interviewer is testing whether the broker and outbound-network boundaries
    are evaluated separately rather than compressed into one safety claim.
  best_answer: >-
    I would separate the two boundaries. ReconPulse has a Broadway shape, but its Pipeline uses
    DummyProducer with producer concurrency one, processors, and a batcher; that demonstrates
    neither real broker acknowledgements, redelivery, partition ordering, demand backpressure,
    nor outage recovery. Webhook validation requires HTTPS and rejects localhost or literal
    private IPs, yet it parses host text before the HTTP client resolves and connects. I would
    require a real producer and resolve-and-connect address pinning, plus redirect policy,
    before calling either boundary broker-backed or SSRF-safe.
  distractors:
  - text: I would call the pipeline broker-backed because Broadway declares configurable
      processors and batchers. DummyProducer has the same operational behavior as
      a durable broker, so acknowledgements, redelivery, demand, partition sequencing,
      and outage recovery are guaranteed. For egress, HTTPS and a syntactically public
      hostname prove the request will never resolve or redirect to a private address
      internally.
    trap: precision
    why_wrong: It treats local Broadway wiring as broker semantics and syntax checks
      as a resolution, connection, and redirect defense.
  - text: I would fix both concerns by increasing processor concurrency. More consumers
      provide acknowledgement durability and prevent DNS rebinding because requests
      finish faster. The batcher also preserves every partition order, and private-address
      checks apply to all hostnames after the HTTP client connects, so no separate
      broker or egress design is needed.
    trap: hedging
    why_wrong: It merges unrelated boundaries and assigns network and broker guarantees
      to controls that do not implement them.
  sources:
  - repo: backend-challenges
    path: reconpulse-elixir-finops-control-tower/lib/recon_pulse/ingestion/pipeline.ex
    note: Broadway DummyProducer, producer concurrency, processor, and batcher configuration.
  - repo: backend-challenges
    path: reconpulse-elixir-finops-control-tower/lib/recon_pulse/webhooks.ex
    note: HTTPS and literal-host validation before later HTTP resolution and connection.
  - repo: backend-challenges
    path: reconpulse-elixir-finops-control-tower/test/recon_pulse/webhooks_test.exs
    note: Historical HTTP, localhost, and private-literal test coverage.
  - repo: original
    path: english-arcade/elixir_experience/9
    note: Authored interview-language coaching.
  provenance:
    evidence_class: portfolio_code
    project: ReconPulse
    repository: backend-challenges
    files:
