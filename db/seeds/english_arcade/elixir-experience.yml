      new_evidence: >-
        the database state is cancelled but the Oban call fails after the worker has begun external
        I/O
      best_answer: >-
        I would keep durable cancelled state and the worker recheck, but I would retract any
        guarantee that in-flight I/O stops. I would make retry and late completion idempotent,
        record the failed Oban cancellation, and reconcile the external work without holding a row
        lock across the write.
      distractors:
      - text: I would preserve every part of the original ReportForge cancellation
