      commit: 0c68fb1f0d23e30a474e6b3299b493f7c84e63aa
      claim: The committed Reports module locks and revalidates cancellation in a
        transaction, persists state and event, clears execution_job_id, then requests
        Oban cancellation after commit.
    - path: reportforge-elixir-report-platform/test/report_forge/reports_test.exs
      commit: 0c68fb1f0d23e30a474e6b3299b493f7c84e63aa
