      minutes: 10
  critical_thinking:
    learner_prompts:
      evidence_ledger: For Elixir project deep dive, record whether each claim about
        the Elixir project boundary, OTP reasoning, failure evidence, and unverified
        impact is a verified fact, an inference, an assumption, or an unknown before
        you defend it.
      problem_frame: Frame every Elixir project deep dive answer with the actor, requirement,
        constraint, success condition, and unanswered question that could change the
        decision.
      comparison: When Elixir project deep dive offers a real choice, compare two
        options by benefit, cost or risk, valid-when condition, and an explicit decision
        rule.
      failure_probe: Ask which counterexample, edge case, or failure mode could break
        the Elixir project deep dive recommendation, then state the smallest test
        or containment step.
      certainty_review: 'Calibrate certainty in Elixir project deep dive: name the
