  feedback:
    register: Call this supervised sample-resource reload evidence, not a full-dataset
      availability claim.
    hedging: Treat the cited start_supervised crash observation as historical revision
      evidence rather than a current benchmark.
    precision: Name synchronous init, ready_status, new pid, sample references, full-dataset
      load, memory envelope, and warm handoff separately.
    grammar: Contrast “restarts and becomes ready” with “does not measure the reload
      envelope.”
    pragmatics: Offer a failure and capacity test before treating readiness as a user-visible
      availability guarantee.
  rephrase:
    prompt: Explain to an OTP engineer why a supervised GenServer restart is valuable
      while still leaving reload availability and capacity unanswered.
    goal: Preserve restart semantics without inflating them into throughput evidence.
  follow_up:
    prompt: Init fails on a corrupt resource, restart intensity is reached, two instances
      reload a full dataset, and callers ask readiness during the swap. What warm
      handoff or versioned-index policy, memory budget, and benchmark would you require?
