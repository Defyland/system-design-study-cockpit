---
contract_version: 1.4.0
target:
  key: elixir_experience
  label: Elixir experience
  blurb: Inspectable Elixir portfolio and study stories.
  focus_areas:
  - real experience
  - evidence boundaries
  - failure modes
  - interview adaptation
  simulation:
    minutes: 45
    structure:
    - label: Narrative
      minutes: 15
    - label: Deep dive
      minutes: 20
    - label: Reflection
      minutes: 10
  critical_thinking:
    learner_prompts:
      evidence_ledger: For Elixir project deep dive, record whether each claim about
        the Elixir project boundary, OTP reasoning, failure evidence, and unverified
        impact is a verified fact, an inference, an assumption, or an unknown before
        you defend it.
      problem_frame: Frame every Elixir project deep dive answer with the actor, requirement,
        constraint, success condition, and unanswered question that could change the
        decision.
      comparison: When Elixir project deep dive offers a real choice, compare two
        options by benefit, cost or risk, valid-when condition, and an explicit decision
        rule.
      failure_probe: Ask which counterexample, edge case, or failure mode could break
        the Elixir project deep dive recommendation, then state the smallest test
        or containment step.
      certainty_review: 'Calibrate certainty in Elixir project deep dive: name the
        evidence, separate correlation from causality, and say what new observation
        would make you revise the answer.'
    rubric:
      facts_correct: Names the verified the Elixir project boundary, OTP reasoning,
        failure evidence, and unverified impact facts without smuggling in a result
        or capability that the prompt does not establish.
      assumptions_explicit: Labels the Elixir project deep dive premise that is still
        assumed and asks the smallest clarifying question that matters.
      alternatives_considered: Considers a credible alternative for Elixir project
        deep dive, or explains the hard constraint that makes comparison a false equivalence.
      tradeoff_quality: Connects the Elixir project deep dive choice to a benefit,
        a cost or risk, and the condition under which another choice wins.
      follow_up_adaptation: Responds to an adversarial Elixir project deep dive follow-up
        by changing the claim or evidence boundary rather than repeating a memorised
        answer.
      certainty_calibration: Uses high, medium, or low certainty deliberately and
        names the evidence that would update the Elixir project deep dive recommendation.
cards:
- id: elixir_experience-card-1
  front: What does the PulseOps transaction guarantee, and what must the worker still
    handle?
  back: >-
    I separate the Ecto transaction boundary from the worker effect: the Job, Oban handoff, and
    event commit or roll back together, while the later external effect needs idempotency and
    reconciliation. I would never call that exactly-once without evidence.
  box: 1
  source:
    repo: backend-challenges
    path: pulseops-elixir-job-platform/lib/pulse_ops/jobs.ex
    note: Local Job, Oban handoff, event, and idempotency boundary.
  critical_thinking:
    cue: >-
      What does the PulseOps transaction guarantee, and what must the worker still handle? Name
      the local atomic boundary, then the external failure it cannot roll back.
    check: >-
      Can you compare local rollback with worker idempotency, name a crash window, and identify
      the log or reconciliation evidence that would update your claim?
- id: elixir_experience-card-2
  front: What remains after ReportForge stages an artifact and cancellation wins?
  back: >-
    I treat the short lock as protection for report state, not object storage. Finalization
    rechecks and compensates with delete_for_report; deletion is a separate operation, so I
    measure cleanup, cancellation, RSS, and storage failure before calling it atomic.
  box: 2
  source:
    repo: backend-challenges
    path: reportforge-elixir-report-platform/lib/report_forge/reports.ex
    note: Staged artifact finalization and separate deletion compensation.
  critical_thinking:
    cue: >-
      What remains after ReportForge stages an artifact and cancellation wins? Separate the row
      lock, storage write, compensation, and crash window.
    check: >-
      Can you compare a short lock with a long lock, name the staged-object failure, and state
      which cleanup or RSS measurement would change the design?
- id: elixir_experience-card-3
  front: Why do neither a heap nor supervision solve Rinha Elixir scoring scale?
  back: >-
    I treat exact scoring as a scan over every reference; a size-k heap replaces full sorting,
    not the scan or an index. One GenServer serializes calls, and supervision restarts it
    without adding read concurrency, so I measure mailbox, p99, CPU, and RSS before choosing
    snapshots or workers.
  box: 3
  source:
    repo: backend-challenges
    path: rinha-de-backend-2026-elixir/lib/rinha_backend_2026/reference_index.ex
    note: Synchronous scoring calls through one ReferenceIndex callback loop.
  critical_thinking:
    cue: >-
      Why do neither a heap nor supervision solve Rinha Elixir scoring scale? Separate scan cost,
      sort cost, serialized calls, and restart behavior.
    check: >-
      Can you compare a heap, an index, and bounded workers, name the remaining bottleneck in
      each, and identify the benchmark that would justify ANN or snapshots?
items:
- id: elixir_experience-01-pulseops-transactional-enqueue
  version: 1.4.0
  target: elixir_experience
  topic: PulseOps transactional idempotency and Oban enqueue
  difficulty: 3
  interview_stage: deep_dive
  prompt: How would you prevent a persisted PulseOps Job without its Oban handoff
    while handling an idempotency race?
  context: The interviewer is probing transaction contents, semantic replay, legacy
    nil fingerprints, and later external worker effects.
  best_answer: >-
    I would explain PulseOps as normalizing a create request, fingerprinting it, and checking
    idempotency before Repo.transaction. The transaction inserts Job, calls Oban.insert, updates
    oban_job_id, and writes an event; an error rolls those local changes back. A unique
    constraint resolves races: equal semantics replay and a changed fingerprint conflicts.
    Legacy nil fingerprints are derived and backfilled. I would state the limit clearly: this
    closes the local handoff gap, not exactly-once for a worker external effect, which still
    needs idempotency and reconciliation.
  distractors:
  - text: I would insert the Job first and enqueue through Oban after commit because
      a later retry can fill any missing handoff. An idempotency key alone proves
      requests are equivalent, so changed payloads should replay. Concurrent creates
      can be serialized by application code without a unique database constraint under
      concurrent node failures.
    trap: precision
    why_wrong: It recreates the local handoff gap, ignores semantic fingerprint conflicts,
      and leaves a multi-node race outside the database.
  - text: I would let each node accept the same key and keep whichever job Oban runs
      first. A rollback cannot affect an inserted Oban job, so event writing should
      happen later. Legacy nil fingerprints should always replay, and the transaction
      proves every downstream external action happens exactly once.
    trap: hedging
    why_wrong: It discards conflict semantics, separates local records, and turns
      a database transaction into an unsupported external-effect guarantee.
  sources:
  - repo: backend-challenges
    path: pulseops-elixir-job-platform/README.md
    note: PulseOps portfolio study scope and relational plus Oban job model.
  - repo: original
    path: english-arcade/elixir_experience/1
    note: Original interview-language coaching.
  provenance:
    evidence_class: portfolio_code
    project: PulseOps
    repository: backend-challenges
    files:
    - path: pulseops-elixir-job-platform/README.md
      commit: f1330d0588d1b46253abb18a3c4c1ec6869152b6
      claim: The committed README describes idempotent job creation, relational job
        state, Oban execution, and job-event tracking.
    - path: pulseops-elixir-job-platform/lib/pulse_ops/jobs.ex
      commit: f1330d0588d1b46253abb18a3c4c1ec6869152b6
      claim: The committed Jobs module transacts Job plus Oban insertion, oban_job_id
        and event, and resolves constraint races by fingerprint.
    - path: pulseops-elixir-job-platform/test/pulse_ops/jobs_test.exs
      commit: f1330d0588d1b46253abb18a3c4c1ec6869152b6
      claim: The committed tests specify replay, conflict, legacy backfill, and eight-task
        concurrent idempotency at that revision.
    verified_claims:
    - The creation flow commits Job, Oban handoff, oban_job_id, and event together
      or rolls them back.
    - The unique constraint resolves equivalent and conflicting races; it does not
      establish external exactly-once behavior.
    confirmation_required:
    - Check authorship; any operating context, user reach, outcome claim, current
      test run, multi-node behavior, legacy migration, and external-effect reconciliation.
    safe_interview_version: This PulseOps portfolio study keeps a Job, Oban enqueue
      reference, and event in one local transaction while reserving external delivery
      claims for separate evidence.
    confidentiality:
      level: high
      note: Do not disclose organization, job payload, idempotency key, fingerprint,
        event, Oban ID, queue, database record, or external target.
  feedback:
    register: Call this a local transactional handoff, not an exactly-once execution
      claim.
    hedging: Cite the committed test specification without implying it ran in the
      current initiative.
    precision: Keep normalization, fingerprint, key check, Job insert, Oban insert,
      update, event, and race resolution in sequence.
    grammar: Use “equal semantics replay; changed semantics conflict” as parallel
      short clauses.
    pragmatics: Put the later worker's external side effect outside the transaction
      before proposing recovery.
  rephrase:
    prompt: Explain to a database engineer why the unique constraint, not a process
      lock, decides a multi-node idempotency race.
    goal: Preserve semantic replay and conflict behavior while changing the audience.
  follow_up:
    prompt: A crash lands near the transaction boundary, a legacy row has nil fingerprint,
      and a second node sends a changed payload. How do rollback, backfill, the constraint,
      and external reconciliation keep API semantics coherent?
    goal: Trace race and legacy cases without projecting exactly-once onto the worker.
    challenge_kind: alternative
    best_answer: >-
      I would let the database transaction roll back the local Job, Oban handoff, and event when
      the crash lands inside it. For a legacy nil fingerprint, I would derive and backfill it
      under the existing uniqueness rules; a changed payload on another node should conflict
      rather than replay. I would keep external worker effects idempotent and use reconciliation
      for the post-commit crash window.
    distractors:
    - text: I would defend the first PulseOps transactional idempotency and Oban enqueue
        option because offering an alternative might make the decision look uncertain.
      why_wrong: A comparison makes the decision rule visible; it does not weaken
        a well-calibrated recommendation.
    - text: I would list every conceivable PulseOps transactional idempotency and
        Oban enqueue design without saying which requirement should decide between
        them.
      why_wrong: An option list without a decision rule avoids the trade-off the follow-up
        is testing.
  compression:
    prompt: State transaction contents, race winner, legacy behavior, and external
      limit in four clauses.
    goal: Retain atomic local state and the separate worker-effect boundary.
  language_focus:
  - precision
  - pragmatics
  - hedging
  feynman:
    concept: A unique database constraint settles competing requests after a transaction
      ties the local job and handoff together.
    explain_to: A teammate who thinks an in-process key check solves a cluster race.
    constraint: Include nil-fingerprint backfill and one external effect outside the
      transaction.
    self_check: Did you distinguish replay, conflict, rollback, and later worker behavior?
    reasoning_check: Can you identify the hidden premise behind PulseOps transactional
      idempotency and Oban enqueue, give a counterexample, and explain how the evidence
      changes your conclusion?
  black_box:
    symptom: The explanation calls Oban insertion after a Job commit “eventually atomic.”
    expected: Job, enqueue reference, and event either commit together or roll back;
      the constraint resolves races.
    actual: A Job persists without handoff or changed requests silently share a key.
    root_cause: Local sequencing and application locking were substituted for a transactional
      constraint.
    repair: Keep local writes in Repo.transaction, enforce the unique key, compare
      fingerprints, and add external reconciliation.
    reasoning_error: If your PulseOps transactional idempotency and Oban enqueue answer
      failed, classify the mistake as a fact, assumption, comparison, failure, or
      certainty error before proposing the smallest repair.
  recall:
    active_recall_cue: Which records share the transaction, and what decides equal
      versus changed duplicate requests?
    feynman_prompt: Why does a unique constraint still matter after an initial idempotency
      lookup?
    black_box_probe: Did you name rollback, legacy backfill, and the external-effect
      limit?
    leitner_start_box: 1
    mastery_threshold: 8
    delayed_variant:
      id: elixir_experience-01-pulseops-transactional-enqueue-delayed-1
      prompt: >-
        A crash occurs after the local transaction commits but before the worker external effect,
        while a legacy row still has a nil fingerprint and another node sends a changed payload.
        Which local guarantee survives and what must reconciliation verify?
      changed_constraint: >-
        the API must preserve idempotency semantics across legacy rows and the post-commit worker
        gap
      new_evidence: >-
        the crash window is after commit, a legacy row lacks a fingerprint, and a second node
        presents changed semantics
      best_answer: >-
        I would keep the local transaction guarantee and derive the legacy fingerprint before
        applying the uniqueness rule, but I would retract any exactly-once claim for the worker
        effect. I would make changed semantics conflict, replay equal semantics, and use
        reconciliation to verify whether the external effect happened after the commit.
      distractors:
      - text: I would preserve every part of the original PulseOps transactional idempotency
          and Oban enqueue answer because changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire PulseOps transactional idempotency and Oban
          enqueue explanation with a new design without identifying what the evidence
          actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  extension:
    prompt: Define negative cases for Oban insertion failure, unique-key race, changed
      payload, nil fingerprint, and worker-side external failure.
    goal: Verify local transaction semantics without inventing an end-to-end exactly-once
      guarantee.
  critical_thinking:
    problem_frame: 'I frame this as two boundaries: the local transaction must keep the
      Job, Oban handoff, oban_job_id, and event coherent, while a later worker effect
      cannot be rolled back. I state the equal-versus-changed idempotency contract and
      the crash window before proposing a fix.'
    comparison:
      applicable: false
      rejected_alternative: 'A direct comparison between the local Ecto transaction and
        an external exactly-once worker guarantee is a false equivalence: they control
        different failure boundaries.'
      hard_constraint: The hard constraint is to preserve local row and handoff coherence
        while admitting that an external effect survives a database rollback.
      decision_rule: Use the transaction for the local records, then choose worker idempotency
        and reconciliation from the external-effect contract; do not call the combined
        path exactly once without evidence.
    rubric:
      facts_correct: Names the four local records in the transaction, the fingerprint
        distinction, and the external side-effect limit.
      assumptions_explicit: Separates the legacy-fingerprint and worker-idempotency assumptions
        from the guarantees shown by the local transaction.
      alternatives_considered: Explains why a local transaction is not interchangeable
        with an external exactly-once protocol and identifies reconciliation as the second
        boundary.
      tradeoff_quality: Connects atomic local rollback, race resolution, backfill risk,
        and post-commit recovery to the recommendation.
      follow_up_adaptation: Adapts when the crash occurs after commit or when changed
        semantics race with an equal replay instead of repeating the happy path.
      certainty_calibration: Uses medium certainty for the end-to-end claim and names
        the concrete concurrent and recovery evidence that would raise or lower it.
    claim_map:
      fact: The project material describes Repo.transaction covering the Job insert, Oban
        insertion, oban_job_id update, and event write, with a uniqueness rule for the
        request fingerprint.
      inference: That local boundary can prevent a persisted Job from losing its recorded
        handoff and can distinguish equal replay from changed semantics, but it cannot
        make an external worker effect exactly once.
      assumption: I am assuming a canonical fingerprint can be derived safely for legacy
        nil rows and that the worker or reconciliation path can make its external effect
        idempotent.
      unknown: The post-commit crash behavior, external-effect identity, backfill locking
        policy, and telemetry that proves reconciliation are still unknown.
    failure_probe:
      kind: counterexample
      prompt: 'Which trace would falsify the boundary: Oban insertion fails inside the
        transaction, two nodes race with equal or changed fingerprints, or the process
        crashes after commit before the worker effect? Name the local result and the reconciliation
        evidence for each.'
    evidence_check:
      limitation: The source and interview scenario support the local transaction boundary
        and its limits, but they do not establish production-scale race frequency, worker
        exactly-once behavior, or the safety of every legacy backfill.
      basis: Check the concrete claim against backend-challenges/pulseops-elixir-job-platform/README.md
        and the exact interview context; record which statements are code facts, inferences,
        assumptions, and unknowns.
      source_kind: primary_code
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: I am highly confident about what the described transaction can roll back,
        but only moderately confident about replay and recovery until the uniqueness,
        backfill, and post-commit paths are exercised together.
      update_trigger: I would update the recommendation after a concurrent equal/changed-fingerprint
        test, a crash-window reconciliation trace, or evidence that legacy backfill can
        race with a new request.

- id: elixir_experience-02-pulseops-per-tenant-queue-limit
  version: 1.4.0
  target: elixir_experience
  topic: PulseOps tenant queues and local-only cluster boundary
  difficulty: 3
  interview_stage: deep_dive
  prompt: How would you isolate tenant concurrency in PulseOps without claiming a
    global quota or fairness?
  context: The interviewer is probing local_only queue control, node-count changes,
    noisy neighbors, resync failure, and telemetry.
  best_answer: >-
    I would describe PulseOps deriving tenant-specific runtime queue names, so one tenant manual
    drain need not run another tenant queued work. The Provisioner starts, scales, pauses, and
    resumes each queue with local_only: true, then periodically syncs all queues. I would call
    that local node configuration, not a global tenant quota or fairness guarantee: capacity can
    multiply with nodes, and resync catches exceptions by logging and retaining state. A
    cluster-wide limit needs shared coordination plus telemetry for noisy-neighbor pressure and
    provisioning drift.
  distractors:
  - text: I would use the tenant queue name as proof that its concurrency is global
      across the cluster. Starting, scaling, or pausing locally changes every node
      automatically, so a noisy tenant cannot consume extra capacity after nodes join.
      The periodic sync proves any provisioning failure will be retried and repaired
      without telemetry under cluster change.
    trap: precision
    why_wrong: It turns local_only operations into cluster coordination and assumes
      best-effort resync supplies fairness and recovery.
  - text: I would give every queue an unlimited local limit because different names
      already prevent interference. When provisioning raises an exception, discard
      the queue state and wait for a later request. Node count does not affect total
      capacity, and separate draining proves an organization-wide quota and scheduling
      fairness.
    trap: hedging
    why_wrong: It ignores resource multiplication, restart drift, and the difference
      between isolated names and shared global limits.
  sources:
  - repo: backend-challenges
    path: pulseops-elixir-job-platform/README.md
    note: PulseOps portfolio description of tenant queues and Oban execution.
  - repo: original
    path: english-arcade/elixir_experience/2
    note: Original interview-language coaching.
  provenance:
    evidence_class: portfolio_code
    project: PulseOps
    repository: backend-challenges
    files:
    - path: pulseops-elixir-job-platform/README.md
      commit: f1330d0588d1b46253abb18a3c4c1ec6869152b6
      claim: The committed README describes per-tenant queues, concurrency controls,
        and Oban-backed execution.
    - path: pulseops-elixir-job-platform/lib/pulse_ops/queues/provisioner.ex
      commit: f1330d0588d1b46253abb18a3c4c1ec6869152b6
      claim: The committed Provisioner starts, scales, pauses, and resumes runtime
        queues with local_only true and periodically syncs them.
    - path: pulseops-elixir-job-platform/test/pulse_ops/jobs_test.exs
      commit: f1330d0588d1b46253abb18a3c4c1ec6869152b6
      claim: The committed tests specify distinct tenant runtime queues and drain
        each queue without running the other tenant's job.
    verified_claims:
    - Runtime queue names separate tenant work, and provisioning control calls are
      local_only on the current node.
    - Sync exceptions only log and retain state; this does not prove global limits,
      fairness, cluster pause or scale coordination, or capacity.
    confirmation_required:
    - Establish authorship; operating evidence, user exposure, outcome claims, current
      testing, node topology, cluster coordination, fairness, capacity benchmarks,
      and telemetry behavior.
    safe_interview_version: This PulseOps portfolio study gives tenants distinct runtime
      queues and applies local-only controls, while reserving global quota, fairness,
      and cluster-capacity claims for shared coordination evidence.
    confidentiality:
      level: high
      note: Do not disclose organization, queue, concurrency, node, telemetry, job,
        exception, capacity, or provisioning data.
  feedback:
    register: Say “local node queue control,” not “cluster quota.”
    hedging: Treat separate-drain tests as historical local behavior, not fairness
      or capacity proof.
    precision: Name runtime queue, local_only start/scale/pause/resume, resync, exception
      path, node multiplication, and shared coordinator separately.
    grammar: Contrast “separates tenant names” with “does not cap cluster total” in
      one sentence.
    pragmatics: Ask for telemetry and noisy-neighbor evidence before promising a tenant
      isolation outcome.
  rephrase:
    prompt: Explain to a platform engineer why local_only pause is useful but cannot
      promise a cluster-wide pause.
    goal: Preserve the node-versus-cluster boundary.
  follow_up:
    prompt: Node count doubles, a noisy tenant grows, the Provisioner restarts, and
      sync_all logs an exception. What shared limit, resync signal, and telemetry
      would make global behavior observable?
    goal: Connect topology change, best-effort recovery, and fairness evidence.
    challenge_kind: failure
    best_answer: >-
      I would treat local_only queue state as node-local evidence, then add a shared tenant quota
      or lease if the limit must hold across nodes. I would alert on sync failures, queue drift,
      and noisy-neighbor pressure, and I would verify the Provisioner restart by comparing desired
      and observed queue state after resync.
    distractors:
    - text: I would describe the PulseOps tenant queues and local-only cluster boundary
        failure as impossible because the happy path already passed its test.
      why_wrong: Passing a happy path does not test the boundary, failure mode, or
        recovery being challenged.
    - text: I would add retries to PulseOps tenant queues and local-only cluster boundary
        immediately and assume the system would become reliable.
      why_wrong: Retries can amplify load or duplicate effects; the failure and containment
        policy must be specified first.
  compression:
    prompt: Give four clauses for tenant name, local control, node multiplication,
      and global remedy.
    goal: Retain the difference between lane separation and cluster fairness.
  language_focus:
  - precision
  - pragmatics
  - hedging
  feynman:
    concept: Local queue controls can configure one node repeatedly without becoming
      a distributed scheduler.
    explain_to: A teammate who equates tenant queue names with a global concurrency
      budget.
    constraint: Include local_only, a node-count change, resync exception behavior,
      and one telemetry signal.
    self_check: Did you separate runtime naming, local capacity, shared coordination,
      and fairness?
    reasoning_check: Can you identify the hidden premise behind PulseOps tenant queues
      and local-only cluster boundary, give a counterexample, and explain how the
      evidence changes your conclusion?
  black_box:
    symptom: The answer treats a per-tenant queue name as a universal cluster limit.
    expected: Each node applies local configuration; total capacity changes with topology
      unless a shared limit coordinates it.
    actual: A noisy tenant gets more slots after scaling out while the dashboard claims
      fairness.
    root_cause: Namespacing was confused with distributed admission control.
    repair: Measure per-node queues, add a shared limiter or scheduler, expose resync
      failures, and test topology changes.
    reasoning_error: If your PulseOps tenant queues and local-only cluster boundary
      answer failed, classify the mistake as a fact, assumption, comparison, failure,
      or certainty error before proposing the smallest repair.
  recall:
    active_recall_cue: Which calls are local_only, and why can capacity grow when
      nodes are added?
    feynman_prompt: Why does a periodic resync not prove successful cluster convergence?
    black_box_probe: Did you name noisy-neighbor telemetry, provisioner restart, and
      the global-limit gap?
    leitner_start_box: 1
    mastery_threshold: 8
    delayed_variant:
      id: elixir_experience-02-pulseops-per-tenant-queue-limit-delayed-2
      prompt: >-
        Two nodes each admit a noisy tenant and the Provisioner restarts while sync_all logs an
        exception. What local claim survives, and what global quota evidence is still missing?
      changed_constraint: >-
        a tenant quota must hold across nodes and recover observably after Provisioner restart
      new_evidence: >-
        two local_only queues admit work beyond the intended global limit and sync_all records an
        exception
      best_answer: >-
        I would keep tenant-specific names as a local isolation mechanism, but I would retract any
        global quota claim. I would add shared quota coordination, alert on sync drift and the
        logged exception, and verify admission and recovery across both nodes after restart.
      distractors:
      - text: I would preserve every part of the original PulseOps tenant queues and
          local-only cluster boundary answer because changing it after review would
          be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire PulseOps tenant queues and local-only cluster
          boundary explanation with a new design without identifying what the evidence
          actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  extension:
    prompt: Define negative cases for separate tenant drain, node addition, local
      pause, failed sync_all, provisioner restart, and noisy-neighbor saturation.
    goal: Test local isolation and expose the evidence required for a global policy.
  critical_thinking:
    problem_frame: 'I frame this as local isolation versus a cluster-wide policy: identify
      the tenant queue actor, the desired concurrency limit, the node boundary, and the
      signal that would show Provisioner drift or a noisy neighbor.'
    comparison:
      applicable: true
      alternatives:
      - option: Keep tenant-specific local_only queues and add explicit drift telemetry.
        benefit: It preserves the inspectable per-tenant isolation already described and
          keeps queue control close to the node that executes it.
        cost_or_risk: A tenant can still receive capacity on multiple nodes, and a failed
          sync can leave local state divergent from intent.
        valid_when: Use it when the requirement is local separation and the product accepts
          best-effort cluster behavior.
      - option: Add a shared tenant quota or lease before local queue admission.
        benefit: It can enforce one tenant budget across nodes and make noisy-neighbor
          pressure a shared signal.
        cost_or_risk: It adds coordination, lease expiry, and failure handling; a shared
          service outage can reject work or create a new bottleneck.
        valid_when: Use it when the quota must survive node multiplication and measured
          fairness matters more than purely local control.
      decision_rule: Choose local_only queues when local isolation is the contract; choose
        shared quota coordination only when cross-node admission and fairness are requirements
        backed by a defined budget and telemetry.
    rubric:
      facts_correct: Distinguishes tenant-specific queue names and local_only control
        from a cluster-wide quota or fairness result.
      assumptions_explicit: States the node-scaling and failed-sync assumptions instead
        of treating periodic reconciliation as proof of convergence.
      alternatives_considered: Compares local isolation with a shared quota or lease and
        states the requirement that makes each valid.
