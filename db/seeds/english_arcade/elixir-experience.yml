      commit: 2023435681dc99ae08d2a4034ab5feb4226d7480
      claim: The committed README calls this a correctness-first challenge baseline
        and explicitly leaves naive full-dataset memory and p99 evidence unresolved.
    - path: rinha-de-backend-2026-elixir/lib/rinha_backend_2026/reference_index.ex
      commit: 2023435681dc99ae08d2a4034ab5feb4226d7480
      claim: The committed ReferenceIndex synchronously loads resources in init and
        exposes readiness only after its state exists.
    - path: rinha-de-backend-2026-elixir/test/rinha_backend_2026/reference_index_test.exs
      commit: 2023435681dc99ae08d2a4034ab5feb4226d7480
      claim: The committed test kills a supervised index pid, observes a distinct
        ready pid, and scores bundled sample resources with at least five references.
    verified_claims:
    - Supervision restarts the index and readiness returns after synchronous sample-resource
      loading in the cited revision.
    - The sample restart test does not establish full-dataset reload, reload availability,
      memory, corrupt-resource recovery, restart storms, or submission performance.
    confirmation_required:
    - Establish authorship, challenge submission status, full-dataset availability,
      current test execution, full reload latency, memory envelope, readiness during
      reload, corrupt-resource policy, restart intensity, multi-instance behavior,
      warm handoff, and benchmark results.
    safe_interview_version: This public challenge study demonstrates supervised sample-resource
      reload and readiness, while reserving full-dataset performance, availability,
      and submission claims for separate evidence.
    confidentiality:
      level: high
      note: Do not disclose challenge payloads, resource paths, full dataset, index
        contents, transaction fields, local memory profiles, readiness timings, or
