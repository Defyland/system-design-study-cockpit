      assumptions_explicit: Labels the Elixir project deep dive premise that is still
        assumed and asks the smallest clarifying question that matters.
      alternatives_considered: Considers a credible alternative for Elixir project
        deep dive, or explains the hard constraint that makes comparison a false equivalence.
      tradeoff_quality: Connects the Elixir project deep dive choice to a benefit,
        a cost or risk, and the condition under which another choice wins.
      follow_up_adaptation: Responds to an adversarial Elixir project deep dive follow-up
        by changing the claim or evidence boundary rather than repeating a memorised
        answer.
      certainty_calibration: Uses high, medium, or low certainty deliberately and
        names the evidence that would update the Elixir project deep dive recommendation.
cards:
- id: elixir_experience-card-1
  front: What does the PulseOps transaction guarantee, and what must the worker still
    handle?
  back: Job, Oban handoff, and event commit or roll back together. The later worker
    effect is outside that boundary—preserve idempotency and reconcile uncertainty;
    do not call it exactly-once.
  box: 1
  source:
    repo: backend-challenges
    path: pulseops-elixir-job-platform/lib/pulse_ops/jobs.ex
    note: Local Job, Oban handoff, event, and idempotency boundary.
  critical_thinking:
    cue: What does the PulseOps transaction guarantee, and what must the worker still
      handle? Before answering, separate the stated fact from your assumption and
      name one condition that could change it.
    check: For this Elixir project deep dive card, can you compare two options, name
      one failure mode, and state what evidence would update the recommendation?
- id: elixir_experience-card-2
  front: What remains after ReportForge stages an artifact and cancellation wins?
  back: The short lock protects report state, not object storage. Finalization rechecks
    then compensates with delete_for_report; deletion is not atomic rollback. The
    current generator materializes data, so validate stream-first with chunk, cleanup,
    cancellation, RSS, and storage-failure measurements.
  box: 2
  source:
    repo: backend-challenges
    path: reportforge-elixir-report-platform/lib/report_forge/reports.ex
    note: Staged artifact finalization and separate deletion compensation.
  critical_thinking:
    cue: What remains after ReportForge stages an artifact and cancellation wins?
      Before answering, separate the stated fact from your assumption and name one
      condition that could change it.
    check: For this Elixir project deep dive card, can you compare two options, name
      one failure mode, and state what evidence would update the recommendation?
- id: elixir_experience-card-3
  front: Why do neither a heap nor supervision solve Rinha Elixir scoring scale?
  back: Exact scoring still scans every reference; a size-k heap replaces full sorting,
    not an index. One GenServer serializes calls; supervision restarts it rather than
    adding reads. Measure mailbox, p99, CPU, RSS, and two-instance memory before choosing
    snapshots or bounded workers.
  box: 3
  source:
    repo: backend-challenges
    path: rinha-de-backend-2026-elixir/lib/rinha_backend_2026/reference_index.ex
    note: Synchronous scoring calls through one ReferenceIndex callback loop.
  critical_thinking:
    cue: Why do neither a heap nor supervision solve Rinha Elixir scoring scale? Before
      answering, separate the stated fact from your assumption and name one condition
      that could change it.
    check: For this Elixir project deep dive card, can you compare two options, name
      one failure mode, and state what evidence would update the recommendation?
