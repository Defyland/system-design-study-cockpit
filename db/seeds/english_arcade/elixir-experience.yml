      and operator observability.
    safe_interview_version: This ReportForge portfolio study commits cancellation
      intent before a later Oban request and rechecks state in workers, without claiming
      instantaneous preemption or operational outcome.
    confidentiality:
      level: high
      note: Do not disclose organization, Report, artifact, execution job, queue,
        event, status, storage, payload, trace, timing, or operator data.
  feedback:
    register: Say “committed cancellation intent,” not “the worker was stopped instantly.”
    hedging: Treat the cited running-worker test as revision evidence, not proof of
