- id: elixir_experience-04-reportforge-inflight-cancellation
  version: 1.4.0
  target: elixir_experience
  topic: ReportForge cancellation of in-flight work
  difficulty: 3
  interview_stage: deep_dive
  prompt: What does ReportForge cancellation actually guarantee when a worker may
    already be running?
  context: The interviewer is probing transaction order, state revalidation, late
    Oban cancellation, in-flight I/O, retry races, and the boundary before artifact
    compensation.
  best_answer: >-
    I would explain that ReportForge commits cancellation before asking Oban to stop work. In
    Repo.transaction it locks and revalidates the Report, stores cancelled status plus an event,
    and clears execution_job_id. After commit, it calls Oban.cancel_job only if an ID existed;
    worker and completion paths recheck cancelled. That prevents a late completion from simply
    overwriting local state, but it does not preempt I/O already started or guarantee the later
    Oban call succeeds. I would keep the row lock out of artifact writing.
  distractors:
  - text: I would synchronously call Oban.cancel_job while retaining the Report row
      lock, then persist cancellation only after it returns. That guarantees an already-running
      worker cannot start I/O or later complete. If cancellation fails, retry the
      database transaction until it succeeds, because retained locks make external
      calls atomic and prevent every retry race.
    trap: precision
    why_wrong: It holds a database lock across an external call and converts a late,
      fallible cancellation request into a false atomicity claim.
  - text: I would mark the Report cancelled, erase its event history, and assume the
      worker sees that state before any artifact step. Once the database commits,
      cancellation automatically undoes remote writes. There is no need for completion
      revalidation, retry-race handling, or an operator signal when an in-flight worker
      finishes later.
    trap: hedging
    why_wrong: It mistakes persisted intent for preemption, discards audit evidence,
      and ignores a completion path that must honor cancellation.
  sources:
  - repo: backend-challenges
    path: reportforge-elixir-report-platform/README.md
