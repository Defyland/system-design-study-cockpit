          reconciliation answer because changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire PulseOps terminal state reconciliation explanation
          with a new design without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
