- id: elixir_experience-10-rinha-elixir-supervised-resource-reload
  version: 1.4.0
  target: elixir_experience
  topic: Rinha Elixir supervised resource reload
  difficulty: 3
  interview_stage: deep_dive
  prompt: What does a supervised Rinha Elixir ReferenceIndex restart prove, and what
    full-dataset risks remain?
  context: The interviewer is probing synchronous init, readiness, historical sample-resource
    restart evidence, and the performance and availability gaps that supervision alone
    cannot establish.
  best_answer: >-
    I would scope the ReferenceIndex evidence: it loads resources synchronously in GenServer
    init, so ready_status exists only after state does. The historical test kills a supervised
    pid, observes a new pid become ready, then scores sample resources with at least five
    references. That demonstrates revision-level restart semantics and readiness after sample
    load. I would not present it as full three-million-resource reload latency, memory envelope,
    availability while reloading, corrupt-resource recovery, restart-storm behavior, or
    challenge submission performance. A warm handoff or versioned index needs separate benchmark
    and failure evidence.
  distractors:
  - text: I would treat any successful supervisor restart as proof that the entire
      reference dataset reloads within strict latency and memory limits. Once a new
      pid appears, readiness is continuous and scoring never pauses for callers. Sample-resource
      tests therefore cover corrupt files, restart storms, two-instance memory pressure,
      warm handoff, and competitive submission performance without separate measurements.
    trap: precision
    why_wrong: It converts a sample restart observation into unsupported full-dataset
      performance, availability, and competition claims.
  - text: I would avoid synchronous loading by returning ready immediately, then let
      scoring requests trigger resources on demand. A failed init can be ignored because
      supervision will always retry successfully. Keeping two indexes is free, and
      no benchmark or versioned handoff is necessary before serving a larger reference
      set.
    trap: hedging
    why_wrong: It weakens readiness semantics and assumes recovery and memory behavior
      without testing corrupt inputs, restart intensity, or capacity.
  sources:
  - repo: backend-challenges
    path: rinha-de-backend-2026-elixir/README.md
    note: Correctness-first public challenge baseline and stated full-dataset limits.
  - repo: backend-challenges
    path: rinha-de-backend-2026-elixir/lib/rinha_backend_2026/reference_index.ex
    note: Synchronous GenServer resource init and readiness implementation.
  - repo: backend-challenges
    path: rinha-de-backend-2026-elixir/test/rinha_backend_2026/reference_index_test.exs
    note: Historical supervised crash, ready, and sample scoring specification.
  - repo: original
    path: english-arcade/elixir_experience/10
    note: Authored interview-language coaching.
  provenance:
    evidence_class: portfolio_code
    project: Rinha de Backend 2026 Elixir
    repository: backend-challenges
    files:
    - path: rinha-de-backend-2026-elixir/README.md
      commit: 2023435681dc99ae08d2a4034ab5feb4226d7480
      claim: The committed README calls this a correctness-first challenge baseline
        and explicitly leaves naive full-dataset memory and p99 evidence unresolved.
    - path: rinha-de-backend-2026-elixir/lib/rinha_backend_2026/reference_index.ex
      commit: 2023435681dc99ae08d2a4034ab5feb4226d7480
      claim: The committed ReferenceIndex synchronously loads resources in init and
        exposes readiness only after its state exists.
    - path: rinha-de-backend-2026-elixir/test/rinha_backend_2026/reference_index_test.exs
      commit: 2023435681dc99ae08d2a4034ab5feb4226d7480
      claim: The committed test kills a supervised index pid, observes a distinct
        ready pid, and scores bundled sample resources with at least five references.
    verified_claims:
    - Supervision restarts the index and readiness returns after synchronous sample-resource
      loading in the cited revision.
    - The sample restart test does not establish full-dataset reload, reload availability,
      memory, corrupt-resource recovery, restart storms, or submission performance.
    confirmation_required:
    - Establish authorship, challenge submission status, full-dataset availability,
      current test execution, full reload latency, memory envelope, readiness during
      reload, corrupt-resource policy, restart intensity, multi-instance behavior,
      warm handoff, and benchmark results.
    safe_interview_version: This public challenge study demonstrates supervised sample-resource
      reload and readiness, while reserving full-dataset performance, availability,
      and submission claims for separate evidence.
    confidentiality:
      level: high
      note: Do not disclose challenge payloads, resource paths, full dataset, index
        contents, transaction fields, local memory profiles, readiness timings, or
        unpublished benchmark data.
  feedback:
    register: Call this supervised sample-resource reload evidence, not a full-dataset
      availability claim.
    hedging: Treat the cited start_supervised crash observation as historical revision
      evidence rather than a current benchmark.
    precision: Name synchronous init, ready_status, new pid, sample references, full-dataset
      load, memory envelope, and warm handoff separately.
    grammar: Contrast “restarts and becomes ready” with “does not measure the reload
      envelope.”
    pragmatics: Offer a failure and capacity test before treating readiness as a user-visible
      availability guarantee.
  rephrase:
    prompt: Explain to an OTP engineer why a supervised GenServer restart is valuable
      while still leaving reload availability and capacity unanswered.
    goal: Preserve restart semantics without inflating them into throughput evidence.
  follow_up:
    prompt: Init fails on a corrupt resource, restart intensity is reached, two instances
      reload a full dataset, and callers ask readiness during the swap. What warm
      handoff or versioned-index policy, memory budget, and benchmark would you require?
    goal: Connect failure policy, availability, and capacity to the actual index boundary.
    challenge_kind: evidence
    best_answer: >-
      I would require a warm handoff or versioned index so readers see one complete generation
      while a new one loads, with an explicit memory budget for overlap. I would test
      corrupt-resource startup, restart intensity, readiness during swap, and two-instance RSS and
      latency before claiming full-scale availability.
    distractors:
    - text: I would cite my experience with Rinha Elixir supervised resource reload
        as enough proof and move on without naming an observation.
      why_wrong: Experience can guide a hypothesis, but it does not replace evidence
        tied to this context.
    - text: I would collect every possible metric about Rinha Elixir supervised resource
        reload before making even a provisional recommendation.
      why_wrong: A focused decision can start with one discriminating observation
        rather than an unbounded data request.
  compression:
    prompt: Give four clauses for synchronous init, sample restart, readiness, and
      full-dataset gap.
    goal: Keep proof scope and missing envelope distinct.
  language_focus:
  - precision
  - pragmatics
  - hedging
  feynman:
    concept: Supervision can recreate a process and its loaded state, but it cannot
      make an expensive load invisible to capacity or callers by itself.
    explain_to: A teammate who believes a new pid means the service had no reload
      interruption.
    constraint: Include init loading, ready_status timing, sample versus full resources,
      and a two-instance memory question.
    self_check: Did you separate restart mechanics, readiness, reload availability,
      and benchmark evidence?
    reasoning_check: Can you identify the hidden premise behind Rinha Elixir supervised
      resource reload, give a counterexample, and explain how the evidence changes
      your conclusion?
  black_box:
    symptom: An index pid is killed and another arrives, but a full resource reload
      may consume memory or leave callers waiting.
    expected: Readiness reflects loaded state, failure policy is explicit, and measured
      handoff or reload capacity informs deployment.
    actual: Sample restart success is treated as evidence of uninterrupted full-dataset
      scoring.
    root_cause: Process supervision was confused with a versioned, capacity-bounded
      serving strategy.
    repair: Test corrupt init and restart intensity, measure full reload and two-instance
      RSS, and choose warm handoff or versioned index semantics.
    reasoning_error: If your Rinha Elixir supervised resource reload answer failed,
      classify the mistake as a fact, assumption, comparison, failure, or certainty
      error before proposing the smallest repair.
  recall:
    active_recall_cue: When does ready_status become callable, and what did the cited
      restart test load and score?
    feynman_prompt: Why can a distinct ready pid still leave full-dataset latency
      and memory unknown?
    black_box_probe: Did you name corrupt resources, restart intensity, reload availability,
      warm handoff, two instances, and benchmark evidence?
    leitner_start_box: 1
    mastery_threshold: 8
    delayed_variant:
      id: elixir_experience-10-rinha-elixir-supervised-resource-reload-delayed-10
      prompt: >-
        A corrupt resource causes restart intensity, two instances reload the full data set, and
        callers ask for readiness during a swap. Which historical evidence survives and what
        benchmark is missing?
      changed_constraint: >-
        reload must provide bounded overlap memory, readiness semantics, and recovery from corrupt
        resources across instances
      new_evidence: >-
        corrupt startup, two-instance reload, and readiness-during-swap cases exceed the historical
        sample-load test
      best_answer: >-
        I would keep the evidence for supervised restart and readiness after the sample load, but I
        would retract any full-scale availability claim. I would define a warm handoff or versioned
        index, measure overlap RSS and latency across two instances, and test corrupt-resource
        recovery and restart intensity.
      distractors:
      - text: I would preserve every part of the original Rinha Elixir supervised
          resource reload answer because changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Rinha Elixir supervised resource reload explanation
          with a new design without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  extension:
    prompt: Define negative cases for init failure, corrupt resources, restart storm,
      readiness during reload, versioned handoff, two-index memory pressure, and full-dataset
      latency or RSS measurement.
    goal: Build evidence for a larger resource envelope without treating sample supervision
      as final performance proof.
  critical_thinking:
    problem_frame: 'I frame supervision evidence narrowly: identify the ReferenceIndex
      process, what readiness means after init, and which full-dataset latency, RSS, and
      handoff questions remain outside a restart test.'
    comparison:
      applicable: true
      alternatives:
      - option: Keep one supervised ReferenceIndex with synchronous initialization.
        benefit: It is simple and the current restart path makes process ownership and
          readiness easy to inspect.
        cost_or_risk: A reload can block or lose readiness, and a failed replacement may
          leave no usable generation unless that policy is explicit.
        valid_when: Use it when the resource is small enough and measured restart or reload
          downtime fits the budget.
      - option: Build a versioned replacement and publish it only after complete initialization.
        benefit: It can keep the previous generation readable while a new resource loads
          and make handoff atomic to readers.
        cost_or_risk: It temporarily duplicates memory and requires ownership, cleanup,
          and failed-generation handling.
        valid_when: Use it when full-dataset reload or availability budgets justify overlap
          and the RSS envelope supports it.
      decision_rule: Keep the single supervised process only when full-resource reload
        fits the availability and memory budgets; choose versioned handoff when overlap
        and failure ownership are measured requirements.
    rubric:
      facts_correct: States exactly what supervised restart and readiness establish and
        separates them from full-dataset serving claims.
      assumptions_explicit: Labels assumptions about complete generation readiness, failed
        init ownership, and overlap memory.
      alternatives_considered: Compares one supervised state with a versioned replacement
        and states the resource-budget condition for each.
      tradeoff_quality: Connects reload latency, availability, RSS overlap, cleanup, and
        failure ownership to the design.
      follow_up_adaptation: Changes the recommendation when the full dataset misses latency
        or RSS or when readers see an incomplete generation.
      certainty_calibration: Keeps medium certainty for process recovery and avoids claiming
        final performance from a sample.
    claim_map:
      fact: The described sample kills a ReferenceIndex process and observes supervised
        restart and readiness, with synchronous initialization of resource data.
      inference: That demonstrates a supervised process can recover in the sample path;
        it does not demonstrate full-dataset reload time, two-index memory pressure, or
        uninterrupted availability during replacement.
      assumption: I am assuming a failed init keeps the old serving state or fails closed,
        and that readiness is defined as a complete usable generation rather than a spawned
        process.
      unknown: Full resource size, init latency, RSS during overlap, corrupt-resource
        behavior, restart storms, and reader behavior during reload are unknown.
    failure_probe:
      kind: counterexample
      prompt: Load the full dataset, corrupt a resource, restart repeatedly, and read
        during a replacement. Which observation would show supervision recovered a process
        but failed the serving or memory contract?
    evidence_check:
      limitation: The source supports supervised restart and sample readiness, but it
        cannot establish full-dataset performance, availability during reload, or memory
        behavior from that sample.
      basis: Check the concrete claim against backend-challenges/rinha-de-backend-2026-elixir/README.md
        and the exact interview context; record which statements are code facts, inferences,
        assumptions, and unknowns.
      source_kind: primary_code
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: I am confident about the narrow process-restart claim; I am deliberately
        uncertain about serving continuity and memory until the full resource envelope
        is measured.
      update_trigger: I would update the design after full-dataset init/RSS measurements,
        corrupt-resource tests, restart-storm tests, and a reader-visible generation handoff
        test.

- id: elixir_experience-11-rinha-elixir-exact-knn-scaling-baseline
  version: 1.4.0
  target: elixir_experience
  topic: Rinha Elixir exact k-NN scaling baseline
  difficulty: 3
  interview_stage: architecture_review
  prompt: How would you defend this exact Rinha Elixir k-NN baseline and decide the
    next optimization?
  context: The interviewer is probing true exact-search complexity, correctness value,
    full-dataset evidence gaps, and the trade-offs between a heap and approximate
    indexing.
  best_answer: >-
    I would defend Rinha 14-dimensional scoring as a correctness oracle and reviewable baseline:
    it maps every reference to a squared distance, sorts all N candidates, takes five, and
    counts labels. That costs O(N*d + N log N) per query, O(N) candidate and sort space, plus
    O(N*d) stored references per instance. I would benchmark the official three million records
    first; a size-five heap removes full sorting but not scanning, while ANN or quantization
    trades recall, memory, build, and update complexity.
  distractors:
  - text: I would optimize by replacing the full sort with a size-five heap, then
      claim exact scoring is effectively constant time because k is fixed. Reference
      memory also disappears once candidates are bounded. There is no reason to benchmark
      the official dataset or discuss ANN recall, quantization, build cost, updates,
      or two-instance memory.
    trap: precision
    why_wrong: A bounded heap removes the full sort but retains the all-reference
      scan and stored reference memory.
  - text: I would introduce an ANN library immediately and call any returned five
      labels correct. Approximation has no cost beyond implementation, so recall,
      index build time, update behavior, quantization error, and memory do not need
      a baseline. The reviewable exact path can be deleted before the official corpus
      is exercised.
    trap: hedging
    why_wrong: It removes the correctness oracle before measuring the intended workload
      and ignores the new approximation trade-offs.
  sources:
  - repo: backend-challenges
    path: rinha-de-backend-2026-elixir/README.md
    note: Correctness-first public challenge posture and full-dataset memory and p99
      limits.
  - repo: backend-challenges
    path: rinha-de-backend-2026-elixir/lib/rinha_backend_2026/scoring.ex
    note: Fourteen-dimensional resource load and exact all-reference scoring path.
  - repo: backend-challenges
    path: rinha-de-backend-2026-elixir/docs/adr/0001-exact-knn-baseline.md
    note: Exact baseline decision and unmeasured full-dataset trade-offs.
  - repo: original
    path: english-arcade/elixir_experience/11
    note: Authored interview-language coaching.
  provenance:
    evidence_class: public_challenge
    project: Rinha de Backend 2026 Elixir
    repository: backend-challenges
    files:
    - path: rinha-de-backend-2026-elixir/README.md
      commit: 2023435681dc99ae08d2a4034ab5feb4226d7480
      claim: The committed README calls the project a correctness-first baseline and
        leaves full-dataset memory and p99 evidence unmeasured.
    - path: rinha-de-backend-2026-elixir/lib/rinha_backend_2026/scoring.ex
      commit: 2023435681dc99ae08d2a4034ab5feb4226d7480
      claim: The committed Scoring module uses a 14-dimensional vector, maps squared
        distance over every reference, sorts all candidates, takes five, and counts
        labels.
    - path: rinha-de-backend-2026-elixir/docs/adr/0001-exact-knn-baseline.md
      commit: 2023435681dc99ae08d2a4034ab5feb4226d7480
      claim: The committed ADR chooses an exact baseline for reviewability while stating
        full-dataset exact search and two in-memory indexes are not submission-ready.
    verified_claims:
    - Exact scoring performs a full reference scan and full candidate sort, making
