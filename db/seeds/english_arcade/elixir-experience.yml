  difficulty: 3
  interview_stage: deep_dive
  prompt: How would you explain the cancellation race after ReportForge stages an
    artifact but before it finalizes report completion?
  context: The interviewer is probing short lock scope, staged-object compensation,
    cancellation revalidation, orphan risk, and the boundary separate from Oban cancellation
    intent.
  best_answer: >-
    I would explain that ReportForge prepares completion under a short row lock, then writes
    artifact bytes through ArtifactStorage after the transaction ends. Finalization reacquires
    the lock and revalidates running state; if cancellation, a state change, or an error wins,
    it calls delete_for_report as compensation. That keeps state changes responsive during
    storage, and the cited test covers cancellation between put and finalize with no artifact
    record. I would state the limit: database-plus-storage is not atomic because delete is
    separate, its result is ignored, and a crash can leave a staged object.
  distractors:
  - text: I would deliberately retain the Report row lock throughout ArtifactStorage.put_artifact
      so cancellation cannot interleave with storage. Once bytes exist, the final
      database update must succeed and deletion is unnecessary. Any failed write or
      crash can be retried from identical code without an orphan, because the transaction
      automatically rolls back every external storage object.
    trap: precision
    why_wrong: It turns the storage call into a long database critical section and
      falsely extends rollback across the storage boundary.
  - text: I would treat delete_for_report as transactional rollback—when finalization
      sees cancellation, the object is certainly gone. Duplicate attempts may then
      reuse the staged object without an idempotent identity or cleanup sweep. Telemetry
      only matters after storage, and the test proves every process crash is recovered
      automatically.
    trap: hedging
    why_wrong: It confuses best-effort compensation with atomic rollback and leaves
      failed deletion, crash, and duplicate-attempt recovery unexplained.
  sources:
  - repo: backend-challenges
    path: reportforge-elixir-report-platform/lib/report_forge/reports.ex
    note: Completion preparation, out-of-lock storage, final revalidation, and compensation
      path.
  - repo: backend-challenges
    path: reportforge-elixir-report-platform/test/report_forge/reports_test.exs
    note: Historical PausingStorage cancellation and available-row-lock specifications.
  - repo: backend-challenges
    path: reportforge-elixir-report-platform/docs/architecture/large-report-pipeline.md
    note: Storage boundary and future large-report constraints.
  - repo: original
    path: english-arcade/elixir_experience/5
    note: Authored interview-language coaching.
  provenance:
    evidence_class: portfolio_code
    project: ReportForge
    repository: backend-challenges
    files:
    - path: reportforge-elixir-report-platform/lib/report_forge/reports.ex
      commit: 0c68fb1f0d23e30a474e6b3299b493f7c84e63aa
      claim: The committed Reports module prepares completion under a lock, writes
        through ArtifactStorage outside it, rechecks state in finalization, and invokes
        delete_for_report on finalization error.
    - path: reportforge-elixir-report-platform/test/report_forge/reports_test.exs
      commit: 0c68fb1f0d23e30a474e6b3299b493f7c84e63aa
      claim: The committed PausingStorage tests specify that the row remains lockable
        during put and cancellation before finalization leaves the report cancelled
        with zero artifacts.
    - path: reportforge-elixir-report-platform/docs/architecture/large-report-pipeline.md
      commit: 0c68fb1f0d23e30a474e6b3299b493f7c84e63aa
      claim: The committed pipeline document describes storage as a separate boundary
        and calls for failure cleanup in the future stream-first design.
    verified_claims:
    - Artifact bytes are staged outside the database row lock; finalization locks
      and revalidates report state afterward.
    - Finalization error triggers separate delete_for_report compensation, which is
      not an atomic database-plus-storage rollback.
    confirmation_required:
    - Establish authorship, operating context, user exposure, outcomes, current test
      execution, crash recovery, deletion reliability, duplicate-attempt identity,
      cleanup cadence, and telemetry behavior.
    safe_interview_version: This ReportForge portfolio study stages artifacts outside
      a short database lock and compensates failed finalization separately, without
      claiming storage atomicity or complete orphan recovery.
    confidentiality:
      level: high
      note: Do not disclose organization, Report, artifact body, storage key, download
        token, checksum, queue, cancellation, object-store, trace, or cleanup data.
  feedback:
    register: Call deletion compensation, not transactional storage rollback.
    hedging: Present the PausingStorage assertions as historical commit evidence rather
      than a current crash-recovery run.
    precision: Separate prepare lock, out-of-lock put, finalize lock, state revalidation,
      delete_for_report, and staged-object window.
    grammar: Use “stage outside; finalize under a new lock” to make the two phases
      clear.
    pragmatics: Name the orphan risk before proposing cleanup, so a reviewer can ask
      about its operating signal.
  rephrase:
    prompt: Explain to a storage engineer why releasing the Report lock before put_artifact
      improves responsiveness but creates a compensating cleanup obligation.
    goal: Preserve the lock-versus-staged-object trade-off.
  follow_up:
    prompt: A process crashes after put, delete_for_report later fails, and a duplicate
      attempt appears with the same idempotency identity. What cleanup sweep, identity
      rule, telemetry, and retry policy would recover without deleting a valid artifact?
    goal: Reason about orphan recovery rather than confusing compensation with atomicity.
    challenge_kind: evidence
    best_answer: >-
      I would key staged objects by report and attempt identity, sweep objects with no finalized
      record, and alert when delete_for_report fails. Before deleting anything I would recheck the
      current artifact identity, and I would treat a duplicate attempt as a conflict or explicit
      idempotent replay rather than a reason to delete a valid artifact.
    distractors:
    - text: I would cite my experience with ReportForge staged artifact cancellation
        compensation as enough proof and move on without naming an observation.
      why_wrong: Experience can guide a hypothesis, but it does not replace evidence
        tied to this context.
    - text: I would collect every possible metric about ReportForge staged artifact
        cancellation compensation before making even a provisional recommendation.
      why_wrong: A focused decision can start with one discriminating observation
        rather than an unbounded data request.
  compression:
    prompt: Give four clauses for short lock, staged bytes, final state check, and
      separate delete.
    goal: Keep the intentional race window visible.
  language_focus:
  - precision
  - pragmatics
  - hedging
  feynman:
    concept: A database can protect report state without also enclosing an object-store
      write, so cleanup must compensate for a staged-object race.
    explain_to: A teammate who proposes holding the Report lock while a large artifact
      uploads.
    constraint: Include the two lock phases, cancellation between them, ignored delete
      result, and a crash after put.
    self_check: Did you distinguish fast state transitions from complete storage cleanup?
    reasoning_check: Can you identify the hidden premise behind ReportForge staged
      artifact cancellation compensation, give a counterexample, and explain how the
      evidence changes your conclusion?
  black_box:
    symptom: Cancellation arrives while PausingStorage has accepted bytes but finalization
      has not acquired its second lock.
    expected: Finalization sees cancelled state, avoids a completion record, and invokes
      separate deletion.
    actual: The Report is cancelled but an object persists, or storage blocks the
      cancellation row lock.
    root_cause: Database locking was treated as control over the independent storage
      side effect.
    repair: Keep put outside the lock, revalidate on finalization, compensate with
      deletion, and monitor or sweep stranded artifacts.
    reasoning_error: If your ReportForge staged artifact cancellation compensation
      answer failed, classify the mistake as a fact, assumption, comparison, failure,
      or certainty error before proposing the smallest repair.
  recall:
    active_recall_cue: Which operation occurs after prepare_completion releases its
      lock, and what action follows a failed finalization?
    feynman_prompt: Why is a staged artifact possible even when Report state transitions
      are transactional?
    black_box_probe: Did you identify cancellation-between-phases, ignored delete
      result, and the orphan-cleanup need?
    leitner_start_box: 1
    mastery_threshold: 8
    delayed_variant:
      id: elixir_experience-05-reportforge-staged-artifact-compensation-delayed-5
      prompt: >-
        The process crashes after put, delete_for_report later fails, and a duplicate attempt uses
        the same idempotency identity. What artifact claim survives and what cleanup evidence is
        required?
      changed_constraint: >-
        staged-object cleanup must be retryable and must not delete a valid artifact for the same
        report identity
      new_evidence: >-
        a crash leaves storage ahead of the database and compensation fails while a duplicate
        attempt appears
      best_answer: >-
        I would keep the short-lock and revalidation design, but I would retract any atomic rollback
        claim. I would key the staged object by attempt, sweep objects with no finalized record,
        retry failed deletion with telemetry, and recheck identity before removing anything that
        could be valid.
      distractors:
      - text: I would preserve every part of the original ReportForge staged artifact
          cancellation compensation answer because changing it after review would
          be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire ReportForge staged artifact cancellation
          compensation explanation with a new design without identifying what the
          evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  extension:
    prompt: Define negative cases for cancellation before put, during paused put,
      after put before finalize, failed deletion, process crash, and a duplicate attempt
      sharing an idempotency key.
    goal: Test compensation boundaries without claiming atomic object storage.
  critical_thinking:
    problem_frame: 'I frame this as a two-resource transaction that is not atomic: the
      database report state and the staged object have separate commit paths, so finalization
      must revalidate state and define compensation.'
    comparison:
      applicable: true
      alternatives:
      - option: Keep the short lock, put the object, revalidate, finalize, and compensate
          with delete_for_report.
        benefit: It avoids holding a database lock over storage I/O and makes the local
          report decision explicit.
        cost_or_risk: A crash or failed deletion can leave an orphan, and the put and
          row update are never one atomic commit.
        valid_when: Use it when lock duration matters and orphan cleanup is observable
          and operable.
      - option: Stage under a temporary key and promote or expire it through a storage
          lifecycle policy.
        benefit: It can separate visible artifacts from incomplete attempts and bound
          orphan retention.
        cost_or_risk: It adds promotion, lifecycle, and duplicate-key semantics; promotion
          itself still needs a failure policy.
        valid_when: Use it when object storage supports the lifecycle controls and orphan
          retention is a material requirement.
      decision_rule: Choose the current short-lock compensation path when cleanup is measurable;
        choose temporary promotion or lifecycle controls when orphan retention and storage
        recovery budgets require stronger containment.
    rubric:
      facts_correct: Names the put, short row lock, revalidation, finalization, and separate
        delete_for_report boundary.
      assumptions_explicit: States assumptions about object identity, idempotent deletion,
        stale attempts, and retention.
      alternatives_considered: Compares direct staged compensation with temporary-key
        promotion or lifecycle expiry.
      tradeoff_quality: Connects lock duration, orphan risk, delete failure, visibility,
        and operational cleanup to the recommendation.
      follow_up_adaptation: Changes the cleanup action when cancellation or a crash occurs
        at a different stage.
      certainty_calibration: Separates code-supported sequencing from any unmeasured claim
        about atomic storage or cleanup completeness.
    claim_map:
      fact: The described ReportForge flow performs the object put outside the row lock
        or database transaction, then reacquires and revalidates before finalization;
        delete_for_report is a separate cleanup operation.
      inference: Cancellation or a crash between put and finalize can leave an orphaned
        object, so compensation narrows but does not remove the storage failure window.
      assumption: I am assuming object keys are tied to a report or attempt, deletion
        is idempotent enough to retry, and finalization can distinguish a stale attempt.
      unknown: Storage consistency and delete latency, crash recovery, duplicate attempts,
        and the retention policy for orphaned objects are not established.
    failure_probe:
      kind: edge_case
      prompt: Cancel before put, during a paused put, after put but before finalize, and
        after a process crash. Which row state and object cleanup action should follow,
        and what evidence would expose a leaked or wrongly deleted artifact?
    evidence_check:
      limitation: The source supports separate database and object operations, but it
        does not prove atomic storage, delete success, crash recovery, or an acceptable
        orphan-retention budget.
      basis: Check the concrete claim against backend-challenges/reportforge-elixir-report-platform/lib/report_forge/reports.ex
        and the exact interview context; record which statements are code facts, inferences,
        assumptions, and unknowns.
      source_kind: primary_code
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: I am confident about the separate failure boundary and need storage and
        crash evidence before claiming compensation is complete.
      update_trigger: I would update the cleanup policy after fault injection shows a
        leaked key, an over-broad deletion, a duplicate attempt collision, or unacceptable
        delete latency.

- id: elixir_experience-06-reportforge-stream-first-boundary
  version: 1.4.0
  target: elixir_experience
  topic: ReportForge in-memory generator and stream-first boundary
  difficulty: 3
  interview_stage: architecture_review
  prompt: How would you present ReportForge's stream-first architecture without claiming
    the current generator already streams?
  context: The interviewer is probing materialization paths, intended stream-first
    constraints, cancellation and backpressure design, and the difference between
    a code fact and a future architecture.
  best_answer: >-
    I would be explicit that ReportForge current generator is deliberately small, deterministic,
    and in memory. It Enum.maps all rows; CSV uses map_join, JSON materializes manifest plus
    rows, and ZIP builds CSV, JSON, and manifest before :zip.create with [:memory]. The
    architecture document instead defines stream-first constraints: bounded chunks, incremental
    checksums and byte counts, temporary cleanup, and retryable writes. I would present that as
    intended evolution, not implemented streaming, bounded memory, large-report performance, or
    benchmark evidence for this study.
  distractors:
  - text: I would call the current generator streaming because Enum.map creates each
      row and an artifact appears afterward. CSV map_join and an in-memory ZIP reduce
      memory automatically. Since the architecture mentions chunks and checksums,
      those controls already govern database cursors, multipart uploads, cancellation,
      and backpressure in the present implementation.
    trap: precision
    why_wrong: It mistakes collection and memory-backed rendering for streaming and
      imports future controls into code that does not implement them.
  - text: I would benchmark only the ZIP body, then claim its process memory represents
      every format. JSON and CSV need no design work because full bodies are easier
      to checksum. Temporary cleanup and cancellation belong solely to storage, so
      the encoder never needs bounded chunks, incremental state, or a cursor strategy.
    trap: hedging
    why_wrong: It generalizes one materialized output, removes generation responsibilities,
      and avoids the intended chunking and resource evidence.
  sources:
  - repo: backend-challenges
    path: reportforge-elixir-report-platform/README.md
    note: ReportForge study scope and current asynchronous artifact-generation context.
  - repo: backend-challenges
    path: reportforge-elixir-report-platform/lib/report_forge/reports/generator.ex
    note: Current in-memory row, CSV, JSON, and ZIP generation paths.
  - repo: backend-challenges
    path: reportforge-elixir-report-platform/docs/architecture/large-report-pipeline.md
    note: Stream-first constraints and stated current implementation boundary.
  - repo: original
    path: english-arcade/elixir_experience/6
    note: Authored interview-language coaching.
  provenance:
    evidence_class: portfolio_code
    project: ReportForge
    repository: backend-challenges
    files:
    - path: reportforge-elixir-report-platform/README.md
      commit: 0c68fb1f0d23e30a474e6b3299b493f7c84e63aa
      claim: The committed README describes the ReportForge asynchronous artifact
        pipeline and separates current scope from future large-export work.
    - path: reportforge-elixir-report-platform/lib/report_forge/reports/generator.ex
      commit: 0c68fb1f0d23e30a474e6b3299b493f7c84e63aa
      claim: The committed generator Enum.maps all rows, materializes CSV and JSON
        bodies, and creates a ZIP archive in memory.
    - path: reportforge-elixir-report-platform/docs/architecture/large-report-pipeline.md
      commit: 0c68fb1f0d23e30a474e6b3299b493f7c84e63aa
      claim: The committed architecture document calls for future streaming or bounded
        chunks, incremental checksums and byte counts, temporary cleanup, and retryable
        storage writes.
    verified_claims:
    - The current generator materializes rows and output bodies, including an in-memory
      ZIP archive.
    - Stream-first behavior is documented as a future constraint rather than a property
      of the cited implementation.
    confirmation_required:
    - Establish authorship, operating context, user exposure, outcomes, current test
      execution, database cursor behavior, chunking, cancellation, backpressure, benchmark
      method, RSS, and large-report performance.
    safe_interview_version: This ReportForge portfolio study distinguishes a deterministic
      in-memory generator from a documented stream-first evolution, without claiming
      bounded memory or measured large-report behavior.
    confidentiality:
      level: high
      note: Do not disclose organization, report rows, account or invoice fields,
        artifacts, ZIP contents, filters, filenames, local paths, memory profiles,
        or benchmark inputs.
  feedback:
    register: Say “documented stream-first direction,” not “the generator streams
      today.”
    hedging: Separate the committed in-memory code fact from unmeasured resource and
      future-architecture claims.
    precision: Name Enum.map, map_join, JSON materialization, memory ZIP, chunks,
      incremental checksum, temporary cleanup, and retryable writes.
    grammar: Use “currently materializes; future design should stream” as a clean
      contrast.
    pragmatics: Ask for RSS and cancellation evidence before recommending the intended
      design as a scale solution.
  rephrase:
    prompt: Explain to a staff engineer why a stream-first document is valuable without
      being proof that a small generator has bounded memory.
    goal: Keep architectural intent distinct from running code.
  follow_up:
    prompt: Design the next path—how do database cursors or chunks feed an encoder,
      compute checksum and bytes incrementally, use multipart or temporary storage,
      honor cancellation and backpressure, and measure RSS before choosing a limit?
    goal: Turn the document into an evidence plan rather than an implementation claim.
    challenge_kind: alternative
    best_answer: >-
      I would feed bounded database chunks into an encoder, update checksum and byte count per
      chunk, and write through multipart or temporary storage with cleanup ownership. I would
      propagate cancellation and demand, measure RSS and throughput against the current in-memory
      generator, and only set a limit after those measurements.
    distractors:
    - text: I would defend the first ReportForge in-memory generator and stream-first
        boundary option because offering an alternative might make the decision look
        uncertain.
      why_wrong: A comparison makes the decision rule visible; it does not weaken
        a well-calibrated recommendation.
    - text: I would list every conceivable ReportForge in-memory generator and stream-first
        boundary design without saying which requirement should decide between them.
      why_wrong: An option list without a decision rule avoids the trade-off the follow-up
        is testing.
  compression:
    prompt: Give four clauses for current materialization, ZIP memory, stream-first
      constraint, and missing benchmark.
    goal: Make the present-versus-future boundary memorable.
  language_focus:
  - precision
  - pragmatics
  - hedging
  feynman:
    concept: Streaming is a property of the path that carries bounded data forward,
      not a label earned by asynchronously returning a finished in-memory body.
    explain_to: A teammate who sees Enum.map and assumes each row leaves memory immediately.
    constraint: Include all-row collection, CSV or JSON materialization, the memory
      ZIP, and one future chunk or checksum control.
    self_check: Did you label the generator's current behavior and the design's intended
      behavior separately?
    reasoning_check: Can you identify the hidden premise behind ReportForge in-memory
      generator and stream-first boundary, give a counterexample, and explain how
      the evidence changes your conclusion?
  black_box:
    symptom: A review says the report pipeline is streaming because requests are asynchronous.
    expected: The reviewer sees rows and output bodies materialized now, then asks
      for a bounded cursor-to-encoder-to-storage path.
    actual: Memory rises with body size while a design document is cited as performance
      proof.
    root_cause: Asynchronous orchestration was confused with incremental generation.
    repair: Keep the current generator label honest; prototype chunks, incremental
      digest and byte counting, cleanup, cancellation, and RSS benchmarks.
    reasoning_error: If your ReportForge in-memory generator and stream-first boundary
      answer failed, classify the mistake as a fact, assumption, comparison, failure,
      or certainty error before proposing the smallest repair.
  recall:
    active_recall_cue: Which current operations materialize rows or bodies, and which
      four stream-first controls are only documented?
    feynman_prompt: Why does :zip.create with [:memory] contradict an implemented
      bounded-memory claim?
    black_box_probe: Did you separate code evidence, future chunks, cancellation/backpressure
      design, and RSS measurement?
    leitner_start_box: 1
    mastery_threshold: 8
    delayed_variant:
      id: elixir_experience-06-reportforge-stream-first-boundary-delayed-6
      prompt: >-
        The in-memory generator reaches its RSS limit on a large report, while a code inspection
        confirms the intended stream-first mechanism but not its impact. Which conclusion would you
        narrow?
      changed_constraint: >-
        large reports must stay within a measured RSS bound while preserving checksum, cancellation,
        and cleanup semantics
      new_evidence: >-
        a large-report run exceeds RSS and the stream-first design exists in documentation but has
        no performance evidence
      best_answer: >-
        I would keep the code fact that the current generator materializes rows and the intended
        stream-first constraints, but I would retract any implemented-streaming claim. I would build
        the chunked path, measure RSS and throughput against the current generator, and verify
        cleanup and cancellation before setting a production limit.
      distractors:
      - text: I would preserve every part of the original ReportForge in-memory generator
          and stream-first boundary answer because changing it after review would
          be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire ReportForge in-memory generator and stream-first
          boundary explanation with a new design without identifying what the evidence
          actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  extension:
    prompt: Specify one contract or negative case each for cursor chunking, incremental
      encoder and checksum, multipart or temporary cleanup, cancellation/backpressure,
      and RSS benchmarking.
    goal: Define evidence needed before the stream-first direction can become an implementation
      claim.
  critical_thinking:
    problem_frame: 'I frame the answer around the evidence boundary: distinguish the current
      in-memory generator from the intended stream-first direction, then name chunking,
      backpressure, checksum, cleanup, and RSS as unverified contracts.'
    comparison:
      applicable: false
      rejected_alternative: Comparing the current materialized generator with the proposed
        stream-first architecture as if both were implemented serving choices is a false
        equivalence; one is code evidence and the other is a direction.
      hard_constraint: The hard constraint is to avoid claiming bounded memory until an
        actual chunked pipeline and its failure cleanup are measured against the current
        generator.
      decision_rule: Describe the current memory behavior as fact, treat stream-first
        as a proposal, and choose it only after byte-equivalence, backpressure, cancellation,
        and RSS evidence exist.
    rubric:
      facts_correct: Identifies the materializing calls and keeps them separate from the
        intended stream-first direction.
      assumptions_explicit: Labels the assumptions behind chunking, checksum, backpressure,
        temporary storage, and cleanup.
      alternatives_considered: Explains why current code and a proposed streaming architecture
        are not yet comparable implementations.
      tradeoff_quality: Connects memory, cancellation, producer demand, checksum correctness,
        and cleanup to the evidence plan.
      follow_up_adaptation: Changes the claim only when an implemented stream passes byte,
        RSS, and failure tests.
      certainty_calibration: Uses high confidence for the current code fact and low confidence
        for the unimplemented production outcome.
    claim_map:
      fact: The described generator uses Enum.map, map_join, materialized JSON, and an
        in-memory :zip.create path, while the exercise material points toward a stream-first
        architecture.
      inference: The current implementation is not evidence that the final artifact streams
        or has bounded RSS; a chunked encoder and resource cleanup would have to be implemented
        and measured.
      assumption: I am assuming cursor chunks, incremental encoding, and a temporary or
        multipart sink can preserve artifact bytes while allowing cancellation and backpressure.
      unknown: Chunk size, checksum placement, producer demand, cancellation cleanup,
        temporary storage limits, and full-dataset RSS are unknown.
    failure_probe:
      kind: failure_mode
      prompt: Run the largest available report with a slow consumer, cancellation during
        a chunk, checksum failure, and temporary cleanup failure. Which observation would
        prove the current generator is materialized, and which would validate a stream-first
        replacement?
    evidence_check:
      limitation: The source and code can establish materialization in the current path,
        but they cannot prove bounded RSS, stream backpressure, byte equivalence, or cleanup
        behavior that is not implemented.
      basis: Check the concrete claim against backend-challenges/reportforge-elixir-report-platform/README.md
        and the exact interview context; record which statements are code facts, inferences,
        assumptions, and unknowns.
      source_kind: primary_code
      checked_on: '2026-08-25'
    certainty:
      level: high
      rationale: I am highly confident about the current materialization calls; I am deliberately
        uncertain about the proposed stream design until it exists and is benchmarked.
      update_trigger: I would update the recommendation after a full-dataset RSS benchmark,
        byte-equivalence check, cancellation/backpressure test, and cleanup fault injection.

- id: elixir_experience-07-reconpulse-atomic-replay-request
  version: 1.4.0
  target: elixir_experience
  topic: ReconPulse atomic replay request
  difficulty: 3
  interview_stage: deep_dive
  prompt: How would you prevent a ReconPulse replay row, Oban job, and audit trail
    from diverging when an operator requests a replay?
  context: The interviewer is probing Ecto.Multi contents, rollback, local auditability,
    unsupported event behavior, and the limits beyond the request transaction.
  best_answer: >-
    I would describe ReconPulse using one Ecto.Multi to turn a replay request into consistent
    local intent. After requiring a reason, it inserts a queued ReplayJob with before_state,
    inserts ReplayWorker through Oban, may mark the DeadLetter replay_requested, and writes
    event and audit logs in Repo.transaction. Any step rolls the local request back, avoiding a
    replay row, handoff, or audit trail that disagrees. I would keep the boundary explicit: it
    says nothing about duplicate operator requests, worker success, unsupported events, or
    exactly-once effects after the transaction.
  distractors:
  - text: I would insert ReplayJob, then enqueue a worker and write durable audit
      rows asynchronously so an asynchronous observability path cannot delay operators.
      If a subsequent operation fails, a completion worker can infer missing historical
      evidence. A reason helps the operator interface, and one committed replay request
      proves the eventual side effect will execute exactly once.
    trap: precision
    why_wrong: It creates the very local divergence the Multi prevents and turns request
      persistence into an external exactly-once result.
  - text: I would deduplicate every replay by the DeadLetter identifier and reject
      any later operator request. An unsupported event should be marked successful
      after enqueue because Oban has accepted it. Rollbacks are not useful once an
      audit row exists, and authorization can be inferred from the reason text alone.
    trap: hedging
    why_wrong: It invents request deduplication and authorization semantics, and it
      hides the later unsupported-event failure path.
  sources:
  - repo: backend-challenges
    path: reconpulse-elixir-finops-control-tower/README.md
    note: ReconPulse study scope, replay controls, Oban execution, and audit model.
  - repo: backend-challenges
    path: reconpulse-elixir-finops-control-tower/lib/recon_pulse/control/replays/requester.ex
    note: Replay request Ecto.Multi and local transaction contents.
