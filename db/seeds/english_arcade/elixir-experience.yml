- id: elixir_experience-05-reportforge-staged-artifact-compensation
  version: 1.4.0
  target: elixir_experience
  topic: ReportForge staged artifact cancellation compensation
  difficulty: 3
  interview_stage: deep_dive
  prompt: How would you explain the cancellation race after ReportForge stages an
    artifact but before it finalizes report completion?
  context: The interviewer is probing short lock scope, staged-object compensation,
    cancellation revalidation, orphan risk, and the boundary separate from Oban cancellation
    intent.
  best_answer: 'ReportForge prepares completion under a short row lock, then writes
    artifact bytes through ArtifactStorage after that transaction ends. Finalization
    reacquires the lock and revalidates running state; if cancellation, a state change,
    or an error wins, it calls delete_for_report as compensation. That preserves responsive
    state changes during storage, and the cited test describes cancellation between
    put and finalize ending with no artifact record. It is not atomic database-plus-storage
    behavior: delete is separate, its result is ignored, and a crash can leave a staged
    object.'
  distractors:
  - text: I would deliberately retain the Report row lock throughout ArtifactStorage.put_artifact
      so cancellation cannot interleave with storage. Once bytes exist, the final
      database update must succeed and deletion is unnecessary. Any failed write or
      crash can be retried from identical code without an orphan, because the transaction
      automatically rolls back every external storage object.
    trap: precision
    why_wrong: It turns the storage call into a long database critical section and
      falsely extends rollback across the storage boundary.
  - text: I would treat delete_for_report as transactional rollback—when finalization
      sees cancellation, the object is certainly gone. Duplicate attempts may then
      reuse the staged object without an idempotent identity or cleanup sweep. Telemetry
      only matters after storage, and the test proves every process crash is recovered
      automatically.
    trap: hedging
    why_wrong: It confuses best-effort compensation with atomic rollback and leaves
      failed deletion, crash, and duplicate-attempt recovery unexplained.
