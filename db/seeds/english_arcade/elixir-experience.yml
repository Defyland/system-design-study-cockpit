- id: elixir_experience-03-pulseops-terminal-reconciliation
  version: 1.4.0
  target: elixir_experience
  topic: PulseOps terminal state reconciliation
  difficulty: 3
  interview_stage: deep_dive
  prompt: How would you reconcile a PulseOps Job that says running when its Oban execution
    is already terminal without double-transitioning it?
  context: The interviewer is probing bounded candidate selection, row locking, state
    revalidation, repair idempotency, and the operational limits of a historical routine.
  best_answer: PulseOps selects a bounded, ordered set where a platform Job is running
    but Oban is terminal. For each candidate, a transaction locks the Job with FOR
    UPDATE, rereads Oban, and revalidates state before updating timestamps or errors,
    upserting the attempt, and inserting an event. A changed state or transaction
    error returns :noop, so concurrent reconcilers do not apply a second transition.
    This is a database repair routine, not evidence of scheduler cadence, cluster
    throughput, or exactly-once effects outside that transaction.
  distractors:
  - text: I would enumerate every still-running platform Job, overwrite it from an
      apparently terminal Oban record, and append an attempt plus event whenever reconciliation
      repeats. Row locks and re-reads are unnecessary because terminal states cannot
      change. After repair, I would present the database record as proof that scheduling,
      worker activity, and downstream effects are exactly once.
    trap: precision
    why_wrong: It permits duplicate transitions, omits lock-and-reread revalidation,
      and turns a local repair into unsupported operational guarantees.
  - text: I would let separate reconcilers update the same candidate and retain duplicate
      events as extra audit detail. If the Oban row is absent, mark the platform Job
      succeeded because the worker likely finished. A bounded batch proves reliable
      cadence, and swallowed transaction errors show repair can continue safely after
      any database failure.
    trap: hedging
    why_wrong: It treats ambiguity as success, mistakes a batch limit for scheduling
      evidence, and ignores the routine's deliberate noop outcome.
