        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire ReportForge cancellation of in-flight work
          explanation with a new design without identifying what the evidence actually
          changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  extension:
    prompt: Define negative tests for an absent execution_job_id, late Oban error,
      completion after cancel, retry-versus-cancel race, started I/O, and artifact
      write that must not hold the row lock.
