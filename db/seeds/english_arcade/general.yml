---
contract_version: 1.6.0
target:
  key: general
  label: General Conversation
  blurb: Professional conversation, behavioural interviewing, and incident communication.
  focus_areas:
  - rapport and clarification
  - disagreement and scope
  - behavioural narratives
  - incident and follow-up
  simulation:
    minutes: 45
    structure:
    - label: rapport
      minutes: 5
    - label: STAR
      minutes: 12
    - label: stakeholder follow-up
      minutes: 10
    - label: incident update
      minutes: 10
    - label: close
      minutes: 8
  critical_thinking:
    learner_prompts:
      evidence_ledger: For general professional conversation, record whether each
        claim about the relationship, explicit request, unknown, and next conversational
        move is a verified fact, an inference, an assumption, or an unknown before
        you defend it.
      problem_frame: Frame every general professional conversation answer with the
        actor, requirement, constraint, success condition, and unanswered question
        that could change the decision.
      comparison: When general professional conversation offers a real choice, compare
        two options by benefit, cost or risk, valid-when condition, and an explicit
        decision rule.
      failure_probe: Ask which counterexample, edge case, or failure mode could break
        the general professional conversation recommendation, then state the smallest
        test or containment step.
      certainty_review: 'Calibrate certainty in general professional conversation:
        name the evidence, separate correlation from causality, and say what new observation
        would make you revise the answer.'
    rubric:
      facts_correct: Names the verified relationship, explicit request, unknown,
        and next conversational move facts without smuggling in a result or capability
        that the prompt does not establish.
      assumptions_explicit: Labels the general professional conversation premise that
        is still assumed and asks the smallest clarifying question that matters.
      alternatives_considered: Considers a credible alternative for general professional
        conversation, or explains the hard constraint that makes comparison a false
        equivalence.
      tradeoff_quality: Connects the general professional conversation choice to a
        benefit, a cost or risk, and the condition under which another choice wins.
      follow_up_adaptation: Responds to an adversarial general professional conversation
        follow-up by changing the claim or evidence boundary rather than repeating
        a memorised answer.
      certainty_calibration: Uses high, medium, or low certainty deliberately and
        names the evidence that would update the general professional conversation
        recommendation.
cards:
- id: general-card-unknowns
  front: How should you handle an unknown?
  back: State what is unknown, name the assumption or source to check, and continue
    only with supported reasoning.
  box: 1
  source:
    repo: system-design-estudos
    path: reviews/day-14-interview-compression.md
    note: Concise calibrated response.
  critical_thinking:
    cue: How should you handle an unknown? Before answering, separate the stated fact
      from your assumption and name one condition that could change it.
    check: For this general professional conversation card, can you compare two options,
      name one failure mode, and state what evidence would update the recommendation?
- id: general-card-incident
  front: What belongs in an incident update?
  back: Known impact, unknown cause, current mitigation, and the exact time of the
    next update.
  box: 1
  source:
    repo: system-design-estudos
    path: areas/11-operational-playbooks/playbooks/incident-severity-and-triage.md
    note: Incident communication structure.
  critical_thinking:
    cue: What belongs in an incident update? Before answering, separate the stated
      fact from your assumption and name one condition that could change it.
    check: For this general professional conversation card, can you compare two options,
      name one failure mode, and state what evidence would update the recommendation?
- id: general-card-close
  front: How do you close an interview?
  back: Ask about a consequential success condition and follow up with a note tied
    to the discussion.
  box: 2
  source:
    repo: system-design-estudos
    path: reviews/day-14-interview-compression.md
    note: Interview compression.
  critical_thinking:
    cue: How do you close an interview? Before answering, separate the stated fact
      from your assumption and name one condition that could change it.
    check: For this general professional conversation card, can you compare two options,
      name one failure mode, and state what evidence would update the recommendation?
items:
- id: general-01-introduction
  version: 1.6.0
  target: general
  topic: introduction
  difficulty: 1
  interview_stage: behavioural_probe
  prompt: To start, could you introduce yourself and tell me why this role fits now?
  context: The panel has read your résumé. They want a concise narrative, not a chronological
    list of employers.
  best_answer: My professional background is Rails and backend work. I’m also comfortable
    discussing the Go and Elixir projects in my portfolio, especially the design choices visible
    in the code. I say plainly when the project context does not establish my exact role. This
    role fits if it values careful delivery and explicit trade-offs; I would like to learn which
    problem the person in this role should own first.
  response_versions:
    short: >-
      My background is Rails and backend work. I can discuss Go and Elixir projects in my
      portfolio while separating visible code choices from any claim about professional
      ownership. I would like to learn which problem this role should own first.
    medium: >-
      My professional background is Rails and backend work. I’m also comfortable discussing
      the Go and Elixir projects in my portfolio, especially the design choices visible in
      the code. I say plainly when the project context does not establish my exact role. This
      role fits if it values careful delivery and explicit trade-offs; I would like to learn
      which problem the person in this role should own first.
    deep: >-
      My professional background is Rails and backend work, and I would begin there when the
      panel wants role direction or verified experience. I can also discuss Go and Elixir
      projects in my portfolio, focusing on design choices visible in the code while keeping
      their evidence class separate from professional ownership or impact. I would ask which
      problem the person in this role should own first, then connect the answer to a relevant
      trade-off rather than list technologies. If the panel wants a technical example, I
      would say which part the repository supports and where my exact role or operating result
      is not established. That distinction lets me stay useful without making the code carry
      a claim it cannot prove.
  distractors:
  - text: I started as an intern, then moved through several companies and learned
      many tools. My résumé has the details, but each role added another technology
      to my background. I would describe every employer, framework, database, and project
      in order, then wait for the interviewer to identify a useful thread; that chronology
      would consume the opening without explaining why this role fits or what remains to confirm.
    trap: pragmatics
    why_wrong: It misses the purpose of this introduction turn and gives no usable
      evidence of judgement.
  - text: I am adaptable and learn quickly, so I can do whatever the team needs. This
      role is a good fit because it seems like a strong company. I would confirm my fit by
      saying I have used many tools, can join any project, and will accept the team’s priorities
      without asking which problem I would own or how success is measured.
    trap: hedging
    why_wrong: It avoids the relationship, uncertainty, or next action the interviewer
      is testing.
  feedback:
    register: Open with your current professional identity, not a résumé preamble.
    hedging: Use ‘I would be keen’ for interest; avoid certainty about an unfamiliar
      team.
    precision: Choose one verified engineering theme that supports the role fit.
    grammar: Use present perfect for experience and present tense for the role fit.
    pragmatics: End with a natural question about the problem and success condition this role owns.
  rephrase:
    prompt: Rephrase this introduction answer for a senior stakeholder who only needs
      the outcome and remaining risk.
    goal: Keep the professional direction, role fit, and next unknown.
  follow_up:
    prompt: The hiring manager says the team is platform-focused and asks whether your
      Rails background or your Go and Elixir portfolio work is more relevant. Which framing
      would you choose, and what would you clarify before claiming a fit?
    goal: Compare professional and portfolio framing against the platform role without turning
      either one into an unsupported customer or production outcome.
    challenge_kind: alternative
    best_answer: >-
      I would lead with my Rails and backend professional background, then offer the Go or
      Elixir portfolio work only if the panel wants an inspectable implementation example. The
      professional framing is safer for role fit; the portfolio framing is more useful for a
      concrete technical deep dive, but neither proves customer or production impact here. I
      would ask whether the role values verified ownership, service design, or both before making
      the fit claim stronger.
    distractors:
    - text: I would make the Go and Elixir portfolio implementations the centre of the
        platform conversation and describe their design choices as evidence that I have
        already owned production services. Since the role is technical, the architecture
        detail would carry the fit argument, and I would treat inspectable code and
        employer-operated systems as equivalent forms of evidence when describing my
        readiness.
      why_wrong: Technical detail does not change the evidence class or establish professional
        ownership and operational impact.
    - text: I would present the Rails background and both portfolios as one balanced account,
        giving each example equal weight and saying that any technical interviewer can decide
        which part matters. The shared backend theme would make a separate ownership check
        unnecessary, so I would answer that the role fits before asking what the platform team
        expects the person to own.
      why_wrong: The audience and success condition determine the useful framing; treating them
        as interchangeable hides the decision rule.
    answer_anchors:
    - Lead with Rails/backend professional background for a role-fit answer.
    - Offer Go or Elixir as portfolio/study evidence only when a technical example is requested.
    - Ask whether the panel values verified ownership, service design, or both before strengthening fit.
  compression:
    prompt: Preserve your Rails/backend identity, one verified engineering theme, and
      the reason this role fits now in two sentences.
    goal: Compress the introduction into its direction, evidence boundary, and next question.
  language_focus:
  - register
  - pragmatics
  - precision
  feynman:
    concept: A concise career narrative that connects professional direction to the role.
    explain_to: a hiring manager meeting you for the first time
    constraint: Keep one verified engineering theme and one reason to explore the role; do not
      invent an impact claim.
    self_check: Could the listener name your professional boundary and the question you still need
      answered after hearing the opening once?
    reasoning_check: Can you explain why a product-oriented or platform-oriented framing fits this
      audience, identify a counterexample, and update the wording when the success condition changes?
  black_box:
    symptom: The introduction becomes a recitation of employers.
    expected: A clear present identity, a verified engineering theme, and a credible reason
      for exploring this role.
    actual: The listener hears dates and tools but no boundary between professional background
      and portfolio or study material.
    root_cause: The answer starts at the first job instead of the current professional
      direction.
    repair: Lead with Rails/backend background, label any portfolio example, and end with the
      role question that still needs an answer.
    reasoning_error: If your introduction answer failed, classify the mistake as a
      fact, assumption, comparison, failure, or certainty error before proposing the
      smallest repair.
  recall:
    active_recall_cue: For introduction, what is the direct answer, relationship move,
      and concrete next action?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind introduction without presenting
      an assumption as a fact?
    black_box_probe: When the introduction answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: general-01-introduction-delayed-1
      prompt: A week later, an incident brief shows that this platform team values recovery
        time and auditability more than feature delivery. How would you update your role-fit
        answer, and what would remain unproven about your background?
      changed_constraint: The role-fit answer must foreground recovery time and auditability
        within a brief opening rather than a generic customer-facing outcome.
      new_evidence: An incident brief says the team prioritizes recovery time and auditability
        over feature delivery.
      best_answer: I would keep the Rails/backend professional identity, describe recovery and
        auditability as the team’s stated concerns, and ask which measures define them. I would
        not claim that my background already produced those results; I would offer a portfolio
        or study example only as inspectable design evidence and label its limits. I would update
        the framing again if the team identifies a different primary risk.
      distractors:
      - text: The incident brief gives me the priorities I need, so I would say that my previous
          Rails work already reduced recovery time and improved auditability. I would use those
          outcomes as the main proof that I fit the platform team, then describe portfolio
          systems as additional operational evidence without separating which project produced
          each result.
        why_wrong: The new brief changes relevance; it does not verify an unrecorded result from
          the candidate’s background.
      - text: I would keep the original fit statement unchanged and discuss the role in the same
          broad terms as before. Recovery time and auditability are details for the platform team
          to explain, while my introduction should stay focused on familiar technologies;
          changing the answer after one incident brief would only make the story sound
          inconsistent.
        why_wrong: Consistency is not a reason to disregard new evidence about the role’s actual
          success condition.
      answer_anchors:
      - Keep the Rails/backend identity and shift the role framing to recovery and auditability.
      - Treat the incident brief as evidence about the role, not proof of a personal result.
      - Ask for the team’s measures and update again if its primary risk differs.
      reasoning_moves:
        preserve: Keep the Rails/backend identity that remains relevant across the two contexts.
        revise: Replace customer-facing wording with recovery and auditability when the brief changes the role boundary.
        verify: Ask which measures define recovery and auditability before claiming that the background transfers.
        certainty_update: Keep confidence qualified because the brief does not verify a personal result or metric.
  sources:
  - repo: system-design-estudos
    path: reviews/day-14-interview-compression.md
    note: Relevant local interview, incident, or operational communication source.
  - repo: original
    path: english-arcade/general/introduction
    note: Original scenario and language feedback authored for this pack.
  extension:
    prompt: The platform lead says a portfolio design is interesting but asks what it proves
      about your readiness to own a service. How would you answer, and what evidence would you
      ask for before changing your role-fit claim?
    goal: Separate inspectable design evidence from professional ownership and state the next
      observation that could update the fit assessment.
  critical_thinking:
    problem_frame: Frame the opening for a hiring manager who must distinguish verified Rails/backend
      background from Go/Elixir portfolio or study evidence before discussing role fit.
    claim_map:
      fact: The safe background is Rails/backend professional work plus separately labelled Go
        and Elixir portfolio or study material.
      inference: A role-fit sentence can be credible without a quantified impact claim when it
        names the evidence class and invites the relevant next question.
      assumption: The panel may care more about verified ownership or more about service-design
        reasoning; ask which criterion drives the decision.
      unknown: The service boundary, success measure, and evidence threshold required to strengthen
        the fit claim remain unknown.
    comparison:
      applicable: true
      alternatives:
      - option: Frame the answer around Rails/backend professional background.
        benefit: It gives the recruiter a concise, safer role-fit signal tied to verified career
          context.
        cost_or_risk: It leaves less time for implementation detail if the panel actually wants
          a technical design conversation.
        valid_when: The audience is evaluating professional direction, ownership, or role fit first.
      - option: Frame the answer around a labelled Go or Elixir portfolio or study example.
        benefit: It gives an engineer a concrete design boundary to inspect and question.
        cost_or_risk: It can overstate readiness if portfolio code is presented as professional
          ownership or customer impact.
        valid_when: The interviewer requests inspectable implementation reasoning and accepts that
          evidence class.
      decision_rule: Use Rails/backend framing for the initial role-fit answer; add a labelled
        portfolio example when the audience asks for code-level reasoning, without changing its evidence class.
    failure_probe:
      kind: counterexample
      prompt: If the panel says the role requires production ownership you cannot verify, what
        part of the fit claim would you narrow and what question would you ask next?
    evidence_check:
      basis: Compare the answer with the local career material and the platform role description;
        label professional background, portfolio implementation, and impact claims separately.
      source_kind: authored_scenario
      limitation: This exercise can test framing and evidence calibration, but it cannot prove
        production ownership, customer impact, or a universal role-fit rule.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: Certainty is medium because the evidence classes are clear but the platform
        success measure and ownership threshold have not been specified.
      update_trigger: Update the fit claim when the hiring manager names the ownership boundary,
        success measure, or evidence that distinguishes role readiness from design familiarity.
    rubric:
      facts_correct: Separates Rails/backend professional background from Go/Elixir portfolio or
        study evidence and avoids a result the prompt does not establish.
      assumptions_explicit: Names whether the panel is testing ownership, service design, or both.
      alternatives_considered: Compares professional framing with a labelled portfolio example
        and states when each is useful.
      tradeoff_quality: Connects brevity and role relevance with the risk of overstating portfolio
        readiness or impact.
      follow_up_adaptation: Changes the framing when the platform audience asks for a different
        evidence class without pretending the underlying history changed.
      certainty_calibration: Uses medium certainty and names the role criterion that would update
        the fit claim.
    defense_checks:
    - id: general-01-introduction-defense-impact-definition
      axis: adaptation
      prompt: If a recruiter asks whether a portfolio project proves that you can own a service,
        how would you answer without turning design familiarity into a professional claim?
      best_answer: I would describe the implementation boundary I can show, label it as portfolio
        or study evidence, and ask which ownership behaviours or operational evidence the role requires.
      distractors:
      - text: I would say the project proves service ownership because the design uses the same
          technologies the team mentions.
        why_wrong: Shared tools do not establish professional ownership or operating evidence.
      - text: I would refuse to discuss the project because portfolio or study work can never
          provide useful evidence in an interview.
        why_wrong: Inspectable design is useful when its scope and limits are stated honestly.
- id: general-02-small-talk
  version: 1.6.0
  target: general
  topic: small talk
  difficulty: 2
  interview_stage: behavioural_probe
  prompt: We have a few minutes before we begin—how has your week been?
  context: >-
    Scenario-based practice: the only personal detail supplied for this opening is
    that the candidate spent part of the week practising a backend case. Treat that detail
    as scenario-given, not as verified user history, and move naturally from rapport to the interview.
  best_answer: >-
    “It’s been a busy week in a good way—I’ve been working through a backend case and enjoying
    the process. How has your week been, and what prompted the role to open?” I would follow
    your lead on whether to stay with rapport or discuss the opening, and keep the transition
    light before moving into formal questions.
  response_versions:
    short: >-
      I would answer warmly: “It’s been a busy week in a good way—I’ve been working through a
      backend case and enjoying the process. How has your week been?” Then I would follow the
      cue before asking what prompted the opening.
    medium: >-
      “It’s been a busy week in a good way—I’ve been working through a backend case and enjoying
      the process. How has your week been, and what prompted the role to open?” I would follow
      your lead on whether to stay with rapport or discuss the opening, and keep the transition
      light before moving into formal questions.
    deep: >-
      I would keep the answer warm, brief, and reciprocal: “It’s been a busy week in a good
      way—I’ve been working through a backend case and enjoying the process. How has your week
      been?” That detail is enough to make the reply personal without turning small talk into a
      presentation. I would listen to the answer before introducing the role. If the interviewer
      mentions the opening or asks about the case, I could offer one bounded sentence about it;
      if they remain social, I would stay with rapport. I would ask what prompted the role to
      open only after that cue, because a thoughtful question can feel abrupt when the exchange
      has not shifted. The next move should follow their response, keeping the tone easy while
      leaving room to discuss the role when they invite it.
  distractors:
  - text: Fine, thanks. I am ready whenever you are. I have cleared my calendar for
      this conversation and reviewed the company website this morning. I would keep the
      exchange brief and avoid asking about the role until the formal questions begin.
    trap: register
    why_wrong: It misses the purpose of this small talk turn and gives no usable evidence
      of judgement.
  - text: It has been a very stressful week, so I hope the questions are not too difficult. I
      would keep that concern at the centre of the opening, explain that the pressure made it
      hard to prepare, and wait for reassurance before asking about the work or the role.
    trap: precision
    why_wrong: It avoids the relationship, uncertainty, or next action the interviewer
      is testing.
  feedback:
    register: Keep the tone warm and light; this is rapport, not a status report.
    hedging: Avoid forced enthusiasm; ‘busy in a good way’ is enough.
    precision: Offer one small work detail instead of a generic ‘fine.’
    grammar: Use a semicolon or full stop to avoid a run-on answer.
    pragmatics: Return a low-pressure question that lets the interviewer choose how
      much to share.
  rephrase:
    prompt: Rephrase your week update so it stays warm and invites the interviewer to share context.
    goal: Keep the genuine detail, reciprocal question, and conversational handoff.
  follow_up:
    prompt: The interviewer mentions that the team is growing quickly. What would you
      ask next to show interest without turning small talk into a formal interview?
    goal: Keep rapport natural while inviting context about the other person and the
      team.
    challenge_kind: failure
    best_answer: I would acknowledge the growth and ask what has changed most for the
      team recently, then let the interviewer choose whether to answer personally or
      professionally. I would keep my own update brief and avoid turning the exchange
      into an unsupported claim about my impact.
    distractors:
    - text: I would answer the growth comment by asking which service is under the most pressure
        and whether the team needs help with throughput. Rapid growth usually signals a scaling
        problem, so I would steer the exchange toward architecture and invite the interviewer to
        confirm that diagnosis instead of keeping the conversation social.
      why_wrong: It jumps to a technical assumption and skips the social purpose of
        the opening exchange.
    - text: I would use the opening to give a lively account of my week, including the cases I
        practised, the tools I explored, and the plans I made for improving my work. A detailed
        personal update would demonstrate energy and initiative, so I would keep talking until the
        interviewer had enough context rather than hand the conversation back.
      why_wrong: Small talk is reciprocal; a long self-summary prevents the other person
        from shaping the conversation.
    answer_anchors:
    - Acknowledge the growth without assuming its cause.
    - Ask an open question about what changed for the team.
    - Keep the personal update brief and reciprocal.
  compression:
    prompt: Preserve one true week detail, acknowledge the interviewer, and ask one open question about the role.
    goal: Give the genuine update first, then use the question to learn whether the opening is about a team need or a broader conversation.
  language_focus:
  - register
  - pragmatics
  - precision
  feynman:
    concept: Explain why one honest week detail and one reciprocal question fit a pre-interview opening.
    explain_to: A colleague who wants to sound interested without turning rapport into a technical pitch.
    constraint: Separate the scenario-given fact that I practised a backend case from the inference that a question about the role will create useful context; name the assumption that the interviewer wants role detail and test it with an open question.
    self_check: Can you give one true detail, state what you are inferring, and name a cue that would make you keep the exchange lighter?
    reasoning_check: If the interviewer describes strain rather than opportunity, can you acknowledge it and update your question without diagnosing team performance?
  black_box:
    symptom: The answer turns a warm opening into either a personal pitch or an uninvited diagnosis of the team.
    expected: The response should give a bounded true detail, make the relationship move, and let the interviewer define the next context.
    actual: I treated a friendly question as permission to infer why the role exists or what the team’s growth means.
    root_cause: I confused an invitation to connect with evidence about the interviewer’s priorities and skipped the check that would distinguish social rapport from role discussion.
    repair: Give one true week detail, ask whether the interviewer would like to discuss the role or the team, and follow the cue before adding technical detail.
    reasoning_error: The error is an unsupported interpretation of the social cue, not a lack of vocabulary; the missing move is to ask and update.
  recall:
    active_recall_cue: What would you say about your week, and what question would keep the opening reciprocal?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain how you would answer the week question, including the true detail, the reciprocal question, and the cue that would change your tone?
    black_box_probe: If the interviewer responds with strain rather than enthusiasm, which assumption in your small-talk answer would you inspect first?
    delayed_variant:
      id: general-02-small-talk-delayed-1
      prompt: The interviewer says the growth has actually made priorities less clear.
        How would you respond warmly and what would you avoid assuming?
      changed_constraint: The team’s growth has created ambiguity rather than a simple
        success story, so the response should invite context without diagnosing it.
      new_evidence: The interviewer describes competing priorities and uncertainty about
        how the team will organise its work.
      best_answer: I would acknowledge that growth can make prioritisation harder and
        ask which part has been most useful or difficult for them. I would avoid turning
        the comment into a claim about a technical scaling problem, keep my own background
        general, and follow the interviewer’s lead into the formal conversation.
      distractors:
      - text: I would reassure them that unclear priorities are a normal side effect of successful
          growth and say the team will find its direction as hiring continues. I would redirect
          the conversation toward the positive expansion story instead of asking which decisions
          became harder, because raising uncertainty could make the team sound less healthy.
        why_wrong: It dismisses the new evidence and prevents a genuine response to
          the interviewer’s experience.
      - text: I would recommend a new planning structure as soon as they mention unclear priorities,
          with a weekly steering meeting, one roadmap owner, and a written escalation path. I would
          offer that solution before asking how the ambiguity arose, since visible process changes
          are more useful than dwelling on the frustration.
        why_wrong: It offers an unsolicited solution before understanding the context
          or the social purpose of the exchange.
      answer_anchors:
      - Acknowledge the ambiguity without diagnosing it.
      - Ask what part of the change has been hardest or useful.
      - Stay reciprocal and let the formal interview emerge naturally.
      reasoning_moves:
        preserve: Preserve a warm, concise, reciprocal opening rather than turning rapport
          into a technical pitch.
        revise: Revise the assumption that team growth necessarily means success or
          a scaling problem.
        verify: Ask what changed for the interviewer before choosing a technical or
          organisational interpretation.
        certainty_update: Keep confidence in the conversational approach while leaving
          the team’s growth effects open.
  sources:
  - repo: system-design-estudos
    path: reviews/day-14-interview-compression.md
    note: Scenario reference only; the weekly detail is scenario-given, not verified user history.
  - repo: original
    path: english-arcade/general/small-talk
    note: Original scenario and language feedback authored for this pack.
  extension:
    prompt: A recruiter asks you to move from small talk into ‘tell me about yourself’
      in one turn. How would you bridge the two naturally?
    goal: Bridge rapport and interview substance without inventing biography or impact.
  critical_thinking:
    problem_frame: Keep the opening reciprocal with one truthful week detail and one question, without inferring team health, role impact, or the interviewer’s priorities.
    claim_map:
      fact: The prompt asks how my week has been and the context defines the exchange as rapport; the scenario supplies backend-case practice and invites context about the position.
      inference: A brief true update followed by an open question can move naturally toward the interview while giving the other person control of the depth.
      assumption: The interviewer is willing to discuss the role opening after a social answer, and the week detail will not sound like an unsolicited pitch.
      unknown: I do not know whether the interviewer wants personal rapport, team context, or role context first, or what rapid growth means for this team.
    comparison:
      applicable: true
      alternatives:
      - option: Give a brief personal update and invite context about the opening
        benefit: It creates a natural bridge into the interview and may reveal the team’s current need.
        cost_or_risk: It can feel transactional if the interviewer is still keeping the exchange social.
        valid_when: The interviewer signals readiness to discuss the role or asks a follow-up about work.
      - option: Give one week detail and ask what has changed for the interviewer or team
        benefit: It keeps rapport reciprocal and lets the interviewer choose personal or professional context.
        cost_or_risk: It may postpone role-specific information and leave the bridge to the formal interview implicit.
        valid_when: The opening remains informal or the interviewer volunteers a team change without defining its meaning.
      decision_rule: Match the question to the cue; use role context when invited, use a broader team question when the exchange is still social, and never turn growth into an unsupported impact claim.
    failure_probe:
      kind: edge_case
      prompt: If the interviewer says growth has made priorities less clear, what would show that your positive reading needs to change?
    evidence_check:
      basis: Check the literal week detail and the interviewer’s cue separately; neither establishes team health, role impact, or the cause of growth.
      source_kind: authored_scenario
      limitation: The exercise does not provide the interviewer’s priorities, the role’s reason for opening, or a result from the conversation.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: I am confident about a brief truthful update and reciprocal question, but not about which context the interviewer wants or what growth means.
      update_trigger: I would change from a positive bridge to an acknowledging question when the interviewer describes ambiguity, strain, or competing priorities.
    rubric:
      facts_correct: Keeps the prompt’s rapport setting and does not convert growth or a week detail into a result claim.
      assumptions_explicit: States why the role question may or may not fit the interviewer’s cue.
      alternatives_considered: Compares a role-opening question with a broader team question and names when each fits.
      tradeoff_quality: Balances warmth, context, and the risk of turning small talk into diagnosis.
      follow_up_adaptation: Responds to growth-related ambiguity by asking rather than reassuring or solving.
      certainty_calibration: Keeps certainty about the conversational move separate from uncertainty about the team.
    defense_checks:
    - id: general-02-small-talk-defense-growth-meaning
      axis: assumptions
      prompt: What would you clarify before treating a team’s rapid growth as evidence
        that things are going well?
      best_answer: I would ask what changed, what became harder, and how priorities
        are set; growth can indicate opportunity, strain, or both, so I would not infer
        its meaning from the word alone.
      distractors:
      - text: Rapid growth is positive by definition, so I would congratulate the team and treat
          the expansion as evidence that its priorities are working. I would not ask what changed
          or became difficult; a warm opening should reinforce the success implied by growth rather
          than introduce doubts about how the team operates.
        why_wrong: It imposes a conclusion without hearing the interviewer’s experience
          of the change.
      - text: Rapid growth proves that the team has a scaling failure somewhere, so I would bring
          up capacity, queues, and architecture before the interview moves on. Even if the
          interviewer describes a planning or people issue, I would keep the technical diagnosis
          ready because growth should be treated as an engineering problem first.
        why_wrong: That is an unsupported diagnosis and an awkward way to begin rapport.
- id: general-03-clarification
  version: 1.6.0
  target: general
  topic: clarification
  difficulty: 3
  interview_stage: behavioural_probe
  prompt: When I say ownership, what would that mean to you on this team?
  context: The term could mean technical stewardship, delivery accountability, or people
    management. Show that you clarify before guessing.
  best_answer: >-
    I would ask whether ownership means technical direction, delivery accountability, people
    support, or some combination. Then I would answer the defined part with a visible decision
    and risk, rather than guessing what the word means. If the interviewer meant mentoring
    without line management, I would keep the example at that boundary and invite correction
    before adding detail.
  response_versions:
    short: >-
      I would clarify whether ownership means technical direction, delivery accountability,
      people support, or a combination. Then I would answer only that boundary, naming one
      decision and its risk instead of guessing.
    medium: >-
      I would ask whether ownership means technical direction, delivery accountability, people
      support, or some combination. Then I would answer the defined part with a visible decision
      and risk, rather than guessing what the word means. If the interviewer meant mentoring
      without line management, I would keep the example at that boundary and invite correction
      before adding detail.
    deep: >-
      Before answering, I would ask what ownership means here: technical direction, delivery
      accountability, people support, or some combination. That clarification prevents me from
      answering a people-management question with a delivery example. Once the boundary is
      defined, I would give one visible decision, the risk I considered, and the evidence for
      my contribution. If the intended boundary is mentoring without line management, I would
      describe how I helped a colleague make a decision independently, while keeping any wider
      result shared or conditional. If the interviewer changes the definition, I would revise
      the example rather than defend a polished but mis-scoped answer. The goal is a useful
      answer whose responsibility matches the question.
  distractors:
  - text: Ownership means doing everything yourself and never escalating problems. That
      is how I normally approach delivery, because bringing in other people can make
      accountability unclear and slow a decision down. I would not ask for a definition,
      because the term should be obvious in a senior conversation.
    trap: pragmatics
    why_wrong: It misses the purpose of this clarification turn and gives no usable
      evidence of judgement.
  - text: To me, ownership means being proactive and taking responsibility. I would just make
      sure the work gets done, keep decisions moving without pausing for a definition, and step
      in wherever a gap appears. If someone asked for an example, I would describe the final
      result rather than separate technical stewardship, delivery accountability, mentoring, or
      line-management authority.
    trap: hedging
    why_wrong: It avoids the relationship, uncertainty, or next action the interviewer
      is testing.
  feedback:
    register: Ask the clarification directly and briefly; it demonstrates judgement
      rather than uncertainty.
    hedging: Use ‘Could I check whether…’ to invite the intended meaning.
    precision: Name technical direction, delivery outcome, and people management separately.
    grammar: 'Keep alternatives parallel: ‘of X, Y, or both.’'
    pragmatics: Signal that you can answer either interpretation, then let them choose.
  rephrase:
    prompt: Rephrase your ownership clarification so the interviewer can choose the intended boundary.
    goal: Keep the clarification, defined ownership boundary, and visible risk.
  follow_up:
    prompt: The interviewer says ownership includes mentoring but not line management.
      How would you make your answer concrete without assuming a people-manager role?
    goal: Use one bounded clarification to adapt the meaning of ownership and answer
      the intended question.
    challenge_kind: new_evidence
    best_answer: I would say that I understand ownership here as helping others make
      sound decisions, unblocking delivery, and making risks visible, rather than evaluating
      their performance. I would ask which mentoring behaviour matters most in the role,
      then give an example at that boundary.
    distractors:
    - text: I would answer with an example of hiring a colleague, setting performance goals,
        and reviewing whether they met them, because mentoring only matters when someone is
        formally accountable for another person’s progress. I would present those management
        duties as the clearest proof that I can own mentoring on this team.
      why_wrong: It collapses two responsibilities the interviewer explicitly distinguished.
    - text: I would keep the answer on system design and delivery because ownership should
        concern the work itself, not conversations with colleagues. Mentoring can happen
        informally without changing who makes technical decisions, so I would leave it out and
        use a design trade-off as my concrete example.
      why_wrong: It ignores the new scope and misses the behaviour the interviewer wants
        to explore.
    answer_anchors:
    - Accept the mentoring boundary without adding line management.
    - Name unblocking, decision quality, and visible risks.
    - Ask which mentoring behaviour the role values most.
  compression:
    prompt: Name the ownership ambiguity, ask one bounded question, and commit to the defined decision and risk.
    goal: Clarify the intended ownership boundary before choosing an example, then keep the answer useful for the meaning the interviewer confirms.
  language_focus:
  - register
  - pragmatics
  - precision
  feynman:
    concept: Explain why clarifying ownership changes the evidence required in the answer.
    explain_to: A teammate who wants to discuss technical stewardship and mentoring without claiming line-management responsibility.
    constraint: Separate the verified ambiguity among technical direction, delivery accountability, mentoring, and people management from the inference that the interviewer wants one of those boundaries; ask which behaviour matters before choosing an example.
    self_check: Can you name the four possible meanings, state which one is still unknown, and give a question that resolves it?
    reasoning_check: If the interviewer defines mentoring through independent decisions rather than time paired, can you revise the example and the evidence you would use?
  black_box:
    symptom: The answer uses ownership as if it had one universal meaning and then supplies evidence for the wrong responsibility.
    expected: The response should clarify the boundary, answer the confirmed part, and avoid implying people-management authority.
    actual: I treated a broad word as a role definition and reached for a familiar example before checking what the team meant.
    root_cause: I collapsed technical direction, delivery accountability, mentoring, and line management into one label, so the evidence and ownership claim became misaligned.
    repair: Ask which responsibility the interviewer means, name the relevant risk at that boundary, and invite correction before adding a broader example.
    reasoning_error: The reasoning error is a definition mismatch caused by an unchecked assumption; the remedy is a targeted clarification, not a polished synonym.
  recall:
    active_recall_cue: Which ownership meaning would you clarify, and what evidence would you give after it is defined?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain how your definition question determines the evidence for ownership?
    black_box_probe: If the interviewer defines ownership as mentoring, what evidence would reveal that your example crossed into line management?
    delayed_variant:
      id: general-03-clarification-delayed-1
      prompt: The interviewer adds that mentoring is measured by independent decision-making,
        not hours paired. How would that update your example?
      changed_constraint: The mentoring outcome is independent decision-making, so activity
        volume is not sufficient evidence.
      new_evidence: The team evaluates mentoring through whether colleagues can make
        decisions independently after support.
      best_answer: I would revise the example to focus on the decision a colleague could
        make independently afterward, not the number of pairing sessions. I would ask
        how the team observes that change and explain the support I gave without claiming
        that my mentoring alone caused it.
      distractors:
      - text: I would list the mentoring conversations, pairings, and follow-up messages as
          evidence that independent decision-making improved. The larger the record of contact,
          the stronger the result would appear, so I would use the total count as the measure and
          avoid waiting for a colleague’s later decision to confirm the effect.
        why_wrong: Conversation volume does not establish independent decision-making.
      - text: I would remove mentoring from the example once the outcome became difficult to
          measure and return to a technical delivery result instead. A precise engineering metric
          is easier to defend, and keeping a mentoring claim without a clean number would weaken
          the answer more than omitting that part of the role.
        why_wrong: A bounded observation and a clear limitation are more useful than
          abandoning the topic.
      answer_anchors:
      - Focus on independent decisions after support.
      - Ask how the team observes that change.
      - Separate the support given from sole causation of the outcome.
      reasoning_moves:
        preserve: Preserve the clarification that mentoring is not line management and
          can include unblocking decisions.
        revise: Revise the evidence from activity volume to the colleague’s independent
          decision-making.
        verify: Ask what observation the team uses to judge independent decisions and
          what remains subjective.
        certainty_update: Raise confidence in the intended behaviour while keeping causal
          impact of one mentoring interaction limited.
  sources:
  - repo: system-design-estudos
    path: areas/01-metodo-e-entrevistas/examples/interview-walkthrough-checkout-incident.md
    note: Relevant local interview, incident, or operational communication source.
  - repo: original
    path: english-arcade/general/clarification
    note: Original scenario and language feedback authored for this pack.
  extension:
    prompt: A stakeholder uses ownership to mean keeping a promise to a customer. How
      would you bridge that meaning to the technical decision you can explain?
    goal: Translate one ambiguous word across audiences without pretending its meanings
      are identical.
  critical_thinking:
    problem_frame: Define what ownership means in this team before choosing evidence, while remaining ready to answer technical stewardship, delivery accountability, mentoring, or people-management boundaries.
    claim_map:
      fact: The prompt explicitly says ownership may mean technical stewardship, delivery accountability, or people management, and the added question specifies mentoring without line management.
      inference: A short clarification can prevent a well-phrased answer from supplying evidence for the wrong responsibility.
      assumption: The interviewer has a specific ownership boundary in mind and will use that definition to judge the example.
      unknown: I do not yet know whether the role values decision quality, delivery follow-through, mentoring behaviour, or formal people responsibility most.
    comparison:
      applicable: true
      alternatives:
      - option: Ask which ownership boundary the interviewer means before giving an example
        benefit: It aligns the example and evidence with the role’s intended responsibility.
        cost_or_risk: It adds one conversational turn and may sound cautious if the interviewer expected a quick definition.
        valid_when: The word ownership changes who decides, who delivers, or what evidence counts.
      - option: State one likely meaning and invite correction while answering a bounded part
        benefit: It keeps momentum when the interviewer has little time and makes the assumption visible.
        cost_or_risk: The example can still be mis-scoped if the initial interpretation is wrong.
        valid_when: The context strongly signals one boundary and the answer explicitly leaves room to revise it.
      decision_rule: Ask first when the definition changes the ownership claim; otherwise state the interpretation, answer only that boundary, and invite correction before expanding.
    failure_probe:
      kind: failure_mode
      prompt: If mentoring is judged by colleagues making independent decisions rather than time paired, which part of your example must change?
    evidence_check:
      basis: Compare the interviewer’s definition with the responsibility claimed in the example; mentoring activity alone is not evidence of independent decision-making.
      source_kind: authored_scenario
      limitation: The exercise does not establish the team’s formal success measure, the candidate’s ownership, or an outcome beyond the clarified meaning.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: I am confident that clarification is safer than guessing, but the correct example and evidence depend on the boundary the interviewer confirms.
      update_trigger: I would replace activity evidence with an observation of independent decisions when the team defines mentoring that way.
    rubric:
      facts_correct: Separates technical direction, delivery accountability, mentoring, and line management instead of merging them.
      assumptions_explicit: Names the ownership definition that still needs confirmation.
      alternatives_considered: Compares clarifying first with answering one visible interpretation and inviting correction.
      tradeoff_quality: Links the choice to conversational speed and the risk of mis-scoped responsibility.
      follow_up_adaptation: Updates the example when mentoring is defined by independent decisions.
      certainty_calibration: Limits confidence in the example until the intended boundary and evidence are known.
    defense_checks:
    - id: general-03-clarification-defense-ownership-definition
      axis: assumptions
      prompt: Which question would you ask before using the word ownership in your answer?
      best_answer: I would ask whether the interviewer means technical direction, delivery
        accountability, mentoring, or people management, because each boundary changes
        the example and evidence I should provide.
      distractors:
      - text: Ownership means accepting responsibility for every result connected to the team,
          so I would use that broad definition without asking what the interviewer means. It lets
          me choose a larger example, claim accountability for downstream effects, and avoid
          narrowing the answer to one decision or mentoring boundary.
        why_wrong: The interviewer’s context may distinguish decisions, delivery, mentoring,
          and management.
      - text: I would avoid the word ownership throughout the interview because its meaning
          changes between teams and any definition could be challenged. I would describe tasks
          and deliverables in neutral terms instead, leaving the interviewer to infer whether I
          can take responsibility for technical direction, delivery, or mentoring.
        why_wrong: A concise clarification can make the word useful instead of abandoning
          the conversation.
- id: general-04-respectful-disagreement
  version: 1.6.0
  target: general
  topic: respectful disagreement
  difficulty: 1
  interview_stage: behavioural_probe
  prompt: A product lead wants to ship the shortcut today, but you think it risks duplicate
    charges. How do you respond?
  context: The relationship matters, but so does the customer invariant. The interviewer
    is testing practical disagreement.
  best_answer: >-
    I would acknowledge delivery pressure, explain that duplicate charges violate a customer
    invariant, and propose a smaller safe release with an idempotency check, an owner, and a
    review signal. I would ask whether the provider retry path and rollback boundary are
    verified before treating the shortcut as safe. That preserves progress without hiding the
    risk.
  response_versions:
    short: >-
      I would acknowledge the pressure, name duplicate charges as the customer invariant, and
      propose a narrow release with idempotency, an owner, and a review signal. I would stop if
      the invariant were threatened.
    medium: >-
      I would acknowledge delivery pressure, explain that duplicate charges violate a customer
      invariant, and propose a smaller safe release with an idempotency check, an owner, and a
      review signal. I would ask whether the provider retry path and rollback boundary are
      verified before treating the shortcut as safe. That preserves progress without hiding the
      risk.
    deep: >-
      I would acknowledge the date pressure before disagreeing: duplicate charges violate the
      customer invariant, so the question is not whether to ship anything but how much exposure
      we can bound. I would compare a narrow release with idempotency, monitoring, an owner, and
      a stop signal against delaying the broader launch until provider retry behaviour is
      verified. The narrow path is acceptable only when its coverage, rollback, and review signal
      are explicit; otherwise I would keep the wider release paused. I would say that a guard can
      limit exposure but cannot prove the provider will behave as expected. If the signal is noisy
      or the invariant is threatened, I would stop or roll back and update the recommendation.
  distractors:
  - text: I would refuse the request because engineers should overrule product whenever
      there is technical risk. Product can choose the date, but the technical team should
      decide whether a shortcut is acceptable. I would leave the decision to the deadline
      rather than slow delivery with another review.
    trap: register
    why_wrong: It misses the purpose of this respectful disagreement turn and gives
      no usable evidence of judgement.
  - text: I would agree in the meeting and raise the concern privately after launch if customers
      complain. That keeps the discussion calm and lets the deadline stand, while later evidence
      gives me a stronger reason to revisit the shortcut. Until a customer reports harm, I would
      avoid challenging the decision in front of the group.
    trap: precision
    why_wrong: It avoids the relationship, uncertainty, or next action the interviewer
      is testing.
  feedback:
    register: Use collaborative language while making the payment boundary firm.
    hedging: Say ‘may be possible’ for the smaller release, not for duplicate-charge
      risk.
    precision: Name idempotency, scope, metric, and review point rather than ‘a safer
      option.’
    grammar: Use ‘then’ to connect acknowledgement, risk, and alternative.
    pragmatics: Offer a path forward before the disagreement can sound like a veto.
  rephrase:
    prompt: Rephrase your disagreement so the product lead hears the customer risk and a path forward.
    goal: Keep respect for delivery pressure, the customer invariant, and the stop condition.
  follow_up:
    prompt: The product lead accepts an idempotency key but refuses a delayed launch.
      What smaller release would you propose, and what signal would stop it?
    goal: Turn disagreement into a bounded option with a visible guard, owner, and review
      condition.
    challenge_kind: assumption
    best_answer: I would propose releasing the protected path to a narrow cohort with
      the idempotency check enabled, a duplicate-charge alert, and a named owner for
      review. I would stop or roll back if the invariant is threatened, even if the
      launch date is fixed, and I would state that condition plainly.
    distractors:
    - text: I would accept the shortcut because the product lead owns the launch date and the
        technical risk should stay with product once that decision is made. I would mention the
        duplicate-charge concern briefly, but I would not add a guard or stop condition that
        could slow the release, since the person setting the date should also decide whether the
        exposure is acceptable.
      why_wrong: Customer safety is a shared engineering boundary, not a responsibility
        that disappears with schedule ownership.
    - text: I would block the launch until the team had tested every conceivable provider,
        payment, and customer failure path and could show that none remained. A partial release
        would still leave some uncertainty, so I would keep the entire change off the schedule
        rather than choose a narrow cohort, an owner, or a reversible check.
      why_wrong: It ignores proportionality and the possibility of a guarded, reversible
        release.
    answer_anchors:
    - Offer a narrow guarded release instead of a binary fight.
    - Name the invariant, alert, owner, and stop condition.
    - Keep the disagreement respectful and explicit.
  compression:
    prompt: State the delivery pressure, name the duplicate-charge invariant, propose a guarded release, and state the stop signal.
    goal: Keep respect for the date while making the customer-risk boundary and reversible check explicit.
  language_focus:
  - register
  - pragmatics
  - precision
  feynman:
    concept: Explain why an idempotency check changes the disagreement from a personal objection into a customer-risk decision.
    explain_to: A product partner who needs progress today but must not accept an unbounded duplicate-charge risk.
    constraint: Separate the verified risk named in the prompt from the inference that a narrow cohort with idempotency and an alert is safer; state the assumption that provider retry behaviour matches the guard and name the signal that could invalidate it.
    self_check: Can you explain the customer invariant, the reversible option, and the exact observation that would make you stop?
    reasoning_check: If the provider changes retry timing after the first cohort, can you lower confidence in the earlier observation and reopen the release decision?
  black_box:
    symptom: The answer either blocks the date without an option or treats a guard as proof that duplicate charges cannot occur.
    expected: The response should preserve the invariant, offer a bounded path, and define the evidence that controls continuation.
    actual: I treated delivery pressure and customer safety as mutually exclusive, then hid the remaining provider uncertainty behind the word idempotency.
    root_cause: I failed to distinguish a mechanism from its operating assumption and did not compare a guarded cohort with delaying the wider release.
    repair: State the duplicate-charge boundary, compare a narrow guarded cohort with a delayed broader launch, and attach a stop signal to the choice.
    reasoning_error: The reasoning error is false certainty about the guard and a false binary about speed; both are corrected by an observable, reversible comparison.
  recall:
    active_recall_cue: How would you acknowledge the date pressure while protecting the duplicate-charge invariant?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain why idempotency and a stop signal let you disagree without blocking the date?
    black_box_probe: If retry timing changes after the guarded cohort, which release assumption has failed?
    delayed_variant:
      id: general-04-respectful-disagreement-delayed-1
      prompt: The first cohort shows no duplicate charges, but the provider changes
        its retry timing. How would you update the release decision?
      changed_constraint: The external provider’s retry timing has changed, so the previous
        cohort observation may no longer cover the relevant failure window.
      new_evidence: The provider announces a retry-behaviour change after the guarded
        release has begun.
      best_answer: I would keep the idempotency guard but treat the earlier cohort as
        insufficient evidence for the new timing. I would reproduce or model the revised
        retry window, keep the release narrow while checking it, and tell product that
        the stop condition remains tied to the customer invariant rather than the calendar
        alone.
      distractors:
      - text: I would treat the clean first cohort as enough evidence to call the launch safe and
          proceed with the wider release. The provider’s new retry timing could be monitored after
          expansion, but it would not justify reopening a decision that already produced no
          duplicate charges for the initial customers.
        why_wrong: The provider change invalidates the assumption that the earlier cohort
          covered the same retry behaviour.
      - text: I would remove the idempotency key now that the provider is handling retries itself
          and rely on its updated behaviour as the new protection. Keeping our own guard could
          create conflicting requests or duplicate checks, so I would expand the release once the
          provider announced the change rather than test the old boundary again.
        why_wrong: A changed provider contract requires verification, not the removal
          of a protection before its replacement is known.
      answer_anchors:
      - Preserve the idempotency guard.
      - Recheck the changed provider retry window.
      - Keep the stop condition tied to the customer invariant.
      reasoning_moves:
        preserve: Preserve the duplicate-charge invariant and the reversible guarded
          release.
        revise: Revise the confidence provided by the first cohort because the provider
          retry contract changed.
        verify: Model or reproduce the new retry timing before expanding the release.
        certainty_update: Lower certainty in the previous observation while keeping
          the safety boundary and guard in place.
  sources:
  - repo: system-design-estudos
    path: decision-contrasts/05-idempotency-key-vs-unique-index.md
    note: Relevant local interview, incident, or operational communication source.
  - repo: original
    path: english-arcade/general/respectful-disagreement
    note: Original scenario and language feedback authored for this pack.
  extension:
    prompt: The stakeholder asks why you did not simply say no. How would you explain
      the difference between respectful resistance and blocking by default?
    goal: Defend a safety-oriented disagreement as a proportionate trade-off rather
      than a personal veto.
  critical_thinking:
    problem_frame: Protect the customer’s no-duplicate-charge invariant while acknowledging delivery pressure and choosing a release boundary that can be observed and stopped.
    claim_map:
      fact: The product lead wants the shortcut today, the prompt identifies duplicate charges as the risk, and a bounded response can name idempotency, a narrow path, an owner, and a review signal.
      inference: A guarded cohort may preserve progress while limiting exposure, but that is not proof that the provider’s retry behaviour will match the guard.
      assumption: The idempotency key is enforced on every relevant retry path and the alert will be seen quickly enough to protect the invariant.
      unknown: The provider’s retry timing, the cohort’s coverage, and any observed duplicate-charge result are not established by the prompt.
    comparison:
      applicable: true
      alternatives:
      - option: Release a narrow cohort with idempotency, duplicate-charge monitoring, and an owner
        benefit: It preserves some delivery progress while giving a bounded way to observe the invariant.
        cost_or_risk: It still exposes a limited cohort if provider retry semantics or monitoring coverage are wrong.
        valid_when: The guarded path is testable, rollback is available, and the stop signal is owned before release.
      - option: Delay the broader launch until retry behaviour and the idempotency boundary are verified
        benefit: It reduces exposure while the most important failure condition remains uncertain.
        cost_or_risk: It spends schedule capacity and may delay a useful change even when the residual risk could have been bounded.
        valid_when: The provider contract or rollback path is unclear, or the invariant cannot be observed quickly.
      decision_rule: Use the narrow guarded release only when its coverage and stop signal are explicit; otherwise keep the wider launch paused until retry behaviour is verified.
    failure_probe:
      kind: counterexample
      prompt: If the provider changes its retry timing after the first cohort, which prior observation is no longer sufficient for release?
    evidence_check:
      basis: Verify the idempotency boundary, retry semantics, cohort coverage, and duplicate-charge signal separately; a quiet cohort does not prove the wider path safe.
      source_kind: authored_scenario
      limitation: The exercise gives no provider contract, measured duplicate-charge outcome, or evidence that the monitor covers every retry path.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: I am confident about protecting the invariant and requiring a stop condition, but not about the guard’s coverage or the provider’s future retry timing.
      update_trigger: I would lower release confidence when retry timing, path coverage, or alert ownership changes.
    rubric:
      facts_correct: Names duplicate charges as the customer risk and idempotency as a proposed guard without claiming it eliminates the risk.
      assumptions_explicit: States the retry and monitoring assumptions behind a guarded cohort.
      alternatives_considered: Compares a narrow observable release with delaying the wider launch.
      tradeoff_quality: Balances progress, exposure, provider uncertainty, and rollback readiness.
      follow_up_adaptation: Reopens the decision when provider retry timing changes.
      certainty_calibration: Keeps a quiet initial cohort separate from evidence about the full release.
    defense_checks:
    - id: general-04-respectful-disagreement-defense-invariant
      axis: tradeoff
      prompt: What customer condition would make the proposed shortcut unacceptable
        even under a fixed launch date?
      best_answer: A credible path to duplicate charges or another irreversible customer
        harm would make the shortcut unacceptable; I would require a guard or a different
        release boundary before proceeding.
      distractors:
      - text: Because the launch date is fixed, I would treat schedule pressure as permission to
          accept the shortcut and focus on getting customers through the flow. The duplicate-charge
          concern can be reviewed after release; speed is the priority the product lead stated,
          so it should override an engineering objection at this stage.
        why_wrong: A schedule does not override an irreversible customer invariant.
      - text: I would treat any unresolved question as a reason to reject the release, even if its
          exposure were limited and a rollback were ready. No cohort should proceed while one
          provider behaviour remains unknown, because the only acceptable customer outcome is
          complete certainty before launch.
        why_wrong: A bounded, observable, reversible release can manage residual uncertainty
          proportionately.
- id: general-05-scope-negotiation
  version: 1.6.0
  target: general
  topic: scope negotiation
  difficulty: 2
  interview_stage: behavioural_probe
  prompt: The stakeholder asks for three integrations before a fixed date. How would
    you negotiate scope?
  context: One integration is required for the first customer; the other two are useful
    but unvalidated.
  best_answer: >-
    I would restate the customer outcome, separate the required integration from the two
    useful but unvalidated ones, and show the cost and risk of each. I would propose a staged
    commitment with an explicit decision date and a clear condition for restoring deferred
    work rather than accepting all three silently.
  response_versions:
    short: >-
      I would protect the first customer outcome, separate the required integration from the
      two unvalidated ones, and propose a staged commitment with a decision date instead of
      silently accepting all three.
    medium: >-
      I would restate the customer outcome, separate the required integration from the two
      useful but unvalidated ones, and show the cost and risk of each. I would propose a staged
      commitment with an explicit decision date and a clear condition for restoring deferred
      work rather than accepting all three silently.
    deep: >-
      I would start by confirming the first-customer outcome and whether the required
      integration is contractual. Then I would separate it from the two useful but unvalidated
      requests, compare their effort, failure modes, and capacity cost, and put the decision date
      in writing. A staged commitment protects the evidenced requirement while keeping deferred
      work visible; promising all three is justified only if each dependency, estimate, and
      failure plan is validated for the date. If procurement or a contractual dependency changes
      the first release, I would reopen the priority instead of treating the earlier plan as
      fixed. Until that evidence arrives, the optional integrations remain candidates, not silent
      commitments.
  distractors:
  - text: I would promise all three integrations and ask the engineers to work extra
      hours if the estimate slips. The stakeholder made the request early, so meeting
      the date should be the team’s priority.
    trap: pragmatics
    why_wrong: It misses the purpose of this scope negotiation turn and gives no usable
      evidence of judgement.
  - text: I would say no to every integration until the whole platform has been redesigned. A
      fixed date creates too much pressure to make a partial choice, so I would protect the team
      by postponing the release, rejecting every request equally, and returning with a complete
      architecture rather than ranking dependencies or proposing a bounded first step.
    trap: hedging
    why_wrong: It avoids the relationship, uncertainty, or next action the interviewer
      is testing.
  feedback:
    register: Frame the answer as a customer-outcome decision, not an estimate dispute.
    hedging: Use conditional language for unvalidated integrations only.
    precision: Separate the first-customer dependency, optional work, and decision date.
    grammar: Use parallel labels—must-have, useful, unvalidated—to aid comparison.
    pragmatics: Make the staged commitment sound like reliability, not reluctance.
  rephrase:
    prompt: Rephrase your scope proposal so the fixed date and deferred work are explicit.
    goal: Keep the required integration, deferred options, and evidence that could change the date.
  follow_up:
    prompt: A second integration becomes contractually required. How would you reset
      the staged commitment while making the date risk explicit?
    goal: Renegotiate scope when a hidden requirement becomes binding instead of pretending
      the original plan still fits.
    challenge_kind: evidence
    best_answer: I would restate the two contractual dependencies, show the capacity
      and failure risk of delivering both by the date, and ask which optional work can
      move. If the date cannot move, I would propose a narrower first release with owners
      and a decision point rather than silently accepting an impossible commitment.
    distractors:
    - text: I would keep the existing date and promise both integrations by adding them to the
        current plan. If capacity becomes tight, the engineers can work longer or trim internal
        quality tasks, because the new requirement should not force another scope conversation
        after the stakeholder has already agreed to the original commitment.
      why_wrong: It hides the capacity and risk consequence of the new requirement.
    - text: I would reject the second integration outright because the scope was agreed and
        changing it would undermine the commitment. A contract arriving later should be handled by
        the stakeholder or procurement team, while engineering keeps the original plan and date
        untouched rather than reopening priorities.
      why_wrong: A contractual requirement is new evidence that should trigger a visible
        renegotiation, not an automatic refusal.
    answer_anchors:
    - Separate the two contractual dependencies from optional work.
    - Show capacity and failure risk before promising the date.
    - Offer a narrower release or an explicit date decision.
  compression:
    prompt: Name the first-customer dependency, separate the two unvalidated integrations, compare their cost and risk, and set a decision date.
    goal: Make the fixed-date commitment conditional on the requirement that is proven necessary and the evidence that could restore deferred scope.
  language_focus:
  - register
  - pragmatics
  - precision
  feynman:
    concept: Explain how a fixed date becomes negotiable when customer necessity and optional scope are separated.
    explain_to: A stakeholder who needs a credible first release rather than an unexamined promise to deliver three integrations.
    constraint: Separate the verified first-customer dependency from the inference that the other integrations can move; name the assumption that their contracts and capacity are not yet binding and specify the check that would change the sequence.
    self_check: Can you identify what makes one integration required, what remains unvalidated, and which evidence would restore an item to the first release?
    reasoning_check: If procurement later needs a demonstration of the second integration, can you distinguish that milestone from full production readiness and update the commitment?
  black_box:
    symptom: The answer accepts all three integrations or defers them all without exposing the customer dependency and date risk.
    expected: The response should protect the first-customer outcome, make optional work visible, and attach a condition to any expanded promise.
    actual: I used stakeholder enthusiasm as evidence of necessity and treated the fixed date as if capacity and risk were already known.
    root_cause: I did not separate contractual or customer evidence from useful-but-unvalidated requests, so the scope decision had no reversible boundary.
    repair: Keep the required integration in the first commitment, compare staging with an all-in promise, and name the evidence and owner that would justify restoring deferred work.
    reasoning_error: The reasoning error is an unsupported must-have claim combined with hidden capacity risk; the correction is a conditional scope decision.
  recall:
    active_recall_cue: Which integration is required, what can move, and what evidence would restore it?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain why one integration is committed and two are staged, and what evidence changes that choice?
    black_box_probe: If procurement requires a demonstration, what part of your staged promise needs rechecking?
    delayed_variant:
      id: general-05-scope-negotiation-delayed-1
      prompt: The customer accepts a staged release but says the second integration
        must be demonstrated before procurement signs. How would you revise the sequence?
      changed_constraint: The second integration is required for a demonstration, but
        not necessarily for the first production release.
      new_evidence: The stakeholder clarifies that procurement needs a demonstration
        milestone before the production commitment.
      best_answer: I would separate the demonstration dependency from the production
        cutover, confirm what behaviour procurement must see, and schedule a thin demonstrable
        path with its own risk check. I would keep the production promise conditional
        on the remaining integration work rather than treating the demo as proof of
        full readiness.
      distractors:
      - text: I would implement and ship the full second integration immediately because
          procurement has made it part of the decision. A working production path is the strongest
          demonstration, so I would treat the demo request as proof that the entire integration
          belongs in the release and avoid splitting it into a thin path with separate readiness
          checks.
        why_wrong: A demonstration requirement does not automatically establish production
          readiness or justify all implementation scope.
      - text: I would ignore procurement and keep the second integration out because the first
          customer’s outcome is the only commitment that matters. If the procurement process needs
          another demonstration, it can wait until after the first release; adding that request now
          would dilute the scope decision and the original delivery date.
        why_wrong: The new stakeholder constraint affects the commitment and must be
          included in the plan.
      answer_anchors:
      - Separate demonstration scope from production readiness.
      - Confirm the behaviour procurement needs to see.
      - Keep the full delivery promise conditional on remaining evidence.
      reasoning_moves:
        preserve: Preserve the first-customer outcome and the practice of making optional
          work visible.
        revise: Revise the sequence so a demonstration milestone is not mistaken for
          full production readiness.
        verify: Confirm the minimum behaviour procurement needs and the checks required
          before a production commitment.
        certainty_update: Increase confidence in a staged demonstration while keeping
          the final delivery date conditional.
  sources:
  - repo: system-design-estudos
    path: areas/01-metodo-e-entrevistas/examples/interview-walkthrough-checkout-incident.md
    note: Relevant local interview, incident, or operational communication source.
  - repo: original
    path: english-arcade/general/scope-negotiation
    note: Original scenario and language feedback authored for this pack.
  extension:
    prompt: The stakeholder asks for a one-minute scope proposal. Which item would you
      defer, and what evidence would make you restore it?
    goal: Negotiate a concrete scope boundary with a reversible decision and a trigger
      for re-expansion.
  critical_thinking:
    problem_frame: Protect the first-customer outcome by separating one required integration from two useful but unvalidated requests before making a fixed-date commitment.
    claim_map:
      fact: The context identifies one integration as required for the first customer and leaves two others useful but unvalidated.
      inference: Staging the required path can make the date and risk discussable without pretending the optional work is impossible.
      assumption: The two unvalidated integrations have no confirmed contractual dependency for the first production release and capacity is limited.
      unknown: The effort, integration failure modes, procurement dependencies, and evidence needed to restore either deferred item are not known.
    comparison:
      applicable: true
      alternatives:
      - option: Commit to the required integration first and stage the other two behind a decision date
        benefit: It protects the stated customer outcome and makes optional cost and risk visible.
        cost_or_risk: The deferred integrations may become urgent later and require another prioritisation decision.
        valid_when: The first-customer dependency is confirmed and the optional requests lack binding evidence.
      - option: Promise all three by the fixed date with explicit capacity and risk owners
        benefit: It preserves a single broad commitment when every dependency and effort estimate is already credible.
        cost_or_risk: It concentrates schedule risk and can hide a false must-have assumption behind stakeholder urgency.
        valid_when: Each integration has a validated requirement, capacity, owner, and failure plan that fit the date.
      decision_rule: Keep only evidenced customer or contractual requirements in the first commitment; restore deferred work when its dependency and capacity evidence become explicit.
    failure_probe:
      kind: counterexample
      prompt: Which customer or contractual dependency would make the staged plan an unsafe promise?
    evidence_check:
      basis: Check the first-customer requirement, the validation status of each integration, and the capacity evidence before calling scope mandatory.
      source_kind: authored_scenario
      limitation: The exercise does not establish effort estimates, ownership, procurement timing, or an outcome from the proposed sequence.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: I am confident that the required integration deserves priority, but the date risk and the optional items’ future urgency remain open.
      update_trigger: I would restore an item only after a customer or contract dependency and the capacity needed to meet it are confirmed.
    rubric:
      facts_correct: Keeps one integration required and the other two unvalidated without turning usefulness into a contract.
      assumptions_explicit: Names the capacity and dependency assumptions behind staging.
      alternatives_considered: Compares staged scope with an all-in promise and gives valid conditions for each.
      tradeoff_quality: Makes customer value, date risk, optional cost, and reversibility visible.
      follow_up_adaptation: Separates a procurement demonstration from full production readiness.
      certainty_calibration: Keeps the date commitment conditional on evidence rather than confidence.
    defense_checks:
    - id: general-05-scope-negotiation-defense-scope-boundary
      axis: alternatives
      prompt: Which question would you ask before calling an integration a must-have
        for the first release?
      best_answer: I would ask which customer or contractual outcome depends on it,
        what minimum behaviour is required, and what failure or delay follows if it
        moves; that evidence determines whether it belongs in the first release.
      distractors:
      - text: Anything requested by a stakeholder is a must-have for the first release, because
          the person asking is closest to the business need. I would place every requested
          integration in the fixed-date plan and use the stakeholder’s urgency as the evidence
          instead of asking which customer or contractual result depends on it.
        why_wrong: A request needs a customer or contractual dependency before it should
          consume fixed-date capacity.
      - text: Anything not already coded is optional and can be deferred, regardless of a contract
          or customer dependency. I would use implementation status as the scope boundary, since
          work that has not started cannot be necessary for the first release without creating
          avoidable schedule pressure.
        why_wrong: Implementation status does not reveal which requirement is contractually
          or operationally necessary.
- id: general-06-star-conflict
  version: 1.6.0
  target: general
  topic: star conflict
  difficulty: 3
  interview_stage: behavioural_probe
  prompt: 'Tell me, using a practice scenario rather than your work history, about a disagreement with a colleague that improved the outcome.'
  context: >-
    Practice simulation, not verified user history: during a hypothetical checkout-risk
    incident, the assumed role is an on-call service engineer who coordinates a bounded decision. A
    colleague proposes immediate rollback; the candidate proposes a reversible mitigation.
    The shared invariant is no duplicate charges. The exercise uses a limited option,
    an observation that distinguishes outcomes, and a stop condition. Over the review window,
    no invariant breach appears, rollback remains ready, and the team records that limited
    result. The scenario supplies no production metric, company, or personal incident.
  best_answer: >-
    I’ll frame this exercise as hypothetical, not as work history. In a checkout-risk
    situation, I was the on-call engineer coordinating a safe decision. A
    colleague preferred rollback; I proposed a reversible mitigation. I set no duplicate
    charges as the invariant, compared harm and reversibility, and used a discriminating
    signal plus a stop condition. The exercise showed no breach with rollback ready; that
    bounded result supports the rehearsal choice, not production safety. I would reverse it
    if the signal stayed noisy or the invariant was threatened.
  response_versions:
    short: >-
      I’ll frame this as a practice scenario. As the on-call engineer, I compared a reversible
      mitigation with rollback, keeping no duplicate charges as the invariant. I selected a
      discriminating signal and stop condition; we observed no breach during the exercise, with
      rollback ready. I would change course if the signal stayed noisy.
    medium: >-
      I’ll frame this exercise as hypothetical, not as work history. In a checkout-risk
      situation, I was the on-call engineer coordinating a safe decision. A
      colleague preferred rollback; I proposed a reversible mitigation. I set no duplicate
      charges as the invariant, compared harm and reversibility, and used a discriminating
      signal plus a stop condition. The exercise showed no breach with rollback ready; that
      bounded result supports the rehearsal choice, not production safety. I would reverse it
      if the signal stayed noisy or the invariant was threatened.
    deep: >-
      I’ll frame this exercise as hypothetical, not as work history. In a checkout-risk
      situation, I was the on-call engineer coordinating a decision under
      uncertainty. A colleague favoured immediate rollback; I proposed a reversible mitigation
      because the key invariant was no duplicate charges. I made the decision rule explicit:
      choose mitigation only while exposure remained bounded, the signal could distinguish harm
      from normal variance, and rollback was ready. I compared the downside of delaying recovery
      with the downside of allowing duplicate charges, then set a stop condition rather than
      treating agreement as evidence. The exercise showed no breach during its review window,
      but that observation is local evidence, not a production result or personal incident. If
      the signal stayed noisy, exposure widened, or the invariant was threatened, I would stop
      the mitigation, roll back, and report which assumption changed. That makes the disagreement
      a testable decision process rather than a victory story.
  distractors:
  - text: My colleague was wrong, so I would explain the correct design, cite the strongest
      metric I had, and push until they accepted it. Once they agreed, I would ship the
      mitigation immediately and treat the lack of further disagreement as evidence that
      rollback was unnecessary, even though we had not defined a customer invariant or
      a stop condition. I would call the absence of immediate complaints a successful
      outcome, skip the comparison with the alternative harm, and close the account
      without a later discriminating check.
    trap: register
    why_wrong: It misses the purpose of this star conflict turn and gives no usable
      evidence of judgement.
  - text: We never really disagree because our team communicates perfectly. If a concern did
      appear, we would resolve it immediately in conversation and move on without naming a
      competing option, a customer invariant, or a signal. Everyone would understand the same
      priority, so there would be no need to document a stop condition or keep a rollback option
      ready. I would describe the absence of conflict as evidence that the outcome improved and
      leave the account there without a later check or asking which observation would distinguish
      harmless variance from customer harm.
    trap: precision
    why_wrong: It avoids the relationship, uncertainty, or next action the interviewer
      is testing.
  feedback:
    register: Mark the answer as a practice simulation, then tell the disagreement as a shared customer problem, not a victory story.
    hedging: Treat the no-breach observation as limited scenario evidence, not proof of production safety.
    precision: Name the assumed responsibility, the two options, the signal, the stop condition, and the bounded result.
    grammar: Use past tense for the incident and active verbs for your contribution.
    pragmatics: Give the colleague a credible position before explaining how evidence changed the decision.
  rephrase:
    prompt: Rephrase this practice conflict for a stakeholder who needs the assumed responsibility, decision evidence, bounded result, and remaining uncertainty.
    goal: Preserve the colleague’s concern, the mitigation-versus-rollback comparison, the exercise-window result, and the boundary around production claims.
  follow_up:
    prompt: In the practice scenario, your colleague says the reversible mitigation creates another customer risk. What evidence would decide between mitigation and rollback?
    goal: Defend the assumed responsibility and testable choice while keeping the scenario result and production boundary explicit.
    challenge_kind: alternative
    best_answer: >-
      I would start with the invariant: no duplicate charges. I would compare the harm and
      reversibility of mitigation with rollback, then name the signal and stop condition. In
      this simulation, no breach was observed in the practice scenario during the exercise window, but that observation would
      not prove production safety; I would keep rollback ready and change course if the signal
      stayed noisy.
    distractors:
    - text: I would tell my colleague that rollback is the wrong choice because a reversible
        mitigation is always safer by definition. In the practice scenario, I would select the
        mitigation without comparing the possible customer harm, keep the existing signal as
        support, and treat rollback as unnecessary once the team accepted my recommendation.
      why_wrong: Reversibility is a factor, not a universal answer; the customer risk
        and evidence still need comparison.
    - text: I would choose whichever option the more senior engineer supported and present that
        decision as the team’s resolution. In the practice scenario, ending the disagreement
        quickly would matter more than debating the no-duplicate-charges invariant, so I would
        follow the senior view and move on without assigning a separate stop condition.
      why_wrong: Appeal to authority hides the invariant, evidence, and responsibility
        the interviewer is testing.
    answer_anchors:
    - Name the customer invariant before choosing.
    - Compare harm, reversibility, and the signal for each option.
    - Use only a verified result; otherwise keep the outcome conditional.
  compression:
    prompt: Compress this practice conflict into the assumed role, shared invariant, option comparison, exercise-window result, and production boundary.
    goal: Describe the choice and its limited scenario evidence without turning a rehearsal into a personal success claim.
  language_focus:
  - register
  - pragmatics
  - precision
  feynman:
    concept: Explain how this practice conflict moved from a shared customer invariant to a bounded decision and a limited observable result.
    explain_to: An interviewer who wants the assumed on-call responsibility, the colleague’s concern, the comparison, and the evidence boundary.
    constraint: Separate the scenario-given role, options, and no-breach observation from the inference that mitigation would be safe in production; state the stop condition that would reverse the choice.
    self_check: Can you name the situation, your assumed responsibility, the colleague’s option, your comparison, the exercise result, and the condition that would lower your confidence?
    reasoning_check: If the signal stays noisy or the invariant is threatened, can you revise the decision and keep the limited result from becoming a production claim?
  black_box:
    symptom: The rehearsal names a careful comparison but still fails to answer what responsibility was assumed or what observable result followed.
    expected: The response should state the assumed on-call task, compare the colleague’s rollback with the bounded mitigation, report the no-breach exercise result, and limit its meaning.
    actual: I described the decision as if it were the whole outcome and left the assumed responsibility and exercise-window evidence implicit.
    root_cause: I treated a sound option comparison as proof of improved production outcome and omitted the stop condition that would test the choice.
    repair: State the role, invariant, options, signal, stop condition, and limited no-breach result before explaining when the decision would change.
    reasoning_error: The error is collapsing responsibility, decision, and result into one claim; the repair keeps scenario evidence separate from production causality.
  recall:
    active_recall_cue: What role did you assume, what did the colleague propose, what did you choose, what result appeared in the exercise window, and what would reverse the choice?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain how the practice scenario separates your assumed responsibility, the shared invariant, the option comparison, and the limited no-breach result?
    black_box_probe: If the exercise result is absent or the signal is noisy, which STAR claim would you label as conditional before continuing?
    delayed_variant:
      id: general-06-star-conflict-delayed-1
      prompt: In the practice scenario, the first mitigation signal is noisy and cannot distinguish customer harm from normal variance. How would you update the conflict answer?
      changed_constraint: The available signal is too noisy to support a confident choice
        between rollback and the reversible mitigation.
      new_evidence: The team discovers that the first metric cannot separate harm from
        ordinary variance during the incident window.
      best_answer: I would say the original choice was provisional because the signal
        could not separate the two outcomes. I would add a safer discriminating check
        or reduce exposure while it ran, then report the exercise result only as evidence
        about that bounded scenario, not as proof that the mitigation was safe in production.
      distractors:
      - text: I would keep the original mitigation and describe the noisy signal as confirmation
          that no serious harm was visible. Since the exercise had not shown a breach, I would
          treat the uncertainty as normal variance, leave rollback ready only as a formality, and
          present the choice as settled rather than add another discriminating check.
        why_wrong: Noise cannot support the certainty claimed, especially when the decision
          concerns customer harm.
      - text: I would fill the missing result with the outcome the team most likely observed, then
          finish the STAR account with that clean resolution. A plausible no-breach result would
          make the practice scenario coherent, and the interviewer would learn more from a
          decisive ending than from pausing the story because the available signal is inconclusive.
        why_wrong: A polished result is not acceptable when the evidence does not establish
          it.
      answer_anchors:
      - Label the first choice provisional.
      - Add a discriminating check or reduce exposure while it runs.
      - Describe resolution as an evidence improvement, not a victory claim.
      reasoning_moves:
        preserve: Preserve the shared customer invariant and the comparison between
          mitigation and rollback.
        revise: Revise the confidence in the first choice because the initial signal
          was not discriminating.
        verify: Add a check that separates customer harm from normal variance before
          treating the result as evidence.
        certainty_update: Lower certainty about which option was better until the signal
          can distinguish the outcomes.
  sources:
  - repo: system-design-estudos
    path: areas/05-arquitetura-e-operacao/examples/incident-checkout-degradation.md
    note: Practice-simulation reference only; the role, incident, options, and result are scenario-given, not verified personal history.
  - repo: original
    path: english-arcade/general/star-conflict
    note: Original scenario and language feedback authored for this pack.
  extension:
    prompt: The interviewer asks for a conflict story but gives you no permission to invent a personal incident. How would you answer this practice scenario naturally?
    goal: Use the supplied role and rehearsal result while keeping a boundary around facts that would require the candidate’s own confirmation.
  critical_thinking:
    problem_frame: In the practice scenario, defend an assumed on-call responsibility by comparing mitigation with rollback, then separate the exercise result from any production claim.
    claim_map:
      fact: The practice supplies an assumed on-call role, a rollback-versus-mitigation conflict, a no-duplicate-charge invariant, and no breach during the exercise window; none is verified user history.
      inference: Naming the customer invariant and discriminating signal can demonstrate judgement, but the bounded no-breach observation cannot establish production safety.
      assumption: The stop condition and signal are sufficient for this rehearsal, and the assumed role has authority to coordinate the bounded choice.
      unknown: The user’s real incident history, production metrics, personal ownership, and any result outside this exercise are not supplied.
    comparison:
      applicable: true
      alternatives:
      - option: Use a verified personal disagreement and report the observed result with its limits
        benefit: It directly answers the behavioural request and shows how evidence changed the conversation.
        cost_or_risk: It can overstate personal impact if the team result is attributed to one decision without support.
        valid_when: The event, contribution, and result are personally confirmable and survive follow-up.
      - option: State the missing personal evidence and offer a bounded mitigation-versus-rollback comparison
        benefit: It preserves honesty while still showing the reasoning pattern the interviewer can evaluate.
        cost_or_risk: It may not satisfy an interviewer who requires a personal story, so the limitation must be explicit.
        valid_when: The candidate cannot confirm an event or outcome and asks whether a hypothetical trade-off is useful.
      decision_rule: Use this supplied STAR rehearsal only as a simulation; in a real interview, use a verified story or state the boundary instead of manufacturing an outcome.
    failure_probe:
      kind: counterexample
      prompt: What evidence would show that the conflict resolution was a preference rather than a comparison tied to the customer invariant?
    evidence_check:
      basis: Keep the assumed role, scenario options, signal, stop condition, and exercise result separate; decision quality and a bounded no-breach observation are not proof of production outcome.
      source_kind: authored_scenario
      limitation: The exercise supplies only a bounded rehearsal result; it does not establish a personal incident, production metric, or causal impact.
      checked_on: '2026-08-25'
    certainty:
      level: low
      rationale: I am confident about the supplied scenario facts and comparison, but not about any user history or production result beyond the exercise window.
      update_trigger: I would raise certainty about a real interview claim only when the incident, contribution, and distinguishing signal were independently confirmed.
    rubric:
      facts_correct: Reports the supplied conflict and exercise result as scenario facts, without presenting the assumed role as verified ownership or production impact.
      assumptions_explicit: States whether the candidate can personally confirm the event and result.
      alternatives_considered: Compares a verified story with a bounded decision pattern when personal evidence is missing.
      tradeoff_quality: Balances behavioural relevance, honesty, and the interviewer’s need for inspectable judgement.
      follow_up_adaptation: Lowers certainty when a noisy signal cannot distinguish harm from variance.
      certainty_calibration: Separates a good decision process from proof that the outcome improved.
    defense_checks:
    - id: general-06-star-conflict-defense-incident-boundary
      axis: facts
      prompt: What would you say if you cannot verify the personal incident or result
        the interviewer asks you to describe?
      best_answer: I would say I do not want to invent a personal event or outcome,
        then offer the decision pattern I can defend and ask whether a hypothetical
        trade-off is useful before continuing.
      distractors:
      - text: I would invent a believable checkout incident and describe it confidently as my own
          example, because behavioural interviews reward a complete personal story. The assumed
          rollback and mitigation details would make the account credible enough, so I would
          provide a polished result instead of explaining that the exercise is not verified work
          history.
        why_wrong: Plausibility is not evidence of personal experience and can collapse
          under follow-ups.
      - text: I would decline the entire behavioural question and give no alternative decision
          pattern, because a hypothetical conflict cannot demonstrate anything useful about me. If
          no personal incident is available, I would end the answer there rather than offer the
          supplied mitigation-versus-rollback comparison or ask whether a rehearsal would help.
        why_wrong: A truthful boundary can still be useful when it offers a supported
          pattern or asks for a hypothetical framing.
- id: general-07-failure-learning
  version: 1.6.0
  target: general
  topic: failure learning
  difficulty: 1
  interview_stage: behavioural_probe
  prompt: 'Describe, using a practice scenario rather than your work history, a failure that changed how you work.'
  context: >-
    Practice simulation, not verified user history: in a hypothetical migration rehearsal,
    the assumed role is the engineer deciding whether a rollout check covers the next workload.
    I underestimated a changed data distribution and treated an older check as sufficient.
    The exercise defines three corrections: check representative data, set a batch boundary,
    and name a rollback signal. The revised check marks the existing protection as insufficient
    for the proposed workload, so the rehearsal changes the rollout decision before any rollout
    step. This is a scenario
    result only; leave room to explain what evidence would be needed for a real outcome.
  best_answer: >-
    I’ll frame this as a practice scenario, not my work history. During a migration rehearsal,
    I was responsible for deciding whether an old load check covered the next workload. I
    underestimated the changed data distribution and treated the check as sufficient. A
    representative review exposed the gap, so I added a distribution-matched check, a batch
    boundary, and a rollback signal. The revised check rejected the old safeguard for this
    workload; I changed the rollout decision and would lower confidence when the distribution
    changes.
  response_versions:
    short: >-
      I’ll frame this as a practice scenario. In a migration rehearsal, I owned the rollout
      check decision, underestimated a changed data distribution, and added a matched load
      check, batch boundary, and rollback signal. The revised check rejected the old safeguard;
      I would change the process whenever the workload changes.
    medium: >-
      I’ll frame this as a practice scenario, not my work history. During a migration rehearsal,
      I was responsible for deciding whether an old load check covered the next workload. I
      underestimated the changed data distribution and treated the check as sufficient. A
      representative review exposed the gap, so I added a distribution-matched check, a batch
      boundary, and a rollback signal. The revised check rejected the old safeguard for this
      workload; I changed the rollout decision and would lower confidence when the distribution
      changes.
    deep: >-
      I’ll frame this as a practice scenario, not my work history. In a migration rehearsal, I
      was responsible for deciding whether an existing load check covered the next workload. My
      mistake was not simply missing a test; I assumed similar migration work implied similar
      data distribution. A representative review challenged that assumption. I therefore
      separated three controls: a load check using representative distribution, a batch boundary
      limiting exposure, and a rollback signal tied to the failure mode. The revised check
      rejected the old safeguard before the rehearsal proceeded. That result justifies changing
      the decision for this workload, but it does not establish production improvement or
      coverage of future migrations. Before reusing the safeguard, I would compare the new
      distribution and access pattern, measure the dominant cost, and define the observation that
      would trigger rollback. If those conditions changed, I would revise the test and lower
      confidence rather than defend a rule because it worked once. The learning is a decision
      boundary, not a promise that every migration shares one profile.
  distractors:
  - text: I made a mistake once, but it was mainly caused by an unclear requirement
      from another team. If they had documented the expectation more carefully, the
      original check would have been sufficient, so I would ask them to own the gap,
      leave the load test unchanged, and describe the incident as a communication
      problem rather than name a safeguard or verification step. I would reuse the same
      check on the next migration, call the process change complete without observing its
      coverage, and report the communication issue as the only lesson.
    trap: pragmatics
    why_wrong: It misses the purpose of this failure learning turn and gives no usable
      evidence of judgement.
  - text: I cannot think of a failure because I am careful and my projects normally go well. If
      a check ever missed something, I would describe it as an isolated surprise, review the
      team’s documentation, and promise to pay closer attention next time. I would treat the
      existing check as adequate for ordinary workloads, leave the rollout plan unchanged, and
      present the lesson as a general reminder rather than a tested process change until another
      incident showed exactly what needed to be fixed.
    trap: hedging
    why_wrong: It avoids the relationship, uncertainty, or next action the interviewer
      is testing.
  feedback:
    register: Mark the answer as a practice simulation, own the missed judgement plainly, then move to the changed decision process.
    hedging: Treat the revised-check result as evidence about this rehearsal, not proof of production performance or recurrence prevention.
    precision: Name the assumed responsibility, the distribution error, each corrective action, the changed rollout decision, and the evidence boundary.
    grammar: Use ‘I underestimated’ rather than an impersonal passive construction.
    pragmatics: Acknowledge the decision error without blaming another team or turning a rehearsal into a personal production claim.
  rephrase:
    prompt: Rephrase this practice failure for a stakeholder who needs the assumed responsibility, judgement error, corrective check, scenario result, and evidence boundary.
    goal: Preserve the explicit ‘I underestimated’ moment, the changed safeguard, the rehearsal result, and the limit on real-world claims.
  follow_up:
    prompt: In the practice scenario, the interviewer asks why the original check missed the risk. How would you explain the gap, own the change, and state what the revised check demonstrated?
    goal: Show the mistaken judgement, corrective action, scenario result, and evidence limit instead of offering regret or a vague promise.
    challenge_kind: failure
    best_answer: I would say I underestimated the change in data distribution and assumed
      the old check covered the next workload. I would own that decision error, add a
      distribution-matched load check, a batch boundary, and a rollback signal, then explain
      that the revised check rejected the old safeguard for this rehearsal. That result supports
      a changed process here; it does not prove production performance or recurrence prevention.
    distractors:
    - text: I would blame the test environment because the failure appeared only under a
        different load and say the original safeguard was reasonable for the normal case. I
        would ask the platform team to standardise the environment, keep the old check unchanged,
        and describe the rehearsal as evidence that unusual data rather than my decision caused
        the gap.
      why_wrong: The environment difference is evidence to investigate, not a reason
        to avoid owning the missing assumption.
    - text: I would say the failure taught me to be more careful and to review migration checks
        with extra attention, but I would avoid prescribing a particular test or batch limit until
        the next workload is known. A serious result should make the team cautious, and that
        general change in attitude would be enough to explain the lesson without adding another
        safeguard.
      why_wrong: It does not show how the learning changes future decisions or detection.
    answer_anchors:
    - Name the assumption the original check missed.
    - Own the decision gap without blaming the environment.
    - State a concrete future check and bound the outcome claim.
  compression:
    prompt: Compress this practice failure into the assumed role, ‘I underestimated’ judgement error, corrective check, rehearsal result, and evidence boundary.
    goal: State what changed in the decision process and what the scenario result supports without claiming a real production outcome.
  language_focus:
  - register
  - pragmatics
  - precision
  feynman:
    concept: Explain how the practice failure moved from an underestimated distribution change to a revised rollout decision and a bounded result.
    explain_to: A panel that wants the assumed responsibility, the judgement error, the corrective check, and evidence for the lesson without an invented production metric.
    constraint: Separate the scenario-given role, distribution change, revised-check result, and process change from the inference that the safeguard will cover every future workload; name the boundary that would invalidate it.
    self_check: Can you state the challenge, your responsibility, ‘I underestimated’ error, corrective actions, rehearsal result, and evidence needed before claiming real improvement?
    reasoning_check: If another migration has a different distribution, can you lower confidence in this safeguard, adapt the check, and explain what new observation would update your conclusion?
  black_box:
    symptom: The rehearsal names a safeguard but omits the assumed responsibility, the ‘I underestimated’ judgement error, or the observable result that changed the rollout decision.
    expected: The response should connect the changed distribution to the missed assumption, corrective actions, revised-check result, and evidence needed for a real conclusion.
    actual: I described a new load check as learning without stating what I was responsible for, what assumption I underestimated, or what the revised check demonstrated.
    root_cause: I confused adding a process step with proving that it covers the next workload and left reflection as a disclaimer rather than a reasoned update.
    repair: Name the role, error, distribution-matched check, batch boundary, rollback signal, rehearsal result, and condition that would lower confidence again.
    reasoning_error: The error is treating intention or one rehearsal result as universal coverage; the repair ties the process to evidence and a workload boundary.
  recall:
    active_recall_cue: What role did you assume, what did you underestimate, which checks changed, what result did the rehearsal show, and what would make you revise the safeguard?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain how the practice error became a distribution-matched check, a changed rollout decision, and a result whose evidence remains bounded?
    black_box_probe: If the next migration has a different distribution, which part of your CARE answer would you revise before reusing the safeguard?
    delayed_variant:
      id: general-07-failure-learning-delayed-1
      prompt: In the practice scenario, a new migration has a different data distribution from the failure you learned from. How would you decide whether the old safeguard still applies?
      changed_constraint: The new migration changes data distribution, so the earlier
        safeguard may not cover its dominant load or failure mode.
      new_evidence: The team identifies a different distribution and access pattern
        in the proposed migration.
      best_answer: I would preserve the principle of testing load and rollback signals,
        but revise the concrete test to match the new distribution and access pattern.
        I would verify the dominant cost with a representative sample before relying
        on the old safeguard, and treat the earlier rehearsal result as limited to its
        workload until the new evidence supported a broader conclusion.
      distractors:
      - text: I would reuse the old safeguard unchanged because the point of learning is to apply
          a rule consistently across migrations. The changed data distribution would be an
          exception to monitor after the rollout, not a reason to redesign the check, and I would
          keep the same batch and rollback assumptions so the team has a stable process.
        why_wrong: The trigger is the principle, but the workload and failure mode changed.
      - text: I would discard the old safeguard and avoid carrying any migration checks into the
          next rehearsal because every workload has a different shape. Starting from no assumptions
          would seem safer than trusting a rule that failed once, so I would let the next team
          invent checks only after its own failure appeared.
        why_wrong: A changed workload calls for adaptation, not abandoning the general
          protection against untested risk.
      answer_anchors:
      - Preserve load and rollback thinking.
      - Adapt the test to the new distribution and access pattern.
      - Verify representative behaviour before treating the safeguard as sufficient.
      reasoning_moves:
        preserve: Preserve the habit of testing representative load and defining rollback
          signals before similar work.
        revise: Revise the concrete test because the new migration has a different data
          distribution.
        verify: Measure the dominant cost and failure mode on representative data before
          relying on the previous safeguard.
        certainty_update: Keep confidence in the process principle while withholding
          confidence in the old test’s coverage.
  sources:
  - repo: system-design-estudos
    path: areas/11-operational-playbooks/playbooks/database-migration-and-backfill.md
    note: Practice-simulation reference only; the role, judgement error, corrective actions, and result are scenario-given, not verified personal history.
  - repo: original
    path: english-arcade/general/failure-learning
    note: Original scenario and language feedback authored for this pack.
  extension:
    prompt: The panel asks for this practice failure lesson in one sentence. What changed in the assumed role, and what evidence would show whether the safeguard applies?
    goal: Compress the simulated judgement error into a changed process, a bounded result, and a testable update condition.
  critical_thinking:
    problem_frame: In the practice scenario, explain how the assumed rollout responsibility, underestimated distribution change, and revised check changed the decision before proceeding.
    claim_map:
      fact: The practice supplies an assumed rollout-check responsibility, a changed data distribution, an underestimated coverage assumption, three corrective controls, and a revised check that rejects the old safeguard for this workload; none is verified user history.
      inference: The distribution-matched check may address the missed assumption, but its coverage beyond this rehearsal remains a hypothesis until another workload is tested.
      assumption: The representative review reflects the relevant failure window and the rollback signal is actionable for the assumed role.
      unknown: The user’s real failure, production ownership, future distributions, and measured effect outside the rehearsal are not supplied.
    comparison:
      applicable: true
      alternatives:
      - option: Add a targeted check that matches the failed assumption before the next migration
        benefit: It tests the relevant workload or failure window without imposing unrelated process cost.
        cost_or_risk: A narrow check can miss a different distribution or a second failure mode.
        valid_when: The failed assumption and the next workload are understood well enough to design a discriminating test.
      - option: Delay or gate the next change until its distribution and rollback boundary are measured
        benefit: It reduces the chance of repeating the lesson while evidence about coverage is still weak.
        cost_or_risk: It slows delivery and may add a broad gate where a focused check would have been sufficient.
        valid_when: The next workload differs materially or the consequence of another miss is high.
      decision_rule: Match the safeguard to the next workload; treat the rehearsal result as local evidence, use a gate when distribution or rollback evidence is missing, and claim broader improvement only after another check.
    failure_probe:
      kind: counterexample
      prompt: If the next migration has a different data distribution, which part of the old safeguard would you retest first?
    evidence_check:
      basis: Compare the assumed role, underestimated distribution, corrective controls, revised-check result, and next workload separately; a changed rehearsal decision is not production proof.
      source_kind: authored_scenario
      limitation: The exercise establishes only a bounded rehearsal result; it does not establish a personal incident, production performance, or recurrence prevention.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: I am confident that the simulated process change is more inspectable than regret, but coverage beyond this workload remains conditional on evidence.
      update_trigger: I would lower confidence when distribution, access pattern, or failure severity changes, and raise it only after the revised check covers that boundary.
    rubric:
      facts_correct: Separates the assumed role, underestimated distribution, corrective process, rehearsal result, and future evidence without presenting them as user history.
      assumptions_explicit: Names the workload and failure-window assumptions behind the safeguard and the limits of the rehearsal result.
      alternatives_considered: Compares a targeted check with delaying or gating the next change.
      tradeoff_quality: Balances delivery cost against coverage and the consequence of another miss.
      follow_up_adaptation: Revises the safeguard when the next migration’s distribution differs.
      certainty_calibration: Treats recurrence prevention as unproven until the relevant check is observed.
    defense_checks:
    - id: general-07-failure-learning-defense-learning-change
      axis: facts
      prompt: In this practice scenario, what makes the failure answer demonstrate learning rather than only regret?
      best_answer: I would name the responsibility I assumed, say that I underestimated
        the changed distribution, show how the revised check changed the rollout decision,
        and name the next observation needed before treating the safeguard as broadly valid.
      distractors:
      - text: I would say that feeling bad about the failure proves the lesson mattered and shows
          that I would take the next migration more seriously. The interviewer would hear genuine
          regret, which is enough to demonstrate growth, so I would not spend the answer on a
          revised check, a batch boundary, or a rollback signal.
        why_wrong: Emotion does not show a changed process or a check against recurrence.
      - text: I would add a sentence saying that greater care is needed with migrations and leave
          the details there. A serious rehearsal result already creates a strong warning for the
          next attempt, so a broad promise would be more honest than pretending to know which
          check or rollback boundary will work.
        why_wrong: The interviewer needs an observable decision or safeguard, not a
          broad intention.
- id: general-08-stakeholder-mediation
  version: 1.6.0
  target: general
  topic: stakeholder mediation
  difficulty: 2
  interview_stage: behavioural_probe
  prompt: Engineering says the deadline is unsafe; sales says the customer commitment
    is non-negotiable. What would you do?
  context: You are facilitating a decision, not choosing a side before facts are clear.
  best_answer: >-
    I would translate the engineering concern into customer and contractual impact, verify
    the sales constraint, and write options with owners and dates. A limited safe release may
    be possible, but before we commit to it, we should keep residual risk clearly visible to the
    decision-maker while failure probability remains unknown.
  response_versions:
    short: >-
      I would verify the sales constraint, translate engineering risk into customer and
      contractual terms, and present options with dates. A limited safe release may be possible,
      but I would keep residual risk visible to the decision-maker while failure probability
      remains unknown.
    medium: >-
      I would translate the engineering concern into customer and contractual impact, verify
      the sales constraint, and write options with owners and dates. A limited safe release may
      be possible, but before we commit to it, we should keep residual risk clearly visible to the
      decision-maker while failure probability remains unknown.
    deep: >-
      I would first separate the known contract penalty from the unknown probability of
      technical failure. I would verify what Sales is actually committed to, then compare a
      limited release with containment and a targeted test against changing the date until the
      failure mode is better understood. The limited path is reasonable only when its boundary
      is containable, someone can accept the residual risk, and a stop condition exists. I
      would tell the decision-maker exactly what is known, what remains a hypothesis, and what
      evidence the next test should provide. If severity is demonstrated but frequency remains
      unknown, I would increase the weight of containment without pretending that the two
      uncertainties are equivalent.
  distractors:
  - text: I would ask sales and engineering to negotiate privately and wait for them
      to return with an answer. They know their constraints better than I do, so I would
      avoid influencing the discussion with my own interpretation.
    trap: register
    why_wrong: It misses the purpose of this stakeholder mediation turn and gives no
      usable evidence of judgement.
  - text: I would repeat the technical details until sales accepts that the deadline is
      impossible. The engineering explanation should settle the discussion, so I would continue
      presenting capacity and implementation constraints, ask sales to withdraw the commitment,
      and avoid translating the risk into customer terms or comparing a limited release with a
      date change.
    trap: precision
    why_wrong: It avoids the relationship, uncertainty, or next action the interviewer
      is testing.
  feedback:
    register: Sound like a facilitator who makes a decision easier, not a neutral bystander.
    hedging: Use ‘may be possible’ for a limited release until constraints are verified.
    precision: Translate engineering risk into customer and contractual consequences.
    grammar: Keep owners, options, and dates in parallel clauses.
    pragmatics: Write the residual risk down so the final choice has a shared record.
  rephrase:
    prompt: Rephrase your mediation summary so the known penalty, unknown probability, and decision owner are clear.
    goal: Keep both stakeholders’ evidence, the options, and the residual-risk owner.
  follow_up:
    prompt: Sales can quantify the contract penalty, but engineering cannot yet quantify
      failure probability. How would you structure a decision without pretending the
      risks are equally measured?
    goal: Mediate between stakeholders by exposing asymmetrical evidence rather than
      choosing a side prematurely.
    challenge_kind: new_evidence
    best_answer: 'I would put the known penalty, the engineering uncertainty, and the
      decision deadline in the same frame, then offer options: a limited safe release,
      a date change, or a targeted test. I would label the failure probability as unknown,
      assign an owner to reduce it, and make the residual risk explicit to the decision-maker.'
    distractors:
    - text: I would put the contract penalty at the centre of the decision and use it as the only
        number anyone needs. Engineering’s failure probability is unknown, so it cannot compete in
        the same discussion; I would recommend meeting the date and explain that an unmeasured
        technical risk should not delay a quantified customer commitment.
      why_wrong: A quantified commercial cost does not erase an unquantified technical
        failure risk.
    - text: I would pause the decision until engineering can calculate a precise failure
        probability and express it in the same terms as the contract penalty. Any recommendation
        before both risks share a number would be guesswork, so I would keep the deadline unresolved
        and ask the team to continue measuring until the comparison is exact.
      why_wrong: Waiting for precision can itself violate the deadline; a bounded decision
        can state uncertainty and assign the next check.
    answer_anchors:
    - Place known penalty and unknown failure probability together.
    - Offer a release, date, or targeted-test option.
    - Assign an owner and disclose residual risk.
  compression:
    prompt: State the contract penalty and engineering uncertainty together, present options with owners and dates, and name residual risk.
    goal: Mediate with asymmetric evidence by separating what is known, what is unknown, and what test or decision would reduce the uncertainty.
  language_focus:
  - register
  - pragmatics
  - precision
  feynman:
    concept: Explain how to make a recommendation when one stakeholder has a known penalty and the other has an unmeasured failure probability.
    explain_to: A decision owner who needs a fair frame for sales urgency and engineering uncertainty without false numerical symmetry.
    constraint: Separate the verified contract penalty from the inference about technical severity; name the assumption that containment or a targeted test can bound the risk and identify the missing frequency evidence.
    self_check: Can you write the known penalty, the unknown probability, the available options, and the owner of the next check without pretending the risks have equal measurement?
    reasoning_check: If a targeted test reproduces a severe failure but not its frequency, can you increase concern about severity while keeping the probability unknown?
  black_box:
    symptom: The mediation either takes sales or engineering as automatically correct or turns an unknown failure probability into a precise number.
    expected: The response should frame asymmetric evidence, compare bounded options, and make the residual risk visible to the decision owner.
    actual: I tried to make the decision comfortable by forcing the contract penalty and technical uncertainty into one scale.
    root_cause: I confused comparability with equal measurement and ignored containment, reversibility, and the owner of the next evidence.
    repair: State the known penalty, label failure probability unknown, compare a limited release with a date change, and assign a targeted test or owner to reduce uncertainty.
    reasoning_error: The reasoning error is false precision; the remedy is an explicit asymmetric trade-off with a decision owner.
  recall:
    active_recall_cue: How would you put the known penalty, unknown probability, options, and owner in one decision?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain how you compare a known penalty with an unknown probability without false precision?
    black_box_probe: If severity is proven but frequency is unknown, which part of your recommendation would you revise?
    delayed_variant:
      id: general-08-stakeholder-mediation-delayed-1
      prompt: The targeted test finds a severe failure mode but gives no reliable frequency
        estimate. How would you change the stakeholder recommendation?
      changed_constraint: A severe failure mode is demonstrated, but its frequency remains
        unknown and the contract decision is still time-bound.
      new_evidence: The targeted test reproduces a high-severity failure without establishing
        how often production conditions trigger it.
      best_answer: I would increase the weight of the engineering risk because severity
        is now demonstrated, while keeping frequency explicitly unknown. I would recommend
        containing or narrowing the release, state the contract cost of delay, and ask
        the decision-maker to accept only the residual risk they can see rather than
        hiding it behind a missing probability.
      distractors:
      - text: I would call the failure mode irrelevant to production because the test gave no
          frequency estimate. Without a rate, the severe case cannot be treated as a real decision
          input, so I would leave the release unchanged and report only the measurable signals
          while waiting for enough samples to calculate likelihood.
        why_wrong: No frequency estimate does not negate a demonstrated failure mode.
      - text: I would recommend shipping unchanged because decisions should be based on
          probabilities rather than the seriousness of an isolated failure. Until the test produces
          a reliable frequency, containment would be premature, and the contract penalty would make
          accepting the unmeasured technical concern the more practical option.
        why_wrong: Severity and reversibility matter when frequency is uncertain; ignoring
          them is false precision in reverse.
      answer_anchors:
      - Treat demonstrated severity as new evidence.
      - Keep frequency unknown instead of inventing a probability.
      - Narrow or contain the release and expose residual risk.
      reasoning_moves:
        preserve: Preserve the shared decision frame with owners, dates, and explicit
          residual risk.
        revise: Revise the recommendation toward containment because a severe failure
          mode is now demonstrated.
        verify: Seek a safe way to estimate or bound frequency while protecting the
          release from the known mode.
        certainty_update: Increase certainty that the failure deserves mitigation while
          keeping its production frequency uncertain.
  sources:
  - repo: system-design-estudos
    path: areas/01-metodo-e-entrevistas/examples/interview-walkthrough-checkout-incident.md
    note: Relevant local interview, incident, or operational communication source.
  - repo: original
    path: english-arcade/general/stakeholder-mediation
    note: Original scenario and language feedback authored for this pack.
  extension:
    prompt: A senior stakeholder asks you to mediate in two minutes. Which facts, unknowns,
      options, and decision owner would you put on the page?
    goal: Make a cross-functional decision legible without pretending commercial and
      technical evidence have the same shape.
  critical_thinking:
    problem_frame: Mediate a fixed customer commitment and an unsafe engineering deadline by putting known penalty, unknown failure probability, options, and decision ownership in one frame.
    claim_map:
      fact: Sales can quantify a contract penalty, engineering cannot yet quantify failure probability, and the answer keeps residual risk visible.
      inference: A limited release or a date change can be compared without pretending the penalty and probability have equal evidence.
      assumption: Severity, reversibility, containment, and a targeted test can bound the decision even while frequency remains unknown.
      unknown: The failure frequency, affected paths, test duration, available containment, and person authorised to accept residual risk are not established.
    comparison:
      applicable: true
      alternatives:
      - option: Offer a limited safe release while a targeted test reduces the technical uncertainty
        benefit: It may protect part of the commitment and create evidence without hiding the unknown probability.
        cost_or_risk: A severe but infrequent failure can still occur in the released boundary, and the test may not finish in time.
        valid_when: The release boundary is containable, the owner accepts residual risk, and a stop condition exists.
      - option: Change the date until the severe failure mode and its operating conditions are better understood
        benefit: It avoids accepting an unbounded failure boundary while evidence is incomplete.
        cost_or_risk: It exposes the known contract penalty and may be rejected by the decision owner.
        valid_when: The failure is not containable or the decision owner will not accept the residual risk.
      decision_rule: Present both options with the known penalty and unknown probability labelled; choose a limited release only when containment and ownership are real, otherwise escalate the date decision.
    failure_probe:
      kind: failure_mode
      prompt: If a targeted test proves a severe failure mode but not its frequency, how does that change the recommendation?
    evidence_check:
      basis: Keep penalty, severity, frequency, containment, and test evidence as separate claims rather than forcing them into one number.
      source_kind: authored_scenario
      limitation: The exercise does not establish the failure probability, contract terms beyond the penalty, or a measured production outcome.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: I am certain that the evidence is asymmetric, but the release recommendation depends on containment and an owner that the prompt does not provide.
      update_trigger: I would increase concern when severity is demonstrated or containment is unavailable, even if frequency remains unknown.
    rubric:
      facts_correct: Labels the contract penalty as known and the technical failure probability as unknown.
      assumptions_explicit: States the containment, severity, and ownership assumptions behind a limited release.
      alternatives_considered: Compares a contained release with changing the date.
      tradeoff_quality: Makes contract cost, failure severity, reversibility, and evidence timing visible.
      follow_up_adaptation: Raises concern after a severe failure is reproduced without pretending its frequency is known.
      certainty_calibration: Keeps an unknown probability unknown while making a decision path explicit.
    defense_checks:
    - id: general-08-stakeholder-mediation-defense-asymmetric-risk
      axis: certainty
      prompt: How would you present a known contract penalty beside a technical failure
        probability that is still unknown?
      best_answer: I would state the penalty as known, the failure probability as unknown,
        and the severity and reversibility evidence separately; then I would offer bounded
        options and ask the decision owner to accept visible residual risk.
      distractors:
      - text: I would record the technical failure probability as zero until engineering produced a
          number, then compare that zero with the known contract penalty. Treating the unknown as no
          risk would keep the decision simple and avoid slowing the deadline with an estimate that
          the team cannot yet defend.
        why_wrong: Unknown is not zero, and false precision would distort the decision.
      - text: I would refuse to recommend any path until sales and engineering measured their risks
          on the same scale. A contract penalty in currency cannot be weighed against an uncertain
          failure mode, so the responsible move would be to postpone the decision until both teams
          supplied matching probabilities and severity values.
        why_wrong: Decision-making can proceed with explicit asymmetry, containment,
          and a named next check.
- id: general-09-incident-update
  version: 1.6.0
  target: general
  topic: incident update
  difficulty: 3
  interview_stage: behavioural_probe
  prompt: Give me the update you would send fifteen minutes into a checkout incident.
  context: >-
    Hypothetical incident simulation: fifteen minutes after a release, checkout failures
    are elevated. A release rollback is underway; the incident commander handles
    communication, the on-call database engineer owns the latency check, and the next update is
    at 14:30 UTC. Database latency is a hypothesis, not a confirmed cause.
  best_answer: >-
    Known: checkout failures increased fifteen minutes after the release. Unknown: whether
    database latency is causal. Rolling back the release is the active mitigation. The incident
    commander owns communication, and the on-call database engineer is checking latency. Next
    update: 14:30 UTC. We will keep the cause open and report observations separately from
    hypotheses.
  response_versions:
    short: >-
      Known: checkout failures increased fifteen minutes after the release. Unknown: whether
      database latency is causal. Rollback is underway; the incident commander owns
      communication, and the on-call database engineer checks latency. Next update: 14:30 UTC.
    medium: >-
      Known: checkout failures increased fifteen minutes after the release. Unknown: whether
      database latency is causal. Rolling back the release is the active mitigation. The incident
      commander owns communication, and the on-call database engineer is checking latency. Next
      update: 14:30 UTC. We will keep the cause open and report observations separately from
      hypotheses.
    deep: >-
      I would send: “Known: checkout failures increased fifteen minutes after the release.
      Unknown: whether database latency is causal. Rollback is the active mitigation. The
      incident commander owns communication, and the on-call database engineer is checking
      latency. Next update: 14:30 UTC.” I would continue the reversible mitigation while the
      diagnostic runs, but I would not call the rollback the cause if the failures improve. I
      would compare the failure timeline with latency and rollback progress, keep the causal
      statement open, and revise the update if the next observation points to another dependency.
      The message gives decision-makers a current status without inventing a recovery result or
      assigning blame prematurely.
  distractors:
  - text: Everything is under control and we are investigating the issue. The team is
      working on it now, and I do not want to give incomplete details before we know
      the root cause. I would avoid assigning an owner or a time until the cause is
      confirmed.
    trap: pragmatics
    why_wrong: It misses the purpose of this incident update turn and gives no usable
      evidence of judgement.
  - text: The incident is serious; I will share more information when I have it. Until the root
      cause is known, I would avoid naming the current impact, assigning an owner, or setting
      another update time, because incomplete information could create confusion. I would let
      the investigation finish before giving the decision-maker anything more specific.
    trap: hedging
    why_wrong: It avoids the relationship, uncertainty, or next action the interviewer
      is testing.
  feedback:
    register: 'Use incident-update language: known, unknown, action, and next timestamp.'
    hedging: Say ‘whether latency is causal’ rather than presenting a hypothesis as
      fact.
    precision: Include rollout state, metric owner, and the exact next update time.
    grammar: Use labelled fragments deliberately; they are clearer than a long paragraph
      here.
    pragmatics: Give executives certainty about communication even when cause is uncertain.
  rephrase:
    prompt: Rephrase the incident update for an executive who needs impact, mitigation, uncertainty, and the exact next checkpoint.
    goal: Keep known impact, active mitigation, causal uncertainty, and the exact checkpoint.
  follow_up:
    prompt: At the 14:30 UTC checkpoint, rollback has not finished and database latency
      is still only a hypothesis. What would you send now, with the next checkpoint at 14:45 UTC?
    goal: Update stakeholders with useful facts and actions without converting a hypothesis
      into a cause.
    challenge_kind: assumption
    best_answer: 'I would send: “Known: checkout failures remain elevated. Unknown: whether database
      latency is causal. Rollback is still in progress. The incident commander owns communication,
      and the on-call database engineer continues the latency check. Next update: 14:45 UTC.”'
    distractors:
    - text: I would write that database latency is causing the checkout failures because it is the
        leading explanation, then say the rollback is addressing that cause. I would mention that
        failures remain elevated and promise another update at 14:45 UTC, but I would present the
        causal statement as settled so the incident commander can give stakeholders a clear
        direction.
      why_wrong: Plausibility is not confirmation, and the update must distinguish hypothesis
        from known impact.
    - text: I would send no further update while rollback is incomplete, because a message without
        a confirmed cause could confuse stakeholders. Once the database check identifies the root
        cause, I would summarise the failures, mitigation, owners, and next time in one definitive
        note rather than issue a provisional checkpoint at 14:45 UTC.
      why_wrong: Silence removes useful coordination while the incident and mitigation
        are still changing.
    answer_anchors:
    - State current impact and rollback status.
    - Keep database latency labelled as a hypothesis.
    - Name an owner and a time tied to the next observation or decision.
  compression:
    prompt: State the observed checkout impact, the unconfirmed cause, the active mitigation, the owner, and the next checkpoint.
    goal: Give executives a useful incident update that separates impact from hypothesis and ties the next promise to a decision or observation.
  language_focus:
  - register
  - pragmatics
  - precision
  feynman:
    concept: Explain how an incident update can be decisive about impact while remaining uncertain about cause.
    explain_to: An executive who needs to know what users experience, what is being done, and when the next evidence will arrive.
    constraint: Separate the scenario-given increase in checkout failures from the hypothesis about database latency; state the assumption behind the active mitigation and name the observation that could confirm or reject the causal story.
    self_check: Can you label known impact, unknown cause, mitigation owner, and next checkpoint in one update without promising recovery?
    reasoning_check: If rollback improves one metric while another dependency remains elevated, can you revise the causal claim and keep the next update concrete?
  black_box:
    symptom: The update either offers false reassurance or withholds a useful hypothesis because the cause is not confirmed.
    expected: The response should communicate impact as fact, cause as hypothesis, mitigation as an action, and the next checkpoint as a commitment.
    actual: I treated an improving signal during rollback as proof that rollback caused recovery and ignored the remaining dependency errors.
    root_cause: I collapsed correlation, causation, and operational communication into one sentence instead of keeping each evidence level separate.
    repair: Say what is observed, label the suspected cause, continue the bounded mitigation, and set the next check against the mixed signals.
    reasoning_error: The reasoning error is causal overreach from a correlated metric; the correction is calibrated language plus a discriminating observation.
  recall:
    active_recall_cue: What is known, what is only a hypothesis, who owns the checks, and when is the next update?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain how to state impact as known, cause as hypothesis, and the next checkpoint as a commitment?
    black_box_probe: If rollback improves one metric while another dependency worsens, which causal statement would you withdraw?
    delayed_variant:
      id: general-09-incident-update-delayed-1
      prompt: A metric improves during rollback, but another dependency’s errors remain
        elevated. How would you revise the update and the causal claim?
      changed_constraint: One signal improves during rollback, while a separate dependency
        still shows elevated errors, so the causal picture is mixed.
      new_evidence: The incident dashboard shows improvement in one metric but continued
        errors from another dependency.
      best_answer: I would report the improvement as an observation, not proof that
        rollback resolved the incident, and call out the continuing dependency errors
        separately. I would keep the causal claim open, assign the next check to correlate
        the timelines, and state what mitigation remains active.
      distractors:
      - text: I would report that rollback resolved the incident because the first metric improved
          during the rollback, and I would treat the remaining dependency errors as a separate
          issue. The timing is strong enough to support the causal claim, so I would mark the
          mitigation successful and move the next investigation to the dependency.
        why_wrong: Temporal correlation alone does not establish that rollback caused
          the improvement or explains the remaining errors.
      - text: I would focus the update on the healthy metric and omit the dependency errors so the
          message shows that the rollback is working. Once the main signal recovers, the remaining
          errors can be handled in a later ticket, and the incident note can describe the
          improvement as the meaningful outcome.
        why_wrong: The continuing signal is relevant impact evidence and changes what
          the update must communicate.
      answer_anchors:
      - Report improvement as observation, not causality.
      - Keep the remaining dependency errors visible.
      - Correlate timelines before narrowing the root-cause claim.
      reasoning_moves:
        preserve: Preserve the known-versus-unknown structure, active mitigation, owner,
          and next update commitment.
        revise: Revise the causal story because the signals show mixed effects rather
          than one confirmed cause.
        verify: Correlate the timeline of rollback, metrics, and dependency errors before
          assigning causality.
        certainty_update: Increase confidence that rollback changed one signal while
          keeping root cause and full recovery uncertain.
  sources:
  - repo: system-design-estudos
    path: areas/11-operational-playbooks/playbooks/incident-severity-and-triage.md
    note: Hypothetical incident reference only; not a verified production event or user history.
  - repo: original
    path: english-arcade/general/incident-update
    note: Original scenario and language feedback authored for this pack.
  extension:
    prompt: An executive asks for a one-sentence incident update. How would you include
      impact, mitigation, uncertainty, and the next checkpoint?
    goal: Compress incident communication without losing the distinction between fact,
      hypothesis, and next action.
  critical_thinking:
    problem_frame: Give a fifteen-minute checkout update that is firm about observed impact, explicit about the causal hypothesis, and concrete about mitigation ownership and the next checkpoint.
    claim_map:
      fact: The hypothetical gives elevated checkout failures fifteen minutes after the release, rollback as the active mitigation, the incident commander and on-call database engineer as owners, and 14:30 UTC as the next update; database latency is only a hypothesis.
      inference: Continuing an active mitigation while diagnostics run may reduce exposure, but improvement during that mitigation would not by itself prove causation.
      assumption: The rollback or other active mitigation is safe to continue and the next diagnostic can distinguish database latency from another dependency.
      unknown: The causal dependency, rollback completion, affected scope, and eventual recovery are not known at the first update.
    comparison:
      applicable: true
      alternatives:
      - option: Continue the active mitigation while time-boxing a diagnostic and reporting observed impact
        benefit: It prioritises customer exposure while preserving a path to better causal evidence.
        cost_or_risk: The mitigation may remove evidence or fail to address the real dependency.
        valid_when: The mitigation is reversible, its owner is clear, and the next observation is defined.
      - option: Wait for causal confirmation before changing the release or rollback path
        benefit: It protects diagnostic clarity and avoids attributing recovery to the wrong action.
        cost_or_risk: Customer impact can continue while the team waits for evidence that may arrive too late.
        valid_when: The proposed mitigation itself has material risk or no safe rollback boundary.
      decision_rule: Prefer the reversible exposure-reducing mitigation when it is safe, but label cause as hypothesis and use the next observation to revisit the choice.
    failure_probe:
      kind: counterexample
      prompt: If one metric improves during rollback while another dependency remains elevated, which causal sentence would you withdraw?
    evidence_check:
      basis: Mark impact, mitigation state, causal hypothesis, owner, and next observation separately; a correlated improvement is not causal proof.
      source_kind: authored_scenario
      limitation: The exercise does not establish the root cause, the rollback result, or the full user impact beyond the stated observation.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: I am confident about communicating the observed checkout impact and uncertainty, but not about database latency as the cause or the mitigation’s eventual effect.
      update_trigger: I would revise the causal claim when a dependency’s errors persist or a diagnostic contradicts the database hypothesis.
    rubric:
      facts_correct: Separates increased checkout failures from the unconfirmed database-latency hypothesis.
      assumptions_explicit: States why the active mitigation and next diagnostic are considered safe enough to continue.
      alternatives_considered: Compares continuing a reversible mitigation with waiting for causal confirmation.
      tradeoff_quality: Balances customer exposure, diagnostic clarity, and mitigation risk.
      follow_up_adaptation: Revises the update when mixed signals appear.
      certainty_calibration: Uses observed, suspected, and unknown language at the correct evidence level.
    defense_checks:
    - id: general-09-incident-update-defense-causal-language
      axis: facts
      prompt: Which words would you use to distinguish a known incident impact from
        a causal hypothesis in an update?
      best_answer: I would say ‘we observe’ or ‘known’ for the impact, ‘we suspect’
        or ‘hypothesis’ for a possible cause, and then name the check that could confirm
        or reject it.
      distractors:
      - text: I would say that database latency probably caused the incident because executives need
          one simple explanation while the rollback continues. I would use that wording as a
          practical compromise, mention that the team is checking the database, and avoid listing
          competing hypotheses that could make the update harder to follow.
        why_wrong: A simple sentence still needs calibrated certainty when the cause
          is unverified.
      - text: I would avoid mentioning any possible cause until the incident is closed and the final
          review has confirmed it. During the active response I would report only that checkout
          failures are elevated and rollback is running, then add the database finding after the
          owners and timeline are settled.
        why_wrong: A labelled hypothesis can guide investigation without being presented
          as fact.
- id: general-10-handling-unknowns
  version: 1.6.0
  target: general
  topic: handling unknowns
  difficulty: 1
  interview_stage: behavioural_probe
  prompt: What would you say if I asked about a system detail you did not know?
  context: Avoid improvising facts while keeping the conversation useful.
  best_answer: >-
    I would say I do not know that detail yet, state the assumption I need, name the first
    source or person I would check, and continue only with the portion of the decision that
    the available evidence supports. If the missing detail could change the safety boundary,
    I would pause rather than improvise.
  response_versions:
    short: >-
      I would name the detail I do not know, state the assumption, and identify the first source
      or person I would check. I would continue only with a reversible decision that remains
      safe; otherwise, I would pause.
    medium: >-
      I would say I do not know that detail yet, state the assumption I need, name the first
      source or person I would check, and continue only with the portion of the decision that
      the available evidence supports. If the missing detail could change the safety boundary,
      I would pause rather than improvise.
    deep: >-
      I would make the uncertainty explicit without abandoning the conversation. I would say
      which detail I do not know, state the assumption behind the provisional recommendation,
      and name the first source or person I would check. Before acting, I would ask whether both
      plausible cases tolerate the smallest reversible step and define a stop condition. If they
      do, I can continue with that bounded portion while verification runs; if they do not, I
      would hold the recommendation and explain the blocker. That distinction prevents a
      confident sentence from hiding an invalid premise, and I would update the decision as soon
      as the source confirms the constraint.
  distractors:
  - text: I would make a plausible guess and phrase it confidently so the conversation
      keeps moving. If the interviewer needs a precise answer later, I could qualify
      it after I have had time to look it up.
    trap: register
    why_wrong: It misses the purpose of this handling unknowns turn and gives no usable
      evidence of judgement.
  - text: I would say I do not know and stop there because any further reasoning could be wrong.
      Rather than state the assumption I am using or name a source to check, I would wait for
      someone else to supply the answer. That keeps my statement technically safe, but it gives
      the interviewer no bounded next step or way to update the claim.
    trap: precision
    why_wrong: It avoids the relationship, uncertainty, or next action the interviewer
      is testing.
  feedback:
    register: State the knowledge boundary calmly; it signals reliability rather than
      weakness.
    hedging: Use ‘I would verify’ for the next action, not a speculative technical claim.
    precision: Name the assumption, first source, and supported decision separately.
    grammar: Prefer ‘I do not know that detail yet’ to a bare ‘I do not know.’
    pragmatics: Continue the useful portion of the discussion after labelling the gap.
  rephrase:
    prompt: Rephrase your answer about the unknown detail so the provisional boundary and next verification are clear.
    goal: Keep the unknown, the reversible step, and the source or stop condition.
  follow_up:
    prompt: The interviewer asks you to decide now, before the person who knows the
      missing detail is available. What bounded recommendation can you still make?
    goal: Stay useful under uncertainty by making the assumption, reversible scope,
      and verification path explicit.
    challenge_kind: evidence
    best_answer: I would state the missing detail and make the smallest reversible recommendation
      that remains safe under both plausible cases. I would name the assumption I am
      using, identify the first source or person to check, and set a stop condition
      before expanding the decision.
    distractors:
    - text: I would fill in the missing detail with the most likely technical explanation and present the recommendation as settled. A decisive answer should reassure the interviewer, so I would choose the assumption that fits common systems, skip the source check for now, and move ahead before uncertainty makes the proposal look weak.
      why_wrong: Decisive wording cannot substitute for an unknown fact that controls
        the choice.
    - text: Until the expert returns, I would refuse to make any recommendation about the decision. Acting with an incomplete fact could expose the team to avoidable risk, so I would pause the conversation and wait for a definitive answer rather than state a bounded step, an assumption, or a stop condition.
      why_wrong: A bounded, reversible step can preserve progress while the decisive
        detail is checked.
    answer_anchors:
    - State the unknown and the assumption in use.
    - Choose the smallest reversible safe step.
    - Name the first verification source and stop condition.
  compression:
    prompt: Name the unknown, expose the assumption, identify the first source, and state the supported bounded decision.
    goal: Keep progress reversible while making clear which part of the recommendation depends on evidence that is still missing.
  language_focus:
  - register
  - pragmatics
  - precision
  feynman:
    concept: Explain why admitting an unknown can still lead to a useful provisional decision.
    explain_to: A staff interviewer who wants to see the boundary between a testable assumption and an improvised fact.
    constraint: Separate the verified absence of a system detail from the inference that a smallest reversible step is safe; name the assumption, source, owner, and stop condition that make the step testable.
    self_check: Can you state what you do not know, what both plausible cases permit, and which source could reject the recommendation?
    reasoning_check: If the expert invalidates the safe assumption, can you stop the expansion, revise the recommendation, and explain what new evidence changed your mind?
  black_box:
    symptom: The answer disguises a guess as confidence or waits indefinitely even though a bounded step could preserve progress.
    expected: The response should expose the unknown, make a reversible recommendation, and attach a concrete verification or stop condition.
    actual: I treated lack of certainty as a reason either to invent a detail or to make no decision at all.
    root_cause: I did not compare the consequence of a small reversible step with the consequence of waiting, and I left the source and stop condition implicit.
    repair: State the missing fact, choose the smallest step safe under both plausible cases, name the first source, and stop when the assumption fails.
    reasoning_error: The reasoning error is a false binary between certainty and paralysis; a bounded hypothesis must remain visibly provisional.
  recall:
    active_recall_cue: What detail is missing, what bounded step remains safe, and who or what would verify it?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain how an explicit assumption makes a provisional step safer than a guess?
    black_box_probe: If the expert invalidates your assumption, what stop condition and alternative should you inspect?
    delayed_variant:
      id: general-10-handling-unknowns-delayed-1
      prompt: The expert returns and says the missing detail invalidates the safe assumption
        you used. How would you revise the recommendation?
      changed_constraint: The newly confirmed system detail rules out the assumption
        that made the provisional recommendation safe.
      new_evidence: The domain expert clarifies a hard constraint that the initial bounded
        recommendation did not cover.
      best_answer: I would withdraw the provisional step, explain which assumption failed,
        and choose a new option that satisfies the confirmed constraint. I would preserve
        the verification habit, test the new boundary, and state that the earlier recommendation
        was conditional rather than pretend it was a mistake-free conclusion.
      distractors:
      - text: I would keep the first recommendation unchanged and explain that changing course would make me look indecisive after the team had already heard a confident proposal. Even if the expert’s detail invalidated the assumption, I would defend the original option and frame the new information as a reason to revisit it later.
        why_wrong: New evidence that invalidates its safety condition requires an explicit
          revision.
      - text: I would blame the expert for withholding the key detail and stop explaining the decision until the timing issue was resolved. Since the missing information arrived late, the earlier recommendation should stand, and I would avoid offering another option that could create further confusion for the team.
        why_wrong: The timing may explain the uncertainty, but it does not replace updating
          the recommendation responsibly.
      answer_anchors:
      - Withdraw the step whose safety assumption failed.
      - Choose an option that satisfies the confirmed constraint.
      - Explain the conditional nature of the first recommendation.
      reasoning_moves:
        preserve: Preserve the practice of naming unknowns and making the smallest reversible
          step.
        revise: Revise the provisional recommendation because the expert’s constraint
          invalidates its safety assumption.
        verify: Test the new boundary and confirm that the replacement option satisfies
          the expert’s detail.
        certainty_update: Move from provisional confidence to a narrower, evidence-backed
          recommendation after the clarification.
  sources:
  - repo: system-design-estudos
    path: reviews/day-14-interview-compression.md
    note: Relevant local interview, incident, or operational communication source.
  - repo: original
    path: english-arcade/general/handling-unknowns
    note: Original scenario and language feedback authored for this pack.
  extension:
    prompt: A staff interviewer asks how you distinguish a useful assumption from a
      guess. What would you state before proceeding?
    goal: Make uncertainty legible and actionable rather than treating all incomplete
      knowledge as equivalent.
  critical_thinking:
    problem_frame: Respond to an unknown system detail by exposing the assumption, choosing a smallest reversible step, and naming the source or stop condition before expanding the decision.
    claim_map:
      fact: The interviewer asks about a detail the candidate does not know, and the answer commits to stating the assumption and checking a source or person.
      inference: A bounded recommendation can preserve progress when it remains safe under both plausible cases.
      assumption: The missing detail does not invalidate the proposed small step and the named source can confirm it before consequences expand.
      unknown: The actual system detail, its hard constraints, the source’s availability, and the outcome of the provisional step are not known.
    comparison:
      applicable: true
      alternatives:
      - option: Make the smallest reversible recommendation safe under both plausible cases
        benefit: It preserves progress while keeping the consequence and verification boundary small.
        cost_or_risk: It may be less efficient or useful than a decision tailored to the missing detail.
        valid_when: Both cases tolerate the step and a stop condition can prevent expansion.
      - option: Hold the recommendation until the expert or first source confirms the missing detail
        benefit: It avoids acting on an invalid assumption when the consequence is difficult to reverse.
        cost_or_risk: It delays progress and may leave a safe preparatory action undone.
        valid_when: The plausible cases require different safety boundaries or the step has irreversible effects.
      decision_rule: Act provisionally only when both plausible cases are safe and verification is immediate; otherwise wait, explain the blocker, and name the source.
    failure_probe:
      kind: counterexample
      prompt: What newly confirmed constraint would make your provisional step unsafe to continue?
    evidence_check:
      basis: Check the unknown, the assumption, the reversibility of the proposed step, and the source that can confirm or reject it.
      source_kind: authored_scenario
      limitation: The exercise does not establish the missing detail, the expert’s answer, or a result from the provisional recommendation.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: I am confident about exposing uncertainty and choosing a bounded check, but not about the recommendation until the missing detail is confirmed.
      update_trigger: I would stop and revise when the expert supplies a hard constraint outside both plausible cases.
    rubric:
      facts_correct: States the unknown without inventing a system detail or result.
      assumptions_explicit: Makes the safety assumption and its source or stop condition visible.
      alternatives_considered: Compares a reversible provisional step with waiting for confirmation.
      tradeoff_quality: Balances progress against the consequence of acting on the wrong detail.
      follow_up_adaptation: Stops or revises when the expert invalidates the assumption.
      certainty_calibration: Keeps the recommendation provisional until its boundary is checked.
    defense_checks:
    - id: general-10-handling-unknowns-defense-bounded-step
      axis: certainty
      prompt: What makes an assumption safe enough for a provisional recommendation
        rather than a guess disguised as fact?
      best_answer: It should be explicit, testable, reversible in its consequences,
        and paired with a source, owner, or stop condition that can confirm or reject
        it before the decision expands.
      distractors:
      - text: An assumption is safe when it sounds likely to an experienced engineer and fits the usual behaviour of comparable systems. I would trust that professional intuition, move forward without a separate test or owner, and treat a later contradiction as an unusual exception rather than a reason to bound the recommendation.
        why_wrong: Experience can inform a hypothesis, but likelihood alone does not
          make it testable or reversible.
      - text: No assumption is acceptable in a technical recommendation, because an unknown detail can always invalidate the decision. I would wait for complete certainty before proposing even a reversible step, and I would leave the team without a temporary owner or stop condition until the expert answered.
        why_wrong: A bounded assumption can preserve progress when its consequences
          and verification path are controlled.
- id: general-11-turn-taking
  version: 1.6.0
  target: general
  topic: turn taking
  difficulty: 2
  interview_stage: behavioural_probe
  prompt: I interrupt to say that the customer cannot tolerate any downtime. How do
    you adjust?
  context: Demonstrate that you heard the new constraint before continuing the original
    answer.
  best_answer: >-
    I would thank the interviewer, restate the new no-downtime constraint, and revise the
    migration path around compatibility and rollback. I would then confirm whether
    read-your-write consistency is also required before choosing the next technical detail,
    because replica lag and routing could change whether that path is safe before I commit.
  response_versions:
    short: >-
      I would acknowledge the new no-downtime constraint, revise the migration path around
      compatibility and rollback, and ask whether read-your-write consistency is also required
      before adding technical detail.
    medium: >-
      I would thank the interviewer, restate the new no-downtime constraint, and revise the
      migration path around compatibility and rollback. I would then confirm whether
      read-your-write consistency is also required before choosing the next technical detail,
      because replica lag and routing could change whether that path is safe before I commit.
    deep: >-
      I would pause and restate the changed requirement: zero customer downtime, with
      read-your-write consistency confirmed before I choose the migration path. I would compare
      a compatibility-first sequence with any shortcut that would require a risky cutover, then
      keep rollback available and verify the affected read and write routes. The no-downtime
      constraint is explicit, but replica lag, routing, and rollback mechanics remain open until
      checked. If read-your-write is mandatory, I would add the appropriate session or routing
      boundary and measure its latency or capacity cost before claiming safety. If it is not
      mandatory, I would not smuggle it into the design. I would let the clarified requirement
      change the next detail rather than continue the original answer.
  distractors:
  - text: I would finish my prepared explanation before responding to the interruption.
      I would rather give the complete answer first, because changing direction mid-sentence
      can make the discussion confusing. I would not change the migration plan yet.
    trap: pragmatics
    why_wrong: It misses the purpose of this turn taking turn and gives no usable evidence
      of judgement.
  - text: I would apologize repeatedly and abandon the answer without proposing a revised path.
      Once the interruption exposed that my explanation was not landing, I would let the
      interviewer take over, avoid returning to the migration decision, and leave the original
      plan untouched rather than check which constraint the question had introduced.
    trap: hedging
    why_wrong: It avoids the relationship, uncertainty, or next action the interviewer
      is testing.
  feedback:
    register: Acknowledge the interruption before resuming; it makes the adaptation
      visible.
    hedging: Do not soften the no-downtime requirement into a preference.
    precision: Name compatibility, expand-and-contract, rollback, and read-your-write
      separately.
    grammar: Use ‘that changes the priority’ as a complete transition sentence.
    pragmatics: Ask one focused follow-up only after you have adapted the answer.
  rephrase:
    prompt: Rephrase the migration explanation after the interruption so zero downtime and the consistency question remain explicit.
    goal: Keep the acknowledged constraint, revised migration path, and consistency boundary.
  follow_up:
    prompt: The interviewer adds that read-your-write consistency is also mandatory.
      How would you adjust the migration explanation while showing you heard both constraints?
    goal: Demonstrate active listening by restating the constraints before revising
      the technical proposal.
    challenge_kind: alternative
    best_answer: I would say, ‘So we need zero customer downtime and read-your-write
      consistency,’ then revise the path around compatibility, routing, and a rollback
      condition that preserves both. I would ask which write and read paths must be
      covered first before claiming the migration is safe.
    distractors:
    - text: I would finish the original migration explanation so the panel can hear the complete technical story, then add read-your-write consistency as a final qualification. The requirement can be handled after the main proposal, because interrupting the sequence to redesign compatibility and routing would make the answer harder to follow.
      why_wrong: It makes the newly mandatory constraint look optional and shows that
        the interruption was not incorporated.
    - text: I would repeat that the system needs zero downtime and read-your-write consistency, using the exact wording to show that I heard the interruption. The acknowledgement would be enough for this answer, so I would keep the original migration path unchanged and let implementation details wait for a later question.
      why_wrong: Acknowledgement is necessary but not sufficient; the technical path
        must reflect the new requirement.
    answer_anchors:
    - Restate both mandatory constraints.
    - Change compatibility, routing, and rollback around them.
    - Ask which paths must be checked before claiming safety.
  compression:
    prompt: State the interruption, restate zero downtime, connect it to compatibility and rollback, and ask the focused consistency question.
    goal: Show that the problem definition changed before continuing with a migration path and its evidence boundary.
  language_focus:
  - register
  - pragmatics
  - precision
  feynman:
    concept: Explain why restating an interrupted constraint is part of the technical decision, not a conversational detour.
    explain_to: An interviewer who wants to see active listening translated into a safe migration explanation.
    constraint: Separate the verified new requirement of zero customer downtime from the inference that compatibility and rollback cover every path; name the replica-lag observation that could invalidate the migration explanation.
    self_check: Can you repeat the new constraint, say what it changes, and ask which consistency requirement the interviewer wants before choosing detail?
    reasoning_check: If an old replica can serve stale data, can you revise the path and explain which read and write routes still need evidence?
  black_box:
    symptom: The answer continues its prepared migration explanation while the interviewer’s mandatory no-downtime constraint remains unabsorbed.
    expected: The response should acknowledge the changed problem, adapt the decision boundary, and verify the path that must satisfy it.
    actual: I protected the flow of my original answer instead of protecting the newly stated customer constraint.
    root_cause: I treated interruption as a speaking-order issue and failed to recompute the migration decision around compatibility, rollback, and replica consistency.
    repair: Restate zero downtime, ask whether read-your-write is also required, and choose the next migration detail only after the affected paths are explicit.
    reasoning_error: The reasoning error is failure to update the problem definition; fluency cannot compensate for solving the old problem.
  recall:
    active_recall_cue: What new constraint did you hear, how does it change the migration, and what consistency question remains?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain how restating zero downtime changes the migration decision before you discuss consistency?
    black_box_probe: If an old replica serves stale data, which migration path no longer satisfies the constraint?
    delayed_variant:
      id: general-11-turn-taking-delayed-1
      prompt: The interviewer says a read can be served by an old replica for several
        seconds after a write. What would you change in the next explanation?
      changed_constraint: Read-your-write consistency must hold even when an old replica
        can lag after a write.
      new_evidence: The system’s replica path can return stale data during the migration
        window.
      best_answer: I would keep the no-downtime boundary but add a read-routing or session-consistency
        mechanism that avoids returning stale data after a write. I would verify the
        guarantee on the affected paths, state the latency or capacity cost, and keep
        rollback conditional on preserving both requirements.
      distractors:
      - text: I would ignore the replica lag because preserving zero downtime is the only constraint that can affect the release decision. A few seconds of stale reads would be an acceptable operational detail, so I would keep the existing routing and focus the explanation on completing the migration without interruption.
        why_wrong: The interviewer explicitly added read-your-write consistency, so
          ignoring it changes the problem.
      - text: I would promise perfect read-your-write consistency across the system while keeping the zero-downtime plan intact. There is no need to inspect which paths use replicas if the requirement is mandatory, and a confident system-wide guarantee would give the interviewer a clear answer before discussing latency or capacity.
        why_wrong: The requirement needs a bounded path and verification, not an unqualified
          system-wide promise.
      answer_anchors:
      - Preserve no downtime while adding stale-read protection.
      - Verify the affected read and write paths.
      - State latency or capacity cost before claiming the guarantee.
      reasoning_moves:
        preserve: Preserve the explicit acknowledgement of no downtime and the need
          to adapt the answer after interruption.
        revise: Revise the migration path to cover stale reads after a write.
        verify: Test the affected read and write paths under replica lag before claiming
          read-your-write safety.
        certainty_update: Increase certainty only for the tested paths, keeping the
          broader guarantee bounded by coverage.
  sources:
  - repo: system-design-estudos
    path: areas/11-operational-playbooks/playbooks/database-migration-and-backfill.md
    note: Relevant local interview, incident, or operational communication source.
  - repo: original
    path: english-arcade/general/turn-taking
    note: Original scenario and language feedback authored for this pack.
  extension:
    prompt: The interviewer interrupts twice with new constraints. How would you keep
      your response collaborative without losing the structure of the migration decision?
    goal: Combine turn-taking, acknowledgement, and technical prioritisation under changing
      requirements.
  critical_thinking:
    problem_frame: Absorb the mandatory zero-downtime constraint before continuing the migration explanation, then verify whether read-your-write consistency changes the affected paths.
    claim_map:
      fact: The interviewer interrupts with a no-downtime requirement, so I must restate it before discussing compatibility and rollback.
      inference: Acknowledging the changed constraint improves the migration decision, but compatibility and rollback are not proof that every replica path serves fresh data.
      assumption: The migration can preserve zero downtime through compatible changes and a rollback condition, and the interviewer will clarify whether read-your-write is also mandatory.
      unknown: Replica lag, read routing, write paths, rollback mechanics, and the required consistency boundary are not established by the initial interruption.
    comparison:
      applicable: false
      rejected_alternative: Continue the original migration explanation and patch in the no-downtime requirement after the technical detail is complete.
      hard_constraint: Customer downtime is explicitly forbidden, so the problem must be restated before selecting a path; any newly added consistency requirement must also be incorporated.
      decision_rule: Acknowledge the constraint, ask the focused consistency question, and choose only migration steps whose compatibility, routing, and rollback evidence cover the confirmed paths.
    failure_probe:
      kind: edge_case
      prompt: If an old replica can return stale data for several seconds, which part of the migration explanation must be withdrawn or expanded?
    evidence_check:
      basis: Verify that the restated constraints reach every read and write path; a fluent explanation is not evidence that stale replicas satisfy the requirement.
      source_kind: authored_scenario
      limitation: The exercise does not provide replica lag, routing, rollback, or read-your-write measurements.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: I am confident that the new constraint must change the problem definition, but the safe migration path remains conditional on routing and consistency evidence.
      update_trigger: I would expand or change the path when replica lag or a mandatory read-your-write requirement adds an uncovered path.
    rubric:
      facts_correct: Restates zero downtime and treats read-your-write as a question until the interviewer confirms it.
      assumptions_explicit: Names the compatibility, routing, and rollback assumptions.
      alternatives_considered: Explains why absorbing the constraint before continuing is safer than preserving the prepared answer.
      tradeoff_quality: Balances conversational flow against solving the revised migration problem.
      follow_up_adaptation: Updates the path when stale reads or a second consistency requirement appears.
      certainty_calibration: Keeps the migration claim conditional on path-level evidence.
    defense_checks:
    - id: general-11-turn-taking-defense-constraint-ack
      axis: adaptation
      prompt: What should you do before continuing an answer after the interviewer adds
        a mandatory constraint?
      best_answer: I should acknowledge and restate the constraint, explain how it changes
        the decision boundary, and then ask or verify which path must satisfy it before
        continuing.
      distractors:
      - text: I would keep my original answer so the interview retains a coherent flow and does not become distracted by a late change in requirements. If the new constraint matters, the interviewer can raise it again after I finish; preserving the prepared sequence is more important than revising the migration path mid-sentence.
        why_wrong: Flow is less important than showing that the problem definition changed.
      - text: I would stop speaking and wait for the interviewer to solve the revised problem, since adding a technical proposal before understanding every consequence could be risky. Once they supplied the migration path, I would repeat it back rather than take responsibility for adapting compatibility, routing, or rollback.
        why_wrong: Active listening should lead to an adapted, bounded answer rather
          than total withdrawal.
- id: general-12-interview-close
  version: 1.6.0
  target: general
  topic: interview close
  difficulty: 3
  interview_stage: behavioural_probe
  prompt: Before we finish, what question would you ask us and how would you follow
    up?
  context: Ask about a meaningful success condition, then connect a follow-up to the
    actual discussion.
  best_answer: >-
    I would ask what decision the person in this role must make in the first ninety days and
    how the team will know it was successful. I would then connect my follow-up to the evidence
    and trade-offs we discussed, while checking that the proposed success signal is not being
    mistaken for proof of reliability.
  response_versions:
    short: >-
      I would ask which decision this role must make in the first ninety days and what evidence
      would count as success. Then I would connect my follow-up to the interview’s trade-offs,
      not send a generic closing.
    medium: >-
      I would ask what decision the person in this role must make in the first ninety days and
      how the team will know it was successful. I would then connect my follow-up to the evidence
      and trade-offs we discussed, while checking that the proposed success signal is not being
      mistaken for proof of reliability.
    deep: >-
      At the close, I would ask which decision the person in this role must make in the first
      ninety days and what evidence the team would count as success. I would connect that
      question to the discussion—for example, a reliability signal or trade-off we already
      examined—rather than introduce a generic achievement claim. I would also ask about the
      baseline, alert semantics, user impact, and decision owner before treating the signal as
      sufficient. If the conversation has not established a technical anchor, I would use a
      broader role question instead. That lets me adapt the close to the evidence available and
      keeps a proxy, such as fewer alerts, from becoming proof of reliability.
  distractors:
  - text: I would ask about benefits and vacation first because those are the most important
      closing topics. I can learn about the work after joining, but those policies affect
      whether the role is worth accepting.
    trap: register
    why_wrong: It misses the purpose of this interview close turn and gives no usable
      evidence of judgement.
  - text: I would say I have no questions because the interview already covered everything. The
      panel has had plenty of time to explain the role, so I would thank them, avoid testing any
      remaining success condition or risk, and wait for the process to continue rather than ask
      what the person joining should accomplish first.
    trap: precision
    why_wrong: It avoids the relationship, uncertainty, or next action the interviewer
      is testing.
  feedback:
    register: Close with thoughtful professional curiosity rather than a generic thank-you.
    hedging: Use an open question instead of presuming the team’s first-ninety-day priorities.
    precision: Ask for one decision and one measure of success.
    grammar: Keep a follow-up in future tense and the interview reference in past
      tense.
    pragmatics: Connect the note to a real trade-off discussed, not a copied closing
      formula.
  rephrase:
    prompt: Rephrase your closing question so it links first-ninety-day success to the trade-off just discussed.
    goal: Keep the decision question, success evidence, and discussion-specific connection.
  follow_up:
    prompt: They say early success means reducing on-call load rather than shipping
      a product decision. What would you ask next to make the close specific?
    goal: Turn a generic closing question into a concrete inquiry about expectations,
      evidence, and the team’s operating reality.
    challenge_kind: failure
    best_answer: I would ask which on-call signal matters most, what baseline the team
      uses, and which decisions the person in the role can influence during the first
      ninety days. In my follow-up, I would connect that answer to the reliability or
      trade-off discussed rather than claiming I had already solved it.
    distractors:
    - text: I would say that reducing on-call load is straightforward and promise to fix it within my first month. I would commit to removing noisy alerts and automating the obvious checks immediately, because an early promise would show confidence even before the baseline, decision rights, and harmful events were defined.
      why_wrong: It invents certainty about the problem, baseline, and personal future
        impact.
    - text: I would use the closing question to return to salary, benefits, and the timing of the offer because the technical discussion has already finished. Those practical details determine whether the opportunity is worthwhile, so I would not spend the final minutes asking how success is measured or connecting the conversation to another engineering trade-off.
      why_wrong: It misses the opportunity to understand the role’s success condition
        and show thoughtful engagement.
    answer_anchors:
    - Ask which on-call signal and baseline define success.
    - Clarify the role’s first-ninety-day decision boundary.
    - Connect a follow-up to the discussion without promising an outcome.
  compression:
    prompt: Describe the first-ninety-day decision, its success signal, and a follow-up tied to the discussion.
    goal: Close with a question that reveals how the role is judged while keeping the success claim conditional on the team’s chosen evidence.
  language_focus:
  - register
  - pragmatics
  - precision
  feynman:
    concept: Explain why a specific success question produces a stronger interview close than a generic invitation to ask anything.
    explain_to: A candidate who wants to connect a closing question to reliability or a technical trade-off without claiming prior impact.
    constraint: Separate the verified fact that the interviewer can describe an early decision from the inference that its proposed signal represents success; name the alert-volume counterexample and the evidence needed before drawing that conclusion.
    self_check: Can you ask about the decision, the success signal, and the team’s evidence without implying that a lower alert count is automatically better?
    reasoning_check: If alert volume falls but incidents or operator effort do not improve, can you update the question and keep the close respectful and specific?
  black_box:
    symptom: The closing question sounds thoughtful but accepts a success proxy without checking what it measures or how it could fail.
    expected: The response should ask for the decision and success evidence, then connect the closing question to the interview’s actual trade-off.
    actual: I treated an available signal such as alert volume as proof of reliability and used a generic closing question to avoid testing it.
    root_cause: I confused observability of a proxy with validity of the outcome and did not ask who can influence the decision or what companion evidence matters.
    repair: Ask what decision matters in the first ninety days, how the team validates success, and which evidence would distinguish fewer alerts from suppressed detection.
    reasoning_error: The reasoning error is proxy overconfidence; the repair is a specific question plus a counterexample and evidence request.
  recall:
    active_recall_cue: Which first-ninety-day decision would you ask about, and what evidence would make its success meaningful?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain how a first-ninety-day question tests whether alert volume is a valid success signal?
    black_box_probe: If alert volume drops without less user harm or operator effort, which success assumption failed?
    delayed_variant:
      id: general-12-interview-close-delayed-1
      prompt: The interviewer says the signal is alert volume, but the team has not
        agreed whether fewer alerts means better reliability. How would you close now?
      changed_constraint: Alert volume is available, but the team has not validated
        it as a sufficient measure of reliability improvement.
      new_evidence: The interviewer distinguishes an observable alert count from the
        broader reliability outcome the team cares about.
      best_answer: I would ask what harmful events or operator effort should be checked
        alongside alert volume before treating it as success. I would say the role’s
        first step may be defining a useful baseline, then connect my follow-up to that
        measurement question instead of presenting fewer alerts as proof of reliability.
      distractors:
      - text: I would call fewer alerts an improvement as soon as the count declined and use that reduction as the headline success measure. A lower number means engineers receive fewer interruptions, so I would treat the alert system as healthier without checking whether suppression hid incidents or shifted effort elsewhere.
        why_wrong: A lower count can reflect suppression or missing detection rather
          than better reliability.
      - text: I would say that no success measure is reliable until every reliability signal agrees and the team can measure the system perfectly. Until then, I would avoid defining a baseline or naming companion evidence, because a partial metric could create false confidence about the effect of fewer alerts.
        why_wrong: The team can define a useful baseline and pair signals without waiting
          for perfect measurement.
      answer_anchors:
      - Question alert volume as a proxy, not as proof.
      - Pair it with harmful events or operator effort.
      - Close around a baseline question and a bounded first step.
      reasoning_moves:
        preserve: Preserve the practice of asking about early decisions and how success
          will be observed.
        revise: Revise alert volume from a sufficient outcome to one signal that needs
          context.
        verify: Ask which harmful events and operator costs should accompany the alert
          baseline.
        certainty_update: Keep interest in the reliability problem while lowering certainty
          that one count represents success.
  sources:
  - repo: system-design-estudos
    path: reviews/day-14-interview-compression.md
    note: Relevant local interview, incident, or operational communication source.
  - repo: original
    path: english-arcade/general/interview-close
    note: Original scenario and language feedback authored for this pack.
  extension:
    prompt: The recruiter asks for one final question that works for both a technical
      interviewer and a stakeholder. What would you ask?
    goal: Close with a question that reveals decision ownership and measurable expectations
      across audiences.
  critical_thinking:
    problem_frame: Close by asking which first-ninety-day decision matters, how the team judges it, and how the answer connects to the discussion without claiming prior impact.
    claim_map:
      fact: The interviewer invites a final question, and I can ask about an early decision and its success condition before connecting the question to the interview discussion.
      inference: A specific decision-and-evidence question can reveal role expectations more usefully than a generic closing question.
      assumption: The interviewer can name a meaningful decision and a success signal, and the signal is not automatically sufficient evidence of reliability.
      unknown: The decision owner, baseline, alert semantics, user impact, and team’s definition of success are not known at the close.
    comparison:
      applicable: true
      alternatives:
      - option: Ask which first-ninety-day decision matters and what evidence would count as success
        benefit: It reveals an actionable expectation and gives a concrete bridge to the technical discussion.
        cost_or_risk: It may expose disagreement about the success measure or require a longer answer at the end.
        valid_when: The interviewer has discussed a role decision, reliability concern, or trade-off that can anchor the closing question.
      - option: Ask a broad team or role question and leave the close socially open
        benefit: It is easy to answer and keeps the final exchange low pressure.
        cost_or_risk: It may reveal less about decision ownership, evidence, or remaining risk.
        valid_when: The discussion has not established a technical topic or the interviewer signals that a broad close is more appropriate.
      decision_rule: Prefer the specific decision-and-evidence question when the conversation supplies an anchor; use the broad question when context is still missing, and test any proxy before calling it success.
    failure_probe:
      kind: counterexample
      prompt: If alert volume falls but incidents or operator effort do not, what would you ask before accepting it as a reliability improvement?
    evidence_check:
      basis: Separate the interviewer’s stated success signal from the evidence needed to interpret it; alert volume alone does not establish reliability improvement.
      source_kind: authored_scenario
      limitation: The exercise does not establish a baseline, a causal result, or which person can influence the first-ninety-day decision.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: I am confident that a specific closing question is useful, but not that the proposed signal represents success until its baseline and companion evidence are clear.
      update_trigger: I would revise the closing question when the team distinguishes an observable proxy from user impact, incidents, or operator effort.
    rubric:
      facts_correct: Asks about a first-ninety-day decision and does not treat alert volume as a sufficient reliability result.
      assumptions_explicit: Names the assumption that a proposed success signal needs interpretation.
      alternatives_considered: Compares a specific decision-and-evidence close with a broad role question.
      tradeoff_quality: Balances useful role information, conversational burden, and proxy risk.
      follow_up_adaptation: Challenges the success signal when alert volume and reliability diverge.
      certainty_calibration: Keeps the close exploratory rather than claiming prior impact or a guaranteed outcome.
    defense_checks:
    - id: general-12-interview-close-defense-success-proxy
      axis: certainty
      prompt: Why should you question alert volume before treating a reduction as proof
        of better reliability?
      best_answer: Alerts can fall because detection was suppressed or because harmful
        events genuinely decreased, so I would pair the count with incidents, user impact,
        and operator effort before claiming improvement.
      distractors:
      - text: A lower alert count is always better because fewer pages mean happier engineers and a calmer on-call rotation. I would treat the reduction as proof that reliability improved and move on without checking whether detection was suppressed, incidents changed, or operators spent more effort elsewhere.
        why_wrong: Suppressed detection can lower pages while making reliability worse.
      - text: Alert volume is useless in a success discussion because the number can fluctuate for too many reasons. I would remove it from the close, avoid pairing it with incidents or user impact, and choose a different measure only after the team had found a perfect reliability signal.
        why_wrong: It can be a useful signal when its meaning and companion evidence
          are explicit.
