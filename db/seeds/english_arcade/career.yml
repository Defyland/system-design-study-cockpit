---
contract_version: 1.6.0
target:
  key: career
  label: Career narrative
  blurb: Honest career stories adapted to the listener.
  focus_areas:
  - real experience
  - evidence boundaries
  - failure modes
  - interview adaptation
  simulation:
    minutes: 45
    structure:
    - label: Narrative
      minutes: 15
    - label: Deep dive
      minutes: 20
    - label: Reflection
      minutes: 10
  critical_thinking:
    learner_prompts:
      evidence_ledger: For career presentation, record whether each claim about verified
        contribution, result evidence, assumption, and safe narrative boundary is
        a verified fact, an inference, an assumption, or an unknown before you defend
        it.
      problem_frame: Frame every career presentation answer with the actor, requirement,
        constraint, success condition, and unanswered question that could change the
        decision.
      comparison: When career presentation offers a real choice, compare two options
        by benefit, cost or risk, valid-when condition, and an explicit decision rule.
      failure_probe: Ask which counterexample, edge case, or failure mode could break
        the career presentation recommendation, then state the smallest test or containment
        step.
      certainty_review: 'Calibrate certainty in career presentation: name the evidence,
        separate correlation from causality, and say what new observation would make
        you revise the answer.'
    rubric:
      facts_correct: Names the verified contribution, result evidence, assumption,
        and safe narrative boundary facts without smuggling in a result or capability
        that the prompt does not establish.
      assumptions_explicit: Labels the career presentation premise that is still assumed
        and asks the smallest clarifying question that matters.
      alternatives_considered: Considers a credible alternative for career presentation,
        or explains the hard constraint that makes comparison a false equivalence.
      tradeoff_quality: Connects the career presentation choice to a benefit, a cost
        or risk, and the condition under which another choice wins.
      follow_up_adaptation: Responds to an adversarial career presentation follow-up
        by changing the claim or evidence boundary rather than repeating a memorised
        answer.
      certainty_calibration: Uses high, medium, or low certainty deliberately and
        names the evidence that would update the career presentation recommendation.
cards:
- id: career-card-framing
  front: What is the career story spine?
  back: A recurring backend decision, one relevant example, and a truthful evidence
    boundary.
  box: 1
  source:
    repo: system-design-estudos
    path: interview/story-bank/01-ruby-rails-backend-story-bank.md
    note: Career story source.
  critical_thinking:
    cue: What is the career story spine? Before answering, separate the stated fact
      from your assumption and name one condition that could change it.
    check: For this career presentation card, can you compare two options, name one
      failure mode, and state what evidence would update the recommendation?
- id: career-card-care
  front: What does CARE mean here?
  back: Context, Actions, Result, Evaluate; close with what you learned or would change.
  box: 2
  source:
    repo: original
    path: english-arcade/career/care
    note: Defined curriculum variant.
  critical_thinking:
    cue: What does CARE mean here? Before answering, separate the stated fact from
      your assumption and name one condition that could change it.
    check: For this career presentation card, can you compare two options, name one
      failure mode, and state what evidence would update the recommendation?
- id: career-card-boundary
  front: What needs confirmation?
  back: Ownership, metrics, and mechanisms when the referenced resume PDF was not found
    in the searched workspace as of 2026-08-25.
  box: 2
  source:
    repo: system-design-estudos
    path: interview/story-bank/01-ruby-rails-backend-story-bank.md
    note: Evidence boundary source.
  critical_thinking:
    cue: What needs confirmation? Before answering, separate the stated fact from
      your assumption and name one condition that could change it.
    check: For this career presentation card, can you compare two options, name one
      failure mode, and state what evidence would update the recommendation?
items:
- id: career-01-a-60-to-90-second-introduction
  version: 1.6.0
  target: career
  topic: a 60 to 90 second introduction
  difficulty: 2
  interview_stage: behavioural_probe
  prompt: Tell me about yourself in a minute or so.
  context: The interviewer is opening a backend loop and wants a coherent introduction,
    not a chronology.
  best_answer: 'My professional background is strongest in Rails and backend work.
    My technical thread is clear: external dependencies need timeouts and retry rules,
    writes need duplicate protection, and sensitive access needs deliberate authorization.
    Separately, I can discuss executable Go and Elixir portfolio implementations,
    including designs such as outbox relays, reconciliation, and supervised workers;
    I present them as portfolio evidence, not employer experience or proof of production
    operation. I am looking for a backend role where I can deepen correctness and
    reliability while working closely enough with product and other engineers to explain
    important trade-offs more clearly. If useful, I can begin with the Rails/backend
    narrative or discuss an inspectable portfolio example.'
  response_versions:
    short: >-
      My background is strongest in Rails and backend work. I care about timeouts,
      duplicate-safe writes, and deliberate authorization. I can also discuss Go and
      Elixir portfolio code, while keeping its ownership and operating context separate
      from my professional experience.
    medium: >-
      My professional background is strongest in Rails and backend work. My technical
      thread is clear: external dependencies need timeouts and retry rules, writes need
      duplicate protection, and sensitive access needs deliberate authorization.
      Separately, I can discuss executable Go and Elixir portfolio implementations,
      including designs such as outbox relays, reconciliation, and supervised workers;
      I present them as portfolio evidence, not employer experience or proof of production
      operation. I am looking for a backend role where I can deepen correctness and
      reliability while working closely enough with product and other engineers to explain
      important trade-offs more clearly. If useful, I can begin with the Rails/backend
      narrative or discuss an inspectable portfolio example.
    deep: >-
      My professional background is strongest in Rails and backend work, so I usually
      start with the boundaries that make a system easier to reason about: timeouts and
      retry rules around external dependencies, duplicate protection around writes, and
      deliberate authorization for sensitive access. I can then use executable Go and
      Elixir portfolio implementations as inspectable examples of ideas such as outbox
      relays, reconciliation, and supervised workers. I keep that evidence separate from
      employer experience and do not infer production operation, ownership, or a measured
      result from code alone. For a backend role, I would ask whether the panel wants the
      Rails narrative first or one portfolio mechanism in depth, then follow the chosen
      failure path and name what would need confirmation.
  distractors:
  - text: I’ve worked with Rails, Go, and Elixir across integrations, asynchronous
      processing, and highly data-intensive services, and I enjoy cross-functional
      backend challenges. When I join a team, I systematically map request lifecycles,
      dependency behaviours, persistence constraints, observability conventions, deployment
      workflows, incident communication, authorization assumptions, and organization-specific
      architectural terminology before carefully deciding where I can contribute expeditiously.
    trap: precision
    why_wrong: A hiring panel still has no through-line to probe, so this answer makes
      the opening sound like a technology inventory.
  - text: I started in web development and would walk through every project chronologically,
      covering technologies, dependencies, databases, deployment constraints, performance,
      authorization, integration failures, observability, operational terminology,
      implementation decisions, alternative architectures, transition rationale, persistence
      trade-offs, recovery procedures, and unresolved questions. I would finish the chronology
      before narrowing to the role, leaving the interviewer to choose relevance.
    trap: pragmatics
    why_wrong: The interviewer asked for a focused introduction; offering an unfiltered
      chronology spends the minute before establishing relevance.
  sources:
  - repo: backend-challenges
    path: system-design-estudos/interview/story-bank/01-ruby-rails-backend-story-bank.md
    note: Secondary Rails career transcription and evidence boundary.
  - repo: backend-challenges
    path: fulfillhub-go-commerce-platform/README.md
    note: Executable Go portfolio framing.
  - repo: backend-challenges
    path: pulseops-elixir-job-platform/README.md
    note: Executable Elixir portfolio framing.
  - repo: original
    path: english-arcade/career/1
    note: Authored interview-language coaching.
  provenance:
    evidence_class: resume_derived
    project: Rails career narrative plus executable portfolios
    repository: backend-challenges
    files:
    - path: system-design-estudos/interview/story-bank/01-ruby-rails-backend-story-bank.md
      commit: 716a7d9
      claim: >-
        The story bank is a secondary résumé transcription and warns that inferred
        implementation detail needs confirmation; it mentions the referenced résumé PDF.
    - path: fulfillhub-go-commerce-platform/README.md
      commit: 3bc2b641d17bd93ba151ff78441d9bf190f0fc07
      claim: The README frames FulfillHub as an executable Go R&D and portfolio project
        rather than employer work.
    - path: pulseops-elixir-job-platform/README.md
      commit: f1330d0588d1b46253abb18a3c4c1ec6869152b6
      claim: The README frames PulseOps as an executable Elixir portfolio architecture
        slice.
    verified_claims:
    - The Rails narrative is secondary résumé material with an explicit inference warning;
      the source mentions the referenced résumé PDF.
    - FulfillHub is inspectable executable Go portfolio evidence.
    - PulseOps is inspectable executable Elixir portfolio evidence.
    confirmation_required:
    - 'Inventory observation (workspace search checked 2026-08-25), not a claim made by the source: the referenced resume PDF is absent.'
    - Confirm ownership, metrics, and mechanisms for professional material, plus authorship
      and operation context for the portfolio repositories.
    safe_interview_version: My background is strongest in Rails backend work; I can separately
      discuss executable Go and Elixir portfolio implementations, while keeping ownership and
      operation context conditional until confirmed.
    confidentiality:
      level: medium
      note: Keep employer details separate from public portfolio evidence and avoid
        protected systems or metrics.
  feedback:
    register: 'For this opener, sound grounded rather than promotional: name the Rails
      backbone before mentioning adjacent technologies.'
    hedging: 'Reserve the caveat for the evidence boundary: call Go and Elixir portfolios,
      while stating your backend interests plainly.'
    precision: Replace a broad technology list with the concrete thread of boundaries,
      reliability, and deliberate authorization.
    grammar: Use present simple for the current focus (“is strongest”) and a clear
      sequence of verbs for the career progression.
    pragmatics: Close by naming the kind of backend role you want, so the panel has
      a useful direction for its first follow-up.
  rephrase:
    prompt: Introduce yourself to a product lead who cares about predictable delivery.
    goal: Translate the technical through-line into the reliability concerns that
      partner sees.
  follow_up:
    prompt: Suppose the panel asks which Rails reliability work you personally owned rather
      than which portfolio designs you can discuss. Which part of your introduction can you
      defend, and where would you narrow the claim?
    goal: Separate confirmed professional experience from portfolio evidence and narrow any
      ownership or outcome claim you cannot defend.
    challenge_kind: evidence
    best_answer: >-
      I can defend Rails and backend as my professional focus, while keeping Go and Elixir
      examples labelled as portfolio work rather than employer experience. If I cannot
      substantiate ownership or an outcome, I would narrow the sentence, say what I can
      explain about the design, and invite a question that tests it. That keeps the opening
      useful without turning an inspectable project into a claim about production impact.
    distractors:
    - text: I personally delivered the Rails services as well as the Go and Elixir
        systems, and those changes improved reliability across integrations and
        background work. I would describe the retry rules, outbox flow, and
        reconciliation checks as production decisions I owned, then attach a concrete
        reliability result to each one.
      why_wrong: It asserts ownership and outcomes that the answer has not established;
        confidence cannot turn portfolio evidence into employer experience.
    - text: My opening would focus only on my interest in backend reliability,
        collaboration, and learning. I would omit Rails examples and any reference to
        Go or Elixir so the panel would not need to distinguish professional experience
        from portfolio work during the first conversation. I would wait for a later
        technical question before offering any concrete evidence.
      why_wrong: The supported Rails focus and portfolio classification remain useful; the
        correct repair is to narrow unsupported claims, not erase relevant context.
    answer_anchors:
    - Rails/backend is the professional focus I can defend in this opening.
    - Go and Elixir examples are executable portfolio evidence, not employer experience.
    - Unverified ownership and metrics stay qualified or become a confirmation question.
  compression:
    prompt: Give the introduction in two sentences without naming every technology.
    goal: Keep the focus, evidence split, and role direction.
  language_focus:
  - precision
  - pragmatics
  - hedging
  feynman:
    concept: Choosing an honest opening lane when professional and portfolio evidence differ.
    explain_to: A peer preparing to introduce Rails experience alongside Go and Elixir study work.
    constraint: Connect each theme to a defensible boundary and do not add ownership or impact
      that the available evidence does not establish.
    self_check: Could the listener tell which claim is professional background, which is portfolio
      evidence, and what question would change the framing?
    reasoning_check: Can you compare the two audience lanes, identify a case where the portfolio
      should come first, and explain what evidence would make that change valid?
  black_box:
    symptom: The opening lists Rails, Go, and Elixir without telling the listener which
      evidence class supports each claim.
    expected: The answer gives a professional direction, labels portfolio or study evidence,
      and leaves the panel with a useful next question.
    actual: The listener must infer whether an implementation detail is employer experience,
      inspectable code, or an unsupported impact statement.
    root_cause: The rehearsal optimised for technology coverage instead of choosing an audience
      and an evidence boundary.
    repair: Lead with Rails/backend background, label the portfolio lane, and replace any
      unsupported result with a question or a narrower claim.
    reasoning_error: If the opening failed, identify whether the problem was a fact, audience
      assumption, alternative framing, evidence boundary, or certainty calibration before repairing it.
  recall:
    active_recall_cue: What is the honest first sentence for a 60 to 90 second introduction?
    feynman_prompt: Can you explain the decision without an unsupported metric?
    black_box_probe: Did you answer this interviewer rather than a generic one?
    leitner_start_box: 1
    mastery_threshold: 8
    delayed_variant:
      id: career-01-a-60-to-90-second-introduction-delayed-1
      prompt: In a recruiter screen, you learn that the audience wants only verified
        professional experience and gives you 45 seconds. How would you change the opening
        while keeping its technical thread?
      changed_constraint: The opening must fit 45 seconds and stay within verified professional
        experience rather than relying on portfolio outcomes.
      new_evidence: The recruiter clarifies that this audience will assess professional
        experience only and has limited time for the introduction.
      best_answer: I would keep the Rails and backend focus, state one engineering boundary
        I can defend, and leave the Go and Elixir portfolio work for a later technical
        request. I would not attach a metric or ownership claim that I cannot substantiate;
        I would say what I can support, invite a question about the relevant work, and keep
        my certainty measured until the professional detail is confirmed.
      distractors:
      - text: I would repeat the Go and Elixir examples as part of my professional
          history and describe the outbox relay, reconciliation flow, and supervised
          worker as systems I ran for users. I would attach the strongest reliability
          result to that story and keep the ownership language firm, since the recruiter
          already heard the examples in the first conversation.
        why_wrong: Repetition does not satisfy the new evidence boundary or establish
          professional ownership.
      - text: I would lead with a precise employer metric, such as a named reduction in
          failed requests from retry and authorization changes, and use that number to
          make the shorter introduction sound concrete. I would present the result as
          my own work and move directly to the next point rather than spend the limited
          time on portfolio labels or qualification.
        why_wrong: A short answer still needs an honest evidence boundary; fluency cannot
          justify adding an outcome.
      answer_anchors:
      - Keep the supported Rails focus but remove portfolio evidence from an employer-only
        opening.
      - Ask for a verified employer example before naming ownership or outcomes.
      - Keep certainty measured when the audience and available professional detail are limited.
      reasoning_moves:
        preserve: Keep the Rails/backend focus and one engineering boundary that can be defended.
        revise: Remove portfolio examples when employer-only evidence is the stated interview contract.
        verify: Confirm the relevant professional example before naming ownership or outcomes.
        certainty_update: Keep certainty measured until the audience and professional detail are confirmed.
  extension:
    prompt: The interviewer says your opening sounds careful but asks which audience should
      hear the portfolio examples first. How would you choose the next detail without turning
      a project description into a claim about professional impact?
    goal: Defend an audience-aware sequence while keeping contribution, evidence, and impact
      clearly separate.
  critical_thinking:
    problem_frame: Frame the opening for an interviewer who needs a credible professional
      direction, a relevant next question, and an honest boundary around ownership and outcomes.
    claim_map:
      fact: My confirmable professional background is Rails/backend work; Go and Elixir work
        are separately labelled portfolio or study evidence.
      inference: A focused opening can help the interviewer choose a useful follow-up, but
        that does not establish personal ownership or business impact for every example.
      assumption: The audience may value employer narrative more than implementation detail;
        ask which evidence it needs before choosing the second sentence.
      unknown: The ownership, metric, and audience threshold that would justify a stronger
        personal claim remain unresolved.
    comparison:
      applicable: true
      alternatives:
      - option: Lead with the Rails professional narrative.
        benefit: It is the clearest route to role relevance when the panel is assessing verified
          professional background and wants a short, defensible opening.
        cost_or_risk: It may postpone concrete implementation detail that an engineering interviewer
          wants to inspect.
        valid_when: The interviewer is deciding professional fit or asks for employer examples first.
      - option: Lead with a clearly labelled Go or Elixir portfolio example.
        benefit: It gives an engineer an inspectable design boundary when a concrete implementation
          discussion is more useful than a broad career summary.
        cost_or_risk: It can blur the distinction between portfolio evidence and employer experience
          if the scope is not named explicitly.
        valid_when: The interviewer requests code-level evidence and accepts portfolio or study work.
      decision_rule: Start with the Rails professional narrative for a role-fit opening; switch to a
        labelled portfolio example only when the audience asks for inspectable implementation detail.
    failure_probe:
      kind: counterexample
      prompt: If the interviewer says the role has no Rails ownership and needs a concrete
        Go or Elixir design discussion, what part of your opening would you change and what
        claim would you still refuse to make?
    evidence_check:
      basis: Compare the opening with the career evidence and the stated interview audience;
        label professional background, portfolio scope, and any impact statement separately.
      source_kind: user_material
      limitation: This exercise can test audience-aware framing, but it cannot prove ownership,
        a business result, or a universal rule about which opening wins.
      checked_on: '2026-08-25'
    certainty:
      level: low
      rationale: Certainty is low because the safe professional focus is clear but the audience,
        ownership boundary, and impact evidence for a deeper claim are not fully established.
      update_trigger: Raise or lower confidence when the interviewer confirms the target audience,
        a specific professional example, or evidence that changes the ownership or impact boundary.
    rubric:
      facts_correct: Separates the supported Rails focus and portfolio classification from
        unverified ownership or impact.
      assumptions_explicit: Names the audience and evidence assumptions that determine which
        example belongs in the opening.
      alternatives_considered: Compares a Rails professional opening with a labelled portfolio
        opening and states when each is valid.
      tradeoff_quality: Explains relevance gained, detail delayed, and the risk of blurring evidence
        classes when choosing the opening lane.
      follow_up_adaptation: Changes the audience-specific framing when the interviewer requests a
        different kind of evidence without inventing a result.
      certainty_calibration: Keeps certainty low until ownership, impact, and audience requirements
        are confirmed, then names the observation that would update the answer.
    defense_checks:
    - id: career-01-a-60-to-90-second-introduction-defense-audience-switch
      axis: adaptation
      prompt: If the interviewer changes from a recruiter fit question to an engineering deep dive,
        what would you change in the next sentence and what boundary would remain?
      best_answer: I would move from role direction to one labelled implementation example, while
        keeping the distinction between inspectable portfolio evidence and verified professional impact.
      distractors:
      - text: I would keep the recruiter sentence unchanged because changing audience emphasis
          would make the narrative inconsistent.
        why_wrong: A strong answer adapts its depth while preserving the same evidence boundary.
      - text: I would present the portfolio implementation as proof of professional production
          impact so the engineering discussion sounds more senior.
        why_wrong: More technical detail does not establish ownership or a business outcome.
- id: career-02-a-recruiter-introduction
  version: 1.6.0
  target: career
  topic: a recruiter introduction
  difficulty: 3
  interview_stage: behavioural_probe
  prompt: Could you give me the short version for a recruiter?
  context: The listener needs direction and motivation before deciding whether a technical
    screen is appropriate.
  best_answer: My professional background is centered on Rails and backend work, and
    I am looking for a role where reliability, clear ownership, and collaboration with
    product matter. I would like to understand which of those concerns is most important
    for this opening and how the team makes that priority visible to engineers.
  response_versions:
    short: >-
      My background is Rails and backend work, and I am looking for reliability, clear
      ownership, and collaboration with product. I would ask which concern matters most in
      this role and how the team makes it visible to engineers.
    medium: >-
      My professional background is centered on Rails and backend work, and I am looking
      for a role where reliability, clear ownership, and collaboration with product
      matter. I would like to understand which of those concerns is most important for this
      opening and how the team makes that priority visible to engineers.
    deep: >-
      My professional background is centered on Rails and backend work, and I am looking
      for a role where reliability, clear ownership, and collaboration with product are
      real parts of the work. For technical depth, I can discuss a concrete backend
      decision at the level the panel needs, while keeping ownership and operating results
      conditional until confirmed. Before calling the opening a fit, I would ask which
      decisions engineers own, how reliability work is prioritized, and how product feedback
      reaches the team. If the role turns out to be mainly ticket throughput, I would keep
      the fit conditional; if it includes meaningful backend improvement and a clear learning
      path, I would stay engaged. That conclusion depends on the recruiter’s answers, not
      the title alone.
  distractors:
  - text: I’m open to any backend role and mainly want a fresh challenge. I have used
      several backend tools, learn unfamiliar systems quickly, and would be happy to
      see where my background fits after I know more about the stack.
    trap: precision
    why_wrong: A recruiter cannot match this to the opening, so the response provides
      no reason to advance the candidate to a technical screen.
  - text: My experience is technical, so I would save why I’m interested until I meet
      an engineer. For now, I can give a technical overview, mention the languages I
      know, and wait until a later round to discuss the kind of work I want.
    trap: pragmatics
    why_wrong: The recruiter is screening motivation and direction now; withholding
      both makes a relevant candidate appear unprepared for the conversation.
  sources:
  - repo: system-design-estudos
    path: interview/story-bank/01-ruby-rails-backend-story-bank.md
    note: Resume-derived career coaching.
  - repo: original
    path: english-arcade/career/2
    note: Authored interview-language coaching.
  provenance:
    evidence_class: resume_derived
    project: Backend career narrative
    repository: system-design-estudos
    files:
    - path: interview/story-bank/01-ruby-rails-backend-story-bank.md
      commit: 716a7d9
      claim: The story bank contains an Evidence Boundary section that lists Rails,
        databases, queues, security, and distributed-backend themes as resume-backed
        material.
    verified_claims:
    - The story bank contains an Evidence Boundary section that lists Rails, databases,
      queues, security, and distributed-backend themes as resume-backed material.
    confirmation_required:
    - 'Inventory observation as of 2026-08-25: the referenced resume PDF is absent from the searched workspace; that does not establish that it is unavailable elsewhere.'
    - Confirm ownership, metrics, and mechanisms before using role-specific detail.
    safe_interview_version: I am looking for backend work where reliability, ownership,
      and clear communication matter, and I would like to learn which of those is most
      important to this team.
    confidentiality:
      level: medium
      note: Keep credentials, sensitive names, payloads, and nonpublic operational details
        out of the answer.
  feedback:
    register: Use the plain language of a recruiter conversation—“backend-focused” and
      “reliability”—instead of a dense architecture summary.
    hedging: Do not hedge the job preferences; qualify only the Rails evidence when
      exact professional detail would need confirmation.
    precision: State the three fit signals—reliability, ownership, and product collaboration—before
      asking what matters most in this opening.
    grammar: Keep the parallel noun phrases in “reliability, clear ownership, and collaboration
      with product” so the pitch is easy to scan.
    pragmatics: Offer one concise question at the end; it lets the recruiter redirect
      rather than forcing a technical deep dive.
  rephrase:
    prompt: Answer a recruiter who asks what would make you stay interested after the
      first call.
    goal: Keep the role criteria visible without pretending to know this team already.
  follow_up:
    prompt: What would you ask if the recruiter says the role is mostly platform maintenance,
      and how would that answer change your interest?
    goal: Test the role boundary before presenting a confident fit claim.
    challenge_kind: alternative
    best_answer: I would ask whether maintenance means improving reliability, reducing
      operational toil, or mainly preserving existing behaviour. If the role offers
      meaningful ownership of those decisions, I would keep my interest in Rails and
      backend work; if it is only ticket throughput, I would say that the fit is less
      clear and ask what growth is expected.
    distractors:
    - text: I would accept the role immediately and treat routine upgrades, incident
        fixes, feature requests, and reliability changes as interchangeable backend
        work. The specific ownership boundary would matter less than getting into a
        platform team, and I would expect interesting decisions to emerge once I had
        learned the codebase.
      why_wrong: It treats different responsibilities as equivalent and avoids asking
        what decisions the role actually owns.
    - text: I would decline as soon as I heard the word maintenance, because a serious
        backend role should be about building new services rather than keeping an
        existing platform healthy. I would assume routine fixes leave no room for
        reliability decisions, ownership, or collaboration with product, so there would
        be little value in learning how the team prioritises that work. I would keep
        searching for a role whose description promises new development.
      why_wrong: It assumes the work is low-value before clarifying its scope, constraints,
        and learning opportunity.
    answer_anchors:
    - Clarify what platform maintenance actually includes.
    - Keep interest conditional on meaningful backend ownership.
    - Ask about growth and decision scope before claiming fit.
  compression:
    prompt: Give a twenty-second version that leaves room for the recruiter to respond.
    goal: State direction, evidence type, and one fit question.
  language_focus:
  - precision
  - pragmatics
  - hedging
  feynman:
    concept: Testing role fit before promising enthusiasm.
    explain_to: A friend preparing for a recruiter call.
    constraint: Explain the difference between a role label and the decisions the role
      actually owns.
    self_check: Could the listener name the question that separates valuable maintenance
      from routine ticket work?
    reasoning_check: Can you compare two maintenance scopes, identify the assumption
      behind your preference, and update your interest when the scope changes?
  black_box:
    symptom: The recruiter hears either unconditional enthusiasm or an instant rejection.
    expected: The answer should identify the role decision that matters and ask a focused
      question.
    actual: The candidate treats platform maintenance as one uniform category.
    root_cause: The response judged the title instead of the ownership, learning, and
      collaboration boundaries.
    repair: Name the decision scope, ask how priorities are set, and make interest conditional
      on the answer.
    reasoning_error: Classify the mistake as an unsupported fit claim, hidden role assumption,
      false alternative, or overconfident update.
  recall:
    active_recall_cue: What is the honest first sentence for a recruiter introduction?
    feynman_prompt: Can you explain which maintenance responsibilities would change
      your interest and why?
    black_box_probe: Did you test the role scope before calling it a fit?
    leitner_start_box: 1
    mastery_threshold: 8
    delayed_variant:
      id: career-02-a-recruiter-introduction-delayed-1
      prompt: The recruiter later explains that the team owns reliability improvements
        but has little product contact. How would you revise the short introduction
        and what would you still need to learn?
      changed_constraint: The role has backend reliability ownership but limited product
        collaboration.
      new_evidence: The recruiter clarifies that the team improves an existing platform
        and rarely works directly with product.
      best_answer: I would keep my interest in backend reliability and clear ownership,
        but stop presenting product collaboration as a guaranteed part of the role.
        I would ask how priorities are set and how engineers see the effect of their
        changes. My confidence in the fit would rise for the technical scope and remain
        open on the collaboration model.
      distractors:
      - text: I would repeat that I am looking for reliability, clear ownership, and close
          product partnership, then describe the role as if those priorities were already
          part of the job. I would keep using the original examples about backend
          improvement and say that the team’s collaboration model would become clear
          after I joined. The absence of product partnership in the description would not
          change the pitch.
        why_wrong: It ignores new evidence and replaces the actual collaboration model
          with a preferred one.
      - text: Reliability would be enough for me to call the role a perfect fit, even if
          the team rarely works with product. I would say that dependable systems matter
          more than communication and trust strong technical work to compensate for any
          mismatch. I would accept before asking how priorities are set or how engineers
          receive product feedback.
        why_wrong: It invents certainty and creates a false hierarchy instead of checking
          how this team works.
      answer_anchors:
      - Keep backend reliability interest while qualifying product collaboration.
      - Ask how priorities and effects are made visible.
      - Update fit confidence separately for technical scope and collaboration.
      reasoning_moves:
        preserve: Keep the direct interest in backend reliability and clear technical
          ownership.
        revise: Remove the assumption that product collaboration is a central part of
          this role.
        verify: Ask how priorities are set and how engineers observe the effect of maintenance
          work.
        certainty_update: Increase confidence in technical fit while leaving the collaboration
          fit conditional.
  extension:
    prompt: The recruiter asks for one sentence that would make the role worth a technical
      screen. What would you say, and what condition would make you withdraw it?
    goal: Turn a recruiter summary into a conditional, evidence-aware fit statement.
  critical_thinking:
    problem_frame: A recruiter needs a direction signal while the candidate still lacks
      the team’s actual maintenance scope, ownership boundary, and collaboration model.
    claim_map:
      fact: The safe professional signal is interest in Rails and backend work with
        clear ownership.
      inference: Platform maintenance may include meaningful reliability decisions,
        but the title alone does not establish that.
      assumption: The candidate assumes product collaboration is part of the role; ask
        how priorities and feedback travel.
      unknown: The decision rights, learning path, and contact with product remain unknown.
    comparison:
      applicable: true
      alternatives:
      - option: Advance the conversation when maintenance includes reliability ownership.
        benefit: It keeps the recruiter discussion tied to the backend decisions the
          candidate wants to deepen.
        cost_or_risk: The role may still offer less product contact or learning than
          expected.
        valid_when: The team can name concrete ownership, improvement work, and a path
          to broader responsibility.
      - option: Stay cautious when maintenance is mainly ticket throughput.
        benefit: It avoids claiming fit before the work provides the intended technical
          growth.
        cost_or_risk: A cautious answer could miss a role whose deeper scope was not
          yet explained.
        valid_when: The recruiter cannot describe meaningful decisions, learning, or
          an escalation path.
      decision_rule: Advance when the role contains explicit backend ownership and learning;
        stay conditional when the recruiter cannot distinguish improvement work from
        routine throughput.
    failure_probe:
      kind: counterexample
      prompt: What role detail would make your platform-maintenance preference a poor
        fit, and how would you say so without dismissing the work?
    evidence_check:
      basis: Compare the recruiter’s description with the decisions, learning path,
        and collaboration model the role actually offers; label preference separately
        from evidence.
      source_kind: resume_derived
      limitation: The exercise cannot prove the employer’s future scope or a guaranteed
        career outcome.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: The candidate’s work preference is clear, but the role’s maintenance
        scope and feedback loop are not.
      update_trigger: Update the fit claim when the recruiter names ownership, learning
        expectations, and how engineers see operational or product consequences.
    rubric:
      facts_correct: States the candidate’s backend direction without claiming knowledge
        of the unexamined role.
      assumptions_explicit: Names the maintenance and collaboration assumption before
        using it to judge fit.
      alternatives_considered: Compares meaningful improvement ownership with routine
        throughput and states when each matters.
      tradeoff_quality: Connects interest, learning, product contact, and role risk
        to a visible decision rule.
      follow_up_adaptation: Updates the fit statement when the recruiter supplies a
        different maintenance scope.
      certainty_calibration: Keeps fit conditional until role ownership and learning
        evidence are available.
    defense_checks:
    - id: career-02-a-recruiter-introduction-defense-role-scope
      axis: assumptions
      prompt: If the recruiter uses the word maintenance without defining its decision
        scope, what would you clarify before advancing?
      best_answer: I would ask which changes engineers can own, how improvement work
        is prioritised, and what learning or escalation path exists before treating
        the title as evidence of fit.
      distractors:
      - text: The word maintenance would be enough for me to decline the conversation before
          asking which platform decisions engineers own or how reliability improvements are
          prioritised.
        why_wrong: The label does not establish the actual ownership or improvement
          scope.
      - text: Any maintenance role sounds like broad reliability ownership to me, so I would
          accept the opening without asking how much of the platform or roadmap the team
          actually controls.
        why_wrong: That reverses the unsupported assumption instead of testing it.
- id: career-03-an-engineering-introduction
  version: 1.6.0
  target: career
  topic: an engineering introduction
  difficulty: 1
  interview_stage: behavioural_probe
  prompt: How would you introduce your background to an engineering panel?
  context: The panel expects technical judgment and a careful distinction between professional
    evidence and portfolio code.
  best_answer: 'My professional background is centered on Rails and backend work. I
    would organize the introduction around boundaries: integrations that need timeouts
    and retries, data changes that need idempotency, and sensitive flows that need authorization.
    Separately, the Go and Elixir repositories are executable portfolio implementations
    I can inspect with the panel. That distinction lets me discuss technical detail
    without presenting portfolio code as professional operation or ownership.'
  response_versions:
    short: >-
      My background is Rails and backend work. I discuss integrations through timeouts,
      writes through idempotency, and sensitive flows through authorization. Go and Elixir
      are inspectable portfolio implementations, not claims of professional operation or
      ownership.
    medium: >-
      My professional background is centered on Rails and backend work. I would organize
      the introduction around boundaries: integrations that need timeouts and retries,
      data changes that need idempotency, and sensitive flows that need authorization.
      Separately, the Go and Elixir repositories are executable portfolio implementations
      I can inspect with the panel. That distinction lets me discuss technical detail
      without presenting portfolio code as professional operation or ownership.
    deep: >-
      My professional background is centered on Rails and backend work, and I organize the
      technical conversation around concrete boundaries: integrations need timeouts and
      retries, data changes need idempotency, and sensitive flows need authorization. If
      the panel wants an implementation example, I can inspect the Go or Elixir
      repositories with it, for example an outbox relay’s event state, retry path, and
      duplicate handling. I would describe code and tests as evidence of the behaviour
      they cover, not proof that I operated the system or achieved a production result. I
      would ask which failure path matters, then trace that path and state the provider or
      operating assumptions that remain unconfirmed.
  distractors:
  - text: I know Rails, Go, Elixir, queues, databases, and cloud tools. I can describe
      how each technology works, compare trade-offs between tools, discuss asynchronous
      processing, idempotency, observability, deployment configuration, authorization,
      and persistence, and answer questions about whichever platform component the panel
      considers most important.
    trap: precision
    why_wrong: An engineering panel cannot choose a technical thread from this list,
      so the answer invites shallow tool-by-tool questioning.
  - text: I’d describe the portfolio repositories as part of my professional history
      and explain the architecture from there. The important point is that I understand
      the code, can explain its trade-offs, and can use those implementations to show
      the systems I have operated, including deployment, observability, reliability,
      and incident-handling practices.
    trap: hedging
    why_wrong: That collapses executable portfolio evidence into employment claims,
      which undermines trust once the panel asks about operation or ownership.
  sources:
  - repo: backend-challenges
    path: system-design-estudos/interview/story-bank/01-ruby-rails-backend-story-bank.md
    note: Secondary Rails career transcription and evidence boundary.
  - repo: backend-challenges
    path: fulfillhub-go-commerce-platform/README.md
    note: Executable Go portfolio framing.
  - repo: backend-challenges
    path: pulseops-elixir-job-platform/README.md
    note: Executable Elixir portfolio framing.
  - repo: original
    path: english-arcade/career/3
    note: Authored interview-language coaching.
  provenance:
    evidence_class: resume_derived
    project: Rails career narrative plus executable portfolios
    repository: backend-challenges
    files:
    - path: system-design-estudos/interview/story-bank/01-ruby-rails-backend-story-bank.md
      commit: 716a7d9
      claim: >-
        The story bank is a secondary résumé transcription and warns that inferred
        implementation detail needs confirmation; it mentions the referenced résumé PDF.
    - path: fulfillhub-go-commerce-platform/README.md
      commit: 3bc2b641d17bd93ba151ff78441d9bf190f0fc07
      claim: The README frames FulfillHub as an executable Go R&D and portfolio project
        rather than employer work.
    - path: pulseops-elixir-job-platform/README.md
      commit: f1330d0588d1b46253abb18a3c4c1ec6869152b6
      claim: The README frames PulseOps as an executable Elixir portfolio architecture
        slice.
    verified_claims:
    - The Rails narrative is secondary résumé material with an explicit inference warning;
      the source mentions the referenced résumé PDF.
    - FulfillHub is inspectable executable Go portfolio evidence.
    - PulseOps is inspectable executable Elixir portfolio evidence.
    confirmation_required:
    - 'Inventory observation (workspace search checked 2026-08-25), not a claim made by the source: the referenced resume PDF is absent.'
    - Confirm ownership, metrics, and mechanisms for professional material, plus authorship
      and operation context for the portfolio repositories.
    safe_interview_version: I describe Rails/backend themes as professional narrative and use
      public Go or Elixir portfolio code for inspectable technical discussion, while keeping
      ownership and operating results conditional until confirmed.
    confidentiality:
      level: medium
      note: Keep employer details separate from public portfolio evidence and avoid
        protected systems or metrics.
  feedback:
    register: Speak to engineers in terms of boundaries and failure modes, not as a
      catalogue of languages and services.
    hedging: Mark the Rails professional example as preparation evidence, then speak
      confidently about what the inspectable Go and Elixir code contains.
    precision: Choose the three boundaries in the answer—dependencies, data changes,
      and sensitive flows—so the panel can select a deep dive.
    grammar: 'Use parallel relative clauses: integrations “that need” retries, changes
      “that need” idempotency, and flows “that need” authorization.'
    pragmatics: Invite inspection of a portfolio repository only after separating it
      from the professional narrative; that preserves a trustworthy route into detail.
  rephrase:
    prompt: Give the same introduction to an engineer who asks first about data correctness.
    goal: Open with idempotency and keep the portfolio-versus-professional distinction
      explicit.
  follow_up:
    prompt: Which concrete design boundary would you show if the panel asks how an outbox
      relay recovers, and what would you refuse to claim from the code alone?
    goal: Offer inspectable technical evidence while separating implementation detail
      from operation or impact.
    challenge_kind: evidence
    best_answer: I would show how an event is stored alongside the state change, how a relay
      retries or marks a delivery attempt, and how duplicate publication is contained.
      I would describe the code and tests as inspectable implementation evidence, not
      as proof that I operated the system or achieved a production result. I would ask
      which failure path the panel wants to examine next.
    distractors:
    - text: The repository records the event, retries the provider call, and has passing
        tests, so I would tell the panel that the relay guarantees delivery. The retry
        loop covers provider failures, the outbox state prevents a message from
        disappearing, and the tests show that every event will reach its destination
        reliably under production conditions.
      why_wrong: A code path and test can support behaviour under test but cannot prove
        production delivery or universal guarantees.
    - text: For the introduction, I would discuss Rails and backend responsibilities but
        leave the relay implementation aside. Outbox state, retries, and duplicate
        handling would distract from my professional narrative, so I would describe the
        design in broad terms without opening the repository or tracing a failure path.
        Even a technical follow-up would get general reliability principles first.
      why_wrong: The panel asked for technical judgment; the useful response is to show
        a bounded example and label its evidence class.
    answer_anchors:
    - Show event state, retry, and duplicate handling.
    - Label code and tests as inspectable implementation evidence.
    - Do not infer operation or production impact from code alone.
  compression:
    prompt: Summarize the engineering introduction with three boundaries and one evidence
      distinction.
    goal: Make it easy for a panelist to select the next technical question.
  language_focus:
  - precision
  - pragmatics
  - hedging
  feynman:
    concept: Explaining an outbox boundary without inflating the evidence.
    explain_to: An engineer who wants to inspect a relay failure.
    constraint: Explain state, retry, and duplicate handling before discussing any result
      or ownership.
    self_check: Could the listener identify the crash window and the evidence limit
      after one explanation?
    reasoning_check: Can you compare a relay test with an operational metric, identify
      what each proves, and update the guarantee after a crash counterexample?
  black_box:
    symptom: The introduction becomes a technology list or an unqualified production
      story.
    expected: The answer should give one technical boundary and name its evidence class.
    actual: The speaker mentions outbox, queues, and retries without showing the state
      transition or limitation.
    root_cause: Implementation vocabulary replaced a concrete failure path and an honest
      contribution boundary.
    repair: State the event lifecycle, choose one crash window, and distinguish inspectable
      code from operated impact.
    reasoning_error: Classify whether the failure came from a missing state fact, an
      ownership assumption, an untested alternative, or an overclaim.
  recall:
    active_recall_cue: What is the honest first sentence for an engineering introduction?
    feynman_prompt: Can you explain the relay’s crash window and evidence boundary without
      promising exactly-once delivery?
    black_box_probe: Did you show a state transition rather than a technology inventory?
    leitner_start_box: 1
    mastery_threshold: 8
    delayed_variant:
      id: career-03-an-engineering-introduction-delayed-1
      prompt: A reviewer finds that the relay can publish twice after a crash between
        acknowledgement steps. How would you revise your explanation and what check
        would you add?
      changed_constraint: The relay must tolerate a crash between publication and acknowledgement
        without creating an unhandled duplicate effect.
      new_evidence: A crash test exposes a second publication between the provider acknowledgement
        and local state update.
      best_answer: I would keep the explicit event state and retry boundary, but revise
        the claim from reliable delivery to at-least-once delivery with duplicate protection.
        I would add an idempotency key or consumer-side deduplication, reproduce the
        crash window, and check that the resulting effect is safe. The test changes
        the failure claim, not the fact that the code is inspectable portfolio evidence.
      distractors:
      - text: I would keep saying that the relay guarantees exactly-once delivery because
          the original retry path passed its tests. The event record and acknowledgement
          sequence show that the intended message is sent, so a second publication after
          a crash would not change the delivery claim. I would treat the retry path as
          sufficient protection and continue describing the relay as exactly once.
        why_wrong: The new crash evidence contradicts that guarantee and requires a
          narrower claim.
      - text: I would remove the retry loop and simplify the relay so it makes one
          publication attempt before marking the event complete. That would avoid the
          chance of sending an event twice, and I would rely on the stored record to
          reveal any event that failed before acknowledgement. I would not add a recovery
          check until I had seen evidence that the provider could lose a message during
          that window.
        why_wrong: Removing one mechanism does not resolve the state transition or establish
          safe recovery.
      answer_anchors:
      - Preserve explicit event state and retry boundary.
      - Revise exactly-once language to at-least-once plus deduplication.
      - Reproduce the crash window and verify the resulting effect.
      reasoning_moves:
        preserve: Keep explicit event state and the bounded retry boundary.
        revise: Replace any exactly-once implication with at-least-once delivery plus
          duplicate protection.
        verify: Reproduce the crash window and test the idempotency or deduplication
          behaviour.
        certainty_update: Lower confidence in delivery guarantees while keeping confidence
          in the inspected code path.
  extension:
    prompt: The engineer asks whether your outbox discussion is professional experience
      or portfolio study. How would you answer before choosing a deeper failure path?
    goal: Make the evidence class explicit while keeping the technical discussion useful.
  critical_thinking:
    problem_frame: An engineering panel needs one concrete relay failure path and a
      truthful boundary between professional background and inspectable portfolio code.
    claim_map:
      fact: An outbox relay can be explained through event state, retry, and duplicate
        handling.
      inference: Those mechanisms suggest a design worth inspecting, but not a production
        outcome or personal operation history.
      assumption: The panel may value delivery semantics more than framework vocabulary;
        ask which failure path matters.
      unknown: The provider contract, operating history, and observed impact are not
        established by the introduction.
    comparison:
      applicable: true
      alternatives:
      - option: Explain the relay through explicit event state and retry boundaries.
        benefit: It gives the engineer a traceable failure path and a place to discuss
          duplicate protection.
        cost_or_risk: The explanation takes longer and may expose a limitation such
          as at-least-once delivery.
        valid_when: The interviewer wants implementation reasoning or asks how a crash
          is recovered.
      - option: Start with the portfolio’s broader system context and defer the relay
          mechanics.
        benefit: It keeps the opening concise when the panel is still assessing general
          technical direction.
        cost_or_risk: It can sound vague if the engineer asked for a concrete design
          boundary.
        valid_when: The audience first needs role context or has not selected a failure
          path.
      decision_rule: Start with context for a broad opening, then switch to event state
        and retry when the engineer asks for an inspectable failure path.
    failure_probe:
      kind: edge_case
      prompt: What happens if the process crashes after publication but before the local
        delivery state is acknowledged?
    evidence_check:
      basis: Compare the stated relay behaviour with its tests and the interview question;
        separate implementation evidence from operation and impact claims.
      source_kind: resume_derived
      limitation: Code and tests cannot by themselves establish production ownership,
        traffic, or business outcome.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: The design boundary is concrete, while provider semantics and operational
        results remain unconfirmed.
      update_trigger: Update the guarantee when a crash test, provider contract, or
        operational observation changes the delivery evidence.
    rubric:
      facts_correct: Names event state, retry, and duplicate boundaries without claiming
        the relay operated in production.
      assumptions_explicit: States which provider and acknowledgement assumptions need
        confirmation.
      alternatives_considered: Compares a mechanics-first explanation with a broader
        context-first opening and identifies when each serves the panel.
      tradeoff_quality: Connects detail, failure clarity, delivery semantics, and time
        to the chosen explanation.
      follow_up_adaptation: Narrows the guarantee and adds a verification step when
        the crash evidence changes.
      certainty_calibration: Keeps confidence in the described mechanism separate from
        confidence in impact or operation.
    defense_checks:
    - id: career-03-an-engineering-introduction-defense-contribution
      axis: facts
      prompt: If the panel asks what a passing relay test proves about your contribution,
        how would you answer?
      best_answer: I would say the test supports the behaviour it exercises, then state
        which code or design decision I can explain and which ownership or production
        result still needs separate evidence.
      distractors:
      - text: I would point to the passing relay test as evidence that I operated the
          system successfully in production, because the test exercises publication,
          acknowledgement, and the retry path used by real traffic. The successful run
          would support a statement about my ownership and the customer impact of the
          relay.
        why_wrong: A focused test does not establish operation, ownership, or customer
          impact.
      - text: I would say the passing test proves nothing about the implementation and
          decline to discuss the relay until there is a production metric. A focused test
          would not be worth showing to the panel, so I would keep the conversation at
          general system-design principles instead.
        why_wrong: The test is useful evidence for its covered behaviour when its scope
          is stated clearly.
- id: career-04-a-chronological-walkthrough
  version: 1.6.0
  target: career
  topic: a chronological walkthrough
  difficulty: 2
  interview_stage: behavioural_probe
  prompt: Walk me through the experience you would highlight for this role.
  context: The interviewer asks for an evidence-safe walkthrough after hearing the opening
    summary.
  best_answer: I would describe my progression in a few connected chapters. I began with integrations and geospatial work, where external boundaries and data access shaped the design; I then moved into Rails API and commerce questions, before later security and messaging themes changed the risks I examine. I can defend that broad sequence from the career narrative. I would not assign an exact metric, ownership boundary, or business outcome without confirming it for the relevant role. For this position, I would pause at its closest chapter and separate what I know from what I would still verify.
  response_versions:
    short: >-
      My progression runs from integrations and geospatial work through Rails APIs and
      commerce, then later security and messaging themes. I can defend that broad sequence,
      but I would confirm exact ownership, metrics, and outcomes before stating them.
    medium: >-
      I would describe my progression in a few connected chapters. I began with
      integrations and geospatial work, where external boundaries and data access shaped
      the design; I then moved into Rails API and commerce questions, before later security
      and messaging themes changed the risks I examine. I can defend that broad sequence
      from the career narrative. I would not assign an exact metric, ownership boundary,
      or business outcome without confirming it for the relevant role. For this position, I
      would pause at its closest chapter and separate what I know from what I would still
      verify.
    deep: >-
      I would present the career narrative as connected chapters rather than as a list of
      technologies. I began with integrations and geospatial work, where external
      boundaries and data access shaped the design. The next chapter involved Rails API
      and commerce questions, followed by later security and messaging themes that changed
      the risks I examine. That sequence is the broad arc I can defend from the career
      narrative; it does not prove that one project caused the next or that I owned every
      detail. For the role under discussion, I would choose the closest chapter, explain
      its decision boundary, and say which details still need confirmation. If the panel
      instead wants the later security theme first, I can reorder the story without turning
      it into a single incident or retrospective causal claim.
  distractors:
  - text: I’d start with the biggest result from each period and fill in the sequence
      later. That gives the strongest impression first and lets me spend most of the
      time on projects that sound relevant, including their technology choices, performance
      concerns, integration complications, authorization decisions, and implementation
      details. I would mention the release process and monitoring.
    trap: precision
    why_wrong: The interviewer asked how the experience developed; jumping to unverified
      highlights removes the progression needed to assess growth.
  - text: I’d skip earlier chapters and focus on the strongest recent project. I would
      explain its architecture, dependencies, data model, performance constraints, recovery
      path, request flow, persistence, external calls, design trade-offs, alternative
      implementations, deployment assumptions, and operational terminology, then answer
      follow-ups from that example before deciding whether any earlier work matters.
    trap: pragmatics
    why_wrong: That prevents the hiring manager from seeing the requested path from
      integration work to later reliability and security concerns.
  sources:
  - repo: system-design-estudos
    path: interview/story-bank/01-ruby-rails-backend-story-bank.md
    note: Resume-derived career coaching.
  - repo: original
    path: english-arcade/career/4
    note: Authored interview-language coaching.
  provenance:
    evidence_class: resume_derived
    project: Backend career narrative
    repository: system-design-estudos
    files:
    - path: interview/story-bank/01-ruby-rails-backend-story-bank.md
      commit: 716a7d9
      claim: The story bank contains a chronological narrative covering integrations,
        commerce, payment, security, and recent messaging themes.
    verified_claims:
    - The story bank contains a chronological narrative covering integrations, commerce,
      payment, security, and recent messaging themes.
    confirmation_required:
    - 'Inventory observation as of 2026-08-25: the referenced resume PDF is absent from the searched workspace; that does not establish that it is unavailable elsewhere.'
    - Confirm ownership, metrics, and mechanisms before using role-specific detail.
    safe_interview_version: The professional narrative moves from integrations and geospatial
      work through growing APIs, payment and performance, security, and recent messaging
      themes; exact role details need confirmation.
    confidentiality:
      level: medium
      note: Keep credentials, sensitive names, payloads, and nonpublic operational details
        out of the answer.
  feedback:
    register: Use signposts such as “first,” “then,” and “finally” so a long answer
      remains conversational rather than sounding rehearsed.
    hedging: Attach the confirmation caveat to ownership, mechanisms, and metrics—not
      to the broad sequence already present in the source evidence.
    precision: 'Give each chapter one distinguishing backend concern: integrations,
      API growth, payments and performance, security, then volume and messaging.'
    grammar: Keep the walkthrough in chronological past-oriented phrasing, but use “I
      would confirm” for the present evidence boundary.
    pragmatics: After the sequence, offer to deepen the chapter closest to the role
      instead of forcing all five chapters into equal detail.
  rephrase:
    prompt: Walk a hiring manager through the same progression in a role centered on API reliability.
    goal: Compress the less relevant chapters while preserving the order of development.
  follow_up:
    prompt: The panel asks you to begin with the security theme rather than the early chronology. How would you answer without turning that theme into a single incident or claiming it caused the earlier work?
    goal: Reorder a professional walkthrough around the interviewer’s interest while keeping broad themes, contribution limits, and causal claims accurate.
    challenge_kind: new_evidence
    best_answer: I would begin with the security concern the panel wants, describe it as one theme in the broader narrative, and then place integrations, geospatial work, Rails APIs, commerce, and messaging in their documented sequence. I would say which decision I can explain and avoid calling it a singular failure or attributing a wider outcome without confirmation. Then I would ask whether the panel wants the earlier context or the later design response.
    distractors:
    - text: I would frame the progression as security-led and say the earliest work was
        already moving toward that concern. The integrations and geospatial decisions
        would become the foundation for later Rails API, commerce, and messaging choices,
        and I would present myself as carrying one security discipline through every
        chapter. That single through-line would sound more persuasive than stopping to
        distinguish the original purpose of each project.
      why_wrong: A broad security theme is not evidence of one incident, one cause, or ownership of every chapter.
    - text: I would keep security out of the walkthrough and begin with the earliest
        integration and geospatial work, because later themes are too easy to misread as
        explanations for decisions that came before them. I would describe the Rails API
        and commerce chapters only, then leave the security material for a separate
        conversation once its exact place and ownership were clearer.
      why_wrong: The theme remains useful when it is placed in sequence and its evidence boundary is stated plainly.
    answer_anchors:
    - Name security as a broad later theme, not a singular incident.
    - Restore the documented sequence around the panel’s chosen chapter.
    - Separate the decision I can explain from unconfirmed causality and outcomes.
  compression:
    prompt: Name the five chapters in order using one risk word for each.
    goal: Preserve the timeline while leaving room for the interviewer to choose depth.
  language_focus:
  - precision
  - pragmatics
  - hedging
  feynman:
    concept: Explain a career sequence as context while keeping a broad security theme separate from a claim about one incident or cause.
    explain_to: A hiring manager who wants to understand how integrations, APIs, commerce, security, and messaging shaped the questions I ask now.
    constraint: Put the documented themes in order, identify the chapter I can explain, and mark dates, ownership, outcomes, and causal links that still require confirmation.
    self_check: Can the listener tell which themes are documented, which contribution I can defend, and which detail I would verify before calling one chapter the cause of another?
    reasoning_check: If the panel says security became relevant later, can I move it to that point without deleting the theme or pretending the earlier work had the same requirement?
  black_box:
    symptom: The walkthrough turns a broad security theme into a single event that appears to explain every earlier chapter.
    expected: The answer should preserve the documented sequence, name the chosen chapter, and distinguish timing from causality and personal contribution.
    actual: I used a neat security narrative to fill gaps about why earlier integration and API work happened.
    root_cause: I treated thematic continuity as historical evidence and allowed an unverified cause to replace the source’s broader sequence.
    repair: Keep security as a later theme, state the earlier chapters separately, and ask which decision the panel wants before adding a qualified detail.
    reasoning_error: 'This is a chronology-to-causality error: a persuasive arc was mistaken for proof of a singular incident, requirement, or outcome.'
  recall:
    active_recall_cue: What is the honest first sentence for a chronological walkthrough?
    feynman_prompt: Can you explain a chronological walkthrough while naming the sequence, the unsupported causal leap, and the check that would change your confidence?
    black_box_probe: If your career arc turns a later security theme into the cause of earlier work, which source detail would you recheck first?
    leitner_start_box: 1
    mastery_threshold: 8
    delayed_variant:
      id: career-04-a-chronological-walkthrough-delayed-1
      prompt: A panel member says the security theme belongs later in the sequence, not at the beginning. How would you revise the walkthrough and what would you verify?
      changed_constraint: The walkthrough must place security in its documented position without implying that it caused the earlier integration or API work.
      new_evidence: The panel clarifies that security became a later theme in the career narrative rather than the original purpose of the earlier work.
      best_answer: I would keep the earlier integration, geospatial, API, and commerce sequence, then place security where the narrative supports it. I would verify the specific decision I can explain and avoid claiming that the later theme caused the earlier work or produced a wider security outcome.
      distractors:
      - text: I would move the security theme to the opening and describe the earlier
          integrations, geospatial work, Rails APIs, commerce, and messaging as steps
          toward solving that concern. That order would make the progression sound
          intentional and give the whole story one clear engineering reason.
        why_wrong: A stronger opening does not justify changing the sequence or inventing a causal link.
      - text: I would leave security out of the compressed version and mention only
          integrations, geospatial work, Rails APIs, and commerce, since those were the
          first themes in the narrative. I would use the earlier sequence as the complete
          story and avoid adding a later concern that could distract from it.
        why_wrong: A later theme can show growth when it is placed accurately and its evidence limit remains visible.
      answer_anchors:
      - Keep earlier themes in their documented order.
      - Place security at the later point supported by the narrative.
      - Verify the decision I can explain and narrow any outcome claim.
      reasoning_moves:
        preserve: Preserve the documented order of integrations, APIs, commerce, security, and later messaging themes.
        revise: Revise any implication that security caused the earlier work or represented one singular incident.
        verify: Check the specific security decision and contribution that can be defended from the source.
        certainty_update: Lower certainty about causal and outcome claims while keeping confidence in the broad sequence.
  extension:
    prompt: The staff interviewer wants the walkthrough compressed into two turning
      points. Which turning points would you select, and what evidence would make you
      change them?
    goal: Choose chronology anchors that serve the audience while preserving factual
      sequence and evidence limits.
  critical_thinking:
    problem_frame: "The answer must show the documented progression from integrations and geospatial work through Rails API, commerce, security, and messaging themes without turning chronology into proof of one cause or one person’s ownership."
    claim_map:
      fact: "The career evidence documents a narrative spanning integrations and geospatial work, commerce and payment, security, and more recent messaging themes."
      inference: "That sequence can show how the engineering questions changed over time, but it does not prove that one project caused the next or that I owned every detail in every chapter."
      assumption: "I should ask the panel directly: do you want career progression or one technical chapter first, and which phase should I connect to this role and explain?"
      unknown: "The source does not establish exact dates, ownership boundaries, metrics, or business outcomes for every chapter, so those details require confirmation before I state them."
    comparison:
      applicable: true
      alternatives:
      - option: "Give the documented sequence first, then offer the chapter most relevant to the role."
        benefit: "The panel gets a truthful arc and can still choose an integration, API, security, or messaging decision for depth."
        cost_or_risk: "A broad opening spends time on context and may delay the technical detail an engineering interviewer wants."
        valid_when: "The question explicitly asks how the experience developed or the audience has not chosen a chapter yet."
      - option: "Open with the role-relevant chapter and place it inside the wider sequence afterward."
        benefit: "The answer reaches the role’s concern quickly while preserving enough chronology to explain where the theme came from."
        cost_or_risk: "The transition can sound like a selective highlight if I omit the earlier and later context that limits the claim."
        valid_when: "The panel names a concrete API, reliability, security, or messaging concern and wants that decision inspected now."
      decision_rule: "Give the sequence when growth is the question; lead with the named technical chapter when the panel has already fixed the risk, then restore its place in the sequence and state the evidence boundary."
    failure_probe:
      kind: counterexample
      prompt: "If the panel identifies security as a later theme rather than the reason an earlier integration was built, which sentence would you retract and what sequence would you preserve?"
    evidence_check:
      basis: "Compare the walkthrough with the documented career themes and keep chronology, personal contribution, and outcomes as separate claims."
      source_kind: resume_derived
      limitation: "The narrative supports a broad sequence, but it cannot by itself confirm exact dates, mechanisms, ownership, metrics, or causal links between chapters."
      checked_on: "2026-08-25"
    certainty:
      level: medium
      rationale: "I am confident in the broad sequence named by the source, but less certain about chapter-level ownership, causal connections, and outcomes that the source does not verify."
      update_trigger: "I would revise the sequence or its emphasis if a confirmed role detail changed the order, the personal contribution, or the technical decision the panel wants to examine."
    rubric:
      facts_correct: "Names the documented career themes and keeps sequence separate from unverified dates, ownership, metrics, and outcomes."
      assumptions_explicit: "Asks whether the audience wants progression or one chapter before selecting the depth and naming a causal connection."
      alternatives_considered: "Compares a sequence-first opening with a role-relevant chapter-first opening and states the condition for each."
      tradeoff_quality: "Explains how orientation, relevance, time, and the risk of selective storytelling affect the chosen order."
      follow_up_adaptation: "Reorders the story when the panel names a risk while preserving the documented sequence and narrowing unsupported claims."
      certainty_calibration: "States confidence in the broad arc while identifying the evidence that would raise or lower confidence in chapter-level details."
    defense_checks:
    - id: career-04-a-chronological-walkthrough-defense-timeline
      axis: facts
      prompt: "If a listener treats a later security theme as the project’s original purpose, what factual correction would you make before adding detail?"
      best_answer: "I would separate the themes by time, keep the earlier integration and API work in its documented place, and say that the source does not prove security caused those earlier decisions or establish a broader outcome."
      distractors:
      - text: "I would keep the causal story and say that the early integration work led directly to the later security focus. It gives the chronology a stronger arc and shows that I was deliberately building toward one senior engineering concern."
        why_wrong: "A coherent narrative cannot turn timing into causality or prove responsibility that the source does not establish."
      - text: "I would keep only the earliest integration and API work in the walkthrough. That gives me a clean sequence with familiar material and avoids letting a later security concern distract from the story’s original direction."
        why_wrong: "The later theme can still be useful evidence when it is placed accurately and kept within its documented boundary."
- id: career-05-short-medium-and-deep-compression
  version: 1.6.0
  target: career
  topic: short medium and deep compression
  difficulty: 3
  interview_stage: behavioural_probe
  prompt: Can you give that story in short, medium, and deep versions?
  context: The interviewer wants to see whether you can control detail without changing
    the underlying claim.
  best_answer: I focus on backend boundaries that make risky work predictable. I look at
    request paths, data constraints, and external-dependency failure, then use a labelled
    portfolio example to trace one backend state transition through duplicate handling and
    recovery. I make the idempotency boundary explicit, compare a direct completion path
    with a safer recovery choice, and explain which retry or crash path changes the state.
    This is inspectable design reasoning, not evidence of production operation, ownership,
    or a measured outcome.
  response_versions:
    short: >-
      I focus on backend boundaries that make risky work predictable, then choose the
      amount of detail the listener needs without changing the underlying claim.
    medium: >-
      I focus on backend boundaries that make risky work predictable. I look at request
      paths, data constraints, and external-dependency failure, then use a labelled
      portfolio example to trace one backend state transition through duplicate handling
      and recovery. I make the idempotency boundary explicit, compare a direct completion
      path with a safer recovery choice, and explain which retry or crash path changes the
      state. This is inspectable design reasoning, not evidence of production operation,
      ownership, or a measured outcome.
    deep: >-
      When I compress the same story, I keep its claim stable and change only the amount
      of mechanism. The short version names backend boundaries; the medium version adds
      request paths, data constraints, and external-dependency failure. If the interviewer
      asks about recovery, I use a labelled portfolio example and trace a state transition
      through duplicate handling. I identify where idempotency is enforced, compare a
      direct completion path with a safer recovery choice, and follow the retry or crash
      branch that can change state. If the interviewer instead wants measurement, I stop
      at the evidence boundary and say what signal and comparison would be needed. The
      example is inspectable design reasoning, not proof of production operation, ownership,
      or a measured result, so added detail cannot silently strengthen the claim.
  distractors:
  - text: For the short version I’d list the stack; for the deep version I’d explain every
      implementation detail I remember. I would move through service-boundaries, alternatives,
      edge-cases, deployment-observability, operational-history, confidentiality, and unverified
      results, then finish the prepared explanation even if the listener asked for another branch
      or the evidence boundary did not support the implication.
    trap: precision
    why_wrong: The listener receives either labels or an uncontrolled dump, not the
      same defensible claim at an appropriate level of detail.
  - text: I’d use the longest version every time so no context is missing. I would cover
      architecture, history, alternatives, edge cases, request paths, data models, dependency
      boundaries, failure modes, recovery details, implementation trade-offs, operational
      assumptions, and test evidence before asking what matters to the role, because omitting
      a detail could make the account sound incomplete.
    trap: pragmatics
    why_wrong: A recruiter or time-limited interviewer loses the point before reaching
      the decision boundary that should have been introduced first.
  sources:
  - repo: system-design-estudos
    path: interview/story-bank/01-ruby-rails-backend-story-bank.md
    note: Resume-derived career coaching.
  - repo: original
    path: english-arcade/career/5
    note: Authored interview-language coaching.
  provenance:
    evidence_class: resume_derived
    project: Backend career narrative
    repository: system-design-estudos
    files:
    - path: interview/story-bank/01-ruby-rails-backend-story-bank.md
      commit: 716a7d9
      claim: The story bank contains an Evidence Boundary section that lists Rails,
        databases, queues, security, and distributed-backend themes as resume-backed
        material.
    verified_claims:
    - The story bank contains an Evidence Boundary section that lists Rails, databases,
      queues, security, and distributed-backend themes as resume-backed material.
    confirmation_required:
    - 'Inventory observation as of 2026-08-25: the referenced resume PDF is absent from the searched workspace; that does not establish that it is unavailable elsewhere.'
    - Confirm ownership, metrics, and mechanisms before using role-specific detail.
    safe_interview_version: I can give the same backend story in a short headline, a
      medium decision-and-risk version, or a deep implementation discussion without
      changing the underlying claim.
    confidentiality:
      level: medium
      note: Keep credentials, sensitive names, payloads, and nonpublic operational details
        out of the answer.
  feedback:
    register: Announce the story in ordinary speech, then vary its detail; do not make
      the three formats sound like presentation tiers.
    hedging: Keep the portfolio label in every length when code is used as evidence,
      even if the technical explanation becomes shorter.
    precision: 'Make the invariant claim explicit: risky backend work needs a clear
      state transition and recovery path; only the supporting detail expands.'
    grammar: Use a concise opening for orientation, add the decision and risk for a medium
      answer, and reserve mechanism detail for the deeper version; each should be a complete
      clause rather than a label.
    pragmatics: Stop the medium version at a useful decision point and let the interviewer
      request the state model or recovery mechanics if needed.
  rephrase:
    prompt: Move from a staff-engineer deep dive back to a recruiter summary of the
      same story.
    goal: Remove mechanism detail without changing the evidence boundary.
  follow_up:
    prompt: The interviewer understands the medium version but asks about duplicate
      effects. What signal tells you to go deep, and which detail would you choose first?
    goal: Move between answer lengths in response to a listener signal rather than reciting
      a memorised ladder.
    challenge_kind: assumption
    best_answer: The duplicate-effects question is a clear signal that the listener
      wants mechanics, so I would go deep on the state transition, idempotency boundary,
      and recovery choice. I would keep the claim unchanged and ask whether they want
      the failure path or the measurement next.
    distractors:
    - text: I would answer with the full state transition, duplicate-handling logic,
        retry branches, and crash recovery every time, because technical depth is the
        clearest proof that I am senior. Even when the listener only wants the decision,
        I would keep the mechanism in the response so no important detail is lost.
      why_wrong: It ignores the listener’s time and can bury the decision under detail
        that was not requested.
    - text: I would keep the story to one sentence for every audience and avoid expanding
        it when someone asks about duplicate effects. Changing the amount of detail would
        make the original claim look unstable, so I would repeat the same summary and let
        the listener infer the design boundary.
      why_wrong: Useful compression adapts detail while preserving the claim; it does
        not require pretending every audience wants the same length.
    answer_anchors:
    - Use the duplicate-effects question as the depth signal.
    - Explain state, idempotency, and recovery in that order.
    - Keep the claim stable and offer the next branch to the listener.
  compression:
    prompt: Give the short version and one sentence that offers deeper detail on request.
    goal: Show that the story can expand without changing its claim.
  language_focus:
  - precision
  - pragmatics
  - hedging
  feynman:
    concept: Compress one engineering claim to fit the listener while keeping its evidence
      boundary unchanged.
    explain_to: A recruiter who wants orientation and an engineer who wants the duplicate-effect
      mechanism.
    constraint: Explain what remains invariant across the short, medium, and deep versions,
      and identify the listener signal that justifies adding state-transition detail.
    self_check: If the short version says only ‘predictable backend boundaries,’ can
      you name the omitted retry or idempotency evidence without changing the claim?
    reasoning_check: Can you show why a question about duplicate effects warrants the
      deep version, while a thirty-second orientation request calls for a narrower answer?
  black_box:
    symptom: The answer becomes a technical inventory when the listener needs a decision,
      or stays vague after a question about duplicate effects.
    expected: The response should preserve one claim, choose detail from the listener’s
      signal, and name what the shorter version does not establish.
    actual: I used answer length as a status signal instead of matching detail to the
      information the listener requested.
    root_cause: I confused consistency of wording with consistency of meaning, so I
      either buried the decision or withheld the evidence needed for the follow-up.
    repair: Keep the claim fixed, offer the relevant state transition next, and explicitly
      leave unrelated mechanism or outcome outside the current version.
    reasoning_error: 'The reasoning failed at audience calibration: I optimised for
      sounding technical rather than testing which evidence the listener needed.'
  recall:
    active_recall_cue: What is the honest first sentence for short medium and deep compression?
    feynman_prompt: Can you explain short, medium, and deep compression while naming
      the premise, alternative, and check that would change your confidence?
    black_box_probe: After an error on short, medium, and deep compression, which hidden
      assumption or missing observation would you inspect first?
    leitner_start_box: 1
    mastery_threshold: 8
    delayed_variant:
      id: career-05-short-medium-and-deep-compression-delayed-1
      prompt: The interviewer says the team has only thirty seconds and does not need
        implementation detail. How would you compress the same idea, and what would
        you leave available for a follow-up?
      changed_constraint: The answer must fit a thirty-second opening while preserving
        the decision and its most important limitation.
      new_evidence: The interviewer signals that the purpose is orientation, not a technical
        deep dive.
      best_answer: I would keep the answer within thirty seconds, say that I focus on
        backend boundaries that make risky work predictable, and name one decision rather
        than the full mechanism. Because the purpose is orientation, I would leave retry
        and duplicate detail for a follow-up and state that the short version does not
        prove an operational result.
      distractors:
      - text: I would deliver the complete state machine even with thirty seconds,
          including each request path, retry branch, idempotency key, duplicate effect,
          and recovery transition. Leaving out any of those details would make the
          explanation technically dishonest, so I would prioritise completeness over the
          time limit.
        why_wrong: A concise answer can be truthful when it names its scope and offers
          detail at the appropriate time.
      - text: I would replace the backend example with a list of Rails, Go, Elixir, queue,
          and database frameworks so the listener hears the full range of technologies I
          know. A wider catalogue would communicate more capability in thirty seconds
          than one narrow state transition or recovery path.
        why_wrong: A technology list does not preserve the decision or limitation the
          original example was meant to communicate.
      answer_anchors:
      - State the backend boundary in one sentence.
      - Name one example without claiming its full mechanism.
      - Offer the retry detail as an optional next branch.
      reasoning_moves:
        preserve: Preserve the underlying claim about predictable backend boundaries
          and risky external dependencies.
        revise: Revise the amount of mechanism offered because the audience needs orientation
          rather than a deep dive.
        verify: Check that the compressed version still names the decision and does
          not imply a result it cannot support.
        certainty_update: Keep confidence in the principle but remain cautious about
          conclusions that require the omitted implementation evidence.
  extension:
    prompt: A staff interviewer asks you to compress one answer for a recruiter and
      then expand it for an engineer. What stays invariant across the two versions?
    goal: Demonstrate controlled reformulation without changing the factual or evidential
      boundary.
  critical_thinking:
    problem_frame: "The three versions must preserve one defensible backend claim while changing detail: the listener should hear the boundary first, then state transition, idempotency, and recovery only when those mechanics answer the question."
    claim_map:
      fact: "The prompt asks for short, medium, and deep versions, and the authored answer uses backend boundaries plus one labelled portfolio state-transition example."
      inference: "Changing length can preserve the same claim, but a concise sentence cannot establish the portfolio example’s operational result or every implementation detail."
      assumption: "I should ask the listener directly: are you deciding whether this is orientation, a design explanation, or a recovery trade-off that requires the state transition?"
      unknown: "The required depth, the listener’s time budget, and the evidence available for any operational outcome remain unspecified until the next question."
    comparison:
      applicable: true
      alternatives:
      - option: "State the invariant boundary first and expand only along the listener’s requested failure path."
        benefit: "The claim remains stable while the engineer can inspect duplicate handling, recovery, or measurement without hearing irrelevant detail."
        cost_or_risk: "A listener who needs a concrete mechanism immediately may have to spend one extra turn choosing the branch."
        valid_when: "The audience is mixed, the time limit is unclear, or the opening purpose is still orientation."
      - option: "Choose the state transition and its duplicate effect as the opening detail."
        benefit: "It gives an engineer a tangible boundary to evaluate and makes the recovery trade-off visible early."
        cost_or_risk: "It can overwhelm a recruiter and can imply a stronger operational claim than the labelled portfolio evidence supports."
        valid_when: "The interviewer asks how a retry changes state or explicitly requests implementation mechanics."
      decision_rule: "Use the boundary-first version for orientation; move directly to state and idempotency when the question names duplicate effects, and label the portfolio evidence whenever it carries the example."
    failure_probe:
      kind: edge_case
      prompt: "If the medium version says duplicate effects are controlled but cannot name the state or idempotency boundary, what would you shorten or verify before defending it?"
    evidence_check:
      basis: "Compare each length with the same claim, the labelled portfolio scope, and the exact mechanic the listener asks to inspect."
      source_kind: resume_derived
      limitation: "Compression can preserve wording and reasoning, but it cannot create evidence for production operation, ownership, scale, or a measured outcome."
      checked_on: "2026-08-25"
    certainty:
      level: medium
      rationale: "I am confident that the boundary and the state-transition example can be compressed, while the correct depth and any operational conclusion depend on the listener and evidence."
      update_trigger: "I would change length when the next question names a missing mechanism, a time limit, or a result that the current version cannot support."
    rubric:
      facts_correct: "Keeps the same backend boundary and labels the portfolio example without turning a short version into production evidence."
      assumptions_explicit: "Identifies whether the listener needs orientation, mechanics, or a recovery decision before selecting detail."
      alternatives_considered: "Compares invariant-first compression with mechanism-first explanation and gives a concrete audience condition for each."
      tradeoff_quality: "Balances time, cognitive load, inspectable state transitions, and the risk of overstating portfolio evidence."
      follow_up_adaptation: "Expands toward idempotency or measurement only when the listener’s question supplies that branch."
      certainty_calibration: "Keeps confidence in the communication method separate from confidence in unmeasured operational effects."
    defense_checks:
    - id: career-05-short-medium-and-deep-compression-defense-depth-signal
      axis: adaptation
      prompt: "Which concrete question would justify replacing the medium summary with the state transition and duplicate-recovery detail?"
      best_answer: "A question about what happens after a retry or crash would justify the deeper version; I would explain the state boundary first and then ask whether the listener wants recovery mechanics or measurement."
      distractors:
      - text: "I would always choose the longest version and include the complete failure path, because every extra mechanism gives stronger evidence of technical ability. The deep explanation should be the default even when the audience has not asked about retries, duplicates, or recovery."
        why_wrong: "Detail can hide the decision and does not create evidence for an unmeasured result."
      - text: "I would use exactly the same wording for a recruiter, an engineer, and a staff interviewer, because consistency matters more than adjusting the amount of detail. The audience should hear the identical summary and decide for itself whether the implementation needs discussion."
        why_wrong: "The claim should stay stable, but useful communication changes detail when the listener’s question changes."
- id: career-06-role-fit-and-why-now
  version: 1.6.0
  target: career
  topic: role fit and why now
  difficulty: 1
  interview_stage: behavioural_probe
  prompt: Why are you interested in this kind of backend role now, and what would you
    need to learn before calling it a fit?
  context: There is no company-specific evidence, so the answer must not invent a fit
    or praise the employer.
  best_answer: >-
    I am interested in roles where backend decisions are visible: what stays synchronous,
    how writes are protected, and how risk is explained to partners. Before calling this
    role a fit, I would ask who owns those decisions, how reliability work feeds back into
    later decisions, and what conditions support growth over time.
  response_versions:
    short: >-
      I want a backend role where synchronous boundaries, protected writes, and risk
      discussions are visible. I would ask who owns those decisions before calling the
      role a fit.
    medium: >-
      I am interested in roles where backend decisions are visible: what stays synchronous,
      how writes are protected, and how risk is explained to partners. Before calling this
      role a fit, I would ask who owns those decisions, how reliability work feeds back into
      later decisions, and what conditions support growth over time.
    deep: >-
      I am interested in backend roles where the important decisions are visible rather
      than hidden behind a title. I want to understand what stays synchronous, how writes
      are protected, and how engineers explain reliability risk to partners. Before calling
      this opening a fit, I would ask who can make those decisions, how delivery pressure
      is balanced against reliability work, and what learning or escalation path exists.
      If the team can describe meaningful ownership and a way to review consequences, my
      interest becomes stronger. If the role is mainly ticket throughput with little
      decision or learning scope, I would keep the fit conditional. I would update that
      view from the team’s concrete answers, not from the employer’s reputation or the job
      title alone.
  distractors:
  - text: The company looks impressive, so I already know this role is the right move
      for me. I have read enough about the product to be confident I would enjoy the
      environment, and I am ready to adapt to whatever priorities the team has.
    trap: hedging
    why_wrong: This asserts knowledge the candidate does not have and makes the interest
      sound detached from the team’s actual reliability or ownership work.
  - text: I fit any backend team, so I would wait for them to define what the role involves.
      I am flexible about responsibilities, technology choices, and the kind of work
      I take on, so I can contribute wherever the team needs someone.
    trap: pragmatics
    why_wrong: The interviewer cannot assess motivation or judgment because the candidate
      offers neither a direction nor a question that would test fit.
  sources:
  - repo: system-design-estudos
    path: interview/story-bank/01-ruby-rails-backend-story-bank.md
    note: Resume-derived career coaching.
  - repo: original
    path: english-arcade/career/6
    note: Authored interview-language coaching.
  provenance:
    evidence_class: resume_derived
    project: Backend career narrative
    repository: system-design-estudos
    files:
    - path: interview/story-bank/01-ruby-rails-backend-story-bank.md
      commit: 716a7d9
      claim: The story bank contains an Evidence Boundary section that lists Rails,
        databases, queues, security, and distributed-backend themes as resume-backed
        material.
    verified_claims:
    - The story bank contains an Evidence Boundary section that lists Rails, databases,
      queues, security, and distributed-backend themes as resume-backed material.
    confirmation_required:
    - 'Inventory observation as of 2026-08-25: the referenced resume PDF is absent from the searched workspace; that does not establish that it is unavailable elsewhere.'
    - Confirm ownership, metrics, and mechanisms before using role-specific detail.
    safe_interview_version: I am drawn to backend roles where teams make reliability
      and ownership decisions visible, and I would first ask about this team’s current
      technical priorities.
    confidentiality:
      level: medium
      note: Keep credentials, sensitive names, payloads, and nonpublic operational details
        out of the answer.
  feedback:
    register: Frame interest as curiosity about visible backend decisions, not as a
      declaration that the company has already been judged.
    hedging: Use “I would ask” to mark the unknown team context, while keeping “I am
      interested” direct about the work you want to deepen.
    precision: Name the three decisions you care about—synchronous work, protected writes,
      and risk communication—before asking about the team’s current challenge.
    grammar: 'Keep the conditional construction consistent: “I would ask … before claiming
      …,” which makes the sequence of judgment clear.'
    pragmatics: End on a discovery question that the interviewer can answer from current
      team reality rather than from employer branding.
  rephrase:
    prompt: Explain your interest without mentioning the company or assuming its culture.
    goal: Anchor the answer in the kind of engineering decisions you want to examine.
  follow_up:
    prompt: The team says the role is mostly roadmap delivery with little reliability
      ownership. What would you ask before deciding whether the fit is still worth pursuing?
    goal: Replace a generic motivation statement with questions that test the role’s
      actual decisions and growth path.
    challenge_kind: evidence
    best_answer: I would ask how reliability risks are surfaced, who owns the trade-offs
      when delivery pressure conflicts with them, and what learning path the role offers.
      I could still be interested in roadmap work, but I would not call the fit strong
      until the team explains how backend judgment is exercised.
    distractors:
    - text: Once I heard that engineers work on the roadmap, I would treat the role as a
        perfect fit. Every roadmap item eventually creates a backend decision, so I would
        assume the position offers meaningful reliability and ownership opportunities
        without asking who makes the trade-offs. The connection between roadmap work and
        backend decisions would be enough for me to proceed.
      why_wrong: It turns a possibility into certainty without checking who makes or
        learns from those decisions.
    - text: I would decline the role immediately because roadmap delivery sounds like
        feature throughput rather than engineering judgment. I would assume reliability
        concerns, ownership, and learning are all secondary to deadlines, so there would
        be no reason to ask how the team handles difficult backend trade-offs.
      why_wrong: It dismisses a possible fit before testing the actual ownership, constraints,
        and learning conditions.
    answer_anchors:
    - Ask who owns reliability trade-offs under delivery pressure.
    - Test the learning path rather than the job title.
    - Keep interest separate from a premature fit conclusion.
  compression:
    prompt: State why the work interests you, then ask one question that tests the fit.
    goal: Show enthusiasm and uncertainty in the same compact answer.
  language_focus:
  - precision
  - pragmatics
  - hedging
  feynman:
    concept: Test role fit through decisions the team owns rather than through a familiar
      framework or title.
    explain_to: A recruiter who can describe the opening but has not yet shown its reliability
      ownership.
    constraint: Explain how visible backend decisions, learning conditions, and reliability
      responsibility support interest while keeping the employer’s future scope unknown.
    self_check: Can the listener name the role detail that would lower your interest
      even if the team uses Rails and backend vocabulary?
    reasoning_check: When reliability ownership begins only after a rotation, can you
      preserve motivation, revise the timing assumption, and ask for evidence about
      decision rights?
  black_box:
    symptom: The motivation answer sounds like a fit verdict before the candidate has
      learned who owns reliability decisions or how engineers grow into them.
    expected: The response should state a genuine direction, ask one discriminating
      role question, and keep fit conditional.
    actual: I treated framework familiarity and an appealing role label as evidence
      that the work would provide the ownership I want.
    root_cause: I skipped the hidden decision boundary between using backend tools and
      being able to influence reliability, learning, and trade-offs.
    repair: Ask who owns the relevant decisions, how the learning path works, and what
      evidence would make the role a stronger or weaker fit.
    reasoning_error: 'This was a fit-by-association error: a technology match was used
      as a proxy for role scope and growth evidence.'
  recall:
    active_recall_cue: What is the honest first sentence for role fit and why now?
    feynman_prompt: Can you explain role fit and why now while naming the premise, alternative,
      and check that would change your confidence?
    black_box_probe: After an error on role fit and why now, which hidden assumption
      or missing observation would you inspect first?
    leitner_start_box: 1
    mastery_threshold: 8
    delayed_variant:
      id: career-06-role-fit-and-why-now-delayed-1
      prompt: The hiring manager adds that engineers rotate into reliability work after
        their first quarter. How does that change your fit statement and what remains
        unresolved?
      changed_constraint: Reliability ownership exists, but it begins after an initial
        period focused on roadmap delivery.
      new_evidence: The hiring manager describes a later rotation into reliability decisions
        rather than immediate ownership.
      best_answer: I would revise my statement to say the role could fit if the rotation
        has real decision rights and a clear learning path, rather than implying immediate
        reliability ownership. I would ask how engineers enter the rotation and how
        its success is evaluated; my confidence would rise slightly but remain conditional.
      distractors:
      - text: I would keep saying that reliability is central from the first day and
          describe the later rotation as evidence that I would own those decisions
          immediately. The timing of the programme would not change my fit statement,
          because a backend role should expose its core concerns from the start.
        why_wrong: It ignores the timing constraint and overstates the role’s initial
          scope.
      - text: I would reject the role because a reliability rotation that starts after the
          first quarter cannot provide meaningful technical growth. If the team does not
          assign those decisions immediately, I would assume the initial roadmap work has
          no value and end the process without asking how the rotation operates.
        why_wrong: The rotation may be valuable; its quality must be tested rather than
          dismissed by timing alone.
      answer_anchors:
      - Qualify the fit around the delayed reliability rotation.
      - Ask who grants decision rights and how learning is evaluated.
      - Increase interest only provisionally after the new detail.
      reasoning_moves:
        preserve: Preserve the preference for visible backend decisions and careful
          reliability trade-offs.
        revise: Revise the assumption that reliability ownership begins immediately
          in the role.
        verify: Ask how the rotation grants decision rights and how engineers learn
          from its outcomes.
        certainty_update: Raise fit confidence slightly while keeping the timing and
          ownership conditions unresolved.
  extension:
    prompt: The recruiter asks for your answer in one sentence before the technical
      screen. What conditional statement would you give?
    goal: State motivation with a visible condition instead of making unsupported claims
      about the employer.
  critical_thinking:
    problem_frame: "The fit answer must connect my interest in visible backend decisions with facts about this role’s ownership, reliability trade-offs, and learning path instead of treating a title or roadmap label as evidence."
    claim_map:
      fact: "I am interested in backend work where synchronous boundaries, protected writes, and risk discussions are visible, and I have not yet been given this team’s ownership model."
      inference: "Roadmap delivery could still be a good fit if engineers can shape reliability and learn from consequences, but delivery volume alone does not establish that."
      assumption: "I should ask directly: what can engineers decide when delivery pressure meets reliability risk, and how does the team review the result of that decision?"
      unknown: "The role’s decision rights, feedback loop, learning conditions, and balance between improvement and ticket throughput remain unknown."
    comparison:
      applicable: true
      alternatives:
      - option: "Continue when the role offers explicit ownership of backend reliability decisions."
        benefit: "It aligns the role with the kind of judgment I want to practise and makes growth expectations inspectable."
        cost_or_risk: "The role may still provide less product contact or broader learning than the initial description suggests."
        valid_when: "The team can describe decisions, escalation, improvement work, and how engineers learn from operational consequences."
      - option: "Keep the fit conditional when the role is mainly roadmap throughput."
        benefit: "It avoids promising strong fit before I know whether backend judgment is part of the work."
        cost_or_risk: "A cautious answer could understate a role whose deeper ownership the recruiter has not yet explained."
        valid_when: "The team cannot distinguish routine delivery from reliability improvement or name a path to broader responsibility."
      decision_rule: "Call the role promising only when the team can name backend decision rights and learning signals; otherwise express interest conditionally and ask for the missing scope."
    failure_probe:
      kind: counterexample
      prompt: "If the team says all reliability decisions sit with another platform group, which part of your fit claim would change and what would you ask next?"
    evidence_check:
      basis: "Compare my stated work preference with the role details the interviewer supplies, separating a personal interest from evidence about actual responsibilities."
      source_kind: resume_derived
      limitation: "An interview description cannot guarantee future ownership, product contact, learning quality, or career outcome before the working arrangement is observed."
      checked_on: "2026-08-25"
    certainty:
      level: medium
      rationale: "My interest in visible backend decisions is clear, but fit remains conditional because the role’s decision rights and learning loop have not been established."
      update_trigger: "I would raise or lower confidence when the team explains who owns reliability trade-offs, how improvement is prioritised, and how engineers see the consequences."
    rubric:
      facts_correct: "States a genuine backend preference without claiming knowledge of the team’s unexamined scope or culture."
      assumptions_explicit: "Names the assumption that roadmap work includes meaningful reliability decisions and asks how to test it."
      alternatives_considered: "Compares explicit reliability ownership with conditional interest under throughput-heavy work and defines the boundary."
      tradeoff_quality: "Balances technical growth, product contact, delivery pressure, and the risk of judging the role from its title."
      follow_up_adaptation: "Revises the fit statement when the team clarifies who decides, escalates, and learns from reliability risk."
      certainty_calibration: "Keeps the conclusion conditional until role evidence supports a stronger fit claim."
    defense_checks:
    - id: career-06-role-fit-and-why-now-defense-fit-condition
      axis: assumptions
      prompt: "What answer from the team would turn your conditional interest in this backend role into a stronger fit claim?"
      best_answer: "I would want a concrete example of engineers owning a reliability trade-off, a clear escalation path, and a learning loop that reviews the consequence before I called the fit strong."
      distractors:
      - text: "The backend title would be enough for me to assume that engineers own reliability trade-offs, escalation, and roadmap consequences. I would call the fit strong before asking how those decisions are actually assigned."
        why_wrong: "A title does not reveal decision rights, escalation, or the actual balance of delivery and improvement work."
      - text: I would reject the role immediately if another team owned reliability,
          because backend engineers need direct control of every production risk to grow.
          Shared ownership would tell me that the position offers no meaningful technical
          judgment.
        why_wrong: "Shared ownership may still offer meaningful collaboration; the missing question is how decisions and learning are handled."
- id: career-07-recruiter-engineer-staff-stakeholder-adaptation
  version: 1.6.0
  target: career
  topic: recruiter engineer staff stakeholder adaptation
  difficulty: 2
  interview_stage: behavioural_probe
  prompt: How would you adapt the same story for different interviewers?
  context: A recruiter, engineer, staff engineer, and stakeholder need different entry
    points into the same truthful narrative.
  best_answer: >-
    I would keep the facts fixed and change the lens: a recruiter hears the work I seek,
    an engineer hears timeout and retry safety, a staff engineer hears the
    delivery-versus-recovery trade-off, and a stakeholder hears the decision, risk, and
    evidence boundary. I would not turn managed risk into an unsupported customer-impact
    claim.
  response_versions:
    short: >-
      I keep the facts fixed but change the entry point: fit for recruiting, mechanism for
      engineering, trade-offs for staff, and decision risk for stakeholders.
    medium: >-
      I would keep the facts fixed and change the lens: a recruiter hears the work I seek,
      an engineer hears timeout and retry safety, a staff engineer hears the
      delivery-versus-recovery trade-off, and a stakeholder hears the decision, risk, and
      evidence boundary. I would not turn managed risk into an unsupported customer-impact
      claim.
    deep: >-
      I would keep one truthful dependency-risk story and adapt its entry point. For a
      recruiter, I would lead with the kind of backend work I seek. For an engineer, I
      would explain the dependency, timeout, retry, and recovery boundary. For a staff
      engineer, I would compare delivery speed with safer recovery and state when the
      decision would change. For a stakeholder, I would name the decision, the risk being
      managed, and the next evidence needed, using shorter technical language. The facts
      and my contribution stay fixed across versions. If a trace or metric is absent, I
      would say that the risk was detected or managed rather than claim that I prevented
      customer impact. I would first ask whether the stakeholder needs a decision, an
      exposure update, or a recovery owner.
  distractors:
  - text: I’d use the same technical explanation for every interviewer so the story
      stays consistent. I would describe the dependency, timeouts, retries, and request
      path in the same order, then assume each person can ask for a different level
      of detail.
    trap: pragmatics
    why_wrong: A recruiter, staff engineer, and stakeholder need different entry points;
      one script leaves at least two of them without the decision they own.
  - text: For a stakeholder, I’d say the system was complex and that the engineers handled
      it. I would avoid technical details, reassure them that the team had a plan, and
      let them know the implementation choices were being managed.
    trap: precision
    why_wrong: The stakeholder still cannot see the customer risk, the choice needed,
      or the remaining uncertainty, so complexity becomes an evasion.
  sources:
  - repo: system-design-estudos
    path: interview/story-bank/01-ruby-rails-backend-story-bank.md
    note: Resume-derived career coaching.
  - repo: original
    path: english-arcade/career/7
    note: Authored interview-language coaching.
  provenance:
    evidence_class: resume_derived
    project: Backend career narrative
    repository: system-design-estudos
    files:
    - path: interview/story-bank/01-ruby-rails-backend-story-bank.md
      commit: 716a7d9
      claim: The story bank contains an Evidence Boundary section that lists Rails,
        databases, queues, security, and distributed-backend themes as resume-backed
        material.
    verified_claims:
    - The story bank contains an Evidence Boundary section that lists Rails, databases,
      queues, security, and distributed-backend themes as resume-backed material.
    confirmation_required:
    - 'Inventory observation as of 2026-08-25: the referenced resume PDF is absent from the searched workspace; that does not establish that it is unavailable elsewhere.'
    - Confirm ownership, metrics, and mechanisms before using role-specific detail.
    safe_interview_version: 'I would keep one truthful dependency-risk story and change
      its entry point: fit for recruiting, mechanism for engineering, trade-offs for
      staff, and risk for stakeholders.'
    confidentiality:
      level: medium
      note: Keep credentials, sensitive names, payloads, and nonpublic operational details
        out of the answer.
  feedback:
    register: Shift from technical detail to decision language as the audience broadens,
      while keeping the same calm account of the dependency risk.
    hedging: Do not soften the known failure shape; reserve caution for any claimed
      outcome or operational history that needs confirmation.
    precision: 'Give each listener one entry point: fit for the recruiter, mechanisms
      for the engineer, trade-off for staff, and risk for the stakeholder.'
    grammar: Use the same conditional frame—“I would start with”—for each audience,
      then vary the object of that verb.
    pragmatics: Keep the facts fixed and change the first useful detail; that is adaptation,
      not a different story for every room.
  rephrase:
    prompt: Turn the dependency story into a stakeholder update that asks for a decision.
    goal: Replace implementation terms with the service risk and the choice in front
      of the group.
  follow_up:
    prompt: The staff engineer asks for the same example after a stakeholder heard only
      the customer risk. How would you add system consequences without changing the
      underlying facts?
    goal: Adapt one truthful example to audience needs without creating different versions
      of the facts.
    challenge_kind: alternative
    best_answer: 'I would keep the same dependency failure and decision, then add the
      staff lens: which recovery trade-off scales across teams and how ownership is
      made visible. I would not invent a metric for the stakeholder version; I would
      ask which consequence the panel wants connected to the technical choice.'
    distractors:
    - text: I would switch to a larger project that I personally owned and describe its
        hardest trade-offs, because a staff conversation calls for a more impressive
        example. I would replace the dependency story with that project and emphasise my
        decisions so the discussion reflects the level of the role.
      why_wrong: Changing the facts to impress the audience undermines provenance and
        makes follow-up questions unsafe.
    - text: I would repeat the stakeholder version almost word for word, describing only
        the visible risk and the requested decision. I would leave out timeout behaviour,
        retries, recovery choices, and cross-team consequences so the story stays identical
        for every listener and does not become too technical.
      why_wrong: Consistency does not mean withholding the technical lens an engineer
        explicitly requested.
    answer_anchors:
    - Keep the dependency failure and decision invariant.
    - Add scaling and ownership consequences for the staff audience.
    - Ask which consequence the listener wants rather than inventing a metric.
  compression:
    prompt: State the four audience lenses in one comparison.
    goal: Make clear that only the framing changes; the facts do not.
  language_focus:
  - precision
  - pragmatics
  - hedging
  feynman:
    concept: Adapt one truthful engineering example to different listeners without changing
      its facts.
    explain_to: A panel that moves from recruiter context to engineering mechanics,
      staff trade-offs, and stakeholder risk.
    constraint: Explain what each audience needs to hear, which event facts remain invariant,
      and why a detected internal risk must not become an invented customer outcome.
    self_check: Can the listener point to the same dependency risk and decision in all
      four versions, even though the consequence and vocabulary change?
    reasoning_check: If a stakeholder says there was no visible customer failure, can
      you narrow the claim and retune all four lenses without erasing the engineering
      judgment?
  black_box:
    symptom: The answer changes its facts when the audience changes, or gives every
      audience the same technical detail regardless of what they need to decide.
    expected: The response should hold event, contribution, and evidence limits constant
      while changing the entry point and consequence.
    actual: I used audience adaptation as permission to add a metric for a stakeholder
      or to remove the system consequence for an engineer.
    root_cause: I confused relevance with factual flexibility and failed to separate
      an observed risk from a customer-visible outcome.
    repair: Write the invariant facts first, then select one audience-specific lens
      and state the consequence it can support.
    reasoning_error: 'The error was audience-dependent truth: emphasis was allowed to
      alter evidence instead of merely changing how the same decision was introduced.'
  recall:
    active_recall_cue: What is the honest first sentence for recruiter engineer staff
      stakeholder adaptation?
    feynman_prompt: Can you explain recruiter, engineer, staff, and stakeholder adaptation
      while naming the premise, alternative, and check that would change your confidence?
    black_box_probe: After an error on recruiter, engineer, staff, and stakeholder adaptation,
      which hidden assumption or missing observation would you inspect first?
    leitner_start_box: 1
    mastery_threshold: 8
    delayed_variant:
      id: career-07-recruiter-engineer-staff-stakeholder-adaptation-delayed-1
      prompt: A stakeholder challenges the phrase ‘unreliable dependency’ and says the customer saw no visible failure. How would you adjust the four audience versions?
      changed_constraint: The technical dependency was risky internally, but no customer-visible failure was observed during the example.
      new_evidence: The stakeholder clarifies that the risk was detected before it became a visible customer incident.
      best_answer: I would replace any implication of customer harm with the narrower claim that the team identified and managed an internal failure risk. The recruiter version would emphasise the kind of work I seek, the engineer version the detection and recovery boundary, the staff version the reusable ownership lesson, and the stakeholder version the detected and managed internal risk.
      distractors:
      - text: I would keep describing the dependency as a customer-facing risk and call it
          an incident, even when no visible failure was observed. A managed internal
          concern sounds too minor, so I would say the team contained customer harm and
          use that stronger wording in every audience version.
        why_wrong: It turns a detected risk into an unsupported customer outcome.
      - text: I would remove the dependency example from every version and talk only about
          general reliability experience, since no customer saw a failure. Without a
          visible incident, I would treat the technical detection and recovery work as
          irrelevant to the recruiter, engineer, staff, and stakeholder conversations.
        why_wrong: A detected internal risk still supports a useful decision narrative when its evidence boundary is clear.
      answer_anchors:
      - Narrow the claim to detected and managed internal risk.
      - Retune each audience lens without changing the event facts.
      - Describe detected and managed internal risk without claiming customer impact.
      reasoning_moves:
        preserve: Preserve the same dependency risk, decision, and contribution across every audience version.
        revise: Revise the customer-impact implication because the new evidence says no visible failure occurred.
        verify: Check which signal detected the risk and which technical action contained it; claim prevention only if a trace shows that action stopped a visible effect.
        certainty_update: Lower certainty about customer impact while keeping confidence in the audience-specific explanation of the decision.
  extension:
    prompt: You have ninety seconds to give a recruiter version and then a staff version.
      Which sentence changes, and which fact must not change?
    goal: Practise audience-aware compression with a stable evidence boundary.
  critical_thinking:
    problem_frame: "One dependency story needs four entry points: motivation for a recruiter, timeout and retry mechanics for an engineer, cross-team recovery trade-offs for staff, and a decision-ready risk summary for a stakeholder, with the underlying facts unchanged."
    claim_map:
      fact: "The prompt asks me to adapt one story for recruiter, engineer, staff, and stakeholder audiences while keeping its factual core stable."
      inference: "Changing emphasis can improve relevance, but a stakeholder-friendly risk sentence does not prove customer impact, a metric, or a causal result that the source does not establish."
      assumption: "I should ask the stakeholder directly: do you want a decision, an exposure update, or a recovery owner before I choose the first sentence?"
      unknown: "The dependency’s customer visibility, measured effect, ownership boundary, and requested decision are not established until the audience supplies them."
    comparison:
      applicable: true
      alternatives:
      - option: "Start with the stakeholder’s decision and translate the same dependency facts into technical depth only when asked."
        benefit: "It respects a time-limited audience and makes the risk, requested action, and owner visible without adding unsupported impact."
        cost_or_risk: "The engineer may need a second turn before seeing timeout, retry, and recovery mechanics."
        valid_when: "A stakeholder needs to choose a mitigation, accept a risk, or assign an owner rather than inspect implementation."
      - option: "Start with the engineer’s failure path and compress it for the other audiences afterward."
        benefit: "It anchors every version in an inspectable mechanism and makes the recovery trade-off easier to preserve."
        cost_or_risk: "Technical sequencing can bury the business decision and may imply customer harm that has not been measured."
        valid_when: "The panel first asks how the dependency behaves under timeout, retry, or recovery pressure."
      decision_rule: "Lead with the audience’s requested decision or failure path, but keep the dependency facts, contribution, and certainty level invariant across every version."
    failure_probe:
      kind: edge_case
      prompt: "If the stakeholder says there was no customer-visible failure, how would you replace an overstrong risk claim while keeping the engineer’s timeout and recovery explanation?"
    evidence_check:
      basis: "Compare each audience version with the same dependency facts and label detected or managed risk separately from customer impact and personal ownership."
      source_kind: resume_derived
      limitation: "Audience adaptation changes framing, not evidence; the exercise does not verify a customer-visible effect, metric, causal result, or cross-team outcome."
      checked_on: "2026-08-25"
    certainty:
      level: medium
      rationale: "I am confident that the four audiences need different entry points, but the operational and customer consequences remain conditional until their evidence is named."
      update_trigger: "I would narrow or strengthen the risk wording when an incident trace, metric, or stakeholder decision confirms what was detected, managed, or changed."
    rubric:
      facts_correct: "Keeps the dependency, decision, and contribution stable while avoiding unsupported claims about customer exposure or outcome."
      assumptions_explicit: "Asks what the stakeholder needs to decide and separates that need from an assumption about customer impact."
      alternatives_considered: "Compares decision-first stakeholder framing with mechanics-first engineering framing and states when each is useful."
      tradeoff_quality: "Balances brevity, inspectable failure mechanics, audience priorities, and the risk of causal overstatement."
      follow_up_adaptation: "Rephrases the stakeholder version as detected or managed internal risk when new evidence removes customer-visible failure."
      certainty_calibration: "Uses stronger wording only when a trace or metric supports it and otherwise names the missing evidence."
    defense_checks:
    - id: career-07-recruiter-engineer-staff-stakeholder-adaptation-defense-audience-facts
      axis: adaptation
      prompt: "When the audience changes from recruiter to stakeholder, which fact must stay fixed even if the risk language becomes shorter?"
      best_answer: "The dependency condition, the decision I can explain, and the boundary of my contribution must stay fixed; I would change emphasis, not turn managed internal risk into an unsupported customer-impact claim."
      distractors:
      - text: "I would make the stakeholder version sound more severe and describe the dependency as an urgent customer risk, because urgency gets a decision faster than a careful qualification. I would state the likely customer consequence alongside the warning even without a trace or metric."
        why_wrong: "Urgency cannot justify changing the evidence or attributing customer impact without a trace or metric."
      - text: I would tell the stakeholder only that the system has a risk and that the
          engineering team has chosen the right path. I would omit the dependency,
          timeout, and recovery details, then ask for approval based on the conclusion
          rather than showing how the choice can be evaluated.
        why_wrong: "A concise risk statement still needs enough mechanism and ownership for the decision to be evaluated."
- id: career-08-star-and-care-framing
  version: 1.6.0
  target: career
  topic: STAR and CARE framing
  difficulty: 3
  interview_stage: behavioural_probe
  prompt: When do you use STAR and when do you use CARE?
  context: The practice curriculum defines CARE as Context, Actions, Result, Evaluate.
  best_answer: >-
    STAR gives a concise event shape: context, task, action, and a result I can corroborate.
    CARE adds Evaluate when reflection matters, so I can explain what I would test earlier,
    update the decision with new evidence, and separate my action from the team’s wider
    result while keeping the limits of each claim explicit.
  response_versions:
    short: >-
      STAR gives me context, task, action, and a corroborated result. I use CARE when the
      reflection matters too, so I can explain what I would test earlier without inflating
      the team’s result.
    medium: >-
      STAR gives a concise event shape: context, task, action, and a result I can
      corroborate. CARE adds Evaluate when reflection matters, so I can explain what I would
      test earlier, update the decision with new evidence, and separate my action from the
      team’s wider result while keeping the limits of each claim explicit.
    deep: >-
      For a Rails integration example, I would use STAR when the interviewer needs a
      compact account of what happened: the context, my task, the action I can defend, and
      a result I can corroborate. I would use CARE when the judgment after the event matters
      as much as the sequence: after Context, Actions, and Result, I would Evaluate the
      premise I held, the safeguard or check I would add, and the evidence that could
      change my view. I would not use the evaluation step to invent a better result. If the
      result is uncertain, I would keep the action and reasoning specific, label the
      outcome as unconfirmed, and explain what I would verify next. The framework changes
      the depth of reflection, not the evidence boundary.
  distractors:
  - text: STAR and CARE are basically the same, so I would choose whichever acronym
      I remember. I would fill in the sections as I talk, mention the situation and
      what happened, and use the framework mainly to ensure that the story has enough
      detail.
    trap: precision
    why_wrong: The answer loses CARE’s evaluation step, so the interviewer cannot hear
      what the candidate learned or would change after the event.
  - text: I would skip a structure and recount every detail in the order it comes back
      to me. That way the interviewer can hear the complete context, conversations,
      technical work, and outcome without my leaving out anything that might matter.
    trap: pragmatics
    why_wrong: The listener must reconstruct the situation, action, result, and reflection
      themselves, which obscures both judgment and evidence limits.
  sources:
  - repo: system-design-estudos
    path: interview/story-bank/01-ruby-rails-backend-story-bank.md
    note: Resume-derived career coaching.
  - repo: original
    path: english-arcade/career/8
    note: Authored interview-language coaching.
  provenance:
    evidence_class: resume_derived
    project: Backend career narrative
    repository: system-design-estudos
    files:
    - path: interview/story-bank/01-ruby-rails-backend-story-bank.md
      commit: 716a7d9
      claim: The story bank contains STAR-form technical stories and an evidence boundary
        warning that inferred implementation details need confirmation.
    verified_claims:
    - The story bank contains STAR-form technical stories and an evidence boundary warning
      that inferred implementation details need confirmation.
    confirmation_required:
    - 'Inventory observation as of 2026-08-25: the referenced resume PDF is absent from the searched workspace; that does not establish that it is unavailable elsewhere.'
    - Confirm ownership, metrics, and mechanisms before using role-specific detail.
    safe_interview_version: For a Rails integration example, STAR gives a compact event
      account, while CARE means Context, Actions, Result, Evaluate when the reflection
      matters too.
    confidentiality:
      level: medium
      note: Keep credentials, sensitive names, payloads, and nonpublic operational details
        out of the answer.
  feedback:
    register: Let STAR or CARE organize the answer quietly; saying the acronym repeatedly
      makes a reflection sound like a workshop exercise.
    hedging: 'Be exact about outcomes: state a corroborated result, or say it needs
      confirmation, while still explaining the action you can defend.'
    precision: Use STAR for the event shape and CARE when the value is the Evaluate
      step—what you would change after the dependency decision.
    grammar: Keep the framework labels parallel with complete expansions—“Situation,”
      “Task,” “Action,” “Result”—then switch cleanly to Context, Actions, Result, Evaluate.
    pragmatics: Separate your action from team work before the result, so the listener
      does not have to infer ownership from the framework.
  rephrase:
    prompt: Use CARE to reflect on a dependency decision without inventing a metric.
    goal: Make the Evaluate sentence useful even when the outcome source needs confirmation.
  follow_up:
    prompt: The panel says your STAR answer sounds complete but asks what you would
      change now. Where would you add evaluation without rewriting the result?
    goal: Use CARE’s evaluation step to expose learning while preserving the event and
      contribution boundary.
    challenge_kind: failure
    best_answer: 'I would keep the situation, task, action, and corroborated result
      in their original order, then add a short evaluation: what assumption I would
      test earlier and what safeguard I would choose now. I would separate my action
      from the team’s result and avoid adding a new outcome after the fact.'
    distractors:
    - text: I would choose the strongest outcome associated with the project and present
        it as the result of my action, so the behavioural answer ends on a clear success.
        I would use that improved result to give the story a stronger finish.
      why_wrong: It confuses reflection with rewriting history and makes the evidence
        boundary less trustworthy.
    - text: I would add every lesson I have learned since that event, from later
        reliability work to communication and leadership habits. A complete reflection
        should show everything the experience taught me, even when those lessons came
        from different projects and are not tied to the original action.
      why_wrong: Reflection should explain that decision and its evidence, not become
        a catalogue of later experience.
    answer_anchors:
    - Keep the original event and corroborated result.
    - Add one evaluation about a test or safeguard now.
    - Separate personal action from the wider team outcome.
  compression:
    prompt: Explain when you would choose STAR and when you would choose CARE in two
      sentences.
    goal: Contrast event clarity with reflective learning in natural language.
  language_focus:
  - precision
  - pragmatics
  - hedging
  feynman:
    concept: Use STAR for a compact event and CARE when evaluation changes what the
      listener needs to learn.
    explain_to: A behavioural interviewer asking both what happened and what you would
      change now.
    constraint: Explain the difference between your action, a shared result, and the
      Evaluate step; show where a new safeguard belongs without rewriting the event.
    self_check: Can the listener identify the decision you made, the result the team
      shared, and the evidence supporting the lesson you add?
    reasoning_check: If the result belongs to three engineers, can you keep it shared,
      name your decision, and use CARE to revise the next check rather than take sole
      credit?
  black_box:
    symptom: The behavioural answer ends with a polished result but cannot say what
      the candidate personally decided or what reflection is grounded in evidence.
    expected: The response should choose STAR or CARE for a reason, preserve the event,
      and make the responsibility boundary explicit.
    actual: I treated a stronger-sounding result as a substitute for identifying my
      action and the lesson that follows from it.
    root_cause: I collapsed team outcome, personal contribution, and evaluation into
      one success sentence, making the ownership claim impossible to defend.
    repair: Keep the shared result, isolate the personal decision, and add one Evaluate
      sentence tied to a concrete safeguard or earlier test.
    reasoning_error: 'This was an attribution error: the answer used outcome polish
      to hide an unexamined responsibility boundary.'
  recall:
    active_recall_cue: What is the honest first sentence for STAR and CARE framing?
    feynman_prompt: Can you explain STAR and CARE framing while naming the premise,
      alternative, and check that would change your confidence?
    black_box_probe: After an error on STAR and CARE framing, which hidden assumption
      or missing observation would you inspect first?
    leitner_start_box: 1
    mastery_threshold: 8
    delayed_variant:
      id: career-08-star-and-care-framing-delayed-1
      prompt: The interviewer says the result was shared by three engineers and asks
        what you alone decided. How would you revise the answer and what would you check?
      changed_constraint: The answer must distinguish a shared result from one personally
        owned decision without shrinking the team contribution.
      new_evidence: The panel clarifies that the stated result came from a joint effort
        rather than one person’s work.
      best_answer: I would keep the shared result but identify the concrete decision
        I made or recommended, such as choosing a bounded failure response and checking
        its signal. I would ask which action the panel wants unpacked, then verify that
        my wording does not turn a team outcome into individual ownership.
      distractors:
      - text: I would claim the full result as my own because I introduced the first idea
          in the discussion. Once my suggestion set the direction, I would describe the
          later actions, shared delivery, and final outcome as work I led, rather than
          separating my contribution from the team’s execution.
        why_wrong: Starting a discussion does not establish ownership of every action
          or the joint result.
      - text: I would remove the result entirely and describe only the situation and the
          work I suggested, because a shared outcome does not belong in a behavioural
          answer. I would avoid saying what changed and focus on my individual action
          instead.
        why_wrong: Shared results are valid when the individual decision and contribution
          boundary are explicit.
      answer_anchors:
      - Keep the joint result and name one personal decision.
      - Invite the panel to choose the action for deeper inspection.
      - Check that ownership language matches the evidence.
      reasoning_moves:
        preserve: Preserve the event sequence and the fact that the result was achieved
          by a team.
        revise: Revise individual-ownership wording so it covers only the decision the
          candidate can defend.
        verify: Check which action was personally made, recommended, or reviewed before
          assigning ownership language.
        certainty_update: Keep confidence in the described decision while narrowing
          certainty about individual responsibility for the shared result.
  extension:
    prompt: A recruiter asks for STAR in sixty seconds, while an engineer asks for CARE
      and the lesson. How would you keep the answer coherent?
    goal: Choose a structure that matches the audience without changing event facts
      or responsibility.
  critical_thinking:
    problem_frame: "The choice between STAR and CARE depends on whether the panel needs an event sequence or an explicit evaluation of what I learned, while the result must remain corroborated and separate from my personal action."
    claim_map:
      fact: "The prompt asks when to use STAR or CARE, and the authored answer reserves CARE’s evaluation step for reflection and an earlier assumption or safeguard."
      inference: "Adding evaluation can reveal judgment without changing the event, but it cannot turn an uncorroborated result into a verified outcome."
      assumption: "I should ask the interviewer directly: are you testing what happened, how I acted, or how my decision would change with new evidence?"
      unknown: "The panel’s desired depth, the available result source, and the boundary between my action and the team’s outcome are not yet known."
    comparison:
      applicable: true
      alternatives:
      - option: "Use STAR when the panel needs a concise sequence of situation, task, action, and corroborated result."
        benefit: "It keeps the account easy to follow and prevents reflection from obscuring what actually happened."
        cost_or_risk: "It can leave the reasoning and the next improvement implicit when the panel is assessing judgment."
        valid_when: "The recruiter asks for a short behavioural example or the event facts are the main decision."
      - option: "Use CARE when the panel wants evaluation, trade-offs, and the change I would make now."
        benefit: "It makes the assumption, lesson, and proposed safeguard explicit without rewriting the original event."
        cost_or_risk: "A long evaluation can sound retrospective or introduce a result that the evidence does not support."
        valid_when: "An engineer or staff interviewer asks what I learned, what failed in the reasoning, or what I would test earlier."
      decision_rule: "Start with STAR for event clarity; add CARE’s evaluation only when the question asks for judgment, and keep the result exactly as well-supported as before."
    failure_probe:
      kind: failure_mode
      prompt: "If the result cannot be corroborated during the interview, where would you stop the STAR account and how would you preserve a useful CARE reflection?"
    evidence_check:
      basis: "Compare the selected structure with the question, the available result evidence, and the separate boundaries for action, team outcome, and reflection."
      source_kind: resume_derived
      limitation: "A well-structured story cannot prove a result, ownership, or causality when its source and contribution boundary remain unconfirmed."
      checked_on: "2026-08-25"
    certainty:
      level: medium
      rationale: "The structural distinction is clear, while the correct form and the strength of the result statement depend on the panel’s question and evidence."
      update_trigger: "I would switch from STAR to CARE or narrow the result when the panel asks for learning, challenges the causal link, or exposes a missing source."
    rubric:
      facts_correct: "Keeps the event order and corroboration limit distinct from any outcome attributed to the wider group."
      assumptions_explicit: "Names whether the listener wants chronology, action, reflection, or a change in judgment before choosing the structure."
      alternatives_considered: "Compares STAR’s concise event shape with CARE’s evaluative extension and states the audience condition for each."
      tradeoff_quality: "Balances brevity, reflection, causal restraint, and the risk of adding an outcome after the fact."
      follow_up_adaptation: "Adds evaluation or removes an unsupported result when the panel changes the evidence or asks what would change now."
      certainty_calibration: "Keeps confidence in the structure separate from confidence in a result that still needs corroboration."
    defense_checks:
    - id: career-08-star-and-care-framing-defense-result-boundary
      axis: facts
      prompt: "What would you preserve if the interviewer accepted your action but challenged the evidence for the stated result?"
      best_answer: "I would keep the situation, task, and action I can defend, label the result as unconfirmed, and use CARE to explain the check or safeguard I would add rather than inventing a replacement outcome."
      distractors:
      - text: "I would keep the positive result and present it as the natural ending of the story, because a behavioural answer needs a clear success. If the source does not corroborate it, I would still preserve the outcome and use the action to make the result sound credible."
        why_wrong: "A polished ending cannot supply evidence for a result that the source does not corroborate."
      - text: "I would discard the story whenever its result is uncertain and choose an example with a cleaner outcome instead. An action without a confirmed result would not be useful, so I would avoid discussing the decision or the safeguard I would add."
        why_wrong: "The action and reasoning can still be useful evidence when their limits are stated clearly."
- id: career-09-a-difficult-metric-follow-up
  version: 1.6.0
  target: career
  topic: a difficult metric follow-up
  difficulty: 1
  interview_stage: behavioural_probe
  prompt: You mentioned improvement. What was the metric?
  context: The interviewer presses for a number that is present in secondary coaching
    evidence but has not been corroborated.
  best_answer: I would not state a number until its definition, baseline, and comparison
    window were corroborated. I can explain the method—measure the same signal before and
    after a bounded change—and keep any outcome claim conditional until that check is
    complete. I would also test for confounders before linking the change causally.
  response_versions:
    short: >-
      I would verify a metric’s definition, baseline, and comparison window before quoting
      it. I can still explain how to compare the same signal before and after a bounded
      change, while keeping causality conditional.
    medium: >-
      I would not state a number until its definition, baseline, and comparison window were
      corroborated. I can explain the method—measure the same signal before and after a
      bounded change—and keep any outcome claim conditional until that check is complete. I
      would also test for confounders before linking the change causally.
    deep: >-
      If an interviewer presses for a metric, I would first ask which service, signal,
      decision, baseline, and comparison window are in scope. I would not repeat a
      remembered number until its definition and source were corroborated. The useful
      answer I can give now is the measurement method: compare the same signal before and
      after a bounded change, align the observation windows, and check for other changes
      that could explain the movement. If those anchors are missing, I would withdraw the
      quantitative claim rather than make a correlated result sound causal. If they are
      available, I would state the measured result with its limits and explain what decision
      it supports. My confidence should increase with a reproducible source, not with the
      precision of the number.
  distractors:
  - text: I remember the number, and I would repeat it because a precise figure is more
      convincing. I would explain that the team tracked the improvement closely, give
      the percentage I recall, and use that result to show why the change was worthwhile.
    trap: hedging
    why_wrong: An uncorroborated number can be challenged immediately; the candidate
      then appears to value persuasion over reliable evidence.
  - text: The team improved it somehow, but I would rather not discuss how we measured
      it. I would focus on the general success of the work, say the outcome was positive,
      and move to another example if they keep asking about evidence.
    trap: precision
    why_wrong: This avoids the metric question rather than answering it, so the interviewer
      cannot distinguish a missing source from a missing measurement method.
  sources:
  - repo: system-design-estudos
    path: interview/story-bank/01-ruby-rails-backend-story-bank.md
    note: Resume-derived career coaching.
  - repo: original
    path: english-arcade/career/9
    note: Authored interview-language coaching.
  provenance:
    evidence_class: resume_derived
    project: Backend career narrative
    repository: system-design-estudos
    files:
    - path: interview/story-bank/01-ruby-rails-backend-story-bank.md
      commit: 716a7d9
      claim: The story bank contains an Evidence Boundary section that lists Rails,
        databases, queues, security, and distributed-backend themes as resume-backed
        material.
    verified_claims:
    - The story bank contains an Evidence Boundary section that lists Rails, databases,
      queues, security, and distributed-backend themes as resume-backed material.
    confirmation_required:
    - 'Inventory observation as of 2026-08-25: the referenced resume PDF is absent from the searched workspace; that does not establish that it is unavailable elsewhere.'
    - Confirm ownership, metrics, and mechanisms before using role-specific detail.
    safe_interview_version: I would verify a remembered metric before stating it, but
      I can explain the measurement path from baseline through bounded change and comparable
      follow-up.
    confidentiality:
      level: medium
      note: Keep credentials, sensitive names, payloads, and nonpublic operational details
        out of the answer.
  feedback:
    register: Answer the challenge calmly and plainly; a careful evidence boundary is
      stronger than a defensive explanation for a missing number.
    hedging: Use a direct limit—“I would not state a number until I can corroborate
      it”—instead of vague fillers such as “roughly” or “about.”
    precision: 'Describe the measurable sequence: baseline, dominant cost, bounded change,
      then the same signal afterward.'
    grammar: Keep the verification sequence in parallel imperatives—“establish,” “identify,”
      “make,” and “compare”—so the method is easy to follow.
    pragmatics: Offer the original source as the next check when the number matters;
      that keeps the conversation moving without fabricating a headline.
  rephrase:
    prompt: Explain the missing metric to a hiring manager who wants a headline result.
    goal: Preserve candor while showing that you understand how the result should be
      verified.
  follow_up:
    prompt: The interviewer asks for the exact baseline and says a qualitative answer
      is not enough. How would you remain useful without quoting a number you cannot
      support?
    goal: Respond candidly to metric pressure while offering a reproducible verification
      path.
    challenge_kind: new_evidence
    best_answer: I would say I cannot responsibly quote the exact baseline yet, then
      describe the metric definition, time window, and comparison I would verify. If
      the number changes the hiring decision, I would state the source I need to check
      and keep the conclusion conditional until it is confirmed.
    distractors:
    - text: I would give the percentage I remember and call it an estimate, then explain
        that the baseline moved by roughly that amount after the change. Adding an
        approximation would make the figure sound cautious while still giving the hiring
        panel a concrete improvement to consider.
      why_wrong: A hedge does not make an unverified number evidence; it can still mislead
        the interviewer.
    - text: I would refuse to discuss the improvement until I recovered the exact figure,
        because any conversation without a precise number could create a misleading
        impression. I would leave the metric definition, comparison window, and measurement
        method out of the answer and wait until every detail was available.
      why_wrong: The method, metric definition, and verification plan can still demonstrate
        useful judgment without inventing precision.
    answer_anchors:
    - Decline to quote an unverified baseline as fact.
    - Define the metric, window, and comparison to verify.
    - Explain why the number matters and keep the conclusion conditional.
  compression:
    prompt: Reply to the metric question in one candid sentence.
    goal: State the verification limit and the measurement method without sounding evasive.
  language_focus:
  - precision
  - pragmatics
  - hedging
  feynman:
    concept: Answer metric pressure with a definition and verification path instead
      of manufactured precision.
    explain_to: An interviewer who asks for the baseline, period, and exact percentage
      behind an improvement claim.
    constraint: Explain why metric definition, population, time window, and comparison
      method must align before a number supports a result or causal claim.
    self_check: Can the listener tell what you can explain now—the measurement method—from
      the percentage you still need to verify?
    reasoning_check: If the remembered figure used a different time window, can you
      withdraw the comparison, preserve the measurement plan, and state what evidence
      would restore the claim?
  black_box:
    symptom: A plausible percentage appears in the answer, but the baseline and comparison
      period do not describe the same population or window.
    expected: The response should define the signal, acknowledge the evidence gap, and
      offer a reproducible check before discussing impact.
    actual: I used a hedge such as ‘approximately’ to make an unverified number sound
      responsible.
    root_cause: I mistook uncertainty in memory for acceptable measurement error and
      skipped the comparability test that gives a metric meaning.
    repair: Withdraw the number, align definitions and periods, and keep only the bounded
      decision to measure before and after the change.
    reasoning_error: 'The reasoning overfit to a memorable result: plausibility replaced
      a valid baseline and encouraged a causal conclusion without a controlled comparison.'
  recall:
    active_recall_cue: What is the honest first sentence for a difficult metric follow-up?
    feynman_prompt: Can you explain a difficult metric follow-up while naming the premise,
      alternative, and check that would change your confidence?
    black_box_probe: After an error on a difficult metric follow-up, which hidden assumption
      or missing observation would you inspect first?
    leitner_start_box: 1
    mastery_threshold: 8
    delayed_variant:
      id: career-09-a-difficult-metric-follow-up-delayed-1
      prompt: A later check finds that the metric used a different time window from
        the comparison period. How would you correct your answer and what decision can
        still stand?
      changed_constraint: The before-and-after metric is not comparable until its time
        windows and measurement definitions are aligned.
      new_evidence: The verification shows that the remembered figure came from a different
        reporting window than the proposed baseline.
      best_answer: I would withdraw the apparent percentage comparison and state that
        the current evidence does not support a quantified improvement. I would align
        the windows and definitions, then keep only the decision to measure the dominant
        cost before and after a bounded change; any outcome claim waits for comparable
        data.
      distractors:
      - text: I would keep the percentage comparison and say that the direction is probably
          right even if the windows are not perfectly aligned. The approximate result still
          shows that the change helped, so I would retain the improvement claim and explain
          the mismatch only if someone pressed for detail.
        why_wrong: A direction inferred from incomparable windows is not enough to support
          a quantified or causal claim.
      - text: I would drop the metric definition and comparison method and rely on the
          interviewer’s impression that the system improved. A confident account of better
          performance would be more persuasive than discussing baselines, windows, or
          which signal was measured.
        why_wrong: The measurement method remains useful; the problem is the comparison,
          not the idea of measuring.
      answer_anchors:
      - Withdraw the unsupported comparison.
      - Align definitions and time windows before calculating a result.
      - Keep the measurement decision while withholding the outcome claim.
      reasoning_moves:
        preserve: Preserve the plan to define a baseline and compare the same signal
          after a bounded change.
        revise: Revise the quantified improvement claim because the measurement windows
          are not comparable.
        verify: Align metric definitions and periods, then recalculate before stating
          a result.
        certainty_update: Lower certainty to no quantified outcome until comparable
          data is verified.
  extension:
    prompt: The staff interviewer asks which metric would change your architectural
      recommendation. How would you answer without confusing correlation with causation?
    goal: Connect metric choice to a decision while naming the evidence needed to support
      causality.
  critical_thinking:
    problem_frame: "The metric answer must resist pressure for a headline number by defining the signal, baseline, comparison window, and causal limitation before saying whether the change supports a result."
    claim_map:
      fact: "The interviewer asks for the metric behind an improvement, while the authored response treats the requested figure as unconfirmed until its source and comparison context are checked."
      inference: "A bounded measurement method can make the next verification useful, but it does not turn an absent baseline or a correlated change into a proven result."
      assumption: "I should ask directly: which service, signal, and decision are in scope, and are you evaluating latency, throughput, error rate, or the causal explanation?"
      unknown: "The metric source, baseline value, observation window, comparison group, and confounding changes are not established by the question alone."
    comparison:
      applicable: true
      alternatives:
      - option: "Hold the number and name the exact source, definition, and window needed to verify it."
        benefit: "It protects factual accuracy while giving the interviewer a reproducible path to the answer that matters."
        cost_or_risk: "The response may feel less satisfying when the panel expects an immediate headline or uses the number as a screening signal."
        valid_when: "The baseline or source is missing, ambiguous, or not safe to quote from memory."
      - option: "State a clearly labelled proxy or directional observation while refusing to call it the requested metric."
        benefit: "It keeps the conversation useful when a related signal is available and can guide the next measurement."
        cost_or_risk: "The listener may mistake the proxy for the requested result if the definition and limitation are not repeated."
        valid_when: "The proxy has a known source and the distinction cannot change the decision without a verified primary metric."
      decision_rule: "Do not quote a number without its source and comparison window; offer a labelled proxy only when its definition is explicit and the hiring decision does not depend on treating it as the requested metric."
    failure_probe:
      kind: counterexample
      prompt: "If the signal improved while the traffic mix and database version also changed, what evidence would you need before attributing the improvement to your change?"
    evidence_check:
      basis: "Compare the requested metric with its definition, baseline, window, source, and possible confounders before making an improvement or causal claim."
      source_kind: resume_derived
      limitation: "The exercise can specify a measurement plan, but it cannot recover a missing number, prove causality, or establish ownership of an unverified improvement."
      checked_on: "2026-08-25"
    certainty:
      level: low
      rationale: "I can defend the measurement discipline, but certainty about the actual improvement is low until the primary source, baseline, and comparison conditions are checked."
      update_trigger: "I would strengthen or weaken the conclusion when the source confirms the definition, window, baseline, and whether other changes explain the movement."
    rubric:
      facts_correct: "Refuses unsupported numbers and names the metric information required to make the answer reproducible."
      assumptions_explicit: "Clarifies the signal and decision in scope instead of assuming that every improvement refers to the same measure."
      alternatives_considered: "Compares withholding the number with offering a labelled proxy and states the evidence condition for each."
      tradeoff_quality: "Balances usefulness, interview pressure, definition drift, and the danger of confusing correlation with causation."
      follow_up_adaptation: "Adds a confounder check or narrows the claim when the interviewer changes the window, baseline, or decision."
      certainty_calibration: "Keeps confidence low about the result until a primary source supports the metric and its causal interpretation."
    defense_checks:
    - id: career-09-a-difficult-metric-follow-up-defense-metric-validity
      axis: certainty
      prompt: "Which missing measurement detail would stop you from quoting an improvement even if someone remembered an approximate number?"
      best_answer: "I would stop if I could not identify the metric definition, baseline, and comparison window; an approximate value without those anchors could describe a different signal or period."
      distractors:
      - text: "I would quote the approximate number and add ‘roughly,’ then use it as the improvement figure for the project. The percentage would be enough to describe the change without defining the signal, establishing the baseline, or aligning the comparison window."
        why_wrong: "A hedge does not repair a missing definition, baseline, or comparison window."
      - text: "I would refuse every quantitative question and keep interviews focused on design choices, because numbers invite disputes about definitions and measurement periods. I would describe the method only in general terms and avoid giving any value, baseline, or comparison."
        why_wrong: "A sourced, well-defined measurement is useful; the boundary is verification, not avoidance of numbers."
- id: career-10-clarification-before-commitment
  version: 1.6.0
  target: career
  topic: clarification before commitment
  difficulty: 2
  interview_stage: behavioural_probe
  prompt: Before you claim ownership, what would you clarify?
  context: A follow-up asks the candidate to distinguish a personal action from a team
    or repository outcome.
  best_answer: Before claiming ownership, I would clarify whether the question concerns
    a technical decision, delivery responsibility, or an outcome. I can defend a personal
    action and its evidence; I would label a team result as shared rather than take credit
    for it. That distinction lets me answer promptly without hiding behind ambiguity.
  response_versions:
    short: >-
      Before claiming ownership, I would ask whether the interviewer means a decision,
      implementation responsibility, or an outcome. I would answer the supported part and
      label any team result as shared.
    medium: >-
      Before claiming ownership, I would clarify whether the question concerns a technical
      decision, delivery responsibility, or an outcome. I can defend a personal action and
      its evidence; I would label a team result as shared rather than take credit for it.
      That distinction lets me answer promptly without hiding behind ambiguity.
    deep: >-
      Before claiming ownership, I would ask what the interviewer means by the word: a
      technical decision, implementation responsibility, or accountability for an outcome.
      I would then answer the supported part instead of delaying the conversation. I can
      describe a personal action, the decision boundary I reviewed, and the evidence around
      it. If the result belonged to a team, I would label it as shared; if the source is
      incomplete, I would say that confirmation is still needed. This distinction prevents
      a strong outcome from implying that I made every decision or delivered it alone. If
      the interviewer clarifies that they want outcome accountability, I would explain my
      contribution and the squad boundary separately, then verify the source for any causal
      or quantitative claim.
  distractors:
  - text: Because I was on the team, I would describe the whole outcome as my achievement.
      I would explain that everyone contributed in different ways, then use “I” throughout
      because the result reflects the work the group delivered together.
    trap: precision
    why_wrong: The interviewer may ask which decision was personally made; claiming
      the team result as individual ownership destroys the attribution boundary.
  - text: Since work is collaborative, I would avoid naming any action I took. I would
      describe the team process, use “we” for every decision, and leave the interviewer
      to infer how I participated from the project context.
    trap: pragmatics
    why_wrong: That answer is so cautious that the interviewer cannot evaluate the candidate’s
      judgment, scope, or contribution within the team context.
  sources:
  - repo: system-design-estudos
    path: interview/story-bank/01-ruby-rails-backend-story-bank.md
    note: Resume-derived career coaching.
  - repo: original
    path: english-arcade/career/10
    note: Authored interview-language coaching.
  provenance:
    evidence_class: resume_derived
    project: Backend career narrative
    repository: system-design-estudos
    files:
    - path: interview/story-bank/01-ruby-rails-backend-story-bank.md
      commit: 716a7d9
      claim: The story bank contains an Evidence Boundary section that lists Rails,
        databases, queues, security, and distributed-backend themes as resume-backed
        material.
    verified_claims:
    - The story bank contains an Evidence Boundary section that lists Rails, databases,
      queues, security, and distributed-backend themes as resume-backed material.
    confirmation_required:
    - 'Inventory observation as of 2026-08-25: the referenced resume PDF is absent from the searched workspace; that does not establish that it is unavailable elsewhere.'
    - Confirm ownership, metrics, and mechanisms before using role-specific detail.
    safe_interview_version: Before taking ownership credit, I would clarify my decision
      scope, the team contribution, and the evidence connecting either to an observed
      outcome.
    confidentiality:
      level: medium
      note: Keep credentials, sensitive names, payloads, and nonpublic operational details
        out of the answer.
  feedback:
    register: Use straightforward ownership language—“I made,” “I reviewed,” or “the
      team decided”—instead of grand or evasive phrasing.
    hedging: Qualify the claim when the source is only a study narrative, but do not
      blur a specific action you can actually support.
