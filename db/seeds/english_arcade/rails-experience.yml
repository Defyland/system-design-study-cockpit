    verified_claims:
    - FlowBridge code, tests, and consistency guidance establish durable execution state, correlation context, leases, bounded retry, and dead letters.
    - SettleFlow’s 8a6117b code, publisher, ADR, and tests establish a transactional outbox/ActiveJob boundary with correlation, idempotency, retry, and dead-letter state; later 9b17f12 adds the publishing claim lease.
    - No cited artifact establishes Kafka, a live deployment, external consumer behavior, personal authorship, or a measured financial result.
    confirmation_required:
    - Confirm authorship, intended role, consumer contract, deployment context, and any measured result before presenting either repository as personal production work.
    safe_interview_version: A portfolio implementation discussion can explain FlowBridge durable
      execution and SettleFlow outbox recovery, including their failure boundaries, without claiming
      Kafka, deployed operation, personal ownership, consumer impact, or a financial result.
    confidentiality:
      level: medium
      note: Keep credentials, sensitive names, payloads, and nonpublic operational
        details out of the answer.
  feedback:
    register: Explain durable execution state and the delivery boundary in chronological order,
      then name the recovery evidence rather than starting with a broker label.
    hedging: Present FlowBridge and SettleFlow as portfolio implementations; do not imply personal
      responsibility for a deployment, an external consumer, or a messaging outcome.
    precision: Distinguish a node lease and retry state from an outbox claim and downstream delivery;
      neither acknowledgement nor a dead letter alone proves an external effect.
    grammar: >-
      Keep the sequence explicit: persist state, claim work, attempt delivery, then record success,
      retry, or dead letter.
    pragmatics: Answer why the outbox is needed at the domain-write boundary and say what remains
      to verify before calling the workflow durable end to end.
  rephrase:
    prompt: Explain to a stakeholder why an outbox record is more informative than a queue
      acknowledgement when a domain change and its notification must not diverge.
    goal: Describe the domain-state, pending-delivery, and recovery trade-off in business language
      without promising delivery or a production result.
  follow_up:
    prompt: A SettleFlow publisher crashes after claiming an outbox event but before delivery is
      confirmed. What state and downstream behavior make recovery safe?
    goal: Connect the publishing lease, retry or dead-letter transition, stable event identity, and
      consumer idempotency without treating a claim as proof of delivery.
    challenge_kind: failure
    best_answer: >-
      I would treat the event as publishing, not published, until the delivery result is recorded.
      The lease timeout should make it claimable again; a failed attempt should return it to pending
      with bounded backoff or move it to dead letter after the limit. The envelope needs a stable
      event identity, and the downstream handler must make a repeated delivery harmless or reconcile
      it from durable state. I would inspect the event status, attempt history, error, and consumer
      record before declaring recovery complete. A successful claim proves ownership of an attempt,
      not that an external system received the event.
    distractors:
    - text: I would mark the event published as soon as the publisher claims it, because the lease proves that the downstream adapter has accepted the envelope. A later retry can run the handler again without an event identity because the first claim is authoritative. I would close the outbox row immediately and let lease expiry serve as the audit trail; if a duplicate notification appears, the receiver can ignore it by comparing payload text. A claim is therefore enough to move the workflow forward, and a missing consumer record would be treated as delayed observability rather than uncertain delivery.
      why_wrong: A claim only records an in-flight attempt; it does not prove delivery, and a
        replay without stable identity can duplicate downstream work.
    - text: I would delete the event after the first failed publish and let the workflow’s next node recreate it, because a durable outbox mainly stores successful notifications. The failed attempt has no useful delivery state, so retaining it would only invite duplicate sends. I would advance the workflow after enqueuing a replacement, use the new row’s creation time as its identity, and let the adapter decide whether an old message was already accepted. If the replacement also fails, I would stop retrying and rely on a later reconciliation report.
      why_wrong: Deleting the pending record loses the recovery evidence and can separate a
        domain state transition from its required notification.
    answer_anchors:
    - Treat an outbox claim as an in-flight lease, not evidence that delivery completed.
    - Use stable event identity and downstream idempotency across retry or redelivery.
    - Reconcile status, attempts, errors, correlation, and consumer evidence before closing recovery.
  compression:
    prompt: Give a 30-second answer to “Why use an outbox at a domain-write boundary?”
    goal: Retain the domain-state, pending-delivery, and replay guard in plain language without
      promising that an external consumer received the event.
  language_focus:
  - precision
  - pragmatics
  - hedging
  feynman:
    concept: An outbox record makes pending delivery visible after a domain write, but it does
      not turn a lease claim into proof that a downstream consumer processed the event.
    explain_to: A teammate who says that enqueue acknowledgement is enough to guarantee delivery.
    constraint: Use FlowBridge’s durable execution state and SettleFlow’s outbox to distinguish
      local recovery evidence from an external delivery guarantee.
    self_check: Can you identify the event identity, claim lease, retry/dead-letter transition,
      and consumer evidence needed to tell a replay from a new business effect?
    reasoning_check: Explain an enqueue gap or publisher crash, then compare direct enqueue with
      the outbox and name the trace or consumer record that would change your recommendation.
  black_box:
    symptom: The response treats a FlowBridge lease or a SettleFlow enqueue acknowledgement as
      proof that the next system received the work, without naming the pending state or replay path.
    expected: A durable node or outbox state, an explicit claim/attempt transition, an idempotent
      consumer boundary, and evidence that separates delivery from local ownership.
    actual: A queue-first explanation that collapses claim, publish, acknowledgement, and consumer
      processing into one success event.
    root_cause: The answer confuses a local persistence boundary with an end-to-end delivery
      guarantee and ignores the failure window between database commit and queue handling.
    repair: Name the authoritative row, preserve its identity through retries, record lease and
      delivery transitions, and inspect consumer evidence before closing the recovery path.
    reasoning_error: The mistake is treating an enqueue or claim as proof of an external effect.
      Repair it by separating workflow/outbox state from adapter delivery, testing claim races and
      duplicate handling, and stating exactly which evidence remains unavailable.
  recall:
    active_recall_cue: What evidence distinguishes an outbox event waiting for delivery from one
      already processed by a downstream consumer?
    feynman_prompt: Explain why a FlowBridge lease or an outbox claim does not prove end-to-end delivery.
    black_box_probe: Did you separate local state recovery from consumer acknowledgement and replay?
    leitner_start_box: 1
    mastery_threshold: 8
    delayed_variant:
      id: rails_experience-05-recent-volume-finance-and-messaging-delayed-5
      prompt: FlowBridge’s workflow execution is queued, but the queue write fails after the database commit; meanwhile, a SettleFlow outbox publisher has an expired claim. Which states do you preserve, revise, and verify?
      changed_constraint: Queue acknowledgement is separate from the committed workflow state, and an expired outbox claim may be reclaimed without creating two active executions.
      new_evidence: The consistency guidance describes recovery of stale queued executions, while the later 9b17f12 outbox model exposes pending and stale-publishing records for another claim.
      best_answer: >-
        I would preserve the committed workflow and outbox rows as the source of recovery evidence.
        I would revise the assumption that an enqueue acknowledgement proves delivery: a recovery
        job must find the stale queued execution, while the publisher may reclaim the expired outbox
        lease and attempt delivery again. I would verify that ExecutionRunner’s active guard prevents
        a second attempt, that the outbox claim is serialized, and that the consumer handles a repeated
        event identity. The evidence establishes local recovery paths, not a successful external
        delivery or an end-to-end production guarantee.
      distractors:
      - text: I would recreate the workflow because the queue acknowledgement failed, and I would delete the expired outbox row so a publisher cannot send the event twice. I would treat both records as failed because neither queue acknowledgement nor the expired claim proves useful work. Recreating the workflow gives the next worker a clean state, and deleting the old outbox prevents duplicate delivery; I would use the newest row as the only source of truth and investigate any missing event after the scan completes.
        why_wrong: The committed rows are the recovery evidence; recreating or deleting them can
          duplicate execution or erase the delivery state needed to reconcile a retry.
      - text: I would let both workers run because a row lock is only an implementation detail, then decide which result to keep from the last message received. The latest result is the most complete view, so I would ignore attempt histories and allow the outbox status to follow whichever worker writes last. If two side effects differ, I would manually reconcile the payload after the deadline instead of preventing concurrent attempts.
        why_wrong: The active execution guard and outbox claim are correctness boundaries; accepting
          concurrent attempts and last-write-wins would obscure duplicate effects.
      answer_anchors:
      - Preserve committed workflow/outbox rows as local recovery evidence.
      - Revise the assumption that queue acknowledgement or an expired claim proves delivery.
      - Verify active-attempt guards, serialized claims, event identity, and consumer replay handling.
      reasoning_moves:
        preserve: Keep durable workflow and outbox rows available for recovery.
        revise: Replace acknowledgement-as-delivery with stale-state recovery and lease reclamation.
        verify: Test active-attempt guards, claim races, event identity, and consumer replay behavior.
        certainty_update: Lower confidence in end-to-end delivery, while retaining confidence in the cited local recovery mechanisms.
  extension:
    prompt: Compare direct enqueue with the FlowBridge recovery job and the SettleFlow outbox
      when a database commit succeeds but delivery acknowledgement is missing; defend the
      boundary and name the observation that would change your choice.
    goal: Explain a concrete local-state-versus-delivery trade-off with lease recovery, idempotent
      handling, and calibrated certainty.
  critical_thinking:
    problem_frame: >-
      Frame the decision as two related boundaries: FlowBridge must recover a workflow from
      durable node state, while SettleFlow must not lose an event between a domain write and
      delivery. Ask which state is authoritative, how correlation survives retry, whether the
      consumer is idempotent, and what enqueue acknowledgement does not prove.
    claim_map:
      fact: FlowBridge records workflow and node attempts under leases, bounds retries, and dead-letters
        exhausted work; SettleFlow emits an outbox event with domain state and tracks delivery state.
      inference: Durable rows can support recovery, but they do not by themselves prove an external
        consumer received an event or that enqueue and domain commit are one atomic operation.
      assumption: I am assuming downstream handlers can carry a stable identity and that a recovery
        worker may inspect stale state; I would confirm the consumer contract and replay policy.
      unknown: The external adapter’s delivery guarantee, consumer deduplication, concurrency limits,
        deployment ownership, live operation, and measured outcome remain unconfirmed.
    comparison:
      applicable: true
      alternatives:
      - option: Enqueue directly after the domain write and rely on the queue acknowledgement.
        benefit: It is simple and can reduce the amount of durable delivery state in the application.
        cost_or_risk: A process or connection failure between commit and enqueue can leave work unannounced, and acknowledgement does not prove consumer processing.
        valid_when: Losing an event is acceptable or another authoritative recovery path scans the domain state.
      - option: Write a transactional outbox event with the domain state, then lease and publish it.
        benefit: It makes the pending delivery visible and gives retry, dead-letter, and reconciliation a durable record.
        cost_or_risk: It adds a publisher, lease races, duplicate delivery, and a consumer idempotency obligation.
        valid_when: The domain change and notification must not diverge and downstream consumers can handle replay.
      decision_rule: Prefer the outbox when domain state and delivery must stay recoverable; use direct enqueue only when its loss and acknowledgement boundaries are explicitly acceptable.
    failure_probe:
      kind: edge_case
      prompt: If FlowBridge records a node output but the lease expires before the next step is acknowledged, what duplicate attempt or missing transition could appear, and how would you reconcile it with SettleFlow’s outbox state?
    evidence_check:
      basis: Compare FlowBridge execution, retry, consistency, and SettleFlow outbox files in the cited commits; keep repository mechanisms separate from consumer operation and impact evidence.
      source_kind: primary_code
      limitation: The cited code, tests, and guidance establish leases, retry/dead-letter state, and an outbox boundary, not Kafka, live delivery, authorship, consumer behavior, or a financial result.
      checked_on: '2026-08-25'
    certainty:
      level: low
      rationale: Confidence is strong about the cited state and delivery mechanisms, but low about external delivery, consumer deduplication, deployment context, and impact.
      update_trigger: Update after an enqueue-gap trace, claim-race test, duplicate delivery, consumer contract, or recovery observation changes the boundary.
    rubric:
      facts_correct: Distinguishes FlowBridge and SettleFlow mechanisms from unverified external delivery, Kafka, authorship, operation, or impact.
      assumptions_explicit: Names the stable identity, lease expiry, consumer replay, enqueue-gap, and recovery-worker assumptions before claiming durability.
      alternatives_considered: Compares direct enqueue with a transactional outbox and states when each boundary is acceptable.
      tradeoff_quality: Weighs loss windows, lease complexity, duplicate delivery, recovery visibility, and consumer obligations.
      follow_up_adaptation: Revises recovery when a lease expires, an enqueue gap appears, or a consumer repeats a delivery.
      certainty_calibration: Uses medium confidence for cited repository mechanisms and low confidence for external operation, ownership, and impact.
    defense_checks:
    - id: rails_experience-05-recent-volume-finance-and-messaging-defense-confirmation
      axis: adaptation
      prompt: A reviewer says the queue acknowledgement proves that a FlowBridge execution and a SettleFlow notification are complete. Which evidence would you request before accepting that conclusion?
      best_answer: I would request the workflow or outbox state transition, lease and attempt history, delivery result, and consumer record. An enqueue acknowledgement shows a local handoff, not that the downstream effect was processed or that a replay would be harmless.
      distractors:
      - text: I would accept it because the queue has acknowledged the job, so the consumer and the external adapter cannot have missed anything. A queue acknowledgement transfers responsibility completely, so I would not request a consumer trace or delivery record; a missing message would be an external-system problem.
        why_wrong: Local acknowledgement does not establish downstream processing, delivery, or
          idempotent replay.
      - text: I would reject the outbox and delete its row after the first attempt, because a second attempt would necessarily duplicate the notification. The row itself is expendable once attempted, so I would prefer deletion to keeping a replayable identity; any duplicate concern can be settled from the provider log later.
        why_wrong: Lease-based retry and stable event identity are the recovery boundary; deleting
          the row removes the evidence needed to distinguish a retry from a duplicate effect.
- id: rails_experience-06-job-search-dashboard-retries-and-throttling
  version: 1.6.0
  target: rails_experience
  topic: Job Search Dashboard retries and throttling
  difficulty: 1
  interview_stage: technical_screen
  prompt: Your Rails service scans several job sources, but one starts throttling
    while another fails intermittently. How would you preserve useful partial results?
  context: The interviewer wants a failure-aware account of host-local pacing, bounded retry,
    and partial completion grounded in inspectable portfolio artifacts rather than an assertion
    of operational experience; sequential ordering does not establish global fairness or prevent starvation.
  best_answer: >-
    In the Job Search Dashboard portfolio code, Fetcher spaces requests per host, adds jitter,
    retries bounded transient failures, and parses only integer Retry-After delta-seconds. Its
    clock, sleeper, and random source are injectable. Orchestrator processes sources in priority
    and name order, records source-level statuses and errors, and can finish partially when one
    scan fails. That establishes inspectable behavior and test specifications, not global fairness,
    starvation prevention, authorship, operation, or user impact. I would classify read-only fetches separately from any
    side effect and require idempotency or reconciliation before retrying an uncertain mutation.
  response_versions:
    short: >-
      In the Job Search Dashboard portfolio code, Fetcher paces each host, adds jitter, bounds
      transient retries, and accepts only integer Retry-After delta-seconds. The orchestrator records source
      errors and can preserve partial completion. I would keep read retries separate from uncertain
      mutations; this is code evidence, not proof of global fairness or starvation prevention, operation, or user impact.
    medium: >-
      In the Job Search Dashboard portfolio code, Fetcher spaces requests per host, adds jitter,
      retries bounded transient failures, and parses only integer Retry-After delta-seconds. Its
      clock, sleeper, and random source are injectable. Orchestrator processes sources in priority
      and name order, records source-level statuses and errors, and can finish partially when one
      scan fails. That establishes inspectable behavior and test specifications, not global fairness,
      starvation prevention, authorship, operation, or user impact. I would classify read-only fetches separately from any
      side effect and require idempotency or reconciliation before retrying an uncertain mutation.
    deep: >-
      I would separate transport behavior from a global fairness or production claim. Fetcher spaces
      requests per host, adds jitter, retries a bounded set of transient statuses, and parses only
      integer Retry-After delta-seconds; its clock, sleeper, and random source are injectable for
      tests. Orchestrator visits sources in priority/name order, records source-level status and
      errors, and can finish with partial results when one scan fails. Sequential ordering does not
      prove global fairness or prevent starvation, so I would compare the current bounded loop with a deadline-aware design
      only after clarifying the product’s completeness contract. For a read-only fetch I can retry
      within those limits; for an uncertain mutation I would require idempotency or reconciliation,
      then verify request count, deadline behavior, and recorded partial state. The repository
      establishes code and test specifications, not authorship, operation, or user impact.
  distractors:
  - text: I would retry every source at the same rate until it succeeds. A timeout
      means the remote service did nothing, so repeating the request is safe. If one
      source keeps failing, I would fail the entire scan because partial data is worse
      than no data and makes the dashboard harder to explain transparently to stakeholders.
      I would apply the same delay to every host, ignore the source’s own throttle signal,
      and discard successful results from healthy sources until the slowest adapter catches up.
    trap: precision
    why_wrong: It ignores host-specific throttling and treats a timeout as proof that
      no side effect happened, while discarding source-level failure information.
  - text: I would use one global backoff and a real sleep call because deterministic
      tests are less important than production realism. Retry-After can be ignored
      if the scanner needs fresh results. I would record only an overall success flag,
      since users do not need to know which source caused a delay. I would apply the same
      schedule to every host so the implementation stayed simple, retry on any non-success
      status, and let a background worker sleep between attempts. A single aggregate state
      would keep the dashboard concise; an operator could inspect logs only when a source
      appeared stuck or returned no rows.
    trap: pragmatics
    why_wrong: It removes the controls that make pacing testable, violates a source’s
      stated delay, and hides the partial state needed for an honest user-facing result.
