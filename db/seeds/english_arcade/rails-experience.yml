    verified_claims:
    - SupportNest controller, authorization matrix, model, and tests establish application-level tenant lookup and role behavior.
    - The threat model records the guessed-public-ID BOLA case and its application-scope mitigation.
    - The integration fixture distinguishes a cross-tenant not-found response from a viewer-forbidden write.
    - No cited artifact establishes a production incident, database row-level security, exploit execution, authorship, or impact.
    confirmation_required:
    - Confirm authorship, intended role, deployment context, database isolation strategy, and any observed security result before presenting this as personal production work.
    safe_interview_version: A portfolio SupportNest implementation discussion can explain
      tenant-scoped lookup, role authorization, and cross-tenant testing without claiming a breach,
      database RLS, deployed operation, personal ownership, or impact.
    confidentiality:
      level: medium
      note: Keep credentials, sensitive names, payloads, and nonpublic operational
        details out of the answer.
  feedback:
    register: Speak in security terms that name the authorization boundary and the
      attack path, rather than calling a generic login check “secure”.
    hedging: Keep the response at the level of documented security reasoning; do not
      turn it into an assertion about an incident, an adversarial exercise, or impact.
    precision: Contrast a scoped record lookup with a naked ID lookup, and separate
      bindable values from dynamic SQL identifiers that need an allowlist.
    grammar: Use “through the actor’s scope” or “through a policy” as complete phrases
      so the authorization mechanism is clear.
    pragmatics: Start with the caller’s access boundary, then widen the discussion
      to the repeated code pattern; that sequence answers both the immediate and durable
      fix.
  rephrase:
    prompt: Explain the fix to a product manager who asks why hiding another account’s
      link in the interface does not resolve the risk.
    goal: Translate object-level authorization into a user-facing consequence without
      reducing it to a vague “permissions” statement.
  follow_up:
    prompt: You discover several controllers use policy checks but a background job
      updates records from an external identifier. Where would you look next?
    goal: Show that authorization and validation boundaries must cover non-HTTP entry
      points and that the documented example does not establish a completed audit.
    challenge_kind: new_evidence
    best_answer: >-
      I would trace the background job from its input identifier to the record lookup and policy
      decision, then compare that path with the controller checks. A controller policy does not
      protect a worker that calls a naked `find`, and a permitted identifier still needs an actor
      or tenant scope. I would inspect serializers, callbacks, admin paths, and dynamic query
      helpers for the same boundary, then add a focused test for cross-account access and unsafe
      fields. The observation shows a coverage gap to investigate; it does not prove an incident
      or that every route is vulnerable.
    distractors:
    - text: I would trust the existing controller policies because the job runs inside Rails, and add a UI warning if the identifier looks suspicious. The framework context should make the route’s policy available automatically, so I would treat the job as covered without tracing its actor or tenant. I would let the client flag suspicious identifiers, rely on an audit log to catch bad selection later, and replay a failed job rather than add a server-side scope.
      why_wrong: A background entry point can bypass controller policy, and client warnings do
        not enforce object authorization on the server.
    - text: I would declare the whole application compromised and rewrite every authorization path before tracing the job’s actual lookup and actor context. A single unscoped external identifier would mean every controller, worker, export, and serializer shares the same vulnerability, so I would replace them in one migration. I would disable all background processing until the rewrite ships, skip a focused reproduction because the risk is already proven, and accept a broad outage as safer than narrowing the scope.
      why_wrong: The new observation justifies a bounded coverage investigation; a broad conclusion
        without path evidence overstates the risk and wastes the next diagnostic step.
    answer_anchors:
    - Trace the worker’s identifier, actor/tenant scope, policy decision, and serializer path.
    - Treat controller checks as insufficient evidence for non-HTTP entry points.
    - Add focused cross-account and unsafe-field tests; do not infer a completed incident.
  compression:
    prompt: Give a 30-second answer to “What is IDOR in a Rails API?”
    goal: Name the object boundary, the safe lookup, and one adjacent input-handling
      safeguard without making a historical security claim.
  language_focus:
  - precision
  - pragmatics
  - hedging
  feynman:
    concept: Authentication identifies a caller; authorization decides whether that
      caller may act on this specific object.
    explain_to: A teammate who proposes checking only that a session exists.
    constraint: Use a tenant-scoped record example and explain why UI hiding cannot
      replace a server-side policy.
    self_check: Can you show why a logged-in actor can still be denied a record and why
      a safe value bind does not make a dynamic sort column safe?
    reasoning_check: Give a worker-path counterexample in which a controller policy exists
      but an external ID reaches an unscoped lookup; explain which test or code trace would
      change your confidence about the class of exposure.
  black_box:
    symptom: The response treats an authenticated session or a hidden button as proof
      that a supplied record ID is authorised.
    expected: A server-side object scope or policy, safe handling of dynamic input,
      and a search for duplicate patterns beyond the visible route.
    actual: A cosmetic interface change paired with a one-off controller patch.
    root_cause: Authentication, authorization, and input validation were collapsed
      into one vague “security check”.
    repair: Trace resource selection from request to query, apply the actor or tenant
      boundary there, then review related entry points and dynamic query helpers.
    reasoning_error: The mistake is collapsing authentication, object authorization, and
      input validation into one check. Repair it by tracing resource selection and permitted
      fields at every entry point, then testing a cross-tenant identifier rather than trusting
      a hidden UI control or a global callback.
  recall:
    active_recall_cue: What is missing when an API verifies who the caller is but
      not whether the caller may access the requested record?
    feynman_prompt: Explain why a placeholder can bind a value but cannot safely choose
      a SQL column name.
    black_box_probe: Did your answer address the class of access-control pattern,
      not just one route?
    leitner_start_box: 1
    mastery_threshold: 8
    delayed_variant:
      id: rails_experience-04-application-security-and-idor-delayed-4
      prompt: A review finds that the controller lookup is scoped, but a serializer and a
        background export still accept an unscoped record ID. What does that evidence change
        about your security recommendation, and what would you verify next?
      changed_constraint: The security boundary must cover non-controller serializers and
        exports, not only the authenticated HTTP action that first exposed the pattern.
      new_evidence: Code inspection confirms a scoped controller path but finds two adjacent
        entry points that can select records without the actor or tenant scope.
      best_answer: I would preserve the distinction between authentication and object-level
        authorization, but revise the scope of the remediation from one controller to every
        entry point that selects or serializes the object. I would verify the export’s actor
        context, trace the serializer’s source relation, and add cross-tenant tests for both
        paths. The inspection confirms a coverage gap, not an observed disclosure or universal
        exposure; I would keep that causal claim narrow until those tests and the relevant
        request paths agree.
      distractors:
      - text: I would keep the controller fix and call the export a separate product concern because the original request is already protected. The authenticated route is the security boundary, so I would leave the serializer and export relation unchanged and document the identifier as an internal contract. If an export returns a foreign record, I would remove that row after serialization rather than enforce scope during selection, and close the review once the controller test remains green.
        why_wrong: The new evidence is precisely an alternate entry point that can bypass the
          protected lookup; resource selection must be safe wherever it occurs.
      - text: I would announce a confirmed data exposure immediately because any unscoped ID proves that another account’s record was disclosed. I would page every tenant, revoke all tokens, and publish an incident notice before checking whether either path ran. The identifier alone would be treated as proof of access, so I would skip actor-context tracing and use the broad response as the impact estimate. I would replace both paths immediately, even if the test cannot reproduce a cross-tenant read.
        why_wrong: The code gap warrants containment and tests, but it does not by itself prove
          execution, access, or impact.
      answer_anchors:
      - Preserve server-side object authorization, but widen the boundary beyond the controller.
      - Revise remediation for serializer/export paths that select or expose records.
      - Verify actor context and cross-tenant tests before attributing disclosure or impact.
      reasoning_moves:
        preserve: Keep authentication separate from object-level authorization and input safety.
        revise: Extend the fix from one controller to serializers and background exports.
        verify: Trace actor context and run cross-tenant tests on both newly found paths.
        certainty_update: Lower confidence in route-only coverage, without claiming an observed breach.
  extension:
    prompt: Explain to a product manager why hiding a record link is not enough; compare scoped
      lookup with UI-only hiding and name the test that would change your confidence.
    goal: Translate IDOR into a concrete actor/record boundary, a real alternative, and an
      evidence check without claiming an observed security incident.
  critical_thinking:
    problem_frame: >-
      Frame SupportNest as two linked boundaries: select a ticket inside the caller’s organization,
      then apply the role matrix to the action. Ask whether exports and jobs share that context and
      whether the requirement is application scoping or database isolation before treating one passing
      controller test as complete coverage.
    claim_map:
      fact: SupportNest’s controller scopes public ticket lookup through current_organization,
        the role matrix denies viewer writes, and integration tests cover a second tenant receiving
        not-found plus a viewer receiving forbidden on creation.
      inference: A serializer, export, or job that selects by public ID could still bypass the
        controller relation, but the cited tests do not establish such a path or a disclosure.
      assumption: I am assuming application-level scoping is the intended boundary and that each
        non-controller entry point can carry an actor or tenant context; ask the interviewer to confirm.
      unknown: Database RLS, complete export/job coverage, execution outside the fixture, authorship,
        production operation, and security impact remain unknown.
    comparison:
      applicable: true
      alternatives:
      - option: Enforce actor/tenant-scoped lookup and policy on the server.
        benefit: It binds object selection to the caller’s authority and protects requests,
          jobs, and exports when the boundary is reused consistently.
        cost_or_risk: It requires a clear actor context and a codebase-wide search; poorly
          chosen scopes can deny legitimate access or hide a missing tenant relation.
        valid_when: The domain can express the authorized scope and every object-selection
          path can carry the actor or tenant context.
      - option: Hide links and rely on a global authorization callback.
        benefit: It can improve presentation and centralize a common check for paths that
          actually invoke the callback.
        cost_or_risk: UI hiding is not enforcement, and a callback may miss workers, serializers,
          dynamic queries, or policy exceptions; coverage becomes hard to prove.
        valid_when: Only as a supplementary control after server-side scoped selection and
          path-specific tests establish coverage.
      decision_rule: Make the server-side scope decide object access; use UI or callbacks only
        as supplementary controls, and reject the alternative if any entry point bypasses it.
    failure_probe:
      kind: counterexample
      prompt: If a background export accepts a record ID without a request user, what evidence
        would show that the actor boundary is missing, and what containment would you add first?
    evidence_check:
      basis: Compare the SupportNest controller, role matrix, ticket model, and isolation test in the cited commits; separate application behavior from incident or impact evidence.
      source_kind: primary_code
      limitation: The cited code and tests establish application scoping and role cases, not database RLS, exploit execution, disclosure, authorship, production operation, or impact.
      checked_on: '2026-08-25'
    certainty:
      level: low
      rationale: Confidence is strong about the cited controller, matrix, and fixture, but low about non-controller coverage, database isolation, authorship, or impact.
      update_trigger: Update after a code trace, policy test, cross-tenant export/job fixture, or clarified isolation requirement changes the boundary.
    rubric:
      facts_correct: Distinguishes SupportNest’s scoped lookup, role matrix, and fixture assertions from unverified RLS, exploit, disclosure, or ownership claims.
      assumptions_explicit: Names the assumed actor context and application isolation boundary before extending the fix to exports or jobs.
      alternatives_considered: Compares the scoped relation with global lookup plus policy and explains why UI or callbacks cannot be the primary boundary.
      tradeoff_quality: Weighs tenant enforcement, legitimate access, path coverage, test effort, and database-isolation limits.
      follow_up_adaptation: Widens remediation when a serializer, export, or job bypasses the controller while keeping impact unproven.
      certainty_calibration: Uses high confidence for cited code and tests, low confidence for uncited paths, incidents, production behavior, and impact.
    defense_checks:
    - id: rails_experience-04-application-security-and-idor-defense-export
      axis: facts
      prompt: A passing controller authorization test is shown as proof that an export cannot
        leak another tenant’s record. What missing evidence would you request?
      best_answer: I would request an export-path trace and a cross-tenant test that supplies an
        identifier outside the actor’s scope; the controller test supports its route only and
        cannot establish worker or serializer coverage.
      distractors:
      - text: I would accept the controller test because every Rails entry point eventually uses the same model. The model owns the authorization decision, so a worker or serializer need not repeat the tenant scope; I would request only a model-unit test for the shared relation.
        why_wrong: Shared models do not prove shared scopes or policy invocation at each entry point.
      - text: I would declare the export safe only after a production incident failed to occur. I would treat a quiet deployment as evidence that the unscoped path is harmless and wait for an operational report instead of testing a cross-tenant identifier directly.
        why_wrong: Absence of an observed incident is not a bounded test of authorization coverage.
- id: rails_experience-05-recent-volume-finance-and-messaging
  version: 1.6.0
  target: rails_experience
  topic: FlowBridge durable execution and SettleFlow outbox recovery
  difficulty: 3
  interview_stage: technical_screen
  prompt: In FlowBridge and SettleFlow, how would you explain durable execution state,
    correlation, retries, and the outbox boundary without claiming an external broker or
    production result?
  context: This is a portfolio implementation discussion. FlowBridge records workflow and node
    execution state, correlation, leases, bounded retries, and dead letters. The cited SettleFlow
    8a6117b snapshot writes an outbox event with domain state and has explicit delivery states with
    bounded retry handling; a later 9b17f12 commit adds the publishing claim lease. No cited
    source demonstrates an external broker, a deployed service, or a measured financial outcome.
  best_answer: >-
    FlowBridge stores webhook input, correlation ID, idempotency key, immutable workflow version,
    node attempts, and dead-letter evidence. ExecutionRunner takes a row-locked active lease,
    records each NodeExecution before running it, reuses successful outputs, and bounds retry before
    terminal dead-letter. SettleFlow’s 8a6117b snapshot writes an OutboxEvent with domain state,
    correlation, and idempotency metadata, schedules OutboxPublishJob, and records retry/dead-letter
    delivery through a log or HTTP adapter.
    Later 9b17f12 adds a short publishing claim lease; I would not backdate that behavior. These
    code and test artifacts establish mechanisms, not Kafka, live deployment, or financial result.
    I would verify enqueue gaps and consumer idempotency before calling it durable end to end.
  response_versions:
    short: >-
      FlowBridge stores workflow and node attempts with correlation, leases, bounded retries, and
      dead letters. SettleFlow’s 8a6117b outbox records domain state and retry/dead-letter delivery;
      later 9b17f12 adds a publishing lease. I would verify consumer idempotency; the repositories
      do not establish Kafka or production impact.
    medium: >-
      FlowBridge stores webhook input, correlation ID, idempotency key, immutable workflow version,
      node attempts, and dead-letter evidence. ExecutionRunner takes a row-locked active lease,
      records each NodeExecution before running it, reuses successful outputs, and bounds retry before
      terminal dead-letter. SettleFlow’s 8a6117b snapshot writes an OutboxEvent with domain state,
      correlation, and idempotency metadata, schedules OutboxPublishJob, and records retry/dead-letter
      delivery through a log or HTTP adapter.
      Later 9b17f12 adds a short publishing claim lease; I would not backdate that behavior. These
      code and test artifacts establish mechanisms, not Kafka, live deployment, or financial result.
      I would verify enqueue gaps and consumer idempotency before calling it durable end to end.
    deep: >-
      I would distinguish durable state from a guarantee that an external consumer has received an
      event. FlowBridge’s ExecutionRunner establishes correlation and idempotency context, takes a
      row-locked active lease, records NodeExecution before running a node, reuses successful output,
      and applies bounded retry before a terminal dead letter. Its consistency notes also make the
      enqueue acknowledgment a separate boundary that recovery must inspect. SettleFlow complements
      that with an OutboxEvent created alongside domain state and correlation/idempotency metadata,
      published by a log or HTTP adapter,
      then retried or dead-lettered after failure. The later 9b17f12 checkout adds a publishing lease;
      the 8a6117b snapshot establishes the outbox and retry state but not that lease. I would compare
      direct enqueue with the transactional outbox, prefer the outbox when the domain write must not
      be lost, and verify claim races, duplicate delivery, enqueue gaps, and consumer idempotency.
      These repositories establish mechanisms and tests, not Kafka, live operation, or financial impact.
  distractors:
  - text: I would publish an event for every transaction step and return success immediately.
      A queue guarantees delivery, so consumers do not need idempotency or a durable
      state model. If a dependency fails, replaying all messages is the safest response
      because the system will eventually converge. Monitoring can focus on total throughput
      rather than transaction outcomes. I would treat queue depth as the delivery signal. I would
      derive consumer identity from queue position and delete the row once the adapter accepts it,
      then use a periodic throughput report to infer whether delivery completed. If a publish fails,
      I would replay the entire workflow rather than one event.
    trap: precision
    why_wrong: It assumes a queue makes duplicate effects and business confirmation
      disappear, then proposes replay without a stable identity or outcome-level observability.
  - text: I would replace all synchronous calls with events as soon as latency rises.
      Eventual consistency is always preferable at scale, and an alert on the queue
      depth is sufficient observability. The client can poll until a result appears,
      so there is no need to model pending, rejected, or uncertain transaction states. I
      would emit events for reads and writes alike, let consumers retry until they acknowledge,
      and expose only queue depth plus the latest aggregate status. If a duplicate arrived,
      the consumer could overwrite the earlier result because the newest message should
      represent the current transaction. That keeps the API responsive and avoids maintaining
      a state machine for every intermediate condition.
    trap: pragmatics
    why_wrong: It ignores whether the user needs a synchronous guarantee and reduces
      operational diagnosis to one queue metric instead of traceable business state.
