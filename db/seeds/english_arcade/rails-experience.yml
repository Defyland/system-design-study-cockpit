      id: rails_experience-19-rinha-rails-versus-ruby-knn-study-delayed-19
      prompt: >-
        Suppose the full reference corpus is loaded for a local experiment and both exact
        scorers exceed an agreed memory or p99 bound, while Rails HTTP and Ruby Rack still
        return the same scores on sampled queries. Which facts survive, which migration
        trigger is now credible, and what would you measure before ANN?
      changed_constraint: The full-corpus experiment breaches an agreed memory or p99 bound,
        while matched Rails and Ruby samples retain score parity.
      new_evidence: Both exact implementations still agree on sampled decisions, but the
        study-scale resource boundary no longer holds at the larger corpus size.
      best_answer: >-
        I would preserve that both services use exact KNN and that Rails HTTP versus Ruby Rack
        does not change its brute-force growth. I would retract the assumption that the small
        study corpus is an adequate resource proxy, and treat the measured full-corpus memory
        or p99 breach as a credible migration trigger. Before ANN, I would verify corpus size,
        query distribution, warm and cold behavior, allocation profile, and exact-score parity;
        then compare recall, approval decisions, tail latency, and rollback behavior against
        the exact scorer.
      distractors:
      - text: I would move to ANN immediately because a full-corpus memory or p99 breach makes
          exact scoring obsolete. Since the Rails and Ruby samples still agree, recall and
          approval parity are already guaranteed; I would replace both implementations,
          remove the exact scorer, and use the first timing after the change as proof that
          the framework comparison and migration decision were solved.
        why_wrong: It treats one resource observation as proof for ANN correctness and erases
          the exact oracle, matched measurements, and rollback evidence still required.
      - text: I would ignore the breach because both services return identical scores on the
          sample set. The small fixtures establish the full-corpus memory curve, and any p99
          increase must be HTTP overhead, so I would tune Rails or Rack without checking
          corpus size, allocations, query distribution, or the exact KNN loop.
        why_wrong: It generalizes sample correctness, misattributes resource cost, and avoids
          the evidence needed to distinguish topology from algorithmic growth.
      answer_anchors:
      - Preserve exact-score and framework-boundary facts while naming the breached resource assumption.
      - Verify corpus size, query distribution, allocations, tail latency, and approval parity.
      - Compare ANN against the exact oracle with recall criteria and an explicit rollback path.
      reasoning_moves:
        preserve: Preserve exact KNN correctness and the fact that Rails and Ruby share the same brute-force growth.
        revise: Revise the small-corpus resource assumption when full-corpus measurements breach the agreed bound.
        verify: Verify matched inputs, resource profile, recall, approval parity, and rollback before ANN.
        certainty_update: Raise migration confidence only from reproducible full-corpus measurements, not sample score agreement alone.
