    challenge_kind: new_evidence
    best_answer: >-
      I would define a benchmark matrix before choosing: the same 14-dimensional vectors, reference
      records, query distribution, and exact scorer as an oracle for both Rails HTTP and Ruby Rack.
      I would measure p50/p95/p99 latency, throughput, memory, errors, and approval parity on the
      small study corpus, then repeat with representative full-corpus data when available. I would
      move to ANN or a vector index only if exact brute force violates an agreed latency or memory
      bound and the candidate preserves required recall and decisions. Framework size or topology
      alone is not a trigger, and neither repository proves competitive readiness.
    distractors:
    - text: I would choose Ruby immediately because a smaller Rack service must have lower
        p99 and memory use. I would skip matching reference records and query distributions,
        infer that its exact loop scales better than Rails, and announce ANN as unnecessary.
        The small examples and an HTTP smoke test would be enough to call the Ruby path
        competitive and ready for the full challenge corpus.
      why_wrong: It confuses surrounding service overhead with KNN complexity and invents p99,
        memory, corpus, and competition evidence without a matched benchmark.
    - text: I would replace both scorers with a vector database as soon as the full corpus is
        mentioned. Approximate neighbors would be equivalent to exact KNN, so recall and
        approval parity would not need an oracle. I would report the first local timing as
        proof of the migration and ignore rollback, memory, topology, and operating cost.
      why_wrong: It treats ANN as automatically exact, skips the measured trigger and safety
        criteria, and turns a study comparison into an unsupported production claim.
    answer_anchors:
