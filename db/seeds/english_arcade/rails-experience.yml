      claim: The committed orchestrator tests specify partial completion behavior.
    verified_claims:
    - The committed portfolio implementation records host-aware pacing, bounded retries,
      integer delta-seconds-only Retry-After handling, and injectable sleeper, clock, and random dependencies.
    - The committed portfolio implementation records source statuses and errors so
      a scan can complete partially when one source fails.
    confirmation_required:
    - Confirm authorship, operation, external users, results, and current test execution
      before presenting these artifacts as a personally operated or externally used
      system.
    safe_interview_version: In the inspectable portfolio implementation, source pacing,
      bounded retry policy, and partial scan reporting are visible in committed code;
      do not claim authorship, operation, external users, results, or current test
      execution.
    confidentiality:
      level: medium
      note: Do not disclose source credentials, private search terms, endpoint details,
        or any inferred data about a user’s job search.
  feedback:
    register: Describe the scan as a set of independently fallible sources, not as
      a single request that either “works” or “fails”.
    hedging: Say that behavior is visible in the portfolio implementation, without
      claiming authorship, operational ownership, external users, outcomes, or test
      runs.
    precision: Distinguish a transient fetch failure from an uncertain remote side
      effect, and connect Retry-After to the host that issued it.
    grammar: Keep host pacing, retry bounds, and source status in separate clauses
      so the listener can follow the control flow.
    pragmatics: Offer partial completion as an honest product state, then invite the
      interviewer to examine retry safety for a specific source action.
  rephrase:
    prompt: Explain the design to a hiring manager who asks why a partial scan is
      more useful than retrying until every source is healthy.
    goal: Translate source-level failure isolation into a user-visible freshness and
      completeness trade-off without inventing adoption data.
  follow_up:
    prompt: A timeout follows a request that may have created a remote alert. How
      would you decide whether to retry, reconcile, or expose an uncertain result?
    goal: Demonstrate that timeout handling depends on the remote effect’s identity
      and confirmation semantics, not on retry count alone.
    challenge_kind: evidence
    best_answer: >-
      I would first classify the request: a read-only fetch can use the existing bounded retry
      policy, but an alert-creating side effect needs a stable identity or a reconciliation path.
      I would inspect whether the remote API exposes an idempotency key or status lookup, then
      record the source as pending instead of retrying blindly. The Fetcher’s per-host pacing,
      integer delta-seconds Retry-After handling, and injectable timing make transport behavior inspectable, while the
      Orchestrator’s source-level state can preserve a partial scan. Those code facts support a
      design explanation, not proof that a remote alert was created or that a user saw a result.
    distractors:
    - text: I would retry the alert at the same pace as every read because a timeout proves the remote service did nothing, then mark the source successful. A timeout means no remote work occurred, so the same retry budget and pacing used for reads should apply to the alert call. I would set the source status to successful after the retry, discard the uncertainty, and let the next scan proceed. If the provider created two alerts, I would remove the duplicate after the scan rather than introduce idempotency or a pending state. The Fetcher’s timing controls do not need a separate side-effect policy.
      why_wrong: A timeout leaves a side effect uncertain, and a single source-success flag
        hides the incomplete or duplicated outcome.
    - text: I would pause the whole scan until a complete production history proved whether the alert endpoint ever timed out. Without a long metric series, any retry or reconciliation choice would be speculative, so I would block independent read-only sources and expose no partial state. Once the dashboard shows a frequency, I would apply one global retry rule to every host and call the result complete only when the alert is confirmed.
      why_wrong: The decision can start with the operation contract, one status/trace check,
        and an explicit pending state; an unbounded data request is not a recovery policy.
    answer_anchors:
    - Classify read-only fetch versus remote side effect before applying retry.
    - Use status/idempotency or pending reconciliation for uncertain effects.
    - Use code-level pacing and source outcomes as evidence, not proof of external impact.
  compression:
    prompt: 'A hiring manager gives you half a minute: summarise how the scanner remains
      useful when sources fail.'
    goal: Keep one pacing mechanism, one partial-result behavior, and the timeout
      limit.
  language_focus:
  - precision
  - pragmatics
  - hedging
  feynman:
    concept: A retry policy needs a transient-failure rule and per-host pacing so one
      throttled host does not dominate the scan.
    explain_to: A teammate who wants to share one global delay across every source.
    constraint: Explain why injected time and randomness improve specification without
      claiming that tests were run today.
    self_check: Can you separate host-level pacing from remote-effect identity and explain
      why a partial scan is more truthful than an all-or-nothing success flag?
    reasoning_check: Give a counterexample in which a retryable HTTP status follows an
      alert-creating request, then state which code path, status lookup, or test would move
      you from retry to reconciliation and how certain that conclusion is.
  black_box:
    symptom: The response retries a timeout blindly and reports only one scan-level
      success flag.
    expected: Per-host pacing, bounded transient retry, a source-specific outcome,
      and a separate path for an action whose remote effect is uncertain.
    actual: A global loop that can amplify throttling and hide which data is incomplete.
    root_cause: Retry was treated as a transport reflex rather than a decision about
      host-local pacing and compliance, side effects, and useful partial information.
    repair: Classify the source action, honor its host-local pacing signal, record its own state,
      and return the remaining usable results with an explicit completeness boundary.
    reasoning_error: The mistake is treating transport retry as a universal remedy and
      flattening source outcomes into one boolean. Repair it by preserving per-host pacing and compliance,
      classifying side effects, and making partial completion plus uncertainty observable.
  recall:
    active_recall_cue: What information makes a timeout unsafe to retry automatically?
    feynman_prompt: Explain why a clock and sleeper can be dependencies rather than
      hard-coded infrastructure calls.
    black_box_probe: Did you preserve source-specific errors while describing partial
      completion?
    leitner_start_box: 1
    mastery_threshold: 8
    delayed_variant:
      id: rails_experience-06-job-search-dashboard-retries-and-throttling-delayed-6
      prompt: A source returns 429 with Retry-After as an HTTP-date, but the scan must finish within a fixed window. Which retry conclusion do you preserve, revise, and verify?
      changed_constraint: The scan has a fixed completion window and the source sends an HTTP-date Retry-After value.
      new_evidence: The current Fetcher parser accepts only integer delta-seconds; a boundary scenario supplies an HTTP-date value, so that header is not currently supported by the parser.
      best_answer: >-
        I would preserve per-host pacing, bounded retries, and source-level partial results for
        ordinary read-only discovery. I would not claim that the current parser honours an HTTP-date:
        its integer-only branch returns no parsed delay for that value. I would revise the policy
        explicitly—either record the header as unsupported or add a separately tested date parser
        after confirming the source contract. I would verify request count, sleep/deadline behavior,
        and the orchestrator’s recorded partial state. The new evidence narrows Retry-After support;
        it does not establish global fairness or a live source outcome.
      distractors:
      - text: I would retry the request with the same delay as a read because the fixed window makes completion more important than an unsupported header. I would treat the unsupported date as an ordinary delay and reuse the previous integer value, because the deadline is a stronger contract than the header format. I would keep retrying until the fixed window closes, count the request as compliant, and avoid recording that the header was ignored. If the source throttles again, I would move to the next source only after the same delay, regardless of host.
        why_wrong: A deadline does not make an unparsed Retry-After safe; the parser boundary and
          source contract must be resolved before choosing a delay.
      - text: I would remove Retry-After and disable all partial results because one adapter has a side effect, even though the other sources are read-only. A single policy is easier to explain, so I would make every host wait for the same global delay and fail the scan if any source cannot finish. I would report a complete snapshot only after the slow adapter recovers, discarding successful results from independent sources.
        why_wrong: The evidence narrows one adapter’s policy; it does not justify discarding
          per-host pacing/compliance or useful source-level completion for independent reads.
      answer_anchors:
      - Preserve host pacing, integer Retry-After delta-seconds, bounded read retries, and partial source outcomes.
      - Revise HTTP-date handling instead of assuming the current integer parser supports it.
      - Verify deadline behavior, request count, and orchestrator source state before claiming support.
      reasoning_moves:
        preserve: Keep per-host pacing, bounded partial completion, and read-only retry limits.
        revise: Treat HTTP-date Retry-After as unsupported until a date parser is separately tested.
        verify: Test header parsing, request count, deadline behavior, and recorded outcomes.
        certainty_update: Lower confidence in HTTP-date support, not in the documented integer branch.
  extension:
    prompt: Defend per-host partial scanning when one source returns an unsupported Retry-After
      format; explain the parsing boundary and name the evidence that would make you change it.
    goal: Give a deep, code-grounded explanation of pacing, partial outcomes, and side-effect
      recovery without claiming authorship, live use, or an external result.
  critical_thinking:
    problem_frame: >-
      Frame the Job Search Dashboard scan around host-local pacing, bounded retry, and honest
      source-level completion. Clarify the deadline, each source’s rate-limit contract, whether
      the request is read-only, and what a partial result means before using “fairness” as a global claim.
    claim_map:
      fact: Fetcher records per-host pacing, jitter, bounded transient retries, injectable timing,
        and integer Retry-After parsing; Orchestrator visits sources in priority/name order and
        records source outcomes, including partial completion when a scan fails.
      inference: Source-level state is more informative than one global flag, but sequential ordering
        does not prove global fairness or prevent starvation and a side effect would need a separate retry policy.
      assumption: I am assuming ordinary discovery calls are read-only and that the product accepts
        bounded partial freshness; confirm both before extending the policy.
      unknown: Source-specific rate limits, deadline, global fairness, starvation behavior, external effects, authorship,
        current execution, and user outcome remain unknown.
    comparison:
      applicable: true
      alternatives:
      - option: Keep per-host pacing with bounded retries and source-level partial results.
        benefit: It respects each host’s throttling signal, keeps pacing local to the source, and tells the user which results are incomplete.
        cost_or_risk: Some sources remain stale or unavailable, and the product must explain
          partial freshness instead of presenting a single green status.
        valid_when: Operations are read-only, Retry-After is meaningful, and the scan contract
          accepts bounded partial completion.
      - option: Use a deadline-aware global scheduler and delay or fail the whole scan until all sources agree.
        benefit: It gives a superficially uniform completion condition and simpler aggregate state.
        cost_or_risk: A global policy can hide which source failed, amplify traffic for a throttled host, and waste the completion window.
        valid_when: Only when all sources share the same pacing contract and the product requires
          an all-or-nothing snapshot; neither is established by this prompt.
      decision_rule: Prefer independent host-aware bounded work when partial results are allowed;
        choose all-or-nothing only after the product and source contracts require it and tests
        show that the shared loop will not amplify throttling.
    failure_probe:
      kind: failure_mode
      prompt: If one host returns repeated 429s while another source is healthy and the scan deadline is near, what source-level status and bounded retry decision preserve host compliance without claiming global fairness?
    evidence_check:
      basis: Compare Fetcher, Orchestrator, and their committed tests in the cited Job Search Dashboard commits; distinguish visible code behavior from authorship, operation, global scheduling claims, and external outcome.
      source_kind: primary_code
      limitation: The repository establishes implementation behavior and test specifications,
        not current execution, authorship, external users, live rate-limit impact, or universal policy.
      checked_on: '2026-08-25'
    certainty:
      level: low
      rationale: Code and tests support host-local pacing and partial-state mechanisms, but global fairness, current deployment, workload, authorship, and remote-side-effect semantics are not proven.
      update_trigger: Update after a source trace, header test, deadline measurement, or adapter contract changes the supported Retry-After or completeness boundary.
    rubric:
      facts_correct: Separates committed pacing, parser, retry, injection, and source-state behavior from authorship, current runs, global fairness, and outcome claims.
      assumptions_explicit: Names the read-only, partial-results, deadline, and per-host contract assumptions before generalizing the Fetcher policy.
      alternatives_considered: Compares host-local bounded retries with a deadline-aware global scheduler and states the hard product/source conditions for the latter.
      tradeoff_quality: Weighs host compliance, freshness, completion time, traffic amplification, transparency, and user usefulness without claiming global fairness or starvation prevention.
      follow_up_adaptation: Revises the parser or retry class when an unsupported header or side-effect contract appears, while preserving verified read-path behavior.
      certainty_calibration: Keeps confidence low about global fairness, live impact, and authorship; update code confidence from tests and traces separately.
    defense_checks:
    - id: rails_experience-06-job-search-dashboard-retries-and-throttling-defense-partial
      axis: alternatives
      prompt: If the product demands a single fresh snapshot, when would partial completion stop
        being acceptable and what source evidence would you need before switching policies?
      best_answer: I would switch only if the product defines completeness as a hard contract and
        source traces show that a bounded all-or-nothing strategy can meet it without retry storms;
        I would preserve per-host limits until that evidence exists.
      distractors:
      - text: I would always fail the scan because a partial result is inherently misleading. Completeness should be universal, so I would hold successful source data until the slowest source confirms fresh results and treat any timeout as a reason to return nothing.
        why_wrong: It ignores products that explicitly tolerate bounded partial freshness and
          discards useful results without clarifying the contract.
      - text: I would always return partial results because availability matters more than any snapshot requirement. I would ignore a product definition that requires completeness and let stale or missing sources pass without a status, since users can infer freshness from the timestamp.
        why_wrong: It overrides a possible hard product contract and hides the need to clarify
          freshness and completeness before choosing.
- id: rails_experience-07-study-cockpit-committed-release-evidence
  version: 1.6.0
  target: rails_experience
  topic: Study Cockpit committed release evidence
  difficulty: 2
  interview_stage: technical_screen
  prompt: How would you make a content-sync feature operationally trustworthy instead
    of merely reporting that a background task was triggered?
  context: The interviewer is testing lifecycle modelling and release evidence for
    a prior personal-project release, including the distinction between a committed
    implementation and a current uncommitted expansion.
  best_answer: >-
    The committed personal-project code records each sync's source, count, status, and errors, while its readiness status separates degraded, warning, and ok. I would call content ready only after a successful sync has been observed and the relevant prerequisites are healthy. That makes the state auditable instead of equating enqueueing with completion. The release document supports the earlier committed release; current execution, deployment, and later expansion still need confirmation.
  response_versions:
    short: >-
      I would persist each sync's source, count, status, and errors, then derive degraded, warning, or ok from observed state. That gives a release reviewer more evidence than a queued-job flag. I would keep the earlier committed release separate from current execution, deployment, and later expansion.
    medium: >-
      The committed personal-project code records each sync's source, count, status, and errors, while its readiness status separates degraded, warning, and ok. I would call content ready only after a successful sync has been observed and the relevant prerequisites are healthy. That makes the state auditable instead of equating enqueueing with completion. The release document supports the earlier committed release; current execution, deployment, and later expansion still need confirmation.
    deep: >-
      To make the feature trustworthy, I would model the run lifecycle and the release boundary separately. The committed code records source, count, status, and errors for each sync, and the readiness report distinguishes degraded, warning, and ok. A queued job proves only that work was requested; a recorded successful synchronization, with the required prerequisites healthy, supports the strongest state. If a source fails while stale content remains usable, the report should expose that warning rather than hide it behind a boolean. The release document supports the earlier committed version, so I would verify current execution and deployment before describing later changes as live. This gives diagnosis and honest release evidence without claiming an outcome that has not been observed.
  distractors:
  - text: I would mark the product ready whenever the sync job is enqueued. The job
      identifier is enough to diagnose issues, so storing per-source counts and errors
      only adds noise. If the release document says a feature shipped once, I would
      describe all newer local changes as live independently because they belong to
      the same product.
    trap: precision
    why_wrong: It confuses scheduling with observed success, loses diagnosis context,
      and falsely carries prior release evidence forward to uncommitted work.
  - text: I would use a single success boolean and retry every sync until it turns
      true. Users do not need a degraded state because that sounds alarming. The test
      directory proves the implementation is currently healthy, and any recent feature
      visible locally can be presented as released without distinguishing deployment
      state. I would have the worker update the boolean after each attempt and let the next
      successful run overwrite a prior failure. The test suite could cover the expected
      branches, while a later sync repaired transient problems without exposing intermediate
      states to users.
    trap: hedging
    why_wrong: It removes meaningful readiness states and incorrectly treats committed
      test files and local code as proof of current execution or production release.
  sources:
  - repo: backend-challenges
    path: system-design-study-cockpit/app/services/content/sync_runner.rb
    note: Inspectable personal-product sync lifecycle implementation.
  - repo: backend-challenges
    path: system-design-study-cockpit/app/services/content_readiness_report.rb
    note: Inspectable personal-product readiness implementation.
  - repo: backend-challenges
    path: system-design-study-cockpit/docs/english-c2-arcade-release.md
    note: Committed evidence of a prior personal-product release.
  - repo: original
    path: english-arcade/rails_experience/7
    note: Authored interview-language coaching for release-evidence boundaries.
  provenance:
    evidence_class: deployed_personal_project
    project: System Design Study Cockpit
    repository: backend-challenges
    files:
    - path: system-design-study-cockpit/app/services/content/sync_runner.rb
      commit: 625ff0054bad546d9bcd93d1902e163e89f9e238
      claim: The committed sync runner records a lifecycle with source, counts, status,
        and error details.
    - path: system-design-study-cockpit/test/services/content/sync_runner_test.rb
      commit: 625ff0054bad546d9bcd93d1902e163e89f9e238
      claim: The committed sync-runner tests specify lifecycle behavior but do not
        prove current test execution.
    - path: system-design-study-cockpit/app/services/content_readiness_report.rb
      commit: 625ff0054bad546d9bcd93d1902e163e89f9e238
      claim: The committed readiness report separates degraded, warning, and ok states
        and requires observed successful production sync evidence.
    - path: system-design-study-cockpit/test/services/content_readiness_report_test.rb
      commit: 625ff0054bad546d9bcd93d1902e163e89f9e238
      claim: The committed readiness tests specify report behavior but do not prove
        current test execution.
    - path: system-design-study-cockpit/docs/english-c2-arcade-release.md
      commit: e48b4b33f0c56c94d02e2f45b2100e760dcf5017
      claim: The committed release document records a prior deployed personal-project
        release.
    verified_claims:
    - The committed personal-product implementation records sync lifecycle and readiness
      states, with its production readiness path requiring a recorded successful-sync observation.
    - The committed release document supports a prior release, while the code artifacts
      alone do not establish that later uncommitted expansion is live.
    confirmation_required:
    - Confirm authorship, operation, external users, results, and current test execution;
      confirm that the pending expansion is deployed before describing it as live.
    safe_interview_version: The committed implementation for a personal project records
      sync lifecycle and readiness evidence, and a committed document supports a prior
      release; do not claim authorship, external users, results, current test execution,
      or that pending expansion is live.
    confidentiality:
      level: medium
      note: Do not expose deployment credentials, internal URLs, operational identifiers,
        or unpublished feature and readiness details.
  feedback:
    register: Present readiness as operational evidence, not as a celebratory release
      announcement.
    hedging: Call it a committed implementation supporting a prior personal-project
      release, and do not represent pending expansion, authorship, users, results, or
      test runs as established facts.
    precision: Name lifecycle fields and distinguish “job requested” from a production
      sync observed to finish successfully.
    grammar: Keep the contrast between degraded, warning, and ok states explicit rather
      than using “healthy” for every non-error condition.
    pragmatics: Acknowledge the release boundary early when an interviewer asks what
      is live, then offer the readiness model as the useful technical detail.
  rephrase:
    prompt: Explain the readiness model to a support stakeholder who only sees “sync
      unavailable” and wants to know whether the content can still be used.
    goal: Translate lifecycle evidence into a degraded-versus-blocked product decision.
  follow_up:
    prompt: A run completed with one source error and stale content remains visible.
      What should the readiness report say, and what evidence would change that state?
    goal: Distinguish partial completion from verified readiness and identify the
      observed sync evidence required before escalating status.
    challenge_kind: alternative
    best_answer: >-
      Because the code returns warning when content is bootstrapped but the latest sync failed, I
      would report warning, not degraded. Degraded is reserved here for a non-PostgreSQL adapter
      or missing bootstrap state. A later successful run with a persisted succeeded record, finish
      time, and document count would be recovery evidence; if pack readiness also remained true,
      the report could become ok. I would not claim that run occurred now.
    distractors:
    - text: I would call the report degraded whenever a source fails, because any stale
        content means the service is unavailable. I would then wait for a later successful
        run but keep the degraded label until an operator manually approves the release,
        regardless of whether the database and bootstrap prerequisites are healthy.
      why_wrong: The implementation uses warning for a failed latest sync when content is
        bootstrapped; degraded covers adapter or bootstrap failure, not manual approval.
    - text: I would leave the report at ok because the run completed and old content remains
        readable. A persisted failed record should be diagnostic detail only; after the worker
        retries, readiness need not wait for a new successful observation or a healthy pack report.
        That keeps the user-facing state stable and lets the next scheduled run correct any
        temporary source problem.
      why_wrong: A latest failed run makes the report warning, and production readiness requires
        an observed successful sync plus valid pack readiness before ok.
    answer_anchors:
    - Report warning when content is bootstrapped but the latest sync failed.
    - Reserve degraded for missing bootstrap or adapter failure.
    - Require persisted success, finish time, count, and healthy pack readiness before ok.
  compression:
    prompt: Give a 30-second answer to “What makes a sync feature production-ready?”
    goal: Keep one lifecycle field, one readiness condition, and the boundary around
      the prior release versus pending expansion.
  language_focus:
  - precision
  - pragmatics
  - hedging
  feynman:
    concept: A completed background-job invocation is not the same as observed content
      readiness in a production environment.
    explain_to: A teammate who wants a single boolean named sync_successful.
    constraint: Explain why source counts and errors matter without claiming that
      the visible tests have been executed.
    self_check: Did you separate prior release evidence from current deployment state?
    reasoning_check: Can you identify the hidden premise behind Study Cockpit committed
      release evidence, give a counterexample, and explain how the evidence changes
      your conclusion?
  black_box:
    symptom: The response calls content ready as soon as a job is queued and treats
      a local feature branch as proof that the feature is released.
    expected: A recorded run lifecycle, source-level evidence, graded readiness state,
      and a clear distinction between committed release and pending expansion.
    actual: One success flag with deployment status inferred from code visibility.
    root_cause: Scheduling, execution, readiness, and release were collapsed into
      one status without an observable boundary between them.
    repair: Persist the run’s facts, derive a graded report from observed sync evidence,
      and cite release documentation only for the version it actually supports.
    reasoning_error: If your Study Cockpit committed release evidence answer failed,
      classify the mistake as a fact, assumption, comparison, failure, or certainty
      error before proposing the smallest repair.
  recall:
    active_recall_cue: What evidence changes a queued sync into a readiness claim?
    feynman_prompt: Explain the difference between a warning state and a degraded
      state to someone who wants only green or red.
    black_box_probe: Did you distinguish a prior committed release from an uncommitted
      expansion?
    leitner_start_box: 1
    mastery_threshold: 8
    delayed_variant:
      id: rails_experience-07-study-cockpit-committed-release-evidence-delayed-7
      prompt: A release reviewer says one source may be unavailable for an hour while stale
        content remains usable. Would you expose warning or degraded, and what observation would
        justify an ok state?
      changed_constraint: The page must remain usable while one source can be unavailable for up
        to an hour and stale content remains visible.
      new_evidence: A fixture shows PostgreSQL content is bootstrapped, the latest run failed, and
        no later succeeded run has been recorded.
      best_answer: >-
        I would keep warning: the code uses warning when bootstrapped content exists but the latest
        sync failed, while degraded covers adapter or bootstrap failure. The hour-long stale window
        changes product tolerance, not that status rule. I would retain the content with its warning
        and move to ok only after a later succeeded run, its finish and count evidence, and valid
        pack readiness; this scenario records none of those recovery facts.
      distractors:
      - text: I would call the state degraded as soon as the source is unavailable, because a
          one-hour stale window means the page cannot be trusted. Once a retry is queued, I would
          turn it green even if the database has not recorded a successful run, since continued
          usability is the priority.
        why_wrong: It misclassifies a bootstrapped failed sync and treats a queued retry as the
          observed success required for ok.
      - text: I would keep ok because stale content is still readable and the page has not failed.
          The failed run can remain an internal log entry, and a manually chosen grace period can
          replace the readiness distinction without exposing a warning to users. A later sweep can
          correct any discrepancy without changing that user-facing classification.
        why_wrong: Readability does not erase the latest failed status, and a grace period does not
          replace the implementation’s warning and successful-observation rules.
      answer_anchors:
      - Keep warning for bootstrapped content after a failed latest sync.
      - Do not turn a queued retry or grace period into an observed success.
      - Require a persisted successful run, finish time, count, and pack readiness before ok.
      reasoning_moves:
        preserve: Preserve the warning state while bootstrapped content remains usable after the failed sync.
        revise: Revise the status only when observed recovery evidence replaces the queued retry assumption.
        verify: Check persisted success, finish time, count, and pack readiness before ok.
        certainty_update: Raise status confidence only after the later run and readiness evidence agree.
  extension:
    prompt: The source is still failing, but a previous successful run exists and the page remains
      usable. Would you keep a warning, report degraded, or allow an ok status? Defend the state
      choice and name
      the next observation.
    goal: Connect the readiness enum to bootstrap state, latest sync evidence, and the release
      claim without asserting a current run.
  critical_thinking:
    problem_frame: >-
      Start with the state a learner or release reviewer needs from a sync: whether content is usable, which lifecycle transition has actually been observed, and which release boundary remains unverified.
    claim_map:
      fact: >-
        The committed sync runner records source, count, status, and error details, the readiness report distinguishes degraded, warning, and ok, and the release document covers an earlier committed release.
      inference: >-
        Those fields make a queued job easier to audit because they expose what happened per source rather than merely showing that work was requested.
      assumption: >-
        This recommendation assumes stale content may remain usable in warning and that a persisted successful run is the evidence threshold for ok; both should follow the product contract.
      unknown: >-
        Current execution, deployment of the later expansion, authorship, users, and outcomes are not established by these files.
    comparison:
      applicable: true
      alternatives:
      - option: a trigger-only enqueue marker
        benefit: It gives a low-state acknowledgement when the product promises only that work
          was requested.
        cost_or_risk: It cannot distinguish queued, failed, stale, or successfully observed
          content, so a green readiness claim can be premature.
        valid_when: Use it for a prototype whose contract explicitly stops at job acceptance and
          does not promise content availability.
      - option: a committed run state plus a readiness gate
        benefit: It records source, count, status, and errors, then makes degraded, warning, and
          ok depend on observable prerequisites and successful sync evidence.
        cost_or_risk: It adds persistence and reporting complexity and still requires a recorded
          successful run; it does not prove that the current expansion is deployed.
        valid_when: Use it when a release claim depends on content being demonstrably available.
      decision_rule: Choose the trigger-only marker only when the contract accepts unknown
        readiness; choose the committed-state gate when the release must distinguish stale or
        failed content from an observed successful sync.
    failure_probe:
      kind: counterexample
      prompt: Suppose PostgreSQL is available and content is bootstrapped, yet the latest sync
        failed while old material remains visible. Which readiness rule should hold, and what
        recovery evidence is still missing?
    evidence_check:
      basis: >-
        Compare the lifecycle fields and readiness transitions with backend-challenges/system-design-study-cockpit/app/services/content/sync_runner.rb and app/services/content_readiness_report.rb, then separate the earlier release document from the uncommitted expansion.
      source_kind: primary_code
      limitation: >-
        The cited code and release document establish implementation behavior and prior-release evidence, not current execution, authorship, external users, results, or a universal readiness policy.
      checked_on: '2026-08-25'
    certainty:
      level: low
      rationale: >-
        Confidence is high about the named fields and status transitions, but low about present execution and whether the evidence threshold matches a current release requirement.
      update_trigger: >-
        Revisit the recommendation after a run trace, readiness test, or release requirement changes which observation distinguishes warning from ok.
    rubric:
      facts_correct: >-
        Names source, count, status, and error recording plus the degraded, warning, and ok transitions without presenting a queued request or prior release as current success.
      assumptions_explicit: >-
        States the stale-content tolerance and successful-run threshold that must be confirmed before calling the feature ready.
      alternatives_considered: >-
        Weighs a trigger-only marker against persisted run state and identifies the contract that makes each appropriate.
      tradeoff_quality: >-
        Explains why additional lifecycle state costs storage and reporting work while improving diagnosis of partial or failed syncs.
      follow_up_adaptation: >-
        Changes the readiness conclusion when the latest run fails, bootstrap is absent, or a later successful observation appears.
      certainty_calibration: >-
        Keeps implementation details stronger than claims about current deployment, users, or outcomes and names the evidence that would raise confidence.
    defense_checks:
    - id: rails_experience-07-study-cockpit-committed-release-evidence-defense-readiness
      axis: assumptions
      prompt: A reviewer argues that a queued sync job is enough to mark Study Cockpit ready. Which readiness evidence would you require, and what status should remain while it is missing?
      best_answer: >-
        I would keep the state at warning when bootstrapped content is present but the latest sync has failed. A queued job is only a handoff; I would require a persisted succeeded run with finish time and document count, plus healthy pack readiness, before ok. I would reserve degraded for missing bootstrap or adapter failure.
      distractors:
      - text: I would mark it ok as soon as the job enters the queue because enqueue proves the worker owns the refresh. A failed latest record can stay hidden while the retry is pending, and I would use the queue timestamp as the readiness evidence.
        why_wrong: Queue acceptance does not establish a successful observation, and hiding the failed run defeats the report's evidence boundary.
      - text: I would mark it degraded whenever the latest sync fails and block the page until an operator approves it. A queued retry or readable stale content should not matter; the broad degraded state is safer than distinguishing bootstrap and adapter failures.
        why_wrong: It collapses warning into degraded and discards the implementation's distinction between usable bootstrapped content and missing prerequisites.
- id: rails_experience-08-settleflow-idempotency-and-locks
  version: 1.6.0
  target: rails_experience
  topic: SettleFlow idempotency and locks
  difficulty: 3
  interview_stage: technical_screen
  prompt: Two retries reach a financial API while both touch the same wallet projections.
    How would you prevent duplicate work and avoid lock-order deadlocks?
  context: The interviewer expects a careful explanation of semantic request identity,
    replay behavior, deterministic locking, and the limits of code-level guarantees
    in an inspectable financial-domain portfolio.
  best_answer: >-
    The committed SettleFlow code binds organization, idempotency key, method, path, canonical query, and body hash before replaying a response. Its lock helper deduplicates wallet projections and sorts them before acquisition. I would treat those as useful mechanisms, not proof of exactly-once financial effects: changed requests, callers that bypass the helper, transaction scope, and external side effects still need verification.
  response_versions:
    short: >-
      SettleFlow binds a retry to semantic request identity and replays only a matching response. Its lock helper removes duplicate wallets and acquires them in a shared order. That lowers one deadlock risk, but it does not establish exactly-once processing or cover callers outside the helper.
    medium: >-
      The committed SettleFlow code binds organization, idempotency key, method, path, canonical query, and body hash before replaying a response. Its lock helper deduplicates wallet projections and sorts them before acquisition. I would treat those as useful mechanisms, not proof of exactly-once financial effects: changed requests, callers that bypass the helper, transaction scope, and external side effects still need verification.
    deep: >-
      I would keep request identity and row locking as separate boundaries. The SettleFlow controller binds organization, key, method, path, normalized query, and request hash, so a matching request can replay its recorded response. The projection-lock helper removes duplicates and sorts wallets before acquisition; that shared order should reduce conflicting waits when every caller adopts it. It cannot cover direct locks, a different transaction scope, or external provider effects. Compared with key-only replay and arrival-order locks, the design costs canonicalization and mismatch handling but avoids treating one key as permission to replay a different operation. I would verify those caller and transaction boundaries before claiming more.
  distractors:
  - text: I would use the idempotency key by itself and return success for any duplicate.
      The HTTP method, path, and request body do not matter once a client sends a
      key. For wallets, I would lock them in the order they arrive, because the database
      will detect a deadlock and retrying the transaction makes it safe.
    trap: precision
    why_wrong: It permits key reuse for a different semantic request and allows opposite
      lock acquisition orders, while assuming a database retry resolves duplicate
      effects.
  - text: I would guarantee exactly-once processing by adding a unique index, then
      process every wallet independently so locking is unnecessary. If a request races,
      the application can choose whichever response finishes first. Test coverage
      proves that concurrency behavior is correct, so there is no need to consider
      production database timing or retries under concurrent load.
    trap: hedging
    why_wrong: It turns useful constraints into an impossible end-to-end guarantee
      and treats visible test code as proof of current execution and all race behavior.
  sources:
  - repo: backend-challenges
    path: settleflow-rails-financial-core/app/controllers/api_controller.rb
    note: Inspectable portfolio request-identity and replay implementation.
  - repo: backend-challenges
    path: settleflow-rails-financial-core/app/services/wallets/projection_locker.rb
    note: Inspectable portfolio deterministic projection-lock implementation.
  - repo: original
    path: english-arcade/rails_experience/8
    note: Authored interview-language coaching for bounded concurrency discussion.
  provenance:
    evidence_class: portfolio_code
    project: SettleFlow
    repository: backend-challenges
    files:
    - path: settleflow-rails-financial-core/app/controllers/api_controller.rb
      commit: d257484fd9900f92436e538532585a5de2696369
      claim: The committed API controller records semantic idempotency identity using
        organization, key, method, canonical path, normalized query, and request hash.
    - path: settleflow-rails-financial-core/test/requests/idempotency_test.rb
      commit: d257484fd9900f92436e538532585a5de2696369
      claim: The committed request tests specify replay header and response behavior.
    - path: settleflow-rails-financial-core/app/services/wallets/projection_locker.rb
      commit: 63618c20227e28e9a6f863f0eb794182a51ad2ae
      claim: The committed projection locker records sorted, unique wallet lock ordering.
    - path: settleflow-rails-financial-core/test/services/financial_concurrency_test.rb
      commit: 63618c20227e28e9a6f863f0eb794182a51ad2ae
      claim: The committed concurrency tests specify database-constraint and race
        scenarios.
    verified_claims:
    - The committed portfolio implementation records request identity and replay response
      behavior with more context than an idempotency key alone.
    - The committed portfolio implementation records a sorted, unique projection-lock
      order and treats database constraints and races as test-worthy concerns.
    confirmation_required:
    - Confirm authorship, operation, external users, results, and current test execution
      before presenting these artifacts as a personally operated financial system.
    safe_interview_version: In the inspectable portfolio implementation, semantic
      request identity, replay behavior, and deterministic lock ordering are visible
      in committed code; do not claim authorship, operation, external users, results,
      current test execution, exactly-once delivery, or real financial operation.
    confidentiality:
      level: high
      note: Avoid financial identifiers, account balances, request hashes, replay
        keys, authorization headers, and any realistic transaction payloads.
  feedback:
    register: Use transaction language that distinguishes a replayed request from
      a merely repeated HTTP call.
    hedging: Attribute the behavior to inspectable portfolio code and avoid claims
      of authorship, financial operation, external users, outcomes, current tests,
      or exactly-once.
    precision: List the semantic request dimensions before explaining replay, then
      state why sorted unique lock acquisition addresses order rather than every race.
    grammar: Keep the idempotency and locking sentences separate so their guarantees
      are not accidentally merged.
    pragmatics: State the remaining database and concurrency limit proactively; that
      makes the answer credible without underselling the design.
  rephrase:
    prompt: Explain the lock-order decision to a reviewer who says the database will
      simply abort any deadlock, so application ordering is unnecessary.
    goal: Show how deterministic ordering reduces conflicting waits while retaining
      the need to handle database-level failure paths.
  follow_up:
    prompt: A client reuses its idempotency key with a changed query parameter after
      the first request succeeded. What should the service compare and return?
    goal: Explain semantic identity, mismatch handling, and why blindly replaying
      the first response could hide a different intended operation.
    challenge_kind: failure
    best_answer: >-
      The service should compare the stored organization, idempotency key, method, canonical path,
      normalized query, and request hash with the second request. If the query changes semantics,
      it should return an idempotency conflict before business work, not replay the first response;
      only a matching identity may replay. The trade-off is extra canonicalization and client key
      discipline in exchange for preventing one key from masking two commands.
    distractors:
    - text: I would replay the stored response whenever the key matches, even if the normalized
        query or body hash changed. The key is the client’s authority, so rejecting it would create
        friction; any semantic difference can be handled by the downstream command after the
        response is returned. The response should remain useful to the caller, and any discrepancy
        can be logged for later review rather than blocking this retry.
      why_wrong: It lets one key conceal a different operation and returns before the changed
        semantics can be validated.
    - text: I would accept the changed query as a new command under the old key because the first
        request already succeeded. The service could update the stored path and hash before
        executing, keeping one record per key while making the key describe whichever request
        arrived last. If a client changes the query intentionally, it can continue under the same
        key as long as the latest record is authoritative.
      why_wrong: It mutates the identity contract, permits key reuse for a different command, and
        undermines deterministic replay and conflict detection.
    answer_anchors:
    - Compare organization, key, method, path, query, and body hash before replay.
    - Return a conflict before business work when semantic identity changes.
    - Acquire unique wallet locks in shared sorted order only through adopting callers.
  compression:
    prompt: In one concise reply, explain how the API limits duplicate transaction
      work.
    goal: Retain one replay identity detail, one lock-order rule, and the non-guarantee.
  language_focus:
  - precision
  - pragmatics
  - hedging
  feynman:
    concept: An idempotency key only identifies a retry safely when it remains bound
      to the same semantic operation.
    explain_to: A teammate who wants to cache a response by key alone.
    constraint: Explain why two wallets must be normalized into one acquisition order
      without promising exactly-once processing.
    self_check: Did you name both the semantic comparison and the remaining race limit?
    reasoning_check: Can you identify the hidden premise behind SettleFlow idempotency
      and locks, give a counterexample, and explain how the evidence changes your
      conclusion?
  black_box:
    symptom: The response treats one arbitrary retry key as a full duplicate defense
      and locks wallet projections in request arrival order.
    expected: A request fingerprint that rejects semantic mismatch, a replay response,
      a deterministic lock order, and testing of residual database races.
    actual: Key-based caching plus accidental lock ordering, presented as exactly
      once.
    root_cause: Idempotency and mutual exclusion were learned as slogans instead of
      contracts over request meaning and concurrent resource acquisition.
    repair: Bind the key to canonical request meaning, normalize the lock set before
      acquisition, and test constraint and race behavior without claiming a universal
      guarantee.
    reasoning_error: If your SettleFlow idempotency and locks answer failed, classify
      the mistake as a fact, assumption, comparison, failure, or certainty error before
      proposing the smallest repair.
  recall:
    active_recall_cue: Which request details must stay the same before a replay is
      safe?
    feynman_prompt: Explain why two concurrent transfers need a shared lock order.
    black_box_probe: Did you separate a visible portfolio specification from evidence
      of test execution or real financial operation?
    leitner_start_box: 1
    mastery_threshold: 8
    delayed_variant:
      id: rails_experience-08-settleflow-idempotency-and-locks-delayed-8
      prompt: A concurrency review finds that reordered query parameters replay correctly, but a
        changed filter reuses the same key. Which request may replay, which must conflict, and what
        lock evidence would you inspect next?
      changed_constraint: Equivalent query order must remain one command, while a changed filter
        must not become a second command under the same key.
      new_evidence: The trace shows canonicalization matches reordered parameters, but the changed
        filter produces a different request identity before wallet locks are acquired.
      best_answer: The reordered query may replay because canonicalization preserves semantic
        identity. The changed filter must conflict before business work because the stored identity
        differs. I would then inspect whether the caller uses the sorted unique lock helper; that
        evidence is separate from replay and does not prove exactly-once processing or eliminate
        residual transaction races.
      distractors:
      - text: I would treat every second use of a key as a conflict, even when the query parameters
          are semantically identical in a different order, because byte-for-byte requests are the
          only safe comparison. Wallet locks could then remain arrival-ordered for the accepted
          request, since replay and locking are separate concerns.
        why_wrong: It rejects canonical equivalence and leaves callers exposed to opposite lock
          orders even when the helper could normalize them.
      - text: I would let the changed filter update the stored identity and proceed after the first
          response, because the key already established the client session. The lock helper would
          protect the wallet rows, so no separate conflict response would be needed for this retry.
        why_wrong: It mutates a completed identity contract and treats row ordering as a substitute
          for rejecting a different command.
      answer_anchors:
      - Keep canonical identity checks and conflict-before-work for changed semantics.
      - Treat sorted locking as conditional because callers may bypass the helper.
      - Inspect caller adoption, lock order, transaction scope, and replay outcomes.
      reasoning_moves:
        preserve: Preserve the semantic fingerprint and reject changed meaning before business work.
        revise: Revise the lock guarantee when a caller bypasses the shared helper or changes transaction scope.
        verify: Trace every caller and compare lock order, transaction scope, and replay outcomes.
        certainty_update: Raise concurrency confidence only when helper adoption and a race trace agree.
  extension:
    prompt: A retry with reordered query keys replays, but a changed filter conflicts. Explain how
      canonical identity and sorted wallet locks interact, and what evidence would make you choose
      a coarser lock?
    goal: Relate canonical request identity to replay, then separate wallet lock ordering from
      residual transaction races.
  critical_thinking:
    problem_frame: >-
      Start with two contracts in a retry that touches shared wallets: what makes a request semantically the same, and what resource order every caller must use before external work proceeds.
    claim_map:
      fact: >-
        The controller binds organization, key, method, path, normalized query, and request hash, while the projection-lock helper removes duplicate wallets and sorts them before acquisition.
      inference: >-
        Canonical identity prevents a reused key from silently replaying a different operation, and sorted unique locks reduce one source of conflicting waits when adopted consistently.
      assumption: >-
        That benefit assumes callers use the same helper within a compatible transaction boundary and that the database enforces the intended request conflict semantics.
      unknown: >-
        Full transaction coverage, callers that bypass the helper, external provider behavior, current execution, and financial outcomes are not established by the cited code.
    comparison:
      applicable: true
      alternatives:
      - option: sorted unique row locks through the helper
        benefit: It removes duplicate wallet rows and gives callers a shared acquisition order,
          reducing conflicting waits when every caller uses the helper.
        cost_or_risk: It still depends on transaction scope and caller adoption; bypassing the
          helper or racing another constraint can leave residual blocking or failure.
        valid_when: Use it when commands touch multiple wallet projections and precise row
          concurrency matters.
      - option: one aggregate or advisory lock for the command scope
        benefit: It makes the ordering rule simple by serializing a deliberately chosen resource
          boundary.
        cost_or_risk: It can serialize unrelated wallets, create a hot lock, or fail when callers
          cannot share the same lock namespace; this is a design scenario, not cited code.
        valid_when: Use it only when measured contention is acceptable and coarse serialization is
          safer than coordinating individual rows.
      decision_rule: Prefer sorted unique row locks when callers can use the helper and the
        command needs parallelism; choose a coarse lock only when evidence shows its simpler
        boundary outweighs contention and the lock namespace is explicit.
    failure_probe:
      kind: edge_case
      prompt: A matching key is still processing while a second call changes its query and touches
        the same wallets. What must be rejected before work, and which lock trace would expose a
        separate defect?
    evidence_check:
      basis: >-
        Compare request identity and replay in backend-challenges/settleflow-rails-financial-core/app/controllers/api_controller.rb with wallet ordering in app/services/wallets/projection_locker.rb, then trace the transaction boundary.
      source_kind: primary_code
      limitation: >-
        The cited code and tests establish request and lock mechanisms, not current execution, authorship, external effects, financial outcomes, or global deadlock freedom.
      checked_on: '2026-08-25'
    certainty:
      level: low
      rationale: >-
        Confidence is high about the identity and ordering code, but low about adoption, transaction scope, provider effects, and behavior under an unmeasured race.
      update_trigger: >-
        Revisit the recommendation after a request-conflict test or concurrency trace shows a bypass, different scope, or outcome that the current mechanisms do not cover.
    rubric:
      facts_correct: >-
        Names the request fields, replay behavior, and deterministic wallet ordering without turning them into an exactly-once or global deadlock claim.
      assumptions_explicit: >-
        States the caller-adoption, transaction-scope, and database-conflict assumptions before relying on the ordering helper.
      alternatives_considered: >-
        Compares sorted row locks with a deliberately coarse lock and ties the choice to contention, parallelism, and a shared namespace.
      tradeoff_quality: >-
        Explains the cost of canonicalization and coordination against the risk of key reuse, conflicting lock order, and unrelated serialization.
      follow_up_adaptation: >-
        Rejects a changed request before work and widens the investigation when a caller bypasses the helper or acquires another resource first.
      certainty_calibration: >-
        Keeps code-level confidence separate from claims about transaction coverage, provider effects, current execution, and financial results.
    defense_checks:
    - id: rails_experience-08-settleflow-idempotency-and-locks-defense-adoption
      axis: assumptions
      prompt: A team says sorted unique wallet locks eliminate deadlocks for every SettleFlow command. What premise would you test, and what remains outside that guarantee?
      best_answer: >-
        I would test that every caller reaches the same helper with the same transaction scope and unique wallet set; sorting only orders participants that adopt it. I would still inspect bypasses, other locks, and semantic-conflict checks, because the helper reduces one wait cycle but cannot prove global deadlock freedom or exactly-once effects.
      distractors:
      - text: I would accept the claim because sorting the wallet IDs gives every command the same database order. Once the helper exists, direct row locks or another resource acquired first are implementation details; a key mismatch can be logged after the command because lock order is the only concurrency contract.
        why_wrong: Sorting helps only callers that use the shared helper; it cannot cover bypassed locks, other resources, or semantic request conflicts.
      - text: I would abandon row locks and serialize every SettleFlow command on one global mutex. That removes the need to audit callers or canonicalize the request, and a single queue gives stronger correctness even if unrelated wallets wait behind one another.
        why_wrong: A global mutex changes throughput and still does not validate request identity or callers that bypass its boundary.
- id: rails_experience-09-flowbridge-recovery-and-ssrf
  version: 1.6.0
  target: rails_experience
  topic: FlowBridge recovery and SSRF
  difficulty: 1
  interview_stage: technical_screen
  prompt: How would you recover stale workflow executions while preventing an outbound
    HTTP step from reaching a private network through DNS tricks or redirects?
  context: The interviewer is probing the separate boundaries of recovery and egress
    control in inspectable portfolio code, including what neither boundary guarantees.
  best_answer: >-
    The FlowBridge code retries stale queued work, optionally enforces host patterns, resolves addresses, rejects private or reserved ranges, and passes a selected IP to the client. The client bounds timeouts and truncates retained response content, but it does not cap bytes transferred. These controls narrow one outbound path; they are not complete SSRF prevention or exactly-once recovery without redirect checks and effect reconciliation.
  response_versions:
    short: >-
      FlowBridge re-enqueues stale queued work and validates resolved addresses before connecting. An allowlist can add a host boundary, while private or reserved range checks and timeouts narrow exposure. The client truncates retained response content after reading it, not bytes transferred, so redirects and prior remote effects remain open questions.
    medium: >-
      The FlowBridge code retries stale queued work, optionally enforces host patterns, resolves addresses, rejects private or reserved ranges, and passes a selected IP to the client. The client bounds timeouts and truncates retained response content, but it does not cap bytes transferred. These controls narrow one outbound path; they are not complete SSRF prevention or exactly-once recovery without redirect checks and effect reconciliation.
    deep: >-
      I would treat recovery and outbound validation as separate controls. The FlowBridge recovery job re-enqueues queued executions older than its stale threshold. Its policy can enforce host patterns, resolve all addresses, reject private or reserved ranges, and give the client a selected connection IP. The client sets timeouts and truncates the body it retains or processes; that is not a transport-byte limit. Those checks narrow a DNS-related path, but a redirect can change the destination and a stale row may follow a remote action whose result remains unresolved. I would revalidate every redirect and retry, preserve a stable workflow or node-operation identity, and reconcile the external outcome before rerunning. The cited code supports defensive boundaries, not a complete SSRF or exactly-once guarantee.
  distractors:
  - text: I would mark every stale execution failed and let an operator restart it. For outbound
      HTTP, checking the hostname once is enough because DNS results do not change during a
      request. Redirects can reuse the approved connection, and long timeouts are safer because
      they avoid losing useful workflow responses. I would also keep the full response in memory
      so operators can inspect it, with no separate retry identity required.
    trap: precision
    why_wrong: It changes recoverable queued work into failure, ignores address changes
      after hostname validation, and gives an unbounded request path more capacity
      to stall.
  - text: I would guarantee SSRF safety with an allowlist and assume recovery cannot duplicate
      work because the job record is stale only once. The client can follow any redirect after the
      original host passes validation, and a second attempt may reuse the same workflow key without
      checking whether the remote action already ran. There is no need to pin an address, cap
      transferred bytes, or define provider reconciliation.
    trap: hedging
    why_wrong: It claims universal protection and exactly-once recovery while omitting
      IP pinning, redirect validation, and the uncertain external-effect boundary.
  sources:
  - repo: backend-challenges
    path: flowbridge-rails-automation-platform/app/jobs/recover_queued_workflow_executions_job.rb
    note: Inspectable recovery implementation.
  - repo: original
    path: english-arcade/rails_experience/9
    note: Evidence-bounded interview-language coaching.
  provenance:
    evidence_class: portfolio_code
    project: FlowBridge
    repository: backend-challenges
    files:
    - path: flowbridge-rails-automation-platform/app/jobs/recover_queued_workflow_executions_job.rb
      commit: 20e094965a3ae66feb6f2845cd0d79aac697f3ac
      claim: The committed recovery job reschedules stale queued workflow executions.
    - path: flowbridge-rails-automation-platform/test/jobs/recover_queued_workflow_executions_job_test.rb
      commit: 20e094965a3ae66feb6f2845cd0d79aac697f3ac
      claim: The committed tests specify recovery behavior, not current test execution.
    - path: flowbridge-rails-automation-platform/app/services/flow_bridge/http_egress_policy.rb
      commit: f95adf999c8fcae6e316cc08a31db31b9ca87ffe
      claim: The committed policy can enforce a configured host allowlist, performs
        full address resolution and range blocking, and returns a selected IP for
        connection.
    - path: flowbridge-rails-automation-platform/app/services/flow_bridge/http_client.rb
      commit: f95adf999c8fcae6e316cc08a31db31b9ca87ffe
      claim: The committed HTTP client uses the selected IP and bounded timeouts, then reads
        response.body and truncates only retained or processed content; this does not prove a
        transport byte cap.
    - path: flowbridge-rails-automation-platform/test/services/http_egress_policy_test.rb
      commit: f95adf999c8fcae6e316cc08a31db31b9ca87ffe
      claim: The committed tests specify egress checks, not current execution evidence.
    verified_claims:
    - The committed portfolio code records stale-work rescheduling and bounded outbound
      egress controls including address selection.
    confirmation_required:
    - Confirm authorship, operation, external users, results, current test execution,
      and any claim of complete SSRF prevention or exactly-once recovery.
    safe_interview_version: In inspectable portfolio code, stale queued work is rescheduled
      and outbound requests use egress checks; do not claim authorship, operation,
      external users, results, current test execution, complete SSRF protection, or
      exactly once.
    confidentiality:
      level: high
      note: Do not reveal allowlist entries, internal IP ranges, workflow payloads,
        or URLs.
  feedback:
    register: Treat recovery and egress as separate risk controls, not one generic
      reliability claim.
    hedging: Attribute behavior to code artifacts and avoid claims of authorship,
      operation, users, results, executed tests, complete SSRF prevention, or exactly-once
      semantics.
    precision: Say “reschedule stale queued work,” distinguish hostname approval from an address
      pinned for connection, and call byteslice retained-content truncation rather than a transport
      or transfer limit.
    grammar: Sequence resolution, range check, pinning, and request limits in the
      order they occur.
    pragmatics: Acknowledge the remaining duplicate boundary before the interviewer
      needs to challenge the recovery story.
  rephrase:
    prompt: A security reviewer says DNS resolution happens only once. Explain why
      the connection target still matters.
    goal: Contrast name validation with the endpoint actually used by the HTTP client.
  follow_up:
    prompt: A recovered workflow may have triggered its remote step before it went
      stale. What identity or reconciliation boundary would you need?
    goal: Explain the residual duplicate-execution risk without asserting exactly
      once.
    challenge_kind: new_evidence
    best_answer: >-
      I would assign the remote effect a stable operation identity, such as the workflow execution
      and node attempt, and pass that identity to an idempotent receiver when possible. If the local
      failure leaves the outcome uncertain, I would reconcile by querying the provider or recording
      a compensating path before retrying; I would not blindly rerun. The cited code reschedules
      stale rows and checks egress, but does not prove this duplicate-execution guard.
    distractors:
    - text: I would let the recovery job run the stale row again because a local failure means
        the remote step did not complete. The selected IP and timeout establish the destination
        boundary, so the same request can be sent without a provider identity or reconciliation
        record. The remote service can rely on the caller to notice duplicate requests, while the
        workflow row remains the source of truth.
      why_wrong: A local failure does not reveal whether the remote effect was accepted, and
        egress checks do not deduplicate an external operation.
    - text: I would leave the row in its existing state and let a later scheduled retry decide
        whether to run. The allowlist and selected IP already define the outbound boundary, so an
        operator can use the local status and request timestamp as sufficient context for the next
        attempt.
      why_wrong: Local status and a destination check do not identify an accepted remote effect or
        establish whether the next attempt is safe.
    answer_anchors:
    - Reconcile a stable workflow and node identity before rerunning remote work.
    - Use provider status or an idempotent receiver when the prior outcome is uncertain.
    - Keep stale-row rescheduling separate from destination validation and duplicate safety.
