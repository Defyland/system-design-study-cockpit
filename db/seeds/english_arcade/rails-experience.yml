        why_wrong: It treats one matched example as proof that unrestricted diagnostic output contains no other sensitive shape.
      - text: No; I would remove all diagnostics whenever a value falls outside known patterns and ask the team to debug from the application directly. A global suppression is safer than an allowlist, while reviewers can inspect raw configuration and URLs internally because Context is not a public API. Re-enable the dump after the incident.
