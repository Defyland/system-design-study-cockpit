        with the four CLI implementations and their contract tests named in the item provenance,
        then inspect failure propagation and output filtering.
      source_kind: primary_code
      limitation: >-
        The cited local tooling establishes bounded composition and static checks, not
        model/provider routing, caller authentication, spend policy, semantic completeness, live
        GitHub verification, current execution, or an approval result.
      checked_on: '2026-08-25'
    certainty:
      level: low
      rationale: >-
        Confidence is high about the named local roles and lower about contract drift,
        subprocess behavior, sensitive-field coverage, and any use beyond the cited tooling.
      update_trigger: >-
        Revisit the classification after a changed manifest, failed subprocess, new sensitive
        field, or added provider/authentication contract supplies contrary evidence.
    rubric:
      facts_correct: >-
        Names the four bounded tool roles and their public hand-offs without turning packet
        composition into gateway or approval capability.
      assumptions_explicit: >-
        States the versioned-contract, failure-propagation, and sensitive-filtering assumptions
