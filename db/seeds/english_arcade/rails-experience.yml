        parity, and rollback evidence required.
      tradeoff_quality: >-
        Weighs exactness and inspectability against corpus-scale cost, index complexity,
        approximate recall, and rollback work.
      follow_up_adaptation: >-
        Keeps exact scoring as the oracle when a framework or sample claim is unmeasured, and
        moves toward ANN only after reproducible resource and recall evidence.
      certainty_calibration: >-
        Separates repository facts from claims about p99, memory, recall, rankings, submissions,
        current execution, and operation.
    defense_checks:
    - id: rails_experience-19-rinha-rails-versus-ruby-knn-study-defense-curve
      axis: facts
      prompt: A reviewer says the smaller Ruby Rack service changes KNN growth and that ANN is inevitable because the challenge has a large corpus. Which claim would you defend, and what measurement would change your recommendation?
      best_answer: >-
        I would defend that both cited scorers perform exact comparisons over their references,
        so Rails HTTP versus Ruby Rack does not change the brute-force growth. I would not call
        ANN inevitable from the challenge statement or small fixtures. I would measure matched
        full-corpus latency, memory, throughput, and tail behavior, using exact KNN as an oracle;
        only a reproducible resource breach plus acceptable recall, approval parity, and rollback
