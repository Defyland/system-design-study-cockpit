        details out of the answer.
  feedback:
    register: Frame the answer as an engineering triage conversation, not as a catalogue
      of Rails patterns.
    hedging: Keep the documented example as design reasoning rather than implying
      that a particular refactor, role, or performance result belongs to you.
    precision: Tie preload, eager loading, an index, or a projection to the observed
      query shape instead of treating any one of them as the default cure.
    grammar: Use parallel clauses for controller, model, and service responsibilities
      so the listener can compare their boundaries quickly.
    pragmatics: 'Answer the interviewer’s sequence directly: locate the operation
      first, inspect the query second, then state the smallest justified change.'
  rephrase:
    prompt: Explain the same evidence boundary to a product-minded engineering manager
      who asks why a cleaner identity lookup is not proof that job discovery became faster.
    goal: Replace framework labels with observable matching and query evidence while keeping
      the distinction between an inspectable code change and a measured outcome.
  follow_up:
    prompt: The optimizer report flags a recurring query, but a captured EXPLAIN shows a
      selective index already serves the main predicate. What would you inspect before changing it?
    goal: Compare query evidence, row counts, pagination, and the endpoint contract instead of
      treating an optimizer finding or an index as an automatic fix.
    challenge_kind: new_evidence
    best_answer: >-
      I would inspect the generated SQL, predicate selectivity, returned rows, pagination order,
      and the plan’s actual cost before changing the index or relation. A static warning can identify
      a risk, but the captured plan may show that another filter, sort, or projection dominates.
      I would compare the current query with a narrower projection or an alternative index, then
      verify representative timing and page boundaries. I would revise the recommendation only when
      the new evidence identifies a cost that the proposed change addresses.
    distractors:
    - text: I would add a second index immediately because the report mentioned the query, even though EXPLAIN already shows the main predicate using a selective index. I would copy the same columns into another composite index, avoid checking sort order or row counts, and call the warning resolved once the migration runs. If writes become slower or the planner keeps the old path, I would add more indexes rather than question whether the report identified the dominant cost.
      why_wrong: A warning identifies an investigation target, not proof that another index
        addresses the dominant filter, sort, or projection cost.
    - text: I would cache the response before checking rows, pagination, or representative timing, because any cached result is evidence that the endpoint is faster. I would use one long expiration for every identity lookup, ignore freshness and rejected-candidate changes, and compare cache-hit latency with the uncached endpoint only after declaring success. If the cache hides a broad scan or serves an old page, I would accept that as the cost of keeping the endpoint fast.
      why_wrong: Caching can hide freshness and scope problems while leaving the query cost
        unexplained; it does not turn an unmeasured change into a performance result.
    answer_anchors:
    - Inspect SQL shape, selectivity, returned rows, pagination, and query-plan evidence.
    - Compare the current relation with a narrower projection or alternative index against the endpoint contract.
    - Change the access path only when representative timing and plan evidence identify its cost.
  compression:
    prompt: Give a 30-second answer to “How do you judge an identity-lookup change?”
    goal: Preserve the fingerprint-first matching rule and one evidence check in plain language.
  language_focus:
  - precision
  - pragmatics
  - hedging
  feynman:
    concept: Fingerprint-first identity matching is a lookup rule, while optimizer findings are
      evidence to investigate rather than a promise of faster requests.
    explain_to: A teammate who wants to fall back to a canonical URL whenever two candidates
      look similar.
    constraint: Preserve a rejected candidate as unlinked, prefer the stronger fingerprint, and
      distinguish static or planner evidence from a measured timing result.
    self_check: Can you explain why two batched queries can still need row-count, plan, and endpoint
      checks before an index or loading change is justified?
    reasoning_check: Give a URL-collision counterexample that makes fingerprint precedence matter,
      then name the runtime or EXPLAIN observation that would change your performance confidence.
  black_box:
    symptom: The response treats a batched identity query or an optimizer warning as proof that
      every candidate was matched correctly and the endpoint became faster.
    expected: A fingerprint-first identity rule, an explicit rejected-candidate boundary, and a
      plan or timing check before claiming a performance outcome.
    actual: A cleaner lookup is presented as a benchmark, while canonical URL collisions and query
      selectivity remain unexamined.
    root_cause: Implementation evidence and performance evidence were collapsed into one confident
      conclusion.
    repair: Trace candidate classification, inspect the two lookup predicates and their results,
      then compare runtime or EXPLAIN evidence with the endpoint contract before changing the path.
    reasoning_error: The mistake is treating fewer lookup calls as equivalent to a correct match or
      faster request. Repair it by checking precedence, rejected links, rows, plan, and representative
      timing separately.
  recall:
    active_recall_cue: Which identity is stronger when a candidate has both a fingerprint and a
      canonical URL, and what evidence would support a performance conclusion?
    feynman_prompt: Explain why fingerprint-first matching and an optimizer report do not, by
      themselves, prove a faster endpoint.
    black_box_probe: Did you separate accepted/rejected link behavior from runtime or planner evidence?
    leitner_start_box: 1
    mastery_threshold: 8
    delayed_variant:
      id: rails_experience-02-a-growing-ecommerce-api-delayed-2
      prompt: A runtime snapshot shows that canonical-URL lookup scans broadly while fingerprint
        lookup is selective, but the linker must keep fingerprint precedence and rejected candidates
        unlinked. Which conclusion do you preserve, revise, and verify?
      changed_constraint: The identity rule remains fingerprint first with canonical URL fallback,
        and a rejected candidate must not be linked; planner evidence is now available for one path.
      new_evidence: The captured plan shows a broad canonical-URL scan and a selective fingerprint
        predicate, but no representative request timing is supplied.
      best_answer: >-
        I would preserve fingerprint precedence, the rejected-candidate boundary, and the rule that
        code evidence is not a benchmark. I would revise only the performance hypothesis: the broad
        canonical-URL scan makes an index or query-shape investigation plausible, but it does not
        choose the fix. I would verify both predicates, row counts, plan stability, representative
        timing, and link outcomes before changing the fallback or claiming improvement. My confidence
        in the canonical-URL cost would rise; confidence in the best remedy would remain provisional.
      distractors:
      - text: I would replace fingerprint matching with the URL scan because EXPLAIN shows that path, even though the identity rule requires fingerprint precedence. The cheaper plan should decide which candidate wins, so I would let a canonical URL match overwrite a fingerprint match and remove the rejected-link guard. If collisions appear, I would normalize URLs again or accept occasional relinking rather than preserve a slower identity rule.
        why_wrong: Planner cost evidence does not override the stronger identity invariant or prove
          that the fallback is a safe substitute.
      - text: I would announce a benchmark improvement from the plan alone and leave rejected candidates linked until a later cleanup. An EXPLAIN output already proves the endpoint became faster, so I would publish the change before collecting request timings or checking page boundaries. If stale links or duplicate rows appear, I would repair them in a separate maintenance task because measuring correctness would slow the rollout.
        why_wrong: An EXPLAIN plan is not request timing, and link correctness must remain explicit
          while the performance hypothesis is tested.
      answer_anchors:
      - Preserve fingerprint precedence and rejected-candidate link behavior.
      - Revise the performance hypothesis after planner evidence without changing identity semantics.
      - Verify predicates, rows, plan, timing, and link outcomes before claiming the replacement is safe.
      reasoning_moves:
        preserve: Keep fingerprint precedence, rejected-link behavior, and evidence-led diagnosis.
        revise: Treat the broad canonical-URL scan as a performance hypothesis, not a replacement rule.
        verify: Test predicates, link outcomes, plan stability, row counts, and representative timing.
        certainty_update: Raise confidence that the canonical path needs investigation, not that one fix is correct.
  extension:
    prompt: Compare fingerprint-first lookup with canonical-URL fallback when both identities
      are present; name the collision or plan evidence that would change your recommendation.
    goal: Defend an identity and query strategy with a concrete precedence, correctness, and
