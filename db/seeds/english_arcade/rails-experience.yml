    comparison:
      applicable: true
      alternatives:
      - option: Keep exact brute-force KNN on the small study corpus as the correctness baseline.
        benefit: It preserves the inspectable scoring contract and gives ANN or vector-index candidates an exact oracle.
        cost_or_risk: It scans every reference, so resource cost grows with corpus size and may exceed an agreed latency or memory bound.
        valid_when: Use it while the corpus is a bounded study fixture or until matched measurements show the baseline remains acceptable.
      - option: Evaluate an ANN or vector-index candidate behind the same scoring contract on representative full-corpus data.
        benefit: It can reduce search work at larger scale while making recall, approval parity, and tail latency explicit test outcomes.
        cost_or_risk: It adds index construction, tuning, memory, operational, and rollback cost, and approximate results may diverge from exact KNN.
        valid_when: Choose it only when measured exact scoring breaches an agreed bound and a representative test can compare recall and decisions.
      decision_rule: Retain exact KNN as the oracle; evaluate ANN only after matched full-corpus measurements establish a resource breach and the candidate meets recall, decision-parity, and rollback criteria.
    failure_probe:
      kind: counterexample
      prompt: At full-corpus size, Rails HTTP and Ruby Rack agree on labels but p99 and memory breach the study target only for skewed query vectors. What experiment would separate HTTP or topology overhead from exact-KNN O(N) work, and what recall and rollback evidence would permit ANN?
