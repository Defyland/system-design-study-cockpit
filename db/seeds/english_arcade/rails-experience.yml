    hedging: Keep submissions, rankings, datasets, benchmarks, ownership, and current
      test execution outside the claims supported by the cited revisions.
    precision: State that framework bootstrap and HTTP boundaries differ while nearest-neighbor
      work remains brute force in both variants.
    grammar: Use a causal sentence to connect increasing vector scale with a need
