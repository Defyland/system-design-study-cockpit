- id: rails_experience-10-rediscraft-reactor-and-aof
  version: 1.6.0
  target: rails_experience
  topic: Rediscraft reactor and AOF
  difficulty: 2
  interview_stage: technical_screen
  prompt: How would a Redis-like server contain slow clients, and what trade-off does
    append-before-apply make during crash recovery?
  context: The interviewer is testing event-loop backpressure and AOF replay semantics
    in inspectable Ruby portfolio code, not distributed-system operations.
  best_answer: >-
    The Rediscraft Ruby experiment uses a bounded per-client backlog around IO.select, drops persistently slow clients, and isolates connection errors. Its AOF appends a valid mutation before applying it and rewrites relative EXPIRE as EXPIREAT. I would describe that as replay-oriented ordering, not durability proof: if the process stops after logging but before applying, a restart may apply the command again, and fsync behavior is still unverified.
  response_versions:
    short: >-
      Rediscraft bounds each client's write backlog around an IO.select reactor and drops persistently slow clients. Its AOF appends before applying and converts relative EXPIRE to EXPIREAT. That favors replay, but a crash can separate log state from applied state; fsync and throughput still need evidence.
    medium: >-
      The Rediscraft Ruby experiment uses a bounded per-client backlog around IO.select, drops persistently slow clients, and isolates connection errors. Its AOF appends a valid mutation before applying it and rewrites relative EXPIRE as EXPIREAT. I would describe that as replay-oriented ordering, not durability proof: if the process stops after logging but before applying, a restart may apply the command again, and fsync behavior is still unverified.
    deep: >-
      I would separate event-loop pressure from log-recovery ordering. The Ruby reactor services clients through IO.select, bounds each pending write backlog, drops a persistently slow connection, and isolates connection errors. The AOF executor appends a valid mutation before applying it and converts a relative EXPIRE into an absolute EXPIREAT. That ordering exposes the command to replay earlier than apply-before-append, but a crash between the two steps can leave the log and in-memory state out of sync. Apply-before-append reverses the loss window instead of removing it. I would test restart points, replay-safe application, fsync behavior, and backlog handling before making durability or throughput claims; the cited experiment does not establish distributed operation.
  distractors:
  - text: I would let each client write without a backlog limit because TCP flow control
      handles memory pressure. For persistence, execute before appending because a
      crash cannot occur between those operations. Relative expiry can be replayed
      unchanged, and any slow client can simply wait until the server has spare capacity.
      That keeps persistence operationally straightforward.
    trap: precision
    why_wrong: It lets one client accumulate server memory and creates a window where
      a mutation may be applied but absent from replay history.
  - text: I would treat IO.select plus socket buffering as sufficient flow control and keep slow
      clients connected while memory remains available. For persistence, I would append relative
      EXPIRE commands unchanged and replay them on startup, assuming the original delay remains
      meaningful. A successful normal-loop test would be enough to call shutdown and recovery
      durable, so no separate slow-client eviction policy would be needed.
    trap: hedging
    why_wrong: It turns local mechanics into unverified performance and durability
      claims while ignoring elapsed time, bounded memory, and current test-execution
      limits.
