items:
- id: rails_experience-01-early-rails-integrations-and-geospatial-work
  version: 1.6.0
  target: rails_experience
  topic: early Rails integrations and geospatial work
  difficulty: 2
  interview_stage: technical_screen
  prompt: Could you walk me through a Rails integration and real-time geospatial problem,
    including how you would keep a provider outage from affecting users?
  context: An engineering interviewer is testing whether you can connect an external
    dependency, a spatial query, and a real-time delivery path without presenting
    unverified résumé detail as a personal production claim.
  best_answer: I would give each external provider its own boundary, use explicit timeouts,
    and retry only operations that are safe to repeat. Slow integration work belongs in Sidekiq,
    not the request path. PostGIS with a spatial index fits proximity queries, while Action Cable
    can keep delivery light as costly work stays asynchronous. I can defend those design choices;
    I would not attach an unverified production result or ownership claim to them.
  response_versions:
    short: >-
      I would isolate each provider, bound its timeouts, and retry only safe operations. Slow work
      belongs in Sidekiq; PostGIS with a spatial index supports proximity queries, while Action
      Cable keeps delivery light. I would describe these as defensible design choices, not verified
      production results or ownership.
    medium: >-
      I would give each external provider its own boundary, use explicit timeouts, and retry only
      operations that are safe to repeat. Slow integration work belongs in Sidekiq, not the request
      path. PostGIS with a spatial index fits proximity queries, while Action Cable can keep delivery
      light as costly work stays asynchronous. I can defend those design choices; I would not attach
      an unverified production result or ownership claim to them.
    deep: >-
      I would start by clarifying the operation contract: a read, an idempotent write, or a
      non-idempotent side effect. A provider timeout leaves state unknown, so a blind retry can
      duplicate a write; an idempotency key, status lookup, or queued reconciliation gives a bounded
      recovery path, with a pending state when confirmation is delayed. I would keep provider calls
      behind explicit boundaries and timeouts, move slow work to Sidekiq, and make retry budgets
      observable. For proximity queries, PostGIS and a spatial index address data access; Action
      Cable should carry lightweight updates after costly work has completed. The trade-off is
      between quick recovery and correctness, latency, and user-visible uncertainty. I would verify
      provider semantics, stale-location behaviour, queue age, and delivery lag before promising
      freshness or impact. Tests can support covered behaviour and failure handling, but they cannot
      prove production ownership, scale, or outcomes that the available evidence does not establish.
  distractors:
  - text: I would put every provider call directly in the controller so the user gets
      an immediate answer. If a provider is slow, Rails can simply wait longer, and
      retries are harmless because they improve reliability. PostGIS and WebSockets
      would be implementation details I would mention only if asked, while relying
      on infrastructure defaults for failures.
    trap: precision
    why_wrong: It treats timeouts and retries as universally safe, leaves the web
      path exposed to provider latency, and never identifies the side-effect boundary.
  - text: I built a high-scale real-time platform that used PostGIS and Action Cable
      to guarantee instant, accurate notifications. The integration layer was robust
      because I added a generic retry policy, so failures never affected customers. I
      would apply the same retry policy to every provider and notification channel, log
      only the final status, and treat a successful retry as enough evidence that the
      location lookup and broadcast path are healthy. That lets the platform recover
      without asking which operation is safe to repeat or which failure needs a different
      response.
    trap: hedging
    why_wrong: It converts résumé-derived talk-track detail into unverified personal,
      production, and outcome claims while offering no basis for the guarantee.
  sources:
  - repo: backend-challenges
    path: system-design-estudos/interview/story-bank/01-ruby-rails-backend-story-bank.md
    note: Résumé-derived Rails story bank; use only with the stated confirmation boundary.
  - repo: original
    path: english-arcade/rails_experience/1
    note: Authored evidence-bounded interview-language coaching.
  provenance:
    evidence_class: resume_derived
    project: Backend career narrative
    repository: system-design-estudos
    files:
    - path: interview/story-bank/01-ruby-rails-backend-story-bank.md
      commit: 716a7d9
      claim: The story bank describes external loyalty-provider boundaries, Sidekiq,
        PostGIS with spatial indexing, and lightweight Action Cable delivery as technical
        interview talk-track for early Rails work.
    verified_claims:
    - The story bank records a Rails integration context with providers that can have
      different contracts and availability.
    - The story bank presents explicit timeout and safe-retry policy, Sidekiq outside
      the synchronous path, PostGIS spatial indexing, and lightweight Action Cable
      delivery as design reasoning.
    confirmation_required:
    - The resume PDF is absent; confirm ownership, metrics, and the exact mechanisms
      before claiming that this was the candidate's implementation or role-specific
      work.
    safe_interview_version: The available career record describes a Rails integration
      and geospatial design in which provider boundaries, safe retries, asynchronous
      work, spatial indexing, and lightweight real-time delivery are appropriate topics;
      confirm résumé ownership and exact mechanisms before making it a personal account.
    confidentiality:
      level: medium
      note: Keep credentials, sensitive names, payloads, and nonpublic operational
        details out of the answer.
  feedback:
    register: 'Sound like an engineer explaining a design boundary: lead with the
      provider and request-path risk, then move to spatial and real-time choices.'
    hedging: Describe the design boundary directly, while avoiding a first-person production,
      ownership, or outcome claim that you cannot substantiate.
    precision: Separate retryable reads from side effects, and connect PostGIS to
      an indexed proximity query rather than calling it a generic database feature.
    grammar: 'Keep the conditional sequence clear: state the dependency, then the
      protection, then where expensive work moves.'
    pragmatics: Offer the interviewer a choice between the provider-failure path and
      the geospatial delivery path instead of forcing both details into one monologue.
  rephrase:
    prompt: Reframe the answer for a staff engineer who asks why a shared retry wrapper
      is not enough for every provider.
    goal: Preserve the evidence boundary while distinguishing an idempotent retry
      from a duplicated external side effect.
  follow_up:
    prompt: Suppose the provider returns a timeout after accepting a write, and the product
      owner asks for one simple retry rule. Which contract would you clarify first, and what
      would you show to separate safe recovery from a duplicated side effect?
    goal: Distinguish retryable reads from uncertain writes, then connect the design choice
      to observable evidence without overstating personal ownership or impact.
    challenge_kind: evidence
    best_answer: >-
      I would first clarify whether the operation is a read or a side effect and whether the
      provider offers an idempotency key or status lookup. A timeout is not evidence of failure,
      so I would retry a safe read only within a deadline; for an uncertain write, I would use
      an idempotency boundary or queue reconciliation and expose a pending state rather than
      retry blindly. I can defend that as a design judgment, but I would not claim personal
      production ownership or an outcome without evidence that supports it.
    distractors:
    - text: I would put every provider call directly in the controller so the user gets an immediate
        answer, then apply one fixed retry count to every provider when a request times out. A timeout
        means the write failed, so repeating it immediately can only improve availability; the provider
        can deduplicate it if necessary. I would not distinguish reads from side effects, add a pending
        state, or wait for a status lookup, and I would record the operation as complete once the retry
        succeeds even if the first request may already have been accepted.
      why_wrong: A timeout leaves the external state unknown, so a blind retry can duplicate
        a side effect and amplify the incident.
    - text: I would postpone the decision until a production dashboard shows a complete history of
        timeout frequency and latency. Until those metrics exist, I would use the same retry rule for
        reads and writes and leave the request waiting for the provider, because choosing idempotency
        or reconciliation without an exact rate would be premature. A pending state or status lookup
        could wait until measurements prove the issue is frequent enough to justify extra design.
      why_wrong: The operation contract and one discriminating status or trace check can guide
        a bounded decision before a complete metric history exists.
    answer_anchors:
    - Clarify read versus side effect and whether the provider supports idempotency or status lookup.
    - Treat a timeout as unknown state, not proof that the write failed.
    - Use bounded recovery and state the design-judgment versus personal-impact boundary.
  compression:
    prompt: Give the 30-second version for a recruiter who asks what made the Rails
      work technically demanding.
    goal: Retain one provider-risk sentence, one geospatial or real-time decision,
      and the confirmation boundary without reciting implementation jargon.
  language_focus:
  - precision
  - pragmatics
  - hedging
  feynman:
    concept: 'A timeout is an ambiguous event: the caller may not know whether a provider
      completed a side effect.'
    explain_to: A teammate proposing one retry policy for every external API.
    constraint: Explain the difference between a retryable lookup and an uncertain write,
      then say what a passing test can and cannot establish about an outcome.
    self_check: Could the teammate choose retry, reconciliation, or pending state and explain
      the evidence boundary without treating a timeout as failure?
    reasoning_check: Can you state the operation contract, give a counterexample where a retry
      duplicates a write, and update the decision when provider semantics change?
  black_box:
    symptom: The response says “add retries” after a provider timeout and never asks
      whether the provider may already have accepted the request.
    expected: A bounded account of timeout policy, idempotency or reconciliation needs,
      and work moved away from the web request when it is slow.
    actual: A generic reliability slogan that confuses failed delivery with a known
      failed side effect and treats spatial and socket work as interchangeable details.
    root_cause: The answer treated a provider mechanism as a universal retry rule instead of
      modelling uncertain external state and the user-visible consequence.
    repair: State the ambiguous event, classify the operation, compare recovery with reconciliation,
      and name the observation that would justify the next step.
    reasoning_error: If the decision failed, identify whether the missing piece was the operation
      contract, a hidden assumption, a failure mode, or evidence about the claimed outcome.
  recall:
    active_recall_cue: When a provider times out, what fact must you establish before
      deciding that a retry is safe?
    feynman_prompt: Explain why a proximity query needs a data-access strategy distinct
      from a WebSocket callback.
    black_box_probe: Did you distinguish a defensible design choice from a verified personal
      contribution or result?
    leitner_start_box: 1
    mastery_threshold: 8
    delayed_variant:
      id: rails_experience-01-early-rails-integrations-and-geospatial-work-delayed-1
      prompt: During a later review, the provider documentation says its status endpoint
        is eventually consistent and the geospatial feed can be stale for up to 30 seconds.
        How would you revise the recovery and delivery answer before promising a precise location?
      changed_constraint: Provider status may lag and location freshness is bounded at 30 seconds,
        so the system cannot promise immediate confirmation or precise current position.
      new_evidence: Provider documentation describes an eventually consistent status endpoint,
        and a review observes geospatial updates that can be stale for up to 30 seconds.
      best_answer: I would preserve separate provider boundaries, bounded timeouts, and an
        asynchronous reconciliation path, but stop treating a status response as immediate
        confirmation. I would expose pending or freshness metadata, make the delivery contract
        explicit, and verify the observed lag and stale-position rate before promising precise
        location. My confidence in an exact real-time guarantee would be low until those checks
        and the provider contract are confirmed; I would keep any ownership or impact claim narrow.
      distractors:
      - text: I would keep promising precise real-time location because Action Cable delivers
          asynchronously, then hide the provider's stale status behind the socket. If updates arrive
          later, I would overwrite the displayed position with the newest event and describe it as
          current; eventual consistency is an implementation detail, so no freshness label or pending
          state is needed. The asynchronous channel means users need not know whether the provider
          accepted the write or when the location was observed.
        why_wrong: A delivery channel cannot remove an upstream freshness or consistency limit.
      - text: I would remove the asynchronous path and poll the provider indefinitely until status
          and coordinates agree exactly. A request can keep waiting through provider lag, and the
          client can retry as often as necessary; that guarantees the location is current. I would
          avoid exposing stale metadata because it may confuse users, and stop polling only after an
          exact response, even if this consumes worker capacity or extends the request.
        why_wrong: Unbounded polling can add load and still cannot guarantee freshness under
          an eventually consistent contract.
      answer_anchors:
      - Keep provider boundaries and reconciliation, but stop treating status as immediate confirmation.
      - Expose freshness or pending state and verify the observed lag before promising precision.
      - Lower confidence in an exact real-time guarantee while ownership and provider limits remain unconfirmed.
      reasoning_moves:
        preserve: Keep separate provider boundaries, bounded timeouts, and asynchronous reconciliation.
        revise: Replace an immediate-precision promise with an explicit freshness and pending-state contract.
        verify: Measure status lag and stale-position rate against the provider documentation before changing guarantees.
        certainty_update: Keep confidence low in exact real-time delivery until the contract and observations agree.
  extension:
    prompt: The provider can acknowledge a write after your timeout, while the location feed
      is stale. Which recovery and delivery contract would you defend, and what observation would
      make you change it?
    goal: Defend a concrete boundary between uncertain effects and stale location data, with a
      measurable trigger for revising the design.
  critical_thinking:
    problem_frame: Frame a Rails request that crosses an external provider, a proximity query,
      and a real-time delivery path; the goal is safe recovery and honest freshness, not a slogan.
    claim_map:
      fact: The item establishes an external provider, a proximity query, and a real-time
        delivery path as the technical boundaries to reason about.
      inference: Separate timeouts, safe retries, asynchronous work, and indexed spatial access
        are plausible choices, but their suitability depends on provider semantics and freshness.
      assumption: A timeout may leave a side effect uncertain and the user may tolerate pending
        or stale state; ask the product owner to confirm both conditions.
      unknown: The provider’s idempotency/status contract, accepted freshness window, scale, and
        any verified personal contribution remain unknown.
    comparison:
      applicable: true
      alternatives:
      - option: Retry a read or idempotent operation within a bounded deadline.
        benefit: It can recover a safe request quickly without creating a second external effect.
        cost_or_risk: It is unsafe when the provider may have accepted a non-idempotent write and
          it can amplify load during an outage.
        valid_when: The operation is a read or has a reliable idempotency contract and the deadline
          is explicit.
      - option: Queue reconciliation and expose an uncertain or pending state.
        benefit: It preserves correctness when the provider may have completed a side effect and
          lets the system recover without blind duplication.
        cost_or_risk: Completion is delayed and the UI and data model must represent uncertainty.
        valid_when: The write result is unknown, status can be checked later, or the product accepts
          a bounded pending state.
      decision_rule: Classify the operation and provider contract first; use bounded retry only for
        safe operations, otherwise reconcile asynchronously and make uncertainty visible.
    failure_probe:
      kind: counterexample
      prompt: If the provider accepts a payment-like write but the callback is lost, which part
        of a blind-retry design fails and what containment would you add?
    evidence_check:
      basis: Compare the technical account with the available career material and the provider
        contract; label design reasoning, implementation contribution, and outcome evidence separately.
      source_kind: resume_derived
      limitation: The exercise can test the recovery and freshness trade-off, but it cannot prove
        production ownership, a business result, or a universal retry policy.
      checked_on: '2026-08-25'
    certainty:
      level: low
      rationale: Certainty is low because provider semantics, accepted freshness, and verified
        contribution or outcome evidence are not all established by the prompt.
      update_trigger: Update the decision when the provider confirms idempotency or status
        semantics, the product sets a freshness window, or a trace/test contradicts the assumption.
    rubric:
      facts_correct: Distinguishes the provider, spatial, and delivery facts from unverified
        ownership, scale, or outcome claims.
      assumptions_explicit: Names the idempotency, freshness, and pending-state assumptions that
        must be confirmed before choosing a recovery path.
      alternatives_considered: Compares bounded safe retry with queued reconciliation and states
        when each is valid.
      tradeoff_quality: Connects correctness, latency, load, UX uncertainty, and freshness to the
        selected recovery and delivery contract.
      follow_up_adaptation: Revises the recovery or freshness promise when provider evidence
        changes without claiming that the career history changed.
      certainty_calibration: Keeps certainty low until provider semantics, product tolerance, and
        contribution or outcome evidence are confirmed.
    defense_checks:
    - id: rails_experience-01-early-rails-integrations-and-geospatial-work-defense-contribution
      axis: facts
      prompt: If an interviewer sees a passing integration test and asks what production result
        it proves, how would you answer without overstating your contribution?
      best_answer: I would say the test supports the behaviour it covers, not a production outcome,
        state the contribution boundary I can substantiate, and request operational evidence for impact.
      distractors:
      - text: I would treat a green integration test as proof that the production path delivered the
          promised result to users, because the test exercises the same provider boundary. I would
          report the passing test as evidence of my ownership and impact without separately checking
          deployment context or operational measurements.
        why_wrong: A focused test does not establish deployment context, user impact, or a business metric.
      - text: I would dismiss the integration test as irrelevant and say only a production dashboard
          can count as evidence. Unless I have a user metric, I would not use the test to explain the
          covered behaviour, the contribution boundary, or the next operational check.
        why_wrong: The test is valid evidence for its covered behaviour when its scope is stated clearly.
- id: rails_experience-02-a-growing-ecommerce-api
  version: 1.6.0
  target: rails_experience
  topic: Job Search Dashboard identity lookup and Active Record evidence
  difficulty: 3
  interview_stage: technical_screen
  prompt: In the Job Search Dashboard, the discovery linker was doing repeated identity
    lookups. How would you explain the change and decide whether it actually improved the
    Rails path?
  context: This is a portfolio implementation discussion. The Dashboard batches candidate
    matching by fingerprint and canonical URL; the separate Active Record Optimizer project
    treats query shape, schema, runtime snapshots, and optional PostgreSQL EXPLAIN as evidence
    sources. Neither repository supplies a benchmark or an operating result for this answer.
  best_answer: >-
    I would separate the two portfolio artifacts. In the Job Search Dashboard implementation,
    the orchestrator batches candidate identity matching by fingerprint or canonical URL and
    links matches with the stronger fingerprint first; its test checks that an accepted candidate
    is linked while a rejected one remains unlinked. That demonstrates an inspectable change, not
    a benchmark. Active Record Optimizer treats query diagnosis as an evidence pipeline: model,
    schema, source, and migration scans first, then an opt-in runtime snapshot and PostgreSQL
    EXPLAIN when planner evidence is needed. I would inspect SQL shape, row counts, the plan, and
    the endpoint contract before choosing an index or loading change, and keep the conclusion
    provisional until representative timing exists.
  response_versions:
    short: >-
      In the Job Search Dashboard portfolio code, the linker batches identity matching by
      fingerprint or canonical URL, and its test checks accepted and rejected links. Active
      Record Optimizer treats query changes as evidence questions: inspect SQL and, when
      available, runtime or EXPLAIN evidence before claiming improvement.
    medium: >-
      I would separate the two portfolio artifacts. In the Job Search Dashboard implementation,
      the orchestrator batches candidate identity matching by fingerprint or canonical URL and
      links matches with the stronger fingerprint first; its test checks that an accepted candidate
      is linked while a rejected one remains unlinked. That demonstrates an inspectable change, not
      a benchmark. Active Record Optimizer treats query diagnosis as an evidence pipeline: model,
      schema, source, and migration scans first, then an opt-in runtime snapshot and PostgreSQL
      EXPLAIN when planner evidence is needed. I would inspect SQL shape, row counts, the plan, and
      the endpoint contract before choosing an index or loading change, and keep the conclusion
      provisional until representative timing exists.
    deep: >-
      I would begin by separating an implementation fact from a performance conclusion. In the
      Job Search Dashboard, the committed linker collects discovered candidates, resolves existing
      jobs by fingerprint or canonical URL, indexes the matches, and prefers the fingerprint when
      both identities are present. The associated test checks the accepted link and the absence of
      a link for a rejected candidate. That is evidence about code and a test specification, not a
      measured speedup. In Active Record Optimizer, the runner combines model, schema, source, and
      migration evidence; runtime capture and PostgreSQL EXPLAIN are explicit additions rather than
      assumptions. I would compare the current query shape with a narrower relation or index only
      after checking row counts, plan, pagination, and representative timing. If those observations
      disagree, I would revise the optimization claim instead of turning a cleaner lookup into a
      benchmark or an operational result.
  distractors:
  - text: I would move every controller action into a service object immediately,
      because models should never contain business rules. For performance, I would
      always use eager loading and add indexes to every foreign key. That keeps the
      code uniformly clean and prevents N+1 queries, so I would not spend time examining the
      endpoint or database first. I would also flatten fingerprint and URL into one display string,
      because a single search key is easier to cache, and return the first matching row without
      checking source priority or rejection state. For the optimizer I would apply the same
      eager-loading rule to every endpoint and treat any slower plan as an infrastructure problem.
    trap: precision
    why_wrong: It replaces diagnosis with universal patterns, so it can create needless
      indirection, expensive joins, and indexes unrelated to a real access path.
  - text: I would say the API was fixed by adding more servers and caching every response.
      Query details are usually too low level for an interview, and the important
      point is that Rails can scale when the team follows a consistent architecture.
      I would present that architecture as the fix and let the cache absorb any remaining
      variation. I would put a long-lived cache around the linker and endpoint, key it by
      the visible request parameters, and invalidate it only after a write. If stale identity
      data appeared, I would refresh the entry asynchronously rather than revisit the matching
      rule, so the Rails path stayed simple and the database would see fewer repeated reads.
    trap: pragmatics
    why_wrong: It sidesteps the requested refactoring judgment and offers neither
      a query-level hypothesis nor a reason that caching would preserve ecommerce
      correctness.
  sources:
  - repo: backend-challenges
    path: job-search-dashboard/app/models/job.rb
    note: Portfolio implementation of fingerprint-first canonical identity lookup.
  - repo: backend-challenges
    path: job-search-dashboard/app/services/job_discovery/orchestrator.rb
    note: Portfolio implementation of batched discovered-job linking.
  - repo: backend-challenges
    path: active_record_optimizer/README.md
    note: Portfolio optimizer contract for static, runtime, and planner evidence.
  - repo: original
    path: english-arcade/rails_experience/2
    note: Authored interview-language scaffold for this evidence-bounded target.
  provenance:
    evidence_class: portfolio_code
    project: Job Search Dashboard and Active Record Optimizer
    repository: backend-challenges
    files:
    - path: job-search-dashboard/app/models/job.rb
      commit: dc32f5387da534b3f08d3060a6f5206c93a3e09b
      claim: Job.find_duplicate resolves fingerprint first and canonical URL second.
    - path: job-search-dashboard/app/services/job_discovery/orchestrator.rb
      commit: dc32f5387da534b3f08d3060a6f5206c93a3e09b
      claim: The linker gathers unlinked candidates and maps matching jobs before updating links.
    - path: job-search-dashboard/test/services/job_discovery/orchestrator_test.rb
      commit: dc32f5387da534b3f08d3060a6f5206c93a3e09b
      claim: The test checks an accepted candidate link and a rejected candidate with no link.
    - path: active_record_optimizer/README.md
      commit: 6c2559825cff049f716244ee5fbcd3cdba7e82a6
      claim: The optimizer documents static analysis, opt-in runtime snapshots, and EXPLAIN evidence.
    - path: active_record_optimizer/lib/active_record_optimizer/query_plan_analyzer.rb
      commit: 6c2559825cff049f716244ee5fbcd3cdba7e82a6
      claim: Planner analysis is an explicit evidence layer rather than an automatic benchmark.
    verified_claims:
    - Job Search Dashboard code and tests show fingerprint/canonical-URL matching and link outcomes.
    - Active Record Optimizer documents model, schema, source, migration, runtime, and planner evidence.
    - No cited artifact establishes a benchmark, production use, authorship, or user outcome.
    confirmation_required:
