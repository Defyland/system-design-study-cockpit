- id: rails_experience-18-solidlens-explain-hypothesis-boundary
  version: 1.6.0
  target: rails_experience
  topic: SolidLens explain hypothesis boundary
  difficulty: 3
  interview_stage: architecture_review
  prompt: How would you use an EXPLAIN diagnostic to investigate a queue query without
    treating one heuristic flag as proof that an index must be added?
  context: The interviewer is testing causal, read-only diagnosis across adapters
    and the discipline required before an index recommendation changes a live data
    path.
  best_answer: 'SolidLens keeps doctor, profile, and explain as read-only diagnostic
    paths, not a dashboard or repair daemon. Its plan analyzer applies adapter-specific
    heuristics: SQLite details can flag scans or temporary B-trees, MySQL-like rows
    can flag scans, filesort, temporary work, or missing expected indexes, and PostgreSQL
    nodes can flag sequential scans or sort nodes. I would validate the query, plan,
    workload, and topology before recommending an index, because a heuristic flag
    is neither a proven incident nor universal planner truth.'
  response_versions:
    short: >-
      SolidLens treats doctor, profile, and explain as read-only diagnostic paths. Its
      SQLite, MySQL-like, and PostgreSQL plan flags are adapter-specific hypotheses, so I
      would validate query shape, workload, and topology before a reversible index test.
      A flag is not proof of an incident or a universal index rule.
    medium: 'SolidLens keeps doctor, profile, and explain as read-only diagnostic paths, not a dashboard or repair daemon. Its plan analyzer applies adapter-specific heuristics: SQLite details can flag scans or temporary B-trees, MySQL-like rows can flag scans, filesort, temporary work, or missing expected indexes, and PostgreSQL nodes can flag sequential scans or sort nodes. I would validate the query, plan, workload, and topology before recommending an index, because a heuristic flag is neither a proven incident nor universal planner truth.'
    deep: >-
      SolidLens keeps doctor, profile, and explain read-only: they collect evidence for
      Solid Queue diagnosis rather than mutate a live schema or become a dashboard. The
      analyzer interprets adapter-specific representations—SQLite detail rows, MySQL-like
      type/Extra fields, and PostgreSQL plan nodes—so a scan, filesort, temporary B-tree,
      sort node, or missing expected index is a clue, not a causal result. I would preserve
      the exact query and representative parameters, check statistics, locks, queue topology,
      and workload shape, then run a reversible index experiment with bounded plan handling.
      I would recommend a migration only if measured latency and resource evidence improves
      without unacceptable regressions. The cited study proves code paths and selected
      heuristics, not an incident, benchmark, universal index rule, or production outcome.
  distractors:
  - text: I would treat a sequence-scan flag as proof that the database is broken
      and add every expected index immediately. The same rule works for SQLite, MySQL,
      and PostgreSQL because EXPLAIN has one meaning. Once a plan is captured, workload
      shape, parameter values, statistics, locks, and topology cannot change the recommendation
      in that environment.
    trap: precision
    why_wrong: It converts adapter-specific clues into universal planner truth and
      skips the workload and topology evidence needed before changing an index.
  - text: I would build a dashboard that continuously repairs plans after each profile.
      A query plan should be stored without restrictions because diagnostics are harmless
      metadata. If the analyzer does not flag a scan, sort, temporary structure, or
      missing index, the query is guaranteed healthy and does not need a reviewer.
    trap: pragmatics
    why_wrong: It expands a read-only diagnostic into an unsupported repair product
      and ignores the confidentiality and false-negative boundaries of captured plans.
  sources:
  - repo: backend-challenges
    path: solid_lens/docs/specs/product-direction.md
    note: Inspectable causal diagnostic product boundary.
  - repo: backend-challenges
    path: solid_lens/lib/solid_lens/analyzers/explain_plan_analyzer.rb
    note: Inspectable adapter-specific EXPLAIN heuristics.
  - repo: original
    path: english-arcade/rails_experience/18
    note: Authored evidence-bounded interview-language coaching.
