  rephrase:
    prompt: Explain to a security reviewer why the request hash matters even when an
      idempotency key is already present.
    goal: Separate command identity from request-semantic validation without claiming
      a particular provider, compliance scope, or deployment.
  follow_up:
    prompt: A second request reuses an organization-scoped key with a changed query
      while the first is processing. What should the API return, and what would you verify?
    goal: Explain the request-conflict boundary and the evidence needed before treating
      a processing record as stale or retryable.
    challenge_kind: failure
    best_answer: >-
      I would return a conflict rather than start a second command, because the reused key no
      longer matches the method, path, or request hash held by the first process. I would preserve
      the original record and verify that a fresh processing state is not mistaken for stale work.
      I would test concurrent reuse, the ten-minute stale timeout under representative contention,
      and rollback when response persistence
      fails, then define an explicit status or retry contract. A client timeout alone would not
      establish that the command failed or that a new identity is safe.
    distractors:
    - text: I would accept the changed request because the client supplied the same key, then overwrite the first record with the latest parameters. The key itself is the only identity that matters, so I would update method, path, and request hash in place and let whichever process finishes last define the response. That keeps the API simple and avoids asking clients to distinguish a conflict from a replay.
      why_wrong: The method, path, and request hash are part of the identity boundary; overwriting
        them would make replay and audit behavior ambiguous.
    - text: I would mark the first process stale immediately because the second request proves that the caller is waiting, then let both attempts continue. A waiting client is enough evidence that the lock exceeded its useful lifetime, so I would allow the second command to write a fresh response and let the first finish afterward. If two responses differ, I would retain the newest one and retry the client.
      why_wrong: Caller impatience is not evidence of stale processing, and two active attempts
        can violate the single-command boundary.
    answer_anchors:
    - Treat changed method, path, or request hash as a conflict, not a new command.
    - Preserve the locked identity and original record while the first process is fresh.
    - Verify concurrency, stale recovery, and response-persistence rollback before defining retry semantics.
  compression:
    prompt: Give a 30-second answer to “How do you make a SettleFlow command retry safe?”
