    - path: solid_lens/test/solid_lens/explain_plan_analyzer_test.rb
      commit: 0e437828c3580521cb6a3cb37addc353291841b5
      claim: The cited tests describe selected adapter-plan flags from the named revision;
        they leave present execution, benchmark results, and any proved incident unverified.
    verified_claims:
    - The inspected study frames doctor, profile, and explain as causal read-only
      diagnostic paths rather than a dashboard or automated repair daemon.
    - The plan analyzer emits adapter-specific heuristic reasons that require validation
      against query shape, workload, planner context, and topology before action.
    confirmation_required:
    - Confirm authorship, operation scope, external users, results, current test execution,
      benchmarks, adoption, query-review policy, plan retention, and topology assumptions.
    safe_interview_version: This portfolio study offers read-only, adapter-aware plan
      heuristics for diagnostic hypotheses; validate query shape, workload, and planner
      context before recommending an index, and confirm delivery history and current
      execution separately.
    confidentiality:
      level: high
      note: Do not disclose SQL text, EXPLAIN rows, schema or index names, queue topology,
        parameter values, database versions, connection details, or incident-like
        reports.
  feedback:
    register: Present the analyzer as diagnostic hypothesis support, not as a dashboard,
      benchmark, or automatic database repair authority.
    hedging: Call scan and index reasons heuristics, then withhold incident, adoption,
      operation, benchmark, and current-run conclusions.
    precision: 'Tie each clue to its adapter representation: SQLite detail, MySQL-like
      row, or PostgreSQL plan node, before discussing an expected index.'
    grammar: Use conditional language for a recommendation, such as “if the workload
      confirms this plan,” rather than treating a flag as a completed conclusion.
    pragmatics: Protect query and topology details when requesting a second opinion
      on an index, because diagnostics can reveal sensitive implementation information.
  rephrase:
    prompt: Explain the same finding to a database reviewer who asks why a sequential
      scan has not yet earned an index change.
    goal: Replace tool terminology with a falsifiable performance-investigation narrative.
  follow_up:
    prompt: Before recommending an index, how would you test whether this flagged
      plan is caused by parameter values, statistics, lock pressure, query shape,
      or topology?
    goal: Make the heuristic a validation plan rather than an automatic action.
    challenge_kind: failure
    best_answer: >-
      I would identify the adapter representation first: SQLite detail, MySQL-like rows, or a
      PostgreSQL plan node. I would capture the exact query and parameters, compare the flagged
      plan with representative workload and topology, and check statistics and lock pressure.
      Only after that would I run a reversible index experiment with bounded plan handling,
      requiring an agreed latency or resource improvement without a regression. A scan,
      filesort, temporary B-tree, or missing-index reason remains a hypothesis rather than
      proof of an incident or a universal migration rule.
    distractors:
    - text: I would add the expected index as soon as any adapter reports SCAN, Seq Scan,
        or type ALL. The flag is enough evidence that the queue query causes user-visible
        latency, so I would skip representative parameters, statistics, locks, and topology.
        Because each adapter describes a scan, I would apply one migration everywhere, store
        the full EXPLAIN in a shared report, and add more indexes until the warning disappears.
      why_wrong: It treats adapter-specific clues as causal proof, skips workload and topology
        checks, and turns an unmeasured hint into irreversible schema churn.
    - text: I would keep the command read-only but compare only whether a warning appears and
        whether the final row count is unchanged. A clean result means no index is needed,
        while a flagged result means the analyzer should repair the schema automatically. I
        would treat SQLite details, MySQL rows, and PostgreSQL nodes as interchangeable, ignore
        temporary structures and lock pressure, and use default parameters instead of the queue workload.
      why_wrong: It confuses absence of a heuristic with health, erases adapter semantics, and
        avoids the representative workload and causal checks required for an index decision.
    answer_anchors:
    - Identify the adapter-specific plan representation before interpreting a flag.
    - Check query, parameters, statistics, locks, workload, and topology before indexing.
    - Run a reversible index experiment and require improvement without regression.
  compression:
