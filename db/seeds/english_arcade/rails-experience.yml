      best_answer: I would preserve the organization-scoped identity, conflict checks, and the
        expand-compatible sequence. I would revise the rollout to keep old and new readers and
        writers compatible until the legacy writer is retired, and treat response-persistence
        failure as a rollback of local command effects rather than evidence of an external result.
        I would verify old/new read parity, bounded backfill, transaction rollback, and an explicit
        status or retry contract before tightening the schema or retrying the command. The evidence
        lowers confidence in a one-step migration; it does not establish a deployed result or whether
        the ten-minute stale threshold is operationally adequate under real workloads.
      distractors:
      - text: I would remove the legacy column immediately because the new application is already deployed, and treat local rollback as proof that every external effect was reversed. The rehearsal's old writer can be corrected after the migration, while a successful database rollback means the provider charge is also safe to retry. I would tighten the schema first and investigate compatibility failures only if an old process reports an error. I would ignore version overlap until then.
        why_wrong: The rehearsal proves an old writer remains, and the rollback test covers local
