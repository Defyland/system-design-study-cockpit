    verified_claims:
    - The four inspected portfolio tools form a local sequence of bounded context
      curation, prompt validation and materialization, static readiness assessment,
      and packet composition.
    - The packet builder consumes public CLI contracts, which leaves version drift,
      output compatibility, subprocess failure, and sensitive artifact aggregation
      as explicit risks.
    confirmation_required:
    - Confirm authorship, operation scope, external users, adoption, publication,
      results, present test execution, tool-version compatibility, output contracts,
      and artifact handling.
    safe_interview_version: 'This portfolio study composes four local Ruby tools through
      public CLI contracts: bounded context curation, prompt validation, static readiness,
      and packet assembly; confirm delivery history, compatibility, and sensitive-artifact
      controls.'
