      - text: I would keep the one-step migration and wait for a complete dashboard before testing the compatibility path or defining retry and status behavior after the rollback. Since the new reader is the intended future state, old writers can be handled as operational noise, and a dashboard will eventually show whether retries are needed. I would not spend time on parity or bounded backfill until the migration has been running.
        why_wrong: The new evidence requires a bounded compatibility and persistence response now;
          waiting does not repair either known boundary.
      answer_anchors:
      - Preserve stable identity, conflict checks, and the expand-compatible migration sequence.
      - Revise compatibility and recovery around old writers and response-persistence rollback.
      - Verify parity, backfill, rollback, and the status or retry contract before tightening contracts.
      reasoning_moves:
        preserve: Keep request identity, conflict checks, and evidence-led migration sequencing.
        revise: Extend the compatibility window and treat response-persistence failure as local rollback evidence.
        verify: Check old/new parity, backfill, rollback behavior, and the status or retry contract.
        certainty_update: Lower confidence in one-step migration and automatic replay claims.
  extension:
    prompt: Defend the migration and recovery boundary when response persistence fails while
      an older Rails writer remains active; name the observation that would make you narrow or change it.
    goal: Explain one coherent SettleFlow decision with a concrete compatibility window,
      recovery boundary, and evidence threshold; do not invent rollout results.
  critical_thinking:
    problem_frame: >-
      Separate two boundaries in the SettleFlow discussion: preserving one command identity when
      the caller cannot see the first result, and changing storage while old readers or writers may
      still run. Treat organization-scoped key uniqueness and the ten-minute processing timeout as
      implementation facts; ask what response state is allowed during uncertainty, which versions
      overlap, and what evidence makes a contract safe to remove.
    claim_map:
      fact: IdempotencyKey validates key uniqueness scoped to organization_id, and Runner defines
        PROCESSING_LOCK_TIMEOUT as 10.minutes; it locks the key, compares method, path, and request
        hash, and has tests for replay, conflict, stale takeover, and rollback. The migration document
        prescribes compatible expansion and later contraction.
      inference: A response-persistence failure rolls back the tested local command effects, but the
        repository does not establish an external effect, settlement delay, or live rollout; any replay
        or reconciliation policy beyond that rollback needs a separate contract.
      assumption: I am assuming the product can represent pending or recovered state, that old and new
        application versions may overlap, and that the ten-minute boundary is a candidate whose adequacy
        under representative workloads has not yet been validated; I would confirm these contracts before migrating.
      unknown: Whether the ten-minute stale threshold is operationally adequate under real workloads,
        the response schema, backfill population, latency target, deployment ownership, and measured
        financial or operational result remain unknown.
    comparison:
      applicable: true
      alternatives:
      - option: Preserve the stable identity and replay or reconcile the original command.
        benefit: It keeps a repeated request addressable and avoids treating an unseen response as a new effect.
        cost_or_risk: It needs durable response state, a workload-validated stale boundary, and a client state that can remain pending.
        valid_when: The command contract supports idempotency and the caller can query or receive the original outcome.
      - option: Reject uncertain retries until an explicit status check resolves the command.
        benefit: It avoids creating a second effect when replay semantics or command status are not available.
        cost_or_risk: It increases waiting and requires a reliable status path; it may be unacceptable for a synchronous user action.
        valid_when: The command contract lacks safe replay but exposes authoritative status and product accepts delayed completion.
      decision_rule: Prefer stable replay when the identity and stored outcome are authoritative; otherwise require status evidence before a new effect, and keep the schema compatible until all old readers and writers are gone.
    failure_probe:
      kind: failure_mode
      prompt: A response write fails after the command has been processed, while an older writer still sends the legacy column. Which boundary do you contain first, and what test would distinguish recovery from duplication?
    evidence_check:
      basis: Compare the runner, idempotency model, request tests, and migration guidance in the cited SettleFlow commits; keep repository behavior separate from personal operation or provider results.
      source_kind: primary_code
      limitation: The cited code, tests, and document establish implementation and design guidance, not authorship, deployment, provider behavior, a financial result, or a universal migration recipe.
      checked_on: '2026-08-25'
    certainty:
      level: low
      rationale: Confidence is strong about the cited code paths and test scenarios, but low about any external effect, rollout context, or personal responsibility.
      update_trigger: Change the recommendation after a status contract, lock trace, old/new parity rehearsal, or response-persistence failure test supplies contrary evidence.
    rubric:
      facts_correct: Distinguishes committed SettleFlow behavior and migration guidance from assumptions about a provider or a personal rollout.
      assumptions_explicit: Names the pending-state, ten-minute threshold adequacy, version-overlap, and status-contract assumptions before prescribing recovery.
      alternatives_considered: Compares stable replay with status-gated rejection and states the evidence that makes each safe.
      tradeoff_quality: Weighs duplicate-effect risk, latency, durable state, migration compatibility, and removal timing.
      follow_up_adaptation: Revises replay and migration sequencing when response persistence, stale processing, or old-writer evidence changes.
      certainty_calibration: Uses medium confidence for repository facts and low confidence for external outcomes, ownership, and impact.
    defense_checks:
    - id: rails_experience-03-payment-performance-and-safe-rollout-defense-migration
      axis: adaptation
      prompt: If the database migration is reversible but a provider charge is not, how would
        that asymmetry change the order of your safeguards?
      best_answer: I would protect the irreversible external effect first with stable identity,
        pending state, and reconciliation; I would use expand-contract for the reversible schema
        change and verify old/new compatibility before removing the legacy path.
      distractors:
      - text: I would roll back the application and assume that rollback also reverses a charge. The database transaction and deployment version represent the whole command, so restoring the previous code should cancel any provider effect automatically. I would use that rollback as the recovery proof and avoid adding pending or reconciliation state that could delay the next request.
        why_wrong: Application rollback cannot undo an external effect that may already have settled.
      - text: I would optimize the slow query first and postpone idempotency because performance is the user-visible problem. Once requests are fast, duplicate commands should be less likely, so I would tune indexes and latency before deciding how to retain keys or reconcile uncertain charges. If the faster path still repeats an effect, I would treat that as a later correctness phase.
        why_wrong: A faster path can still duplicate an irreversible charge; correctness is a
          prerequisite to performance tuning in this boundary.
- id: rails_experience-04-application-security-and-idor
  version: 1.6.0
  target: rails_experience
  topic: SupportNest tenant-scoped tickets and RBAC
  difficulty: 2
  interview_stage: technical_screen
  prompt: In SupportNest, an authenticated caller guesses another tenant’s public ticket
    ID. How would you fix the BOLA boundary and prove that the role rules still hold?
  context: This is a portfolio implementation discussion. TicketsController resolves public
    IDs through current_organization.tickets, while Security::Authorizer loads a role matrix.
    The threat model names guessed public IDs as a BOLA risk and maps the controller scope as
    the current mitigation. The integration tests cover a cross-tenant not-found response and
    a viewer forbidden from creating a ticket. The code does not establish database row-level
    security, a breach, or impact.
  best_answer: >-
    In SupportNest’s portfolio API, the ticket controller resolves records through
    current_organization.tickets.find_by!(public_id:), so tenant scope is applied before
    serialization. The threat model names a guessed public ID as a BOLA case and maps that
    controller scope as the mitigation. Authorization is separate: Security::Authorizer loads the role matrix;
    viewers can read and list but cannot create or update. The integration tests create two
    organizations, verify that a token from the second receives not-found for the first tenant’s
    ticket, and verify that a viewer receives forbidden on creation. I would still trace every
    lookup, export, and job and add cross-tenant tests, because application scoping is not database
    row-level security. These artifacts show portfolio behavior, not a production incident or impact.
  response_versions:
    short: >-
      In the SupportNest portfolio API, ticket lookup starts with current_organization, so a
      guessed public ID stays inside the caller’s tenant; the threat model labels that BOLA risk.
      A separate role matrix denies viewer writes, and integration tests cover cross-tenant
      not-found and viewer-forbidden cases. I would extend those tests to exports and jobs rather
      than claim database-level isolation.
    medium: >-
      In SupportNest’s portfolio API, the ticket controller resolves records through
      current_organization.tickets.find_by!(public_id:), so tenant scope is applied before
      serialization. The threat model names a guessed public ID as a BOLA case and maps that
      controller scope as the mitigation. Authorization is separate: Security::Authorizer loads the role matrix;
      viewers can read and list but cannot create or update. The integration tests create two
      organizations, verify that a token from the second receives not-found for the first tenant’s
      ticket, and verify that a viewer receives forbidden on creation. I would still trace every
      lookup, export, and job and add cross-tenant tests, because application scoping is not database
      row-level security. These artifacts show portfolio behavior, not a production incident or impact.
    deep: >-
      I would separate tenant selection from role authorization. In SupportNest, the controller
      resolves a public ticket identifier through current_organization.tickets, which makes the
      organization relation part of resource selection rather than a check performed after a naked
      find. The threat model frames a guessed public ID as BOLA and maps this scoped lookup as the
      current mitigation. Security::Authorizer then reads the role matrix: a viewer may read or list but is not
      permitted to create or update. The integration fixture uses two organizations and checks that
      the second tenant cannot retrieve the first tenant’s ticket, while a viewer receives forbidden
      on creation. I would compare a scoped relation with a global lookup plus policy, reject the
      latter as harder to prove across exports and jobs, and add those paths to the test matrix. The
      evidence establishes application behavior and test coverage, not database RLS, an incident, or
      a production result.
  distractors:
  - text: I would keep the existing record lookup because the user is already logged
      in, then hide sensitive buttons in the UI. The route can reject unexpected fields
      after the update succeeds. SQL injection is not relevant when the application
      uses Active Record, so the main task is making the error message less revealing.
      I would leave serializers and workers on the same naked lookup, because they are
      internal paths, and rely on a later audit to reveal whether the caller’s scope was
      actually carried into those entry points.
    trap: precision
    why_wrong: It relies on client presentation after the resource is already selected,
      and it incorrectly assumes that ORM use removes risks from dynamic SQL or permitted
      attributes.
  - text: I would add a global authorization callback and mark the ticket resolved.
      Reviewing every route is unnecessary because the callback will catch the same
      issue everywhere. If a query needs dynamic sorting, I would interpolate the
      column name directly because parameter binding already protects the value being
      sorted. I would apply the callback to controllers and background jobs through one
      shared concern, then rely on a small representative authorization test instead of
      tracing every entry point. For sorting, I would accept the column from the query
      string, interpolate it into ORDER BY, and use the same sanitizer for values and
      identifiers so the API remained flexible without maintaining a separate allowlist.
    trap: hedging
    why_wrong: It promises a universal control without checking policy coverage and
      misses that dynamic identifiers need allowlisting rather than value binding.
  sources:
  - repo: backend-challenges
    path: supportnest-rails-saas/app/controllers/v1/tickets_controller.rb
    note: Portfolio controller implementation of organization-scoped ticket lookup.
  - repo: backend-challenges
    path: supportnest-rails-saas/app/services/security/authorizer.rb
    note: Portfolio authorization service that loads role permissions.
  - repo: backend-challenges
    path: supportnest-rails-saas/docs/security/threat-model.md
    note: Portfolio BOLA threat model mapping guessed public IDs to tenant-scoped controller lookup.
  - repo: backend-challenges
    path: supportnest-rails-saas/test/integration/authorization_and_isolation_test.rb
    note: Portfolio integration coverage for cross-tenant lookup and viewer permissions.
  - repo: original
    path: english-arcade/rails_experience/4
    note: Authored interview-language scaffold for this evidence-bounded target.
  provenance:
    evidence_class: portfolio_code
    project: SupportNest tenant-scoped Rails portfolio
    repository: backend-challenges
    files:
