      frozen snapshot into the capsule, copy any mutable value that crosses the
      boundary, and wrap database clients or callbacks behind adapters later. Warm-up
      is a startup cost that ordinary request budgets can absorb, so a passing local
      test should authorize the same design for every controller and workload. A broad
      migration would reduce framework coupling and give the team one uniform
      concurrency model, with remaining dependency issues handled as follow-up cleanup.
    trap: precision
    why_wrong: >-
      It treats a narrow capsule as a framework-wide guarantee and ignores the
      unresolved state, dependency, workload, and economic conditions.
  - text: >-
      The PIVOT settles the question permanently. Because Rails contains mutable state,
      callbacks, and native dependencies, no workload could make a Ractor boundary
      useful again. I would reject further measurement and keep ordinary Rails
      concurrency for every service, even when a read model is frozen and the
      dependency set is isolated. The team should treat the research as a completed
      warning rather than spending time on another workload, environment, or cost
      comparison.
    trap: pragmatics
    why_wrong: >-
      It turns a conditional research recommendation into an irreversible ban and
      removes the evidence threshold that would make the decision falsifiable.
  sources:
  - repo: backend-challenges
    path: ractorized-rails-kernel/README.md
    note: Committed portfolio research scope and decision boundary.
  - repo: backend-challenges
    path: ractorized-rails-kernel/rails_capsule_mini_app/app/services/capsule.rb
    note: Committed capsule boundary and owner-side protocol.
  - repo: backend-challenges
    path: ractorized-rails-kernel/rails_capsule_mini_app/test/capsule_rails_test.rb
    note: Committed capsule and Rails-boundary test cases.
  - repo: backend-challenges
    path: ractorized-rails-kernel/phase3_migration/FINDINGS.md
    note: Committed findings and PIVOT rationale.
  provenance:
    evidence_class: portfolio_code
    project: Ractorized Rails Kernel
    repository: backend-challenges
    files:
    - path: ractorized-rails-kernel/README.md
      commit: 34a216b8774f459cd7c0c2774042dc32d9d21124
      claim: The committed README describes a portfolio Ractor research project, a narrow capsule, and an explicit PIVOT boundary.
    - path: ractorized-rails-kernel/rails_capsule_mini_app/app/services/capsule.rb
      commit: 34a216b8774f459cd7c0c2774042dc32d9d21124
      claim: The committed service snapshots explicit values, builds shareable proposals, and keeps the Rails transaction on the owner side.
    - path: ractorized-rails-kernel/rails_capsule_mini_app/test/capsule_rails_test.rb
      commit: 34a216b8774f459cd7c0c2774042dc32d9d21124
      claim: The committed test specifies capsule and Rails-boundary behavior at the cited revision without proving a wider integration or current execution.
    - path: ractorized-rails-kernel/phase3_migration/FINDINGS.md
      commit: 34a216b8774f459cd7c0c2774042dc32d9d21124
      claim: The committed findings record shareability, mutable state, dependency, warm-up, copying, and economic-fit concerns and recommend a PIVOT.
    verified_claims:
    - The cited portfolio revision contains a narrow Rails/Ractor capsule, its boundary test, and findings that limit generalisation.
    - The cited findings make dependency safety, state handling, warm-up, copying, and economic fit conditions for any later recommendation.
    confirmation_required:
    - Confirm current reproduction, authorship, operation scope, external users, workload coverage, and whether later dependency evidence changes the documented PIVOT.
    safe_interview_version: This portfolio research records a narrow Rails/Ractor capsule and a PIVOT after state, dependency, and economic-fit concerns; present it as a bounded study and confirm reproduction, authorship, scope, workload coverage, and later evidence before making personal claims.
    confidentiality:
      level: medium
      note: Do not disclose local Rails configuration, database connection details, dependency internals, unredacted findings, or machine-specific measurements.
  feedback:
    register: Present the capsule as a research boundary and recommendation threshold, not as a framework migration announcement.
    hedging: Mark the cited implementation and findings as facts, then reserve reproduction, authorship, scope, and outcomes for confirmation.
    precision: Distinguish shareable capsule values from proof that Rails state, adapters, and dependencies are safe as one system.
    grammar: Use a contrastive clause to connect the narrow experiment with the wider conclusion without overstating either side.
    pragmatics: Answer a challenge with the next discriminating observation rather than defending the PIVOT as an identity.
  rephrase:
    prompt: Explain to a staff engineer why the PIVOT is an evidence-based engineering decision rather than a retreat from concurrency research.
    goal: Keep the capsule boundary, unresolved conditions, and reopening threshold while reducing implementation detail.
  follow_up:
    prompt: A repeatable workload trace covers one dependency set, but a database-backed gem remains mutable. Would you keep the PIVOT, narrow it, or reopen it, and what observation would settle the next step?
    goal: Apply the evidence boundary to a concrete dependency counterexample without inventing a result.
    challenge_kind: evidence
    best_answer: >-
      I would keep the PIVOT for the database-backed gem. The trace would support
      the narrower fact that one dependency set is testable, but it would not prove
      that the mutable gem is safe inside a Ractor. I would isolate or replace that
      dependency, rerun the relevant workload with a stated warm-up budget, and reopen
      only if repeated evidence satisfies both safety and cost conditions. Until then,
      broad Rails migration remains outside the evidence.
    distractors:
    - text: >-
        I would reopen the whole Rails recommendation because one workload trace
        succeeded. If that dependency set crosses the boundary once, I would place a
        thin wrapper around the mutable gem, copy values at the edge, keep callbacks
        on the owner side, and widen the migration incrementally. A second trace can
        wait because a later dependency failure would affect only that integration.
        The PIVOT should become an implementation backlog, while ordinary Rails tests
        provide enough control for the broader migration to proceed.
      why_wrong: >-
        It generalises one trace and treats dependency shareability as an incidental
        detail instead of a condition of the proposed boundary.
    - text: >-
        I would keep the PIVOT forever because a mutable gem makes every Ractor design
        invalid. No dependency audit, replacement, or workload measurement could
        justify a narrower experiment once this counterexample appears. The team should
        keep every affected service on ordinary Rails concurrency, reject isolated read
        models even when their inputs are frozen, and stop comparing warm-up or copying
        costs because the first mutable dependency already closes the question.
      why_wrong: >-
        It discards a potentially testable capsule and replaces conditional evidence
        with a permanent prohibition.
    answer_anchors:
    - Keep the PIVOT when a mutable database-backed gem crosses the capsule boundary.
    - Isolate or replace the dependency before reopening broader Rails execution.
    - Require repeated workload, warm-up, safety, and cost evidence before widening.
  compression:
    prompt: In two sentences, explain why a narrow capsule can justify a PIVOT without proving that Ractors are useless for Rails.
    goal: Preserve the bounded experiment, the unresolved constraints, and one concrete reopening condition under time pressure.
  language_focus:
  - precision
  - hedging
  - pragmatics
  feynman:
    concept: A Ractor capsule is useful only when the values and dependencies crossing its boundary respect isolation.
    explain_to: A teammate who assumes that one successful capsule proves a framework-wide concurrency migration.
    constraint: Explain the PIVOT without citing unverified benchmark output or claiming personal delivery.
    self_check: Did you distinguish the capsule's tested boundary from Rails-wide state, gem, workload, and cost questions?
    reasoning_check: Can you name a dependency counterexample and the evidence that would make a narrower Ractor decision credible again?
  black_box:
    symptom: The answer promotes a small Ractor capsule to a universal Rails concurrency rule.
    expected: A bounded capsule, its state and dependency constraints, a PIVOT, and a falsifiable reopening threshold.
    actual: A migration recommendation based on one compilation or one local test.
    root_cause: The experiment boundary was confused with a system-wide safety and cost guarantee.
    repair: Restore the capsule scope, list unresolved conditions, and require workload-specific dependency evidence before widening it.
    reasoning_error: If the Ractor answer failed, classify whether the mistake was a fact, assumption, comparison, failure, or certainty error before choosing the smallest repair.
  recall:
    active_recall_cue: Why does a Ractor-safe capsule stop short of establishing Rails-wide safety?
    feynman_prompt: Explain the PIVOT to someone who equates every limited experiment with failure.
    black_box_probe: Which dependency or workload observation could reverse the current boundary?
    leitner_start_box: 1
    mastery_threshold: 8
    delayed_variant:
      id: rails_experience-11-ractorized-rails-research-boundary-delayed-11
      prompt: A Linux rerun shows the capsule's dependency set is shareable, but warm-up consumes the budget for the proposed request workload. How does that observation change the Ractor decision?
      changed_constraint: the target workload has a warm-up budget that the capsule may not meet
      new_evidence: a rerun traces warm-up cost for one isolated dependency set without proving Rails-wide fit
      best_answer: >-
        The rerun strengthens the fact that one dependency set can be examined, but
        it makes the warm-up assumption provisional for this workload. I would keep the
        PIVOT for broader Rails use, narrow any candidate to a workload with a justified
        warm-up budget, and request repeated measurements before changing the rule.
        The trace is environment-specific evidence, not a general economic result.
      distractors:
      - text: >-
          I would widen the recommendation immediately because shareability has been
          demonstrated. Warm-up is a startup detail that ordinary request budgets can
          absorb, so the same boundary should serve every controller and request
          workload without another decision gate. I would record the elapsed startup
          time after the migration, let the owner tune the pool later, and treat the
          isolated dependency trace as enough evidence to move from the capsule to the
          wider Rails service.
        why_wrong: >-
          It treats one shareability observation as sufficient evidence for workload
          economics and ignores the changed warm-up constraint.
      - text: >-
          I would reject all future capsule work because the rerun did not fit this
          request budget. A failed economic fit in one workload makes the isolation
          boundary irrelevant everywhere else, including a frozen read model with a
          longer request budget. I would keep all computation inline, avoid another
          dependency audit, and treat any later warm-up or copying measurement as
          incapable of changing the decision for a different workload.
        why_wrong: >-
          It overextends a local cost observation into a universal technical ban.
      answer_anchors:
      - Treat one shareable dependency trace as local evidence, not Rails-wide fit.
      - Keep the broader PIVOT when warm-up consumes the request budget.
      - Require repeated environment-specific measurements before reopening the boundary.
      reasoning_moves:
        preserve: Preserve the narrow capsule and its owner-side boundary while warm-up remains unresolved.
        revise: Narrow any candidate workload when its warm-up budget no longer supports the proposed path.
        verify: Repeat the dependency trace with measured warm-up and safety checks in the target environment.
        certainty_update: Increase confidence only when repeated workload evidence satisfies isolation and cost gates.
  extension:
    prompt: 'Defend a narrower Ractor capsule after a dependency counterexample: which boundary changes, which alternative remains viable, and what measurement would update the recommendation?'
    goal: Move from the decision summary to a technical defence that names isolation, cost, failure, and the next evidence without inventing a result.
  critical_thinking:
    problem_frame: Frame the Ractor capsule decision around the owner, the required isolation guarantee, the dependency and warm-up constraints, and the observation that could invalidate the PIVOT.
    claim_map:
      fact: The cited revision contains a narrow capsule service, a boundary test, and findings that record a PIVOT with unresolved dependency and economic conditions.
      inference: The evidence supports limiting the claim to that capsule and using it as a research boundary rather than a Rails-wide migration recommendation.
      assumption: A future candidate workload can provide shareable inputs, safe dependencies, and a warm-up budget that is meaningful for its request path.
      unknown: Current reproduction, broader dependency coverage, representative workload fit, authorship, and any later evidence remain unknown here.
    comparison:
      applicable: true
      alternatives:
      - option: Keep computation inside a narrow Ractor capsule over explicit frozen snapshots and commit on the owner side.
        benefit: It limits Rails-global and mutable-dependency exposure while preserving a testable concurrency boundary.
        cost_or_risk: It requires snapshot construction, dependency discipline, and a separate owner-side commit path.
        valid_when: Use it when the workload can tolerate the boundary and its inputs and dependencies can be audited for shareability.
      - option: Move a broader Rails service, including more framework state, across the Ractor boundary.
        benefit: It could reduce boundary plumbing if the service truly needs broader isolated execution.
        cost_or_risk: It multiplies mutable-state, adapter, gem, warm-up, and copying risks that the cited findings leave unresolved.
        valid_when: Consider it only after a dependency audit and repeatable workload evidence satisfy explicit safety and cost gates.
      decision_rule: Keep the narrow capsule while the wider option lacks workload-specific dependency and cost evidence; widen only when those gates are passed.
    failure_probe:
      kind: counterexample
      prompt: If a proposed capsule captures a mutable Active Record object or a gem callback, which failure should you expect at the boundary, and which test would distinguish it from a workload-cost problem?
    evidence_check:
      basis: Check the capsule and PIVOT claims against ractorized-rails-kernel/rails_capsule_mini_app/app/services/capsule.rb and phase3_migration/FINDINGS.md at commit 34a216b8774f459cd7c0c2774042dc32d9d21124, then label each claim as fact, inference, assumption, or gap.
      source_kind: primary_code
      limitation: These committed files bound a portfolio research result; they do not prove Rails-wide compatibility, representative workload economics, current execution, authorship, or operation.
      checked_on: '2026-08-25'
    certainty:
      level: low
      rationale: Certainty is low because the cited revision narrows the capsule but leaves broader dependencies, workloads, reproduction, and scope for confirmation.
      update_trigger: Update the recommendation if a repeated workload test with the relevant dependency either crosses an explicit safety or warm-up gate or demonstrates a stable narrow fit; do not revise it from a generic benchmark or an unrelated capsule.
    rubric:
      facts_correct: Names the committed capsule, test, and PIVOT findings without importing Rails-wide fit or a measured outcome.
      assumptions_explicit: Identifies the workload, dependency, and warm-up assumptions that still need confirmation.
      alternatives_considered: Compares a narrow snapshot capsule with a broader Rails-state boundary using explicit validity conditions.
      tradeoff_quality: Connects boundary plumbing and reuse against shareability, dependency, warm-up, and copying risk.
      follow_up_adaptation: Revises the scope when a dependency or workload trace changes the premise instead of repeating the PIVOT.
      certainty_calibration: Uses low certainty and names the repeated evidence that would move the recommendation.
    defense_checks:
    - id: rails_experience-11-ractorized-rails-research-boundary-defense-scope
      axis: assumptions
      prompt: A successful Ractor capsule run uses shareable values, so a reviewer wants to generalise it to every Rails controller. Which premise would you test, and what evidence keeps the PIVOT?
      best_answer: >-
        I would test dependency and state isolation plus workload fit for each controller, rather than extrapolating from shareable capsule values. The PIVOT remains for Rails-wide migration while mutable Rails state, gem safety, warm-up, copying, and economic fit are unmeasured. I would reopen only after repeated target-workload evidence passes explicit safety and cost gates.
      distractors:
      - text: I would generalise it because shareable values prove the boundary is safe. Each controller can freeze a snapshot, wrap its database calls, and let callbacks stay on the owner side; the same capsule can absorb warm-up later. One passing run is enough to start the migration, while dependency exceptions can be fixed as they appear.
        why_wrong: One value-level run does not establish Rails state, gem, workload, warm-up, or cost safety for every controller.
      - text: I would keep the PIVOT permanently because Rails controllers always carry mutable state. No isolated read path or dependency audit could justify another capsule, so I would reject workload measurements and use ordinary Rails concurrency even when a controller has frozen inputs and a bounded cost budget.
        why_wrong: It turns conditional research evidence into a universal prohibition and ignores a narrower workload-specific experiment.

- id: rails_experience-12-activerecord-optimizer-validation
  version: 1.6.0
  target: rails_experience
  topic: Active Record Optimizer evidence pipeline
  difficulty: 3
  interview_stage: architecture_review
  prompt: How would you explain an Active Record performance investigation without pretending that a static finding proves a query is slow?
  context: The interviewer wants a clear boundary between source discovery, observed SQL events, EXPLAIN-oriented material, data handling, and a claim about real workload performance.
  best_answer: >-
    The source scanner uses Prism to find query-shaped candidates, while the collector observes sql.active_record events and can literalise binds for a versioned EXPLAIN-oriented snapshot. That separates where to inspect from what the application emitted. I would treat the snapshot as diagnostic evidence only: it assumes the sample matches the workload and does not prove a slow plan, representative impact, automatic fixes, adoption, current execution, or results. Redacting and access-controlling the snapshot reduces exposure, though it may remove detail needed for reproduction; I would retain the least sensitive form that answers the query-shape question.
  response_versions:
    short: >-
      Prism can find query-shaped code, while sql.active_record observations provide runtime material for an EXPLAIN-oriented snapshot. I would use both, but call the result diagnostic only. The sample may not represent the workload, and the cited code does not prove a slow plan, impact, adoption, or current execution. Binds should be redacted.
    medium: >-
      The source scanner uses Prism to find query-shaped candidates, while the collector observes sql.active_record events and can literalise binds for a versioned EXPLAIN-oriented snapshot. That separates where to inspect from what the application emitted. I would treat the snapshot as diagnostic evidence only: it assumes the sample matches the workload and does not prove a slow plan, representative impact, automatic fixes, adoption, current execution, or results. Redacting and access-controlling the snapshot reduces exposure, though it may remove detail needed for reproduction; I would retain the least sensitive form that answers the query-shape question.
    deep: >-
      I would use the two stages for different questions. A Prism scan identifies query-shaped candidates, but it cannot tell me which plan the database used. The collector listens to sql.active_record and can literalise binds into a versioned snapshot for EXPLAIN-oriented review. That narrows the investigation rather than proving a bottleneck. The crucial assumption is that the captured predicates and workload resemble the question under review. I would compare a redacted short-lived snapshot with a richer raw form: the latter may reproduce more cases, but increases sensitive-data exposure. The cited portfolio does not establish performance, automatic fixes, adoption, current execution, or impact, so I would require a measured plan comparison and an explicit retention policy before drawing a stronger conclusion.
  distractors:
  - text: >-
      A Prism match is already a database diagnosis because the code shape predicts the
      planner's decision. I would rewrite every candidate immediately, omit runtime
      collection, and describe the versioned report as proof that the optimisation
      improved the workload. Bind values are incidental once the SQL text is visible,
      and a single source pattern should be enough to choose an index, remove a join,
      and close the investigation. The same automatic rewrite can cover every
      deployment because the planner sees the same Rails expression.
    trap: precision
    why_wrong: >-
      It confuses static discovery with observed plan behaviour and invents a measured
      remediation outcome while dismissing bind-value handling.
  - text: >-
      I would subscribe to every sql.active_record event indefinitely and preserve
      literalised binds exactly as captured. Full retention makes any future EXPLAIN
      reproducible, so access control and redaction can wait until the investigation
      is complete and the team has chosen an index. I would give the raw archive to
      every database reviewer, because broader visibility makes rare predicates easier
      to find and avoids the uncertainty introduced by sampling, masking, or expiry.
    trap: pragmatics
    why_wrong: >-
      It treats collection cost and sensitive values as secondary, although retention
      and access rules are part of a safe evidence pipeline.
  sources:
  - repo: backend-challenges
    path: active_record_optimizer/lib/active_record_optimizer/source_scanner.rb
    note: Committed Prism-based source candidate discovery.
  - repo: backend-challenges
    path: active_record_optimizer/test/source_scanner_test.rb
    note: Committed source scanner behaviour tests.
  - repo: backend-challenges
    path: active_record_optimizer/lib/active_record_optimizer/query_collector.rb
    note: Committed runtime SQL observation and snapshot collection.
  - repo: backend-challenges
    path: active_record_optimizer/test/query_collector_test.rb
    note: Committed collector behaviour tests.
  provenance:
    evidence_class: portfolio_code
    project: Active Record Optimizer
    repository: backend-challenges
    files:
    - path: active_record_optimizer/lib/active_record_optimizer/source_scanner.rb
      commit: b8686080f026e2eed3a38e93c44091a46ab9fb39
      claim: The committed scanner uses Prism to identify source-level query candidates, which is discovery evidence rather than proof of a database plan.
    - path: active_record_optimizer/test/source_scanner_test.rb
      commit: b8686080f026e2eed3a38e93c44091a46ab9fb39
      claim: The committed tests specify source-scanner behaviour at the cited revision without establishing current execution or workload performance.
    - path: active_record_optimizer/lib/active_record_optimizer/query_collector.rb
      commit: b8686080f026e2eed3a38e93c44091a46ab9fb39
      claim: The committed collector subscribes to sql.active_record, aggregates observations, and supports optional bind literalisation for versioned EXPLAIN-oriented material.
    - path: active_record_optimizer/test/query_collector_test.rb
      commit: b8686080f026e2eed3a38e93c44091a46ab9fb39
      claim: The committed tests specify query-collection behaviour at the cited revision without establishing adoption, impact, or a representative workload.
    verified_claims:
    - The cited portfolio separates Prism source candidates from observed sql.active_record collection and EXPLAIN-oriented snapshot evidence.
    - Optional bind literalisation creates a reproducibility and data-exposure trade-off; the cited code does not prove a slow plan or measured optimisation.
    confirmation_required:
    - Confirm authorship, operation scope, external users, adoption, current test execution, representative workload, plan results, and retention, redaction, and access policy for collected binds.
    safe_interview_version: This portfolio code separates static query candidates from observed sql.active_record evidence and supports optional bind literalisation for an EXPLAIN-oriented snapshot; confirm execution, adoption, workload, plan results, authorship, and data-handling policy before making personal or performance claims.
    confidentiality:
      level: high
      note: Never expose collected SQL, literalised bind values, snapshots, schema names, identifiers, connection details, or unredacted EXPLAIN output.
  feedback:
    register: Present the pipeline as investigation support with a deliberate evidence boundary, not as an automatic optimisation product.
    hedging: Keep candidate discovery, observed events, plan analysis, and personal delivery claims in separate certainty categories.
    precision: Name Prism, sql.active_record, optional bind literalisation, versioned snapshots, and the difference between EXPLAIN input and a proven bottleneck.
    grammar: Use can identify for static candidates and can collect for runtime events; reserve proves for evidence the cited revision actually contains.
    pragmatics: Address bind exposure and collection overhead before proposing a richer snapshot, because diagnostic convenience has a data-handling cost.
  rephrase:
    prompt: Reframe the investigation for a database engineer who asks why an EXPLAIN snapshot needs a version and a bind-value handling policy.
    goal: Translate Rails instrumentation into reproducibility, privacy, and decision-quality language without claiming a measured improvement.
  follow_up:
    prompt: The snapshot includes literalised bind values and a reviewer asks to retain it indefinitely. What would you retain, redact, and expire?
    goal: Make the evidence-retention decision concrete without losing the distinction between query shape and sensitive values.
    challenge_kind: alternative
    best_answer: >-
      I would retain the normalized query shape, collector metadata, a versioned
      snapshot identifier, and only the minimum redacted bind representation needed
      to reproduce the question. I would restrict access, set an expiry, and delete
      raw values unless a documented investigation requires them. If EXPLAIN needs
      representative predicates, I would use controlled fixtures or masked values
      rather than treating the first captured snapshot as a permanent record. The
      scanner remains a candidate source; the snapshot still does not prove impact.
    distractors:
    - text: >-
        I would keep the literalised snapshot forever because exact values are the
        most reliable way to reproduce an EXPLAIN. Anyone investigating the query
        should receive the same raw artifact, and retention can be reconsidered after
        the database change has shipped. I would prefer a complete archive over
        masking or sampling, allow the review team to copy it into ordinary tickets,
        and rely on the query text to reveal whether an identifier is sensitive. That
        keeps every predicate available for later plan comparisons.
      why_wrong: >-
        It maximises exposure and retention without a purpose limitation, access
        boundary, or plan for sensitive bind values.
    - text: >-
        I would discard the snapshot as soon as a query candidate is found and rely
        on the source scanner alone. Static code contains enough information to choose
        an index, so runtime predicates and collection policy need not affect the
        investigation. The database engineer can infer selectivity from the method
        chain, generate a generic EXPLAIN with placeholders, and approve the change
        without retaining an emitted statement. If the plan differs later, the source
        pattern remains the only evidence needed to repeat the same optimization.
      why_wrong: >-
        It removes the observed evidence needed to connect source shape with actual
        emitted statements and workload predicates.
    answer_anchors:
    - Keep normalized query shape and minimal redacted bind context.
    - Restrict and expire literalised snapshots unless diagnostic need remains documented.
    - Treat Prism candidates as discovery, not evidence of a slow plan.
  compression:
    prompt: Contrast what the Prism scan finds with what the runtime collector can support for EXPLAIN review, using two sentences.
    goal: Preserve candidate discovery, observed evidence, and the bind-handling caveat in a compact technical answer.
  language_focus:
  - precision
  - hedging
  - pragmatics
  feynman:
    concept: Static discovery points to code worth inspecting; runtime collection records what SQL the application actually emitted.
    explain_to: A teammate who wants to call every AST candidate a confirmed slow query.
    constraint: Explain bind literalisation without exposing values or claiming that a plan or workload has already been measured.
    self_check: Did you separate source candidate, observed event, EXPLAIN input, representative workload, and data risk?
    reasoning_check: Can you give a static false positive and state which runtime observation would change the investigation priority?
  black_box:
    symptom: A source match is labelled a slow query and literal bind values are published without a retention boundary.
    expected: Candidate discovery, observed SQL evidence, versioned EXPLAIN-oriented material, and explicit collection and privacy controls.
    actual: An automatic optimisation verdict based on static code and unrestricted runtime capture.
    root_cause: Discovery, observation, analysis, and remediation were collapsed into one unsupported conclusion.
    repair: Classify the evidence, scope collection, protect binds, and compare a reviewed snapshot against the relevant plan question.
    reasoning_error: If the optimizer answer failed, classify whether the mistake was a fact, assumption, comparison, failure, or certainty error before choosing the smallest repair.
  recall:
    active_recall_cue: What can a Prism candidate suggest that it cannot prove about a query plan?
    feynman_prompt: Explain why versioned EXPLAIN input is not the same as a workload verdict.
    black_box_probe: Did you name both collection overhead and the exposure risk of literalised values?
    leitner_start_box: 1
    mastery_threshold: 8
    delayed_variant:
      id: rails_experience-12-activerecord-optimizer-validation-delayed-12
      prompt: A privacy review finds a personal identifier in a literalised snapshot, while the database engineer still needs representative predicates for EXPLAIN. How should the evidence pipeline change?
      changed_constraint: representative predicates are needed without retaining an identifying bind value
      new_evidence: the review finds an identifying value in one literalised snapshot
      best_answer: >-
        I would preserve the query shape and replace the identifying bind with a
        masked or controlled fixture value whose selectivity is documented. I would
        restrict the snapshot, set an expiry, and record that the resulting EXPLAIN
        input is representative only for the stated predicate assumption. The privacy
        finding changes retention and redaction; it does not turn the static candidate
        into proof of a slow plan.
      distractors:
      - text: >-
          I would publish the raw value to preserve exact reproducibility, because a
          privacy review should not change a database investigation once the snapshot
          has been captured. The reviewer can place the artifact in the shared
          diagnostics folder, copy it into the EXPLAIN discussion, and remove access
          restrictions after the index decision is made. A short retention period is
          unnecessary when the exact predicate is the strongest evidence for choosing
          between two plans.
        why_wrong: >-
          It lets a sensitive value override the new handling constraint and provides
          no access or retention control.
      - text: >-
          I would delete all runtime evidence and let Prism select an index from the
          source pattern. That avoids privacy work and keeps the investigation
          deterministic, because the AST already shows the relation and filter. I
          would use a generic fixture only after the index is chosen, and any mismatch
          between that fixture's plan and a real predicate can be handled by the next
          source scan rather than by preserving collected events.
        why_wrong: >-
          It removes the evidence needed for a meaningful EXPLAIN-oriented question
          instead of redacting the risky field.
      answer_anchors:
      - Mask identifying binds while preserving query shape and stated selectivity.
      - Use controlled fixtures for representative EXPLAIN predicates.
      - Keep privacy findings separate from proof of query-plan impact.
      reasoning_moves:
        preserve: Preserve query shape while removing identifying bind values from retained snapshots.
        revise: Revise retention and redaction when a literalised snapshot exposes personal data.
        verify: Compare a controlled predicate against observed SQL and reviewed EXPLAIN input.
        certainty_update: Raise investigation confidence only when runtime evidence matches the stated workload question.
  extension:
    prompt: 'Take the optimizer pipeline deeper: when would a source candidate, a collected event, and an EXPLAIN snapshot justify different next actions?'
    goal: Connect evidence class, retention policy, comparison, failure mode, and the next verification step without inventing a performance result.
  critical_thinking:
    problem_frame: Frame the optimizer investigation around the engineer asking the question, the query behaviour to understand, the data-handling constraint, and the missing evidence that could overturn the first hypothesis.
    claim_map:
      fact: The cited revision contains a Prism source scanner, a sql.active_record collector, collector tests, and optional bind literalisation for versioned snapshot material.
      inference: The pipeline can separate candidate discovery from observed query evidence and make a more reproducible EXPLAIN question.
      assumption: The captured statement and predicates represent the workload or hypothesis that the reviewer actually needs to test.
      unknown: Query-plan quality, representative workload coverage, adoption, current execution, performance effect, and bind-retention policy remain unknown here.
    comparison:
      applicable: true
      alternatives:
      - option: Use a bounded, redacted runtime snapshot with sampled sql.active_record observations.
        benefit: It limits collection cost and data exposure while retaining enough shape and predicate context for a focused review.
        cost_or_risk: Sampling can miss a rare query shape or weaken reproduction when the selected sample is not representative.
        valid_when: Use it when the investigation has a narrow question and controlled fixtures can cover missing predicate cases.
      - option: Keep a richer literalised snapshot for a restricted, short-lived diagnostic window.
        benefit: It preserves more predicate detail for a difficult EXPLAIN comparison and can reduce ambiguity during a focused investigation.
        cost_or_risk: It increases sensitive-data exposure, access burden, and collection overhead, and it still does not prove impact.
        valid_when: Use it only with explicit access, masking, expiry, and a documented reason that redaction would block the question.
      decision_rule: Start with the bounded redacted path; permit richer capture only when the diagnostic question requires it and its data controls are explicit.
    failure_probe:
      kind: failure_mode
      prompt: A Prism finding has no matching runtime event in the captured window. What hypothesis failed first, and what bounded check would you run next?
    evidence_check:
      basis: Check the candidate and observation claims against active_record_optimizer/lib/active_record_optimizer/source_scanner.rb, query_collector.rb, and their tests at commit b8686080f026e2eed3a38e93c44091a46ab9fb39, then classify plan and workload claims separately.
      source_kind: primary_code
      limitation: These committed files establish an evidence pipeline, not a slow query, representative workload, automatic fix, current execution, adoption, or performance result.
      checked_on: '2026-08-25'
    certainty:
      level: low
      rationale: Certainty is low because the cited code shows how evidence can be collected, while plan quality, workload representativeness, retention, and impact remain unverified.
      update_trigger: Update the investigation priority only when a bounded runtime sample and reviewed EXPLAIN input answer the stated query question; do not promote a static candidate from a code match alone.
    rubric:
      facts_correct: Names Prism discovery, sql.active_record collection, optional literalisation, and EXPLAIN-oriented snapshots without claiming a measured bottleneck.
      assumptions_explicit: States the representativeness and data-retention assumptions behind the selected snapshot.
      alternatives_considered: Compares bounded redacted sampling with richer short-lived capture using concrete validity and risk conditions.
      tradeoff_quality: Connects reproducibility and predicate detail against collection cost and bind exposure.
      follow_up_adaptation: Changes retention or sampling when a privacy or coverage observation changes the investigation constraint.
      certainty_calibration: Keeps low certainty until observed evidence and an appropriate plan comparison answer the actual question.
    defense_checks:
    - id: rails_experience-12-activerecord-optimizer-validation-defense-evidence
      axis: facts
      prompt: A Prism scan flags an Active Record query, and the team wants to call it a bottleneck. Which evidence boundary would you defend before changing the query?
      best_answer: >-
        I would keep the Prism match as a candidate, then verify an observed sql.active_record event, a reviewed and versioned EXPLAIN input, and a workload predicate that represents the question. Without those observations, I would not infer slowness, impact, or an index fix; I would also redact binds and keep retention bounded.
      distractors:
      - text: I would call the query a bottleneck because Prism found the relation and filter. The AST is enough to choose an index, a generic EXPLAIN with placeholders can stand in for emitted SQL, and any bind can be retained indefinitely for exact reproduction. Once the source pattern is clear, a workload trace or observed event only adds delay.
        why_wrong: Static discovery does not prove a slow plan, emitted predicates, or the data-handling policy needed for a useful comparison.
      - text: I would refuse to discuss the candidate until an exhaustive benchmark covers every endpoint and parameter combination. One observed event or a bounded EXPLAIN snapshot is too narrow to guide even a provisional investigation, so I would avoid masked fixtures and retention limits until the complete workload has been measured.
        why_wrong: It rejects focused runtime and EXPLAIN evidence and demands exhaustive measurement before a bounded investigation can begin.

- id: rails_experience-13-supportnest-deterministic-routing-experiments
  version: 1.6.0
  target: rails_experience
  topic: SupportNest deterministic ticket routing
  difficulty: 3
  interview_stage: deep_dive
  prompt: How would you describe a routing experiment that stays deterministic for each tenant yet fails safely when its configuration is incomplete?
  context: The interviewer wants the boundary between a stable routing decision, a configured policy, the no-candidate fallback, and the caller that owns ticket persistence and evidence.
  best_answer: >-
    The cited AutoRouter resolves a tenant-scoped experiment or policy into a deterministic decision, and its fallback can return an unassigned no-eligible-agent result. The ADR discusses audit and outbox concerns, but the router need not own ticket persistence. I would verify that the caller records the decision and can treat unassigned as a valid product state. Default assignment preserves continuity but may hide misconfiguration; reject or queue exposes it but can block intake. This code supports a routing boundary, not a fairness, rollout, or observed-outcome claim.
  response_versions:
    short: >-
      AutoRouter makes a deterministic tenant-scoped decision and can return an unassigned result. The ADR discusses audit and outbox concerns, but the caller owns persistence. I would keep routing separate and verify that callers record an unassigned decision. This portfolio code does not prove fairness, rollout, or an observed result.
    medium: >-
      The cited AutoRouter resolves a tenant-scoped experiment or policy into a deterministic decision, and its fallback can return an unassigned no-eligible-agent result. The ADR discusses audit and outbox concerns, but the router need not own ticket persistence. I would verify that the caller records the decision and can treat unassigned as a valid product state. Default assignment preserves continuity but may hide misconfiguration; reject or queue exposes it but can block intake. This code supports a routing boundary, not a fairness, rollout, or observed-outcome claim.
    deep: >-
      I would separate the routing choice from the workflow that consumes it. The AutoRouter selects a policy and candidate within tenant scope, and its no-candidate path returns a decision instead of inventing an assignee. The ADR discusses audit and outbox treatment, but those concerns are not automatically properties of the service method. The important assumption is that the caller can persist an unassigned ticket and its routing reason. A default assignment preserves continuity but can conceal bad configuration; rejecting or queueing makes the problem visible but may block intake. I would test the caller transaction and evidence records, then choose according to the product contract. The cited implementation establishes a deterministic decision boundary, not fairness, rollout, or an observed result.
  distractors:
  - text: >-
      I would rotate agents randomly whenever an experiment is present, because
        randomness is a fairer experiment than a repeatable tenant-scoped assignment. If the
      candidate list is empty, I would stop ticket creation until an operator repairs
      the configuration, and I would treat the ADR's audit and outbox language as
      proof that every blocked request is already recorded. The caller can therefore
      omit a routing reason and rely on the policy service to reconstruct the
      assignment later, while a single global queue handles all incomplete cases.
    trap: precision
    why_wrong: >-
      It replaces the deterministic policy with random allocation, blocks intake
      without a stated contract, and mistakes ADR intent for caller behaviour.
  - text: >-
      A stable route is already evidence of fairness, so I would apply the same
      default assignee to every incomplete experiment. An unassigned result is an
      implementation failure that the service should hide, and the presence of a
      routing test proves that ticket creation, audit, and outbox delivery are all
      complete. The caller need not preserve the no-candidate reason because a
      successful assignment is the only state that matters, and the ADR can stand in
      for any missing integration evidence.
    trap: hedging
    why_wrong: >-
      It confuses repeatability with fairness and claims persistence and evidence
      behaviour that the AutoRouter method alone does not establish.
  sources:
  - repo: backend-challenges
    path: supportnest-rails-saas/README.md
    note: Committed SupportNest application boundary and portfolio scope.
  - repo: backend-challenges
    path: supportnest-rails-saas/docs/adr/008-deterministic-experiments-for-ticket-routing.md
    note: Committed deterministic-routing and audit/outbox rationale.
  - repo: backend-challenges
    path: supportnest-rails-saas/app/services/tickets/auto_router.rb
    note: Committed routing-decision and fallback implementation.
  - repo: backend-challenges
    path: supportnest-rails-saas/test/services/tickets_auto_router_test.rb
    note: Committed routing and caller-flow tests.
  provenance:
    evidence_class: portfolio_code
    project: SupportNest
    repository: backend-challenges
    files:
    - path: supportnest-rails-saas/README.md
      commit: b53a47e94e1c6983cda5f4f437e36260232d617f
      claim: The committed README describes SupportNest as inspectable portfolio application material.
    - path: supportnest-rails-saas/docs/adr/008-deterministic-experiments-for-ticket-routing.md
      commit: b53a47e94e1c6983cda5f4f437e36260232d617f
      claim: The committed ADR documents tenant-scoped deterministic experiments, routing policies, and audit and outbox considerations.
    - path: supportnest-rails-saas/app/services/tickets/auto_router.rb
      commit: b53a47e94e1c6983cda5f4f437e36260232d617f
      claim: The committed AutoRouter returns a deterministic routing decision and explicit fallback reasons when configuration or candidate selection is incomplete.
    - path: supportnest-rails-saas/test/services/tickets_auto_router_test.rb
      commit: b53a47e94e1c6983cda5f4f437e36260232d617f
      claim: The committed tests specify routing, no-eligible-agent, and caller-flow behaviour at the cited revision without proving current execution.
    verified_claims:
    - The cited portfolio code records deterministic tenant-scoped routing decisions and an explicit no-candidate fallback.
    - The ADR discusses audit and outbox treatment, while the AutoRouter method itself returns a decision and does not by itself prove every caller persists or audits it.
    confirmation_required:
    - Confirm current test execution, authorship, operation scope, external users, recorded outcomes, fairness criteria, caller coverage, and retention policy for routing evidence.
    safe_interview_version: This portfolio study documents deterministic tenant-scoped ticket routing with an explicit no-candidate boundary; distinguish the AutoRouter decision from caller persistence and audit, and confirm execution, delivery scope, outcomes, fairness criteria, and authorship before making personal claims.
    confidentiality:
      level: medium
      note: Do not disclose tenant identifiers, routing policy values, agent schedules, skill assignments, retention data, or unredacted ticket content.
  feedback:
    register: Describe AutoRouter as a bounded decision service and keep caller-owned persistence and evidence outside the claim.
    hedging: Mark deterministic assignment and fallback as code facts, while treating audit, outbox, fairness, and outcomes as separate evidence questions.
    precision: Use no-eligible-agent for the concrete fallback and name the caller boundary instead of calling every fallback a default policy.
    grammar: Contrast a stable routing rule with an incomplete experiment in one conditional sentence so the failure state stays clear.
    pragmatics: Acknowledge that continuity and configuration visibility can pull in opposite directions before choosing a caller policy.
  rephrase:
    prompt: Explain the boundary to a support lead who asks whether an incomplete routing experiment can prevent an issue from becoming a ticket.
    goal: Translate the decision and fallback into continuity, ownership, and evidence language without promising a caller behaviour the service does not prove.
  follow_up:
    prompt: AutoRouter returns no-eligible-agent during ticket creation. Should the caller create an unassigned ticket, reject it, or enqueue repair, and what audit or outbox evidence must accompany that choice?
    goal: Make the caller boundary explicit when routing produces a valid but incomplete decision.
    challenge_kind: failure
    best_answer: >-
      I would create an unassigned ticket if the product contract permits intake
      without an assignee, persist the routing reason, and let the caller's
      transaction write its audit and outbox evidence. A repair job can revisit
      assignment without changing the original decision. If an assignee is a hard
      invariant, rejection is safer, but that is a product rule rather than a fact
      of AutoRouter. I would test both the transaction boundary and the evidence
      records because the service result alone does not prove either one.
    distractors:
    - text: >-
        I would replace no-eligible-agent with the busiest available agent so the
        caller can always complete. The fallback should remain invisible to users,
        and the ADR already supplies enough assurance that audit and outbox records
        will follow the substituted assignment. If the tenant has no candidate, I
        would search a global support pool, attach the first available member, and
        write a normal assigned event. A later audit can reconstruct the decision
        from the experiment, so the original fallback reason need not enter the
        ticket record.
      why_wrong: >-
        It invents an assignee outside the evidenced decision and assumes the caller
        records evidence without testing that boundary.
    - text: >-
        I would raise an exception for every unassigned result and discard the ticket
        until the experiment has a candidate. That makes the routing invariant simple,
        and no separate audit or repair path is needed because rejected intake is the
        safest possible outcome. The requester can submit the issue again after an
        operator edits the experiment, while the failed attempt remains outside the
        ticket ledger. Since no assignment was made, there is no durable routing
        evidence or outbox event worth preserving.
      why_wrong: >-
        It imposes a blocking product policy without checking whether continuity is
        required and removes the recovery evidence the challenge asks you to design.
    answer_anchors:
    - Keep assignment deterministic within the tenant-scoped experiment.
    - Let the caller persist unassigned state, routing reason, audit, and outbox evidence.
    - Treat fairness and caller coverage as unproven until measured.
  compression:
    prompt: Explain in two sentences how AutoRouter's deterministic decision differs from the caller's responsibility for ticket creation, audit, and outbox evidence.
    goal: Preserve the no-candidate boundary and the code-versus-ADR distinction under interview time pressure.
  language_focus:
  - precision
  - pragmatics
  - hedging
  feynman:
    concept: A deterministic router chooses a repeatable decision, while the caller decides how that decision becomes durable ticket workflow state.
    explain_to: A teammate who assumes that a stable assignment automatically proves fairness and audit completeness.
    constraint: Explain no-eligible-agent without claiming that the AutoRouter method itself creates, audits, or publishes a ticket.
    self_check: Did you separate tenant-scoped assignment, fallback reason, caller persistence, and fairness evidence?
    reasoning_check: Can you give a caller failure after a routing decision and identify which record or invariant would reveal it?
  black_box:
    symptom: A repeatable route is called fair, and a no-candidate decision is treated as proof that ticket creation and audit cannot fail.
    expected: Tenant-scoped determinism, explicit fallback, caller-owned persistence, and a clear audit or outbox evidence boundary.
    actual: Random or blocking assignment paired with an unsupported claim that the ADR guarantees runtime behaviour.
    root_cause: Repeatability, product continuity, and documented architecture were collapsed into one service guarantee.
    repair: Keep the decision small, specify the caller contract for unassigned work, and test its transaction and evidence paths.
    reasoning_error: If the routing answer failed, classify whether the mistake was a fact, assumption, comparison, failure, or certainty error before choosing the smallest repair.
  recall:
    active_recall_cue: What does AutoRouter return when no eligible support member can be selected?
    feynman_prompt: Explain why deterministic tenant routing does not establish fairness.
    black_box_probe: Did you name the caller boundary for ticket creation and audit or outbox evidence?
    leitner_start_box: 1
    mastery_threshold: 8
    delayed_variant:
      id: rails_experience-13-supportnest-deterministic-routing-experiments-delayed-13
      prompt: A fairness review finds that two agents never receive work under the deterministic score, while the product now requires a stable tenant-scoped subject assignment derived from the e-mail within its tenant-scoped experiment and a visible recovery path. What changes in your routing decision?
      changed_constraint: a stable tenant-scoped subject assignment derived within the experiment must coexist with a fairness signal and a visible recovery path
      new_evidence: a review finds a persistent assignment imbalance for two agents under the current score
      best_answer: >-
        The new review does not invalidate a stable tenant-scoped subject key derived
        from the e-mail within the tenant-scoped experiment, but it weakens any
        fairness inference. I would preserve that assignment input, add an explicit
        fairness or starvation measure, and decide whether to change the score or
        expose a recovery queue based on the product threshold. The caller still owns
        persistence and audit. I would not call the revised policy fair until the
        chosen measure and a representative test support that claim.
      distractors:
      - text: >-
          I would randomize every assignment immediately because one fairness signal
          is enough to discard the tenant-scoped subject assignment derived from the
          e-mail and its repeatability. The experiment can ignore the tenant boundary
          for the next review, distribute work uniformly across every agent, and
          replace the existing score before measuring the recovery queue. A random
          result would then stand as the fairness baseline for future routing policy.
        why_wrong: >-
          It removes a stated stability constraint before comparing a deterministic
          scoring change with a bounded recovery path.
      - text: >-
          I would keep the current policy and call the imbalance irrelevant because
          deterministic output is the only fairness definition that matters for
          support routing. The same e-mail-derived assignment should remain untouched,
          even if two agents receive no work, because the tenant-scoped experiment
          already supplies an objective result. I would report stability as fairness
          and postpone any recovery path until the score itself changes.
        why_wrong: >-
          It ignores the new product constraint and treats repeatability as proof of
          equitable allocation.
      answer_anchors:
      - Preserve the tenant-scoped subject key while measuring assignment imbalance.
      - Add a fairness or starvation measure before calling deterministic output fair.
      - Keep ticket persistence and audit with the caller, not AutoRouter.
      reasoning_moves:
        preserve: Preserve tenant-scoped subject identity while retaining the explicit no-candidate fallback.
        revise: Revise the score or recovery queue when a defined fairness threshold is crossed.
        verify: Trace caller persistence, audit/outbox records, and representative assignment outcomes.
        certainty_update: Raise fairness confidence only after the measure and caller evidence agree.
  extension:
    prompt: 'Defend a no-candidate routing policy under a changed product contract: which caller action, failure signal, and evidence record keep continuity honest?'
    goal: Move from the routing decision to a concrete caller-level design without claiming that the AutoRouter owns persistence or fairness.
  critical_thinking:
    problem_frame: Frame the routing choice around the tenant, the required ticket-intake outcome, the candidate and configuration constraints, and the caller evidence still missing.
    claim_map:
      fact: The cited AutoRouter returns deterministic decisions with explicit fallback reasons, and the ADR records routing and audit/outbox design considerations.
      inference: Keeping routing as a decision service makes its deterministic contract easier to test independently from ticket persistence.
      assumption: The caller's product contract permits an unassigned ticket or provides a deliberate rejection and repair path when no candidate exists.
      unknown: Current execution, caller coverage, fairness outcomes, external users, retention, and whether every ticket path records audit or outbox evidence remain unknown.
    comparison:
      applicable: true
      alternatives:
      - option: Persist an unassigned ticket with the routing reason, audit event, and repair signal in the caller boundary.
        benefit: It preserves intake continuity while making configuration failure visible and recoverable.
        cost_or_risk: It creates a queue of unresolved work and requires a clear SLA and monitoring policy for repair.
        valid_when: Use it when the product permits unassigned intake and can reconcile the ticket before service-level harm.
      - option: Reject or hold ticket creation until a valid candidate exists, with a separate repair workflow.
        benefit: It protects an assignee-required invariant and prevents unresolved work from entering the active queue.
        cost_or_risk: It can block customer intake and needs explicit feedback and durable evidence for the rejected request.
        valid_when: Use it when assignment is a hard contract and the caller can provide a safe retry or escalation path.
      decision_rule: Let the product invariant choose; preserve continuity with visible unassigned state when possible, otherwise reject or hold with explicit repair evidence.
    failure_probe:
      kind: failure_mode
      prompt: The caller receives a deterministic routing decision but fails before ticket persistence. Which invariant is missing, and how would a focused test expose the loss?
    evidence_check:
      basis: Check deterministic assignment and fallback against supportnest-rails-saas/app/services/tickets/auto_router.rb and tickets_auto_router_test.rb, plus the ADR at commit b53a47e94e1c6983cda5f4f437e36260232d617f; keep caller claims separate from service facts.
      source_kind: primary_code
      limitation: The cited revision supports routing decisions and documented boundaries; it does not by itself prove fairness, rollout, external users, current execution, or every caller's audit and outbox behaviour.
      checked_on: '2026-08-25'
    certainty:
      level: low
      rationale: Certainty is low because deterministic code and tests bound the decision, while fairness, caller coverage, retention, and observed outcomes require separate evidence.
      update_trigger: Update the policy when a representative caller test or fairness measure changes the product invariant; do not infer audit completeness or equitable allocation from deterministic output alone.
    rubric:
      facts_correct: Names the deterministic decision, explicit no-candidate reason, and ADR boundary without claiming that the service owns ticket persistence or fairness.
      assumptions_explicit: States the product rule for unassigned intake and the caller's responsibility for evidence and repair.
      alternatives_considered: Compares visible unassigned intake with reject-or-hold handling using concrete validity and failure conditions.
      tradeoff_quality: Connects continuity and recoverability against assignee invariants, queue burden, and caller complexity.
      follow_up_adaptation: Changes the policy or measurement when a fairness signal or caller failure changes the stated constraint.
      certainty_calibration: Keeps low certainty until caller tests, retention evidence, and a defined fairness measure answer the open questions.
    defense_checks:
    - id: rails_experience-13-supportnest-deterministic-routing-experiments-defense-boundary
      axis: assumptions
      prompt: A reviewer says deterministic tenant-scoped subject assignment proves SupportNest is fair and auditable. What premise would you challenge, and which caller evidence is still required?
      best_answer: >-
        Determinism proves repeatability within a tenant-scoped experiment, not fair allocation or audit completeness. I would challenge the assumption that AutoRouter owns the whole workflow; inspect the caller's persistence transaction, fallback reason, audit/outbox records, and a defined fairness or starvation measure. Until those traces and a representative test exist, I would keep the claim at deterministic routing.
      distractors:
      - text: I would accept the claim because the same subject always maps to the same agent, so repeatability is the fairness measure. AutoRouter can write the ticket and audit event after choosing the agent; if no candidate exists, it should search a global pool and attach someone so the caller never needs an unassigned state.
        why_wrong: Repeatability is not an equity measure, and the service does not prove caller persistence or permission to cross the tenant boundary.
      - text: I would reject deterministic routing entirely and assign tickets round-robin across all agents. A global sequence gives a simple fairness proof, so caller audit and outbox can be added later and any tenant-scoped experiment can be removed without measuring starvation.
        why_wrong: It discards the tenant-scoped stability constraint and postpones the caller evidence that makes fairness and recovery testable.

- id: rails_experience-14-fiscalbridge-provider-boundary
  version: 1.6.0
  target: rails_experience
  topic: FiscalBridge provider boundary
  difficulty: 3
  interview_stage: architecture_review
  prompt: How would you keep fiscal workflow rules stable when each provider has different issue, cancellation, status, and document behaviour?
  context: The interviewer is testing the separation between domain-owned reliability rules, a normalized provider port, and a deterministic sandbox that cannot establish municipal issuance or compliance.
  best_answer: >-
    The FiscalBridge ADR keeps state transitions, idempotency, locks, audit, and outbox intent in the domain. The sandbox client exposes issue, cancel, status, and document operations with structured results and digest metadata, and the adapter test checks that port surface. I would use that boundary to keep provider protocols out of workflow rules, while requiring callers to persist results and reconcile ambiguous outcomes by domain identity. The cited revision does not establish municipal issuance, certificates, compliance, or a live integration. A shared port costs translation and reconciliation work but avoids provider-specific branches in the domain.
  response_versions:
    short: >-
      The ADR keeps state, idempotency, locks, audit, and outbox intent in the domain. The sandbox adapter exposes issue, cancel, status, and document operations with structured results. That limits provider coupling, but callers still need to reconcile ambiguous results. The cited work is a portfolio study, not evidence of municipal issuance, compliance, or a live integration.
    medium: >-
      The FiscalBridge ADR keeps state transitions, idempotency, locks, audit, and outbox intent in the domain. The sandbox client exposes issue, cancel, status, and document operations with structured results and digest metadata, and the adapter test checks that port surface. I would use that boundary to keep provider protocols out of workflow rules, while requiring callers to persist results and reconcile ambiguous outcomes by domain identity. The cited revision does not establish municipal issuance, certificates, compliance, or a live integration. A shared port costs translation and reconciliation work but avoids provider-specific branches in the domain.
    deep: >-
      I would keep the fiscal domain authoritative for state transitions, idempotency keys, locks, audit evidence, and outbox intent, and let each adapter translate provider-specific issue, cancellation, status, and document terms. The ADR states that separation; the sandbox client and contract test show a local port surface with typed errors and digest metadata for generated artifacts. If a timeout follows an accepted request, the caller must preserve the domain identity and reconcile status before retrying. A shared port adds translation and reconciliation work, but embedding provider branches in domain workflows spreads protocol details and makes ambiguity harder to control. The cited revision establishes an architectural boundary, not a municipal connector, certificate, compliance, conformance, or live operational result. I would present those as questions requiring provider and domain evidence.
  distractors:
  - text: >-
      I would place idempotency, locks, and retry policy inside each provider client
      because municipalities differ. A timeout proves that issue failed, so a fresh
      request is safe, and the sandbox's deterministic response is enough to certify
      certificates, document emission, and every provider contract before any further
      domain work. Each adapter can own its invoice state and expose a single success
      boolean, while controllers retry whichever operation last returned an error and
      let later reconciliation clean up duplicate provider records.
    trap: precision
    why_wrong: >-
      It duplicates domain reliability rules, treats an ambiguous timeout as final,
      and upgrades a deterministic sandbox into unsupported external assurance.
  - text: >-
      I would expose one generic provider response for issue, cancel, status, and
      documents, then let controllers decide which fields matter. Typed errors and
      reconciliation add ceremony, while a passing adapter test proves that municipal
      behaviour is uniform and that real documents can be trusted without a separate
      domain record. A shared status string is enough for cancellation and retrieval,
      and the adapter can decide when a timeout is final so the domain stays small and
      every provider follows the same shortcut.
    trap: hedging
    why_wrong: >-
      It erases operation-specific semantics and turns a boundary contract into
      unsupported provider uniformity and document evidence.
  sources:
  - repo: backend-challenges
    path: fiscalbridge-rails-nfse-platform/README.md
    note: Committed FiscalBridge portfolio and sandbox scope.
  - repo: backend-challenges
    path: fiscalbridge-rails-nfse-platform/docs/adr/005-provider-ports-and-adapters.md
    note: Committed domain and provider-port decision record.
  - repo: backend-challenges
    path: fiscalbridge-rails-nfse-platform/app/services/providers/sandbox_nfse_client.rb
    note: Committed deterministic sandbox adapter.
  - repo: backend-challenges
    path: fiscalbridge-rails-nfse-platform/test/services/provider_adapter_contract_test.rb
    note: Committed provider-port contract tests.
  provenance:
    evidence_class: portfolio_code
    project: FiscalBridge
    repository: backend-challenges
    files:
    - path: fiscalbridge-rails-nfse-platform/README.md
      commit: d9b9ffd155c6b651d747a513720907d3464e34c6
      claim: The committed README presents FiscalBridge as inspectable portfolio material and identifies a sandbox provider boundary.
    - path: fiscalbridge-rails-nfse-platform/docs/adr/005-provider-ports-and-adapters.md
      commit: d9b9ffd155c6b651d747a513720907d3464e34c6
      claim: The committed ADR assigns state, idempotency, locks, audit, and outbox concerns to the domain and defines normalized provider operations and typed errors.
    - path: fiscalbridge-rails-nfse-platform/app/services/providers/sandbox_nfse_client.rb
      commit: d9b9ffd155c6b651d747a513720907d3464e34c6
      claim: The committed sandbox client implements deterministic issue, cancel, status, and document methods with result fields, error branches, and artifact digests.
    - path: fiscalbridge-rails-nfse-platform/test/services/provider_adapter_contract_test.rb
      commit: d9b9ffd155c6b651d747a513720907d3464e34c6
      claim: The committed adapter tests check the provider-port surface, sandbox status, document digests, and idempotency metadata without proving external issuance or compliance.
    verified_claims:
    - The cited portfolio separates domain-owned reliability concerns from normalized provider adapter operations.
    - The sandbox and adapter tests provide deterministic local contract evidence, not municipal connectivity, certificates, compliance, or operational results.
    confirmation_required:
    - Confirm current test execution, authorship, domain caller ownership, provider connectivity, certificate handling, compliance review, reconciliation policy, external users, and results.
    safe_interview_version: This FiscalBridge portfolio study shows a domain-owned reliability boundary with normalized provider operations, typed errors, and a deterministic sandbox; confirm callers, provider connectivity, certificates, compliance, reconciliation, execution, and authorship before making external-integration claims.
    confidentiality:
      level: high
      note: Do not expose fiscal identifiers, provider credentials, certificates, document payloads, endpoints, tax data, reconciliation records, or audit entries.
  feedback:
    register: Speak of a provider port and domain reliability contract, not a completed fiscal integration or a generic adapter success story.
    hedging: Treat the sandbox as deterministic study evidence and reserve municipal connectivity, certificates, compliance, and delivery history for confirmation.
    precision: Keep domain-owned idempotency and locks separate from adapter normalization for issue, cancellation, status, and documents.
    grammar: Use a conditional sequence from provider ambiguity to typed error, domain state, and reconciliation instead of chaining unsupported guarantees.
    pragmatics: Address fiscal risk by stating what the sandbox cannot assure before discussing how the boundary could evolve.
  rephrase:
    prompt: Explain to a finance stakeholder why a successful sandbox issue response does not mean that a real fiscal document was emitted.
    goal: Translate the provider-port boundary into assurance language without legal, compliance, or external-result claims.
  follow_up:
    prompt: A provider times out after accepting an issue request. How should typed errors, idempotency, and reconciliation determine the next safe action?
    goal: Handle an ambiguous provider outcome without treating a second issue request as automatically safe.
    challenge_kind: new_evidence
    best_answer: >-
      I would mark the local issue as pending reconciliation, preserve the original
      domain and provider idempotency identity, and use a status lookup or provider
      evidence path before issuing again. A typed timeout tells the caller how to
      classify the uncertainty; it does not prove rejection. If reconciliation shows
      no accepted request, retry with the same identity under the domain policy. This
      is the reliability design required by the ADR boundary, not proof that the
      current sandbox performs duplicate-safe external issuance.
    distractors:
    - text: >-
        I would treat the timeout as a definitive rejection and send a new issue
        request with a fresh key. A fresh attempt gives the provider a clean state,
        while any duplicate document can be cancelled later if the first request
        happened to arrive. I would update the local invoice to the newest response,
        let the adapter choose whether cancellation is available, and use a generic
        status poll only after the replacement has returned. The new key makes the
        retry traceable as a separate provider operation.
      why_wrong: >-
        It can duplicate an accepted remote request and discards the identity needed
        to reconcile the ambiguous outcome safely.
    - text: >-
        I would leave the invoice marked issued because the provider may have accepted
        it, then let the next status poll repair any missing fields. No typed error or
        explicit idempotency record is necessary when the adapter returns a timeout.
        The domain can trust the most optimistic state, and a later poll can replace
        the protocol and document fields if the provider reports rejection. If the
        poll also fails, the job can issue again from the current invoice without
        preserving the original request identity.
      why_wrong: >-
        It turns uncertainty into authoritative local state and removes the durable
        identity and error classification required for reconciliation.
    answer_anchors:
    - Keep the issue pending while the provider outcome is reconciled.
    - Preserve domain and provider idempotency identity across retries.
    - Treat sandbox responses as local contract evidence, not external issuance.
  compression:
    prompt: In two sentences, contrast what FiscalBridge's domain owns with what a provider adapter translates when an issue request is ambiguous.
    goal: Retain the idempotency, typed-error, and sandbox boundary under time pressure.
  language_focus:
  - precision
  - hedging
  - pragmatics
  feynman:
    concept: A provider port translates external protocol shapes, while the domain keeps the identity and state rules that make ambiguity recoverable.
    explain_to: A teammate who wants every provider client to own retries, locks, and persistence.
    constraint: Explain a timeout after issue without claiming a real document, municipal connection, certificate, or compliance result.
    self_check: Did you preserve the original identity, classify the timeout, and place reconciliation in the domain boundary?
    reasoning_check: Can you describe the failure caused by retrying with a fresh identity and the evidence that would make a retry safe?
  black_box:
    symptom: A timeout is treated as failed issuance and a new request is sent without preserving provider identity.
    expected: A typed uncertainty, durable domain state, stable idempotency key, and reconciliation before any new issuance action.
    actual: A duplicate-prone retry paired with a deterministic sandbox claim about external success.
    root_cause: Adapter response, domain state, and external effect were treated as the same authority.
    repair: Keep the local record pending, retain identity, classify the error, and reconcile provider evidence before retrying.
    reasoning_error: If the provider-boundary answer failed, classify whether the mistake was a fact, assumption, comparison, failure, or certainty error before choosing the smallest repair.
  recall:
    active_recall_cue: Which reliability concerns belong in the FiscalBridge domain rather than a provider adapter?
    feynman_prompt: Explain why a timeout after issue is not proof that issue failed.
    black_box_probe: Did you avoid turning a deterministic sandbox into external issuance or compliance evidence?
    leitner_start_box: 1
    mastery_threshold: 8
    delayed_variant:
      id: rails_experience-14-fiscalbridge-provider-boundary-delayed-14
      prompt: A contract review adds a mandatory artifact digest. The sandbox returns one, but the domain record has no persisted digest field. Which boundary must change before treating document retrieval as complete?
      changed_constraint: document completion now requires a persisted artifact digest owned by the domain
      new_evidence: the sandbox and adapter test return a digest while the domain persistence path lacks the required field
      best_answer: >-
        The new contract strengthens the domain boundary rather than proving the
        sandbox is incomplete. I would add a domain-owned digest invariant and persist
        the exact bytes and digest together before marking retrieval complete. The
        adapter can supply the value, but it should not decide domain completion.
        I would then test a mismatch and a retry path. Until that caller and persistence
        evidence exists, the sandbox result remains a provider-side capability.
      distractors:
      - text: >-
          I would accept the sandbox digest as final and mark the document complete
          in the adapter response, because the provider already calculated the value
          and the domain need not store another copy. The adapter can compare the
          digest during download, return a successful result, and let the caller infer
          that the exact bytes remain available. Persisting another field would
          duplicate provider evidence, so a later reconciliation can trust the adapter
          response without a domain invariant.
        why_wrong: >-
          It moves a domain completion invariant into the adapter and loses durable
          evidence for later verification.
      - text: >-
          I would remove digest checking because the new contract adds storage work.
          A document body and a successful adapter call are sufficient, so the domain
          can continue to trust whatever the provider returns. If a later download
          differs, the provider can issue a replacement and the caller can overwrite
          the stored body. The adapter contract remains simple, and completion can be
          based on transport success instead of an additional integrity record.
        why_wrong: >-
          It weakens the newly stated integrity requirement instead of adding the
          missing persistence and mismatch checks.
      answer_anchors:
      - Persist the artifact bytes and digest in the domain before completion.
      - Let the adapter supply digest data without owning domain completion.
      - Test mismatch and retry paths before trusting document retrieval.
      reasoning_moves:
        preserve: Preserve domain-owned identity and pending state when provider completion is uncertain.
        revise: Move completion only after the required artifact digest is persisted and matched.
        verify: Check adapter result, domain record, bytes, digest, and retry evidence together.
        certainty_update: Raise integration confidence only after caller persistence and provider contract evidence agree.
  extension:
    prompt: 'Take the FiscalBridge boundary deeper: after a provider timeout or digest mismatch, which domain state, adapter result, and reconciliation evidence must remain distinct?'
    goal: Explain a safe provider evolution path with typed errors, stable identity, artifact integrity, and explicit limits on the sandbox evidence.
  critical_thinking:
    problem_frame: Frame the provider boundary around the domain invariant, the provider operation, the ambiguous or integrity-sensitive result, and the evidence still needed before completion.
    claim_map:
      fact: The cited ADR defines domain-owned reliability concerns and normalized issue, cancel, status, and document operations; the sandbox and test provide deterministic local contract evidence.
      inference: A stable port can contain provider protocol differences while the domain retains identity, state, and reconciliation rules.
      assumption: Callers persist provider results, artifact digests, and typed failures in a way that supports retry and reconciliation.
      unknown: Municipal connectivity, certificates, compliance, current execution, caller coverage, external results, and complete persistence semantics remain unknown.
    comparison:
      applicable: true
      alternatives:
      - option: Keep one normalized provider port with domain-owned state, idempotency, locks, audit, and outbox decisions.
        benefit: It keeps workflow invariants stable while adapters absorb protocol and operation-specific differences.
        cost_or_risk: It requires translation, typed error mapping, and reconciliation logic at the domain boundary.
        valid_when: Use it when several provider operations share stable domain semantics and the system can centralize identity and state.
      - option: Give each provider a provider-specific domain service with its own workflow rules.
        benefit: It can expose unusual provider semantics directly and reduce translation in a narrowly scoped integration.
        cost_or_risk: It duplicates idempotency, locking, audit, and timeout decisions and increases cross-provider divergence.
        valid_when: Use it only when a provider's domain contract is genuinely different and the duplication is accepted explicitly.
      decision_rule: Prefer the normalized port while domain invariants are shared; split only when a provider-specific requirement cannot be expressed without weakening those invariants.
    failure_probe:
      kind: counterexample
      prompt: If the adapter returns an issued result but the domain transaction fails before persisting it, which state is authoritative and how would reconciliation recover the gap?
    evidence_check:
      basis: Check the domain and adapter claims against fiscalbridge-rails-nfse-platform/docs/adr/005-provider-ports-and-adapters.md, app/services/providers/sandbox_nfse_client.rb, and the adapter test at commit d9b9ffd155c6b651d747a513720907d3464e34c6.
      source_kind: primary_code
      limitation: These committed files establish a deterministic sandbox and provider-port design; they do not prove municipal issuance, certificates, compliance, current execution, external results, or complete caller persistence.
      checked_on: '2026-08-25'
    certainty:
      level: low
      rationale: Certainty is low because the local port and sandbox are inspectable, while provider connectivity, caller persistence, compliance, and reconciliation evidence require separate confirmation.
      update_trigger: Update the boundary when a caller test or provider contract reveals a missing state or identity invariant; do not treat a sandbox response as sufficient evidence of external issuance.
    rubric:
      facts_correct: Names the domain-owned reliability rules, normalized operations, typed sandbox results, and artifact digests without importing external issuance or compliance.
      assumptions_explicit: States the caller persistence and reconciliation assumptions behind a safe provider retry.
      alternatives_considered: Compares a shared normalized port with provider-specific domain workflows using explicit validity and duplication conditions.
      tradeoff_quality: Connects translation and reconciliation cost against invariant stability and cross-provider coupling.
      follow_up_adaptation: Preserves identity and changes domain state when a timeout, digest mismatch, or persistence failure changes the boundary.
      certainty_calibration: Keeps low certainty until caller and provider evidence addresses municipal connectivity, persistence, reconciliation, and external outcomes.
    defense_checks:
    - id: rails_experience-14-fiscalbridge-provider-boundary-defense-sandbox
      axis: facts
      prompt: The sandbox adapter returns a successful issue and document digest, so a team wants to call FiscalBridge compliant for real municipalities. Which boundary would you defend, and what evidence is missing?
      best_answer: >-
        I would separate a deterministic adapter and ADR contract from external assurance. The sandbox can show local issue, status, document, typed-error, and digest shapes, while domain-owned state, idempotency, audit, and outbox remain design boundaries. It does not prove municipal issuance, certificates, compliance, connectivity, or caller persistence; those need provider and domain evidence.
      distractors:
      - text: I would call it compliant because the sandbox returned issue success and a matching digest. The ADR's port is the same contract a municipality would use, so typed errors and audit or outbox intent prove the caller can deliver documents; provider connectivity and certificates can be checked after the first external request.
        why_wrong: A deterministic local response and architectural intent do not establish external issuance, certificates, connectivity, or compliance.
      - text: I would discard the normalized port and let each municipal controller call its provider directly. A sandbox only adds abstraction, so a successful HTTP response can mark the domain issued and the adapter can translate any later mismatch; no separate idempotency, audit, or compliance review is needed.
        why_wrong: It moves reliability and state decisions into callers and treats transport success as external assurance without reconciliation.

- id: rails_experience-15-openbank-simulation-boundary
  version: 1.6.0
  target: rails_experience
  topic: OpenBank Sandbox simulation boundary
  difficulty: 3
  interview_stage: architecture_review
  prompt: What would you keep in a teaching-oriented Open Finance sandbox, and what
    would you refuse to claim before a real integration exists?
  context: The interviewer is probing the boundary between consent workflow modeling,
    webhook egress checks, and security or conformance claims the available study
    cannot support.
  best_answer: OpenBank Sandbox models a consent transition, its audit record, and queued
    webhook work in one transaction. The simulation is didactic, not FAPI or certified
    Open Finance. Its endpoint policy resolves the webhook host, rejects private networks
    by default unless WEBHOOK_ALLOW_PRIVATE_ADDRESSES=true overrides that policy, and the
    cited HTTP client assigns the resolved IP to Net::HTTP before calling http.request.
    That is a committed delivery implementation and connection boundary, not proof of
    current execution, production or provider operation, or assurance on a real network.
    The client does not establish redirect handling or revalidation. I would frame mTLS
    and FAPI flows as missing upgrade controls and reserve claims about certification,
    real data, users, or operating results for external evidence.
  response_versions:
    short: >-
      OpenBank Sandbox couples consent, audit, and webhook enqueue in one transaction. It
      rejects private networks by default unless WEBHOOK_ALLOW_PRIVATE_ADDRESSES=true
      overrides that policy; the client assigns the resolved IP before http.request. That
      proves a committed request boundary, not current production/provider execution,
      real-network assurance, or redirect revalidation. It remains a didactic sandbox,
      not FAPI certification.
    medium: >-
      OpenBank Sandbox models a consent transition, its audit record, and queued webhook work in one transaction. The simulation is didactic, not FAPI or certified Open Finance. Its endpoint policy resolves the webhook host, rejects private networks by default unless WEBHOOK_ALLOW_PRIVATE_ADDRESSES=true overrides that policy, and the cited HTTP client assigns the resolved IP to Net::HTTP before calling http.request. That is a committed delivery implementation and connection boundary, not proof of current execution, production or provider operation, or assurance on a real network. The client does not establish redirect handling or revalidation. I would frame mTLS and FAPI flows as missing upgrade controls and reserve claims about certification, real data, users, or operating results for external evidence.
    deep: >-
      OpenBank Sandbox demonstrates a didactic consent lifecycle: transition, audit treatment, and webhook enqueue are coupled in one transaction, so rollback preserves their local boundary. The endpoint policy resolves every address, rejects private-network destinations by default, and permits them only when WEBHOOK_ALLOW_PRIVATE_ADDRESSES=true. In the cited HTTP client, the chosen resolved IP is assigned to Net::HTTP and one request is issued; the accompanying test exercises canonical payload and header delivery at that revision. That is stronger than a hostname-only claim, but it does not establish current execution, provider participation, production assurance, or behavior under a real network. The client contains no evidenced redirect-following or revalidation branch, so those controls remain questions, as do policy authorization and broader egress enforcement. I would compare application-layer resolved-IP/range policy with controlled egress enforcement, test the override and rebinding paths, and reserve FAPI, certification, real data, users, and impact claims for external evidence.
  distractors:
  - text: I would call the consent transaction a certified Open Finance implementation
      because it writes an audit record and queues a webhook. The resolved IP assignment
      and http.request call prove every network path is safe. I would skip checking who may
      set the override, assume the same resolved address governs redirects and every future
      caller, and treat the local TCP test as provider delivery evidence. That local code
      would therefore justify claims of bank participation, mTLS, FAPI conformance, and
      reliable operation.
    trap: hedging
    why_wrong: It upgrades a didactic simulation and one committed request boundary into
      unsupported conformance, provider, real-network, and operational assurances.
  - text: I would keep consent state, audit, and webhook enqueue as three independent
      updates because an eventual retry can repair any partial result. The endpoint
      policy should allow private networks for flexibility, and DNS pinning is unnecessary
      after a name passes an allowlist. I would accept any resolver-returned address as final,
      skip a separate redirect or connection test, and document the three writes as
      recoverable through retries rather than preserving rollback. This makes the sandbox
      closer to real banking behavior.
    trap: precision
    why_wrong: It breaks the documented transactional boundary, weakens egress defense,
      and labels unproven banking behavior as realism.
  sources:
  - repo: backend-challenges
    path: openbank-rails-openfinance-sandbox/docs/adr/0006-simulated-openfinance-boundary.md
    note: Inspectable simulation and security-boundary rationale.
  - repo: backend-challenges
    path: openbank-rails-openfinance-sandbox/app/services/sandbox/consent_lifecycle.rb
    note: Inspectable consent lifecycle implementation.
  - repo: original
    path: english-arcade/rails_experience/15
    note: Authored evidence-bounded interview-language coaching.
  provenance:
    evidence_class: portfolio_code
    project: OpenBank Sandbox
    repository: backend-challenges
    files:
    - path: openbank-rails-openfinance-sandbox/docs/adr/0006-simulated-openfinance-boundary.md
      commit: d8e59640f121dc6621a061348292bb9388609602
      claim: The committed ADR labels the Open Finance boundary as simulated and educational,
        rather than FAPI or certified conformance.
    - path: openbank-rails-openfinance-sandbox/app/services/sandbox/consent_lifecycle.rb
      commit: d8e59640f121dc6621a061348292bb9388609602
      claim: The committed lifecycle records a transaction that combines consent transition,
        audit treatment, and webhook enqueue behavior.
    - path: openbank-rails-openfinance-sandbox/app/services/sandbox/webhook_endpoint_policy.rb
      commit: d8e59640f121dc6621a061348292bb9388609602
      claim: The committed endpoint policy resolves a host and rejects private-network
        destinations by default unless WEBHOOK_ALLOW_PRIVATE_ADDRESSES=true overrides
        that policy; the separate HTTP client consumes its returned address.
    - path: openbank-rails-openfinance-sandbox/test/services/sandbox/consent_lifecycle_test.rb
      commit: d8e59640f121dc6621a061348292bb9388609602
      claim: The committed tests specify consent lifecycle behavior at that revision
        and do not establish current test execution or Open Finance conformance.
    - path: openbank-rails-openfinance-sandbox/app/services/sandbox/webhook_http_client.rb
      commit: d8e59640f121dc6621a061348292bb9388609602
      claim: The committed HTTP client calls WebhookEndpointPolicy.resolve!, assigns the
        returned IP to Net::HTTP, and invokes http.request; this is code at the cited
        revision, not evidence of current execution, production or provider operation,
        or real-network assurance.
    - path: openbank-rails-openfinance-sandbox/test/services/sandbox/webhook_http_client_test.rb
      commit: d8e59640f121dc6621a061348292bb9388609602
      claim: The committed test exercises canonical payload and delivery headers against
        a local TCP server at that revision; it does not establish current execution,
        production or provider operation, redirect/revalidation behavior, or real-network
        assurance.
    verified_claims:
    - The inspected study models consent transition, audit, and webhook queueing together
      while explicitly defining an educational simulation boundary.
    - The endpoint policy checks resolved destinations against private ranges and rejects
      them by default unless WEBHOOK_ALLOW_PRIVATE_ADDRESSES=true overrides the policy;
      the cited HTTP client assigns the returned IP to Net::HTTP and invokes a request.
      This code evidence does not establish current execution, production or provider
      operation, real-network assurance, or redirect/revalidation behavior.
    confirmation_required:
    - Confirm real provider participation, mTLS, FAPI work, conformance review, current
      test execution, authorship, operation scope, real-network assurance, redirect and
      revalidation behavior, external users, and results.
    safe_interview_version: This portfolio study models consent, audit, and webhook
      queueing in a didactic Open Finance sandbox whose endpoint checks reject private
      networks by default unless WEBHOOK_ALLOW_PRIVATE_ADDRESSES=true overrides the policy;
      the cited HTTP client assigns the resolved IP before http.request, which is a committed
      request boundary. Confirm current execution, provider participation, real-network
      assurance, redirect/revalidation behavior, and compliance before claims.
    confidentiality:
      level: high
      note: Do not reveal consent identifiers, redirect URIs, webhook URLs, tokens,
        client registration data, account-like payloads, internal ranges, or audit-event
        contents.
  feedback:
    register: Call this a simulation boundary with a concrete workflow, not a bank
      or Open Finance credential.
    hedging: State exactly which egress behavior is inspected and hold back DNS pinning,
      redirect/revalidation, real-network assurance, conformance, provider, and certificate
      claims.
    precision: Link the consent transition, audit record, and webhook enqueue to one
      transaction, then distinguish resolved-IP assignment and request invocation from
      redirect/revalidation and real-network assurance.
    grammar: Use “models” and “checks” for the study, while reserving “certifies”
      or “proves” for assurances absent from the cited files.
    pragmatics: Meet a security challenge by naming what the resolved-IP request boundary
      does and what rebinding, redirects, and real-network assurance still require rather
      than overstating the endpoint policy.
  rephrase:
    prompt: Explain this boundary to a risk reviewer who asks why a private-range
      check does not settle the security question for a delivered webhook.
    goal: Preserve the implemented safeguard while distinguishing the committed request
      boundary from broader delivery assurance.
  follow_up:
    prompt: If this sandbox had to move toward a real provider, which consent and
      webhook controls would you validate first, including DNS rebinding?
    goal: Describe an upgrade path without claiming mTLS, PAR, JAR, JARM, or conformance
      exists.
    challenge_kind: assumption
    best_answer: >-
      I would validate authorization and configuration for WEBHOOK_ALLOW_PRIVATE_ADDRESSES,
      keep private-range rejection as the default, and inspect the cited path in which
      WebhookEndpointPolicy.resolve! returns an address, the client assigns it to Net::HTTP,
      and http.request is invoked. I would test DNS rebinding against that boundary, verify
      redirect handling or revalidation (the cited client has no redirect branch), decide
      whether IP pinning or a controlled egress proxy is required, and inspect current
      execution, provider operation, and real-network assurance. The code proves lifecycle
      transactionality and one resolved-IP request path, not mTLS, FAPI, provider use, or a result.
    distractors:
    - text: I would treat the transaction as evidence that delivery is safe, leave private
        destinations enabled for provider flexibility, and claim FAPI readiness once the consent
        audit row and webhook job are present. I would let the resolver's first answer stand,
        follow redirects without another policy check, and defer DNS rebinding, pinning, and
        connection review until a provider reports a failure, treating the local request test
        as enough evidence that every caller will behave identically.
      why_wrong: Transactionality does not secure egress or establish FAPI; the override,
        redirect/revalidation behavior, and real-network assurance need separate evidence.
    - text: I would split consent, audit, and webhook enqueue into separate jobs so one slow
        delivery cannot roll back consent. Because the host passed the private-range check, I
        would accept the first resolved address as authoritative, let the HTTP client follow
        redirects, ignore per-redirect policy, and postpone any controlled-egress decision until
        an external provider exists.
      why_wrong: It breaks rollback coupling and mistakes the resolved-IP request path for proof
        that rebinding, redirects, or external delivery are safe.
    answer_anchors:
    - Verify authorization and configuration for WEBHOOK_ALLOW_PRIVATE_ADDRESSES before changing the default.
    - Trace resolve!, resolved_ip assignment, and http.request; test rebinding and redirect revalidation separately.
    - Consider IP pinning or controlled egress only as a separately evidenced delivery control.
  compression:
    prompt: Give a two-sentence contrast between the transactional consent model and
      the narrow resolved-IP request boundary whose broader assurance remains unverified.
    goal: Retain the useful simulation behavior and its most important security limit.
  language_focus:
  - precision
  - pragmatics
  - hedging
  feynman:
    concept: A transaction can keep related consent actions coherent, while resolving an
      outbound host and assigning its IP to the HTTP client gives a narrower request boundary
      than a hostname check alone; redirect/revalidation and real-network assurance still need evidence.
    explain_to: A teammate who says a hostname allowlist makes webhook delivery safe
      by itself.
    constraint: Explain the simulation without mentioning real banking data, certificates,
      or a conformance result.
    self_check: Did you name both the transactional bundle and the resolved-IP request
      boundary, then distinguish redirect/revalidation and real-network assurance?
    reasoning_check: Can you identify the hidden premise behind OpenBank Sandbox simulation
      boundary, give a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: The learner calls an educational consent flow certified and says one
      hostname check completely eliminates SSRF.
    expected: Transactional consent, audit, and queue handling plus a private-range
      check and resolved-IP request boundary, with clearly stated redirect/revalidation
      and real-network limits.
    actual: Three independent updates and a universal security guarantee.
    root_cause: Simulation behavior was confused with external conformance and the resolved-IP
      request boundary was mistaken for universal security or real-network assurance.
    repair: Reassemble the transactional workflow, state the resolved-IP request path precisely,
      then name redirect/revalidation and real-network evidence required before stronger claims.
    reasoning_error: If your OpenBank Sandbox simulation boundary answer failed, classify
      the mistake as a fact, assumption, comparison, failure, or certainty error before
      proposing the smallest repair.
  recall:
    active_recall_cue: What does the endpoint policy inspect, what does the client do with
      the resolved IP, and which redirect/revalidation or execution facts remain unknown?
    feynman_prompt: Explain why a didactic sandbox is not FAPI conformance.
    black_box_probe: Did you distinguish consent transactionality, policy checks, and the
      resolved-IP request boundary from broader SSRF or production claims?
    leitner_start_box: 1
    mastery_threshold: 8
    delayed_variant:
      id: rails_experience-15-openbank-simulation-boundary-delayed-15
      prompt: A second sandbox caller shares the webhook path, and a review finds
        WEBHOOK_ALLOW_PRIVATE_ADDRESSES=true. Which control remains transactional,
        which egress assumption changes, and what would you verify before widening
        the simulation?
      changed_constraint: A second caller shares the webhook path while
        WEBHOOK_ALLOW_PRIVATE_ADDRESSES=true weakens the default private-range block.
      new_evidence: The consent flow still commits transition, audit, and enqueue together,
        but the configured override permits private destinations; the cited client passes the
        resolved IP into Net::HTTP before one request, while redirect/revalidation and
        real-network or provider assurance remain unverified.
      best_answer: I would preserve the transaction that couples consent transition, audit, and
        webhook enqueue, but treat WEBHOOK_ALLOW_PRIVATE_ADDRESSES=true as a changed security
        boundary rather than proof of safe private delivery. I would verify who may enable it,
        trace the resolved IP into the HTTP request, test rebinding, and assess redirect handling
        or revalidation plus real-network and provider assurance before widening the sandbox. The
        evidence still does not establish FAPI, certification, current execution, or real outcomes.
      distractors:
      - text: I would keep the override enabled because the consent transaction already gives
          the webhook a trustworthy audit trail. I would regard an explicit operator setting as
          authorization for any private destination, rely on the first DNS answer, and postpone
          redirect, pinning, and connection checks until an external provider is added.
        why_wrong: An audit trail does not validate private egress; the override removes the
          default range guard, while local request evidence does not settle rebinding,
          redirects/revalidation, or real-network assurance.
      - text: I would separate consent, audit, and enqueue so a webhook destination cannot delay
          the user-facing transition. Since the override is explicit, I would accept the resolved
          host and replace the policy with an allowlist later; rollback of one step can be repaired
          by a retry job.
        why_wrong: It breaks the documented rollback boundary and treats an explicit setting plus
          a resolved-IP request path as proof that private destinations and redirect behavior are safe.
      answer_anchors:
      - Keep consent transition, audit, and webhook enqueue in one transaction.
      - Treat the private-address override as a changed security boundary requiring review.
      - Trace resolved-IP assignment into the request and verify rebinding, redirects/revalidation,
        and real-network/provider behavior before widening claims.
      reasoning_moves:
        preserve: Preserve the transactional coupling of consent transition, audit, and webhook enqueue.
        revise: Revise the egress assumption when WEBHOOK_ALLOW_PRIVATE_ADDRESSES=true is enabled.
        verify: Verify authorization, the resolved-IP request path, rebinding, redirects/revalidation,
          and real-network/provider behavior.
        certainty_update: Keep confidence low in private-override assurance and any FAPI or
          certification claim until external evidence exists.
  extension:
    prompt: 'Walk through OpenBank Sandbox simulation boundary under a changed requirement:
      which OpenBank Sandbox simulation boundary claim survives, which option wins,
      and why would OpenBank Sandbox simulation boundary need new evidence?'
    goal: Move from the short OpenBank Sandbox simulation boundary answer to a deep,
      evidence-led defence without inventing an outcome.
  critical_thinking:
    problem_frame: >-
      Start with the OpenBank transaction and webhook-egress boundary: identify the consent state that must be durable, the destination checks before connection, and which certification or network claim lacks evidence.
    claim_map:
      fact: >-
        The cited service commits consent transition, audit entry, and webhook enqueue together; the endpoint policy defaults to rejecting private ranges, and the client hands Net::HTTP a resolved address.
      inference: >-
        That gives a bounded teaching example and narrows one DNS route; it is not evidence for conformance, certification, provider operation, redirect handling, or current execution.
      assumption: >-
        The recommendation assumes private-address overrides are explicitly authorized and every redirect or retry repeats destination checks before another request.
      unknown: >-
        Redirect behavior, real-network operation, certification, mTLS, current execution, authorship, users, data, and external delivery remain unestablished.
    comparison:
      applicable: true
      alternatives:
      - option: Application-layer resolved-IP and range policy
        benefit: It uses the inspectable resolve!, private-range decision, resolved-IP assignment,
          and http.request boundary already present in the cited sandbox code.
        cost_or_risk: It requires careful authorization of the private-address override and separate
          tests for rebinding, redirect/revalidation, and real-network assurance.
        valid_when: Prefer it when callers need an application-visible egress contract and the
          resolved-IP request path is the evidenced boundary for this bounded sandbox.
      - option: Controlled egress proxy or network enforcement
        benefit: It can centralize destination and outbound-network controls across callers, reducing
          per-client policy drift when a real network contract exists.
        cost_or_risk: It adds proxy or network operations, identity and configuration coupling, and
          failure modes that the cited sandbox does not implement or measure.
        valid_when: Choose it when multiple callers or stronger real-network assurance justify a
          centrally enforced egress boundary and its operations are independently evidenced.
      decision_rule: Keep application-layer policy for the bounded sandbox when default rejection,
        override authorization, rebinding tests, and the request boundary are evidenced; choose
        controlled egress only when the required multi-caller assurance and operating contract exist.
    failure_probe:
      kind: failure_mode
      prompt: If policy returns a public IP, WebhookHttpClient assigns it to Net::HTTP and calls
        http.request, but a future redirect handler or resolver change could target a private address,
        which code path would you test for revalidation and what trace would prove the request remained
        on the approved IP before retrying?
    evidence_check:
      basis: >-
        Compare the consent and webhook transaction in backend-challenges/openbank-rails-openfinance-sandbox/docs/adr/0006-simulated-openfinance-boundary.md with the endpoint-policy and client paths named in the item provenance.
      source_kind: primary_code
      limitation: >-
        The cited study establishes local transaction and egress behavior, not FAPI or mTLS conformance, provider connectivity, current execution, authorship, users, or a real-network outcome.
      checked_on: '2026-08-25'
    certainty:
      level: low
      rationale: >-
        Confidence is high about the local transaction and selected-address paths, but low about redirects, overrides, provider behavior, certification, and present operation.
      update_trigger: >-
        Revisit the boundary after a redirect or retry trace, override-authorization test, or provider evidence changes the permitted claim.
    rubric:
      facts_correct: >-
        Names the consent/audit/enqueue transaction, private-range default, and selected-address request without presenting them as certification or delivery proof.
      assumptions_explicit: >-
        States the authorization and repeated destination-validation assumptions before allowing a retry or stronger network claim.
      alternatives_considered: >-
        Compares application egress checks with a controlled network boundary and ties the choice to caller count and independently evidenced operations.
      tradeoff_quality: >-
        Weighs a simple local policy against proxy complexity, override risk, redirect drift, and the assurance required by the product contract.
      follow_up_adaptation: >-
        Narrows or pauses the recommendation when a redirect, resolver change, or private-address override adds a new path.
      certainty_calibration: >-
        Keeps local code confidence separate from claims about conformance, providers, current execution, users, and real-network results.
    defense_checks:
    - id: rails_experience-15-openbank-simulation-boundary-defense-egress
      axis: facts
      prompt: An auditor sees the consent transaction and private-range host check and asks whether OpenBank Sandbox is ready for certified provider webhooks. Which claim would you defend, and what evidence is still missing?
      best_answer: >-
        I would defend only the local boundary: the study couples consent transition, audit,
        and webhook enqueue transactionally, its endpoint policy blocks private-network
        destinations by default, and the cited client assigns the resolved IP to Net::HTTP
        before invoking http.request. That committed code and test evidence does not prove
        FAPI, certification, mTLS, provider operation, current execution, real-network
        assurance, or redirect/revalidation behavior. I would inspect the override, client
        trace, and redirect behavior before expanding the claim.
      distractors:
      - text: I would call it ready because a rollback-safe transaction plus a private-range check covers the important risks. The endpoint's successful resolution is equivalent to a safe connection, and the cited ADR is enough to claim FAPI, mTLS, certified provider participation, and reliable delivery before any provider test. Because the local TCP test receives a 202 response, I would record that as delivery proof and skip measuring the connected peer, redirect handling, override authorization, or the real-network path.
        why_wrong: It turns local transaction, host-policy, and resolved-IP request evidence into unsupported conformance, provider, real-network, and operational assurances.
      - text: I would reject the transactional design and let the webhook job decide whether consent succeeded. Private destinations should be allowed for provider flexibility, and a DNS allowlist makes pinning and connection checks unnecessary; once the audit row exists, external delivery can be treated as complete. An explicit operator setting and a local 202 response would be enough authorization and delivery evidence for the next provider-facing claim.
        why_wrong: It breaks the rollback boundary, weakens the stated egress policy, and treats an audit row as proof of external delivery.
- id: rails_experience-16-ticketboard-clean-architecture-tradeoff
  version: 1.6.0
  target: rails_experience
  topic: TicketBoard clean architecture trade-off
  difficulty: 2
  interview_stage: deep_dive
  prompt: When would you keep a pure ticket domain with ports and adapters instead
    of using straightforward Rails CRUD?
  context: The interviewer wants a concrete trade-off between visible invariants and
    testability on one side, and translation, autoload, and file-count cost on the
    other.
  best_answer: TicketBoard portfolio material places ticket state transitions and
    invariants in a pure domain object, then lets use cases cross a repository port
    to an Active Record adapter. That makes boundaries and tests more visible, but
    costs extra files, translation, and autoload consideration. For simple Rails CRUD,
    that cost may not earn its keep. The study supports choosing layers only when
    change pressure or testability justifies them. I would reserve any delivery or
    operational claim until ownership and current execution are independently confirmed.
  response_versions:
    short: >-
      TicketBoard keeps ticket transitions and invariants in a pure domain object, with use cases
      crossing a repository port to an Active Record adapter. That improves boundary visibility,
      but adds files, translation, and autoload cost. I would keep it only when change pressure or
      testability justifies the extra structure; this is portfolio architecture, not delivery evidence.
    medium: >-
      TicketBoard portfolio material places ticket state transitions and invariants in a pure domain object, then lets use cases cross a repository port to an Active Record adapter. That makes boundaries and tests more visible, but costs extra files, translation, and autoload consideration. For simple Rails CRUD, that cost may not earn its keep. The study supports choosing layers only when change pressure or testability justifies them. I would reserve any delivery or operational claim until ownership and current execution are independently confirmed.
    deep: >-
      TicketBoard's committed design places ticket state transitions and invariants in a pure domain object, routes use cases through a repository port, and translates persistence in an Active Record adapter. The separation makes the rule boundary easier to inspect and test, but every layer adds files, translation, and autoload/navigation cost. For a small CRUD form, direct Rails persistence may be the safer maintenance choice; for rules under change pressure, the port can isolate domain behavior from storage. I would decide from the next change and the tests it requires, not from a clean-architecture label. The cited study does not prove a measured testability gain, production ownership, scale, or operational result.
  distractors:
  - text: I would always use ports and adapters because pure domain objects eliminate
      Rails complexity. Every controller should call a use case, and every record
      should cross a repository interface even for a simple form. More files automatically
      mean better tests, while translation and autoload costs disappear once the folders
      follow a clean architecture naming convention.
    trap: pragmatics
    why_wrong: It treats an architectural option as universal and ignores the explicit
      maintenance cost that can outweigh its value for uncomplicated CRUD.
  - text: I would keep all ticket transitions in Active Record callbacks because Rails
      already persists records. Invariants do not need a separate model, and testing
      controllers proves every state change. A repository port merely prepares the
      application for microservices, asynchronous processing, PostgreSQL tuning, authorization,
      and other capabilities the study has already demonstrated.
    trap: hedging
    why_wrong: It hides state rules inside persistence callbacks and invents capabilities
      that the inspected boundaries do not establish.
  sources:
  - repo: backend-challenges
    path: ticketboard-rails-clean-architecture/docs/adr/001-clean-architecture-boundaries.md
    note: Inspectable architectural trade-off rationale.
  - repo: backend-challenges
    path: ticketboard-rails-clean-architecture/app/domain/domain/tickets/ticket.rb
    note: Inspectable pure ticket-domain implementation.
  - repo: original
    path: english-arcade/rails_experience/16
    note: Authored evidence-bounded interview-language coaching.
  provenance:
    evidence_class: portfolio_code
    project: TicketBoard
    repository: backend-challenges
    files:
    - path: ticketboard-rails-clean-architecture/README.md
      commit: '0779cff5372a1e222be23a6ae3959e63839865de'
      claim: The committed README presents TicketBoard as inspectable portfolio material.
    - path: ticketboard-rails-clean-architecture/docs/adr/001-clean-architecture-boundaries.md
      commit: '0779cff5372a1e222be23a6ae3959e63839865de'
      claim: The committed ADR describes pure domain, use-case, repository-port, and
        Active Record adapter boundaries alongside their file, translation, and autoload
        trade-offs.
    - path: ticketboard-rails-clean-architecture/app/domain/domain/tickets/ticket.rb
      commit: '0779cff5372a1e222be23a6ae3959e63839865de'
      claim: The committed ticket domain object records ticket state transitions and
        invariants outside the persistence adapter.
    - path: ticketboard-rails-clean-architecture/test/integration/tickets_flow_test.rb
      commit: '0779cff5372a1e222be23a6ae3959e63839865de'
      claim: The committed integration test specifies a ticket flow at that revision
        and does not establish execution of the current suite or broader system capabilities.
    verified_claims:
    - The inspected study exposes ticket invariants in a pure domain model and crosses
      use-case and repository boundaries before an Active Record adapter.
    - The cited ADR records the accompanying translation, autoload, and file-count
      costs rather than treating the structure as free or universally required.
    confirmation_required:
    - Confirm actual change pressure, testability needs, deletion decisions, results,
      current test execution, operation scope, external users, authorship, and any
      broader capability.
    safe_interview_version: This portfolio study makes ticket transitions and invariants
      visible through domain, use-case, port, and Active Record adapter boundaries;
      confirm delivery history, need for those layers, and current execution before
      making personal claims.
    confidentiality:
      level: medium
      note: Do not expose ticket content, user identifiers, local paths, repository
        details, internal workflow names, or assumptions about authorization and future
        architecture.
  feedback:
    register: Present clean architecture as a selective maintenance trade-off, not
      as a badge or a rejection of ordinary Rails.
    hedging: Keep the visible domain and adapter boundaries separate from claims about
      authorization, background work, PostgreSQL, microservices, delivery history,
      or results.
    precision: Name state transitions and invariants in the domain, then identify
      the repository port and Active Record adapter without calling them a generic
      service layer.
    grammar: Use a conditional sentence to connect change pressure or testability
      to the point at which extra translation becomes justified.
    pragmatics: Answer a Rails-oriented interviewer by acknowledging when deletion
      or simpler CRUD would improve the design rather than defending every boundary.
  rephrase:
    prompt: Explain the same decision to a Rails maintainer who says the extra directories
      make a small ticket form harder to change.
    goal: Preserve the invariant boundary while conceding the conditions that favor
      simpler CRUD.
  follow_up:
    prompt: What would you change now, and when would you delete a layer instead of
      preserving the port and adapter structure?
    goal: Demonstrate revision discipline rather than treating architecture as irreversible.
    challenge_kind: evidence
    best_answer: >-
      I would first inspect the next ticket change and the tests it forces across the domain and
      adapter. If transitions remain stable and only persistence changes, keep the port; if the
      boundary adds translation without protecting a changing invariant, delete it deliberately.
      I would report that as a portfolio design judgment, not a measured testability gain.
    distractors:
    - text: I would keep the port because the folder structure signals mature Rails architecture.
        Every ticket should cross the same boundary, even when its only behavior is a simple
        create or update; adding files is itself evidence that tests will be easier.
      why_wrong: A directory convention does not establish a changing invariant or justify translation and autoload cost.
    - text: I would move all transitions into Active Record callbacks and delete the domain object
        immediately. Rails persistence already owns the record, so controller and integration tests
        would cover the invariant; file count is the only cost worth optimizing.
      why_wrong: Persistence callbacks hide the invariant and ignore whether the boundary protects behavior outside one adapter.
    answer_anchors:
    - Inspect the next ticket change and the tests it requires across domain and adapter.
    - Keep the port when it protects a changing invariant; delete it when translation adds no boundary value.
    - Describe the choice as portfolio design reasoning, not a measured testability result.
  compression:
    prompt: Contrast pure ticket invariants with the cost of their surrounding layers
      in two sentences.
    goal: Keep both the testing benefit and the translation burden in the short version.
  language_focus:
  - precision
  - pragmatics
  - hedging
  feynman:
    concept: A pure domain model can protect business transitions from persistence
      details, but every boundary introduces translation and navigation work.
    explain_to: A teammate who wants all Rails applications to use the same number
      of layers.
    constraint: Explain when you would simplify without claiming the study includes
      authorization, background processing, PostgreSQL, or microservice preparation.
    self_check: Did you connect an invariant to the domain and a concrete cost to
      the decision to keep or delete a layer?
    reasoning_check: Can you identify the hidden premise behind TicketBoard clean
      architecture trade-off, give a counterexample, and explain how the evidence
      changes your conclusion?
  black_box:
    symptom: The response calls ports universally clean or buries all ticket rules
      in callbacks because persistence already exists.
    expected: Pure transitions and invariants, visible adapter boundaries, and a decision
      based on actual change pressure and testability versus maintenance cost.
    actual: Architecture as a slogan, either maximal layering or callback-only rules.
    root_cause: The learner memorised names of layers without modeling what each protects
      or what each adds to a small Rails change.
    repair: Start from a ticket invariant, trace the port to its adapter, then decide
      whether the upcoming change justifies the files and translation.
    reasoning_error: If your TicketBoard clean architecture trade-off answer failed,
      classify the mistake as a fact, assumption, comparison, failure, or certainty
      error before proposing the smallest repair.
  recall:
    active_recall_cue: Which ticket behavior belongs in the pure domain rather than
      Active Record?
    feynman_prompt: Explain why a repository port can be deleted when change pressure
      is low.
    black_box_probe: Did you name both a testability benefit and the autoload or translation
      cost?
    leitner_start_box: 1
    mastery_threshold: 8
    delayed_variant:
      id: rails_experience-16-ticketboard-clean-architecture-tradeoff-delayed-16
      prompt: Suppose a new ticket rule must support a second persistence adapter, but the current
        flow has no test that crosses the repository port. What would you verify before keeping the
        port, and what evidence could justify deleting it?
      changed_constraint: A second persistence adapter is now required, but no test currently
        exercises the repository boundary end to end.
      new_evidence: A focused test shows the new rule is translated twice and the adapter contract
        omits one invariant-preserving state.
      best_answer: I would keep the pure transition rule in the domain, then inspect whether the
        port isolates the two adapters or merely duplicates translation. I would add a contract test
        for the missing state, compare the maintenance cost of both adapters, and delete the port only
        if both callers share one persistence path and the boundary protects no changing invariant.
        The new test changes the decision rule; it does not prove a general testability gain.
      distractors:
      - text: I would preserve the port automatically because a second adapter validates the
          architecture. The missing contract case can wait, and duplicate translation is an
          acceptable price for clean boundaries; more interfaces mean the design is more testable
          regardless of the rule. I would merge that structure before checking whether either
          adapter preserves the missing state under the new rule.
        why_wrong: A second adapter does not excuse an untested invariant or prove that duplicated translation pays for itself.
      - text: I would collapse the domain into Active Record as soon as the test exposes translation.
          A failing boundary test proves the port is useless, so callbacks can own the invariant and
          the second adapter can copy whichever state fields it needs. There is no need to compare
          the two adapters or measure whether callers will diverge.
        why_wrong: Translation cost calls for comparison, not immediate deletion or moving the invariant into persistence callbacks.
      answer_anchors:
      - Keep ticket transitions and invariants in the pure domain while testing both adapter contracts.
      - Compare duplicated translation against the boundary protection the second adapter actually needs.
      - Delete the port only when shared persistence leaves no changing invariant for it to protect.
      reasoning_moves:
        preserve: Preserve domain-owned ticket transitions and invariants while the second adapter's contract is inspected.
        revise: Revise the boundary decision when adapter translation duplicates rules or the port misses an invariant.
        verify: Run a focused contract test for the new state across both adapters and inspect the translation cost.
        certainty_update: Keep confidence provisional until the second adapter test shows whether the port protects change or only adds indirection.
  extension:
    prompt: Connect TicketBoard clean architecture trade-off, connect the TicketBoard
      clean architecture trade-off implementation choice to its failure mode, measurement,
      and condition for choosing the alternative.
    goal: Move from the short TicketBoard clean architecture trade-off answer to a
      deep, evidence-led defence without inventing an outcome.
  critical_thinking:
    problem_frame: >-
      Start with the TicketBoard invariant and change pressure: identify which ticket rules should stay independent of persistence, what the repository boundary buys, and what evidence would make its translation cost unjustified.
    claim_map:
      fact: >-
        The portfolio keeps ticket rules in a pure object, routes use cases through a repository port, and adapts that port to Active Record; the cited design also records the extra files and autoload work.
      inference: >-
        That separation can make invariants and adapter tests easier to isolate, but it is useful only when the rule or storage boundary changes enough to repay the extra indirection.
      assumption: >-
        The recommendation assumes ticket behavior may evolve independently of one Rails persistence path or may need another adapter; a stable CRUD path may not need this boundary.
      unknown: >-
        Future rule changes, adapter count, maintenance cost, current execution, authorship, and any delivery or operational outcome remain unverified.
    comparison:
      applicable: true
      alternatives:
      - option: Keep a pure ticket domain with use cases, a repository port, and an Active Record adapter.
        benefit: It keeps state transitions and invariants outside persistence while making a second adapter or domain test easier to isolate.
        cost_or_risk: The boundary adds files, translation, autoload/navigation work, and contract tests that a small form may not need.
        valid_when: Use it when ticket rules change independently of storage or multiple adapters must preserve the same invariant.
      - option: Use straightforward Rails CRUD with Active Record owning the ticket path.
        benefit: It minimizes files and translation, so a small workflow can remain easy to navigate and modify.
        cost_or_risk: Invariants become more coupled to persistence and can be harder to exercise independently if the domain grows.
        valid_when: Use it when one adapter serves stable CRUD and the extra boundary protects no changing rule.
      decision_rule: Keep the layered boundary when a changing invariant or second adapter justifies it; choose straightforward CRUD when translation adds cost without isolating behavior, and revisit the choice at the next substantive rule change.
    failure_probe:
      kind: counterexample
      prompt: A small CRUD path uses one Active Record adapter, and a change reveals that the repository port only adds translation while no second adapter is planned. Which invariant would you test before deleting the port, and what would make you keep it?
    evidence_check:
      basis: >-
        Compare the TicketBoard boundary described in backend-challenges/ticketboard-rails-clean-architecture/docs/adr/001-clean-architecture-boundaries.md with the domain, use-case, repository, and Active Record paths named by the item sources.
      source_kind: primary_code
      limitation: >-
        The cited design establishes a structural boundary and rationale, not current execution, authorship, delivery, a measured testability gain, or a universal architecture rule.
      checked_on: '2026-08-25'
    certainty:
      level: low
      rationale: >-
        Confidence is high about the stated layers, but low about whether their cost is justified without a changing invariant, a second adapter, or a test boundary that benefits from separation.
      update_trigger: >-
        Revisit the choice after a rule-change trace, adapter requirement, contract test, or maintenance observation shows the port either protects or obscures the invariant.
    rubric:
      facts_correct: >-
        Identifies the pure domain object, use-case port, Active Record adapter, and documented costs without claiming a measured payoff.
      assumptions_explicit: >-
        States the expected rule volatility, adapter count, and test-isolation need before retaining the extra boundary.
      alternatives_considered: >-
        Compares layered ticket handling with direct Rails CRUD and names the invariant or storage change that would decide between them.
      tradeoff_quality: >-
        Weighs clearer invariants and adapter isolation against files, translation, autoload work, and navigation cost.
      follow_up_adaptation: >-
        Removes or keeps the port when a concrete rule change or adapter requirement changes the value of separation.
      certainty_calibration: >-
        Distinguishes structural evidence from unmeasured testability, maintenance, delivery, and operational outcomes.
    defense_checks:
    - id: rails_experience-16-ticketboard-clean-architecture-tradeoff-defense-boundary
      axis: tradeoff
      prompt: An engineer says the TicketBoard repository port is justified because the ADR calls it clean architecture. What evidence would make you keep it, and what would make you delete it?
      best_answer: >-
        I would keep the port when a changing ticket invariant stays in the pure domain while
        multiple adapters translate persistence without duplicating the rule. I would require a
        focused contract test and inspect the file, autoload, and translation cost. If one simple
        Rails path remains and the port protects no changing boundary, deleting it may be clearer.
        The ADR supplies rationale, not a measured testability result or universal rule.
      distractors:
      - text: I would keep the port automatically because clean architecture is the safer default. The extra files and translations are a small price for mature design, and the ADR itself proves that every future adapter will be easier to test; no workload or contract test is needed.
        why_wrong: It treats an ADR rationale and a structural label as proof that the port pays for itself under every workload.
      - text: I would delete the domain and port immediately because Active Record already persists tickets. Callbacks and controller tests can own every invariant, while a second adapter can copy the same transitions; file count is the only objective evidence required to choose the simpler path.
        why_wrong: It abandons the domain invariant without comparing adapter boundaries, tests, and the actual maintenance trade-off.

- id: rails_experience-17-railsdoctor-context-and-redaction-boundary
  version: 1.6.0
  target: rails_experience
  topic: RailsDoctor context and redaction boundary
  difficulty: 3
  interview_stage: architecture_review
  prompt: How would you build actionable Rails diagnostics without coupling checks
    to globals or leaking configuration secrets in their output?
  context: The interviewer wants the testability and safety boundary around a diagnostic
    framework, including what a pattern-based redactor cannot guarantee.
  best_answer: RailsDoctor uses a Context boundary to expose the application, configuration,
    root files, environment, gems, and constants without forcing checks to reach into
    globals. That makes fakes and optional components practical. Its redaction handles
    sensitive keys, bearer values, assignments, URL userinfo, nested objects, and
    custom patterns before diagnostic output. I would still treat diagnostics as sensitive
    because pattern matching cannot prove that unknown secret shapes never leak. I
    would complement redaction with allowlisted output and validation.
  response_versions:
    short: >-
      RailsDoctor gives checks a Context view of application and configuration data instead of
      making them reach into globals. Its redactor covers known sensitive patterns recursively,
      but unknown secret shapes can still escape. I would add allowlisted output and validation,
      treating the portfolio study as bounded evidence rather than proof of zero leakage.
    medium: >-
      RailsDoctor uses a Context boundary to expose the application, configuration, root files, environment, gems, and constants without forcing checks to reach into globals. That makes fakes and optional components practical. Its redaction handles sensitive keys, bearer values, assignments, URL userinfo, nested objects, and custom patterns before diagnostic output. I would still treat diagnostics as sensitive because pattern matching cannot prove that unknown secret shapes never leak. I would complement redaction with allowlisted output and validation.
    deep: >-
      RailsDoctor's Context boundary exposes application, configuration, root files, environment, gems, and constants through an inspectable dependency surface, making fakes and absent optional components manageable without direct global access. The redactor handles the tested sensitive keys, bearer values, assignments, URL userinfo, nested objects, and custom patterns, but that coverage cannot prove unfamiliar secret formats are safe. I would treat diagnostics as sensitive, select output fields positively and consistently, validate the emitted shape, and add tests for each newly discovered format. The architecture supports a practical safety boundary; it does not establish current execution, unknown-format coverage, production use, users, or a zero-leak outcome.
  distractors:
  - text: I would let checks access Rails constants directly because that is simpler
      than a Context abstraction. Optional components should raise when absent so
      configuration errors cannot hide. A few patterns for password and authorization-token
      text guarantee clean output, and unclassified values are safe to include once
      they do not match a key or bearer string.
    trap: precision
    why_wrong: It reintroduces global coupling, makes optional dependencies brittle,
      and treats known secret patterns as proof that unfamiliar sensitive values are
      harmless.
  - text: I would redact every configuration value by default and call that an allowlist.
      Since a recursive sanitizer visits hashes and arrays, format discovery no longer
      matters. There is no reason to validate which evidence a check emits, and custom
      patterns are unnecessary because one default regular expression recognizes every
      secret.
    trap: pragmatics
    why_wrong: It confuses redaction with positive output selection and ignores unknown
      formats, custom evidence, and the diagnostic usefulness lost by indiscriminate
      masking.
  sources:
  - repo: backend-challenges
    path: rails_doctor/docs/adr/0003-use-context-as-inspection-boundary.md
    note: Inspectable Context-boundary decision.
  - repo: backend-challenges
    path: rails_doctor/lib/rails_doctor/redaction.rb
    note: Inspectable redaction implementation.
  - repo: original
    path: english-arcade/rails_experience/17
    note: Authored evidence-bounded interview-language coaching.
  provenance:
    evidence_class: portfolio_code
    project: RailsDoctor
    repository: backend-challenges
    files:
    - path: rails_doctor/README.md
      commit: 13b03ae196acdcfd73dc060e15dc6315e7315d5a
      claim: The committed README describes RailsDoctor as a Rails diagnostic framework
        with an actionable check surface.
    - path: rails_doctor/docs/adr/0003-use-context-as-inspection-boundary.md
      commit: 13b03ae196acdcfd73dc060e15dc6315e7315d5a
      claim: The committed ADR exposes application, configuration, root files, environment,
        gems, and constants through Context to support fakes and optional components.
    - path: rails_doctor/lib/rails_doctor/context.rb
      commit: 13b03ae196acdcfd73dc060e15dc6315e7315d5a
      claim: The committed Context object exposes application, configuration, root files,
        environment, gems, and constants through an inspectable boundary for checks.
    - path: rails_doctor/lib/rails_doctor/redaction.rb
      commit: 13b03ae196acdcfd73dc060e15dc6315e7315d5a
      claim: The committed redactor covers sensitive keys, bearer values, assignments,
