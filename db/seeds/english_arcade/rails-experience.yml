        why_wrong: It confuses bootstrap overhead with algorithmic growth and discards the exact oracle and measured ANN criteria.
      - text: I would reject ANN permanently because both small examples match exactly. The sample corpus proves full-dataset p99 and memory, while the Rails HTTP boundary alone explains every future slowdown; no matched corpus, query distribution, or resource experiment is necessary. A stable sample result is enough evidence to close the scaling question.
        why_wrong: It generalizes study fixtures and misattributes unmeasured full-corpus behavior to topology.
- id: rails_experience-20-local-review-tooling-pipeline-boundaries
  version: 1.6.0
  target: rails_experience
  topic: Local Ruby review tooling pipeline boundaries
  difficulty: 3
  interview_stage: architecture_review
  prompt: Walk me through a local review-tooling pipeline and explain why its packet
    builder is an orchestrating consumer rather than an AI gateway.
  context: The interviewer expects four distinct component responsibilities, their
    limits, and a recovery story for contract drift or a failed subprocess.
  best_answer: In this local portfolio pipeline, Context Pack Builder first curates
    bounded docs, manifests, CI, selected tests, git state, and risk-name warnings;
    it is not a secret scanner or complete semantic understanding. Prompt Registry
    then validates a versioned YAML manifest and materializes Markdown placeholders,
    without scoring, routing, or runtime policy. Eval Harness adds static readiness
    heuristics, not a full suite or live GitHub verification. Review Packet Builder
    consumes those public CLI outputs and composes a packet, so version drift, process
    failure, and sensitive aggregation remain explicit risks.
  response_versions:
    short: >-
      Four local CLIs have bounded roles: Context Pack Builder curates, Prompt Registry
      validates and materializes, Eval Harness assesses static readiness, and Review Packet
      Builder composes. The packet builder is an orchestrating consumer, not an AI gateway;
      no model routing, authentication, or spend control is evidenced.
    medium: 'In this local portfolio pipeline, Context Pack Builder first curates bounded docs, manifests, CI, selected tests, git state, and risk-name warnings; it is not a secret scanner or complete semantic understanding. Prompt Registry then validates a versioned YAML manifest and materializes Markdown placeholders, without scoring, routing, or runtime policy. Eval Harness adds static readiness heuristics, not a full suite or live GitHub verification. Review Packet Builder consumes those public CLI outputs and composes a packet, so version drift, process failure, and sensitive aggregation remain explicit risks.'
    deep: >-
      This local portfolio pipeline has four bounded contracts. Context Pack Builder curates
      selected docs, manifests, CI, tests, Git state, and risk-name warnings, but does not
      promise secret scanning or semantic completeness. Prompt Registry validates a versioned
      manifest and materializes placeholders; Eval Harness applies static readiness heuristics;
      Review Packet Builder shells out to those public CLIs and composes their outputs. I would
      detect missing canonical context at curation, reject stale placeholders at validation,
      label static readiness as partial evidence, and stop on changed output or a non-zero child
      exit rather than silently substituting a default. The aggregate remains sensitive. Nothing
      in the cited tools establishes model/provider routing, authentication, spend controls,
      hosted history, live GitHub verification, or a publication decision.
  distractors:
  - text: I would call the four commands an AI gateway because they all orchestrate
      prompting and evaluations. Context packing should indiscriminately copy every
      file to guarantee semantic understanding, the registry should choose models
      and policies, eval should run all verification and query GitHub, and packet
      building should retain history, authorize users, and control model spending
      centrally.
    trap: precision
    why_wrong: It merges four bounded local responsibilities into gateway features
      that the documented tools neither own nor prove.
  - text: I would treat the packet as a review decision because it contains context,
      a prompt, and readiness files. If a child CLI changes its output or fails, the
      builder can silently use a default. Combining artifacts removes confidentiality
      concerns, so no tests are needed for missing docs, invalid placeholders, stale
      Git state, or subprocess failure.
    trap: pragmatics
    why_wrong: It hides composition failure and sensitive aggregation risk while turning
      partial evidence into an unsupported approval decision.
