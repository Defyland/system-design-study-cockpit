      alternatives_considered: >-
        Explains why an AI gateway is not comparable yet and lists the routing, authentication,
        spend, and provider evidence needed before comparison.
      tradeoff_quality: >-
        Weighs local composability and inspectable artifacts against contract-drift, subprocess,
        sensitive-aggregation, and maintenance risk.
      follow_up_adaptation: >-
        Stops composition on stale placeholders, changed output, failed subprocesses, or unsafe
        fields and retains only bounded evidence for review.
      certainty_calibration: >-
        Separates local code confidence from claims about semantic completeness, live verification,
        gateway behavior, current execution, users, and approval outcomes.
    defense_checks:
    - id: rails_experience-20-local-review-tooling-pipeline-boundaries-defense-gateway
      axis: facts
      prompt: An engineer says that a packet containing context, a prompt, and readiness files should route models, authorize users, and control spend like an AI gateway. What would you defend about the current packet builder, and what future evidence could change the classification?
      best_answer: >-
        I would defend the narrower classification: the cited builder consumes public outputs from
        sibling CLIs and composes a local packet, while curation, placeholder validation, and static
        readiness remain separate boundaries. It does not prove model/provider routing, caller auth,
        spend controls, semantic completeness, a full suite, or live GitHub verification. I would
        change the comparison only if evidence added a real model/provider boundary, authentication
        flow, spend policy, and corresponding operational contract.
      distractors:
      - text: I would promote the packet builder to an AI gateway because its inputs already include prompts and readiness. It should choose a provider, authorize every caller, retain history, control spend, query GitHub, and run the complete suite; composition itself proves those capabilities are available.
        why_wrong: It mistakes local artifact composition for hosted routing, identity, spend, semantic, and live-verification capabilities.
      - text: I would call the packet a release approval because four tools contributed evidence. Missing documents, stale placeholders, a changed child output, and a non-zero exit can all be replaced by defaults so the final artifact stays complete and convenient. A final packet would therefore outweigh any missing intermediate signal.
        why_wrong: It hides contract drift and subprocess failure, turning partial sensitive evidence into an unsupported approval decision.
