  rephrase:
    prompt: Explain the comparison to a staff engineer who assumes a smaller Ruby
      service must have already solved the score path's scaling problem.
    goal: Preserve the framework distinction while correcting the complexity assumption.
  follow_up:
    prompt: What dataset scale, latency evidence, and recall target would justify
      a benchmark and a move from exact KNN to ANN or a vector index?
    goal: Define a falsifiable migration trigger and its accuracy and operating-cost
