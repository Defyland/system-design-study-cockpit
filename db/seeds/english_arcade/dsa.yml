- id: dsa-09-whiteboard-thinking-aloud
  version: 1.4.0
  target: dsa
  topic: Thinking aloud
  difficulty: 2
  interview_stage: live_coding
  template: dsa-narration
  prompt: Could you keep talking me through it as you go?
  context: You are comfortable with the algorithm but tend to fall silent while typing.
    The interviewer needs a running commentary to assess reasoning, and silence reads
    as uncertainty even when the code is correct.
  follow_up:
    prompt: Which intermediate value should I challenge if I want to check that your
      reasoning, rather than your syntax, is sound?
    goal: Answer the evidence challenge about Thinking aloud while keeping the evidence
      boundary explicit.
    challenge_kind: evidence
    best_answer: >-
      Sure. I would treat the follow-up observation as evidence, not as proof of impact;
      I would inspect the smallest relevant trace or test and state what remains uncertain
      before changing the decision.
    distractors:
    - text: I would cite my experience with Thinking aloud as enough proof and move
        on without naming an observation.
      why_wrong: Experience can guide a hypothesis, but it does not replace evidence
        tied to this context.
    - text: I would collect every possible metric about Thinking aloud before making
        even a provisional recommendation.
      why_wrong: A focused decision can start with one discriminating observation
        rather than an unbounded data request.
  compression:
    prompt: Retell the walkthrough as approach, invariant, trace, and next check,
      with no implementation commentary.
    goal: Compress the Thinking aloud answer into its decision, premise, trade-off,
      and verification step.
  best_answer: Sure. I am setting up the map first so lookups are constant, then the
    outer loop walks the array once. Right here I am deliberately checking the complement
    before inserting, otherwise an element could pair with itself.
  distractors:
  - text: Okay so now I type the map, and then I type the for loop, and then inside
      the loop I type the if statement, and now I am typing the return at the end
      of the function.
    trap: precision
    why_wrong: Narrating keystrokes carries no information. The interviewer can see
      the screen; what they cannot see is why.
  - text: Yeah sure no worries, so basically I am just gonna throw a map in here real
      quick and then kinda loop over the thing and see what sticks, and that should
      pretty much do it.
    trap: register
    why_wrong: Casual filler and "see what sticks" suggest improvisation rather than
      a considered plan.
  - text: I am putting the map for make the search faster and after I pass in all
      the elements of the array for see if the complement is existing there before
      to insert it.
    trap: grammar
    why_wrong: '"For make", "for see" and "before to insert" are infinitive-of-purpose
      errors carried over from Portuguese.'
  feedback:
    register: Professional but relaxed. Contractions are fine; "gonna" and "kinda"
      are not.
    hedging: Narration rarely needs hedges. Say what you are doing and why.
    precision: Explain decisions, not keystrokes. The word "otherwise" is doing the
      real work in the strong answer.
    grammar: Purpose takes "to make" or "in order to make", never "for make".
    pragmatics: Match the requested behaviour immediately; the interviewer asked for
      commentary, so give it without discussion.
  rephrase:
    prompt: Narrate the same three lines again, but justify one decision with the
      word "because".
    goal: Convert description into reasoning.
  language_focus:
  - precision
  - register
  - grammar
  pt_help: Finalidade em ingles usa "to" ou "in order to". "For + verbo" e o erro
    mais comum de brasileiros em entrevista.
  feynman:
    concept: Commentary as evidence of reasoning during live coding.
    explain_to: An engineer who codes brilliantly but silently.
    constraint: Explain using a chef describing choices, not movements.
    self_check: Would a listener who could not see the screen learn anything?
    reasoning_check: Can you identify the hidden premise behind Thinking aloud, give
      a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You went quiet, or narrated what was visible on screen.
    expected: Spoken reasons for decisions, especially rejected alternatives.
    actual: Silence, keystroke narration, or filler.
    root_cause: Speaking and coding compete for working memory in a second language.
    repair: Practise narrating only at decision points, not continuously.
    reasoning_error: If your Thinking aloud answer failed, classify the mistake as
      a fact, assumption, comparison, failure, or certainty error before proposing
      the smallest repair.
  recall:
    active_recall_cue: What separates useful narration from keystroke narration?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Thinking aloud without presenting
      an assumption as a fact?
    black_box_probe: When the Thinking aloud answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: dsa-09-whiteboard-thinking-aloud-delayed-9
      prompt: 'Thinking aloud: the later Thinking aloud review says a measured Thinking
        aloud comparison shows the alternative has a different Thinking aloud cost
        profile. Under new Thinking aloud evidence contradicts the Thinking aloud
        assumption that made the first option attractive, which part of Thinking aloud
        survives and which Thinking aloud claim changes?'
      changed_constraint: new Thinking aloud evidence contradicts the Thinking aloud
        assumption that made the first option attractive
      new_evidence: a measured Thinking aloud comparison shows the alternative has
        a different Thinking aloud cost profile
      best_answer: I would keep the facts that remain supported about Thinking aloud,
        treat a measured Thinking aloud comparison shows the alternative has a different
        Thinking aloud cost profile as new evidence rather than a result, and state
        the updated decision rule under new Thinking aloud evidence contradicts the
        Thinking aloud assumption that made the first option attractive. I would then
        name one focused check before treating the revised answer as settled.
      distractors:
      - text: I would preserve every part of the original Thinking aloud answer because
