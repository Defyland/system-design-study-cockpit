- id: dsa-05-clarifying-question
  version: 1.4.0
  target: dsa
  topic: Clarifying the contract
  difficulty: 1
  interview_stage: technical_screen
  template: dsa-narration
  prompt: Do you have any questions before you begin?
  context: The statement says "find the top k items" but never defines tie-breaking
    or whether the input fits in memory. This opening is scored on whether you ask,
    and on how you ask.
  follow_up:
    prompt: What assumption about ordering, duplicates, or empty input would you confirm
      before choosing the algorithm?
    goal: Answer the alternative challenge about Clarifying the contract while keeping
      the evidence boundary explicit.
    challenge_kind: alternative
    best_answer: >-
      Two things, if you do not mind. I would compare that choice with the
      credible alternative against the requirement in the follow-up, cost, and failure risk, then switch
      only if evidence makes the alternative safer.
    distractors:
    - text: I would defend the first Clarifying the contract option because offering
        an alternative might make the decision look uncertain.
      why_wrong: A comparison makes the decision rule visible; it does not weaken
        a well-calibrated recommendation.
    - text: I would list every conceivable Clarifying the contract design without
        saying which requirement should decide between them.
      why_wrong: An option list without a decision rule avoids the trade-off the follow-up
        is testing.
  compression:
    prompt: Reduce your clarifying questions to the contract, the edge case that changes
      the plan, and the expected bound.
    goal: Compress the Clarifying the contract answer into its decision, premise,
      trade-off, and verification step.
  best_answer: Two things, if you do not mind. First, how should I break ties when
    two items have the same count, by insertion order or by value? Second, can I assume
    the input fits comfortably in memory, or should I design for a stream?
  distractors:
  - text: No questions, the statement seems clear enough and I would rather start
      writing code now so I do not lose time. We can deal with edge cases later if
      they come up.
    trap: pragmatics
    why_wrong: Declining the invitation forfeits easy signal, and the tie-breaking
      rule genuinely changes the data structure.
  - text: Sorry, could you just possibly clarify a little bit what you actually mean
      by top, because I am not completely certain I have understood the question properly
      at all?
    trap: hedging
    why_wrong: Over-apologetic stacking makes a reasonable question sound like confusion
      about the entire problem.
  - text: I need you to tell me the tie-breaking rule and confirm the input size before
      I start, otherwise I cannot be expected to produce a correct solution in the
      time available.
    trap: register
    why_wrong: Demanding rather than asking inverts the dynamic of the round and reads
      as inflexible.
  feedback:
    register: Polite and efficient. "If you do not mind" is enough softening for a
      direct request.
    hedging: Hedge the request, never the content of the question itself.
    precision: Ask about the two unknowns that change your design, not about trivia.
    grammar: 'Embedded questions keep statement order: "how I should break ties" when
      embedded, not "how should I break ties".'
    pragmatics: Numbering your questions ("two things") helps the interviewer track
      you.
  rephrase:
    prompt: Ask the same two questions in a single sentence without sounding rushed.
    goal: Compress requests while keeping politeness intact.
  language_focus:
  - pragmatics
  - hedging
  - register
  feynman:
    concept: Requirement clarification as design input, not as politeness.
    explain_to: A candidate who thinks questions look like weakness.
    constraint: Use only the top-k example, no abstractions.
    self_check: Can you name how each answer would change your data structure?
    reasoning_check: Can you identify the hidden premise behind Clarifying the contract,
      give a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You said "no questions" or asked something that changed nothing.
    expected: Two questions whose answers alter the design.
    actual: Silence, or a vague request to restate the problem.
    root_cause: Treating questions as risk rather than as the cheapest signal in the
      round.
    repair: 'Keep two default questions ready: tie-breaking and input size.'
    reasoning_error: If your Clarifying the contract answer failed, classify the mistake
