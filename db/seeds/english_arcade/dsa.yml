- id: dsa-04-ruby-default-trap
  version: 1.4.0
  target: dsa
  topic: Ruby runtime traps
  difficulty: 3
  interview_stage: live_coding
  template: dsa-recovery
  prompt: Your counter hash is behaving oddly on the second test. What do you think
    is happening?
  context: You wrote a frequency counter with a default value and then mutated that
    default. Every key now shares one object, and the interviewer is watching how
    you diagnose it in English.
  follow_up:
    prompt: Why might a default-valued counter hide whether a key was absent, and
      what test would distinguish those states?
    goal: Answer the evidence challenge about Ruby runtime traps while keeping the
      evidence boundary explicit.
    challenge_kind: evidence
    best_answer: >-
      I passed a single default object to the hash, so every missing key hands
      back that same array and my pushes all land in one place. I would
      treat the follow-up observation as evidence, not as proof of impact; I would inspect
      the smallest relevant trace or test and state what remains uncertain before changing the
      decision.
    distractors:
    - text: I would cite my experience with Ruby runtime traps as enough proof and
        move on without naming an observation.
      why_wrong: Experience can guide a hypothesis, but it does not replace evidence
        tied to this context.
    - text: I would collect every possible metric about Ruby runtime traps before
        making even a provisional recommendation.
      why_wrong: A focused decision can start with one discriminating observation
        rather than an unbounded data request.
  compression:
    prompt: Rephrase the Ruby counter diagnosis as symptom, language behavior, and
      a focused regression test.
    goal: Compress the Ruby runtime traps answer into its decision, premise, trade-off,
      and verification step.
  best_answer: I passed a single default object to the hash, so every missing key
    hands back that same array and my pushes all land in one place. I should use the
    block form instead, which builds a fresh array per key and assigns it, so each
    key gets its own storage.
  distractors:
  - text: Ruby is caching the hash somewhere between the two test runs, so state from
      the first case is leaking into the second. I would reset the variable at the
      start of the method to clear it.
    trap: content
    why_wrong: Misdiagnoses shared object identity as cross-run caching, which sends
      the fix in the wrong direction entirely.
  - text: There is something strange going on with the hash, it is not doing what
      I expected it to do at all, and I am not entirely sure why that would be happening
      in this particular situation.
    trap: precision
    why_wrong: Names no mechanism. At C2 the expected move is to describe the cause,
      not the symptom.
  - text: I am so sorry, this is really embarrassing, I completely messed this up
      and should have seen it immediately, I apologise, let me try to fix it quickly
      and hopefully it works this time.
    trap: register
    why_wrong: Repeated apology shifts the round from technical to emotional and wastes
      the recovery window.
  feedback:
    register: Own the bug once, in neutral language, then move straight to the mechanism.
    hedging: '"I think what is happening is" is the right amount of hedge while diagnosing
      live.'
    precision: Say "the same object" rather than "it is weird"; identity is the actual
      cause.
    grammar: Present continuous fits a live symptom ("my pushes are landing"); simple
      present fits the rule.
    pragmatics: Diagnose, propose the fix, re-run. Apologising is not one of the steps.
  rephrase:
    prompt: Explain the same bug to a teammate in a pull request comment, in two sentences.
    goal: Shift from spoken diagnosis to concise written register.
  language_focus:
  - precision
  - register
  - grammar
  pt_help: '"Vergonha" nao cabe aqui. Em ingles tecnico, assuma o erro uma vez e siga
    para a causa.'
  feynman:
    concept: Shared default object versus a per-key default block.
    explain_to: A developer who has only used languages with value defaults.
    constraint: Explain it using one shared notebook handed to many people.
    self_check: Did you explain why the block form fixes it, not just that it does?
    reasoning_check: Can you identify the hidden premise behind Ruby runtime traps,
      give a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You described the symptom or apologised instead of diagnosing.
    expected: Name shared object identity as the cause, then the block-form fix.
    actual: A vague "it is weird" reaction, or an unrelated caching theory.
    root_cause: Under pressure the vocabulary for object identity is missing, so the
      answer defaults to emotion or vagueness.
    repair: Drill the sentence "every key is handed back the same object" until it
      arrives before the apology does.
    reasoning_error: If your Ruby runtime traps answer failed, classify the mistake
      as a fact, assumption, comparison, failure, or certainty error before proposing
      the smallest repair.
  recall:
    active_recall_cue: Why does a hash default object get shared across keys?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Ruby runtime traps without
