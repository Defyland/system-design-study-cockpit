- id: dsa-08-scaling-followup
  version: 1.4.0
  target: dsa
  topic: Scaling follow-up
  difficulty: 3
  interview_stage: deep_dive
  template: dsa-narration
  prompt: Now suppose the input does not fit on one machine. What changes?
  context: The classic final follow-up. The interviewer wants to see whether you can
    move from an in-memory algorithm to a distributed framing without abandoning the
    reasoning you already established.
  follow_up:
    prompt: What partitioning or approximation would you introduce when the input
      exceeds memory, and how would you validate its error or merge cost?
    goal: Answer the assumption challenge about Scaling follow-up while keeping the
      evidence boundary explicit.
    challenge_kind: assumption
    best_answer: >-
      The counting stays the same, but it moves. I would label the follow-up premise
      as an assumption, ask the smallest question that could disprove it, and protect the
      edge case before committing to the recommendation.
    distractors:
    - text: I would repeat my original Scaling follow-up answer with more confidence
        because the interviewer probably assumes the usual case.
      why_wrong: It hides the premise instead of checking whether the usual case is
        actually part of this problem.
    - text: I would stop proposing anything about Scaling follow-up until every surrounding
        requirement had been documented in full.
      why_wrong: It treats uncertainty as a reason for paralysis and offers no bounded
        next step.
  compression:
    prompt: 'Explain the scale-up plan in three parts: state placement, work per partition,
      and the failure you would monitor.'
    goal: Compress the Scaling follow-up answer into its decision, premise, trade-off,
      and verification step.
  best_answer: The counting stays the same, but it moves. I would partition by key
    so every occurrence of a value lands on the same node, count locally, then merge
    the per-node top k. The merge is only correct because counts for a key are never
    split across partitions.
  distractors:
  - text: I would use a distributed system, probably a big data framework, and it
      would handle the partitioning and shuffling automatically, so the algorithm
      would not really need to change much at all.
    trap: precision
    why_wrong: Names a category of tool instead of the property that makes the merge
      correct, which is the actual answer.
  - text: That is a very good question, and honestly it is quite a big topic. There
      are many possible approaches and it would depend on a lot of factors that we
      have not discussed here.
    trap: pragmatics
    why_wrong: Flattery plus deferral fills time without answering, which is immediately
      visible to an experienced interviewer.
  - text: You will have to split the data in several machines and each machine makes
      the count of its part, and in the final you join all the counts for to know
      which are the top ones.
    trap: grammar
    why_wrong: '"Split in", "in the final" and "for to know" are L1 transfer errors
      that mark the answer as non-native under pressure.'
  feedback:
    register: Keep the measured register you used for the single-machine answer.
    hedging: No hedge is needed on partitioning by key; it is the standard correct
      move.
    precision: The load-bearing sentence is why the merge is safe, not which framework
      you would pick.
    grammar: Use "partition by key", "split across machines" and "in the end".
    pragmatics: Connect back to your earlier solution rather than restarting from
      zero.
  rephrase:
    prompt: Explain the same design to a product manager who does not know what partitioning
      is.
    goal: Test whether precision survives a change of audience.
  language_focus:
  - precision
  - grammar
  - pragmatics
  feynman:
    concept: Partition-then-merge and the key-locality property.
    explain_to: An operations manager counting votes across regions.
    constraint: Use a national election count as the only example.
    self_check: Did you say why the merge cannot double count?
    reasoning_check: Can you identify the hidden premise behind Scaling follow-up,
      give a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You named a tool instead of a correctness property.
    expected: Partition by key, count locally, merge, plus why that is safe.
    actual: A framework name, or deferral dressed as nuance.
    root_cause: Reaching for vocabulary that sounds senior instead of the reasoning
      that is senior.
    repair: Practise finishing distributed answers with "this is correct because".
    reasoning_error: If your Scaling follow-up answer failed, classify the mistake
      as a fact, assumption, comparison, failure, or certainty error before proposing
      the smallest repair.
  recall:
    active_recall_cue: Why must all occurrences of a key land on the same partition?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Scaling follow-up without
      presenting an assumption as a fact?
    black_box_probe: When the Scaling follow-up answer failed, did you locate the
      reasoning error before changing the implementation?
    delayed_variant:
      id: dsa-08-scaling-followup-delayed-8
      prompt: A second pass on Scaling follow-up finds a code inspection of Scaling
        follow-up confirms the Scaling follow-up mechanism but not its impact; with
        the Scaling follow-up dependency is slower for Scaling follow-up and the failure
        is ambiguous rather than explicit, which Scaling follow-up test would you
        run before keeping the original rule?
      changed_constraint: the Scaling follow-up dependency is slower for Scaling follow-up
        and the failure is ambiguous rather than explicit
      new_evidence: a code inspection of Scaling follow-up confirms the Scaling follow-up
        mechanism but not its impact
      best_answer: I would keep the facts that remain supported about Scaling follow-up,
        treat a code inspection of Scaling follow-up confirms the Scaling follow-up
        mechanism but not its impact as new evidence rather than a result, and state
        the updated decision rule under the Scaling follow-up dependency is slower
        for Scaling follow-up and the failure is ambiguous rather than explicit. I
        would then name one focused check before treating the revised answer as settled.
      distractors:
      - text: I would preserve every part of the original Scaling follow-up answer
          because changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Scaling follow-up explanation with a new
          design without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
