- id: dsa-03-complexity-defence
  version: 1.4.0
  target: dsa
  topic: Complexity
  difficulty: 2
  interview_stage: live_coding
  template: dsa-narration
  prompt: You said linear time. Can you defend that, including the space you are using?
  context: Your solution passes the examples. The interviewer wants the cost analysis
    stated cleanly, including the part candidates usually skip, which is the memory
    the hash occupies.
  follow_up:
    prompt: If the interviewer asks for a one-pass solution with constant auxiliary
      space, what lower bound or trade-off would you explain?
    goal: Answer the assumption challenge about Complexity while keeping the evidence
      boundary explicit.
    challenge_kind: assumption
    best_answer: >-
      Each index is visited at most twice, once by each pointer, so time is
      linear in the length of the input. I would label the follow-up premise as
      an assumption, ask the smallest question that could disprove it, and protect the edge
      case before committing to the recommendation.
    distractors:
    - text: I would repeat my original Complexity answer with more confidence because
        the interviewer probably assumes the usual case.
      why_wrong: It hides the premise instead of checking whether the usual case is
        actually part of this problem.
    - text: I would stop proposing anything about Complexity until every surrounding
        requirement had been documented in full.
      why_wrong: It treats uncertainty as a reason for paralysis and offers no bounded
        next step.
  compression:
    prompt: Give the complexity defence as one bound for time, one bound for space,
      and one qualification about the input.
    goal: Compress the Complexity answer into its decision, premise, trade-off, and
      verification step.
  best_answer: Each index is visited at most twice, once by each pointer, so time
    is linear in the length of the input. Space is bounded by the number of distinct
    values in the window rather than the whole array, so worst case it is also linear,
    and that worst case is an array with no repeats.
  distractors:
  - text: It is O of n because we only have one loop in the code, and the space is
      O of one because I am only using a single hash variable rather than creating
      any new arrays inside the function.
    trap: content
    why_wrong: Counting loops is not analysis, and a hash that grows with the input
      is not constant space. The claim is simply false.
  - text: I would say it is probably around linear, more or less, although it might
      depend a bit on the data and on how Ruby handles the hash, so I would not want
      to commit to a firm number here.
    trap: hedging
    why_wrong: Complexity is a commitment. Hedging the bound itself reads as not knowing
      it.
  - text: The complexity is linear. Next question. I do not think there is anything
      else worth adding about memory because everyone uses a hash for this and it
      is completely standard practice.
    trap: pragmatics
    why_wrong: The interviewer explicitly asked about space, so skipping it ignores
      the actual request.
  feedback:
    register: Confident and factual. Complexity is one of the few places where flat
      assertion is the correct register.
    hedging: Hedge the worst case if it is genuinely data-dependent, never the bound
      itself.
    precision: Say what the bound is in terms of, such as distinct values in the window,
      rather than a vague "n".
    grammar: Read complexity aloud as "O of n" or "linear in n"; both are natural,
      "O n" alone is not.
    pragmatics: Cover both axes the question named, time and space, in the order asked.
  rephrase:
    prompt: Give the same analysis but name the worst-case input explicitly in your
      first sentence.
    goal: Practise leading with the case that stresses the bound.
  language_focus:
  - precision
  - hedging
  - pragmatics
  feynman:
    concept: Auxiliary space of a sliding window versus input size.
    explain_to: A developer who believes two passes means quadratic time.
    constraint: No formulas; use counting visits per element only.
    self_check: Can you name the input that makes the memory peak, in one phrase?
    reasoning_check: Can you identify the hidden premise behind Complexity, give a
      counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You gave a bound without the space half, or hedged the bound.
    expected: Time and space, each with the reason and the worst case.
    actual: A partial or over-hedged claim, or loop-counting as analysis.
    root_cause: Treating complexity as a label recalled from practice rather than
      a claim derived from visits and storage.
    repair: 'Practise the two-sentence form: visits per element for time, what grows
      for space.'
    reasoning_error: If your Complexity answer failed, classify the mistake as a fact,
      assumption, comparison, failure, or certainty error before proposing the smallest
      repair.
  recall:
    active_recall_cue: What input makes the auxiliary space of a sliding window peak?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Complexity without presenting
      an assumption as a fact?
    black_box_probe: When the Complexity answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: dsa-03-complexity-defence-delayed-3
      prompt: New evidence about Complexity says a code inspection of Complexity confirms
        the Complexity mechanism but not its impact; with the Complexity dependency
        is slower for Complexity and the failure is ambiguous rather than explicit,
        how do you update the Complexity decision rule?
      changed_constraint: the Complexity dependency is slower for Complexity and the
        failure is ambiguous rather than explicit
      new_evidence: a code inspection of Complexity confirms the Complexity mechanism
        but not its impact
      best_answer: I would keep the facts that remain supported about Complexity,
        treat a code inspection of Complexity confirms the Complexity mechanism but
        not its impact as new evidence rather than a result, and state the updated
        decision rule under the Complexity dependency is slower for Complexity and
        the failure is ambiguous rather than explicit. I would then name one focused
        check before treating the revised answer as settled.
      distractors:
      - text: I would preserve every part of the original Complexity answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Complexity explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
