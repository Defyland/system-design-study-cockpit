---
contract_version: 1.4.0
target:
  key: dsa
  label: DSA and Algorithms
  blurb: Say the pattern, state the invariant, defend the complexity. In an English
    interview the reasoning is graded before the code is.
  focus_areas:
  - pattern selection and naming
  - invariants and loop reasoning
  - complexity and trade-off language
  - Ruby runtime traps
  - thinking aloud under time pressure
  simulation:
    minutes: 45
    structure:
    - label: Clarify and restate
      minutes: 5
    - label: Name the pattern and the invariant
      minutes: 5
    - label: Code while narrating
      minutes: 20
    - label: Test, trace and fix out loud
      minutes: 10
    - label: Complexity and scaling follow-up
      minutes: 5
  critical_thinking:
    learner_prompts:
      evidence_ledger: For DSA live coding, record whether each claim about the input
        contract, invariant, complexity, and edge case is a verified fact, an inference,
        an assumption, or an unknown before you defend it.
      problem_frame: Frame every DSA live coding answer with the actor, requirement,
        constraint, success condition, and unanswered question that could change the
        decision.
      comparison: When DSA live coding offers a real choice, compare two options by
        benefit, cost or risk, valid-when condition, and an explicit decision rule.
      failure_probe: Ask which counterexample, edge case, or failure mode could break
        the DSA live coding recommendation, then state the smallest test or containment
        step.
      certainty_review: 'Calibrate certainty in DSA live coding: name the evidence,
        separate correlation from causality, and say what new observation would make
        you revise the answer.'
    rubric:
      facts_correct: Names the verified the input contract, invariant, complexity,
        and edge case facts without smuggling in a result or capability that the prompt
        does not establish.
      assumptions_explicit: Labels the DSA live coding premise that is still assumed
        and asks the smallest clarifying question that matters.
      alternatives_considered: Considers a credible alternative for DSA live coding,
        or explains the hard constraint that makes comparison a false equivalence.
      tradeoff_quality: Connects the DSA live coding choice to a benefit, a cost or
        risk, and the condition under which another choice wins.
      follow_up_adaptation: Responds to an adversarial DSA live coding follow-up by
        changing the claim or evidence boundary rather than repeating a memorised
        answer.
      certainty_calibration: Uses high, medium, or low certainty deliberately and
        names the evidence that would update the DSA live coding recommendation.
templates:
- id: dsa-narration
  label: DSA narration template
  applies_to: live_coding
  steps:
  - Restate the problem and confirm the input contract.
  - Name the pattern out loud and say why it fits this input.
  - State the invariant the loop or recursion preserves.
  - Code while narrating decisions, not keystrokes.
  - Trace one small example including an edge case.
  - Give time and space complexity and name the dominant term.
  source:
    repo: system-design-estudos
    path: areas/01-metodo-e-entrevistas/backend-interview-foundations/chapters/01-dsa-operating-system-and-pattern-selection.md
    note: Pattern-selection chapter this narration order is built on.
- id: dsa-recovery
  label: Mid-problem recovery template
  applies_to: live_coding
  steps:
  - Say plainly that you found a problem, without apologising twice.
  - Name the failing case concretely.
  - State the smallest fix you believe is correct.
  - Re-trace and confirm the invariant still holds.
  source:
    repo: system-design-estudos
    path: areas/01-metodo-e-entrevistas/snippets/senior-production-answer-template.md
    note: Impact-first recovery order reused for live-coding mistakes.
cards:
- id: dsa-card-pattern-first
  front: How do you open a live-coding answer in English?
  back: I open by naming the pattern, explaining why the input shape fits it, and stating
    the invariant I will preserve. I write code only after the interviewer can follow
    that plan.
  box: 1
  source:
    repo: system-design-estudos
    path: areas/01-metodo-e-entrevistas/backend-interview-foundations/chapters/01-dsa-operating-system-and-pattern-selection.md
    note: Opening-minute discipline for algorithm rounds.
  critical_thinking:
    cue: How do you open a live-coding answer in English? Name the input shape, the
      pattern it suggests, and the invariant you will check before writing code.
    check: Can you explain when a simpler scan would win, name the failure a wrong
      pattern choice would cause, and say which input trace would change your mind?
- id: dsa-card-invariant
  front: What counts as an invariant rather than a description of the loop?
  back: I call a property an invariant only when it is true at the same boundary of
    every iteration. I distinguish that proof obligation from control flow such as
    moving a pointer or updating a result.
  box: 1
  source:
    repo: system-design-estudos
    path: areas/01-metodo-e-entrevistas/backend-interview-foundations/chapters/02-dsa-core-problems-in-ruby-and-typescript.md
    note: Core problems where invariants are stated explicitly.
  critical_thinking:
    cue: What counts as an invariant rather than a description of the loop? State what
      must be true before and after processing [a,b,a], then identify the repair.
    check: Can you compare a last-index window with a nested scan, name the duplicate
      case that breaks a careless update, and state the assertion you would trace?
- id: dsa-card-hedging
  front: How much hedging belongs in a complexity claim?
  back: >-
    I state a proven bound directly. I hedge only the data-dependent part, for example:
    the scan is linear in n, with the worst input filling the auxiliary map.
  box: 2
  source:
    repo: original
    path: english-arcade/dsa/hedging-calibration
    note: Distilled from the hedging failures authored in this pack.
  critical_thinking:
    cue: How much hedging belongs in a complexity claim? Separate the proven bound
      from the input-dependent worst case before you qualify either one.
    check: Can you compare a precise bound with an unsupported guarantee, name the
      input that fills auxiliary state, and say what measurement would expose a bad
      complexity claim?
items:
- id: dsa-01-pattern-naming
  version: 1.4.0
  target: dsa
  topic: Pattern selection
  difficulty: 1
  interview_stage: live_coding
  template: dsa-narration
  prompt: Before you start coding, can you tell me how you are thinking about this
    one?
  context: Live coding round. You have an array of integers and need the longest run
    of distinct values. The interviewer wants the approach spoken before any syntax
    appears on screen.
  follow_up:
    prompt: Suppose the array arrives in chunks and you cannot store every previous value.
      Which invariant survives, what state would you bound, and when would you say the
      problem no longer has the same contract?
    goal: Defend the sliding-window invariant under a memory constraint and identify the
      point where an exact answer requires a clarified contract.
    challenge_kind: failure
    best_answer: >-
      The sliding-window invariant survives only if the stream has a finite retention rule or
      the task allows an approximate answer. For an exact longest run, I need the last position
      of each value in the active window; if distinct values can grow without bound, the memory
      limit makes the original contract impossible. I would ask whether eviction or approximation
      is acceptable and test a repeated-value boundary case before coding.
    distractors:
    - text: I would keep only the current chunk and assume the longest run cannot cross a
        chunk boundary, because bounded memory is more important than the original answer.
      why_wrong: It silently changes the input contract and can miss a valid run spanning chunks.
    - text: I would store every value anyway and call the solution bounded because each chunk
        arrives separately.
      why_wrong: Chunking does not bound the number of distinct values, so the stated memory
        constraint remains unsatisfied.
    answer_anchors:
    - Keep the window invariant only while the stream retention or approximation contract is explicit.
    - Exact tracking needs the last position of each value in the active window.
    - Ask whether eviction or approximation is acceptable when distinct state can grow without bound.
  compression:
    prompt: Compress your opening into the pattern, the maintained state, and the
      condition that moves the left edge.
    goal: Compress the Pattern selection answer into its decision, premise, trade-off,
      and verification step.
  best_answer: This looks like a sliding-window problem, because the answer is a contiguous
    run and I can extend the right edge and pull the left edge in when a duplicate
    appears. I would keep a hash of the last index of each value, so shrinking is
    one jump rather than a scan.
  distractors:
  - text: I think maybe it could possibly be some kind of window thing, if that makes
      sense, but I am not really sure yet, so perhaps I could just try something and
      we can see how it goes from there.
    trap: hedging
    why_wrong: Stacked hedges read as low confidence. One hedge is fine at C2; four
      in a row signals you have no plan.
  - text: Obviously it is a sliding window. Anyone who has done these knows that immediately,
      so I will just write it. There is not much to discuss about the approach here
      before the code.
    trap: register
    why_wrong: Dismissive framing closes the conversation the interviewer opened and
      makes a collaborative round feel adversarial.
  - text: I am going to make a window that walks in the array and every time it has
      a repeated it comes back the left for to remove the repeated value until the
      window stays clean again for continue.
    trap: grammar
    why_wrong: Preposition and infinitive errors ("walks in", "for to remove") come
      straight from Portuguese and pull attention away from correct logic.
  feedback:
    register: 'Neutral professional register: confident, collaborative, no slang and
      no showing off.'
    hedging: One calibrated hedge such as "this looks like" keeps you open to correction
      without sounding lost.
    precision: Name the pattern and the data structure. "Hash of the last index" is
      precise; "some kind of map" is not.
    grammar: '"Walks through the array" and "in order to remove" are the natural collocations;
      avoid the Portuguese "for to" pattern.'
    pragmatics: The interviewer asked how you are thinking, so lead with approach
      rather than code or a verdict on difficulty.
  rephrase:
    prompt: Say the same approach again in two sentences, as if the interviewer had
      just told you there is only a minute left.
    goal: Compress without losing the pattern name or the invariant.
  language_focus:
  - hedging
  - precision
  - register
  pt_help: '"Sliding window" nao se traduz em entrevista. Diga o nome em ingles e
    explique o porque.'
  feynman:
    concept: Maintaining a contiguous run while preserving a uniqueness invariant.
    explain_to: A junior developer who has never heard the term "window".
    constraint: Explain why the left boundary moves, why the last position is enough for
      this predicate, and when a nested scan would be an acceptable alternative.
    self_check: Could the listener state the invariant, name a repeated-value counterexample,
      and explain the time and space cost without seeing code?
    reasoning_check: Can you compare the linear window with a simpler quadratic scan, identify
      the input bound that changes the decision, and update the pattern when the predicate changes?
  black_box:
    symptom: You name a sliding window but cannot say what remains true after the left
      boundary moves.
    expected: The answer states the contiguous-run invariant, the stored last position,
      and the condition under which the alternative is acceptable.
    actual: The pattern label appears without an input-contract check, edge-case trace,
      or complexity argument.
    root_cause: The rehearsal memorised a pattern name instead of testing whether its
      invariant and memory cost fit the actual problem.
    repair: Restate the predicate, trace a repeated value, compare with a bounded nested
      scan, and only then commit to the implementation and complexity.
    reasoning_error: If the choice failed, classify whether the error was a misread fact,
      hidden assumption, invalid comparison, missed failure case, or overconfident bound.
  recall:
    active_recall_cue: Which pattern fits a contiguous run with a uniqueness constraint,
      and what does the hash store?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Pattern selection without
      presenting an assumption as a fact?
    black_box_probe: When the Pattern selection answer failed, did you locate the
      reasoning error before changing the implementation?
    delayed_variant:
      id: dsa-01-pattern-naming-delayed-1
      prompt: On a fresh problem, the interviewer changes the success condition to the
        longest run whose values each occur at most twice, with tests for an empty array
        and [7, 7, 7]. What carries over from your reasoning, and what would you re-check
        before claiming linear time?
      changed_constraint: The target run now allows each value at most twice, and the answer
        must handle an empty input and a value occurring three times.
      new_evidence: The interviewer supplies the edge cases [] and [7, 7, 7] and defines the
        required predicate as frequency at most two within the run.
      best_answer: The contiguous-window idea and the need to move the left edge when the
        invariant breaks still carry over. I would revise the invariant to every value having
        count at most two, maintain counts rather than only last positions, and explicitly
        trace [] and [7, 7, 7]. I would then re-check that each value enters and leaves the
        window a bounded number of times before claiming linear time.
      distractors:
      - text: I would keep the uniqueness invariant and reject [7, 7, 7] as invalid input,
          because the original problem only allowed distinct values in a run.
        why_wrong: The new success condition permits two copies and explicitly requires the
          triple-occurrence edge case to be handled.
      - text: I would claim linear time immediately because every sliding-window problem has
          the same complexity, without tracing the count updates.
        why_wrong: Complexity depends on the actual state transitions and implementation, not
          on the pattern name alone.
      answer_anchors:
      - Keep contiguity and the moving boundary, but revise uniqueness to a count-at-most-two invariant.
      - Trace empty input and a triple occurrence before claiming the new predicate is handled.
      - Verify bounded entry and exit work for each value before asserting linear time.
      reasoning_moves:
        preserve: Keep the contiguous-window structure and move the left edge when the invariant breaks.
        revise: Replace uniqueness and last-position state with a frequency-at-most-two invariant and counts.
        verify: Trace empty input and a triple occurrence, then count each value's entry and exit operations.
        certainty_update: Claim linear time only after the revised count transitions are checked against the new predicate.
  sources:
  - repo: system-design-estudos
    path: areas/01-metodo-e-entrevistas/backend-interview-foundations/chapters/01-dsa-operating-system-and-pattern-selection.md
    note: Pattern selection and naming discipline for the opening minute.
  - repo: original
    path: english-arcade/dsa/pattern-naming
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: The interviewer says the input is always at most 20 values but asks for the
      clearest implementation. Would you still choose the same approach, and what would
      you test before defending the complexity claim?
    goal: Compare a linear window with a simpler bounded-input alternative and make the
      decision rule depend on an explicit constraint.
  critical_thinking:
    problem_frame: Frame a live-coding answer for a contiguous longest-distinct-run problem;
      the decision must preserve order, state an invariant, and respect the input and memory bounds.
    claim_map:
      fact: The input is an array of integers and the required result is the longest contiguous
        run containing no repeated value.
      inference: A last-position map can move the left boundary directly and support linear
        traversal, but that does not make it the only correct implementation.
      assumption: The input may be large enough that quadratic work is undesirable; ask for the
        size bound and whether extra memory is acceptable.
      unknown: The actual input bound, memory limit, mutation policy, and expected proof depth are
        not specified by the opening question.
    comparison:
      applicable: true
      alternatives:
      - option: Sliding window with a last-position map.
        benefit: It preserves contiguity and moves the left boundary directly, giving linear
          traversal for the stated predicate.
        cost_or_risk: It uses extra space proportional to distinct values and requires a clearly
          stated invariant to avoid stale indices.
        valid_when: The input can be large, original order matters, and linear time justifies the
          additional state.
      - option: Nested scan with a fresh set from each start index.
        benefit: It is straightforward to prove and can be the clearest baseline for a very small,
          explicitly bounded input.
        cost_or_risk: It repeats work and becomes quadratic, so it may fail the time contract as n grows.
        valid_when: The input bound is genuinely small and the interviewer accepts quadratic time
          or wants a simple correctness baseline.
      decision_rule: Ask for the input bound and memory limit; choose the window for scalable linear
        work, or the nested scan only when the small bound makes its simpler proof worth the repeated work.
    failure_probe:
      kind: counterexample
      prompt: Which array would expose a careless left-boundary update that loses a valid run,
        and which invariant or test would reveal the mistake?
    evidence_check:
      basis: Check the invariant, complexity claim, and alternative against the stated array
        contract and the local DSA interview material; record what the examples actually establish.
      source_kind: authored_scenario
      limitation: This exercise can test algorithmic reasoning and communication, but it cannot
        prove performance on an unspecified input distribution or a universal pattern rule.
      checked_on: '2026-08-25'
    certainty:
      level: high
      rationale: Certainty is high about the invariant and its linear implementation under the
        stated predicate, but not about which alternative wins before bounds and memory are known.
      update_trigger: Update the choice when the interviewer supplies a small input bound, a strict
        memory limit, a changed predicate, or a counterexample to the stated invariant.
    rubric:
      facts_correct: States the array contract, contiguous-run requirement, invariant, and
        complexity without importing an unstated scale.
      assumptions_explicit: Names the assumed input bound, memory budget, and mutation policy,
        then asks the smallest question that changes the choice.
      alternatives_considered: Compares a linear last-position window with a nested-scan baseline
        and states when each is valid.
      tradeoff_quality: Connects time, space, proof simplicity, and input bounds to the selected
        pattern instead of treating the label as the reason.
      follow_up_adaptation: Revises the invariant and state when the predicate or memory constraint
        changes, then tests the new edge case before claiming correctness.
      certainty_calibration: Uses high certainty for the stated invariant but qualifies the choice
        until bounds and implementation details are confirmed.
    defense_checks:
    - id: dsa-01-pattern-naming-defense-alternative-boundary
      axis: alternatives
      prompt: If the input bound is tiny, what evidence would justify choosing the nested scan
        instead of the linear window, and what limit would reverse that decision?
      best_answer: I would confirm the bound and accepted complexity, use the nested scan when its
        proof simplicity is worth quadratic work, and switch to the window when growth makes that cost material.
      distractors:
      - text: I would choose the nested scan because a small sample always predicts a small production input.
        why_wrong: A sample does not establish the input bound or protect the decision from later growth.
      - text: I would choose the linear window automatically because quadratic work is never acceptable.
        why_wrong: Complexity is a requirement-dependent trade-off, and a tiny bound may justify a simpler baseline.
- id: dsa-02-invariant-statement
  version: 1.4.0
  target: dsa
  topic: Invariants
  difficulty: 2
  interview_stage: live_coding
  template: dsa-narration
  prompt: What exactly does your loop keep true on every iteration?
  context: You are halfway through a two-pointer solution and the interviewer stops
    you to check whether you can state the property that makes the algorithm correct,
    rather than merely passing the tests.
  follow_up:
    prompt: When the window contains a duplicate, which exact update restores your
      invariant, and how would you demonstrate it on [a,b,a]?
    goal: Answer the new_evidence challenge about Invariants while keeping the evidence
      boundary explicit.
    challenge_kind: new_evidence
    best_answer: >-
      I would set the left boundary to max(left, last_seen[a] + 1) when the second a
      arrives. On [a,b,a], the first window is [a,b], the last index of a is 0, and the
      next left boundary is 1, so [b,a] is distinct; I would trace that update before
      claiming the invariant is restored.
    distractors:
    - text: I would keep the Invariants recommendation unchanged because changing
        position would look inconsistent.
      why_wrong: A defensible answer updates when relevant evidence changes an assumption
        or trade-off.
    - text: I would discard every earlier Invariants claim as soon as one new observation
        appeared.
      why_wrong: New evidence may narrow one claim while leaving other verified facts
        intact.
  compression:
    prompt: State the loop invariant and its repair condition in two sentences, including
      what is true before the next iteration.
    goal: Compress the Invariants answer into its decision, premise, trade-off, and
      verification step.
  best_answer: At the top of every iteration the segment between the two pointers
    holds only distinct values, and everything left of the slow pointer has already
    been counted. That is what lets me move the fast pointer forward without rechecking
    anything behind it.
  distractors:
  - text: The loop keeps going until the end of the array, and each time it checks
      the current element and updates the answer if the answer needs updating, then
      moves forward and repeats that process.
    trap: precision
    why_wrong: This describes control flow, not an invariant. It would stay true of
      almost any loop and proves nothing about correctness.
  - text: Since the beginning the segment between the two pointers is having only
      distinct values and all the values in the left of the slow pointer was already
      counted before we advance the fast one.
    trap: grammar
    why_wrong: '"Is having" misuses a stative verb and "was already counted" breaks
      agreement, undercutting otherwise correct reasoning.'
  - text: Honestly it just works. I have solved this shape of problem plenty of times
      and the invariant is the usual one for two pointers, so I would rather spend
      the time on code than on the proof.
    trap: pragmatics
    why_wrong: Refusing the question loses the exact signal being probed, which is
      whether you reason or pattern-match.
  feedback:
    register: 'Explaining correctness is a senior register moment: measured, specific,
      no appeal to experience alone.'
    hedging: Do not hedge an invariant. It either holds or it does not, so state it
      flatly.
    precision: An invariant is a property true at a fixed point in the loop, not a
      description of what the loop does.
    grammar: Use simple present for invariants ("holds", "have been counted") and
      avoid progressive forms of stative verbs.
    pragmatics: Answer the correctness question directly before returning to the code.
  rephrase:
    prompt: Restate the invariant beginning with "At the top of each iteration" and
      stop after one sentence.
    goal: Force a single precise claim instead of a narration.
  language_focus:
  - precision
  - grammar
  - pragmatics
  feynman:
    concept: Loop invariant as the property that makes an algorithm correct.
    explain_to: A tester who trusts examples more than proofs.
    constraint: Use a queue at a bakery as the only example.
    self_check: Did you state something that stays true, rather than something that
      happens?
    reasoning_check: Can you identify the hidden premise behind Invariants, give a
      counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: Your answer narrated the loop body instead of naming a property.
    expected: A single sentence that is true at a fixed point of each pass.
    actual: A step-by-step retelling of what the code does.
    root_cause: Confusing behaviour with correctness, often because the invariant
      was never made explicit while solving.
    repair: Before coding, write the invariant as one sentence starting "At the top
      of each iteration".
    reasoning_error: If your Invariants answer failed, classify the mistake as a fact,
      assumption, comparison, failure, or certainty error before proposing the smallest
      repair.
  recall:
    active_recall_cue: What is the difference between an invariant and a description
      of the loop body?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Invariants without presenting
      an assumption as a fact?
    black_box_probe: When the Invariants answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: dsa-02-invariant-statement-delayed-2
      prompt: A trace on [a,b,a,c,a] exposes a stale left-boundary update, and the
        interviewer now asks for a proof that the window is distinct after every step.
        What claim would you keep, narrow, and verify?
      changed_constraint: the interviewer requires the distinct-window invariant to be
        demonstrated after every left-boundary repair
      new_evidence: a trace on [a,b,a,c,a] shows the left boundary was not advanced past
        the previous occurrence of a
      best_answer: I would keep the claim that the active window must be distinct, but
        I would retract any promise that a generic pointer move is enough once the trace
        exposes a stale left boundary. I would use last_seen with max(left, index + 1),
        then verify [a,b,a,c,a] with an assertion after every repair before accepting the
        stronger guarantee.
      distractors:
      - text: I would preserve every part of the original Invariants answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Invariants explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/01-metodo-e-entrevistas/backend-interview-foundations/chapters/02-dsa-core-problems-in-ruby-and-typescript.md
    note: Core problem walkthroughs where invariants are made explicit.
  - repo: original
    path: english-arcade/dsa/invariant-statement
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: Trace [a,b,a,c,b] aloud, write the invariant before and after each repair,
      and compare last_seen with set-removal on the same input.
    goal: Defend a distinct-window invariant with a concrete trace, then state the memory
      and proof trade-off that determines the implementation.
  critical_thinking:
    problem_frame: 'I frame the distinct-window proof before discussing code: state
      what is true at the iteration boundary, how a repeated value moves the left edge,
      and which trace can falsify that statement.'
    claim_map:
      fact: The active window is required to contain no repeated value, and the prompt
        asks for the property that makes the two-pointer algorithm correct.
      inference: A last-seen index plus max(left, last_seen[value] + 1) can restore
        that property in one pass, but only if the boundary is never moved backward.
      assumption: I am assuming the result is the longest contiguous distinct run and
        that a map proportional to distinct values is acceptable.
      unknown: The input bound, auxiliary-memory limit, and exact invariant boundary
        the interviewer wants are still unknown.
    comparison:
      applicable: true
      alternatives:
      - option: A last-index window that jumps left past the duplicate.
        benefit: It proves the distinct-window invariant with one monotonic left boundary
          and avoids rescanning.
        cost_or_risk: It stores last positions and is easy to get wrong if an old index
          moves the boundary backward.
        valid_when: Use it when the input can be large and linear traversal is worth
          the map.
      - option: A set with a while-loop that removes values from the left.
        benefit: It makes each removal visible and can be easier to narrate while learning
          the invariant.
        cost_or_risk: It performs more state updates and does not expose the duplicate
          index as directly as last_seen.
        valid_when: Use it when clarity of incremental removal matters and the same
          distinct-window contract still holds.
      decision_rule: I choose the last-index window when its monotonic-boundary invariant
        and memory cost fit; I choose the set-removal version when its simpler trace
        is more valuable, then test [a,b,a] and a later duplicate.
    failure_probe:
      kind: counterexample
      prompt: Trace [a,b,a,c,b]. Which left boundary should follow the second a and
        then b, and what assertion would catch a boundary that moves backward?
    certainty:
      level: high
      rationale: I am highly certain about the invariant and the max update under the
        stated predicate; the implementation choice remains conditional on bounds and
        memory.
      update_trigger: Update when a trace shows a stale left boundary, the interviewer
        forbids the map, or the result contract is no longer a longest contiguous distinct
        run.
    rubric:
      facts_correct: States the distinct-window invariant at a fixed iteration boundary
        and applies it to the repeated-value trace.
      assumptions_explicit: Names the assumed result contract and map budget instead
        of treating the sliding window as automatic.
      alternatives_considered: Compares last-index jumps with set-based removals and
        says when each preserves the contract.
      tradeoff_quality: Connects proof simplicity, pointer movement, map space, and
        the trace that can invalidate the choice.
      follow_up_adaptation: Changes the update or recommendation when a later duplicate
        or memory constraint appears.
      certainty_calibration: Uses high confidence for the invariant while reserving
        the broader design choice for bound and trace evidence.
    evidence_check:
      basis: Check the distinct-window invariant, last-seen update, and input/memory
        bounds against system-design-estudos/areas/01-metodo-e-entrevistas/backend-interview-foundations/chapters/02-dsa-core-problems-in-ruby-and-typescript.md
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: This exercise can test the invariant and trace, but it cannot prove
        performance for an unspecified input distribution or memory limit.
      checked_on: '2026-08-25'
- id: dsa-03-complexity-defence
  version: 1.4.0
  target: dsa
  topic: Complexity
  difficulty: 2
  interview_stage: live_coding
  template: dsa-narration
  prompt: You said linear time. Can you defend that, including the space you are using?
  context: Your solution passes the examples. The interviewer wants the cost analysis
    stated cleanly, including the part candidates usually skip, which is the memory
    the hash occupies.
  follow_up:
    prompt: If the interviewer asks for a one-pass solution with constant auxiliary
      space, what lower bound or trade-off would you explain?
    goal: Answer the assumption challenge about Complexity while keeping the evidence
      boundary explicit.
    challenge_kind: assumption
    best_answer: >-
      I would explain that an exact one-pass distinctness check needs enough state to
      remember which values have appeared, so constant auxiliary space forces a
      different cost or a weaker contract. I would ask whether the input is bounded or
      whether sorting and a second pass are acceptable, then defend the choice against
      that answer.
    distractors:
    - text: I would repeat my original Complexity answer with more confidence because
        the interviewer probably assumes the usual case.
      why_wrong: It hides the premise instead of checking whether the usual case is
        actually part of this problem.
    - text: I would stop proposing anything about Complexity until every surrounding
        requirement had been documented in full.
      why_wrong: It treats uncertainty as a reason for paralysis and offers no bounded
        next step.
  compression:
    prompt: Give the complexity defence as one bound for time, one bound for space,
      and one qualification about the input.
    goal: Compress the Complexity answer into its decision, premise, trade-off, and
      verification step.
  best_answer: >-
    I count each pointer's total movement rather than multiplying the loops: the right
    index advances n times and the left index never moves backward, so time is O(n). The
    last-index map stores at most one entry per distinct value, so auxiliary space is
    O(n) in the no-repeat case. If constant auxiliary space is mandatory, I would explain
    the slower comparison or sorting trade-off and ask which constraint is negotiable.
  distractors:
  - text: It is O of n because we only have one loop in the code, and the space is
      O of one because I am only using a single hash variable rather than creating
      any new arrays inside the function.
    trap: content
    why_wrong: Counting loops is not analysis, and a hash that grows with the input
      is not constant space. The claim is simply false.
  - text: I would say it is probably around linear, more or less, although it might
      depend a bit on the data and on how Ruby handles the hash, so I would not want
      to commit to a firm number here.
    trap: hedging
    why_wrong: Complexity is a commitment. Hedging the bound itself reads as not knowing
      it.
  - text: The complexity is linear. Next question. I do not think there is anything
      else worth adding about memory because everyone uses a hash for this and it
      is completely standard practice.
    trap: pragmatics
    why_wrong: The interviewer explicitly asked about space, so skipping it ignores
      the actual request.
  feedback:
    register: Confident and factual. Complexity is one of the few places where flat
      assertion is the correct register.
    hedging: Hedge the worst case if it is genuinely data-dependent, never the bound
      itself.
    precision: Say what the bound is in terms of, such as distinct values in the window,
      rather than a vague "n".
    grammar: Read complexity aloud as "O of n" or "linear in n"; both are natural,
      "O n" alone is not.
    pragmatics: Cover both axes the question named, time and space, in the order asked.
  rephrase:
    prompt: Give the same analysis but name the worst-case input explicitly in your
      first sentence.
    goal: Practise leading with the case that stresses the bound.
  language_focus:
  - precision
  - hedging
  - pragmatics
  feynman:
    concept: Auxiliary space of a sliding window versus input size.
    explain_to: A developer who believes two passes means quadratic time.
    constraint: No formulas; use counting visits per element only.
    self_check: Can you name the input that makes the memory peak, in one phrase?
    reasoning_check: Can you identify the hidden premise behind Complexity, give a
      counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You gave a bound without the space half, or hedged the bound.
    expected: Time and space, each with the reason and the worst case.
    actual: A partial or over-hedged claim, or loop-counting as analysis.
    root_cause: Treating complexity as a label recalled from practice rather than
      a claim derived from visits and storage.
    repair: 'Practise the two-sentence form: visits per element for time, what grows
      for space.'
    reasoning_error: If your Complexity answer failed, classify the mistake as a fact,
      assumption, comparison, failure, or certainty error before proposing the smallest
      repair.
  recall:
    active_recall_cue: What input makes the auxiliary space of a sliding window peak?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Complexity without presenting
      an assumption as a fact?
    black_box_probe: When the Complexity answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: dsa-03-complexity-defence-delayed-3
      prompt: A code review confirms that each pointer moves monotonically, but a benchmark
        shows the hash path is slower at the target size and does not identify why. How
        would you update the complexity claim and the next check?
      changed_constraint: the target-size benchmark makes the constant-space alternative
        relevant even though the pointer-count proof still holds
      new_evidence: a benchmark confirms the pointer movement but shows the hash path is
        slower without identifying the cause
      best_answer: I would keep the pointer-count argument for O(n) as a code-level claim,
        but I would not treat inspection as proof of runtime impact. If a dependency is
        slower, I would benchmark the actual map and scan paths on representative sizes,
        report the measured variance, and qualify the recommendation until that evidence
        explains the ambiguous failure.
      distractors:
      - text: I would preserve every part of the original Complexity answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Complexity explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/01-metodo-e-entrevistas/backend-interview-foundations/chapters/01-dsa-operating-system-and-pattern-selection.md
    note: Complexity vocabulary used when defending a chosen pattern.
  - repo: original
    path: english-arcade/dsa/complexity-defence
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: Defend O(n) by counting pointer movement, then measure peak map/allocation
      cost against a sorted or scan-based alternative at the target input size.
    goal: Separate an asymptotic proof from a runtime recommendation and choose the
      trade-off from measured memory and latency limits.
  critical_thinking:
    problem_frame: 'I frame the complexity defence from actual movements and stored
      state: count pointer advances, bound the map, and ask which resource limit is
      binding before naming an alternative.'
    claim_map:
      fact: The right pointer advances through the input once, the left pointer never
        moves backward, and the map records the most recent position for each distinct
        value.
      inference: The current implementation is O(n) time and O(n) auxiliary space in
        the no-repeat case, while a constant-space requirement changes the trade-off.
      assumption: I am assuming the interviewer accepts auxiliary state and wants an
        exact longest-run result rather than an approximation.
      unknown: The input size, memory ceiling, and whether sorting or a second pass
        is allowed are still unknown.
    comparison:
      applicable: true
      alternatives:
      - option: The last-index map and two monotonic pointers.
        benefit: It gives the linear pointer-count proof and direct duplicate jumps.
        cost_or_risk: Its map grows with distinct values and can be slower or larger
          than a scan at a small target size.
        valid_when: Use it when latency and original order matter more than auxiliary
          space.
      - option: Sort or scan with bounded state before evaluating the run.
        benefit: It can reduce map state or fit a strict memory contract and gives a
          different proof boundary.
        cost_or_risk: Sorting costs O(n log n), may lose original order, and a comparison
          scan can be quadratic.
        valid_when: Use it only when the memory ceiling or input bound makes the map
          unacceptable.
      decision_rule: I defend O(n) for the current pointer code, then choose the map
        or a slower lower-state path from the explicit memory, order, and latency constraints.
    failure_probe:
      kind: edge_case
      prompt: 'Which input and instrumented count would expose a false O(n) claim: all
        distinct values for map growth, or a pointer reset that makes the left movement
        repeat?'
    certainty:
      level: high
      rationale: I can prove the asymptotic pointer and map bounds from the code; I
        am less certain which implementation wins on the target machine.
      update_trigger: Update the recommendation when a pointer resets, a strict memory
        ceiling appears, or a representative benchmark shows the map path misses the
        latency budget.
    rubric:
      facts_correct: Counts each pointer movement and states worst-case map space rather
        than multiplying nested-looking loops.
      assumptions_explicit: Names whether auxiliary memory, original order, and exactness
        are assumed constraints.
      alternatives_considered: Compares the current map path with sorting or a bounded-state
        scan and keeps their costs honest.
      tradeoff_quality: Connects O(n) time, O(n) space, order preservation, and measured
        constants to the choice.
      follow_up_adaptation: Retains the proof but narrows the runtime recommendation
        when benchmark or memory evidence changes.
      certainty_calibration: States the proven bound directly and qualifies only the
        workload-dependent choice.
    evidence_check:
      basis: Check the pointer-movement proof, map cardinality, and stated time/space
        contract against system-design-estudos/areas/01-metodo-e-entrevistas/backend-interview-foundations/chapters/01-dsa-operating-system-and-pattern-selection.md
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: The code-level bound does not predict allocator cost, cache behavior,
        or workload latency without a representative benchmark.
      checked_on: '2026-08-25'
- id: dsa-04-ruby-default-trap
  version: 1.4.0
  target: dsa
  topic: Ruby runtime traps
  difficulty: 3
  interview_stage: live_coding
  template: dsa-recovery
  prompt: Your counter hash is behaving oddly on the second test. What do you think
    is happening?
  context: You wrote a frequency counter with a default value and then mutated that
    default. Every key now shares one object, and the interviewer is watching how
    you diagnose it in English.
  follow_up:
    prompt: Why might a default-valued counter hide whether a key was absent, and
      what test would distinguish those states?
    goal: Answer the evidence challenge about Ruby runtime traps while keeping the
      evidence boundary explicit.
    challenge_kind: evidence
    best_answer: >-
      I would distinguish a missing key from a stored zero with key? or fetch, because a
      default value can make a lookup look present when it is not. I would test both
      states before and after the increment, then choose the counter form whose default
      cannot hide that distinction.
    distractors:
    - text: I would cite my experience with Ruby runtime traps as enough proof and
        move on without naming an observation.
      why_wrong: Experience can guide a hypothesis, but it does not replace evidence
        tied to this context.
    - text: I would collect every possible metric about Ruby runtime traps before
        making even a provisional recommendation.
      why_wrong: A focused decision can start with one discriminating observation
        rather than an unbounded data request.
  compression:
    prompt: Rephrase the Ruby counter diagnosis as symptom, language behavior, and
      a focused regression test.
    goal: Compress the Ruby runtime traps answer into its decision, premise, trade-off,
      and verification step.
  best_answer: I passed a single default object to the hash, so every missing key
    hands back that same array and my pushes all land in one place. I should use the
    block form instead, which builds a fresh array per key and assigns it, so each
    key gets its own storage.
  distractors:
  - text: Ruby is caching the hash somewhere between the two test runs, so state from
      the first case is leaking into the second. I would reset the variable at the
      start of the method to clear it.
    trap: content
    why_wrong: Misdiagnoses shared object identity as cross-run caching, which sends
      the fix in the wrong direction entirely.
  - text: There is something strange going on with the hash, it is not doing what
      I expected it to do at all, and I am not entirely sure why that would be happening
      in this particular situation.
    trap: precision
    why_wrong: Names no mechanism. At C2 the expected move is to describe the cause,
      not the symptom.
  - text: I am so sorry, this is really embarrassing, I completely messed this up
      and should have seen it immediately, I apologise, let me try to fix it quickly
      and hopefully it works this time.
    trap: register
    why_wrong: Repeated apology shifts the round from technical to emotional and wastes
      the recovery window.
  feedback:
    register: Own the bug once, in neutral language, then move straight to the mechanism.
    hedging: '"I think what is happening is" is the right amount of hedge while diagnosing
      live.'
    precision: Say "the same object" rather than "it is weird"; identity is the actual
      cause.
    grammar: Present continuous fits a live symptom ("my pushes are landing"); simple
      present fits the rule.
    pragmatics: Diagnose, propose the fix, re-run. Apologising is not one of the steps.
  rephrase:
    prompt: Explain the same bug to a teammate in a pull request comment, in two sentences.
    goal: Shift from spoken diagnosis to concise written register.
  language_focus:
  - precision
  - register
  - grammar
  pt_help: '"Vergonha" nao cabe aqui. Em ingles tecnico, assuma o erro uma vez e siga
    para a causa.'
  feynman:
    concept: Shared default object versus a per-key default block.
    explain_to: A developer who has only used languages with value defaults.
    constraint: Explain it using one shared notebook handed to many people.
    self_check: Did you explain why the block form fixes it, not just that it does?
    reasoning_check: Can you identify the hidden premise behind Ruby runtime traps,
      give a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You described the symptom or apologised instead of diagnosing.
    expected: Name shared object identity as the cause, then the block-form fix.
    actual: A vague "it is weird" reaction, or an unrelated caching theory.
    root_cause: Under pressure the vocabulary for object identity is missing, so the
      answer defaults to emotion or vagueness.
    repair: Drill the sentence "every key is handed back the same object" until it
      arrives before the apology does.
    reasoning_error: If your Ruby runtime traps answer failed, classify the mistake
      as a fact, assumption, comparison, failure, or certainty error before proposing
      the smallest repair.
  recall:
    active_recall_cue: Why does a hash default object get shared across keys?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Ruby runtime traps without
      presenting an assumption as a fact?
    black_box_probe: When the Ruby runtime traps answer failed, did you locate the
      reasoning error before changing the implementation?
    delayed_variant:
      id: dsa-04-ruby-default-trap-delayed-4
      prompt: A benchmark shows the block-form counter allocates more at this key
        distribution, while a test still relies on distinguishing an absent key from
        zero. Which assumption is unsafe, and what would you verify next?
      changed_constraint: the counter must preserve absent-key semantics while meeting a
        measured allocation budget
      new_evidence: the same-key-distribution benchmark shows a different allocation
        profile for the alternative counter form
      best_answer: I would keep the distinction between a missing key and a stored zero,
        but I would revisit the counter form if a measurement shows the alternative has
        a materially different allocation cost. I would benchmark both forms with the
        same key distribution, then choose the one that preserves the absent-key contract
        within the observed budget.
      distractors:
      - text: I would preserve every part of the original Ruby runtime traps answer
          because changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Ruby runtime traps explanation with a new
          design without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/01-metodo-e-entrevistas/backend-interview-foundations/chapters/02-dsa-core-problems-in-ruby-and-typescript.md
    note: Ruby runtime traps that surface during live coding.
  - repo: original
    path: english-arcade/dsa/ruby-default-trap
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: Run a two-key mutation trace with object_id and key?, then compare a per-key
      block with Hash.new(0) on the same absent and stored-zero cases.
    goal: Diagnose shared default identity first, then choose a default form that preserves
      both mutation isolation and presence semantics.
  critical_thinking:
    problem_frame: 'I frame the Ruby hash bug as object identity plus key-presence semantics:
      identify what a missing lookup returns, whether that object is shared, and what
      the counter contract needs.'
    claim_map:
      fact: A single mutable default object is returned for every missing key, so pushes
        through different keys mutate one shared array.
      inference: A default block that assigns a fresh array per key prevents the shared-object
        bug, while key? or fetch distinguishes absence from a stored zero.
      assumption: I am assuming the counter must preserve separate per-key state and
        callers care whether a key was absent before incrementing.
      unknown: The required default value, allocation budget, and whether absence and
        zero have different business meaning are unknown.
    comparison:
      applicable: true
      alternatives:
      - option: Hash.new { |hash, key| hash[key] = [] } for mutable per-key state.
        benefit: It allocates and stores a fresh object for each missing key, so mutations
          stay isolated.
        cost_or_risk: It allocates state for every key touched and requires the block
          to assign deliberately.
        valid_when: Use it when each key owns mutable collection state.
      - option: Hash.new(0) or fetch/key? for scalar frequency state.
        benefit: It keeps integer counting simple and makes an absent key versus stored
          zero explicit when fetch or key? is used.
        cost_or_risk: It is the wrong shape for mutable collections and a default lookup
          can hide absence if callers rely on presence.
        valid_when: Use it when the counter stores scalars and the caller has an explicit
          absence contract.
      decision_rule: I choose a per-key block for mutable arrays and a scalar default
        plus key? or fetch for counts; I reject one shared mutable default in either
        case.
    failure_probe:
      kind: counterexample
      prompt: Mutate the missing values for two distinct keys, inspect object_id and
        key?, and show which result would prove the default object is shared or absence
        is hidden.
    certainty:
      level: high
      rationale: I am certain about shared default identity and the block form; the
        scalar or collection choice still depends on the caller contract.
      update_trigger: Update when a test shows a scalar counter, a required zero default,
        or an allocation budget that makes per-key mutable state inappropriate.
    rubric:
      facts_correct: Names shared object identity and the fresh block-created value,
        then distinguishes missing from stored zero.
      assumptions_explicit: States whether mutation, scalar counting, and absence semantics
        are part of the contract.
      alternatives_considered: Compares mutable per-key blocks with scalar defaults
        plus explicit presence checks.
      tradeoff_quality: Connects correctness, object allocation, and absence visibility
        to the chosen hash form.
      follow_up_adaptation: Uses object_id/key? tests to change the recommendation rather
        than defending the default by habit.
      certainty_calibration: Uses high confidence for Ruby default semantics and keeps
        workload-dependent allocation claims measured.
    evidence_check:
      basis: Check the shared-default object, block-created per-key state, and absent-versus-zero
        counter behavior against system-design-estudos/areas/01-metodo-e-entrevistas/backend-interview-foundations/chapters/02-dsa-core-problems-in-ruby-and-typescript.md
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: A small object_id test demonstrates the Ruby semantics but does not
        establish the allocation profile of a production key distribution.
      checked_on: '2026-08-25'
- id: dsa-05-clarifying-question
  version: 1.4.0
  target: dsa
  topic: Clarifying the contract
  difficulty: 1
  interview_stage: technical_screen
  template: dsa-narration
  prompt: Do you have any questions before you begin?
  context: The statement says "find the top k items" but never defines tie-breaking
    or whether the input fits in memory. This opening is scored on whether you ask,
    and on how you ask.
  follow_up:
    prompt: What assumption about ordering, duplicates, or empty input would you confirm
      before choosing the algorithm?
    goal: Answer the alternative challenge about Clarifying the contract while keeping
      the evidence boundary explicit.
    challenge_kind: alternative
    best_answer: >-
      I would confirm whether ties are stable, whether duplicate values are allowed, and
      whether an empty input has a defined result. Those answers determine whether I can
      use a frequency map directly or need a tie-break rule and an explicit empty-case
      branch, so I would ask them before choosing the algorithm.
    distractors:
    - text: I would defend the first Clarifying the contract option because offering
        an alternative might make the decision look uncertain.
      why_wrong: A comparison makes the decision rule visible; it does not weaken
        a well-calibrated recommendation.
    - text: I would list every conceivable Clarifying the contract design without
        saying which requirement should decide between them.
      why_wrong: An option list without a decision rule avoids the trade-off the follow-up
        is testing.
  compression:
    prompt: Reduce your clarifying questions to the contract, the edge case that changes
      the plan, and the expected bound.
    goal: Compress the Clarifying the contract answer into its decision, premise,
      trade-off, and verification step.
  best_answer: Two things, if you do not mind. First, how should I break ties when
    two items have the same count, by insertion order or by value? Second, can I assume
    the input fits comfortably in memory, or should I design for a stream?
  distractors:
  - text: No questions, the statement seems clear enough and I would rather start
      writing code now so I do not lose time. We can deal with edge cases later if
      they come up.
    trap: pragmatics
    why_wrong: Declining the invitation forfeits easy signal, and the tie-breaking
      rule genuinely changes the data structure.
  - text: Sorry, could you just possibly clarify a little bit what you actually mean
      by top, because I am not completely certain I have understood the question properly
      at all?
    trap: hedging
    why_wrong: Over-apologetic stacking makes a reasonable question sound like confusion
      about the entire problem.
  - text: I need you to tell me the tie-breaking rule and confirm the input size before
      I start, otherwise I cannot be expected to produce a correct solution in the
      time available.
    trap: register
    why_wrong: Demanding rather than asking inverts the dynamic of the round and reads
      as inflexible.
  feedback:
    register: Polite and efficient. "If you do not mind" is enough softening for a
      direct request.
    hedging: Hedge the request, never the content of the question itself.
    precision: Ask about the two unknowns that change your design, not about trivia.
    grammar: 'Embedded questions keep statement order: "how I should break ties" when
      embedded, not "how should I break ties".'
    pragmatics: Numbering your questions ("two things") helps the interviewer track
      you.
  rephrase:
    prompt: Ask the same two questions in a single sentence without sounding rushed.
    goal: Compress requests while keeping politeness intact.
  language_focus:
  - pragmatics
  - hedging
  - register
  feynman:
    concept: Requirement clarification as design input, not as politeness.
    explain_to: A candidate who thinks questions look like weakness.
    constraint: Use only the top-k example, no abstractions.
    self_check: Can you name how each answer would change your data structure?
    reasoning_check: Can you identify the hidden premise behind Clarifying the contract,
      give a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You said "no questions" or asked something that changed nothing.
    expected: Two questions whose answers alter the design.
    actual: Silence, or a vague request to restate the problem.
    root_cause: Treating questions as risk rather than as the cheapest signal in the
      round.
    repair: 'Keep two default questions ready: tie-breaking and input size.'
    reasoning_error: If your Clarifying the contract answer failed, classify the mistake
      as a fact, assumption, comparison, failure, or certainty error before proposing
      the smallest repair.
  recall:
    active_recall_cue: Which two unknowns most often change a top-k design?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Clarifying the contract without
      presenting an assumption as a fact?
    black_box_probe: When the Clarifying the contract answer failed, did you locate
      the reasoning error before changing the implementation?
    delayed_variant:
      id: dsa-05-clarifying-question-delayed-5
      prompt: A test reveals that two callers expect different tie-breaks for equal counts,
        and neither caller specified the empty-input result. What remains known, what is
        provisional, and which question comes first?
      changed_constraint: two callers share the algorithm but require an explicit tie-break
        and empty-input contract
      new_evidence: a boundary test exposes conflicting tie-break expectations and an
        unspecified empty-input result
      best_answer: I would keep the explicit questions about ties, duplicates, and empty
        input, but I would mark the answer provisional when a boundary test or competing
        caller exposes a missing rule. I would ask which caller owns the tie-break and
        run both callers through the same empty and duplicate cases before choosing the
        algorithm.
      distractors:
      - text: I would preserve every part of the original Clarifying the contract
          answer because changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Clarifying the contract explanation with
          a new design without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/01-metodo-e-entrevistas/snippets/system-design-interview-checklist.md
    note: Question-first discipline reused for algorithm rounds.
  - repo: original
    path: english-arcade/dsa/clarifying-question
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: Which tie, duplicate, empty, k-bound, and streamability questions would
      you ask before choosing heap or sort and writing the output contract?
    goal: Turn clarification into an explicit top-k contract so the data structure follows
      evidence instead of habit.
  critical_thinking:
    problem_frame: 'I frame clarification as algorithm input: identify tie order, duplicate
      policy, empty behavior, and memory/stream constraints before selecting a top-k
      method.'
    claim_map:
      fact: The opening prompt leaves tie-breaking and whether the input fits in memory
        unspecified.
      inference: Those answers determine whether a map plus heap, full sort, or streaming
        approach can satisfy the result contract.
      assumption: I am assuming “top k” means ranking by count or score and that callers
        need deterministic output, but neither is stated yet.
      unknown: Tie order, duplicate treatment, empty-input result, k bounds, and streamability
        are unknown.
    comparison:
      applicable: true
      alternatives:
      - option: Frequency map plus a size-k heap with an explicit tie key.
        benefit: It keeps bounded result state while preserving a deterministic top-k
          contract after counting.
        cost_or_risk: It needs a tie rule, map state, and careful handling when k exceeds
          the number of values.
        valid_when: Use it when the input can be counted and output state should stay
          bounded.
      - option: Sort all scored items after counting.
        benefit: It is easy to explain and makes deterministic tie ordering visible
          in one place.
        cost_or_risk: It uses O(n) result state and O(n log n) ordering work, so it
          may not fit a large stream.
        valid_when: Use it when the input fits memory and clarity or full ordering matters
          more than heap bounds.
      decision_rule: I ask the contract questions first; I use the heap when bounded
        output state matters and sort when the bound is small or full ordering is required.
    failure_probe:
      kind: edge_case
      prompt: If two callers demand opposite tie orders and one passes an empty input,
        which question must be answered before any heap or sort choice can be defended?
    certainty:
      level: medium
      rationale: I am certain that the omitted boundaries matter; I cannot be certain
        whether heap, sort, or streaming wins before the contract is answered.
      update_trigger: Update the algorithm when the caller selects a tie owner, empty
        behavior, stream requirement, or k bound that changes state or ordering.
    rubric:
      facts_correct: Names the missing tie, duplicate, empty, and memory facts instead
        of pretending the top-k contract is complete.
      assumptions_explicit: States which unanswered requirement would change data structure
        or output behavior.
      alternatives_considered: Compares a size-k heap with full sorting and ties each
        to the clarified input contract.
      tradeoff_quality: Explains how deterministic ordering, memory, and complexity
        trade off before code begins.
      follow_up_adaptation: Changes the recommendation when two callers or a boundary
        test reveal incompatible expectations.
      certainty_calibration: Uses medium certainty until the interviewer answers the
        questions that select the algorithm.
    evidence_check:
      basis: Check the missing top-k tie, duplicate, empty-input, and memory constraints
        against system-design-estudos/areas/01-metodo-e-entrevistas/snippets/system-design-interview-checklist.md
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: Clarifying questions expose the design contract but cannot choose
        an algorithm until the interviewer supplies the missing requirements.
      checked_on: '2026-08-25'
- id: dsa-06-mid-problem-recovery
  version: 1.4.0
  target: dsa
  topic: Recovering from a mistake
  difficulty: 3
  interview_stage: live_coding
  template: dsa-recovery
  prompt: You have gone quiet. What is going on in your head right now?
  context: You noticed two minutes ago that your recursion never handles the empty
    subtree, and you have been silently editing. The interviewer cannot see your reasoning
    and is prompting you to narrate.
  follow_up:
    prompt: After finding the failing trace, how would you narrate the smallest repair
      while preserving the invariant?
    goal: Answer the failure challenge about Recovering from a mistake while keeping
      the evidence boundary explicit.
    challenge_kind: failure
    best_answer: >-
      I would name the failing trace, state which part of the invariant it violates, and
      patch only that base case or update. I would rerun the same small trace first, then
      a neighboring case, so the repair is tied to evidence rather than a silent rewrite.
    distractors:
    - text: I would describe the Recovering from a mistake failure as impossible because
        the happy path already passed its test.
      why_wrong: Passing a happy path does not test the boundary, failure mode, or
        recovery being challenged.
    - text: I would add retries to Recovering from a mistake immediately and assume
        the system would become reliable.
      why_wrong: Retries can amplify load or duplicate effects; the failure and containment
        policy must be specified first.
  compression:
    prompt: Summarize the recovery in one sentence naming the failing case, the repair,
      and the check that restores confidence.
    goal: Compress the Recovering from a mistake answer into its decision, premise,
      trade-off, and verification step.
  best_answer: I went internal for a moment, apologies. I found a case my recursion
    does not handle, an empty subtree, where it returns nil and the caller expects
    a number. I am adding a base case that returns zero, then I will re-trace the
    small example to confirm nothing else shifted.
  distractors:
  - text: Nothing, everything is fine, I am just concentrating on getting this part
      written properly and then I will explain the whole thing once it is finished
      and working the way I want.
    trap: pragmatics
    why_wrong: Denying the problem removes the interviewer from the loop, and silent
      debugging is exactly what the round penalises.
  - text: I am stuck, I really do not know what is wrong, this is not going well at
      all and I am worried I will not finish in time, maybe I should just start the
      whole thing again from scratch.
    trap: register
    why_wrong: Catastrophising invites the interviewer to lose confidence, and the
      restart proposal discards working code.
  - text: I have found one case that is not handling, the empty subtree, so I am putting
      a base case for return zero and after I will make the trace again for confirm
      that nothing more changed.
    trap: grammar
    why_wrong: '"Is not handling" and "for confirm" are direct Portuguese calques
      that reduce perceived fluency under pressure.'
  feedback:
    register: One brief acknowledgement, then straight to substance. Never catastrophise.
    hedging: Do not hedge a diagnosis you are sure of; hedge only consequences you
      have not verified.
    precision: Name the failing case and the wrong return value, not just "a bug".
    grammar: Use "does not handle" for a property and "in order to confirm" for purpose.
    pragmatics: Narration is as much the deliverable here as the code is.
  rephrase:
    prompt: Say the same recovery without the word "sorry" and without losing politeness.
    goal: Break the reflex apology while keeping a collaborative tone.
  language_focus:
  - grammar
  - register
  - pragmatics
  pt_help: '"Para confirmar" vira "to confirm" ou "in order to confirm", nunca "for
    confirm".'
  feynman:
    concept: Narrated recovery as a signal of engineering maturity.
    explain_to: A candidate who believes silence hides mistakes.
    constraint: Explain using a surgeon talking through an operation.
    self_check: Did you state the failing case before proposing any fix?
    reasoning_check: Can you identify the hidden premise behind Recovering from a
      mistake, give a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You debugged silently, or spiralled into apology.
    expected: Brief acknowledgement, named failing case, smallest fix, re-trace.
    actual: Long silence, denial, or a proposal to restart from scratch.
    root_cause: Panic plus missing phrases for narrating uncertainty in a second language.
    repair: Rehearse the four-move recovery until it survives being nervous.
    reasoning_error: If your Recovering from a mistake answer failed, classify the
      mistake as a fact, assumption, comparison, failure, or certainty error before
      proposing the smallest repair.
  recall:
    active_recall_cue: What are the four moves of a clean live-coding recovery?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Recovering from a mistake
      without presenting an assumption as a fact?
    black_box_probe: When the Recovering from a mistake answer failed, did you locate
      the reasoning error before changing the implementation?
    delayed_variant:
      id: dsa-06-mid-problem-recovery-delayed-6
      prompt: The interviewer changes the success condition from returning a number to
        returning a bounded explanation for every empty subtree, while the deep-tree
        workload exceeds the original recursion budget. Which conclusion would you narrow
        before proposing a repair?
      changed_constraint: the deep-tree workload no longer fits the original recursion
        resource bound and the response contract now includes an explanation
      new_evidence: the interviewer explicitly changes the success condition and supplies
        a deep-tree case that exceeds the original bound
      best_answer: I would keep the failing empty-subtree trace, but I would retract any
        claim that adding zero alone satisfies a changed success condition or a larger
        workload. I would restate the new bound, choose the smallest bounded repair, and
        re-run the failing trace plus a deep tree before calling recovery complete.
      distractors:
      - text: I would preserve every part of the original Recovering from a mistake
          answer because changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Recovering from a mistake explanation with
          a new design without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/01-metodo-e-entrevistas/snippets/senior-production-answer-template.md
    note: Impact-first recovery sequence adapted to live coding.
  - repo: original
    path: english-arcade/dsa/mid-problem-recovery
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: How would you trace the empty-subtree failure, patch only the base case,
      re-trace a parent and a deep tree, and decide when an iterative redesign is justified?
    goal: 'Make recovery observable: connect the smallest repair to the failing trace,
      then separate local correctness from depth and output guarantees.'
  critical_thinking:
    problem_frame: 'I frame recovery around the failing trace and original return contract:
      state the empty-subtree case, the smallest base-case repair, and the re-trace
      that can disprove it.'
    claim_map:
      fact: The current recursion reaches an empty subtree and returns nil while its
        caller expects a numeric result.
      inference: Returning zero at that base case is the smallest repair for the original
        contract, but it is not enough if the interviewer changes the output or depth
        requirement.
      assumption: I am assuming the original result treats an empty subtree as zero
        and the recursion depth fits the current budget.
      unknown: The revised success condition, maximum tree depth, and whether iterative
        traversal is acceptable are unknown.
    comparison:
      applicable: false
      rejected_alternative: Jumping to a different traversal or rewriting the whole
        solution before proving the empty-subtree failure would compare implementations
        instead of repairing the observed contract violation.
      hard_constraint: The hard constraint is to make the failing trace and return type
        correct first, then test the smallest neighboring case before choosing any broader
        redesign.
      decision_rule: I repair and re-trace the known base case before comparing alternatives;
        a new output or depth constraint is the evidence that makes a redesign applicable.
    failure_probe:
      kind: failure_mode
      prompt: Trace the empty subtree and one neighboring node. Which return type breaks
        first, and what assertion would show that the base case repaired the invariant
        without hiding a second defect?
    certainty:
      level: medium
      rationale: I am confident about the observed nil-versus-number mismatch; confidence
        in zero as the final repair depends on the unchanged contract and depth.
      update_trigger: Update when a deep tree exceeds the recursion budget, the output
        must include explanations, or the neighboring trace exposes another violated
        invariant.
    rubric:
      facts_correct: Names the failing empty-subtree input, actual return, expected
        type, and smallest repair.
      assumptions_explicit: Separates the original contract from assumptions about depth
        or a newly requested explanation.
      alternatives_considered: Explains why comparison is premature until the known
        failing trace is repaired and re-run.
      tradeoff_quality: Balances repair scope, proof evidence, recursion risk, and the
        cost of a broader redesign.
      follow_up_adaptation: Narrows the claim when the interviewer changes output or
        depth instead of claiming zero solves everything.
      certainty_calibration: Uses medium certainty for the local base case and names
        the evidence needed for a broader guarantee.
    evidence_check:
      basis: Check the empty-subtree trace, numeric return contract, and changed success
        condition or recursion budget against system-design-estudos/areas/01-metodo-e-entrevistas/snippets/senior-production-answer-template.md
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: A small trace can validate the local repair but cannot establish deep-tree
        safety or a new output contract without representative depth tests.
      checked_on: '2026-08-25'
- id: dsa-07-tradeoff-language
  version: 1.4.0
  target: dsa
  topic: Time and space trade-offs
  difficulty: 2
  interview_stage: deep_dive
  template: dsa-narration
  prompt: Could you do this with less memory, and would you want to?
  context: Your hash-based solution is linear in both time and space. The interviewer
    is testing whether you can hold two options in the air and choose one with a stated
    reason rather than defaulting.
  follow_up:
    prompt: If memory became the constraint instead of latency, which state would
      you remove first and what cost would you accept?
    goal: Answer the new_evidence challenge about Time and space trade-offs while
      keeping the evidence boundary explicit.
    challenge_kind: new_evidence
    best_answer: >-
      I would remove the per-value map first and accept sorting plus a scan, which trades
      the map's extra space for O(n log n) time and may destroy original order. If the
      caller needs request latency or order preservation, I would keep the map; if a
      memory ceiling dominates and sorting is allowed, I would choose the trade-off and
      verify it on the stated input bound.
    distractors:
    - text: I would keep the Time and space trade-offs recommendation unchanged because
        changing position would look inconsistent.
      why_wrong: A defensible answer updates when relevant evidence changes an assumption
        or trade-off.
    - text: I would discard every earlier Time and space trade-offs claim as soon
        as one new observation appeared.
      why_wrong: New evidence may narrow one claim while leaving other verified facts
        intact.
  compression:
    prompt: 'Compare the two resource profiles in a short answer: time, auxiliary
      space, and the reason you choose one.'
    goal: Compress the Time and space trade-offs answer into its decision, premise,
      trade-off, and verification step.
  best_answer: I could sort first and scan, which drops the extra memory to effectively
    nothing but pushes time to n log n. Which one wins depends on whether memory or
    latency is the binding constraint. On a request path I would keep the hash; for
    a batch job over a large file I would sort.
  distractors:
  - text: Yes, sorting would use less memory. It would be slower though, so it depends
      really. Both options have advantages and disadvantages and either could be reasonable
      depending on the situation.
    trap: precision
    why_wrong: States the trade-off but never chooses. "It depends" without the deciding
      condition is an empty answer.
  - text: No, the hash approach is correct and I would not change it. Memory is cheap
      now and optimising for it is premature, so I would keep what I have and move
      on to the next part.
    trap: pragmatics
    why_wrong: Refuses the alternative the interviewer explicitly offered, which reads
      as inflexibility.
  - text: If I would sort the array first, then I will not need the hash anymore and
      the memory would be much less, but the time will become worse because sorting
      is more slow than a linear scan.
    trap: grammar
    why_wrong: '"If I would" breaks the conditional and "more slow" replaces the comparative
      "slower".'
  feedback:
    register: Balanced and decisive. Senior engineers name a default and the condition
      that flips it.
    hedging: '"Depends on whether" is precise hedging; "it depends really" is not.'
    precision: Attach each option to a concrete context, such as request path versus
      batch job.
    grammar: Second conditional takes "if I sorted... I would need", never "if I would
      sort".
    pragmatics: 'Answer both halves of the question: the feasibility and the preference.'
  rephrase:
    prompt: Give the same answer but start from the constraint that would make you
      switch.
    goal: Practise leading with the deciding condition.
  language_focus:
  - precision
  - grammar
  - hedging
  feynman:
    concept: Time-space trade-off chosen by binding constraint.
    explain_to: A product manager deciding between two builds.
    constraint: Use luggage and a locker as the only analogy.
    self_check: Did you name the condition that flips your default?
    reasoning_check: Can you identify the hidden premise behind Time and space trade-offs,
      give a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You listed both options and stopped, or refused one outright.
    expected: A default plus the constraint that would change it.
    actual: A bare "it depends" with no named condition.
    root_cause: Avoiding commitment because committing in English feels riskier than
      staying balanced.
    repair: Always finish a trade-off with "I would default to X; I would switch if
      Y".
    reasoning_error: If your Time and space trade-offs answer failed, classify the
      mistake as a fact, assumption, comparison, failure, or certainty error before
      proposing the smallest repair.
  recall:
    active_recall_cue: What condition makes sorting preferable to hashing here?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Time and space trade-offs
      without presenting an assumption as a fact?
    black_box_probe: When the Time and space trade-offs answer failed, did you locate
      the reasoning error before changing the implementation?
    delayed_variant:
      id: dsa-07-tradeoff-language-delayed-7
      prompt: A memory trace shows the sorted copy, rather than the hash, is the peak
        allocation, and the interviewer now requires a stated memory ceiling. Which
        resource claim survives and which alternative deserves a measured comparison?
      changed_constraint: the answer must meet an explicit peak-memory ceiling as well
        as the original latency requirement
      new_evidence: a memory trace identifies sort workspace as the peak allocation,
        contrary to the assumed constant-space benefit
      best_answer: I would keep the latency-versus-memory trade-off, but I would retract
        the phrase "effectively nothing" if the sorted copy or sort workspace matters to
        the memory budget. I would measure peak memory and elapsed time for the real input
        bound, then choose the hash or sort path from those constraints rather than from a
        slogan about constant space.
      distractors:
      - text: I would preserve every part of the original Time and space trade-offs
          answer because changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Time and space trade-offs explanation with
          a new design without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: decision-contrasts/README.md
    note: Decision-contrast framing applied to algorithm-level choices.
  - repo: original
    path: english-arcade/dsa/tradeoff-language
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: Given a peak-memory trace for hash and sorted paths, how would you state
      whether order is preserved and decide under an explicit memory ceiling?
    goal: Finish every trade-off with a default, a binding constraint, and measured
      evidence that can reverse it.
  critical_thinking:
    problem_frame: 'I frame the memory trade-off with both resource axes and the input
      contract: compare the map path with sorting, then state what would make me switch.'
    claim_map:
      fact: The current hash solution uses linear auxiliary state; sorting can reduce
        map state but costs ordering work and may require a sorted copy.
      inference: A request path may favor map latency, while a batch with a strict memory
        ceiling may favor sorting or a bounded scan after measuring peak memory.
      assumption: I am assuming the caller permits changing order or paying O(n log
        n) when memory is the binding constraint.
      unknown: Peak-memory definition, input mutability, order preservation, and latency
        budget are unknown.
    comparison:
      applicable: true
      alternatives:
      - option: Hash state with direct lookups.
        benefit: It preserves input order and gives expected linear work with straightforward
          duplicate checks.
        cost_or_risk: The map and object overhead can dominate memory or allocator cost
          at large distinct counts.
        valid_when: Use it when latency and order matter and the map fits the measured
          budget.
      - option: Sort then scan or use a bounded comparison-based pass.
        benefit: It can lower hash-state overhead and make a memory-first batch path
          possible.
        cost_or_risk: Sorting costs O(n log n), may allocate a copy, and can destroy
          original order unless indices are retained.
        valid_when: Use it when peak memory is the binding constraint and sorting/order
          changes are accepted.
      decision_rule: I default to the map for latency and order, but switch only when
        a measured memory ceiling outweighs its faster lookup path.
    failure_probe:
      kind: edge_case
      prompt: A memory trace says the sorted copy, not the hash, is the peak allocation.
        Which “constant-space” phrase becomes false, and what measurement separates
        the choices?
    certainty:
      level: medium
      rationale: The trade-off direction is clear, but the winner depends on peak allocation,
        mutability, and latency evidence.
      update_trigger: Update when a peak-memory trace, order requirement, or latency
        benchmark shows that the default map path violates the contract.
    rubric:
      facts_correct: States the current map cost and the real sort/copy cost instead
        of calling sorting free of memory.
      assumptions_explicit: Names which resource and order assumptions allow a switch.
      alternatives_considered: Compares hash lookup with sorting or a bounded comparison
        path and states when each wins.
      tradeoff_quality: Connects latency, peak memory, order preservation, and implementation
        complexity to the choice.
      follow_up_adaptation: Revises “effectively nothing” or the default path when the
        trace changes the binding constraint.
      certainty_calibration: Uses medium confidence for the default and asks for peak-memory/latency
        evidence before committing.
    evidence_check:
      basis: Check the hash-versus-sort time, peak-memory, and order-preservation trade-off
        against system-design-estudos/decision-contrasts/README.md and the exact interview
        context; record whether each part is fact, inference, or hypothesis.
      source_kind: authored_scenario
      limitation: Asymptotic space labels do not settle allocator peaks or copy behavior;
        those require measurements on the actual input bound.
      checked_on: '2026-08-25'
- id: dsa-08-scaling-followup
  version: 1.4.0
  target: dsa
  topic: Scaling follow-up
  difficulty: 3
  interview_stage: deep_dive
  template: dsa-narration
  prompt: Now suppose the input does not fit on one machine. What changes?
  context: The classic final follow-up. The interviewer wants to see whether you can
    move from an in-memory algorithm to a distributed framing without abandoning the
    reasoning you already established.
  follow_up:
    prompt: What partitioning or approximation would you introduce when the input
      exceeds memory, and how would you validate its error or merge cost?
    goal: Answer the assumption challenge about Scaling follow-up while keeping the
      evidence boundary explicit.
    challenge_kind: assumption
    best_answer: >-
      I would partition by value so every copy of a value reaches one owner, count locally,
      and merge the local top-k results. If the key space or a single hot key still exceeds
      memory, I would ask whether an approximate sketch is allowed and validate its error
      against an exact sample before trading correctness for capacity.
    distractors:
    - text: I would repeat my original Scaling follow-up answer with more confidence
        because the interviewer probably assumes the usual case.
      why_wrong: It hides the premise instead of checking whether the usual case is
        actually part of this problem.
    - text: I would stop proposing anything about Scaling follow-up until every surrounding
        requirement had been documented in full.
      why_wrong: It treats uncertainty as a reason for paralysis and offers no bounded
        next step.
  compression:
    prompt: 'Explain the scale-up plan in three parts: state placement, work per partition,
      and the failure you would monitor.'
    goal: Compress the Scaling follow-up answer into its decision, premise, trade-off,
      and verification step.
  best_answer: The counting stays the same, but it moves. I would partition by key
    so every occurrence of a value lands on the same node, count locally, then merge
    the per-node top k. The merge is only correct because counts for a key are never
    split across partitions.
  distractors:
  - text: I would use a distributed system, probably a big data framework, and it
      would handle the partitioning and shuffling automatically, so the algorithm
      would not really need to change much at all.
    trap: precision
    why_wrong: Names a category of tool instead of the property that makes the merge
      correct, which is the actual answer.
  - text: That is a very good question, and honestly it is quite a big topic. There
      are many possible approaches and it would depend on a lot of factors that we
      have not discussed here.
    trap: pragmatics
    why_wrong: Flattery plus deferral fills time without answering, which is immediately
      visible to an experienced interviewer.
  - text: You will have to split the data in several machines and each machine makes
      the count of its part, and in the final you join all the counts for to know
      which are the top ones.
    trap: grammar
    why_wrong: '"Split in", "in the final" and "for to know" are L1 transfer errors
      that mark the answer as non-native under pressure.'
  feedback:
    register: Keep the measured register you used for the single-machine answer.
    hedging: No hedge is needed on partitioning by key; it is the standard correct
      move.
    precision: The load-bearing sentence is why the merge is safe, not which framework
      you would pick.
    grammar: Use "partition by key", "split across machines" and "in the end".
    pragmatics: Connect back to your earlier solution rather than restarting from
      zero.
  rephrase:
    prompt: Explain the same design to a product manager who does not know what partitioning
      is.
    goal: Test whether precision survives a change of audience.
  language_focus:
  - precision
  - grammar
  - pragmatics
  feynman:
    concept: Partition-then-merge and the key-locality property.
    explain_to: An operations manager counting votes across regions.
    constraint: Use a national election count as the only example.
    self_check: Did you say why the merge cannot double count?
    reasoning_check: Can you identify the hidden premise behind Scaling follow-up,
      give a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You named a tool instead of a correctness property.
    expected: Partition by key, count locally, merge, plus why that is safe.
    actual: A framework name, or deferral dressed as nuance.
    root_cause: Reaching for vocabulary that sounds senior instead of the reasoning
      that is senior.
    repair: Practise finishing distributed answers with "this is correct because".
    reasoning_error: If your Scaling follow-up answer failed, classify the mistake
      as a fact, assumption, comparison, failure, or certainty error before proposing
      the smallest repair.
  recall:
    active_recall_cue: Why must all occurrences of a key land on the same partition?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Scaling follow-up without
      presenting an assumption as a fact?
    black_box_probe: When the Scaling follow-up answer failed, did you locate the
      reasoning error before changing the implementation?
    delayed_variant:
      id: dsa-08-scaling-followup-delayed-8
      prompt: A code review confirms that partitioning by key keeps each value together,
        but a benchmark shows skewed keys and a slow merge with no clear failure signal.
        Which test would you run before keeping the exact-count rule?
      changed_constraint: the design must handle skewed keys within the memory budget
        while preserving exact counts
      new_evidence: a benchmark confirms key ownership but shows skew and slow merging
        without identifying a single failing component
      best_answer: I would keep key ownership as the correctness condition for exact
        distributed counts, but I would not infer scale from code inspection. I would
        measure partition skew, hot-key memory, and merge time; if the dependency remains
        slow or the failure is ambiguous, I would test an exact sample before considering
        an approximate sketch.
      distractors:
      - text: I would preserve every part of the original Scaling follow-up answer
          because changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Scaling follow-up explanation with a new
          design without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/01-metodo-e-entrevistas/backend-interview-foundations/chapters/04-system-design-canonical-problems.md
    note: Canonical scaling follow-ups that pair with algorithm rounds.
  - repo: original
    path: english-arcade/dsa/scaling-followup
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: What partition skew, hot-key memory, merge-time, and sketch-error evidence
      would you measure before choosing distributed exactness or approximation?
    goal: Carry the single-machine invariant into a distributed design without hiding
      the cost of skew, merge, or approximation error.
  critical_thinking:
    problem_frame: 'I frame distributed counting around key ownership and merge correctness:
      decide where each value lives, measure skew, and state when approximation is allowed.'
    claim_map:
      fact: Exact counts require every occurrence of a value to reach one owner before
        local counts are merged.
      inference: Partitioning by value preserves exactness, but hot keys and merge traffic
        can still exhaust one node or the memory budget.
      assumption: I am assuming the caller still needs exact counts and permits a repartition
        or a network merge.
      unknown: Key skew, hot-key cardinality, network budget, merge latency, and tolerated
        counting error are unknown.
    comparison:
      applicable: true
      alternatives:
      - option: Exact key partitioning followed by a local-top-k merge.
        benefit: It preserves correctness because one owner sees every occurrence of
          a value.
        cost_or_risk: A hot key can overload one owner and the merge can become a network
          or memory bottleneck.
        valid_when: Use it when exactness is required and skew/merge budgets are measured.
      - option: An approximate sketch with an error contract.
        benefit: It bounds memory and can absorb a large key space when exact counts
          do not fit.
        cost_or_risk: It can misorder near-ties and requires error validation, not just
          a framework choice.
        valid_when: Use it only when the product accepts measured error and exact samples
          can validate the sketch.
      decision_rule: I keep key ownership for exact output; I choose a sketch only after
        the caller accepts an error bound and measurements show exact partitioning cannot
        fit.
    failure_probe:
      kind: failure_mode
      prompt: 'Which observation would expose the exact partition plan first: one hot
        key exhausting its owner, a slow merge, or an error budget that was never agreed?'
    certainty:
      level: medium
      rationale: I am confident that key ownership is necessary for exact counts; I
        am not confident it is sufficient for the target scale without skew and merge
        evidence.
      update_trigger: Update when hot-key memory, merge latency, or an explicit error
        budget makes approximate counting or a different owner strategy viable.
    rubric:
      facts_correct: States why every occurrence must share an owner and what the local
        merge preserves.
      assumptions_explicit: Names the assumptions about exactness, skew, network, and
        tolerated error.
      alternatives_considered: Compares exact partition/merge with an approximate sketch
        and names the validation each needs.
      tradeoff_quality: Connects correctness, hot-key memory, merge latency, and error
        to the scaling choice.
      follow_up_adaptation: Keeps the exact proof while narrowing the capacity claim
        when benchmark evidence exposes skew.
      certainty_calibration: Uses medium confidence for ownership correctness and conditions
        the architecture on scale evidence.
    evidence_check:
      basis: Check the key-ownership proof, partition skew, merge cost, and exact-versus-approximate
        error contract against system-design-estudos/areas/01-metodo-e-entrevistas/backend-interview-foundations/chapters/04-system-design-canonical-problems.md
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: The partition proof says nothing about network throughput, skewed
        memory, or acceptable approximation until those are measured and agreed.
      checked_on: '2026-08-25'
- id: dsa-09-whiteboard-thinking-aloud
  version: 1.4.0
  target: dsa
  topic: Thinking aloud
  difficulty: 2
  interview_stage: live_coding
  template: dsa-narration
  prompt: Could you keep talking me through it as you go?
  context: You are comfortable with the algorithm but tend to fall silent while typing.
    The interviewer needs a running commentary to assess reasoning, and silence reads
    as uncertainty even when the code is correct.
  follow_up:
    prompt: Which intermediate value should I challenge if I want to check that your
      reasoning, rather than your syntax, is sound?
    goal: Answer the evidence challenge about Thinking aloud while keeping the evidence
      boundary explicit.
    challenge_kind: evidence
    best_answer: >-
      I would challenge the complement check immediately before insertion, because adding
      first can let an element match itself. On a pair such as [3,3], I would trace the
      map before and after each lookup and use that trace to verify both the match and the
      no-match path.
    distractors:
    - text: I would cite my experience with Thinking aloud as enough proof and move
        on without naming an observation.
      why_wrong: Experience can guide a hypothesis, but it does not replace evidence
        tied to this context.
    - text: I would collect every possible metric about Thinking aloud before making
        even a provisional recommendation.
      why_wrong: A focused decision can start with one discriminating observation
        rather than an unbounded data request.
  compression:
    prompt: Retell the walkthrough as approach, invariant, trace, and next check,
      with no implementation commentary.
    goal: Compress the Thinking aloud answer into its decision, premise, trade-off,
      and verification step.
  best_answer: Sure. I am setting up the map first so lookups are constant, then the
    outer loop walks the array once. Right here I am deliberately checking the complement
    before inserting, otherwise an element could pair with itself.
  distractors:
  - text: Okay so now I type the map, and then I type the for loop, and then inside
      the loop I type the if statement, and now I am typing the return at the end
      of the function.
    trap: precision
    why_wrong: Narrating keystrokes carries no information. The interviewer can see
      the screen; what they cannot see is why.
  - text: Yeah sure no worries, so basically I am just gonna throw a map in here real
      quick and then kinda loop over the thing and see what sticks, and that should
      pretty much do it.
    trap: register
    why_wrong: Casual filler and "see what sticks" suggest improvisation rather than
      a considered plan.
  - text: I am putting the map for make the search faster and after I pass in all
      the elements of the array for see if the complement is existing there before
      to insert it.
    trap: grammar
    why_wrong: '"For make", "for see" and "before to insert" are infinitive-of-purpose
      errors carried over from Portuguese.'
  feedback:
    register: Professional but relaxed. Contractions are fine; "gonna" and "kinda"
      are not.
    hedging: Narration rarely needs hedges. Say what you are doing and why.
    precision: Explain decisions, not keystrokes. The word "otherwise" is doing the
      real work in the strong answer.
    grammar: Purpose takes "to make" or "in order to make", never "for make".
    pragmatics: Match the requested behaviour immediately; the interviewer asked for
      commentary, so give it without discussion.
  rephrase:
    prompt: Narrate the same three lines again, but justify one decision with the
      word "because".
    goal: Convert description into reasoning.
  language_focus:
  - precision
  - register
  - grammar
  pt_help: Finalidade em ingles usa "to" ou "in order to". "For + verbo" e o erro
    mais comum de brasileiros em entrevista.
  feynman:
    concept: Commentary as evidence of reasoning during live coding.
    explain_to: An engineer who codes brilliantly but silently.
    constraint: Explain using a chef describing choices, not movements.
    self_check: Would a listener who could not see the screen learn anything?
    reasoning_check: Can you identify the hidden premise behind Thinking aloud, give
      a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You went quiet, or narrated what was visible on screen.
    expected: Spoken reasons for decisions, especially rejected alternatives.
    actual: Silence, keystroke narration, or filler.
    root_cause: Speaking and coding compete for working memory in a second language.
    repair: Practise narrating only at decision points, not continuously.
    reasoning_error: If your Thinking aloud answer failed, classify the mistake as
      a fact, assumption, comparison, failure, or certainty error before proposing
      the smallest repair.
  recall:
    active_recall_cue: What separates useful narration from keystroke narration?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Thinking aloud without presenting
      an assumption as a fact?
    black_box_probe: When the Thinking aloud answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: dsa-09-whiteboard-thinking-aloud-delayed-9
      prompt: A benchmark shows that the alternative lookup structure has a different
        cost profile at the target size. Which part of your check-before-insert reasoning
        survives, and which performance claim should you revisit?
      changed_constraint: the lookup structure must meet the target-size cost budget
        without reintroducing self-pair matches
      new_evidence: a same-input benchmark shows a different lookup and memory cost for
        the alternative structure
      best_answer: I would keep the check-before-insert reasoning, but I would revisit the
        map choice if a measured comparison shows a different cost profile at the target
        size. I would compare lookup cost, memory, and the self-pair failure case on the
        same inputs, then update only the claim that the evidence actually challenges.
      distractors:
      - text: I would preserve every part of the original Thinking aloud answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Thinking aloud explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/01-metodo-e-entrevistas/backend-interview-foundations/chapters/01-dsa-operating-system-and-pattern-selection.md
    note: Operating system for speaking while solving.
  - repo: original
    path: english-arcade/dsa/thinking-aloud
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: Can you narrate the [3,3] trace, then compare map lookup-before-insert with
      sorted two-pointer search while preserving the required indices?
    goal: Make each spoken step carry a correctness reason, a failure it avoids, or
      evidence that could change the data structure.
  critical_thinking:
    problem_frame: 'I frame the running commentary around the next decision and its
      failure case: name the map, check the complement before insertion, and trace a
      duplicate pair.'
    claim_map:
      fact: The two-sum style path must check whether the complement exists before inserting
        the current value if an element cannot pair with itself.
      inference: A map gives expected constant-time lookup, while sort/two-pointer can
        use less hash state but changes order and index handling.
      assumption: I am assuming the contract returns a pair of indices or values and
        disallows using the same element twice.
      unknown: Duplicate policy, return ordering, input mutation, and memory limit are
        unknown.
    comparison:
      applicable: true
      alternatives:
      - option: Map lookup before insert.
        benefit: It preserves one-pass reasoning and handles an earlier complement without
          sorting.
        cost_or_risk: It uses auxiliary map state and needs a clear duplicate/index
          contract.
        valid_when: Use it when one-pass latency and original positions matter.
      - option: Sort with two pointers while retaining original positions.
        benefit: It can lower lookup overhead and make the ordered search proof explicit.
        cost_or_risk: It adds sorting cost, index bookkeeping, and can obscure the original
          order.
        valid_when: Use it when memory is tighter and the caller accepts sorting and
          index mapping.
      decision_rule: I default to check-before-insert with a map when one-pass indices
        matter; I switch to sorting only when its memory or proof benefit is measured
        and the index contract survives.
    failure_probe:
      kind: counterexample
      prompt: Trace [3,3] before and after lookup and insertion. Which map state proves
        that the current value was not matched to itself?
    certainty:
      level: high
      rationale: I am highly certain about checking before insertion for the no-self-pair
        rule; the data-structure preference depends on the caller contract.
      update_trigger: Update when the caller allows self-pairs, needs all pairs, requires
        sorted output, or supplies a memory limit that changes the map choice.
    rubric:
      facts_correct: Names the complement check and demonstrates it on a duplicate input
        rather than narrating syntax.
      assumptions_explicit: States the no-self-pair, index, order, and mutation assumptions.
      alternatives_considered: Compares one-pass map lookup with sorted two-pointer
        search and its index bookkeeping.
      tradeoff_quality: Connects lookup memory, sort cost, original order, and duplicate
        correctness to the recommendation.
      follow_up_adaptation: Keeps the self-pair invariant while revising the data structure
        when the output contract changes.
      certainty_calibration: Uses high confidence for operation order and qualifies
        the broader performance choice.
    evidence_check:
      basis: Check the check-before-insert invariant, duplicate behavior, and two-sum
        output contract against system-design-estudos/areas/01-metodo-e-entrevistas/backend-interview-foundations/chapters/01-dsa-operating-system-and-pattern-selection.md
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: The trace proves operation order for the stated pair contract but
        cannot choose map versus sorting without input and memory evidence.
      checked_on: '2026-08-25'
- id: dsa-10-edge-case-enumeration
  version: 1.4.0
  target: dsa
  topic: Edge cases
  difficulty: 2
  interview_stage: live_coding
  template: dsa-narration
  prompt: What would you test before you call this done?
  context: Your implementation handles the sample input. The interviewer wants to
    hear whether you can enumerate the cases that break naive solutions, spoken as
    a short and confident list.
  follow_up:
    prompt: Which boundary case would most likely invalidate your current invariant,
      and what assertion would expose it?
    goal: Answer the alternative challenge about Edge cases while keeping the evidence
      boundary explicit.
    challenge_kind: alternative
    best_answer: >-
      I would choose the all-duplicate trace first because it can move the left boundary
      repeatedly and expose a stale-index bug. I would assert that the window contains no
      duplicate after every repair, then keep the empty and single-element tests as the
      return-value boundaries.
    distractors:
    - text: I would defend the first Edge cases option because offering an alternative
        might make the decision look uncertain.
      why_wrong: A comparison makes the decision rule visible; it does not weaken
        a well-calibrated recommendation.
    - text: I would list every conceivable Edge cases design without saying which
        requirement should decide between them.
      why_wrong: An option list without a decision rule avoids the trade-off the follow-up
        is testing.
  compression:
    prompt: 'Name three tests in order: an empty or minimum input, a repeated or duplicate
      case, and a representative case.'
    goal: Compress the Edge cases answer into its decision, premise, trade-off, and
      verification step.
  best_answer: >-
    I would test three boundaries before calling it done: empty input should return zero,
    a single element should never shrink the window, and an all-duplicate input should
    move the left pointer more than once when needed. Those traces exercise both the
    return value and the invariant.
  distractors:
  - text: I would test it with some different inputs to make sure it works properly
      in all the situations, including some bigger ones and maybe some strange ones
      that might cause problems.
    trap: precision
    why_wrong: '"Some strange ones" names nothing. Edge cases are only credible when
      enumerated concretely.'
  - text: I tested it with the example already and it gave the right answer, so I
      think it is fine and we can probably move on to the next part of the problem
      now.
    trap: content
    why_wrong: One passing example is not a test plan, and the duplicate-heavy case
      is precisely where this algorithm fails.
  - text: I would test the empty array, that must return zero and not raise, the array
      with one element only, where the window never shrink, and the array with all
      duplicates.
    trap: grammar
    why_wrong: '"Never shrink" drops third-person agreement, a small slip that stands
      out in an otherwise correct list.'
  feedback:
    register: Crisp and enumerated. Announcing "three cases" signals control.
    hedging: No hedging needed on a test list; these either matter or they do not.
    precision: Each case should name the behaviour you expect, not just the input.
    grammar: Third-person singular "shrinks", and "return zero rather than raise"
      for the contrast.
    pragmatics: Signposting with a count makes the list easy for the interviewer to
      follow and score.
  rephrase:
    prompt: Give the same three cases and add the reason each one is dangerous.
    goal: Move from listing to justifying.
  language_focus:
  - precision
  - grammar
  - pragmatics
  feynman:
    concept: Edge cases as the inputs that break the invariant.
    explain_to: A QA engineer with no algorithm background.
    constraint: Explain without naming any data structure.
    self_check: Does each case you named stress a different part of the logic?
    reasoning_check: Can you identify the hidden premise behind Edge cases, give a
      counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: Your list was vague or stopped at the happy path.
    expected: Named inputs, each with the expected behaviour.
    actual: A vague "some different inputs", or reliance on one passing example.
    root_cause: Testing treated as reassurance rather than as adversarial search.
    repair: 'Keep a standing triple: empty, single, all-identical.'
    reasoning_error: If your Edge cases answer failed, classify the mistake as a fact,
      assumption, comparison, failure, or certainty error before proposing the smallest
      repair.
  recall:
    active_recall_cue: Which three inputs stress almost every array algorithm?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Edge cases without presenting
      an assumption as a fact?
    black_box_probe: When the Edge cases answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: dsa-10-edge-case-enumeration-delayed-10
      prompt: A new test supplies a repeated value after the left boundary has already
        moved, and two callers expect different results for that case. What would you
        defend, retract, and verify before changing the implementation?
      changed_constraint: the algorithm must preserve its invariant for repeated values
        while the callers agree on one return-value contract
      new_evidence: a trace exposes a repeated-value boundary after a prior repair and
        the callers disagree about the expected result
      best_answer: I would keep the empty, single-element, and duplicate boundaries, but
        I would add the newly exposed case to the invariant test rather than pretend the
        original list was exhaustive. I would assert the window after each left-boundary
        update and compare both callers' expected return values before changing code.
      distractors:
      - text: I would preserve every part of the original Edge cases answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Edge cases explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/01-metodo-e-entrevistas/backend-interview-foundations/chapters/02-dsa-core-problems-in-ruby-and-typescript.md
    note: Worked problems and their failing inputs.
  - repo: original
    path: english-arcade/dsa/edge-case-enumeration
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: Write assertions for empty, single, all-duplicate, and repeated-after-left-move
      inputs, then compare them with an oracle-driven generated trace.
    goal: Turn “edge cases” into a small adversarial test plan tied to the invariant
      and the result contract.
  critical_thinking:
    problem_frame: 'I frame edge tests as invariant attacks: cover empty, single, all-duplicate,
      and repeated-after-move inputs, then state the expected return and window property.'
    claim_map:
      fact: The implementation must handle empty input, a single element, all duplicates,
        and a duplicate that arrives after the left boundary has moved.
      inference: Those cases exercise both result initialization and the max-left/last-seen
        invariant instead of merely repeating the sample.
      assumption: I am assuming empty input returns zero and the result is the longest
        distinct contiguous window.
      unknown: The exact empty result, malformed-input behavior, and whether callers
        expect a value or the window itself are unknown.
    comparison:
      applicable: true
      alternatives:
      - option: A small hand-picked boundary suite with assertions after each repair.
        benefit: It directly targets the empty, duplicate, and pointer-boundary failures
          visible in the code.
        cost_or_risk: It can miss interactions that were not imagined by the author.
        valid_when: Use it as the minimum gate before claiming the invariant is implemented.
      - option: Property-based or generated traces checked against a simple oracle.
        benefit: It explores many duplicate and boundary arrangements and can find a
          stale-index interaction.
        cost_or_risk: It costs more setup and still needs an oracle and clear result
          contract.
        valid_when: Use it when the algorithm will be reused or hand-picked cases keep
          finding regressions.
      decision_rule: I start with the explicit boundary suite, then add generated oracle
        checks when the invariant is central enough that one missed interaction would
        be costly.
    failure_probe:
      kind: edge_case
      prompt: After the left boundary moves, insert another repeated value. Which assertion
        shows the active window is still distinct and the returned length still matches
        the caller contract?
    certainty:
      level: high
      rationale: I am confident these boundaries expose common initialization and stale-index
        errors; confidence in completeness depends on the result contract and broader
        traces.
      update_trigger: Update the suite when a new caller expectation, failing generated
        trace, or changed result contract exposes an uncovered boundary.
    rubric:
      facts_correct: Names expected behavior for empty, single, duplicate-heavy, and
        repeated-after-move inputs.
      assumptions_explicit: States the result and invariant assumptions behind each
        test.
      alternatives_considered: Compares a focused boundary suite with generated/property-based
        traces and an oracle.
      tradeoff_quality: Connects test cost, defect discovery, oracle quality, and contract
        confidence to the testing choice.
      follow_up_adaptation: Adds a newly exposed case without pretending the original
        list was exhaustive.
      certainty_calibration: Uses high confidence for the minimum cases and keeps completeness
        conditional on new evidence.
    evidence_check:
      basis: Check the empty/single/duplicate boundary suite and the window invariant
        after repeated left updates against system-design-estudos/areas/01-metodo-e-entrevistas/backend-interview-foundations/chapters/02-dsa-core-problems-in-ruby-and-typescript.md
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: Passing a finite edge suite does not prove all input sequences or
        a performance bound; the oracle and input contract still matter.
      checked_on: '2026-08-25'
- id: dsa-11-disagreeing-with-interviewer
  version: 1.4.0
  target: dsa
  topic: Disagreement
  difficulty: 3
  interview_stage: live_coding
  template: dsa-recovery
  prompt: I think your solution is quadratic, is it not?
  context: The interviewer is wrong, possibly deliberately. Your solution is linear.
    The round is now testing whether you can hold your ground in English without either
    capitulating or becoming combative.
  follow_up:
    prompt: Can you trace the operation count with me and identify the loop or data
      structure that makes you believe the bound is lower?
    goal: Answer the failure challenge about Disagreement while keeping the evidence
      boundary explicit.
    challenge_kind: failure
    best_answer: >-
      I would count pointer increments with you: the right pointer advances once per
      element, and the left pointer advances at most n times in total because it never
      moves backward. I would trace the duplicate-heavy input that prompted the concern,
      then revise the bound if the implementation actually resets either pointer.
    distractors:
    - text: I would describe the Disagreement failure as impossible because the happy
        path already passed its test.
      why_wrong: Passing a happy path does not test the boundary, failure mode, or
        recovery being challenged.
    - text: I would add retries to Disagreement immediately and assume the system
        would become reliable.
      why_wrong: Retries can amplify load or duplicate effects; the failure and containment
        policy must be specified first.
  compression:
    prompt: 'Answer the challenge in two parts: count the dominant operations, then
      state the corrected bound if the objection holds.'
    goal: Compress the Disagreement answer into its decision, premise, trade-off,
      and verification step.
  best_answer: I do not think so, but let me walk through it and you can tell me where
    I have gone wrong. The inner loop only advances the left pointer, and that pointer
    never resets, so across the whole run it moves at most n times in total rather
    than n times per element.
  distractors:
  - text: Oh, you are probably right, sorry, I did not think about that carefully
      enough. Let me look at it again and see if I can find a better approach that
      avoids the nested structure.
    trap: pragmatics
    why_wrong: Capitulating to an incorrect claim is the failure mode this question
      is designed to expose.
  - text: No, it is definitely linear. The inner loop does not run n times for each
      element, that is a common misunderstanding of amortised analysis and it does
      not apply to this code.
    trap: register
    why_wrong: Correct content, but "a common misunderstanding" lectures the interviewer
      and creates friction unnecessarily.
  - text: I am not agree with that, because the internal loop is not running for each
      element, it advances only the left pointer and this pointer is not resetting
      never during the execution.
    trap: grammar
    why_wrong: '"I am not agree" and the double negative "not resetting never" are
      both L1 transfer errors that weaken a correct rebuttal.'
  feedback:
    register: Firm and collaborative. Invite correction while making your case.
    hedging: '"I do not think so" is the ideal calibrated opener: clear disagreement,
      no aggression.'
    precision: Win the point with the amortised argument, not with the assertion.
    grammar: '"I disagree" or "I do not agree", never "I am not agree"; use one negative
      per clause.'
    pragmatics: Offering to be corrected keeps the interviewer on your side while
      you defend the answer.
  rephrase:
    prompt: Disagree again in one sentence, then immediately offer your evidence.
    goal: Practise brevity in disagreement.
  language_focus:
  - register
  - grammar
  - pragmatics
  pt_help: '"Nao concordo" e "I disagree" ou "I do not agree". "I am not agree" e
    erro classico e muito visivel.'
  feynman:
    concept: Amortised analysis defended under social pressure.
    explain_to: A peer who counts nested loops to judge complexity.
    constraint: Explain using total distance walked, not code.
    self_check: Did you disagree and provide evidence in the same breath?
    reasoning_check: Can you identify the hidden premise behind Disagreement, give
      a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You folded, or you won the point rudely.
    expected: Calibrated disagreement plus the amortised argument.
    actual: Apology and retreat, or a lecture.
    root_cause: Disagreeing politely in a second language is harder than being either
      silent or blunt.
    repair: Memorise "I do not think so, but let me walk through it" as your opener.
    reasoning_error: If your Disagreement answer failed, classify the mistake as a
      fact, assumption, comparison, failure, or certainty error before proposing the
      smallest repair.
  recall:
    active_recall_cue: Why does a never-resetting pointer keep a nested loop linear?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Disagreement without presenting
      an assumption as a fact?
    black_box_probe: When the Disagreement answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: dsa-11-disagreeing-with-interviewer-delayed-11
      prompt: The interviewer changes the result contract to include the trace, and the
        input no longer fits the original memory bound. How would you update the linear
        complexity claim and explain the alternative without becoming defensive?
      changed_constraint: the result must include a trace while the input exceeds the
        original auxiliary-memory budget
      new_evidence: the interviewer changes the output contract and supplies an input
        bound that invalidates the original memory assumption
      best_answer: I would keep the pointer-count proof under the original contract, but
        I would retract the linear recommendation if the new result or resource bound
        changes what must be retained. I would restate the contract, compare sorting or
        a bounded scan, and trace the disputed loop before defending a new complexity
        claim.
      distractors:
      - text: I would preserve every part of the original Disagreement answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Disagreement explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/01-metodo-e-entrevistas/backend-interview-foundations/chapters/01-dsa-operating-system-and-pattern-selection.md
    note: Complexity reasoning used to defend a solution.
  - repo: original
    path: english-arcade/dsa/disagreeing-politely
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: Answer the quadratic objection with a duplicate-heavy pointer trace, then
      state which code or output change would make a new algorithm comparison applicable.
    goal: Practise calm disagreement as an evidence-led operation count, with a clear
      boundary for retracting the claim.
  critical_thinking:
    problem_frame: 'I frame disagreement as a proof obligation under the current implementation:
      count pointer advances, identify any reset, and invite a trace rather than arguing
      from confidence.'
    claim_map:
      fact: The right pointer advances once per element and the left pointer advances
        monotonically at most n times in the current window implementation.
      inference: The current loop is linear by amortized pointer movement, but a reset,
        extra scan, or changed output contract can invalidate that claim.
      assumption: I am assuming the code shown is the code being analyzed and does not
        reconstruct the window or trace on every iteration.
      unknown: The disputed implementation details, required trace output, and memory
        bound may change the applicable complexity claim.
    comparison:
      applicable: false
      rejected_alternative: Switching algorithms to appease a quadratic objection would
        avoid the operation-count question and could discard a correct proof under the
        current contract.
      hard_constraint: The hard constraint is to count the actual right and left pointer
        increments and inspect whether either resets; only then can a different algorithm
        be compared honestly.
      decision_rule: I defend or retract the current bound from a trace first; I compare
        alternatives only after the interviewer changes the contract or the count disproves
        the proof.
    failure_probe:
      kind: counterexample
      prompt: Use a duplicate-heavy input to count both pointers. What exact reset or
        repeated scan would make the linear proof false?
    certainty:
      level: high
      rationale: I am confident in the pointer-count argument for the current code;
        I would lower confidence immediately if a pointer resets or output requirements
        retain extra state.
      update_trigger: Update when an operation trace shows repeated pointer work, a
        hidden scan, or a new result contract that changes retained state.
    rubric:
      facts_correct: Counts actual increments and states why the left pointer does not
        multiply work across right-pointer iterations.
      assumptions_explicit: Names the assumption that the implementation never resets
        or scans the window anew.
      alternatives_considered: Explains why proof comes before comparing algorithms
        when the objection concerns this code.
      tradeoff_quality: Balances confidence, trace evidence, output retention, and memory
        cost without becoming combative.
      follow_up_adaptation: Retracts or narrows the claim when the implementation or
        contract changes.
      certainty_calibration: Uses high confidence for the shown proof and an explicit
        trigger for revising it.
    evidence_check:
      basis: Check the amortized pointer-count proof and any changed output or memory
        contract against system-design-estudos/areas/01-metodo-e-entrevistas/backend-interview-foundations/chapters/01-dsa-operating-system-and-pattern-selection.md
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: An amortized proof applies to the shown code and contract; it does
        not cover an unseen implementation, trace materialization, or changed memory
        requirement.
      checked_on: '2026-08-25'
- id: dsa-12-time-pressure-triage
  version: 1.4.0
  target: dsa
  topic: Time pressure
  difficulty: 3
  interview_stage: live_coding
  template: dsa-recovery
  prompt: We have about five minutes left. How do you want to use them?
  context: Your solution is written but untested, and you know one edge case is probably
    broken. The interviewer is handing you the triage decision, and how you spend
    the time is itself the assessment.
  follow_up:
    prompt: With five minutes left, would you prioritise a working implementation,
      a trace, or a complexity defence, and why?
    goal: Answer the new_evidence challenge about Time pressure while keeping the
      evidence boundary explicit.
    challenge_kind: new_evidence
    best_answer: >-
      I would spend three minutes tracing the duplicate-heavy case, because that is where
      I think the bug is, and keep the last two for complexity. If the trace exposes a
      broken invariant, I would name that weakness and stop polishing; if it passes, I
      would use the remaining time to state the bound and its space cost clearly.
    distractors:
    - text: I would keep the Time pressure recommendation unchanged because changing
        position would look inconsistent.
      why_wrong: A defensible answer updates when relevant evidence changes an assumption
        or trade-off.
    - text: I would discard every earlier Time pressure claim as soon as one new observation
        appeared.
      why_wrong: New evidence may narrow one claim while leaving other verified facts
        intact.
  compression:
    prompt: Give the time-pressure plan as three actions with a stopping rule for
      the final minute.
    goal: Compress the Time pressure answer into its decision, premise, trade-off,
      and verification step.
  best_answer: I would spend three minutes tracing the duplicate-heavy case, because
    that is where I think the bug is, and keep the last two for complexity. I would
    rather leave with a verified weakness named than with an untested solution that
    looks finished.
  distractors:
  - text: I would like to finish the optimisation I was thinking about earlier, because
      the current version is not as efficient as it could be and I would prefer to
      show you the better approach if there is time.
    trap: content
    why_wrong: Optimising untested code is the wrong triage; correctness precedes
      performance in every interview rubric.
  - text: Whatever you prefer, really. I am happy to do whichever part you think would
      be most useful, so I will follow your lead on how we should use the remaining
      time here.
    trap: pragmatics
    why_wrong: The question delegated the decision to you; handing it back forfeits
      the signal entirely.
  - text: Five minutes is not enough time for finish everything, so I will make the
      test of the duplicate case and after I explain the complexity if it remains
      some time.
    trap: grammar
    why_wrong: '"For finish", "make the test" and "if it remains some time" are calques
      that obscure otherwise sound triage.'
  feedback:
    register: Decisive and calm. Naming a known weakness reads as confidence, not
      failure.
    hedging: Hedge the location of the bug ("where I think"), never the plan.
    precision: Allocate the minutes explicitly; vague intent is not a plan.
    grammar: '"Enough time to finish", "run the test", and "if there is time left".'
    pragmatics: Take the decision you were offered and justify it in one clause.
  rephrase:
    prompt: State the same plan in one sentence, leading with what you would sacrifice.
    goal: Practise making the trade-off explicit under pressure.
  language_focus:
  - precision
  - grammar
  - pragmatics
  feynman:
    concept: Triage under a hard deadline, correctness before optimisation.
    explain_to: A junior engineer who optimises before testing.
    constraint: Explain using an exam with unanswered questions left.
    self_check: Did you say what you were choosing not to do?
    reasoning_check: Can you identify the hidden premise behind Time pressure, give
      a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You optimised, or handed the decision back to the interviewer.
    expected: An explicit minute allocation with correctness first.
    actual: Deference, or polishing code that was never verified.
    root_cause: Time pressure plus reluctance to name a suspected bug out loud.
    repair: 'Default to: verify the weakest case, then state complexity.'
    reasoning_error: If your Time pressure answer failed, classify the mistake as
      a fact, assumption, comparison, failure, or certainty error before proposing
      the smallest repair.
  recall:
    active_recall_cue: With five minutes left and untested code, what comes first?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Time pressure without presenting
      an assumption as a fact?
    black_box_probe: When the Time pressure answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: dsa-12-time-pressure-triage-delayed-12
      prompt: A trace shows the empty-input branch, rather than the duplicate-heavy
        path, is the likely failure, and the interviewer asks for a stronger guarantee
        before time runs out. Which assumption is no longer safe, and what do you test?
      changed_constraint: the remaining time must cover the newly identified boundary
        failure before any broader complexity guarantee is defended
      new_evidence: a short trace points to the empty-input branch as the likely defect
        instead of the duplicate-heavy path
      best_answer: I would keep the duplicate-heavy trace as the first check when it still
        carries the highest failure risk, but I would retract that priority if the new
        trace shows another bottleneck. I would name the stronger guarantee, spend the
        remaining time on the smallest confirming test, and state which complexity or
        edge-case claim remains unverified.
      distractors:
      - text: I would preserve every part of the original Time pressure answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Time pressure explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/01-metodo-e-entrevistas/snippets/senior-production-answer-template.md
    note: Prioritisation language reused for end-of-round triage.
  - repo: original
    path: english-arcade/dsa/time-pressure-triage
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: How would you allocate five minutes between a duplicate trace, an empty-input
      check, and the complexity explanation, and change the plan when the first trace
      changes the risk?
    goal: Make time pressure produce a defensible evidence order, not a polished but
      unverified algorithm.
  critical_thinking:
    problem_frame: 'I frame the five-minute plan around the highest-risk unverified
      claim: test the suspected invariant failure, name the time split, then state what
      remains unverified.'
    claim_map:
      fact: The solution is written but untested, one edge case is suspected, and only
        five minutes remain.
      inference: A short duplicate-heavy trace can reveal a correctness defect faster
        than polishing code or debating an unmeasured optimization.
      assumption: I am assuming the duplicate-heavy path is the highest-risk failure
        and that the interviewer values a verified limitation over superficial completeness.
      unknown: The actual failing branch, input contract, and remaining complexity questions
        are unknown until the first trace runs.
    comparison:
      applicable: true
      alternatives:
      - option: Trace the highest-risk boundary first, then state complexity.
        benefit: It produces direct correctness evidence and leaves a precise limitation
          if time expires.
        cost_or_risk: It may leave a lower-risk optimization or an untested branch unresolved.
        valid_when: Use it when a suspected invariant failure threatens the result contract.
      - option: Polish implementation or lead with a complexity defence.
        benefit: It can improve readability or communication when correctness is already
          evidenced.
        cost_or_risk: It can consume the deadline while the suspected bug remains invisible.
        valid_when: Use it only after the weakest correctness case has passed or the
          interviewer changes the priority.
      decision_rule: I spend the first minutes on the smallest trace with the highest
        failure risk, then use whatever remains for the bound and explicit gaps.
    failure_probe:
      kind: failure_mode
      prompt: If the empty branch fails before the duplicate trace, how would you reallocate
        the remaining minutes and state which claim you cannot verify?
    certainty:
      level: low
      rationale: I have a rational initial priority but low certainty about the failing
        branch until a trace supplies evidence.
      update_trigger: Update the minute allocation when the first trace identifies a
        different failure, a stronger guarantee is requested, or correctness is already
        established.
    rubric:
      facts_correct: States the suspected bug, exact time allocation, and the minimum
        trace before polishing.
      assumptions_explicit: Names the assumption that duplicate-heavy input is the highest-risk
        path and admits what remains unknown.
      alternatives_considered: Compares trace-first triage with polish-first or complexity-first
        work and says when each is justified.
      tradeoff_quality: Connects correctness risk, remaining time, communication value,
        and incomplete evidence to the plan.
      follow_up_adaptation: Reallocates time when the first trace changes the likely
        failure instead of defending the initial plan.
      certainty_calibration: Uses low certainty until the trace runs and explicitly
        labels any claim left unverified.
    evidence_check:
      basis: Check the five-minute triage order, suspected duplicate invariant, and
        new trace that may change priority against system-design-estudos/areas/01-metodo-e-entrevistas/snippets/senior-production-answer-template.md
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: A deadline plan can prioritize evidence but cannot guarantee complete
        testing or prove an unrun complexity claim.
      checked_on: '2026-08-25'
