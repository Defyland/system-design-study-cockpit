    certainty:
      level: medium
      rationale: Certainty is medium because the prompt bounds the Scaling follow-up
        question but does not reveal every workload, stakeholder priority, or outcome.
      update_trigger: For case "Now suppose the input does not fit", update Scaling
        follow-up when Scaling follow-up evidence—a Scaling follow-up trace or Scaling
