- id: dsa-11-disagreeing-with-interviewer
  version: 1.4.0
  target: dsa
  topic: Disagreement
  difficulty: 3
  interview_stage: live_coding
  template: dsa-recovery
  prompt: I think your solution is quadratic, is it not?
  context: The interviewer is wrong, possibly deliberately. Your solution is linear.
    The round is now testing whether you can hold your ground in English without either
    capitulating or becoming combative.
  follow_up:
    prompt: Can you trace the operation count with me and identify the loop or data
      structure that makes you believe the bound is lower?
    goal: Answer the failure challenge about Disagreement while keeping the evidence
      boundary explicit.
    challenge_kind: failure
    best_answer: >-
      I do not think so, but let me walk through it and you can
      tell me where I have gone wrong. If the failure in the follow-up appears,
      I would name the user or system consequence, contain it with a bounded mitigation,
      and verify recovery with a focused test or metric.
    distractors:
    - text: I would describe the Disagreement failure as impossible because the happy
        path already passed its test.
      why_wrong: Passing a happy path does not test the boundary, failure mode, or
        recovery being challenged.
    - text: I would add retries to Disagreement immediately and assume the system
        would become reliable.
      why_wrong: Retries can amplify load or duplicate effects; the failure and containment
        policy must be specified first.
  compression:
    prompt: 'Answer the challenge in two parts: count the dominant operations, then
      state the corrected bound if the objection holds.'
    goal: Compress the Disagreement answer into its decision, premise, trade-off,
      and verification step.
  best_answer: I do not think so, but let me walk through it and you can tell me where
    I have gone wrong. The inner loop only advances the left pointer, and that pointer
    never resets, so across the whole run it moves at most n times in total rather
    than n times per element.
  distractors:
  - text: Oh, you are probably right, sorry, I did not think about that carefully
      enough. Let me look at it again and see if I can find a better approach that
      avoids the nested structure.
    trap: pragmatics
    why_wrong: Capitulating to an incorrect claim is the failure mode this question
      is designed to expose.
  - text: No, it is definitely linear. The inner loop does not run n times for each
      element, that is a common misunderstanding of amortised analysis and it does
      not apply to this code.
    trap: register
    why_wrong: Correct content, but "a common misunderstanding" lectures the interviewer
      and creates friction unnecessarily.
  - text: I am not agree with that, because the internal loop is not running for each
      element, it advances only the left pointer and this pointer is not resetting
      never during the execution.
    trap: grammar
    why_wrong: '"I am not agree" and the double negative "not resetting never" are
      both L1 transfer errors that weaken a correct rebuttal.'
  feedback:
    register: Firm and collaborative. Invite correction while making your case.
    hedging: '"I do not think so" is the ideal calibrated opener: clear disagreement,
      no aggression.'
    precision: Win the point with the amortised argument, not with the assertion.
    grammar: '"I disagree" or "I do not agree", never "I am not agree"; use one negative
      per clause.'
    pragmatics: Offering to be corrected keeps the interviewer on your side while
      you defend the answer.
  rephrase:
    prompt: Disagree again in one sentence, then immediately offer your evidence.
    goal: Practise brevity in disagreement.
  language_focus:
  - register
  - grammar
  - pragmatics
  pt_help: '"Nao concordo" e "I disagree" ou "I do not agree". "I am not agree" e
    erro classico e muito visivel.'
  feynman:
    concept: Amortised analysis defended under social pressure.
    explain_to: A peer who counts nested loops to judge complexity.
    constraint: Explain using total distance walked, not code.
    self_check: Did you disagree and provide evidence in the same breath?
    reasoning_check: Can you identify the hidden premise behind Disagreement, give
      a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You folded, or you won the point rudely.
    expected: Calibrated disagreement plus the amortised argument.
    actual: Apology and retreat, or a lecture.
    root_cause: Disagreeing politely in a second language is harder than being either
      silent or blunt.
    repair: Memorise "I do not think so, but let me walk through it" as your opener.
    reasoning_error: If your Disagreement answer failed, classify the mistake as a
      fact, assumption, comparison, failure, or certainty error before proposing the
      smallest repair.
  recall:
    active_recall_cue: Why does a never-resetting pointer keep a nested loop linear?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Disagreement without presenting
      an assumption as a fact?
    black_box_probe: When the Disagreement answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: dsa-11-disagreeing-with-interviewer-delayed-11
      prompt: New evidence about Disagreement says a stakeholder clarifies a Disagreement
        requirement that changes the Disagreement success condition; with the Disagreement
        workload for Disagreement no longer fits the original resource bound, how
        do you update the Disagreement decision rule?
      changed_constraint: the Disagreement workload for Disagreement no longer fits
        the original resource bound
      new_evidence: a stakeholder clarifies a Disagreement requirement that changes
        the Disagreement success condition
      best_answer: I would keep the facts that remain supported about Disagreement,
        treat a stakeholder clarifies a Disagreement requirement that changes the
        Disagreement success condition as new evidence rather than a result, and state
        the updated decision rule under the Disagreement workload for Disagreement
        no longer fits the original resource bound. I would then name one focused
        check before treating the revised answer as settled.
      distractors:
      - text: I would preserve every part of the original Disagreement answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Disagreement explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/01-metodo-e-entrevistas/backend-interview-foundations/chapters/01-dsa-operating-system-and-pattern-selection.md
    note: Complexity reasoning used to defend a solution.
  - repo: original
    path: english-arcade/dsa/disagreeing-politely
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: 'Defend Disagreement after a counterexample: which Disagreement assumption
      changes, and what evidence keeps the revised Disagreement choice honest?'
    goal: Move from the short Disagreement answer to a deep, evidence-led defence
      without inventing an outcome.
  critical_thinking:
    problem_frame: 'Frame Disagreement before proposing a solution: state the actor,
      required outcome, constraint, and unknown that could invalidate the first recommendation.'
    claim_map:
      fact: The prompt explicitly tests Disagreement within a DSA live coding context;
        treat that named boundary as the verified starting fact.
      inference: The reasonable inference is that the answer must defend Disagreement,
        but that does not prove one implementation wins under every workload or audience.
      assumption: An unstated assumption is that the Disagreement constraint is the
        dominant one; label it and ask whether the interviewer confirms it.
      unknown: 'Still unknown for Disagreement: the scale, failure tolerance, ownership
        boundary, and evidence threshold that would change the decision.'
    comparison:
      applicable: false
      rejected_alternative: A tool-first A-versus-B debate about Disagreement would
        be a false equivalence because the prompt does not establish that both choices
        satisfy the same contract.
      hard_constraint: The hard Disagreement constraint is the required guarantee
        stated by the interviewer; no missing measurement licenses a stronger comparison.
      decision_rule: Do not manufacture a trade-off for Disagreement; first clarify
        the constraint or collect the evidence that would make two options genuinely
        comparable.
    failure_probe:
      kind: edge_case
      prompt: 'Disagreement: which empty or extreme Disagreement case would expose
        the hidden assumption, and what would you measure about Disagreement?'
    evidence_check:
      basis: Check the Disagreement claim against system-design-estudos/areas/01-metodo-e-entrevistas/backend-interview-foundations/chapters/01-dsa-operating-system-and-pattern-selection.md
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: This DSA live coding exercise can test reasoning about Disagreement,
        but it cannot prove an unmeasured production outcome, personal ownership,
        or universal rule.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: Certainty is medium because the prompt bounds the Disagreement question
        but does not reveal every workload, stakeholder priority, or outcome.
      update_trigger: For case "I think your solution is quadratic, is", update Disagreement
        when Disagreement evidence—a Disagreement trace or Disagreement test—contradicts
        the Disagreement constraint in case "I think your solution is quadratic, is";
        ask a stakeholder about Disagreement before revising.
    rubric:
      facts_correct: Names the verified Disagreement facts without smuggling in a
        result, scale, or capability that the prompt does not establish.
      assumptions_explicit: Labels the Disagreement premise that is still assumed
        and asks the smallest clarifying question that matters.
      alternatives_considered: Compares two credible Disagreement options, or explains
        the hard constraint that makes comparison a false equivalence.
      tradeoff_quality: Connects the Disagreement choice to a benefit, a cost or risk,
        and the condition under which another choice wins.
      follow_up_adaptation: Responds to the failure challenge about Disagreement by
        changing the claim or evidence boundary rather than repeating the base answer.
      certainty_calibration: Uses medium certainty deliberately and names the evidence
        that would update the Disagreement recommendation.
- id: dsa-12-time-pressure-triage
  version: 1.4.0
  target: dsa
  topic: Time pressure
  difficulty: 3
  interview_stage: live_coding
  template: dsa-recovery
  prompt: We have about five minutes left. How do you want to use them?
  context: Your solution is written but untested, and you know one edge case is probably
    broken. The interviewer is handing you the triage decision, and how you spend
    the time is itself the assessment.
  follow_up:
    prompt: With five minutes left, would you prioritise a working implementation,
      a trace, or a complexity defence, and why?
    goal: Answer the new_evidence challenge about Time pressure while keeping the
      evidence boundary explicit.
    challenge_kind: new_evidence
    best_answer: >-
      I would spend three minutes tracing the duplicate-heavy case, because that is where I
      think the bug is, and keep the last two for complexity. I would keep
      the claims that remain supported, identify exactly which premise the new observation changes, and
      run a focused check before revising the decision.
    distractors:
    - text: I would keep the Time pressure recommendation unchanged because changing
        position would look inconsistent.
      why_wrong: A defensible answer updates when relevant evidence changes an assumption
        or trade-off.
    - text: I would discard every earlier Time pressure claim as soon as one new observation
        appeared.
      why_wrong: New evidence may narrow one claim while leaving other verified facts
        intact.
  compression:
    prompt: Give the time-pressure plan as three actions with a stopping rule for
      the final minute.
    goal: Compress the Time pressure answer into its decision, premise, trade-off,
      and verification step.
  best_answer: I would spend three minutes tracing the duplicate-heavy case, because
    that is where I think the bug is, and keep the last two for complexity. I would
    rather leave with a verified weakness named than with an untested solution that
    looks finished.
  distractors:
  - text: I would like to finish the optimisation I was thinking about earlier, because
      the current version is not as efficient as it could be and I would prefer to
      show you the better approach if there is time.
    trap: content
    why_wrong: Optimising untested code is the wrong triage; correctness precedes
      performance in every interview rubric.
  - text: Whatever you prefer, really. I am happy to do whichever part you think would
      be most useful, so I will follow your lead on how we should use the remaining
      time here.
    trap: pragmatics
    why_wrong: The question delegated the decision to you; handing it back forfeits
      the signal entirely.
  - text: Five minutes is not enough time for finish everything, so I will make the
      test of the duplicate case and after I explain the complexity if it remains
      some time.
    trap: grammar
    why_wrong: '"For finish", "make the test" and "if it remains some time" are calques
      that obscure otherwise sound triage.'
  feedback:
    register: Decisive and calm. Naming a known weakness reads as confidence, not
      failure.
    hedging: Hedge the location of the bug ("where I think"), never the plan.
    precision: Allocate the minutes explicitly; vague intent is not a plan.
    grammar: '"Enough time to finish", "run the test", and "if there is time left".'
    pragmatics: Take the decision you were offered and justify it in one clause.
  rephrase:
    prompt: State the same plan in one sentence, leading with what you would sacrifice.
    goal: Practise making the trade-off explicit under pressure.
  language_focus:
  - precision
  - grammar
  - pragmatics
  feynman:
    concept: Triage under a hard deadline, correctness before optimisation.
    explain_to: A junior engineer who optimises before testing.
    constraint: Explain using an exam with unanswered questions left.
    self_check: Did you say what you were choosing not to do?
    reasoning_check: Can you identify the hidden premise behind Time pressure, give
      a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You optimised, or handed the decision back to the interviewer.
    expected: An explicit minute allocation with correctness first.
    actual: Deference, or polishing code that was never verified.
    root_cause: Time pressure plus reluctance to name a suspected bug out loud.
    repair: 'Default to: verify the weakest case, then state complexity.'
    reasoning_error: If your Time pressure answer failed, classify the mistake as
      a fact, assumption, comparison, failure, or certainty error before proposing
      the smallest repair.
  recall:
    active_recall_cue: With five minutes left and untested code, what comes first?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Time pressure without presenting
      an assumption as a fact?
    black_box_probe: When the Time pressure answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: dsa-12-time-pressure-triage-delayed-12
      prompt: 'Time pressure gets a new constraint: a stakeholder asks for a stronger
        Time pressure guarantee than the first Time pressure answer promised. After
        a trace of Time pressure isolates a different Time pressure bottleneck than
        the one you named, which Time pressure assumption is no longer safe?'
      changed_constraint: a stakeholder asks for a stronger Time pressure guarantee
        than the first Time pressure answer promised
      new_evidence: a trace of Time pressure isolates a different Time pressure bottleneck
        than the one you named
      best_answer: I would keep the facts that remain supported about Time pressure,
        treat a trace of Time pressure isolates a different Time pressure bottleneck
        than the one you named as new evidence rather than a result, and state the
        updated decision rule under a stakeholder asks for a stronger Time pressure
        guarantee than the first Time pressure answer promised. I would then name
        one focused check before treating the revised answer as settled.
      distractors:
