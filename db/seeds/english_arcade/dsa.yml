---
contract_version: 1.4.0
target:
  key: dsa
  label: DSA and Algorithms
  blurb: Say the pattern, state the invariant, defend the complexity. In an English
    interview the reasoning is graded before the code is.
  focus_areas:
  - pattern selection and naming
  - invariants and loop reasoning
  - complexity and trade-off language
  - Ruby runtime traps
  - thinking aloud under time pressure
  simulation:
    minutes: 45
    structure:
    - label: Clarify and restate
      minutes: 5
    - label: Name the pattern and the invariant
      minutes: 5
    - label: Code while narrating
      minutes: 20
    - label: Test, trace and fix out loud
      minutes: 10
    - label: Complexity and scaling follow-up
      minutes: 5
  critical_thinking:
    learner_prompts:
      evidence_ledger: For DSA live coding, record whether each claim about the input
        contract, invariant, complexity, and edge case is a verified fact, an inference,
        an assumption, or an unknown before you defend it.
      problem_frame: Frame every DSA live coding answer with the actor, requirement,
        constraint, success condition, and unanswered question that could change the
        decision.
      comparison: When DSA live coding offers a real choice, compare two options by
        benefit, cost or risk, valid-when condition, and an explicit decision rule.
      failure_probe: Ask which counterexample, edge case, or failure mode could break
        the DSA live coding recommendation, then state the smallest test or containment
        step.
      certainty_review: 'Calibrate certainty in DSA live coding: name the evidence,
        separate correlation from causality, and say what new observation would make
        you revise the answer.'
    rubric:
      facts_correct: Names the verified the input contract, invariant, complexity,
        and edge case facts without smuggling in a result or capability that the prompt
        does not establish.
      assumptions_explicit: Labels the DSA live coding premise that is still assumed
        and asks the smallest clarifying question that matters.
      alternatives_considered: Considers a credible alternative for DSA live coding,
        or explains the hard constraint that makes comparison a false equivalence.
      tradeoff_quality: Connects the DSA live coding choice to a benefit, a cost or
        risk, and the condition under which another choice wins.
      follow_up_adaptation: Responds to an adversarial DSA live coding follow-up by
        changing the claim or evidence boundary rather than repeating a memorised
        answer.
      certainty_calibration: Uses high, medium, or low certainty deliberately and
        names the evidence that would update the DSA live coding recommendation.
templates:
- id: dsa-narration
  label: DSA narration template
  applies_to: live_coding
  steps:
  - Restate the problem and confirm the input contract.
  - Name the pattern out loud and say why it fits this input.
  - State the invariant the loop or recursion preserves.
  - Code while narrating decisions, not keystrokes.
  - Trace one small example including an edge case.
  - Give time and space complexity and name the dominant term.
  source:
    repo: system-design-estudos
    path: areas/01-metodo-e-entrevistas/backend-interview-foundations/chapters/01-dsa-operating-system-and-pattern-selection.md
    note: Pattern-selection chapter this narration order is built on.
- id: dsa-recovery
  label: Mid-problem recovery template
  applies_to: live_coding
  steps:
  - Say plainly that you found a problem, without apologising twice.
  - Name the failing case concretely.
  - State the smallest fix you believe is correct.
  - Re-trace and confirm the invariant still holds.
  source:
    repo: system-design-estudos
    path: areas/01-metodo-e-entrevistas/snippets/senior-production-answer-template.md
    note: Impact-first recovery order reused for live-coding mistakes.
cards:
- id: dsa-card-pattern-first
  front: How do you open a live-coding answer in English?
  back: Pattern name, why it fits this input shape, then the invariant. Code only
    after the interviewer has heard the plan.
  box: 1
  source:
    repo: system-design-estudos
    path: areas/01-metodo-e-entrevistas/backend-interview-foundations/chapters/01-dsa-operating-system-and-pattern-selection.md
    note: Opening-minute discipline for algorithm rounds.
  critical_thinking:
    cue: How do you open a live-coding answer in English? Before answering, separate
      the stated fact from your assumption and name one condition that could change
      it.
    check: For this DSA live coding card, can you compare two options, name one failure
      mode, and state what evidence would update the recommendation?
- id: dsa-card-invariant
  front: What counts as an invariant rather than a description of the loop?
  back: A property true at a fixed point of every iteration. "It moves forward and
    updates the answer" is control flow, not an invariant.
  box: 1
  source:
    repo: system-design-estudos
    path: areas/01-metodo-e-entrevistas/backend-interview-foundations/chapters/02-dsa-core-problems-in-ruby-and-typescript.md
    note: Core problems where invariants are stated explicitly.
  critical_thinking:
    cue: What counts as an invariant rather than a description of the loop? Before
      answering, separate the stated fact from your assumption and name one condition
      that could change it.
    check: For this DSA live coding card, can you compare two options, name one failure
      mode, and state what evidence would update the recommendation?
- id: dsa-card-hedging
  front: How much hedging belongs in a complexity claim?
  back: 'None on the bound itself. Hedge only a genuinely data-dependent worst case:
    "linear in n, worst case an array with no repeats".'
  box: 2
  source:
    repo: original
    path: english-arcade/dsa/hedging-calibration
    note: Distilled from the hedging failures authored in this pack.
  critical_thinking:
    cue: How much hedging belongs in a complexity claim? Before answering, separate
      the stated fact from your assumption and name one condition that could change
      it.
    check: For this DSA live coding card, can you compare two options, name one failure
      mode, and state what evidence would update the recommendation?
items:
- id: dsa-01-pattern-naming
  version: 1.4.0
  target: dsa
  topic: Pattern selection
  difficulty: 1
  interview_stage: live_coding
  template: dsa-narration
  prompt: Before you start coding, can you tell me how you are thinking about this
    one?
  context: Live coding round. You have an array of integers and need the longest run
    of distinct values. The interviewer wants the approach spoken before any syntax
    appears on screen.
  follow_up:
    prompt: Suppose the array arrives in chunks and you cannot store every previous value.
      Which invariant survives, what state would you bound, and when would you say the
      problem no longer has the same contract?
    goal: Defend the sliding-window invariant under a memory constraint and identify the
      point where an exact answer requires a clarified contract.
    challenge_kind: failure
    best_answer: >-
      The sliding-window invariant survives only if the stream has a finite retention rule or
      the task allows an approximate answer. For an exact longest run, I need the last position
      of each value in the active window; if distinct values can grow without bound, the memory
      limit makes the original contract impossible. I would ask whether eviction or approximation
      is acceptable and test a repeated-value boundary case before coding.
    distractors:
    - text: I would keep only the current chunk and assume the longest run cannot cross a
        chunk boundary, because bounded memory is more important than the original answer.
      why_wrong: It silently changes the input contract and can miss a valid run spanning chunks.
    - text: I would store every value anyway and call the solution bounded because each chunk
        arrives separately.
      why_wrong: Chunking does not bound the number of distinct values, so the stated memory
        constraint remains unsatisfied.
    answer_anchors:
    - Keep the window invariant only while the stream retention or approximation contract is explicit.
    - Exact tracking needs the last position of each value in the active window.
    - Ask whether eviction or approximation is acceptable when distinct state can grow without bound.
  compression:
    prompt: Compress your opening into the pattern, the maintained state, and the
      condition that moves the left edge.
    goal: Compress the Pattern selection answer into its decision, premise, trade-off,
      and verification step.
  best_answer: This looks like a sliding-window problem, because the answer is a contiguous
    run and I can extend the right edge and pull the left edge in when a duplicate
    appears. I would keep a hash of the last index of each value, so shrinking is
    one jump rather than a scan.
  distractors:
  - text: I think maybe it could possibly be some kind of window thing, if that makes
      sense, but I am not really sure yet, so perhaps I could just try something and
      we can see how it goes from there.
    trap: hedging
    why_wrong: Stacked hedges read as low confidence. One hedge is fine at C2; four
      in a row signals you have no plan.
  - text: Obviously it is a sliding window. Anyone who has done these knows that immediately,
      so I will just write it. There is not much to discuss about the approach here
      before the code.
    trap: register
    why_wrong: Dismissive framing closes the conversation the interviewer opened and
      makes a collaborative round feel adversarial.
  - text: I am going to make a window that walks in the array and every time it has
      a repeated it comes back the left for to remove the repeated value until the
      window stays clean again for continue.
    trap: grammar
    why_wrong: Preposition and infinitive errors ("walks in", "for to remove") come
      straight from Portuguese and pull attention away from correct logic.
  feedback:
    register: 'Neutral professional register: confident, collaborative, no slang and
      no showing off.'
    hedging: One calibrated hedge such as "this looks like" keeps you open to correction
      without sounding lost.
    precision: Name the pattern and the data structure. "Hash of the last index" is
      precise; "some kind of map" is not.
    grammar: '"Walks through the array" and "in order to remove" are the natural collocations;
      avoid the Portuguese "for to" pattern.'
    pragmatics: The interviewer asked how you are thinking, so lead with approach
      rather than code or a verdict on difficulty.
  rephrase:
    prompt: Say the same approach again in two sentences, as if the interviewer had
      just told you there is only a minute left.
    goal: Compress without losing the pattern name or the invariant.
  language_focus:
  - hedging
  - precision
  - register
  pt_help: '"Sliding window" nao se traduz em entrevista. Diga o nome em ingles e
    explique o porque.'
  feynman:
    concept: Maintaining a contiguous run while preserving a uniqueness invariant.
    explain_to: A junior developer who has never heard the term "window".
    constraint: Explain why the left boundary moves, why the last position is enough for
      this predicate, and when a nested scan would be an acceptable alternative.
    self_check: Could the listener state the invariant, name a repeated-value counterexample,
      and explain the time and space cost without seeing code?
    reasoning_check: Can you compare the linear window with a simpler quadratic scan, identify
      the input bound that changes the decision, and update the pattern when the predicate changes?
  black_box:
    symptom: You name a sliding window but cannot say what remains true after the left
      boundary moves.
    expected: The answer states the contiguous-run invariant, the stored last position,
      and the condition under which the alternative is acceptable.
    actual: The pattern label appears without an input-contract check, edge-case trace,
      or complexity argument.
    root_cause: The rehearsal memorised a pattern name instead of testing whether its
      invariant and memory cost fit the actual problem.
    repair: Restate the predicate, trace a repeated value, compare with a bounded nested
      scan, and only then commit to the implementation and complexity.
    reasoning_error: If the choice failed, classify whether the error was a misread fact,
      hidden assumption, invalid comparison, missed failure case, or overconfident bound.
  recall:
    active_recall_cue: Which pattern fits a contiguous run with a uniqueness constraint,
      and what does the hash store?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Pattern selection without
      presenting an assumption as a fact?
    black_box_probe: When the Pattern selection answer failed, did you locate the
      reasoning error before changing the implementation?
    delayed_variant:
      id: dsa-01-pattern-naming-delayed-1
      prompt: On a fresh problem, the interviewer changes the success condition to the
        longest run whose values each occur at most twice, with tests for an empty array
        and [7, 7, 7]. What carries over from your reasoning, and what would you re-check
        before claiming linear time?
      changed_constraint: The target run now allows each value at most twice, and the answer
        must handle an empty input and a value occurring three times.
      new_evidence: The interviewer supplies the edge cases [] and [7, 7, 7] and defines the
        required predicate as frequency at most two within the run.
      best_answer: The contiguous-window idea and the need to move the left edge when the
        invariant breaks still carry over. I would revise the invariant to every value having
        count at most two, maintain counts rather than only last positions, and explicitly
        trace [] and [7, 7, 7]. I would then re-check that each value enters and leaves the
        window a bounded number of times before claiming linear time.
      distractors:
      - text: I would keep the uniqueness invariant and reject [7, 7, 7] as invalid input,
          because the original problem only allowed distinct values in a run.
        why_wrong: The new success condition permits two copies and explicitly requires the
          triple-occurrence edge case to be handled.
      - text: I would claim linear time immediately because every sliding-window problem has
          the same complexity, without tracing the count updates.
        why_wrong: Complexity depends on the actual state transitions and implementation, not
          on the pattern name alone.
      answer_anchors:
      - Keep contiguity and the moving boundary, but revise uniqueness to a count-at-most-two invariant.
      - Trace empty input and a triple occurrence before claiming the new predicate is handled.
      - Verify bounded entry and exit work for each value before asserting linear time.
      reasoning_moves:
        preserve: Keep the contiguous-window structure and move the left edge when the invariant breaks.
        revise: Replace uniqueness and last-position state with a frequency-at-most-two invariant and counts.
        verify: Trace empty input and a triple occurrence, then count each value's entry and exit operations.
        certainty_update: Claim linear time only after the revised count transitions are checked against the new predicate.
  sources:
  - repo: system-design-estudos
    path: areas/01-metodo-e-entrevistas/backend-interview-foundations/chapters/01-dsa-operating-system-and-pattern-selection.md
    note: Pattern selection and naming discipline for the opening minute.
  - repo: original
    path: english-arcade/dsa/pattern-naming
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: The interviewer says the input is always at most 20 values but asks for the
      clearest implementation. Would you still choose the same approach, and what would
      you test before defending the complexity claim?
    goal: Compare a linear window with a simpler bounded-input alternative and make the
      decision rule depend on an explicit constraint.
  critical_thinking:
    problem_frame: Frame a live-coding answer for a contiguous longest-distinct-run problem;
      the decision must preserve order, state an invariant, and respect the input and memory bounds.
    claim_map:
      fact: The input is an array of integers and the required result is the longest contiguous
        run containing no repeated value.
      inference: A last-position map can move the left boundary directly and support linear
        traversal, but that does not make it the only correct implementation.
      assumption: The input may be large enough that quadratic work is undesirable; ask for the
        size bound and whether extra memory is acceptable.
      unknown: The actual input bound, memory limit, mutation policy, and expected proof depth are
        not specified by the opening question.
    comparison:
      applicable: true
      alternatives:
      - option: Sliding window with a last-position map.
        benefit: It preserves contiguity and moves the left boundary directly, giving linear
          traversal for the stated predicate.
        cost_or_risk: It uses extra space proportional to distinct values and requires a clearly
          stated invariant to avoid stale indices.
        valid_when: The input can be large, original order matters, and linear time justifies the
          additional state.
      - option: Nested scan with a fresh set from each start index.
        benefit: It is straightforward to prove and can be the clearest baseline for a very small,
          explicitly bounded input.
        cost_or_risk: It repeats work and becomes quadratic, so it may fail the time contract as n grows.
        valid_when: The input bound is genuinely small and the interviewer accepts quadratic time
          or wants a simple correctness baseline.
      decision_rule: Ask for the input bound and memory limit; choose the window for scalable linear
        work, or the nested scan only when the small bound makes its simpler proof worth the repeated work.
    failure_probe:
      kind: counterexample
      prompt: Which array would expose a careless left-boundary update that loses a valid run,
        and which invariant or test would reveal the mistake?
    evidence_check:
      basis: Check the invariant, complexity claim, and alternative against the stated array
        contract and the local DSA interview material; record what the examples actually establish.
      source_kind: authored_scenario
      limitation: This exercise can test algorithmic reasoning and communication, but it cannot
        prove performance on an unspecified input distribution or a universal pattern rule.
      checked_on: '2026-08-25'
    certainty:
      level: high
      rationale: Certainty is high about the invariant and its linear implementation under the
        stated predicate, but not about which alternative wins before bounds and memory are known.
      update_trigger: Update the choice when the interviewer supplies a small input bound, a strict
        memory limit, a changed predicate, or a counterexample to the stated invariant.
    rubric:
      facts_correct: States the array contract, contiguous-run requirement, invariant, and
        complexity without importing an unstated scale.
      assumptions_explicit: Names the assumed input bound, memory budget, and mutation policy,
        then asks the smallest question that changes the choice.
      alternatives_considered: Compares a linear last-position window with a nested-scan baseline
        and states when each is valid.
      tradeoff_quality: Connects time, space, proof simplicity, and input bounds to the selected
        pattern instead of treating the label as the reason.
      follow_up_adaptation: Revises the invariant and state when the predicate or memory constraint
        changes, then tests the new edge case before claiming correctness.
      certainty_calibration: Uses high certainty for the stated invariant but qualifies the choice
        until bounds and implementation details are confirmed.
    defense_checks:
    - id: dsa-01-pattern-naming-defense-alternative-boundary
      axis: alternatives
      prompt: If the input bound is tiny, what evidence would justify choosing the nested scan
        instead of the linear window, and what limit would reverse that decision?
      best_answer: I would confirm the bound and accepted complexity, use the nested scan when its
        proof simplicity is worth quadratic work, and switch to the window when growth makes that cost material.
      distractors:
      - text: I would choose the nested scan because a small sample always predicts a small production input.
        why_wrong: A sample does not establish the input bound or protect the decision from later growth.
      - text: I would choose the linear window automatically because quadratic work is never acceptable.
        why_wrong: Complexity is a requirement-dependent trade-off, and a tiny bound may justify a simpler baseline.
- id: dsa-02-invariant-statement
  version: 1.4.0
  target: dsa
  topic: Invariants
  difficulty: 2
  interview_stage: live_coding
  template: dsa-narration
  prompt: What exactly does your loop keep true on every iteration?
  context: You are halfway through a two-pointer solution and the interviewer stops
    you to check whether you can state the property that makes the algorithm correct,
    rather than merely passing the tests.
  follow_up:
    prompt: When the window contains a duplicate, which exact update restores your
      invariant, and how would you demonstrate it on [a,b,a]?
    goal: Answer the new_evidence challenge about Invariants while keeping the evidence
      boundary explicit.
    challenge_kind: new_evidence
    best_answer: >-
      At the top of every iteration the segment between the two pointers holds only
      distinct values, and everything left of the slow pointer has already been counted. I
      would keep the claims that remain supported, identify exactly which premise the new observation
      changes, and run a focused check before revising the decision.
    distractors:
    - text: I would keep the Invariants recommendation unchanged because changing
        position would look inconsistent.
      why_wrong: A defensible answer updates when relevant evidence changes an assumption
        or trade-off.
    - text: I would discard every earlier Invariants claim as soon as one new observation
        appeared.
      why_wrong: New evidence may narrow one claim while leaving other verified facts
        intact.
  compression:
    prompt: State the loop invariant and its repair condition in two sentences, including
      what is true before the next iteration.
    goal: Compress the Invariants answer into its decision, premise, trade-off, and
      verification step.
  best_answer: At the top of every iteration the segment between the two pointers
    holds only distinct values, and everything left of the slow pointer has already
    been counted. That is what lets me move the fast pointer forward without rechecking
    anything behind it.
  distractors:
  - text: The loop keeps going until the end of the array, and each time it checks
      the current element and updates the answer if the answer needs updating, then
      moves forward and repeats that process.
    trap: precision
    why_wrong: This describes control flow, not an invariant. It would stay true of
      almost any loop and proves nothing about correctness.
  - text: Since the beginning the segment between the two pointers is having only
      distinct values and all the values in the left of the slow pointer was already
      counted before we advance the fast one.
    trap: grammar
    why_wrong: '"Is having" misuses a stative verb and "was already counted" breaks
      agreement, undercutting otherwise correct reasoning.'
  - text: Honestly it just works. I have solved this shape of problem plenty of times
      and the invariant is the usual one for two pointers, so I would rather spend
      the time on code than on the proof.
    trap: pragmatics
    why_wrong: Refusing the question loses the exact signal being probed, which is
      whether you reason or pattern-match.
  feedback:
    register: 'Explaining correctness is a senior register moment: measured, specific,
      no appeal to experience alone.'
    hedging: Do not hedge an invariant. It either holds or it does not, so state it
      flatly.
    precision: An invariant is a property true at a fixed point in the loop, not a
      description of what the loop does.
    grammar: Use simple present for invariants ("holds", "have been counted") and
      avoid progressive forms of stative verbs.
    pragmatics: Answer the correctness question directly before returning to the code.
  rephrase:
    prompt: Restate the invariant beginning with "At the top of each iteration" and
      stop after one sentence.
    goal: Force a single precise claim instead of a narration.
  language_focus:
  - precision
  - grammar
  - pragmatics
  feynman:
    concept: Loop invariant as the property that makes an algorithm correct.
    explain_to: A tester who trusts examples more than proofs.
    constraint: Use a queue at a bakery as the only example.
    self_check: Did you state something that stays true, rather than something that
      happens?
    reasoning_check: Can you identify the hidden premise behind Invariants, give a
      counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: Your answer narrated the loop body instead of naming a property.
    expected: A single sentence that is true at a fixed point of each pass.
    actual: A step-by-step retelling of what the code does.
    root_cause: Confusing behaviour with correctness, often because the invariant
      was never made explicit while solving.
    repair: Before coding, write the invariant as one sentence starting "At the top
      of each iteration".
    reasoning_error: If your Invariants answer failed, classify the mistake as a fact,
      assumption, comparison, failure, or certainty error before proposing the smallest
      repair.
  recall:
    active_recall_cue: What is the difference between an invariant and a description
      of the loop body?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Invariants without presenting
      an assumption as a fact?
    black_box_probe: When the Invariants answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: dsa-02-invariant-statement-delayed-2
      prompt: 'Review note for Invariants: a trace of Invariants isolates a different
        Invariants bottleneck than the one you named. Given a stakeholder asks for
        a stronger Invariants guarantee than the first Invariants answer promised,
        what would you now defend, retract, and verify about Invariants?'
      changed_constraint: a stakeholder asks for a stronger Invariants guarantee than
        the first Invariants answer promised
      new_evidence: a trace of Invariants isolates a different Invariants bottleneck
        than the one you named
      best_answer: I would keep the facts that remain supported about Invariants,
        treat a trace of Invariants isolates a different Invariants bottleneck than
        the one you named as new evidence rather than a result, and state the updated
        decision rule under a stakeholder asks for a stronger Invariants guarantee
        than the first Invariants answer promised. I would then name one focused check
        before treating the revised answer as settled.
      distractors:
      - text: I would preserve every part of the original Invariants answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Invariants explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/01-metodo-e-entrevistas/backend-interview-foundations/chapters/02-dsa-core-problems-in-ruby-and-typescript.md
    note: Core problem walkthroughs where invariants are made explicit.
  - repo: original
    path: english-arcade/dsa/invariant-statement
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: 'Deep dive on Invariants: compare Invariants options with one measurement;
      which failure around Invariants would make Invariants switch?'
    goal: Move from the short Invariants answer to a deep, evidence-led defence without
      inventing an outcome.
  critical_thinking:
    problem_frame: 'Frame Invariants before proposing a solution: state the actor,
      required outcome, constraint, and unknown that could invalidate the first recommendation.'
    claim_map:
      fact: The prompt explicitly tests Invariants within a DSA live coding context;
        treat that named boundary as the verified starting fact.
      inference: The reasonable inference is that the answer must defend Invariants,
        but that does not prove one implementation wins under every workload or audience.
      assumption: An unstated assumption is that the Invariants constraint is the
        dominant one; label it and ask whether the interviewer confirms it.
      unknown: 'Still unknown for Invariants: the scale, failure tolerance, ownership
        boundary, and evidence threshold that would change the decision.'
    comparison:
      applicable: true
      alternatives:
      - option: the named algorithmic pattern for Invariants
        benefit: It keeps the Invariants reasoning close to the stated DSA live coding
          constraint and makes the evidence boundary visible.
        cost_or_risk: It can be too narrow if the Invariants workload or requirement
          changes beyond the prompt.
        valid_when: Use it when the stated Invariants contract and its invariant are
          the facts that matter most.
      - option: a broader-state or sorting alternative for Invariants
        benefit: It can make the Invariants boundary more explicit when the first
          option's hidden assumption is not guaranteed.
        cost_or_risk: It adds implementation or communication cost and may solve a
          problem the Invariants evidence has not established.
        valid_when: Use it when a measured constraint, requirement, or failure mode
          makes the first option unsafe.
      decision_rule: Choose the first Invariants option when its stated contract holds;
        choose the alternative only when evidence shows that the relevant DSA live
        coding constraint makes the first assumption unsafe.
    failure_probe:
      kind: edge_case
      prompt: 'Invariants: what Invariants limit should you probe before trusting
        the answer, and how would Invariants behave there?'
    evidence_check:
      basis: Check the Invariants claim against system-design-estudos/areas/01-metodo-e-entrevistas/backend-interview-foundations/chapters/02-dsa-core-problems-in-ruby-and-typescript.md
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: This DSA live coding exercise can test reasoning about Invariants,
        but it cannot prove an unmeasured production outcome, personal ownership,
        or universal rule.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: Certainty is medium because the prompt bounds the Invariants question
        but does not reveal every workload, stakeholder priority, or outcome.
      update_trigger: For case "What exactly does your loop keep true", update Invariants
        when Invariants evidence—a Invariants trace or Invariants test—contradicts
        the Invariants constraint in case "What exactly does your loop keep true";
