  - repo: system-design-estudos
    path: areas/01-metodo-e-entrevistas/backend-interview-foundations/chapters/04-system-design-canonical-problems.md
    note: Canonical scaling follow-ups that pair with algorithm rounds.
  - repo: original
    path: english-arcade/dsa/scaling-followup
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: Connect Scaling follow-up, connect the Scaling follow-up implementation
      choice to its failure mode, measurement, and condition for choosing the alternative.
    goal: Move from the short Scaling follow-up answer to a deep, evidence-led defence
      without inventing an outcome.
  critical_thinking:
    problem_frame: 'Frame Scaling follow-up before proposing a solution: state the
      actor, required outcome, constraint, and unknown that could invalidate the first
      recommendation.'
    claim_map:
      fact: The prompt explicitly tests Scaling follow-up within a DSA live coding
        context; treat that named boundary as the verified starting fact.
      inference: The reasonable inference is that the answer must defend Scaling follow-up,
        but that does not prove one implementation wins under every workload or audience.
      assumption: An unstated assumption is that the Scaling follow-up constraint
        is the dominant one; label it and ask whether the interviewer confirms it.
      unknown: 'Still unknown for Scaling follow-up: the scale, failure tolerance,
        ownership boundary, and evidence threshold that would change the decision.'
    comparison:
      applicable: true
      alternatives:
      - option: the named algorithmic pattern for Scaling follow-up
        benefit: It keeps the Scaling follow-up reasoning close to the stated DSA
          live coding constraint and makes the evidence boundary visible.
        cost_or_risk: It can be too narrow if the Scaling follow-up workload or requirement
          changes beyond the prompt.
        valid_when: Use it when the stated Scaling follow-up contract and its invariant
          are the facts that matter most.
      - option: a broader-state or sorting alternative for Scaling follow-up
        benefit: It can make the Scaling follow-up boundary more explicit when the
