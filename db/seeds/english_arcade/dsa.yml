- id: dsa-06-mid-problem-recovery
  version: 1.4.0
  target: dsa
  topic: Recovering from a mistake
  difficulty: 3
  interview_stage: live_coding
  template: dsa-recovery
  prompt: You have gone quiet. What is going on in your head right now?
  context: You noticed two minutes ago that your recursion never handles the empty
    subtree, and you have been silently editing. The interviewer cannot see your reasoning
    and is prompting you to narrate.
  follow_up:
    prompt: After finding the failing trace, how would you narrate the smallest repair
      while preserving the invariant?
    goal: Answer the failure challenge about Recovering from a mistake while keeping
      the evidence boundary explicit.
    challenge_kind: failure
    best_answer: >-
      I went internal for a moment, apologies. If the failure in the follow-up appears,
      I would name the user or system consequence, contain it with a bounded mitigation,
      and verify recovery with a focused test or metric.
    distractors:
    - text: I would describe the Recovering from a mistake failure as impossible because
        the happy path already passed its test.
      why_wrong: Passing a happy path does not test the boundary, failure mode, or
        recovery being challenged.
    - text: I would add retries to Recovering from a mistake immediately and assume
        the system would become reliable.
      why_wrong: Retries can amplify load or duplicate effects; the failure and containment
        policy must be specified first.
  compression:
    prompt: Summarize the recovery in one sentence naming the failing case, the repair,
      and the check that restores confidence.
    goal: Compress the Recovering from a mistake answer into its decision, premise,
      trade-off, and verification step.
  best_answer: I went internal for a moment, apologies. I found a case my recursion
    does not handle, an empty subtree, where it returns nil and the caller expects
    a number. I am adding a base case that returns zero, then I will re-trace the
    small example to confirm nothing else shifted.
  distractors:
  - text: Nothing, everything is fine, I am just concentrating on getting this part
      written properly and then I will explain the whole thing once it is finished
      and working the way I want.
    trap: pragmatics
    why_wrong: Denying the problem removes the interviewer from the loop, and silent
      debugging is exactly what the round penalises.
  - text: I am stuck, I really do not know what is wrong, this is not going well at
      all and I am worried I will not finish in time, maybe I should just start the
      whole thing again from scratch.
    trap: register
    why_wrong: Catastrophising invites the interviewer to lose confidence, and the
      restart proposal discards working code.
  - text: I have found one case that is not handling, the empty subtree, so I am putting
      a base case for return zero and after I will make the trace again for confirm
      that nothing more changed.
    trap: grammar
    why_wrong: '"Is not handling" and "for confirm" are direct Portuguese calques
      that reduce perceived fluency under pressure.'
  feedback:
    register: One brief acknowledgement, then straight to substance. Never catastrophise.
    hedging: Do not hedge a diagnosis you are sure of; hedge only consequences you
      have not verified.
    precision: Name the failing case and the wrong return value, not just "a bug".
    grammar: Use "does not handle" for a property and "in order to confirm" for purpose.
    pragmatics: Narration is as much the deliverable here as the code is.
  rephrase:
    prompt: Say the same recovery without the word "sorry" and without losing politeness.
    goal: Break the reflex apology while keeping a collaborative tone.
  language_focus:
  - grammar
  - register
  - pragmatics
  pt_help: '"Para confirmar" vira "to confirm" ou "in order to confirm", nunca "for
    confirm".'
  feynman:
    concept: Narrated recovery as a signal of engineering maturity.
    explain_to: A candidate who believes silence hides mistakes.
    constraint: Explain using a surgeon talking through an operation.
    self_check: Did you state the failing case before proposing any fix?
    reasoning_check: Can you identify the hidden premise behind Recovering from a
      mistake, give a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You debugged silently, or spiralled into apology.
    expected: Brief acknowledgement, named failing case, smallest fix, re-trace.
    actual: Long silence, denial, or a proposal to restart from scratch.
    root_cause: Panic plus missing phrases for narrating uncertainty in a second language.
    repair: Rehearse the four-move recovery until it survives being nervous.
    reasoning_error: If your Recovering from a mistake answer failed, classify the
      mistake as a fact, assumption, comparison, failure, or certainty error before
      proposing the smallest repair.
  recall:
    active_recall_cue: What are the four moves of a clean live-coding recovery?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Recovering from a mistake
      without presenting an assumption as a fact?
    black_box_probe: When the Recovering from a mistake answer failed, did you locate
      the reasoning error before changing the implementation?
    delayed_variant:
      id: dsa-06-mid-problem-recovery-delayed-6
      prompt: The Recovering from a mistake review adds a stakeholder clarifies a
        Recovering from a mistake requirement that changes the Recovering from a mistake
        success condition while the Recovering from a mistake workload for Recovering
        from a mistake no longer fits the original resource bound; which conclusion
        about Recovering from a mistake would you narrow before proposing a repair?
      changed_constraint: the Recovering from a mistake workload for Recovering from
        a mistake no longer fits the original resource bound
      new_evidence: a stakeholder clarifies a Recovering from a mistake requirement
        that changes the Recovering from a mistake success condition
      best_answer: I would keep the facts that remain supported about Recovering from
        a mistake, treat a stakeholder clarifies a Recovering from a mistake requirement
        that changes the Recovering from a mistake success condition as new evidence
        rather than a result, and state the updated decision rule under the Recovering
        from a mistake workload for Recovering from a mistake no longer fits the original
        resource bound. I would then name one focused check before treating the revised
        answer as settled.
      distractors:
      - text: I would preserve every part of the original Recovering from a mistake
          answer because changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Recovering from a mistake explanation with
          a new design without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
