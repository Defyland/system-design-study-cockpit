- id: dsa-07-tradeoff-language
  version: 1.4.0
  target: dsa
  topic: Time and space trade-offs
  difficulty: 2
  interview_stage: deep_dive
  template: dsa-narration
  prompt: Could you do this with less memory, and would you want to?
  context: Your hash-based solution is linear in both time and space. The interviewer
    is testing whether you can hold two options in the air and choose one with a stated
    reason rather than defaulting.
  follow_up:
    prompt: If memory became the constraint instead of latency, which state would
      you remove first and what cost would you accept?
    goal: Answer the new_evidence challenge about Time and space trade-offs while
      keeping the evidence boundary explicit.
    challenge_kind: new_evidence
    best_answer: >-
      I could sort first and scan, which drops the extra memory to effectively nothing
      but pushes time to n log n. I would keep the claims that remain
      supported, identify exactly which premise the new observation changes, and run a focused check
      before revising the decision.
    distractors:
    - text: I would keep the Time and space trade-offs recommendation unchanged because
        changing position would look inconsistent.
      why_wrong: A defensible answer updates when relevant evidence changes an assumption
        or trade-off.
    - text: I would discard every earlier Time and space trade-offs claim as soon
        as one new observation appeared.
      why_wrong: New evidence may narrow one claim while leaving other verified facts
        intact.
  compression:
    prompt: 'Compare the two resource profiles in a short answer: time, auxiliary
      space, and the reason you choose one.'
    goal: Compress the Time and space trade-offs answer into its decision, premise,
      trade-off, and verification step.
  best_answer: I could sort first and scan, which drops the extra memory to effectively
    nothing but pushes time to n log n. Which one wins depends on whether memory or
    latency is the binding constraint. On a request path I would keep the hash; for
    a batch job over a large file I would sort.
  distractors:
  - text: Yes, sorting would use less memory. It would be slower though, so it depends
      really. Both options have advantages and disadvantages and either could be reasonable
      depending on the situation.
    trap: precision
    why_wrong: States the trade-off but never chooses. "It depends" without the deciding
      condition is an empty answer.
  - text: No, the hash approach is correct and I would not change it. Memory is cheap
      now and optimising for it is premature, so I would keep what I have and move
      on to the next part.
    trap: pragmatics
    why_wrong: Refuses the alternative the interviewer explicitly offered, which reads
      as inflexibility.
  - text: If I would sort the array first, then I will not need the hash anymore and
      the memory would be much less, but the time will become worse because sorting
      is more slow than a linear scan.
    trap: grammar
    why_wrong: '"If I would" breaks the conditional and "more slow" replaces the comparative
      "slower".'
  feedback:
    register: Balanced and decisive. Senior engineers name a default and the condition
      that flips it.
    hedging: '"Depends on whether" is precise hedging; "it depends really" is not.'
    precision: Attach each option to a concrete context, such as request path versus
      batch job.
    grammar: Second conditional takes "if I sorted... I would need", never "if I would
      sort".
    pragmatics: 'Answer both halves of the question: the feasibility and the preference.'
  rephrase:
    prompt: Give the same answer but start from the constraint that would make you
      switch.
    goal: Practise leading with the deciding condition.
  language_focus:
  - precision
  - grammar
  - hedging
  feynman:
    concept: Time-space trade-off chosen by binding constraint.
    explain_to: A product manager deciding between two builds.
    constraint: Use luggage and a locker as the only analogy.
    self_check: Did you name the condition that flips your default?
    reasoning_check: Can you identify the hidden premise behind Time and space trade-offs,
      give a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You listed both options and stopped, or refused one outright.
    expected: A default plus the constraint that would change it.
    actual: A bare "it depends" with no named condition.
    root_cause: Avoiding commitment because committing in English feels riskier than
      staying balanced.
    repair: Always finish a trade-off with "I would default to X; I would switch if
      Y".
    reasoning_error: If your Time and space trade-offs answer failed, classify the
      mistake as a fact, assumption, comparison, failure, or certainty error before
      proposing the smallest repair.
  recall:
    active_recall_cue: What condition makes sorting preferable to hashing here?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Time and space trade-offs
      without presenting an assumption as a fact?
    black_box_probe: When the Time and space trade-offs answer failed, did you locate
      the reasoning error before changing the implementation?
    delayed_variant:
      id: dsa-07-tradeoff-language-delayed-7
      prompt: For Time and space trade-offs, new evidence is a trace of Time and space
        trade-offs isolates a different Time and space trade-offs bottleneck than
        the one you named and the constraint is a stakeholder asks for a stronger
        Time and space trade-offs guarantee than the first Time and space trade-offs
        answer promised. What alternative now deserves consideration for Time and
        space trade-offs?
      changed_constraint: a stakeholder asks for a stronger Time and space trade-offs
        guarantee than the first Time and space trade-offs answer promised
      new_evidence: a trace of Time and space trade-offs isolates a different Time
        and space trade-offs bottleneck than the one you named
      best_answer: I would keep the facts that remain supported about Time and space
        trade-offs, treat a trace of Time and space trade-offs isolates a different
        Time and space trade-offs bottleneck than the one you named as new evidence
        rather than a result, and state the updated decision rule under a stakeholder
        asks for a stronger Time and space trade-offs guarantee than the first Time
        and space trade-offs answer promised. I would then name one focused check
        before treating the revised answer as settled.
      distractors:
      - text: I would preserve every part of the original Time and space trade-offs
