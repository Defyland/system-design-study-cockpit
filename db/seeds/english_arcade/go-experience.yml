- id: go_experience-11-tracebridge-bounded-admission-and-retry-stall
  version: 1.4.0
  target: go_experience
  topic: TraceBridge bounded admission and retry stall
  difficulty: 3
  interview_stage: deep_dive
  prompt: How would you apply backpressure in TraceBridge without hiding an exporter
    outage behind unbounded in-process growth?
  context: The interviewer wants queue admission distinguished from delivery durability,
    including retry stalls, shutdown behavior, DLQ/replay, and the meaning of a constrained
    spike.
  best_answer: TraceBridge uses a bounded in-process queue, so Enqueue returns ErrLocalQueueFull
    instead of hiding surge pressure in memory. Workers flush by size or time and
    retry until context stops them; shutdown's final flush can lose a batch on error.
    The constrained spike intentionally treats 429 and 503 as visible admission outcomes,
    not healthy capacity. This case study does not establish persistent idempotency,
    multi-process replay, or production capacity; stalled retry needs DLQ, replay,
    and observability decisions.
  distractors:
  - text: I would let the local queue grow until the exporter recovers so telemetry
      producers never receive a rejection. Retrying forever proves events will survive
      shutdown, and a high rate of 429 or 503 confirms the pipeline has enough production
      capacity. A worker needs no DLQ because the in-memory queue already preserves
      each failed batch.
    trap: precision
    why_wrong: It turns bounded admission into hidden memory growth and mistakes retry
      or rejected traffic for durable delivery and capacity evidence.
  - text: I would return success after Enqueue even when the queue is full, then drop
      the oldest events to protect latency. On exporter outage, stop every worker
      immediately and treat shutdown flush as durable. The constrained spike can prove
      multi-process replay and idempotency because all HTTP saturation results are
      already measured by k6.
    trap: hedging
    why_wrong: It hides loss, overstates shutdown semantics, and converts a deliberately
      constrained local study into distributed reliability proof.
