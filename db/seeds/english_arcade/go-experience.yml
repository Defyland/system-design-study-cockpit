    confidentiality:
      level: high
      note: Do not disclose institution, account, transaction, Pix key, rule, score,
        override, audit, event, raw timing, credential, or reconciliation data.
  feedback:
    register: Use “atomic local facts” for the transaction and “at-least-once recovery”
      for the relay.
    hedging: Name the SQLite baseline and its missed p95 without projecting it onto
      PostgreSQL or fraud outcomes.
    precision: Distinguish scoped idempotency, transaction uniqueness, audit, outbox
