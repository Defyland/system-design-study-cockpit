  critical_thinking:
    problem_frame: >-
      TraceBridge bounds in-process admission but a stalled retry and failed shutdown flush can lose pending work; I must separate overload visibility from durable replay.
    claim_map:
      fact: >-
        A full queue returns a visible local rejection instead of unlimited memory growth.
      inference: >-
        Durable DLQ, replay, and idempotency are separate mechanisms from bounded admission.
