      claim: The committed client parses endpoint configuration, observes context,
        redacts selected patterns, retries 429 or 5xx with Retry-After or capped exponential
        backoff, and tracks retry metrics.
    - path: terraport-go-terraform-provider/internal/provider/provider_acceptance_test.go
      commit: 20fd64ae108ad519e0ffb469d4513cb2096e7755
      claim: The committed httptest acceptance suite specifies lifecycle, import,
