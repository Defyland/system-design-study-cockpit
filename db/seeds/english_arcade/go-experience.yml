cards:
- id: go_experience-card-1
  front: What does the template's in-memory idempotency actually guarantee?
  back: A mutex and replay record can return the same semantic request within one
    instance; they do not make it durable, coordinate instances, or protect an external
    side effect.
  box: 1
  source:
    repo: backend-challenges
    path: backend-service-template/internal/store/memory.go
    note: The memory store is an inspectable single-process idempotency boundary,
      not durable coordination.
  critical_thinking:
    cue: What does the template's in-memory idempotency actually guarantee? Before
      answering, separate the stated fact from your assumption and name one condition
      that could change it.
    check: For this Go project deep dive card, can you compare two options, name one
      failure mode, and state what evidence would update the recommendation?
- id: go_experience-card-2
  front: What remains unknown after a PixRail SPI timeout or crash?
  back: A local claim selects an owner, but SPI may already have accepted the transfer;
    safe recovery needs provider idempotency or query and reconciliation rather than
    blind resubmission.
  box: 2
  source:
    repo: backend-challenges
    path: pixrail-go-payment-switch/internal/switcher/service.go
    note: The claim token coordinates local submission work but cannot prove the remote
      SPI effect.
  critical_thinking:
    cue: What remains unknown after a PixRail SPI timeout or crash? Before answering,
      separate the stated fact from your assumption and name one condition that could
      change it.
    check: For this Go project deep dive card, can you compare two options, name one
      failure mode, and state what evidence would update the recommendation?
- id: go_experience-card-3
  front: Why is a bounded TraceBridge queue preferable to hidden growth?
  back: It makes saturation visible through rejection, but a stalled retry or failed
    final flush is not a durable DLQ or replay guarantee.
  box: 3
  source:
    repo: backend-challenges
    path: tracebridge-go-observability-pipeline/internal/pipeline/publisher.go
