      with p99, memory, recall, correctness, index-build or update cost, and operational
      complexity captured separately.
    goal: Produce a migration decision record rather than a framework comparison.
  critical_thinking:
    problem_frame: >-
      The study uses exact full scans and a bounded neighbor heap; I must compare correctness, p99, memory, recall, and operations before ANN.
    claim_map:
      fact: >-
        The heap bounds retained candidates but the exact scan still visits every reference.
      inference: >-
        ANN is justified only by a matched full-corpus resource breach with acceptable recall and score parity.
      assumption: >-
        I am assuming the cited examples do not represent the full corpus or production query distribution.
      unknown: >-
        Full-corpus p99, memory, recall, update cost, and rollback path are unknown.
    comparison:
      applicable: true
      alternatives:
      - option: exact full-scan KNN with a bounded top-k heap
        benefit: I keep distance semantics and recall exact while using O(k) neighbor memory.
        cost_or_risk: Query work remains proportional to corpus size and the reference set consumes memory.
        valid_when: Use it while full-corpus p99 and memory fit the measured study envelope.
      - option: an ANN or vector-index candidate evaluated behind the same scoring contract
