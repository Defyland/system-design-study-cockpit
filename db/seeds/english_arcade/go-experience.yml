- id: go_experience-03-fulfillhub-local-transaction-and-outbox-delivery
  version: 1.4.0
  target: go_experience
  topic: FulfillHub local transaction and asynchronous delivery
  difficulty: 3
  interview_stage: deep_dive
  prompt: Where does FulfillHub's local transaction end, and where does asynchronous
    delivery begin?
  context: The interviewer wants the commit boundary separated from broker delivery,
    especially the duplicate window after a publisher crash.
  best_answer: I would commit the order, line items, tenant-scoped idempotency record,
    outbox event, and audit entry in one PostgreSQL transaction. I would lock and
    validate later state transitions, while accepting that a relay can publish and
    crash before marking delivery. I would use inbox idempotency, leases, DLQ visibility,
    and reconciliation to contain duplicates, and I would treat the local Compose
    profile as a development signal rather than deployed performance evidence.
  distractors:
  - text: Once the database transaction commits, I would mark the message delivered
      before contacting the broker. That makes duplicate delivery impossible, so workers
      do not need an inbox or reconciliation path. A load profile from Compose would
      establish that this mechanism remains reliable at scale, including every provider
      and merchant-facing failure.
    trap: precision
    why_wrong: It moves the delivery marker ahead of the broker, erases the crash
      window, and treats a local profile as operational proof.
  - text: I would keep order persistence and event publication in separate transactions
      so the relay can retry freely. If an event is missing, retrying the whole order
      is safer than recording an outbox row. A unique consumer key is unnecessary
      because RabbitMQ acknowledgements guarantee that every business action happens
      only once.
    trap: hedging
    why_wrong: It recreates the order/event gap and mistakes broker acknowledgement
      for end-to-end exactly-once processing.
  sources:
  - repo: backend-challenges
    path: fulfillhub-go-commerce-platform/README.md
    note: FulfillHub portfolio study boundary and asynchronous topology.
  - repo: original
    path: english-arcade/go_experience/3
    note: Original interview-language coaching.
  provenance:
    evidence_class: portfolio_code
    project: FulfillHub
    repository: backend-challenges
    files:
    - path: fulfillhub-go-commerce-platform/README.md
      commit: 3bc2b641d17bd93ba151ff78441d9bf190f0fc07
      claim: The committed README calls the project an R&D production-shaped study
        and describes an outbox relay, broker topology, inbox handling, and compensation.
    - path: fulfillhub-go-commerce-platform/internal/postgres/store.go
      commit: 3bc2b641d17bd93ba151ff78441d9bf190f0fc07
      claim: The committed store places order data, tenant-scoped idempotency, outbox,
        and audit writes in local transactions and locks state for later transitions.
    - path: fulfillhub-go-commerce-platform/benchmarks/results/2026-05-29-compose-load-stress-spike.md
      commit: 3bc2b641d17bd93ba151ff78441d9bf190f0fc07
      claim: The committed report is a local Docker Compose profiling record for one
        revision, not a production performance result.
    verified_claims:
    - Order creation can atomically commit its local order data, idempotency record,
      outbox event, and audit record in the inspected PostgreSQL store.
    - A database commit cannot prove broker delivery or remove publisher-crash duplicates;
      inbox idempotency, leases, DLQ handling, and reconciliation remain separate
      concerns.
    confirmation_required:
