      commit: 0a987b800420bb87e9b2f4bf0e50472d6cec3918
      claim: The committed README describes an in-memory MVP, one-time API or client
        secret reveal, recoverable webhook signing secrets, and a future KMS or HSM-backed
        encryption path.
    - path: trustvault-go-security-control-plane/internal/security/secrets.go
      commit: 0a987b800420bb87e9b2f4bf0e50472d6cec3918
      claim: The committed security code creates prefixed random tokens, HMAC-SHA256
        hashes with pepper, constant-time comparisons, AES-GCM from a local derived
        key, and recursive named-field redaction.
    - path: trustvault-go-security-control-plane/internal/webhook/ssrf_test.go
      commit: 0a987b800420bb87e9b2f4bf0e50472d6cec3918
      claim: The committed SSRF tests reject private, localhost, and HTTP targets,
        prevent redirects, and allow a fake-resolver public HTTPS address.
    verified_claims:
    - API and client secrets are intended for one-time reveal without plaintext persistence,
      whereas webhook signing material is encrypted because later HMAC signing needs
      recovery.
    - Resolver-time SSRF checks and redirect blocking do not establish connection-time
      IP pinning, DNS-rebinding protection, KMS or HSM custody, or zero leakage from
      named-field redaction.
    confirmation_required:
    - Verify authoring, operational setting, users, outcomes, present test execution,
      durable store behavior, rotation and recovery workflow, KMS or HSM integration,
      resolver-to-connect pinning, and redaction coverage.
    safe_interview_version: This TrustVault portfolio MVP demonstrates one-time secret
      exposure, local HMAC hashing, recoverable webhook encryption, and resolver-time
      SSRF checks; it reserves durable storage, KMS custody, connection pinning, and
      complete-redaction claims for further evidence.
    confidentiality:
      level: high
      note: Do not disclose token, pepper, master key, ciphertext, nonce, webhook
