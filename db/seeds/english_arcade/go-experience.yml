- id: go_experience-09-terraport-lifecycle-import-and-ambiguous-retry
  version: 1.4.0
  target: go_experience
  topic: Terraport lifecycle, import, drift, and ambiguous retry
  difficulty: 3
  interview_stage: deep_dive
  prompt: How would you handle Terraform lifecycle and drift when a remote create
    may have succeeded even though Terraport receives a 5xx response?
  context: The interviewer is testing import, plan-only behavior, retry ambiguity,
    remote idempotency, and the distinction between redaction, sensitive state, and
    secret safety.
  best_answer: >-
    I would treat Terraform state as cached desired and observed data around the fictitious API,
    and I would use the cited acceptance cases for lifecycle, import, drift, plan-only behavior,
    timeout, auth, and 429 retry. Because a POST can commit before returning 500, I would query or
    reconcile, adopt through import, or use remote idempotency before retrying. I would keep state
    access controlled: a Sensitive schema and regex redaction do not prove that backups or unknown
    secret shapes are safe.
  distractors:
  - text: I would retry every POST after a 5xx until Terraform reports success because
      the remote service clearly rejected the request. Import is only useful for old
      resources, and a plan-only step proves later applies cannot call the API. Marking
      a value Sensitive means state backups and diagnostics no longer need access
      controls or review.
    trap: precision
    why_wrong: It assumes an ambiguous response proves no creation, misuses plan-only
      evidence, and confuses display masking with state secrecy.
  - text: I would disable retries for all 429 and 5xx responses, then delete any resource
      that Terraform cannot read immediately. Regex redaction proves diagnostics contain
      no secret formats, while remote drift should be overwritten without import because
      state is always the source of truth. The fake server confirms the same behavior
      on a real platform.
    trap: hedging
    why_wrong: It ignores retry policy and remote truth, overstates redaction, and
      treats the fake API as production-platform evidence.
  sources:
  - repo: backend-challenges
    path: terraport-go-terraform-provider/README.md
    note: Terraport portfolio scope, Terraform state, fake API, and secret limit.
  - repo: original
