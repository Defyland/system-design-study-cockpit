    challenge_kind: failure
    best_answer: >-
      TraceBridge uses a bounded in-process queue, so Enqueue returns ErrLocalQueueFull instead of hiding surge
      pressure in memory. I would persist pending batches before shutdown, expose authorized DLQ and
