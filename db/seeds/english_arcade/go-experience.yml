    mastery_threshold: 8
    delayed_variant:
      id: go_experience-03-fulfillhub-local-transaction-and-outbox-delivery-delayed-3
      prompt: >-
        The relay publishes an outbox event, crashes before marking it, and republishes after lease expiry. Which duplicate control is required?
      changed_constraint: >-
        delivery is at least once after the local transaction commits
      new_evidence: >-
        the same event identity is delivered twice after a publish-before-marking crash
      best_answer: >-
        I would use a stable inbox identity and idempotent consumer, lease expiry, and reconciliation; the transaction closes the order/event gap but cannot guarantee exactly once.
      distractors:
      - text: I would preserve every part of the original FulfillHub local transaction
          and asynchronous delivery answer because changing it after review would
          be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire FulfillHub local transaction and asynchronous
          delivery explanation with a new design without identifying what the evidence
          actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  extension:
    prompt: Sketch a recovery contract that exposes a stale lease, a replayed message,
      and an unresolved provider effect without replaying the entire order blindly.
    goal: Connect duplicate handling to visible reconciliation rather than to an exactly-once
      claim.
  critical_thinking:
    problem_frame: >-
      FulfillHub atomically commits domain state and outbox intent, then relies on at-least-once relay delivery; I must keep duplicate recovery explicit.
    claim_map:
      fact: >-
        The order, idempotency record, outbox, and audit row commit together.
      inference: >-
        The local commit and later publication are separate lifecycle stages, so repeated delivery must be safe for the consumer.
      assumption: >-
        I am assuming consumers can persist an inbox identity and reconcile a stuck lease.
      unknown: >-
        Broker behavior, consumer store, lease duration, and duplicate side-effect handling are unknown.
    comparison:
      applicable: true
      alternatives:
      - option: commit domain state and outbox intent together, then relay with inbox deduplication
        benefit: I close the local write-to-publish gap and make duplicate delivery recoverable.
        cost_or_risk: I operate relay leases, inbox identity, DLQ visibility, and reconciliation; the provider effect remains a separate boundary.
        valid_when: Use it when an event must survive a transaction commit and publication may be delayed.
      - option: publish directly from the request transaction or callback
        benefit: It can look simpler for a local prototype with no durable delivery requirement.
        cost_or_risk: A process crash between the domain commit and publish, or after publish before marking, creates loss or duplicate windows.
        valid_when: Use it only when the delivery contract tolerates that window and evidence supports it.
      decision_rule: I use an outbox plus duplicate-safe relay when delivery matters; I keep direct publication only inside an explicitly bounded prototype.
    failure_probe:
