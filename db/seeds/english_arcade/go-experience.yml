- id: go_experience-07-pixrail-claim-before-spi-side-effect
  version: 1.4.0
  target: go_experience
  topic: PixRail claim-before-side-effect SPI submission
  difficulty: 3
  interview_stage: deep_dive
  prompt: How would you submit a PixRail transfer to SPI without pretending that a
    local claim gives exactly-once provider behavior?
  context: The interviewer is probing a provider timeout or crash after acceptance,
    role-scoped access, and the boundary between callback verification and replay
    prevention.
  best_answer: PixRail claims an accepted transfer with a token and TTL before calling
    SPI; matching fingerprints replay. The call has a timeout, releases on error,
    then records the SPI message, events, and audit with that token. Role-scoped endpoints
    plus HMAC and timestamp checks protect callbacks, not every replay. If SPI accepts
    before a crash, lease expiry can duplicate the call. Provider idempotency or a
    query and reconciliation path determines retry versus manual review.
  distractors:
  - text: I would call SPI before writing or claiming anything because a timeout means
      SPI did nothing. Once callback has an HMAC, any replay is impossible, so timestamp
      can be ignored. After a process crash, a worker should always submit again because
      the lease proves the prior provider call never completed or reached an uncertain
      effect.
    trap: precision
    why_wrong: It treats a timeout as a known provider result, discards freshness
      checks, and uses a local lease as evidence about an external side effect.
  - text: I would hold the claim forever after any SPI error so no second worker can
      create a duplicate. The provider callback can bypass role checks because its
      body is signed. Recording the message, event, and audit in different updates
      is fine because a successful provider response guarantees every local record
      will eventually appear.
    trap: pragmatics
    why_wrong: It creates stuck work, weakens endpoint controls, and reintroduces
      partial local records after an uncertain external effect.
