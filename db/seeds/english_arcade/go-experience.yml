- id: go_experience-04-gocachelab-aof-durability-and-recovery
  version: 1.4.0
  target: go_experience
  topic: GoCacheLab AOF durability and recovery trade-offs
  difficulty: 3
  interview_stage: deep_dive
  prompt: How would you explain the durability and recovery trade-offs in GoCacheLab's
    append-only file?
  context: The interviewer is testing whether you can distinguish fsync policy, a
    partial trailing write, and corruption in the middle of a replay log.
  best_answer: >-
    I would distinguish the AOF policy before discussing recovery: appendfsync never
    does not fsync on each append and leaves durability to OS flushing, everysec
    accepts a bounded recent-write loss window for lower latency, and always adds
    sync latency. I would treat a partial final record as a possible
    interrupted write, but quarantine a CRC failure in the middle, restore or snapshot
    from a known point, and verify replay rather than silently skipping corruption.
  distractors:
  - text: I would use always fsync because it eliminates every loss and corruption
      concern. Once each write returns, replay can trust the entire log and silently
      skip any bad bytes. A partial tail and a damaged middle record deserve the same
      handling, so no operator decision, snapshot, or restore process is needed for
      a cache service.
    trap: precision
    why_wrong: It equates synchronous flush with complete recovery safety and discards
      the different evidence carried by a partial tail and middle corruption.
  - text: I would choose never fsync for low latency and rely on Close to make each
      request durable. CRC checks make replication and authentication unnecessary,
      while a corrupted record can simply be ignored because later records are probably
      valid. The replay counter is enough evidence that no key or value was lost during
      recovery.
    trap: hedging
    why_wrong: It invents durability, security, and replication guarantees that neither
      Close, CRC, nor a replay count establishes.
  sources:
  - repo: backend-challenges
    path: gocachelab-redis-like-store/README.md
    note: GoCacheLab portfolio study scope and private-node boundary.
  - repo: original
    path: english-arcade/go_experience/4
    note: Original interview-language coaching.
  provenance:
    evidence_class: portfolio_code
    project: GoCacheLab
    repository: backend-challenges
    files:
    - path: gocachelab-redis-like-store/README.md
      commit: ed976ce39fd87106dd2a5774f00f77eb32973576
      claim: The committed README describes an R&D Redis-like store with a checksummed
        AOF, snapshots, a private-node security boundary, and no managed-cache positioning.
    - path: gocachelab-redis-like-store/internal/aof/aof.go
      commit: ed976ce39fd87106dd2a5774f00f77eb32973576
      claim: The committed AOF code serializes appends, supports never/everysec/always
        syncing, syncs on Close, and reports applied, corrupted, or partial replay
        records.
    - path: gocachelab-redis-like-store/internal/aof/aof_test.go
      commit: ed976ce39fd87106dd2a5774f00f77eb32973576
      claim: The committed tests specify valid replay, continuing after corruption,
        and ignoring a partial trailing record at that revision.
    verified_claims:
    - AOF records include a length and CRC; replay distinguishes applied, corrupted,
      and partial records, while the everysec policy runs a periodic sync loop.
    - The inspected study does not establish authentication, replication, managed
      operation, or complete recovery after arbitrary corruption.
    confirmation_required:
    - Confirm authorship, operation scope, users, results, current test execution,
      disk behavior, corruption policy, backup retention, snapshot strategy, and restoration
      procedure.
    safe_interview_version: This GoCacheLab portfolio study exposes AOF flush and
      replay trade-offs for a private-node design; it does not claim managed-cache
      durability, replication, or complete recovery guarantees.
    confidentiality:
      level: medium
      note: Do not reveal keys, values, AOF or snapshot contents, admin endpoints,
        pprof output, local paths, credentials, or recovery records.
  feedback:
    register: Say “flush policy” and “replay report” instead of treating the AOF as
      a generic backup.
    hedging: State the loss window and recovery uncertainty plainly; do not turn CRC
      into a safety certificate.
    precision: Separate never, everysec, and always, then distinguish a trailing partial
      record from corruption before the end of the log.
    grammar: Use parallel clauses for latency cost, loss window, and recovery action.
    pragmatics: Offer an operator choice for damaged middle records instead of pretending
      the library decides it.
  rephrase:
    prompt: Explain everysec to an SRE who asks why the file can be valid yet still
      lose recent writes.
    goal: Preserve the time-window trade-off without conflating it with corruption
      detection.
  follow_up:
    prompt: How would your response differ for one CRC-failed record in the middle
      versus an incomplete final record, and what quarantine, restore, snapshot, or
      compaction policy would you propose?
    goal: Distinguish automated tail handling from an operator-led integrity decision.
    challenge_kind: evidence
    best_answer: >-
      I would treat a CRC failure in the middle as corruption requiring quarantine or restore and an
      operator decision, while an incomplete final record may be a crash-truncated tail that policy
      permits replay to ignore. I would test restore, snapshot, compaction, and each fsync policy
      separately rather than treat CRC validation as a complete recovery guarantee.
    distractors:
    - text: I would cite my experience with GoCacheLab AOF durability and recovery
        trade-offs as enough proof and move on without naming an observation.
      why_wrong: Experience can guide a hypothesis, but it does not replace evidence
        tied to this context.
    - text: I would collect every possible metric about GoCacheLab AOF durability
        and recovery trade-offs before making even a provisional recommendation.
      why_wrong: A focused decision can start with one discriminating observation
        rather than an unbounded data request.
  compression:
    prompt: Contrast never, everysec, and always in three clauses, then add one recovery
      caveat.
    goal: Retain the flush-cost trade-off and the replay limitation.
  language_focus:
  - precision
  - pragmatics
  - hedging
  feynman:
    concept: Checksums can classify a record problem without deciding whether the
      remaining history is trustworthy.
    explain_to: A teammate who thinks CRC validation makes recovery automatic.
    constraint: Compare a partial tail with a corrupted middle record and mention
      one fsync policy.
    self_check: Did you state the policy loss or latency cost and the operator decision
      boundary?
    reasoning_check: Can you identify the hidden premise behind GoCacheLab AOF durability
      and recovery trade-offs, give a counterexample, and explain how the evidence
      changes your conclusion?
  black_box:
    symptom: The answer says a CRC lets replay safely skip any bad record forever.
    expected: Replay reports what it applied or skipped; a middle failure triggers
      a recovery policy decision.
    actual: Corruption counting is mistaken for a proof that the recovered keyspace
      is complete.
    root_cause: Detection evidence was conflated with semantic recovery assurance.
    repair: Preserve the report, quarantine the suspect log, restore or rebuild from
      a selected snapshot, and consider compaction only after validating the recovered
      state.
    reasoning_error: If your GoCacheLab AOF durability and recovery trade-offs answer
      failed, classify the mistake as a fact, assumption, comparison, failure, or
      certainty error before proposing the smallest repair.
  recall:
    active_recall_cue: Which policy has a periodic sync loop, and what does each replay
      counter mean?
    feynman_prompt: Why is an incomplete last record easier to automate than a bad
      middle record?
    black_box_probe: Did you avoid claiming that CRC proves complete recovery or security?
    leitner_start_box: 1
    mastery_threshold: 8
    delayed_variant:
      id: go_experience-04-gocachelab-aof-durability-and-recovery-delayed-4
      prompt: >-
        Replay finds a CRC failure in the middle of the AOF and a truncated final record. Which recovery decisions differ?
      changed_constraint: >-
        middle corruption needs operator integrity handling while a partial tail may be crash truncation
      new_evidence: >-
        replay classifies one damaged middle record separately from an incomplete final record
      best_answer: >-
        I would quarantine or restore for middle corruption, allow tail truncation only under an explicit policy, and test snapshot, compaction, fsync, and restore paths separately.
      distractors:
      - text: I would preserve every part of the original GoCacheLab AOF durability
          and recovery trade-offs answer because changing it after review would be
          inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire GoCacheLab AOF durability and recovery trade-offs
          explanation with a new design without identifying what the evidence actually
          changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  extension:
    prompt: Define one negative replay test and one operator runbook checkpoint for
      never, everysec, always, a partial tail, and middle-record corruption.
    goal: Turn the durability policy into observable failure handling without inventing
      replication.
  critical_thinking:
    problem_frame: >-
      GoCacheLab exposes fsync policies and CRC records; I must distinguish a corrupt middle record from a crash-truncated tail.
    claim_map:
      fact: >-
        The AOF has length-plus-CRC records and configurable synchronization policy.
      inference: >-
        A partial final record may be safely ignored by policy, while middle corruption needs quarantine or restore.
      assumption: >-
        I am assuming the operator has a snapshot or trusted restore source for middle corruption.
      unknown: >-
        Fsync loss window, snapshot freshness, compaction behavior, and operator policy are unknown.
    comparison:
      applicable: true
      alternatives:
      - option: every-write fsync with CRC validation and replay recovery
        benefit: I minimize the append loss window and can reject a corrupt middle record instead of silently applying bad state.
        cost_or_risk: Sync cost reduces write throughput, and recovery still needs a policy for a partial final record.
        valid_when: Use it when durability dominates write latency and the disk boundary is trusted.
      - option: every-second or periodic fsync with a bounded loss window
        benefit: I improve write throughput while making the possible loss window explicit.
        cost_or_risk: A crash can lose acknowledged tail records, and the bound depends on scheduler and storage behavior.
        valid_when: Use it when the stated RPO accepts that window and restart verification is measured.
      decision_rule: I choose the fsync policy from the accepted loss window and latency budget; I keep CRC and replay checks regardless of policy.
    failure_probe:
      kind: counterexample
      prompt: >-
        What replay result would distinguish truncation at EOF from corruption that invalidates later records?
    evidence_check:
      basis: Check the GoCacheLab AOF durability and recovery trade-offs claim against
        backend-challenges/gocachelab-redis-like-store/README.md and the exact interview
        context; record whether each part is fact, inference, or hypothesis.
      source_kind: primary_code
      limitation: This Go project deep dive exercise can test reasoning about GoCacheLab
        AOF durability and recovery trade-offs, but it cannot prove an unmeasured
        production outcome, personal ownership, or universal rule.
      checked_on: '2026-08-25'
    certainty:
      level: low
      rationale: >-
        I am confident in separating integrity failure from a partial tail; durability still depends on fsync and restore evidence.
      update_trigger: >-
        Update when replay, restore, or compaction tests change the allowed quarantine and tail policy.
    rubric:
      facts_correct: Names the verified GoCacheLab AOF durability and recovery trade-offs
        facts without smuggling in a result, scale, or capability that the prompt
        does not establish.
      assumptions_explicit: Labels the GoCacheLab AOF durability and recovery trade-offs
        premise that is still assumed and asks the smallest clarifying question that
        matters.
      alternatives_considered: Compares two credible GoCacheLab AOF durability and
