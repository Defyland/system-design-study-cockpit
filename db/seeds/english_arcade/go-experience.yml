- id: go_experience-03-fulfillhub-local-transaction-and-outbox-delivery
  version: 1.4.0
  target: go_experience
  topic: FulfillHub local transaction and asynchronous delivery
  difficulty: 3
  interview_stage: deep_dive
  prompt: Where does FulfillHub's local transaction end, and where does asynchronous
    delivery begin?
  context: The interviewer wants the commit boundary separated from broker delivery,
    especially the duplicate window after a publisher crash.
  best_answer: FulfillHub commits the order, line items, tenant-scoped idempotency
    record, outbox event, and audit entry in one PostgreSQL transaction. Later transitions
    lock and validate state before adding their own event and audit entry. This removes
    the committed-order-without-event gap, but not duplicates—a relay may publish
    and crash before marking delivery. Inbox idempotency, leases, DLQ visibility,
    and reconciliation are separate controls for that boundary. The local Compose
    profile is not deployed performance evidence.
  distractors:
  - text: Once the database transaction commits, I would mark the message delivered
      before contacting the broker. That makes duplicate delivery impossible, so workers
      do not need an inbox or reconciliation path. A load profile from Compose would
      establish that this mechanism remains reliable at scale, including every provider
      and merchant-facing failure.
    trap: precision
    why_wrong: It moves the delivery marker ahead of the broker, erases the crash
      window, and treats a local profile as operational proof.
  - text: I would keep order persistence and event publication in separate transactions
      so the relay can retry freely. If an event is missing, retrying the whole order
      is safer than recording an outbox row. A unique consumer key is unnecessary
      because RabbitMQ acknowledgements guarantee that every business action happens
      only once.
    trap: hedging
    why_wrong: It recreates the order/event gap and mistakes broker acknowledgement
      for end-to-end exactly-once processing.
