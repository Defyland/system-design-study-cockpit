      prompt: >-
        Exact KNN meets correctness but misses the full-corpus p99 and memory target. What evidence would justify ANN?
      changed_constraint: >-
        the approximate index must preserve acceptable recall and correctness while reducing measured resource use
      new_evidence: >-
        matched full-corpus runs show a reproducible p99 or memory breach against an exact oracle
      best_answer: >-
        I would compare ANN recall, score parity, index build/update cost, memory, p99, and rollback against exact KNN before changing the algorithm.
      distractors:
      - text: I would preserve every part of the original Rinha Go exact KNN scaling
          boundary answer because changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Rinha Go exact KNN scaling boundary explanation
          with a new design without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  extension:
