- id: go_experience-08-rinha-go-exact-knn-scaling-boundary
  version: 1.4.0
  target: go_experience
  topic: Rinha Go exact KNN scaling boundary
  difficulty: 3
  interview_stage: deep_dive
  prompt: What does the Go Rinha study's exact KNN search optimize, and where does
    it stop being the right approach?
  context: The interviewer wants the heap memory benefit distinguished from full-dataset
    scan cost, plus an evidence-based path toward ANN.
  best_answer: >-
    I would explain that the study vectorizes a request, scans every reference, and keeps k=5
    candidates in a max-heap before sorting them. With fixed k, I would describe roughly
    O(N*(d + log k)) time and O(N*d) reference-set memory: the heap saves neighbor memory but
    not scan work. I would keep the claim bounded to the cited examples and require a full-corpus
    benchmark before claiming latency, memory, score, or submission readiness.
  distractors:
  - text: I would choose the Go version because a max-heap means the algorithm no
      longer visits every reference. With k fixed at five, it becomes constant-time
      and uses no dataset memory. The README's examples prove a full competition run
      and its p99, so an ANN index would only add complexity without any reason to
      benchmark first.
    trap: precision
    why_wrong: The heap bounds retained neighbors, not the reference scan or dataset
      memory, and the study documentation expressly does not establish a competitive
      run or latency result.
  - text: I would replace exact search with ANN immediately because brute force can
      never be correct at any useful size. Recall does not need measurement if p99
      improves, and the new index can share the same threshold without a contract
      check. Memory, operating complexity, and reference updates are implementation
      details rather than design trade-offs.
    trap: pragmatics
    why_wrong: It skips the scale evidence, recall and correctness comparison, and
      operational cost that would justify changing the search boundary.
  sources:
  - repo: backend-challenges
    path: rinha-de-backend-2026-go/README.md
