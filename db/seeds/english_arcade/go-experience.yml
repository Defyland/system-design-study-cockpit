      current test or benchmark execution, broker configuration, and replay policy.
    safe_interview_version: This FulfillHub portfolio study makes local order and
      outbox writes atomic, while treating broker delivery and duplicate recovery
      as separate reliability boundaries rather than claiming a deployed commerce
      service.
    confidentiality:
      level: high
      note: Do not disclose merchant, order, payment, address, key, event payload,
        raw trace, local benchmark, or reconciliation data.
  feedback:
    register: Use “local atomic commit” for the database boundary and reserve “delivery”
      for the relay and broker path.
    hedging: Present Compose profiling as revision-specific local evidence, not a
      merchant outcome or a capacity promise.
    precision: Name the order, idempotency, outbox, audit, publish, and delivery-marker
      steps in their actual order.
    grammar: Contrast “removes the gap” with “does not remove duplicates” in two direct
      clauses.
    pragmatics: Lead with the failure window before proposing inboxes, leases, or
      DLQs.
  rephrase:
    prompt: Explain the same boundary to a staff engineer who asks why a transactional
      outbox is useful without promising exactly-once delivery.
    goal: Keep the commit-versus-delivery distinction while changing the explanation
      order.
  follow_up:
    prompt: The database commits, the publisher sends the event, then crashes before
      it marks delivery. Why can a duplicate remain, and how would inbox idempotency,
      a lease, and reconciliation recover it?
    goal: Trace the post-commit crash rather than collapsing publication into the
      transaction.
    challenge_kind: assumption
    best_answer: >-
      FulfillHub commits the order, line items, tenant-scoped idempotency record, outbox event, and audit entry
      in one PostgreSQL transaction. After publish-before-marking, I would expect a duplicate, so I
      would give the event a stable inbox identity, use a lease with expiry, and reconcile stuck or
      repeated deliveries. The transaction closes the committed-order gap; it does not make the
      relay exactly once.
    distractors:
    - text: I would repeat my original FulfillHub local transaction and asynchronous
        delivery answer with more confidence because the interviewer probably assumes
        the usual case.
      why_wrong: It hides the premise instead of checking whether the usual case is
        actually part of this problem.
    - text: I would stop proposing anything about FulfillHub local transaction and
        asynchronous delivery until every surrounding requirement had been documented
        in full.
      why_wrong: It treats uncertainty as a reason for paralysis and offers no bounded
        next step.
  compression:
    prompt: State the transaction boundary, duplicate window, and recovery controls
      in three concise sentences.
    goal: Preserve the distinction between atomic persistence and asynchronous delivery.
  language_focus:
  - precision
  - pragmatics
  - hedging
  feynman:
    concept: A transactional outbox joins local facts, not the database and broker
      into one transaction.
    explain_to: A teammate who believes the relay gives exactly-once delivery.
