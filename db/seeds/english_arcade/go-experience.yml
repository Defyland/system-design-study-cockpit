      commit: 9746fb3beb7471d5146d5ec5b453c688f56740a0
      claim: The committed README describes relational idempotency, audit and outbox
        records, a relay lease, PostgreSQL as a production-like path, and future consumer
        work.
    - path: pixguard-go-antifraud-platform/internal/risk/postgres_store.go
      commit: 9746fb3beb7471d5146d5ec5b453c688f56740a0
      claim: The committed PostgreSQL store groups screening or override facts with
        audit and outbox writes in transactions, then claims eligible outbox rows
        using SKIP LOCKED and lease expiry.
    - path: pixguard-go-antifraud-platform/benchmarks/results/2026-05-28-k6-local-baseline.md
      commit: 9746fb3beb7471d5146d5ec5b453c688f56740a0
