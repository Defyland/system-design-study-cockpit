        batches by size or time, retries until context cancellation, and attempts
        a final flush during shutdown.
    - path: tracebridge-go-observability-pipeline/benchmarks/results/2026-06-29-k6-spike-constrained.md
      commit: c76aefa9e8b8104bb7772e2dfa46d13df31dee2c
