- id: go_experience-12-trustvault-secret-lifecycle-and-ssrf-boundary
  version: 1.4.0
  target: go_experience
  topic: TrustVault secret lifecycle and SSRF boundary
  difficulty: 3
  interview_stage: deep_dive
  prompt: How would you explain TrustVault's one-time secret reveal and webhook SSRF
    controls without overstating what the MVP proves?
  context: The interviewer is probing lost credentials, recoverable signing keys,
    local cryptography, redaction limits, DNS rebinding, redirects, and connection-time
    enforcement.
  best_answer: TrustVault's in-memory MVP generates random prefixed tokens, stores
    API and client secrets as HMAC-SHA256 hashes with a pepper, and compares them
    constant-time. It reveals those secrets once rather than storing them. Webhook
    signing material remains recoverable via AES-GCM from a locally derived key; recursive
    redaction handles known names. SSRF tests reject private, localhost, HTTP, and
    redirects, but not connection-time pinning or DNS rebinding. This is not KMS/HSM
    or zero-leak proof; lost one-time secrets require rotation.
  distractors:
  - text: I would store every revealed API and client secret encrypted so it can always
      be shown again. A random prefix and HMAC make rotation unnecessary, while AES-GCM
      with a local key is equivalent to an HSM. If DNS resolves to a public address
      during validation, redirect and connection checks cannot introduce any SSRF
      risk afterward.
    trap: precision
    why_wrong: It breaks the one-time-reveal boundary, conflates local cryptography
      with managed key custody, and assumes preflight DNS validation closes later
      network paths.
  - text: I would redact all fields recursively and claim no secret can reach a log.
      Unknown secret names are safe because only known credential keys matter. A webhook
      URL needs only HTTPS, so private ranges, localhost, redirects, and connection-time
      address changes do not need enforcement. Rotation can wait until a forgotten
      token is recovered.
    trap: hedging
    why_wrong: It treats pattern-based redaction and scheme checking as complete protections
      and overlooks irreversible one-time reveal loss.
  sources:
  - repo: backend-challenges
    path: trustvault-go-security-control-plane/README.md
    note: TrustVault MVP scope, credential lifecycle, and deferred KMS boundary.
  - repo: original
    path: english-arcade/go_experience/12
    note: Original interview-language coaching.
  provenance:
    evidence_class: portfolio_code
    project: TrustVault
    repository: backend-challenges
    files:
