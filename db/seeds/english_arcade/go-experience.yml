- id: go_experience-05-kubepulse-policy-and-level-triggered-reconciliation
  version: 1.4.0
  target: go_experience
  topic: KubePulse policy before mutation and reconciliation
  difficulty: 3
  interview_stage: deep_dive
  prompt: How does KubePulse apply policy before mutation while still converging under
    repeated Kubernetes events?
  context: The interviewer is probing a stale rollout, a deleted managed resource,
    and the difference between desired state, observed status, and a one-shot deployment.
  best_answer: I would evaluate policy before mutating workload resources and record a
    violating status before returning. When policy passes, I would use CreateOrPatch,
    owner references, and observed-versus-available generation checks so a repeated
    reconcile converges after a deletion or conflict. I would requeue an unhealthy
    rollout, skip unchanged status writes, and benchmark the per-reconcile GoService
    list before choosing a cached or narrower metric path at larger counts.
  distractors:
  - text: After policy passes once, I would skip it on later reconciliations because
      the Deployment already represents desired state. Status can be patched on every
      loop, and a deleted Deployment should end processing permanently. Listing every
      GoService per reconcile is always cheap because the API server maintains the
      aggregate metric, even during a large event storm.
    trap: precision
    why_wrong: It removes the policy guard from repeated events, makes status writes
      noisy, and dismisses the list operation that can become a hot-path cost.
  - text: I would create the Deployment and Service before evaluating policy, then
      label the workload as rejected if checks fail. A stale generation proves that
      Kubernetes cannot converge, so the controller should delete the GoService. Owner
      references are unnecessary because the next rollout will rebuild all resources
      from scratch anyway.
    trap: pragmatics
    why_wrong: It mutates a workload before the intended guard, misreads stale status,
      and abandons idempotent ownership and requeue behavior.
  sources:
  - repo: backend-challenges
    path: kubepulse-go-operator/README.md
    note: KubePulse portfolio study scope, status model, and stated limits.
  - repo: original
    path: english-arcade/go_experience/5
    note: Original interview-language coaching.
  provenance:
    evidence_class: portfolio_code
    project: KubePulse
    repository: backend-challenges
    files:
    - path: kubepulse-go-operator/README.md
      commit: 94a2331c1d63222827c02dc53cb25fe8447e34ad
      claim: The committed README describes policy-before-mutation, status conditions,
        level-triggered behavior, fake or envtest coverage, and limits around scale
        and integrations.
    - path: kubepulse-go-operator/internal/controller/goservice_controller.go
      commit: 94a2331c1d63222827c02dc53cb25fe8447e34ad
      claim: The committed reconciler evaluates policy, updates a policy ConfigMap,
        exits on violations, creates or patches managed resources, requeues unhealthy
        rollouts, and avoids unchanged status patches.
    - path: kubepulse-go-operator/internal/controller/rollout_metrics.go
      commit: 94a2331c1d63222827c02dc53cb25fe8447e34ad
      claim: The committed metric helper summarizes listed GoServices and counts reconciling
        services whose RolloutHealthy condition is false.
    verified_claims:
    - Policy violations are recorded before workload mutation, while allowed desired
      resources use CreateOrPatch and rollout health checks observed generation plus
      replica status.
    - Listing every GoService during reconciliation is visible code behavior, not
      evidence of real-cluster scale, multi-cluster operation, canary support, or
      Prometheus Operator integration.
    confirmation_required:
    - Confirm authorship, cluster operation, users, deployment outcomes, current test
      execution, real-cluster scale, multi-cluster or canary behavior, Prometheus
      Operator integration, and aggregate-metric cost before stronger claims.
    safe_interview_version: This KubePulse portfolio study shows policy-first, idempotent
      Kubernetes reconciliation and status-driven requeues, while reserving claims
      about real clusters, scale, deployment outcomes, and integrations for independently
      verified evidence.
    confidentiality:
      level: medium
      note: Do not disclose cluster, namespace, image, label, resource spec, status,
        metric, trace, or deployment configuration details.
  feedback:
    register: Call this a reconciliation loop, not a deployment script or a one-time
      rollout.
    hedging: Keep code and fake-client or envtest evidence separate from real-cluster
      behavior and scale.
    precision: State policy evaluation, ConfigMap/status result, desired-resource
      convergence, health check, requeue, and unchanged-status patching in that order.
    grammar: Use “if policy passes” and “if rollout is unhealthy” to make both branches
      easy to follow.
    pragmatics: Treat a stale generation or deleted Deployment as convergence evidence
      to investigate, not as proof that the controller failed permanently.
  rephrase:
    prompt: Explain the controller to an SRE who asks why a deleted Deployment should
      be recreated instead of treated as a terminal failure.
    goal: Reframe idempotence and owner references without losing the policy-first
      branch.
  follow_up:
    prompt: A status patch conflicts with a newer generation, or a Deployment disappears
      during repeated reconciles. How do owner references, idempotent apply, requeue,
      and status evidence converge, and where would you benchmark or reduce the per-reconcile
      list?
    goal: Connect stale observations to repeated convergence and the aggregate metric's
      cost boundary.
    challenge_kind: alternative
    best_answer: >-
      I would use owner references and idempotent apply, requeue a conflict or a missing Deployment,
      and inspect generation/status evidence on the next reconcile. I would skip unchanged status
      patches and benchmark the GoService list; if representative counts show cost, I would replace
      it with a narrower metric or cache rather than weaken policy-before-mutation.
    distractors:
    - text: I would defend the first KubePulse policy before mutation and reconciliation
        option because offering an alternative might make the decision look uncertain.
      why_wrong: A comparison makes the decision rule visible; it does not weaken
        a well-calibrated recommendation.
    - text: I would list every conceivable KubePulse policy before mutation and reconciliation
        design without saying which requirement should decide between them.
      why_wrong: An option list without a decision rule avoids the trade-off the follow-up
        is testing.
  compression:
    prompt: Give a 30-second explanation using policy gate, desired resources, rollout
      evidence, and requeue.
    goal: Preserve the level-triggered model and one scaling caveat.
  language_focus:
  - precision
  - pragmatics
  - hedging
  feynman:
    concept: A controller keeps comparing desired and observed state until the resource
      graph converges.
    explain_to: A teammate who wants a single imperative deployment run.
    constraint: Include one violation path, one deleted-resource path, and one rollout-health
      signal.
    self_check: Did you distinguish policy blocking from rollout requeueing and mention
      the list metric cost?
    reasoning_check: Can you identify the hidden premise behind KubePulse policy before
      mutation and reconciliation, give a counterexample, and explain how the evidence
      changes your conclusion?
  black_box:
    symptom: The answer says the first successful apply completes the controller's
      responsibility.
    expected: Each event reevaluates policy, applies owned desired state, examines
      rollout status, and writes only a changed status.
    actual: A stale object or deletion is treated as an unrecoverable exception.
    root_cause: Imperative deployment thinking replaced level-triggered reconciliation.
    repair: Reconcile again from the GoService, rely on owner references and CreateOrPatch,
      and profile or move the aggregate list if it dominates the hot path.
    reasoning_error: If your KubePulse policy before mutation and reconciliation answer
      failed, classify the mistake as a fact, assumption, comparison, failure, or
      certainty error before proposing the smallest repair.
  recall:
    active_recall_cue: Which branch returns before Deployment mutation, and which
      condition triggers requeue?
    feynman_prompt: Why can a deleted owned Deployment be normal convergence input
      rather than a terminal error?
    black_box_probe: Did you name observed generation, replica health, owner references,
      and list cost?
    leitner_start_box: 1
    mastery_threshold: 8
    delayed_variant:
      id: go_experience-05-kubepulse-policy-and-level-triggered-reconciliation-delayed-5
      prompt: >-
        A status patch conflicts with a newer generation and the Deployment disappears on the next reconcile. How should KubePulse converge?
      changed_constraint: >-
        reconciliation must be idempotent, generation-aware, and safe to requeue
      new_evidence: >-
        generation conflict and a missing child resource appear in successive reconcile observations
      best_answer: >-
        I would requeue conflicts, use owner references and idempotent CreateOrPatch, observe the newer generation and status, and skip unchanged patches while measuring list cost.
      distractors:
      - text: I would preserve every part of the original KubePulse policy before
          mutation and reconciliation answer because changing it after review would
          be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire KubePulse policy before mutation and reconciliation
          explanation with a new design without identifying what the evidence actually
          changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  extension:
    prompt: Define a fake-client or envtest case for a policy violation, a deleted
      Deployment, stale status, and an oversized GoService list, including the status
      and requeue assertions for each.
    goal: Turn reconciliation claims into observable convergence and cost checks.
  critical_thinking:
    problem_frame: >-
      KubePulse evaluates policy before mutation and converges desired resources repeatedly; I must handle generation conflicts and deleted children without treating one observation as final.
    claim_map:
      fact: >-
        Policy status and workload resources are reconciled from observed state.
      inference: >-
        Owner references, idempotent apply, requeue, and generation checks let later reconciles converge.
      assumption: >-
        I am assuming the controller can requeue conflicts and observe the newer generation.
      unknown: >-
        API conflict behavior, owner-reference scope, list cost, and status patch rate are unknown.
    comparison:
      applicable: true
      alternatives:
      - option: direct API reads on each reconcile with explicit generation and owner checks
        benefit: I observe current state directly and make policy-before-mutation ordering easy to audit.
        cost_or_risk: Reconcile latency and API load grow with event volume, and transient reads need bounded retry.
        valid_when: Use it while object counts and reconcile frequency fit the measured API budget.
      - option: an informer or cached observation path with the same policy and generation gates
        benefit: I reduce repeated API reads and can converge quickly under bursts of events.
        cost_or_risk: Cache staleness and resync behavior become part of correctness, so a stale observation cannot authorize unsafe mutation.
        valid_when: Use it when profiling shows API reads dominate and cache freshness is bounded and tested.
      decision_rule: I start with direct reads and explicit gates; I add caching only when measurements justify it without weakening policy or convergence checks.
    failure_probe:
      kind: edge_case
      prompt: >-
        What generation or missing-child observation would require requeue rather than marking the service terminal?
    evidence_check:
      basis: Check the KubePulse policy before mutation and reconciliation claim against
        backend-challenges/kubepulse-go-operator/README.md and the exact interview
        context; record whether each part is fact, inference, or hypothesis.
      source_kind: primary_code
      limitation: This Go project deep dive exercise can test reasoning about KubePulse
        policy before mutation and reconciliation, but it cannot prove an unmeasured
        production outcome, personal ownership, or universal rule.
      checked_on: '2026-08-25'
    certainty:
      level: low
      rationale: >-
        I am confident in level-triggered convergence as the model; cluster scale and conflict rate need measurement.
      update_trigger: >-
        Update when generation, requeue, or list benchmarks show a different convergence or collection boundary.
    rubric:
      facts_correct: Names the verified KubePulse policy before mutation and reconciliation
        facts without smuggling in a result, scale, or capability that the prompt
        does not establish.
      assumptions_explicit: Labels the KubePulse policy before mutation and reconciliation
        premise that is still assumed and asks the smallest clarifying question that
        matters.
      alternatives_considered: Compares two credible KubePulse policy before mutation
        and reconciliation options, or explains the hard constraint that makes comparison
        a false equivalence.
      tradeoff_quality: Connects the KubePulse policy before mutation and reconciliation
        choice to a benefit, a cost or risk, and the condition under which another
        choice wins.
      follow_up_adaptation: Responds to the alternative challenge about KubePulse
        policy before mutation and reconciliation by changing the claim or evidence
        boundary rather than repeating the base answer.
      certainty_calibration: Uses low certainty deliberately and names the evidence
        that would update the KubePulse policy before mutation and reconciliation
        recommendation.
- id: go_experience-06-pixguard-atomic-screening-and-outbox-leases
  version: 1.4.0
  target: go_experience
  topic: PixGuard atomic screening and outbox lease recovery
  difficulty: 3
  interview_stage: deep_dive
  prompt: How would you make a fraud screening atomic without overstating what an
    outbox lease or a local benchmark proves?
  context: The interviewer is testing idempotency, override auditability, the publish-crash
    window, and whether you can interpret an adverse SQLite result honestly.
  best_answer: I would store the screening, scoped idempotency key, audit entry, and
    outbox event in one PostgreSQL transaction, including the override decision. I would
    claim eligible rows with FOR UPDATE SKIP LOCKED, lease expiry, retries, and a
    dead-letter state, then give consumers stable event identity and reconciliation for
    a publish-then-crash duplicate. I would use a PostgreSQL benchmark for p95 and
    throughput; a local SQLite baseline cannot establish capacity, fraud accuracy, or loss.
  distractors:
  - text: Because the transaction commits all rows, I would mark an event published
      before sending it and rely on lease expiry to prevent duplicates. SQLite load
      timings prove the PostgreSQL path meets its p95 target, while an outbox record
      proves the screening decision is accurate and prevents every institution from
      suffering financial loss during payment traffic.
    trap: hedging
    why_wrong: It erases the publish-crash window and turns local SQLite timing into
      claims about PostgreSQL capacity, financial outcomes, and fraud accuracy.
  - text: I would keep idempotency, the audit entry, and the event in independent
      commits so each component can retry alone. A relay lease means a consumer may
      execute a message only once, even after expiry. If delivery fails, rerunning
      the screening is safer than reconciling the original event identity and downstream
      effect.
    trap: precision
    why_wrong: It recreates partial local facts and mistakes an expiring claim for
      consumer-level idempotency or a recovery policy.
  sources:
  - repo: backend-challenges
    path: pixguard-go-antifraud-platform/README.md
    note: PixGuard portfolio study boundary and local benchmarking context.
  - repo: original
    path: english-arcade/go_experience/6
    note: Original interview-language coaching.
  provenance:
    evidence_class: portfolio_code
    project: PixGuard
    repository: backend-challenges
    files:
