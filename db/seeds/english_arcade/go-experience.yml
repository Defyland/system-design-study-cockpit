- id: go_experience-01-backend-service-template-memory-idempotency
  version: 1.4.0
  target: go_experience
  topic: Backend Service Template memory idempotency
  difficulty: 2
  interview_stage: deep_dive
  prompt: How would you model idempotent task creation in a Go service template without
    presenting process memory as durable persistence?
  context: The interviewer is testing semantic replay, atomicity inside one process,
    and the migration boundary needed before multiple instances can coordinate.
  best_answer: >-
    I read the template as a mutex-protected in-memory store: it combines tenant and idempotency
    key for replay identity, hashes tenant, kind, and reference, returns the original task for a
    matching request, and conflicts when the same key carries a changed body. For multiple
    processes, I would move the unique replay key and fingerprint into the same PostgreSQL
    transaction as task creation, then design recovery for a process that fails between the database
    write and its reply.
  distractors:
  - text: I would keep a replay map without a mutex because duplicate requests are
      universally presumed serial. The key alone proves the body is unchanged, so
      a conflicting kind can reuse the first task safely. Process memory survives
      service restarts well enough, and a subsequent database can reproduce this behavior
      without a transaction or unique constraint.
    trap: precision
    why_wrong: It loses in-process atomicity, ignores semantic request comparison,
      and invents restart durability and database consistency.
  - text: I would hash only the idempotency key, then return a new task after every
      restart. Tenants do not need isolation because the key is already unique. A
      PostgreSQL table can be added later with separate insert statements, since replay
      and task creation have no reason to share an atomic boundary.
    trap: hedging
    why_wrong: It removes tenant scope and allows a crash or competing write to split
      replay identity from task creation.
  sources:
  - repo: backend-challenges
    path: backend-service-template/internal/store/memory.go
    note: Inspectable in-memory idempotency implementation.
  - repo: original
    path: english-arcade/go_experience/1
    note: Authored interview-language coaching.
  provenance:
    evidence_class: portfolio_code
    project: Backend Service Template
    repository: backend-challenges
    files:
    - path: backend-service-template/README.md
      commit: 48b12eaa7991a10ef81dd553092f7fcfda22b016
      claim: The committed README defines an in-memory template boundary and idempotent
        write behavior without database or queue guarantees.
    - path: backend-service-template/internal/store/memory.go
      commit: 48b12eaa7991a10ef81dd553092f7fcfda22b016
      claim: The committed store serializes task and replay updates with one mutex,
        keys replay by tenant and idempotency key, and hashes tenant, kind, and reference.
    - path: backend-service-template/internal/service/service_test.go
      commit: 48b12eaa7991a10ef81dd553092f7fcfda22b016
      claim: The cited tests specify create, same-request replay, and changed-request
        conflict behavior at that revision rather than a current test run.
    verified_claims:
    - The inspected portfolio store returns the same task for a matching replay and
      rejects a replay key paired with changed semantic input.
    - The mutex protects one process-memory implementation and does not establish
      durable storage, distributed coordination, OAuth, or background processing.
    confirmation_required:
    - Confirm authorship, operation scope, external users, results, current test execution,
      PostgreSQL migration behavior, distributed coordination, and failure recovery.
    safe_interview_version: This portfolio study models tenant-scoped replay and semantic
      conflict in one mutex-protected memory store; confirm delivery history and current
      execution before claiming durable persistence or multi-instance coordination.
    confidentiality:
      level: medium
      note: Do not expose API tokens, tenant identifiers, idempotency keys, task payloads,
        request fingerprints, local configuration, or replay records.
  feedback:
    register: Describe a replay contract and its storage boundary, not a durable-service
      success story.
    hedging: Restrict claims to the inspected memory store and leave delivery history,
      users, results, and current execution for confirmation.
    precision: Separate the replay key from the semantic hash, then explain why task
      and replay persistence must share an atomic database boundary.
    grammar: Order the explanation as first request, matching replay, changed request,
      then the migration limit.
    pragmatics: Offer the PostgreSQL follow-up before an interviewer has to uncover
      the single-process limitation.
  rephrase:
    prompt: Explain the same design to an API reviewer who asks why an idempotency
      key alone cannot define request identity.
    goal: Preserve tenant scope and semantic fingerprinting without claiming persistence.
  follow_up:
    prompt: How would you persist replay identity and a body digest beside task creation
      in PostgreSQL while preserving the same HTTP behavior?
    goal: Describe one transaction boundary and the residual cross-process failure
      question.
    challenge_kind: failure
    best_answer: >-
      I would persist tenant, idempotency key, and body digest beside task creation in one PostgreSQL
      transaction, replay a matching row, and conflict on changed input. I would put external work
      behind an outbox and reconcile a request that times out after commit, because a mutex protects
      only one process.
    distractors:
    - text: I would describe the Backend Service Template memory idempotency failure
        as impossible because the happy path already passed its test.
      why_wrong: Passing a happy path does not test the boundary, failure mode, or
        recovery being challenged.
    - text: I would add retries to Backend Service Template memory idempotency immediately
        and assume the system would become reliable.
      why_wrong: Retries can amplify load or duplicate effects; the failure and containment
        policy must be specified first.
  compression:
    prompt: In two sentences, contrast a matching replay with a same-key changed request.
    goal: Retain the semantic-hash rule and the process-memory limitation.
  language_focus:
  - precision
  - pragmatics
  - hedging
  feynman:
    concept: Idempotency means the same semantic command can be replayed, not that
      any repeated header should be accepted.
    explain_to: A teammate who wants a map keyed only by Idempotency-Key.
    constraint: Explain the mutex and database migration without promising a distributed
      guarantee.
    self_check: Did you name tenant scope, semantic fields, and the atomic persistence
      need?
    reasoning_check: Can you identify the hidden premise behind Backend Service Template
      memory idempotency, give a counterexample, and explain how the evidence changes
      your conclusion?
  black_box:
    symptom: The answer calls a memory map persistent and replays a changed command
      by key.
    expected: Mutex-protected replay state, semantic conflict detection, and an explicit
      one-process boundary.
    actual: Header-only caching with restart and multi-instance behavior left unspecified.
    root_cause: The learner remembered the idempotency label but not the identity
      or storage contract.
    repair: Bind the key to tenant and request fingerprint, then move task and replay
      writes into one database transaction before scaling instances.
    reasoning_error: If your Backend Service Template memory idempotency answer failed,
      classify the mistake as a fact, assumption, comparison, failure, or certainty
      error before proposing the smallest repair.
  recall:
    active_recall_cue: Which fields make a replay semantically identical in the memory
      store?
    feynman_prompt: Explain why a mutex cannot coordinate two service processes.
    black_box_probe: Did you preserve matching-replay and changed-request HTTP behavior?
    leitner_start_box: 1
    mastery_threshold: 8
    delayed_variant:
      id: go_experience-01-backend-service-template-memory-idempotency-delayed-1
      prompt: >-
        The template's memory store passes same-process tests, but two instances create duplicate tasks. What durable boundary is missing?
      changed_constraint: >-
        replay identity and task creation must be atomic across instances
      new_evidence: >-
        a two-instance test creates duplicate tasks despite matching in-memory keys
      best_answer: >-
        I would persist tenant, idempotency key, and body digest beside task creation in one PostgreSQL transaction, replay matching rows, conflict on changed input, and use an outbox or reconciliation path for external work.
      distractors:
      - text: I would preserve every part of the original Backend Service Template
          memory idempotency answer because changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Backend Service Template memory idempotency
          explanation with a new design without identifying what the evidence actually
          changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  extension:
    prompt: Sketch the unique key and transaction that preserves this replay contract
      in PostgreSQL.
    goal: Include a request fingerprint, task insert, conflict path, and crash boundary.
  critical_thinking:
    problem_frame: >-
      The template's in-memory mutex protects one process, while durable replay must survive multiple instances and a crash after task creation.
    claim_map:
      fact: >-
        The memory store combines tenant and idempotency key and hashes request semantics.
      inference: >-
        Matching replay and changed-input conflict are useful HTTP behavior but not cross-instance durability.
      assumption: >-
        I am assuming PostgreSQL can own the unique replay record and task insert in one transaction.
      unknown: >-
        Crash recovery, external effects, instance count, and migration compatibility are unknown.
    comparison:
      applicable: false
      rejected_alternative: >-
        Treating process memory, a durable replay record, and an external effect ledger as one interchangeable idempotency mechanism would be a false equivalence: they survive different failures and cover different boundaries.
      hard_constraint: >-
        The hard constraint is matching replay and changed-input conflict across instances without claiming that process memory survives restart or coordinates an external effect.
      decision_rule: >-
        State the local template behavior first, then choose a durable transaction and provider reconciliation boundary from the deployment and side-effect contract.
    failure_probe:
      kind: counterexample
      prompt: >-
        What two-instance or crash test would show the in-memory store cannot preserve replay identity?
    evidence_check:
      basis: Check the Backend Service Template memory idempotency claim against backend-challenges/backend-service-template/internal/store/memory.go
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: primary_code
      limitation: This Go project deep dive exercise can test reasoning about Backend
        Service Template memory idempotency, but it cannot prove an unmeasured production
        outcome, personal ownership, or universal rule.
      checked_on: '2026-08-25'
    certainty:
      level: low
      rationale: >-
        I am confident about the single-process boundary; the PostgreSQL migration and recovery contract require persistence evidence.
      update_trigger: >-
        Update when multi-instance tests or a provider effect changes the atomic transaction and reconciliation design.
    rubric:
      facts_correct: Names the verified Backend Service Template memory idempotency
        facts without smuggling in a result, scale, or capability that the prompt
        does not establish.
      assumptions_explicit: Labels the Backend Service Template memory idempotency
        premise that is still assumed and asks the smallest clarifying question that
        matters.
      alternatives_considered: Compares two credible Backend Service Template memory
        idempotency options, or explains the hard constraint that makes comparison
        a false equivalence.
      tradeoff_quality: Connects the Backend Service Template memory idempotency choice
        to a benefit, a cost or risk, and the condition under which another choice
        wins.
      follow_up_adaptation: Responds to the failure challenge about Backend Service
        Template memory idempotency by changing the claim or evidence boundary rather
        than repeating the base answer.
      certainty_calibration: Uses low certainty deliberately and names the evidence
        that would update the Backend Service Template memory idempotency recommendation.
- id: go_experience-02-bankport-concurrent-idempotency-middleware
  version: 1.4.0
  target: go_experience
  topic: BankPort concurrent idempotency middleware
  difficulty: 3
  interview_stage: deep_dive
  prompt: How would you coordinate concurrent idempotent financial requests in middleware
    without confusing an in-memory sandbox with a durable distributed guarantee?
  context: The interviewer is probing owner, replay, conflict, and waiter states,
    plus the crash window between a side effect and a cached completion.
  best_answer: I would derive partner, route, and idempotency key, then bind the record
    to the method, route, and body fingerprint. I would let one request own processing,
    have matching callers wait or replay a cacheable response, and reject a changed
    body. TTL and cancellation bound the in-memory case; for multiple instances or a
    crash after an external effect, I would persist the record and use an outbox or
    reconciliation path rather than claim that memory coordination is durable.
  distractors:
  - text: I would cache every response immediately under the idempotency key and let
      each instance decide independently. A changed body can reuse the owner response
      because the key already identifies intent. Waiters do not need cancellation,
      TTL, or status rules, and a local performance benchmark proves the same behavior
      remains durable across replicas.
    trap: precision
    why_wrong: It loses request identity, completion policy, cancellation, and the
      cross-instance failure boundary while inventing durability from local evidence.
  - text: I would treat Complete as proof that the financial side effect and cached
      response always happened together. If a process crashes, a retry can safely
      become a new owner. PostgreSQL can be added later without an outbox, because
      a unique key alone removes any need to reconcile an uncertain external command.
    trap: hedging
    why_wrong: It ignores the side-effect-before-completion window and treats a unique
      database row as a substitute for transaction and outbox reasoning.
  sources:
  - repo: backend-challenges
    path: bankport-go-gin-partner-api/internal/httpapi/middleware/idempotency.go
    note: Inspectable concurrent idempotency middleware.
  - repo: original
    path: english-arcade/go_experience/2
    note: Authored interview-language coaching.
  provenance:
    evidence_class: portfolio_code
    project: BankPort
    repository: backend-challenges
    files:
    - path: bankport-go-gin-partner-api/README.md
      commit: 49f659d55ebf95509fba4ab97971f4c0a57a4d67
      claim: The committed README frames the reviewed implementation as an in-memory
        sandbox while documenting a future PostgreSQL consistency path.
    - path: bankport-go-gin-partner-api/internal/httpapi/middleware/idempotency.go
      commit: 49f659d55ebf95509fba4ab97971f4c0a57a4d67
      claim: The committed middleware implements owner, replay, conflict, and wait
        states with request fingerprints, ready channels, cancellation, TTL pruning,
        and cacheable statuses.
    - path: bankport-go-gin-partner-api/benchmarks/baseline.md
      commit: 49f659d55ebf95509fba4ab97971f4c0a57a4d67
      claim: The committed baseline records local measurements and names a future
        PostgreSQL consistency path without proving a distributed or operational result.
    verified_claims:
    - The inspected middleware coordinates matching concurrent calls within one process
      and keeps a changed request fingerprint on the conflict path.
    - The available study boundary is in-memory and local; it does not establish durable
      cross-instance coordination or an atomic financial side-effect record.
    confirmation_required:
    - Confirm authorship, operation scope, partner or customer use, results, current
      test or benchmark execution, PostgreSQL behavior, and side-effect reconciliation
      policy.
    safe_interview_version: This portfolio study coordinates idempotent requests inside
      one process with fingerprint, waiting, replay, conflict, TTL, and cancellation
      behavior; confirm delivery history and durable multi-instance guarantees before
      stronger claims.
    confidentiality:
      level: high
      note: Do not disclose tokens, partner data, request bodies, local benchmark
        identifiers, idempotency records, financial command details, or reconciliation
        evidence.
  feedback:
    register: Describe a concurrency protocol with a storage limit, not a financial
      durability promise.
    hedging: Keep local measurements and the in-memory sandbox separate from partners,
      production, results, or current verification.
    precision: Distinguish owner, waiter, replay, and conflict, then place cancellation,
      TTL, and cacheable-status policy around those states.
    grammar: Use “after side effect but before Complete” to make the crash interval
      explicit.
    pragmatics: Acknowledge uncertain financial effects before proposing a retry or
      a database migration.
  rephrase:
    prompt: Explain the waiting path to a reliability engineer who asks why replay
      is not enough while an owner request is still running.
    goal: Retain ready-channel coordination and caller cancellation semantics.
  follow_up:
    prompt: If two instances receive one command, or a crash follows the external
      action before completion is recorded, how would durable storage and reliable
      delivery recover it?
    goal: Separate local ownership from durable external-effect recovery.
    challenge_kind: new_evidence
    best_answer: >-
      BankPort's middleware derives a partner, route, and idempotency key, then compares a method, route,
      and body fingerprint. I would move that identity and owner/wait/replay state into durable
      storage, add an outbox for external effects, and distinguish conflict, in-progress, and
      completed states. After a crash following provider acceptance, I would query or reconcile
      before retrying rather than trust process memory.
    distractors:
    - text: I would keep the BankPort concurrent idempotency middleware recommendation
        unchanged because changing position would look inconsistent.
      why_wrong: A defensible answer updates when relevant evidence changes an assumption
        or trade-off.
    - text: I would discard every earlier BankPort concurrent idempotency middleware
        claim as soon as one new observation appeared.
      why_wrong: New evidence may narrow one claim while leaving other verified facts
        intact.
  compression:
    prompt: Contrast owner, waiter, and replay in three short clauses.
    goal: Retain the fingerprint and one-process durability limit.
  language_focus:
  - precision
  - pragmatics
  - hedging
  feynman:
    concept: A waiting request needs the owner's completed result or an explicit cancellation
      path.
    explain_to: A teammate who wants every duplicate to execute independently.
    constraint: Explain the crash interval without a durable financial guarantee.
    self_check: Did you name fingerprint, ready channel, and the cross-instance limit?
    reasoning_check: Can you identify the hidden premise behind BankPort concurrent
      idempotency middleware, give a counterexample, and explain how the evidence
      changes your conclusion?
  black_box:
    symptom: The response turns an owner marker into proof that the side effect is
      durable.
    expected: Local ownership, wait or replay behavior, cacheability rules, and a
      crash-recovery boundary.
    actual: An unconditional retry after a process loss.
    root_cause: The in-memory protocol was confused with a distributed transaction.
    repair: Record durable intent with the command, use an outbox or reconciliation
      process, and keep duplicate handling consistent across instances.
    reasoning_error: If your BankPort concurrent idempotency middleware answer failed,
      classify the mistake as a fact, assumption, comparison, failure, or certainty
      error before proposing the smallest repair.
  recall:
    active_recall_cue: What condition makes a request owner, waiter, replay, or conflict?
    feynman_prompt: Explain the difference between Complete and an external side effect.
    black_box_probe: Did you identify the two-instance and crash-recovery gap?
    leitner_start_box: 1
    mastery_threshold: 8
    delayed_variant:
      id: go_experience-02-bankport-concurrent-idempotency-middleware-delayed-2
      prompt: >-
        A provider accepts a command and the process crashes before Complete. How should BankPort recover?
      changed_constraint: >-
        durable owner and external-effect state must survive the process crash
      new_evidence: >-
        the process restarts with no memory record even though the provider may have accepted the command
      best_answer: >-
        I would store owner, in-progress, completed, and conflict states durably, use a provider idempotency key or status query, and reconcile the outbox before retrying.
      distractors:
      - text: I would preserve every part of the original BankPort concurrent idempotency
          middleware answer because changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire BankPort concurrent idempotency middleware
          explanation with a new design without identifying what the evidence actually
          changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  extension:
    prompt: Design a database and outbox contract for a command that survives a crash
      before Complete.
    goal: Preserve fingerprint conflict behavior while making reconciliation observable.
  critical_thinking:
    problem_frame: >-
      BankPort's owner/wait/replay state is local memory while provider effects may be remote; I must separate concurrency coordination from durable recovery.
    claim_map:
      fact: >-
        The middleware derives request identity and coordinates matching callers in one process.
      inference: >-
        A durable record and outbox or reconciliation path are needed after a crash following an external action.
      assumption: >-
        I am assuming the partner/provider supports a stable idempotency identity or status lookup.
      unknown: >-
        Cross-instance ownership, provider acknowledgment, TTL recovery, and response durability are unknown.
    comparison:
      applicable: true
      alternatives:
      - option: an in-process owner/wait/replay map for one service instance
        benefit: I can make same-process duplicate requests wait or replay with low latency and a small implementation.
        cost_or_risk: It disappears on restart and cannot coordinate another instance or an external provider effect.
        valid_when: Use it for a bounded sandbox or single-process exercise whose limits are explicit.
      - option: a durable idempotency record with provider idempotency or reconciliation
        benefit: I can recover across instances and crashes while preserving changed-body conflict behavior.
        cost_or_risk: I add schema, retention, lease, and uncertain-effect recovery work.
        valid_when: Use it when requests can cross processes or trigger a financial side effect.
      decision_rule: I keep memory coordination only within its stated sandbox boundary; I move identity and recovery to durable storage before claiming distributed safety.
