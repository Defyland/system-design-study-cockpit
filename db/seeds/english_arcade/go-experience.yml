    safe_interview_version: This Terraport portfolio study demonstrates lifecycle,
      import, drift, retry, and fake-API acceptance boundaries; it requires a remote
      idempotency and reconciliation contract before claims about safe repeated creation
      against a real platform.
    confidentiality:
      level: high
      note: Do not disclose token, Terraform state, client or signing secret, API
