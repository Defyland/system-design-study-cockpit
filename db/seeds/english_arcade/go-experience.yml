    feynman_prompt: Why does a consumer still need stable identity after an outbox
      lease expires?
    black_box_probe: Did you separate SQLite p95 evidence from PostgreSQL capacity
      and fraud accuracy?
    leitner_start_box: 1
    mastery_threshold: 8
    delayed_variant:
      id: go_experience-06-pixguard-atomic-screening-and-outbox-leases-delayed-6
      prompt: >-
        A relay lease expires after publish and the event is delivered again. What identity and benchmark separate the duplicate case from the SQLite baseline?
      changed_constraint: >-
        consumer deduplication and PostgreSQL capacity are separate concerns
      new_evidence: >-
        stable event identity contains the duplicate while SQLite misses representative PostgreSQL p95 and lock behavior
      best_answer: >-
        I would deduplicate by stable event identity and reconcile screening state, then run a PostgreSQL benchmark for p95, lock contention, and failure cases instead of extrapolating SQLite.
      distractors:
      - text: I would preserve every part of the original PixGuard atomic screening
          and outbox lease recovery answer because changing it after review would
          be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire PixGuard atomic screening and outbox lease
          recovery explanation with a new design without identifying what the evidence
          actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  extension:
    prompt: Write one negative case for transaction rollback, lease expiry after publish,
      duplicate consumer delivery, and the PostgreSQL benchmark plan, including the
      identity or metric each case must inspect.
    goal: Make atomicity, duplicate recovery, and performance scope independently
      testable.
  critical_thinking:
    problem_frame: >-
      PixGuard commits screening, audit, idempotency, and outbox state locally, while relay leases permit duplicate publication; I must separate local atomicity from consumer recovery and capacity.
    claim_map:
      fact: >-
        The decision, audit, and event are stored in one PostgreSQL transaction.
      inference: >-
        A stable event identity and reconciliation contain a publish-before-marking duplicate; SQLite timing cannot describe PostgreSQL capacity.
      assumption: >-
        I am assuming consumers can deduplicate and the PostgreSQL schema reflects production-like contention.
      unknown: >-
