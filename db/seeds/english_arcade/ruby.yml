  extension:
    prompt: >-
      A version-specific Ractor experiment disagrees with memory: record the Ruby version and narrow the object-transfer claim to the tested evidence?
    goal: >-
      State the Ractor shareability boundary, then scope the claim to the installed version and tested object.
  critical_thinking:
    problem_frame: >-
      The actor is an interviewer asking about Ractor object transfer. The required outcome is an accurate version-scoped boundary, not a confident internal story; the constraints are shareability and transfer rules; the unknown is the installed Ruby version and the exact object crossing the boundary.
    claim_map:
      fact: >-
        Objects crossing a Ractor boundary must follow Ruby's shareability or transfer rules, and ordinary shared mutable state is not a safe assumption.
      inference: >-
        A versioned documentation check plus a tiny experiment is enough to answer the specific object case without inventing unverified Ractor internals.
      assumption: >-
        I am assuming the question concerns the installed Ruby runtime rather than one remembered from another release.
      unknown: >-
        The Ruby version, object type, transfer operation, and whether the object is deeply shareable are not given.
    comparison:
      applicable: false
      rejected_alternative: >-
        Comparing Ractors with threads or processes before identifying the version and object would evade the knowledge boundary instead of answering the isolation question.
      hard_constraint: >-
        I must not promise a version-free isolation guarantee when the object and runtime have not been verified.
      decision_rule: >-
        I would state the shareability boundary, name the unknown version/object, and verify the exact case in the installed documentation or a focused experiment before extending the claim.
    failure_probe:
      kind: counterexample
      prompt: >-
        Which version and object experiment would falsify your Ractor claim, and how would you narrow it?
    evidence_check:
      basis: >-
        Record the installed Ruby version, consult its Ractor documentation, and run the smallest shareability/transfer test that matches the interview question.
      source_kind: authored_scenario
      limitation: >-
        This exercise verifies a version and object case, not every Ractor implementation detail or production suitability.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        The need for a shareability boundary is clear, but the exact transfer result is version- and object-dependent and intentionally unverified in the prompt.
      update_trigger: >-
        I would update the answer when the installed docs or experiment contradict a remembered rule, recording the version and narrowing the guarantee.
    rubric:
      facts_correct: >-
        States the shareability/transfer boundary without inventing Ractor internals.
      assumptions_explicit: >-
        Names the missing Ruby version and object type.
      alternatives_considered: >-
        Explains why a broad threads/processes comparison cannot substitute for the requested versioned fact.
      tradeoff_quality: >-
        Connects honesty about the gap to a fast documentation and experiment path.
      follow_up_adaptation: >-
        Narrows a version-free guarantee when a test contradicts memory.
      certainty_calibration: >-
        Uses medium certainty for the boundary and labels exact mechanics as needing verification.
