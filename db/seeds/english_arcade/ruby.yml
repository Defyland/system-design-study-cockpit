      assumption: An unstated assumption is that the Blocks, procs and lambdas constraint
        is the dominant one; label it and ask whether the interviewer confirms it.
      unknown: 'Still unknown for Blocks, procs and lambdas: the scale, failure tolerance,
        ownership boundary, and evidence threshold that would change the decision.'
    comparison:
      applicable: false
      rejected_alternative: A tool-first A-versus-B debate about Blocks, procs and
        lambdas would be a false equivalence because the prompt does not establish
        that both choices satisfy the same contract.
      hard_constraint: The hard Blocks, procs and lambdas constraint is the required
        guarantee stated by the interviewer; no missing measurement licenses a stronger
        comparison.
      decision_rule: Do not manufacture a trade-off for Blocks, procs and lambdas;
        first clarify the constraint or collect the evidence that would make two options
        genuinely comparable.
    failure_probe:
      kind: counterexample
      prompt: 'Blocks, procs and lambdas: what minimum input for Blocks, procs and
        lambdas would break the Blocks, procs and lambdas recommendation, and how
        would you revise the Blocks, procs and lambdas claim?'
    evidence_check:
      basis: Check the Blocks, procs and lambdas claim against system-design-estudos/areas/01-metodo-e-entrevistas/backend-interview-foundations/chapters/05-ruby-on-rails-interview-surface-area.md
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: This Ruby exercise can test reasoning about Blocks, procs and lambdas,
        but it cannot prove an unmeasured production outcome, personal ownership,
        or universal rule.
      checked_on: '2026-08-25'
    certainty:
      level: high
      rationale: Certainty is high because the prompt bounds the Blocks, procs and
        lambdas question but does not reveal every workload, stakeholder priority,
        or outcome.
      update_trigger: For case "What is the practical difference between a", update
        Blocks, procs and lambdas when Blocks, procs and lambdas evidence—a Blocks,
        procs and lambdas trace or Blocks, procs and lambdas test—contradicts the
        Blocks, procs and lambdas constraint in case "What is the practical difference
        between a"; ask a stakeholder about Blocks, procs and lambdas before revising.
    rubric:
      facts_correct: Names the verified Blocks, procs and lambdas facts without smuggling
        in a result, scale, or capability that the prompt does not establish.
      assumptions_explicit: Labels the Blocks, procs and lambdas premise that is still
        assumed and asks the smallest clarifying question that matters.
      alternatives_considered: Compares two credible Blocks, procs and lambdas options,
