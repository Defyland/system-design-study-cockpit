---
contract_version: 1.4.0
target:
  key: ruby
  label: Ruby
  blurb: 'Talk about the object model, blocks and performance the way a senior Ruby
    engineer does: concretely, with the mechanism named.'
  focus_areas:
  - object model and method lookup
  - blocks, procs and enumerables
  - memory and performance
  - concurrency and the GVL
  - error handling and contracts
  simulation:
    minutes: 45
    structure:
    - label: Warm-up on idioms and readability
      minutes: 8
    - label: Object model deep dive
      minutes: 12
    - label: Performance and memory reasoning
      minutes: 15
    - label: Concurrency and failure handling
      minutes: 10
  critical_thinking:
    learner_prompts:
      evidence_ledger: For Ruby, record whether each claim about Ruby's object model,
        Enumerable semantics, allocation, and error boundary is a verified fact, an
        inference, an assumption, or an unknown before you defend it.
      problem_frame: Frame every Ruby answer with the actor, requirement, constraint,
        success condition, and unanswered question that could change the decision.
      comparison: When Ruby offers a real choice, compare two options by benefit,
        cost or risk, valid-when condition, and an explicit decision rule.
      failure_probe: Ask which counterexample, edge case, or failure mode could break
        the Ruby recommendation, then state the smallest test or containment step.
      certainty_review: 'Calibrate certainty in Ruby: name the evidence, separate
        correlation from causality, and say what new observation would make you revise
        the answer.'
    rubric:
      facts_correct: Names the verified Ruby's object model, Enumerable semantics,
        allocation, and error boundary facts without smuggling in a result or capability
        that the prompt does not establish.
      assumptions_explicit: Labels the Ruby premise that is still assumed and asks
        the smallest clarifying question that matters.
      alternatives_considered: Considers a credible alternative for Ruby, or explains
        the hard constraint that makes comparison a false equivalence.
      tradeoff_quality: Connects the Ruby choice to a benefit, a cost or risk, and
        the condition under which another choice wins.
      follow_up_adaptation: Responds to an adversarial Ruby follow-up by changing
        the claim or evidence boundary rather than repeating a memorised answer.
      certainty_calibration: Uses high, medium, or low certainty deliberately and
        names the evidence that would update the Ruby recommendation.
cards:
- id: ruby-card-mechanism-first
  front: What makes a Ruby answer sound senior in English?
  back: >-
    I name the mechanism, not the vibe: "method lookup walks the singleton class first"
    tells the interviewer what I will trace, while "Ruby is flexible" does not.
  box: 1
  source:
    repo: system-design-estudos
    path: areas/01-metodo-e-entrevistas/backend-interview-foundations/chapters/05-ruby-on-rails-interview-surface-area.md
    note: Surface area chapter used for Ruby interview vocabulary.
  critical_thinking:
    cue: What makes a Ruby answer sound senior in English? Name the runtime mechanism,
      its consequence, and the condition that would make another explanation win.
    check: Can you compare two mechanisms, name the failure a vague claim would hide,
      and say which trace or documentation would update your answer?
- id: ruby-card-gvl
  front: How do you describe the GVL without overclaiming?
  back: I use threads for IO-bound work because waits can overlap; I treat the GVL as
    a reason to choose processes or Ractors for CPU-bound parallelism, then verify the
    runtime and workload before promising a speedup.
  box: 2
  source:
    repo: system-design-estudos
    path: areas/09-backend-principles/cards/concurrency-parallelism.md
    note: Concurrency card distinguishing concurrency from parallelism.
  critical_thinking:
    cue: How do you describe the GVL without overclaiming? Separate the runtime fact
      from the workload assumption and name the evidence needed for a speedup claim.
    check: Can you compare threads with processes or Ractors, name the IO-versus-CPU
      failure mode, and say which benchmark would update your recommendation?
- id: ruby-card-enumerable
  front: How should you justify an enumerable choice out loud?
  back: >-
    I explain Enumerable choices by pass count and allocation: each_with_object can avoid
    an intermediate array when I mutate the accumulator, but I still measure the path that
    matters.
  box: 1
  source:
    repo: original
    path: english-arcade/ruby/enumerable-justification
    note: Distilled from the enumerable items authored in this pack.
  critical_thinking:
    cue: How should you justify an enumerable choice out loud? Name the pass count,
      allocation behavior, and the condition that makes a lazy or explicit loop better.
    check: Can you compare two Enumerable methods, name the allocation or laziness failure,
      and state what measurement would change your choice?
items:
- id: ruby-01-blocks-vs-procs
  version: 1.4.0
  target: ruby
  topic: Blocks, procs and lambdas
  difficulty: 2
  interview_stage: technical_screen
  prompt: What is the practical difference between a proc and a lambda?
  context: A screening call for a senior Ruby role. The interviewer is checking whether
    you know the semantics well enough to say when the difference actually bites in
    production code.
  follow_up:
    prompt: If this callback needs parameters and a predictable return contract, which
      callable would you choose and how would you test it?
    goal: Answer the new_evidence challenge about Blocks, procs and lambdas while
      keeping the evidence boundary explicit.
    challenge_kind: new_evidence
    best_answer: >-
      I would choose a lambda when the callback needs a predictable arity and return
      boundary, and I would choose a proc only when its looser contract is useful. I would
      test wrong-arity calls and an early return from the enclosing method before defending
      that choice.
    distractors:
    - text: I would keep the Blocks, procs and lambdas recommendation unchanged because
        changing position would look inconsistent.
      why_wrong: A defensible answer updates when relevant evidence changes an assumption
        or trade-off.
    - text: I would discard every earlier Blocks, procs and lambdas claim as soon
        as one new observation appeared.
      why_wrong: New evidence may narrow one claim while leaving other verified facts
        intact.
  compression:
    prompt: 'Contrast block, Proc, and lambda in three clauses: ownership, argument
      behavior, and return semantics.'
    goal: Compress the Blocks, procs and lambdas answer into its decision, premise,
      trade-off, and verification step.
  best_answer: >-
    I distinguish the two behaviors that matter in practice: a lambda checks its arity
    while a proc does not, and return inside a lambda exits the lambda while return inside
    a proc exits the enclosing method. I would test that return path before using a proc
    as a callback, because it can cause a surprising early exit.
  distractors:
  - text: Lambdas are stricter and procs are more flexible, so generally you would
      use a lambda when you want stricter behaviour and a proc when you want something
      more permissive in your code.
    trap: precision
    why_wrong: Restates "strict" without naming arity checking or return semantics,
      so it demonstrates no actual knowledge.
  - text: The lambda is verifying the number of arguments and the proc is not doing
      this, and also the return inside a proc is returning of the method that is containing
      it.
    trap: grammar
    why_wrong: Progressive forms misuse stative verbs and "returning of" is a preposition
      error, both marking non-native production.
  - text: Honestly they are basically interchangeable in modern Ruby and I have never
      had to think about the distinction in any real codebase I have worked on over
      the years.
    trap: content
    why_wrong: Factually wrong and dismissive; the return semantics difference causes
      real bugs in callback-heavy code.
  feedback:
    register: Confident and concrete. Senior answers name consequences, not adjectives.
    hedging: No hedging required here; these semantics are well defined.
    precision: Say "arity" and "return semantics" explicitly rather than "stricter".
    grammar: 'Simple present for language rules: "a lambda checks", not "is verifying".'
    pragmatics: The word "in practice" earns credibility by anticipating the follow-up.
  rephrase:
    prompt: Answer again, leading with the bug this difference causes in real code.
    goal: Practise leading with consequence rather than definition.
  language_focus:
  - precision
  - grammar
  - register
  feynman:
    concept: Proc versus lambda arity and return semantics.
    explain_to: A JavaScript developer new to Ruby closures.
    constraint: Explain without using the word "lambda" more than once.
    self_check: Could your listener predict which one exits the method early?
    reasoning_check: Can you identify the hidden premise behind Blocks, procs and
      lambdas, give a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You described them with adjectives instead of semantics.
    expected: Arity checking plus return-from-enclosing-method behaviour.
    actual: A "stricter versus flexible" gloss, or a claim they are interchangeable.
    root_cause: The distinction was memorised as a label rather than as a behaviour
      with consequences.
    repair: 'Rehearse one sentence naming the bug: an early return from a callback.'
    reasoning_error: If your Blocks, procs and lambdas answer failed, classify the
      mistake as a fact, assumption, comparison, failure, or certainty error before
      proposing the smallest repair.
  recall:
    active_recall_cue: Which construct returns from the enclosing method, and why
      does that matter?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Blocks, procs and lambdas
      without presenting an assumption as a fact?
    black_box_probe: When the Blocks, procs and lambdas answer failed, did you locate
      the reasoning error before changing the implementation?
    delayed_variant:
      id: ruby-01-blocks-vs-procs-delayed-1
      prompt: >-
        A callback benchmark shows the lambda and proc have different costs, while a caller depends
        on the proc return behavior. Which semantic claim survives, and what would you test before
        changing the callback?
      changed_constraint: >-
        the callback must keep its return contract while meeting the observed cost budget
      new_evidence: >-
        a benchmark separates the callable costs and a caller trace shows the enclosing method
        return matters
      best_answer: >-
        I would keep the arity and return-semantics distinction, but I would not trade away the
        caller contract for a small benchmark difference. I would test both callable forms at the
        real call site, including the early-return path, then choose the cheaper form only if its
        control flow remains explicit.
      distractors:
      - text: I would preserve every part of the original Blocks, procs and lambdas
          answer because changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Blocks, procs and lambdas explanation with
          a new design without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/01-metodo-e-entrevistas/backend-interview-foundations/chapters/05-ruby-on-rails-interview-surface-area.md
    note: Ruby interview surface area including closure semantics.
  - repo: original
    path: english-arcade/ruby/blocks-vs-procs
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: >-
      A caller depends on callback return behavior: trace a proc and a lambda at the call site, then explain which arity or non-local-return edge changes the contract?
    goal: >-
      Make the callback choice explicit by testing arity and non-local return at its real call site.
  critical_thinking:
    problem_frame: >-
      The actor is the callback caller. It needs a predictable argument and return contract; the Ruby constraint is that Proc and lambda have different arity and non-local-return behavior; the unknown is whether this caller intentionally relies on a non-local return.
    claim_map:
      fact: >-
        I know two relevant semantic differences: a lambda enforces its parameter count more strictly, while a Proc return can leave the method that created it.
      inference: >-
        A callback with a normal return boundary and fixed parameters is safer to express as a lambda because the caller can reason about where control flow ends.
      assumption: >-
        I am assuming the callback contract does not deliberately use a Proc to return from its enclosing method; I would confirm that at the call site.
      unknown: >-
        The snippet does not show whether callers depend on loose argument handling, a non-local return, or a particular Ruby version's edge behavior.
    comparison:
      applicable: false
      rejected_alternative: >-
        This is a semantic contract question, so choosing a callable by general flexibility would obscure the actual arity and return behavior that the caller must preserve.
      hard_constraint: >-
        The hard constraint is the callback's required argument and return contract, including whether a return must leave the enclosing method.
      decision_rule: >-
        I would choose a lambda for a predictable callback contract; I would choose a Proc only when the enclosing-method return or looser invocation semantics are explicit and tested.
    failure_probe:
      kind: edge_case
      prompt: >-
        Which wrong-arity or non-local-return case would show the callback contract is wrong, and what test would you run?
    evidence_check:
      basis: >-
        Check the prompt's callback contract against the Ruby callable semantics and a tiny call-site test that records arity failure and the point at which return resumes.
      source_kind: authored_scenario
      limitation: >-
        The exercise establishes language behavior, not the production callback's actual callers, failure rate, or performance budget.
      checked_on: '2026-08-25'
    certainty:
      level: high
      rationale: >-
        Certainty is high for the arity and return distinction because the prompt asks about Ruby semantics; it is lower for which callable wins until the call-site contract is known.
      update_trigger: >-
        I would update the recommendation if a call-site trace shows intentional non-local return or if a wrong-arity case is part of the required API.
    rubric:
      facts_correct: >-
        Names lambda arity checking and the different return boundaries accurately.
      assumptions_explicit: >-
        States whether the caller permits a non-local Proc return and asks for the missing call-site contract.
      alternatives_considered: >-
        Explains why this is a semantic contract choice and when Proc remains valid.
      tradeoff_quality: >-
        Connects lambda predictability and Proc flexibility to the exact callback behavior that costs safety.
      follow_up_adaptation: >-
        Chooses from the new parameter and return requirements, then proposes tests for both failure modes.
      certainty_calibration: >-
        Keeps language facts high-certainty while marking the unseen caller contract as conditional.


- id: ruby-02-method-lookup
  version: 1.4.0
  target: ruby
  topic: Object model
  difficulty: 3
  interview_stage: deep_dive
  prompt: When you call a method on an object, how does Ruby find it?
  context: A deep-dive round. The interviewer wants the lookup order stated accurately,
    because it determines how modules, prepend and singleton methods interact in a
    real codebase.
  follow_up:
    prompt: If a prepended module and an inherited method both define the same name,
      which implementation runs first and how would you verify it?
    goal: Answer the assumption challenge about Object model while keeping the evidence
      boundary explicit.
    challenge_kind: assumption
    best_answer: >-
      I would expect the prepended module to run before the class's inherited method, then
      verify the actual receiver. I would inspect object.singleton_class.ancestors and call
      the method with a small trace so the lookup order, rather than my memory, supports
      the answer.
    distractors:
    - text: I would repeat my original Object model answer with more confidence because
        the interviewer probably assumes the usual case.
      why_wrong: It hides the premise instead of checking whether the usual case is
        actually part of this problem.
    - text: I would stop proposing anything about Object model until every surrounding
        requirement had been documented in full.
      why_wrong: It treats uncertainty as a reason for paralysis and offers no bounded
        next step.
  compression:
    prompt: Explain Ruby method lookup as an ordered chain that names the receiver,
      singleton class, modules, and superclass.
    goal: Compress the Object model answer into its decision, premise, trade-off,
      and verification step.
  best_answer: >-
    I trace Ruby's ancestor chain from the singleton class through prepended modules, the
    class, included modules in reverse inclusion order, and then the superclass chain until
    method_missing. I use that order to explain which definition wins instead of calling
    the result a Ruby quirk.
  distractors:
  - text: It looks in the class first, and then if it does not find the method there
      it goes up to the parent class, and it keeps going up until it reaches Object
      at the top of the hierarchy.
    trap: content
    why_wrong: Omits singleton class, prepend and module ordering, which is precisely
      what a deep-dive question is testing.
  - text: Ruby is searching in the ancestors of the object, first in the singleton,
      after in the modules that was prepended, and then it continues for the superclass
      chain above.
    trap: grammar
    why_wrong: '"Was prepended" breaks agreement and "continues for" is the wrong
      preposition, weakening otherwise correct content.'
  - text: I would probably say it uses the ancestors chain, although I have to admit
      I am not totally sure about where exactly prepended modules fit into that ordering
      if I am honest.
    trap: hedging
    why_wrong: Admitting the gap is fine, but leading with hedges buries the correct
      part of the answer.
  feedback:
    register: Precise and unhurried. Lookup order is a fact, so deliver it as one.
    hedging: If unsure about prepend, state what you know first and flag the gap last.
    precision: Name every link in the chain; "goes up the hierarchy" is not an answer
      at this level.
    grammar: Use "modules that were prepended" and "continues up the superclass chain".
    pragmatics: Mentioning method_missing shows you know where the chain terminates.
  rephrase:
    prompt: Give the same order but explain what changes when a module is prepended
      instead of included.
    goal: Test whether you can apply the chain rather than recite it.
  language_focus:
  - precision
  - grammar
  - hedging
  feynman:
    concept: Ancestors chain and method resolution order.
    explain_to: A developer who only knows single inheritance.
    constraint: Explain using a queue of people asked a question in turn.
    self_check: Can you say where prepend inserts itself relative to the class?
    reasoning_check: Can you identify the hidden premise behind Object model, give
      a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You gave class-then-superclass and stopped.
    expected: Singleton, prepended modules, class, included modules, upward.
    actual: A simplified hierarchy walk, or hedging before content.
    root_cause: Everyday Ruby rarely exercises prepend, so the full order was never
      rehearsed aloud.
    repair: Practise reciting the chain in one breath, then explain one consequence.
    reasoning_error: If your Object model answer failed, classify the mistake as a
      fact, assumption, comparison, failure, or certainty error before proposing the
      smallest repair.
  recall:
    active_recall_cue: What are the five stops in Ruby method lookup, in order?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Object model without presenting
      an assumption as a fact?
    black_box_probe: When the Object model answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: ruby-02-method-lookup-delayed-2
      prompt: >-
        A test places a singleton method beside a prepended module method and finds an order your
        explanation did not cover. What lookup claim would you defend, retract, and verify?
      changed_constraint: >-
        the explanation must account for singleton methods and prepend in the actual receiver order
      new_evidence: >-
        an ancestor trace includes both the singleton class and a prepended module before the
        inherited method
      best_answer: >-
        I would keep the rule that lookup follows the receiver ancestors, but I would retract any
        simplified class-first explanation. I would print the receiver ancestors and call the
        competing methods in a tiny test, then update the explanation from that trace.
      distractors:
      - text: I would preserve every part of the original Object model answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Object model explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/01-metodo-e-entrevistas/backend-interview-foundations/chapters/05-ruby-on-rails-interview-surface-area.md
    note: Object model questions expected in senior Ruby screens.
  - repo: original
    path: english-arcade/ruby/method-lookup
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: >-
      A singleton method, prepended module, and inherited method collide: print the receiver's ancestor chain and name the winner at each lookup stop?
    goal: >-
      Turn the ancestor-chain explanation into a trace of the actual singleton, prepend, include, and superclass collision.
  critical_thinking:
    problem_frame: >-
      The actor is the receiver object and its method lookup chain. The required outcome is an accurate winner for a method name; the constraint is Ruby's singleton-class, prepend, class, include, and superclass order; the unknown is which modules and singleton methods this receiver actually has.
    claim_map:
      fact: >-
        Ruby starts lookup at the receiver's singleton class, then follows prepended modules, the class, included modules, and superclass ancestors before method_missing.
      inference: >-
        Inspecting object.singleton_class.ancestors is the shortest way to explain a collision because it reveals the concrete chain rather than relying on a class-first shortcut.
      assumption: >-
        I am assuming the receiver is the object described by the question and that no method_missing implementation changes the final observable behavior.
      unknown: >-
        The prompt does not list the receiver's singleton methods, prepend order, included modules, or the competing implementation's source location.
    comparison:
      applicable: false
      rejected_alternative: >-
        A debate about whether prepend or include is generally better would answer a design question that the prompt does not ask; the contract is to trace the receiver that already exists.
      hard_constraint: >-
        The hard constraint is the runtime ancestor chain for this receiver, which determines the method before preference or style enters the discussion.
      decision_rule: >-
        I would print singleton_class.ancestors and trace the competing definitions; I would change the explanation only when that concrete order contradicts my remembered shortcut.
    failure_probe:
      kind: failure_mode
      prompt: >-
        Which receiver setup would expose a missing lookup stop, and how would you trace it?
    evidence_check:
      basis: >-
        Compare the method-lookup claim with the actual receiver's ancestors and a tiny trace that labels each candidate definition.
      source_kind: authored_scenario
      limitation: >-
        A toy trace verifies this receiver and method name only; it does not prove that another object's reopened classes have the same chain.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        The order rule is stable, but the question omits the receiver's exact modules and singleton methods, so the winning implementation remains conditional.
      update_trigger: >-
        I would update the answer when object.singleton_class.ancestors or the trace exposes a prepend, singleton, or method_missing case omitted from the explanation.
    rubric:
      facts_correct: >-
        Traces the singleton class, prepend, class, include, and superclass chain without claiming a class-first search.
      assumptions_explicit: >-
        Names the missing receiver details that could change which definition wins.
      alternatives_considered: >-
        Explains why a prepend-versus-include style debate is not a substitute for tracing the existing receiver.
      tradeoff_quality: >-
        Connects a concrete ancestor trace to debugging certainty and avoids speculative refactoring advice.
      follow_up_adaptation: >-
        Uses the singleton/prepend collision to refine the chain and verify the actual winner.
      certainty_calibration: >-
        Separates high confidence in the lookup rule from medium confidence about an underspecified receiver.


- id: ruby-03-enumerable-choice
  version: 1.4.0
  target: ruby
  topic: Enumerables
  difficulty: 2
  interview_stage: technical_screen
  prompt: Why did you reach for each_with_object rather than reduce there?
  context: You are reviewing a snippet that builds a hash from a collection. The interviewer
    is probing whether your idiom choices are deliberate or habitual.
  follow_up:
    prompt: What changes if the collection is lazy or the accumulator must be immutable,
      and which Enumerable method expresses that choice?
    goal: Answer the evidence challenge about Enumerables while keeping the evidence
      boundary explicit.
    challenge_kind: evidence
    best_answer: >-
      I would switch to a lazy chain when the collection is expensive to realize and the
      consumer can pull values on demand. If the accumulator must stay immutable, I would
      use reduce with a new value on each step and test both laziness and the final result
      instead of assuming each_with_object still fits.
    distractors:
    - text: I would cite my experience with Enumerables as enough proof and move on
        without naming an observation.
      why_wrong: Experience can guide a hypothesis, but it does not replace evidence
        tied to this context.
    - text: I would collect every possible metric about Enumerables before making
        even a provisional recommendation.
      why_wrong: A focused decision can start with one discriminating observation
        rather than an unbounded data request.
  compression:
    prompt: Rephrase the Enumerable choice as input shape, accumulator contract, and
      why the selected method communicates intent.
    goal: Compress the Enumerables answer into its decision, premise, trade-off, and
      verification step.
  best_answer: Because the accumulator is mutable and I do not want to depend on the
    block returning it. With reduce you have to remember to return the hash on every
    branch, and that is a classic source of nil bugs when someone adds a condition
    later.
  distractors:
  - text: Mostly because it reads better to me and it is the more idiomatic choice
      in Ruby, so it is what I would normally reach for in that kind of situation
      without thinking too hard.
    trap: precision
    why_wrong: Appeals to taste and habit, which is exactly the answer the question
      was designed to expose.
  - text: Because each_with_object is faster than reduce for building hashes, so in
      a hot path it would make a measurable difference to the overall performance
      of the method.
    trap: content
    why_wrong: Invents a performance claim; the real reason is block-return safety,
      not speed.
  - text: Because the accumulator is mutable and I do not want to depend of the block
      that returns it, since with reduce you need to remember of returning the hash
      in every branch.
    trap: grammar
    why_wrong: '"Depend of" and "remember of returning" are preposition and gerund
      errors from Portuguese.'
  feedback:
    register: Matter-of-fact. Justify with maintenance risk rather than aesthetics.
    hedging: No hedge needed; this is a defensible design preference with a reason.
    precision: 'Name the failure mode: a branch that forgets to return the accumulator.'
    grammar: '"Depend on", "remember to return"; both take fixed prepositions.'
    pragmatics: Anticipating the future edit ("when someone adds a condition") shows
      team-level thinking.
  rephrase:
    prompt: Answer again as a code review comment aimed at a mid-level engineer.
    goal: Shift register from spoken defence to written guidance.
  language_focus:
  - precision
  - grammar
  - register
  pt_help: '"Depender de" vira "depend on". Preposicao fixa, nao traduza direto.'
  feynman:
    concept: Accumulator safety in reduce versus each_with_object.
    explain_to: A developer who learned reduce in JavaScript.
    constraint: Explain using a shopping basket passed between people.
    self_check: Did you name the bug that appears after a later edit?
    reasoning_check: Can you identify the hidden premise behind Enumerables, give
      a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You justified the choice with readability or invented speed.
    expected: Block-return dependency and the nil bug it causes.
    actual: An appeal to idiom, or a false performance claim.
    root_cause: Idioms absorbed by imitation rather than by understanding the failure
      they prevent.
    repair: For each idiom you use, be able to state the bug it prevents.
    reasoning_error: If your Enumerables answer failed, classify the mistake as a
      fact, assumption, comparison, failure, or certainty error before proposing the
      smallest repair.
  recall:
    active_recall_cue: What must every branch of a reduce block remember to do?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Enumerables without presenting
      an assumption as a fact?
    black_box_probe: When the Enumerables answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: ruby-03-enumerable-choice-delayed-3
      prompt: >-
        A lazy collection must now feed an immutable accumulator, and a benchmark shows the original
        eager path is slower at the target size. Which Enumerable choice changes, and what would you
        verify?
      changed_constraint: >-
        the pipeline must stay lazy and preserve immutable accumulator semantics at the target size
      new_evidence: >-
        the benchmark shows the eager path is slower and the caller requires lazy consumption
      best_answer: >-
        I would keep the block-return safety reason for each_with_object, but I would switch the
        design when laziness and immutability are part of the contract. I would compare a lazy map
        or each_with_object path with an immutable reduce on the same input, then verify both
        deferred work and the final value.
      distractors:
      - text: I would preserve every part of the original Enumerables answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Enumerables explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: interview/story-bank/03-ruby-rails-senior-question-bank.md
    note: Senior Ruby question bank covering idiom justification.
  - repo: original
    path: english-arcade/ruby/enumerable-choice
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: >-
      The input is lazy and the accumulator is immutable: compare lazy traversal with each_with_object and reduce using deferred work, return contract, and allocation evidence?
    goal: >-
      Select an Enumerable form from the lazy consumer, accumulator mutability, and measured allocation path.
  critical_thinking:
    problem_frame: >-
      The actor is the collection pipeline and its accumulator. The required outcome is a correct hash with the intended evaluation behavior; the constraints are accumulator mutability, laziness, and input size; the unknown is whether the consumer needs deferred work or an immutable value at every step.
    claim_map:
      fact: >-
        each_with_object yields a stable accumulator without requiring the block to return it, while reduce uses each block result as the next accumulator.
      inference: >-
        each_with_object fits a mutable hash-building pass; reduce fits when each step deliberately returns a new immutable accumulator or a different reduction value.
      assumption: >-
        I am assuming the collection can be traversed once and that mutation of the local accumulator is acceptable to the caller.
      unknown: >-
        The prompt does not establish input size, laziness requirements, accumulator ownership, or whether a branch may accidentally return nil.
    comparison:
      applicable: true
      alternatives:
      - option: each_with_object hash build
        benefit: Builds the hash in one pass without requiring each branch to return the
          accumulator.
        cost_or_risk: Relies on a mutable local accumulator and does not by itself preserve
          laziness.
        valid_when: Use it for a finite or already-lazy source when a mutable hash is the
          clearest contract.
      - option: reduce with immutable accumulator
        benefit: Makes the value returned by every step the next accumulator, which fits
          immutable accumulation.
        cost_or_risk: Every branch must return the right value and an eager reduction can
          realize more work than the consumer needs.
        valid_when: Use it when each step intentionally returns a new value or the reduction
          is not a mutable hash build.
      decision_rule: I would use each_with_object for one mutable hash-building pass, reduce
        for deliberate immutable accumulation, and a lazy chain when realizing the collection
        itself violates the memory or timing budget.
    failure_probe:
      kind: edge_case
      prompt: >-
        Which lazy or conditional input would break this Enumerable choice, and what measurement would settle it?
    evidence_check:
      basis: >-
        Check the chosen block's return value, intermediate allocations, and deferred evaluation on the exact collection shape described by the prompt.
      source_kind: authored_scenario
      limitation: >-
        One benchmark cannot establish that an Enumerable idiom is best for all collection sizes or consumers.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        The accumulator semantics are clear, but the best form depends on laziness, mutability, and data size that the snippet does not provide.
      update_trigger: >-
        I would revise the choice if an allocation trace shows an intermediate array, a lazy consumer stops early, or a branch returns the wrong accumulator.
    rubric:
      facts_correct: >-
        Names the accumulator-return difference and does not call each_with_object and reduce equivalent.
      assumptions_explicit: >-
        States whether mutation and eager traversal fit the consumer.
      alternatives_considered: >-
        Compares each_with_object, reduce, and lazy traversal by the actual accumulator and evaluation contract.
      tradeoff_quality: >-
        Links fewer accidental nils or allocations to the cost of mutable state or extra passes.
      follow_up_adaptation: >-
        Switches when laziness or immutability becomes a requirement and proposes a matching verification.
      certainty_calibration: >-
        Treats Ruby semantics as firm and performance preference as evidence-dependent.


- id: ruby-04-memory-allocation
  version: 1.4.0
  target: ruby
  topic: Memory and performance
  difficulty: 3
  interview_stage: deep_dive
  prompt: This endpoint allocates heavily under load. How would you approach it?
  context: A production performance discussion. The interviewer wants a method, not
    a list of tricks, and is listening for whether you measure before you change anything.
  follow_up:
    prompt: Which allocation would you measure first in this endpoint, and what evidence
      would tell you a refactor actually reduced pressure?
    goal: Answer the alternative challenge about Memory and performance while keeping
      the evidence boundary explicit.
    challenge_kind: alternative
    best_answer: >-
      I would profile a representative request and start with the hottest allocation site,
      such as interpolation or an intermediate array. I would compare allocation counts,
      retained objects, and latency before and after the refactor, then keep it only if the
      measured pressure actually falls.
    distractors:
    - text: I would defend the first Memory and performance option because offering
        an alternative might make the decision look uncertain.
      why_wrong: A comparison makes the decision rule visible; it does not weaken
        a well-calibrated recommendation.
    - text: I would list every conceivable Memory and performance design without saying
        which requirement should decide between them.
      why_wrong: An option list without a decision rule avoids the trade-off the follow-up
        is testing.
  compression:
    prompt: Summarize the performance investigation as a measurement, a likely allocation
      boundary, and a regression guard.
    goal: Compress the Memory and performance answer into its decision, premise, trade-off,
      and verification step.
  best_answer: I would measure first, with allocation profiling on a representative
    request, and look at what is being allocated rather than guessing. Usually it
    is string interpolation in a loop or an intermediate array from a chain of maps,
    and both have cheap fixes once you can see them.
  distractors:
  - text: I would freeze all the string literals, avoid using map and select together,
      and replace the loops with more efficient methods to reduce the number of objects
      being created.
    trap: pragmatics
    why_wrong: Jumps to fixes without measuring, which is the exact anti-pattern a
      senior performance question screens for.
  - text: I would look into it and try a few things to see what helps, since performance
      work is quite unpredictable and it often depends on what the specific bottleneck
      turns out to be.
    trap: precision
    why_wrong: Names no tool, no signal and no hypothesis, so it conveys no method
      at all.
  - text: Frankly the real answer is that Ruby is slow and allocates too much, so
      beyond a point you are fighting the runtime and the honest fix is a different
      language for this endpoint.
    trap: register
    why_wrong: Blaming the runtime reads as defeatist and skips the work the question
      is actually asking for.
  feedback:
    register: Methodical and calm. Performance answers should sound like an investigation.
    hedging: Hedge the cause ("usually it is") but never the method.
    precision: Name the profiling approach and the two most common culprits.
    grammar: '"Allocation profiling on a representative request" is the natural collocation.'
    pragmatics: Measure-then-change is the expected ordering; inverting it costs the
      point.
  rephrase:
    prompt: Give the same approach as if reporting to a tech lead who wants a one-line
      plan.
    goal: Compress method into a single actionable sentence.
  language_focus:
  - pragmatics
  - precision
  - register
  feynman:
    concept: Measure-first discipline for allocation problems.
    explain_to: A developer who optimises by intuition.
    constraint: Explain using a doctor ordering tests before prescribing.
    self_check: Did you name what you would measure before what you would change?
    reasoning_check: Can you identify the hidden premise behind Memory and performance,
      give a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You listed optimisations before naming any measurement.
    expected: Profile a representative request, then fix what it shows.
    actual: A grab bag of tricks, vagueness, or blaming the runtime.
    root_cause: Performance knowledge stored as remedies rather than as a diagnostic
      loop.
    repair: Always open with the signal you would collect and where.
    reasoning_error: If your Memory and performance answer failed, classify the mistake
      as a fact, assumption, comparison, failure, or certainty error before proposing
      the smallest repair.
  recall:
    active_recall_cue: What are the two most common allocation culprits in a Ruby
      request path?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Memory and performance without
      presenting an assumption as a fact?
    black_box_probe: When the Memory and performance answer failed, did you locate
      the reasoning error before changing the implementation?
    delayed_variant:
      id: ruby-04-memory-allocation-delayed-4
      prompt: >-
        An allocation trace shows an intermediate array, rather than interpolation, dominates the
        endpoint, and the endpoint has a peak-memory limit. Which performance assumption is no
        longer safe?
      changed_constraint: >-
        the refactor must reduce peak memory while preserving the endpoint latency budget
      new_evidence: >-
        the trace identifies an intermediate array as the dominant allocation and shows the memory
        ceiling is binding
      best_answer: >-
        I would keep the measure-first method, but I would retract any focus on string interpolation
        if the trace points to an intermediate array. I would compare a fused iteration with the
        original chain, measure peak memory and latency, and keep the change only when it meets the
        stated ceiling.
      distractors:
      - text: I would preserve every part of the original Memory and performance answer
          because changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Memory and performance explanation with a
          new design without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/09-backend-principles/cards/scaling-performance.md
    note: Performance principles emphasising measurement before change.
  - repo: original
    path: english-arcade/ruby/memory-allocation
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: >-
      The trace points to an intermediate array instead of interpolation: identify the smallest refactor and the measurements that decide whether it stays?
    goal: >-
      Tie the performance refactor to the hottest allocation, retained-memory ceiling, and before/after profile.
  critical_thinking:
    problem_frame: >-
      The actor is the endpoint request path under load. The required outcome is lower allocation pressure without changing the response; the constraints are peak memory, latency, and representative traffic; the unknown is which allocation site dominates rather than which idiom looks expensive.
    claim_map:
      fact: >-
        The endpoint allocates heavily, but the prompt does not identify the responsible objects; an allocation profile can distinguish interpolation, intermediate arrays, retained objects, and unrelated work.
      inference: >-
        Measuring a representative request before refactoring is more reliable than replacing every map chain or string operation by intuition.
      assumption: >-
        I am assuming the trace can reproduce the load shape and that allocation reduction is the limiting objective rather than provider latency or database time.
      unknown: >-
        Peak retained objects, allocation count, request mix, and the acceptable latency/memory ceiling remain unknown until profiled.
    comparison:
      applicable: true
      alternatives:
      - option: allocation profile plus a targeted refactor
        benefit: Connects the change to the hottest allocation and can lower retained memory
          with a small reviewable diff.
        cost_or_risk: Requires a representative trace and may leave other costs untouched.
        valid_when: Use it when allocation pressure, rather than database or provider time,
          is the measured bottleneck.
      - option: broad representation rewrite
        benefit: Can remove a structural source of allocations when the profile shows the
          current representation is the root cause.
        cost_or_risk: Adds behavior and regression risk before the dominant allocation is
          proven.
        valid_when: Use it only when targeted changes miss the memory ceiling and a profile
          justifies the broader change.
      decision_rule: I would profile first, then keep the smallest change that improves
        allocation count and peak retention on representative requests without regressing
        p95 latency.
    failure_probe:
      kind: failure_mode
      prompt: >-
        What profile result would show the refactor did not reduce pressure, and which metric would you inspect?
    evidence_check:
      basis: >-
        Use an allocation profiler and representative request trace to identify the hottest site, then repeat the same measurement after one targeted change.
      source_kind: authored_scenario
      limitation: >-
        A sampled endpoint profile cannot prove behavior for traffic mixes or Ruby versions that were not measured.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        The measure-first method is strong, but the likely culprit and the benefit of a specific refactor are unknown until the profile is available.
      update_trigger: >-
        I would change direction when the trace identifies retained objects or a different allocation site, or when the refactor misses the memory ceiling.
    rubric:
      facts_correct: >-
        Distinguishes allocation count, retained objects, and latency instead of naming an unmeasured trick.
      assumptions_explicit: >-
        States the traffic and memory-budget assumptions behind the profile.
      alternatives_considered: >-
        Prefers a targeted allocation fix over a broad rewrite and explains when a representation change would win.
      tradeoff_quality: >-
        Connects lower allocations to code complexity and output/latency regression risk.
      follow_up_adaptation: >-
        Starts with the hottest measured allocation and updates the plan when the trace contradicts the expected culprit.
      certainty_calibration: >-
        Keeps the diagnostic method high-confidence while treating the fix as provisional.


- id: ruby-05-gvl-concurrency
  version: 1.4.0
  target: ruby
  topic: Concurrency
  difficulty: 3
  interview_stage: deep_dive
  prompt: Will adding threads make this job faster?
  context: The job spends most of its time waiting on HTTP calls to a payment provider.
    The interviewer is checking whether you can reason about the GVL without either
    overclaiming or dismissing threads entirely.
  follow_up:
    prompt: If the work is mostly waiting on an external service, how would you separate
      Ruby's GVL question from the I/O bottleneck?
    goal: Answer the failure challenge about Concurrency while keeping the evidence
      boundary explicit.
    challenge_kind: failure
    best_answer: >-
      I would separate the questions by tracing network wait time, Ruby CPU time, queue
      wait, and timeout or retry work. If the external service dominates, threads may hide
      that wait; if Ruby CPU dominates, the GVL is relevant. I would use those spans and a
      bounded concurrency test before attributing the bottleneck to the GVL.
    distractors:
    - text: I would describe the Concurrency failure as impossible because the happy
        path already passed its test.
      why_wrong: Passing a happy path does not test the boundary, failure mode, or
        recovery being challenged.
    - text: I would add retries to Concurrency immediately and assume the system would
        become reliable.
      why_wrong: Retries can amplify load or duplicate effects; the failure and containment
        policy must be specified first.
  compression:
    prompt: State the concurrency recommendation with the workload, the GVL limitation,
      and the metric you would compare.
    goal: Compress the Concurrency answer into its decision, premise, trade-off, and
      verification step.
  best_answer: For this job yes, because the time is spent waiting on IO and the global
    lock is released during those waits, so other threads can proceed. If the same
    job were CPU-bound I would need processes or Ractors instead, since bytecode execution
    cannot overlap.
  distractors:
  - text: No, because Ruby has a global interpreter lock, so threads never run in
      parallel and adding more of them cannot make anything faster in any situation
      you might encounter.
    trap: content
    why_wrong: Overgeneralises the GVL. It is released around IO, which is exactly
      the case in question.
  - text: It might help a bit, possibly, depending on various factors around how the
      job is structured and what it spends its time doing, so it is quite hard to
      say definitively.
    trap: hedging
    why_wrong: The deciding factor is knowable and simple; hedging here hides that
      you know it.
  - text: Yes because this job is passing the most part of the time waiting the HTTP
      calls, and during this wait the lock is liberated for the other threads can
      continue.
    trap: grammar
    why_wrong: '"Waiting the calls", "liberated" and "for the other threads can" are
      direct calques that obscure correct reasoning.'
  feedback:
    register: Decisive with a stated condition. This is a yes-with-because question.
    hedging: 'Replace hedges with the condition: IO-bound yes, CPU-bound no.'
    precision: Say the lock is released around IO, which is the load-bearing fact.
    grammar: '"Waiting on HTTP calls", "the lock is released", "so that other threads
      can".'
    pragmatics: Volunteering the CPU-bound contrast pre-empts the obvious follow-up.
  rephrase:
    prompt: Answer again for a job that hashes passwords instead of calling an API.
    goal: Force the contrast case to be reasoned, not recited.
  language_focus:
  - precision
  - grammar
  - hedging
  pt_help: '"Esperar algo" e "wait for something". "Liberado" tecnico e "released",
    nao "liberated".'
  feynman:
    concept: GVL release around IO versus CPU-bound execution.
    explain_to: A developer from a language with real thread parallelism.
    constraint: Explain using one shared kitchen and several waiters.
    self_check: Can you state the one property that decides the answer?
    reasoning_check: Can you identify the hidden premise behind Concurrency, give
      a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You dismissed threads outright or hedged without a condition.
    expected: IO-bound benefits, CPU-bound needs processes or Ractors.
    actual: A blanket GVL claim, or vagueness about the deciding factor.
    root_cause: The GVL learned as a slogan rather than as a rule with a boundary.
    repair: Answer every concurrency question by first classifying the workload.
    reasoning_error: If your Concurrency answer failed, classify the mistake as a
      fact, assumption, comparison, failure, or certainty error before proposing the
      smallest repair.
  recall:
    active_recall_cue: When is the global lock released, and what does that permit?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Concurrency without presenting
      an assumption as a fact?
    black_box_probe: When the Concurrency answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: ruby-05-gvl-concurrency-delayed-5
      prompt: >-
        A trace shows one caller waits on the provider while another performs CPU-heavy JSON work,
        and both share the same worker pool. What remains factual about the GVL and what must be
        measured?
      changed_constraint: >-
        the worker pool must handle mixed IO and CPU work without claiming one concurrency strategy
        fits both callers
      new_evidence: >-
        traces separate provider wait time from CPU-heavy JSON work in the same worker pool
      best_answer: >-
        I would keep the distinction between IO waits and Ruby CPU execution, but I would narrow any
        single speedup claim. I would measure queue wait, provider latency, CPU time, and throughput
        for threads and processes at the same concurrency, then route each workload from those
        results.
      distractors:
      - text: I would preserve every part of the original Concurrency answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Concurrency explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/09-backend-principles/cards/concurrency-parallelism.md
    note: Concurrency versus parallelism distinctions for backend work.
  - repo: original
    path: english-arcade/ruby/gvl-concurrency
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: >-
      The worker mixes provider wait with CPU-heavy JSON parsing: separate the spans and choose a bounded concurrency model from the measured bottleneck?
    goal: >-
      Separate provider wait, Ruby CPU, and retry work before choosing threads, processes, or another bounded model.
  critical_thinking:
    problem_frame: >-
      The actor is the worker pool calling a payment provider. The required outcome is higher useful throughput; the constraints are external wait, Ruby CPU time, provider limits, and retry/timeout behavior; the unknown is how much time is actually IO wait versus Ruby CPU.
    claim_map:
      fact: >-
        This job spends most of its time waiting on HTTP, and MRI's GVL does not prevent other threads from progressing while a thread waits on IO; CPU-bound Ruby bytecode remains serialized by the GVL.
      inference: >-
        Bounded threads may overlap provider waits, but a thread-count increase cannot create provider capacity or remove CPU-heavy JSON and retry work.
      assumption: >-
        I am assuming the provider permits the proposed concurrency and that the HTTP client releases the thread during blocking IO.
      unknown: >-
        Provider rate limits, CPU share, queue wait, timeout volume, and the useful concurrency ceiling are not established by the prompt.
    comparison:
      applicable: true
      alternatives:
      - option: bounded Ruby threads
        benefit: Overlap provider waits without requiring process coordination.
        cost_or_risk: They do not parallelize CPU-heavy Ruby and can hit provider or retry
          limits.
        valid_when: Use them when traces show external IO dominates and the provider accepts
          the concurrency.
      - option: processes or Ractors
        benefit: Can isolate or parallelize CPU-heavy work beyond the GVL.
        cost_or_risk: They add memory, serialization, and coordination cost and do not remove
          provider latency.
        valid_when: Use them when measured Ruby CPU dominates and the isolation cost fits
          the workload.
      decision_rule: I would use bounded threads when spans show provider wait dominates,
        and compare processes or Ractors only when CPU work dominates and the measured isolation
        cost is acceptable.
    failure_probe:
      kind: counterexample
      prompt: >-
        Which trace would show threads are saturating CPU or provider capacity, and how would you change the pool?
    evidence_check:
      basis: >-
        Use spans and a bounded concurrency benchmark that compares thread and process behavior on the same HTTP and parsing workload.
      source_kind: authored_scenario
      limitation: >-
        The exercise cannot establish a speedup without the installed Ruby runtime, HTTP client, provider limits, and representative payloads.
      checked_on: '2026-08-25'
    certainty:
      level: high
      rationale: >-
        The IO-versus-CPU GVL distinction is well established, but the magnitude of any speedup and safe pool size depend on measurements absent from the prompt.
      update_trigger: >-
        I would revise the concurrency recommendation if traces show CPU or provider saturation, or if a controlled benchmark fails to improve throughput.
    rubric:
      facts_correct: >-
        Separates IO overlap from CPU-bound Ruby execution under the GVL.
      assumptions_explicit: >-
        Names provider limits, client behavior, and workload composition as assumptions.
      alternatives_considered: >-
        Compares bounded threads with processes or Ractors for the measured IO/CPU split.
      tradeoff_quality: >-
        Includes provider saturation, memory, coordination, and retry costs rather than promising speedup.
      follow_up_adaptation: >-
        Uses tracing to decide whether the bottleneck is the GVL, provider, queue, or retry path.
      certainty_calibration: >-
        States the runtime fact confidently and keeps performance magnitude conditional.


- id: ruby-06-error-contracts
  version: 1.4.0
  target: ruby
  topic: Error handling
  difficulty: 2
  interview_stage: technical_screen
  prompt: When would you raise instead of returning a result object?
  context: A design conversation about a service class. The interviewer wants a clear
    boundary rule rather than a preference, and is listening for how you talk about
    caller expectations.
  follow_up:
    prompt: What makes an exception part of the caller's contract here, and when would
      a result object make recovery clearer?
    goal: Answer the new_evidence challenge about Error handling while keeping the
      evidence boundary explicit.
    challenge_kind: new_evidence
    best_answer: >-
      I would raise for a broken invariant or an unavailable dependency that makes this
      call unable to continue, and I would return a result object for an expected branch
      such as a declined payment. I would document the boundary, test both paths, and make
      the caller's recovery action visible in the contract.
    distractors:
    - text: I would keep the Error handling recommendation unchanged because changing
        position would look inconsistent.
      why_wrong: A defensible answer updates when relevant evidence changes an assumption
        or trade-off.
    - text: I would discard every earlier Error handling claim as soon as one new
        observation appeared.
      why_wrong: New evidence may narrow one claim while leaving other verified facts
        intact.
  compression:
    prompt: Compress the error policy into failure ownership, exception or value choice,
      and the boundary where context is added.
    goal: Compress the Error handling answer into its decision, premise, trade-off,
      and verification step.
  best_answer: I raise when the caller cannot reasonably continue and the condition
    is genuinely exceptional, such as a broken invariant. I return a result object
    when failure is an expected outcome the caller must branch on, like a declined
    payment, because that belongs in the type rather than in control flow.
  distractors:
  - text: I generally prefer result objects because exceptions are expensive and they
      make the control flow harder to follow, so I try to avoid raising wherever it
      is reasonably possible.
    trap: precision
    why_wrong: States a blanket preference and leans on a cost claim instead of the
      caller-expectation boundary the question asks for.
  - text: It depends on the team conventions really, since different codebases handle
      this differently and I would follow whatever pattern was already established
      in the project.
    trap: pragmatics
    why_wrong: Deferring to convention avoids the design judgement the question was
      asked to elicit.
  - text: I raise when the caller cannot continue and the situation is really exceptional,
      and I return a result when the failure is expected that the caller need to treat,
      like a payment refused.
    trap: grammar
    why_wrong: '"The caller need" drops agreement and "expected that the caller need
      to treat" garbles the relative clause.'
  feedback:
    register: Principled and concise. Boundary rules should sound settled.
    hedging: No hedging on your own rule; hedge only when applying it to an unknown
      codebase.
    precision: '"Expected outcome the caller must branch on" is the distinction that
      matters.'
    grammar: '"The caller has to handle", "a declined payment"; watch third-person
      agreement.'
    pragmatics: Giving a domain example makes an abstract rule verifiable.
  rephrase:
    prompt: State the same rule in one sentence, then give a counter-example where
      you would break it.
    goal: Test whether the rule is understood or memorised.
  language_focus:
  - precision
  - grammar
  - pragmatics
  feynman:
    concept: Exceptions for broken invariants, results for expected failures.
    explain_to: A developer who wraps everything in begin/rescue.
    constraint: Explain using a card payment being declined.
    self_check: Can you classify three failures using your own rule?
    reasoning_check: Can you identify the hidden premise behind Error handling, give
      a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You gave a preference or deferred to team convention.
    expected: A boundary based on whether the caller must branch on failure.
    actual: A bare preference for results, or deferral to team convention.
    root_cause: Error handling internalised as style rather than as an interface contract.
    repair: Rehearse the rule with one exceptional and one expected example.
    reasoning_error: If your Error handling answer failed, classify the mistake as
      a fact, assumption, comparison, failure, or certainty error before proposing
      the smallest repair.
  recall:
    active_recall_cue: What property decides between raising and returning a result?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Error handling without presenting
      an assumption as a fact?
    black_box_probe: When the Error handling answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: ruby-06-error-contracts-delayed-6
      prompt: >-
        A measured comparison shows exceptions are cheaper on the rare path, but the workload now
        has frequent expected declines and a tighter latency budget. Which error-contract conclusion
        would you narrow?
      changed_constraint: >-
        frequent expected declines must remain an explicit caller branch within the latency budget
      new_evidence: >-
        the comparison shows a different cost profile and the workload distribution contains
        frequent expected declines
      best_answer: >-
        I would keep the semantic boundary between exceptional failure and an expected decline, even
        if the measured costs differ. I would model declines as a result the caller can branch on,
        benchmark the actual frequency, and reserve exceptions for the broken-invariant path.
      distractors:
      - text: I would preserve every part of the original Error handling answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Error handling explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/09-backend-principles/cards/error-handling-fault-tolerance.md
    note: Error handling and fault tolerance boundaries.
  - repo: original
    path: english-arcade/ruby/error-contracts
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: >-
      Declines become frequent while a broken invariant remains rare: define the result/exception boundary and the caller test that protects it?
    goal: >-
      Defend the result-versus-exception boundary with caller recovery behavior for declines and broken invariants.
  critical_thinking:
    problem_frame: >-
      The actor is the service caller deciding whether to recover or propagate. The required outcome is a stable error contract; the constraint is whether the condition is an expected business branch or a broken invariant/dependency; the unknown is how callers currently branch and observe failures.
    claim_map:
      fact: >-
        A declined payment is an expected business result, while a broken invariant means this operation cannot safely continue; Ruby can represent those paths as a result object or an exception.
      inference: >-
        Returning expected declines makes caller branching visible, while raising an exceptional failure preserves a clear failure boundary when recovery is not local.
      assumption: >-
        I am assuming callers can handle a result object and that the service documents which exceptions are part of its contract.
      unknown: >-
        The existing callers, failure frequency, retry policy, and observability requirements are not shown.
    comparison:
      applicable: true
      alternatives:
      - option: result object for expected declines
        benefit: Makes a caller branch and recovery action explicit for normal business
          outcomes.
        cost_or_risk: Requires a stable result shape and can add branching at every caller.
        valid_when: Use it when the caller can act on the decline as part of normal flow.
      - option: exception for broken invariants or unavailable dependencies
        benefit: Stops a caller from consuming an unsafe result and routes an exceptional
          path to its boundary.
        cost_or_risk: Can obscure normal control flow if raised for frequent expected outcomes.
        valid_when: Use it when the operation cannot safely continue and the caller cannot
          recover locally.
      decision_rule: I would return expected, recoverable business outcomes and raise for
        broken invariants or an unavailable dependency that prevents this call; I would
        document and test both boundaries.
    failure_probe:
      kind: edge_case
      prompt: >-
        Which caller behavior would show the exception/result boundary is wrong, and what contract test would catch it?
    evidence_check:
      basis: >-
        Inspect caller branches, service documentation, and tests for decline and invariant failures; compare the contract with the actual recovery action.
      source_kind: authored_scenario
      limitation: >-
        Exception-versus-result cost is secondary here; this exercise does not reveal all callers or their compatibility constraints.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        The expected-versus-exceptional boundary is a useful default, but the service's existing callers and compatibility contract are omitted.
      update_trigger: >-
        I would revise the boundary when a caller treats a failure as a normal branch, or when an exception cannot carry a safe recovery signal.
    rubric:
      facts_correct: >-
        Distinguishes expected business declines from broken invariants and dependency failures.
      assumptions_explicit: >-
        Names the caller recovery and documentation assumptions.
      alternatives_considered: >-
        Explains when a result object or exception preserves the caller's contract and why blanket policies fail.
      tradeoff_quality: >-
        Connects visible branching and recovery to the cost of exceptional control flow or hidden invariant damage.
      follow_up_adaptation: >-
        Keeps the semantic boundary when benchmark evidence changes but expected declines become frequent.
      certainty_calibration: >-
        Treats the boundary as a reasoned default while seeking caller evidence before changing a public contract.


- id: ruby-07-metaprogramming-restraint
  version: 1.4.0
  target: ruby
  topic: Metaprogramming
  difficulty: 3
  interview_stage: architecture_review
  prompt: Would you use define_method here, or is that overkill?
  context: A code review of a class that generates a dozen near-identical predicate
    methods. The interviewer wants to know whether you can weigh cleverness against
    the cost of debugging it later.
  follow_up:
    prompt: Which readers would pay the maintenance cost of this metaprogramming,
      and can an explicit method preserve the same extension point?
    goal: Answer the assumption challenge about Metaprogramming while keeping the
      evidence boundary explicit.
    challenge_kind: assumption
    best_answer: >-
      I would compare the generated method names with the readers who must debug them.
      If the names come from a bounded constant list, I would keep define_method and test
      the generated surface; if callers need discoverability or custom behavior, I would
      write explicit methods and preserve the extension point.
    distractors:
    - text: I would repeat my original Metaprogramming answer with more confidence
        because the interviewer probably assumes the usual case.
      why_wrong: It hides the premise instead of checking whether the usual case is
        actually part of this problem.
    - text: I would stop proposing anything about Metaprogramming until every surrounding
        requirement had been documented in full.
      why_wrong: It treats uncertainty as a reason for paralysis and offers no bounded
        next step.
  compression:
    prompt: 'Defend or reject metaprogramming in three lines: benefit, hidden cost,
      and the simpler alternative.'
    goal: Compress the Metaprogramming answer into its decision, premise, trade-off,
      and verification step.
  best_answer: I would, but only because the generated names are derived from a constant
    list that lives right next to it. My rule is that generated methods must be greppable,
    so if a reader cannot find the name by searching, I write them out explicitly
    instead.
  distractors:
  - text: Yes, definitely. It removes the duplication and Ruby gives us these tools
      for exactly this kind of situation, so not using them would mean writing more
      code than necessary.
    trap: content
    why_wrong: Optimises for line count and ignores the discoverability cost that
      makes metaprogramming expensive to maintain.
  - text: No, I would avoid metaprogramming entirely. It always makes code harder
      to understand and debug, and explicit methods are better in every situation
      regardless of the context.
    trap: precision
    why_wrong: An absolute rule with no boundary, which is as unconsidered as the
      opposite absolute.
  - text: I would use it, but only if the names are coming from a constant list that
      stays near of the code, because the methods generated need to be possible to
      find with a search.
    trap: grammar
    why_wrong: '"Near of" and "possible to find" are calques; the idiomatic forms
      are "next to" and "greppable" or "findable".'
  feedback:
    register: 'Balanced senior judgement: yes with a named constraint.'
    hedging: Conditional approval is not hedging; it is the correct shape here.
    precision: '"Greppable" is the concrete criterion that turns taste into a rule.'
    grammar: '"Next to it", "derived from", "written out explicitly".'
    pragmatics: Framing it as a personal rule invites the interviewer to challenge
      the rule, which is a good conversation to have.
  rephrase:
    prompt: Give the same judgement as a review comment that a junior would not find
      discouraging.
    goal: Practise constructive register in code review.
  language_focus:
  - precision
  - grammar
  - register
  feynman:
    concept: Discoverability as the cost of generated methods.
    explain_to: A developer who loves clever abstractions.
    constraint: Explain using someone searching a building directory.
    self_check: Does your rule tell you what to do in both directions?
    reasoning_check: Can you identify the hidden premise behind Metaprogramming, give
      a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You answered with an absolute yes or an absolute no.
    expected: Conditional approval with a discoverability criterion.
    actual: An appeal to removing duplication, or a blanket ban on metaprogramming.
    root_cause: Judging technique by preference rather than by maintenance cost.
    repair: Attach every "it depends" to a criterion someone else could apply.
    reasoning_error: If your Metaprogramming answer failed, classify the mistake as
      a fact, assumption, comparison, failure, or certainty error before proposing
      the smallest repair.
  recall:
    active_recall_cue: What single property makes generated methods acceptable?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Metaprogramming without presenting
      an assumption as a fact?
    black_box_probe: When the Metaprogramming answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: ruby-07-metaprogramming-restraint-delayed-7
      prompt: >-
        A generated predicate misses an edge-case name in a test, and the code review now requires
        static discoverability. Which metaprogramming assumption is no longer safe?
      changed_constraint: >-
        generated methods must be statically discoverable and cover the tested name set without
        hidden behavior
      new_evidence: >-
        a boundary test misses a generated name and the review requires readers to find methods by
        search
      best_answer: >-
        I would keep generation only for a bounded, explicit list, but I would retract the claim
        that the current form is automatically greppable. I would add a test for every generated
        name and compare explicit methods if static discovery remains poor, then choose the simpler
        surface.
      distractors:
      - text: I would preserve every part of the original Metaprogramming answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Metaprogramming explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/12-engineering-practice/cards/architecture-decision-records.md
    note: Decision framing used for judgement calls in review.
  - repo: original
    path: english-arcade/ruby/metaprogramming-restraint
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: >-
      A generated predicate has a missed edge-case name and static discovery is required: compare bounded generation with explicit methods and state the switch condition?
    goal: >-
      Decide whether bounded generated predicates remain discoverable after an edge-case name and maintenance review.
  critical_thinking:
    problem_frame: >-
      The actor is the maintainer of a class with a bounded list of predicate names. The required outcome is a discoverable, correct method surface; the constraints are repetition, debugging, static navigation, and extension behavior; the unknown is whether the name list and generated behavior will remain bounded.
    claim_map:
      fact: >-
        define_method can generate similar methods, and the current names come from a constant list beside the generator; generated methods still need tests for their public surface.
      inference: >-
        A bounded, searchable list can justify generation, while open-ended names or custom per-method behavior make explicit methods easier to inspect and debug.
      assumption: >-
        I am assuming the constant list is the source of truth and that no caller depends on method definitions being statically visible to tooling.
      unknown: >-
        Future name growth, per-predicate exceptions, documentation tooling, and the cost of debugging a generated method are not established.
    comparison:
      applicable: true
      alternatives:
      - option: bounded define_method generation
        benefit: Removes repeated method bodies while a constant name list remains the source
          of truth.
        cost_or_risk: Can weaken static navigation and make unique edge behavior harder
          to debug.
        valid_when: Use it when every generated name is bounded, searchable, and covered
          by a surface test.
      - option: explicit predicate methods
        benefit: Makes each public name and exceptional behavior visible to readers and
          tooling.
        cost_or_risk: Duplicates some code and makes adding a uniform predicate more verbose.
        valid_when: Use it when names grow, methods diverge, or static discoverability is
          part of the maintenance contract.
      decision_rule: I would retain define_method only for a small constant list with generated-surface
        tests; I would write explicit methods when names, behavior, or tooling need independent
        discovery.
    failure_probe:
      kind: failure_mode
      prompt: >-
        Which generated name or tooling view would expose a discoverability failure, and what explicit form would you compare?
    evidence_check:
      basis: >-
        Review the constant list, generated method names, tests, and a failed predicate trace to see whether the code is discoverable at the maintenance boundary.
      source_kind: authored_scenario
      limitation: >-
        A bounded sample does not prove future names or tooling will preserve the same discoverability.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        The bounded-list rule is defensible, but the class's future extension and tooling requirements are missing.
      update_trigger: >-
        I would switch to explicit methods when a generated name is missed, a predicate needs unique behavior, or static tooling cannot show the API.
    rubric:
      facts_correct: >-
        Describes define_method as generated behavior and names bounded names and testing as constraints.
      assumptions_explicit: >-
        States who owns the name list and whether static discovery is required.
      alternatives_considered: >-
        Compares bounded generation with explicit methods on discoverability and per-method behavior.
      tradeoff_quality: >-
        Connects reduced duplication to debugging, tooling, and stack-trace costs.
      follow_up_adaptation: >-
        Revises the choice when a generated edge case or discoverability requirement appears.
      certainty_calibration: >-
        Keeps the rule conditional on the bounded source list and observed maintenance surface.


- id: ruby-08-frozen-strings
  version: 1.4.0
  target: ruby
  topic: Strings and mutation
  difficulty: 1
  interview_stage: technical_screen
  prompt: What does the frozen string literal comment actually buy you?
  context: A warm-up question. The interviewer is calibrating your level, and a precise
    short answer here earns a harder question next rather than more of the same.
  follow_up:
    prompt: If a library mutates the string in place, where would you make ownership
      explicit and what test would catch the assumption?
    goal: Answer the evidence challenge about Strings and mutation while keeping the
      evidence boundary explicit.
    challenge_kind: evidence
    best_answer: >-
      I would make ownership explicit at the boundary: duplicate a caller-owned mutable
      string when I need to retain it, or document and test that the library only reads a
      frozen value. I would add a mutation test that fails if the implementation silently
      changes the caller's object.
    distractors:
    - text: I would cite my experience with Strings and mutation as enough proof and
        move on without naming an observation.
      why_wrong: Experience can guide a hypothesis, but it does not replace evidence
        tied to this context.
    - text: I would collect every possible metric about Strings and mutation before
        making even a provisional recommendation.
      why_wrong: A focused decision can start with one discriminating observation
        rather than an unbounded data request.
  compression:
    prompt: Explain frozen strings as a mutation boundary, a failure signal, and a
      deliberate way to share constants.
    goal: Compress the Strings and mutation answer into its decision, premise, trade-off,
      and verification step.
  best_answer: >-
    I use frozen_string_literal to make string literals in that file immutable, so
    accidental mutation fails early. I would measure allocations before claiming a
    hot-path saving, because sharing or deduplication depends on the Ruby version and the
    exact literal path.
  distractors:
  - text: It makes the strings in the file immutable so that they cannot be changed
      by accident, which is generally safer and is considered a good practice in most
      modern Ruby codebases today.
    trap: precision
    why_wrong: Half the answer. It misses the allocation benefit, which is the reason
      it appears in performance-sensitive files.
  - text: It makes the whole program use less memory because every string in the application
      becomes shared, so you only ever have one copy of any given string value.
    trap: content
    why_wrong: 'Overstates the scope: the magic comment is per-file and applies to
      literals, not to every string.'
  - text: The literals of string in the file are becoming frozen, then the literals
      repeated are sharing the same object instead of allocate a new string each time.
    trap: grammar
    why_wrong: Progressive aspect and "instead of allocate" break the sentence; "instead
      of allocating" is required.
  feedback:
    register: Brief and precise. Warm-ups reward economy.
    hedging: None needed; this is a small factual question.
    precision: Mention both effects, sharing and mutation safety, and the file scope.
    grammar: 'After "instead of" use a gerund: "instead of allocating".'
    pragmatics: Answer fully but stop; padding a warm-up wastes the round.
  rephrase:
    prompt: Answer again in under fifteen words without losing either effect.
    goal: Practise compression on easy questions.
  language_focus:
  - precision
  - grammar
  - pragmatics
  pt_help: 'Depois de "instead of" sempre vem gerundio: "instead of allocating".'
  feynman:
    concept: Frozen string literals, object sharing and file scope.
    explain_to: A developer who has never profiled allocations.
    constraint: Explain using printed name badges reused at an event.
    self_check: Did you say what the scope of the comment is?
    reasoning_check: Can you identify the hidden premise behind Strings and mutation,
      give a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You gave only immutability, or overstated the scope.
    expected: Per-file literal freezing, object sharing, mutation safety.
    actual: A safety-only answer, or a program-wide claim.
    root_cause: The pragma copied from other files without reading what it does.
    repair: Pair every pragma you use with a one-line statement of its scope.
    reasoning_error: If your Strings and mutation answer failed, classify the mistake
      as a fact, assumption, comparison, failure, or certainty error before proposing
      the smallest repair.
  recall:
    active_recall_cue: What scope does the frozen string literal pragma apply to?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Strings and mutation without
      presenting an assumption as a fact?
    black_box_probe: When the Strings and mutation answer failed, did you locate the
      reasoning error before changing the implementation?
    delayed_variant:
      id: ruby-08-frozen-strings-delayed-8
      prompt: >-
        A library caller needs to mutate a string and an allocation trace does not show a meaningful
        saving from frozen literals. Which frozen-string assumption is no longer safe?
      changed_constraint: >-
        the boundary must preserve caller mutation semantics while any allocation claim is supported
        by measurement
      new_evidence: >-
        a caller mutation test conflicts with immutability and the allocation trace shows no
        material saving
      best_answer: >-
        I would keep the early mutation failure as the ownership signal, but I would retract an
        unconditional allocation benefit. I would duplicate or document ownership at the boundary,
        run the caller mutation test, and keep the magic comment only when its measured and semantic
        benefits fit the file.
      distractors:
      - text: I would preserve every part of the original Strings and mutation answer
          because changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Strings and mutation explanation with a new
          design without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/09-backend-principles/cards/scaling-performance.md
    note: Allocation-aware performance practices.
  - repo: original
    path: english-arcade/ruby/frozen-strings
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: >-
      A library needs a mutable string and profiling shows no allocation saving: where would you create its owned copy, and which safety benefit still justifies the pragma?
    goal: >-
      Place mutable ownership at the library boundary and keep allocation claims tied to the measured Ruby path.
  critical_thinking:
    problem_frame: >-
      The actor is the file and its callers sharing string objects. The required outcome is explicit ownership and safe mutation; the constraints are literal immutability, caller expectations, allocation, and Ruby version; the unknown is whether a downstream library mutates the value.
    claim_map:
      fact: >-
        frozen_string_literal makes string literals in the file immutable, so an in-place mutation fails rather than silently changing shared literal state; it does not prove every string is frozen or guarantee a performance saving.
      inference: >-
        The pragma is useful as an ownership signal, while a mutable library boundary may require an explicit dup or a documented read-only contract.
      assumption: >-
        I am assuming the file's literals are the values at risk and that the caller can accept either a duplicated mutable value or a failed mutation.
      unknown: >-
        The library's mutation behavior, Ruby version, allocation profile, and ownership of returned strings are not shown.
    comparison:
      applicable: true
      alternatives:
      - option: frozen literals with read-only ownership
        benefit: Fails accidental mutation early and avoids silently changing shared literal
          state.
        cost_or_risk: A mutating consumer must adapt or receive a separate mutable object.
        valid_when: Use it when callers read the value and the file-level ownership signal
          is useful.
      - option: explicit dup at a mutating boundary
        benefit: Gives the library a mutable object without exposing shared literal ownership.
        cost_or_risk: Allocates and can hide a still-unclear ownership contract if used
          everywhere.
        valid_when: Use it when a real downstream API mutates the value and the allocation
          fits the measured budget.
      decision_rule: I would keep the pragma for literal ownership and early failure, then
        use dup only at a boundary that requires mutation; I would claim allocation benefit
        only after profiling.
    failure_probe:
      kind: counterexample
      prompt: >-
        Which mutation test would expose a broken ownership contract, and which allocation measurement would change your use of dup or your performance claim without changing the pragma's semantics?
    evidence_check:
      basis: >-
        Check the file-level pragma, the library call, and a mutation test on the installed Ruby version; profile allocations separately from semantic behavior.
      source_kind: authored_scenario
      limitation: >-
        The pragma's semantic scope is clear, but this prompt does not provide the library implementation or a hot-path allocation trace.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        The ownership signal is clear, while the performance claim and boundary fix depend on the unseen library and workload.
      update_trigger: >-
        I would change the recommendation if the mutation test shows the library owns the value, or if profiling shows duplication violates the memory budget.
    rubric:
      facts_correct: >-
        States the file-literal scope and early mutation failure without promising deduplication.
      assumptions_explicit: >-
        Names the library mutation and object-ownership assumptions.
      alternatives_considered: >-
        Compares frozen read-only ownership with an explicit duplicate for mutable callers.
      tradeoff_quality: >-
        Connects early failure and safety to duplication cost and measured allocation.
      follow_up_adaptation: >-
        Moves the ownership decision to the boundary when a mutating library is introduced.
      certainty_calibration: >-
        Keeps semantics firm while making performance conditional on the measured path.


- id: ruby-09-testing-boundaries
  version: 1.4.0
  target: ruby
  topic: Testing
  difficulty: 2
  interview_stage: technical_screen
  prompt: How do you decide what to mock in a test?
  context: The interviewer has seen candidates who mock everything and candidates
    who mock nothing. They want to hear a boundary rule you could defend in a pull
    request.
  follow_up:
    prompt: What observable behavior would make a mock useful here, and which collaborator
      would you leave real to retain confidence?
    goal: Answer the alternative challenge about Testing while keeping the evidence
      boundary explicit.
    challenge_kind: alternative
    best_answer: >-
      I would mock third-party HTTP and clock or random sources that I do not own, while
      running the code inside my boundary for real. I would keep a collaborator real when
      its behavior is part of the confidence I need, and I would test the observable
      failure that justifies any mock.
    distractors:
    - text: I would defend the first Testing option because offering an alternative
        might make the decision look uncertain.
      why_wrong: A comparison makes the decision rule visible; it does not weaken
        a well-calibrated recommendation.
    - text: I would list every conceivable Testing design without saying which requirement
        should decide between them.
      why_wrong: An option list without a decision rule avoids the trade-off the follow-up
        is testing.
  compression:
    prompt: Describe the test boundary with the behavior under test, one isolated
      dependency, and the risk of over-mocking.
    goal: Compress the Testing answer into its decision, premise, trade-off, and verification
      step.
  best_answer: I mock at the edges I do not own, so third-party HTTP and clock or
    random sources, and let everything inside my boundary run for real. Mocking my
    own objects usually means the seam is wrong, not that I need another mock.
  distractors:
  - text: I try to mock as little as possible so the tests are realistic, although
      sometimes you have to mock things that are slow or awkward to set up in the
      test environment.
    trap: precision
    why_wrong: Describes a tendency, not a boundary. "Slow or awkward" is not a rule
      anyone else could apply.
  - text: I mock every dependency of the class under test, because a unit test should
      test one unit in complete isolation from everything else in the system around
      it.
    trap: content
    why_wrong: Produces tests that assert on their own mocks and break on every refactor
      while catching nothing.
  - text: I make mock of the edges that I do not own, like the HTTP of third party
      and the clock, and I let run for real everything that is inside of my boundary.
    trap: grammar
    why_wrong: '"Make mock of", "the HTTP of third party" and the inverted "I let
      run for real" are all non-idiomatic constructions.'
  feedback:
    register: Opinionated but reasoned, which is what a testing question rewards.
    hedging: None needed; state the rule and the smell that signals a bad seam.
    precision: '"Edges I do not own" is a rule; "as little as possible" is not.'
    grammar: '"I mock the edges", "third-party HTTP", "let everything inside run for
      real".'
    pragmatics: The design smell you added turns a testing answer into an architecture
      answer, which raises your level.
  rephrase:
    prompt: Explain the same rule to someone who insists on mocking every collaborator.
    goal: Practise persuading rather than stating.
  language_focus:
  - precision
  - grammar
  - register
  feynman:
    concept: Mocking boundaries and what over-mocking reveals about design.
    explain_to: A developer whose tests break on every refactor.
    constraint: Explain using a restaurant that fakes its suppliers.
    self_check: Does your rule tell you when the design is wrong, not just the test?
    reasoning_check: Can you identify the hidden premise behind Testing, give a counterexample,
      and explain how the evidence changes your conclusion?
  black_box:
    symptom: You described a tendency instead of a boundary.
    expected: Mock unowned edges; treat self-mocking as a design smell.
    actual: A vague "as little as possible", or total isolation of the unit.
    root_cause: Testing habits formed by tooling defaults rather than by ownership
      boundaries.
    repair: Ask "do I own this?" before every mock you write.
    reasoning_error: If your Testing answer failed, classify the mistake as a fact,
      assumption, comparison, failure, or certainty error before proposing the smallest
      repair.
  recall:
    active_recall_cue: What does needing to mock your own object usually indicate?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Testing without presenting
      an assumption as a fact?
    black_box_probe: When the Testing answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: ruby-09-testing-boundaries-delayed-9
      prompt: >-
        A test trace shows the mock hides a retry bug at the HTTP boundary, while a real
        collaborator makes the suite slow. Which testing claim survives and what seam would you
        change?
      changed_constraint: >-
        the test must expose retry behavior without depending on an unbounded external service or an
        unacceptably slow suite
      new_evidence: >-
        the trace shows the mock omitted a retry path and a real collaborator exceeds the suite time
        budget
      best_answer: >-
        I would keep the boundary rule, but I would narrow the claim that one mock is enough. I
        would use a deterministic fake or contract fixture that exercises timeout and retry
        responses, keep the application seam real, and measure suite time before choosing a narrower
        integration test.
      distractors:
      - text: I would preserve every part of the original Testing answer because changing
          it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Testing explanation with a new design without
          identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/09-backend-principles/cards/testing-code-quality.md
    note: Testing boundaries and code quality practices.
  - repo: original
    path: english-arcade/ruby/testing-boundaries
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: >-
      A mock hides an HTTP retry bug while a real collaborator slows the suite: choose a deterministic contract fixture and name the behavior it must expose?
    goal: >-
      Choose the narrow external fake and owned integration seam that exposes timeout and retry behavior.
  critical_thinking:
    problem_frame: >-
      The actor is the application boundary and its external collaborators. The required outcome is confidence in application behavior; the constraints are ownership, third-party variability, retry/clock nondeterminism, and suite time; the unknown is which collaborator behavior the test must prove.
    claim_map:
      fact: >-
        A mock can control a collaborator outside the application boundary, while mocking an object the application owns can hide the behavior the test should exercise.
      inference: >-
        Mocking third-party HTTP or time can make failure paths deterministic, but the application's request, retry, and state transitions should run through their real seam when those are the behavior under test.
      assumption: >-
        I am assuming the HTTP provider and clock are outside the team's contract and that a deterministic fake can represent their timeout and retry responses.
      unknown: >-
        The actual seam, contract coverage, suite budget, and retry bug hidden by the current mock are not visible in the prompt.
    comparison:
      applicable: true
      alternatives:
      - option: deterministic fake or mock for an unowned provider
        benefit: Controls timeouts and provider responses so the application failure path
          is repeatable.
        cost_or_risk: A broad mock can hide retry or request-shape bugs at the application
          seam.
        valid_when: Use it for third-party HTTP, clock, or random sources while keeping
          owned behavior real.
      - option: focused integration or contract fixture
        benefit: Exercises the application seam and catches retry/state behavior a mock
          may skip.
        cost_or_risk: Runs more slowly and needs a maintained provider contract.
        valid_when: Use it when the behavior under test includes request wiring, retries,
          or owned collaborator interaction.
      decision_rule: I would mock or fake the third-party HTTP and clock boundary, keep
        owned collaborators real, and add a contract or integration fixture for the retry
        behavior a mock could hide.
    failure_probe:
      kind: counterexample
      prompt: >-
        Which timeout or retry response would a broad mock hide, and what real seam would you exercise?
    evidence_check:
      basis: >-
        Compare the test's mocked calls with the observable behavior at the application boundary and run deterministic timeout/retry fixtures.
      source_kind: authored_scenario
      limitation: >-
        The exercise does not reveal every external contract or the suite's acceptable runtime.
      checked_on: '2026-08-25'
    certainty:
      level: high
      rationale: >-
        The ownership boundary is a reliable test-design principle, but the exact seam and hidden retry failure need inspection.
      update_trigger: >-
        I would change the seam when a contract fixture exposes behavior the mock concealed or when real collaborator execution becomes the relevant confidence target.
    rubric:
      facts_correct: >-
        Distinguishes external nondeterminism from owned behavior and names the retry bug a broad mock can hide.
      assumptions_explicit: >-
        States which collaborators are outside the contract and what the fake must model.
      alternatives_considered: >-
        Compares broad mocks, deterministic fakes, and a focused integration test at the actual boundary.
      tradeoff_quality: >-
        Balances suite speed and determinism against confidence in retry and state behavior.
      follow_up_adaptation: >-
        Changes the seam when the new trace shows the mock hides an application bug.
      certainty_calibration: >-
        Uses high confidence for the boundary rule while leaving the exact test seam evidence-dependent.


- id: ruby-10-legacy-refactor
  version: 1.4.0
  target: ruby
  topic: Working with legacy code
  difficulty: 3
  interview_stage: behavioural_probe
  prompt: Tell me about a time you had to change code you did not understand.
  context: A behavioural probe inside a technical loop. The interviewer wants a real
    sequence of actions, told in past tense, with the safety measures made explicit.
  follow_up:
    prompt: How would you create a small characterization test before changing the
      legacy branch, and what uncertainty would remain?
    goal: Answer the failure challenge about Working with legacy code while keeping
      the evidence boundary explicit.
    challenge_kind: failure
    best_answer: >-
      I would capture a real input and expected current output as a characterization test,
      then change one legacy branch at a time. I would keep the test suite as a safety net,
      but I would still record which behavior remains uncertain because a captured output
      preserves behavior without proving that the old rule was correct.
    distractors:
    - text: I would describe the Working with legacy code failure as impossible because
        the happy path already passed its test.
      why_wrong: Passing a happy path does not test the boundary, failure mode, or
        recovery being challenged.
    - text: I would add retries to Working with legacy code immediately and assume
        the system would become reliable.
      why_wrong: Retries can amplify load or duplicate effects; the failure and containment
        policy must be specified first.
  compression:
    prompt: Retell the legacy refactor as safety net, smallest change, and evidence
      that the old behavior still matters.
    goal: Compress the Working with legacy code answer into its decision, premise,
      trade-off, and verification step.
  best_answer: I inherited a billing calculation with no tests and a lot of branching.
    I pinned the current behaviour with characterisation tests over real inputs first,
    so I had a safety net, and only then extracted the branches. The tests caught
    two cases where I had misread the original intent.
  distractors:
  - text: I read through the code very carefully until I understood it, then I refactored
      it to be much cleaner and easier to follow, and after that the team found it
      far simpler to work with.
    trap: precision
    why_wrong: No safety mechanism named. Reading carefully is not a strategy for
      changing untested code.
  - text: I would start by writing characterisation tests to pin the existing behaviour,
      and then I would refactor incrementally while keeping those tests green throughout
      the process.
    trap: grammar
    why_wrong: Answers a behavioural question in the conditional; the interviewer
      asked what you did, so it must be past tense.
  - text: Honestly the code was terrible and whoever wrote it clearly had no idea
      what they were doing, so I rewrote the whole thing properly from scratch and
      it was much better afterwards.
    trap: register
    why_wrong: Criticising absent colleagues is a serious red flag, and a full rewrite
      signals poor risk judgement.
  feedback:
    register: Neutral about predecessors. Describe the code, never the person.
    hedging: No hedging in a past-tense story; you either did it or you did not.
    precision: Name the technique, characterisation tests, and what it caught.
    grammar: 'Behavioural answers stay in past simple: "I pinned", "I extracted".'
    pragmatics: Ending with what the tests caught proves the method worked rather
      than merely sounding good.
  rephrase:
    prompt: Tell the same story in three sentences, keeping the outcome measurable.
    goal: Practise STAR compression without losing evidence.
  language_focus:
  - grammar
  - register
  - precision
  pt_help: Pergunta com "tell me about a time" exige passado simples. Condicional
    soa como resposta hipotetica e perde ponto.
  feynman:
    concept: Characterisation tests as a safety net for legacy change.
    explain_to: A developer about to refactor untested code.
    constraint: Explain using scaffolding on a building.
    self_check: Did your story include evidence the safety net worked?
    reasoning_check: Can you identify the hidden premise behind Working with legacy
      code, give a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You answered hypothetically, or blamed the previous author.
    expected: Past-tense sequence with a named safety technique and a result.
    actual: Conditional phrasing, vague care, or criticism of colleagues.
    root_cause: Behavioural questions rehearsed as opinions rather than as stories.
    repair: Keep three past-tense stories ready, each ending in a measurable outcome.
    reasoning_error: If your Working with legacy code answer failed, classify the
      mistake as a fact, assumption, comparison, failure, or certainty error before
      proposing the smallest repair.
  recall:
    active_recall_cue: What do you write before changing untested legacy behaviour?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Working with legacy code
      without presenting an assumption as a fact?
    black_box_probe: When the Working with legacy code answer failed, did you locate
      the reasoning error before changing the implementation?
    delayed_variant:
      id: ruby-10-legacy-refactor-delayed-10
      prompt: >-
        A characterization test captures one billing path, but a second caller depends on an
        undocumented branch and the legacy behavior conflicts with the new requirement. What would
        you defend, retract, and verify?
      changed_constraint: >-
        the refactor must protect both callers while making the changed billing requirement explicit
      new_evidence: >-
        a second caller exposes an undocumented branch and the new requirement conflicts with
        captured legacy behavior
      best_answer: >-
        I would keep the characterization test as evidence of current behavior, but I would retract
        the idea that preserving it alone proves correctness. I would add the second caller and the
        new requirement to the contract tests, ask which behavior is authoritative, and refactor
        only after that decision is recorded.
      distractors:
      - text: I would preserve every part of the original Working with legacy code
          answer because changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Working with legacy code explanation with
          a new design without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: interview/story-bank/01-ruby-rails-backend-story-bank.md
    note: Backend story bank used for past-tense narrative shape.
  - repo: original
    path: english-arcade/ruby/legacy-refactor
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: >-
      A second caller conflicts with the first characterization output and a new billing rule: identify the authoritative contract before extracting a branch?
    goal: >-
      Resolve the second caller and new billing requirement before changing the characterization-protected branch.
  critical_thinking:
    problem_frame: >-
      I would name the real caller, branch, and contract owner from my own legacy-change example. Billing is the authored example here, not a verified fact about my experience. The goal is to preserve intended behavior while separating contractual requirements from accidental output.
    claim_map:
      fact: >-
        A characterization test records current output for a real input, but it does not establish that the old billing rule is correct.
      inference: >-
        Capturing current behavior before extracting branches gives a regression signal, while a conflicting new requirement requires an explicit decision about which contract is authoritative.
      assumption: >-
        I am assuming the captured input represents a caller that must remain compatible and that its expected output can be reviewed by the behavior owner.
      unknown: >-
        The second caller's undocumented branch, edge-case inputs, and approved interpretation of the new requirement are not established.
    comparison:
      applicable: true
      alternatives:
      - option: characterization tests before extraction
        benefit: Preserves observed caller behavior while making branch changes reviewable.
        cost_or_risk: Captures accidental behavior and does not decide whether the old billing
          rule is correct.
        valid_when: Use it when callers are unknown and current behavior must be protected
          before refactoring.
      - option: rewrite directly from the new requirement
        benefit: Can remove legacy complexity quickly when the new contract is authoritative
          and callers are known.
        cost_or_risk: Can break an undocumented caller and erase evidence needed to resolve
          conflicts.
        valid_when: Use it only after the behavior owner resolves which contract supersedes
          the old result.
      decision_rule: I would capture representative behavior, add the second caller and
        new requirement as contract cases, then refactor one branch at a time after the
        conflict is resolved.
    failure_probe:
      kind: edge_case
      prompt: >-
        Which second caller or requirement would invalidate a characterization-only refactor, and how would you resolve it?
    evidence_check:
      basis: >-
        Use characterization tests for current outputs and reviewed contract tests for the new rule, with the second caller included before changing branches.
      source_kind: authored_scenario
      limitation: >-
        A captured result cannot prove business correctness or cover callers that were not found.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        The safety sequence is sound, but the authority between legacy behavior and the new requirement is absent.
      update_trigger: >-
        I would revise the implementation when the behavior owner resolves the conflict or a boundary case exposes another caller dependency.
    rubric:
      facts_correct: >-
        Separates current behavior evidence from correctness of the old billing rule.
      assumptions_explicit: >-
        Names the caller and requirement ownership questions before refactoring.
      alternatives_considered: >-
        Compares characterization-first extraction with a rewrite and explains each regression risk.
      tradeoff_quality: >-
        Balances compatibility against preserving a potentially wrong legacy result.
      follow_up_adaptation: >-
        Adds the second caller and new requirement rather than blindly preserving or replacing the first test.
      certainty_calibration: >-
        Treats the sequence as reliable while keeping the business contract unresolved.


- id: ruby-11-symbol-vs-string
  version: 1.4.0
  target: ruby
  topic: Symbols and memory
  difficulty: 1
  interview_stage: recruiter_screen
  prompt: Why do Ruby developers use symbols for hash keys?
  context: An early screen with a technically literate recruiter. The answer needs
    to be correct but jargon-light, because your audience will relay it to an engineer
    later.
  follow_up:
    prompt: If the key comes from untrusted input or is frequently generated, which
      memory or comparison detail would influence your choice?
    goal: Answer the new_evidence challenge about Symbols and memory while keeping
      the evidence boundary explicit.
    challenge_kind: new_evidence
    best_answer: >-
      I would keep untrusted or frequently generated keys as strings until I know the
      cardinality and memory budget. I would compare symbol and string lookup cost under
      that distribution, then check retained-key counts rather than assuming symbol reuse
      is free.
    distractors:
    - text: I would keep the Symbols and memory recommendation unchanged because changing
        position would look inconsistent.
      why_wrong: A defensible answer updates when relevant evidence changes an assumption
        or trade-off.
    - text: I would discard every earlier Symbols and memory claim as soon as one
        new observation appeared.
      why_wrong: New evidence may narrow one claim while leaving other verified facts
        intact.
  compression:
    prompt: Compare symbols and strings by allocation, mutability, and suitability
      for external input.
    goal: Compress the Symbols and memory answer into its decision, premise, trade-off,
      and verification step.
  best_answer: >-
    I choose symbols for bounded internal identifiers whose names I control, such as a
    fixed configuration key set. For untrusted or high-cardinality input I keep strings
    unless I have measured a reason to do otherwise, because I do not want key growth to
    become an unbounded memory assumption.
  distractors:
  - text: Because symbols are faster than strings in Ruby, so using them for keys
      makes the code perform better overall, which matters quite a lot in a large
      application.
    trap: precision
    why_wrong: '"Faster" without a mechanism is unverifiable, and speed is a consequence
      of reuse rather than the reason itself.'
  - text: Symbols are interned in the symbol table so they are not garbage collected
      in the same way, which historically created a denial of service vector via unbounded
      symbol creation from user input.
    trap: register
    why_wrong: Accurate but pitched far above the audience; a recruiter cannot relay
      this usefully.
  - text: Because the symbols are reutilised instead of created again, then the same
      key is not allocating a new object each time that it appears in the code.
    trap: grammar
    why_wrong: '"Reutilised" is not idiomatic and "each time that it appears" adds
      a redundant relative pronoun.'
  feedback:
    register: Match the listener. Plain, correct, and free of internals.
    hedging: None needed for a simple factual answer.
    precision: Reuse is the mechanism; name it before any performance claim.
    grammar: '"Reused", not "reutilised"; "every time it appears", no "that".'
    pragmatics: Giving a concrete use case helps a non-engineer repeat your answer
      accurately.
  rephrase:
    prompt: Give the same answer to a staff engineer instead, adding the detail you
      left out.
    goal: Practise scaling register up as well as down.
  language_focus:
  - register
  - precision
  - grammar
  feynman:
    concept: Symbol reuse versus string allocation for fixed identifiers.
    explain_to: A recruiter with no Ruby background.
    constraint: No mention of garbage collection or interning.
    self_check: Could your listener repeat this to an engineer without errors?
    reasoning_check: Can you identify the hidden premise behind Symbols and memory,
      give a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You said "faster" or dived into the symbol table.
    expected: Reuse of one object, with a fixed-identifier use case.
    actual: An unexplained performance claim, or internals dumped on a recruiter.
    root_cause: Not adjusting depth to the listener, which is a pragmatics failure
      rather than a knowledge gap.
    repair: Decide the listener's level before the first sentence, every time.
    reasoning_error: If your Symbols and memory answer failed, classify the mistake
      as a fact, assumption, comparison, failure, or certainty error before proposing
      the smallest repair.
  recall:
    active_recall_cue: What property of symbols makes them cheap as fixed keys?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Symbols and memory without
      presenting an assumption as a fact?
    black_box_probe: When the Symbols and memory answer failed, did you locate the
      reasoning error before changing the implementation?
    delayed_variant:
      id: ruby-11-symbol-vs-string-delayed-11
      prompt: >-
        A retained-key profile shows untrusted symbols accumulating, while a benchmark shows strings
        are slower for a bounded internal key set. Which symbol assumption is no longer safe?
      changed_constraint: >-
        internal keys may use the faster representation, but untrusted key cardinality must remain
        bounded
      new_evidence: >-
        the profile shows retained untrusted symbols growing and the benchmark separates the bounded
        internal case
      best_answer: >-
        I would keep symbols for the bounded internal key set, but I would retract any
        recommendation that applies them to untrusted high-cardinality input. I would switch
        external keys to strings, cap or reject unexpected names, and verify retained-key counts
        after the change.
      distractors:
      - text: I would preserve every part of the original Symbols and memory answer
          because changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Symbols and memory explanation with a new
          design without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/01-metodo-e-entrevistas/backend-interview-foundations/chapters/05-ruby-on-rails-interview-surface-area.md
    note: Screening-level Ruby questions and expected depth.
  - repo: original
    path: english-arcade/ruby/symbol-vs-string
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: >-
      Retained-key profiling shows untrusted symbols accumulating: switch only the external boundary, preserve bounded internal keys, and state the memory check?
    goal: >-
      Keep bounded internal symbols separate from untrusted high-cardinality strings using retained-key evidence.
  critical_thinking:
    problem_frame: >-
      The actor is the hash-key boundary receiving either controlled identifiers or untrusted input. The required outcome is bounded memory with correct lookup; the constraints are key cardinality, ownership, and lookup workload; the unknown is whether names are fixed or attacker/user generated.
    claim_map:
      fact: >-
        Symbols are useful for a bounded set of internal identifiers, while untrusted high-cardinality keys can make retained key growth an unsafe assumption; strings preserve the external data as data.
      inference: >-
        The key's source and cardinality matter more than a blanket symbol-versus-string speed slogan.
      assumption: >-
        I am assuming the configuration key set is finite and controlled, while request-derived names may be arbitrary.
      unknown: >-
        The actual cardinality, Ruby version, retained-key profile, and memory ceiling are not supplied.
    comparison:
      applicable: true
      alternatives:
      - option: symbols for a bounded internal vocabulary
        benefit: Keeps controlled configuration identifiers clear and stable.
        cost_or_risk: Becomes unsafe if names are accepted from an unbounded external source.
        valid_when: Use it when ownership and cardinality are finite and documented.
      - option: strings for untrusted or high-cardinality keys
        benefit: Preserves external data without turning every unique name into retained
          symbol state.
        cost_or_risk: May have different lookup/allocation behavior and needs its own memory
          measurement.
        valid_when: Use it at request or user input boundaries until cardinality and memory
          evidence support another choice.
      decision_rule: I would use symbols for a bounded internal vocabulary and strings for
        untrusted or high-cardinality input, then measure lookup and retained-key counts
        before changing that boundary.
    failure_probe:
      kind: counterexample
      prompt: >-
        Which retained-key profile would show symbols are unsafe, and what boundary would you change?
    evidence_check:
      basis: >-
        Check key provenance and cardinality, then use a retained-key profile and lookup benchmark on both the internal and external distributions.
      source_kind: authored_scenario
      limitation: >-
        A small benchmark cannot predict memory growth for an unbounded input stream or another Ruby implementation.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        The provenance rule is a safe default, but measured cardinality and the runtime determine whether performance changes justify another representation.
      update_trigger: >-
        I would revise the choice when retained-key counts exceed the budget or when a bounded internal benchmark shows a meaningful, safe win.
    rubric:
      facts_correct: >-
        Connects symbols to bounded internal identifiers and strings to untrusted/high-cardinality data without claiming universal speed.
      assumptions_explicit: >-
        Names key source, cardinality, and memory-budget assumptions.
      alternatives_considered: >-
        Compares symbol and string representations on the actual internal and external distributions.
      tradeoff_quality: >-
        Weighs lookup convenience against retained-memory growth and identity preservation.
      follow_up_adaptation: >-
        Keeps symbols for bounded keys while changing the untrusted boundary when the profile shows accumulation.
      certainty_calibration: >-
        Treats provenance as a strong default and performance as measured evidence.


- id: ruby-12-admitting-a-gap
  version: 1.4.0
  target: ruby
  topic: Handling unknowns
  difficulty: 2
  interview_stage: deep_dive
  prompt: How does Ractor isolation actually work at the object level?
  context: You have read about Ractors but never shipped one. The interviewer is probing
    the edge of your knowledge, and how you handle the edge matters more than the
    gap itself.
  follow_up:
    prompt: What would you say if you could not verify Ractor's current isolation
      rule during the interview, and how would you investigate it afterward?
    goal: Answer the assumption challenge about Handling unknowns while keeping the
      evidence boundary explicit.
    challenge_kind: assumption
    best_answer: >-
      I would say that I can verify the current Ractor isolation rule rather than guess.
      I would check the installed Ruby documentation or a tiny experiment for shareable
      and unshareable objects, record the version, and state the uncertainty in the
      interview before claiming more.
    distractors:
    - text: I would repeat my original Handling unknowns answer with more confidence
        because the interviewer probably assumes the usual case.
      why_wrong: It hides the premise instead of checking whether the usual case is
        actually part of this problem.
    - text: I would stop proposing anything about Handling unknowns until every surrounding
        requirement had been documented in full.
      why_wrong: It treats uncertainty as a reason for paralysis and offers no bounded
        next step.
  compression:
    prompt: 'Give an honest gap response: state what you know, name the uncertain
      detail, and propose a verification step.'
    goal: Compress the Handling unknowns answer into its decision, premise, trade-off,
      and verification step.
  best_answer: >-
    I know the boundary rather than every internal detail: objects crossing a Ractor
    boundary must satisfy Ruby's shareability rules or be transferred, which prevents
    ordinary shared mutable state. I have not shipped one in production, so I would check
    the installed version before claiming deeper mechanics.
  distractors:
  - text: Ractors use a message-passing model similar to actors, where each one has
      isolated memory and objects are deeply frozen automatically when they are sent
      between them.
    trap: content
    why_wrong: Confidently states mechanics that are not accurate, which is far worse
      than admitting the boundary.
  - text: I am afraid I do not really know, sorry. I have not used Ractors at all
      and I would not be able to tell you anything useful about how they work internally.
    trap: pragmatics
    why_wrong: Discards the partial knowledge you do have, which the interviewer would
      have credited.
  - text: I know more the shape than the internals, the objects need to be shareable
      or copied when they are crossing the boundary of a Ractor, and this is what
      avoid the shared mutable state.
    trap: grammar
    why_wrong: '"This is what avoid" drops agreement and the progressive "are crossing"
      misstates a general rule.'
  feedback:
    register: Calm and honest. Naming the limit of your experience reads as senior,
      not weak.
    hedging: 'This is where hedging is correct: hedge the internals, assert the shape.'
    precision: Give the part you are sure of in full before drawing the line.
    grammar: '"This is what prevents", "when they cross"; simple present for rules.'
    pragmatics: Offering what you know first turns a gap into a partial credit answer.
  rephrase:
    prompt: Say the same thing while offering how you would find the answer after
      the call.
    goal: Practise converting a gap into initiative.
  language_focus:
  - hedging
  - grammar
  - pragmatics
  pt_help: Admitir limite em ingles nao precisa de "sorry". Diga o que sabe, depois
    marque a fronteira.
  feynman:
    concept: Ractor boundaries requiring shareable or copied objects.
    explain_to: A developer worried about thread safety in Ruby.
    constraint: Explain using sealed containers passed between rooms.
    self_check: Did you assert what you know before naming what you do not?
    reasoning_check: Can you identify the hidden premise behind Handling unknowns,
      give a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You bluffed the internals, or gave up the whole question.
    expected: Assert the shape, mark the limit, offer no invented mechanics.
    actual: Confident inaccuracy, or a blanket "I do not know".
    root_cause: Fear that partial knowledge sounds worse than either extreme.
