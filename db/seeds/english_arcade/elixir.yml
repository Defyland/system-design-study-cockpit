  extension:
    prompt: 'Five more minutes on Mentoring and public-boundary testing: which boundary,
      alternative, and update trigger would you explain for Mentoring and public-boundary
      testing?'
    goal: Move from the short Mentoring and public-boundary testing answer to a deep,
      evidence-led defence without inventing an outcome.
  critical_thinking:
    problem_frame: 'Frame Mentoring and public-boundary testing before proposing a
      solution: state the actor, required outcome, constraint, and unknown that could
      invalidate the first recommendation.'
    claim_map:
      fact: The prompt explicitly tests Mentoring and public-boundary testing within
        a Elixir context; treat that named boundary as the verified starting fact.
      inference: The reasonable inference is that the answer must defend Mentoring
        and public-boundary testing, but that does not prove one implementation wins
        under every workload or audience.
      assumption: An unstated assumption is that the Mentoring and public-boundary
        testing constraint is the dominant one; label it and ask whether the interviewer
        confirms it.
      unknown: 'Still unknown for Mentoring and public-boundary testing: the scale,
        failure tolerance, ownership boundary, and evidence threshold that would change
        the decision.'
    comparison:
      applicable: true
      alternatives:
      - option: an OTP process or supervision boundary for Mentoring and public-boundary
          testing
        benefit: It keeps the Mentoring and public-boundary testing reasoning close
          to the stated Elixir constraint and makes the evidence boundary visible.
        cost_or_risk: It can be too narrow if the Mentoring and public-boundary testing
          workload or requirement changes beyond the prompt.
        valid_when: Use it when the stated Mentoring and public-boundary testing contract
          and its invariant are the facts that matter most.
      - option: shared coordination or a larger recovery mechanism for Mentoring and
          public-boundary testing
        benefit: It can make the Mentoring and public-boundary testing boundary more
          explicit when the first option's hidden assumption is not guaranteed.
        cost_or_risk: It adds implementation or communication cost and may solve a
          problem the Mentoring and public-boundary testing evidence has not established.
        valid_when: Use it when a measured constraint, requirement, or failure mode
          makes the first option unsafe.
      decision_rule: Choose the first Mentoring and public-boundary testing option
        when its stated contract holds; choose the alternative only when evidence
        shows that the relevant Elixir constraint makes the first assumption unsafe.
    failure_probe:
      kind: failure_mode
      prompt: 'Mentoring and public-boundary testing: when the Mentoring and public-boundary
        testing constraint tightens during rollout, what breaks first in Mentoring
        and public-boundary testing, and how do you observe it?'
    evidence_check:
      basis: Check the Mentoring and public-boundary testing claim against system-design-estudos/areas/10-engineering-case-studies/cards/platform-engineering-developer-experience.md
        and the exact interview context; record whether each part is fact, inference,
        or hypothesis.
      source_kind: authored_scenario
      limitation: This Elixir exercise can test reasoning about Mentoring and public-boundary
        testing, but it cannot prove an unmeasured production outcome, personal ownership,
        or universal rule.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: Certainty is medium because the prompt bounds the Mentoring and public-boundary
        testing question but does not reveal every workload, stakeholder priority,
        or outcome.
      update_trigger: For case "How do you help an object-oriented developer", update
        Mentoring and public-boundary testing when Mentoring and public-boundary testing
        evidence—a Mentoring and public-boundary testing trace or Mentoring and public-boundary
        testing test—contradicts the Mentoring and public-boundary testing constraint
        in case "How do you help an object-oriented developer"; ask a stakeholder
        about Mentoring and public-boundary testing before revising.
    rubric:
      facts_correct: Names the verified Mentoring and public-boundary testing facts
        without smuggling in a result, scale, or capability that the prompt does not
        establish.
      assumptions_explicit: Labels the Mentoring and public-boundary testing premise
        that is still assumed and asks the smallest clarifying question that matters.
      alternatives_considered: Compares two credible Mentoring and public-boundary
        testing options, or explains the hard constraint that makes comparison a false
        equivalence.
      tradeoff_quality: Connects the Mentoring and public-boundary testing choice
        to a benefit, a cost or risk, and the condition under which another choice
        wins.
      follow_up_adaptation: Responds to the alternative challenge about Mentoring
        and public-boundary testing by changing the claim or evidence boundary rather
        than repeating the base answer.
      certainty_calibration: Uses medium certainty deliberately and names the evidence
        that would update the Mentoring and public-boundary testing recommendation.
