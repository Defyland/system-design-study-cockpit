---
contract_version: "1.1.0"
target:
  key: elixir
  label: Elixir
  blurb: >-
    Explain processes, supervision and back-pressure the way a BEAM engineer
    does, with isolation and failure treated as design tools.
  focus_areas:
    - processes and message passing
    - OTP and supervision
    - immutability and state
    - back-pressure and flow control
    - fault tolerance in production
  simulation:
    minutes: 45
    structure:
      - label: Processes and mental model warm-up
        minutes: 8
      - label: OTP and supervision deep dive
        minutes: 15
      - label: Back-pressure and bottlenecks
        minutes: 12
      - label: Failure, observability and trade-offs
        minutes: 10
cards:
  - id: elixir-card-let-it-crash
    front: How do you explain "let it crash" without sounding reckless?
    back: >-
      Crash on the unexpected, supervise the recovery. It replaces defensive
      code with a known-good restart from a known state.
    box: 1
    source:
      repo: system-design-estudos
      path: areas/09-backend-principles/cards/error-handling-fault-tolerance.md
      note: Fault tolerance principles behind supervised restarts.
  - id: elixir-card-genserver-bottleneck
    front: When is a GenServer the wrong choice?
    back: >-
      When it becomes a single mailbox in front of concurrent work. One process
      serialises everything behind it.
    box: 2
    source:
      repo: system-design-estudos
      path: real-world-cases/01-platforms-and-apps/discord-elixir-realtime-scale/README.md
      note: Elixir at realtime scale, including per-process boundaries.
  - id: elixir-card-backpressure
    front: What is the honest answer about queues and load?
    back: >-
      A queue without back-pressure moves the failure rather than removing it;
      demand must flow from the consumer.
    box: 2
    source:
      repo: system-design-estudos
      path: areas/11-operational-playbooks/playbooks/queue-lag-dlq-and-replay.md
      note: Queue lag, dead letters and replay behaviour.
items:
  - id: elixir-01-process-model
    version: "1.0.0"
    target: elixir
    topic: Processes
    difficulty: 2
    interview_stage: technical_screen
    prompt: >-
      How would you describe an Elixir process to someone who only knows
      threads?
    context: >-
      An opening question that calibrates your mental model. The interviewer
      wants the isolation property, because everything else in OTP follows from
      it.
    best_answer: >-
      They are much lighter than OS threads and, more importantly, they share
      nothing. Each has its own heap and communicates only by copying messages,
      so one crashing cannot corrupt another's state. That isolation is what
      makes supervised restarts safe.
    distractors:
      - text: >-
          They are lightweight threads managed by the runtime rather than the
          operating system, so you can run millions of them concurrently without
          the usual overhead of native threads.
        trap: precision
        why_wrong: >-
          Gets the weight right and the isolation wrong, which is the property
          that actually matters for OTP.
      - text: >-
          They are similar to threads but with green threading and better
          scheduling, so the runtime can preempt them fairly and avoid one
          process blocking the others for too long.
        trap: content
        why_wrong: >-
          Describes scheduling accurately but never mentions shared-nothing,
          leaving the impression that memory is shared.
      - text: >-
          They are more light than the threads of the operating system and
          principally they do not share nothing, each one has its own heap and
          communicates only copying messages.
        trap: grammar
        why_wrong: >-
          "More light", "principally" as a false friend and the double negative
          all mark literal translation.
    feedback:
      register: >-
        Explanatory and comparative, pitched at the listener's existing model.
      hedging: >-
        None needed; these are architectural facts.
      precision: >-
        Isolation is the load-bearing property; weight is secondary.
      grammar: >-
        "Much lighter", "more importantly", "they share nothing".
      pragmatics: >-
        Linking isolation to supervised restarts previews the next question.
    rephrase:
      prompt: >-
        Explain the same idea to someone worried about memory usage at scale.
      goal: Adapt the comparison to a different concern.
    language_focus: [precision, grammar, register]
    pt_help: >-
      "Principalmente" e "mainly" ou "most importantly". "Principally" existe
      mas soa errado aqui.
    feynman:
      concept: Shared-nothing processes with copied messages.
      explain_to: A Java developer who thinks in shared-memory threads.
      constraint: Explain using separate offices exchanging letters.
      self_check: >-
        Did you say what one process cannot do to another?
    black_box:
      symptom: You led with lightness and omitted isolation.
      expected: Shared-nothing heaps, message copying, safe restarts.
      actual: A green-threads description, or a scheduling explanation.
      root_cause: >-
        Processes mapped onto threads instead of onto isolated actors.
      repair: >-
        Always say "they share nothing" in the first two sentences.
    recall:
      active_recall_cue: >-
        What property makes a supervised restart safe?
      leitner_start_box: 1
      mastery_threshold: 8
    sources:
      - repo: system-design-estudos
        path: real-world-cases/01-platforms-and-apps/discord-elixir-realtime-scale/README.md
        note: Elixir process model at realtime scale.
      - repo: original
        path: english-arcade/elixir/process-model
        note: Original interview phrasing authored for this pack.
  - id: elixir-02-let-it-crash
    version: "1.0.0"
    target: elixir
    topic: Fault tolerance
    difficulty: 3
    interview_stage: deep_dive
    prompt: >-
      Does "let it crash" mean you do not handle errors?
    context: >-
      A deliberately provocative framing. The interviewer wants to see whether
      you can defend the philosophy precisely rather than repeating the slogan
      or backing away from it.
    best_answer: >-
      No: I handle expected errors explicitly and let unexpected ones kill the
      process. A declined payment is a value I match on; unanticipated corrupt
      state is a crash, because a known-good restart beats an unknown state.
    distractors:
      - text: >-
          It means the supervisor handles the errors instead of the process, so
          you do not need try and rescue blocks because the restart takes care
          of recovery for you.
        trap: precision
        why_wrong: >-
          Half true and missing the crucial split between expected and
          unexpected failures, which is the whole doctrine.
      - text: >-
          Essentially yes, the philosophy is that defensive error handling adds
          complexity, so you let processes fail and rely on supervision to bring
          them back into a working state.
        trap: content
        why_wrong: >-
          Accepts the provocation and describes a system with no explicit domain
          error handling, which is not how OTP code is written.
      - text: >-
          No, it means that I treat explicitly the errors expected and let the
          unexpected kill the process, because restart from a state known-good
          is more safe.
        trap: grammar
        why_wrong: >-
          Adverb placement, post-posed adjectives and "more safe" all break the
          sentence despite correct content.
    feedback:
      register: >-
        Firm correction of the premise, without defensiveness.
      hedging: >-
        None; the distinction is clear enough to assert.
      precision: >-
        Expected versus unexpected is the axis; name both with examples.
      grammar: >-
        "I handle expected errors explicitly", "a known-good state", "safer".
      pragmatics: >-
        Contradicting the framing is expected here and shows conviction.
    rephrase:
      prompt: >-
        Give the same answer using an example from a payment flow only.
      goal: Ground the doctrine in a single concrete domain.
    language_focus: [precision, grammar, register]
    pt_help: >-
      Comparativos curtos: "safer", "harder". "More safe" e sempre erro.
    feynman:
      concept: Expected errors as values, unexpected failures as crashes.
      explain_to: A developer who wraps everything in try/rescue.
      constraint: Explain using a shop with a returns policy and a fire alarm.
      self_check: >-
        Did you give one example of each category?
    black_box:
      symptom: You accepted the premise, or described only supervision.
      expected: Expected errors handled as values; unexpected ones crash.
      actual: A no-error-handling claim, or a supervisor-only explanation.
      root_cause: >-
        The slogan learned without its boundary condition.
      repair: >-
        Answer with the two categories before mentioning supervisors.
    recall:
      active_recall_cue: >-
        Which failures should be values, and which should be crashes?
      leitner_start_box: 1
      mastery_threshold: 8
    sources:
      - repo: system-design-estudos
        path: areas/09-backend-principles/cards/error-handling-fault-tolerance.md
        note: Fault tolerance and failure classification.
      - repo: original
        path: english-arcade/elixir/let-it-crash
        note: Original interview phrasing authored for this pack.
  - id: elixir-03-genserver-bottleneck
    version: "1.0.0"
    target: elixir
    topic: OTP design
    difficulty: 3
    interview_stage: architecture_review
    prompt: >-
      This GenServer is showing high message queue length. What does that tell
      you?
    context: >-
      A single GenServer handles all writes for a busy feature. The interviewer
      wants you to recognise serialisation, which is the most common OTP design
      mistake at scale.
    best_answer: >-
      That it has become a bottleneck, because every call behind it is
      serialised through one mailbox. I would ask whether the state really has
      to be global, and if it can be partitioned per user or per room, I would
      run a process per partition instead.
    distractors:
      - text: >-
          That the process is doing too much work per message, so I would
          optimise the handle_call implementation to make each message faster to
          process and drain the queue.
        trap: content
        why_wrong: >-
          Treats a structural bottleneck as a micro-optimisation problem;
          faster serial work is still serial.
      - text: >-
          That there is more load than the process can handle, so I would need
          to scale it somehow, perhaps by adding more resources or by finding
          another approach to the problem.
        trap: precision
        why_wrong: >-
          Restates the symptom and offers no mechanism; "scale it somehow" is
          not a design.
      - text: >-
          That it turned a bottleneck, because all the calls behind it are
          serialised for one only mailbox, then I would ask if the state needs
          really to be global.
        trap: grammar
        why_wrong: >-
          "Turned a bottleneck", "for one only mailbox" and misplaced "really"
          all break the sentence.
    feedback:
      register: >-
        Architectural. Diagnose the shape, not the code.
      hedging: >-
        None on the diagnosis; hedge only whether partitioning is possible.
      precision: >-
        "Serialised through one mailbox" is the exact mechanism.
      grammar: >-
        "It has become", "a single mailbox", "whether the state really has to
        be".
      pragmatics: >-
        Asking whether the state must be global invites the domain discussion
        that leads to the real fix.
    rephrase:
      prompt: >-
        Answer again for state that genuinely cannot be partitioned.
      goal: Test whether you have a second strategy.
    language_focus: [precision, grammar, pragmatics]
    feynman:
      concept: Single-process serialisation and partitioned state.
      explain_to: A developer who added a GenServer for every module.
      constraint: Explain using one till in a large supermarket.
      self_check: >-
        Did you propose a partition key from the domain?
    black_box:
      symptom: You optimised the handler or described the symptom again.
      expected: Serialisation through one mailbox; partition the state.
      actual: A per-message optimisation, or vague scaling.
      root_cause: >-
        GenServers used as modules rather than as concurrency boundaries.
      repair: >-
        For every GenServer, ask what it serialises and whether that is
        intended.
    recall:
      active_recall_cue: >-
        What does a growing mailbox indicate structurally?
      leitner_start_box: 1
      mastery_threshold: 8
    sources:
      - repo: system-design-estudos
        path: real-world-cases/01-platforms-and-apps/discord-elixir-realtime-scale/README.md
        note: Per-partition process design at scale.
      - repo: original
        path: english-arcade/elixir/genserver-bottleneck
        note: Original interview phrasing authored for this pack.
  - id: elixir-04-supervision-strategy
    version: "1.0.0"
    target: elixir
    topic: Supervision
    difficulty: 2
    interview_stage: architecture_review
    prompt: >-
      Which supervision strategy would you choose for these workers?
    context: >-
      Several independent workers process unrelated queues under one supervisor.
      The interviewer wants the strategy tied to the coupling between children,
      not recited from documentation.
    best_answer: >-
      One_for_one, because the workers are independent and restarting one should
      not disturb the others. I would reach for one_for_all only if they shared
      state that goes inconsistent when a single child dies.
    distractors:
      - text: >-
          I would use one_for_one, since it is the default strategy and it works
          well for most cases where you have workers running under a supervisor
          in an application.
        trap: precision
        why_wrong: >-
          Right answer, no reasoning. The interviewer cannot tell whether you
          would notice a case that needs a different strategy.
      - text: >-
          I would use rest_for_one so that if an earlier worker fails the later
          ones are restarted too, which keeps the whole pipeline consistent
          after any failure occurs.
        trap: content
        why_wrong: >-
          Applies a dependency-ordered strategy to independent workers, which
          restarts healthy processes for no reason.
      - text: >-
          One_for_one, because the workers are independents and restart one
          should not disturb the others that are working normally in that
          moment.
        trap: grammar
        why_wrong: >-
          Pluralised adjective, missing gerund and "in that moment" are all
          transfer errors.
    feedback:
      register: >-
        Decisive with the condition for changing your mind.
      hedging: >-
        None; supervision strategies map cleanly onto coupling.
      precision: >-
        Shared inconsistent state is the criterion for one_for_all.
      grammar: >-
        Adjectives do not pluralise: "independent"; use "restarting one".
      pragmatics: >-
        Naming the alternative and its trigger shows the choice was reasoned.
    rephrase:
      prompt: >-
        Choose a strategy for a pipeline where each stage feeds the next.
      goal: Apply the coupling criterion to an ordered case.
    language_focus: [precision, grammar, pragmatics]
    feynman:
      concept: Supervision strategy as a function of child coupling.
      explain_to: A developer choosing strategies from documentation defaults.
      constraint: Explain using independent shops versus a production line.
      self_check: >-
        Did you name what would make you change strategy?
    black_box:
      symptom: You cited the default, or picked an ordered strategy.
      expected: one_for_one for independence; one_for_all for shared state.
      actual: >-
        An appeal to the default, or rest_for_one applied to independent
        workers.
      root_cause: >-
        Strategies memorised as names rather than as coupling decisions.
      repair: >-
        Ask what the children share before choosing a strategy.
    recall:
      active_recall_cue: >-
        What property of the children decides the supervision strategy?
      leitner_start_box: 1
      mastery_threshold: 8
    sources:
      - repo: system-design-estudos
        path: areas/09-backend-principles/cards/error-handling-fault-tolerance.md
        note: Supervision and recovery design.
      - repo: original
        path: english-arcade/elixir/supervision-strategy
        note: Original interview phrasing authored for this pack.
  - id: elixir-05-back-pressure
    version: "1.0.0"
    target: elixir
    topic: Back-pressure
    difficulty: 3
    interview_stage: deep_dive
    prompt: >-
      Producers are outpacing consumers. How do you stop the system falling
      over?
    context: >-
      An ingestion pipeline is accumulating messages faster than it can process
      them. The interviewer wants demand-driven flow control rather than a
      bigger buffer.
    best_answer: >-
      By making demand flow from the consumer rather than pushing from the
      producer, which is what GenStage gives you. A buffer only delays the
      problem, because unbounded queues turn a throughput mismatch into a memory
      failure that is harder to diagnose.
    distractors:
      - text: >-
          I would add more consumer processes to increase throughput, and
          increase the buffer size so that the system can absorb the spikes
          without dropping any of the incoming messages.
        trap: content
        why_wrong: >-
          More consumers may help transiently, but an unbounded buffer converts
          overload into an out-of-memory crash.
      - text: >-
          I would implement some form of back-pressure so that the producers
          slow down when the consumers cannot keep up with the current rate of
          incoming messages.
        trap: precision
        why_wrong: >-
          Names the concept without the mechanism; "some form of" is where the
          answer should have started.
      - text: >-
          Making the demand come from the consumer instead of push from the
          producer, because a buffer only delays the problem and after turns in
          a failure of memory.
        trap: grammar
        why_wrong: >-
          "Instead of push", "turns in" and "failure of memory" break parallel
          structure and compound nouns.
    feedback:
      register: >-
        Systems-level and specific.
      hedging: >-
        None; demand-driven flow is the established answer.
      precision: >-
        Say why buffering fails, not just that it does.
      grammar: >-
        "Instead of pushing", "turns into", "memory failure".
      pragmatics: >-
        Explaining the harder-to-diagnose failure mode justifies the design.
    rephrase:
      prompt: >-
        Explain what the producer should do when demand stops arriving.
      goal: Follow the mechanism one step further.
    language_focus: [precision, grammar, pragmatics]
    feynman:
      concept: Demand-driven flow control versus buffering.
      explain_to: A developer who solves queue growth with a bigger queue.
      constraint: Explain using a checkout that stops letting people queue.
      self_check: >-
        Did you say what the failure becomes if you only buffer?
    black_box:
      symptom: You added buffer or consumers, or named back-pressure vaguely.
      expected: Consumer-driven demand; unbounded buffers become memory
        failures.
      actual: Capacity increases, or the concept without the mechanism.
      root_cause: >-
        Overload framed as insufficient capacity instead of missing flow
        control.
      repair: >-
        Ask who decides when the next message is sent.
    recall:
      active_recall_cue: >-
        What does an unbounded queue convert overload into?
      leitner_start_box: 1
      mastery_threshold: 8
    sources:
      - repo: system-design-estudos
        path: areas/11-operational-playbooks/playbooks/queue-lag-dlq-and-replay.md
        note: Queue lag and overload handling.
      - repo: original
        path: english-arcade/elixir/back-pressure
        note: Original interview phrasing authored for this pack.
  - id: elixir-06-immutability-cost
    version: "1.0.0"
    target: elixir
    topic: Immutability
    difficulty: 2
    interview_stage: technical_screen
    prompt: >-
      Does immutability make Elixir slower for large data structures?
    context: >-
      A performance-flavoured question that rewards nuance. The interviewer
      wants to know whether you understand structural sharing or repeat a
      general claim in either direction.
    best_answer: >-
      Not as much as people expect, because updates share structure rather than
      copying wholesale. Building a large list by appending is genuinely slow,
      but that is about the data structure rather than immutability, and
      prepending then reversing avoids it.
    distractors:
      - text: >-
          Yes, since every update creates a new copy of the data structure,
          which means more allocation and more garbage collection pressure than
          a mutable language would have.
        trap: content
        why_wrong: >-
          Wholesale copying is exactly what structural sharing avoids, so the
          premise is wrong.
      - text: >-
          No, the BEAM is heavily optimised for this and in practice it is not
          something you need to worry about when writing normal application
          code.
        trap: precision
        why_wrong: >-
          Dismisses a real concern without naming the mechanism or the genuine
          exception.
      - text: >-
          Not so much how the people expect, because the updates share the
          structure instead of copy everything, although build a big list with
          append is really slow.
        trap: grammar
        why_wrong: >-
          "How the people expect", "instead of copy" and "build a big list" all
          need different forms.
    feedback:
      register: >-
        Nuanced. Concede the real cost while correcting the assumption.
      hedging: >-
        "Not as much as people expect" is well-calibrated for a nuanced claim.
      precision: >-
        Structural sharing and the append case are both required.
      grammar: >-
        "As people expect", "instead of copying", "building a large list".
      pragmatics: >-
        Offering the workaround turns a correction into useful advice.
    rephrase:
      prompt: >-
        Explain the append problem without using the word "immutability".
      goal: Separate the data structure issue from the paradigm.
    language_focus: [precision, grammar, hedging]
    feynman:
      concept: Structural sharing and list append costs.
      explain_to: A developer convinced functional means copying.
      constraint: Explain using a shared library catalogue with new entries.
      self_check: >-
        Did you name a case where the cost is real?
    black_box:
      symptom: You claimed copying, or dismissed the question entirely.
      expected: Structural sharing, plus the genuine append cost and its fix.
      actual: A copying claim, or an unqualified reassurance.
      root_cause: >-
        Immutability judged from intuition about memory rather than from the
        implementation.
      repair: >-
        Pair every reassurance with the one case that is genuinely slow.
    recall:
      active_recall_cue: >-
        Which list operation is genuinely expensive, and what replaces it?
      leitner_start_box: 1
      mastery_threshold: 8
    sources:
      - repo: system-design-estudos
        path: areas/09-backend-principles/cards/scaling-performance.md
        note: Performance reasoning about data structures.
      - repo: original
        path: english-arcade/elixir/immutability-cost
        note: Original interview phrasing authored for this pack.
  - id: elixir-07-ets-vs-genserver
    version: "1.0.0"
    target: elixir
    topic: State storage
    difficulty: 3
    interview_stage: architecture_review
    prompt: >-
      Would you keep this cache in a GenServer or in ETS?
    context: >-
      A read-heavy cache shared across many processes. The interviewer wants the
      concurrency characteristics compared, since this choice decides whether
      reads scale.
    best_answer: >-
      ETS, because reads can happen concurrently from many processes without
      going through a single mailbox. I would still own the table from a
      supervised process so its lifetime is managed, but the reads themselves
      should not be serialised.
    distractors:
      - text: >-
          A GenServer, because it keeps the state encapsulated and gives you a
          clear API for reading and writing, which is more idiomatic OTP design
          than exposing a table.
        trap: content
        why_wrong: >-
          Encapsulation is real, but it serialises every read through one
          process, which defeats the purpose of a read-heavy cache.
      - text: >-
          ETS is probably better for performance, though a GenServer is simpler
          to reason about, so it would depend on how much traffic the cache
          actually receives in practice.
        trap: hedging
        why_wrong: >-
          The prompt already says read-heavy and shared, so the deciding
          information was supplied.
      - text: >-
          ETS, because the readings can happen concurrently from many processes
          without pass for one only mailbox, although I would still own the
          table of a supervised process.
        trap: grammar
        why_wrong: >-
          "Readings" for reads, "without pass for" and "of a supervised process"
          are three distinct errors.
    feedback:
      register: >-
        Decisive, with the ownership caveat that shows OTP maturity.
      hedging: >-
        None; the workload was specified.
      precision: >-
        Concurrent reads versus a single mailbox is the deciding property.
      grammar: >-
        "Reads", "without going through", "owned by a supervised process".
      pragmatics: >-
        Keeping supervision in the answer pre-empts the lifetime follow-up.
    rephrase:
      prompt: >-
        Answer again for a cache with frequent writes and rare reads.
      goal: Check whether the criterion reverses correctly.
    language_focus: [precision, grammar, hedging]
    feynman:
      concept: Concurrent table reads versus serialised process calls.
      explain_to: A developer who puts all state in GenServers.
      constraint: Explain using a noticeboard versus a receptionist.
      self_check: >-
        Did you keep a supervised owner for the table?
    black_box:
      symptom: You chose a GenServer, or hedged despite the stated workload.
      expected: ETS for concurrent reads, still owned by a supervised process.
      actual: An encapsulation-driven choice, or an unnecessary hedge.
      root_cause: >-
        Design judged by idiom rather than by the concurrency it produces.
      repair: >-
        Ask whether reads must be serialised before choosing a home for state.
    recall:
      active_recall_cue: >-
        What does ETS allow that a GenServer cannot?
      leitner_start_box: 1
      mastery_threshold: 8
    sources:
      - repo: system-design-estudos
        path: areas/07-componentes-de-sistemas/cards/message-queue.md
        note: Component-level reasoning about queues and shared state.
      - repo: original
        path: english-arcade/elixir/ets-vs-genserver
        note: Original interview phrasing authored for this pack.
  - id: elixir-08-distributed-caveat
    version: "1.0.0"
    target: elixir
    topic: Distribution
    difficulty: 3
    interview_stage: deep_dive
    prompt: >-
      Distributed Erlang makes clustering easy. What is the catch?
    context: >-
      The interviewer is inviting an over-enthusiastic answer. They want to hear
      whether you know the operational costs that come with transparent
      distribution.
    best_answer: >-
      Transparency hides the network. A remote call looks local but can be slow,
      fail or partition, and full-mesh connectivity limits cluster size. It also
      assumes a trusted network, so I would not expose it across security
      boundaries without a tunnel.
    distractors:
      - text: >-
          The main catch is that you need to manage node discovery and make sure
          the nodes can find each other reliably, especially in containerised
          environments with dynamic addressing.
        trap: precision
        why_wrong: >-
          An operational detail rather than the fundamental issue, and it is
          solved by existing libraries.
      - text: >-
          There is not really a catch, it is one of the strongest features of
          the platform and it handles the hard parts of distribution for you
          automatically.
        trap: content
        why_wrong: >-
          Distribution transparency does not remove partitions, latency or the
          trust assumption.
      - text: >-
          The transparency hides the network. One call remote seems local but
          can be slow, fail or partition, and the connectivity in full mesh
          limits the size of the cluster.
        trap: grammar
        why_wrong: >-
          Post-posed adjectives and "the size of the cluster" invert English
          modifier order throughout.
    feedback:
      register: >-
        Balanced. Enthusiasm plus known costs reads as production experience.
      hedging: >-
        None; each cost is well established.
      precision: >-
        Three named costs beat one operational anecdote.
      grammar: >-
        "A remote call", "full-mesh connectivity", "cluster size".
      pragmatics: >-
        The security note shows you think beyond the happy path.
    rephrase:
      prompt: >-
        Say which of those costs you would raise first with an SRE team.
      goal: Prioritise costs for a specific audience.
    language_focus: [precision, grammar, register]
    feynman:
      concept: Distribution transparency and its hidden costs.
      explain_to: A developer excited by transparent remote calls.
      constraint: Explain using a phone call that sounds like the next room.
      self_check: >-
        Did you name a limit on cluster size?
    black_box:
      symptom: You named only discovery, or denied there was a catch.
      expected: Hidden network, mesh limits, trusted-network assumption.
      actual: An operational detail, or uncritical enthusiasm.
      root_cause: >-
        Features evaluated from documentation rather than from operating them.
      repair: >-
        For any transparency feature, ask what it is hiding.
    recall:
      active_recall_cue: >-
        What three costs come with transparent distribution?
      leitner_start_box: 1
      mastery_threshold: 8
    sources:
      - repo: system-design-estudos
        path: areas/06-foundations-distribuidas/topics/network-partitions.md
        note: Network partition behaviour in distributed systems.
      - repo: original
        path: english-arcade/elixir/distributed-caveat
        note: Original interview phrasing authored for this pack.
  - id: elixir-09-pattern-matching
    version: "1.0.0"
    target: elixir
    topic: Pattern matching
    difficulty: 1
    interview_stage: technical_screen
    prompt: >-
      Why match on the result tuple instead of using a conditional?
    context: >-
      A warm-up on idiom. The interviewer wants to hear the failure mode that
      matching prevents, rather than a statement that it is the Elixir way.
    best_answer: >-
      Because an unmatched shape fails immediately and loudly at the point it
      appears, rather than flowing through as nil and breaking somewhere else.
      Matching turns an unexpected return into a crash with the actual value in
      the message.
    distractors:
      - text: >-
          Because pattern matching is more idiomatic in Elixir and makes the
          code more readable and declarative than using conditionals to inspect
          the result of the call.
        trap: precision
        why_wrong: >-
          Style justification only. It never mentions what matching catches that
          a conditional does not.
      - text: >-
          Because it is faster than evaluating a conditional, since the runtime
          can optimise the match directly rather than executing a comparison at
          runtime each time.
        trap: content
        why_wrong: >-
          Invents a performance rationale; the benefit is failure locality, not
          speed.
      - text: >-
          Because a shape not matched fails immediately in the point where it
          appears, instead of follow like nil and break in another place after.
        trap: grammar
        why_wrong: >-
          Post-posed participle, "in the point", "instead of follow" and "break
          in another place" are all transfer errors.
    feedback:
      register: >-
        Brief and mechanism-focused.
      hedging: >-
        None needed for an idiom with a clear rationale.
      precision: >-
        Failing at the point of appearance is the benefit; name it.
      grammar: >-
        "An unmatched shape", "at the point where it appears", "instead of
        flowing".
      pragmatics: >-
        Mentioning the actual value in the error message is a debugging detail
        that lands well.
    rephrase:
      prompt: >-
        Describe the bug you get when you use a conditional and ignore the
        error case.
      goal: Make the benefit visible through its absence.
    language_focus: [precision, grammar, register]
    feynman:
      concept: Failure locality through pattern matching.
      explain_to: A developer who checks return values with if statements.
      constraint: Explain using a parcel rejected at the door versus stored.
      self_check: >-
        Did you say where the failure surfaces?
    black_box:
      symptom: You justified by idiom or invented a speed benefit.
      expected: Immediate loud failure at the point of the unexpected shape.
      actual: A readability claim, or a performance rationale.
      root_cause: >-
        Idiom absorbed from surrounding code without its debugging payoff.
      repair: >-
        Explain matching by describing the nil bug it prevents.
    recall:
      active_recall_cue: >-
        Where does a failure surface with matching versus with a conditional?
      leitner_start_box: 1
      mastery_threshold: 8
    sources:
      - repo: system-design-estudos
        path: areas/09-backend-principles/cards/validation-transformation.md
        note: Validation and transformation boundaries.
      - repo: original
        path: english-arcade/elixir/pattern-matching
        note: Original interview phrasing authored for this pack.
  - id: elixir-10-choosing-elixir
    version: "1.0.0"
    target: elixir
    topic: Technology choice
    difficulty: 2
    interview_stage: behavioural_probe
    prompt: >-
      Tell me about a time you argued for or against using Elixir.
    context: >-
      A judgement probe. The interviewer wants evidence that you can separate
      genuine fit from enthusiasm, and the strongest answers often describe
      arguing against your preferred tool.
    best_answer: >-
      I argued against it once. The team wanted Elixir for a CRUD admin panel
      with three users, where the concurrency story was irrelevant and nobody
      else could maintain it. We used the existing stack, and I kept the case for
      Elixir until we had a workload that actually needed the runtime.
    distractors:
      - text: >-
          I argued for it on a project that needed to handle a lot of concurrent
          connections, and it worked out very well because the runtime is
          designed exactly for that kind of workload.
        trap: precision
        why_wrong: >-
          Generic and unfalsifiable. No numbers, no alternative considered, no
          cost acknowledged.
      - text: >-
          I would argue for Elixir whenever the system has realtime
          requirements, since the BEAM handles that much better than most
          alternatives and the fault tolerance is excellent.
        trap: grammar
        why_wrong: >-
          Answers a past-experience question in the conditional, which does not
          satisfy a behavioural probe.
      - text: >-
          I argued for it because it is a better language than what we were
          using, and eventually the team came around once they saw how much
          cleaner the code was.
        trap: register
        why_wrong: >-
          Frames a technology decision as a superiority contest, which reads as
          difficult to work with.
    feedback:
      register: >-
        Measured. Arguing against your favourite tool is the strongest possible
        signal.
      hedging: >-
        None; this is a past decision with an outcome.
      precision: >-
        Name the workload and why the runtime was irrelevant to it.
      grammar: >-
        Past simple throughout: "I argued", "we used", "I kept".
      pragmatics: >-
        Keeping the case alive for later shows judgement without abandoning
        conviction.
    rephrase:
      prompt: >-
        Tell the same story emphasising what you would have lost by choosing
        Elixir.
      goal: Practise arguing the cost side explicitly.
    language_focus: [grammar, register, precision]
    pt_help: >-
      "Tell me about a time" pede passado. Condicional soa como opiniao, nao
      como experiencia.
    feynman:
      concept: Fit-based technology choice over preference.
      explain_to: An engineer who wants to use a new language at work.
      constraint: Explain without claiming any language is better.
      self_check: >-
        Did your story include a cost you accepted?
    black_box:
      symptom: You answered hypothetically or argued language superiority.
      expected: A past decision with workload, cost and outcome named.
      actual: Conditional advocacy, or a better-language framing.
      root_cause: >-
        Technology stories told as preferences rather than as trade-offs.
      repair: >-
        Prepare one story where you argued against your preferred tool.
    recall:
      active_recall_cue: >-
        What makes a technology-choice story credible to an interviewer?
      leitner_start_box: 1
      mastery_threshold: 8
    sources:
      - repo: system-design-estudos
        path: areas/12-engineering-practice/cards/architecture-decision-records.md
        note: Decision records and trade-off documentation.
      - repo: original
        path: english-arcade/elixir/choosing-elixir
        note: Original interview phrasing authored for this pack.
  - id: elixir-11-liveview-tradeoff
    version: "1.0.0"
    target: elixir
    topic: LiveView trade-offs
    difficulty: 2
    interview_stage: architecture_review
    prompt: >-
      What would make you avoid LiveView for a feature?
    context: >-
      An architecture conversation. The interviewer wants to know whether you
      can name the constraints of a tool you like, particularly the stateful
      connection cost.
    best_answer: >-
      Offline or flaky-network use, mainly. Every client holds a stateful
      connection and a process on the server, so a poor connection degrades the
      experience directly and idle sessions still cost memory. For a mostly
      static page it is also more machinery than the problem needs.
    distractors:
      - text: >-
          If the team is not familiar with Elixir, since the learning curve
          could slow down delivery and it would be harder to find people to
          maintain it later on.
        trap: precision
        why_wrong: >-
          A staffing consideration rather than a technical constraint, and it
          would apply to any Elixir feature equally.
      - text: >-
          I would not avoid it, LiveView handles almost every case well and
          reduces the need for a separate frontend stack, which simplifies the
          whole architecture significantly.
        trap: content
        why_wrong: >-
          Ignores the stateful-connection requirement, which genuinely rules out
          some use cases.
      - text: >-
          Use offline or with network flaky, mainly. Each client maintains one
          connection with state and one process in the server, then a bad
          connection degrades direct the experience.
        trap: grammar
        why_wrong: >-
          Missing subject, post-posed adjectives and "degrades direct" break the
          sentence throughout.
    feedback:
      register: >-
        Balanced criticism of a tool you presumably like.
      hedging: >-
        "Mainly" appropriately signals these are the primary cases.
      precision: >-
        Per-client server process is the cost most candidates omit.
      grammar: >-
        "A flaky network", "on the server", "degrades the experience directly".
      pragmatics: >-
        Adding the over-engineering case shows proportion, not just limits.
    rephrase:
      prompt: >-
        Describe a feature in the same product where LiveView is clearly right.
      goal: Balance the critique with a positive case.
    language_focus: [precision, grammar, hedging]
    feynman:
      concept: Stateful connections and per-client server cost.
      explain_to: A developer choosing LiveView for everything.
      constraint: Explain using a phone line held open per customer.
      self_check: >-
        Did you name what an idle session still costs?
    black_box:
      symptom: You named staffing, or claimed there are no limits.
      expected: Offline and flaky networks, plus per-client process cost.
      actual: A team-skills answer, or uncritical endorsement.
      root_cause: >-
        Tool limits unexamined because the tool has worked so far.
      repair: >-
        For any framework you like, name the workload it should not serve.
    recall:
      active_recall_cue: >-
        What does each LiveView client cost on the server while idle?
      leitner_start_box: 1
      mastery_threshold: 8
    sources:
      - repo: system-design-estudos
        path: areas/09-backend-principles/cards/realtime-backend-systems.md
        note: Realtime backend design considerations.
      - repo: original
        path: english-arcade/elixir/liveview-tradeoff
        note: Original interview phrasing authored for this pack.
  - id: elixir-12-onboarding-others
    version: "1.0.0"
    target: elixir
    topic: Mentoring
    difficulty: 2
    interview_stage: behavioural_probe
    prompt: >-
      How do you help an object-oriented developer become productive in Elixir?
    context: >-
      A mentoring probe. The interviewer wants a specific first obstacle and a
      concrete intervention, since generic answers about patience tell them
      nothing.
    best_answer: >-
      I focus on the one habit that blocks everything else, which is looking for
      a place to keep mutable state. I pair on a small feature and have them
      write the transformation as a pipeline, because once the data flow clicks
      the rest of the syntax stops feeling strange.
    distractors:
      - text: >-
          I would be patient and give them time to learn, share good resources
          like books and documentation, and answer their questions as they come
          up during the first few weeks.
        trap: precision
        why_wrong: >-
          Describes a general attitude rather than a diagnosis of what actually
          blocks OO developers.
      - text: >-
          I would start by explaining the theory behind functional programming
          and immutability so they understand the foundations before they start
          writing any production code.
        trap: content
        why_wrong: >-
          Front-loads theory, which is the slowest path; the obstacle is a habit,
          not a knowledge gap.
      - text: >-
          I focus in the habit that blocks all the rest, that is to search a
          place for keep the state mutable, and after I make pair in a small
          feature with them.
        trap: grammar
        why_wrong: >-
          "Focus in", "for keep", "state mutable" and "make pair in" are four
          separate transfer errors.
    feedback:
      register: >-
        Practical and specific; mentoring answers live on concrete detail.
      hedging: >-
        None needed; you are describing what you actually do.
      precision: >-
        Naming the exact habit is what makes this answer credible.
      grammar: >-
        "Focus on", "in order to keep", "mutable state", "pair on a feature".
      pragmatics: >-
        Explaining why the pipeline exercise works shows deliberate teaching.
    rephrase:
      prompt: >-
        Describe the first code review comment you would leave for them.
      goal: Turn a mentoring philosophy into an observable action.
    language_focus: [precision, grammar, pragmatics]
    pt_help: >-
      "Focar em" e "focus on". E adjetivo vem antes: "mutable state".
    feynman:
      concept: Unlearning mutable state as the first functional obstacle.
      explain_to: A team lead planning an onboarding week.
      constraint: Do not mention any book or course.
      self_check: >-
        Did you name one habit and one exercise?
    black_box:
      symptom: You offered patience and resources, or led with theory.
      expected: The mutable-state habit, plus a pipeline pairing exercise.
      actual: A generic attitude, or a theory-first plan.
      root_cause: >-
        Mentoring described as disposition rather than as targeted
        intervention.
      repair: >-
        Answer mentoring questions with one obstacle and one exercise.
    recall:
      active_recall_cue: >-
        What habit most blocks an OO developer learning Elixir?
      leitner_start_box: 1
      mastery_threshold: 8
    sources:
      - repo: system-design-estudos
        path: areas/10-engineering-case-studies/cards/platform-engineering-developer-experience.md
        note: Developer experience and onboarding practice.
      - repo: original
        path: english-arcade/elixir/onboarding-others
        note: Original interview phrasing authored for this pack.
