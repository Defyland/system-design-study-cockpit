---
contract_version: 1.4.0
target:
  key: elixir
  label: Elixir
  blurb: Explain processes, supervision and back-pressure the way a BEAM engineer
    does, with isolation and failure treated as design tools.
  focus_areas:
  - processes and message passing
  - OTP and supervision
  - immutability and state
  - back-pressure and flow control
  - fault tolerance in production
  simulation:
    minutes: 45
    structure:
    - label: Processes and mental model warm-up
      minutes: 8
    - label: OTP and supervision deep dive
      minutes: 15
    - label: Back-pressure and bottlenecks
      minutes: 12
    - label: Failure, observability and trade-offs
      minutes: 10
  critical_thinking:
    learner_prompts:
      evidence_ledger: For Elixir, record whether each claim about process isolation,
        supervision, backpressure, immutability, and tests is a verified fact, an
        inference, an assumption, or an unknown before you defend it.
      problem_frame: Frame every Elixir answer with the actor, requirement, constraint,
        success condition, and unanswered question that could change the decision.
      comparison: When Elixir offers a real choice, compare two options by benefit,
        cost or risk, valid-when condition, and an explicit decision rule.
      failure_probe: Ask which counterexample, edge case, or failure mode could break
        the Elixir recommendation, then state the smallest test or containment step.
      certainty_review: 'Calibrate certainty in Elixir: name the evidence, separate
        correlation from causality, and say what new observation would make you revise
        the answer.'
    rubric:
      facts_correct: Names the verified process isolation, supervision, backpressure,
        immutability, and tests facts without smuggling in a result or capability
        that the prompt does not establish.
      assumptions_explicit: Labels the Elixir premise that is still assumed and asks
        the smallest clarifying question that matters.
      alternatives_considered: Considers a credible alternative for Elixir, or explains
        the hard constraint that makes comparison a false equivalence.
      tradeoff_quality: Connects the Elixir choice to a benefit, a cost or risk, and
        the condition under which another choice wins.
      follow_up_adaptation: Responds to an adversarial Elixir follow-up by changing
        the claim or evidence boundary rather than repeating a memorised answer.
      certainty_calibration: Uses high, medium, or low certainty deliberately and
        names the evidence that would update the Elixir recommendation.
cards:
- id: elixir-card-let-it-crash
  front: How do you explain "let it crash" without sounding reckless?
  back: >-
    I crash on unexpected state and let supervision recover it from a known-good restart path. I
    handle expected outcomes as values so the restart policy stays focused on faults it can
    actually repair.
  box: 1
  source:
    repo: system-design-estudos
    path: areas/09-backend-principles/cards/error-handling-fault-tolerance.md
    note: Fault tolerance principles behind supervised restarts.
  critical_thinking:
    cue: >-
      How do you explain "let it crash" without sounding reckless? Separate expected outcomes from
      unexpected state, then name the supervisor action that makes recovery safe.
    check: >-
      Can you compare returning an error with crashing a process, name the failure a restart would
      not repair, and say which trace would change your choice?
- id: elixir-card-genserver-bottleneck
  front: When is a GenServer the wrong choice?
  back: >-
    I call a GenServer a bottleneck when one mailbox serialises work that could run
    concurrently. I first ask whether the state must be shared, then measure queue wait before
    choosing partitioning or another storage boundary.
  box: 2
  source:
    repo: system-design-estudos
    path: real-world-cases/01-platforms-and-apps/discord-elixir-realtime-scale/README.md
    note: Elixir at realtime scale, including per-process boundaries.
  critical_thinking:
    cue: >-
      When is a GenServer the wrong choice? Identify the serialized state, the queue signal, and
      the condition under which partitioning is safe.
    check: >-
      Can you compare one shared process with partitioned state, name the mailbox failure mode,
      and state which queue measurement would justify a change?
- id: elixir-card-backpressure
  front: What is the honest answer about queues and load?
  back: >-
    I treat a queue without back-pressure as a moved failure: demand must flow from the consumer
    so a producer cannot hide a throughput mismatch in unbounded memory. I still define what to
    reject or shed when the bound is reached.
  box: 2
  source:
    repo: system-design-estudos
    path: areas/11-operational-playbooks/playbooks/queue-lag-dlq-and-replay.md
    note: Queue lag, dead letters and replay behaviour.
  critical_thinking:
    cue: >-
      What is the honest answer about queues and load? Name who controls demand, what the bound
      protects, and what happens when producers remain faster.
    check: >-
      Can you compare bounded demand with an unbounded queue, name the overload failure, and state
      which queue or latency metric would update your answer?
items:
- id: elixir-01-process-model
  version: 1.4.0
  target: elixir
  topic: Processes
  difficulty: 2
  interview_stage: technical_screen
  prompt: How would you describe an Elixir process to someone who only knows threads?
  context: An opening question that calibrates your mental model. The interviewer
    wants the isolation property, because everything else in OTP follows from it.
  follow_up:
    prompt: What mailbox or supervision behavior would you point to when explaining
      why this process is not a shared-memory thread?
    goal: Answer the evidence challenge about Processes while keeping the evidence
      boundary explicit.
    challenge_kind: evidence
    best_answer: >-
      I would point to the mailbox as per-process state and to the supervisor as the owner of
      restart policy. I would trace a message send and a child crash, then distinguish an isolated
      process failure from any assumption about how a particular term is copied or shared by the
      runtime.
    distractors:
    - text: I would cite my experience with Processes as enough proof and move on
        without naming an observation.
      why_wrong: Experience can guide a hypothesis, but it does not replace evidence
        tied to this context.
    - text: I would collect every possible metric about Processes before making even
        a provisional recommendation.
      why_wrong: A focused decision can start with one discriminating observation
        rather than an unbounded data request.
  compression:
    prompt: Explain an Elixir process using isolation, message passing, and the supervisor's
      role in restarting it.
    goal: Compress the Processes answer into its decision, premise, trade-off, and
      verification step.
  best_answer: >-
    I describe an Elixir process as a lightweight isolated unit with its own heap and mailbox.
    It communicates by messages rather than shared mutable heap state; ordinary terms are copied
    across the boundary, while the runtime may share large binaries. I use that isolation to
    explain why one crash does not corrupt another process and why supervision can restart it.
  distractors:
  - text: They are lightweight threads managed by the runtime rather than the operating
      system, so you can run millions of them concurrently without the usual overhead
      of native threads.
    trap: precision
    why_wrong: Gets the weight right and the isolation wrong, which is the property
      that actually matters for OTP.
  - text: They are similar to threads but with green threading and better scheduling,
      so the runtime can preempt them fairly and avoid one process blocking the others
      for too long.
    trap: content
    why_wrong: Describes scheduling accurately but never mentions shared-nothing,
      leaving the impression that memory is shared.
  - text: They are more light than the threads of the operating system and principally
      they do not share nothing, each one has its own heap and communicates only copying
      messages.
    trap: grammar
    why_wrong: '"More light", "principally" as a false friend and the double negative
      all mark literal translation.'
  feedback:
    register: Explanatory and comparative, pitched at the listener's existing model.
    hedging: None needed; these are architectural facts.
    precision: Isolation is the load-bearing property; weight is secondary.
    grammar: '"Much lighter", "more importantly", "they share nothing".'
    pragmatics: Linking isolation to supervised restarts previews the next question.
  rephrase:
    prompt: Explain the same idea to someone worried about memory usage at scale.
    goal: Adapt the comparison to a different concern.
  language_focus:
  - precision
  - grammar
  - register
  pt_help: '"Principalmente" e "mainly" ou "most importantly". "Principally" existe
    mas soa errado aqui.'
  feynman:
    concept: Shared-nothing processes with copied messages.
    explain_to: A Java developer who thinks in shared-memory threads.
    constraint: Explain using separate offices exchanging letters.
    self_check: Did you say what one process cannot do to another?
    reasoning_check: Can you identify the hidden premise behind Processes, give a
      counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You led with lightness and omitted isolation.
    expected: Shared-nothing heaps, message copying, safe restarts.
    actual: A green-threads description, or a scheduling explanation.
    root_cause: Processes mapped onto threads instead of onto isolated actors.
    repair: Always say "they share nothing" in the first two sentences.
    reasoning_error: If your Processes answer failed, classify the mistake as a fact,
      assumption, comparison, failure, or certainty error before proposing the smallest
      repair.
  recall:
    active_recall_cue: What property makes a supervised restart safe?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Processes without presenting
      an assumption as a fact?
    black_box_probe: When the Processes answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: elixir-01-process-model-delayed-1
      prompt: >-
        A mailbox trace shows a process retaining a large binary while a reviewer asks for a firm
        "messages are always copied" guarantee. Which process claim would you narrow and verify?
      changed_constraint: >-
        the explanation must respect a mailbox memory budget and the actual runtime shareability
        rules
      new_evidence: >-
        a trace shows mailbox retention for a large binary and the reviewer challenges an absolute
        copying claim
      best_answer: >-
        I would keep the no-shared-mutable-heap explanation, but I would narrow the claim that every
        message is copied in the same way. I would record the Elixir and OTP versions, inspect the
        binary and mailbox behavior with a focused experiment, and update the memory recommendation
        from that evidence.
      distractors:
      - text: I would preserve every part of the original Processes answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Processes explanation with a new design without
          identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: real-world-cases/01-platforms-and-apps/discord-elixir-realtime-scale/README.md
    note: Elixir process model at realtime scale.
  - repo: original
    path: english-arcade/elixir/process-model
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: >-
      A mailbox holds a large binary and the child restarts: explain which isolation claim survives and which transfer/state claim needs a versioned experiment?
    goal: >-
      Explain mailbox and heap isolation while qualifying large-binary transfer and post-restart state with runtime evidence.
  critical_thinking:
    problem_frame: >-
      The actor is one Elixir process receiving messages. The required outcome is an accurate mental model for isolation and restart; the constraints are its private heap, mailbox, message boundary, and supervisor; the unknown is the term size and exact restart state.
    claim_map:
      fact: >-
        Each process owns its heap and queues incoming messages privately; a supervisor owns restart policy, and ordinary terms and large binaries can have different runtime transfer behavior.
      inference: >-
        Isolation explains why a child crash does not directly corrupt another process, while supervision explains how the failed child can be rebuilt.
      assumption: >-
        I am assuming the listener needs the conceptual boundary rather than a guarantee about copying every term or preserving state across restart.
      unknown: >-
        The term type/size, mailbox backlog, restart strategy, and state reconstruction source are not specified.
    comparison:
      applicable: false
      rejected_alternative: >-
        Calling a process merely a cheaper thread would import shared-memory assumptions and hide the mailbox and heap boundary the question is testing.
      hard_constraint: >-
        The explanation must preserve process isolation and supervisor-owned restart without claiming that every message has identical copy behavior.
      decision_rule: >-
        I would explain the private mailbox/heap and message boundary first, then qualify transfer details with the runtime version and term type before making a memory claim.
    failure_probe:
      kind: edge_case
      prompt: >-
        Which term and restart trace would falsify a blanket message-copy or state-preservation claim?
    evidence_check:
      basis: >-
        Check the process documentation and a focused mailbox/restart experiment on the installed Elixir/OTP versions, including the state rebuild path.
      source_kind: authored_scenario
      limitation: >-
        A small process experiment cannot establish production mailbox pressure, binary retention, or supervision recovery for every child.
      checked_on: '2026-08-25'
    certainty:
      level: high
      rationale: >-
        Process isolation and mailbox ownership are central runtime facts; exact term transfer and restart-state behavior depend on details absent from the prompt.
      update_trigger: >-
        I would narrow the explanation if the term experiment or restart trace reveals a binary-sharing or state-rebuild case I did not account for.
    rubric:
      facts_correct: >-
        Names private heap, mailbox, message communication, and supervisor restart without equating a process with a shared-memory thread.
      assumptions_explicit: >-
        States which term and restart-state details remain unknown.
      alternatives_considered: >-
        Explains why a thread analogy is insufficient for this isolation question.
      tradeoff_quality: >-
        Connects isolation to crash containment while acknowledging transfer and state-rebuild costs.
      follow_up_adaptation: >-
        Qualifies the message-copy claim when the large-binary trace changes the premise.
      certainty_calibration: >-
        Uses high confidence for the process boundary and conditional language for term-specific behavior.


- id: elixir-02-let-it-crash
  version: 1.4.0
  target: elixir
  topic: Fault tolerance
  difficulty: 3
  interview_stage: deep_dive
  prompt: Does "let it crash" mean you do not handle errors?
  context: A deliberately provocative framing. The interviewer wants to see whether
    you can defend the philosophy precisely rather than repeating the slogan or backing
    away from it.
  follow_up:
    prompt: Which error should be returned to the caller, and which process failure
      should the supervisor restart rather than hide?
    goal: Answer the alternative challenge about Fault tolerance while keeping the
      evidence boundary explicit.
    challenge_kind: alternative
    best_answer: >-
      I would return a declined payment or validation failure because the caller can handle it as
      an expected value. I would let a corrupt process state crash and ask the supervisor to
      restart it, then verify that the restart loses or rebuilds the right state instead of hiding
      the fault.
    distractors:
    - text: I would defend the first Fault tolerance option because offering an alternative
        might make the decision look uncertain.
      why_wrong: A comparison makes the decision rule visible; it does not weaken
        a well-calibrated recommendation.
    - text: I would list every conceivable Fault tolerance design without saying which
        requirement should decide between them.
      why_wrong: An option list without a decision rule avoids the trade-off the follow-up
        is testing.
  compression:
    prompt: Clarify let-it-crash as explicit boundary handling, isolated failure,
      and supervised recovery.
    goal: Compress the Fault tolerance answer into its decision, premise, trade-off,
      and verification step.
  best_answer: 'No: I handle expected errors explicitly and let unexpected ones kill
    the process. A declined payment is a value I match on; unanticipated corrupt state
    is a crash, because a known-good restart beats an unknown state.'
  distractors:
  - text: It means the supervisor handles the errors instead of the process, so you
      do not need try and rescue blocks because the restart takes care of recovery
      for you.
    trap: precision
    why_wrong: Half true and missing the crucial split between expected and unexpected
      failures, which is the whole doctrine.
  - text: Essentially yes, the philosophy is that defensive error handling adds complexity,
      so you let processes fail and rely on supervision to bring them back into a
      working state.
    trap: content
    why_wrong: Accepts the provocation and describes a system with no explicit domain
      error handling, which is not how OTP code is written.
  - text: No, it means that I treat explicitly the errors expected and let the unexpected
      kill the process, because restart from a state known-good is more safe.
    trap: grammar
    why_wrong: Adverb placement, post-posed adjectives and "more safe" all break the
      sentence despite correct content.
  feedback:
    register: Firm correction of the premise, without defensiveness.
    hedging: None; the distinction is clear enough to assert.
    precision: Expected versus unexpected is the axis; name both with examples.
    grammar: '"I handle expected errors explicitly", "a known-good state", "safer".'
    pragmatics: Contradicting the framing is expected here and shows conviction.
  rephrase:
    prompt: Give the same answer using an example from a payment flow only.
    goal: Ground the doctrine in a single concrete domain.
  language_focus:
  - precision
  - grammar
  - register
  pt_help: 'Comparativos curtos: "safer", "harder". "More safe" e sempre erro.'
  feynman:
    concept: Expected errors as values, unexpected failures as crashes.
    explain_to: A developer who wraps everything in try/rescue.
    constraint: Explain using a shop with a returns policy and a fire alarm.
    self_check: Did you give one example of each category?
    reasoning_check: Can you identify the hidden premise behind Fault tolerance, give
      a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You accepted the premise, or described only supervision.
    expected: Expected errors handled as values; unexpected ones crash.
    actual: A no-error-handling claim, or a supervisor-only explanation.
    root_cause: The slogan learned without its boundary condition.
    repair: Answer with the two categories before mentioning supervisors.
    reasoning_error: If your Fault tolerance answer failed, classify the mistake as
      a fact, assumption, comparison, failure, or certainty error before proposing
      the smallest repair.
  recall:
    active_recall_cue: Which failures should be values, and which should be crashes?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Fault tolerance without presenting
      an assumption as a fact?
    black_box_probe: When the Fault tolerance answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: elixir-02-let-it-crash-delayed-2
      prompt: >-
        A payment decline is frequent and expected, while a restart loses a stateful in-flight
        operation. Which part of let-it-crash survives, and what recovery contract must you verify?
      changed_constraint: >-
        expected declines must remain values and an unexpected crash must not silently lose an
        in-flight operation
      new_evidence: >-
        the workload contains frequent declines and a restart trace shows state loss during an
        in-flight operation
      best_answer: >-
        I would keep expected declines as explicit values, but I would narrow the guarantee that a
        restart alone recovers an in-flight operation. I would make the operation replayable or
        durable, test duplicate effects after restart, and keep the supervisor focused on recovering
        process state it can rebuild.
      distractors:
      - text: I would preserve every part of the original Fault tolerance answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Fault tolerance explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/09-backend-principles/cards/error-handling-fault-tolerance.md
    note: Fault tolerance and failure classification.
  - repo: original
    path: english-arcade/elixir/let-it-crash
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: >-
      A payment process crashes after an external call: distinguish the expected decline from replayable corrupt state and test duplicate effects after restart?
    goal: >-
      Separate expected payment values from corrupt state and prove that restart replay cannot duplicate an external effect.
  critical_thinking:
    problem_frame: >-
      The actor is a supervised payment process. The required outcome is explicit handling for expected declines and a known-good recovery for corrupt state; the constraints are caller-visible outcomes, durable work, and restart semantics; the unknown is whether an in-flight operation can be rebuilt safely.
    claim_map:
      fact: >-
        A declined payment is an expected value that a caller can match, while an unexpected corrupt state can terminate the process and invoke supervisor restart.
      inference: >-
        Letting corrupt state crash is useful only when the restarted process can rebuild or replay the work instead of silently losing an irreversible operation.
      assumption: >-
        I am assuming the payment decline has a stable result contract and the in-flight operation has a durable or idempotent identity.
      unknown: >-
        Restart intensity, state persistence, duplicate side effects, and caller retry behavior are not established.
    comparison:
      applicable: true
      alternatives:
      - option: return an expected decline as a value
        benefit: Lets the caller branch normally and keeps supervision for process failure.
        cost_or_risk: Requires callers to handle the result shape consistently.
        valid_when: Use it for validation or payment outcomes that are part of the business
          contract.
      - option: crash and restart on corrupt process state
        benefit: Discards an unknown state and lets supervision rebuild a known-good process.
        cost_or_risk: Can lose or repeat in-flight work unless that work is durable and
          idempotent.
        valid_when: Use it when the supervisor and operation identity make replay safe.
      decision_rule: I would return expected declines, crash unrecoverable process state,
        and only claim safe restart after testing durable replay or an explicit duplicate-prevention
        boundary.
    failure_probe:
      kind: failure_mode
      prompt: >-
        Which replay after a child crash would show that restart can duplicate or lose the payment, and what boundary would you repair?
    evidence_check:
      basis: >-
        Inspect the payment result contract, supervisor strategy, durable operation identity, and a controlled child-failure test that covers the in-flight window.
      source_kind: authored_scenario
      limitation: >-
        A local restart test does not prove provider-side idempotency or recovery under repeated node failure.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        The expected-versus-corrupt distinction is clear, but restart safety depends on durable state and external side effects not shown.
      update_trigger: >-
        I would change the recovery claim if replay duplicates an effect, loses state, or shows that the caller cannot distinguish a decline from a crash.
    rubric:
      facts_correct: >-
        Separates expected values from unexpected process failure and names supervisor restart.
      assumptions_explicit: >-
        States the durable/idempotent operation assumption needed for safe replay.
      alternatives_considered: >-
        Compares explicit error handling with a crash and explains why neither applies to every failure.
      tradeoff_quality: >-
        Connects crash containment to duplicate-effect and lost-work risk.
      follow_up_adaptation: >-
        Preserves expected declines while adding a recovery contract when restart loses in-flight state.
      certainty_calibration: >-
        Treats the philosophy as conditional on the tested recovery boundary.


- id: elixir-03-genserver-bottleneck
  version: 1.4.0
  target: elixir
  topic: OTP design
  difficulty: 3
  interview_stage: architecture_review
  prompt: This GenServer is showing high message queue length. What does that tell
    you?
  context: A single GenServer handles all writes for a busy feature. The interviewer
    wants you to recognise serialisation, which is the most common OTP design mistake
    at scale.
  follow_up:
    prompt: What work is this GenServer serialising, and where would you move or shard
      state if the mailbox remains high?
    goal: Answer the failure challenge about OTP design while keeping the evidence
      boundary explicit.
    challenge_kind: failure
    best_answer: >-
      I would identify the call that holds the mailbox, such as a slow write or external request,
      and measure queue wait separately from work time. If state can be partitioned, I would move
      ownership per user or room and compare mailbox depth and tail latency before and after.
    distractors:
    - text: I would describe the OTP design failure as impossible because the happy
        path already passed its test.
      why_wrong: Passing a happy path does not test the boundary, failure mode, or
        recovery being challenged.
    - text: I would add retries to OTP design immediately and assume the system would
        become reliable.
      why_wrong: Retries can amplify load or duplicate effects; the failure and containment
        policy must be specified first.
  compression:
    prompt: Diagnose the bottleneck with mailbox signal, serial work, and one safe
      scaling move.
    goal: Compress the OTP design answer into its decision, premise, trade-off, and
      verification step.
  best_answer: >-
    I read a growing mailbox as evidence that one process is serialising work faster than it can
    complete. I ask whether the state must be global; if it can be partitioned per user or room,
    I would measure queue wait and move ownership to separate processes rather than add capacity
    behind the same mailbox.
  distractors:
  - text: That the process is doing too much work per message, so I would optimise
      the handle_call implementation to make each message faster to process and drain
      the queue.
    trap: content
    why_wrong: Treats a structural bottleneck as a micro-optimisation problem; faster
      serial work is still serial.
  - text: That there is more load than the process can handle, so I would need to
      scale it somehow, perhaps by adding more resources or by finding another approach
      to the problem.
    trap: precision
    why_wrong: Restates the symptom and offers no mechanism; "scale it somehow" is
      not a design.
  - text: That it turned a bottleneck, because all the calls behind it are serialised
      for one only mailbox, then I would ask if the state needs really to be global.
    trap: grammar
    why_wrong: '"Turned a bottleneck", "for one only mailbox" and misplaced "really"
      all break the sentence.'
  feedback:
    register: Architectural. Diagnose the shape, not the code.
    hedging: None on the diagnosis; hedge only whether partitioning is possible.
    precision: '"Serialised through one mailbox" is the exact mechanism.'
    grammar: '"It has become", "a single mailbox", "whether the state really has to
      be".'
    pragmatics: Asking whether the state must be global invites the domain discussion
      that leads to the real fix.
  rephrase:
    prompt: Answer again for state that genuinely cannot be partitioned.
    goal: Test whether you have a second strategy.
  language_focus:
  - precision
  - grammar
  - pragmatics
  feynman:
    concept: Single-process serialisation and partitioned state.
    explain_to: A developer who added a GenServer for every module.
    constraint: Explain using one till in a large supermarket.
    self_check: Did you propose a partition key from the domain?
    reasoning_check: Can you identify the hidden premise behind OTP design, give a
      counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You optimised the handler or described the symptom again.
    expected: Serialisation through one mailbox; partition the state.
    actual: A per-message optimisation, or vague scaling.
    root_cause: GenServers used as modules rather than as concurrency boundaries.
    repair: For every GenServer, ask what it serialises and whether that is intended.
    reasoning_error: If your OTP design answer failed, classify the mistake as a fact,
      assumption, comparison, failure, or certainty error before proposing the smallest
      repair.
  recall:
    active_recall_cue: What does a growing mailbox indicate structurally?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind OTP design without presenting
      an assumption as a fact?
    black_box_probe: When the OTP design answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: elixir-03-genserver-bottleneck-delayed-3
      prompt: >-
        A trace shows the GenServer mailbox is healthy but a slow database call dominates latency,
        while partitioning would duplicate state. Which bottleneck claim changes?
      changed_constraint: >-
        the design must address external-call latency without duplicating state that must remain
        globally consistent
      new_evidence: >-
        queue depth is low while database spans dominate request latency and state cannot be safely
        partitioned
      best_answer: >-
        I would keep the warning about serialized state, but I would retract the claim that sharding
        is the first repair. I would isolate or batch the database work, measure call and queue
        latency separately, and preserve one owner until the consistency boundary is explicit.
      distractors:
      - text: I would preserve every part of the original OTP design answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire OTP design explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: real-world-cases/01-platforms-and-apps/discord-elixir-realtime-scale/README.md
    note: Per-partition process design at scale.
  - repo: original
    path: english-arcade/elixir/genserver-bottleneck
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: >-
      The mailbox is healthy but database time dominates and state cannot be partitioned: revise the bottleneck diagnosis and choose an isolation or batching step?
    goal: >-
      Use queue and handler traces to choose partitioning, batching, or slow-work isolation without breaking consistency.
  critical_thinking:
    problem_frame: >-
      The actor is one GenServer owning writes for a busy feature. The required outcome is bounded tail latency and correct state; the constraints are mailbox serialization, database/external call time, ordering, and partitionability; the unknown is whether the state truly needs one owner.
    claim_map:
      fact: >-
        A growing mailbox shows that this process receives work faster than it completes it, but it does not by itself prove the database or GenServer dispatch is the slowest stage.
      inference: >-
        If state can be partitioned by user or room, separate owners can remove one serialization point; if state must remain global, batching or isolating slow work may be safer than sharding.
      assumption: >-
        I am assuming writes are independent enough to partition and that ordering across partitions is not part of the feature contract.
      unknown: >-
        Queue wait, handler time, database latency, global invariants, and tail-latency target are not provided.
    comparison:
      applicable: true
      alternatives:
      - option: keep one owner and isolate or batch slow work
        benefit: Preserves global ordering and consistency while removing database or external
          wait from the mailbox.
        cost_or_risk: One owner can remain a throughput limit if state truly needs serialized
          writes.
        valid_when: Use it when the trace shows slow handler work but state cannot be partitioned.
      - option: partition ownership by user or room
        benefit: Allows independent keys to progress in separate mailboxes and can reduce
          tail latency.
        cost_or_risk: Adds routing and coordination cost and can break cross-key invariants.
        valid_when: Use it only when the consistency boundary and key distribution support
          independent owners.
      decision_rule: I would measure mailbox wait and handler time first, then shard only
        if the invariant is partitionable; otherwise I would batch or move slow IO without
        creating a second owner.
    failure_probe:
      kind: failure_mode
      prompt: >-
        Which queue and handler trace would show partitioning is unsafe, and what repair would you choose instead?
    evidence_check:
      basis: >-
        Use process queue telemetry and a trace around the GenServer call, database work, and external request, followed by a controlled partition benchmark.
      source_kind: authored_scenario
      limitation: >-
        A mailbox snapshot is not a throughput proof and does not reveal behavior under a different key distribution or consistency policy.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        Serialization is a credible hypothesis from the single owner, but the expensive stage and safe partition key require measurement.
      update_trigger: >-
        I would retract sharding as the first repair if queue wait is low, database time dominates, or a cross-key invariant appears.
    rubric:
      facts_correct: >-
        Interprets mailbox growth as serialized backlog without claiming it identifies the slowest dependency.
      assumptions_explicit: >-
        Names partitionability, ordering, and global-state assumptions.
      alternatives_considered: >-
        Compares sharding with batching or isolating slow work at the actual consistency boundary.
      tradeoff_quality: >-
        Weighs parallelism against duplicated coordination and invariant risk.
      follow_up_adaptation: >-
        Changes the repair when the trace shows database time rather than mailbox serialization dominates.
      certainty_calibration: >-
        Treats serialization as a measured hypothesis, not a complete diagnosis.


- id: elixir-04-supervision-strategy
  version: 1.4.0
  target: elixir
  topic: Supervision
  difficulty: 2
  interview_stage: architecture_review
  prompt: Which supervision strategy would you choose for these workers?
  context: Several independent workers process unrelated queues under one supervisor.
    The interviewer wants the strategy tied to the coupling between children, not
    recited from documentation.
  follow_up:
    prompt: Should a child restart independently, bring siblings down, or stop the
      whole tree after this failure, and why?
    goal: Answer the new_evidence challenge about Supervision while keeping the evidence
      boundary explicit.
    challenge_kind: new_evidence
    best_answer: >-
      I would choose one_for_one when children have independent state, one_for_all when they form
      one consistency unit, and rest_for_one when later children depend on an earlier one. I would
      state the dependency and test a child crash before choosing the restart policy.
    distractors:
    - text: I would keep the Supervision recommendation unchanged because changing
        position would look inconsistent.
      why_wrong: A defensible answer updates when relevant evidence changes an assumption
        or trade-off.
    - text: I would discard every earlier Supervision claim as soon as one new observation
        appeared.
      why_wrong: New evidence may narrow one claim while leaving other verified facts
        intact.
  compression:
    prompt: Choose a supervision strategy by failure relationship, restart scope,
      and the state that must be rebuilt.
    goal: Compress the Supervision answer into its decision, premise, trade-off, and
      verification step.
  best_answer: >-
    I choose one_for_one when workers are independent, so restarting one does not disturb the
    others. I would choose one_for_all only when the children share a consistency boundary and
    one failure leaves the group unsafe until all of them restart.
  distractors:
  - text: I would use one_for_one, since it is the default strategy and it works well
      for most cases where you have workers running under a supervisor in an application.
    trap: precision
    why_wrong: Right answer, no reasoning. The interviewer cannot tell whether you
      would notice a case that needs a different strategy.
  - text: I would use rest_for_one so that if an earlier worker fails the later ones
      are restarted too, which keeps the whole pipeline consistent after any failure
      occurs.
    trap: content
    why_wrong: Applies a dependency-ordered strategy to independent workers, which
      restarts healthy processes for no reason.
  - text: One_for_one, because the workers are independents and restart one should
      not disturb the others that are working normally in that moment.
    trap: grammar
    why_wrong: Pluralised adjective, missing gerund and "in that moment" are all transfer
      errors.
  feedback:
    register: Decisive with the condition for changing your mind.
    hedging: None; supervision strategies map cleanly onto coupling.
    precision: Shared inconsistent state is the criterion for one_for_all.
    grammar: 'Adjectives do not pluralise: "independent"; use "restarting one".'
    pragmatics: Naming the alternative and its trigger shows the choice was reasoned.
  rephrase:
    prompt: Choose a strategy for a pipeline where each stage feeds the next.
    goal: Apply the coupling criterion to an ordered case.
  language_focus:
  - precision
  - grammar
  - pragmatics
  feynman:
    concept: Supervision strategy as a function of child coupling.
    explain_to: A developer choosing strategies from documentation defaults.
    constraint: Explain using independent shops versus a production line.
    self_check: Did you name what would make you change strategy?
    reasoning_check: Can you identify the hidden premise behind Supervision, give
      a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You cited the default, or picked an ordered strategy.
    expected: one_for_one for independence; one_for_all for shared state.
    actual: An appeal to the default, or rest_for_one applied to independent workers.
    root_cause: Strategies memorised as names rather than as coupling decisions.
    repair: Ask what the children share before choosing a strategy.
    reasoning_error: If your Supervision answer failed, classify the mistake as a
      fact, assumption, comparison, failure, or certainty error before proposing the
      smallest repair.
  recall:
    active_recall_cue: What property of the children decides the supervision strategy?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Supervision without presenting
      an assumption as a fact?
    black_box_probe: When the Supervision answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: elixir-04-supervision-strategy-delayed-4
      prompt: >-
        A worker failure leaves a sibling with inconsistent shared state, and a code inspection
        confirms the children are coupled. Which supervision strategy would you reconsider?
      changed_constraint: >-
        the child group must restart as one consistency unit when any member loses shared state
      new_evidence: >-
        a failure trace shows a sibling remains inconsistent after only one child restarts
      best_answer: >-
        I would retract the one_for_one choice for this coupled group and choose one_for_all if the
        shared state cannot be repaired independently. I would verify the restart order and state
        rebuild with a child-failure test, while keeping one_for_one for unrelated workers.
      distractors:
      - text: I would preserve every part of the original Supervision answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Supervision explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/09-backend-principles/cards/error-handling-fault-tolerance.md
    note: Supervision and recovery design.
  - repo: original
    path: english-arcade/elixir/supervision-strategy
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: >-
      A worker failure leaves a sibling inconsistent: map the dependency and choose one_for_one, rest_for_one, or one_for_all from the rebuild evidence?
    goal: >-
      Map child dependencies to one_for_one, rest_for_one, or one_for_all and verify state rebuild after failure.
  critical_thinking:
    problem_frame: >-
      The actors are sibling workers under one supervisor. The required outcome is recovery without leaving coupled state inconsistent; the constraint is dependency and shared-state coupling; the unknown is whether a failed child invalidates siblings or only itself.
    claim_map:
      fact: >-
        one_for_one restarts only the failed child, one_for_all restarts the group, and rest_for_one restarts the failed child and children started after it.
      inference: >-
        Independent queues favor one_for_one, a shared consistency unit may require one_for_all, and a startup dependency chain may require rest_for_one.
      assumption: >-
        I am assuming the supervisor's child order reflects real dependencies and that each restart strategy can rebuild the required state.
      unknown: >-
        The exact shared state, startup order, restart intensity, and failure recovery time are not given.
    comparison:
      applicable: true
      alternatives:
      - option: one_for_one independent restart
        benefit: Limits a restart to an independent failed worker and keeps unrelated queues
          available.
        cost_or_risk: Leaves siblings running if a shared state invariant was invalidated.
        valid_when: Use it when children have independent state and recovery.
      - option: rest_for_one or one_for_all
        benefit: Restarts dependent or coupled children so shared state and startup order
          can be rebuilt together.
        cost_or_risk: It widens the failure blast radius and can reduce availability during
          recovery.
        valid_when: Use rest_for_one for ordered dependencies and one_for_all for an inseparable
          consistency unit.
      decision_rule: I would map the dependency graph, use one_for_one for independent queues,
        rest_for_one for ordered dependencies, and one_for_all for an inseparable state
        group.
    failure_probe:
      kind: edge_case
      prompt: >-
        Which child dependency or shared-state failure would make one-for-one restart unsafe, and how would you verify the replacement?
    evidence_check:
      basis: >-
        Compare the supervision tree's child order and shared state with OTP strategy semantics, then run controlled child-failure tests.
      source_kind: authored_scenario
      limitation: >-
        A single failure test cannot establish restart-intensity behavior or every dependency failure sequence.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        Strategy semantics are clear, but the prompt describes independent queues while withholding the actual coupling and rebuild guarantees.
      update_trigger: >-
        I would update one_for_one when a failure test exposes shared invalid state or an ordered dependency between children.
    rubric:
      facts_correct: >-
        Names the restart scope of one_for_one, one_for_all, and rest_for_one accurately.
      assumptions_explicit: >-
        States the dependency and state-rebuild facts needed to choose a strategy.
      alternatives_considered: >-
        Compares strategies by blast radius and dependency order, not by memorized labels.
      tradeoff_quality: >-
        Connects narrower restarts to availability and wider restarts to consistency recovery.
      follow_up_adaptation: >-
        Revises the independent-worker choice when a failure demonstrates coupling.
      certainty_calibration: >-
        Distinguishes fixed OTP semantics from unknown application topology.


- id: elixir-05-back-pressure
  version: 1.4.0
  target: elixir
  topic: Back-pressure
  difficulty: 3
  interview_stage: deep_dive
  prompt: Producers are outpacing consumers. How do you stop the system falling over?
  context: An ingestion pipeline is accumulating messages faster than it can process
    them. The interviewer wants demand-driven flow control rather than a bigger buffer.
  follow_up:
    prompt: Where would you bound the queue, signal overload, and preserve a useful
      response when producers stay faster than consumers?
    goal: Answer the assumption challenge about Back-pressure while keeping the evidence
      boundary explicit.
    challenge_kind: assumption
    best_answer: >-
      I would put a bounded demand or buffer between producer and consumer, expose lag and
      rejected work, and define whether overflow is shed, retried, or sent to a dead-letter path.
      I would test a sustained producer surplus so the system fails according to that policy.
    distractors:
    - text: I would repeat my original Back-pressure answer with more confidence because
        the interviewer probably assumes the usual case.
      why_wrong: It hides the premise instead of checking whether the usual case is
        actually part of this problem.
    - text: I would stop proposing anything about Back-pressure until every surrounding
        requirement had been documented in full.
      why_wrong: It treats uncertainty as a reason for paralysis and offers no bounded
        next step.
  compression:
    prompt: Describe back-pressure as admission control, bounded work, and the observable
      signal for overload.
    goal: Compress the Back-pressure answer into its decision, premise, trade-off,
      and verification step.
  best_answer: >-
    I make demand flow from the consumer rather than pushing indefinitely from the producer,
    which is the useful GenStage property here. I would bound the buffer, define an overload
    response, and measure lag so a throughput mismatch becomes an explicit policy instead of a
    memory failure.
  distractors:
  - text: I would add more consumer processes to increase throughput, and increase
      the buffer size so that the system can absorb the spikes without dropping any
      of the incoming messages.
    trap: content
    why_wrong: More consumers may help transiently, but an unbounded buffer converts
      overload into an out-of-memory crash.
  - text: I would implement some form of back-pressure so that the producers slow
      down when the consumers cannot keep up with the current rate of incoming messages.
    trap: precision
    why_wrong: Names the concept without the mechanism; "some form of" is where the
      answer should have started.
  - text: Making the demand come from the consumer instead of push from the producer,
      because a buffer only delays the problem and after turns in a failure of memory.
    trap: grammar
    why_wrong: '"Instead of push", "turns in" and "failure of memory" break parallel
      structure and compound nouns.'
  feedback:
    register: Systems-level and specific.
    hedging: None; demand-driven flow is the established answer.
    precision: Say why buffering fails, not just that it does.
    grammar: '"Instead of pushing", "turns into", "memory failure".'
    pragmatics: Explaining the harder-to-diagnose failure mode justifies the design.
  rephrase:
    prompt: Explain what the producer should do when demand stops arriving.
    goal: Follow the mechanism one step further.
  language_focus:
  - precision
  - grammar
  - pragmatics
  feynman:
    concept: Demand-driven flow control versus buffering.
    explain_to: A developer who solves queue growth with a bigger queue.
    constraint: Explain using a checkout that stops letting people queue.
    self_check: Did you say what the failure becomes if you only buffer?
    reasoning_check: Can you identify the hidden premise behind Back-pressure, give
      a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You added buffer or consumers, or named back-pressure vaguely.
    expected: Consumer-driven demand; unbounded buffers become memory failures.
    actual: Capacity increases, or the concept without the mechanism.
    root_cause: Overload framed as insufficient capacity instead of missing flow control.
    repair: Ask who decides when the next message is sent.
    reasoning_error: If your Back-pressure answer failed, classify the mistake as
      a fact, assumption, comparison, failure, or certainty error before proposing
      the smallest repair.
  recall:
    active_recall_cue: What does an unbounded queue convert overload into?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Back-pressure without presenting
      an assumption as a fact?
    black_box_probe: When the Back-pressure answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: elixir-05-back-pressure-delayed-5
      prompt: >-
        GenStage demand keeps the in-memory buffer bounded, but the producer still outruns consumers
        and the dead-letter path is unbounded. Which back-pressure claim is incomplete?
      changed_constraint: >-
        the overload policy must bound both in-memory demand and rejected or dead-letter work
      new_evidence: >-
        a sustained surplus keeps memory bounded but grows the dead-letter path without a retention
        limit
      best_answer: >-
        I would keep consumer-driven demand as the flow-control mechanism, but I would retract the
        idea that it solves overload by itself. I would bound or drain the dead-letter path, define
        shedding or retention, and measure lag plus rejected work before claiming the pipeline is
        safe.
      distractors:
      - text: I would preserve every part of the original Back-pressure answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Back-pressure explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/11-operational-playbooks/playbooks/queue-lag-dlq-and-replay.md
    note: Queue lag and overload handling.
  - repo: original
    path: english-arcade/elixir/back-pressure
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: >-
      GenStage bounds in-memory demand but the dead-letter path grows without limit: define retention, shedding, or retry before claiming overload safety?
    goal: >-
      Bound demand, retry, and dead-letter paths while choosing an overload policy that matches event value and lag.
  critical_thinking:
    problem_frame: >-
      The actors are a producer, a consumer, and any overflow/dead-letter path. The required outcome is bounded memory with an explicit overload response; the constraints are consumer demand, processing rate, retention, and work importance; the unknown is what may be shed or delayed.
    claim_map:
      fact: >-
        Consumer-driven demand can bound in-memory flow, but it does not make a producer surplus disappear and does not automatically bound a dead-letter queue.
      inference: >-
        A safe pipeline needs demand/back-pressure plus a policy for overflow, retry, retention, or shedding, with lag visible to operators.
      assumption: >-
        I am assuming the consumer can signal demand and that the product permits some explicit delayed, rejected, or dead-lettered work.
      unknown: >-
        Buffer size, event priority, retry budget, retention period, and acceptable lag are not specified.
    comparison:
      applicable: true
      alternatives:
      - option: consumer demand with bounded buffers
        benefit: Turns producer surplus into visible lag and a bounded in-memory queue.
        cost_or_risk: Still needs a policy for rejected, retried, or dead-lettered work.
        valid_when: Use it when consumers can signal demand and the system can define overflow
          behavior.
      - option: unbounded queue buffering
        benefit: Absorbs a short burst without immediately rejecting events.
        cost_or_risk: Converts sustained overload into memory exhaustion and hides the recovery
          point.
        valid_when: Use it only for a proven finite burst with an external retention limit,
          never as the steady-state policy.
      decision_rule: I would use consumer-driven demand, bound each buffer, and choose retry,
        dead-letter, or shedding from event value and lag budget; I would alert on rejected
        work.
    failure_probe:
      kind: failure_mode
      prompt: >-
        Which sustained producer surplus would show that a retry or dead-letter path is still unbounded, and what policy would you add?
    evidence_check:
      basis: >-
        Inspect GenStage demand behavior and run a sustained surplus test that records every queue and overflow policy.
      source_kind: authored_scenario
      limitation: >-
        A bounded test does not prove recovery after a long outage or that shedding is acceptable for every event class.
      checked_on: '2026-08-25'
    certainty:
      level: high
      rationale: >-
        Unbounded backlog as an overload risk is clear, while the acceptable overflow action depends on product and retention requirements.
      update_trigger: >-
        I would revise the queue policy if lag or rejected-work telemetry breaches its budget or if a supposedly bounded retry path grows.
    rubric:
      facts_correct: >-
        Separates demand-driven flow control from the unresolved overflow policy.
      assumptions_explicit: >-
        Names event value, retention, retry, and lag assumptions.
      alternatives_considered: >-
        Compares unbounded buffering, shedding, retry, and dead-lettering by their failure cost.
      tradeoff_quality: >-
        Connects memory protection to possible lost or delayed work.
      follow_up_adaptation: >-
        Adds a policy for an unbounded dead-letter path rather than claiming GenStage alone solves overload.
      certainty_calibration: >-
        Keeps the demand mechanism firm and the overflow choice evidence-dependent.


- id: elixir-06-immutability-cost
  version: 1.4.0
  target: elixir
  topic: Immutability
  difficulty: 2
  interview_stage: technical_screen
  prompt: Does immutability make Elixir slower for large data structures?
  context: A performance-flavoured question that rewards nuance. The interviewer wants
    to know whether you understand structural sharing or repeat a general claim in
    either direction.
  follow_up:
    prompt: Which copy or traversal dominates this structure, and what measurement
      would justify accepting it or changing the representation?
    goal: Answer the evidence challenge about Immutability while keeping the evidence
      boundary explicit.
    challenge_kind: evidence
    best_answer: >-
      I would measure the dominant copy or traversal with representative sizes, then compare
      structural sharing with a different representation. If repeated append is the issue, I would
      prepend and reverse; if random access dominates, I would consider a structure suited to that
      access pattern.
    distractors:
    - text: I would cite my experience with Immutability as enough proof and move
        on without naming an observation.
      why_wrong: Experience can guide a hypothesis, but it does not replace evidence
        tied to this context.
    - text: I would collect every possible metric about Immutability before making
        even a provisional recommendation.
      why_wrong: A focused decision can start with one discriminating observation
        rather than an unbounded data request.
  compression:
    prompt: Compare immutable updates by sharing, allocation cost, and the measurement
      that informs the trade-off.
    goal: Compress the Immutability answer into its decision, premise, trade-off,
      and verification step.
  best_answer: >-
    I explain that immutable updates can share structure rather than copy a whole value. I would
    avoid appending repeatedly to a list, because that traverses the list, and I would prepend
    then reverse or choose another representation after measuring the real copy and traversal
    cost.
  distractors:
  - text: Yes, since every update creates a new copy of the data structure, which
      means more allocation and more garbage collection pressure than a mutable language
      would have.
    trap: content
    why_wrong: Wholesale copying is exactly what structural sharing avoids, so the
      premise is wrong.
  - text: No, the BEAM is heavily optimised for this and in practice it is not something
      you need to worry about when writing normal application code.
    trap: precision
    why_wrong: Dismisses a real concern without naming the mechanism or the genuine
      exception.
  - text: Not so much how the people expect, because the updates share the structure
      instead of copy everything, although build a big list with append is really
      slow.
    trap: grammar
    why_wrong: '"How the people expect", "instead of copy" and "build a big list"
      all need different forms.'
  feedback:
    register: Nuanced. Concede the real cost while correcting the assumption.
    hedging: '"Not as much as people expect" is well-calibrated for a nuanced claim.'
    precision: Structural sharing and the append case are both required.
    grammar: '"As people expect", "instead of copying", "building a large list".'
    pragmatics: Offering the workaround turns a correction into useful advice.
  rephrase:
    prompt: Explain the append problem without using the word "immutability".
    goal: Separate the data structure issue from the paradigm.
  language_focus:
  - precision
  - grammar
  - hedging
  feynman:
    concept: Structural sharing and list append costs.
    explain_to: A developer convinced functional means copying.
    constraint: Explain using a shared library catalogue with new entries.
    self_check: Did you name a case where the cost is real?
    reasoning_check: Can you identify the hidden premise behind Immutability, give
      a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You claimed copying, or dismissed the question entirely.
    expected: Structural sharing, plus the genuine append cost and its fix.
    actual: A copying claim, or an unqualified reassurance.
    root_cause: Immutability judged from intuition about memory rather than from the
      implementation.
    repair: Pair every reassurance with the one case that is genuinely slow.
    reasoning_error: If your Immutability answer failed, classify the mistake as a
      fact, assumption, comparison, failure, or certainty error before proposing the
      smallest repair.
  recall:
    active_recall_cue: Which list operation is genuinely expensive, and what replaces
      it?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Immutability without presenting
      an assumption as a fact?
    black_box_probe: When the Immutability answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: elixir-06-immutability-cost-delayed-6
      prompt: >-
        A benchmark on very large lists shows repeated append dominates time and the workload no
        longer fits the original latency bound. Which immutability conclusion would you narrow?
      changed_constraint: >-
        the representation must meet a latency bound for large updates without abandoning immutable
        ownership
      new_evidence: >-
        a large-list benchmark isolates repeated append as the dominant cost
      best_answer: >-
        I would keep structural sharing as the general model, but I would retract any claim that the
        representation is cheap for repeated append. I would prepend and reverse for batch
        construction or measure an alternative persistent structure, then choose from the
        large-input latency evidence.
      distractors:
      - text: I would preserve every part of the original Immutability answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Immutability explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/09-backend-principles/cards/scaling-performance.md
    note: Performance reasoning about data structures.
  - repo: original
    path: english-arcade/elixir/immutability-cost
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: >-
      Large-list append misses the latency target: compare prepend/reverse with a random-access representation using the measured operation mix?
    goal: >-
      Choose list construction or another representation from large-input traversal, allocation, and access evidence.
  critical_thinking:
    problem_frame: >-
      The actor is a data transformation over a large immutable structure. The required outcome is the needed access pattern within the latency budget; the constraints are structural sharing, traversal, allocation, and random access; the unknown is which operation dominates at representative size.
    claim_map:
      fact: >-
        Immutable updates can share structure, while repeatedly appending to a list traverses it; prepending and reversing can make batch construction linear.
      inference: >-
        Immutability is not automatically a whole-value copy, but the chosen representation can still make one access pattern expensive.
      assumption: >-
        I am assuming the workload builds a list in batches and does not require random access on every update.
      unknown: >-
        Input size, append frequency, random-access rate, memory ceiling, and alternative representation are not given.
    comparison:
      applicable: true
      alternatives:
      - option: prepend then reverse for batch list construction
        benefit: Avoids repeated traversal while retaining immutable updates and simple
          semantics.
        cost_or_risk: Requires a final reverse and fits poorly when random access dominates.
        valid_when: Use it for large sequential construction consumed after the batch is
          complete.
      - option: a representation suited to random access
        benefit: Can avoid repeated list traversal when reads or indexed updates dominate.
        cost_or_risk: Adds representation and conversion cost and may change sharing behavior.
        valid_when: Use it when representative large-input traces show random access or
          update latency misses the list budget.
      decision_rule: I would measure representative operations, use prepend/reverse for
        batch list construction, and choose another structure only when random access or
        update cost justifies it.
    failure_probe:
      kind: edge_case
      prompt: >-
        Which large-input operation would show that prepend and reverse or the current representation misses the latency budget?
    evidence_check:
      basis: >-
        Use a representative benchmark and memory profile that isolates list construction from downstream processing.
      source_kind: authored_scenario
      limitation: >-
        A benchmark of one structure does not generalize to every persistent collection or workload distribution.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        Structural sharing and list traversal are known mechanics, but the performance winner depends on the omitted operation mix.
      update_trigger: >-
        I would change the representation when large-input latency or random-access measurements violate the budget.
    rubric:
      facts_correct: >-
        Distinguishes structural sharing from repeated list traversal and names prepend/reverse.
      assumptions_explicit: >-
        States the batch-construction and access-pattern assumptions.
      alternatives_considered: >-
        Compares append, prepend/reverse, and a representation suited to random access.
      tradeoff_quality: >-
        Connects traversal and allocation costs to representation complexity.
      follow_up_adaptation: >-
        Narrows the general immutability claim when the large-list benchmark fails.
      certainty_calibration: >-
        Keeps data-structure mechanics firm and performance preference measured.


- id: elixir-07-ets-vs-genserver
  version: 1.4.0
  target: elixir
  topic: State storage
  difficulty: 3
  interview_stage: architecture_review
  prompt: Would you keep this cache in a GenServer or in ETS?
  context: A read-heavy cache shared across many processes. The interviewer wants
    the concurrency characteristics compared, since this choice decides whether reads
    scale.
  follow_up:
    prompt: Does the cache need serialized ownership or concurrent reads, and how
      will you handle expiry and process loss in either design?
    goal: Answer the alternative challenge about State storage while keeping the evidence
      boundary explicit.
    challenge_kind: alternative
    best_answer: >-
      I would choose ETS for concurrent reads when callers can tolerate its consistency boundary,
      and a GenServer when updates or expiry need one owner. I would test table loss, stale
      entries, and concurrent writes so the cache policy survives process failure.
    distractors:
    - text: I would defend the first State storage option because offering an alternative
        might make the decision look uncertain.
      why_wrong: A comparison makes the decision rule visible; it does not weaken
        a well-calibrated recommendation.
    - text: I would list every conceivable State storage design without saying which
        requirement should decide between them.
      why_wrong: An option list without a decision rule avoids the trade-off the follow-up
        is testing.
  compression:
    prompt: Contrast GenServer and ETS by ownership, access pattern, and recovery
      after the owner or node disappears.
    goal: Compress the State storage answer into its decision, premise, trade-off,
      and verification step.
  best_answer: >-
    I choose ETS when many processes need concurrent reads and the state does not require one
    serialized owner for every access. I would keep table ownership under supervision, define
    expiry and write coordination, and choose a GenServer when the state transitions themselves
    must be serialized.
  distractors:
  - text: A GenServer, because it keeps the state encapsulated and gives you a clear
      API for reading and writing, which is more idiomatic OTP design than exposing
      a table.
    trap: content
    why_wrong: Encapsulation is real, but it serialises every read through one process,
      which defeats the purpose of a read-heavy cache.
  - text: ETS is probably better for performance, though a GenServer is simpler to
      reason about, so it would depend on how much traffic the cache actually receives
      in practice.
    trap: hedging
    why_wrong: The prompt already says read-heavy and shared, so the deciding information
      was supplied.
  - text: ETS, because the readings can happen concurrently from many processes without
      pass for one only mailbox, although I would still own the table of a supervised
      process.
    trap: grammar
    why_wrong: '"Readings" for reads, "without pass for" and "of a supervised process"
      are three distinct errors.'
  feedback:
    register: Decisive, with the ownership caveat that shows OTP maturity.
    hedging: None; the workload was specified.
    precision: Concurrent reads versus a single mailbox is the deciding property.
    grammar: '"Reads", "without going through", "owned by a supervised process".'
    pragmatics: Keeping supervision in the answer pre-empts the lifetime follow-up.
  rephrase:
    prompt: Answer again for a cache with frequent writes and rare reads.
    goal: Check whether the criterion reverses correctly.
  language_focus:
  - precision
  - grammar
  - hedging
  feynman:
    concept: Concurrent table reads versus serialised process calls.
    explain_to: A developer who puts all state in GenServers.
    constraint: Explain using a noticeboard versus a receptionist.
    self_check: Did you keep a supervised owner for the table?
    reasoning_check: Can you identify the hidden premise behind State storage, give
      a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You chose a GenServer, or hedged despite the stated workload.
    expected: ETS for concurrent reads, still owned by a supervised process.
    actual: An encapsulation-driven choice, or an unnecessary hedge.
    root_cause: Design judged by idiom rather than by the concurrency it produces.
    repair: Ask whether reads must be serialised before choosing a home for state.
    reasoning_error: If your State storage answer failed, classify the mistake as
      a fact, assumption, comparison, failure, or certainty error before proposing
      the smallest repair.
  recall:
    active_recall_cue: What does ETS allow that a GenServer cannot?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind State storage without presenting
      an assumption as a fact?
    black_box_probe: When the State storage answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: elixir-07-ets-vs-genserver-delayed-7
      prompt: >-
        The cache now needs serialized writes and expiry ownership, while reads remain concurrent.
        Which State storage choice would you revise?
      changed_constraint: >-
        the design must coordinate writes and expiry without forcing every read through one mailbox
      new_evidence: >-
        a race trace shows concurrent writes and expiry can overwrite fresh entries when no owner
        serializes them
      best_answer: >-
        I would keep ETS for concurrent reads, but I would add an owner or switch the write path to
        a GenServer so expiry and updates are serialized. I would test stale overwrite and table
        loss, then keep the read path concurrent only if the consistency contract permits it.
      distractors:
      - text: I would preserve every part of the original State storage answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire State storage explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/07-componentes-de-sistemas/cards/message-queue.md
    note: Component-level reasoning about queues and shared state.
  - repo: original
    path: english-arcade/elixir/ets-vs-genserver
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: >-
      Reads need concurrency but expiry and writes need one owner: design the ETS/GenServer boundary and test table loss and stale overwrites?
    goal: >-
      Split concurrent cache reads from serialized expiry and writes while testing ownership, staleness, and table loss.
  critical_thinking:
    problem_frame: >-
      The actor is a read-heavy shared cache. The required outcome is fast concurrent reads with controlled staleness and recovery; the constraints are ownership, serialized writes/expiry, table loss, and consistency; the unknown is whether every state transition needs one owner.
    claim_map:
      fact: >-
        ETS allows concurrent table access by many processes, while a GenServer serializes calls through one owner and can make transitions/expiry explicit.
      inference: >-
        ETS fits a cache whose reads can tolerate its consistency boundary, but ownership and supervision still matter; a GenServer fits state transitions that must be serialized.
      assumption: >-
        I am assuming cache misses and stale reads are acceptable within a stated bound and that the owner can rebuild or recreate the ETS table.
      unknown: >-
        Expiry policy, write conflict rate, stale-read tolerance, and recovery source are not supplied.
    comparison:
      applicable: true
      alternatives:
      - option: ETS with supervised ownership
        benefit: Allows concurrent reads while keeping table loss and rebuild under an explicit
          owner.
        cost_or_risk: Needs write/expiry coordination and accepts the cache consistency
          boundary.
        valid_when: Use it when reads dominate and stale values are allowed by policy.
      - option: GenServer-owned state transitions
        benefit: Serializes writes and expiry so update ordering and ownership are explicit.
        cost_or_risk: Serializes hot reads if every read crosses the process mailbox.
        valid_when: Use it for transitions that require one owner, or combine it with ETS
          for a concurrent read path.
      decision_rule: I would use ETS for concurrent reads, add supervised ownership and
        explicit write/expiry coordination, and route serialized transitions through a GenServer
        when the contract requires them.
    failure_probe:
      kind: counterexample
      prompt: >-
        Which concurrent write, stale read, or table-loss trace would require a different ETS and GenServer boundary?
    evidence_check:
      basis: >-
        Trace read concurrency and write/expiry paths, then run table-loss, stale-entry, and concurrent-write tests under the stated cache contract.
      source_kind: authored_scenario
      limitation: >-
        A local ETS test cannot prove distributed cache behavior or the product's tolerance for stale data.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        The access characteristics are clear, but cache consistency and recovery requirements are intentionally incomplete.
      update_trigger: >-
        I would move more work behind a GenServer or revise expiry when tests expose a serialized transition or unacceptable stale read.
    rubric:
      facts_correct: >-
        Distinguishes concurrent ETS reads from serialized GenServer calls and names ownership/recovery.
      assumptions_explicit: >-
        States stale-read, expiry, and table-rebuild assumptions.
      alternatives_considered: >-
        Compares ETS, a GenServer, and a hybrid write/expiry boundary by the actual cache contract.
      tradeoff_quality: >-
        Weighs read scalability against serialized coordination and failure recovery.
      follow_up_adaptation: >-
        Adds an owner or moves transitions when the new requirement demands serialized expiry/writes.
      certainty_calibration: >-
        Separates runtime access facts from omitted product consistency requirements.


- id: elixir-08-distributed-caveat
  version: 1.4.0
  target: elixir
  topic: Distribution
  difficulty: 3
  interview_stage: deep_dive
  prompt: Distributed Erlang makes clustering easy. What is the catch?
  context: The interviewer is inviting an over-enthusiastic answer. They want to hear
    whether you know the operational costs that come with transparent distribution.
  follow_up:
    prompt: Which name-resolution, network-partition, or deployment assumption would
      you test before trusting this cluster?
    goal: Answer the failure challenge about Distribution while keeping the evidence
      boundary explicit.
    challenge_kind: failure
    best_answer: >-
      I would test node naming and authentication, then inject a partition and observe reconnect,
      duplicate work, and stale reads. I would treat a remote call as fallible and set timeouts
      and recovery explicitly rather than trusting local-looking syntax.
    distractors:
    - text: I would describe the Distribution failure as impossible because the happy
        path already passed its test.
      why_wrong: Passing a happy path does not test the boundary, failure mode, or
        recovery being challenged.
    - text: I would add retries to Distribution immediately and assume the system
        would become reliable.
      why_wrong: Retries can amplify load or duplicate effects; the failure and containment
        policy must be specified first.
  compression:
    prompt: State the distribution caveat as a failure assumption, a partition consequence,
      and a safe operational boundary.
    goal: Compress the Distribution answer into its decision, premise, trade-off,
      and verification step.
  best_answer: >-
    I treat distributed Erlang as transparent syntax over a network that can be slow, partition,
    or fail. I would test naming, reconnect, and split-brain behavior, and I would keep the
    trust boundary explicit instead of exposing node distribution across an untrusted network.
  distractors:
  - text: The main catch is that you need to manage node discovery and make sure the
      nodes can find each other reliably, especially in containerised environments
      with dynamic addressing.
    trap: precision
    why_wrong: An operational detail rather than the fundamental issue, and it is
      solved by existing libraries.
  - text: There is not really a catch, it is one of the strongest features of the
      platform and it handles the hard parts of distribution for you automatically.
    trap: content
    why_wrong: Distribution transparency does not remove partitions, latency or the
      trust assumption.
  - text: The transparency hides the network. One call remote seems local but can
      be slow, fail or partition, and the connectivity in full mesh limits the size
      of the cluster.
    trap: grammar
    why_wrong: Post-posed adjectives and "the size of the cluster" invert English
      modifier order throughout.
  feedback:
    register: Balanced. Enthusiasm plus known costs reads as production experience.
    hedging: None; each cost is well established.
    precision: Three named costs beat one operational anecdote.
    grammar: '"A remote call", "full-mesh connectivity", "cluster size".'
    pragmatics: The security note shows you think beyond the happy path.
  rephrase:
    prompt: Say which of those costs you would raise first with an SRE team.
    goal: Prioritise costs for a specific audience.
  language_focus:
  - precision
  - grammar
  - register
  feynman:
    concept: Distribution transparency and its hidden costs.
    explain_to: A developer excited by transparent remote calls.
    constraint: Explain using a phone call that sounds like the next room.
    self_check: Did you name a limit on cluster size?
    reasoning_check: Can you identify the hidden premise behind Distribution, give
      a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You named only discovery, or denied there was a catch.
    expected: Hidden network, mesh limits, trusted-network assumption.
    actual: An operational detail, or uncritical enthusiasm.
    root_cause: Features evaluated from documentation rather than from operating them.
    repair: For any transparency feature, ask what it is hiding.
    reasoning_error: If your Distribution answer failed, classify the mistake as a
      fact, assumption, comparison, failure, or certainty error before proposing the
      smallest repair.
  recall:
    active_recall_cue: What three costs come with transparent distribution?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Distribution without presenting
      an assumption as a fact?
    black_box_probe: When the Distribution answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: elixir-08-distributed-caveat-delayed-8
      prompt: >-
        A partition test shows remote calls time out and two nodes perform duplicate work, while the
        team asks for transparent failover. Which distribution assumption is no longer safe?
      changed_constraint: >-
        the cluster must define timeout, duplicate-work, and partition behavior before promising
        failover
      new_evidence: >-
        a network partition produces timeouts and duplicate work on both sides of the cluster
      best_answer: >-
        I would keep the warning that distribution hides network cost, but I would retract any
        transparent-failover guarantee. I would add idempotency or a single-writer rule, set bounded
        timeouts, and verify the split-brain behavior before choosing a recovery policy.
      distractors:
      - text: I would preserve every part of the original Distribution answer because
          changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Distribution explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/06-foundations-distribuidas/topics/network-partitions.md
    note: Network partition behaviour in distributed systems.
  - repo: original
    path: english-arcade/elixir/distributed-caveat
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: >-
      A partition produces duplicate work and stale reads: replace transparent-failover language with idempotency, ownership, and timeout evidence?
    goal: >-
      Replace local-looking remote-call confidence with partition, timeout, ownership, and duplicate-work evidence.
  critical_thinking:
    problem_frame: >-
      The actors are nodes making remote calls over a network. The required outcome is correct recovery under delay, partition, and duplicate work; the constraints are naming/authentication, timeouts, consistency, and trust; the unknown is which node owns each piece of state.
    claim_map:
      fact: >-
        Distributed Erlang makes remote calls look local in syntax, but the network can delay, partition, or fail and node trust/authentication remains an operational boundary.
      inference: >-
        Transparent syntax cannot provide transparent failover; remote work needs bounded timeouts, idempotency or a single-writer rule, and an explicit stale/duplicate policy.
      assumption: >-
        I am assuming the cluster may reconnect after a partition and that operations can carry an identity for duplicate suppression.
      unknown: >-
        Deployment topology, network trust, split-brain policy, ownership, and tolerated staleness are not described.
    comparison:
      applicable: true
      alternatives:
      - option: transparent remote calls with retries
        benefit: Keeps call sites small and can reuse local-looking APIs.
        cost_or_risk: Hides timeout, partition, stale-read, and duplicate-effect behavior
          behind syntax.
        valid_when: Use it only when remote operations are idempotent and the trust/partition
          policy is explicit.
      - option: explicit API with ownership and idempotency
        benefit: Makes timeout, retry, duplicate suppression, and single-writer boundaries
          visible.
        cost_or_risk: Adds protocol and operational design work at each remote boundary.
        valid_when: Use it when correctness across partitions matters more than local-looking
          syntax.
      decision_rule: I would keep remote calls behind bounded timeouts and explicit idempotency/ownership,
        then choose transparent distribution only where the failure and trust boundaries
        are acceptable.
    failure_probe:
      kind: counterexample
      prompt: >-
        Which partition trace would show that timeout, retry, or ownership still permits duplicate work?
    evidence_check:
      basis: >-
        Run naming/authentication and partition tests on the deployment version, recording remote timeout, reconnect, stale-read, and duplicate-work outcomes.
      source_kind: authored_scenario
      limitation: >-
        A lab partition cannot establish every production network or operator recovery path.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        Network failure and trust costs are inherent, while the safe ownership and recovery policy depend on the missing topology.
      update_trigger: >-
        I would revise the design when a partition test shows duplicate effects, stale state, or a trust boundary the current recovery policy cannot contain.
    rubric:
      facts_correct: >-
        Names network delay/partition/failure and trust as costs hidden by local-looking syntax.
      assumptions_explicit: >-
        States ownership, idempotency, timeout, and split-brain assumptions.
      alternatives_considered: >-
        Compares transparent remote calls with an explicit API/ownership boundary.
      tradeoff_quality: >-
        Connects less syntax to duplicate-work, stale-read, and operational recovery cost.
      follow_up_adaptation: >-
        Removes any failover guarantee after partition evidence and adds an idempotency or single-writer rule.
      certainty_calibration: >-
        Uses medium certainty until the deployment and partition behavior are measured.


- id: elixir-09-pattern-matching
  version: 1.4.0
  target: elixir
  topic: Pattern matching
  difficulty: 1
  interview_stage: technical_screen
  prompt: Why match on the result tuple instead of using a conditional?
  context: A warm-up on idiom. The interviewer wants to hear the failure mode that
    matching prevents, rather than a statement that it is the Elixir way.
  follow_up:
    prompt: Which tuple shapes are part of the function contract, and how does matching
      make the unexpected case visible?
    goal: Answer the new_evidence challenge about Pattern matching while keeping the
      evidence boundary explicit.
    challenge_kind: new_evidence
    best_answer: >-
      I would list the accepted tuples, such as {:ok, value} and {:error, reason}, and make the
      unmatched shape fail at the boundary. I would test a new tuple and an unexpected nil so the
      contract makes the failure visible before downstream code runs.
    distractors:
    - text: I would keep the Pattern matching recommendation unchanged because changing
        position would look inconsistent.
      why_wrong: A defensible answer updates when relevant evidence changes an assumption
        or trade-off.
    - text: I would discard every earlier Pattern matching claim as soon as one new
        observation appeared.
      why_wrong: New evidence may narrow one claim while leaving other verified facts
        intact.
  compression:
    prompt: Explain pattern matching as explicit shapes, normal flow, and a deliberate
      fallback for failures.
    goal: Compress the Pattern matching answer into its decision, premise, trade-off,
      and verification step.
  best_answer: >-
    I prefer matching on the result tuple because an unexpected shape fails at the boundary
    where I can see the actual value. I would define the tuple shapes in the function contract
    and let an unmatched case surface immediately instead of allowing nil to break a later
    operation.
  distractors:
  - text: Because pattern matching is more idiomatic in Elixir and makes the code
      more readable and declarative than using conditionals to inspect the result
      of the call.
    trap: precision
    why_wrong: Style justification only. It never mentions what matching catches that
      a conditional does not.
  - text: Because it is faster than evaluating a conditional, since the runtime can
      optimise the match directly rather than executing a comparison at runtime each
      time.
    trap: content
    why_wrong: Invents a performance rationale; the benefit is failure locality, not
      speed.
  - text: Because a shape not matched fails immediately in the point where it appears,
      instead of follow like nil and break in another place after.
    trap: grammar
    why_wrong: Post-posed participle, "in the point", "instead of follow" and "break
      in another place" are all transfer errors.
  feedback:
    register: Brief and mechanism-focused.
    hedging: None needed for an idiom with a clear rationale.
    precision: Failing at the point of appearance is the benefit; name it.
    grammar: '"An unmatched shape", "at the point where it appears", "instead of flowing".'
    pragmatics: Mentioning the actual value in the error message is a debugging detail
      that lands well.
  rephrase:
    prompt: Describe the bug you get when you use a conditional and ignore the error
      case.
    goal: Make the benefit visible through its absence.
  language_focus:
  - precision
  - grammar
  - register
  feynman:
    concept: Failure locality through pattern matching.
    explain_to: A developer who checks return values with if statements.
    constraint: Explain using a parcel rejected at the door versus stored.
    self_check: Did you say where the failure surfaces?
    reasoning_check: Can you identify the hidden premise behind Pattern matching,
      give a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You justified by idiom or invented a speed benefit.
    expected: Immediate loud failure at the point of the unexpected shape.
    actual: A readability claim, or a performance rationale.
    root_cause: Idiom absorbed from surrounding code without its debugging payoff.
    repair: Explain matching by describing the nil bug it prevents.
    reasoning_error: If your Pattern matching answer failed, classify the mistake
      as a fact, assumption, comparison, failure, or certainty error before proposing
      the smallest repair.
  recall:
    active_recall_cue: Where does a failure surface with matching versus with a conditional?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Pattern matching without
      presenting an assumption as a fact?
    black_box_probe: When the Pattern matching answer failed, did you locate the reasoning
      error before changing the implementation?
    delayed_variant:
      id: elixir-09-pattern-matching-delayed-9
      prompt: >-
        A dependency adds a new result tuple and a caller now receives {:error, reason, metadata}.
        Which pattern-matching contract must you update?
      changed_constraint: >-
        the function boundary must handle the expanded error shape without hiding unexpected tuples
      new_evidence: >-
        an integration trace contains a three-element error tuple not covered by the original
        clauses
      best_answer: >-
        I would keep matching at the boundary, but I would retract the claim that the old
        two-element shape is exhaustive. I would add an explicit clause for the new tuple, test the
        original and expanded shapes, and leave an unmatched clause visible for future contract
        drift.
      distractors:
      - text: I would preserve every part of the original Pattern matching answer
          because changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Pattern matching explanation with a new design
          without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/09-backend-principles/cards/validation-transformation.md
    note: Validation and transformation boundaries.
  - repo: original
    path: english-arcade/elixir/pattern-matching
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: >-
      A dependency adds a three-element error tuple: update the boundary clauses and test the original, expanded, and unsupported shapes?
    goal: >-
      Update the tuple contract visibly when a dependency adds metadata or an unsupported result shape.
  critical_thinking:
    problem_frame: >-
      The actor is a function boundary returning result tuples. The required outcome is a visible, maintainable contract for success and failure shapes; the constraints are dependency evolution and downstream handling; the unknown is whether new tuple shapes are expected.
    claim_map:
      fact: >-
        Pattern matching can accept {:ok, value} and {:error, reason} clauses and make an unexpected shape fail at the boundary; a conditional can otherwise let an unhandled value reach later code.
      inference: >-
        Matching is valuable when the tuple shapes are the function contract, because a new shape forces a visible clause or failure near its source.
      assumption: >-
        I am assuming the dependency's tuple contract is owned and can be updated when metadata or a new error shape is introduced.
      unknown: >-
        The complete dependency result vocabulary, fallback policy, and compatibility window are not shown.
    comparison:
      applicable: true
      alternatives:
      - option: explicit pattern clauses
        benefit: Surfaces an unsupported tuple at the boundary where the result contract
          is defined.
        cost_or_risk: Requires a code change when a dependency adds an approved shape.
        valid_when: Use it when tuple shapes are part of a stable function contract.
      - option: conditional inspection
        benefit: Can handle a family of values without enumerating every shape immediately.
        cost_or_risk: May let an unknown value become nil or malformed state before failing
          downstream.
        valid_when: Use it only when the dependency vocabulary is intentionally open and
          the fallback is safe and observable.
      decision_rule: I would match the documented tuples, add an explicit clause for any
        approved new shape, and leave the unmatched case visible rather than silently treating
        it as success.
    failure_probe:
      kind: edge_case
      prompt: >-
        Which new tuple or malformed value would expose an incomplete pattern contract, and where should it fail?
    evidence_check:
      basis: >-
        Inspect dependency documentation and contract tests, then run the original, new, and malformed tuple cases.
      source_kind: authored_scenario
      limitation: >-
        A local tuple test cannot guarantee a dependency will not add another shape outside the tested version.
      checked_on: '2026-08-25'
    certainty:
      level: high
      rationale: >-
        Making accepted tuple shapes explicit is a strong boundary rule, while the complete future vocabulary is unknown.
      update_trigger: >-
        I would update the clauses when the dependency documents a new tuple or a test captures an unexpected value.
    rubric:
      facts_correct: >-
        Names tuple clauses and the boundary failure without reducing pattern matching to an Elixir slogan.
      assumptions_explicit: >-
        States the dependency shape and ownership assumptions.
      alternatives_considered: >-
        Compares matching with a conditional by where unsupported shapes fail and how contracts evolve.
      tradeoff_quality: >-
        Weighs early visible failures against the maintenance cost of explicit clauses.
      follow_up_adaptation: >-
        Adds a clause for approved metadata while retaining a visible boundary for unknown tuples.
      certainty_calibration: >-
        Keeps the failure-boundary principle firm and the future tuple vocabulary open.


- id: elixir-10-choosing-elixir
  version: 1.4.0
  target: elixir
  topic: Technology choice
  difficulty: 2
  interview_stage: behavioural_probe
  prompt: Tell me about a time you argued for or against using Elixir.
  context: A judgement probe. The interviewer wants evidence that you can separate
    genuine fit from enthusiasm, and the strongest answers often describe arguing
    against your preferred tool.
  follow_up:
    prompt: What runtime or team constraint made Elixir a good or poor fit, and which
      evidence would you use to revisit that decision?
    goal: Answer the assumption challenge about Technology choice while keeping the
      evidence boundary explicit.
    challenge_kind: assumption
    best_answer: >-
      I would name the workload, operational requirement, and team capability that made Elixir a
      fit or a poor fit. I would compare those facts with the existing stack, then revisit the
      choice only when concurrency, fault tolerance, or deployment evidence changes the trade-off.
    distractors:
    - text: I would repeat my original Technology choice answer with more confidence
        because the interviewer probably assumes the usual case.
      why_wrong: It hides the premise instead of checking whether the usual case is
        actually part of this problem.
    - text: I would stop proposing anything about Technology choice until every surrounding
        requirement had been documented in full.
      why_wrong: It treats uncertainty as a reason for paralysis and offers no bounded
        next step.
  compression:
    prompt: Tell the technology-choice story as constraint, observed consequence,
      and the condition that would change your recommendation.
    goal: Compress the Technology choice answer into its decision, premise, trade-off,
      and verification step.
  best_answer: I argued against it once. The team wanted Elixir for a CRUD admin panel
    with three users, where the concurrency story was irrelevant and nobody else could
    maintain it. We used the existing stack, and I kept the case for Elixir until
    we had a workload that actually needed the runtime.
  distractors:
  - text: I argued for it on a project that needed to handle a lot of concurrent connections,
      and it worked out very well because the runtime is designed exactly for that
      kind of workload.
    trap: precision
    why_wrong: Generic and unfalsifiable. No numbers, no alternative considered, no
      cost acknowledged.
  - text: I would argue for Elixir whenever the system has realtime requirements,
      since the BEAM handles that much better than most alternatives and the fault
      tolerance is excellent.
    trap: grammar
    why_wrong: Answers a past-experience question in the conditional, which does not
      satisfy a behavioural probe.
  - text: I argued for it because it is a better language than what we were using,
      and eventually the team came around once they saw how much cleaner the code
      was.
    trap: register
    why_wrong: Frames a technology decision as a superiority contest, which reads
      as difficult to work with.
  feedback:
    register: Measured. Arguing against your favourite tool is the strongest possible
      signal.
    hedging: None; this is a past decision with an outcome.
    precision: Name the workload and why the runtime was irrelevant to it.
    grammar: 'Past simple throughout: "I argued", "we used", "I kept".'
    pragmatics: Keeping the case alive for later shows judgement without abandoning
      conviction.
  rephrase:
    prompt: Tell the same story emphasising what you would have lost by choosing Elixir.
    goal: Practise arguing the cost side explicitly.
  language_focus:
  - grammar
  - register
  - precision
  pt_help: '"Tell me about a time" pede passado. Condicional soa como opiniao, nao
    como experiencia.'
  feynman:
    concept: Fit-based technology choice over preference.
    explain_to: An engineer who wants to use a new language at work.
    constraint: Explain without claiming any language is better.
    self_check: Did your story include a cost you accepted?
    reasoning_check: Can you identify the hidden premise behind Technology choice,
      give a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You answered hypothetically or argued language superiority.
    expected: A past decision with workload, cost and outcome named.
    actual: Conditional advocacy, or a better-language framing.
    root_cause: Technology stories told as preferences rather than as trade-offs.
    repair: Prepare one story where you argued against your preferred tool.
    reasoning_error: If your Technology choice answer failed, classify the mistake
      as a fact, assumption, comparison, failure, or certainty error before proposing
      the smallest repair.
  recall:
    active_recall_cue: What makes a technology-choice story credible to an interviewer?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Technology choice without
      presenting an assumption as a fact?
    black_box_probe: When the Technology choice answer failed, did you locate the
      reasoning error before changing the implementation?
    delayed_variant:
      id: elixir-10-choosing-elixir-delayed-10
      prompt: >-
        The workload now requires high concurrency and supervised recovery, but the team still lacks
        OTP experience. Which part of your technology decision changes?
      changed_constraint: >-
        the choice must weigh runtime fit against the team learning and operational cost for this
        workload
      new_evidence: >-
        load and failure tests reveal concurrency and recovery needs that the existing CRUD
        comparison did not cover
      best_answer: >-
        I would keep the team-maintainability cost explicit, but I would retract the earlier
        conclusion that the existing stack automatically wins. I would compare the measured
        concurrency and recovery needs with a staffed onboarding plan, then choose Elixir only if
        the runtime benefit justifies that operational investment.
      distractors:
      - text: I would preserve every part of the original Technology choice answer
          because changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Technology choice explanation with a new
          design without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/12-engineering-practice/cards/architecture-decision-records.md
    note: Decision records and trade-off documentation.
  - repo: original
    path: english-arcade/elixir/choosing-elixir
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: >-
      The workload now needs supervised high concurrency but the team lacks OTP experience: compare runtime evidence with a staffed onboarding and operations plan?
    goal: >-
      Balance measured concurrency and recovery needs against team capability, onboarding, and operations cost.
  critical_thinking:
    problem_frame: >-
      The actors are the product workload, operators, and team maintaining it. The required outcome is a sustainable system fit; the constraints are concurrency/fault-tolerance need, team capability, deployment, and existing-stack cost; the unknown is whether the stated workload will grow.
    claim_map:
      fact: >-
        The question asks for my technology-choice experience but supplies no workload or team facts. The three-user admin panel is an authored example; I would use my own verified workload and team evidence before presenting it as my story.
      inference: >-
        Elixir becomes more plausible when supervised recovery or high concurrency is a measured requirement, but runtime fit alone does not erase onboarding and operational cost.
      assumption: >-
        For the authored comparison, I am assuming a small CRUD workload and limited OTP experience; I would verify whether those constraints apply to my actual example and whether staffing could change.
      unknown: >-
        Future traffic, failure requirements, hiring/training capacity, and deployment maturity are not given.
    comparison:
      applicable: true
      alternatives:
      - option: existing stack for a small CRUD panel
        benefit: Uses the team-maintained skills and avoids runtime complexity the three-user
          workload does not need.
        cost_or_risk: May become a poor fit if concurrency or supervised recovery requirements
          grow.
        valid_when: Use it while measured workload and failure needs remain modest.
      - option: Elixir with an OTP onboarding plan
        benefit: Can provide supervised recovery and concurrency when those are measured
          requirements.
        cost_or_risk: Costs training, staffing, deployment, and operational maturity.
        valid_when: Use it when runtime evidence justifies the investment and a team can
          operate it.
      decision_rule: I would keep the existing stack for the small CRUD panel, revisit Elixir
        when measured runtime needs exceed it, and include a staffed onboarding/operations
        plan in that comparison.
    failure_probe:
      kind: counterexample
      prompt: >-
        Which workload or team evidence would show that the existing stack or Elixir choice no longer fits?
    evidence_check:
      basis: >-
        Use workload measurements, incident/recovery requirements, deployment evidence, and a concrete team capability plan rather than language preference.
      source_kind: authored_scenario
      limitation: >-
        The exercise provides no production benchmark or staffing plan, so it cannot prove a universal language choice.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        The existing-stack recommendation fits the authored small-panel example, but the prompt does not establish that workload or team capability for my experience; I need that evidence before transferring the recommendation.
      update_trigger: >-
        I would revisit the decision when measured concurrency/recovery needs or a credible team plan changes the balance.
    rubric:
      facts_correct: >-
        Uses the three-user CRUD workload and team maintainability as concrete evidence rather than claiming Elixir is generally bad.
      assumptions_explicit: >-
        Names future load, staffing, and deployment assumptions.
      alternatives_considered: >-
        Compares the existing stack and Elixir by workload need and operational capability.
      tradeoff_quality: >-
        Weighs runtime benefits against onboarding and maintenance cost.
      follow_up_adaptation: >-
        Reopens the choice when high concurrency and supervised recovery become requirements.
      certainty_calibration: >-
        States a scoped current decision, not a universal language verdict.


- id: elixir-11-liveview-tradeoff
  version: 1.4.0
  target: elixir
  topic: LiveView trade-offs
  difficulty: 2
  interview_stage: architecture_review
  prompt: What would make you avoid LiveView for a feature?
  context: An architecture conversation. The interviewer wants to know whether you
    can name the constraints of a tool you like, particularly the stateful connection
    cost.
  follow_up:
    prompt: Which client or rendering requirement would make a separate frontend safer
      than a LiveView process, and what latency trade-off follows?
    goal: Answer the evidence challenge about LiveView trade-offs while keeping the
      evidence boundary explicit.
    challenge_kind: evidence
    best_answer: >-
      I would ask whether the feature must work offline, how many stateful sessions it must hold,
      and how often the page updates. I would choose a separate frontend when those constraints
      make a persistent server process costly, then compare latency and client complexity
      explicitly.
    distractors:
    - text: I would cite my experience with LiveView trade-offs as enough proof and
        move on without naming an observation.
      why_wrong: Experience can guide a hypothesis, but it does not replace evidence
        tied to this context.
    - text: I would collect every possible metric about LiveView trade-offs before
        making even a provisional recommendation.
      why_wrong: A focused decision can start with one discriminating observation
        rather than an unbounded data request.
  compression:
    prompt: Compare LiveView with a client-rendered approach by interaction model,
      operational cost, and an explicit trade-off.
    goal: Compress the LiveView trade-offs answer into its decision, premise, trade-off,
      and verification step.
  best_answer: >-
    I would avoid LiveView when offline behavior or a flaky network is a core requirement,
    because each client depends on a stateful server connection and process. I would also
    compare session memory and update frequency for a mostly static page before accepting its
    extra machinery.
  distractors:
  - text: If the team is not familiar with Elixir, since the learning curve could
      slow down delivery and it would be harder to find people to maintain it later
      on.
    trap: precision
    why_wrong: A staffing consideration rather than a technical constraint, and it
      would apply to any Elixir feature equally.
  - text: I would not avoid it, LiveView handles almost every case well and reduces
      the need for a separate frontend stack, which simplifies the whole architecture
      significantly.
    trap: content
    why_wrong: Ignores the stateful-connection requirement, which genuinely rules
      out some use cases.
  - text: Use offline or with network flaky, mainly. Each client maintains one connection
      with state and one process in the server, then a bad connection degrades direct
      the experience.
    trap: grammar
    why_wrong: Missing subject, post-posed adjectives and "degrades direct" break
      the sentence throughout.
  feedback:
    register: Balanced criticism of a tool you presumably like.
    hedging: '"Mainly" appropriately signals these are the primary cases.'
    precision: Per-client server process is the cost most candidates omit.
    grammar: '"A flaky network", "on the server", "degrades the experience directly".'
    pragmatics: Adding the over-engineering case shows proportion, not just limits.
  rephrase:
    prompt: Describe a feature in the same product where LiveView is clearly right.
    goal: Balance the critique with a positive case.
  language_focus:
  - precision
  - grammar
  - hedging
  feynman:
    concept: Stateful connections and per-client server cost.
    explain_to: A developer choosing LiveView for everything.
    constraint: Explain using a phone line held open per customer.
    self_check: Did you name what an idle session still costs?
    reasoning_check: Can you identify the hidden premise behind LiveView trade-offs,
      give a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You named staffing, or claimed there are no limits.
    expected: Offline and flaky networks, plus per-client process cost.
    actual: A team-skills answer, or uncritical endorsement.
    root_cause: Tool limits unexamined because the tool has worked so far.
    repair: For any framework you like, name the workload it should not serve.
    reasoning_error: If your LiveView trade-offs answer failed, classify the mistake
      as a fact, assumption, comparison, failure, or certainty error before proposing
      the smallest repair.
  recall:
    active_recall_cue: What does each LiveView client cost on the server while idle?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind LiveView trade-offs without
      presenting an assumption as a fact?
    black_box_probe: When the LiveView trade-offs answer failed, did you locate the
      reasoning error before changing the implementation?
    delayed_variant:
      id: elixir-11-liveview-tradeoff-delayed-11
      prompt: >-
        A session test shows many concurrent LiveView processes exceed the memory budget, and
        product now requires offline editing. Which LiveView assumption is no longer safe?
      changed_constraint: >-
        the feature must support offline editing and stay within a bounded per-session memory budget
      new_evidence: >-
        a session profile exceeds the memory budget and the product requirement now includes offline
        editing
      best_answer: >-
        I would keep LiveView for stateful online interactions, but I would retract it as the
        default for this feature. I would compare a separate client with an explicit sync contract,
        measure session memory, and preserve only the server-rendered parts that still fit the
        requirement.
      distractors:
      - text: I would preserve every part of the original LiveView trade-offs answer
          because changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire LiveView trade-offs explanation with a new
          design without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/09-backend-principles/cards/realtime-backend-systems.md
    note: Realtime backend design considerations.
  - repo: original
    path: english-arcade/elixir/liveview-tradeoff
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: >-
      Concurrent sessions exceed memory and offline editing is required: compare a sync-aware client with LiveView using the actual session and reconnect tests?
    goal: >-
      Choose LiveView or a separate client from offline/reconnect behavior, session memory, and update frequency.
  critical_thinking:
    problem_frame: >-
      The actors are the LiveView client connection, server process, and product user. The required outcome is a usable feature under its network and session constraints; the constraints are offline behavior, flaky networks, session memory, update frequency, and client complexity; the unknown is the session scale and sync contract.
    claim_map:
      fact: >-
        A LiveView feature relies on a stateful server connection/process for interactive updates, so offline-first behavior and a large idle-session population can change its fit.
      inference: >-
        A separate client with an explicit sync contract may be safer when offline editing or connection loss is central, while LiveView can reduce client code for online stateful interactions.
      assumption: >-
        I am assuming the feature cannot tolerate losing server connectivity during its core interaction and that session memory is a real capacity constraint.
      unknown: >-
        Concurrent sessions, update rate, reconnect behavior, offline conflict policy, and client complexity are not specified.
    comparison:
      applicable: true
      alternatives:
      - option: LiveView server state
        benefit: Keeps online stateful interactions close to server-rendered behavior and
          reduces client synchronization code.
        cost_or_risk: Consumes server connection/process memory and depends on connectivity.
        valid_when: Use it when the feature is online-first and the session/update budget
          is safe.
      - option: separate client with an explicit sync contract
        benefit: Supports offline editing and can keep interaction state local to the device.
        cost_or_risk: Adds client code, synchronization, and conflict-resolution work.
        valid_when: Use it when offline/reconnect behavior is core or LiveView session memory
          exceeds the budget.
      decision_rule: I would use LiveView for online stateful interactions that fit the
        session budget, and choose a separate client when offline editing or connection
        failure is a core requirement with a defined sync plan.
    failure_probe:
      kind: failure_mode
      prompt: >-
        Which session, reconnect, or offline-edit trace would show that the LiveView choice violates the feature contract?
    evidence_check:
      basis: >-
        Use Phoenix LiveView connection semantics plus session-memory and offline/reconnect tests for the actual update frequency and user flow.
      source_kind: authored_scenario
      limitation: >-
        A session test cannot determine product acceptance of conflict resolution or every browser/network failure mode.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        Stateful connection cost is a relevant constraint, but session scale and offline semantics are absent.
      update_trigger: >-
        I would revise the architecture when measured session memory, reconnect behavior, or offline conflict tests breach the feature contract.
    rubric:
      facts_correct: >-
        Names the stateful server connection/process and avoids claiming LiveView is unsuitable for every feature.
      assumptions_explicit: >-
        States offline, session-scale, update-frequency, and conflict assumptions.
      alternatives_considered: >-
        Compares LiveView with a separate client on offline capability, sync complexity, and session cost.
      tradeoff_quality: >-
        Connects less client code to persistent server memory and reconnect obligations.
      follow_up_adaptation: >-
        Chooses a sync-aware client when memory and offline evidence invalidate the default.
      certainty_calibration: >-
        Keeps the constraint concrete while leaving the architecture conditional on measurements.


- id: elixir-12-onboarding-others
  version: 1.4.0
  target: elixir
  topic: Mentoring and public-boundary testing
  difficulty: 2
  interview_stage: behavioural_probe
  prompt: How do you help an object-oriented developer become productive in Elixir
    while teaching them to test a supervised process?
  context: A mentoring probe. The interviewer wants a specific first obstacle and
    a concrete intervention, including how the learner can test behaviour at a public
    boundary instead of inspecting mutable state.
  follow_up:
    prompt: How would you teach the process boundary without hiding supervision, and
      which public behavior would your first test lock down?
    goal: Answer the alternative challenge about Mentoring and public-boundary testing
      while keeping the evidence boundary explicit.
    challenge_kind: alternative
    best_answer: >-
      I would teach the process boundary with a small public function and let the supervisor own
      setup and restart. My first ExUnit test would assert the public behavior, then I would add a
      child-failure test so supervision is part of the design rather than an unexplained syntax
      rule.
    distractors:
    - text: I would defend the first Mentoring and public-boundary testing option
        because offering an alternative might make the decision look uncertain.
      why_wrong: A comparison makes the decision rule visible; it does not weaken
        a well-calibrated recommendation.
    - text: I would list every conceivable Mentoring and public-boundary testing design
        without saying which requirement should decide between them.
      why_wrong: An option list without a decision rule avoids the trade-off the follow-up
        is testing.
  compression:
    prompt: Outline the onboarding lesson as mental model, supervised example, and
      one behavior-focused test.
    goal: Compress the Mentoring and public-boundary testing answer into its decision,
      premise, trade-off, and verification step.
  best_answer: I start with the habit of looking for mutable state, then pair on a
    small supervised process with a public function. We write an ExUnit test that
    calls that boundary, asserts the returned behaviour, and lets the supervisor own
    process setup; once data flow and observable behaviour click, the syntax stops
    feeling strange.
  distractors:
  - text: I would be patient and give them time to learn, share good resources like
      books and documentation, and answer their questions as they come up during the
      first few weeks. Once they are comfortable, I would ask them to inspect the
      GenServer state directly in a test, because that is the clearest way to see
      whether the process changed correctly.
    trap: precision
    why_wrong: Describes a general attitude rather than a diagnosis of what actually
      blocks OO developers.
  - text: I would start by explaining the theory behind functional programming and
      immutability so they understand the foundations before they start writing any
      production code.
    trap: content
    why_wrong: Front-loads theory, which is the slowest path; the obstacle is a habit,
      not a knowledge gap.
  - text: I focus in the habit that blocks all the rest, that is to search a place
      for keep the state mutable, and after I make pair in a small feature with them.
    trap: grammar
    why_wrong: '"Focus in", "for keep", "state mutable" and "make pair in" are four
      separate transfer errors.'
  feedback:
    register: Teach through a supervised process and its public boundary, not abstract
      theory.
    hedging: Use “I would pair” for the exercise while stating ExUnit’s boundary directly.
    precision: Name mutable state, the public function, ExUnit, returned behaviour,
      and supervisor setup.
    grammar: Use “test through the public function” and “let the supervisor own setup”.
    pragmatics: Make the learner verify observable behaviour rather than inspect process
      state.
  rephrase:
    prompt: Describe the first ExUnit test you would pair on for a supervised process.
    goal: Turn mentoring into a public-boundary exercise with observable assertions.
  language_focus:
  - precision
  - grammar
  - pragmatics
  pt_help: '"Focar em" e "focus on". E adjetivo vem antes: "mutable state".'
  feynman:
    concept: Teaching a supervised Elixir process through ExUnit at its public boundary.
    explain_to: An OO developer who wants to inspect GenServer state.
    constraint: Include a public function, returned behaviour, and supervisor-owned
      setup.
    self_check: Could the test survive an internal state representation change?
    reasoning_check: Can you identify the hidden premise behind Mentoring and public-boundary
      testing, give a counterexample, and explain how the evidence changes your conclusion?
  black_box:
    symptom: You inspected GenServer state or offered theory before a public-boundary
      exercise.
    expected: An ExUnit test calls a public function, asserts observable behaviour,
      and lets the supervisor own process setup.
    actual: The test reached into process state, or mentoring stayed at generic resources
      and theory.
    root_cause: The OO mental model was not replaced with a concrete public API and
      observable-behaviour loop.
    repair: 'Pair on one supervised process: start it under the supervisor, call its
      public function in ExUnit, and assert the returned behaviour.'
    reasoning_error: If your Mentoring and public-boundary testing answer failed,
      classify the mistake as a fact, assumption, comparison, failure, or certainty
      error before proposing the smallest repair.
  recall:
    active_recall_cue: How do ExUnit, a public function, and supervisor-owned setup
      keep a process test behaviour-focused?
    leitner_start_box: 1
    mastery_threshold: 8
    feynman_prompt: Can you explain the reasoning behind Mentoring and public-boundary
      testing without presenting an assumption as a fact?
    black_box_probe: When the Mentoring and public-boundary testing answer failed,
      did you locate the reasoning error before changing the implementation?
    delayed_variant:
      id: elixir-12-onboarding-others-delayed-12
      prompt: >-
        A learner can call the public function but cannot explain what happens when the child
        crashes, and the first test misses restart behavior. Which teaching assumption changes?
      changed_constraint: >-
        the onboarding path must make supervision observable through a public behavior and a
        child-failure test
      new_evidence: >-
        the learner test passes the happy path but does not observe a child restart or rebuilt state
      best_answer: >-
        I would keep the public boundary as the teaching entry point, but I would retract the
        assumption that a happy-path test explains supervision. I would add a controlled child
        failure, assert the public behavior after restart, and teach the state rebuild from that
        observable trace.
      distractors:
      - text: I would preserve every part of the original Mentoring and public-boundary
          testing answer because changing it after review would be inconsistent.
        why_wrong: It ignores the new evidence and confuses consistency with calibrated
          reasoning.
      - text: I would replace the entire Mentoring and public-boundary testing explanation
          with a new design without identifying what the evidence actually changed.
        why_wrong: It throws away supported claims and gives no traceable update to
          the decision.
  sources:
  - repo: system-design-estudos
    path: areas/10-engineering-case-studies/cards/platform-engineering-developer-experience.md
    note: Developer experience and onboarding practice.
  - repo: original
    path: english-arcade/elixir/onboarding-others
    note: Original interview phrasing authored for this pack.
  extension:
    prompt: >-
      A learner can test the happy path but cannot predict post-restart behavior: add a controlled child failure and teach the public state-rebuild contract?
    goal: >-
      Teach process ownership through a public function and a controlled child-failure test that shows state rebuild.
  critical_thinking:
    problem_frame: >-
      The actor is an object-oriented developer learning a supervised process. The required outcome is observable behavior at a public boundary plus a usable restart mental model; the constraints are unfamiliar data flow, supervisor-owned setup, and test isolation; the unknown is which mutable-state assumption blocks the learner.
    claim_map:
      fact: >-
        A public function can exercise the process without exposing mutable state, and an ExUnit child-failure test can make supervision behavior observable.
      inference: >-
        A small boundary-first example lets the learner connect input, message, reply, and restart before adding OTP vocabulary or internal inspection.
      assumption: >-
        I am assuming the learner can run a focused test and that the example has a deterministic state rebuild after a child crash.
      unknown: >-
        The learner's prior concurrency model, the process state, and the meaningful post-restart behavior are not described.
    comparison:
      applicable: true
      alternatives:
      - option: public-boundary-first teaching
        benefit: Lets the learner observe input, reply, and restart without coupling the
          test to process internals.
        cost_or_risk: Needs a small supervised example and a meaningful rebuild behavior.
        valid_when: Use it when the learner needs a concrete bridge from objects to message-driven
          behavior.
      - option: syntax or internal-state-first teaching
        benefit: Can answer vocabulary questions quickly for an experienced OTP learner.
        cost_or_risk: Encourages inspection-based tests and can hide supervision ownership
          from a newcomer.
        valid_when: Use it only after the public behavior and failure boundary are already
          understood.
      decision_rule: I would start with one public function and a supervised child, then
        add a controlled failure test; I would add internal detail only when it explains
        an observed boundary behavior.
    failure_probe:
      kind: counterexample
      prompt: >-
        Which controlled child failure would show that the learner cannot explain state rebuild, and what public behavior would you assert?
    evidence_check:
      basis: >-
        Review the public function, supervisor tree, and ExUnit failure/restart trace with the learner, checking returned behavior rather than process internals.
      source_kind: authored_scenario
      limitation: >-
        One tutorial process cannot prove transfer to a learner's production supervision tree or all prior object-oriented assumptions.
      checked_on: '2026-08-25'
    certainty:
      level: medium
      rationale: >-
        Boundary-first testing is a strong teaching path, but the learner's obstacle and meaningful restart behavior are not specified.
      update_trigger: >-
        I would change the intervention when the learner can assert the happy path but still cannot predict post-restart behavior or explain ownership.
    rubric:
      facts_correct: >-
        Describes public-boundary testing and supervisor-owned setup without inspecting mutable process state as the goal.
      assumptions_explicit: >-
        Names learner, deterministic rebuild, and state assumptions.
      alternatives_considered: >-
        Compares boundary-first teaching with syntax/internal-state-first teaching by what behavior the learner can verify.
      tradeoff_quality: >-
        Connects a small example to the cost of hiding supervision or teaching memorized internals.
      follow_up_adaptation: >-
        Adds a controlled child failure when the happy-path test misses restart behavior.
      certainty_calibration: >-
        Keeps the teaching sequence provisional until the learner's observable trace shows understanding.
